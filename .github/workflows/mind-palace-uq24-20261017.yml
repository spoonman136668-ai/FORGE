name: Mind-Palace UQ24 browser-only intake fast path qualification
on:
  push:
    branches: [diagnostics/mind-palace-private-bridge-20261013]
    paths:
      - '.github/mind-palace-catchup/UQ24-ONE-COMMAND-20261017.txt'
permissions:
  contents: read
concurrency:
  group: mind-palace-uq24
  cancel-in-progress: false
jobs:
  validate:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Verify browser chat intake no-write qualified shortcut
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: 'Never'
          GH_PROMPT_DISABLED: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') {
            throw 'UQ24_ISOLATED_RUNNER_MISMATCH'
          }
          Remove-Item Env:GH_TOKEN,Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $remote='https://github.com/spoonman136668-ai/Mind-Palace.git'
          $head='50db0ee38e1fd60f80a05b431f1bbeefdcc353ba'
          $main='67e95b9a0468dec12061c54e40d001a78a137cf6'
          $branch='engineering/browser-chat-one-command-preflight-uq24-20261017'
          $root=Join-Path $env:RUNNER_TEMP ('mind-palace-uq24-'+$env:GITHUB_RUN_ID)
          function Pin([string]$ref,[string]$sha) {
            $result=@(& git.exe ls-remote --exit-code $remote $ref)
            if($LASTEXITCODE -ne 0 -or $result.Count -ne 1 -or ([string]$result[0] -split '\s+')[0] -cne $sha) {
              throw ('UQ24_REMOTE_REF_DRIFT_'+$ref)
            }
          }
          if(Test-Path $root){throw 'UQ24_SCRATCH_EXISTS'}
          try {
            Pin 'refs/heads/main' $main
            Pin ('refs/heads/'+$branch) $head
            & git.exe clone --quiet --single-branch --branch $branch $remote $root
            if($LASTEXITCODE -ne 0){throw 'UQ24_CLONE_FAILED'}
            Push-Location $root
            try {
              if((& git.exe rev-parse HEAD|Out-String).Trim() -cne $head){throw 'UQ24_CLONE_HEAD_MISMATCH'}
              if((& git.exe status --porcelain=v1|Out-String).Trim()){throw 'UQ24_INITIAL_DIRTY'}
              $before=@{}
              foreach($path in @('.ice/records.json','.ice/source-ledger.json',
                  'archive/index.json','.ice/remote-bootstrap.json',
                  '.ice/remote-catalog.json','.ice/remote-index.ndjson','.ice/chat-delta-state.json')){
                $before[$path]=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              }
              foreach($test in @('tests/Test-BrowserChatIntake.ps1','tests/Test-ChatCollector.ps1',
                 'tests/Test-ChatSourceAliases.ps1','tests/Test-BackfillCycle.ps1')) {
                $raw=(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test 2>&1 | Out-String)
                if($LASTEXITCODE -ne 0) {
                  Write-Host ('UQ24_FAILED_TEST='+$test)
                  Write-Host $raw.Substring(0,[Math]::Min(5000,$raw.Length))
                  throw 'UQ24_FOCUSED_REGRESSION_FAILED'
                }
                Write-Host ('UQ24_FOCUSED_'+[IO.Path]::GetFileNameWithoutExtension($test)+'=PASS')
              }
              foreach($path in $before.Keys) {
                if((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $before[$path]){
                  throw ('UQ24_DURABLE_DRIFT_'+$path)
                }
              }
              if((& git.exe status --porcelain=v1|Out-String).Trim()) {throw 'UQ24_POST_TEST_GIT_DIRTY'}
              Pin 'refs/heads/main' $main
              Pin ('refs/heads/'+$branch) $head
              Write-Host 'UQ24_SEVEN_DURABLE_HASHES_AND_REFS_UNCHANGED=PASS'
              Write-Host 'UQ24_RECORDS_APPLIED=0'
              Write-Host 'UQ24_GIT_COMMITS=0'
              Write-Host 'UQ24_CODEX_INVOCATIONS=0'
              Write-Host 'UQ24_BROWSER_ONLY_ONE_COMMAND_QUALIFICATION=PASS'
            } finally {Pop-Location}
          } finally {
            if(Test-Path $root){Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue}
          }
