name: F124-DA sourcefree learned causal operator program synthesis
on:
  push:
    branches: [research/f124da-causal-operator-synthesis-20261019]
    paths: [.github/workflows/forge-f124da-sourcefree-programs.yml]
permissions:
  contents: read
concurrency:
  group: f124da-sourcefree-program-original
  cancel-in-progress: false
jobs:
  frozen-sourcefree-program-preflight:
    name: frozen-sourcefree-program-preflight (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin CPU-only independent trained recurrent peer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check numpy==2.3.5
          if ($LASTEXITCODE -ne 0) { throw 'F124DA_PINNED_CPU_NUMPY_FAILED' }
      - name: Prescience source-free protocol identity and original old science non-replay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'DA_PROVIDER_SHA_CHANGED' }
          & git merge-base --is-ancestor 82df11e6110a3f7acaa2b29be0d0c980ac64c70b HEAD
          if ($LASTEXITCODE -ne 0) { throw 'DA_ORIGINAL_FREEZE_NOT_BEFORE_PROGRAM_SOURCE' }
          & git merge-base --is-ancestor a7ae38a68a296753c92ba81a40de7c17fe9cb31a HEAD
          if ($LASTEXITCODE -ne 0) { throw 'DA_OLD_ORIGINAL_NEGATIVE_CUSTODY_NOT_PRESERVED' }
          $a=Get-Content -Raw research/north-star-transfer/f124da-frozen-operator-discovery.json | ConvertFrom-Json
          if ($a.schema -cne 'mass.f124da.frozen-sourcefree-operator-program-discovery.v1') { throw 'DA_FROZEN_HYPOTHESIS_SCHEMA_MISMATCH' }
          if (!$a.safety.no_924_to_937_original_science_reuse -or !$a.safety.no_new_original_source_birth -or !$a.safety.sourcefree_engineering_only -or !$a.safety.no_auto_merge) { throw 'DA_FORBIDDEN_ORIGINAL_SCIENTIFIC_ADMISSION' }
          Write-Host 'F124DA_FROZEN_BEFORE_SOURCE_BIRTH_AND_SOURCEFREE=PASS'
      - name: Independently test all syntax programs, role equivalence and heldout label isolation
        shell: pwsh
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          $ErrorActionPreference='Stop'
          python -B research/north-star-transfer/test_f124da_operator_discovery.py -v
          if ($LASTEXITCODE -ne 0) { throw 'DA_GENUINE_CAUSAL_PROGRAM_LEARNING_OR_PARITY_CONTROL_FAILED' }
          Write-Host 'F124DA_TRAINED_CAUSAL_SYNTAX_ENGINEERING=PASS'

  frozen-original-sourcefree-program-shard:
    name: frozen-original-sourcefree-program-shard (${{ matrix.family }} ${{ matrix.first_seed }})
    needs: frozen-sourcefree-program-preflight
    strategy:
      fail-fast: false
      matrix:
        family: [heldout_two_stage_arithmetic_programs, out_of_primitive_class_multiplicative_carry]
        first_seed: [51, 53]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin one-thread NumPy for BPTT control
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Run all 40 full OS program/case and strong control processes
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -B research/north-star-transfer/f124da_whole_os_shard.py \
            --family "${{ matrix.family }}" \
            --first-seed "${{ matrix.first_seed }}" \
            --out "$RUNNER_TEMP/da-original-shard"
      - name: Retain all original OS receipts
        uses: actions/upload-artifact@v4
        with:
          name: f124da-sourcefree-${{ matrix.family }}-${{ matrix.first_seed }}
          path: ${{ runner.temp }}/da-original-shard/shard-*.json
          retention-days: 90
          if-no-files-found: error

  independent-original-program-review:
    name: independent-original-program-review
    needs: frozen-original-sourcefree-program-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve all four unfiltered sourcefree frozen research shards
        uses: actions/download-artifact@v4
        with:
          pattern: f124da-sourcefree-*
          path: ${{ runner.temp }}/da-original-all-shards
          merge-multiple: true
      - name: Independent immutable native-work and natural-science audit
        shell: bash
        run: |
          set -euo pipefail
          python -B research/north-star-transfer/f124da_readonly_operator_audit.py \
            --shards "$RUNNER_TEMP/da-original-all-shards" \
            --out "$RUNNER_TEMP/da-original-audit"
      - name: Preserve complete OS results and source-safe summary
        uses: actions/upload-artifact@v4
        with:
          name: f124da-original-all-160-sourcefree-operator-evidence
          path: ${{ runner.temp }}/da-original-audit/
          retention-days: 90
          if-no-files-found: error
