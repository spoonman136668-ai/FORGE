name: NR-M1V Native-vs-Bayesian Source-only Baseline
on:
  pull_request:
    paths:
      - 'research/nr-m1v/**'
      - '.github/workflows/nr-m1v-native-bayesian-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conventional-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile static audited algorithms
        run: python -m py_compile research/nr-m1v/audit.py research/nr-m1v/pinned_native_taskcell.py research/nr-m1v/test_audit.py
      - name: Verify independent conventional comparator tests
        run: python -m unittest discover -s research/nr-m1v -p 'test_*.py' -v
      - name: Write machine-readable actual equivalence result
        run: python research/nr-m1v/audit.py --output research/nr-m1v/CI_RESULT.json
      - name: Confirm source-only and no changed tracked files
        run: git diff --exit-code

# Never fetch/step original Farama worlds, change native release, or confer review acceptance.
