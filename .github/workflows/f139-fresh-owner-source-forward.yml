name: FORGE F139 fresh original-owner source forward (existing task only)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  actions: read
jobs:
  # Owner-only PREPARE: cold-check the previous terminal, stage signed source
  # and leave the SAME original task DISABLED. No dispatch or new controller.
  fresh-original-owner-source-forward:
    if: >-
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.actor == 'spoonman136668-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event.action == 'created' &&
      github.event.issue.number == 1830 &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == 'spoonman136668-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-FRESH-OWNER-SOURCE-FORWARD ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    concurrency:
      group: forge-f139-fresh-existing-disabled-task-rebind
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - name: Checkout exact protected main, no retained credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Original SID source-forward PREPARE, disabled only
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_EVENT_NAME -cne 'issue_comment'){throw 'F139_FORWARD_WRONG_EVENT'}
          $body=[string]((Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json).comment.body)
          $fields=@($body.Split(' ',[StringSplitOptions]::RemoveEmptyEntries))
          if($fields.Count -ne 7 -or $fields[0] -cne 'F139-FRESH-OWNER-SOURCE-FORWARD'){throw 'F139_FORWARD_COMMENT_SHAPE'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File f139/nci04_fresh_owner_source_forward.ps1 -Phase Prepare -Target $fields[1] -Head $fields[2] -PrNumber ([int]$fields[3]) -RegressionRun ([int64]$fields[4]) -SourceRun ([int64]$fields[5]) -RehearsalRun ([int64]$fields[6])
          if($LASTEXITCODE -ne 0){throw 'F139_FORWARD_PREPARE_BLOCKED'}
          Write-Output 'F139_ORIGINAL_OWNER_SOURCE_FORWARD_PREPARED_DISABLED_ONLY=PASS'

  # START only after a separate owner comment and a COMPLETED PREPARE run.
  fresh-original-owner-source-forward-start:
    if: >-
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.actor == 'spoonman136668-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event.action == 'created' &&
      github.event.issue.number == 1830 &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == 'spoonman136668-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-FRESH-OWNER-SOURCE-FORWARD-START ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    concurrency:
      group: forge-f139-fresh-existing-disabled-task-rebind
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - name: Checkout exact protected main, no retained credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Original SID START, same prepared task only
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          $body=[string]((Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json).comment.body)
          $fields=@($body.Split(' ',[StringSplitOptions]::RemoveEmptyEntries))
          if($fields.Count -ne 3 -or $fields[0] -cne 'F139-FRESH-OWNER-SOURCE-FORWARD-START'){throw 'F139_FORWARD_START_COMMENT_SHAPE'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File f139/nci04_fresh_owner_source_forward.ps1 -Phase Start -Target $fields[1] -PrepRun ([int64]$fields[2])
          if($LASTEXITCODE -ne 0){throw 'F139_FORWARD_START_BLOCKED'}
          Write-Output 'F139_SAME_ORIGINAL_OWNER_STARTED=PASS'
