name: F139 independently audit 2 native runs and four provider receipts
on:
  push:
    branches: [verify/f139-cross-hosted-receipt-audit-20261023]
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: f139-hosted-native-provider-immutable-audit
  cancel-in-progress: true
jobs:
  independent-source-audit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fixed source checkout without persisted token
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 25
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact original native source and bounded audit delta
        shell: bash
        run: |
          set -euo pipefail
          base=fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$base" HEAD)" = "$base"
          expected="$(printf '%s\n' '.github/workflows/f139-independent-provider-receipts.yml' 'f139/audit_public_provider_receipts.py')"
          test "$(git diff --name-only "$base" HEAD)" = "$expected"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo F139_AUDIT_ISOLATED_FROM_ORIGINAL_OWNER_SOURCE=PASS
      - name: Download pinned 778 Ubuntu provider receipt
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39942845762
          name: forge-f139-native-receipt-ubuntu-latest
          path: ${{ runner.temp }}/f139/778-ubuntu-latest
      - name: Download pinned 778 Windows provider receipt
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39942845762
          name: forge-f139-native-receipt-windows-latest
          path: ${{ runner.temp }}/f139/778-windows-latest
      - name: Download pinned 779 Ubuntu provider receipt
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39942935746
          name: forge-f139-native-receipt-ubuntu-latest
          path: ${{ runner.temp }}/f139/779-ubuntu-latest
      - name: Download pinned 779 Windows provider receipt
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39942935746
          name: forge-f139-native-receipt-windows-latest
          path: ${{ runner.temp }}/f139/779-windows-latest
      - name: Fetch authentic original issue/run/artifact metadata, never write back
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/f139"
          for n in 778 779; do
            gh api "repos/spoonman136668-ai/FORGE/issues/$n" > "$dir/issue-$n.json"
          done
          for n in 39942845762 39942935746; do
            gh api "repos/spoonman136668-ai/FORGE/actions/runs/$n" > "$dir/run-$n.json"
          done
          for n in 12497420531 12496328946 12496473860 12496423807; do
            gh api "repos/spoonman136668-ai/FORGE/actions/artifacts/$n" > "$dir/artifact-$n.json"
          done
          echo F139_ORIGINAL_GITHUB_PROVIDER_METADATA=GET_ONLY
      - name: Independently recompute receipt, intent, report and source digests
        shell: bash
        run: |
          set -euo pipefail
          python -B f139/audit_public_provider_receipts.py "$RUNNER_TEMP/f139" "$RUNNER_TEMP/f139-audit.json"
          test -s "$RUNNER_TEMP/f139-audit.json"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo F139_ORIGINAL_OWNER_SQLITE=NOT_TOUCHED
          echo F139_NATIVE_PROVIDER_RUNS_REPLAYED=0
          echo F139_SCIENTIFIC_FIRST_USE=FALSE
      - name: Preserve bounded provider-only evidence with explicit limits
        uses: actions/upload-artifact@v4
        with:
          name: f139-provider-audit-${{ matrix.os }}
          path: ${{ runner.temp }}/f139-audit.json
          retention-days: 30
          if-no-files-found: error
  compare:
    needs: independent-source-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: f139-provider-audit-ubuntu-latest
          path: ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: f139-provider-audit-windows-latest
          path: windows
      - name: Require independent OS results byte-identical and never claim local authority
        shell: bash
        run: |
          set -euo pipefail
          cmp ubuntu/f139-audit.json windows/f139-audit.json
          echo F139_CROSS_HOSTED_PROVIDER_AUDIT=PASS
          echo F139_ORIGINAL_LOCAL_LEDGER=UNVERIFIED
          echo F139_FSA_SCIENTIFIC_AUTHORITY=NOT_VERIFIED
          echo F139_NO_NEW_CONTROLLER_OR_DISPATCH=TRUE
