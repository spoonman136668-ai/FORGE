name: CKB R407 locate R220-era local source archives
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $roots=@('C:\Users\camar\GolandProjects','C:\ProgramData\CKBR\release-store\ckb-plane')
          foreach($root in $roots){
            if(!(Test-Path -LiteralPath $root -PathType Container)){continue}
            $items=@(Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue | Where-Object {$_.Name -match '(?i)(r220|livecompat|source|backup)' -and $_.Extension -match '(?i)^\.(zip|tar|gz|7z|json|txt)$'} | Select-Object -First 80)
            Write-Output ('R407_ROOT='+$root+' MATCHES='+$items.Count)
            foreach($f in $items){Write-Output ('R407_ARCHIVE='+$f.FullName+' BYTES='+$f.Length)}
          }
          Write-Output 'R407_READ_ONLY=TRUE'
