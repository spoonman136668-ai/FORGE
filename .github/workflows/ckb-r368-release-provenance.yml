name: CKB R409 inventory controller-related archives independent of filename
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $root='C:\Users\camar\GolandProjects'
          $dirs=@(Get-ChildItem -LiteralPath $root -Directory -ErrorAction Stop | Where-Object {$_.Name -match '(?i)^ckb-plane'})
          foreach($dir in $dirs){
            $files=@(Get-ChildItem -LiteralPath $dir.FullName -Recurse -File -ErrorAction SilentlyContinue | Where-Object {$_.Extension -match '(?i)^\.(zip|tar|gz|tgz|7z|bundle)$'} | Select-Object -First 30)
            Write-Output ('R409_DIR='+$dir.Name+' ARCHIVES='+$files.Count)
            foreach($item in $files){Write-Output ('R409_ARCHIVE='+$item.FullName+' BYTES='+$item.Length)}
          }
          Write-Output 'R409_READ_ONLY=TRUE'
