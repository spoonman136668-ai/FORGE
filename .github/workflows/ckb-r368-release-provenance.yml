name: CKB R402 isolated exact-flag reproducibility probe
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $installed='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R220-LIVECOMPAT-20261023\bin\ckb-plane.exe'
          $expected='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          if((Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected){throw 'R402_INSTALLED_IDENTITY_DRIFT'}
          $tmp=Join-Path $env:RUNNER_TEMP ('r402-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $tmp){throw 'R402_TEMP_COLLISION'}
          New-Item -ItemType Directory -Path $tmp -ErrorAction Stop | Out-Null
          try {
            foreach($p in @('go.mod','go.sum')){Copy-Item -LiteralPath (Join-Path $root $p) -Destination (Join-Path $tmp $p) -ErrorAction Stop}
            foreach($p in @('cmd','internal')){Copy-Item -LiteralPath (Join-Path $root $p) -Destination (Join-Path $tmp $p) -Recurse -ErrorAction Stop}
            Push-Location $tmp
            try {
              $env:CGO_ENABLED='0'
              $env:GOAMD64='v1'
              & go build -trimpath -o (Join-Path $tmp 'ckb-plane.exe') ./cmd/ckb-plane
              if($LASTEXITCODE -ne 0){throw 'R402_BUILD_FAILED'}
            } finally {Pop-Location}
            $actual=(Get-FileHash -LiteralPath (Join-Path $tmp 'ckb-plane.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output ('R402_ISOLATED_SHA256='+$actual)
            Write-Output ('R402_MATCH_INSTALLED='+($actual -ceq $expected))
            Write-Output 'R402_LIVE_UNCHANGED=TRUE'
          } finally {Remove-Item -LiteralPath $tmp -Recurse -Force -ErrorAction SilentlyContinue}
