name: CKB R404 source-tree custody fingerprint
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $paths=@('go.mod','go.sum') + @(Get-ChildItem -LiteralPath (Join-Path $root 'cmd'),(Join-Path $root 'internal') -Recurse -File -ErrorAction Stop | ForEach-Object {$_.FullName.Substring($root.Length+1).Replace('\','/')})
          $paths=@($paths | Sort-Object -Unique)
          $sha=[System.Security.Cryptography.SHA256]::Create()
          $records=[System.Collections.Generic.List[string]]::new()
          foreach($p in $paths){
            $f=Join-Path $root $p
            $h=(Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash.ToLowerInvariant()
            $records.Add($p.Replace('\','/')+' '+$h)
          }
          $bytes=[Text.Encoding]::UTF8.GetBytes(($records -join "`n")+"`n")
          $tree=[Convert]::ToHexString($sha.ComputeHash($bytes)).ToLowerInvariant()
          Write-Output ('R404_SOURCE_FILE_COUNT='+$paths.Count)
          Write-Output ('R404_SOURCE_TREE_SHA256='+$tree)
          Write-Output 'R404_READ_ONLY=TRUE'
