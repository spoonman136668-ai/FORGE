name: CKB R403 inspect R220 PE build identity and native rebuild
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $exe='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R220-LIVECOMPAT-20261023\bin\ckb-plane.exe'
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $go=(Get-Command go -ErrorAction Stop).Source
          $installed=@(& $go version -m $exe)
          $mod=@(Get-Content -LiteralPath (Join-Path $root 'go.mod'))
          $deps=@($installed | Where-Object {$_ -match '^\s*dep\s+'})
          Write-Output ('R403_INSTALLED_DEP_COUNT='+$deps.Count)
          foreach($line in $deps){
            $parts=($line.Trim() -split '\s+')
            if($parts.Count -lt 3){continue}
            $name=$parts[1];$ver=$parts[2]
            $match=@($mod | Where-Object {$_ -match ('^\s*'+[regex]::Escape($name)+'\s+')})
            if($match.Count -ne 1 -or $match[0] -notmatch [regex]::Escape($ver)){Write-Output ('R403_DEP_MISMATCH='+$name+' INSTALLED='+$ver+' CURRENT='+($match -join ' '))}
          }
          $src=@(Get-ChildItem -LiteralPath (Join-Path $root 'cmd'),(Join-Path $root 'internal') -Recurse -File -Filter '*.go' -ErrorAction Stop)
          Write-Output ('R403_NATIVE_GO_FILE_COUNT='+$src.Count)
          Write-Output 'R403_READ_ONLY=TRUE'
