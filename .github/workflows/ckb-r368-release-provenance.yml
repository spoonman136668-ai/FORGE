name: CKB R416 exact R220 owner-history access preflight
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          if(-not [Security.Principal.WindowsPrincipal]::new($identity).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){throw 'R416_ADMIN_OWNER_REQUIRED'}
          Write-Output 'R416_ELEVATED_OWNER_RUNNER=PASS'
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $exe='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R220-LIVECOMPAT-20261023\bin\ckb-plane.exe'
          $config=Join-Path $root 'config\autonomy.yaml'
          $bridge=Join-Path $root 'config\webui-bridge.json'
          $db=Join-Path $root 'state\autonomy.db'
          $pins=@{
            $exe='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
            $config='a14f210a146de9bd248bb4cfdc2e156b19c985a6c964a91881c4391f0a0190dc'
            $bridge='afcbac12e6fe6b3545d3ca89b556418f4bb444fb54ca2911ebcbef28308d63f2'
          }
          foreach($p in @($exe,$config,$bridge)){
            if(!(Test-Path -LiteralPath $p -PathType Leaf)){throw ('R416_EXPECTED_FILE_ABSENT='+[IO.Path]::GetFileName($p))}
            $sha=(Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -cne $pins[$p]){throw ('R416_PIN_MISMATCH='+[IO.Path]::GetFileName($p))}
          }
          Write-Output 'R416_ORIGINAL_EXE_AND_CONFIG_PINS=PASS'
          if(!(Test-Path -LiteralPath $db -PathType Leaf)){throw 'R416_HISTORICAL_DB_ABSENT'}
          $fi=Get-Item -LiteralPath $db -ErrorAction Stop
          if($fi.Length -le 0){throw 'R416_HISTORICAL_DB_EMPTY'}
          Write-Output ('R416_HISTORICAL_DB_PRESENT=TRUE BYTES='+$fi.Length)
          $scheduled=Get-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction SilentlyContinue
          if($null -ne $scheduled){Write-Output ('R416_ORIGINAL_TASK_STATE='+$scheduled.State)}else{Write-Output 'R416_ORIGINAL_TASK_STATE=NOT_FOUND'}
          Write-Output 'R416_MUTATED_LIVE_FILES=FALSE'
          Write-Output 'R416_OWNER_HISTORY_PREFLIGHT=PASS'
