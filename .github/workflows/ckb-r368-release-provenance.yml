name: CKB R425 isolated terminal-blocker scheduling repair qualification
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          if(-not [Security.Principal.WindowsPrincipal]::new($identity).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){throw 'R425_ESCALATED_OWNER_REQUIRED'}
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $exe='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R220-LIVECOMPAT-20261023\bin\ckb-plane.exe'
          $native=Join-Path $root 'internal\plane\autonomy.go'
          if((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne '82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'){throw 'R425_INSTALLED_EXE_DRIFT'}
          if((Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'c4cc44e3820b8ac860a75b87df8ba27dcdff09ca19e427661f43d07b999ef3bd'){throw 'R425_NATIVE_SOURCE_DRIFT'}
          $stage=Join-Path $env:RUNNER_TEMP ('ckb-r425-source-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $stage){throw 'R425_STAGE_COLLISION'}
          New-Item -Path $stage -ItemType Directory -ErrorAction Stop | Out-Null
          try {
            foreach($file in @('go.mod','go.sum')){Copy-Item -LiteralPath (Join-Path $root $file) -Destination (Join-Path $stage $file) -ErrorAction Stop}
            foreach($dir in @('cmd','internal')){Copy-Item -LiteralPath (Join-Path $root $dir) -Destination $stage -Recurse -ErrorAction Stop}
            $targetFile=Join-Path $stage 'internal\plane\autonomy.go'
            $raw=[IO.File]::ReadAllText($targetFile)
            if($raw.Contains([string][char]13+[string][char]10)){throw 'R425_UNEXPECTED_LINE_ENDINGS'}
            $start=$raw.IndexOf('func (p *Engine) AutonomyTick(')
            $end=$raw.IndexOf('func (p *Engine) startQueued(',$start)
            if($start -lt 0 -or $end -le $start){throw 'R425_SOURCE_FUNCTION_BOUNDARY_DRIFT'}
            $section=$raw.Substring($start,$end-$start)
            $tab=[string][char]9; $nl=[string][char]10
            $oldBlock=$tab+'if len(blockers) > 0 {'+$nl+$tab+$tab+'return p.setSetting("autonomy_status", strings.Join(blockers, "; "))'+$nl+$tab+'}'+$nl
            $anchor=$tab+'if waiting {'
            if(($section.Split(@($oldBlock),[StringSplitOptions]::None).Length-1) -ne 1 -or ($section.Split(@($anchor),[StringSplitOptions]::None).Length-1) -ne 1){throw 'R425_SOURCE_GUARD_ANCHOR_DRIFT'}
            $section=$section.Replace($oldBlock,'')
            $section=$section.Replace($anchor,$oldBlock+$anchor)
            if($section.IndexOf($oldBlock) -lt $section.IndexOf('if item.State != "QUEUED"')){throw 'R425_GUARD_STILL_PRECEDES_NEW_QUEUE'}
            [IO.File]::WriteAllText($targetFile,$raw.Substring(0,$start)+$section+$raw.Substring($end),[Text.UTF8Encoding]::new($false))
            Write-Output 'R425_TERMINAL_BLOCKER_SCHEDULER_PATCH=STAGED_IN_ISOLATION'
            $test=@'
          package plane
          import (
           "context"
           "strings"
           "testing"
           "gopkg.in/yaml.v3"
          )
          func r425TerminalFixture(t *testing.T,p *Engine,w WorkOrder,id string){
           t.Helper()
           w.ID=id
           w.Worker.Branch="codex/r425-terminal"
           b,err:=yaml.Marshal(w)
           if err!=nil {t.Fatal(err)}
           if err=p.Store.Load(b);err!=nil {t.Fatal(err)}
           if _,err=p.Store.DB.Exec("UPDATE work_orders SET state='BLOCKED',reason='BRANCH_ANCESTRY_INVALID' WHERE id=?",id);err!=nil {t.Fatal(err)}
           raw:=[]byte("retained historical failure")
           if _,err=p.Store.DB.Exec("INSERT INTO queue_items(id,hash,raw,kind,state,mode,authorization,reason,updated,receipt) VALUES(?,?,?,?,?,?,?,?,?,?)",id,digest(raw),raw,"source","FAILED","source","operator","BRANCH_ANCESTRY_INVALID",now(),"historical-receipt");err!=nil {t.Fatal(err)}
          }
          func TestR425IndependentQueuedSourceAdvancesPastHistoricalFailure(t *testing.T){
           p,w:=setup(t)
           testAuthority(p)
           r425TerminalFixture(t,p,w,"R425_TERMINAL")
           sourceQueue(t,p,w,"R425_FRESH")
           if err:=p.AutonomyTick(context.Background());err!=nil {t.Fatal(err)}
           var freshState string
           if err:=p.Store.DB.QueryRow("SELECT state FROM queue_items WHERE id='R425_FRESH'").Scan(&freshState);err!=nil {t.Fatal(err)}
           if freshState=="QUEUED" {t.Fatal("historical terminal failure stranded independent queued source")}
           j:=wait(t,p,"R425_FRESH")
           if j.State!="ACCEPTED" {t.Fatalf("independent work did not finish: %s",j.State)}
           var state,reason,receipt string
           if err:=p.Store.DB.QueryRow("SELECT state,reason,receipt FROM queue_items WHERE id='R425_TERMINAL'").Scan(&state,&reason,&receipt);err!=nil {t.Fatal(err)}
           if state!="FAILED" || reason!="BRANCH_ANCESTRY_INVALID" || receipt!="historical-receipt" {t.Fatalf("historical record changed: %s %s %s",state,reason,receipt)}
          }
          func TestR425TerminalFailurePreservedWhenNoEligibleWork(t *testing.T){
           p,w:=setup(t)
           testAuthority(p)
           r425TerminalFixture(t,p,w,"R425_TERMINAL")
           if err:=p.AutonomyTick(context.Background());err!=nil {t.Fatal(err)}
           if status:=p.setting("autonomy_status");!strings.HasPrefix(status,"OPERATOR_BLOCKED:") {t.Fatalf("terminal failure no longer observable: %s",status)}
           var n int
           if err:=p.Store.DB.QueryRow("SELECT count(*) FROM queue_items WHERE state='FAILED'").Scan(&n);err!=nil || n!=1 {t.Fatalf("historical failure lost: %d %v",n,err)}
          }
          '@
            $testFile=Join-Path $stage 'internal\plane\r425_terminal_blocker_test.go'
            [IO.File]::WriteAllText($testFile,$test,[Text.UTF8Encoding]::new($false))
            Push-Location $stage
            try {
              & go fmt ./internal/plane
              if($LASTEXITCODE -ne 0){throw 'R425_GO_FMT_FAILED'}
              & go test -p 1 -count=1 -run '^TestR425' ./internal/plane
              if($LASTEXITCODE -ne 0){throw 'R425_FOCUSED_SCHEDULER_NEGATIVE_FAILED'}
              Write-Output 'R425_FOCUSED_TERMINAL_BLOCKER_NEGATIVES=PASS'
            } finally {Pop-Location}
            if((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne '82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'){throw 'R425_RELEASE_MUTATED'}
            if((Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'c4cc44e3820b8ac860a75b87df8ba27dcdff09ca19e427661f43d07b999ef3bd'){throw 'R425_ORIGINAL_NATIVE_SOURCE_MUTATED'}
            Write-Output 'R425_LIVE_SOURCE_AND_EXE_UNCHANGED=PASS'
          } finally {
            if(Test-Path -LiteralPath $stage){Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction Stop}
          }
          Write-Output 'R425_ISOLATED_TEST_TREE_REMOVED=PASS'
