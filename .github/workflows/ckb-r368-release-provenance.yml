name: CKB R386 isolated dk-work binary comparison
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $exe=Join-Path $release 'bin\ckb-plane.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'MATCHING_EXECUTABLE_MISSING' }
          $exeHash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ('R371_MATCHING_EXE_SHA256='+$exeHash)
          if ($exeHash -cne $target) { throw 'RELEASE_EXECUTABLE_HASH_DRIFT' }
          $source='C:\Users\camar\GolandProjects\ckb-plane-dk-work'
          if(!(Test-Path -LiteralPath (Join-Path $source 'cmd\ckb-plane\main.go') -PathType Leaf)){throw 'R386_SOURCE_MISSING'}
          $go=(Get-Command go -ErrorAction Stop).Source
          $env:GOTOOLCHAIN='local';$env:GOPROXY='off';$env:GOSUMDB='off'
          $env:CGO_ENABLED='0';$env:GOOS='windows';$env:GOARCH='amd64';$env:GOAMD64='v1'
          $temp=Join-Path $env:RUNNER_TEMP ('r386-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          try{
            Push-Location $source
            try{
              $out=Join-Path $temp 'ckb-plane.exe'
              & $go build -trimpath -o $out ./cmd/ckb-plane
              if($LASTEXITCODE -ne 0){throw 'R386_BUILD_FAILED'}
              $hash=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Output ('R386_CANDIDATE_SHA256='+$hash)
              Write-Output ('R386_INSTALLED_SHA256='+$target)
              Write-Output ('R386_EXACT_MATCH='+($hash -ceq $target))
            }finally{Pop-Location}
          }finally{Remove-Item -LiteralPath $temp -Recurse -Force -ErrorAction SilentlyContinue}
          Write-Output 'R386_LIVE_STATE_UNCHANGED=TRUE'
