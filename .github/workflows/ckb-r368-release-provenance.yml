name: CKB R401 compare native source and installed build dependencies
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $exe='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R220-LIVECOMPAT-20261023\bin\ckb-plane.exe'
          $go=(Get-Command go -ErrorAction Stop).Source
          $installed=@(& $go version -m $exe)
          $mod=@(Get-Content -LiteralPath (Join-Path $root 'go.mod'))
          foreach($dep in @('modernc.org/sqlite','golang.org/x/net','golang.org/x/sys','github.com/bmatcuk/doublestar/v4')){
            $build=@($installed | Where-Object {$_ -match ('^\s*dep\s+'+[regex]::Escape($dep)+'\s+') } | Select-Object -First 1)
            $decl=@($mod | Where-Object {$_ -match ('^\s*'+[regex]::Escape($dep)+'\s+') } | Select-Object -First 1)
            Write-Output ('R401_DEP='+$dep+' INSTALLED='+($build -join ' ')+' CURRENT='+($decl -join ' '))
          }
          Write-Output ('R401_GO_VERSION='+(& $go version))
          Write-Output 'R401_READ_ONLY=TRUE'
