name: CKB R412 pinned R220 critical-source blob identity
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $expected=@{
            'go.mod'='e05cfbaf7fa1cbf9d4baecdade2fbcc451b5cbc8'
            'internal\plane\model.go'='ea27ad334f7dde8149075456f2b9e4f31d20c587'
            'cmd\ckb-plane\main.go'='d7a431c06e48f7a4810a5c0cf5c80162fa7d3a60'
          }
          if (!(Get-Command git -ErrorAction SilentlyContinue)) { throw 'GIT_NOT_AVAILABLE' }
          foreach($rel in ($expected.Keys | Sort-Object)){
            $p=Join-Path $root $rel
            if (!(Test-Path -LiteralPath $p -PathType Leaf)){ Write-Output ('R412_MISSING='+$rel);continue }
            $actual=(& git hash-object --no-filters -- $p).Trim()
            if ($LASTEXITCODE -ne 0){throw ('HASH_FAILED='+$rel)}
            Write-Output ('R412_FILE='+$rel+' CURRENT='+$actual+' PINNED='+$expected[$rel]+' MATCH='+($actual -ceq $expected[$rel]))
          }
          Write-Output 'R412_READ_ONLY=TRUE'
