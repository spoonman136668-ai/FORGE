name: CKB R405 compare historical native snapshots against current source
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $candidates=@('C:\Users\camar\GolandProjects\ckb-plane-authority-lease-r2','C:\Users\camar\GolandProjects\ckb-plane-authority-lease-r2-livecandidate','C:\Users\camar\GolandProjects\ckb-plane-dk-work')
          $relative=@('go.mod','internal\plane\model.go','cmd\ckb-plane\main.go')
          foreach($candidate in $candidates){
            if(!(Test-Path -LiteralPath $candidate -PathType Container)){continue}
            $matches=0;$checked=0
            foreach($rel in $relative){
              $a=Join-Path $root $rel;$b=Join-Path $candidate $rel
              if((Test-Path -LiteralPath $a -PathType Leaf) -and (Test-Path -LiteralPath $b -PathType Leaf)){
                $checked++
                if((Get-FileHash -LiteralPath $a -Algorithm SHA256).Hash -ceq (Get-FileHash -LiteralPath $b -Algorithm SHA256).Hash){$matches++}
              }
            }
            Write-Output ('R405_CANDIDATE='+$candidate+' CHECKED='+$checked+' MATCHED='+$matches)
          }
          Write-Output 'R405_READ_ONLY=TRUE'
