name: CKB R423 original pending-file and blocker classification
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          if(-not [Security.Principal.WindowsPrincipal]::new($identity).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){throw 'R417_ADMIN_OWNER_REQUIRED'}
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $exe='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R220-LIVECOMPAT-20261023\bin\ckb-plane.exe'
          $config=Join-Path $root 'config\autonomy.yaml'
          $bridge=Join-Path $root 'config\webui-bridge.json'
          $sourceDb=Join-Path $root 'state\autonomy.db'
          $pins=@{
            $exe='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
            $config='a14f210a146de9bd248bb4cfdc2e156b19c985a6c964a91881c4391f0a0190dc'
            $bridge='afcbac12e6fe6b3545d3ca89b556418f4bb444fb54ca2911ebcbef28308d63f2'
          }
          foreach($p in @($exe,$config,$bridge)){
            if(!(Test-Path -LiteralPath $p -PathType Leaf)){throw 'R417_PINNED_INPUT_MISSING'}
            if((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pins[$p]){throw 'R417_PINNED_INPUT_DRIFT'}
          }
          if(!(Test-Path -LiteralPath $sourceDb -PathType Leaf)){throw 'R417_OWNER_DATABASE_MISSING'}
          $stage=Join-Path $env:RUNNER_TEMP ('ckb-r417-history-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $stage){throw 'R417_ISOLATION_COLLISION'}
          New-Item -Path (Join-Path $stage 'config'),(Join-Path $stage 'state'),(Join-Path $stage 'workorders\pending') -ItemType Directory -Force | Out-Null
          try {
            $isolatedConfig=Join-Path $stage 'config\autonomy.yaml'
            Copy-Item -LiteralPath $config -Destination $isolatedConfig -ErrorAction Stop
            $operations=Join-Path $root 'config\local-operations.json'
            if(!(Test-Path -LiteralPath $operations -PathType Leaf)){throw 'R420_LOCAL_OPERATIONS_CONFIG_MISSING'}
            $isolatedOperations=Join-Path $stage 'config\local-operations.json'
            Copy-Item -LiteralPath $operations -Destination $isolatedOperations -ErrorAction Stop
            if((Get-FileHash -LiteralPath $operations -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $isolatedOperations -Algorithm SHA256).Hash){throw 'R420_OPERATIONS_COPY_DRIFT'}
            Write-Output 'R420_ISOLATED_LOCAL_OPERATIONS_CONFIG=PASS'
            $operationRoot=Join-Path $root 'operations'
            if(!(Test-Path -LiteralPath $operationRoot -PathType Container)){throw 'R421_OPERATION_DIRECTORY_ABSENT'}
            $opFiles=@(Get-ChildItem -LiteralPath $operationRoot -Recurse -Force -ErrorAction Stop)
            if(@($opFiles | Where-Object {($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0}).Count -ne 0){throw 'R421_OPERATION_REPARSE_REFUSED'}
            Copy-Item -LiteralPath $operationRoot -Destination $stage -Recurse -ErrorAction Stop
            $copied=@(Get-ChildItem -LiteralPath (Join-Path $stage 'operations') -Recurse -File -ErrorAction Stop)
            if($copied.Count -ne @($opFiles | Where-Object {!$_.PSIsContainer}).Count){throw 'R421_OPERATION_COPY_COUNT_DRIFT'}
            Write-Output ('R421_ISOLATED_OPERATION_FILE_COUNT='+$copied.Count)
            $livePending=Join-Path $root 'workorders\pending'
            $tempPending=Join-Path $stage 'workorders\pending'
            $pendingCount=0
            if(Test-Path -LiteralPath $livePending -PathType Container){
              $pendingDir=Get-Item -LiteralPath $livePending -Force
              if(($pendingDir.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw 'R423_PENDING_DIR_REPARSE_REFUSED'}
              $pending=@(Get-ChildItem -LiteralPath $livePending -File -Filter '*.json' -Force -ErrorAction Stop)
              if($pending.Count -gt 3000){throw 'R423_PENDING_COUNT_UNBOUNDED'}
              foreach($file in $pending){
                if(($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $file.Length -gt 2097152){throw 'R423_PENDING_FILE_UNSAFE'}
                $dst=Join-Path $tempPending $file.Name
                Copy-Item -LiteralPath $file.FullName -Destination $dst -ErrorAction Stop
                if((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash){throw 'R423_PENDING_COPY_RACE'}
                $pendingCount++
              }
            }
            Write-Output ('R423_PENDING_ENVELOPES_ISOLATED='+$pendingCount)
            $isolatedDb=Join-Path $stage 'state\autonomy.db'
            $py=@'
          import pathlib, sqlite3, sys
          source=pathlib.Path(sys.argv[1]).resolve(strict=True)
          target=pathlib.Path(sys.argv[2]).resolve()
          if source == target or target.exists(): raise RuntimeError('R417_SNAPSHOT_PATH_UNSAFE')
          if 'ckb-r417-history-' not in str(target): raise RuntimeError('R417_ISOLATION_ROOT_INVALID')
          src=sqlite3.connect(source.as_uri()+'?mode=ro', uri=True, timeout=30)
          dest=sqlite3.connect(str(target), timeout=30)
          try:
              src.backup(dest, pages=512, sleep=0.05)
              result=dest.execute('PRAGMA quick_check').fetchone()[0]
              if result != 'ok': raise RuntimeError('R417_SNAPSHOT_INTEGRITY_FAILED')
              names={row[0] for row in dest.execute('SELECT name FROM sqlite_master WHERE type=\'table\'')}
              print('R417_SNAPSHOT_INTEGRITY=PASS')
              print('R417_SNAPSHOT_TABLE_COUNT='+str(len(names)))
          finally:
              dest.close();src.close()
          '@
            & python -B -c $py $sourceDb $isolatedDb
            if($LASTEXITCODE -ne 0){throw 'R417_SQLITE_READONLY_BACKUP_FAILED'}
            if((Get-FileHash -LiteralPath $isolatedConfig -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pins[$config]){throw 'R417_SCRATCH_CONFIG_DRIFT'}
            Remove-Item Env:CKB_PLANE_GITHUB_TOKEN,Env:GH_TOKEN,Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
            $output=@(& $exe controller status --config $isolatedConfig 2>&1)
            $exit=$LASTEXITCODE
            if($exit -ne 0){
              Write-Output ('R418_NATIVE_STATUS_EXIT='+$exit)
              $diagnostic=($output | Out-String).Trim()
              $diagnostic=$diagnostic.Replace($stage,'[ISOLATED_ROOT]').Replace($root,'[OWNER_ROOT]').Replace($base,'[RELEASE_STORE]')
              $diagnostic=[regex]::Replace($diagnostic,'(?i)[A-Z]:\\[^\s"'']+','[OTHER_LOCAL_PATH]')
              if($diagnostic.Length -gt 300){$diagnostic=$diagnostic.Substring(0,300)}
              Write-Output ('R418_NATIVE_STATUS_ERROR='+$diagnostic)
              throw 'R417_ISOLATED_NATIVE_STATUS_FAILED'
            }
            $status=($output | Out-String | ConvertFrom-Json -ErrorAction Stop)
            if($null -eq $status.queue -or $null -eq $status.jobs){throw 'R417_NATIVE_STATUS_SHAPE_INVALID'}
            Write-Output ('R417_ISOLATED_QUEUE_COUNT='+@($status.queue).Count)
            Write-Output ('R417_ISOLATED_JOB_COUNT='+@($status.jobs).Count)
            Write-Output ('R417_ISOLATED_AUTHORITY='+[string]$status.authority)
            Write-Output ('R422_HEARTBEAT_STALE='+[string]$status.heartbeat_stale)
            Write-Output ('R422_PAUSED='+[string]$status.paused)
            Write-Output ('R422_BLOCKER_COUNT='+@($status.blockers).Count)
            foreach($g in ($status.queue | Group-Object state | Sort-Object Name)){Write-Output ('R422_QUEUE_STATE='+$g.Name+' COUNT='+$g.Count)}
            foreach($g in ($status.jobs | Group-Object state | Sort-Object Name)){Write-Output ('R422_JOB_STATE='+$g.Name+' COUNT='+$g.Count)}
            $controllerClass=([string]$status.controller_status).Split(':')[0]
            if($controllerClass.Length -gt 60){$controllerClass='REDACTED'}
            Write-Output ('R422_CONTROLLER_STATUS_CLASS='+$controllerClass)
            $failedItems=@($status.queue | Where-Object {$_.state -eq 'FAILED'})
            foreach($item in $failedItems){
              $safeId=[string]$item.id
              if($safeId -cnotmatch '^[A-Za-z0-9_-]{1,120}$'){$safeId='REDACTED'}
              $reasonClass=([string]$item.reason).Split(':')[0]
              if($reasonClass.Length -gt 100 -or $reasonClass -match '[\\/]'){$reasonClass='REDACTED'}
              $job=@($status.jobs | Where-Object {$_.id -ceq [string]$item.id})
              $jobState=if($job.Count -eq 1){[string]$job[0].state}else{'NO_UNIQUE_JOB'}
              Write-Output ('R423_FAILED_QUEUE_ID='+$safeId+' REASON_CLASS='+$reasonClass+' JOB_STATE='+$jobState)
            }
            Write-Output 'R423_BLOCKER_CLASSIFICATION_READ_ONLY=PASS'
            Write-Output 'R422_SNAPSHOT_OBSERVATION_ONLY=TRUE'
            Write-Output 'R417_ORIGINAL_EXE_ON_CONSISTENT_OWNER_SNAPSHOT=PASS'
            Write-Output 'R417_LIVE_CONTROLLER_OR_DATABASE_MUTATION=FALSE'
          } finally {
            if(Test-Path -LiteralPath $stage){Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction Stop}
          }
          Write-Output 'R417_PRIVATE_SNAPSHOT_REMOVED=PASS'
