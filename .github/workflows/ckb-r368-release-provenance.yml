name: CKB R389 bounded release provenance field extraction
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $exe=Join-Path $release 'bin\ckb-plane.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'MATCHING_EXECUTABLE_MISSING' }
          $exeHash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ('R371_MATCHING_EXE_SHA256='+$exeHash)
          if ($exeHash -cne $target) { throw 'RELEASE_EXECUTABLE_HASH_DRIFT' }
          $paths=@('C:\Users\camar\GolandProjects\ckb-plane-authority-lease-r2-livecandidate\PACKAGE-MANIFEST.json','C:\Users\camar\GolandProjects\ckb-plane-authority-lease-r2-livecandidate\profiles\ckb-r4a-source-proof.json','C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-CONSOLIDATION-R1\release-manifest.json','C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-THROUGHPUT-R1\release-manifest.json')
          foreach($p in $paths){
            if(!(Test-Path -LiteralPath $p -PathType Leaf)){continue}
            $obj=Get-Content -LiteralPath $p -Raw | ConvertFrom-Json
            Write-Output ('R389_DOCUMENT='+$p)
            foreach($prop in $obj.PSObject.Properties){
              if($prop.Name -match '(?i)(source|commit|revision|build|artifact|sha|version|release|origin|repo|fingerprint)'){
                $v=$prop.Value | ConvertTo-Json -Compress -Depth 3
                if($v.Length -gt 350){$v=$v.Substring(0,350)+'...[truncated]'}
                Write-Output ('R389_FIELD='+$prop.Name+' VALUE='+$v)
              }
            }
          }
          Write-Output 'R389_READ_ONLY=TRUE'
