name: CKB R375 isolated native source compatibility build
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $exe=Join-Path $release 'bin\ckb-plane.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'MATCHING_EXECUTABLE_MISSING' }
          $exeHash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ('R371_MATCHING_EXE_SHA256='+$exeHash)
          if ($exeHash -cne $target) { throw 'RELEASE_EXECUTABLE_HASH_DRIFT' }
          $candidates=@(
            'C:\Users\camar\GolandProjects\ckb-plane\snapshot\source',
            'C:\Users\camar\GolandProjects\ckb-plane',
            'C:\Users\camar\source\repos\ckb-plane\snapshot\source'
          )
          $source=$null
          foreach($candidate in $candidates) {
            $mod=Join-Path $candidate 'go.mod'
            $main=Join-Path $candidate 'cmd\ckb-plane\main.go'
            if ((Test-Path -LiteralPath $mod -PathType Leaf) -and (Test-Path -LiteralPath $main -PathType Leaf)) {
              $source=$candidate
              break
            }
          }
          if ($null -eq $source) { Write-Output 'R375_SOURCE_CANDIDATE=NOT_FOUND_IN_BOUNDED_PATHS'; Write-Output 'R375_NO_BUILD_ATTEMPTED=TRUE'; exit 0 }
          Write-Output ('R375_SOURCE_PATH='+$source)
          $go=(Get-Command go -ErrorAction Stop).Source
          $env:GOTOOLCHAIN='local'
          $env:GOPROXY='off'
          $env:GOSUMDB='off'
          $env:CGO_ENABLED='0'
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $env:GOAMD64='v1'
          $temp=Join-Path $env:RUNNER_TEMP ('r375-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          $out=Join-Path $temp 'ckb-plane.exe'
          try {
            Push-Location $source
            try { & $go build -trimpath -o $out ./cmd/ckb-plane; if ($LASTEXITCODE -ne 0) { throw 'R375_BUILD_FAILED' } }
            finally { Pop-Location }
            $sha=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output ('R375_CANDIDATE_SHA256='+$sha)
            Write-Output ('R375_EXACT_BINARY_MATCH='+($sha -ceq $target))
            Write-Output 'R375_LIVE_CONTROLLER_DATABASE_QUEUE_UNCHANGED=TRUE'
          } finally { Remove-Item -LiteralPath $temp -Recurse -Force -ErrorAction SilentlyContinue }
