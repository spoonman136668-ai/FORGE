name: CKB R390 bounded r4a baseline identity verification
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $exe=Join-Path $release 'bin\ckb-plane.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'MATCHING_EXECUTABLE_MISSING' }
          $exeHash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ('R371_MATCHING_EXE_SHA256='+$exeHash)
          if ($exeHash -cne $target) { throw 'RELEASE_EXECUTABLE_HASH_DRIFT' }
          $root='C:\Users\camar\GolandProjects\ckb-codex-r4a-clean'
          $git=(Get-Command git -ErrorAction Stop).Source
          if(!(Test-Path -LiteralPath (Join-Path $root '.git'))){throw 'R390_GIT_MISSING'}
          $head=(& $git -C $root rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0){throw 'R390_HEAD_FAILED'}
          Write-Output ('R390_HEAD='+$head)
          Write-Output ('R390_EXPECTED_BASELINE=01260dda4bdebc454921cdf0c5d3d0eeafef7629')
          Write-Output ('R390_HEAD_MATCH='+($head -ceq '01260dda4bdebc454921cdf0c5d3d0eeafef7629'))
          $status=@(& $git -C $root status --porcelain)
          if($LASTEXITCODE -ne 0){throw 'R390_STATUS_FAILED'}
          Write-Output ('R390_DIRTY_ENTRIES='+@($status).Count)
          foreach($rel in @('go.mod','cmd\ckb-plane\main.go','internal\plane\autonomy.go','internal\plane\engine.go')){
            $p=Join-Path $root $rel
            if(Test-Path -LiteralPath $p -PathType Leaf){
              Write-Output ('R390_FILE='+$rel+' SHA256='+((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()))
            }
          }
          Write-Output 'R390_READ_ONLY=TRUE'
