name: CKB R394 bounded R220 custody receipt search
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $exe=Join-Path $release 'bin\ckb-plane.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'MATCHING_EXECUTABLE_MISSING' }
          $exeHash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ('R371_MATCHING_EXE_SHA256='+$exeHash)
          if ($exeHash -cne $target) { throw 'RELEASE_EXECUTABLE_HASH_DRIFT' }
          $roots=@('C:\ProgramData\CKBR\release-store\ckb-plane','C:\Users\camar\GolandProjects\ckb-plane','C:\Users\camar\GolandProjects\ckb-plane-dk-work')
          $pattern='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678|PLANE-R220-LIVECOMPAT-20261023'
          $count=0
          foreach($root in $roots){
            if(!(Test-Path -LiteralPath $root -PathType Container)){continue}
            $files=@(Get-ChildItem -LiteralPath $root -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Length -le 1048576 -and $_.Extension -in @('.json','.txt','.md','.yaml','.yml','.log') } | Select-Object -First 1500)
            Write-Output ('R394_ROOT='+$root+' FILES_SCANNED='+$files.Count)
            foreach($file in $files){
              $hit=Select-String -LiteralPath $file.FullName -Pattern $pattern -ErrorAction SilentlyContinue | Select-Object -First 1
              if($hit){Write-Output ('R394_HIT='+$file.FullName+' LINE='+$hit.LineNumber);$count++}
            }
          }
          Write-Output ('R394_TOTAL_HITS='+$count)
          Write-Output 'R394_READ_ONLY=TRUE'
