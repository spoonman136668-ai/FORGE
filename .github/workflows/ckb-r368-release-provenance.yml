name: CKB R410 bounded archive classification
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $files=@(Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue | Where-Object {$_.Extension -in @('.zip','.tar','.gz','.7z','.bundle')})
          Write-Output ('R410_ARCHIVE_TOTAL='+$files.Count)
          foreach($g in ($files | Group-Object Extension)){Write-Output ('R410_EXTENSION='+$g.Name+' COUNT='+$g.Count)}
          $other=@($files | Where-Object {$_.DirectoryName -notlike '*\exports\*'})
          Write-Output ('R410_NOT_EXPORTS='+$other.Count)
          foreach($item in ($other | Select-Object -First 20)){Write-Output ('R410_OTHER='+$item.FullName)}
          Write-Output 'R410_READ_ONLY=TRUE'
