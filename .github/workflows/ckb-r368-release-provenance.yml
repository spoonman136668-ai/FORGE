name: CKB R393 installed R220 release lineage inventory
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $exe=Join-Path $release 'bin\ckb-plane.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'MATCHING_EXECUTABLE_MISSING' }
          $exeHash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ('R371_MATCHING_EXE_SHA256='+$exeHash)
          if ($exeHash -cne $target) { throw 'RELEASE_EXECUTABLE_HASH_DRIFT' }
          $root='C:\ProgramData\CKBR\release-store\ckb-plane\releases'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          $files=@(Get-ChildItem -LiteralPath $root -Filter 'release-manifest.json' -File -Recurse -ErrorAction SilentlyContinue)
          Write-Output ('R393_MANIFEST_COUNT='+$files.Count)
          $matches=0
          foreach($file in $files){
            try{$o=Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json}catch{continue}
            $binary=[string]$o.controller_binary_sha256
            $release=[string]$o.release_id
            if($binary -eq $target -or $release -match '(?i)R220|LIVECOMPAT'){
              Write-Output ('R393_RELEVANT='+$file.FullName+' RELEASE='+$release+' BINARY='+$binary+' SOURCE='+$o.controller_source_tree_sha256+' PARENT='+$o.parent_release_id)
              $matches++
            }
          }
          Write-Output ('R393_RELEVANT_COUNT='+$matches)
          $r220=Join-Path $root 'PLANE-R220-LIVECOMPAT-20261023'
          foreach($file in @(Get-ChildItem -LiteralPath $r220 -File -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.Name -match '(?i)(manifest|receipt|seal|source|provenance|build)' } | Select-Object -First 25)){Write-Output ('R393_R220_FILE='+$file.FullName)}
          Write-Output 'R393_READ_ONLY=TRUE'
