name: CKB R387 bounded retained source archive inventory
on:
  push:
    branches: [audit/ckb-r368-release-provenance-20261026]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    steps:
      - name: Inspect bounded release metadata without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_OWNER_RUNNER' }
          $base='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releases=Join-Path $base 'releases'
          $release=Join-Path $releases 'PLANE-R220-LIVECOMPAT-20261023'
          $target='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          foreach($p in @($base,$releases,$release)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw ('EXPECTED_DIRECTORY_MISSING='+$p) }
          }
          $exe=Join-Path $release 'bin\ckb-plane.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'MATCHING_EXECUTABLE_MISSING' }
          $exeHash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ('R371_MATCHING_EXE_SHA256='+$exeHash)
          if ($exeHash -cne $target) { throw 'RELEASE_EXECUTABLE_HASH_DRIFT' }
          $roots=@('C:\Users\camar\GolandProjects\ckb-plane-autonomy-backups','C:\Users\camar\GolandProjects\ckb-plane-hotfix-backups-b8f53c8fda5241578d44ab60e1df17e5','C:\Users\camar\GolandProjects\ckb-plane-hotfix-backups-r2b-aa5354b50cb14d3f9f19b6c775125733','C:\Users\camar\GolandProjects\ckb-plane-hotfix-backups-r2c-582d3a23da73427390733c4fa266b8c6','C:\Users\camar\GolandProjects\ckb-plane-hotfix-backups-r2c1-ce2d4eb8a2634e10a7526bc62f1872ac','C:\Users\camar\GolandProjects\ckb-plane-hotfix-backups-r2c2-2c51cc0354df4fe886098c1effb0075f')
          foreach($root in $roots){
            if(!(Test-Path -LiteralPath $root -PathType Container)){continue}
            $files=Get-ChildItem -LiteralPath $root -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '(?i)^(main|autonomy|engine)\.go$|\.(zip|tar|tgz|7z)$|manifest' } | Select-Object -First 35
            Write-Output ('R387_ROOT='+$root+' CANDIDATE_COUNT='+@($files).Count)
            foreach($file in $files){Write-Output ('R387_FILE='+$file.FullName+' BYTES='+$file.Length)}
          }
          Write-Output 'R387_READ_ONLY=TRUE'
