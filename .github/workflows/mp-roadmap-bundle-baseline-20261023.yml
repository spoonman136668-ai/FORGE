name: MP installed roadmap bundle test provenance read-only
on:
  push:
    branches: [diagnostics/mp-roadmap-bundle-baseline-20261023]
    paths: [.github/workflows/mp-roadmap-bundle-baseline-20261023.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Read only pinned historical bundle test setup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          function Need([bool]$b,[string]$c){if(-not $b){throw ('MP_BUNDLE_TRIAGE_'+$c)}}
          Need ($env:GITHUB_REPOSITORY -ceq 'spoonman136668-ai/FORGE' -and $env:RUNNER_NAME -ceq 'FORGE-CODEX-REMOTE' -and $env:RUNNER_OS -ceq 'Windows') 'RUNNER'
          Need ($env:GITHUB_REF -ceq 'refs/heads/diagnostics/mp-roadmap-bundle-baseline-20261023' -and $env:GITHUB_EVENT_NAME -ceq 'push') 'BRANCH'
          Need ((& git.exe rev-parse HEAD).Trim() -ceq $env:GITHUB_SHA) 'HEAD'
          Need ((& git.exe rev-parse 'HEAD^').Trim() -ceq '414526289b26ad13725af3850c69fc19ce875e13') 'PARENT'
          $delta=@(& git.exe diff --name-only HEAD^ HEAD)
          Need ($delta.Count -eq 1 -and $delta[0] -ceq '.github/workflows/mp-roadmap-bundle-baseline-20261023.yml') 'SCOPE'
          Need ((@(& git.exe status --porcelain)).Count -eq 0) 'DIRTY'
          Remove-Item Env:GITHUB_TOKEN,Env:GH_TOKEN,Env:OPENAI_API_KEY,Env:AZURE_OPENAI_API_KEY -ErrorAction SilentlyContinue
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $file=Join-Path $root 'internal\plane\roadmap_current_frontier_r7_test.go'
          Need (Test-Path -LiteralPath $file -PathType Leaf) 'FILE_NOT_PRESENT'
          Need (((Get-Item -LiteralPath $file).Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) 'FILE_REPARSE'
          $digest=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          Need ($digest -ceq '5734be369b7bc8e9b1435125ae80f926453399c669a31ed098740e26cd849a41') 'TEST_SOURCE_HASH_DRIFT'
          $lines=@(Get-Content -LiteralPath $file -Encoding UTF8)
          Need ($lines.Count -gt 145 -and $lines.Count -lt 500) 'TEST_SIZE_CHANGED'
          Write-Host 'MP_BUNDLE_SOURCE_TEST_SHA256=PASS'
          for($i=1;$i -le 155;$i++){
             Write-Host ('MP_BUNDLE_SOURCE_LINE_'+$i+'='+$lines[$i-1])
          }
          Write-Host ('MP_BUNDLE_INSTALLED_TEST_LINE_COUNT='+$lines.Count)
          Write-Host 'MP_BUNDLE_SOURCE_READ_ONLY=PASS'
          Write-Host 'MP_BUNDLE_NATIVE_CONTROLLER_INVOCATIONS=0'
          Write-Host 'MP_BUNDLE_LIVE_WRITES=0'

          $dir=Join-Path $root 'internal\plane'
          $goFiles=@(Get-ChildItem -LiteralPath $dir -File -Filter '*.go' -ErrorAction Stop)
          Need ($goFiles.Count -le 900) 'TOO_MANY_GO_FILES'
          $needles=@('git bundle failed','func sourceQueue(','func (p *Engine) reconcilePineSuccessor(', 'func (p *Engine) materializeRoadmapSuccessor(')
          $found=@{}
          foreach($f in $goFiles){
            if(($f.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw 'MP_BUNDLE_SOURCE_ALIAS'}
            $all=@(Get-Content -LiteralPath $f.FullName -Encoding UTF8 -ErrorAction Stop)
            for($idx=0;$idx -lt $all.Count;$idx++){
              foreach($needle in $needles){
                if(-not $all[$idx].Contains($needle)){continue}
                $code=($needle -replace '[^a-zA-Z]','_')
                $n=if($found.ContainsKey($code)){$found[$code]}else{0}
                Need ($n -lt 3) 'EXCESSIVE_MATCHES'
                $found[$code]=$n+1
                Write-Host ('MP_BUNDLE_HIT='+$f.Name+' line='+($idx+1)+' symbol='+$code)
                $start=[Math]::Max(0,$idx-25)
                $end=[Math]::Min($all.Count-1,$idx+65)
                for($i=$start;$i -le $end;$i++){
                  Write-Host ('MP_BUNDLE_CONTEXT_'+$f.Name+'_'+($i+1)+'='+[string]$all[$i])
                }
              }
            }
          }
          Need ($found.Count -ge 2) 'SOURCE_SYMBOL_NOT_FOUND'
          Write-Host 'MP_BUNDLE_CAUSAL_SOURCE_AUDIT=PASS'

          $needles2=@('func (p *Engine) exportCandidateLocked(', 'bundle create', 'bundle', 'func exportCandidate')
          $hits=0
          foreach($f in $goFiles){
            $all=@(Get-Content -LiteralPath $f.FullName -Encoding UTF8)
            for($j=0;$j -lt $all.Count;$j++){
              if(-not $all[$j].Contains('func (p *Engine) exportCandidateLocked(') -and
                 -not ($all[$j].Contains('bundle') -and $all[$j].Contains('git('))){
                continue
              }
              $hits++
              Need ($hits -le 12) 'UNBOUNDED_BUNDLE_HITS'
              Write-Host ('MP_BUNDLE_EXPORT_HIT='+$f.Name+':'+($j+1))
              for($k=[Math]::Max(0,$j-6);$k -le [Math]::Min($all.Count-1,$j+115);$k++){
                Write-Host ('MP_BUNDLE_EXPORT_LINE_'+$f.Name+'_'+($k+1)+'='+[string]$all[$k])
              }
            }
          }
          Need ($hits -gt 0) 'NO_EXPORT_CODE'
          Write-Host 'MP_BUNDLE_EXPORT_SOURCE_TRACE=PASS'

          $findFunction=@('func gitContext(', 'func git(', 'func prepare(', 'func setup(')
          $seen=@{}
          foreach($f in $goFiles){
            $all=@(Get-Content -LiteralPath $f.FullName -Encoding UTF8)
            for($i=0;$i -lt $all.Count;$i++){
              foreach($symbol in $findFunction){
                if(-not $all[$i].Contains($symbol)){continue}
                if($seen.ContainsKey($symbol)){throw ('MP_BUNDLE_DUPLICATE_SYMBOL_'+$symbol)}
                $seen[$symbol]=$f.Name
                Write-Host ('MP_BUNDLE_FUNCTION_HIT='+$symbol+' FILE='+$f.Name+' LINE='+($i+1))
                for($j=$i;$j -le [Math]::Min($all.Count-1,$i+92);$j++){
                  Write-Host ('MP_BUNDLE_FUNCTION_LINE_'+$f.Name+'_'+($j+1)+'='+[string]$all[$j])
                }
              }
            }
          }
          Need ($seen.Count -ge 3) 'SYMBOLS_NOT_FOUND'
          Write-Host 'MP_BUNDLE_HELPER_SOURCE_TRACE=PASS'
