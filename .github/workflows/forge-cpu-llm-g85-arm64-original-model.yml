name: FORGE CPU LLM Evaluation G85 native ARM64 GPT2 Shakespeare replication
on:
  push:
    branches: [research/cpu-llm-g85-arm64-shakespeare-20261031]
    paths:
      - '.github/workflows/forge-cpu-llm-g85-arm64-original-model.yml'
      - 'research/cpu_g85/**'
permissions:
  contents: write
concurrency:
  group: forge-cpu-llm-g85-native-arm64
  cancel-in-progress: true
jobs:
  frozen-source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact G70 source, prereg-before-code and source blobs
        shell: bash
        run: |
          set -euo pipefail
          BASE=20a540d0241519e2e9d90ace868ffd6db60bd065
          PREREG=275284b5c2fffd8031fe2caaa570793e3fe6941a
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          git merge-base --is-ancestor "$PREREG" HEAD
          test "$(git rev-parse HEAD:docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-PREREG-20261031.md)" = "aee2742c42bf4c24e36ddfa6164e110a0308e999"
          test "$(git rev-parse HEAD:research/cpu_g85/g85_arm64_shakespeare.py)" = "4fc81d9c8cdba49fd4a7f5dfcf30709563db06f9"
          test "$(git rev-parse HEAD:research/cpu_g85/test_g85_arm64_shakespeare.py)" = "2d836a9273e6a54dafe4228cc8e07cd6cf05d592"
          git diff --exit-code "$BASE" HEAD -- research/llm_g54 research/llm_g55 research/llm_g56 research/llm_g57 research/llm_g58 research/llm_g59 research/llm_g60 research/llm_g61 research/llm_g62 research/llm_g63 research/llm_g64 research/llm_g65 research/llm_g66 research/llm_g67 research/llm_g68 research/llm_g70
          python -B -m py_compile research/cpu_g85/g85_arm64_shakespeare.py research/cpu_g85/test_g85_arm64_shakespeare.py
          python -B -m unittest discover -s research/cpu_g85 -p 'test_g85_arm64_shakespeare.py' -v
          echo CPU_G85_ARM64_FROZEN_SOURCE_ADMISSION=PASS
  arm64-original-model:
    needs: frozen-source-admission
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify native ARM64 and frozen sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "aarch64"
          test "$RUNNER_ARCH" = "ARM64"
          test "$(git rev-parse HEAD:research/cpu_g85/g85_arm64_shakespeare.py)" = "4fc81d9c8cdba49fd4a7f5dfcf30709563db06f9"
          test "$(git rev-parse HEAD:docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-PREREG-20261031.md)" = "aee2742c42bf4c24e36ddfa6164e110a0308e999"
          lscpu | tee cpu_g85_lscpu.txt
          python - <<'PY'
          import platform,sys
          assert sys.version_info[:2] == (3,11)
          assert platform.system()=="Linux" and platform.machine().lower() in ("aarch64","arm64")
          print("G85_NATIVE_MACHINE="+platform.machine())
          print("G85_PROCESSOR="+platform.processor())
          PY
          python -B -m unittest discover -s research/cpu_g85 -p 'test_g85_arm64_shakespeare.py' -v
      - name: Install pinned native ARM64 CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install --disable-pip-version-check 'transformers==4.48.3' 'huggingface_hub==0.30.2' 'safetensors==0.5.3' 'tokenizers==0.21.1' 'psutil==7.1.3'
          python -m pip check
          python - <<'PY'
          import torch,transformers,platform
          assert platform.machine().lower() in ("aarch64","arm64")
          assert torch.__version__.startswith("2.5.1")
          assert torch.version.cuda is None
          assert transformers.__version__=="4.48.3"
          print("G85_ARM64_RUNTIME="+torch.__version__)
          print("G85_ARM64_CPU_ONLY=PASS")
          PY
          python -m pip freeze > cpu_g85_arm64_environment.txt
      - name: Run authentic original GPT2 on native ARM64
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/cpu_g85/g85_arm64_shakespeare.py
          python - <<'PY'
          import json,platform
          r=json.load(open("cpu_g85_arm64_result.json",encoding="utf-8"))
          assert r["gate"]=="CPU_G85"
          assert r["runtime"]["os_name"]=="posix"
          assert r["runtime"]["machine"].lower() in ("aarch64","arm64")
          assert r["engineering"]=="PASS" and r["correctness"]=="PASS"
          assert r["summary"]["timed_authentic_responses"]==180
          assert r["summary"]["timed_authentic_generated_tokens"]==1440
          assert len(r["original_paired_trials"])==60
          assert r["transfer"] in ("TRANSFER_PASS","TRANSFER_FAIL")
          assert r["scientific_acceptance"]=="NOT_GRANTED" and not r["promotion_allowed"]
          print("CPU_G85_ARM64_TRANSFER="+r["transfer"])
          PY
      - name: Upload original receipt and hardware inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-g85-native-arm64-original-shakespeare
          retention-days: 30
          if-no-files-found: warn
          path: |
            cpu_g85_arm64_result.json
            cpu_g85_arm64_environment.txt
            cpu_g85_lscpu.txt
      - name: Commit immutable original result to research branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f cpu_g85_arm64_result.json
          git fetch origin refs/heads/research/cpu-llm-g85-arm64-shakespeare-20261031
          git reset --hard FETCH_HEAD
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          cp cpu_g85_arm64_result.json docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-ORIGINAL-RESULT-20261031.json
          cp cpu_g85_arm64_environment.txt docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-ENVIRONMENT-20261031.txt
          cp cpu_g85_lscpu.txt docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-LSCPU-20261031.txt
          sha256sum docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-ORIGINAL-RESULT-20261031.json > docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-ORIGINAL-RESULT-20261031.json.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-ORIGINAL-RESULT-20261031.json docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-ENVIRONMENT-20261031.txt docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-LSCPU-20261031.txt docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-ORIGINAL-RESULT-20261031.json.sha256
          git commit -m 'research(CPU G85): preserve authentic ARM64 GPT2 receipt'
          git push origin HEAD:research/cpu-llm-g85-arm64-shakespeare-20261031
