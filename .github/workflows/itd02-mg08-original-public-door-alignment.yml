name: ITD-02 MG08 real MiniGrid DoorKey original public key/door conjunction diagnostic
on:
  push:
    branches: [research/itd02-mg08-key-door-public-alignment-20261028]
permissions:
  contents: read
jobs:
  authentic-source-temporal-native-and-conventional:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Exact Git source newline policy
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Clean source Git checkout without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Original Python 3.11 source runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Native Go source compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Source-pin authentic original Farama and run five native/conventional roles twice
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash research/lcrm01/mg08_ci.sh
      - name: Preserve BOTH original source complete selected-feedback runs, including errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-mg08-original-doorkey-native-public-temporal-vs-parent-and-conventional
          path: |
            ${{ runner.temp }}/mg08/first.json
            ${{ runner.temp }}/mg08/second.json
            ${{ runner.temp }}/mg08/comparison.json
            ${{ runner.temp }}/mg08/first.log
            ${{ runner.temp }}/mg08/second.log
          retention-days: 30
          if-no-files-found: warn
