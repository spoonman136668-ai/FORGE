name: AC23 source-pinned local self-reconstruction FIT-only mechanism
on:
  pull_request:
    paths:
      - 'research/ac07_sourcefree/ac23_*'
      - 'research/ac07_sourcefree/test_ac23_*'
      - 'docs/research/AC-23-*'
      - '.github/workflows/forge-ac23-local-reconstruction.yml'
permissions:
  contents: read
  actions: read
jobs:
  local-source-free:
    name: AC23 reward-blind local pulse diagnosis / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ac15_sha: 68508db981776033d403094f237c17dbbfbadf822ac9eca011feb05d50cba286
          - os: windows-latest
            ac15_sha: 071512caf92b82d8b3ed619d79d7741447be72bde29ae9b1b64fd42de2e39077
    steps:
      - name: Checkout external development branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python standard library only
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch immutable original public FIT report, no new source calls
        uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 40797373953
          github-token: ${{ github.token }}
          name: forge-ac07-${{ matrix.os }}-sourcefree-restricted
          path: frozen-source
      - name: Verify previously authenticated source before any fit
        shell: bash
        run: |
          set -euo pipefail
          python - "frozen-source/ac15-report.json" "${{ matrix.ac15_sha }}" <<'PY'
          import hashlib,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          assert p.is_file()
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          assert h==sys.argv[2],(h,sys.argv[2])
          print("AC23_ORIGINAL_PUBLIC_FIT_REPORT_SHA256="+h)
          PY
      - name: Focused local-only reward independence and FIT protocol tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/ac07_sourcefree -p 'test_ac23_*.py' -v
      - name: Run 8 fixed FIT-only folds with full-information controls
        shell: bash
        run: |
          set -euo pipefail
          python -B research/ac07_sourcefree/ac23_local_pulse_reconstruction.py --ac15-report "$GITHUB_WORKSPACE/frozen-source/ac15-report.json" --sha256 "${{ matrix.ac15_sha }}" --out "$RUNNER_TEMP/ac23-fit-only.json"
          python - "$RUNNER_TEMP/ac23-fit-only.json" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["schema"]=="forge.ac23.fit-only-public-local-self-reconstruction.v1"
          assert r["ac22_original_parent_sha"]=="60c33599de4bc2403ecf93dff6c1d8f61d180a24"
          assert r["dtr_original_source_commit"]=="c94e9a4cd3641588b6b8507e71ccee5c27032bdf"
          assert r["source_fit_episodes_reused"]==8 and r["original_fit_left_out_folds"]==8
          assert r["train_per_fold"]==7 and r["dev_records_read"]==0
          assert r["new_dtr_imports_calls_or_episodes"]==0
          assert r["local_candidate"]["metric"]["n"]==8
          assert r["local_candidate"]["fit_head_updates_per_fold"]==168
          assert r["local_candidate"]["local_pulse_reconstruction_calls_total"]==2688
          assert r["local_candidate"]["trained_parameter_count"]==10
          assert r["local_candidate"]["local_gate_learning_rate"]==0.20
          assert r["local_gate_update_not_dependent_on_reward_or_distant_state"] is True
          assert r["head_stage1_receives_two_hop_locally_transported_public_history"] is True
          assert r["transport_signal_tags_remain_handcrafted"] is True
          assert r["parent_fitted_controls"]["matched_ten_coefficient_full_history_logistic"]["n"]==8
          assert len(r["local_candidate"]["folds"])==8
          for key in ("native_original_or_active_ygg_code_modified","wingless_source_modified",
                      "forge_controller_queue_or_authority_modified","source_first_use",
                      "source_on_policy_actions_returns_measured","unknown_family_transfer_tested",
                      "scientific_admission"):
              assert r[key] is False,key
          print("AC23_FROZEN_SOURCE_FIT_ONLY_AND_LOCALITY=PASS")
          print("AC23_REPORT_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Retain per-platform full negative or positive FIT-only evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ac23-public-fit-reconstruction-${{ matrix.os }}
          path: ${{ runner.temp }}/ac23-fit-only.json
          retention-days: 30
          if-no-files-found: error
