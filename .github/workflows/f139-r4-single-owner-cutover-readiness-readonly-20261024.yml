name: F139 R7D original gh credential precedence probe (read only)
on:
  push:
    branches: [audit/f139-r4-single-owner-readiness-20261024]
    paths: [.github/workflows/f139-r4-single-owner-cutover-readiness-readonly-20261024.yml]
permissions:
  contents: read
jobs:
  original-owner:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 6
    steps:
      - name: Isolated exact G4 candidate source checkout (not installed original)
        uses: actions/checkout@v4
        with:
          ref: 7844ae6b0e75ce5c1f83de8e47c13457a34e0e0e
          path: f139-g4-readonly-source
          persist-credentials: false
      - name: Inspect original owner task and complete immutable SQLite readiness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){throw 'F139_R4_WRONG_RUNNER'}
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if(@($task.Actions).Count -ne 1 -or @($task.Triggers).Count -ne 3){throw 'F139_R4_TASK_SHAPE_DRIFT'}
          if([string]$task.State -cnotin @('Ready','Running')){throw 'F139_R4_TASK_NOT_ENABLED'}
          $options=[string]$task.Actions[0].Arguments
          function ReadArg([string]$name) {
            $m=[regex]::Match($options,'(?i)(?:^|\s)-'+$name+'\s+"([^"]+)"')
            if(-not $m.Success){throw 'F139_R4_TASK_ARGS_DRIFT'}
            return $m.Groups[1].Value
          }
          $root=ReadArg 'RepositoryRoot'
          $db=ReadArg 'Database'
          $python=ReadArg 'PythonExe'
          if([IO.Path]::GetFullPath($db) -ine
             [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'FORGE-F139\state.sqlite'))){
            throw 'F139_R4_OWNER_DB_ROUTE_DRIFT'
          }
          $source=(& git.exe -C $root rev-parse HEAD | Out-String).Trim()
          if($source -cne '8eca700c39223e176dea55f488b6f3397ce4e27a'){
            throw 'F139_R4_OWNER_INSTALLED_SHA_DRIFT'
          }
          Write-Host ('F139_R4_ORIGINAL_TASK_STATE=' + [string]$task.State)
          $check=@'
          import hashlib,json,pathlib,sqlite3,sys
          root=pathlib.Path(sys.argv[1]).resolve(strict=True)
          dbpath=pathlib.Path(sys.argv[2]).resolve(strict=True)
          conn=sqlite3.connect(dbpath.as_uri()+"?mode=ro",uri=True,timeout=20)
          conn.row_factory=sqlite3.Row
          conn.execute("PRAGMA query_only=ON")
          try:
              m=conn.execute("SELECT source_sha,head_seq,head_hash,enabled,legacy_suspended FROM meta WHERE id=1").fetchone()
              assert m is not None and m["source_sha"]=="8eca700c39223e176dea55f488b6f3397ce4e27a"
              assert m["enabled"]==1 and m["legacy_suspended"]==1
              active=conn.execute("SELECT stage,count(*) AS n FROM tasks WHERE stage NOT IN ('VERIFIED','QUARANTINED') GROUP BY stage").fetchall()
              active=[(r["stage"],r["n"]) for r in active]
              total=conn.execute("SELECT count(*) FROM tasks").fetchone()[0]
              native=conn.execute("SELECT count(*) FROM events WHERE kind='NATIVE_DEVELOPMENT_ADMITTED'").fetchone()[0]
              assert native>=22 and m["head_seq"]>=206
              prev="0"*64
              seq=0
              for row in conn.execute("SELECT seq,kind,payload,prior_sha,sha FROM events ORDER BY seq"):
                  seq+=1
                  assert row["seq"]==seq and row["prior_sha"]==prev
                  payload=json.loads(row["payload"])
                  canon=lambda o:(json.dumps(o,sort_keys=True,separators=(",",":"),ensure_ascii=True)+"\n").encode()
                  assert row["payload"]==canon(payload).decode("ascii")
                  expect=hashlib.sha256(canon({"seq":seq,"kind":row["kind"],"payload":payload,"prior_sha":prev})).hexdigest()
                  assert expect==row["sha"]
                  prev=row["sha"]
              assert seq==m["head_seq"] and prev==m["head_hash"]
              print("F139_R4_ACTIVE_NONTERMINAL_COUNT="+str(sum(x[1] for x in active)))
              print("F139_R4_ORIGINAL_TOTAL_TASKS="+str(total))
              print("F139_R4_ORIGINAL_NATIVE_ADMISSIONS="+str(native))
              print("F139_R4_ORIGINAL_EVENT_CHAIN=PASS")
              print("F139_R4_ORIGINAL_EVENT_HEAD="+str(seq))
              print("F139_R4_INSTALLED_SOURCE_PIN=PASS")
              print("F139_R4_NO_READONLY_AUDIT_MUTATIONS=TRUE")
              print("F139_R4_OWNER_MIGRATION_PERFORMED=FALSE")
              assert not active, "F139_R4_WORK_PRESENT_NO_CUTOVER"
              print("F139_R4_NO_ACTIVE_WORK=PASS")
              # R5: certify negative-history and source-transition capacity
              # using original installed source against the SAME ro connection.
              import types
              from f139.local_controller import Database
              from f139.nci04_owner_ledger import verify_native_activation
              from f139.nci04_negative_owner_store import (
                  verify_original_negative_custody, TICKET as first_negative)
              from f139.nci04_split_negative_owner_store import (
                  verify_second_negative_custody, TICKET as second_negative)
              view=types.SimpleNamespace(conn=conn,filename=dbpath)
              view.meta=lambda:Database.meta(view)
              view.verified_native_provider_failures=lambda **kw:(
                  Database.verified_native_provider_failures(view,**kw))
              assert verify_original_negative_custody(view)
              assert verify_second_negative_custody(view)
              provider=view.verified_native_provider_failures()
              assert provider
              negative={r["ticket"] for r in conn.execute(
                  "SELECT ticket FROM tasks WHERE stage='QUARANTINED'")}
              assert negative==({first_negative,second_negative}|set(provider))
              assert verify_native_activation(view)
              transitions=[json.loads(r["payload"]) for r in conn.execute(
                  "SELECT payload FROM events WHERE kind='SOURCE_TRANSITION_ADMITTED' ORDER BY seq")]
              assert transitions and transitions[-1]["to_source_sha"]==m["source_sha"]
              last=transitions[-1]
              v4=[t for t in transitions if t["schema"]=="forge.f139.source-transition.v4"]
              v5=[t for t in transitions if t["schema"]=="forge.f139.source-transition.v5"]
              assert last["schema"] in (
                  "forge.f139.source-transition.v4","forge.f139.source-transition.v5")
              if len(v4)==10:
                  assert len(v5)<4
                  next_schema="forge.f139.source-transition.v5"
              else:
                  assert len(v4)<10 and not v5
                  next_schema="forge.f139.source-transition.v4"
              print("F139_R5_ORIGINAL_NEGATIVE_ZIP_CUSTODY=PASS")
              print("F139_R5_SECOND_NEGATIVE_ZIP_CUSTODY=PASS")
              print("F139_R5_VERIFIED_PROVIDER_FAILURES="+str(len(provider)))
              print("F139_R5_QUARANTINED_TASKS="+str(len(negative)))
              print("F139_R5_NEGATIVE_SET_EXACT=PASS")
              print("F139_R5_NATIVE_CURRENT_SOURCE_ACTIVATED=PASS")
              print("F139_R5_V4_TRANSITIONS="+str(len(v4)))
              print("F139_R5_V5_TRANSITIONS="+str(len(v5)))
              print("F139_R5_NEXT_TRANSITION_SCHEMA="+next_schema)
              print("F139_R5_TRANSITION_CAPACITY=PASS")
              print("F139_R5_OWNER_MUTATION=FALSE")
          finally:
              conn.close()
          '@
          & $python -B -c $check $root $db
          if($LASTEXITCODE -ne 0){throw 'F139_R4_READINESS_FAILED'}

          # R6: original running-owner profile and G4 source availability,
          # strictly read-only, AFTER R5 immutable ledger/custody PASS.
          # This does not impersonate a live G4 owner tick or authorize cutover.
          if([string]$task.State -cne 'Running'){throw 'F139_R6_TASK_NOT_RUNNING'}
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          $principal=[string]$task.Principal.UserId
          $sid=''
          try {
            $sid=(New-Object Security.Principal.NTAccount($principal)).Translate(
              [Security.Principal.SecurityIdentifier]).Value
          } catch {}
          if($principal -ine $who.Name -and $sid -cne $who.User.Value){
            throw 'F139_R6_TASK_OWNER_SID_DRIFT'
          }
          if([IO.Path]::GetFileName([string]$task.Actions[0].Execute) -ine 'powershell.exe'){
            throw 'F139_R6_TASK_EXECUTABLE_DRIFT'
          }
          $wrapper=ReadArg 'File'
          if([IO.Path]::GetFileName($wrapper) -cne 'Run-FORGE-F139.ps1'){
            throw 'F139_R6_WRAPPER_DRIFT'
          }
          $actual=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction Stop |
            Where-Object { $_.CommandLine -and
              $_.CommandLine.Contains('f139.local_controller') -and
              $_.CommandLine.Contains($db) -and
              $_.CommandLine.Contains('loop') })
          if($actual.Count -ne 1){throw 'F139_R6_OWNER_CHILD_COUNT_DRIFT'}
          $p=$actual[0]
          if([int]$p.ProcessId -le 0 -or [int]$p.ParentProcessId -le 0){
            throw 'F139_R6_OWNER_CHILD_PID_INVALID'
          }
          $parent=Get-CimInstance Win32_Process -Filter "ProcessId=$($p.ParentProcessId)" -ErrorAction Stop
          if(-not $parent -or $parent.Name -ine 'powershell.exe' -or
             -not $parent.CommandLine -or
             -not $parent.CommandLine.Contains('Run-FORGE-F139.ps1')){
            throw 'F139_R6_OWNER_PARENT_ROUTE_DRIFT'
          }
          $dirty=@(& git.exe -C $root status --porcelain --untracked-files=all)
          if($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0){throw 'F139_R6_INSTALLED_CHECKOUT_DIRTY'}
          $head=@(& git.exe -C $root ls-remote origin 'refs/heads/dev/f139-g2-g3-publisher-compatibility-20261024')
          if($LASTEXITCODE -ne 0 -or $head.Count -ne 1 -or
             -not $head[0].StartsWith('7844ae6b0e75ce5c1f83de8e47c13457a34e0e0e')){
            throw 'F139_R6_G4_CANDIDATE_IDENTITY_DRIFT'
          }
          Write-Host 'F139_R6_ORIGINAL_WINDOWS_TASK_AND_SID=PASS'
          Write-Host 'F139_R6_RUNNING_OWNER_PROCESS_ANCESTRY=PASS'
          Write-Host 'F139_R6_INSTALLED_OLD_SOURCE_CLEAN=PASS'
          Write-Host 'F139_R6_G4_REMOTE_CANDIDATE_PIN=PASS'
          Write-Host 'F139_R6_NO_OWNER_DB_TASK_OR_REF_MUTATION=TRUE'
          Write-Host 'F139_R6_G4_LIVE_CUTOVER_PERFORMED=FALSE'

          # R7: execute G4's ACTUAL original ledger + GitHub publisher
          # preflight, on authenticated original installed source/DB.
          # Original task stays Running. Neither publisher nor writer is called.
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'f139-g4-readonly-source'
          $sourceHead=(& git.exe -C $candidate rev-parse HEAD | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or
             $sourceHead -cne '7844ae6b0e75ce5c1f83de8e47c13457a34e0e0e'){
            throw 'F139_R7_G4_ISOLATED_CHECKOUT_DRIFT'
          }
          $py=@'
          import json,pathlib,sqlite3,subprocess,sys
          original_root=pathlib.Path(sys.argv[1]).resolve(strict=True)
          db_path=pathlib.Path(sys.argv[2]).resolve(strict=True)
          candidate=pathlib.Path(sys.argv[3]).resolve(strict=True)
          sys.path.insert(0,str(candidate))
          import os,re,shutil
          cli=shutil.which("gh")
          assert cli is not None, "F139_R7_GH_CLI_MISSING"
          def probe_gh(args):
              p=subprocess.run(["gh",*args],stdin=subprocess.DEVNULL,
                stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=20,check=False)
              output=(p.stderr+p.stdout).decode("utf-8","replace")
              codes=re.findall(r"(?<![0-9])(?:401|403|404|429|500|502|503)(?![0-9])",output)
              return p.returncode, sorted(set(codes))
          status,_=probe_gh(["auth","status"])
          print("F139_R7_GH_AUTH_STATUS="+("PASS" if status==0 else "FAIL"))
          rc,http_codes=probe_gh(["api","repos/spoonman136668-ai/FORGE/issues/807"])
          print("F139_R7_GH_ISSUE_READ="+("PASS" if rc==0 else "FAIL"))
          if rc!=0:
              print("F139_R7_GH_SAFE_HTTP_CODES="+",".join(http_codes or ["NONE"]))
          # Check whether inherited credential environment obscures the
          # user-installed gh login. Never print tokens, passwords, or hosts.yml.
          print("F139_R7D_ENV_GH_TOKEN_PRESENT="+str(bool(os.environ.get("GH_TOKEN"))))
          print("F139_R7D_ENV_GITHUB_TOKEN_PRESENT="+str(bool(os.environ.get("GITHUB_TOKEN"))))
          print("F139_R7D_ENV_GH_CONFIG_DIR_PRESENT="+str(bool(os.environ.get("GH_CONFIG_DIR"))))
          appdata=pathlib.Path(os.environ.get("APPDATA","")) if os.environ.get("APPDATA") else None
          print("F139_R7D_DEFAULT_HOSTS_CONFIG_EXISTS="+str(
              bool(appdata and (appdata/"GitHub CLI"/"hosts.yml").is_file())))
          clean_env=os.environ.copy()
          for var in ("GH_TOKEN","GITHUB_TOKEN","GH_ENTERPRISE_TOKEN"):
              clean_env.pop(var,None)
          def auth_check(cmd,env):
              p=subprocess.run(["gh",*cmd],env=env,
                stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,
                stderr=subprocess.PIPE,timeout=30,check=False)
              err=(p.stdout+p.stderr).decode("utf-8","replace")
              http=re.findall(r"(?<![0-9])(?:401|403|404|429)(?![0-9])",err)
              return p.returncode,sorted(set(http)),p.stdout.decode("utf-8","replace").strip()
          cr,_,_=auth_check(["auth","status","-h","github.com"],clean_env)
          print("F139_R7D_CLEAN_ENV_GH_AUTH="+("PASS" if cr==0 else "FAIL"))
          cr2,codes,userid=auth_check(["api","user","--jq",".login"],clean_env)
          print("F139_R7D_CLEAN_ENV_IDENTITY="+(
              "EXPECTED" if cr2==0 and userid=="spoonman136668-ai"
              else "OTHER" if cr2==0 else "UNAVAILABLE"))
          if cr2!=0: print("F139_R7D_CLEAN_ENV_HTTP_CODES="+",".join(codes or ["NONE"]))
          if cr==0 and cr2==0 and userid=="spoonman136668-ai":
              # Only process-local environment normalization.
              for var in ("GH_TOKEN","GITHUB_TOKEN","GH_ENTERPRISE_TOKEN"):
                  os.environ.pop(var,None)
              status,rc=0,0
              print("F139_R7D_ORIGINAL_GH_NORMALIZATION=PASS")
          else:
              print("F139_R7D_ORIGINAL_GH_NORMALIZATION=BLOCKED")
          owner_auth_qualified=(status==0 and rc==0)
          from f139.local_controller import Database,GitHub
          from f139.nci04_candidate_publisher import publisher_preflight,RECIPE_G3
          from f139.nci04_owner_publication import history_proof,G1_ORIGINAL_PARENT
          from f139.nci04_owner_ledger import verify_native_activation
          conn=sqlite3.connect(db_path.as_uri()+"?mode=ro",uri=True,timeout=20)
          conn.row_factory=sqlite3.Row
          conn.execute("PRAGMA query_only=ON")
          obj=object.__new__(Database)
          obj.filename=db_path
          obj.conn=conn
          try:
              obj.verify()
              meta=obj.meta()
              assert meta["source_sha"]=="8eca700c39223e176dea55f488b6f3397ce4e27a"
              assert verify_native_activation(obj) and not obj.actives() and obj.ready() is None
              before=meta["head_hash"]
              consumed,identities=history_proof(obj)
              print("F139_R7_ORIGINAL_G1_NEGATIVE_AND_22_ADMISSIONS=PASS")
              assert len(identities)==22
              api=GitHub()
              plan=publisher_preflight(
                api.native_repo_get,source_sha=meta["source_sha"],
                parent_commit=G1_ORIGINAL_PARENT,historical_sha256=before,
                consumed_mechanisms=consumed,
                existing_candidate_identities=identities,recipe=RECIPE_G3)
              assert plan["writes_authorized"] is False
              assert plan["no_scientific_acceptance"] is True
              assert plan["recipe"]==RECIPE_G3 and plan["lane"]=="Yggdrasil"
              assert plan["parent_commit"]==G1_ORIGINAL_PARENT
              assert plan["candidate_identity"] not in identities
              assert plan["branch"].startswith("f139/auto-g2-ygg-")
              print("F139_R7_REAL_G3_GITHUB_SOURCE_AND_PR_HISTORY=PASS")
              print("F139_R7_NEW_CANDIDATE_DEDUP=PASS")
              after=obj.meta()["head_hash"]
              assert before==after
              print("F139_R7_OWNER_SQLITE_UNCHANGED=PASS")
              print("F139_R7_G3_PREFLIGHT_IDENTITY=ORIGINAL_WINDOWS_OWNER")
              print("F139_R7_G3_DRAFT_PUBLICATION=NOT_ATTEMPTED")
              print("F139_R7_SCIENTIFIC_FIRST_USE=FALSE")
          finally:
              conn.close()
          if not owner_auth_qualified:
              raise RuntimeError("F139_R7_ORIGINAL_OWNER_GH_AUTH_UNQUALIFIED_NO_CUTOVER")
          '@
          & $python -B -c $py $root $db $candidate
          if($LASTEXITCODE -ne 0){throw 'F139_R7_G3_REAL_PREFLIGHT_UNQUALIFIED'}
