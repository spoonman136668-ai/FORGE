name: K-Terminal RC2-P initial-order and post-order latency boundaries
on:
  push:
    branches: [diagnostics/kterminal-original-local-preflight-20261019]
    paths: [.github/workflows/kt-rc2p-initial-order-boundaries.yml]
permissions:
  contents: read
concurrency:
  group: kterm-rc2p-native-first-order-20261020
  cancel-in-progress: false
jobs:
  windows-initial-order:
    runs-on: windows-latest
    timeout-minutes: 19
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOFLAGS: '-p=1'
      GOMAXPROCS: '2'
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
    steps:
      - name: Checkout FORGE test-only tooling without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout exact private K-Terminal original
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: eb5d225ae73b698a59c68d840daf1ec678e1a0ec
          path: kt-original
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Checkout exact unmerged K-Terminal PR73 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: b8c2052d530cdff93462dfccc21b28f3824e5531
          path: kt-candidate
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Use original Go 1.26.5 on Windows
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Enforce frozen source pins and prohibit real broker credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/FORGE
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/diagnostics/kterminal-original-local-preflight-20261019
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git -C kt-original rev-parse HEAD)" = eb5d225ae73b698a59c68d840daf1ec678e1a0ec
          test "$(git -C kt-candidate rev-parse HEAD)" = b8c2052d530cdff93462dfccc21b28f3824e5531
          test -z "$(git -C kt-original status --porcelain)"
          test -z "$(git -C kt-candidate status --porcelain)"
          go version | grep -F 'go1.26.5 windows/amd64'
          for n in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET; do test -z "${!n:-}"; done
          echo KTERM_RC2P_PRIVATE_SOURCE_PINS_AND_NO_BROKER=PASS
      - name: Compare native first order and dashboard phases under normal and synthetic fsync load
        shell: bash
        run: |
          set -euo pipefail
          python -B qualification/kterminal/rc2p_initial_order_harness.py \
            kt-original kt-candidate \
            qualification/kterminal/rc2p_first_order_boundaries_test.go \
            qualification/kterminal/rc2o_synthetic_fsync_pressure.py \
            "$RUNNER_TEMP/kterm-rc2p-native-evidence"
          echo KTERM_RC2P_COMPLETE_FINANCIAL_REGRESSION=NOT_RUN
          echo KTERM_RC2P_ACTUAL_PAPER_FILL_AND_WPF_PAINT=NOT_CLAIMED
          echo KTERM_RC2P_RELEASE=BLOCKED
      - name: Retain redacted phase measurements without source or financial fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kterm-rc2p-native-phases-${{ github.run_id }}
          path: ${{ runner.temp }}/kterm-rc2p-native-evidence/rc2p-redacted-initial-order.json
          if-no-files-found: warn
          retention-days: 20
