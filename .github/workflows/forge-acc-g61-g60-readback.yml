name: FORGE ACC G61 read back G60 evidence
on:
  push:
    branches: [research/acc-g60-cuda-runtime-20261030]
    paths: ['.github/workflows/forge-acc-g61-g60-readback.yml']
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: forge-acc-g61-evidence-only
  cancel-in-progress: false
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Read existing G60 Actions run and independently validate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import io, json, os, sys, zipfile, urllib.request, urllib.error
          root="https://api.github.com/repos/spoonman136668-ai/FORGE"
          sha="34cff5dff81407688e010f9abff0f33a253cf655"
          branch="research/acc-g60-cuda-runtime-20261030"
          h={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"forge-g61-readback"}
          def api(path,data=None):
              req=urllib.request.Request(root+path,headers=h,data=json.dumps(data).encode() if data is not None else None,method="POST" if data is not None else "GET")
              with urllib.request.urlopen(req,timeout=30) as resp: return json.load(resp)
          def artifact_bytes(artifact_id):
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,req,fp,code,msg,headers,newurl): return None
              req=urllib.request.Request(root+"/actions/artifacts/"+str(artifact_id)+"/zip",headers=h)
              try:
                  with urllib.request.build_opener(NoRedirect()).open(req,timeout=30) as resp: return resp.read()
              except urllib.error.HTTPError as exc:
                  if exc.code not in (301,302,303,307,308): raise
                  target=exc.headers.get("Location","")
                  if not target.startswith("https://"): raise RuntimeError("INVALID_ARTIFACT_REDIRECT")
                  with urllib.request.urlopen(urllib.request.Request(target,headers={"User-Agent":"forge-g61-readback"}),timeout=30) as resp: return resp.read()
          result={"status":"UNVERIFIED","source_sha":sha,"scientific_acceptance":"NOT_GRANTED","model_benchmark_executed":False}
          try:
              runs=api("/actions/workflows/forge-acc-g59-hardware-census.yml/runs?branch="+branch+"&per_page=100")["workflow_runs"]
              matches=[r for r in runs if r.get("head_sha")==sha and r.get("event")=="push"]
              if len(matches)!=1: raise RuntimeError("SOURCE_RUN_COUNT_"+str(len(matches)))
              run=matches[0]
              result.update(run_id=run["id"],url=run["html_url"],run_conclusion=run.get("conclusion"))
              jobs=api("/actions/runs/"+str(run["id"])+"/jobs?per_page=100")["jobs"]
              jobs=[j for j in jobs if j.get("name")=="g60-cuda-runtime-only"]
              if len(jobs)!=1: raise RuntimeError("GPU_JOB_NOT_FOUND")
              j=jobs[0]
              steps=[s for s in j.get("steps",[]) if s.get("name")=="Install isolated CUDA 12.8 torch and execute actual GPU matmul"]
              result.update(job_conclusion=j.get("conclusion"),gpu_step_conclusion=steps[0].get("conclusion") if len(steps)==1 else "MISSING")
              if any(result[k]!="success" for k in ("run_conclusion","job_conclusion","gpu_step_conclusion")): raise RuntimeError("RUN_JOB_STEP_NOT_SUCCESS")
              arts=api("/actions/runs/"+str(run["id"])+"/artifacts?per_page=100")["artifacts"]
              arts=[a for a in arts if a.get("name")=="acc-g60-cuda-admission" and not a.get("expired")]
              if len(arts)!=1: raise RuntimeError("ADMISSION_ARTIFACT_NOT_FOUND")
              result["artifact_id"]=arts[0]["id"]
              with zipfile.ZipFile(io.BytesIO(artifact_bytes(arts[0]["id"]))) as z:
                  paths=[n for n in z.namelist() if n.endswith("g60_cuda_admission.json")]
                  if len(paths)!=1: raise RuntimeError("ADMISSION_JSON_MISSING")
                  rpt=json.loads(z.read(paths[0]).decode("utf-8-sig"))
              gpu=rpt.get("gpu") or {}
              result.update(artifact_status=rpt.get("status"),gpu_compute_executed=rpt.get("gpu_compute_executed"),device_name=gpu.get("device_name"),built_cuda=gpu.get("built_cuda"),torch=gpu.get("torch"),gpu_matmul_wall_ms=gpu.get("gpu_matmul_wall_ms"),max_allocated_vram_bytes=gpu.get("max_allocated_vram_bytes"),compute_capability=gpu.get("compute_capability"),cuda_available=gpu.get("cuda_available"))
              if rpt.get("source_sha")!=sha or str(rpt.get("run_id"))!=str(run["id"]): raise RuntimeError("SOURCE_PROVENANCE_MISMATCH")
              if rpt.get("status")!="PASS" or rpt.get("gpu_compute_executed") is not True or gpu.get("gpu_compute_executed") is not True or gpu.get("cuda_available") is not True: raise RuntimeError("ACTUAL_GPU_COMPUTE_NOT_VERIFIED")
              if not isinstance(gpu.get("compute_capability"),list) or gpu["compute_capability"][0]<12: raise RuntimeError("GPU_ARCHITECTURE_MISMATCH")
              if tuple(int(v) for v in str(gpu.get("built_cuda","0.0")).split(".")[:2])<(12,8): raise RuntimeError("CUDA_BELOW_12_8")
              result["status"]="PASS"
          except Exception as ex:
              result["failure"]=type(ex).__name__+": "+str(ex)
          print("G61_G60_EVIDENCE="+json.dumps(result,sort_keys=True))
          body="### ACC G61 — readback of G60 original GPU admission run\n\n**Result: "+result["status"]+"**. Evidence inspection only: original run not repeated; no model benchmark or scientific acceptance.\n\n"
          body+="Pinned source: 34cff5dff81407688e010f9abff0f33a253cf655\n\n"
          body+="~~~json\n"+json.dumps(result,indent=2,sort_keys=True)+"\n~~~\n"
          api("/issues/1259/comments",{"body":body})
          if result["status"]!="PASS": sys.exit(1)
          PY
