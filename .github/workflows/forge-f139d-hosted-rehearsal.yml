name: FORGE F139-D hosted development rehearsal
# This is PR-only: the signed workflow_dispatch pathway is NOT simulated as genuine.
on:
  pull_request:
    branches: [main]
    paths:
      - 'f139/**'
      - 'cmd/forge-model-free-loop/**'
      - '.github/workflows/forge-f139-development-worker.yml'
      - '.github/workflows/forge-f139d-hosted-rehearsal.yml'
permissions:
  contents: read
concurrency:
  group: forge-f139d-rehearsal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  development-rehearsal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run the actual bounded Go synthetic advisory and simulated admission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'f139d'
          if (Test-Path -LiteralPath $work) { throw 'F139D_EXISTING_REHEARSAL_DIRECTORY' }
          New-Item -ItemType Directory -Path $work | Out-Null
          $frozen = '${{ github.event.pull_request.head.sha }}'
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -ne $frozen -or $actual -notmatch '^[0-9a-f]{40}$') { throw 'F139D_PR_HEAD_DRIFT' }
          Write-Host 'F139D_PR_HEAD_SOURCE_PIN=PASS'
          $eventSha = $env:GITHUB_SHA
          if ($eventSha -notmatch '^[0-9a-f]{40}$') { throw 'F139D_EVENT_MERGE_SHA_INVALID' }
          $data = & go run ./cmd/forge-model-free-loop --synthetic-only --source-ref $eventSha
          if ($LASTEXITCODE -ne 0) { throw 'F139D_WORKLOAD_EXECUTION_FAILED' }
          [IO.File]::WriteAllText((Join-Path $work 'advisory.json'), (($data -join [Environment]::NewLine) + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
          python -B -m f139.qualify_development_worker --advisory (Join-Path $work 'advisory.json') --output (Join-Path $work 'rehearsal-only') --source-sha $eventSha --checkout-head $frozen --run-id $env:GITHUB_RUN_ID --os '${{ matrix.os }}'
          if ($LASTEXITCODE -ne 0) { throw 'F139D_REHEARSAL_VALIDATION_FAILED' }
          Write-Host 'F139D_ACTUAL_HOSTED_OS=${{ matrix.os }}'
          Write-Host 'F139D_GENUINE_CONTROLLER_DISPATCH=FALSE'
      - name: Train real development-only mechanisms and matched controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest f139.test_dev_learning -v
          if ($LASTEXITCODE -ne 0) { throw 'F139_REAL_DEV_ADVERSARIAL_REGRESSION_FAILED' }
          $head = '${{ github.event.pull_request.head.sha }}'
          $actual = (& git rev-parse HEAD).Trim()
          if ($head -cne $actual) { throw 'F139_REAL_DEV_SOURCE_DRIFT' }
          $generation = [int](([long]$env:GITHUB_RUN_ID % 100000) + 1)
          $original = $env:GITHUB_SHA
          try {
            $env:GITHUB_SHA = $head
            python -B -m f139.dev_learning --lane Qualification --generation $generation --source-sha $head --output (Join-Path $env:RUNNER_TEMP 'f139d/learned-development.json')
          } finally {
            $env:GITHUB_SHA = $original
          }
          if ($LASTEXITCODE -ne 0) { throw 'F139_REAL_CPU_DEVELOPMENT_FAILED' }
          $report = Get-Content -Raw -LiteralPath (Join-Path $env:RUNNER_TEMP 'f139d/learned-development.json') | ConvertFrom-Json
          if ($report.schema -cne 'forge.f139.private-cognition-development.v1' -or
              $report.source_sha -cne $head -or $report.lanes.Count -ne 2 -or
              -not $report.real_cpu_training_executed -or
              $report.autonomous_code_generation -or $report.protected_first_use -or
              $report.optimizer_policy_mutations -ne 0 -or $report.paid_api_calls -ne 0) {
            throw 'F139_REAL_DEVELOPMENT_REPORT_REJECTED'
          }
          Write-Host 'F139_TWO_LANE_ACTUAL_CPU_LEARNING=PASS_NO_SCIENTIFIC_ADMISSION'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: f139d-rehearsal-only-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/f139d/advisory.json
            ${{ runner.temp }}/f139d/learned-development.json
            ${{ runner.temp }}/f139d/rehearsal-only/f139d-rehearsal.json
            ${{ runner.temp }}/f139d/rehearsal-only/f139d-synthetic-receipt.json
          if-no-files-found: error
          retention-days: 90
