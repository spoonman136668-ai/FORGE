name: F124-DE original sourcefree cross-bit non-template learning
on:
  push:
    branches: [research/f124de-generic-crossbit-operator-20261019]
    paths: [.github/workflows/forge-f124de-crossbit-original.yml]
permissions:
  contents: read
concurrency:
  group: f124de-original-crossbit-sourcefree-once
  cancel-in-progress: false
jobs:
  sourcebound-sourcefree-preflight:
    name: sourcebound-sourcefree-preflight (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify hypothesis frozen BEFORE source code, strict source isolation, and no original scientific first-use
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'DE_EXACT_GITHUB_SHA_DRIFT' }
          & git merge-base --is-ancestor 9270d9a039868ee900a7627462a03cf33d8e6aa2 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'DE_BEFORE_SOURCE_PREREG_MISSING' }
          & git merge-base --is-ancestor 723fff33537de019c192cf4456d3b4bd7d262a63 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'DE_QUALIFIED_PARENT_SOURCE_MISSING' }
          $d=Get-Content -Raw research/north-star-transfer/f124de-frozen-crossbit-feasibility.json | ConvertFrom-Json
          if ($d.schema -cne 'mass.f124de.sourcefree-general-crossbit-induction-prereg.v1') { throw 'DE_FROZEN_PROTOCOL_MISMATCH' }
          if (!$d.governance.prior_original_924_to_937_untouched -or !$d.governance.prior_F124DD_synthetic_cases_excluded -or $d.governance.scientific_firstuse_consumed -ne 0 -or $d.governance.external_independent_firstuse -or $d.governance.scientific_acceptance -or $d.governance.auto_merge -or $d.governance.new_controller) { throw 'DE_FSA_FIRSTUSE_OR_OPERATOR_GUARD' }
          $prior=(& git rev-parse "HEAD:research/north-star-transfer/f124dd_independent_compact_anf.py").Trim()
          if ($LASTEXITCODE -ne 0 -or $prior -cne '3a8a7e495c3143643915ef3d427d9ef93eb63f1e') { throw 'DE_HISTORICAL_OPTIMIZED_PEER_DRIFT' }
          Write-Host 'F124DE_FROZEN_BEFORE_SOURCE_AUTHENTICATED=PASS'
      - name: Qualify generic learned crossbit polynomial semantics and complete independently optimized control
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B research/north-star-transfer/test_f124de_crossbit.py -v
          if ($LASTEXITCODE -ne 0) { throw 'DE_SOURCEFREE_POLYNOMIAL_OR_EQUAL_PEER_MATH_FAIL' }
          Write-Host 'F124DE_NON_TEMPLATE_CROSSBIT_ENGINEERING_PRETEST=PASS'
  original-whole-linux-processes:
    name: original-whole-linux (${{ matrix.family }}, ${{ matrix.first_seed }})
    needs: sourcebound-sourcefree-preflight
    strategy:
      fail-fast: false
      matrix:
        family: [novel-carry-nibble-add, novel-rotate-after-add, fresh-bitwise-crossrole-check, three-nibble-unseen-negative]
        first_seed: [91, 93]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact 18 new 192-training-event whole-Linux-process causal comparisons
        shell: bash
        run: |
          set -euo pipefail
          python -B research/north-star-transfer/f124de_os_shard.py \
            --family "${{ matrix.family }}" \
            --first-seed "${{ matrix.first_seed }}" \
            --out "$RUNNER_TEMP/f124de-original"
      - name: Retain all original full CPU/RSS receipt records for source-free cohort
        uses: actions/upload-artifact@v4
        with:
          name: f124de-original-${{ matrix.family }}-${{ matrix.first_seed }}
          path: ${{ runner.temp }}/f124de-original/shard-*.json
          if-no-files-found: error
          retention-days: 90
  independent-sourceonly-audit:
    name: independent-sourceonly-audit
    needs: original-whole-linux-processes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain all original eight nonoverlapping sourcefree OS shards
        uses: actions/download-artifact@v4
        with:
          pattern: f124de-original-*
          path: ${{ runner.temp }}/f124de-shards
          merge-multiple: true
      - name: Independently audit all 144 OS process CPU/RSS original receipts and strict no-worse-than-peer
        shell: bash
        run: |
          set -euo pipefail
          python -B research/north-star-transfer/f124de_readonly_audit.py \
            --shards "$RUNNER_TEMP/f124de-shards" \
            --out "$RUNNER_TEMP/f124de-complete-review"
      - name: Retain complete raw sourcefree OS evidence and safe summary
        uses: actions/upload-artifact@v4
        with:
          name: f124de-original-all-144-crossbit-resource-evidence
          path: ${{ runner.temp }}/f124de-complete-review/
          if-no-files-found: error
          retention-days: 90
