name: FORGE F139 V39 guarded original-owner successor source-only
# Event-only, first-attempt source-hold routes for the SAME original owner.
# Isolated from the V41 workflow's skipped issue-comment runs; original SQLite
# SingleOwner mutex and first-attempt native owner guards remain mandatory.
# No new scheduler, queue, controller or competing original task.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  actions: read
  pull-requests: read
concurrency:
  group: forge-f139-v39-original-source-v2
  cancel-in-progress: false
jobs:
  hybrid-v39-original-event1831-readiness:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'spoonman136668-ai' &&
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.event.issue.number == 807 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-HYBRID-V39-READINESS ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout qualified protected-main owner source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Authenticate exact one-shot original-owner event and perform scoped stage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: .
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
             $env:GITHUB_REF -cne 'refs/heads/main' -or
             $env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or
             $env:OPENAI_API_KEY){throw 'F139_V39_ORIGINAL_OWNER_EVENT_NOT_AUTHENTIC'}
          $head=(& git -C $env:GITHUB_WORKSPACE rev-parse HEAD|Out-String).Trim()
          $dirty=@(& git -C $env:GITHUB_WORKSPACE status --porcelain --untracked-files=all)
          if($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA -or
             $dirty.Count -ne 0){throw 'F139_V39_EXACT_PROTECTED_CHECKOUT_REQUIRED'}
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if($event.action -cne 'created' -or
             $event.issue.number -ne 807 -or
             $event.sender.login -cne 'spoonman136668-ai' -or
             $event.comment.user.login -cne 'spoonman136668-ai' -or
             $event.comment.author_association -cne 'OWNER' -or
             -not ([string]$event.comment.body).StartsWith('F139-HYBRID-V39-READINESS ',[StringComparison]::Ordinal)){
            throw 'F139_V39_DISTINCT_OWNER_COMMENT_REQUIRED'
          }
          & python -B -m f139.nci04_v41_hybrid_event1832_owner --operation readiness --target $env:GITHUB_SHA
          if($LASTEXITCODE -ne 0){throw 'F139_V39_ORIGINAL_STAGE_NOT_QUALIFIED'}


