name: Mass K4Q causal-observability source qualification
on:
  push:
    branches: [research/mass-lcrm01-k4q-causal-observability-20261024]
permissions:
  contents: read
jobs:
  original-public-intervention-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Qualify FIT source observability and conditional unseen forward prediction
        run: bash research/lcrm01/k4q_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-k4q-original-causal-observability-and-conditional-prediction
          path: |
            ${{ runner.temp }}/k4q/process-a.json
            ${{ runner.temp }}/k4q/process-b.json
            ${{ runner.temp }}/k4q/comparison.json
            ${{ runner.temp }}/k4q/process-a.log
            ${{ runner.temp }}/k4q/process-b.log
          if-no-files-found: warn
          retention-days: 90
