name: F139 G4 original-owner state read-only observation
on:
  push:
    branches: [cutover/f139-g4-single-owner-20261024]
    paths: [.github/workflows/f139-g4-owner-state-observe-once-20261024.yml]
permissions:
  contents: read
jobs:
  original-owner-observe:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    steps:
      - name: Read original Windows owner state without any mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){throw 'WRONG_ORIGINAL_OWNER'}
          $t=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          Write-Output ('F139_G4_CURRENT_TASK_STATE='+[string]$t.State)
          Write-Output ('F139_G4_CURRENT_TASK_ACTIONS='+@($t.Actions).Count)
          Write-Output ('F139_G4_CURRENT_TASK_TRIGGERS='+@($t.Triggers).Count)
          $args=[string]$t.Actions[0].Arguments
          $m=[regex]::Match($args,'(?i)(?:^|\s)-Database\s+"([^"]+)"')
          if(-not $m.Success){throw 'OWNER_DB_TASK_ARGUMENT_DRIFT'}
          $db=[IO.Path]::GetFullPath($m.Groups[1].Value)
          $expected=[IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'FORGE-F139\state.sqlite'))
          if($db -ine $expected){throw 'OWNER_DB_IDENTITY_DRIFT'}
          $p=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction Stop|
            Where-Object{$_.CommandLine -and $_.CommandLine.Contains('f139.local_controller') -and
              $_.CommandLine.Contains($db)})
          Write-Output ('F139_G4_OWNER_CONTROLLER_PYTHON_PROCESS_COUNT='+$p.Count)
          $py=(Get-Command python.exe -ErrorAction Stop).Source
          $code=@'
          import pathlib,sqlite3,sys
          p=pathlib.Path(sys.argv[1]).resolve(strict=True)
          c=sqlite3.connect(p.as_uri()+"?mode=ro",uri=True,timeout=20)
          try:
              m=c.execute("SELECT source_sha,head_seq,head_hash FROM meta WHERE id=1").fetchone()
              rows=c.execute("SELECT stage,COUNT(*) FROM tasks GROUP BY stage").fetchall()
              print("F139_G4_CURRENT_SQLITE_SOURCE="+m[0])
              print("F139_G4_CURRENT_SQLITE_HEAD_SEQ="+str(m[1]))
              print("F139_G4_CURRENT_SQLITE_STAGE_COUNTS="+str(dict(rows)))
          finally:c.close()
          '@
          & $py -B -c $code $db
          if($LASTEXITCODE -ne 0){throw 'OWNER_SQLITE_READ_FAILED'}
          Write-Output 'F139_G4_READONLY_OBSERVATION=PASS'
