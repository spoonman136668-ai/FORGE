name: L9 neural TRAIN-only frozen prefit
on:
  push:
    branches: [research/optimizer-language-l9-webnlg-transfer-20261023]
    paths:
      - '.github/workflows/optimizer-language-l9-neural-prefit.yml'
permissions:
  contents: read
concurrency:
  group: l9-neural-prefit
  cancel-in-progress: false
jobs:
  prefit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Exact source identity, Python compilation, focused adversarial checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 7ba0f5c56de72120c3dd1701b5107959a5c81c66
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/optimizer-language-l9-neural-prefit.yml'
          p='research/optimizer_language_l9'
          test "$(git rev-parse HEAD:$p/l9_model_suite.py)" = 710ce648a30ffc55647f689c5f4aa3ac13b07066
          test "$(git rev-parse HEAD:$p/l9_neural_train_only.py)" = d35dca9850fe51132002b9a5941c111381486aba
          test "$(git rev-parse HEAD:$p/test_l9_neural_train_only.py)" = 94a2f783f3a2c5b927a7ec2f4edc215dc32ddf16
          test "$(git rev-parse HEAD:$p/L9_MODEL_CONTRACT.json)" = 4eab05a2b9011ebbaa34d01778e7f185807704c2
          test "$(git rev-parse HEAD:$p/L9_SPLIT_RECEIPT.json)" = ca3e41e2835713bc922c56542656489f202c55cf
          python -m py_compile "$p/l9_model_suite.py" "$p/l9_neural_train_only.py" "$p/test_l9_neural_train_only.py"
          (cd "$p" && python -m unittest -v test_l9_neural_train_only.py test_l9_train_select_candidate.py test_l9_model_suite.py test_l9_split_builder.py)
          python -c 'import pathlib,shutil; [shutil.rmtree(p) for p in pathlib.Path("research/optimizer_language_l9").rglob("__pycache__")]'
          test -z "$(git status --porcelain)"
          echo L9_NEURAL_PREFIT=PASS
          echo L9_NEURAL_MODEL_FIT_COUNT=0
          echo L9_AUDIT_REFERENCE_CONSUMPTION=FALSE
          echo L9_OFFICIAL_TEST_CONSUMED=FALSE
