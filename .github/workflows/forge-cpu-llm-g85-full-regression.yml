name: FORGE CPU LLM Evaluation G85 exact ARM64 receipt full Linux Windows regression
on:
  push:
    branches: [research/cpu-llm-g85-arm64-shakespeare-20261031]
    paths:
      - 'docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-ORIGINAL-RESULT-20261031.json'
      - 'docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-FINAL-QUALIFICATION-REPAIR-20261031.md'
      - 'docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-FINAL-QUALIFICATION-REPAIR2-20261031.md'
      - 'docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-FINAL-QUALIFICATION-TRIGGER-20261031.md'
permissions:
  contents: read
concurrency:
  group: forge-cpu-llm-g85-exact-receipt-regression
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact ARM64 receipt, preregistration and immutable G70 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:research/llm_g54)" = "204af0f5502269be4288c6c56f689526d03c77fb"
          test "$(git rev-parse HEAD:research/llm_g55)" = "2e40d5bd574bf9f57f81c4ecf5fd611f9ef753e3"
          test "$(git rev-parse HEAD:research/llm_g56)" = "7a728365dd6bdef415c8427d2a87791f6049ab2a"
          test "$(git rev-parse HEAD:research/llm_g57)" = "dbabd811207e52764568fc4100bb7fa151255cff"
          test "$(git rev-parse HEAD:research/llm_g58)" = "9c391b65ae0c1275191c3856d967f46ec5597038"
          test "$(git rev-parse HEAD:research/llm_g59)" = "693d705b2e5f42886660ebc30e73ee73d5f6d911"
          test "$(git rev-parse HEAD:research/llm_g60)" = "7681d55047cb7793542b1f340d2a1eaa15617f67"
          test "$(git rev-parse HEAD:research/llm_g61)" = "f1bc119d185d301e5b80929a75cbacf66a48d79c"
          test "$(git rev-parse HEAD:research/llm_g62)" = "f7345e7250e242f7b30964b486ce3c91640b34cd"
          test "$(git rev-parse HEAD:research/llm_g63)" = "651d9e92106c43c594eb2e9486f08446b902eee9"
          test "$(git rev-parse HEAD:research/llm_g64)" = "59b6203707a891fe36a02d0e83d1c173e6aa6b1f"
          test "$(git rev-parse HEAD:research/llm_g65)" = "18ddbdbe436728b04f660b870abc924bdf21e554"
          test "$(git rev-parse HEAD:research/llm_g66)" = "f3d0980ead446b0a89d5defe6531b1e00283b546"
          test "$(git rev-parse HEAD:research/llm_g67)" = "ed268f83fbffa0cc13343d8647201c7798d070b9"
          test "$(git rev-parse HEAD:research/llm_g68)" = "88fc035bb77e3192f2b69567d2226090c8a05361"
          test "$(git rev-parse HEAD:research/llm_g70)" = "681c4022516e370a7edf9205d90a39e69b0a784f"
          test "$(git rev-parse HEAD:docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-PREREG-20261031.md)" = "aee2742c42bf4c24e36ddfa6164e110a0308e999"
          test "$(git rev-parse HEAD:research/cpu_g85/g85_arm64_shakespeare.py)" = "4fc81d9c8cdba49fd4a7f5dfcf30709563db06f9"
          test "$(git rev-parse HEAD:research/cpu_g85/test_g85_arm64_shakespeare.py)" = "2d836a9273e6a54dafe4228cc8e07cd6cf05d592"
          ACTUAL="$(git show "HEAD:docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-ORIGINAL-RESULT-20261031.json" | sha256sum | cut -d' ' -f1)"
          EXPECTED="$(awk '{print $1}' docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-ORIGINAL-RESULT-20261031.json.sha256)"
          test "$ACTUAL" = "$EXPECTED"
          python - <<'PY'
          import json
          p="docs/research/CPU-G85-GPT2-ARM64-SHAKESPEARE-ORIGINAL-RESULT-20261031.json"
          r=json.load(open(p,encoding="utf-8"))
          assert r["schema"]=="forge.cpu-llm-g85.authentic-shakespeare-transfer.v1"
          assert r["gate"]=="CPU_G85"
          assert r["preregistration_commit"]=="275284b5c2fffd8031fe2caaa570793e3fe6941a"
          assert r["scientific_acceptance"]=="NOT_GRANTED" and r["promotion_allowed"] is False
          assert r.get("runtime",{}).get("machine","").lower() in ("aarch64","arm64")
          assert r.get("runtime",{}).get("os_name")=="posix"
          if r.get("engineering")=="PASS" and r.get("correctness")=="PASS":
              assert r["summary"]["timed_authentic_responses"]==180
              assert r["summary"]["timed_authentic_generated_tokens"]==1440
              assert len(r["original_paired_trials"])==60
              assert r["transfer"] in ("TRANSFER_PASS","TRANSFER_FAIL")
          else:
              assert r.get("error") or r.get("transfer")=="UNVERIFIED"
          print("G85_ARM64_EXACT_RECEIPT=PASS")
          PY
          python -B -m py_compile research/cpu_g85/g85_arm64_shakespeare.py research/cpu_g85/test_g85_arm64_shakespeare.py
          python -B -m unittest discover -s research/cpu_g85 -p 'test_g85_arm64_shakespeare.py' -v
      - name: FORGE isolation and authority regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: F139 controller and native custody regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s f139 -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go tests, race, vet and build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
