name: MP-AI05 dev-only fresh-document paired CPU diagnostic
on:
  push:
    branches: [qualification/mpai05-offline-private-proof-20261027]
    paths: ['.github/workflows/mpai05-dev-v2-local-answers.yml']
permissions:
  contents: read
concurrency:
  group: mpai05-private-development-local-model
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CREDENTIAL_INTERACTIVE: 'never'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: 'core.longpaths'
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Compare original private retrieval in local development mode without scientific claim
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'MPAI05_UNAUTHORIZED_DEV_RUNNER'}
          $root=Join-Path $env:RUNNER_TEMP ('mpai05-dev-v2-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'original'
          $dev=Join-Path $root 'dev-manifest'
          try {
            New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
            & git clone --quiet --single-branch --branch main https://github.com/spoonman136668-ai/Mind-Palace.git $src *> (Join-Path $root 'clone-original-private.log')
            if($LASTEXITCODE -ne 0){throw 'MPAI05_DEV_ORIGINAL_SOURCE_MISSING'}
            & git clone --quiet --single-branch --branch proposal/mpai05-next-development-comparison-20261027 https://github.com/spoonman136668-ai/Mind-Palace.git $dev *> (Join-Path $root 'clone-dev-private.log')
            if($LASTEXITCODE -ne 0){throw 'MPAI05_DEV_MANIFEST_MISSING'}
            if((& git -C $src rev-parse HEAD).Trim() -cne '7ad7230a82e3c748aa5336b7288ad2b45d42630c'){throw 'MPAI05_DEV_SOURCE_DRIFT'}
            if((& git -C $dev rev-parse HEAD).Trim() -cne 'ef58b620c136578e8ea2b06d28abbaaef25bb9ef'){throw 'MPAI05_DEV_MANIFEST_DRIFT'}
            $env:MPAI05_DEV_SOURCE=$src
            $env:MPAI05_DEV_MANIFEST=Join-Path $dev 'evaluation/mpai05-development-comparison-v2.json'
            $env:MPAI05_DEV_ROOT=$root
            $program=@'
          import gc,hashlib,json,os,pathlib,re,shutil,socket,subprocess,sys,time,urllib.request
          p=pathlib.Path(os.environ["MPAI05_DEV_ROOT"])
          source=pathlib.Path(os.environ["MPAI05_DEV_SOURCE"])
          manifest_path=pathlib.Path(os.environ["MPAI05_DEV_MANIFEST"])
          model_file=p/"public-development.gguf"
          report_file=p/"private-development-receipt.json"
          model_url=("https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/"
            "9217f5db79a29953eb74d5343926648285ec7e67/"
            "qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true")
          expected_hash="74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db"
          expected_size=491400032
          if shutil.disk_usage(str(p)).free<1700000000:
            raise RuntimeError("MPAI05_DEV_SCRATCH_SPACE_BLOCKED")
          # Only a known public GGUF is retrieved; no private question data is
          # opened until download is fully verified and networking blocked.
          request=urllib.request.Request(model_url,headers={"User-Agent":"MPAI05-public-weights-development/1"})
          start=time.monotonic();read=0;digest=hashlib.sha256()
          with urllib.request.urlopen(request,timeout=40) as stream,model_file.open("xb") as out:
            while True:
              chunk=stream.read(4*1024*1024)
              if not chunk:break
              read+=len(chunk)
              if read>510000000 or time.monotonic()-start>240:
                raise RuntimeError("MPAI05_DEV_PUBLIC_DOWNLOAD_BOUND")
              digest.update(chunk);out.write(chunk)
          if read!=expected_size or digest.hexdigest()!=expected_hash:
            raise RuntimeError("MPAI05_DEV_PUBLIC_MODEL_PIN_DRIFT")
          with model_file.open("rb") as stream:
            if stream.read(4)!=b"GGUF":raise RuntimeError("MPAI05_DEV_PUBLIC_MAGIC")
          os.environ["HF_HUB_OFFLINE"]="1"
          def deny(*args,**kwargs):raise RuntimeError("MPAI05_DEV_NETWORK_DENIED_AFTER_WEIGHTS")
          socket.socket=deny
          m=json.loads(manifest_path.read_text(encoding="utf-8"))
          if (m.get("schema")!="mind-palace.mpai05.development-cohort.v1" or
              m.get("role")!="exploratory_repeatable_development_not_first_use" or
              m.get("source_commit")!="7ad7230a82e3c748aa5336b7288ad2b45d42630c" or
              m.get("records_sha256")!="e5066b28ae03b2a6b7c82953a173013e690cf8fe66d5f5bfec6a81dd790409fa" or
              m.get("corpus_class")!="private" or m.get("evidence_cap_bytes")!=2048 or
              len(m.get("cases",[]))!=8):
            raise RuntimeError("MPAI05_DEV_MANIFEST_INVARIANT")
          if hashlib.sha256((source/".ice/records.json").read_bytes()).hexdigest()!=m["records_sha256"]:
            raise RuntimeError("MPAI05_DEV_RECORDS_DRIFT")
          for case in m["cases"]:
            if case.get("development_fixture") is not True or not case.get("source_refs"):
              raise RuntimeError("MPAI05_DEV_NOT_EXPLICIT_DEVELOPMENT")
            for ref in case["source_refs"]:
              match=re.fullmatch(r"spoonman136668-ai/Mind-Palace@([0-9a-f]{40}):([A-Za-z0-9/_\-.]+)#blob=([0-9a-f]{40})",ref)
              if not match or match.group(1)!=m["source_commit"]:
                raise RuntimeError("MPAI05_DEV_UNPINNED_SOURCE")
              blob=subprocess.run(["git","-C",str(source),"rev-parse","HEAD:"+match.group(2)],capture_output=True,text=True,check=True,timeout=20).stdout.strip()
              if blob!=match.group(3):raise RuntimeError("MPAI05_DEV_SOURCE_BLOB_MISMATCH")
          from llama_cpp import Llama
          model=Llama(model_path=str(model_file),n_ctx=2048,n_threads=4,
                      n_gpu_layers=0,n_batch=128,seed=137,verbose=False)
          limit=2048
          def pack(query,arm):
            script="context-pack.ps1" if arm=="A" else "context-pack-tiered.ps1"
            extra=["-MaxRecords","12","-MaxBytes","16384"] if arm=="A" else ["-PrimaryMaxRecords","5","-MaxBytes","16384","-NoTelemetryLedger"]
            call=["pwsh.exe","-NoProfile","-NonInteractive","-File",str(source/"tools"/script),"-Text",query]+extra
            proc=subprocess.run(call,cwd=source,capture_output=True,text=True,encoding="utf-8",timeout=70,check=False)
            if proc.returncode!=0:raise RuntimeError("MPAI05_DEV_CONTEXT_SOURCE_FAILED")
            doc=json.loads(proc.stdout.strip())
            if arm=="A":
              if doc.get("schema")!="mind-palace.context-pack.v1":raise RuntimeError("MPAI05_DEV_LEGACY_SCHEMA")
              lines=[x["statement"].strip() for x in doc["records"]]
            else:
              if doc.get("schema")!="mind-palace.context-pack-tiered.v2":raise RuntimeError("MPAI05_DEV_TIERED_SCHEMA")
              if doc.get("retrieval_receipt",{}).get("records_sha256")!=m["records_sha256"]:
                raise RuntimeError("MPAI05_DEV_TIERED_SOURCE_DRIFT")
              lines=[x.strip() for x in doc["model_context"].splitlines()]
            output=[];count=0
            for line in lines:
              if not line:continue
              needed=len(line.encode("utf-8"))+(1 if output else 0)
              if count+needed>limit:break
              output.append(line);count+=needed
            if not output:raise RuntimeError("MPAI05_DEV_EMPTY_CONTEXT")
            return "\n".join(output)
          rows=[];different_context=0;different_answers=0
          for i,case in enumerate(m["cases"]):
            ctx={arm:pack(case["question"],arm) for arm in ("A","B")}
            different_context+=ctx["A"]!=ctx["B"]
            answers={}
            for arm in (("A","B") if i%2==0 else ("B","A")):
              prompt=("Use only the following evidence. Answer accurately and briefly. "
                "If you cannot determine an answer, say evidence is insufficient.\n"
                "Evidence:\n"+ctx[arm]+"\nQuestion: "+case["question"]+"\nAnswer:")
              start=time.monotonic()
              result=model.create_completion(prompt=prompt,max_tokens=96,temperature=0.0,top_p=1.0)
              elapsed_ms=int(1000*(time.monotonic()-start))
              response=result.get("choices",[{}])[0].get("text","")
              if type(response) is not str:raise RuntimeError("MPAI05_DEV_MODEL_OUTPUT_INVALID")
              answers[arm]=response
              rows.append({"arm":arm,"case_index":i,
                "context_bytes":len(ctx[arm].encode("utf-8")),
                "input_tokens":int(result.get("usage",{}).get("prompt_tokens",0)),
                "output_tokens":int(result.get("usage",{}).get("completion_tokens",0)),
                "latency_ms":elapsed_ms,"nonempty":bool(response.strip())})
            different_answers+=answers["A"]!=answers["B"]
          if len(rows)!=16:raise RuntimeError("MPAI05_DEV_INCOMPLETE")
          totals={arm:{field:sum(row[field] for row in rows if row["arm"]==arm)
                for field in ("context_bytes","input_tokens","output_tokens","latency_ms","nonempty")}
                for arm in ("A","B")}
          receipt={"schema":"mind-palace.mpai05.development-diagnostic.v1",
            "source":"7ad7230a82e3c748aa5336b7288ad2b45d42630c",
            "cases":8,"model_calls":16,"context_cap":2048,
            "development_only":True,"independent_grading":False,
            "scientific_admission":False,"context_pairs_different":different_context,
            "answer_pairs_different":different_answers,"totals":totals}
          # Only structured aggregate counts reach the public CI log; no
          # case text, answer text, SHA of answers, or private source IDs.
          report_file.write_text(json.dumps(receipt,sort_keys=True),encoding="utf-8")
          del model
          gc.collect()
          '@
            $privateLog=Join-Path $root 'private-inference.log'
            $program | & python -B -c "import sys;exec(sys.stdin.read())" *> $privateLog
            if($LASTEXITCODE -ne 0){throw 'MPAI05_DEV_LOCAL_EVALUATION_FAILED'}
            $report=Get-Content -LiteralPath (Join-Path $root 'private-development-receipt.json') -Raw | ConvertFrom-Json
            if($report.schema -cne 'mind-palace.mpai05.development-diagnostic.v1' -or
              [int]$report.cases -ne 8 -or [int]$report.model_calls -ne 16 -or
              $report.development_only -ne $true -or $report.independent_grading -ne $false -or
              $report.scientific_admission -ne $false -or [int]$report.context_cap -ne 2048){
              throw 'MPAI05_DEV_INVALID_AGGREGATE_RECEIPT'
            }
            foreach($arm in @('A','B')){
              $tot=$report.totals.$arm
              if([int]$tot.nonempty -gt 8 -or [int]$tot.context_bytes -gt 16384 -or
                 [int]$tot.context_bytes -lt 8){
                throw 'MPAI05_DEV_AGGREGATE_OUT_OF_RANGE'
              }
            }
            foreach($path in @($src,$dev)){
              $dirty=@(& git -C $path status --porcelain --untracked-files=all)
              if($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0){throw 'MPAI05_DEV_ORIGINAL_SOURCE_MODIFIED'}
            }
            Write-Host 'MPAI05_DEV_COMPARISON=COMPLETE'
            Write-Host 'MPAI05_DEV_CASES=8'
            Write-Host 'MPAI05_DEV_LOCAL_MODEL_CALLS=16'
            Write-Host ('MPAI05_DEV_DISTINCT_CONTEXT_PAIRS='+[int]$report.context_pairs_different)
            Write-Host ('MPAI05_DEV_DISTINCT_ANSWER_PAIRS='+[int]$report.answer_pairs_different)
            Write-Host ('MPAI05_DEV_LEGACY_CONTEXT_BYTES='+[int]$report.totals.A.context_bytes)
            Write-Host ('MPAI05_DEV_TIERED_CONTEXT_BYTES='+[int]$report.totals.B.context_bytes)
            Write-Host ('MPAI05_DEV_LEGACY_INPUT_TOKENS='+[int]$report.totals.A.input_tokens)
            Write-Host ('MPAI05_DEV_TIERED_INPUT_TOKENS='+[int]$report.totals.B.input_tokens)
            Write-Host ('MPAI05_DEV_LEGACY_OUTPUT_TOKENS='+[int]$report.totals.A.output_tokens)
            Write-Host ('MPAI05_DEV_TIERED_OUTPUT_TOKENS='+[int]$report.totals.B.output_tokens)
            Write-Host ('MPAI05_DEV_LEGACY_LATENCY_MS='+[int]$report.totals.A.latency_ms)
            Write-Host ('MPAI05_DEV_TIERED_LATENCY_MS='+[int]$report.totals.B.latency_ms)
            Write-Host 'MPAI05_DEV_BLIND_GRADING=NOT_PERFORMED'
            Write-Host 'MPAI05_DEV_INDEPENDENT_CUSTODY=NOT_AUTHENTICATED'
            Write-Host 'MPAI05_DEV_SCIENTIFIC_ADMISSION=FALSE'
            Write-Host 'MPAI05_DEV_PUBLIC_PRIVATE_CONTENT=FALSE'
          } finally {
            Set-Location $env:RUNNER_TEMP
            if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop}
            Write-Host ('MPAI05_DEV_PRIVATE_SCRATCH_REMOVED='+$(if(Test-Path -LiteralPath $root){'FALSE'}else{'TRUE'}))
          }
