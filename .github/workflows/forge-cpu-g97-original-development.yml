name: FORGE CPU G97 original GPT2 development only
on:
  push:
    branches: [research/cpu-llm-g96-admission-policy-20261031]
    paths:
      - '.github/workflows/forge-cpu-g97-original-development.yml'
      - 'research/cpu_g97/g97_development_original.py'
      - 'research/cpu_g97/g98_timing_probe.py'
      - 'research/cpu_g97/g98_original_parity.py'
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: cpu-g97-original-development
  cancel-in-progress: false
jobs:
  source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.admit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Admit exact source only after full original Linux/Windows regression
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "research/cpu-llm-g96-admission-policy-20261031"
          python - <<'PY'
          import json, os, urllib.request
          sha=os.environ["GITHUB_SHA"]
          url=f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/runs?head_sha={sha}&per_page=100"
          req=urllib.request.Request(url,headers={
            "Authorization":"Bearer "+os.environ["GH_TOKEN"],
            "Accept":"application/vnd.github+json",
            "User-Agent":"FORGE-G97-EXACT-HEAD-ADMISSION"})
          with urllib.request.urlopen(req,timeout=30) as response:
            runs=json.load(response)["workflow_runs"]
          matches=[r for r in runs if r["name"]=="FORGE public Linux and Windows qualification"
                   and r["head_sha"]==sha and r["status"]=="completed"
                   and r["conclusion"]=="success"]
          if not matches:raise SystemExit("G97_EXACT_HEAD_FULL_REGRESSION_NOT_PASSED")
          print("G97_EXACT_HEAD_FULL_REGRESSION=PASS",matches[0]["html_url"])
          PY
          test "$(git rev-parse HEAD:research/cpu_g95/g95_multiprefix_lru_original.py)" = "b401c86e4dff2f25eb995a47ba58884838f232eb"
          git merge-base --is-ancestor 856da2432ef4163938711bcb6b0369fbfab2ccbd HEAD
          python -B -m py_compile research/cpu_g97/g97_development_original.py research/cpu_g97/g97_stream_manifest.py research/cpu_g97/g97_original_adapter.py
          python -B -m unittest discover -s research/cpu_g97 -p 'test_g97*.py' -v
          python -B -m unittest discover -s research/cpu_g97 -p 'test_g98*.py' -v
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo G97_DEVELOPMENT_SOURCE_ADMISSION=PASS
  original-model-development:
    needs: source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONPATH: .
      G98_DEVELOPMENT_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-admission.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original pinned CPU GPT2 runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.source-admission.outputs.source_sha }}"
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 huggingface-hub==0.30.2 safetensors==0.5.3 tokenizers==0.21.1 psutil==7.1.3
          python -m pip check
          python -m pip freeze > cpu_g97_development_environment.txt
          uname -a >> cpu_g97_development_environment.txt
          lscpu >> cpu_g97_development_environment.txt
      - name: Measure original GPT2 development cohort only
        shell: bash
        run: |
          set -euo pipefail
          python research/cpu_g97/g97_development_original.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path("cpu_g97_development_result.json").read_text())
          data=Path("cpu_g97_development_stream.json").read_bytes()
          assert hashlib.sha256(data).hexdigest()==r["development_stream_sha256"]
          assert r["phase"]=="DEVELOPMENT_ONLY" and not r["heldout_executed"] and not r["promotion_allowed"]
          assert r["engineering"]=="PASS" and r["correctness"]=="PASS"
          assert len(r["strata"])==4
          assert all(v["exact_parity"] and len(v["repetitions"])==4 for v in r["strata"].values())
          assert r["decision"] in ("DEVELOPMENT_CANDIDATE","DEVELOPMENT_NO_GO")
          t=json.loads(Path("cpu_g98_development_timing.json").read_text())
          assert t["schema"]=="forge.cpu-g98.original-development-timing.v1"
          assert t["source_sha"]==r["source_sha"]==__import__("os").environ["GITHUB_SHA"]
          assert t["development_stream_sha256"]==r["development_stream_sha256"]
          assert t["phase"]=="DEVELOPMENT_ONLY" and not t["heldout_executed"] and not t["promotion_allowed"]
          assert t["diagnostic_only"] and t["performance_verdict"]=="NOT_EVALUATED"
          assert set(t["strata"])==set(r["strata"])
          assert all(v["parity"]=="PASS" and v["timing_accepted"] and not v["heldout_executed"]
                     and not v["promotion_allowed"] and v["source_sha"]==r["source_sha"]
                     and v["development_stream_sha256"]==r["development_stream_sha256"]
                     for v in t["strata"].values())
          print("G98_ORIGINAL_MODEL_PARITY=PASS")
          print("G97_DEVELOPMENT_ONLY=PASS",r["decision"])
          PY
      - name: Preserve original development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-g97-original-gpt2-development
          retention-days: 30
          if-no-files-found: warn
          path: |
            cpu_g97_development_result.json
            cpu_g97_development_stream.json
            cpu_g97_development_environment.txt
            cpu_g98_development_timing.json
            cpu_g98_*_parity.json
