name: MP-AI unified Hindsight Harness2 integration qualification
on:
  push:
    branches: [qualification/mpai05-offline-private-proof-20261027]
    paths: ['.github/workflows/mpai-hindsight-h2-integration.yml']
permissions:
  contents: read
concurrency:
  group: mpai-one-unified-integration-qualification
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 27
    env:
      GIT_TERMINAL_PROMPT: '0'
      GIT_CREDENTIAL_INTERACTIVE: 'never'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: 'core.longpaths'
      GIT_CONFIG_VALUE_0: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Verify one integrated source and run affected tests plus original Windows regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'MPAI_INTEGRATION_BAD_RUNNER'}
          $temp=Join-Path $env:RUNNER_TEMP ('mpai-unified-integration-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $temp 'source'
          try {
            New-Item -ItemType Directory -Path $temp -ErrorAction Stop | Out-Null
            & git clone --quiet --single-branch --branch integration/mpai-hindsight-h2-end-to-end-20261027 https://github.com/spoonman136668-ai/Mind-Palace.git $src *> (Join-Path $temp 'private-clone.log')
            if($LASTEXITCODE -ne 0){throw 'MPAI_INTEGRATION_CLONE_FAILED'}
            if((& git -C $src rev-parse HEAD).Trim() -cne 'cc8b3ab560b12beb989185343a2b279bfdbca296'){throw 'MPAI_INTEGRATION_SOURCE_DRIFT'}
            if((& git -C $src rev-parse 'HEAD^{tree}').Trim() -cne '5ac3c4d5d99b70a6830c48afd80a12c930b3e1d6'){throw 'MPAI_INTEGRATION_TREE_DRIFT'}
            & git -C $src merge-base --is-ancestor 250208e94d998cf0452923a4d02bb99e0eb208b9 HEAD
            if($LASTEXITCODE -ne 0){throw 'MPAI_INTEGRATION_PARENT_DRIFT'}
            $changes=@(& git -C $src diff --name-only 250208e94d998cf0452923a4d02bb99e0eb208b9 HEAD)
            if($LASTEXITCODE -ne 0){throw 'MPAI_INTEGRATION_DIFF_FAILED'}
            $expected=@('docs/MPAI_HINDSIGHT_H2_INTEGRATION_FINISH.md','tests/test_mpai_integrated_cycle.py','tests/test_mpn1_mcp.py','tools/mindpalace_mcp.py')
            if(($changes | Sort-Object) -join '|' -cne ($expected | Sort-Object) -join '|'){throw 'MPAI_INTEGRATION_UNEXPECTED_SOURCE_DELTA'}
            Write-Host 'MPAI_UNIFIED_FOUR_FILE_DELTA=PASS'
            $targets=@(
              'test_mpai_integrated_cycle.py',
              'test_mpai01_reflect.py',
              'test_mpai01_probe.py',
              'test_mpai01_mcp_adapter.py',
              'test_mpai02_probe_mcp.py',
              'test_mpai04_admitted_memory.py',
              'test_mpai05_runtime_claims.py',
              'test_mpn1_mcp.py'
            )
            Push-Location $src
            try {
              foreach($name in $targets) {
                $path=Join-Path $temp ('private-'+$name+'.log')
                & python -B -m unittest discover -s tests -p $name -v *> $path
                if($LASTEXITCODE -ne 0){throw 'MPAI_INTEGRATION_FOCUSED_FAILURE'}
                $log=[IO.File]::ReadAllText($path)
                $match=[regex]::Match($log,'Ran ([0-9]{1,3}) tests? in')
                if(-not $match.Success -or [int]$match.Groups[1].Value -lt 1 -or $log -notmatch '(?m)^OK\s*$'){throw 'MPAI_INTEGRATION_FOCUSED_REPORT_FAILED'}
                Write-Host ('MPAI_INTEGRATION_FOCUSED_'+$name.Replace('.py','')+'='+$match.Groups[1].Value+'_PASS')
              }
              $full=Join-Path $temp 'private-original-windows-regression.log'
              & pwsh.exe -NoProfile -NonInteractive -File tests/Test-All.ps1 *> $full
              if($LASTEXITCODE -ne 0){throw 'MPAI_INTEGRATION_FULL_REGRESSION_FAILED'}
              if(-not [IO.File]::ReadAllText($full).Contains('Mind-Palace regression suite passed')){throw 'MPAI_INTEGRATION_TERMINAL_REGRESSION_MISSING'}
              Write-Host 'MPAI_UNIFIED_FULL_WINDOWS_REGRESSION=PASS'
            } finally {
              Pop-Location
            }
            if((& git -C $src rev-parse HEAD).Trim() -cne 'cc8b3ab560b12beb989185343a2b279bfdbca296'){throw 'MPAI_INTEGRATION_SOURCE_CHANGED'}
            $dirty=@(& git -C $src status --porcelain --untracked-files=all)
            if($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0){throw 'MPAI_INTEGRATION_SOURCE_MUTATED'}
            Write-Host 'MPAI_UNIFIED_ORIGINAL_SOURCE_CLEAN=PASS'
            Write-Host 'MPAI_UNIFIED_MCP_NO_AUTHORIZATION_ESCALATION=TRUE'
            Write-Host 'MPAI_UNIFIED_REAL_CHATGPT_CONNECTOR=NOT_CONNECTED'
            Write-Host 'MPAI_UNIFIED_INDEPENDENT_AGENT_CONSUMER=NOT_AUTHENTICATED'
            Write-Host 'MPAI_UNIFIED_ACTUAL_AGENT_IMPROVEMENT=NOT_PROVEN'
            Write-Host 'MPAI_UNIFIED_ICE_CONTROLLER_AND_MAIN_WRITES=0'
            Write-Host 'MPAI_UNIFIED_MODEL_OR_PAID_API_CALLS=0'
          } finally {
            Set-Location $env:RUNNER_TEMP
            if(Test-Path -LiteralPath $temp){Remove-Item -LiteralPath $temp -Recurse -Force -ErrorAction Stop}
          }
