name: FORGE CPU G103 original GPT2 structural block feasibility
on:
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: cpu-g103-original-structure-once
  cancel-in-progress: false
env:
  G103_FROZEN_SHA: 2a6ab9ff82eb8f200a0eeeaba53d033a6b829a07
jobs:
  source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.admit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.G103_FROZEN_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Enforce immutable one-shot source and dual-platform qualification
        id: admit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = "push"
          test "$EVENT_BRANCH" = "research/cpu-llm-g96-admission-policy-20261031"
          test "$EVENT_BEFORE" = "$G103_FROZEN_SHA"
          test "$EVENT_FORCED" = "false"
          test "$(git rev-parse HEAD)" = "$G103_FROZEN_SHA"
          test "$(git rev-parse HEAD:research/cpu_g95/g95_multiprefix_lru_original.py)" = "b401c86e4dff2f25eb995a47ba58884838f232eb"
          python - <<'PY'
          import json,os,urllib.request
          sha=os.environ["G103_FROZEN_SHA"]
          url=f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/runs?head_sha={sha}&per_page=100"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
            "Accept":"application/vnd.github+json","User-Agent":"FORGE-G103-IMMUTABLE-ADMISSION"})
          with urllib.request.urlopen(req,timeout=30) as f:
              runs=json.load(f)["workflow_runs"]
          if not any(r["id"]==41752328124 and
             r["name"]=="FORGE public Linux and Windows qualification" and
             r["head_sha"]==sha and r["status"]=="completed" and
             r["conclusion"]=="success" for r in runs):
              raise SystemExit("G103_EXACT_HEAD_MANDATORY_REGRESSION_MISSING")
          if not any(r["id"]==41752321420 and
             r["name"]=="CPU G97 overflow bypass focused qualification" and
             r["head_sha"]==sha and r["status"]=="completed" and
             r["conclusion"]=="success" for r in runs):
              raise SystemExit("G103_EXACT_HEAD_FOCUSED_QUALIFICATION_MISSING")
          print("G103_EXACT_HEAD_SOURCE_ADMISSION=PASS")
          PY
          python -B -m py_compile research/cpu_g97/g103_block_sharing.py research/cpu_g97/g103_original_blocks.py
          python -B -m unittest discover -s research/cpu_g97 -p 'test_g103*.py' -v
          echo "source_sha=$G103_FROZEN_SHA" >> "$GITHUB_OUTPUT"
  original-model-development:
    needs: source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONPATH: .
      G103_DEVELOPMENT_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-admission.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned original GPT2 CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$G103_FROZEN_SHA"
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 huggingface-hub==0.30.2 safetensors==0.5.3 tokenizers==0.21.1 psutil==7.1.3
          python -m pip check
          python -m pip freeze > cpu_g103_environment.txt
          uname -a >> cpu_g103_environment.txt
          lscpu >> cpu_g103_environment.txt
      - name: Measure exact GPT2 structural sharing and validate frozen decision
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$G103_FROZEN_SHA" python research/cpu_g97/g103_original_blocks.py
          python - <<'PY'
          import json,os
          from pathlib import Path
          from research.cpu_g97.g103_original_blocks import decision, GROUPS, MODES
          r=json.loads(Path("cpu_g103_original_block_result.json").read_text())
          assert r["schema"]=="forge.cpu-g103.original-block-reuse-p1.v1"
          assert r["source_sha"]==os.environ["G103_FROZEN_SHA"]
          assert r["phase"]=="DEVELOPMENT_ONLY"
          assert r["heldout_executed"] is False and r["promotion_allowed"] is False
          assert r["scientific_acceptance"]=="NOT_GRANTED"
          assert r["performance_verdict"]=="NOT_EVALUATED"
          assert r["engineering"]=="PASS" and r["original_forward_count"]==8
          assert set(r["groups"])==set(GROUPS)
          for group in GROUPS:
              arms=r["groups"][group]["arms"]
              assert set(arms)==set(MODES)
              for mode in MODES:
                  a=arms[mode]
                  assert a["all_exact"] is True
                  assert a["shared_total_modeled_bytes"]==a["physical_payload_bytes"]+a["metadata_modeled_bytes"]
                  assert a["raw_bytes"]==sum(r["groups"][group]["state_bytes"])
                  assert len(a["decode_wall_ns"])==len(r["groups"][group]["state_bytes"])
          assert r["decision"]==decision(r["groups"])
          assert r["decision"] in ("STRUCTURAL_FEASIBLE_DIAGNOSTIC","STRUCTURAL_NO_GO_DIAGNOSTIC")
          print("G103_ORIGINAL_INDEPENDENT_RECEIPT=PASS",r["decision"])
          PY
      - name: Preserve G103 exact-identity and resource receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-g103-original-gpt2-structural
          retention-days: 30
          if-no-files-found: warn
          path: |
            cpu_g103_original_block_result.json
            cpu_g103_environment.txt
