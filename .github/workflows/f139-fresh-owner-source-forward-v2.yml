name: FORGE F139 V2 original-owner source forward (same task, owner-only)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  actions: read
jobs:
  fresh-original-owner-source-forward-v2-prepare:
    if: >-
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.actor == 'spoonman136668-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event.action == 'created' &&
      github.event.issue.number == 1830 &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == 'spoonman136668-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-FRESH-OWNER-SOURCE-FORWARD-V2 ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    concurrency:
      group: forge-f139-fresh-existing-disabled-task-rebind
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - name: Checkout exact owner-approved protected main without credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Original Windows owner V2 PREPARE; leave same task disabled
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_EVENT_NAME -cne 'issue_comment'){throw 'F139_V2_WRONG_EVENT'}
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $values=@(([string]$event.comment.body).Split(' ',[StringSplitOptions]::RemoveEmptyEntries))
          if($values.Count -ne 9 -or $values[0] -cne 'F139-FRESH-OWNER-SOURCE-FORWARD-V2'){throw 'F139_V2_PREPARE_COMMENT_SHAPE'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File f139/nci04_fresh_owner_source_forward_v2.ps1 -Phase Prepare -Target $values[1] -Head $values[2] -PrNumber ([int]$values[3]) -RegressionRun ([int64]$values[4]) -SourceRun ([int64]$values[5]) -RehearsalRun ([int64]$values[6]) -TerminalSeq ([int64]$values[7]) -TerminalHash $values[8]
          if($LASTEXITCODE -ne 0){throw 'F139_V2_PREPARE_DENIED'}
          Write-Output 'F139_V2_ORIGINAL_SAME_OWNER_PREPARED_DISABLED_ONLY=PASS'

  fresh-original-owner-source-forward-v2-start:
    if: >-
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.actor == 'spoonman136668-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event.action == 'created' &&
      github.event.issue.number == 1830 &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == 'spoonman136668-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-FRESH-OWNER-SOURCE-FORWARD-V2-START ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    concurrency:
      group: forge-f139-fresh-existing-disabled-task-rebind
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - name: Checkout exact owner-approved protected main without credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Same original Windows task V2 START after completed owner PREPARE
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_EVENT_NAME -cne 'issue_comment'){throw 'F139_V2_WRONG_EVENT'}
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $values=@(([string]$event.comment.body).Split(' ',[StringSplitOptions]::RemoveEmptyEntries))
          if($values.Count -ne 3 -or $values[0] -cne 'F139-FRESH-OWNER-SOURCE-FORWARD-V2-START'){throw 'F139_V2_START_COMMENT_SHAPE'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File f139/nci04_fresh_owner_source_forward_v2.ps1 -Phase Start -Target $values[1] -PrepRun ([int64]$values[2])
          if($LASTEXITCODE -ne 0){throw 'F139_V2_START_DENIED'}
          Write-Output 'F139_V2_ORIGINAL_SAME_OWNER_STARTED=PASS'
