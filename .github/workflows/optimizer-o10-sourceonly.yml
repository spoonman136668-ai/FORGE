name: Optimizer O10 causal state operators public qualification

on:
  push:
    branches: [research/optimizer-o10-learned-causal-operators-20261023]
    paths:
      - '.github/workflows/optimizer-o10-sourceonly.yml'
      - 'research/optimizer_o10/**'

permissions:
  contents: read

concurrency:
  group: optimizer-o10-sourceonly
  cancel-in-progress: false

jobs:
  native-public-causal-memory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce immutable protocol GRU comparator and additive exact scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5'
          $ancestor = (& git merge-base $base HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ancestor -cne $base) { throw 'O10_BASE_DRIFT' }
          $expected = @(
            '.github/workflows/optimizer-o10-sourceonly.yml',
            'research/optimizer_o10/O10_FROZEN_PROTOCOL.json',
            'research/optimizer_o10/public_source.py',
            'research/optimizer_o10/learned_operator.py',
            'research/optimizer_o10/o9_gru_original.py',
            'research/optimizer_o10/conventional.py',
            'research/optimizer_o10/runner.py',
            'research/optimizer_o10/test_operators.py'
          )
          $actual = @(& git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne $expected.Count -or
              (Compare-Object $actual $expected)) { throw 'O10_BOUNDED_DELTA_DRIFT' }
          $pins = @{
            'research/optimizer_o10/O10_FROZEN_PROTOCOL.json' = '7f2f7f48a5ea27e3f3a8efe2bdac67b2b9c4c4ab'
            'research/optimizer_o10/o9_gru_original.py' = '007f22006211439e625c1c317d32254acf902d74'
          }
          foreach ($file in $pins.Keys) {
            $head = (& git rev-parse ('HEAD:' + $file)).Trim()
            $disk = (& git hash-object --no-filters -- $file).Trim()
            if ($LASTEXITCODE -ne 0 -or $head -cne $pins[$file] -or
                $disk -cne $pins[$file]) { throw ('O10_PINNED_BLOB_CHANGED_' + $file) }
          }
          Write-Host 'O10_IMMUTABLE_SOURCE_AND_PREREG=PASS'
      - name: Eleven public causal-memory tests including finite difference gradients
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s research/optimizer_o10 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'O10_FOCUSED_TEST_FAILURE' }
          Write-Host 'O10_GRADIENT_AND_ROLE_TESTS=PASS'
      - name: Fresh public parity and write-toggle fit-select-DEV all nine arms
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B research/optimizer_o10/runner.py
          if ($LASTEXITCODE -ne 0) { throw 'O10_PUBLIC_CAUSAL_EVALUATION_FAILURE' }
          Write-Host 'O10_PUBLIC_DEV_EVIDENCE=EMITTED'
          Write-Host 'O10_FIRST_PROTECTED_SCIENCE_USE=NONE'
          Write-Host 'O10_CKB_PLANE_AUTHORITY=UNCHANGED'
      - name: Single final Go tests vet and build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo O10_COMPLETE_GO_REGRESSION=PASS
      - name: Verify source-only worktree and no side effects
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changes = @(& git status --porcelain --untracked-files=all)
          if ($changes.Count -ne 0) { throw 'O10_DIRTY_SOURCE_CHECKOUT' }
          Write-Host 'O10_NO_UNAUTHORIZED_DISPATCH=PASS'
