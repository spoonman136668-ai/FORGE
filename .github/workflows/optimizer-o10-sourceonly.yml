name: Optimizer O10 paired public causal memory qualification

on:
  push:
    branches: [research/optimizer-o10-causal-memory-interventions-20261023]
    paths:
      - '.github/workflows/optimizer-o10-sourceonly.yml'
      - 'research/optimizer_o10/**'

permissions:
  contents: read

concurrency:
  group: optimizer-o10-sourceonly
  cancel-in-progress: false

jobs:
  native-public-causal-memory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check exact frozen protocol original learned controls and bounded scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5'
          $ancestor = (& git merge-base $base HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ancestor -cne $base) { throw 'O10_MAIN_PARENT_DRIFT' }
          $expected = @(
            '.github/workflows/optimizer-o10-sourceonly.yml',
            'research/optimizer_o10/O10_FROZEN_PROTOCOL.json',
            'research/optimizer_o10/trainable_memory.py',
            'research/optimizer_o10/recurrent_memory.py',
            'research/optimizer_o10/public_controls.py',
            'research/optimizer_o10/public_source.py',
            'research/optimizer_o10/runner.py',
            'research/optimizer_o10/test_interventions.py'
          )
          $changed = @(& git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne $expected.Count -or
              (Compare-Object $changed $expected)) { throw 'O10_OUT_OF_SCOPE_FILE_CHANGE' }
          $pins = @{
            'research/optimizer_o10/O10_FROZEN_PROTOCOL.json' = '3ca3c66b9058f802b34fb442cd85c45152c15e84'
            'research/optimizer_o10/trainable_memory.py' = '007f22006211439e625c1c317d32254acf902d74'
            'research/optimizer_o10/recurrent_memory.py' = '6f0e9d58718efdae0e448e9387d325cf653a81fc'
            'research/optimizer_o10/public_controls.py' = 'aa8557641972b863876f882fab41a50d64bac735'
          }
          foreach ($path in $pins.Keys) {
            $commitBlob = (& git rev-parse ('HEAD:'+$path)).Trim()
            $diskBlob = (& git hash-object --no-filters -- $path).Trim()
            if ($LASTEXITCODE -ne 0 -or $commitBlob -cne $pins[$path] -or
                $diskBlob -cne $pins[$path]) { throw ('O10_IMMUTABLE_SOURCE_DRIFT_'+$path) }
          }
          Write-Host 'O10_PRESPECIFIED_EXPERIMENT_IDENTITY=PASS'
      - name: Ten adversarial paired-causal source tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s research/optimizer_o10 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'O10_ADVERSARIAL_PUBLIC_TEST_FAILED' }
          Write-Host 'O10_FOCUSED_TESTS=PASS'
      - name: Trained models and fresh public intervention pair DEV
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B research/optimizer_o10/runner.py
          if ($LASTEXITCODE -ne 0) { throw 'O10_PUBLIC_CAUSAL_EVALUATION_FAILED' }
          Write-Host 'O10_COUNTERFACTUAL_PUBLIC_DEV_RECEIPT=EMITTED'
          Write-Host 'O10_PROTECTED_FIRST_USE=NONE'
          Write-Host 'O10_SCIENCE_ADMISSION=NONE'
      - name: Single final FORGE Go test vet build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo O10_FINAL_GO_REGRESSION=PASS
      - name: Verify no dirty source or control mutations
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(& git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) { throw 'O10_DIRTY_OR_SIDE_EFFECT_WORKTREE' }
          Write-Host 'O10_SOURCEONLY_NO_CONTROLLER_CHANGE=PASS'
