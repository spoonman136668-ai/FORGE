name: Optimizer O10 public state encoding versus readout diagnosis

on:
  push:
    branches: [research/optimizer-o10-state-vs-readout-20261023]
    paths:
      - '.github/workflows/optimizer-o10-sourceonly.yml'
      - 'research/optimizer_o10/**'

permissions:
  contents: read

concurrency:
  group: optimizer-o10-sourceonly
  cancel-in-progress: false

jobs:
  native-public-state-diagnosis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact main parent, prereg protocol and O9 original model identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5'
          $ancestor = (& git merge-base $base HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ancestor -cne $base) { throw 'O10_SOURCE_PARENT_DRIFT' }
          $expected = @(
            '.github/workflows/optimizer-o10-sourceonly.yml',
            'research/optimizer_o10/O10_FROZEN_PROTOCOL.json',
            'research/optimizer_o10/public_source.py',
            'research/optimizer_o10/frozen_o9_memory.py',
            'research/optimizer_o10/diagnostic_probes.py',
            'research/optimizer_o10/runner.py',
            'research/optimizer_o10/test_diagnostic.py'
          )
          $changed = @(& git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne $expected.Count -or
              (Compare-Object $changed $expected)) { throw 'O10_SCOPE_DRIFT' }
          $expectedBlobs = @{
            'research/optimizer_o10/O10_FROZEN_PROTOCOL.json' = '831898050c372b2fd4b206c2f1908d96647572b7'
            'research/optimizer_o10/frozen_o9_memory.py' = '007f22006211439e625c1c317d32254acf902d74'
          }
          foreach ($file in $expectedBlobs.Keys) {
            $gitBlob = (& git rev-parse ('HEAD:'+$file)).Trim()
            $diskBlob = (& git hash-object --no-filters -- $file).Trim()
            if ($LASTEXITCODE -ne 0 -or $gitBlob -cne $expectedBlobs[$file] -or
                $diskBlob -cne $expectedBlobs[$file]) {
              throw ('O10_FROZEN_SOURCE_BLOB_DRIFT_' + $file)
            }
          }
          Write-Host 'O10_PREREG_AND_UNMODIFIED_O9_MODEL=PASS'
      - name: Eleven native adversarial state versus readout checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s research/optimizer_o10 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'O10_FOCUSED_TEST_FAILURE' }
          Write-Host 'O10_FOCUSED_TESTS=PASS'
      - name: Prospectively fresh public model fit and frozen-state diagnostic probes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B research/optimizer_o10/runner.py
          if ($LASTEXITCODE -ne 0) { throw 'O10_PUBLIC_PROBE_DEV_FAILURE' }
          Write-Host 'O10_FROZEN_STATE_PUBLIC_DEV_RECEIPT=EMITTED'
          Write-Host 'O10_NO_PROTECTED_FIRST_USE=PASS'
          Write-Host 'O10_SCIENTIFIC_GO=NOT_EVALUATED'
      - name: One full FORGE Go test vet build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo O10_FULL_GO_REGRESSION=PASS
      - name: Confirm clean source-only checkout
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(& git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) { throw 'O10_WORKTREE_DIRTY' }
          Write-Host 'O10_SOURCEONLY_NO_CONTROL_PLANE_DISPATCH=PASS'
