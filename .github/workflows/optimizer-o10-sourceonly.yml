name: Optimizer O10 encoding versus readout public development qualification

on:
  push:
    branches: [research/optimizer-o10-encode-read-diagnostic-20261023]
    paths:
      - '.github/workflows/optimizer-o10-sourceonly.yml'
      - 'research/optimizer_o10/**'

permissions:
  contents: read

concurrency:
  group: optimizer-o10-sourceonly
  cancel-in-progress: false

jobs:
  native-public-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert protocol-first exact O9 source and eight-file bounded O10 scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5'
          $ancestor = (& git merge-base $base HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ancestor -cne $base) { throw 'O10_PARENT_ID_DRIFT' }
          $expected = @(
            '.github/workflows/optimizer-o10-sourceonly.yml',
            'research/optimizer_o10/O10_FROZEN_PROTOCOL.json',
            'research/optimizer_o10/o9_exact_trainable_memory.py',
            'research/optimizer_o10/public_source.py',
            'research/optimizer_o10/probes.py',
            'research/optimizer_o10/runner.py',
            'research/optimizer_o10/test_diagnostic.py',
            'research/optimizer_o10/README.md'
          )
          $actual = @(& git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne $expected.Count -or
              (Compare-Object $actual $expected)) { throw 'O10_BOUNDED_SOURCE_DRIFT' }
          $pins = @{
            'research/optimizer_o10/O10_FROZEN_PROTOCOL.json' = 'b6a9764b6b9c929b8f04e450ec61f6a167a1dd1e'
            'research/optimizer_o10/o9_exact_trainable_memory.py' = '007f22006211439e625c1c317d32254acf902d74'
          }
          foreach ($file in $pins.Keys) {
            $gitBlob = (& git rev-parse ('HEAD:'+$file)).Trim()
            $diskBlob = (& git hash-object --no-filters -- $file).Trim()
            if ($LASTEXITCODE -ne 0 -or $gitBlob -cne $pins[$file] -or
                $diskBlob -cne $pins[$file]) { throw ('O10_FROZEN_BLOB_DRIFT_' + $file) }
          }
          Write-Host 'O10_AUTHENTIC_FROZEN_PROTOCOL_ORIGINAL_MODEL=PASS'
      - name: Ten adversarial public source and encoding probe tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s research/optimizer_o10 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'O10_FOCUSED_DIAGNOSTIC_FAILED' }
          Write-Host 'O10_FOCUSED_TESTS=PASS'
      - name: Train select and evaluate public encoding versus readout probes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B research/optimizer_o10/runner.py
          if ($LASTEXITCODE -ne 0) { throw 'O10_PUBLIC_TRAIN_SELECT_DEV_FAILED' }
          Write-Host 'O10_PUBLIC_DIAGNOSTIC_RECEIPT=EMITTED'
          Write-Host 'O10_PROTECTED_FIRST_USE=NONE'
          Write-Host 'O10_SCIENTIFIC_GO=NOT_EVALUATED'
      - name: Single full FORGE Go test vet build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo O10_SINGLE_FULL_GO_REGRESSION=PASS
      - name: No protected control-plane side effect and clean checkout
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(& git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) { throw 'O10_DIRTY_SOURCE' }
          Write-Host 'O10_NO_CONTROL_PLANE_MUTATION=PASS'
