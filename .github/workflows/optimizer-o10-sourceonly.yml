name: Optimizer O10 public learned phase composition qualification

on:
  push:
    branches: [research/optimizer-o10-learned-phase-composition-20261023]
    paths:
      - '.github/workflows/optimizer-o10-sourceonly.yml'
      - 'research/optimizer_o10/**'

permissions:
  contents: read

concurrency:
  group: optimizer-o10-sourceonly
  cancel-in-progress: false

jobs:
  public-source-qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require ancestry additive scope prereg and exact frozen O9 comparator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = 'fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5'
          $ancestor = (& git merge-base $parent HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ancestor -cne $parent) { throw 'O10_MAIN_ANCESTRY_DRIFT' }
          $expected = @(
            '.github/workflows/optimizer-o10-sourceonly.yml',
            'research/optimizer_o10/O10_FROZEN_PROTOCOL.json',
            'research/optimizer_o10/o9_frozen_routing.py',
            'research/optimizer_o10/public_source.py',
            'research/optimizer_o10/phase.py',
            'research/optimizer_o10/controls.py',
            'research/optimizer_o10/runner.py',
            'research/optimizer_o10/test_composition.py',
            'research/optimizer_o10/cross_os_compare.py'
          )
          $actual = @(& git diff --name-only $parent HEAD)
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne $expected.Count -or
              (Compare-Object $actual $expected)) { throw 'O10_SCOPE_DRIFT' }
          $pins = @{
            'research/optimizer_o10/O10_FROZEN_PROTOCOL.json' = '87a96ef08bcd051d13a1cd49b16a7a719ca1d920'
            'research/optimizer_o10/o9_frozen_routing.py' = '7aa31f6d13fbdb1b61f833a666f30110c83cb66c'
          }
          foreach ($file in $pins.Keys) {
            $blob = (& git rev-parse ('HEAD:'+$file)).Trim()
            $disk = (& git hash-object --no-filters -- $file).Trim()
            if ($LASTEXITCODE -ne 0 -or $blob -cne $pins[$file] -or
                $disk -cne $pins[$file]) { throw ('O10_FROZEN_BLOB_DRIFT_'+$file) }
          }
          Write-Host 'O10_EXACT_SOURCE_IDENTITY=PASS'
      - name: Eleven prospective public-source and gradient tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s research/optimizer_o10 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'O10_FOCUSED_TEST_FAILURE' }
          Write-Host 'O10_FOCUSED_TESTS=PASS'
      - name: Fresh train select dev for eight candidate control and ablation arms
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Join-Path $env:RUNNER_TEMP 'o10-public-receipt.json'
          python -B research/optimizer_o10/runner.py | Tee-Object -FilePath $receipt
          if ($LASTEXITCODE -ne 0) { throw 'O10_PUBLIC_DEV_FIT_FAILURE' }
          Write-Host 'O10_ALL_32_DEV_RESULTS=EMITTED'
          Write-Host 'O10_PROTECTED_FIRST_USE=ZERO'
          Write-Host 'O10_SCIENCE_PROMOTION=NONE'
      - name: Retain full native public result for immutable cross-OS acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o10-receipt-${{ matrix.os }}
          path: ${{ runner.temp }}/o10-public-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: One final FORGE Go test vet build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo O10_GO_TEST_VET_BUILD=PASS
      - name: No side effects in public-only source scope
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(& git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) { throw 'O10_DIRTY_WORKTREE' }
          Write-Host 'O10_AUTHORITY_UNMODIFIED=PASS'

  cross-os-public-reconciliation:
    name: Frozen native identity and NLL reconciliation
    needs: public-source-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: o10-receipt-ubuntu-24.04
          path: native-results/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: o10-receipt-windows-2022
          path: native-results/windows
      - name: Enforce preregistered twelve digest and thirty-two NLL cross-OS requirements
        shell: bash
        run: |
          set -euo pipefail
          python -B research/optimizer_o10/cross_os_compare.py \
            native-results/linux/o10-public-receipt.json \
            native-results/windows/o10-public-receipt.json
