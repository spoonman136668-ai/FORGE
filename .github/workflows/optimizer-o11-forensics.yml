name: Optimizer O11 training-only native numerical forensics

on:
  push:
    branches: [research/optimizer-o11-training-determinism-20261023]
    paths:
      - '.github/workflows/optimizer-o11-forensics.yml'
      - 'research/optimizer_o11/**'

permissions:
  contents: read

concurrency:
  group: optimizer-o11-forensics
  cancel-in-progress: false

jobs:
  native-train-only-trace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require exact original model protocol and source-only ancestry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = 'fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5'
          $ancestor = (& git merge-base $parent HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ancestor -cne $parent) {
            throw 'O11_ORIGINAL_MAIN_ANCESTRY_DRIFT'
          }
          $expected = @(
            '.github/workflows/optimizer-o11-forensics.yml',
            'research/optimizer_o11/O11_FROZEN_PROTOCOL.json',
            'research/optimizer_o11/o10_immutable_phase.py',
            'research/optimizer_o11/public_source.py',
            'research/optimizer_o11/train_only_trace.py',
            'research/optimizer_o11/compare.py',
            'research/optimizer_o11/test_forensics.py'
          )
          $actual = @(& git diff --name-only $parent HEAD)
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne $expected.Count -or
              (Compare-Object $actual $expected)) { throw 'O11_SCOPE_DRIFT' }
          $pins = @{
            'research/optimizer_o11/O11_FROZEN_PROTOCOL.json' = 'ad4ed0bb9422d3df4975e79ee49fde45d03fed4a'
            'research/optimizer_o11/o10_immutable_phase.py' = '56203c6aa60b29c4a5e8fb4bcd250bc212582209'
          }
          foreach ($path in $pins.Keys) {
            $head = (& git rev-parse ('HEAD:' + $path)).Trim()
            $disk = (& git hash-object --no-filters -- $path).Trim()
            if ($LASTEXITCODE -ne 0 -or $head -cne $pins[$path] -or
                $disk -cne $pins[$path]) {
              throw ('O11_FROZEN_BLOB_DRIFT_' + $path)
            }
          }
          Write-Host 'O11_BYTE_IDENTICAL_ORIGINAL_MODEL_AND_FROZEN_PROTOCOL=PASS'
      - name: Eleven train-only identity and drift detection regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s research/optimizer_o11 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'O11_TRAIN_ONLY_FOCUSED_TEST_FAILED' }
          Write-Host 'O11_TRAIN_ONLY_TESTS=PASS'
      - name: Trace original O10 parameters gradients and optimizer across fresh TRAIN
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Join-Path $env:RUNNER_TEMP 'o11-native-trace.json'
          python -B research/optimizer_o11/train_only_trace.py $receipt
          if ($LASTEXITCODE -ne 0) { throw 'O11_NATIVE_TRAIN_TRACE_FAILED' }
          Write-Host 'O11_NO_O10_ROLE_CONSUMPTION=PASS'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o11-native-trace-${{ matrix.os }}
          path: ${{ runner.temp }}/o11-native-trace.json
          if-no-files-found: error
          retention-days: 14
      - name: Final one full FORGE Go test vet build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo O11_FULL_GO_REGRESSION=PASS
      - name: Fail if any tracked files were mutated
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(& git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) { throw 'O11_NON_SOURCE_ONLY_CHANGE' }
          Write-Host 'O11_PROTECTED_AUTHORITY_AND_WORKTREE_UNCHANGED=PASS'

  compare-training-only-native-evidence:
    name: Analyze first cross-OS training divergence
    needs: native-train-only-trace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: o11-native-trace-ubuntu-24.04
          path: native-evidence/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: o11-native-trace-windows-2022
          path: native-evidence/windows
      - name: Exact fresh training source and earliest optimizer divergence
        shell: bash
        run: |
          set -euo pipefail
          python -B research/optimizer_o11/compare.py \
            native-evidence/linux/o11-native-trace.json \
            native-evidence/windows/o11-native-trace.json \
            native-evidence/o11-cross-os-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o11-native-cross-os-forensic-report
          path: native-evidence/o11-cross-os-report.json
          if-no-files-found: error
          retention-days: 30
