name: MP-AI05 remote-bootstrap private exception locator
on:
  push:
    branches: [qualification/mpai05-offline-private-proof-20261027]
    paths: ['.github/workflows/mpai05-remote-bootstrap-exception-locator.yml']
permissions:
  contents: read
jobs:
  pinpoint:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    env:
      GIT_TERMINAL_PROMPT: '0'
      GIT_CREDENTIAL_INTERACTIVE: 'never'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: 'core.longpaths'
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Run exact baseline test with only whitelisted error metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'MPAI05_WRONG_RUNNER'}
          $root=Join-Path $env:RUNNER_TEMP ('mpai05-locator-'+$env:GITHUB_RUN_ID)
          $source=Join-Path $root 'source'
          try{
            New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
            & git clone --quiet --single-branch --branch main https://github.com/spoonman136668-ai/Mind-Palace.git $source *> (Join-Path $root 'clone-private.log')
            if($LASTEXITCODE -ne 0){throw 'MPAI05_SOURCE_UNAVAILABLE'}
            if((& git -C $source rev-parse HEAD).Trim() -cne '7ad7230a82e3c748aa5336b7288ad2b45d42630c' -or
               (& git -C $source rev-parse 'HEAD^{tree}').Trim() -cne '61b9d1d64755d6e708dd06b797b36cafef1b4105') {throw 'MPAI05_SOURCE_DRIFT'}
            $wrapper=Join-Path $root 'locator.ps1'
            $privateLog=Join-Path $root 'output-private.log'
            $target=Join-Path $source 'tests\Test-RemoteBootstrap.ps1'
            $lines=@(
              'param([string]$Target,[string]$Log)'
              '$ErrorActionPreference="Stop"'
              'Set-StrictMode -Version Latest'
              'try { & $Target *> $Log; Write-Host "MPAI05_BASELINE_TEST_WRAPPER_RESULT=PASS" }'
              'catch {'
              '  $err=$_'
              '  $etype=[string]$err.Exception.GetType().Name'
              '  if($etype -notmatch "^[A-Za-z][A-Za-z0-9]{1,65}$"){$etype="UNCLASSIFIED"}'
              '  $category=[string]$err.CategoryInfo.Category'
              '  if($category -notmatch "^[A-Za-z][A-Za-z0-9]{1,65}$"){$category="UNCLASSIFIED"}'
              '  $msg=[string]$err.Exception.Message'
              '  $class="OTHER"'
              '  if($msg -match "PathTooLong|filename too long|path too long|File name too long"){$class="PATH_LENGTH"}'
              '  elseif($msg -match "Access is denied|UnauthorizedAccess"){$class="ACCESS"}'
              '  elseif($msg -match "is not recognized|CommandNotFound"){$class="COMMAND_NOT_FOUND"}'
              '  elseif($msg -match "Cannot find path|does not exist"){$class="MISSING_PATH"}'
              '  elseif($msg -match "expected.*argument|parameter.*not found"){$class="ARGUMENT"}'
              '  elseif($msg -match "parser|unexpected token|missing terminator"){$class="PARSER"}'
              '  elseif($msg -match "remote bootstrap test local clone failed"){$class="REMOTE_TEST_CLONE"}'
              '  elseif($msg -match "remote index"){$class="REMOTE_INDEX_ASSERTION"}'
              '  elseif($msg -match "project state"){$class="CAPSULE_ASSERTION"}'
              '  elseif($msg -match "remote catalog"){$class="CATALOG_ASSERTION"}'
              '  elseif($msg -match "generator|remote snapshot"){$class="GENERATOR_ASSERTION"}'
              '  $trace=[string]$err.ScriptStackTrace'
              '  $loc="UNKNOWN"'
              '  $match=[regex]::Match($trace,"Test-RemoteBootstrap\.ps1: line ([0-9]{1,4})")'
              '  if($match.Success){$loc=$match.Groups[1].Value}'
              '  Write-Host ("MPAI05_ERROR_TYPE="+$etype)'
              '  Write-Host ("MPAI05_ERROR_CATEGORY="+$category)'
              '  Write-Host ("MPAI05_ERROR_CLASS="+$class)'
              '  Write-Host ("MPAI05_ERROR_TEST_LINE="+$loc)'
              '  Write-Host "MPAI05_BASELINE_TEST_WRAPPER_RESULT=FAIL"'
              '}'
            )
            [IO.File]::WriteAllLines($wrapper,$lines,[Text.UTF8Encoding]::new($false))
            Push-Location $source
            try{
              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $wrapper -Target $target -Log $privateLog
              if($LASTEXITCODE -ne 0){throw 'MPAI05_WRAPPER_FAILED'}
            } finally {Pop-Location}
            if(@(& git -C $source status --porcelain --untracked-files=all).Count -gt 0){throw 'MPAI05_DISPOSABLE_SOURCE_MUTATED'}
            Write-Host 'MPAI05_PINNED_SOURCE_CUSTODY=PASS'
            Write-Host 'MPAI05_PRODUCTION_MUTATION=FALSE'
          } finally{
            Set-Location $env:RUNNER_TEMP
            if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Force -Recurse -ErrorAction Stop}
          }
