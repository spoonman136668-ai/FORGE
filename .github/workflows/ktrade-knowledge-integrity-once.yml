name: KTRADE committed knowledge vault independent Windows gate
on:
  push:
    branches: [qualification/ktrade-knowledge-integrity-20261027]
    paths: [.github/workflows/ktrade-knowledge-integrity-once.yml]
permissions:
  contents: read
jobs:
  knowledge-integrity:
    if: github.repository == 'spoonman136668-ai/FORGE' && github.actor == 'spoonman136668-ai'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 40
    env:
      EXPECTED_KNOWLEDGE_HEAD: 'b5c2b23a095a057fb25e3dbec6c9fb558d26ca7a'
      EXPECTED_KTRADE_SOURCE: 'a359e86d05e5ba24b71a1f4bdd8a5e36ebd31b58'
      KTRADE_LIVE_AUTHORITY: '0'
      KTRADE_COINBASE_ALLOWED: '0'
      KTRADE_PROMOTION_ALLOWED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read actual private committed graph and vault; no regeneration or runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'self-hosted'){throw 'KNOWLEDGE_WRONG_WINDOWS_RUNNER'}
          if($env:KTRADE_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_PROMOTION_ALLOWED -cne '0'){throw 'KNOWLEDGE_AUTHORITY_UNSAFE'}
          if(-not (Get-Command gh -ErrorAction SilentlyContinue) -or -not (Get-Command python -ErrorAction SilentlyContinue)){throw 'KNOWLEDGE_EXISTING_TOOLS_MISSING'}
          $root=Join-Path $env:SystemDrive ('kq'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KNOWLEDGE_SCRATCH_COLLISION'}
          New-Item -ItemType Directory -Path $root|Out-Null
          $repo=Join-Path $root 'k'
          $log=Join-Path $root 'private-check.log'
          try{
            $env:GIT_TERMINAL_PROMPT='0'
            & git -c core.longpaths=true -c 'credential.helper=!gh auth git-credential' clone --no-checkout 'https://github.com/spoonman136668-ai/ktrade-knowledge.git' $repo *> $log
            if($LASTEXITCODE -ne 0){throw 'KNOWLEDGE_PRIVATE_CLONE_FAILED'}
            & git -C $repo config core.longpaths true
            & git -C $repo -c core.longpaths=true checkout --detach $env:EXPECTED_KNOWLEDGE_HEAD *> $log
            if($LASTEXITCODE -ne 0){throw 'KNOWLEDGE_COMMITTED_CHECKOUT_FAILED'}
            if((git -C $repo rev-parse HEAD).Trim() -cne $env:EXPECTED_KNOWLEDGE_HEAD){throw 'KNOWLEDGE_HEAD_DRIFT'}
            if(@(git -C $repo status --porcelain --untracked-files=no).Count -ne 0){throw 'KNOWLEDGE_CHECKOUT_DIRTY'}
            $record=Get-Content -LiteralPath (Join-Path $repo 'Graphify/Source/LAST-BUILD.json') -Raw|ConvertFrom-Json
            if($record.source_commit -cne $env:EXPECTED_KTRADE_SOURCE){throw 'KNOWLEDGE_SOURCE_SHA_DRIFT'}
            Write-Host 'KTRADE_KNOWLEDGE_EXACT_COMMITTED_HEAD=PASS'
            Push-Location $repo
            try{
              & python -B 'tools/verify_graphify_vault.py'
              if($LASTEXITCODE -ne 0){throw 'KNOWLEDGE_COMMITTED_GRAPH_VAULT_CHECK_FAILED'}
              & python -B 'tools/verify_ktrade_ice.py'
              if($LASTEXITCODE -ne 0){throw 'KNOWLEDGE_HISTORICAL_ICE_INTEGRATION_FAILED'}
              if(@(git status --porcelain --untracked-files=no).Count -ne 0){throw 'KNOWLEDGE_TRACKED_MUTATION'}
            }finally{Pop-Location}
            Write-Host 'KTRADE_KNOWLEDGE_ONE_FINAL_INTEGRATION_REGRESSION=PASS'
            Write-Host 'KTRADE_KNOWLEDGE_READ_ONLY_NO_MERGE_NO_TRADING=PASS'
          }finally{
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }
