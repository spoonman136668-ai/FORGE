name: FORGE cloud-isolated source repair coordinator
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [qualification/forge-remote-only-codex-r1]

# GitHub-hosted disposable jobs only. NEVER check out untrusted PR content on
# a persistent user-session runner with ChatGPT subscription credentials.
# GitHub-hosted requests use the existing @codex GitHub app; no API key,
# CODEX_HOME, auth.json, local codex exec or source execution.
permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write
concurrency:
  group: forge-cloud-source-repair
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Inspect exact owner PRs and request bounded cloud repair
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,subprocess
          repo=os.environ["REPO"]
          def api(path):
              return json.loads(subprocess.check_output(
                  ["gh","api",path],text=True))
          def comment(number,body):
              subprocess.check_call(["gh","api","-X","POST",
                  f"repos/{repo}/issues/{number}/comments","-f",f"body={body}"],
                  stdout=subprocess.DEVNULL)
          prs=api(f"repos/{repo}/pulls?state=open&per_page=100")
          for pr in sorted(prs,key=lambda p:p["number"]):
              number=pr["number"];branch=pr["head"]["ref"];sha=pr["head"]["sha"]
              if (pr["draft"] or pr["user"]["login"]!="spoonman136668-ai"
                  or pr["head"]["repo"]["full_name"]!=repo
                  or pr["base"]["ref"]!="main"
                  or not re.fullmatch(r"proposal/fsa[a-zA-Z0-9/_-]*",branch)
                  or not re.fullmatch(r"[0-9a-f]{40}",sha)):
                  continue
              files=api(f"repos/{repo}/pulls/{number}/files?per_page=100")
              if not 0<len(files)<=6:continue
              if any(f["status"] not in ("added","modified") or
                    not re.fullmatch(r"(eligibility|startrecovery|fsaadmission)/[^/]+[.]go",f["filename"])
                    for f in files):continue
              findings=api(f"repos/{repo}/pulls/{number}/comments?per_page=100")
              has_findings=any(c.get("commit_id")==sha and
                  c.get("user",{}).get("login","").startswith("chatgpt-codex-connector") and
                  re.search(r"\[P[12]",c.get("body","")) for c in findings)
              if not has_findings:continue
              comments=api(f"repos/{repo}/issues/{number}/comments?per_page=100")
              marker=f"FORGE_CLOUD_REPAIR_REQUEST_V1:{sha}"
              if any(marker in c.get("body","") for c in comments):continue
              # The cloud Codex app operates outside the logged-in Windows runner.
              # This request does NOT authorize merging or scientific activation.
              # Its result still needs independent exact-head hosted qualification.
              body=(
                  "@codex address that feedback\n\n"
                  "Please address the current-head Codex P1/P2 inline findings, "
                  "changing only .go source and adversarial tests in "
                  "eligibility/, startrecovery/, or fsaadmission/ (at most six files). "
                  "Keep frozen science, budgets, credentials, controller, workflows, "
                  "other repos and all execution authority unchanged. "
                  "Do not run original scientific experiments. "
                  f"Exact starting head: `{sha}`. "
                  "Independent hosted Linux/Windows CI and fresh separate review "
                  "are mandatory before promotion.\n\n"
                  f"<!-- {marker} -->")
              # Re-fetch exact PR head immediately before this one-shot request.
              current=api(f"repos/{repo}/pulls/{number}")
              if current["head"]["sha"]!=sha:continue
              comment(number,body)
              print(f"CLOUD_REPAIR_REQUESTED_PR={number} HEAD={sha}")
              break
          else:
              print("NO_ELIGIBLE_CLOUD_REPAIR_FINDINGS")
          PY
      - name: Assert permanent runner isolation
        shell: bash
        run: |
          set -euo pipefail
          echo 'UNTRUSTED_PR_CHECKOUT_ON_USER_RUNNER=PROHIBITED'
          echo 'CODEX_LOCAL_EXEC_ON_USER_RUNNER=PROHIBITED'
          echo 'NO_PAID_API_OR_SESSION_EXPORT=PASS'
          echo 'SCIENTIFIC_EXECUTION=DISABLED'
