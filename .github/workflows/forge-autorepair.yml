name: FORGE cloud-isolated source repair coordinator
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [qualification/forge-remote-only-codex-r1]

# GitHub-hosted disposable jobs only. NEVER check out untrusted PR content on
# a persistent user-session runner with ChatGPT subscription credentials.
# Comment-triggered Codex repairs cannot mechanically pin their starting SHA.
# Inspect findings but fail closed until a commit-pinned task API is qualified.
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: forge-cloud-source-repair
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Inspect exact owner PRs and reject unpinned repair dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,subprocess
          repo=os.environ["REPO"]
          def api(path):
              return json.loads(subprocess.check_output(
                  ["gh","api",path],text=True))
          prs=api(f"repos/{repo}/pulls?state=open&per_page=100")
          for pr in sorted(prs,key=lambda p:p["number"]):
              number=pr["number"];branch=pr["head"]["ref"];sha=pr["head"]["sha"]
              if (pr["draft"] or pr["user"]["login"]!="spoonman136668-ai"
                  or pr["head"]["repo"]["full_name"]!=repo
                  or pr["base"]["ref"]!="main"
                  or not re.fullmatch(r"proposal/fsa[a-zA-Z0-9/_-]*",branch)
                  or not re.fullmatch(r"[0-9a-f]{40}",sha)):
                  continue
              files=api(f"repos/{repo}/pulls/{number}/files?per_page=100")
              if not 0<len(files)<=6:continue
              if any(f["status"] not in ("added","modified") or
                    not re.fullmatch(r"(eligibility|startrecovery|fsaadmission)/[^/]+[.]go",f["filename"])
                    for f in files):continue
              findings=api(f"repos/{repo}/pulls/{number}/comments?per_page=100")
              has_findings=any(c.get("commit_id")==sha and
                  c.get("user",{}).get("login","") in ("chatgpt-codex-connector","chatgpt-codex-connector[bot]") and
                  re.search(r"\[P[12]",c.get("body","")) for c in findings)
              if not has_findings:continue
              # A PR issue comment binds only to a mutable branch, not the
              # validated immutable commit. Rechecking the SHA before POST
              # cannot prevent a branch change before cloud task creation.
              # Never dispatch through this path, even when a finding matches.
              current=api(f"repos/{repo}/pulls/{number}")
              if current["head"]["sha"]!=sha:continue
              raise SystemExit(f"UNPINNED_CLOUD_REPAIR_DISPATCH_BLOCKED PR={number} SHA={sha}")
          else:
              print("NO_ELIGIBLE_CLOUD_REPAIR_FINDINGS")
          PY
      - name: Assert permanent runner isolation
        shell: bash
        run: |
          set -euo pipefail
          echo 'UNTRUSTED_PR_CHECKOUT_ON_USER_RUNNER=PROHIBITED'
          echo 'CODEX_LOCAL_EXEC_ON_USER_RUNNER=PROHIBITED'
          echo 'NO_PAID_API_OR_SESSION_EXPORT=PASS'
          echo 'SCIENTIFIC_EXECUTION=DISABLED'
