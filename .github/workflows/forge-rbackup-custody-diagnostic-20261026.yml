name: FORGE RBACKUP custody path diagnostic
on:
  push:
    branches:
      - qualification/forge-rbackup-token-probe-20261026
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report custody path state without reading key contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'RBACKUP_DIAGNOSTIC_WRONG_RUNNER' }
          $root = Join-Path $env:LOCALAPPDATA 'rbackup-custody'
          $paths = @{
            LocalRoot = $env:LOCALAPPDATA
            CustodyRoot = $root
            PrimaryDir = Join-Path $root 'primary'
            RecoveryDir = Join-Path $root 'recovery'
            ArchiveDir = Join-Path $root 'archives'
          }
          foreach ($name in $paths.Keys) {
            $path = $paths[$name]
            $exists = Test-Path -LiteralPath $path
            Write-Output "RBACKUP_PATH_${name}_EXISTS=$exists"
            if ($exists -and (Test-Path -LiteralPath $path -PathType Container)) {
              $item = Get-Item -LiteralPath $path -Force
              Write-Output "RBACKUP_PATH_${name}_REPARSE=$([bool](($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0))"
              $approved = @([Security.Principal.WindowsIdentity]::GetCurrent().User.Value, 'S-1-5-18', 'S-1-5-32-544')
              $broad = 0
              foreach ($ace in (Get-Acl -LiteralPath $path).Access) {
                if ($ace.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow) { continue }
                try { $sid = $ace.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value } catch { $broad++; continue }
                if ($approved -notcontains $sid) { $broad++ }
              }
              Write-Output "RBACKUP_PATH_${name}_BROAD_ALLOW_COUNT=$broad"
            }
          }
          Write-Output "RBACKUP_PRIMARY_IDENTITY_PRESENT=$(Test-Path -LiteralPath (Join-Path $root 'primary\identity.txt') -PathType Leaf)"
          Write-Output "RBACKUP_RECOVERY_IDENTITY_PRESENT=$(Test-Path -LiteralPath (Join-Path $root 'recovery\identity.txt') -PathType Leaf)"
          Write-Output 'RBACKUP_KEY_CONTENTS=NOT_READ'
          Write-Output 'CLOUDFLARE_ACCESS=NONE'
