name: ITD02 F124CO FIT-only learned structure qualification
on:
  push:
    branches: [research/itd02-f124co-learn-structure-20261025]
permissions:
  contents: read
jobs:
  source-public-fit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Original source, protocol-first, and closed model identity
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          git merge-base --is-ancestor 3577f75fedbb5c3929e221c8f33acf82dbdbb9cd HEAD
          if ($LASTEXITCODE -ne 0) { throw "F124CO_PARENT_F124CN_DRIFT" }
          $pins=@{
            "research/north-star-transfer/f124co/FROZEN_PROTOCOL.json"="cb0983ff5ec06289d56413edf89658006ee9ffb3"
            "research/north-star-transfer/f124cj_internal_source.py"="4e7bbd8f93dab1c7242a9374c75731302b034f31"
            "research/north-star-transfer/f124cb_dual_link_learner.py"="8a10bf8cec12afc7d8703e3586d8eba91ebfdc7c"
            "research/north-star-transfer/f124cc_trained_two_link_control.py"="29c0c02f54ea539bed0910fe82adcc86d3aff94d"
            "research/north-star-transfer/f124cm/FROZEN_PROTOCOL.json"="9a5d4315b4de9956942be910fde6ac54b5147377"
            "research/north-star-transfer/f124cn/FROZEN_PROTOCOL.json"="6455fe858915cdcd1c95ae0c99791b41eac58fb1"
          }
          foreach($p in $pins.Keys) {
            $now=(git hash-object $p).Trim()
            if($LASTEXITCODE -ne 0 -or $now -cne $pins[$p]) { throw "F124CO_IMMUTABLE_SOURCE_DRIFT $p" }
          }
          $env:PYTHONDONTWRITEBYTECODE="1"
          $env:PYTHONNOUSERSITE="1"
          python -B -m unittest discover -s research/north-star-transfer/f124co -p "test_learn_structure.py" -v
          if($LASTEXITCODE -ne 0){ throw "F124CO_ADVERSARIAL_FOCUSED_FAIL" }
          python -B research/north-star-transfer/f124co/run.py --json "$env:RUNNER_TEMP/f124co-A.json" --resources "$env:RUNNER_TEMP/f124co-resource-A.json"
          if($LASTEXITCODE -ne 0){ throw "F124CO_REAL_ARTIFICIAL_FIT_FAIL_A" }
          python -B research/north-star-transfer/f124co/run.py --json "$env:RUNNER_TEMP/f124co-B.json" --resources "$env:RUNNER_TEMP/f124co-resource-B.json"
          if($LASTEXITCODE -ne 0){ throw "F124CO_REAL_ARTIFICIAL_FIT_FAIL_B" }
          if((Get-FileHash "$env:RUNNER_TEMP/f124co-A.json" -Algorithm SHA256).Hash -cne (Get-FileHash "$env:RUNNER_TEMP/f124co-B.json" -Algorithm SHA256).Hash) { throw "F124CO_CANONICAL_SCIENCE_DRIFT" }
          git diff --exit-code
          if($LASTEXITCODE -ne 0) { throw "F124CO_SOURCE_WORKTREE_DIRTY" }
          Write-Output "F124CO_DISCOVERED_WIRING_SOURCE_PUBLIC_FIT=QUALIFIED_ENGINEERING"
          Write-Output "F124CO_ORIGINAL_PROTECTED_ACTIONS=ZERO"
          Write-Output "F124CO_FSA_ORIGINAL_FIRSTUSE=DENIED"
  one-final-go-regression:
    needs: [source-public-fit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOFLAGS: "-p=2"
      GOMAXPROCS: "2"
      GOMEMLIMIT: "1536MiB"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Single existing full FORGE Go regression, vet, build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          git diff --exit-code
          echo F124CO_ONE_FINAL_FULL_GO_REGRESSION=PASS
