name: ITD-02 MG06 true native-only original DoorKey exploration with independent controls
on:
  push:
    branches: [research/itd02-mg06-native-exploration-farama-20261028]
permissions:
  contents: read
jobs:
  authentic-minigrid-native-exploration:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Exact original Git newline policy
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout original source without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Original Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Native Go 1.25.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Execute real no-collector source-only MiniGrid on 5 independent arms
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash research/lcrm01/mg06_ci.sh
      - name: Preserve both independent full original-environment source runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-mg06-original-doorkey-zero-external-native-exploration
          path: |
            ${{ runner.temp }}/mg06/first.json
            ${{ runner.temp }}/mg06/second.json
            ${{ runner.temp }}/mg06/comparison.json
            ${{ runner.temp }}/mg06/first.log
            ${{ runner.temp }}/mg06/second.log
          retention-days: 30
          if-no-files-found: warn
