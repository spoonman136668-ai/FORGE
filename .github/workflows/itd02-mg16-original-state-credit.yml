name: ITD-02 MG16 authentic original exact-state credit seven-arm comparison
on:
  push:
    branches: [research/itd02-mg16-original-world-credit-20261029]
permissions:
  contents: read
jobs:
  genuine-original-source-seven-actor-two-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Original exact LF source
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact repository research commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Source Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Native Go 1.25.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Qualify two independently executed original Farama seven-arm source trials
        shell: bash
        run: bash research/lcrm01/mg16_ci.sh
      - name: Retain all positive and negative actual original source events
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-mg16-exact-state-credit-original-seven-arm-evidence
          path: |
            ${{ runner.temp }}/mg16/first.json
            ${{ runner.temp }}/mg16/second.json
            ${{ runner.temp }}/mg16/comparison.json
            ${{ runner.temp }}/mg16/first.log
            ${{ runner.temp }}/mg16/second.log
          retention-days: 30
          if-no-files-found: warn
