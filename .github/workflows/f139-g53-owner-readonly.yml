name: F139 G53 original-owner V8 read-only progression
on:
  push:
    branches:
      - diagnostic/f139-g53-original-owner-v8-progression-20261025
permissions:
  contents: read
concurrency:
  group: f139-g53-original-owner-readonly
  cancel-in-progress: false
jobs:
  original-owner:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original task and ledger without writing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $old = '157d3b545ceda507f4f8fabdf5c7b654a0b2fc84'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:GITHUB_REF -cne 'refs/heads/diagnostic/f139-g53-original-owner-v8-progression-20261025' -or
              $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1') {
            throw 'G53_ORIGINAL_OWNER_RUNNER_DRIFT'
          }
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          $info=Get-ScheduledTaskInfo -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if (@($task.Actions).Count -ne 1 -or @($task.Triggers).Count -ne 3) {
            throw 'G53_ORIGINAL_TASK_TOPOLOGY_DRIFT'
          }
          $owner=[string]$task.Principal.UserId
          $sid=''
          try {$sid=(New-Object Security.Principal.NTAccount($owner)).Translate(
                 [Security.Principal.SecurityIdentifier]).Value} catch {}
          if ($owner -ine $identity.Name -and $sid -cne $identity.User.Value) {
            throw 'G53_ORIGINAL_TASK_SID_DRIFT'
          }
          function Arg([string]$key) {
            $pattern='(?i)(?:^|\s)-'+[regex]::Escape($key)+'\s+"([^"]+)"'
            $m=[regex]::Match([string]$task.Actions[0].Arguments,$pattern)
            if (-not $m.Success) {throw 'G53_ORIGINAL_TASK_ARG_MISSING'}
            return $m.Groups[1].Value
          }
          $root=Arg 'RepositoryRoot'
          $db=Arg 'Database'
          $python=Arg 'PythonExe'
          $expectedDb=Join-Path $env:LOCALAPPDATA 'FORGE-F139\state.sqlite'
          if ([IO.Path]::GetFullPath($db) -ine [IO.Path]::GetFullPath($expectedDb) -or
              -not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw 'G53_ORIGINAL_DATABASE_DRIFT'
          }
          $installed=(& git -C $root rev-parse HEAD | Out-String).Trim()
          $dirty=(& git -C $root status --porcelain --untracked-files=all | Out-String).Trim()
          if ($installed -cne $old -or $LASTEXITCODE -ne 0 -or $dirty) {
            throw 'G53_ORIGINAL_DEPLOYED_SOURCE_DRIFT'
          }
          Write-Host ('G53_TASK_STATE='+[string]$task.State)
          Write-Host ('G53_TASK_LAST_RESULT='+[string]$info.LastTaskResult)
          Write-Host ('G53_TASK_LAST_RUN='+$info.LastRunTime.ToString('o'))
          Write-Host ('G53_TASK_NEXT_RUN='+$info.NextRunTime.ToString('o'))
          $audit=@'
          import json,pathlib,re,sqlite3,sys
          from collections import Counter
          root=pathlib.Path(sys.argv[1]).resolve()
          origin=pathlib.Path(sys.argv[2]).resolve(strict=True)
          sys.path.insert(0,str(root))
          from f139.local_controller import Database,GitHub,v2_owner_terminal_release_guard
          from f139.nci04_owner_ledger import verify_native_activation
          conn=sqlite3.connect(origin.as_uri()+"?mode=ro",uri=True,timeout=15,isolation_level=None)
          conn.row_factory=sqlite3.Row
          conn.execute("PRAGMA query_only=ON")
          conn.execute("BEGIN")
          d=Database.__new__(Database)
          d.filename=origin
          d.conn=conn
          try:
              d.verify()
              meta=d.meta()
              api=GitHub()
              protected=api.protected_main()
              exact=meta["source_sha"]==protected
              allowed=(exact or api.research_only_main_advance(meta["source_sha"],protected))
              tasks=d.status()["tasks"]
              ready=d.ready()
              active=d.actives()
              recent=[]
              for row in d.conn.execute("SELECT seq,kind,payload FROM events ORDER BY seq DESC LIMIT 20"):
                  doc=json.loads(row["payload"])
                  recent.append({"seq":row["seq"],"kind":row["kind"],
                                 "issue":doc.get("issue_number"),"ticket":doc.get("ticket")})
              log=origin.parent/"logs"/"controller.log"
              codes=[]
              dispositions=[]
              if log.is_file():
                  tail=log.read_text(encoding="utf-8-sig",errors="replace")[-120000:]
                  codes=re.findall(r"\bF139_[A-Z0-9_]{5,80}\b",tail)[-12:]
                  dispositions=re.findall(r'"disposition"\s*:\s*"([A-Z0-9_]+)"',tail)[-12:]
              r={"schema":"forge.f139.original-owner-v8-readonly.v1",
                 "source_sha":meta["source_sha"],"protected_main_sha":protected,
                 "source_exact":exact,"continuity_permitted":bool(allowed),
                 "head_seq":meta["head_seq"],"head_hash":meta["head_hash"],
                 "enabled":meta["enabled"],"native_active":bool(verify_native_activation(d)),
                 "v2_guard":bool(v2_owner_terminal_release_guard(meta["source_sha"],d)),
                 "stages":dict(Counter(t["stage"] for t in tasks)),
                 "ticket970":[{"ticket":t["ticket"],"stage":t["stage"]}
                     for t in tasks if t["ticket"].startswith("f139-nci04-i970-")],
                 "ready":ready["ticket"] if ready else None,
                 "active":[x["ticket"] for x in active],
                 "recent_events":recent,"dispositions":dispositions,"errors":codes,
                 "scientific_first_use":False}
              print("G53_ORIGINAL_V8_RESULT="+json.dumps(r,sort_keys=True))
          finally:
              d.close()
          '@
          & $python -B -c $audit $root $db
          if ($LASTEXITCODE -ne 0) {throw 'G53_ORIGINAL_READONLY_INSPECTION_FAILED'}
          Write-Host 'G53_READONLY_ORIGINAL=PASS'
