name: FORGE CPU G101 pinned original GPT2 parity-only diagnostic
on:
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: cpu-g101-original-parity-once
  cancel-in-progress: false
env:
  G101_FROZEN_SHA: 02267960aa9f9944cb598c1f126f64439ef4a2f3
jobs:
  source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.admit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.G101_FROZEN_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify one-shot push and exact immutable qualified source
        id: admit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TRIGGER_BEFORE: ${{ github.event.before }}
          TRIGGER_FORCED: ${{ github.event.forced }}
          TRIGGER_REF: ${{ github.ref_name }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$TRIGGER_EVENT" = "push"
          test "$TRIGGER_REF" = "research/cpu-llm-g96-admission-policy-20261031"
          test "$TRIGGER_BEFORE" = "$G101_FROZEN_SHA"
          test "$TRIGGER_FORCED" = "false"
          test "$(git rev-parse HEAD)" = "$G101_FROZEN_SHA"
          test "$(git rev-parse HEAD:research/cpu_g95/g95_multiprefix_lru_original.py)" = "b401c86e4dff2f25eb995a47ba58884838f232eb"
          python - <<'PY'
          import json,os,urllib.request
          sha=os.environ["G101_FROZEN_SHA"]
          url=f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/runs?head_sha={sha}&per_page=100"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
            "Accept":"application/vnd.github+json","User-Agent":"FORGE-G101-IMMUTABLE-ADMISSION"})
          with urllib.request.urlopen(req,timeout=30) as f:
              runs=json.load(f)["workflow_runs"]
          if not any(r["name"]=="FORGE public Linux and Windows qualification" and
              r["head_sha"]==sha and r["status"]=="completed" and r["conclusion"]=="success" for r in runs):
              raise SystemExit("G101_MANDATORY_EXACT_HEAD_REGRESSION_NOT_PASS")
          print("G101_EXACT_HEAD_MANDATORY_REGRESSION=PASS")
          PY
          python -B -m py_compile research/cpu_g97/g101_original_adapter.py research/cpu_g97/g101_prefix_capture.py research/cpu_g97/g101_original_parity.py
          python -B -m unittest discover -s research/cpu_g97 -p 'test_g101*.py' -v
          echo "source_sha=$G101_FROZEN_SHA" >> "$GITHUB_OUTPUT"
          echo G101_CORRECTNESS_ONLY_SOURCE_ADMISSION=PASS
  original-model-parity:
    needs: source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONPATH: .
      G101_DEVELOPMENT_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-admission.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact original CPU GPT2 environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$G101_FROZEN_SHA"
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 huggingface-hub==0.30.2 safetensors==0.5.3 tokenizers==0.21.1 psutil==7.1.3
          python -m pip check
          python -m pip freeze > cpu_g101_parity_environment.txt
          uname -a >> cpu_g101_parity_environment.txt
          lscpu >> cpu_g101_parity_environment.txt
      - name: Execute original-model token and KV parity only
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$G101_FROZEN_SHA" python research/cpu_g97/g101_original_parity.py
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("cpu_g101_original_parity.json").read_text())
          assert r["source_sha"]==os.environ["G101_FROZEN_SHA"]
          assert r["phase"]=="DEVELOPMENT_ONLY"
          assert r["heldout_executed"] is False and r["promotion_allowed"] is False
          assert r["performance_verdict"]=="NOT_EVALUATED"
          assert r["parity"]=="PASS" and r["kv_exact"]=="PASS"
          assert r["development_ranks"]==list(range(276,286))
          assert len(r["kv_checks"])==10 and all(v["exact"] for v in r["kv_checks"])
          assert r["cache_counters"]["max_resident_kv_bytes"]<=86114304
          assert r["model_calls"]==10*8
          print("G101_PINNED_MODEL_CORRECTNESS=PASS")
          PY
      - name: Preserve bounded G101 original-model parity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-g101-original-gpt2-parity-only
          retention-days: 30
          if-no-files-found: warn
          path: |
            cpu_g101_original_parity.json
            cpu_g101_parity_environment.txt
