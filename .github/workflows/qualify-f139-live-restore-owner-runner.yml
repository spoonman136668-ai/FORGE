name: F139 existing owner read-only external recovery media inventory (one-shot)
on:
  push:
    branches: [fix/f139-restore-reconciliation-20261023]
permissions:
  contents: read
concurrency:
  group: f139-live-restore-sourceonly
  cancel-in-progress: false
jobs:
  physical-media-readonly:
    if: github.actor == 'spoonman136668-ai' && github.run_attempt == 1 && github.event.head_commit.message == 'ops(f139): one-shot read-only separate-media inventory'
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    steps:
      - name: Inspect only partition and physical-disk attributes; no files or credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:GITHUB_REF -cne 'refs/heads/fix/f139-restore-reconciliation-20261023' -or
              $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1') {
            throw 'F139_UNEXPECTED_READONLY_MEDIA_PROBE_SOURCE'
          }
          $system = @(Get-Partition -DriveLetter C -ErrorAction Stop)
          if ($system.Count -ne 1) { throw 'F139_SYSTEM_VOLUME_IDENTITY_UNAVAILABLE' }
          $systemDisk = @(Get-Disk -Number $system[0].DiskNumber -ErrorAction Stop)
          if ($systemDisk.Count -ne 1) { throw 'F139_SYSTEM_DISK_IDENTITY_UNAVAILABLE' }
          $target = @(Get-Partition -DriveLetter D -ErrorAction SilentlyContinue)
          Write-Output 'F139_MEDIA_INVENTORY_READONLY=PASS'
          if ($target.Count -ne 1) {
            Write-Output 'F139_D_VOLUME_AVAILABLE=FALSE'
            Write-Output 'F139_D_SEPARATE_PHYSICAL_DISK=UNVERIFIED'
          } else {
            $targetDisk = @(Get-Disk -Number $target[0].DiskNumber -ErrorAction Stop)
            if ($targetDisk.Count -ne 1) { throw 'F139_TARGET_DISK_IDENTITY_UNAVAILABLE' }
            $different = $targetDisk[0].Number -ne $systemDisk[0].Number
            $usb = [string]$targetDisk[0].BusType -ceq 'USB'
            $sizeGiB = [math]::Floor([double]$targetDisk[0].Size / 1GB)
            Write-Output 'F139_D_VOLUME_AVAILABLE=TRUE'
            Write-Output ('F139_D_SEPARATE_PHYSICAL_DISK=' + [string]$different)
            Write-Output ('F139_D_BUS_USB=' + [string]$usb)
            Write-Output ('F139_D_CAPACITY_GIB_APPROX=' + [string]$sizeGiB)
          }
          Write-Output 'F139_MEDIA_PRESENT_DOES_NOT_PROVE_OFFLINE_CUSTODY=TRUE'
          Write-Output 'F139_OFFHOST_KEY_CUSTODY=UNVERIFIED'
          Write-Output 'F139_D1_PROVIDER_CALLS=ZERO'
          Write-Output 'F139_KEY_OR_ARCHIVE_FILES_OPENED=ZERO'
          Write-Output 'F139_KEY_OR_CIPHERTEXT_COPIED=FALSE'
          Write-Output 'F139_FSA_FIRST_USE=DENIED'
