name: FORGE R19E executable CKB signature parity
on:
  push:
    branches:
      - proposal/r19e-signature-dedupe-20261011
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Immutable upstream source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 0a0cd9630ea1e65cbae1cfa0f7be1d402d11a0b1
          test "$(git rev-parse HEAD:reference/ckb-r196/portfolio.py)" = 74787fac19b8c8c93892573eacc6fe518f891476
      - name: Cross-execute pinned CKB and FORGE selections
        shell: bash
        env:
          CKB_SOURCE: ${{ github.workspace }}/reference/ckb-r196
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/forge-select" ./cmd/forge-selection-compare
          export FORGE_SELECT_EXE="$RUNNER_TEMP/forge-select"
          python scripts/r19d_selection_differential.py
      - name: Full Go regression
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          if [ "$RUNNER_OS" = Linux ]; then go test -race -count=1 ./...; fi
