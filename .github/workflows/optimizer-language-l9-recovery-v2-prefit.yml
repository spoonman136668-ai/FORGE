name: L9 dormant Transformer SELECT recovery v2 negative prefit
on:
  push:
    branches: [research/optimizer-language-l9-webnlg-transfer-20261023]
    paths:
      - '.github/workflows/optimizer-language-l9-recovery-v2-prefit.yml'
permissions:
  contents: read
concurrency:
  group: l9-recovery-v2-negative-admission-20261024
  cancel-in-progress: false
jobs:
  fail-closed-static:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Verify prospective v2 source and fail-closed negative controls only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '78c64788dbf4c0777371f84b925ca0ea1e6d091e'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/optimizer-language-l9-recovery-v2-prefit.yml'
          p='research/optimizer_language_l9'
          test "$(git rev-parse HEAD:$p/l9_transformer_select_reuse_v2.py)" = '129b95487e8ea7c28e1e09179c009b6e87cbd653'
          test "$(git rev-parse HEAD:$p/test_l9_transformer_select_reuse_v2.py)" = 'a9c2c4717c9ec41e168d76109ae408d4e528de0c'
          test "$(git rev-parse HEAD:$p/l9_model_suite.py)" = '710ce648a30ffc55647f689c5f4aa3ac13b07066'
          test "$(git rev-parse HEAD:$p/l9_neural_select_only.py)" = '91f8108af5e6f3a25e2a8ca07dc3674bd2358f4e'
          test "$(git rev-parse HEAD:$p/L9_MODEL_CONTRACT.json)" = '4eab05a2b9011ebbaa34d01778e7f185807704c2'
          test "$(git rev-parse HEAD:$p/L9_SPLIT_RECEIPT.json)" = 'ca3e41e2835713bc922c56542656489f202c55cf'
          python -m py_compile "$p/l9_transformer_select_reuse_v2.py" "$p/test_l9_transformer_select_reuse_v2.py"
          (cd "$p" && python -m unittest -v test_l9_transformer_select_reuse_v2.py)
          python -c 'import pathlib,shutil; [shutil.rmtree(x) for x in pathlib.Path("research/optimizer_language_l9").rglob("__pycache__")]'
          test -z "$(git status --porcelain)"
          echo L9_RECOVERY_V2_NEGATIVE_ADMISSION=PASS
          echo L9_PROSPECTIVE_SOURCE_NOT_RUN_ON_SELECT=TRUE
          echo L9_ORIGINAL_SELECT_JOBS_UNTOUCHED=TRUE
          echo L9_AUDIT_REFERENCE_CONSUMED=FALSE
          echo L9_SCIENTIFIC_GO=FALSE
