name: CKB R444 non-secret Task Scheduler historical exit evidence
on:
  push:
    branches: [audit/ckb-r444-scheduler-history-nonsecret-20261027]
permissions:
  contents: read
jobs:
  historical-task-results:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 7
    steps:
      - name: Read only Task Scheduler status and R442B historical result codes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){throw 'R444_WRONG_WINDOWS_OWNER_RUNNER'}
          $task=@(Get-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction Stop)
          if($task.Count -ne 1){throw 'R444_ORIGINAL_TASK_NOT_UNIQUE'}
          $info=Get-ScheduledTaskInfo -InputObject $task[0] -ErrorAction Stop
          Write-Output ('R444_CURRENT_TASK_STATE='+[string]$task[0].State)
          Write-Output ('R444_CURRENT_LAST_TASK_RESULT='+[string]$info.LastTaskResult)
          Write-Output ('R444_CURRENT_LAST_RUN_UTC='+$info.LastRunTime.ToUniversalTime().ToString('o'))
          $start=[datetime]::Parse('2026-10-27T13:43:00Z').ToUniversalTime()
          $end=[datetime]::Parse('2026-10-27T13:49:00Z').ToUniversalTime()
          $logName='Microsoft-Windows-TaskScheduler/Operational'
          $codes=@(100,101,102,103,110,111,129,200,201,202,203,322)
          try {
            $events=@(Get-WinEvent -FilterHashtable @{LogName=$logName;StartTime=$start;EndTime=$end} -MaxEvents 500 -ErrorAction Stop | Where-Object {$_.Id -in $codes -and [string]$_.Message -match 'CKB-plane Controller'} | Sort-Object TimeCreated)
            if($events.Count -gt 32){throw 'R444_EVENT_COUNT_TOO_LARGE'}
            Write-Output ('R444_HISTORICAL_MATCHING_EVENTS='+$events.Count)
            foreach($event in $events) {
              Write-Output ('R444_EVENT_ID='+[string]$event.Id)
              Write-Output ('R444_EVENT_UTC='+$event.TimeCreated.ToUniversalTime().ToString('o'))
              $xml=[xml]$event.ToXml()
              foreach($data in @($xml.Event.EventData.Data)) {
                $key=[string]$data.Name
                if($key -in @('ResultCode','ErrorCode','ReturnCode','ExitCode','HRESULT')) {
                  $value=[string]$data.'#text'
                  if($value -match '^(?:0x[0-9A-Fa-f]{1,8}|-?[0-9]{1,10})$'){
                    Write-Output ('R444_EVENT_'+$key.ToUpperInvariant()+'='+$value)
                  }
                }
              }
            }
            Write-Output 'R444_ORIGINAL_TASK_EVENT_INSPECTION=PASS'
          } catch {
            Write-Output ('R444_HISTORICAL_EVENT_READ_UNAVAILABLE='+$_.Exception.GetType().Name)
          }
          Write-Output 'R444_NO_PROCESS_ACTION_OR_TOKEN_READ=TRUE'
      - name: R444B determine whether Task Scheduler event history is retained
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){throw 'R444B_WRONG_WINDOWS_OWNER_RUNNER'}
          $name='Microsoft-Windows-TaskScheduler/Operational'
          try {
            $meta=Get-WinEvent -ListLog $name -ErrorAction Stop
            Write-Output ('R444B_LOG_ENABLED='+[string]$meta.IsEnabled)
            Write-Output ('R444B_LOG_RECORD_COUNT='+[string]$meta.RecordCount)
            Write-Output ('R444B_LOG_MAX_SIZE_BYTES='+[string]$meta.MaximumSizeInBytes)
            Write-Output ('R444B_LOG_TYPE='+[string]$meta.LogType)
          } catch {
            $typ=$_.Exception.GetType().Name
            if($typ -notmatch '^[A-Za-z]{3,80}$'){$typ='OTHER'}
            Write-Output ('R444B_LOG_METADATA_ERROR_TYPE='+$typ)
          }
          try {
            $e=@(Get-WinEvent -LogName $name -MaxEvents 6 -ErrorAction Stop)
            Write-Output ('R444B_GENERIC_EVENT_READ_COUNT='+$e.Count)
            foreach($x in $e){
              Write-Output ('R444B_GENERIC_EVENT_ID='+[string]$x.Id)
              Write-Output ('R444B_GENERIC_EVENT_TIME_UTC='+$x.TimeCreated.ToUniversalTime().ToString('o'))
            }
          }catch{
            $id=[string]$_.FullyQualifiedErrorId
            if($id -notmatch '^[A-Za-z0-9.,_-]{1,150}$'){$id='OTHER'}
            $code=[string]$_.Exception.HResult
            Write-Output ('R444B_READ_EXCEPTION_ID='+$id)
            Write-Output ('R444B_READ_EXCEPTION_HRESULT='+$code)
          }
          Write-Output 'R444B_METADATA_ONLY_NO_CKB_CONTROLLER_TOUCH=TRUE'
      - name: R444C read only historical application-fault event codes for failed candidate window
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){throw 'R444C_WRONG_ORIGINAL_OWNER'}
          $start=[datetime]::Parse('2026-10-27T13:43:00Z').ToUniversalTime()
          $end=[datetime]::Parse('2026-10-27T13:49:00Z').ToUniversalTime()
          $ids=@(1000,1001,1002,1026)
          try {
            $events=@(Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=$start;EndTime=$end} -MaxEvents 500 -ErrorAction Stop | Where-Object {$_.Id -in $ids -and ([string]$_.Message -match '(?i)ckb-plane(?:\.exe)?')} | Sort-Object TimeCreated)
            if($events.Count -gt 24){throw 'R444C_EVENT_CUSTODY_UNBOUNDED'}
            Write-Output ('R444C_CKB_APPLICATION_FAULT_EVENTS='+$events.Count)
            foreach($e in $events){
              Write-Output ('R444C_FAULT_EVENT_ID='+[string]$e.Id)
              Write-Output ('R444C_FAULT_EVENT_UTC='+$e.TimeCreated.ToUniversalTime().ToString('o'))
              $provider=[string]$e.ProviderName
              if($provider -notmatch '^[A-Za-z0-9 ._-]{1,80}$'){$provider='OTHER'}
              Write-Output ('R444C_FAULT_PROVIDER='+$provider)
              $xml=[xml]$e.ToXml()
              foreach($d in @($xml.Event.EventData.Data)){
                $key=[string]$d.Name
                if($key -in @('ExceptionCode','ResultCode','ErrorCode','StatusCode')){
                  $value=[string]$d.'#text'
                  if($value -match '^(?:0x[0-9A-Fa-f]{1,8}|-?[0-9]{1,10})$'){Write-Output ('R444C_'+$key.ToUpperInvariant()+'='+$value)}
                }
              }
            }
          }catch{
            $id=[string]$_.FullyQualifiedErrorId
            if($id -notmatch '^[A-Za-z0-9.,_-]{1,160}$'){$id='OTHER'}
            Write-Output ('R444C_APP_EVENT_READ_RESULT='+$id)
          }
          Write-Output 'R444C_READ_ONLY_NO_MESSAGES_TOKENS_OR_PROCESS_CHANGES=TRUE'
