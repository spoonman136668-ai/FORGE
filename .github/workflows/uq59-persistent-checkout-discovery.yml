name: UQ59 Read-only persistent Mind-Palace checkout discovery

on:
  push:
    branches:
      - qualification/uq59-persistent-checkout-discovery

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 10
    steps:
      - name: Read-only physical production checkout identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') {
            throw 'UQ59_DISCOVERY_UNAUTHORIZED_RUNNER'
          }
          $expected='e1dd7f6744ae120b69130597a3055d5a4e4317be'
          $userRoots = @($env:USERPROFILE, $env:HOME, 'C:\Users\camar') |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique
          $candidates=@()
          foreach($root in $userRoots) {
            foreach($suffix in @('GolandProjects\Mind-Palace','GolandProjects\mind-palace','Mind-Palace','mind-palace','repos\Mind-Palace','source\Mind-Palace','Projects\Mind-Palace','Documents\Mind-Palace')) {
              $candidates += Join-Path $root $suffix
            }
          }
          $candidates += @('C:\src\Mind-Palace','C:\Repos\Mind-Palace','D:\Repos\Mind-Palace')
          $found=@()
          foreach($path in @($candidates | Select-Object -Unique)) {
            if (-not [IO.Directory]::Exists([IO.Path]::Combine($path,'.git'))) { continue }
            $sha=(& git.exe -C $path rev-parse HEAD 2>&1 | Out-String).Trim()
            $headCode=$LASTEXITCODE
            $branch=(& git.exe -C $path rev-parse --abbrev-ref HEAD 2>&1 | Out-String).Trim()
            $branchCode=$LASTEXITCODE
            $remote=(& git.exe -C $path remote get-url origin 2>&1 | Out-String).Trim()
            $remoteCode=$LASTEXITCODE
            $status=@(& git.exe -C $path status --porcelain=v1 --untracked-files=all 2>&1)
            $statusCode=$LASTEXITCODE
            $stranded = 0
            $runtime = Join-Path $path '.mind-runtime'
            if (Test-Path -LiteralPath $runtime) {
              $stranded=@(Get-ChildItem -LiteralPath $runtime -Directory -Filter 'uq51-repo-transaction-*').Count
            }
            $validRemote=$remoteCode -eq 0 -and $remote -match '(^|/)spoonman136668-ai/Mind-Palace(\.git)?$'
            $result=[ordered]@{
              path=$path
              head=$sha
              branch=$branch
              origin_matches_expected=$validRemote
              git_identity_usable=($headCode -eq 0 -and $branchCode -eq 0 -and $remoteCode -eq 0)
              clean_worktree=($statusCode -eq 0 -and $status.Count -eq 0)
              stranded_transactions=$stranded
              exactly_expected_main=($sha -ceq $expected -and $branch -ceq 'main')
            }
            $found += [pscustomobject]$result
          }
          ConvertTo-Json -InputObject ([ordered]@{
            schema='mind-palace.uq59-readonly-physical-checkout-discovery.v1'
            runner=$env:RUNNER_NAME
            target_main=$expected
            inspected_root_count=@($userRoots).Count
            matched_checkouts=@($found)
            production_memory_writes=0
            did_not_create_checkout=$true
          }) -Depth 6 | Write-Host
          $physical = 'C:\Users\camar\GolandProjects\Mind-Palace'
          $pinnedRemote='e1dd7f6744ae120b69130597a3055d5a4e4317be'
          if (-not [IO.Directory]::Exists([IO.Path]::Combine($physical,'.git'))) {
            throw 'UQ59_PERSISTENT_CHECKOUT_NOT_FOUND'
          }
          $before = (& git.exe -C $physical rev-parse HEAD | Out-String).Trim()
          $dirty=@(& git.exe -C $physical status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) {
            throw 'UQ59_PERSISTENT_CHECKOUT_DIRTY_OR_GIT_FAILED'
          }
          $origin=(& git.exe -C $physical remote get-url origin | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $origin -notmatch 'spoonman136668-ai/Mind-Palace(\.git)?$') {
            throw 'UQ59_PERSISTENT_REMOTE_DRIFT'
          }
          $upstream = @(& git.exe ls-remote --exit-code $origin refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or $upstream.Count -ne 1 -or
              ([string]$upstream[0] -split '\s+')[0] -cne $pinnedRemote) {
            throw 'UQ59_PERSISTENT_REMOTE_MAIN_CHANGED'
          }
          # This fetch changes Git's object/cache area only; it does not alter the
          # tracked source or accepted memory in the workstation worktree.
          & git.exe -C $physical fetch --no-tags --quiet origin refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw 'UQ59_FF_PROBE_FETCH_FAILED' }
          $target=(& git.exe -C $physical rev-parse FETCH_HEAD | Out-String).Trim()
          & git.exe -C $physical merge-base --is-ancestor $before $target
          if ($LASTEXITCODE -ne 0 -or $target -cne $pinnedRemote) {
            throw 'UQ59_LOCAL_SOURCE_NOT_A_FAST_FORWARD_ANCESTOR'
          }
          $protected=@(
            '.ice/records.json','.ice/source-ledger.json','archive/index.json',
            '.ice/chat-delta-state.json','.ice/remote-bootstrap.json','.ice/remote-catalog.json',
            '.ice/remote-index.ndjson','.ice/project-state-capsules.json','.ice/project-dependency-graph.json'
          )
          $changed=@(& git.exe -C $physical diff --name-only $before $target)
          $protectedChanged=@(& git.exe -C $physical diff --name-only $before $target -- @protected)
          $localRecords=@([IO.File]::ReadAllText((Join-Path $physical '.ice/records.json')) | ConvertFrom-Json)
          $localLedger=[IO.File]::ReadAllText((Join-Path $physical '.ice/source-ledger.json')) | ConvertFrom-Json
          $ignoredRuntime=Join-Path $physical '.mind-runtime'
          $runtimeNames=if ([IO.Directory]::Exists($ignoredRuntime)) {
            @([IO.Directory]::EnumerateFileSystemEntries($ignoredRuntime) | ForEach-Object { [IO.Path]::GetFileName($_) })
          } else { @() }
          ConvertTo-Json -InputObject ([ordered]@{
            schema='mind-palace.uq59-workstation-fastforward-preflight.v1'
            original_head=$before
            target_main_sha=$target
            fast_forward_only=true
            changed_tracked_count=@($changed).Count
            changed_protected_files=@($protectedChanged)
            local_record_count=$localRecords.Count
            local_ledger_entries=@($localLedger.entries).Count
            runtime_entry_names=@($runtimeNames)
            source_worktree_unchanged=true
            memory_writes=0
          }) -Depth 8 | Write-Host
          $after=(& git.exe -C $physical rev-parse HEAD | Out-String).Trim()
          $afterStatus=@(& git.exe -C $physical status --porcelain=v1 --untracked-files=all)
          if ($after -cne $before -or $LASTEXITCODE -ne 0 -or $afterStatus.Count -ne 0) {
            throw 'UQ59_READONLY_FASTFORWARD_PROBE_CHANGED_WORKTREE'
          }
          Write-Host 'UQ59_FAST_FORWARD_ELIGIBILITY_READ_ONLY=PASS'
          Write-Host 'UQ59_DISCOVERY_READ_ONLY=PASS'
