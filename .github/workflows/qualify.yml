name: FORGE public Linux and Windows qualification

on:
  push:
    branches: [main, engineering/real-dual-lane-successor-admission-r1, engineering/r34-e3-two-lane-originals-r1, engineering/ygg-f2-legal-crosspair-r1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-qual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Enforce FORGE independence from private CKB-plane
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          # Exercise the read-only FSA pagination/authority boundaries on both OSes.
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          # Exercise real SQLite one-shot CAS semantics, including cross-lane races.
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: F139 Python controller and native-custody regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s f139 -p 'test_*.py'
      - name: Set up G91 CPU proxy Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/acc_g91/requirements.txt
      - name: G91 certified-vocabulary synthetic screen and guards
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r research/acc_g91/requirements.txt
          python -B -m unittest discover -s research/acc_g91 -p 'test_g91.py' -v
          python -B research/acc_g91/g91_certified_vocab.py | tee g91-screen-stdout.json
      - name: G92 self-sketch microtree synthetic screen and exactness guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acc_g92 -p 'test_g92.py' -v
          python -B research/acc_g92/g92_microtree.py | tee g92-screen-stdout.txt
      - name: G93 SwiGLU negative-tail pruning screen and guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acc_g93 -p 'test_g93.py' -v
          python -B research/acc_g93/g93_swiglu_screen.py | tee g93-screen-stdout.txt
      - name: G94 temporal delta projection screen and exactness guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acc_g94 -p 'test_g94.py' -v
          python -B research/acc_g94/g94_delta_projection.py | tee g94-screen-stdout.txt
      - name: G95 RoPE shift-invariant replay and contextual drift guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acc_g95 -p 'test_g95.py' -v
          python -B research/acc_g95/g95_rope_replay.py | tee g95-screen-stdout.txt
      - name: G96 certified attention-block omission and error guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acc_g96 -p 'test_g96.py' -v
          python -B research/acc_g96/g96_attention_bounds.py | tee g96-screen-stdout.txt
      - name: G97 certified head-budget CPU proxy and guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acc_g97 -p 'test_g97.py' -v
          python -B research/acc_g97/g97_head_budget.py | tee g97-screen-stdout.txt
      - name: G98 geometric KV subspace synthetic screen and guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acc_g98 -p 'test_g98.py' -v
          python -B research/acc_g98/g98_kv_subspace.py | tee g98-screen-stdout.txt
      - name: Upload ACC G91-G98 synthetic screening receipts
        uses: actions/upload-artifact@v4
        with:
          name: acc-g91-g98-${{ runner.os }}-${{ github.sha }}
          path: |
            g91-screen-stdout.json
            g92-screen-stdout.txt
            g93-screen-stdout.txt
            g94-screen-stdout.txt
            g95-screen-stdout.txt
            g96-screen-stdout.txt
            g97-screen-stdout.txt
            g98-screen-stdout.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Tests, race, vet and build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
      - name: Public isolation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e snapshot
          test ! -e research/successor-builder
          # Keep imports, arbitrary process creation and network posting denied everywhere.
          ! grep -R --include='*.go' -E 'github.com/spoonman136668-ai/(ckb-plane|Wingless|Yggdrasil)|os.StartProcess|net/http.Post' .
          # Freeze the seven preexisting non-supervisor exec.Command sites;
          # deny every new, duplicated, moved, or modified source call.
          # The original bounded supervisor's separate count gates stay intact.
          python3 -B isolationguard/check_subprocess_sites.py
          # The exception contains exactly the bounded executor and its integration test.
          grep -l -E 'exec.Command' subprocesssupervisor/supervise.go subprocesssupervisor/supervise_test.go >/dev/null
          test "$(grep -Rl --include='*.go' -E 'exec.Command' subprocesssupervisor | wc -l)" -eq 3
          grep -q -E 'exec.Command' subprocesssupervisor/partial_crash_test.go
          test "$(grep -Rl --include='*.go' -E 'exec.Command' cmd/forge-synthetic-supervisor | wc -l)" -eq 1
          grep -q -E 'exec.Command' cmd/forge-synthetic-supervisor/main_test.go
          ! grep -E 'exec.Command' cmd/forge-synthetic-supervisor/main.go
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: FORGE independence and standing isolation enforcement
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          # Exercise the read-only FSA pagination/authority boundaries on both OSes.
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          # Exercise real SQLite one-shot CAS semantics, including cross-lane races.
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: F139 Python controller and native-custody regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s f139 -p 'test_*.py'
      - name: Set up G91 CPU proxy Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/acc_g91/requirements.txt
      - name: G91 certified-vocabulary synthetic screen and guards
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r research/acc_g91/requirements.txt
          python -B -m unittest discover -s research/acc_g91 -p 'test_g91.py' -v
          python -B research/acc_g91/g91_certified_vocab.py | tee g91-screen-stdout.json
      - name: G92 self-sketch microtree synthetic screen and exactness guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acc_g92 -p 'test_g92.py' -v
          python -B research/acc_g92/g92_microtree.py | tee g92-screen-stdout.txt
      - name: G93 SwiGLU negative-tail pruning screen and guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acc_g93 -p 'test_g93.py' -v
          python -B research/acc_g93/g93_swiglu_screen.py | tee g93-screen-stdout.txt
      - name: G94 temporal delta projection screen and exactness guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acc_g94 -p 'test_g94.py' -v
          python -B research/acc_g94/g94_delta_projection.py | tee g94-screen-stdout.txt
      - name: G95 RoPE shift-invariant replay and contextual drift guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acc_g95 -p 'test_g95.py' -v
          python -B research/acc_g95/g95_rope_replay.py | tee g95-screen-stdout.txt
      - name: G96 certified attention-block omission and error guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acc_g96 -p 'test_g96.py' -v
          python -B research/acc_g96/g96_attention_bounds.py | tee g96-screen-stdout.txt
      - name: G97 certified head-budget CPU proxy and guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acc_g97 -p 'test_g97.py' -v
          python -B research/acc_g97/g97_head_budget.py | tee g97-screen-stdout.txt
      - name: G98 geometric KV subspace synthetic screen and guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acc_g98 -p 'test_g98.py' -v
          python -B research/acc_g98/g98_kv_subspace.py | tee g98-screen-stdout.txt
      - name: Upload ACC G91-G98 synthetic screening receipts
        uses: actions/upload-artifact@v4
        with:
          name: acc-g91-g98-${{ runner.os }}-${{ github.sha }}
          path: |
            g91-screen-stdout.json
            g92-screen-stdout.txt
            g93-screen-stdout.txt
            g94-screen-stdout.txt
            g95-screen-stdout.txt
            g96-screen-stdout.txt
            g97-screen-stdout.txt
            g98-screen-stdout.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Native Windows source qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_TEST_FAILED' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_VET_FAILED' }
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_BUILD_FAILED' }