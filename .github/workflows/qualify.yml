name: FORGE public Linux and Windows qualification

on:
  push:
    branches: [main, engineering/real-dual-lane-successor-admission-r1, engineering/r34-e3-two-lane-originals-r1, engineering/ygg-f2-legal-crosspair-r1, qualification/f139-prompt-source-20261102]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-qual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux_f139:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 8
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enforce FORGE independence from private CKB-plane
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          # Exercise the read-only FSA pagination/authority boundaries on both OSes.
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          # Exercise real SQLite one-shot CAS semantics, including cross-lane races.
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: Prepare frozen transport sources and run affected controls
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          for source in 80ae30719bcd9f179da4aa4e8f14dc36fd15818e 556d61f795cab1a042d26b46bbc1087dd436f52d; do
            if ! git cat-file -e "$source:f139/local_controller.py" 2>/dev/null; then
              git fetch --no-tags --depth=1 https://github.com/spoonman136668-ai/FORGE.git "$source"
            fi
            git cat-file -e "$source:f139/local_controller.py"
          done
          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git rev-parse --is-shallow-repository)" = true
          python3 -B -m unittest discover -s f139 -p 'test_github_command_transport.py' -v
      - name: F139 Python controller and native-custody regression
        shell: bash
        env:
          FORGE_PROFILE_BRANCH: ${{ github.head_ref }}
          FORGE_PROFILE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$FORGE_PROFILE_BRANCH" = 'engineering/f139-qualification-profile-20261106' ]; then
            python3 -B f139/check_test_discovery_inventory.py --profile-current --expected-source "$FORGE_PROFILE_SOURCE" --output "$RUNNER_TEMP/f139-discovery-public.json"
          elif [ "$FORGE_PROFILE_BRANCH" = 'engineering/f139-profile-resource-diagnostics-20261107' ]; then
            PYTHONPATH=. python3 -B scripts/check_profile_resources.py
            python3 -B f139/check_test_discovery_inventory.py --profile-current --resource-diagnostics --expected-source "$FORGE_PROFILE_SOURCE" --output "$RUNNER_TEMP/f139-discovery-public.json"
          elif [ "$FORGE_PROFILE_BRANCH" = 'engineering/f139-sqlite-phase-diagnostics-20261107' ]; then
            PYTHONPATH=. python3 -B scripts/check_sqlite_phases.py
            PYTHONPATH=. python3 -B f139/check_sqlite_fixture_phases.py --expected-source "$FORGE_PROFILE_SOURCE" --output "$RUNNER_TEMP/f139-sqlite-phases.json"
            python3 -B f139/check_test_discovery_inventory.py --profile-current --resource-diagnostics --expected-source "$FORGE_PROFILE_SOURCE" --output "$RUNNER_TEMP/f139-discovery-public.json"
          else
            python3 -B -m unittest discover -s f139 -p 'test_*.py'
          fi

  linux_native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 128 || 8 }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enforce FORGE independence from private CKB-plane
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          # Exercise the read-only FSA pagination/authority boundaries on both OSes.
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          # Exercise real SQLite one-shot CAS semantics, including cross-lane races.
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: Prepare frozen transport sources and run affected controls
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          for source in 80ae30719bcd9f179da4aa4e8f14dc36fd15818e 556d61f795cab1a042d26b46bbc1087dd436f52d; do
            if ! git cat-file -e "$source:f139/local_controller.py" 2>/dev/null; then
              git fetch --no-tags --depth=1 https://github.com/spoonman136668-ai/FORGE.git "$source"
            fi
            git cat-file -e "$source:f139/local_controller.py"
          done
          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git rev-parse --is-shallow-repository)" = true
          python3 -B -m unittest discover -s f139 -p 'test_github_command_transport.py' -v
      - name: Verify preserved test identities and fixture bodies
        if: github.head_ref == 'engineering/f139-unique-test-discovery-20261105'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B f139/check_test_discovery_inventory.py --baseline b5172a047efa7a1d630c15c13a2b7eba14c997fe --output "$RUNNER_TEMP/f139-discovery-public.json"
      - name: F73 G134 redacted OIDC phase and fail-closed identity tests (DEV ONLY)
        if: github.head_ref == 'engineering/f73-g134-readonly-phase-evidence-20261108' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node --test d1retention/f73_protected_main_oidc.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: G158 verify optional helper and original Go admission on Linux
        if: github.event_name == 'pull_request' && github.head_ref == 'engineering/rar-g158-optional-helper-compat-20261108' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          G156_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$G156_HEAD"
          python3 -B scripts/check_rar_g156_dynamic_base_cache.py --static
      - name: G156 static source-guard and mutation audit on Linux (release)
        if: github.event_name == 'pull_request' && github.head_ref == 'engineering/rar-g156-dynamic-main-cache-release-20261108' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          G156_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$G156_HEAD"
          python3 -B scripts/check_rar_g156_dynamic_base_cache.py --static
      - name: Frozen native action-consequence development receipt
        if: github.head_ref == 'engineering/native-discovery-f0-learning-evaluator-20261107'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          go test -count=1 -v ./nativediscovery | tee "$RUNNER_TEMP/forge-native-discovery-f0.log"
          test "$(grep -c 'FORGE_NATIVE_DISCOVERY_F0=' "$RUNNER_TEMP/forge-native-discovery-f0.log")" -eq 1
      - name: Retain frozen native discovery development receipt
        if: always() && github.head_ref == 'engineering/native-discovery-f0-learning-evaluator-20261107'
        uses: actions/upload-artifact@v4
        with:
          name: forge-native-discovery-f0-${{ runner.os }}
          path: ${{ runner.temp }}/forge-native-discovery-f0.log
          if-no-files-found: error
      - name: Native F1 GenEnv to F95 development evidence
        if: github.head_ref == 'engineering/native-discovery-f1-generator-adapter-20261107'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          go test -count=1 -v -run '^TestNativeDiscoveryF1' ./nativediscovery | tee "$RUNNER_TEMP/forge-native-discovery-f1.log"
          test "$(grep -c 'FORGE_NATIVE_DISCOVERY_F1=' "$RUNNER_TEMP/forge-native-discovery-f1.log")" -eq 1
      - name: Retain F1 exact-source generator and heldout evidence
        if: always() && github.head_ref == 'engineering/native-discovery-f1-generator-adapter-20261107'
        uses: actions/upload-artifact@v4
        with:
          name: forge-native-discovery-f1-${{ runner.os }}
          path: ${{ runner.temp }}/forge-native-discovery-f1.log
          if-no-files-found: error
      - name: Frozen native F2 unfamiliar-world evaluation receipt
        if: github.head_ref == 'engineering/native-discovery-f2-unfamiliar-world-20261107'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          go test -count=1 -v -run '^TestF2' ./nativediscovery | tee "$RUNNER_TEMP/forge-native-discovery-f2.log"
          test "$(grep -c 'FORGE_NATIVE_DISCOVERY_F2=' "$RUNNER_TEMP/forge-native-discovery-f2.log")" -eq 1
      - name: Retain exact-source F2 candidate and matched-control evidence
        if: always() && github.head_ref == 'engineering/native-discovery-f2-unfamiliar-world-20261107'
        uses: actions/upload-artifact@v4
        with:
          name: forge-native-discovery-f2-${{ runner.os }}
          path: ${{ runner.temp }}/forge-native-discovery-f2.log
          if-no-files-found: error
      - name: Native F3 generated executable source evidence
        if: github.head_ref == 'engineering/native-discovery-f3-executable-mechanisms-20261107'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          go test -count=1 -v -run '^TestF3' ./nativediscovery | tee "$RUNNER_TEMP/forge-native-discovery-f3.log"
          test "$(grep -c 'FORGE_NATIVE_DISCOVERY_F3=' "$RUNNER_TEMP/forge-native-discovery-f3.log")" -eq 1
      - name: Retain F3 exact-source compiled mechanism evidence
        if: always() && github.head_ref == 'engineering/native-discovery-f3-executable-mechanisms-20261107'
        uses: actions/upload-artifact@v4
        with:
          name: forge-native-discovery-f3-${{ runner.os }}
          path: ${{ runner.temp }}/forge-native-discovery-f3.log
          if-no-files-found: error
      - name: Tests, race, vet and build
        shell: bash
        env:
          FORGE_G141_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -B scripts/check_rar_g141_parallel_go.py
          go vet ./...
          go build ./...
      - name: Retain G141 exact-head original Go/race package and memory receipt
        if: ${{ always() && github.head_ref == 'engineering/rar-g141-parallel-complete-go-suites-20261108' }}
        uses: actions/upload-artifact@v4
        with:
          name: rar-g141-original-parallel-go-cgroup
          path: ${{ runner.temp }}/rar-g141-parallel-original-go.json
          if-no-files-found: error
      - name: Public isolation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e snapshot
          test ! -e research/successor-builder
          # Keep imports, arbitrary process creation and network posting denied everywhere.
          ! grep -R --include='*.go' -E 'github.com/spoonman136668-ai/(ckb-plane|Wingless|Yggdrasil)|os.StartProcess|net/http.Post' .
          # Freeze the seven preexisting non-supervisor exec.Command sites;
          # deny every new, duplicated, moved, or modified source call.
          # The original bounded supervisor's separate count gates stay intact.
          python3 -B isolationguard/check_subprocess_sites.py
          # The exception contains exactly the bounded executor and its integration test.
          grep -l -E 'exec.Command' subprocesssupervisor/supervise.go subprocesssupervisor/supervise_test.go >/dev/null
          test "$(grep -Rl --include='*.go' -E 'exec.Command' subprocesssupervisor | wc -l)" -eq 3
          grep -q -E 'exec.Command' subprocesssupervisor/partial_crash_test.go
          test "$(grep -Rl --include='*.go' -E 'exec.Command' cmd/forge-synthetic-supervisor | wc -l)" -eq 1
          grep -q -E 'exec.Command' cmd/forge-synthetic-supervisor/main_test.go
          ! grep -E 'exec.Command' cmd/forge-synthetic-supervisor/main.go
      - name: Retain private-fixture phase diagnosis
        if: ${{ always() && github.head_ref == 'engineering/f139-sqlite-phase-diagnostics-20261107' }}
        uses: actions/upload-artifact@v4
        with:
          name: f139-sqlite-phases-${{ runner.os }}
          path: ${{ runner.temp }}/f139-sqlite-phases.json
          if-no-files-found: error
      - name: Retain exact-source qualification receipt
        if: ${{ always() && (github.head_ref == 'engineering/f139-unique-test-discovery-20261105' || github.head_ref == 'engineering/f139-qualification-profile-20261106' || github.head_ref == 'engineering/f139-profile-resource-diagnostics-20261107' || github.head_ref == 'engineering/f139-sqlite-phase-diagnostics-20261107') }}
        uses: actions/upload-artifact@v4
        with:
          name: f139-discovery-public-${{ runner.os }}
          path: ${{ runner.temp }}/f139-discovery-public.json
          if-no-files-found: error


  linux_genenv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 8
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enforce FORGE independence from private CKB-plane
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          # Exercise the read-only FSA pagination/authority boundaries on both OSes.
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          # Exercise real SQLite one-shot CAS semantics, including cross-lane races.
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: Prepare frozen transport sources and run affected controls
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          for source in 80ae30719bcd9f179da4aa4e8f14dc36fd15818e 556d61f795cab1a042d26b46bbc1087dd436f52d; do
            if ! git cat-file -e "$source:f139/local_controller.py" 2>/dev/null; then
              git fetch --no-tags --depth=1 https://github.com/spoonman136668-ai/FORGE.git "$source"
            fi
            git cat-file -e "$source:f139/local_controller.py"
          done
          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git rev-parse --is-shallow-repository)" = true
          python3 -B -m unittest discover -s f139 -p 'test_github_command_transport.py' -v
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Actual GenEnv and Promptbreeder outputs to bound source
        shell: bash
        run: |
          set -euo pipefail
          request_path="$RUNNER_TEMP/f139-genenv-request.json"
          result_path="$RUNNER_TEMP/f139-genenv-result.json"
          python3 -B -m f139.check_genenv_source_integration --request > "$request_path"
          CGO_ENABLED=0 GOTOOLCHAIN=local go run ./cmd/f139-genenv-source < "$request_path" > "$result_path"
          python3 -B -m f139.check_genenv_source_integration --result "$result_path"
          python3 -B -m f139.check_prompt_source_integration --request > "$request_path"
          CGO_ENABLED=0 GOTOOLCHAIN=local go run ./cmd/f139-genenv-source < "$request_path" > "$result_path"
          python3 -B -m f139.check_prompt_source_integration --result "$result_path"
          previous_path="$RUNNER_TEMP/f139-typed-program-first-result.json"
          python3 -B -m f139.check_prompt_program_integration --request > "$request_path"
          CGO_ENABLED=0 GOTOOLCHAIN=local go run ./cmd/f139-genenv-source < "$request_path" > "$previous_path"
          python3 -B -m f139.check_prompt_program_integration --result "$previous_path"
          python3 -B -m f139.check_prompt_program_integration --request --previous "$previous_path" > "$request_path"
          CGO_ENABLED=0 GOTOOLCHAIN=local go run ./cmd/f139-genenv-source < "$request_path" > "$result_path"
          python3 -B -m f139.check_prompt_program_integration --result "$result_path" --previous "$previous_path"

  linux:
    # Preserve protected ruleset 'linux' only if both complete original lanes pass.
    if: ${{ always() }}
    needs: [linux_f139, linux_native, linux_genenv]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require exact-source original Linux F139 AND native qualification
        shell: bash
        env:
          F139_RESULT: ${{ needs.linux_f139.result }}
          NATIVE_RESULT: ${{ needs.linux_native.result }}
          GENENV_RESULT: ${{ needs.linux_genenv.result }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$F139_RESULT" = 'success'
          test "$NATIVE_RESULT" = 'success'
          test "$GENENV_RESULT" = 'success'
          test -n "$EXACT_HEAD"
          echo 'FORGE_LINUX_ORIGINAL_F139_AND_NATIVE_GATES=PASS'

  windows_f139:
    # Exact-source original Python F139 tests; separate hosted runner from Go.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 8
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: FORGE independence and standing isolation enforcement
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          # Exercise the read-only FSA pagination/authority boundaries on both OSes.
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          # Exercise real SQLite one-shot CAS semantics, including cross-lane races.
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: Prepare frozen transport sources and run affected controls
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          for source in 80ae30719bcd9f179da4aa4e8f14dc36fd15818e 556d61f795cab1a042d26b46bbc1087dd436f52d; do
            if ! git cat-file -e "$source:f139/local_controller.py" 2>/dev/null; then
              git fetch --no-tags --depth=1 https://github.com/spoonman136668-ai/FORGE.git "$source"
            fi
            git cat-file -e "$source:f139/local_controller.py"
          done
          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git rev-parse --is-shallow-repository)" = true
          python3 -B -m unittest discover -s f139 -p 'test_github_command_transport.py' -v
      - name: F139 Python controller and native-custody regression
        shell: bash
        env:
          FORGE_PROFILE_BRANCH: ${{ github.head_ref }}
          FORGE_PROFILE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          FORGE_G137_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$FORGE_PROFILE_BRANCH" = 'engineering/f139-qualification-profile-20261106' ]; then
            python3 -B f139/check_test_discovery_inventory.py --profile-current --expected-source "$FORGE_PROFILE_SOURCE" --output "$RUNNER_TEMP/f139-discovery-public.json"
          elif [ "$FORGE_PROFILE_BRANCH" = 'engineering/f139-profile-resource-diagnostics-20261107' ]; then
            PYTHONPATH=. python3 -B scripts/check_profile_resources.py
            python3 -B f139/check_test_discovery_inventory.py --profile-current --resource-diagnostics --expected-source "$FORGE_PROFILE_SOURCE" --output "$RUNNER_TEMP/f139-discovery-public.json"
          elif [ "$FORGE_PROFILE_BRANCH" = 'engineering/f139-sqlite-phase-diagnostics-20261107' ]; then
            PYTHONPATH=. python3 -B scripts/check_sqlite_phases.py
            PYTHONPATH=. python3 -B f139/check_sqlite_fixture_phases.py --expected-source "$FORGE_PROFILE_SOURCE" --output "$RUNNER_TEMP/f139-sqlite-phases.json"
            python3 -B f139/check_test_discovery_inventory.py --profile-current --resource-diagnostics --expected-source "$FORGE_PROFILE_SOURCE" --output "$RUNNER_TEMP/f139-discovery-public.json"
          else
            python3 -B scripts/check_rar_g137_f139_shards.py
          fi
      - name: Retain G137 exact-source all-case F139 memory and skip custody
        # Historical specialized profiling branches do not run the sharded suite.
        if: ${{ always() && github.head_ref != 'engineering/f139-qualification-profile-20261106' && github.head_ref != 'engineering/f139-profile-resource-diagnostics-20261107' && github.head_ref != 'engineering/f139-sqlite-phase-diagnostics-20261107' }}
        uses: actions/upload-artifact@v4
        with:
          name: rar-g137-f139-shards
          path: ${{ runner.temp }}/rar-g137-f139-shards.json
          if-no-files-found: error
          retention-days: 7

  windows_native:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 128 || 8 }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: FORGE independence and standing isolation enforcement
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          # Exercise the read-only FSA pagination/authority boundaries on both OSes.
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          # Exercise real SQLite one-shot CAS semantics, including cross-lane races.
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: Focused original-owner Windows mutex interoperability
        if: runner.os == 'Windows' && (github.head_ref == 'engineering/f139-v36-original-owner-corrective-release-20261105' || github.head_ref == 'engineering/f139-v37-public-order-owner-handoff-20261105')
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B -m unittest discover -s f139 -p 'test_nci04_original_owner_mutex.py' -v
          if($LASTEXITCODE -ne 0){throw 'F139_V36_MUTEX_INTEROPERABILITY_FAILED'}
      - name: Prepare frozen transport sources and run affected controls
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
