name: FORGE public Linux and Windows qualification

on:
  push:
    branches: [main, engineering/real-dual-lane-successor-admission-r1, engineering/r34-e3-two-lane-originals-r1, engineering/ygg-f2-legal-crosspair-r1, qualification/f139-prompt-source-20261102]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-qual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux_f139:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 8
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enforce FORGE independence from private CKB-plane
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          # Exercise the read-only FSA pagination/authority boundaries on both OSes.
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          # Exercise real SQLite one-shot CAS semantics, including cross-lane races.
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: Prepare frozen transport sources and run affected controls
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          for source in 80ae30719bcd9f179da4aa4e8f14dc36fd15818e 556d61f795cab1a042d26b46bbc1087dd436f52d; do
            if ! git cat-file -e "$source:f139/local_controller.py" 2>/dev/null; then
              git fetch --no-tags --depth=1 https://github.com/spoonman136668-ai/FORGE.git "$source"
            fi
            git cat-file -e "$source:f139/local_controller.py"
          done
          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git rev-parse --is-shallow-repository)" = true
          python3 -B -m unittest discover -s f139 -p 'test_github_command_transport.py' -v
      - name: F139 Python controller and native-custody regression
        shell: bash
        env:
          FORGE_PROFILE_BRANCH: ${{ github.head_ref }}
          FORGE_PROFILE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$FORGE_PROFILE_BRANCH" = 'engineering/f139-qualification-profile-20261106' ]; then
            python3 -B f139/check_test_discovery_inventory.py --profile-current --expected-source "$FORGE_PROFILE_SOURCE" --output "$RUNNER_TEMP/f139-discovery-public.json"
          elif [ "$FORGE_PROFILE_BRANCH" = 'engineering/f139-profile-resource-diagnostics-20261107' ]; then
            PYTHONPATH=. python3 -B scripts/check_profile_resources.py
            python3 -B f139/check_test_discovery_inventory.py --profile-current --resource-diagnostics --expected-source "$FORGE_PROFILE_SOURCE" --output "$RUNNER_TEMP/f139-discovery-public.json"
          elif [ "$FORGE_PROFILE_BRANCH" = 'engineering/f139-sqlite-phase-diagnostics-20261107' ]; then
            PYTHONPATH=. python3 -B scripts/check_sqlite_phases.py
            PYTHONPATH=. python3 -B f139/check_sqlite_fixture_phases.py --expected-source "$FORGE_PROFILE_SOURCE" --output "$RUNNER_TEMP/f139-sqlite-phases.json"
            python3 -B f139/check_test_discovery_inventory.py --profile-current --resource-diagnostics --expected-source "$FORGE_PROFILE_SOURCE" --output "$RUNNER_TEMP/f139-discovery-public.json"
          else
            python3 -B -m unittest discover -s f139 -p 'test_*.py'
          fi

  linux_native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 128 || 8 }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enforce FORGE independence from private CKB-plane
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          # Exercise the read-only FSA pagination/authority boundaries on both OSes.
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          # Exercise real SQLite one-shot CAS semantics, including cross-lane races.
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: Prepare frozen transport sources and run affected controls
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          for source in 80ae30719bcd9f179da4aa4e8f14dc36fd15818e 556d61f795cab1a042d26b46bbc1087dd436f52d; do
            if ! git cat-file -e "$source:f139/local_controller.py" 2>/dev/null; then
              git fetch --no-tags --depth=1 https://github.com/spoonman136668-ai/FORGE.git "$source"
            fi
            git cat-file -e "$source:f139/local_controller.py"
          done
          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git rev-parse --is-shallow-repository)" = true
          python3 -B -m unittest discover -s f139 -p 'test_github_command_transport.py' -v
      - name: Verify preserved test identities and fixture bodies
        if: github.head_ref == 'engineering/f139-unique-test-discovery-20261105'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B f139/check_test_discovery_inventory.py --baseline b5172a047efa7a1d630c15c13a2b7eba14c997fe --output "$RUNNER_TEMP/f139-discovery-public.json"
      - name: F73 G134 redacted OIDC phase and fail-closed identity tests (DEV ONLY)
        if: github.head_ref == 'engineering/f73-g134-readonly-phase-evidence-20261108' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node --test d1retention/f73_protected_main_oidc.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: G158 verify optional helper and original Go admission on Linux
        if: github.event_name == 'pull_request' && github.head_ref == 'engineering/rar-g158-optional-helper-compat-20261108' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          G156_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$G156_HEAD"
          python3 -B scripts/check_rar_g156_dynamic_base_cache.py --static
      - name: G156 static source-guard and mutation audit on Linux (release)
        if: github.event_name == 'pull_request' && github.head_ref == 'engineering/rar-g156-dynamic-main-cache-release-20261108' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          G156_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$G156_HEAD"
          python3 -B scripts/check_rar_g156_dynamic_base_cache.py --static
      - name: Frozen native action-consequence development receipt
        if: github.head_ref == 'engineering/native-discovery-f0-learning-evaluator-20261107'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          go test -count=1 -v ./nativediscovery | tee "$RUNNER_TEMP/forge-native-discovery-f0.log"
          test "$(grep -c 'FORGE_NATIVE_DISCOVERY_F0=' "$RUNNER_TEMP/forge-native-discovery-f0.log")" -eq 1
      - name: Retain frozen native discovery development receipt
        if: always() && github.head_ref == 'engineering/native-discovery-f0-learning-evaluator-20261107'
        uses: actions/upload-artifact@v4
        with:
          name: forge-native-discovery-f0-${{ runner.os }}
          path: ${{ runner.temp }}/forge-native-discovery-f0.log
          if-no-files-found: error
      - name: Native F1 GenEnv to F95 development evidence
        if: github.head_ref == 'engineering/native-discovery-f1-generator-adapter-20261107'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          go test -count=1 -v -run '^TestNativeDiscoveryF1' ./nativediscovery | tee "$RUNNER_TEMP/forge-native-discovery-f1.log"
          test "$(grep -c 'FORGE_NATIVE_DISCOVERY_F1=' "$RUNNER_TEMP/forge-native-discovery-f1.log")" -eq 1
      - name: Retain F1 exact-source generator and heldout evidence
        if: always() && github.head_ref == 'engineering/native-discovery-f1-generator-adapter-20261107'
        uses: actions/upload-artifact@v4
        with:
          name: forge-native-discovery-f1-${{ runner.os }}
          path: ${{ runner.temp }}/forge-native-discovery-f1.log
          if-no-files-found: error
      - name: Frozen native F2 unfamiliar-world evaluation receipt
        if: github.head_ref == 'engineering/native-discovery-f2-unfamiliar-world-20261107'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          go test -count=1 -v -run '^TestF2' ./nativediscovery | tee "$RUNNER_TEMP/forge-native-discovery-f2.log"
          test "$(grep -c 'FORGE_NATIVE_DISCOVERY_F2=' "$RUNNER_TEMP/forge-native-discovery-f2.log")" -eq 1
      - name: Retain exact-source F2 candidate and matched-control evidence
        if: always() && github.head_ref == 'engineering/native-discovery-f2-unfamiliar-world-20261107'
        uses: actions/upload-artifact@v4
        with:
          name: forge-native-discovery-f2-${{ runner.os }}
          path: ${{ runner.temp }}/forge-native-discovery-f2.log
          if-no-files-found: error
      - name: Native F3 generated executable source evidence
        if: github.head_ref == 'engineering/native-discovery-f3-executable-mechanisms-20261107'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          go test -count=1 -v -run '^TestF3' ./nativediscovery | tee "$RUNNER_TEMP/forge-native-discovery-f3.log"
          test "$(grep -c 'FORGE_NATIVE_DISCOVERY_F3=' "$RUNNER_TEMP/forge-native-discovery-f3.log")" -eq 1
      - name: Retain F3 exact-source compiled mechanism evidence
        if: always() && github.head_ref == 'engineering/native-discovery-f3-executable-mechanisms-20261107'
        uses: actions/upload-artifact@v4
        with:
          name: forge-native-discovery-f3-${{ runner.os }}
          path: ${{ runner.temp }}/forge-native-discovery-f3.log
          if-no-files-found: error
      - name: Tests, race, vet and build
        shell: bash
        env:
          FORGE_G141_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -B scripts/check_rar_g141_parallel_go.py
          go vet ./...
          go build ./...
      - name: Retain G141 exact-head original Go/race package and memory receipt
        if: ${{ always() && github.head_ref == 'engineering/rar-g141-parallel-complete-go-suites-20261108' }}
        uses: actions/upload-artifact@v4
        with:
          name: rar-g141-original-parallel-go-cgroup
          path: ${{ runner.temp }}/rar-g141-parallel-original-go.json
          if-no-files-found: error
      - name: Public isolation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e snapshot
          test ! -e research/successor-builder
          # Keep imports, arbitrary process creation and network posting denied everywhere.
          ! grep -R --include='*.go' -E 'github.com/spoonman136668-ai/(ckb-plane|Wingless|Yggdrasil)|os.StartProcess|net/http.Post' .
          # Freeze the seven preexisting non-supervisor exec.Command sites;
          # deny every new, duplicated, moved, or modified source call.
          # The original bounded supervisor's separate count gates stay intact.
          python3 -B isolationguard/check_subprocess_sites.py
          # The exception contains exactly the bounded executor and its integration test.
          grep -l -E 'exec.Command' subprocesssupervisor/supervise.go subprocesssupervisor/supervise_test.go >/dev/null
          test "$(grep -Rl --include='*.go' -E 'exec.Command' subprocesssupervisor | wc -l)" -eq 3
          grep -q -E 'exec.Command' subprocesssupervisor/partial_crash_test.go
          test "$(grep -Rl --include='*.go' -E 'exec.Command' cmd/forge-synthetic-supervisor | wc -l)" -eq 1
          grep -q -E 'exec.Command' cmd/forge-synthetic-supervisor/main_test.go
          ! grep -E 'exec.Command' cmd/forge-synthetic-supervisor/main.go
      - name: G163 frozen F12 canonical validation AB and complete Go regression (DEV ONLY)
        if: github.event_name == 'pull_request' && github.head_ref == 'engineering/rar-g163-f12-canonical-validation-ab-20261109' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          G163_ENGINEERING_HEAD: ${{ github.event.pull_request.head.sha }}
          G163_RESEARCH_SHA: 268b8c59561ec4063f0d8cb59b6e7fccb0d0069c
          G163_RESEARCH_TREE: 5cf15dee259190d52942d8c85d2136a5cd27bfbb
          G163_F12_BLOB: ef1d41e03e40905da1e0c0107d6301360e3c7d1f
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$G163_ENGINEERING_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags --depth=1 origin "$G163_RESEARCH_SHA"
          original="$RUNNER_TEMP/rar-g163-original-source"
          git worktree add --detach "$original" "$G163_RESEARCH_SHA"
          test "$(git -C "$original" rev-parse HEAD)" = "$G163_RESEARCH_SHA"
          test "$(git -C "$original" rev-parse HEAD^{tree})" = "$G163_RESEARCH_TREE"
          test "$(git -C "$original" rev-parse HEAD:nativediscovery/f12_hidden_dynamics.go)" = "$G163_F12_BLOB"
          test -z "$(git -C "$original" status --porcelain --untracked-files=all)"
          cd "$original"
          export GOFLAGS=-p=4 GOMAXPROCS=2 GOMEMLIMIT=1536MiB GOTOOLCHAIN=local
          test "$(go version | awk '{print $3}')" = "go1.23.12"
          # Real matched A/B: exact same source/hardware/Go race flags and original test.
          go test -race -count=1 -json -run '^TestF12RejectsForgedExperimentScienceAndPredictionRecords$' ./nativediscovery > "$RUNNER_TEMP/rar-g163-original.jsonl"
          python3 -B - <<'PY'
          from pathlib import Path
          p=Path("nativediscovery/f12_hidden_dynamics.go")
          s=p.read_text()
          a=' "reflect"\n)'
          b=' "reflect"\n "sync"\n)'
          if s.count(a)!=1 or s.count(' expected,err:=F12Development()')!=1:
              raise SystemExit("G163_EXPECTED_F12_SOURCE_ANCHOR_MISSING")
          s=s.replace(a,b)
          s=s.replace('func F12Validate(v F12Report)error{',
          '''var f12ValidationCanonical struct{
           once sync.Once
           report F12Report
           err error
          }
          func f12CanonicalEqual(v F12Report)bool{
           f12ValidationCanonical.once.Do(func(){
            f12ValidationCanonical.report, f12ValidationCanonical.err=F12Development()
           })
           return f12ValidationCanonical.err==nil && reflect.DeepEqual(v,f12ValidationCanonical.report)
          }
          func F12Validate(v F12Report)error{''')
          s=s.replace(
          ' expected,err:=F12Development()\n if err!=nil||!reflect.DeepEqual(v,expected){return errF12}',
          ' if !f12CanonicalEqual(v){return errF12}')
          p.write_text(s)
          PY
          test "$(git diff --name-only)" = "nativediscovery/f12_hidden_dynamics.go"
          cat > nativediscovery/g163_validation_cache_test.go <<'GO'
          package nativediscovery
          import (
           "bytes"
           "encoding/json"
           "reflect"
           "sync"
           "testing"
          )
          func TestG163IndependentCanonicalEquivalenceAndTamper(t *testing.T) {
           original,err:=F12Development();if err!=nil{t.Fatal(err)}
           second,err:=F12Development();if err!=nil||!reflect.DeepEqual(original,second){t.Fatal("original frozen reference not deterministic")}
           if err:=F12Validate(original);err!=nil{t.Fatal("canonical original rejected:",err)}
           raw,err:=json.Marshal(original);if err!=nil{t.Fatal(err)}
           var forged F12Report
           if err:=json.Unmarshal(raw,&forged);err!=nil{t.Fatal(err)}
           forged.Arms[0].Rounds[0].CausalCorrect++
           forged.DigestSHA256=f12Digest(forged)
           if F12Validate(forged)==nil{t.Fatal("self-hashed forged negative accepted")}
           if err:=F12Validate(original);err!=nil{t.Fatal("valid reference changed after forged input:",err)}
           const n=8
           var wg sync.WaitGroup
           errors:=make(chan error,n)
           for i:=0;i<n;i++{
            wg.Add(1)
            go func(){
             defer wg.Done()
             original,err:=F12Development()
             if err==nil {err=F12Validate(original)}
             errors<-err
            }()
           }
           wg.Wait();close(errors)
           for e:=range errors{if e!=nil{t.Fatal("concurrent validation failed:",e)}}
           expected,err:=F12Development()
           if err!=nil || !bytes.Equal(mustF12JSON(t,original),mustF12JSON(t,expected)){t.Fatal("cold reference drift")}
          }
          func mustF12JSON(t *testing.T, v F12Report)[]byte{
           t.Helper()
           b,e:=json.Marshal(v);if e!=nil{t.Fatal(e)};return b
          }
          GO
          test "$(git status --porcelain --untracked-files=all | wc -l)" -eq 2
          go test -race -count=1 -json -run '^TestF12RejectsForgedExperimentScienceAndPredictionRecords$' ./nativediscovery > "$RUNNER_TEMP/rar-g163-candidate.jsonl"
          python3 -B - "$RUNNER_TEMP/rar-g163-original.jsonl" "$RUNNER_TEMP/rar-g163-candidate.jsonl" "$RUNNER_TEMP/rar-g163-ab.json" "$G163_RESEARCH_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          basefile,candidatefile,receipt,sha=map(str,sys.argv[1:5])
          root="TestF12RejectsForgedExperimentScienceAndPredictionRecords"
          def parse(path):
           events=[]
           with Path(path).open(encoding="utf-8") as f:
            for line in f:
             x=json.loads(line)
             if x.get("Package")!="github.com/spoonman136668-ai/forge/nativediscovery":
              raise SystemExit("G163_UNEXPECTED_PACKAGE")
             if x.get("Test","").startswith(root) and x.get("Action") in ("pass","fail","skip"):
              events.append((x["Test"],x["Action"],x.get("Elapsed")))
           roots=[x for x in events if x[0]==root]
           if len(roots)!=1 or roots[0][1]!="pass" or roots[0][2] is None:raise SystemExit("G163_ROOT_NOT_PASS")
           return events,roots[0][2]
          a,ta=parse(basefile);b,tb=parse(candidatefile)
          if sorted((x[0],x[1]) for x in a)!=sorted((x[0],x[1]) for x in b):
           raise SystemExit("G163_ORIGINAL_NEGATIVE_TEST_PARITY_FAILED")
          if ta<=0 or tb<=0:raise SystemExit("G163_ELAPSED_INVALID")
          ratio=ta/tb
          r=dict(schema="forge.rar-g163.f12-canonical-validation-ab.dev.v1",research_source_sha=sha,baseline_test_seconds=ta,candidate_test_seconds=tb,speedup_ratio=round(ratio,4),original_test_event_count=len(a),candidate_test_event_count=len(b),test_events_identical=True,negative_controls_preserved=True,scientific_firstuse=False,go_source_promoted=False)
          Path(receipt).write_text(json.dumps(r,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print("G163_AB_RECEIPT="+json.dumps(r,sort_keys=True),flush=True)
          if ratio<1.5:raise SystemExit("G163_PRESET_FOCUSED_SPEEDUP_NO_GO")
          PY
          # The original G29 code-atlas integrity guard correctly requires the
          # actual on-disk Go blobs to belong to HEAD. Build an entirely local
          # detached candidate commit, never any remote/research ref.
          git add -- nativediscovery/f12_hidden_dynamics.go nativediscovery/g163_validation_cache_test.go
          git -c user.name="FORGE G163 Development" -c user.email="forge-g163-dev@users.noreply.github.com" commit --no-gpg-sign -m "G163 isolated source-bound F12 cache test (no remote push)"
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$G163_RESEARCH_SHA"
          test "$(git diff --no-renames --name-only "$G163_RESEARCH_SHA" HEAD | sort)" = "$(printf 'nativediscovery/f12_hidden_dynamics.go\nnativediscovery/g163_validation_cache_test.go\n' | sort)"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "G163_ISOLATED_CANDIDATE_SHA=$candidate_sha G163_ISOLATED_CANDIDATE_TREE=$candidate_tree"
          # Full original package inventory; no test skips, Go atlas still checks
          # the committed source blobs against the exact local candidate tree.
          GOFLAGS=-p=2 go test -count=1 ./...
          go test -race -count=1 ./...
          GOFLAGS=-p=2 go vet ./...
          GOFLAGS=-p=2 go build ./...
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          test "$(git rev-parse HEAD^{tree})" = "$candidate_tree"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "G163_DEV_FULL_GO=PASS source_bound_local_commit=true remote_refs_unchanged=true"
      - name: Retain G163 source-matched F12 AB evidence (DEV ONLY)
        if: always() && github.head_ref == 'engineering/rar-g163-f12-canonical-validation-ab-20261109'
        uses: actions/upload-artifact@v4
        with:
          name: rar-g163-f12-ab-268b8c59561ec4063f0d8cb59b6e7fccb0d0069c
          path: |
            ${{ runner.temp }}/rar-g163-original.jsonl
            ${{ runner.temp }}/rar-g163-candidate.jsonl
            ${{ runner.temp }}/rar-g163-ab.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain private-fixture phase diagnosis
        if: ${{ always() && github.head_ref == 'engineering/f139-sqlite-phase-diagnostics-20261107' }}
        uses: actions/upload-artifact@v4
        with:
          name: f139-sqlite-phases-${{ runner.os }}
          path: ${{ runner.temp }}/f139-sqlite-phases.json
          if-no-files-found: error
      - name: Retain exact-source qualification receipt
        if: ${{ always() && (github.head_ref == 'engineering/f139-unique-test-discovery-20261105' || github.head_ref == 'engineering/f139-qualification-profile-20261106' || github.head_ref == 'engineering/f139-profile-resource-diagnostics-20261107' || github.head_ref == 'engineering/f139-sqlite-phase-diagnostics-20261107') }}
        uses: actions/upload-artifact@v4
        with:
          name: f139-discovery-public-${{ runner.os }}
          path: ${{ runner.temp }}/f139-discovery-public.json
          if-no-files-found: error


  linux_genenv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 8
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enforce FORGE independence from private CKB-plane
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
