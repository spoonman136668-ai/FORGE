name: FORGE public Linux and Windows qualification

on:
  push:
    branches: [main, engineering/real-dual-lane-successor-admission-r1, engineering/r34-e3-two-lane-originals-r1, engineering/ygg-f2-legal-crosspair-r1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-qual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Enforce FORGE independence from private CKB-plane
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          # Exercise the read-only FSA pagination/authority boundaries on both OSes.
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          # Exercise real SQLite one-shot CAS semantics, including cross-lane races.
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: F139 Python controller and native-custody regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s f139 -p 'test_*.py'
      - name: Source-only shared BIO evidence preflight (synthetic Git fixtures)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s research/bio_evidence -p 'test_*.py' -v
      - name: BIO-73 official Gymnasium wheel exact-byte custody (public only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 900
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/bio73-gymnasium-wheel"
          mkdir -p "$target"
          python3 -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --index-url https://pypi.org/simple --dest "$target" 'gymnasium==1.4.0'
          python3 - "$target" <<'PY'
          import hashlib
          import pathlib
          import sys
          import zipfile
          root = pathlib.Path(sys.argv[1])
          names = list(root.iterdir())
          assert len(names) == 1 and names[0].name == 'gymnasium-1.4.0-py3-none-any.whl', 'BIO73_ORIGINAL_WHEEL_IDENTITY_DENIED'
          b = names[0].read_bytes()
          expected = '1cb947c59e7c72d8eabb2c2274c00cd20948e69f8452a9ef4092223be24fdf0e'
          assert hashlib.sha256(b).hexdigest() == expected, 'BIO73_ORIGINAL_WHEEL_SHA256_DENIED'
          with zipfile.ZipFile(names[0]) as z:
              entries = set(z.namelist())
              assert {'gymnasium/envs/toy_text/cliffwalking.py', 'gymnasium/envs/toy_text/frozen_lake.py',
                      'gymnasium-1.4.0.dist-info/METADATA'} <= entries, 'BIO73_UPSTREAM_ENVIRONMENT_FILES_MISSING'
              assert 'Version: 1.4.0' in z.read('gymnasium-1.4.0.dist-info/METADATA').decode('utf-8'), 'BIO73_UPSTREAM_METADATA_MISMATCH'
          print('BIO73_OFFICIAL_WHEEL_SHA256=PASS')
          print('BIO73_OFFICIAL_WHEEL_FILES=PASS')
          print('BIO73_FROZEN_PRIVATE_PREFLIGHT=NOT_RUN')
          print('BIO73_SCIENTIFIC_FIRST_USE=NOT_AUTHORIZED')
          PY
      - name: Retain exact official wheel for private source qualification
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 900
        uses: actions/upload-artifact@v4
        with:
          name: bio73-official-gymnasium-1.4.0-wheel-public
          path: ${{ runner.temp }}/bio73-gymnasium-wheel/gymnasium-1.4.0-py3-none-any.whl
          retention-days: 2
          if-no-files-found: error
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Tests, race, vet and build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
      - name: Public isolation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e snapshot
          test ! -e research/successor-builder
          # Keep imports, arbitrary process creation and network posting denied everywhere.
          ! grep -R --include='*.go' -E 'github.com/spoonman136668-ai/(ckb-plane|Wingless|Yggdrasil)|os.StartProcess|net/http.Post' .
          # exec.Command is restricted to the synthetic supervisor only.
          ! grep -R --exclude-dir=subprocesssupervisor --exclude-dir=forge-synthetic-supervisor --include='*.go' -E 'exec.Command' .
          # The exception contains exactly the bounded executor and its integration test.
          grep -l -E 'exec.Command' subprocesssupervisor/supervise.go subprocesssupervisor/supervise_test.go >/dev/null
          test "$(grep -Rl --include='*.go' -E 'exec.Command' subprocesssupervisor | wc -l)" -eq 3
          grep -q -E 'exec.Command' subprocesssupervisor/partial_crash_test.go
          test "$(grep -Rl --include='*.go' -E 'exec.Command' cmd/forge-synthetic-supervisor | wc -l)" -eq 1
          grep -q -E 'exec.Command' cmd/forge-synthetic-supervisor/main_test.go
          ! grep -E 'exec.Command' cmd/forge-synthetic-supervisor/main.go
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: FORGE independence and standing isolation enforcement
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          # Exercise the read-only FSA pagination/authority boundaries on both OSes.
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          # Exercise real SQLite one-shot CAS semantics, including cross-lane races.
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: F139 Python controller and native-custody regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s f139 -p 'test_*.py'
      - name: Source-only shared BIO evidence preflight (synthetic Git fixtures)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s research/bio_evidence -p 'test_*.py' -v
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Native Windows source qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_TEST_FAILED' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_VET_FAILED' }
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_BUILD_FAILED' }