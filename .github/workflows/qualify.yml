name: FORGE public Linux and Windows qualification

on:
  push:
    branches: [main, engineering/real-dual-lane-successor-admission-r1, engineering/r34-e3-two-lane-originals-r1, engineering/ygg-f2-legal-crosspair-r1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-qual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Enforce FORGE independence from private CKB-plane
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          # Read-only E-D108 diagnostic: identify the exact Git command failing
          # inside isolationguard/check.py; do not weaken or skip that gate.
          git rev-parse --is-shallow-repository
          if git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            echo "ED108_HEAD_FIRST_PARENT=PASS"
            if git merge-base --is-ancestor HEAD^1 HEAD; then echo "ED108_ANCESTOR=PASS"; else echo "ED108_ANCESTOR=FAIL"; fi
            if git diff --check HEAD^1 HEAD; then echo "ED108_DIFF_CHECK=PASS"; else echo "ED108_DIFF_CHECK=FAIL"; fi
            if git diff --no-ext-diff --no-color --no-renames --unified=0 HEAD^1 HEAD -- >/dev/null; then echo "ED108_PATCH_DIFF=PASS"; else echo "ED108_PATCH_DIFF=FAIL"; fi
          else
            echo "ED108_HEAD_FIRST_PARENT=FAIL"
          fi
          python3 -B isolationguard/check.py
          # Exercise the read-only FSA pagination/authority boundaries on both OSes.
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          # Exercise real SQLite one-shot CAS semantics, including cross-lane races.
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - uses: actions/setup-python@v5
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1194 }}
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'research/e_research/ed84_official_minigrid_memory_smoke.py'
      - name: E Research original MiniGrid Memory smoke (PR 1194 only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1194 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --only-binary=:all: 'numpy==1.26.4' 'gymnasium==1.1.1' 'pygame-ce==2.5.3'
          git init -q "$RUNNER_TEMP/ed-memory-minigrid"
          git -C "$RUNNER_TEMP/ed-memory-minigrid" remote add origin https://github.com/Farama-Foundation/Minigrid.git
          git -C "$RUNNER_TEMP/ed-memory-minigrid" fetch --no-tags --depth=1 origin 7f5853792ea7f04f75614661006d87fcf949f26d
          git -C "$RUNNER_TEMP/ed-memory-minigrid" checkout -q --detach 7f5853792ea7f04f75614661006d87fcf949f26d
          test "$(git -C "$RUNNER_TEMP/ed-memory-minigrid" rev-parse HEAD)" = 7f5853792ea7f04f75614661006d87fcf949f26d
          test "$(git -C "$RUNNER_TEMP/ed-memory-minigrid" hash-object minigrid/envs/memory.py)" = 660b0a1b769948034c87bb421759c2b9a4f24548
          python3 -m pip install --no-deps -e "$RUNNER_TEMP/ed-memory-minigrid"
          python3 -B research/e_research/ed84_official_minigrid_memory_smoke.py
          python3 -B research/e_research/ed125_memory_random_baseline.py
          python3 -B research/e_research/ed128_visible_cue_retention.py
          python3 -B research/e_research/ed131_cue_decision_probe.py
      - name: F139 Python controller and native-custody regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s f139 -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Tests, race, vet and build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
      - name: Public isolation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e snapshot
          test ! -e research/successor-builder
          # Keep imports, arbitrary process creation and network posting denied everywhere.
          ! grep -R --include='*.go' -E 'github.com/spoonman136668-ai/(ckb-plane|Wingless|Yggdrasil)|os.StartProcess|net/http.Post' .
          # Freeze the seven preexisting non-supervisor exec.Command sites;
          # deny every new, duplicated, moved, or modified source call.
          # The original bounded supervisor's separate count gates stay intact.
          python3 -B isolationguard/check_subprocess_sites.py
          # The exception contains exactly the bounded executor and its integration test.
          grep -l -E 'exec.Command' subprocesssupervisor/supervise.go subprocesssupervisor/supervise_test.go >/dev/null
          test "$(grep -Rl --include='*.go' -E 'exec.Command' subprocesssupervisor | wc -l)" -eq 3
          grep -q -E 'exec.Command' subprocesssupervisor/partial_crash_test.go
          test "$(grep -Rl --include='*.go' -E 'exec.Command' cmd/forge-synthetic-supervisor | wc -l)" -eq 1
          grep -q -E 'exec.Command' cmd/forge-synthetic-supervisor/main_test.go
          ! grep -E 'exec.Command' cmd/forge-synthetic-supervisor/main.go
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: FORGE independence and standing isolation enforcement
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          # Read-only E-D108 diagnostic: identify the exact Git command failing
          # inside isolationguard/check.py; do not weaken or skip that gate.
          git rev-parse --is-shallow-repository
          if git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            echo "ED108_HEAD_FIRST_PARENT=PASS"
            if git merge-base --is-ancestor HEAD^1 HEAD; then echo "ED108_ANCESTOR=PASS"; else echo "ED108_ANCESTOR=FAIL"; fi
            if git diff --check HEAD^1 HEAD; then echo "ED108_DIFF_CHECK=PASS"; else echo "ED108_DIFF_CHECK=FAIL"; fi
            if git diff --no-ext-diff --no-color --no-renames --unified=0 HEAD^1 HEAD -- >/dev/null; then echo "ED108_PATCH_DIFF=PASS"; else echo "ED108_PATCH_DIFF=FAIL"; fi
          else
            echo "ED108_HEAD_FIRST_PARENT=FAIL"
          fi
          python3 -B isolationguard/check.py
          # Exercise the read-only FSA pagination/authority boundaries on both OSes.
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          # Exercise real SQLite one-shot CAS semantics, including cross-lane races.
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: F139 Python controller and native-custody regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s f139 -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Native Windows source qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_TEST_FAILED' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_VET_FAILED' }
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_BUILD_FAILED' }