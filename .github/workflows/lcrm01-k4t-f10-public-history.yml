name: Mass K4T-F10 original-world short public history sufficiency
on:
  push:
    branches: [research/itd02-k4t-f10-history-sufficiency-20261025]
permissions:
  contents: read
jobs:
  true-physical-history-interventions:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 40
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original-authenticated source history versus same-exposure conventional on independent worlds
        run: bash research/lcrm01/k4t_f10_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k4t-f10-true-public-history-intervention-FIT-DEV
          path: |
            ${{ runner.temp }}/k4tf10/process-a.json
            ${{ runner.temp }}/k4tf10/process-b.json
            ${{ runner.temp }}/k4tf10/comparison.json
            ${{ runner.temp }}/k4tf10/process-a.log
            ${{ runner.temp }}/k4tf10/process-b.log
          if-no-files-found: warn
          retention-days: 90
