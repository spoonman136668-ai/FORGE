name: FORGE R21 read-only autonomous source-audit qualification
on:
  push:
    branches: [engineering/fsa-r21-no-review-source-audit-20261015]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fsa_source_audit.py'
      - 'scripts/test_fsa_source_audit.py'
      - 'scripts/fsa_policy_anchor_r26.py'
      - 'scripts/test_fsa_policy_anchor_r26.py'
      - 'scripts/fsa_atomic_promotion_r27.py'
      - 'scripts/test_fsa_atomic_promotion_r27.py'
      - '.github/workflows/forge-automerge.yml'
      - '.github/workflows/qualify-fsa-source.yml'
      - '.github/workflows/forge-source-audit-r21-qualification.yml'
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  qualify-auditor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: R21 focused autonomous selection regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_fsa_source_audit.py
          python3 -m unittest discover -s scripts -p test_fsa_policy_anchor_r26.py
          python3 -m unittest discover -s scripts -p test_fsa_atomic_promotion_r27.py
      - name: Existing workflows must retain no merge execution path
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'pulls/.*/merge|gh api -X PUT|merge_pull_request' .github/workflows/forge-automerge.yml
          ! grep -Eq 'merge_pull_request|pulls/.*/merge|urllib.request.Request.*PUT' scripts/fsa_source_audit.py
          ! grep -Eq 'merge_pull_request|pulls/.*/merge|urllib.request.Request.*PUT' scripts/fsa_atomic_promotion_r27.py
          grep -q 'contents: read' .github/workflows/forge-automerge.yml
          grep -q 'contents: read' .github/workflows/forge-automerge.yml
          grep -q 'github.sha' .github/workflows/forge-automerge.yml
          echo 'SOURCE_ONLY_NO_MERGE_WRITE=PASS'
      - name: Authenticated policy-anchor continuity, never source authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from fsa_policy_anchor_r26 import observe
          from fsa_source_audit import GitHub
          r=observe(GitHub())
          print('R26_ANCHOR_READBACK='+r['Reason'])
          print('R26_GITHUB_UPDATED_AT='+str(r.get('ObservedUpdatedAt')))
          assert r['PinnedSourcePolicyUnchanged'], r['Reason']
          assert not r['MergeAuthorized'] and not r['ScientificAuthority']
          if not r['BypassActorsFreshlyVisible']:
              assert not r['FullRulesetAuthenticated']
          print('R26_PINNED_POLICY_CONTINUITY=PASS_READONLY')
          PY
      - name: Authenticate current GitHub observations, no mutations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fsa_source_audit.py
          echo 'AUTONOMOUS_AUDIT_ONLY=PASS'
