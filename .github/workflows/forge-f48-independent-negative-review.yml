name: FORGE F48 genuine two-lane TRAIN evidence to F49 hypothesis gate
on:
  push:
    branches: [research/f48-independent-outcome-feedback-20261015-r1]
permissions:
  contents: read
  actions: read
jobs:
  evidence-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exact first-use F48 diagnostic artifacts read-only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          root="$RUNNER_TEMP/f48"
          mkdir -p "$root/Wingless" "$root/Yggdrasil"
          for row in \
            'Wingless 38805703700 0bad6a035e4257f0bc18f593a25e0770d378d17d 12005084367 W-F48-disjoint-trained-query-value-train-NO-ORIGINAL sha256:36ca9fb84f73c8816d2658bdf9631ba235f89ef57eeccf6b8c79618216740b48' \
            'Yggdrasil 38805887306 b2407c469086c6a0ea99e9f3986c4336ef832e79 12006805585 Y-F48-shifted-pair-identifiability-train-NO-ORIGINAL sha256:429e2243666ca9bb0e9f5785439282a3183ce36910b05b88393edae70db2b374'
          do
            read -r lane run head artifact name digest <<< "$row"
            gh api "repos/spoonman136668-ai/$lane/actions/runs/$run" > "$root/$lane/run.json"
            jq -e --arg head "$head" --argjson run "$run" \
              '.id == $run and .head_sha == $head and .run_attempt == 1 and .status == "completed" and .conclusion == "success"' \
              "$root/$lane/run.json" >/dev/null
            gh api "repos/spoonman136668-ai/$lane/actions/artifacts/$artifact" > "$root/$lane/artifact.json"
            jq -e --arg name "$name" --arg digest "$digest" --argjson artifact "$artifact" --argjson run "$run" \
              '.id == $artifact and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run' \
              "$root/$lane/artifact.json" >/dev/null
            gh run download "$run" --repo "spoonman136668-ai/$lane" -n "$name" -D "$root/$lane"
          done
          python3 -B scripts/f48_authentic_train_review.py --wingless "$root/Wingless" \
            --yggdrasil "$root/Yggdrasil" --out "$root/next.json"
          python3 -B scripts/f48_authentic_train_review.py --wingless "$root/Wingless" \
            --yggdrasil "$root/Yggdrasil" --out "$root/again.json"
          cmp "$root/next.json" "$root/again.json"
          jq -e '.reviewed_train_lanes==2 and (.findings | length)==2 and
                 ([.findings[] | select(.disposition=="TRAIN_ONLY_NEGATIVE")] | length)==2 and
                 .prospective_primary_originals_executed==0 and
                 .science_acceptance_or_promotion_authorized==false and
                 .dream_rsi_prospective_improvement_established==false and
                 .theta_evolve_training_authorized==false and
                 .new_controller_or_worker_dispatch_authorized==false and
                 .hypothesis_successors_advisory_only==true' "$root/next.json" >/dev/null
          (cd "$root" && sha256sum next.json > next.sha256)
          echo 'F48_TWO_GENUINE_TRAIN_NEGATIVES_INDEPENDENTLY_RECOUNTED=PASS'
          echo 'F49_NEXT_HYPOTHESES_PREPARED_ADVISORY_ONLY=PASS'
      - name: Negative evidence tests and one full FORGE regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          from scripts import f48_authentic_train_review as audit
          for lane in ("Wingless", "Yggdrasil"):
              spec=audit.EXPECTED[lane]
              assert len(spec["commit"])==40 and len(spec["report"])==64
              assert spec["seeds"][1]<=spec["reserve"][0]
              try:
                  audit.need(False,"NEGATIVE_TEST")
              except audit.Blocked:
                  pass
              else:
                  raise AssertionError("negative evidence accepted")
              try:
                  audit.unique([("status",False),("status",True)])
              except audit.Blocked:
                  pass
              else:
                  raise AssertionError("duplicate key accepted")
          print("F48_FAIL_CLOSED_SOURCE_TESTS=PASS")
          PY
          go test -count=1 ./...
          go vet ./...
          go build ./...
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-f48-recounted-two-lane-science-negatives-f49-advisory
          path: ${{ runner.temp }}/f48/
          retention-days: 30
          if-no-files-found: error
