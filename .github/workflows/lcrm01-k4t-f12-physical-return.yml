name: Mass K4T-F12 true physical revisit memory versus equal-FIT controls
on:
  push:
    branches: [research/itd02-k4t-f12-physical-revisit-20261025]
permissions:
  contents: read
jobs:
  original-public-physical-return:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 40
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-frozen original public probe-and-return, FIT paired outcomes and fresh DEV repeat
        run: bash research/lcrm01/k4t_f12_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k4t-f12-genuine-physical-return-original-source-FIT-DEV
          path: |
            ${{ runner.temp }}/k4tf12/process-a.json
            ${{ runner.temp }}/k4tf12/process-b.json
            ${{ runner.temp }}/k4tf12/comparison.json
            ${{ runner.temp }}/k4tf12/process-a.log
            ${{ runner.temp }}/k4tf12/process-b.log
          if-no-files-found: warn
          retention-days: 90
