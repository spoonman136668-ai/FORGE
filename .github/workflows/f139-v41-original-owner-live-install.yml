            original_head_sha256=$original.original_head_sha256
            original_task_definition_sha256=$taskHash
            original_owner_sid_sha256=$sidHash
            original_source_tree_sha=$original.source_tree_sha
            pending_issue_number=$original.pending_issue_number
            pending_issue_id=$original.pending_issue_id
            pending_ticket=$original.pending_ticket
            pending_semantic_identity_sha256=$original.pending_semantic_identity_sha256
            pending_receipt_sha256=$original.pending_receipt_sha256
            logical_all_tables_sha256=$manifest.logical_all_tables_sha256
            provider_archives_manifest_sha256=$manifest.provider_archives_manifest_sha256
            generation_binary_manifest_sha256=$manifest.generation_binary_manifest_sha256
            source_transition_authorized=$false
            original_owner_mutations=0
            scientific_first_use=$false
            hybrid_admission=$false
