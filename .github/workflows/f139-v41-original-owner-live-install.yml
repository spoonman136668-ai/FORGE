name: FORGE F139 V41 guarded original-owner live installation
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: read
concurrency:
  group: forge-f139-v41-original-owner-live-install
  cancel-in-progress: false
jobs:
  original-owner-v41-live-install:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'spoonman136668-ai' &&
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.event.issue.number == 807 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-V41-LIVE-INSTALL ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 45
    steps:
      - name: Checkout exact protected-main V41 installer source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: One-shot original-owner V41 installation with recovery fence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/main' -or
             $env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or
             $env:OPENAI_API_KEY) {
            throw 'F139_V41_INSTALL_ORIGINAL_FIRST_ATTEMPT_ONLY'
          }
          & "$env:GITHUB_WORKSPACE/f139/v41_original_owner_live_install.ps1" -Target $env:GITHUB_SHA
          if($LASTEXITCODE -ne 0) {
            throw 'F139_V41_INSTALL_NOT_ACCEPTED'
          }
  original-owner-v41-readiness:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'spoonman136668-ai' &&
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.event.issue.number == 807 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-V41-INSTALL-READINESS ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout exact protected-main read-only preflight
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read exact sealed backup, original task hashes and pending issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          function Need([bool]$ok,[string]$code) {
            if(-not $ok){throw ('F139_V41_READINESS_'+$code)}
          }
          Need ($env:GITHUB_REPOSITORY -ceq 'spoonman136668-ai/FORGE' -and
            $env:GITHUB_ACTOR -ceq 'spoonman136668-ai' -and
            $env:GITHUB_EVENT_NAME -ceq 'issue_comment' -and
            $env:GITHUB_REF -ceq 'refs/heads/main' -and
            $env:RUNNER_NAME -ceq 'FORGE-CODEX-REMOTE' -and
            $env:GITHUB_RUN_ATTEMPT -ceq '1' -and
            $env:GITHUB_SHA -cmatch '^[a-f0-9]{40}$' -and
            -not $env:OPENAI_API_KEY) 'EXACT_OWNER_RUN'
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $prefix='F139-V41-INSTALL-READINESS '
          Need ($event.action -ceq 'created' -and $event.issue.number -eq 807 -and
            $event.issue.user.login -ceq 'spoonman136668-ai' -and
            $null -eq $event.issue.PSObject.Properties['pull_request'] -and
            $event.sender.login -ceq 'spoonman136668-ai' -and
            $event.comment.user.login -ceq 'spoonman136668-ai' -and
            $event.comment.author_association -ceq 'OWNER' -and
            [string]$event.comment.body -clike ($prefix+'*')) 'ORIGINAL_COMMENT'
          $request=([string]$event.comment.body).Substring($prefix.Length)|ConvertFrom-Json
          Need ($request.schema -ceq 'forge.f139.v41.owner-readiness-request.v1' -and
            $request.target_source_sha -ceq $env:GITHUB_SHA -and
            [string]$request.release_pr_number -cmatch '^[1-9][0-9]*$' -and
            [int64]$request.release_pr_number -gt 0 -and
            [string]$request.backup_run_id -cmatch '^[1-9][0-9]*$' -and
            [int64]$request.backup_run_id -gt 0) 'REQUEST_SCOPE'
          $data=Join-Path $env:LOCALAPPDATA 'FORGE-F139'
          $target=[string]$request.target_source_sha
          $bundle=Join-Path $data ('f139-v41-before-'+[string]$request.backup_run_id)
          $manifestPath=Join-Path $bundle 'manifest.sha256.json'
          $binary=Join-Path $data ('genenv-source\'+$target+'\f139-genenv-source.exe')
          $candidate=Join-Path $data ('release-candidates\'+$target)
          Need ((Test-Path -LiteralPath $manifestPath -PathType Leaf) -and
            (Test-Path -LiteralPath $binary -PathType Leaf) -and
            (Test-Path -LiteralPath $candidate -PathType Container)) 'ORIGINAL_STAGED_INPUTS'
          $manifest=(Get-Content -LiteralPath $manifestPath -Raw)|ConvertFrom-Json
          $manifestSha=(Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $binarySha=(Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          Need ($manifest.schema -ceq 'forge.f139.v41.offline-cold-bundle-dev.v2' -and
            $manifest.target_source_sha -ceq $target -and
            $manifest.original_source_sha -ceq '2c7caad5a4502d4b874a11d57207a35cf033eb08' -and
            $manifest.run_id -eq $request.backup_run_id -and
            $manifest.source_transition_authorized -eq $false -and
            $manifest.scientific_first_use -eq $false -and
            $manifest.hybrid_admission -eq $false -and
            $manifestSha -cmatch '^[a-f0-9]{64}$' -and
            $binarySha -cmatch '^[a-f0-9]{64}$') 'SEALED_ORIGINAL_PROOF'
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          $sid=''
          try{$sid=(New-Object Security.Principal.NTAccount([string]$task.Principal.UserId)).
            Translate([Security.Principal.SecurityIdentifier]).Value}catch{}
          Need ([string]$task.State -cin @('Running','Ready') -and
            $task.Settings.Enabled -eq $true -and
            @($task.Actions).Count -eq 1 -and @($task.Triggers).Count -eq 3 -and
            ([string]$task.Principal.UserId -ieq $who.Name -or $sid -ceq $who.User.Value)) 'ORIGINAL_TASK_SID_DRIFT'
          $xml=Export-ScheduledTask -TaskName 'FORGE-F139-UnifiedController'
          $bytes=[Text.Encoding]::UTF8.GetBytes([string]$xml)
          $taskHash=([BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($bytes))).Replace('-','').ToLowerInvariant()
          $sidBytes=[Text.Encoding]::UTF8.GetBytes([string]$who.User.Value)
          $sidHash=([BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($sidBytes))).Replace('-','').ToLowerInvariant()
          $db=Join-Path $data 'state.sqlite'
          $code=@'
          import json,sys
          from pathlib import Path
          from contextlib import closing
          from f139.local_controller import Database,GitHub,SingleOwner
          from f139.nci04_native_contract import canonical,digest
          from f139 import nci04_v41_pending_custody as pending
          from f139 import nci04_v41_guarded_release_preflight as release
          p=Path(sys.argv[1]).resolve()
          target=sys.argv[2]
          release_pr=int(sys.argv[3])
          api=GitHub()
          remote=release._remote_source(api.native_repo_get,target=target,release_pr=release_pr)
          with SingleOwner(p.with_suffix(".lock")):
              with closing(Database.open_readonly(p)) as db:
                  before=db.meta().copy()
                  db.verify()
                  original=pending.inspect_never_admitted(db,api)
                  assert db.meta()==before and db.conn.total_changes==0
                  assert before["source_sha"]=="2c7caad5a4502d4b874a11d57207a35cf033eb08"
          print("F139_V41_READINESS_ORIGINAL="+canonical(dict(
              original_head_seq=before["head_seq"],
              original_head_sha256=before["head_hash"],
              pending_issue_number=original["issue_number"],
              pending_issue_id=original["issue_id"],
              pending_ticket=original["ticket"],
              pending_semantic_identity_sha256=original["semantic_identity_sha256"],
              pending_receipt_sha256=digest(canonical(original)),
              source_tree_sha=remote["tree_sha"]
          )).decode("ascii"))
          '@
          $env:PYTHONPATH=$env:GITHUB_WORKSPACE
          $rows=@($code | & python -B - $db $target ([string]$request.release_pr_number))
          Need ($LASTEXITCODE -eq 0 -and $rows.Count -eq 1 -and
            $rows[0] -cmatch '^F139_V41_READINESS_ORIGINAL=') 'LOCKED_ORIGINAL_READ_FAILED'
          $original=$rows[0].Substring('F139_V41_READINESS_ORIGINAL='.Length)|ConvertFrom-Json
          Need ($manifest.original_head_seq -eq $original.original_head_seq -and
            $manifest.original_head_sha256 -ceq $original.original_head_sha256 -and
            $original.pending_issue_number -eq 1715) 'BACKUP_OR_PENDING_DRIFT'
          Write-Host ('F139_V41_READINESS_EVIDENCE='+(@{
            schema='forge.f139.v41.original-owner-readiness-only.v1'
            target_source_sha=$target
            backup_run_id=$request.backup_run_id
            sealed_manifest_sha256=$manifestSha
            binary_sha256=$binarySha
            original_head_seq=$original.original_head_seq
            original_head_sha256=$original.original_head_sha256
            original_task_definition_sha256=$taskHash
            original_owner_sid_sha256=$sidHash
            original_source_tree_sha=$original.source_tree_sha
            pending_issue_number=$original.pending_issue_number
            pending_issue_id=$original.pending_issue_id
            pending_ticket=$original.pending_ticket
            pending_semantic_identity_sha256=$original.pending_semantic_identity_sha256
            pending_receipt_sha256=$original.pending_receipt_sha256
            logical_all_tables_sha256=$manifest.logical_all_tables_sha256
            provider_archives_manifest_sha256=$manifest.provider_archives_manifest_sha256
            generation_binary_manifest_sha256=$manifest.generation_binary_manifest_sha256
            source_transition_authorized=$false
            original_owner_mutations=0
            scientific_first_use=$false
            hybrid_admission=$false
          }|ConvertTo-Json -Depth 6 -Compress))
          Write-Host 'F139_V41_READINESS_ONLY_NO_TASK_OR_SQLITE_MUTATION=PASS'
  original-owner-v41-copy-rehearsal:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'spoonman136668-ai' &&
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.event.issue.number == 807 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-V41-COPY-REHEARSAL ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout exact protected-main copy rehearsal source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Original query-only ledger and isolated copy transaction
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/main' -or
             $env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or
             $env:OPENAI_API_KEY) {
            throw 'F139_V41_COPY_REHEARSAL_WRONG_OWNER_RUN'
          }
          & python -B -m f139.nci04_v41_native_original_install_cli --target $env:GITHUB_SHA --rehearse-only
          if($LASTEXITCODE -ne 0) {
            throw 'F139_V41_COPY_REHEARSAL_NOT_VERIFIED'
          }

  hybrid-v41-paired-original-owner-backup:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'spoonman136668-ai' &&
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.event.issue.number == 807 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-HYBRID-V41-PAUSE-RESUME ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout exact protected-main qualified owner source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Authenticated paired original-owner same-task cold backup only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
             $env:GITHUB_REF -cne 'refs/heads/main' -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or
             $env:OPENAI_API_KEY) {
            throw 'F139_HYBRID_V41_ORIGINAL_APPROVAL_OR_SOURCE_DENIED'
          }
          $exact=(& git -C $env:GITHUB_WORKSPACE rev-parse HEAD | Out-String).Trim()
          $dirty=@(& git -C $env:GITHUB_WORKSPACE status --porcelain --untracked-files=all)
          if($LASTEXITCODE -ne 0 -or $exact -cne $env:GITHUB_SHA -or
             $dirty.Count -ne 0) {
            throw 'F139_HYBRID_V41_PROTECTED_CHECKOUT_CHANGED'
          }
          $wrapper=Join-Path $env:GITHUB_WORKSPACE 'f139/v41_hybrid_owner_pause_backup_resume.ps1'
          if(-not(Test-Path -LiteralPath $wrapper -PathType Leaf)) {
            throw 'F139_HYBRID_V41_MERGED_WRAPPER_NOT_PRESENT'
          }
          & $wrapper -Target $env:GITHUB_SHA
          if($LASTEXITCODE -ne 0) {
            throw 'F139_HYBRID_V41_MAINTENANCE_NOT_ACCEPTED'
          }

  hybrid-v41-original-pause-hold:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'spoonman136668-ai' &&
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.event.issue.number == 807 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-HYBRID-V41-PAUSE-HOLD ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 35
    permissions:
      contents: read
      issues: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout exact protected-main original-owner source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Authenticate original owner and execute bounded operation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
             $env:GITHUB_REF -cne 'refs/heads/main' -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or
             $env:OPENAI_API_KEY) { throw 'F139_HYBRID_OWNER_FIRST_ATTEMPT_DENIED' }
          $sha=(& git -C $env:GITHUB_WORKSPACE rev-parse HEAD|Out-String).Trim()
          $dirty=@(& git -C $env:GITHUB_WORKSPACE status --porcelain --untracked-files=all)
          if($LASTEXITCODE -ne 0 -or $sha -cne $env:GITHUB_SHA -or $dirty.Count -ne 0){
            throw 'F139_HYBRID_MERGED_CANDIDATE_NOT_EXACT'
          }
          # Create the durable clean checkout BEFORE interrupting the existing task.
          # If staging fails, Wingless/Yggdrasil continue uninterrupted.
          $root=Join-Path $env:LOCALAPPDATA ('FORGE-F139\release-candidates\'+$env:GITHUB_SHA)
          $parent=Split-Path -Parent $root
          if(-not(Test-Path -LiteralPath $root -PathType Container)){
            if(Test-Path -LiteralPath $root){throw 'F139_HYBRID_STAGE_UNSAFE_PATH'}
            New-Item -ItemType Directory -Path $parent -Force | Out-Null
            & git clone --quiet --no-hardlinks --no-checkout $env:GITHUB_WORKSPACE $root
            if($LASTEXITCODE -ne 0){throw 'F139_HYBRID_STAGE_CLONE_FAILURE'}
            & git -C $root checkout --quiet --detach $env:GITHUB_SHA
            if($LASTEXITCODE -ne 0){throw 'F139_HYBRID_STAGE_CHECKOUT_FAILURE'}
          }
          if(([IO.File]::GetAttributes($root) -band [IO.FileAttributes]::ReparsePoint) -ne 0){
            throw 'F139_HYBRID_STAGE_JUNCTION_DENIED'
          }
          $installed=(& git -C $root rev-parse HEAD|Out-String).Trim()
          $untracked=@(& git -C $root status --porcelain --untracked-files=all)
          $worker=(& git -C $root rev-parse HEAD:.github/workflows/forge-f139-development-worker.yml|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $installed -cne $env:GITHUB_SHA -or
             $untracked.Count -ne 0 -or
             $worker -cne '74dd90e6d71da6b53898c7a80d5362f1b0e6af27'){
            throw 'F139_HYBRID_DURABLE_STAGE_OR_WORKER_UNQUALIFIED'
          }
          & "$env:GITHUB_WORKSPACE/f139/v41_hybrid_owner_pause_backup_resume.ps1" -Target $env:GITHUB_SHA -Hold
          if($LASTEXITCODE -ne 0){throw 'F139_HYBRID_ORIGINAL_OWNER_HOLD_NOT_ACCEPTED'}

  hybrid-v41-original-readiness:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'spoonman136668-ai' &&
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.event.issue.number == 807 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-HYBRID-V41-SOURCE-READINESS ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout exact protected-main original-owner source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Authenticate original owner and execute bounded operation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
             $env:GITHUB_REF -cne 'refs/heads/main' -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or
             $env:OPENAI_API_KEY) { throw 'F139_HYBRID_OWNER_FIRST_ATTEMPT_DENIED' }
          $sha=(& git -C $env:GITHUB_WORKSPACE rev-parse HEAD|Out-String).Trim()
          $dirty=@(& git -C $env:GITHUB_WORKSPACE status --porcelain --untracked-files=all)
          if($LASTEXITCODE -ne 0 -or $sha -cne $env:GITHUB_SHA -or $dirty.Count -ne 0){
            throw 'F139_HYBRID_MERGED_CANDIDATE_NOT_EXACT'
          }
          $e=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
          $body=[string]$e.comment.body
          if($body -cnotmatch ('^F139-HYBRID-V41-SOURCE-READINESS '+$env:GITHUB_SHA+' ([1-9][0-9]*) ([a-f0-9]{64}) ([1-9][0-9]*)$')){
            throw 'F139_HYBRID_READINESS_CANONICAL_COMMENT_REQUIRED'
          }
          $runId=[long]$Matches[1];$manifest=[string]$Matches[2];$approval=[long]$Matches[3]
          & "$env:GITHUB_WORKSPACE/f139/v41_hybrid_successor_readiness.ps1" -Target $env:GITHUB_SHA -BackupRunId $runId -BackupManifest $manifest -PairedApprovalId $approval
          if($LASTEXITCODE -ne 0){throw 'F139_HYBRID_READINESS_UNVERIFIED'}

  hybrid-v41-original-source-commit:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'spoonman136668-ai' &&
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.event.issue.number == 807 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-HYBRID-V41-SOURCE-COMMIT ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout exact protected-main original-owner source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Authenticate original owner and execute bounded operation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
             $env:GITHUB_REF -cne 'refs/heads/main' -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or
             $env:OPENAI_API_KEY) { throw 'F139_HYBRID_OWNER_FIRST_ATTEMPT_DENIED' }
          $sha=(& git -C $env:GITHUB_WORKSPACE rev-parse HEAD|Out-String).Trim()
          $dirty=@(& git -C $env:GITHUB_WORKSPACE status --porcelain --untracked-files=all)
          if($LASTEXITCODE -ne 0 -or $sha -cne $env:GITHUB_SHA -or $dirty.Count -ne 0){
            throw 'F139_HYBRID_MERGED_CANDIDATE_NOT_EXACT'
          }
          & "$env:GITHUB_WORKSPACE/f139/v41_hybrid_original_source_commit.ps1" -Target $env:GITHUB_SHA
