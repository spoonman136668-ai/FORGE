name: FORGE CPU G96 original GPT2 development only
on:
  push:
    branches: [research/cpu-llm-g96-admission-policy-20261031]
    paths:
      - '.github/workflows/forge-cpu-g96-original-development.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cpu-g96-development-original
  cancel-in-progress: false
jobs:
  source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify frozen original model and G96 development-only source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:research/cpu_g95/g95_multiprefix_lru_original.py)" = "b401c86e4dff2f25eb995a47ba58884838f232eb"
          git merge-base --is-ancestor 856da2432ef4163938711bcb6b0369fbfab2ccbd HEAD
          python -B -m py_compile research/cpu_g96/g96_development_original.py research/cpu_g96/g96_original_adapter.py
          python -B -m unittest discover -s research/cpu_g96 -p 'test_g96*.py' -v
          echo G96_DEVELOPMENT_SOURCE_ADMISSION=PASS
  original-model-development:
    needs: source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned original CPU GPT2 runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 huggingface-hub==0.30.2 safetensors==0.5.3 tokenizers==0.21.1 psutil==7.1.3
          python -m pip check
          python -m pip freeze > cpu_g96_development_environment.txt
          uname -a >> cpu_g96_development_environment.txt
          lscpu >> cpu_g96_development_environment.txt
      - name: Measure original GPT2 development cohort only
        shell: bash
        run: |
          set -euo pipefail
          python research/cpu_g96/g96_development_original.py
          python - <<'PY'
          import json
          r=json.load(open("cpu_g96_development_result.json"))
          assert r["phase"]=="DEVELOPMENT_ONLY" and r["selected_ranks"]==[276,287]
          assert r["engineering"]=="PASS" and r["correctness"]=="PASS"
          assert r["heldout_executed"] is False and r["promotion_allowed"] is False
          assert len(r["strata"])==4 and all(v["exact_parity"] for v in r["strata"].values())
          print("G96_DEVELOPMENT_ONLY=PASS")
          PY
      - name: Preserve original development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-g96-original-gpt2-development
          retention-days: 30
          if-no-files-found: warn
          path: |
            cpu_g96_development_result.json
            cpu_g96_development_environment.txt
