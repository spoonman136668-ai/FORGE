name: FORGE research G54 authentic GPT-2 caching screen
on:
  push:
    branches: [research/llm-g54-gpt2-pinned-20261030]
    paths:
      - 'research/llm_g54/**'
      - '.github/workflows/forge-llm-g54-gpt2.yml'
permissions:
  contents: read
concurrency:
  group: forge-llm-g54-source-readonly
  cancel-in-progress: false
jobs:
  g54-cpu-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checked out research source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile research/llm_g54/g54_gpt2.py
          echo 'G54_SOURCE_COMPILE=PASS'
      - name: Install pinned public CPU inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install --disable-pip-version-check 'transformers==4.48.3' 'huggingface_hub==0.30.2' 'safetensors==0.5.3' 'tokenizers==0.21.1'
          python -m pip freeze > g54_environment_pip_freeze.txt
      - name: Execute independently written pinned GPT-2 CPU screen
        shell: bash
        env:
          HF_HUB_DISABLE_XET: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/llm_g54/g54_gpt2.py
          python - <<'PY'
          import json
          r=json.load(open('g54_result.json'))
          assert r['correctness']=='PASS' and r['promotion_allowed'] is False
          assert r['scientific_acceptance']=='NOT_GRANTED'
          print('G54_AUTHENTIC_CORRECTNESS=PASS')
          print('G54_ACCELERATION_SCREEN='+r['acceleration'])
          print('G54_SCIENTIFIC_ACCEPTANCE=NOT_GRANTED')
          PY
      - name: Upload immutable research-only source run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g54-authentic-gpt2-screen
          if-no-files-found: warn
          path: |
            g54_result.json
            g54_environment_pip_freeze.txt
          retention-days: 30
