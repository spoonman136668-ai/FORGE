name: F124-R sparse routing preimplementation freeze admission

# Pure source-only admission, not a scientific experiment, implementation
# rollout, protected CONFIRM access, controller, promotion, or scheduling.
on:
  push:
    branches: [research/f124r-sparse-route-precommit-20261017]
    paths:
      - 'reference/research-intake/f124r-sparse-causal-routing-freeze.json'
      - 'nativeevidence/f124r_freeze_admission.py'
      - 'nativeevidence/test_f124r_freeze_admission.py'
      - 'nativeevidence/f124r_*.py'
      - 'nativeevidence/test_f124r_*.py'
      - '.github/workflows/forge-f124r-freeze-admission.yml'

permissions:
  contents: read

concurrency:
  group: f124r-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze-source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check exact inherited immutable F123 source and freeze
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA) {
            throw 'F124R_UNEXPECTED_HEAD'
          }
          & git cat-file -e 'fc913d03f9cdeb7daa0b289dcdc50d4c465cd9f8^{commit}'
          if ($LASTEXITCODE -ne 0) { throw 'F124R_MISSING_PARENT_COMMIT' }
          & git merge-base --is-ancestor fc913d03f9cdeb7daa0b289dcdc50d4c465cd9f8 $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'F124R_PARENT_ANCESTRY_DRIFT' }
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python -B -m unittest discover -s nativeevidence -p 'test_f124r_freeze_admission.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F124R_FREEZE_TESTS_FAILED' }
          $dir=Join-Path $env:RUNNER_TEMP 'f124r-source-only'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $receipt=Join-Path $dir 'f124r-source-admission.json'
          & $python -B nativeevidence/f124r_freeze_admission.py --source-ref $env:GITHUB_SHA --output $receipt
          if ($LASTEXITCODE -ne 0) { throw 'F124R_SOURCE_RECEIPT_FAILED' }
          $json=Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if ($json.source_commit_sha -cne $env:GITHUB_SHA -or
              $json.F124R_freeze_git_blob -cne '891c950e1d25eea90fbe5191abf8e9c1ab4eac7f' -or
              $json.cohorts_read -ne 0) { throw 'F124R_BAD_CUSTODY' }
          $digest=(Get-FileHash -LiteralPath $receipt -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $dir 'f124r-source-admission.sha256'),
              ($digest + '  f124r-source-admission.json' + [Environment]::NewLine),
              [Text.UTF8Encoding]::new($false))
          Write-Host "F124R_PREIMPLEMENTATION_RECEIPT_SHA256=$digest"
          Write-Host 'F124R_CONFIRM_EXECUTED=false'
          Write-Host 'F124R_SCIENTIFIC_ACCEPTANCE=false'
      - uses: actions/upload-artifact@v4
        with:
          name: f124r-preimplementation-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/f124r-source-only/
          retention-days: 30
          if-no-files-found: error


  train-only-sparse2:
    needs: freeze-source-only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Qualify complete public graph and bounded Sparse-2 model
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python -B -m unittest discover -s nativeevidence -p 'test_f124r_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F124R_SPARSE_PUBLIC_SOURCE_TEST_FAILED' }
      - name: Authenticated model-free advisory and two-lane TRAIN-only weights
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          $dir=Join-Path $env:RUNNER_TEMP 'f124r-sparse-train-only'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $advisory=Join-Path $dir 'f124r-advisory.json'
          & go run ./cmd/forge-model-free-loop --synthetic-only --source-ref $env:GITHUB_SHA | Out-File -LiteralPath $advisory -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'F124R_SOURCE_ADVISORY_GENERATOR_FAILED' }
          $source=Get-Content -LiteralPath $advisory -Raw | ConvertFrom-Json
          if ($source.schema -cne 'forge.model-free.two-lane-untested-advisory.v1' -or
              $source.source_commit_sha -cne $env:GITHUB_SHA -or
              $source.lanes.Count -ne 2 -or
              $source.model_invocations -ne 0 -or $source.codex_invocations -ne 0 -or
              $source.network_calls -ne 0 -or $source.new_scientific_originals -ne 0 -or
              $source.scientific_first_use_authorized -or
              $source.policy_promotion_authorized -or
              $source.accepted_ref_mutations -ne 0) {
            throw 'F124R_UNTRUSTED_ADVISORY'
          }
          $receipt=Join-Path $dir 'f124r-sparse-train-only.json'
          & $python -B nativeevidence/f124r_train_qualification.py --advisory $advisory --source-ref $env:GITHUB_SHA --output $receipt
          if ($LASTEXITCODE -ne 0) { throw 'F124R_SPARSE_TRAIN_QUARANTINED' }
          $r=Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if ($r.schema -cne 'forge.autonomy.f124r.sparse2-public-train-custody.v1' -or
              $r.source_commit_sha -cne $env:GITHUB_SHA -or
              $r.f124r_freeze_git_blob -cne '891c950e1d25eea90fbe5191abf8e9c1ab4eac7f' -or
              $r.phase -cne 'PUBLIC_SYNTHETIC_TRAIN_ONLY' -or
              $r.lanes.Count -ne 2 -or
              $r.lanes[0].lane -cne 'Wingless' -or
              $r.lanes[1].lane -cne 'Yggdrasil' -or
              $r.protected_confirmation_read -or $r.scientific_first_use -or
              $r.scientific_acceptance -or $r.optimizer_promotion -or
              $r.originals_dispatched -ne 0 -or $r.accepted_ref_mutations -ne 0 -or
              $r.codex_calls -ne 0 -or $r.paid_model_calls -ne 0 -or
              $r.new_scheduler) { throw 'F124R_UNEARNED_AUTHORITY' }
          foreach ($lane in $r.lanes) {
            if ($lane.selected_model -cne 'S2' -or
                $lane.train_scores.pairs -ne 64 -or
                $lane.learned_parameter_count -ne 20 -or
                $lane.optimizer_epochs -ne 100 -or
                $lane.protected_confirm_generated -or
                $lane.independent_scientific_acceptance -or
                $lane.resource_matched_superiority -or
                $lane.primitive_counts_comparable_to_dense_control) {
              throw 'F124R_TRAIN_RECEIPT_UNQUALIFIED'
            }
          }
          foreach ($name in @('f124r-advisory.json','f124r-sparse-train-only.json')) {
            $path=Join-Path $dir $name
            $digest=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText(($path+'.sha256'),
                ($digest + '  ' + $name + [Environment]::NewLine),
                [Text.UTF8Encoding]::new($false))
          }
          Write-Host "F124R_TRAIN_SOURCE_SHA=$env:GITHUB_SHA"
          Write-Host 'F124R_PROTECTED_CONFIRM=false'
          Write-Host 'F124R_SCIENTIFIC_FITNESS=false'
      - uses: actions/upload-artifact@v4
        with:
          name: f124r-sparse-train-only-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/f124r-sparse-train-only/
          if-no-files-found: error
          retention-days: 90


  f124r-control-resource-audit:
    needs: train-only-sparse2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: f124r-sparse-train-only-ubuntu-latest-${{ github.sha }}
          path: saved-f124r-train
      - name: Verify original TRAIN receipts, replay dense controls and audit pruning
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $folder='saved-f124r-train'
          $report=Join-Path $folder 'f124r-train-controls.json'
          & python3 -B -m unittest discover -s nativeevidence -p 'test_f124r_train_controls.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F124R_CONTROL_SOURCE_TEST_FAILED' }
          & python3 -B nativeevidence/f124r_train_controls.py --advisory (Join-Path $folder 'f124r-advisory.json') --train-report (Join-Path $folder 'f124r-sparse-train-only.json') --source-ref $env:GITHUB_SHA --output $report
          if ($LASTEXITCODE -ne 0) { throw 'F124R_SOURCE_ONLY_CONTROL_QUARANTINED' }
          $r=Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($r.schema -cne 'forge.autonomy.f124r.train-controls-resource-pruning.v1' -or
              $r.source_commit_sha -cne $env:GITHUB_SHA -or
              $r.f124r_freeze_git_blob -cne '891c950e1d25eea90fbe5191abf8e9c1ab4eac7f' -or
              $r.lanes.Count -ne 2 -or $r.lanes[0].lane -cne 'Wingless' -or
              $r.lanes[1].lane -cne 'Yggdrasil' -or
              $r.protected_confirmation_read -or $r.scientific_acceptance -or
              $r.optimizer_promotion -or $r.scientific_first_use -or
              -not $r.negative_findings_retained -or
              $r.equal_runtime_or_true_cost_parity_established) {
            throw 'F124R_CONTROL_AUDIT_UNEARNED_SCIENCE'
          }
          foreach ($lane in $r.lanes) {
            if ($lane.train_pairs -ne 64 -or
                $lane.trace_rows.Count -ne 128 -or
                $lane.positive_train_graphs -ne 64 -or
                $lane.costs_are_mixed_primitive_event_proxies_not_runtime -ne $true -or
                $lane.measured_equal_compute_cost_established -or
                $lane.control_paired_scores.CTRL_EXACT_SYMBOLIC_CEILING.paired_correct -ne 64 -or
                $lane.control_paired_scores.CTRL_F123_DENSE_B.pairs -ne 64 -or
                $lane.train_trace_sha256 -notmatch '^[0-9a-f]{64}$') {
              throw 'F124R_TRAIN_DIAGNOSTIC_INCOMPLETE'
            }
          }
          $digest=(Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($report+'.sha256'),
            ($digest+'  f124r-train-controls.json'+[Environment]::NewLine),
            [Text.UTF8Encoding]::new($false))
          Write-Host "F124R_CONTROL_AUDIT_SHA256=$digest"
          Write-Host 'F124R_CONFIRM_READ=false'
          Write-Host 'F124R_TRUE_COST_PARITY_NOT_ESTABLISHED=true'
      - uses: actions/upload-artifact@v4
        with:
          name: f124r-train-control-prune-audit-${{ github.sha }}
          path: |
            saved-f124r-train/f124r-train-controls.json
            saved-f124r-train/f124r-train-controls.json.sha256
          if-no-files-found: error
          retention-days: 90

  f124r-exact-head-regression:
    needs: f124r-control-resource-audit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Exact head and isolated source interfaces
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'F124R_HEAD_IDENTITY_MISMATCH' }
          $py=if ($IsWindows) { 'python' } else { 'python3' }
          & $py -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F124R_ISOLATION_TEST_FAILURE' }
          & $py -B isolationguard/check.py
          if ($LASTEXITCODE -ne 0) { throw 'F124R_SOURCE_ISOLATION_FAILED' }
          & $py -B -m unittest discover -s nativeevidence -p 'test_f12[012]_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F124R_FROZEN_PARENT_INTERFACE_FAILED' }
          & $py -B -m unittest discover -s nativeevidence -p 'test_f123_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F124R_PARENT_F123_INTERFACE_FAILED' }
          & $py -B -m unittest discover -s nativeevidence -p 'test_f124r_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F124R_AFFECTED_INTERFACE_FAILED' }
      - name: Full Go regression, Linux race, vet
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'F124R_GO_TEST_FAILED' }
          if (-not $IsWindows) {
            go test -race -count=1 ./...
            if ($LASTEXITCODE -ne 0) { throw 'F124R_GO_RACE_FAILED' }
          }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'F124R_GO_VET_FAILED' }
      - name: Build after regression and hash exact-head artifact
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw 'F124R_FULL_BUILD_FAILED' }
          $ext=if ($IsWindows) { '.exe' } else { '' }
          $exe=Join-Path $env:RUNNER_TEMP ('f124r-synthetic-worker'+$ext)
          go build -o $exe ./cmd/forge-sandbox-worker
          if ($LASTEXITCODE -ne 0) { throw 'F124R_WORKER_BUILD_FAILED' }
          $hash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -notmatch '^[0-9a-f]{64}$') { throw 'F124R_BAD_WORKER_HASH' }
          $receipt=[ordered]${{
            schema='forge.autonomy.f124r.full-development-regression.v1'
            source_sha=$env:GITHUB_SHA
            platform=$env:RUNNER_OS
            workflow_run_id=$env:GITHUB_RUN_ID
            synthetic_worker_sha256=$hash
            full_go_regression=$true
            affected_interfaces=$true
            go_vet_build=$true
            linux_race_executed=($env:RUNNER_OS -eq 'Linux')
            protected_confirmation_read=$false
            scientific_first_use=$false
            scientific_acceptance=$false
            optimizer_promotion=$false
            accepted_ref_mutations=0
          }|ConvertTo-Json -Depth 4
          $folder=Join-Path $env:RUNNER_TEMP 'f124r-full-regression'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          [IO.File]::WriteAllText((Join-Path $folder 'receipt.json'),
              ($receipt+[Environment]::NewLine), [Text.UTF8Encoding]::new($false))
          Write-Host "F124R_WORKER_SHA256=$hash"
          Write-Host 'F124R_SCIENTIFIC_ACCEPTANCE=false'
      - uses: actions/upload-artifact@v4
        with:
          name: f124r-full-public-regression-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/f124r-full-regression/receipt.json
          if-no-files-found: error
          retention-days: 90
