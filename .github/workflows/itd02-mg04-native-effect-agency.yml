name: ITD-02 MG04 authentic DoorKey visible public effects with native agency and conventional
on:
  push:
    branches:
      - research/itd02-mg04-public-effect-native-agency-20261028
permissions:
  contents: read
jobs:
  source-exact-three-independent-actors:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Original source Git newline policy
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact-source checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - name: Original Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original native Go build
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Original source-pinned two-process MG04 with native and conventional action provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash research/lcrm01/mg04_ci.sh
      - name: Keep both independently verified original-world evidence streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-mg04-authentic-doorkey-native-visible-effects-vs-conventional
          path: |
            ${{ runner.temp }}/mg04/first.json
            ${{ runner.temp }}/mg04/second.json
            ${{ runner.temp }}/mg04/comparison.json
            ${{ runner.temp }}/mg04/first.log
            ${{ runner.temp }}/mg04/second.log
          if-no-files-found: warn
          retention-days: 30
