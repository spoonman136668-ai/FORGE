name: FORGE F114-O original Freebase graph archive custody intake
on:
  push:
    branches: [engineering/f114o-freebase-archive-attestation-20261017-r1]
    paths:
      - 'noveltyeval/f114o_*'
      - 'noveltyeval/test_f114o_*'
      - 'docs/F114O-*'
      - '.github/workflows/forge-f114o-original-archive-custody.yml'
permissions:
  contents: read
jobs:
  witnessed-original-custody-gate-source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original publisher immutable README/LICENSE sparse; NO QA or graph
        uses: actions/checkout@v4
        with:
          repository: kelvin-jiang/FreebaseQA
          ref: d16aae5149aaa25e43ff2a7bd00a06f280ca19b9
          path: publisher-documentation-only
          sparse-checkout: |
            README.md
            LICENSE
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Authenticate git identity; guarantee graph/QA never materialized
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C publisher-documentation-only rev-parse HEAD)" = 'd16aae5149aaa25e43ff2a7bd00a06f280ca19b9'
          test "$(git -C publisher-documentation-only rev-parse HEAD:README.md)" = 'dd4c65cbe5428b2a86afc47ae2309cb11328b31b'
          test "$(git -C publisher-documentation-only rev-parse HEAD:LICENSE)" = '10fabd90118f7ce38bb2e4753e105e744442a429'
          for n in FreebaseQA-train.json FreebaseQA-dev.json FreebaseQA-eval.json FreebaseQA-partial.json; do
            test ! -e "publisher-documentation-only/$n"
          done
          echo 'F114O_NO_GRAPH_ARCHIVE_DOWNLOAD_OR_FREEBASE_QA_SOURCE_READ'
      - name: Adversarial synthetic source receipt and missing genuine witness
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s noveltyeval -p 'test_f114o_archive_custody_intake.py' -v
      - name: Produce deterministic original-source missing witness receipt only
        shell: bash
        run: |
          set -euo pipefail
          python -B noveltyeval/f114o_archive_custody_intake.py --out f114o-archive-custody.json
          python - <<'PY'
          import json
          x=json.load(open('f114o-archive-custody.json',encoding='utf-8'))
          assert x['schema']=='forge.optimizer.f114o.original-archive-custody-intake.v1'
          assert x['status']=='SYNTHETIC_ARCHIVE_CUSTODY_MECHANISM_ONLY_ORIGINAL_MISSING'
          s=x['synthetic_receipt']
          assert s['status']=='SYNTHETIC_ARCHIVE_WITNESS_MECHANISM_TESTED'
          assert 0<s['fixture_archive_bytes_checked']<=1048576
          assert s['stream_chunk_cap_bytes']==65536
          assert s['synthetic_claimed_principals_distinct'] is True
          for key in ('genuine_external_source_witness',
                      'publisher_original_archive_authenticated',
                      'original_graph_members_inspected',
                      'original_freebase_graph_admitted'):
            assert s[key] is False,key
          orig=x['original_custody']
          assert orig['status']=='ORIGINAL_FREEBASE_ARCHIVE_EXTERNAL_WITNESS_MISSING'
          assert orig['publisher_git_commit']=='d16aae5149aaa25e43ff2a7bd00a06f280ca19b9'
          assert orig['publisher_readme_git_blob']=='dd4c65cbe5428b2a86afc47ae2309cb11328b31b'
          assert orig['publisher_license_git_blob']=='10fabd90118f7ce38bb2e4753e105e744442a429'
          assert orig['publisher_graph_download_location_documented'] is True
          for key in ('original_archive_actual_bytes_available',
                      'original_archive_sha256_independently_published',
                      'independent_archive_witness_present',
                      'whole_extracted_member_layout_verified',
                      'original_edge_serialization_verified',
                      'original_edge_orientation_verified',
                      'original_freebase_graph_admitted',
                      'original_graph_archive_downloaded'):
            assert orig[key] is False,key
          for key in ('synthetic_original_data_equivalence',
                      'reserved_train_dev_eval_json_read',
                      'original_freebase_archive_read_or_downloaded',
                      'independent_scientific_firstuse',
                      'accepted_science','accepted_ref_mutation',
                      'dream_pareto_promotion','thetaevolve_accepted_training',
                      'science_dispatch'):
            assert x[key] is False,key
          assert orig['original_graph_query_count']==0
          assert x['real_graph_queries']==x['real_qa_answers_compared']==0
          assert x['model_calls']==x['codex_calls']==x['cloudflare_writes']==0
          print('F114O_SYNTHETIC_WITNESS_INTAKE_TESTED_ORIGINAL_UNWITNESSED')
          print('F114O_NO_ARCHIVE_DOWNLOAD_QA_DATA_PROTECTED_OR_SCIENTIFIC_FIRSTUSE')
          PY
          sha256sum f114o-archive-custody.json > f114o-archive-custody.sha256
          sha256sum -c f114o-archive-custody.sha256
      - name: Mandatory exact-head FORGE Go full regression vet build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo 'F114O_ZERO_CKB_CLOUDFLARE_CODEX_OR_PAID_INFERENCE'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-f114o-original-archive-custody-${{ matrix.os }}
          path: |
            f114o-archive-custody.json
            f114o-archive-custody.sha256
          retention-days: 45
          if-no-files-found: error
