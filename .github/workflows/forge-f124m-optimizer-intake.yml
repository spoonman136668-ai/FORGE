name: F124-M authentic Wingless-Yggdrasil optimizer intake
on:
  push:
    branches: [research/f124m-authentic-optimizer-intake-20261017]
    paths:
      - 'reference/research-intake/f124m-authentic-optimizer-freeze.json'
      - 'cmd/forge-f124-optimizer-intake/**'
      - '.github/workflows/forge-f124m-optimizer-intake.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: f124m-authentic-original-train-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cross-platform-native-package-qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Existing optimizer packages and no-science source bridge tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & go test -count=1 ./cmd/forge-f124-optimizer-intake ./evoportfolio ./genenv ./promptlineage ./optimizerstages ./dreamrsi ./thetaadapt
          if ($LASTEXITCODE -ne 0) { throw 'F124M_EXISTING_OPTIMIZER_INTEGRATION_FAILED' }
          & go vet ./cmd/forge-f124-optimizer-intake
          if ($LASTEXITCODE -ne 0) { throw 'F124M_VET_FAILED' }
          Write-Output 'F124M_POLICY_PROMOTION=FALSE'
          Write-Output 'F124M_ORIGINAL_SCIENCE=FALSE'
  actual-f124-development-evidence-intake:
    needs: cross-platform-native-package-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39068757407
          github-token: ${{ github.token }}
          name: f124j-resource-controls-and-protected-source-preflight
          path: original-f124j
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39066410440
          github-token: ${{ github.token }}
          name: f124i-immutable-train-causal-resource-audit
          path: original-f124i
      - name: Connect native portfolio-Pareto and proposal generators to authentic TRAIN evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'f124m-authentic-dual-lane-optimizer-advisory.json'
          $args=@('--root','.','--f124j-report','original-f124j/f124j-public-controls-and-confirm-preflight.json',
                  '--f124i-report','original-f124i/f124i-causal-strata-resource-evidence.json',
                  '--output',$out)
          & go run ./cmd/forge-f124-optimizer-intake @args
          if ($LASTEXITCODE -ne 0) { throw 'F124M_AUTHENTIC_ORIGINAL_TRAIN_QUARANTINED' }
          $r=Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($r.schema -cne 'forge.research.f124m.authentic-training-optimizer-advisory.v1' -or
              $r.frozen_spec_git_blob -cne 'e1e878a26fefb86278f62c98f3aef2959a646520' -or
              $r.f124j_report_sha256 -cne 'd2e3a3bb89065e5dbb084ff0eb0601bcdef63e44774f330e5135e0728e9a2eda' -or
              $r.f124i_report_sha256 -cne 'c97f51a04769caeadeee03889daf056cad38be826d18aada453a07371e71fb1e' -or
              $r.evidence_kind -cne 'AUTHENTIC_ORIGINAL_TRAIN_ONLY_NOT_PROSPECTIVE' -or
              $r.lanes.Count -ne 2 -or
              $r.scientific_first_use -or $r.protected_inputs -ne 0 -or
              $r.scientific_acceptances -ne 0 -or $r.new_scientific_originals -ne 0 -or
              $r.optimizer_promotions -ne 0 -or $r.accepted_ref_mutations -ne 0 -or
              $r.external_policy_witness_qualified -or $r.api_or_codex_model_calls -ne 0) {
            throw 'F124M_FALSE_SCIENTIFIC_OPTIMIZER_AUTHORITY'
          }
          foreach ($lane in $r.lanes) {
            if ($lane.lane -cnotin @('Wingless','Yggdrasil') -or
                -not $lane.learned_B_negative_vs_baseline -or
                $lane.fixed_14of16_train_paired -le $lane.f124h_B_train_paired -or
                $lane.fixed_16of16_train_paired -ne 48 -or
                $lane.evoportfolio_source_advisory.archive.Count -ne 5 -or
                $lane.shinka_pareto_historical_advisory.archive.Count -ne 5 -or
                $lane.genenv_untested_advisory.candidates.Count -ne 2 -or
                $lane.promptbreeder_untested_advisory.candidates.Count -ne 2 -or
                $lane.genenv_untested_advisory.negative_count -ne 2 -or
                $lane.evoportfolio_source_advisory.scientific_accepted -or
                $lane.shinka_pareto_historical_advisory.scientific_accepted -or
                $lane.genenv_untested_advisory.scientific_accepted -or
                $lane.promptbreeder_untested_advisory.scientific_accepted -or
                $lane.new_executable_candidate_programs -ne 0 -or
                $lane.protected_confirmation_inputs -ne 0 -or
                $lane.dream_rsi_policy_selection -cne 'DREAM_RSI_AND_PARETO_PROSPECTIVE_SELECTION_BLOCKED' -or
                $lane.theta_training -cne 'BLOCKED_NO_INDEPENDENTLY_ACCEPTED_NEW_RESULTS') {
              throw 'F124M_ACTUAL_DUAL_LANE_OPTIMIZER_CONTRACT_VIOLATION'
            }
            Write-Output "F124M_CONNECTED=$($lane.lane):learned=$($lane.f124h_B_train_paired)/48 strong_fixed=$($lane.fixed_14of16_train_paired)/48 archive=$($lane.evoportfolio_source_advisory.archive.Count) genenv=$($lane.genenv_untested_advisory.candidates.Count) prompts=$($lane.promptbreeder_untested_advisory.candidates.Count)"
          }
          $digest=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'f124m-authentic-dual-lane-optimizer-advisory.sha256'),
             "$digest  f124m-authentic-dual-lane-optimizer-advisory.json"+[Environment]::NewLine,
             [System.Text.UTF8Encoding]::new($false))
          Write-Output "F124M_SOURCE_BOUND_REPORT_SHA256=$digest"
          Write-Output 'F124M_PROTECTED_CONFIRM_UNTOUCHED=true'
      - uses: actions/upload-artifact@v4
        with:
          name: f124m-source-qualified-dual-lane-optimizer-advisory
          path: |
            ${{ runner.temp }}/f124m-authentic-dual-lane-optimizer-advisory.json
            ${{ runner.temp }}/f124m-authentic-dual-lane-optimizer-advisory.sha256
          retention-days: 90
          if-no-files-found: error
  one-full-regression:
    needs: actual-f124-development-evidence-intake
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Final full exact-head Go regression, race, vet and build
        shell: bash
        run: |
          set -euo pipefail
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
          echo "F124M_EXACT_HEAD=$GITHUB_SHA"
          echo 'F124M_NO_PROTECTED_SCIENCE=true'
