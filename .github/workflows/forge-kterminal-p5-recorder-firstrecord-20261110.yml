name: K Terminal P5 after-ack lifecycle and local WS custody
on:
  push:
    branches: [qualification/kterminal-p5-recorder-firstrecord-20261110]
    paths: [.github/workflows/forge-kterminal-p5-recorder-firstrecord-20261110.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kterminal-pr88-full-window-ae11818c
  cancel-in-progress: false
jobs:
  owner-local-paper-qualification:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 20
    env:
      KTERM_SHA: 5f56896a1aeefdf5e412d47210026dd6d882229f
      KTERM_BASE: bcebdc1a7a0487f9d6061a8e643c76069335d896
      KTERM_RECORDER_BLOB: afbef54ac539df0e7dc001c1c44a0edd2dea0a25
      KTERM_TEST_BLOB: d7ce3ba615a98f83c1a0f3c1a1308603835487ca
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Admit previously approved Windows owner and disarmed environment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-recorder-firstrecord-20261110' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows') { throw 'KTERM_P5_OWNER_IDENTITY_REFUSED' }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET',
              'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')) {
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_P5_OWNER_BROKER_ENV_REFUSED'}
          }
          if(@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_P5_EXISTING_APP_PRESERVED_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_P5_WORKSPACE_NOT_FRESH'}
          [void][IO.Directory]::CreateDirectory($root)
          Write-Host 'KTERM_P5_OWNER_ISOLATED_DISARMED=PASS;NO_BROKER_WRITES=TRUE'
      - name: Stage pinned private K Terminal candidate and compare only two recorder files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          [void][IO.Directory]::CreateDirectory($stage)
          & git -C $stage init -q *> (Join-Path $root 'private-git-init.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_GIT_INIT_FAILED'}
          $source='https://github.com/Kboomllc/K-Terminal.git'
          & git -C $stage fetch -q --no-tags --depth=9 $source $env:KTERM_SHA *> (Join-Path $root 'private-git-fetch.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_PRIVATE_SOURCE_UNAVAILABLE'}
          & git -C $stage checkout -q --detach $env:KTERM_SHA *> (Join-Path $root 'private-git-checkout.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_CHECKOUT_FAILED'}
          $sha=(& git -C $stage rev-parse HEAD | Out-String).Trim()
          $tree=(& git -C $stage rev-parse 'HEAD^{tree}' | Out-String).Trim()
          $parent=(& git -C $stage rev-parse 'HEAD~8' | Out-String).Trim()
          $rec=(& git -C $stage rev-parse 'HEAD:verification/KTerminal-Live-Session-Recorder-v1.2.ps1' | Out-String).Trim()
          $test=(& git -C $stage rev-parse 'HEAD:verification/test-kterminal-recorder-v1.2.ps1' | Out-String).Trim()
          if($sha -cne $env:KTERM_SHA -or $parent -cne $env:KTERM_BASE -or
             $rec -cne $env:KTERM_RECORDER_BLOB -or $test -cne $env:KTERM_TEST_BLOB -or
             $tree -cnotmatch '^[0-9a-f]{40}$' -or
             @(& git -C $stage status --porcelain).Count -ne 0){throw 'KTERM_P5_SOURCE_CUSTODY_REFUSED'}
          $changed=@(& git -C $stage diff --name-only HEAD~8 HEAD)
          $expected=@('verification/KTerminal-Live-Session-Recorder-v1.2.ps1','verification/test-kterminal-recorder-v1.2.ps1')
          if($changed.Count -ne 2 -or @($changed | Where-Object {$_ -cnotin $expected}).Count -ne 0){
            throw 'KTERM_P5_TWO_FILE_SCOPE_DRIFT'
          }
          foreach($private in @('.env','config.json','data')){
            if(Test-Path -LiteralPath (Join-Path $stage $private)){throw 'KTERM_P5_PRIVATE_STATE_REFUSED'}
          }
          Write-Host ('KTERM_P5_EXACT_SOURCE=PASS;SHA='+$sha+';TREE='+$tree+';TWO_FILE_SCOPE=PASS')
      - name: Pinned Windows Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Profile original response-to-retry lifecycle with mandatory evidence and confirmed reducer lag
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((go version) -notmatch 'go1\.26\.5 windows/amd64'){throw 'KTERM_AFTER_POST_GO_VERSION_DRIFT'}
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'source'
          $private=Join-Path $root 'post-ack-lifecycle.json'
          $log=Join-Path $root 'private-post-ack-lifecycle.log'
          $env:K_TERMINAL_STAGE3_BUY_LIFECYCLE_OUTPUT=$private
          $env:K_TERMINAL_STAGE3_BUY_LIFECYCLE_LABEL='PR94-post-ack-brokerfree-v1'
          $env:K_TERMINAL_STAGE3_BUY_LIFECYCLE_SAMPLES='2'
          $env:K_TERMINAL_STAGE3_CANCELED_BUY_BOOK_REUSE='1'
          $env:K_TERMINAL_HOTFIX_NETWORK_PROFILE='fast-offline'
          $env:K_TERMINAL_P5_LATENCY='0'
          $env:K_TERMINAL_NATIVE_TIMING='0'
          $env:K_TERMINAL_GITHUB_TOKEN=''
          $env:HTTP_PROXY='http://127.0.0.1:9'
          $env:HTTPS_PROXY='http://127.0.0.1:9'
          $env:ALL_PROXY='http://127.0.0.1:9'
          $env:NO_PROXY=''
          $clock=[Diagnostics.Stopwatch]::StartNew()
          Push-Location $src
          try {
            & go test -run '^TestStage3NativeBuyLifecycleReadinessProfile$' -count=1 -timeout 10m ./pkg *> $log
            $exit=$LASTEXITCODE
          } finally {Pop-Location}
          $clock.Stop()
          if($exit -ne 0 -or -not [IO.File]::Exists($private)){
            Write-Host ('KTERM_AFTER_POST_LIFECYCLE=FAIL;PRIVATE_LOG_SHA256='+
              (Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant())
            throw 'KTERM_AFTER_POST_SOURCE_TEST_FAILED'
          }
          $p=[IO.File]::ReadAllText($private) | ConvertFrom-Json
          if($p.build_label -cne 'PR94-post-ack-brokerfree-v1' -or
             $p.injected_network_profile.name -cne 'fast-offline' -or
             $p.expected_canceled_buy_decision_book_reuse -ne $true -or
             @($p.individual_events).Count -ne 16){
            throw 'KTERM_AFTER_POST_PROFILE_SCOPE_INCOMPLETE'
          }
          function Stats([double[]]$values){
            $v=@($values | Sort-Object)
            if($v.Count -ne 4){throw 'KTERM_AFTER_POST_EXPECTED_FOUR_VALUES_PER_WORKLOAD'}
            foreach($x in $v){
              if([double]::IsNaN($x) -or [double]::IsInfinity($x) -or $x -lt 0 -or $x -gt 60000){
                throw 'KTERM_AFTER_POST_INVALID_ELAPSED'
              }
            }
            return [pscustomobject]@{P50=[Math]::Round(($v[1]+$v[2])/2,3);
              Max=[Math]::Round($v[3],3)}
          }
          $items=@($p.individual_events)
          $workloads=@('definite-maker-rejection','definite-rejection-confirmed-fill-lag',
            'confirmed-cancel-settled','confirmed-cancel-reducer-lag')
          foreach($product in @('BTC-USDC','XRP-USDC')){
            foreach($workload in $workloads){
              $sample=@($items|Where-Object {$_.product_id -ceq $product -and $_.workload -ceq $workload})
              if($sample.Count -ne 2){throw 'KTERM_AFTER_POST_MISSING_EXACT_PRODUCT_WORKLOAD'}
              foreach($r in $sample){
                if([int]$r.simulated_order_posts -ne 2 -or @($r.mandatory_evidence).Count -lt 2 -or
                   $r.original_received_at -eq '' -or
                   [double]$r.full_retry_inclusive_transport_ready_ms -lt [double]$r.full_first_transport_ready_ms -or
                   [double]$r.actual_lifecycle_return_ms -lt [double]$r.initial_execute_return_ms){
                  throw 'KTERM_AFTER_POST_REQUIRED_GUARD_OR_EXACT_POSTS_FAILED'
                }
              }
            }
          }
          foreach($workload in $workloads){
            $samples=@($items|Where-Object {$_.workload -ceq $workload})
            $first=Stats ([double[]]@($samples|ForEach-Object {[double]$_.received_to_first_transport_ready_ms}))
            $last=Stats ([double[]]@($samples|ForEach-Object {[double]$_.received_to_last_transport_ready_ms}))
            $return=Stats ([double[]]@($samples|ForEach-Object {[double]$_.actual_lifecycle_return_ms}))
            $obs=Stats ([double[]]@($samples|ForEach-Object {[double]$_.fixture_observation_including_publisher_join_wall_ms}))
            Write-Host ('KTERM_AFTER_POST_COHORT=PASS;WORKLOAD='+$workload+
              ';N=4;SOURCE_TO_FIRST_READY_P50_MS='+$first.P50+';MAX_MS='+$first.Max+
              ';SOURCE_TO_LAST_READY_P50_MS='+$last.P50+';MAX_MS='+$last.Max+
              ';ACTUAL_LIFECYCLE_P50_MS='+$return.P50+';MAX_MS='+$return.Max+
              ';FIXTURE_OBSERVATION_P50_MS='+$obs.P50+';MAX_MS='+$obs.Max)
          }
          Write-Host ('KTERM_AFTER_POST_LIFECYCLE=PASS;COHORTS=8;EVENTS=16;SYNTHETIC_MAKER_POSTS=32;LIVE_POSTS=0'+
            ';REJECTION_RETRY_RETAINED=TRUE;CONFIRMED_CANCELLATION_GUARDS=TRUE;DURABLE_REQUEST_AND_RESERVATION=PASS'+
            ';PROFILE_WALL_MS='+$clock.ElapsedMilliseconds+';REAL_DISPLAY_LATENCY=UNVERIFIED')
      - name: Verify actual original user WS loopback, committed fill and exact cold process custody
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'source'
          $private=Join-Path $root 'post-ack-ws-profile.json'
          $g19=Join-Path $root 'post-ack-original-owner.json'
          $g20b=Join-Path $root 'post-ack-loopback-user-ws.json'
          $log=Join-Path $root 'private-post-ack-ws.log'
          $env:K_TERMINAL_STAGE3_JOURNAL_PROFILE_OUTPUT=$private
          $env:K_TERMINAL_STAGE3_JOURNAL_PROFILE_LABEL='PR94-G20B-transport-to-actual-accounting'
          $env:K_TERMINAL_STAGE3_REQUIRE_JOURNAL_DIAGNOSTICS='1'
          $env:KTERMINAL_G19_EVIDENCE=$g19
          $env:KTERMINAL_G20B_WEBSOCKET_EVIDENCE=$g20b
          $env:KTERMINAL_G18_SAME_OWNER_EVIDENCE=''
          $env:KTERMINAL_SOURCE_SHA=$env:KTERM_SHA
          $env:K_TERMINAL_HOTFIX_NETWORK_PROFILE='fast-offline'
          $env:K_TERMINAL_STAGE3_BUY_LIFECYCLE_OUTPUT=''
          $env:HTTP_PROXY='http://127.0.0.1:9'
          $env:HTTPS_PROXY='http://127.0.0.1:9'
          $env:ALL_PROXY='http://127.0.0.1:9'
          $env:NO_PROXY=''
          $clock=[Diagnostics.Stopwatch]::StartNew()
          Push-Location $src
          try {
            & go test -run '^TestStage3NativeJournalCompleteReadinessProfile$' -count=1 -timeout 10m ./pkg *> $log
            $exit=$LASTEXITCODE
          } finally {Pop-Location}
          $clock.Stop()
          if($exit -ne 0 -or -not [IO.File]::Exists($private) -or
             -not [IO.File]::Exists($g19) -or -not [IO.File]::Exists($g20b)){
            Write-Host ('KTERM_AFTER_POST_WS=FAIL;PRIVATE_LOG_SHA256='+
              (Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant())
            throw 'KTERM_AFTER_POST_WS_OR_OWNER_CHAIN_FAILED'
          }
          $a=[IO.File]::ReadAllText($private)|ConvertFrom-Json
          $b=[IO.File]::ReadAllText($g20b)|ConvertFrom-Json
          $c=[IO.File]::ReadAllText($g19)|ConvertFrom-Json
          if($a.build_label -cne 'PR94-G20B-transport-to-actual-accounting' -or
             @($a.individual_events).Count -ne 24 -or
             $b.schema -cne 'kterminal.ice.g20b-offline-user-frame.v1' -or
             $b.source_sha -cne $env:KTERM_SHA -or
             $b.positive_user_frames_delivered -ne 2 -or
             $b.original_ws_read_connection -ne $true -or
             $b.original_ws_handle_user_events -ne $true -or
             $b.actual_loopback_ws_transport -ne $true -or
             $b.original_accounting_owner_retained -ne $true -or
             $b.operator_callbacks -ne 1 -or
             $b.operator_filled_lines -ne 1 -or
             $b.operator_tracked_lines -ne 1 -or
             $b.duplicate_fill_revision -ne $b.confirmed_fill_revision -or
             $b.confirmed_fill_revision -le $b.initial_revision -or
             $b.heartbeat_sequence_without_false_gap -ne $true -or
             $b.websocket_user_health_observed -ne $true -or
             $b.forced_independent_process_restart -ne $true -or
             $b.cold_process_revision -ne 0 -or
             $b.durable_economics_conserved -ne $true -or
             $b.real_coinbase_wss_connected -ne $false -or
             $b.authenticated_user_subscription -ne $false -or
             $b.real_broker_orders_sent -ne 0 -or
             $b.installed_user_data_touched -ne $false -or
             $c.schema -cne 'kterminal.ice.g19-production-event-boundary.v1' -or
             $c.source_sha -cne $env:KTERM_SHA -or
             $c.original_owner_retained -ne $true -or
             $c.child_fresh_process_recovered -ne $true){
            throw 'KTERM_AFTER_POST_WS_OR_COLD_PROOF_INVALID'
          }
          Write-Host ('KTERM_AFTER_POST_WS=PASS;SOURCE_SHA='+$env:KTERM_SHA+
            ';JOURNAL_EVENTS=24;LOOPBACK_WS_FRAMES=2;ORIGINAL_ACCOUNTING_OWNER=TRUE'+
            ';ACCOUNTING_COMMIT_BEFORE_SUBSCRIBER=PASS;DUPLICATE_NO_REVISION=PASS'+
            ';OPERATOR_FILLED=1;OPERATOR_TRACKED=1;HEARTBEAT_SEQUENCE=PASS'+
            ';FORCED_INDEPENDENT_COLD_RECOVERY=PASS;BROKER_POSTS=0;REAL_COINBASE_WSS=FALSE'+
            ';PROFILE_WALL_MS='+$clock.ElapsedMilliseconds+';WPF_VISIBLE_ACK=UNVERIFIED')
      - name: Remove private source and local test fixtures
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:RUNNER_TEMP
          $root=Join-Path $base ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root) {
            $path=[IO.Path]::GetFullPath($root)
            $scope=[IO.Path]::GetFullPath($base).TrimEnd('\')+'\'
            if(-not $path.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -or
               [IO.Path]::GetFileName($path) -cne ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)){
              throw 'KTERM_P5_PRIVATE_CLEANUP_REFUSED'
            }
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_P5_PRIVATE_CLEANUP=PASS;PUBLIC_PRIVATE_FILES=0;LIVE_ORDERS=0'
