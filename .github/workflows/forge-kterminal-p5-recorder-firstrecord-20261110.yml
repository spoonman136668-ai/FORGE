name: K Terminal P5 paired broker ACK delay sensitivity
on:
  push:
    branches: [qualification/kterminal-p5-recorder-firstrecord-20261110]
    paths: [.github/workflows/forge-kterminal-p5-recorder-firstrecord-20261110.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kterminal-pr88-full-window-ae11818c
  cancel-in-progress: false
jobs:
  owner-local-paper-qualification:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 20
    env:
      KTERM_SHA: 5f56896a1aeefdf5e412d47210026dd6d882229f
      KTERM_BASE: bcebdc1a7a0487f9d6061a8e643c76069335d896
      KTERM_RECORDER_BLOB: afbef54ac539df0e7dc001c1c44a0edd2dea0a25
      KTERM_TEST_BLOB: d7ce3ba615a98f83c1a0f3c1a1308603835487ca
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Admit previously approved Windows owner and disarmed environment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-recorder-firstrecord-20261110' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows') { throw 'KTERM_P5_OWNER_IDENTITY_REFUSED' }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET',
              'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')) {
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_P5_OWNER_BROKER_ENV_REFUSED'}
          }
          if(@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_P5_EXISTING_APP_PRESERVED_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_P5_WORKSPACE_NOT_FRESH'}
          [void][IO.Directory]::CreateDirectory($root)
          Write-Host 'KTERM_P5_OWNER_ISOLATED_DISARMED=PASS;NO_BROKER_WRITES=TRUE'
      - name: Stage pinned private K Terminal candidate and compare only two recorder files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          [void][IO.Directory]::CreateDirectory($stage)
          & git -C $stage init -q *> (Join-Path $root 'private-git-init.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_GIT_INIT_FAILED'}
          $source='https://github.com/Kboomllc/K-Terminal.git'
          & git -C $stage fetch -q --no-tags --depth=9 $source $env:KTERM_SHA *> (Join-Path $root 'private-git-fetch.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_PRIVATE_SOURCE_UNAVAILABLE'}
          & git -C $stage checkout -q --detach $env:KTERM_SHA *> (Join-Path $root 'private-git-checkout.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_CHECKOUT_FAILED'}
          $sha=(& git -C $stage rev-parse HEAD | Out-String).Trim()
          $tree=(& git -C $stage rev-parse 'HEAD^{tree}' | Out-String).Trim()
          $parent=(& git -C $stage rev-parse 'HEAD~8' | Out-String).Trim()
          $rec=(& git -C $stage rev-parse 'HEAD:verification/KTerminal-Live-Session-Recorder-v1.2.ps1' | Out-String).Trim()
          $test=(& git -C $stage rev-parse 'HEAD:verification/test-kterminal-recorder-v1.2.ps1' | Out-String).Trim()
          if($sha -cne $env:KTERM_SHA -or $parent -cne $env:KTERM_BASE -or
             $rec -cne $env:KTERM_RECORDER_BLOB -or $test -cne $env:KTERM_TEST_BLOB -or
             $tree -cnotmatch '^[0-9a-f]{40}$' -or
             @(& git -C $stage status --porcelain).Count -ne 0){throw 'KTERM_P5_SOURCE_CUSTODY_REFUSED'}
          $changed=@(& git -C $stage diff --name-only HEAD~8 HEAD)
          $expected=@('verification/KTerminal-Live-Session-Recorder-v1.2.ps1','verification/test-kterminal-recorder-v1.2.ps1')
          if($changed.Count -ne 2 -or @($changed | Where-Object {$_ -cnotin $expected}).Count -ne 0){
            throw 'KTERM_P5_TWO_FILE_SCOPE_DRIFT'
          }
          foreach($private in @('.env','config.json','data')){
            if(Test-Path -LiteralPath (Join-Path $stage $private)){throw 'KTERM_P5_PRIVATE_STATE_REFUSED'}
          }
          Write-Host ('KTERM_P5_EXACT_SOURCE=PASS;SHA='+$sha+';TREE='+$tree+';TWO_FILE_SCOPE=PASS')
      - name: Pinned Windows Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Run paired exact-source isolated broker network-ACK latency sensitivity tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((go version) -notmatch 'go1\.26\.5 windows/amd64'){throw 'KTERM_ACK_GO_TOOLCHAIN_MISMATCH'}
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'source'
          $env:K_TERMINAL_EXECUTION_MODE='PAPER'
          $env:K_TERMINAL_STAGE3_BUY_FIRST_DEFERRED_SAMPLES='3'
          $env:K_TERMINAL_P5_LATENCY='0'
          $env:K_TERMINAL_NATIVE_TIMING='0'
          $env:K_TERMINAL_GITHUB_TOKEN=''
          $env:HTTP_PROXY='http://127.0.0.1:9'
          $env:HTTPS_PROXY='http://127.0.0.1:9'
          $env:ALL_PROXY='http://127.0.0.1:9'
          $env:NO_PROXY=''
          # Existing source-owned fixture directly intercepts every
          # book/clock/order HTTP request and refuses unknown destinations.
          # Only timing controls vary; no real order or external broker.
          $cohorts=@(
            [pscustomobject]@{Name='fast-offline';Book=2;Clock=1;Post=5},
            [pscustomobject]@{Name='specified-network';Book=180;Clock=120;Post=2000}
          )
          $results=@{}
          foreach($arm in $cohorts){
            $env:K_TERMINAL_HOTFIX_NETWORK_PROFILE=$arm.Name
            $env:K_TERMINAL_HOTFIX_BOOK_MS=[string]$arm.Book
            $env:K_TERMINAL_HOTFIX_CLOCK_MS=[string]$arm.Clock
            $env:K_TERMINAL_HOTFIX_POST_MS=[string]$arm.Post
            $env:K_TERMINAL_HOTFIX_BALANCE_MS='1'
            $env:K_TERMINAL_STAGE3_BUY_FIRST_DEFERRED_LABEL=('PR94-paired-ack-'+$arm.Name)
            $output=Join-Path $root ('private-ack-'+$arm.Name+'.json')
            $log=Join-Path $root ('private-ack-'+$arm.Name+'.log')
            if(Test-Path -LiteralPath $output){throw 'KTERM_ACK_NOT_FRESH'}
            $env:K_TERMINAL_STAGE3_BUY_FIRST_DEFERRED_OUTPUT=$output
            $clock=[Diagnostics.Stopwatch]::StartNew()
            Push-Location $src
            try {
              & go test -run '^TestStage3BuyFirstDeferredCompleteReadinessWorkload$' -count=1 -timeout 10m ./pkg *> $log
              $code=$LASTEXITCODE
            } finally {Pop-Location}
            $clock.Stop()
            if($code -ne 0 -or -not [IO.File]::Exists($output)){
              Write-Host ('KTERM_ACK_'+$arm.Name+'=FAIL;PRIVATE_LOG_SHA256='+
                (Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant())
              throw 'KTERM_ACK_SOURCE_FIXTURE_FAILED'
            }
            $p=[IO.File]::ReadAllText($output)|ConvertFrom-Json
            if($p.build_label -cne $env:K_TERMINAL_STAGE3_BUY_FIRST_DEFERRED_LABEL -or
               $p.injected_network_profile.name -cne $arm.Name -or
               [int]$p.injected_network_profile.book_per_http_request_ms -ne $arm.Book -or
               [int]$p.injected_network_profile.clock_per_http_request_ms -ne $arm.Clock -or
               [int]$p.injected_network_profile.post_response_headers_ms -ne $arm.Post -or
               @($p.results).Count -ne 4) {throw 'KTERM_ACK_PROFILE_CONTRACT_DRIFT'}
            $data=@{}
            foreach($product in @('BTC-USDC','XRP-USDC')){
              foreach($workload in @('first-eligible','confirmed-accounting-deferred')){
                $matches=@($p.results|Where-Object {$_.product -ceq $product -and $_.workload -ceq $workload})
                if($matches.Count -ne 1){throw 'KTERM_ACK_MISSING_PRODUCT_WORKLOAD'}
                $g=$matches[0]
                if(@($g.individual_events).Count -ne 3){throw 'KTERM_ACK_INCOMPLETE_COHORT'}
                $ready=@();$response=@();$return=@();$transport=@()
                foreach($event in $g.individual_events){
                  if([int]$event.mock_order_posts -ne 1 -or
                     [int]$event.book_requests -ne 1 -or
                     [int]$event.clock_requests -ne 1 -or
                     $event.in_process_reload_and_receipt_no_replay_passed -ne $true -or
                     [double]$event.mandatory_evidence_bytes -le 0){
                    throw 'KTERM_ACK_MAKER_ONE_POST_AND_DURABILITY_GUARDS_FAILED'
                  }
                  $a=[double]$event.full_first_transport_ready_ms
                  $b=[double]$event.post_response_headers_ms
                  $c=[double]$event.execute_entry_to_return_ms
                  $d=[double]$event.received_to_actual_mock_transport_ms
                  foreach($value in @($a,$b,$c,$d)){
                    if([double]::IsNaN($value) -or [double]::IsInfinity($value) -or $value -lt 0 -or $value -gt 30000){
                      throw 'KTERM_ACK_INVALID_TIMING_RECEIPT'
                    }
                  }
                  if($d -lt $a -or $c -lt $b){throw 'KTERM_ACK_CLOCK_OR_SPAN_ORDER_INVERSION'}
                  $ready+= $a;$response+= $b;$return+= $c;$transport+= $d
                }
                $metric=[pscustomobject]@{
                  Ready=($ready|Measure-Object -Average).Average
                  Response=($response|Measure-Object -Average).Average
                  Return=($return|Measure-Object -Average).Average
                  Transport=($transport|Measure-Object -Average).Average
                }
                $key=$product+'/'+$workload
                $data[$key]=$metric
                Write-Host ('KTERM_ACK_ARM=PASS;PROFILE='+$arm.Name+
                  ';PRODUCT='+$product+';WORKLOAD='+$workload+';N=3'+
                  ';SOURCE_TO_TRANSPORT_MEAN_MS='+[Math]::Round($metric.Transport,2)+
                  ';FIRST_READY_MEAN_MS='+[Math]::Round($metric.Ready,2)+
                  ';MOCK_RESPONSE_HEADER_MEAN_MS='+[Math]::Round($metric.Response,2)+
                  ';EXECUTE_RETURN_MEAN_MS='+[Math]::Round($metric.Return,2)+
                  ';MOCK_POSTS=3;REAL_POSTS=0;REPLAY_POSTS=0')
              }
            }
            $results[$arm.Name]=$data
            Write-Host ('KTERM_ACK_COHORT=PASS;PROFILE='+$arm.Name+
              ';EVENTS=12;ORIGINAL_TEST=PASS;WALL_MS='+$clock.ElapsedMilliseconds+
              ';SOURCE='+$env:KTERM_SHA+';BROKER_IO=NONE')
          }
          foreach($key in $results['fast-offline'].Keys){
            $fast=$results['fast-offline'][$key]
            $slow=$results['specified-network'][$key]
            $diff=$slow.Response-$fast.Response
            if($diff -lt 1500 -or $diff -gt 5000){
              throw 'KTERM_ACK_INJECTED_RESPONSE_NOT_OBSERVED'
            }
            if($slow.Return -le $fast.Return + 1500){
              throw 'KTERM_ACK_RESPONSE_DELAY_NOT_IN_END_TO_END_RETURN'
            }
            Write-Host ('KTERM_ACK_DELTA=PASS;CASE='+$key+
              ';RESPONSE_DELTA_MEAN_MS='+[Math]::Round($diff,2)+
              ';RETURN_DELTA_MEAN_MS='+[Math]::Round($slow.Return-$fast.Return,2)+
              ';READY_DELTA_MEAN_MS='+[Math]::Round($slow.Ready-$fast.Ready,2))
          }
          Write-Host 'KTERM_ACK_SENSITIVITY=PASS;ARMS=2;SAMPLES=24;ALL_MAKER_ONLY=TRUE;DURABLE_REPLAY_NO_REPOST=PASS;REAL_ORDERS=0;LIVE_CAUSAL_LATENCY=UNVERIFIED'
      - name: Remove private source and local test fixtures
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:RUNNER_TEMP
          $root=Join-Path $base ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root) {
            $path=[IO.Path]::GetFullPath($root)
            $scope=[IO.Path]::GetFullPath($base).TrimEnd('\')+'\'
            if(-not $path.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -or
               [IO.Path]::GetFileName($path) -cne ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)){
              throw 'KTERM_P5_PRIVATE_CLEANUP_REFUSED'
            }
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_P5_PRIVATE_CLEANUP=PASS;PUBLIC_PRIVATE_FILES=0;LIVE_ORDERS=0'
