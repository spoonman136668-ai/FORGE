            $version=[string](Get-Item -LiteralPath $chromeExe).VersionInfo.FileVersion
            $chromeHash=(Get-FileHash -LiteralPath $chromeExe -Algorithm SHA256).Hash.ToLowerInvariant()
            if($signature.Status -ne 'NotSigned' -or
