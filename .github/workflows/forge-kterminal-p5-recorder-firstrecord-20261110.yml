name: K Terminal P5 source-locked prepared UI PAPER package
on:
  push:
    branches: [qualification/kterminal-p5-recorder-firstrecord-20261110]
    paths: [.github/workflows/forge-kterminal-p5-recorder-firstrecord-20261110.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kterminal-pr88-full-window-ae11818c
  cancel-in-progress: false
jobs:
  owner-local-paper-qualification:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 20
    env:
      KTERM_SHA: 5f56896a1aeefdf5e412d47210026dd6d882229f
      KTERM_BASE: bcebdc1a7a0487f9d6061a8e643c76069335d896
      KTERM_RECORDER_BLOB: afbef54ac539df0e7dc001c1c44a0edd2dea0a25
      KTERM_TEST_BLOB: d7ce3ba615a98f83c1a0f3c1a1308603835487ca
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Admit previously approved Windows owner and disarmed environment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-recorder-firstrecord-20261110' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows') { throw 'KTERM_P5_OWNER_IDENTITY_REFUSED' }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET',
              'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')) {
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_P5_OWNER_BROKER_ENV_REFUSED'}
          }
          if(@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_P5_EXISTING_APP_PRESERVED_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_P5_WORKSPACE_NOT_FRESH'}
          [void][IO.Directory]::CreateDirectory($root)
          Write-Host 'KTERM_P5_OWNER_ISOLATED_DISARMED=PASS;NO_BROKER_WRITES=TRUE'
      - name: Stage pinned private K Terminal candidate and compare only two recorder files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          [void][IO.Directory]::CreateDirectory($stage)
          & git -C $stage init -q *> (Join-Path $root 'private-git-init.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_GIT_INIT_FAILED'}
          $source='https://github.com/Kboomllc/K-Terminal.git'
          & git -C $stage fetch -q --no-tags --depth=9 $source $env:KTERM_SHA *> (Join-Path $root 'private-git-fetch.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_PRIVATE_SOURCE_UNAVAILABLE'}
          & git -C $stage checkout -q --detach $env:KTERM_SHA *> (Join-Path $root 'private-git-checkout.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_CHECKOUT_FAILED'}
          $sha=(& git -C $stage rev-parse HEAD | Out-String).Trim()
          $tree=(& git -C $stage rev-parse 'HEAD^{tree}' | Out-String).Trim()
          $parent=(& git -C $stage rev-parse 'HEAD~8' | Out-String).Trim()
          $rec=(& git -C $stage rev-parse 'HEAD:verification/KTerminal-Live-Session-Recorder-v1.2.ps1' | Out-String).Trim()
          $test=(& git -C $stage rev-parse 'HEAD:verification/test-kterminal-recorder-v1.2.ps1' | Out-String).Trim()
          if($sha -cne $env:KTERM_SHA -or $parent -cne $env:KTERM_BASE -or
             $rec -cne $env:KTERM_RECORDER_BLOB -or $test -cne $env:KTERM_TEST_BLOB -or
             $tree -cnotmatch '^[0-9a-f]{40}$' -or
             @(& git -C $stage status --porcelain).Count -ne 0){throw 'KTERM_P5_SOURCE_CUSTODY_REFUSED'}
          $changed=@(& git -C $stage diff --name-only HEAD~8 HEAD)
          $expected=@('verification/KTerminal-Live-Session-Recorder-v1.2.ps1','verification/test-kterminal-recorder-v1.2.ps1')
          if($changed.Count -ne 2 -or @($changed | Where-Object {$_ -cnotin $expected}).Count -ne 0){
            throw 'KTERM_P5_TWO_FILE_SCOPE_DRIFT'
          }
          foreach($private in @('.env','config.json','data')){
            if(Test-Path -LiteralPath (Join-Path $stage $private)){throw 'KTERM_P5_PRIVATE_STATE_REFUSED'}
          }
          Write-Host ('KTERM_P5_EXACT_SOURCE=PASS;SHA='+$sha+';TREE='+$tree+';TWO_FILE_SCOPE=PASS')
      - name: Pinned Windows Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Download only the previously qualified immutable private PAPER artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13846458790
          run-id: 43003258044
          repository: spoonman136668-ai/FORGE
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/kterm-p5-firstfile-${{ github.run_id }}/artifact
      - name: Verify frozen ZIP then compile and source-verify original WPF UI assembly
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'source'
          $zip=Join-Path $root 'artifact\K-Terminal-PAPER-ACCEPTANCE-5f56896a\K-Terminal-PAPER-ACCEPTANCE-5f56896a.zip'
          if(-not [IO.File]::Exists($zip)){throw 'KTERM_UI_QUALIFIED_BASE_ZIP_MISSING'}
          $baseHash=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($baseHash -cne 'ad21bc5b3016b025a26675573bc654126b7d78f609ee37784f74e475a52cf5bc'){
            throw 'KTERM_UI_QUALIFIED_BASE_ZIP_SHA_DRIFT'
          }
          $archive=[IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $members=@($archive.Entries | Where-Object {$_.Name})
            if($members.Count -ne 70){throw 'KTERM_UI_BASE_ZIP_ENTRY_COUNT_DRIFT'}
            $seen=@{}
            foreach($member in $members){
              $name=$member.FullName
              if($seen.ContainsKey($name) -or
                 $name -match '(^/|^\.\.|/\.\./|:|\\)' -or
                 $name -match '(?i)(^|/)(\.env|config\.json|data|credentials|pending-program-update\.json|\.git|\.build)(/|$)' -or
                 $member.Length -gt 150MB){throw 'KTERM_UI_BASE_ZIP_ENTRY_REFUSED'}
              $seen[$name]=$true
            }
            $mentry=$archive.GetEntry('ACCEPTANCE-MANIFEST.json')
            if($null -eq $mentry){throw 'KTERM_UI_BASE_MANIFEST_MISSING'}
            $reader=New-Object IO.StreamReader($mentry.Open())
            try{$m=$reader.ReadToEnd() | ConvertFrom-Json}finally{$reader.Dispose()}
            if($m.schema -cne 'kterminal.paper.staging.v1' -or
               $m.source_sha -cne $env:KTERM_SHA -or
               $m.source_tree -cne '8996ef668f167215edcbfd306ac819e53b3b4b86' -or
               $m.live_deployment_qualified -ne $false -or @($m.files).Count -ne 69){
              throw 'KTERM_UI_BASE_SOURCE_MANIFEST_REFUSED'
            }
            foreach($row in $m.files){
              $entry=$archive.GetEntry([string]$row.path)
              if($null -eq $entry -or $entry.Length -ne [long]$row.bytes){throw 'KTERM_UI_BASE_ENTRY_SIZE_DRIFT'}
              $stream=$entry.Open()
              try {
                $hasher=[Security.Cryptography.SHA256]::Create()
                try{$sha=([BitConverter]::ToString($hasher.ComputeHash($stream))).Replace('-','').ToLowerInvariant()}
                finally{$hasher.Dispose()}
              }finally{$stream.Dispose()}
              if($sha -cne [string]$row.sha256){throw 'KTERM_UI_BASE_CONTENT_HASH_DRIFT'}
            }
          }finally{$archive.Dispose()}
          $package=Join-Path $root 'ui-prepared-package'
          if(Test-Path -LiteralPath $package){throw 'KTERM_UI_PACKAGE_ROOT_NOT_FRESH'}
          [IO.Compression.ZipFile]::ExtractToDirectory($zip,$package)
          if(Test-Path -LiteralPath (Join-Path $package 'KTerminal.UI.dll')){
            throw 'KTERM_UI_OLD_PACKAGE_ALREADY_HAS_DLL'
          }
          Write-Host ('KTERM_UI_BASE_ZIP=PASS;SOURCE='+$env:KTERM_SHA+';FILES=70;OLD_RELEASE_UI_DLL=ABSENT')
          $uiLog=Join-Path $root 'private-ui-compiler.log'
          $clock=[Diagnostics.Stopwatch]::StartNew()
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -STA -File (Join-Path $src 'verification\build-ui-runtime.ps1') -Root $src *> $uiLog
          $code=$LASTEXITCODE
          $clock.Stop()
          if($code -ne 0){
            Write-Host ('KTERM_UI_ORIGINAL_BUILDER=FAIL;LOG_SHA256='+(Get-FileHash -LiteralPath $uiLog -Algorithm SHA256).Hash.ToLowerInvariant()+';PRIVATE_LOG=TRUE')
            throw 'KTERM_UI_SOURCE_COMPILATION_FAILED'
          }
          $dll=Join-Path $src 'KTerminal.UI.dll'
          $uiManifestPath=Join-Path $src 'ui-runtime-manifest.json'
          if(-not [IO.File]::Exists($dll)){throw 'KTERM_UI_COMPILED_DLL_MISSING'}
          $manifest=[IO.File]::ReadAllText($uiManifestPath)|ConvertFrom-Json
          $dllhash=(Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($manifest.schema_version -ne 1 -or $manifest.assembly -cne 'KTerminal.UI.dll' -or
             $manifest.sha256 -cne $dllhash -or @($manifest.sources).Count -ne 13 -or
             (Get-Item -LiteralPath $dll).Length -lt 4096){throw 'KTERM_UI_SOURCE_MANIFEST_INVALID'}
          foreach($row in $manifest.sources){
            $name=[string]$row.path
            if([IO.Path]::GetFileName($name) -cne $name -or $name -match '[:/\\]'){
              throw 'KTERM_UI_SOURCE_MANIFEST_UNSAFE_PATH'
            }
            $sourceFile=Join-Path $src $name
            $packagedSource=Join-Path $package $name
            if(-not [IO.File]::Exists($sourceFile) -or -not [IO.File]::Exists($packagedSource)){
              throw 'KTERM_UI_SOURCE_OR_PACKAGE_FILE_MISSING'
            }
            $sourcehash=(Get-FileHash -LiteralPath $sourceFile -Algorithm SHA256).Hash.ToLowerInvariant()
            $packagehash=(Get-FileHash -LiteralPath $packagedSource -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sourcehash -cne [string]$row.sha256 -or $packagehash -cne $sourcehash){
              throw 'KTERM_UI_COMPILED_INPUT_SOURCE_DRIFT'
            }
          }
          Copy-Item -LiteralPath $dll -Destination (Join-Path $package 'KTerminal.UI.dll') -ErrorAction Stop
          Copy-Item -LiteralPath $uiManifestPath -Destination (Join-Path $package 'ui-runtime-manifest.json') -Force -ErrorAction Stop
          # Probe the original, manifest-enforcing UI loader with PS5.1 STA.
          # Reflection only: no window, no app launch, no input or network.
          $probe=Join-Path $root 'private-ui-reflection-probe.ps1'
          $probeSource=@'
          param([Parameter(Mandatory=$true)][string]$Root)
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'UI_REFLECTION_NOT_WINDOWS_POWERSHELL_51'}
          . (Join-Path $Root 'ui-runtime-loader.ps1')
          Import-KTerminalUIRuntime
          foreach($typeName in @('KTerminal.Appearance.Palette','KTerminal.Diagnostics.DashboardLog',
              'KTerminal.Charting.CandlestickChart','KTerminal.Launch.SessionHost')) {
            if(-not($typeName -as [type])){throw 'UI_REFLECTION_REQUIRED_TYPE_ABSENT'}
          }
          $assembly=[KTerminal.Appearance.Palette].Assembly
          if([IO.Path]::GetFileName($assembly.Location) -cne 'KTerminal.UI.dll' -or
             -not [IO.Path]::GetFullPath($assembly.Location).StartsWith(
               [IO.Path]::GetFullPath($Root).TrimEnd('\')+'\',
               [StringComparison]::OrdinalIgnoreCase)){
            throw 'UI_REFLECTION_UNEXPECTED_ASSEMBLY_PATH'
          }
          Write-Output 'KTERM_UI_COMPILED_REFLECTION=PASS;NO_WINDOW=TRUE'
          '@
          [IO.File]::WriteAllText($probe,$probeSource,[Text.UTF8Encoding]::new($false))
          $probeLog=Join-Path $root 'private-ui-reflection.log'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -STA -File $probe -Root $package *> $probeLog
          if($LASTEXITCODE -ne 0 -or -not [IO.File]::ReadAllText($probeLog).Contains('KTERM_UI_COMPILED_REFLECTION=PASS')){
            Write-Host ('KTERM_UI_REFLECTION=FAIL;LOG_SHA256='+(Get-FileHash -LiteralPath $probeLog -Algorithm SHA256).Hash.ToLowerInvariant()+';PRIVATE_LOG=TRUE')
            throw 'KTERM_UI_RELEASE_DLL_LOADER_FAILED'
          }
          $parseCount=0
          foreach($script in @(Get-ChildItem -LiteralPath $package -File -Filter '*.ps1')){
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($script.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -ne 0){throw 'KTERM_UI_PACKAGED_PS51_SYNTAX_ERROR'}
            $parseCount++
          }
          if($parseCount -lt 25){throw 'KTERM_UI_PACKAGED_PS51_SCRIPT_SCOPE_INCOMPLETE'}
          $interactive=[Environment]::UserInteractive
          $session=(Get-Process -Id $PID).SessionId
          Write-Host ('KTERM_UI_ORIGINAL_BUILDER=PASS;MS='+$clock.ElapsedMilliseconds+
            ';UI_DLL_SHA256='+$dllhash+';SOURCE_INPUTS=13;REFLECTION=PASS;PS51_PARSED='+$parseCount+
            ';OWNER_SESSION_ID='+$session+';USER_INTERACTIVE='+$interactive+';WINDOWS_OPENED=0')
      - name: Create amended 71-member ZIP with compiled UI and verify every hash
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $package=Join-Path $root 'ui-prepared-package'
          if(-not [IO.File]::Exists((Join-Path $package 'KTerminal.UI.dll'))){throw 'KTERM_UI_REPACK_MISSING_ASSEMBLY'}
          $files=@(Get-ChildItem -LiteralPath $package -Recurse -File | Where-Object {
            $_.Name -cne 'ACCEPTANCE-MANIFEST.json'
          } | Sort-Object FullName)
          if($files.Count -ne 70){throw 'KTERM_UI_REPACK_MEMBER_COUNT_DRIFT'}
          $m=[ordered]@{schema='kterminal.paper.ui-prepared.v1';source_sha=$env:KTERM_SHA;
            source_tree='8996ef668f167215edcbfd306ac819e53b3b4b86';
            base_zip_sha256='ad21bc5b3016b025a26675573bc654126b7d78f609ee37784f74e475a52cf5bc';
            prior_full_windows_regression=42941369948;prior_paper_engine_acceptance=43005709048;
            ui_assembly_compiled_by='verification/build-ui-runtime.ps1';
            no_config_or_private_state=$true;not_live_deployable=$true;files=@()}
          foreach($f in $files){
            $rel=$f.FullName.Substring($package.Length+1).Replace('\','/')
            if($rel -match '(?i)(^|/)(\.env|config\.json|data|credentials|pending-program-update\.json|\.git|\.build)(/|$)' -or
               $rel -match '(^/|^\.\.|/\.\./|:)' -or $f.Length -gt 150MB){throw 'KTERM_UI_REPACK_UNSAFE_MEMBER'}
            $m.files += [ordered]@{path=$rel;bytes=[long]$f.Length;
              sha256=(Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          $manifestPath=Join-Path $package 'ACCEPTANCE-MANIFEST.json'
          [IO.File]::WriteAllText($manifestPath,($m|ConvertTo-Json -Depth 7),[Text.UTF8Encoding]::new($false))
          $zip=Join-Path $root 'K-Terminal-PAPER-UI-PREPARED-5f56896a.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($package,$zip,[IO.Compression.CompressionLevel]::Optimal,$false)
          $reader=[IO.Compression.ZipFile]::OpenRead($zip)
          try{
            $entries=@($reader.Entries|Where-Object {$_.Name})
            if($entries.Count -ne 71){throw 'KTERM_UI_REPACK_ZIP_COUNT_INVALID'}
            $seen=@{}
            foreach($e in $entries){
              if($seen.ContainsKey($e.FullName) -or
                 $e.FullName -match '(?i)(^|/)(\.env|config\.json|data|credentials|pending-program-update\.json|\.git|\.build)(/|$)' -or
                 $e.FullName -match '(^/|^\.\.|/\.\./|:)'){throw 'KTERM_UI_REPACK_ZIP_UNSAFE_PATH'}
              $seen[$e.FullName]=$true
            }
            foreach($item in $m.files){
              $entry=$reader.GetEntry($item.path)
              if($null -eq $entry -or $entry.Length -ne $item.bytes){throw 'KTERM_UI_REPACK_ARCHIVE_LENGTH_DRIFT'}
              $stream=$entry.Open()
              try{
                $hasher=[Security.Cryptography.SHA256]::Create()
                try{$hash=([BitConverter]::ToString($hasher.ComputeHash($stream))).Replace('-','').ToLowerInvariant()}
                finally{$hasher.Dispose()}
              }finally{$stream.Dispose()}
              if($hash -cne [string]$item.sha256){throw 'KTERM_UI_REPACK_CONTENT_HASH_DRIFT'}
            }
          }finally{$reader.Dispose()}
          if((Get-Item -LiteralPath $zip).Length -gt 100MB){throw 'KTERM_UI_REPACK_ZIP_TOO_LARGE'}
          Write-Host ('KTERM_UI_PREPARED_ZIP=PASS;MEMBERS=71;ZIP_SHA256='+
            (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()+
            ';SOURCE_SHA='+$env:KTERM_SHA+';NO_PRIVATE_CONFIG=TRUE;NO_RUNTIME_INSTALL=TRUE;LIVE_ORDERS=0;INTERACTIVE_GUI=UNVERIFIED')
      - name: Upload only the separately named source-qualified UI-prepared PAPER archive
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: K-Terminal-PAPER-UI-PREPARED-5f56896a
          path: ${{ runner.temp }}/kterm-p5-firstfile-${{ github.run_id }}/K-Terminal-PAPER-UI-PREPARED-5f56896a.zip
          retention-days: 14
          if-no-files-found: error
      - name: Remove private source and local test fixtures
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:RUNNER_TEMP
          $root=Join-Path $base ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root) {
            $path=[IO.Path]::GetFullPath($root)
            $scope=[IO.Path]::GetFullPath($base).TrimEnd('\')+'\'
            if(-not $path.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -or
               [IO.Path]::GetFileName($path) -cne ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)){
              throw 'KTERM_P5_PRIVATE_CLEANUP_REFUSED'
            }
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_P5_PRIVATE_CLEANUP=PASS;PUBLIC_PRIVATE_FILES=0;LIVE_ORDERS=0'
