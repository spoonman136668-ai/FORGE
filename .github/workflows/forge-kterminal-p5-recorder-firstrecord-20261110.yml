name: K Terminal P5 seven-second accounting wait visibility proof
on:
  push:
    branches: [qualification/kterminal-p5-recorder-firstrecord-20261110]
    paths: [.github/workflows/forge-kterminal-p5-recorder-firstrecord-20261110.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kterminal-pr88-full-window-ae11818c
  cancel-in-progress: false
jobs:
  owner-local-paper-qualification:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 20
    env:
      KTERM_SHA: 5f56896a1aeefdf5e412d47210026dd6d882229f
      KTERM_BASE: bcebdc1a7a0487f9d6061a8e643c76069335d896
      KTERM_RECORDER_BLOB: afbef54ac539df0e7dc001c1c44a0edd2dea0a25
      KTERM_TEST_BLOB: d7ce3ba615a98f83c1a0f3c1a1308603835487ca
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Admit previously approved Windows owner and disarmed environment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-recorder-firstrecord-20261110' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows') { throw 'KTERM_P5_OWNER_IDENTITY_REFUSED' }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET',
              'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')) {
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_P5_OWNER_BROKER_ENV_REFUSED'}
          }
          if(@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_P5_EXISTING_APP_PRESERVED_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_P5_WORKSPACE_NOT_FRESH'}
          [void][IO.Directory]::CreateDirectory($root)
          Write-Host 'KTERM_P5_OWNER_ISOLATED_DISARMED=PASS;NO_BROKER_WRITES=TRUE'
      - name: Stage pinned private K Terminal candidate and compare only two recorder files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          [void][IO.Directory]::CreateDirectory($stage)
          & git -C $stage init -q *> (Join-Path $root 'private-git-init.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_GIT_INIT_FAILED'}
          $source='https://github.com/Kboomllc/K-Terminal.git'
          & git -C $stage fetch -q --no-tags --depth=9 $source $env:KTERM_SHA *> (Join-Path $root 'private-git-fetch.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_PRIVATE_SOURCE_UNAVAILABLE'}
          & git -C $stage checkout -q --detach $env:KTERM_SHA *> (Join-Path $root 'private-git-checkout.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_CHECKOUT_FAILED'}
          $sha=(& git -C $stage rev-parse HEAD | Out-String).Trim()
          $tree=(& git -C $stage rev-parse 'HEAD^{tree}' | Out-String).Trim()
          $parent=(& git -C $stage rev-parse 'HEAD~8' | Out-String).Trim()
          $rec=(& git -C $stage rev-parse 'HEAD:verification/KTerminal-Live-Session-Recorder-v1.2.ps1' | Out-String).Trim()
          $test=(& git -C $stage rev-parse 'HEAD:verification/test-kterminal-recorder-v1.2.ps1' | Out-String).Trim()
          if($sha -cne $env:KTERM_SHA -or $parent -cne $env:KTERM_BASE -or
             $rec -cne $env:KTERM_RECORDER_BLOB -or $test -cne $env:KTERM_TEST_BLOB -or
             $tree -cnotmatch '^[0-9a-f]{40}$' -or
             @(& git -C $stage status --porcelain).Count -ne 0){throw 'KTERM_P5_SOURCE_CUSTODY_REFUSED'}
          $changed=@(& git -C $stage diff --name-only HEAD~8 HEAD)
          $expected=@('verification/KTerminal-Live-Session-Recorder-v1.2.ps1','verification/test-kterminal-recorder-v1.2.ps1')
          if($changed.Count -ne 2 -or @($changed | Where-Object {$_ -cnotin $expected}).Count -ne 0){
            throw 'KTERM_P5_TWO_FILE_SCOPE_DRIFT'
          }
          foreach($private in @('.env','config.json','data')){
            if(Test-Path -LiteralPath (Join-Path $stage $private)){throw 'KTERM_P5_PRIVATE_STATE_REFUSED'}
          }
          Write-Host ('KTERM_P5_EXACT_SOURCE=PASS;SHA='+$sha+';TREE='+$tree+';TWO_FILE_SCOPE=PASS')
      - name: Pinned Windows Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify original seven-second accounting wait is measurable and P5 safe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((go version) -notmatch 'go1\.26\.5 windows/amd64'){throw 'KTERM_P5_WAIT_GO_VERSION_DRIFT'}
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'source'
          $file=Join-Path $src 'pkg\kterm_p5_wait_private_temp_test.go'
          if(Test-Path -LiteralPath $file){throw 'KTERM_P5_WAIT_TEST_EXISTS'}
          $test=@'
          package pkg
          
          import (
              "bytes"
              "encoding/json"
              "fmt"
              "os"
              "strconv"
              "testing"
              "time"
          )
          
          // TEMPORARY OWNER CHECKOUT ONLY, not a production source modification.
          // Exercises the original confirmed-BUY-settlement wait and projects its
          // original timing spans through the existing privacy-safe P5 allowlist.
          func TestKTermTemporaryP5SevenSecondAccountingVisibility(t *testing.T) {
              t.Setenv("K_TERMINAL_P5_LATENCY", "1")
              h,n,cache := nativeConfirmedAccountingDeferFixture(t)
              original := n.Signal
              posts:=0
              accountingDeferManager(t,h,n,cache,&posts)
              n.timing = &nativeConstructionTiming{}
              var evidence []NativeOrderEvidence
              n.Record = func(e NativeOrderEvidence) error {
                  evidence=append(evidence,e)
                  return nil
              }
              begun:=time.Now()
              p5:=newP5LatencyObserver("native_order",begun)
              if p5==nil { t.Fatal("opt-in P5 observer not available") }
              p5.mark("journal_admission")
              done:=make(chan struct{})
              defer close(done)
              go func() {
                  ticker:=time.NewTicker(100*time.Millisecond)
                  defer ticker.Stop()
                  for {
                      select {
                      case <-done: return
                      case <-ticker.C:
                          cache.mu.Lock()
                          cache.value.AccountAt=time.Now().UTC()
                          if time.Since(begun)>=7*time.Second {
                              cache.value.AvailableBase=strconv.FormatFloat(h.syntheticTP.position.Snapshot().Quantity,'f',8,64)
                          }
                          cache.mu.Unlock()
                      }
                  }
              }()
              receiptDir:=t.TempDir()
              result,err:=h.ExecuteNativeSignal(n,receiptDir)
              p5.mark("native_execute_return")
              p5.observeNativeTiming(n.timing)
              p5.mark("post_execute_evidence")
              record:=p5.safeRecord(err==nil)
              elapsed:=time.Since(begun)
              if err!=nil || result==nil || posts!=1 || n.Requests!=1 ||
                 elapsed<7*time.Second || elapsed>=nativeConfirmedAccountingDeferWindow {
                  t.Fatalf("original seven-second fixture safety failed: requests=%d posts=%d elapsed=%s err=%v",n.Requests,posts,elapsed,err)
              }
              if len(evidence)!=2 || evidence[0].State!="REQUEST_READY" || evidence[1].State!="RESULT" ||
                 evidence[0].EventID!=original.EventID || evidence[1].EventID!=original.EventID {
                  t.Fatal("exact original evidence source/identity was not preserved")
              }
              restarted:=&NativeConstruction{Signal:original}
              replay,replayErr:=h.ExecuteNativeSignal(restarted,receiptDir)
              dup,ok:=replay.(map[string]any)
              if replayErr!=nil || !ok || dup["status"]!="DUPLICATE_NO_REPLAY" || posts!=1 || restarted.Requests!=0 {
                  t.Fatalf("deferred accepted order could be replayed: err=%v posts=%d",replayErr,posts)
              }
              wait,waitExists:=record.StagesMS["order_accounting_wait"]
              ready,readyExists:=record.StagesMS["order_first_transport_ready"]
              response,responseExists:=record.StagesMS["order_post_to_response_headers"]
              if !waitExists || !readyExists || !responseExists ||
                 wait<6800 || wait>=10000 || ready<6800 ||
                 response>1000 || record.TotalMS<7000 || record.TotalMS>=10000 {
                  t.Fatalf("P5 did not separate real source wait from mocked response: wait=%d ready=%d response=%d total=%d",wait,ready,response,record.TotalMS)
              }
              if record.Operation!="native_order" || record.Schema!=1 || len(record.Trace)!=16 || !record.Success {
                  t.Fatal("P5 envelope/source/opt-in unexpectedly changed")
              }
              safe,marshalErr:=json.Marshal(record)
              if marshalErr!=nil { t.Fatal(marshalErr) }
              for _,s:=range []string{original.EventID,original.DefinitionID,original.ProductID,
                  "event_id","client_order_id","account_id","coinbase_request","error",
                  "request_sha256","timing_span","native_started_at"} {
                  if s!="" && bytes.Contains(safe,[]byte(s)) {
                      t.Fatalf("privacy barrier failed: forbidden data type %q",s)
                  }
              }
              var fields map[string]json.RawMessage
              if err:=json.Unmarshal(safe,&fields);err!=nil{t.Fatal(err)}
              if len(fields)<6 || len(fields)>7 {t.Fatalf("P5 field envelope changed: keys=%d",len(fields))}
              for name:=range fields {
                  switch name {
                  case "schema","operation","random_trace","total_ms","success","stages_ms","record_count_buckets":
                  default: t.Fatalf("unexpected private P5 key: %s",name)
                  }
              }
              for stage:=range record.StagesMS {
                  if !p5SafeStages[stage] {t.Fatalf("unapproved timing key was exposed")}
              }
              out:=struct{
                  Schema string `json:"schema"`
                  SourceSHA string `json:"source_sha"`
                  WaitMS int64 `json:"accounting_wait_ms"`
                  ReadyMS int64 `json:"first_transport_ready_ms"`
                  ResponseMS int64 `json:"mock_order_response_ms"`
                  TotalMS int64 `json:"total_ms"`
                  InitialPosts int `json:"mock_posts"`
                  ReplayPosts int `json:"replay_posts"`
                  PrivateIdentityExcluded bool `json:"privacy_pass"`
              }{"kterm.synthetic-p5-native-wait.v1","5f56896a1aeefdf5e412d47210026dd6d882229f",wait,ready,response,record.TotalMS,posts,posts-1,true}
              encoded,e:=json.Marshal(out)
              if e!=nil{t.Fatal(e)}
              name:=os.Getenv("KTERM_P5_WAIT_PRIVATE_REPORT")
              if name=="" { t.Fatal("no private report destination") }
              if e=os.WriteFile(name,encoded,0600);e!=nil{t.Fatal(e)}
              fmt.Println("KTERM_P5_WAIT_TEMP_TEST=PASS")
          }
          '@
          [IO.File]::WriteAllText($file,$test,[Text.UTF8Encoding]::new($false))
          $status=@(& git -C $src status --porcelain)
          if($status.Count -ne 1 -or [string]$status[0] -notmatch '^\?\? pkg/kterm_p5_wait_private_temp_test\.go$'){throw 'KTERM_P5_WAIT_WORKTREE_DRIFT'}
          $env:KTERM_P5_WAIT_PRIVATE_REPORT=Join-Path $root 'private-p5-wait-result.json'
          $env:K_TERMINAL_NATIVE_TIMING='0'
          $env:K_TERMINAL_P5_LATENCY='0'
          $env:K_TERMINAL_GITHUB_TOKEN=''
          $env:HTTP_PROXY='http://127.0.0.1:9'
          $env:HTTPS_PROXY='http://127.0.0.1:9'
          $env:ALL_PROXY='http://127.0.0.1:9'
          $env:NO_PROXY=''
          $log=Join-Path $root 'private-p5-wait-test.log'
          Push-Location $src
          try {
            & go test -run '^TestKTermTemporaryP5SevenSecondAccountingVisibility$' -count=1 -timeout 10m ./pkg *> $log
            $code=$LASTEXITCODE
          } finally {Pop-Location}
          if($code -ne 0 -or -not [IO.File]::Exists($env:KTERM_P5_WAIT_PRIVATE_REPORT)){
            $privateLog=[IO.File]::ReadAllText($log)
            $failType='UNCLASSIFIED'
            if($privateLog.Contains('P5 did not separate real source wait')){$failType='STAGE_VALUES'}
            if($privateLog.Contains('P5 field envelope changed')){$failType='SCHEMA_ENVELOPE'}
            if($privateLog.Contains('original seven-second fixture safety failed')){$failType='ORIGINAL_WAIT_TEST'}
            if($privateLog.Contains('deferred accepted order could be replayed')){$failType='DUPLICATE_CONTROL'}
            if($privateLog.Contains('exact original evidence source')){$failType='EVIDENCE_STATE'}
            if($privateLog.Contains('privacy barrier failed')){$failType='PRIVACY_CONTROL'}
            if($privateLog.Contains('P5 envelope/source/opt-in unexpectedly changed')){$failType='OBSERVER_ENVELOPE'}
            if($privateLog.Contains('undefined:') -or $privateLog.Contains('syntax error')){$failType='GO_BUILD'}
            Write-Host ('KTERM_P5_WAIT_FAILURE_CLASS='+$failType)
            Write-Host ('KTERM_P5_WAIT=FAIL;PRIVATE_LOG_SHA256='+(Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant())
            throw 'KTERM_P5_WAIT_VISIBILITY_TEST_FAILED'
          }
          $r=[IO.File]::ReadAllText($env:KTERM_P5_WAIT_PRIVATE_REPORT)|ConvertFrom-Json
          if($r.schema -cne 'kterm.synthetic-p5-native-wait.v1' -or $r.source_sha -cne $env:KTERM_SHA -or
             $r.accounting_wait_ms -lt 6800 -or $r.accounting_wait_ms -ge 10000 -or
             $r.first_transport_ready_ms -lt 6800 -or $r.mock_order_response_ms -gt 1000 -or
             $r.total_ms -lt 7000 -or $r.total_ms -ge 10000 -or $r.mock_posts -ne 1 -or
             $r.replay_posts -ne 0 -or $r.privacy_pass -ne $true){throw 'KTERM_P5_WAIT_RESULT_CONTRACT_FAILED'}
          Write-Host ('KTERM_P5_WAIT=PASS;SOURCE_SHA='+$r.source_sha+
            ';ACCOUNTING_WAIT_MS='+$r.accounting_wait_ms+';FIRST_TRANSPORT_READY_MS='+$r.first_transport_ready_ms+
            ';MOCK_RESPONSE_MS='+$r.mock_order_response_ms+';FULL_WALL_MS='+$r.total_ms+
            ';ORIGINAL_ACCOUNTING_WAIT=TRUE;P5_SAFE_PRIVACY=PASS;EXACT_ONE_MOCK_POST=TRUE'+
            ';DUPLICATE_POSTS=0;REAL_BROKER_IO=0;SOURCE_TREE_UNCHANGED=TRUE;FIELD_CAUSE=UNVERIFIED')
      - name: Remove private source and local test fixtures
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:RUNNER_TEMP
          $root=Join-Path $base ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root) {
            $path=[IO.Path]::GetFullPath($root)
            $scope=[IO.Path]::GetFullPath($base).TrimEnd('\')+'\'
            if(-not $path.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -or
               [IO.Path]::GetFileName($path) -cne ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)){
              throw 'KTERM_P5_PRIVATE_CLEANUP_REFUSED'
            }
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_P5_PRIVATE_CLEANUP=PASS;PUBLIC_PRIVATE_FILES=0;LIVE_ORDERS=0'
