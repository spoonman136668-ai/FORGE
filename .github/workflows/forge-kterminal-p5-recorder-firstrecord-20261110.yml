name: K Terminal P5 original order timing stage profile
on:
  push:
    branches: [qualification/kterminal-p5-recorder-firstrecord-20261110]
    paths: [.github/workflows/forge-kterminal-p5-recorder-firstrecord-20261110.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kterminal-pr88-full-window-ae11818c
  cancel-in-progress: false
jobs:
  owner-local-paper-qualification:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 20
    env:
      KTERM_SHA: 5f56896a1aeefdf5e412d47210026dd6d882229f
      KTERM_BASE: bcebdc1a7a0487f9d6061a8e643c76069335d896
      KTERM_RECORDER_BLOB: afbef54ac539df0e7dc001c1c44a0edd2dea0a25
      KTERM_TEST_BLOB: d7ce3ba615a98f83c1a0f3c1a1308603835487ca
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Admit previously approved Windows owner and disarmed environment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-recorder-firstrecord-20261110' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows') { throw 'KTERM_P5_OWNER_IDENTITY_REFUSED' }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET',
              'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')) {
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_P5_OWNER_BROKER_ENV_REFUSED'}
          }
          if(@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_P5_EXISTING_APP_PRESERVED_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_P5_WORKSPACE_NOT_FRESH'}
          [void][IO.Directory]::CreateDirectory($root)
          Write-Host 'KTERM_P5_OWNER_ISOLATED_DISARMED=PASS;NO_BROKER_WRITES=TRUE'
      - name: Stage pinned private K Terminal candidate and compare only two recorder files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          [void][IO.Directory]::CreateDirectory($stage)
          & git -C $stage init -q *> (Join-Path $root 'private-git-init.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_GIT_INIT_FAILED'}
          $source='https://github.com/Kboomllc/K-Terminal.git'
          & git -C $stage fetch -q --no-tags --depth=9 $source $env:KTERM_SHA *> (Join-Path $root 'private-git-fetch.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_PRIVATE_SOURCE_UNAVAILABLE'}
          & git -C $stage checkout -q --detach $env:KTERM_SHA *> (Join-Path $root 'private-git-checkout.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_CHECKOUT_FAILED'}
          $sha=(& git -C $stage rev-parse HEAD | Out-String).Trim()
          $tree=(& git -C $stage rev-parse 'HEAD^{tree}' | Out-String).Trim()
          $parent=(& git -C $stage rev-parse 'HEAD~8' | Out-String).Trim()
          $rec=(& git -C $stage rev-parse 'HEAD:verification/KTerminal-Live-Session-Recorder-v1.2.ps1' | Out-String).Trim()
          $test=(& git -C $stage rev-parse 'HEAD:verification/test-kterminal-recorder-v1.2.ps1' | Out-String).Trim()
          if($sha -cne $env:KTERM_SHA -or $parent -cne $env:KTERM_BASE -or
             $rec -cne $env:KTERM_RECORDER_BLOB -or $test -cne $env:KTERM_TEST_BLOB -or
             $tree -cnotmatch '^[0-9a-f]{40}$' -or
             @(& git -C $stage status --porcelain).Count -ne 0){throw 'KTERM_P5_SOURCE_CUSTODY_REFUSED'}
          $changed=@(& git -C $stage diff --name-only HEAD~8 HEAD)
          $expected=@('verification/KTerminal-Live-Session-Recorder-v1.2.ps1','verification/test-kterminal-recorder-v1.2.ps1')
          if($changed.Count -ne 2 -or @($changed | Where-Object {$_ -cnotin $expected}).Count -ne 0){
            throw 'KTERM_P5_TWO_FILE_SCOPE_DRIFT'
          }
          foreach($private in @('.env','config.json','data')){
            if(Test-Path -LiteralPath (Join-Path $stage $private)){throw 'KTERM_P5_PRIVATE_STATE_REFUSED'}
          }
          Write-Host ('KTERM_P5_EXACT_SOURCE=PASS;SHA='+$sha+';TREE='+$tree+';TWO_FILE_SCOPE=PASS')
      - name: Pinned Windows Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Profile exact original 24-event journal-to-order path with no real broker
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((go version) -notmatch 'go1\.26\.5 windows/amd64'){throw 'KTERM_ORDER_GO_TOOLCHAIN_DRIFT'}
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'source'
          $private=Join-Path $root 'private-order-profile.json'
          $log=Join-Path $root 'private-order-profile-build-test.log'
          if(Test-Path -LiteralPath $private){throw 'KTERM_ORDER_PROFILE_OUTPUT_NOT_FRESH'}
          $env:K_TERMINAL_STAGE3_JOURNAL_PROFILE_OUTPUT=$private
          $env:K_TERMINAL_STAGE3_JOURNAL_PROFILE_LABEL='current-pr94-local-order-profile'
          $env:K_TERMINAL_STAGE3_REQUIRE_JOURNAL_DIAGNOSTICS='1'
          $env:K_TERMINAL_HOTFIX_NETWORK_PROFILE='fast-offline'
          $env:K_TERMINAL_P5_LATENCY='0'
          $env:K_TERMINAL_NATIVE_TIMING='0'
          $env:K_TERMINAL_GITHUB_TOKEN=''
          $env:KTERMINAL_G19_EVIDENCE=''
          $env:KTERMINAL_G20B_WEBSOCKET_EVIDENCE=''
          $env:KTERMINAL_G18_SAME_OWNER_EVIDENCE=''
          # Any accidental external HTTP call must fail. The source-authored
          # test intercepts all book, clock and POST transport in memory.
          $env:HTTP_PROXY='http://127.0.0.1:9'
          $env:HTTPS_PROXY='http://127.0.0.1:9'
          $env:ALL_PROXY='http://127.0.0.1:9'
          $env:NO_PROXY=''
          $clock=[Diagnostics.Stopwatch]::StartNew()
          Push-Location $src
          try{
            & go test -run '^TestStage3NativeJournalCompleteReadinessProfile$' -count=1 -timeout 12m ./pkg *> $log
            $exit=$LASTEXITCODE
          } finally {Pop-Location}
          $clock.Stop()
          if($exit -ne 0 -or -not [IO.File]::Exists($private)){
            Write-Host ('KTERM_ORDER_PROFILE=FAIL;RAW_PRIVATE_LOG_SHA256='+
              (Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant())
            throw 'KTERM_ORDER_EXACT_SOURCE_PROFILE_FAILED'
          }
          $p=[IO.File]::ReadAllText($private)|ConvertFrom-Json
          if([string]$p.build_label -cne 'current-pr94-local-order-profile' -or
             @($p.individual_events).Count -ne 24 -or
             [string]$p.injected_network_profile.name -cne 'fast-offline' -or
             [int]$p.injected_network_profile.book_per_http_request_ms -ne 2 -or
             [int]$p.injected_network_profile.clock_per_http_request_ms -ne 1 -or
             [int]$p.injected_network_profile.post_response_headers_ms -ne 5){
            throw 'KTERM_ORDER_PROFILE_SOURCE_OR_COHORT_INVALID'
          }
          function Summary([double[]]$Values){
            $ordered=@($Values | Sort-Object)
            if($ordered.Count -ne 12){throw 'KTERM_ORDER_EXPECTED_TWELVE_SAMPLES'}
            foreach($v in $ordered){if([double]::IsNaN($v) -or [double]::IsInfinity($v) -or $v -lt 0 -or $v -gt 600000){throw 'KTERM_ORDER_INVALID_TIMING'}}
            $median=($ordered[5]+$ordered[6])/2
            $p95=$ordered[[int][Math]::Ceiling(0.95*$ordered.Count)-1]
            return [pscustomobject]@{P50=[Math]::Round($median,3);P95=[Math]::Round($p95,3);Max=[Math]::Round($ordered[-1],3)}
          }
          $all=@($p.individual_events)
          foreach($record in $all){
            if($record.state -cne 'RESULT' -or
               [int]$record.intercepted_post_count -ne 1 -or
               [int]$record.durable_reservation_count -ne 1 -or
               @($record.transport_ready).Count -ne 1 -or
               @($record.attempt_outcomes).Count -ne 1 -or
               $record.attempt_outcomes[0].transport_entered -ne $true -or
               $record.attempt_outcomes[0].submission_outcome_unknown -ne $false -or
               [string]::IsNullOrWhiteSpace([string]$record.accepted_order_id) -or
               [string]::IsNullOrWhiteSpace([string]$record.accepted_client_id) -or
               $null -eq $record.transport_ready[0].received_to_transport_ready_ms -or
               $null -eq $record.transport_ready[0].journal_entry_to_transport_ready_ms){
              throw 'KTERM_ORDER_ONE_POST_OR_REPLAY_CONTRACT_FAILED'
            }
            $received=[double]$record.transport_ready[0].received_to_transport_ready_ms
            $ready=[double]$record.transport_ready[0].full_transport_ready_ms
            $journal=[double]$record.transport_ready[0].journal_entry_to_transport_ready_ms
            if($received -lt $ready -or $journal -lt $ready){throw 'KTERM_ORDER_PHASE_CLOCK_INVERSION'}
          }
          foreach($product in @('BTC-USDC','XRP-USDC')){
            $cohort=@($all | Where-Object {$_.product_id -ceq $product})
            if($cohort.Count -ne 12){throw 'KTERM_ORDER_MISSING_PRODUCT_COHORT'}
            $received=Summary ([double[]]@($cohort | ForEach-Object {[double]$_.transport_ready[0].received_to_transport_ready_ms}))
            $journal=Summary ([double[]]@($cohort | ForEach-Object {[double]$_.transport_ready[0].journal_entry_to_transport_ready_ms}))
            $execute=Summary ([double[]]@($cohort | ForEach-Object {[double]$_.execution_wall_ms}))
            Write-Host ('KTERM_ORDER_SYNTHETIC=PASS;PRODUCT='+$product+
              ';N=12;SOURCE_TO_FIRST_TRANSPORT_P50_MS='+$received.P50+
              ';P95_MS='+$received.P95+';MAX_MS='+$received.Max+
              ';JOURNAL_TO_TRANSPORT_P50_MS='+$journal.P50+
              ';P95_MS='+$journal.P95+';MAX_MS='+$journal.Max+
              ';EXECUTE_WALL_P50_MS='+$execute.P50+
              ';P95_MS='+$execute.P95+';MAX_MS='+$execute.Max+
              ';SYNTHETIC_POSTS=12;LIVE_POSTS=0')
          }
          Write-Host ('KTERM_ORDER_PROFILE=PASS;SOURCE_SHA='+$env:KTERM_SHA+
            ';EVENTS=24;ACTUAL_BROKER_REQUESTS=0;ONE_MOCK_POST_PER_EVENT=TRUE'+
            ';DURABLE_RESERVATION_RELOAD=PASS;JOURNAL_FRESHNESS_GUARDS=RETAINED'+
            ';TOTAL_PROFILE_MS='+$clock.ElapsedMilliseconds+';FIELD_LATENCY=UNVERIFIED')
      - name: Remove private source and local test fixtures
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:RUNNER_TEMP
          $root=Join-Path $base ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root) {
            $path=[IO.Path]::GetFullPath($root)
            $scope=[IO.Path]::GetFullPath($base).TrimEnd('\')+'\'
            if(-not $path.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -or
               [IO.Path]::GetFileName($path) -cne ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)){
              throw 'KTERM_P5_PRIVATE_CLEANUP_REFUSED'
            }
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_P5_PRIVATE_CLEANUP=PASS;PUBLIC_PRIVATE_FILES=0;LIVE_ORDERS=0'
