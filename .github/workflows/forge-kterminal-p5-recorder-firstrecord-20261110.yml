            $g24Evidence=Join-Path $root 'browser-g24-private'
            Invoke-Private 'G24_REAL_CHROME' $py @('tools/graphify/g24_browser_acceptance.py',
              '--atlas',(Join-Path $atlas 'KTERMINAL_SYMBOLS.html'),
              '--source-sha',$env:KTERM_SHA,'--evidence',$g24Evidence)
            $g24=Get-Content -LiteralPath (Join-Path $g24Evidence 'g24-receipt.json') -Raw | ConvertFrom-Json
            if($g24.source_sha -cne $env:KTERM_SHA -or $g24.data_scope -cne 'real-source' -or
              $g24.chrome_real_browser -ne $true -or $g24.offline_context -ne $true -or
              $g24.external_requests -ne 0 -or $g24.browser_page_errors -ne 0 -or
              $g24.trading_runtime_executed -ne $false -or
              $g24.desktop_application_release_qualified -ne $false){
              throw 'KTERM_G24_BROWSER_RECEIPT_BOUNDARY_REFUSED'
            }
            $g35Evidence=Join-Path $root 'browser-g35-private'
            Invoke-Private 'G35_REAL_CHROME' $py @('tools/graphify/g35_browser_check.py',
              '--atlas',(Join-Path $atlas 'KTERMINAL_SYMBOLS.html'),
              '--sha',$env:KTERM_SHA,'--evidence',$g35Evidence)
            $g35=Get-Content -LiteralPath (Join-Path $g35Evidence 'G35_BROWSER_RECEIPT.json') -Raw | ConvertFrom-Json
            if($g35.source_sha -cne $env:KTERM_SHA -or $g35.external_requests -ne 0 -or
              $g35.page_errors -ne 0 -or $g35.trading_execution -ne $false -or
              $g35.desktop_release_qualified -ne $false -or
              $g35.g40_real_source_lines_verified -ne $true -or
              $g35.g42_complete_unresolved_browser_inventory -ne $g35.g40_unresolved_site_count -or
              $g35.g42_complete_unresolved_browser_inventory -le 75 -or
              $g35.g42_no_invented_links -ne $true -or
              $g35.g46_exact_file_drilldown_verified -ne $true -or
              $g35.g47_exact_incoming_source_declaration_verified -ne $true -or
              $g35.g49_exact_incoming_caller_file_traversal_verified -ne $true -or
              $g35.g51_exact_compiler_declaration_return -ne $true -or
              $g35.g53_no_unknown_target_promotion -ne $true -or
              $g35.g55_pinned_source_confidence_preserved -ne $true){
              throw 'KTERM_G35_BROWSER_RECEIPT_BOUNDARY_REFUSED'
            }
            Write-Host ('KTERM_BROWSER_REAL_SOURCE=PASS;SHA='+$env:KTERM_SHA+
              ';CHROME_VERSION='+$chromeVersion+';G24=PASS;G35=PASS'+
              ';G40_G42_SITES='+$g35.g40_unresolved_site_count+
              ';OFFLINE=TRUE;EXTERNAL_REQUESTS=0;BROKER_CALLS=0;INSTALL=FALSE'+
              ';DESKTOP_RUNTIME_ACCEPTANCE=NOT_RUN;RAW_SCREENSHOTS_PRIVATE=TRUE')
            $changed=(& git -C $stage diff --name-only HEAD -- | Out-String).Trim()
            if($changed){throw 'KTERM_ATLAS_TRACKED_SOURCE_MODIFIED'}
            Write-Host ('KTERM_ATLAS_STATIC_MATRIX=PASS;SHA='+$env:KTERM_SHA+
              ';SOURCE_LINKED_SYMBOLS='+$sym.summary.source_linked_symbols+
              ';CROSS_FILE_EDGES='+$sym.summary.cross_file_edges+
              ';G35_QUALIFIED_G31='+$overlay.summary.qualified_g31+
              ';G44_RESOLVED='+$w.verified_resolved+';G44_UNRESOLVED='+$w.verified_unresolved+
              ';AI_API_CALLS=0;BROKER_CALLS=0;NO_RUNTIME=TRUE;CHROME_BROWSER=NOT_RUN')
          } finally { Pop-Location }
      - name: Erase original private Graphify source and generated evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-graphify-static-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){
            $path=[IO.Path]::GetFullPath($root)
            $scope=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')+'\'
            if(-not $path.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -or
               [IO.Path]::GetFileName($path) -cne ('kterm-graphify-static-'+$env:GITHUB_RUN_ID)){
              throw 'KTERM_GRAPHIFY_PRIVATE_CLEANUP_REFUSED'
            }
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_GRAPHIFY_STATIC_CLEANUP=PASS;PUBLIC_PRIVATE_ARTIFACTS=0;LIVE_ORDERS=0'

  owner-chrome-digest:
    name: K Terminal official Chrome for Testing pinned digest-only preflight
    # Completed in 43186501037; exact ZIP/EXE pinned for browser acceptance; skip duplicate.
    if: ${{ false }}
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Read original owner identity and hash Google's pinned browser archive without execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-recorder-firstrecord-20261110' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:RUNNER_OS -cne 'Windows' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted'){throw 'KTERM_CFT_DIGEST_OWNER_REFUSED'}
          $root=Join-Path $env:RUNNER_TEMP ('kterm-cft-digest-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_CFT_DIGEST_STALE_DIRECTORY_REFUSED'}
          [void][IO.Directory]::CreateDirectory($root)
          try {
            $url='https://storage.googleapis.com/chrome-for-testing-public/157.0.8103.78/win64/chrome-win64.zip'
            $zip=Join-Path $root 'browser.zip'
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 180 -MaximumRedirection 2 *> (Join-Path $root 'private-download.log')
            $size=(Get-Item -LiteralPath $zip).Length
            if($size -lt 50000000 -or $size -gt 350000000){throw 'KTERM_CFT_DIGEST_ARCHIVE_BUDGET'}
            $zipHash=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archive=[IO.Compression.ZipFile]::OpenRead($zip)
            try {
              $entry=@($archive.Entries|Where-Object {$_.FullName -ceq 'chrome-win64/chrome.exe'})
              if($entry.Count -ne 1){throw 'KTERM_CFT_DIGEST_CHROME_ENTRY_NOT_EXACT'}
              $exe=Join-Path $root 'chrome.exe'
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry[0],$exe)
            } finally {$archive.Dispose()}
            $exeHash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            $sig=Get-AuthenticodeSignature -LiteralPath $exe
            $version=[string](Get-Item -LiteralPath $exe).VersionInfo.FileVersion
            if($version -notmatch '^157[.]0[.]8103[.]78([.]|$)'){throw 'KTERM_CFT_DIGEST_VERSION_MISMATCH'}
            if($sig.Status -notin @('NotSigned','Valid')){throw 'KTERM_CFT_DIGEST_UNEXPECTED_SIGNATURE_STATUS'}
            Write-Host ('KTERM_CFT_OFFICIAL_SHA_RECEIPT=PASS;VERSION='+$version+
              ';ZIP_SHA256='+$zipHash+';EXE_SHA256='+$exeHash+
              ';AUTHENTICODE_STATUS='+$sig.Status+
              ';SIGNED_AUTHORITY_CLAIM=FALSE;BROWSER_EXECUTED=FALSE;NO_MACHINE_INSTALL=TRUE')
          } finally {
            if(Test-Path -LiteralPath $root){
              $fixed=[IO.Path]::GetFullPath($root)
              $parent=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')+'\'
              if(-not $fixed.StartsWith($parent,[StringComparison]::OrdinalIgnoreCase) -or
                 [IO.Path]::GetFileName($fixed) -cne ('kterm-cft-digest-'+$env:GITHUB_RUN_ID)){
                throw 'KTERM_CFT_DIGEST_CLEANUP_REFUSED'
              }
              Remove-Item -LiteralPath $fixed -Recurse -Force -ErrorAction Stop
            }
            Write-Host 'KTERM_CFT_DIGEST_PRIVATE_CLEANUP=PASS;LIVE_ORDERS=0'
          }

