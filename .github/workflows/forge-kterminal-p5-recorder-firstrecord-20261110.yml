name: K Terminal native snapshot freshness exact-source Windows qualification
on:
  push:
    branches: [qualification/kterminal-p5-recorder-firstrecord-20261110]
    paths: [.github/workflows/forge-kterminal-p5-recorder-firstrecord-20261110.yml]
permissions:
  contents: read
concurrency:
  group: kterminal-pr88-full-window-ae11818c
  cancel-in-progress: false
jobs:
  owner-local-paper-qualification:
    # Qualified unchanged PR94 product SHA already passed in run 43113667283; no duplicate 27-minute regression.
    if: ${{ false }}
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 115
    env:
      KTERM_SHA: 879bd65f75e1544d2125aa184596a2a8f8b972d3
      KTERM_BASE: 5f56896a1aeefdf5e412d47210026dd6d882229f
      KTERM_NATIVE_SNAPSHOT_BLOB: b381089816414485ca9b8f76334aa649d42336a9
      KTERM_SNAPSHOT_TEST_BLOB: 91311e52d0f0f99b14caad0f227996583ef03d75
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Admit previously approved Windows owner and disarmed environment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-recorder-firstrecord-20261110' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows') { throw 'KTERM_P5_OWNER_IDENTITY_REFUSED' }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET',
              'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')) {
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_P5_OWNER_BROKER_ENV_REFUSED'}
          }
          if(@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_P5_EXISTING_APP_PRESERVED_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_P5_WORKSPACE_NOT_FRESH'}
          [void][IO.Directory]::CreateDirectory($root)
          Write-Host 'KTERM_P5_OWNER_ISOLATED_DISARMED=PASS;NO_BROKER_WRITES=TRUE'
      - name: Stage pinned private K Terminal candidate and verify two-file patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          [void][IO.Directory]::CreateDirectory($stage)
          & git -C $stage init -q *> (Join-Path $root 'private-git-init.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_GIT_INIT_FAILED'}
          $source='https://github.com/Kboomllc/K-Terminal.git'
          & git -C $stage fetch -q --no-tags --depth=9 $source $env:KTERM_SHA *> (Join-Path $root 'private-git-fetch.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_PRIVATE_SOURCE_UNAVAILABLE'}
          & git -C $stage checkout -q --detach $env:KTERM_SHA *> (Join-Path $root 'private-git-checkout.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_CHECKOUT_FAILED'}
          $sha=(& git -C $stage rev-parse HEAD | Out-String).Trim()
          $tree=(& git -C $stage rev-parse 'HEAD^{tree}' | Out-String).Trim()
          $parent=(& git -C $stage rev-parse 'HEAD~6' | Out-String).Trim()
          $rec=(& git -C $stage rev-parse 'HEAD:pkg/native-snapshot.go' | Out-String).Trim()
          $test=(& git -C $stage rev-parse 'HEAD:pkg/native-snapshot-freshness_test.go' | Out-String).Trim()
          if($sha -cne $env:KTERM_SHA -or $parent -cne $env:KTERM_BASE -or
             $rec -cne $env:KTERM_NATIVE_SNAPSHOT_BLOB -or $test -cne $env:KTERM_SNAPSHOT_TEST_BLOB -or
             $tree -cnotmatch '^[0-9a-f]{40}$' -or
             @(& git -C $stage status --porcelain).Count -ne 0){throw 'KTERM_P5_SOURCE_CUSTODY_REFUSED'}
          $changed=@(& git -C $stage diff --name-only HEAD~6 HEAD)
          $expected=@('pkg/native-snapshot.go','pkg/native-snapshot-freshness_test.go')
          if($changed.Count -ne 2 -or @($changed | Where-Object {$_ -cnotin $expected}).Count -ne 0){
            throw 'KTERM_SNAPSHOT_TWO_FILE_SCOPE_DRIFT'
          }
          foreach($private in @('.env','config.json','data')){
            if(Test-Path -LiteralPath (Join-Path $stage $private)){throw 'KTERM_P5_PRIVATE_STATE_REFUSED'}
          }
          Write-Host ('KTERM_P5_EXACT_SOURCE=PASS;SHA='+$sha+';TREE='+$tree+';TWO_FILE_SCOPE=PASS;SOURCE_PARENT_PR94=VERIFIED')
      - name: Pinned Windows Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Focused in-memory GET-only native freshness test then mandatory full Windows regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((go version) -notmatch 'go1\.26\.5 windows/amd64'){throw 'KTERM_SNAPSHOT_GO_TOOLCHAIN_DRIFT'}
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          $env:RUNNER_TEMP=Join-Path $root 'test-temp'
          $env:GOCACHE=Join-Path $root 'go-cache'
          $env:GOMODCACHE=Join-Path $root 'go-modules'
          $env:K_TERMINAL_TEST_WORKSPACE=Join-Path $root 'test-workspace'
          $env:KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT=Join-Path $root 'test-workspace\tail'
          $env:KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT=Join-Path $root 'test-workspace\post'
          $env:KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT=Join-Path $root 'test-workspace\private'
          foreach($dir in @($env:RUNNER_TEMP,$env:GOCACHE,$env:GOMODCACHE,$env:K_TERMINAL_TEST_WORKSPACE,
              $env:KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT,$env:KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT,
              $env:KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT)){[void][IO.Directory]::CreateDirectory($dir)}
          Push-Location $stage
          try {
            $focused=Join-Path $root 'private-native-snapshot-focused.log'
            $clock=[Diagnostics.Stopwatch]::StartNew()
            & go test -p 1 -count=1 -timeout 3m -run '^TestNativeSnapshotAccountTimestampAndFeePublicationAreAtomic$' ./pkg *> $focused
            $code=$LASTEXITCODE
            $clock.Stop()
            if($code -ne 0){
              $digest=(Get-FileHash -LiteralPath $focused -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host ('KTERM_SNAPSHOT_FOCUSED=FAIL;EXIT='+$code+';PRIVATE_LOG_SHA256='+$digest+';PRIVATE_LOG_NOT_UPLOADED=TRUE')
              throw 'KTERM_SNAPSHOT_FOCUSED_UNQUALIFIED'
            }
            Write-Host ('KTERM_SNAPSHOT_FOCUSED=PASS;MS='+$clock.ElapsedMilliseconds+';CASES=5;BROKER_POST=0')
            $full=Join-Path $root 'private-go-full.jsonl'
            $clock=[Diagnostics.Stopwatch]::StartNew()
            & go test -json -p 1 -count=1 -timeout 60m ./... *> $full
            $code=$LASTEXITCODE
            $clock.Stop()
            if($code -ne 0){
              $digest=(Get-FileHash -LiteralPath $full -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host ('KTERM_SNAPSHOT_FULL_WINDOWS_REGRESSION=FAIL;EXIT='+$code+';LOG_SHA256='+$digest+';RAW_LOG_PRIVATE=TRUE')
              throw 'KTERM_SNAPSHOT_FULL_REGRESSION_FAILED'
            }
            Write-Host ('KTERM_SNAPSHOT_FULL_WINDOWS_REGRESSION=PASS;MS='+$clock.ElapsedMilliseconds)
            & go vet ./... *> (Join-Path $root 'private-go-vet.log')
            if($LASTEXITCODE -ne 0){throw 'KTERM_SNAPSHOT_VET_FAILED'}
            Write-Host 'KTERM_SNAPSHOT_VET=PASS'
          } finally { Pop-Location }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -STA -File (Join-Path $stage 'BUILD.ps1') *> (Join-Path $root 'private-build.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_SNAPSHOT_ORIGINAL_BUILD_FAILED'}
          Write-Host ('KTERM_SNAPSHOT_ORIGINAL_BUILD=PASS;SOURCE_SHA='+$env:KTERM_SHA+';NO_INSTALL=TRUE;LIVE_ORDERS=0')
      - name: Remove private source and local test fixtures
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:RUNNER_TEMP
          $root=Join-Path $base ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root) {
            $path=[IO.Path]::GetFullPath($root)
            $scope=[IO.Path]::GetFullPath($base).TrimEnd('\')+'\'
            if(-not $path.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -or
               [IO.Path]::GetFileName($path) -cne ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)){
              throw 'KTERM_P5_PRIVATE_CLEANUP_REFUSED'
            }
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_P5_PRIVATE_CLEANUP=PASS;PUBLIC_PRIVATE_FILES=0;LIVE_ORDERS=0'

  owner-readonly-eligibility:
    name: K Terminal existing owner read-only runtime and Graphify host eligibility
    # Previous exact-source read-only preflight PASS: run 43126758468. Do not repeat.
    if: ${{ false }}
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Verify approved owner and inspect bounded executable/Graphify prerequisites READ ONLY
        shell: pwsh
        env:
          K_TERMINAL_EXECUTION_MODE: PAPER
          K_TERMINAL_P5_LATENCY: '0'
          K_TERMINAL_NATIVE_TIMING: '0'
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-recorder-firstrecord-20261110' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows') { throw 'KTERM_READONLY_OWNER_IDENTITY_REFUSED' }
          if($env:K_TERMINAL_EXECUTION_MODE -cne 'PAPER' -or
             $env:K_TERMINAL_P5_LATENCY -cne '0' -or
             $env:K_TERMINAL_NATIVE_TIMING -cne '0') { throw 'KTERM_READONLY_DISARM_REFUSED' }
          foreach($name in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET')) {
            if([Environment]::GetEnvironmentVariable($name)) { throw 'KTERM_READONLY_BROKER_ENV_PRESENT_REFUSED' }
          }
          $session=[Diagnostics.Process]::GetCurrentProcess().SessionId
          $interactive=($session -ne 0 -and
            @(Get-Process explorer -ErrorAction SilentlyContinue |
               Where-Object { $_.SessionId -eq $session }).Count -gt 0)
          $running=@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue)
          Write-Host ('KTERM_READONLY_OWNER=PASS;APP_PROCESS_PRESENT='+($running.Count -gt 0)+';INTERACTIVE_SESSION='+$interactive)
          $roots=@()
          if($env:PUBLIC) {
            $roots+=@( (Join-Path $env:PUBLIC 'KTerminal'),
                       (Join-Path $env:PUBLIC 'K-Terminal') )
          }
          if($env:ProgramFiles) {
            $roots+=@( (Join-Path $env:ProgramFiles 'K-Terminal'),
                       (Join-Path $env:ProgramFiles 'KTerminal') )
          }
          if($env:LOCALAPPDATA) {
            $roots+=@( (Join-Path $env:LOCALAPPDATA 'Programs\K-Terminal') )
          }
          if($env:USERPROFILE) {
            $roots+=@( (Join-Path $env:USERPROFILE 'Downloads\KTerminal'),
                       (Join-Path $env:USERPROFILE 'Downloads\K-Terminal') )
          }
          $names=@('K-Terminal.exe','K-Terminal-Engine.exe','Personal\K-Terminal.exe','bin\K-Terminal.exe')
          $found=0
          foreach($root in @($roots | Select-Object -Unique)) {
            if(-not (Test-Path -LiteralPath $root -PathType Container)) { continue }
            $folder=Get-Item -LiteralPath $root -Force -ErrorAction Stop
            if(($folder.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { continue }
            foreach($leaf in $names) {
              $target=Join-Path $root $leaf
              if(-not (Test-Path -LiteralPath $target -PathType Leaf)) { continue }
              $file=Get-Item -LiteralPath $target -Force -ErrorAction Stop
              if(($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { continue }
              $digest=(Get-FileHash -LiteralPath $target -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
              if($digest -cnotmatch '^[0-9a-f]{64}$') { throw 'KTERM_READONLY_EXE_HASH_INVALID' }
              $found++
              Write-Host ('KTERM_READONLY_EXE_CANDIDATE=FOUND;SHA256='+$digest)
            }
          }
          Write-Host ('KTERM_READONLY_BOUNDED_ROOTS='+$roots.Count+';EXECUTABLE_CANDIDATES='+$found+';SOURCE_MATCH=NOT_ESTABLISHED;INSTALLATION_PROVEN=FALSE')
          $go=Get-Command -Name go.exe -CommandType Application -ErrorAction SilentlyContinue
          $python=Get-Command -Name python.exe -CommandType Application -ErrorAction SilentlyContinue
          $pwsh=Get-Command -Name pwsh.exe -CommandType Application -ErrorAction SilentlyContinue
          $chromiumPresent=$false
          foreach($b in @(
              (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
              (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'))) {
            if(Test-Path -LiteralPath $b -PathType Leaf) { $chromiumPresent=$true }
          }
          Write-Host ('KTERM_GRAPHIFY_OWNER_HOST_PREFLIGHT=PASS;GO_PRESENT='+($null -ne $go)+';PYTHON_PRESENT='+($null -ne $python)+';PWSH_PRESENT='+($null -ne $pwsh)+';CHROMIUM_BROWSER_PRESENT='+$chromiumPresent+';GRAPHIFY_FULL_ACCEPTANCE=NOT_RUN')
          Write-Host 'KTERM_FIELD_ACCEPTANCE=UNVERIFIED;LIVE_ORDERS=0;NO_APP_EXECUTION=TRUE;NO_WRITES=TRUE'


  owner-graphify-static:
    name: K Terminal exact-SHA offline compiler/Graphify-source qualification
    # Separate from historical full Go regression and interactive/browser acceptance.
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      KTERM_SHA: 879bd65f75e1544d2125aa184596a2a8f8b972d3
      KTERM_TREE: 468a49fbd2c2457290cf2464074934e205f62ced
      KTERM_GO_MOD_BLOB: b3ede0d8444c08b3e7b23f1396374359b54134c6
      KTERM_MAIN_BLOB: 7cd4591c4ed7e2d668602d8964efa65beeb0fad4
      KTERM_G27_BLOB: 12ad7e7fecdd1e3688518e6cd651fd2dd6600075
      KTERM_G30_BLOB: bdcc2310bf64f45769eae48b276c224b7b0b1114
      KTERM_G31_BLOB: 551bcc4ac886f6b8aa70c91df8290714f970d7c6
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Admit same disarmed owner and stage source-verified private static checkout
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-recorder-firstrecord-20261110' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows') { throw 'KTERM_GRAPHIFY_OWNER_IDENTITY_REFUSED' }
          if($env:K_TERMINAL_EXECUTION_MODE -cne 'PAPER' -or
             $env:K_TERMINAL_P5_LATENCY -cne '0' -or
             $env:K_TERMINAL_NATIVE_TIMING -cne '0') { throw 'KTERM_GRAPHIFY_DISARM_REFUSED' }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET',
              'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')) {
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_GRAPHIFY_BROKER_ENV_REFUSED'}
          }
          if(@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_GRAPHIFY_EXISTING_APP_PRESERVED_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-graphify-static-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_GRAPHIFY_STALE_WORKSPACE'}
          [void][IO.Directory]::CreateDirectory($root)
          $stage=Join-Path $root 'source'
          [void][IO.Directory]::CreateDirectory($stage)
          & git -C $stage init -q *> (Join-Path $root 'git-init-private.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_GRAPHIFY_GIT_INIT_FAILED'}
          & git -C $stage fetch -q --no-tags --depth=20 https://github.com/Kboomllc/K-Terminal.git $env:KTERM_SHA *> (Join-Path $root 'git-fetch-private.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_GRAPHIFY_PRIVATE_FETCH_UNAVAILABLE'}
          & git -C $stage checkout -q --detach $env:KTERM_SHA *> (Join-Path $root 'git-checkout-private.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_GRAPHIFY_CHECKOUT_FAILED'}
          $sha=(& git -C $stage rev-parse HEAD | Out-String).Trim()
          $tree=(& git -C $stage rev-parse 'HEAD^{tree}' | Out-String).Trim()
          if($sha -cne $env:KTERM_SHA -or $tree -cne $env:KTERM_TREE -or
             @(& git -C $stage status --porcelain).Count -ne 0){throw 'KTERM_GRAPHIFY_SHA_TREE_OR_CLEAN_DRIFT'}
          foreach($pair in @(
            @('go.mod',$env:KTERM_GO_MOD_BLOB),
            @('main.go',$env:KTERM_MAIN_BLOB),
            @('tools/graphify/g27_qualify_type_calls.py',$env:KTERM_G27_BLOB),
            @('tools/graphify/g30_qualify_type_calls.py',$env:KTERM_G30_BLOB),
            @('tools/graphify/g31_verify_interpackage.py',$env:KTERM_G31_BLOB)
          )){
            $got=(& git -C $stage rev-parse ('HEAD:'+$pair[0]) | Out-String).Trim()
            if($got -cne $pair[1]){throw 'KTERM_GRAPHIFY_SOURCE_BLOB_DRIFT'}
          }
          foreach($private in @('.env','config.json','data')){
            if(Test-Path -LiteralPath (Join-Path $stage $private)){throw 'KTERM_GRAPHIFY_PRIVATE_STATE_REFUSED'}
          }
          Write-Host ('KTERM_GRAPHIFY_EXACT_SOURCE=PASS;SHA='+$sha+';TREE='+$tree+';DISARMED=TRUE;NO_BROKER_WRITES=TRUE')
      - name: Qualify original Go/compiler Graphify source with negative controls, no browser
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-graphify-static-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          $private=Join-Path $root 'private-results'
          [void][IO.Directory]::CreateDirectory($private)
          $env:K_TERMINAL_TEST_WORKSPACE=Join-Path $root 'test-workspace'
          $env:KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT=Join-Path $env:K_TERMINAL_TEST_WORKSPACE 'tail'
          $env:KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT=Join-Path $env:K_TERMINAL_TEST_WORKSPACE 'post'
          $env:KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT=Join-Path $env:K_TERMINAL_TEST_WORKSPACE 'private'
          foreach($dir in @($env:K_TERMINAL_TEST_WORKSPACE,$env:KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT,
             $env:KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT,$env:KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT)){
            [void][IO.Directory]::CreateDirectory($dir)
          }
          function Invoke-Static([string]$name,[string]$tool,[string[]]$arguments){
            $log=Join-Path $private ($name+'.log')
            & $tool @arguments *> $log
            if($LASTEXITCODE -ne 0){
              $hash=(Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host ('KTERM_GRAPHIFY_STATIC_'+$name+'=FAIL;EXIT='+$LASTEXITCODE+';PRIVATE_LOG_SHA256='+$hash+';RAW_LOG_NOT_UPLOADED=TRUE')
              throw ('KTERM_GRAPHIFY_STATIC_'+$name+'_FAILED')
            }
            Write-Host ('KTERM_GRAPHIFY_STATIC_'+$name+'=PASS')
          }
          Push-Location $stage
          try {
            if((go version) -notmatch 'go1\.26\.5 windows/amd64'){throw 'KTERM_GRAPHIFY_GO_TOOLCHAIN_UNQUALIFIED'}
            & python -c "import sys; assert sys.version_info[:2] == (3,12)" *> (Join-Path $private 'python-version.log')
            if($LASTEXITCODE -ne 0){throw 'KTERM_GRAPHIFY_PYTHON_312_UNAVAILABLE'}
            Write-Host 'KTERM_GRAPHIFY_TOOLS=PASS;GO_1_26_5=TRUE;PYTHON_3_12=TRUE'
            Invoke-Static 'ORDER_SOURCE_NEGATIVE' python @('tools/graphify/verify_order_reconciliation_map.py','--self-test')
            Invoke-Static 'ORDER_SOURCE_EXACT' python @('tools/graphify/verify_order_reconciliation_map.py',$private)
            Invoke-Static 'G27_GO_SELF_TEST' go @('run','tools/graphify/g27_type_calls.go','--self-test')
            Invoke-Static 'G27_PY_NEGATIVE' python @('tools/graphify/g27_qualify_type_calls.py','--self-test')
            Invoke-Static 'G29_CUSTODY_NEGATIVE' python @('tools/graphify/g29_fresh_source_custody.py','--self-test')
            Invoke-Static 'G30_GO_SELF_TEST' go @('run','tools/graphify/g30_type_calls.go','--self-test')
            Invoke-Static 'G30_PY_NEGATIVE' python @('tools/graphify/g30_qualify_type_calls.py','--self-test')
            Invoke-Static 'G31_PY_NEGATIVE' python @('tools/graphify/g31_verify_interpackage.py','--self-test')
            Invoke-Static 'G35_PY_NEGATIVE' python @('tools/graphify/g35_unify.py','--self-test')
            Invoke-Static 'G44_GO_SELF_TEST' go @('run','tools/graphify/g44_ast_call_witness.go','--self-test')
            $raw27=Join-Path $private 'g27-raw.json'
            $result27=Join-Path $private 'g27-qualified'
            Invoke-Static 'G27_REAL_COMPILER' go @('run','tools/graphify/g27_type_calls.go','--root','.','--sha',$env:KTERM_SHA,'--out',$raw27)
            Invoke-Static 'G27_REAL_CUSTODY' python @('tools/graphify/g27_qualify_type_calls.py','--raw',$raw27,'--out',$result27,'--sha',$env:KTERM_SHA)
            $qualified27=Join-Path $result27 'G27_TYPE_CALLS.json'
            Invoke-Static 'G29_FRESH_CUSTODY' python @('tools/graphify/g29_fresh_source_custody.py','--receipt',$qualified27,'--sha',$env:KTERM_SHA)
            $raw30=Join-Path $private 'g30-raw'
            [void][IO.Directory]::CreateDirectory($raw30)
            foreach($pkg in @('internal/consumedwire','internal/reportstore','cmd/chart-history')){
              $short=$pkg.Replace('/','_').Replace('-','_')
              $out=Join-Path $raw30 ($short+'.json')
              Invoke-Static ('G30_'+$short) go @('run','tools/graphify/g30_type_calls.go','--root','.','--sha',$env:KTERM_SHA,'--package',('./'+$pkg),'--out',$out)
            }
            $result30=Join-Path $private 'g30-qualified'
            Invoke-Static 'G30_REAL_CUSTODY' python @('tools/graphify/g30_qualify_type_calls.py','--input-dir',$raw30,'--output-dir',$result30,'--sha',$env:KTERM_SHA,'--fresh-g27',$qualified27)
            $raw31=Join-Path $private 'g31-raw.json'
            $result31=Join-Path $private 'g31-qualified'
            Invoke-Static 'G31_REAL_COMPILER' go @('run','tools/graphify/g31_interpackage_calls.go','--root','.','--sha',$env:KTERM_SHA,'--out',$raw31)
            Invoke-Static 'G31_REAL_CUSTODY' python @('tools/graphify/g31_verify_interpackage.py','--raw',$raw31,'--out',$result31,'--sha',$env:KTERM_SHA,'--fresh-g27',$qualified27)
            $g27=(Get-Content -LiteralPath $qualified27 -Raw | ConvertFrom-Json).summary
            $g30=(Get-Content -LiteralPath (Join-Path $result30 'G30_TYPE_CALLS.json') -Raw | ConvertFrom-Json).summary
            $g31=Get-Content -LiteralPath (Join-Path $result31 'G31_INTERPACKAGE.json') -Raw | ConvertFrom-Json
            if($g27.source_sha -cne $env:KTERM_SHA -or $g27.interface_dispatch_proven_targets -ne 0 -or
               $g27.typed_cross_file_evidence -le 0 -or
               $g30.source_sha -cne $env:KTERM_SHA -or $g30.runtime_calls_observed -ne 0 -or
               $g30.additional_cross_file_calls -le 0 -or
               $g31.source_sha -cne $env:KTERM_SHA -or $g31.runtime_calls_observed -ne 0 -or
               $g31.compiler_resolved_interpackage_calls -lt 2) {throw 'KTERM_GRAPHIFY_STATIC_OUTPUT_UNQUALIFIED'}
            $clean=(& git -C $stage status --porcelain | Out-String).Trim()
            if($clean){throw 'KTERM_GRAPHIFY_SOURCE_DIRTY'}
            Write-Host ('KTERM_GRAPHIFY_STATIC_COMPILER_MATRIX=PASS;SHA='+$env:KTERM_SHA+
              ';G27_CROSS_FILE='+$g27.typed_cross_file_evidence+
              ';G30_CROSS_FILE='+$g30.additional_cross_file_calls+
              ';G31_INTERPACKAGE='+$g31.compiler_resolved_interpackage_calls+
              ';RUNTIME_CALLS=0;NO_BROKER_WRITES=TRUE;BROWSER_ACCEPTANCE=NOT_RUN;FULL_GO_REGRESSION=REUSED')
          } finally { Pop-Location }
      - name: Erase original private Graphify source and generated evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-graphify-static-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){
            $path=[IO.Path]::GetFullPath($root)
            $scope=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')+'\'
            if(-not $path.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -or
               [IO.Path]::GetFileName($path) -cne ('kterm-graphify-static-'+$env:GITHUB_RUN_ID)){
              throw 'KTERM_GRAPHIFY_PRIVATE_CLEANUP_REFUSED'
            }
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_GRAPHIFY_STATIC_CLEANUP=PASS;PUBLIC_PRIVATE_ARTIFACTS=0;LIVE_ORDERS=0'
