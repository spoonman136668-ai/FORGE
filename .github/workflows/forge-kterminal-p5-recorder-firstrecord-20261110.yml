name: K Terminal P5 source-locked PAPER acceptance package
on:
  push:
    branches: [qualification/kterminal-p5-recorder-firstrecord-20261110]
    paths: [.github/workflows/forge-kterminal-p5-recorder-firstrecord-20261110.yml]
permissions:
  contents: read
concurrency:
  group: kterminal-pr88-full-window-ae11818c
  cancel-in-progress: false
jobs:
  owner-local-paper-qualification:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 115
    env:
      KTERM_SHA: 5f56896a1aeefdf5e412d47210026dd6d882229f
      KTERM_BASE: bcebdc1a7a0487f9d6061a8e643c76069335d896
      KTERM_RECORDER_BLOB: afbef54ac539df0e7dc001c1c44a0edd2dea0a25
      KTERM_TEST_BLOB: d7ce3ba615a98f83c1a0f3c1a1308603835487ca
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Admit previously approved Windows owner and disarmed environment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-recorder-firstrecord-20261110' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows') { throw 'KTERM_P5_OWNER_IDENTITY_REFUSED' }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET',
              'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')) {
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_P5_OWNER_BROKER_ENV_REFUSED'}
          }
          if(@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_P5_EXISTING_APP_PRESERVED_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_P5_WORKSPACE_NOT_FRESH'}
          [void][IO.Directory]::CreateDirectory($root)
          Write-Host 'KTERM_P5_OWNER_ISOLATED_DISARMED=PASS;NO_BROKER_WRITES=TRUE'
      - name: Stage pinned private K Terminal candidate and compare only two recorder files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          [void][IO.Directory]::CreateDirectory($stage)
          & git -C $stage init -q *> (Join-Path $root 'private-git-init.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_GIT_INIT_FAILED'}
          $source='https://github.com/Kboomllc/K-Terminal.git'
          & git -C $stage fetch -q --no-tags --depth=9 $source $env:KTERM_SHA *> (Join-Path $root 'private-git-fetch.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_PRIVATE_SOURCE_UNAVAILABLE'}
          & git -C $stage checkout -q --detach $env:KTERM_SHA *> (Join-Path $root 'private-git-checkout.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_CHECKOUT_FAILED'}
          $sha=(& git -C $stage rev-parse HEAD | Out-String).Trim()
          $tree=(& git -C $stage rev-parse 'HEAD^{tree}' | Out-String).Trim()
          $parent=(& git -C $stage rev-parse 'HEAD~8' | Out-String).Trim()
          $rec=(& git -C $stage rev-parse 'HEAD:verification/KTerminal-Live-Session-Recorder-v1.2.ps1' | Out-String).Trim()
          $test=(& git -C $stage rev-parse 'HEAD:verification/test-kterminal-recorder-v1.2.ps1' | Out-String).Trim()
          if($sha -cne $env:KTERM_SHA -or $parent -cne $env:KTERM_BASE -or
             $rec -cne $env:KTERM_RECORDER_BLOB -or $test -cne $env:KTERM_TEST_BLOB -or
             $tree -cnotmatch '^[0-9a-f]{40}$' -or
             @(& git -C $stage status --porcelain).Count -ne 0){throw 'KTERM_P5_SOURCE_CUSTODY_REFUSED'}
          $changed=@(& git -C $stage diff --name-only HEAD~8 HEAD)
          $expected=@('verification/KTerminal-Live-Session-Recorder-v1.2.ps1','verification/test-kterminal-recorder-v1.2.ps1')
          if($changed.Count -ne 2 -or @($changed | Where-Object {$_ -cnotin $expected}).Count -ne 0){
            throw 'KTERM_P5_TWO_FILE_SCOPE_DRIFT'
          }
          foreach($private in @('.env','config.json','data')){
            if(Test-Path -LiteralPath (Join-Path $stage $private)){throw 'KTERM_P5_PRIVATE_STATE_REFUSED'}
          }
          Write-Host ('KTERM_P5_EXACT_SOURCE=PASS;SHA='+$sha+';TREE='+$tree+';TWO_FILE_SCOPE=PASS')
      - name: Pinned Windows Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Rebuild exact source and create non-installable PAPER acceptance ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((go version) -notmatch 'go1\.26\.5 windows/amd64'){throw 'KTERM_PAPER_GO_VERSION_DRIFT'}
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'source'
          $pkg=Join-Path $root 'paper-package'
          if(Test-Path -LiteralPath $pkg){throw 'KTERM_PAPER_PACKAGE_ROOT_NOT_FRESH'}
          [void][IO.Directory]::CreateDirectory($pkg)
          # No target installation paths are touched. The original BUILD.ps1
          # emits binaries into this throwaway, source-pinned checkout only.
          $buildlog=Join-Path $root 'private-paper-build.log'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -STA -File (Join-Path $src 'BUILD.ps1') *> $buildlog
          if($LASTEXITCODE -ne 0) {
            Write-Host ('KTERM_PAPER_BUILD=FAIL;LOG_SHA256='+(Get-FileHash -LiteralPath $buildlog -Algorithm SHA256).Hash.ToLowerInvariant())
            throw 'KTERM_PAPER_BUILD_FAILED'
          }
          $bins=@('K-Terminal.exe','K-Terminal-Engine.exe','K-Terminal-Account-Lookup.exe',
            'K-Terminal-Chart.exe','K-Terminal-Chart-History.exe','K-Terminal-Subminute-Chart.exe',
            'K-Terminal-Intelligence.exe','K-Terminal-Notifications.exe')
          foreach($name in $bins){
            $srcFile=Join-Path $src $name
            if(-not [IO.File]::Exists($srcFile) -or (Get-Item -LiteralPath $srcFile).Length -lt 4096){
              throw 'KTERM_PAPER_REQUIRED_BINARY_MISSING'
            }
            Copy-Item -LiteralPath $srcFile -Destination (Join-Path $pkg $name) -ErrorAction Stop
          }
          $meta=(& go version -m (Join-Path $src 'K-Terminal-Engine.exe') | Out-String)
          if($meta -notmatch ('vcs\.revision='+[regex]::Escape($env:KTERM_SHA)) -or
             $meta -notmatch 'vcs\.modified=false'){
            throw 'KTERM_PAPER_BINARY_SOURCE_PROVENANCE_UNVERIFIED'
          }
          # Allowlist runtime source files by suffix and exclude admin/build
          # tools, development tests and anything outside the source root.
          $runtime=@(Get-ChildItem -LiteralPath $src -File -ErrorAction Stop | Where-Object {
            (($_.Extension -ceq '.ps1' -or $_.Extension -ceq '.cs') -and
             $_.Name -cnotin @('BUILD.ps1','HEALTH.ps1','UPDATE-PROGRAM-FILES.ps1') -and
             $_.Name -cnotmatch '^test-') -or
            $_.Name -cin @('edition.json','VERSION','LAUNCHER-REVISION','ui-runtime-manifest.json')
          })
          if($runtime.Count -lt 38 -or $runtime.Count -gt 85){throw 'KTERM_PAPER_RUNTIME_SOURCE_SET_DRIFT'}
          foreach($file in $runtime){
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $pkg $file.Name) -ErrorAction Stop
          }
          $assets=Join-Path $pkg 'assets'
          [void][IO.Directory]::CreateDirectory($assets)
          foreach($name in @('kt-logo-source.png','roadmap-2027.png')){
            Copy-Item -LiteralPath (Join-Path $src ('assets\'+$name)) -Destination (Join-Path $assets $name) -ErrorAction Stop
          }
          $diag=Join-Path $pkg 'diagnostics'
          [void][IO.Directory]::CreateDirectory($diag)
          Copy-Item -LiteralPath (Join-Path $src 'verification\KTerminal-Live-Session-Recorder-v1.2.ps1') -Destination (Join-Path $diag 'KTerminal-Live-Session-Recorder-v1.2.ps1')
          Copy-Item -LiteralPath (Join-Path $src 'docs\P5-SAFE-LATENCY-RUNTIME.md') -Destination (Join-Path $diag 'P5-SAFE-LATENCY-RUNTIME.md')
          $notice=@'
          K TERMINAL PRIVATE PAPER ACCEPTANCE STAGING -- DO NOT INSTALL OR LAUNCH
          Frozen source SHA: 5f56896a1aeefdf5e412d47210026dd6d882229f
          Regression: FORGE run 42941369948, PASS on frozen source.
          This ZIP contains no config.json, data, broker credentials, order
          history, or production installation. This separate packaging run
          rebuilds from unchanged source and checks the generated archive;
          it does not rerun the previously passing full Windows regression.
          The binaries are normal program binaries, not technically incapable
          of being configured LIVE later. This is NOT a qualified LIVE build,
          deployment package, installer, or authentic field performance receipt.
          The original 5-minute reconciliation latency is NOT yet resolved.
          '@
          [IO.File]::WriteAllText((Join-Path $pkg 'DO_NOT_INSTALL_OR_LAUNCH.txt'),
            $notice,[Text.UTF8Encoding]::new($false))
          Write-Host ('KTERM_PAPER_BUILD=PASS;ENGINE_SOURCE=EXACT;BINARIES='+$bins.Count+
            ';RUNTIME_SOURCE_FILES='+$runtime.Count+';NO_APP_EXECUTION=TRUE;NO_INSTALL=TRUE')
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $list=@(Get-ChildItem -LiteralPath $pkg -File -Recurse -ErrorAction Stop|Sort-Object FullName)
          if($list.Count -lt 48 -or $list.Count -gt 120){throw 'KTERM_PAPER_FILE_COUNT_UNEXPECTED'}
          $m=[ordered]@{schema='kterminal.paper.staging.v1';source_sha=$env:KTERM_SHA;
            source_tree='8996ef668f167215edcbfd306ac819e53b3b4b86';
            prior_full_regression_run=42941369948;
            no_config_or_private_state=$true;live_deployment_qualified=$false;files=@()}
          foreach($f in $list){
            $rel=$f.FullName.Substring($pkg.Length+1).Replace('\','/')
            if($rel -match '(?i)(^|/)(\.env|config\.json|data|credentials|pending-program-update\.json|\.git|\.build)(/|$)' -or
               $rel -match '(^/|^\.\.|/\.\./|:)' -or $f.Length -gt 150MB){
              throw 'KTERM_PAPER_DISALLOWED_ENTRY'
            }
            $m.files += [ordered]@{path=$rel;bytes=[long]$f.Length;
              sha256=(Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          [IO.File]::WriteAllText((Join-Path $pkg 'ACCEPTANCE-MANIFEST.json'),
            ($m|ConvertTo-Json -Depth 7),[Text.UTF8Encoding]::new($false))
          $zip=Join-Path $root 'K-Terminal-PAPER-ACCEPTANCE-5f56896a.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($pkg,$zip,
            [IO.Compression.CompressionLevel]::Optimal,$false)
          $reader=[IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries=@($reader.Entries|Where-Object {$_.Name})
            $seen=@{}
            if($entries.Count -ne $list.Count+1){throw 'KTERM_PAPER_ZIP_COUNT_MISMATCH'}
            foreach($entry in $entries){
              if($seen.ContainsKey($entry.FullName) -or
                $entry.FullName -match '(?i)(^|/)(\.env|config\.json|data|credentials|pending-program-update\.json|\.git|\.build)(/|$)' -or
                $entry.FullName -match '(^/|^\.\.|/\.\./|:)'){
                throw 'KTERM_PAPER_ZIP_ENTRY_REFUSED'
              }
              $seen[$entry.FullName]=$true
            }
            foreach($item in $m.files){
              $entry=$reader.GetEntry($item.path)
              if($null -eq $entry -or $entry.Length -ne $item.bytes){throw 'KTERM_PAPER_ZIP_FILE_MISMATCH'}
              $stream=$entry.Open()
              try {
                $sha=[Security.Cryptography.SHA256]::Create()
                try{$digest=([BitConverter]::ToString($sha.ComputeHash($stream))).Replace('-','').ToLowerInvariant()}
                finally{$sha.Dispose()}
              }finally{$stream.Dispose()}
              if($digest -cne $item.sha256){throw 'KTERM_PAPER_ZIP_HASH_MISMATCH'}
            }
          }finally{$reader.Dispose()}
          if((Get-Item -LiteralPath $zip).Length -gt 100MB){throw 'KTERM_PAPER_ZIP_TOO_LARGE'}
          Write-Host ('KTERM_PAPER_ZIP=PASS;FILES='+($list.Count+1)+
            ';ZIP_SHA256='+(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()+
            ';NO_CONFIG_OR_DATA=TRUE;RELEASE_ACCEPTANCE=UNVERIFIED;NO_INSTALL=TRUE;LIVE_ORDERS=0')
      - name: Upload private non-installable PAPER staging archive
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: K-Terminal-PAPER-ACCEPTANCE-5f56896a
          path: ${{ runner.temp }}/kterm-p5-firstfile-${{ github.run_id }}/K-Terminal-PAPER-ACCEPTANCE-5f56896a.zip
          retention-days: 14
          if-no-files-found: error
      - name: Remove private source and local test fixtures
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:RUNNER_TEMP
          $root=Join-Path $base ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root) {
            $path=[IO.Path]::GetFullPath($root)
            $scope=[IO.Path]::GetFullPath($base).TrimEnd('\')+'\'
            if(-not $path.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -or
               [IO.Path]::GetFileName($path) -cne ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)){
              throw 'KTERM_P5_PRIVATE_CLEANUP_REFUSED'
            }
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_P5_PRIVATE_CLEANUP=PASS;PUBLIC_PRIVATE_FILES=0;LIVE_ORDERS=0'
