name: K Terminal P5 scoped account publication barrier verification
on:
  push:
    branches: [qualification/kterminal-p5-recorder-firstrecord-20261110]
    paths: [.github/workflows/forge-kterminal-p5-recorder-firstrecord-20261110.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kterminal-pr88-full-window-ae11818c
  cancel-in-progress: false
jobs:
  owner-local-paper-qualification:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 20
    env:
      KTERM_SHA: 5f56896a1aeefdf5e412d47210026dd6d882229f
      KTERM_BASE: bcebdc1a7a0487f9d6061a8e643c76069335d896
      KTERM_RECORDER_BLOB: afbef54ac539df0e7dc001c1c44a0edd2dea0a25
      KTERM_TEST_BLOB: d7ce3ba615a98f83c1a0f3c1a1308603835487ca
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Admit previously approved Windows owner and disarmed environment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-recorder-firstrecord-20261110' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows') { throw 'KTERM_P5_OWNER_IDENTITY_REFUSED' }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET',
              'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')) {
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_P5_OWNER_BROKER_ENV_REFUSED'}
          }
          if(@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_P5_EXISTING_APP_PRESERVED_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_P5_WORKSPACE_NOT_FRESH'}
          [void][IO.Directory]::CreateDirectory($root)
          Write-Host 'KTERM_P5_OWNER_ISOLATED_DISARMED=PASS;NO_BROKER_WRITES=TRUE'
      - name: Stage pinned private K Terminal candidate and compare only two recorder files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          [void][IO.Directory]::CreateDirectory($stage)
          & git -C $stage init -q *> (Join-Path $root 'private-git-init.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_GIT_INIT_FAILED'}
          $source='https://github.com/Kboomllc/K-Terminal.git'
          & git -C $stage fetch -q --no-tags --depth=9 $source $env:KTERM_SHA *> (Join-Path $root 'private-git-fetch.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_PRIVATE_SOURCE_UNAVAILABLE'}
          & git -C $stage checkout -q --detach $env:KTERM_SHA *> (Join-Path $root 'private-git-checkout.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_CHECKOUT_FAILED'}
          $sha=(& git -C $stage rev-parse HEAD | Out-String).Trim()
          $tree=(& git -C $stage rev-parse 'HEAD^{tree}' | Out-String).Trim()
          $parent=(& git -C $stage rev-parse 'HEAD~8' | Out-String).Trim()
          $rec=(& git -C $stage rev-parse 'HEAD:verification/KTerminal-Live-Session-Recorder-v1.2.ps1' | Out-String).Trim()
          $test=(& git -C $stage rev-parse 'HEAD:verification/test-kterminal-recorder-v1.2.ps1' | Out-String).Trim()
          if($sha -cne $env:KTERM_SHA -or $parent -cne $env:KTERM_BASE -or
             $rec -cne $env:KTERM_RECORDER_BLOB -or $test -cne $env:KTERM_TEST_BLOB -or
             $tree -cnotmatch '^[0-9a-f]{40}$' -or
             @(& git -C $stage status --porcelain).Count -ne 0){throw 'KTERM_P5_SOURCE_CUSTODY_REFUSED'}
          $changed=@(& git -C $stage diff --name-only HEAD~8 HEAD)
          $expected=@('verification/KTerminal-Live-Session-Recorder-v1.2.ps1','verification/test-kterminal-recorder-v1.2.ps1')
          if($changed.Count -ne 2 -or @($changed | Where-Object {$_ -cnotin $expected}).Count -ne 0){
            throw 'KTERM_P5_TWO_FILE_SCOPE_DRIFT'
          }
          foreach($private in @('.env','config.json','data')){
            if(Test-Path -LiteralPath (Join-Path $stage $private)){throw 'KTERM_P5_PRIVATE_STATE_REFUSED'}
          }
          Write-Host ('KTERM_P5_EXACT_SOURCE=PASS;SHA='+$sha+';TREE='+$tree+';TWO_FILE_SCOPE=PASS')
      - name: Pinned Windows Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Test original account publication barrier under delayed GET-only fee/book evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((go version) -notmatch 'go1\.26\.5 windows/amd64'){throw 'KTERM_PUBLICATION_GO_VERSION_DRIFT'}
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'source'
          $file=Join-Path $src 'pkg\kterm_account_publication_temp_test.go'
          if(Test-Path -LiteralPath $file){throw 'KTERM_PUBLICATION_TEST_ALREADY_PRESENT'}
          $test=@'
          package pkg
          
          import (
           "context"
           "fmt"
           "net/http"
           "sync"
           "sync/atomic"
           "testing"
           "time"
          )
          
          // Development-only exact-source negative control. No production logic changes.
          // All Coinbase-shaped requests are intercepted inside the unit-test process.
          func TestKTermTemporaryAncillarySnapshotPublicationBarrier(t *testing.T) {
           for _, mode := range []string{"fee-held","book-held","fee-error"} {
            t.Run(mode,func(t *testing.T){
             k:=lookupFixtureRequest(t)
             auth:=NewReadOnlyAuthenticator(k.APIKey.KeyName,k.APIKey.KeySecret)
             cfg:=&Config{AccountID:lookupA,SyntheticTP:SyntheticTPConfig{ProductID:"BTC-USDC",BaseAccountID:lookupB}}
             orders:=NewAdvancedOrderManager(auth,"isolated-fixture",nil)
             balance:=NewBalanceChecker(auth,lookupA)
             cache:=NewNativeSnapshotCache(cfg,"test-config",lookupPortfolio,"LIVE",orders,balance)
             cache.value.ProductAt=time.Now().UTC()
             cache.value.QuoteAt=time.Now().UTC()
             cache.value.BestBid="77000"
             cache.value.BestAsk="77001"
             cache.value.AvailableBase="0.1"
             cache.value.AvailableQuote="100"
             cache.value.MakerFeeRate="0.001"
             cache.value.AccountAt=time.Now().UTC().Add(-time.Minute)
             if mode=="book-held" {cache.value.QuoteAt=time.Now().UTC().Add(-2*time.Second)}
             oldRevision,changed:=cache.accountRevisionEvidence()
             gateEntered:=make(chan struct{})
             gateRelease:=make(chan struct{})
             var once sync.Once
             release:=func(){once.Do(func(){close(gateRelease)})}
             t.Cleanup(release)
             var accounts,fees,books,mutations,foreign atomic.Int32
             mkAccount:=func(id,currency,value string)map[string]any{
               a:=lookupFixtureAccount(id,currency,lookupPortfolio)
               a["available_balance"]=map[string]string{"value":value,"currency":currency}
               a["hold"]=map[string]string{"value":"0","currency":currency}
               return a
             }
             transport:=lookupRoundTripFunc(func(req *http.Request)(*http.Response,error){
              if req.Method!=http.MethodGet {
                mutations.Add(1)
                return nil,fmt.Errorf("read-only test refused mutation")
              }
              if req.URL.Host!="api.coinbase.com" {
                foreign.Add(1)
                return nil,fmt.Errorf("test refused unknown host")
              }
              switch req.URL.Path {
               case "/api/v3/brokerage/accounts":
                 accounts.Add(1)
                 return lookupFixtureResponse(lookupFixturePage([]map[string]any{
                   mkAccount(lookupA,"USDC","100"),
                   mkAccount(lookupB,"BTC","0.2"),
                 },false,""),200),nil
               case "/api/v3/brokerage/transaction_summary":
                 fees.Add(1)
                 if mode=="fee-held"||mode=="fee-error"{
                   close(gateEntered)
                   select {
                    case <-gateRelease:
                    case <-req.Context().Done():return nil,req.Context().Err()
                   }
                 }
                 if mode=="fee-error"{
                   return lookupFixtureResponse(map[string]string{"error":"injected-fee-failure"},503),nil
                 }
                 return lookupFixtureResponse(map[string]any{
                   "fee_tier":map[string]string{"maker_fee_rate":"0.001","taker_fee_rate":"0.002"},
                 },200),nil
               case "/api/v3/brokerage/best_bid_ask":
                 books.Add(1)
                 if mode=="book-held"{
                   close(gateEntered)
                   select{
                    case <-gateRelease:
                    case <-req.Context().Done():return nil,req.Context().Err()
                   }
                 }
                 return lookupFixtureResponse(map[string]any{
                   "pricebooks":[]any{map[string]any{
                     "product_id":"BTC-USDC",
                     "bids":[]any{map[string]string{"price":"77000"}},
                     "asks":[]any{map[string]string{"price":"77001"}},
                   }},
                 },200),nil
               default:
                 foreign.Add(1)
                 return nil,fmt.Errorf("test refused unexpected GET path")
              }
             })
             auth.readTransport=transport
             // NewAdvancedOrderManager initialized this shared client before fixture injection.
             auth.sharedHTTPClient().Transport=transport
             cache.client=&http.Client{Transport:transport,Timeout:2*time.Second}
             ctx,cancel:=context.WithTimeout(context.Background(),3*time.Second)
             t.Cleanup(cancel)
             done:=make(chan error,1)
             go func(){done<-cache.Refresh(ctx)}()
             select{
              case <-gateEntered:
              case <-time.After(time.Second):t.Fatal("original Refresh did not reach expected ancillary GET")
             }
             // The authenticated account GET has completed before this held read.
             if accounts.Load()!=1 || fees.Load()!=1 {t.Fatal("account/fee request ordering changed")}
             before,_:=cache.Current()
             if before.AvailableBase!="0.1" || !before.AccountAt.Before(time.Now().Add(-30*time.Second)){
                t.Fatal("original publisher performed unsafe partial account commit")
             }
             pendingRevision,_:=cache.accountRevisionEvidence()
             if pendingRevision!=oldRevision {t.Fatal("unready GET advanced the account revision")}
             select {
              case <-changed:t.Fatal("unready GET sent premature notification")
              default:
             }
             release()
             var result error
             select {
              case result=<-done:
              case <-time.After(time.Second):t.Fatal("original Refresh did not finish after ancillary release")
             }
             after,_:=cache.Current()
             newRevision,_:=cache.accountRevisionEvidence()
             if mode=="fee-error" {
                if result==nil || after.AvailableBase!="0.1" || newRevision!=oldRevision {
                   t.Fatal("failed fee read changed scoped account balance/revision")
                }
                select{case <-changed:t.Fatal("failed fee read sent ready notification");default:}
             }else{
                if result!=nil || after.AvailableBase!="0.2" || newRevision<=oldRevision ||
                   after.MakerFeeRate!="0.001" || after.AccountAt.Before(time.Now().Add(-2*time.Second)){
                   t.Fatal("verified full composite snapshot not published after release")
                }
                select{case <-changed:default:t.Fatal("fresh completed snapshot omitted revision notification")}
             }
             wantBooks:=int32(0)
             if mode=="book-held"{wantBooks=1}
             if accounts.Load()!=1||fees.Load()!=1||books.Load()!=wantBooks||
                mutations.Load()!=0||foreign.Load()!=0 {
               t.Fatalf("fixture request or mutation boundary drift accounts=%d fees=%d books=%d mutations=%d unknown=%d",
                 accounts.Load(),fees.Load(),books.Load(),mutations.Load(),foreign.Load())
             }
             fmt.Printf("KTERM_SNAPSHOT_BARRIER=PASS;CASE=%s;ACCOUNT_GETS=1;FEE_GETS=1;BOOK_GETS=%d;BROKER_WRITES=0;SCOPED_REVISION_SAFE=TRUE\n",mode,wantBooks)
            })
           }
          }
          '@
          [IO.File]::WriteAllText($file,$test,[Text.UTF8Encoding]::new($false))
          $status=@(& git -C $src status --porcelain)
          if($status.Count -ne 1 -or [string]$status[0] -notmatch '^\?\? pkg/kterm_account_publication_temp_test\.go$'){
            throw 'KTERM_PUBLICATION_WORKTREE_SCOPE_CHANGED'
          }
          $env:K_TERMINAL_P5_LATENCY='0'
          $env:K_TERMINAL_NATIVE_TIMING='0'
          $env:K_TERMINAL_GITHUB_TOKEN=''
          $env:HTTP_PROXY='http://127.0.0.1:9'
          $env:HTTPS_PROXY='http://127.0.0.1:9'
          $env:ALL_PROXY='http://127.0.0.1:9'
          $env:NO_PROXY=''
          $privateLog=Join-Path $root 'private-snapshot-barrier.log'
          Push-Location $src
          try{
            & go test -v -run '^TestKTermTemporaryAncillarySnapshotPublicationBarrier$' -count=1 -timeout 2m ./pkg *> $privateLog
            $exit=$LASTEXITCODE
          }finally{Pop-Location}
          if($exit -ne 0){
            $detail=[IO.File]::ReadAllText($privateLog)
            $class='UNCLASSIFIED'
            foreach($entry in @(
              @{name='GO_COMPILE';token='[build failed]'},
              @{name='NO_ANCILLARY_GET';token='original Refresh did not reach expected ancillary GET'},
              @{name='ACCOUNT_FEE_ORDER';token='account/fee request ordering changed'},
              @{name='PREMATURE_COMMIT';token='original publisher performed unsafe partial account commit'},
              @{name='PREMATURE_REVISION';token='unready GET advanced the account revision'},
              @{name='PREMATURE_NOTIFY';token='unready GET sent premature notification'},
              @{name='REFRESH_TIMEOUT';token='original Refresh did not finish after ancillary release'},
              @{name='FAIL_FEE_PUBLISHED';token='failed fee read changed scoped account balance/revision'},
              @{name='FAIL_FEE_NOTIFIED';token='failed fee read sent ready notification'},
              @{name='SUCCESS_COMMIT_INVALID';token='verified full composite snapshot not published after release'},
              @{name='SUCCESS_NOTIFY_MISSING';token='fresh completed snapshot omitted revision notification'},
              @{name='HTTP_SCOPE_DRIFT';token='fixture request or mutation boundary drift'}
            )){if($detail.Contains([string]$entry.token)){$class=$entry.name;break}}
            if($class -eq 'UNCLASSIFIED' -and $detail.Contains('undefined:')){$class='GO_COMPILE_UNDEFINED'}
            $case='UNKNOWN'
            foreach($name in @('fee-held','book-held','fee-error')){
              if($detail.Contains('TestKTermTemporaryAncillarySnapshotPublicationBarrier/'+$name)){$case=$name}
            }
            Write-Host ('KTERM_SNAPSHOT_FAILURE_CLASS='+$class+';CASE='+$case)
            Write-Host ('KTERM_SNAPSHOT_BARRIER=FAIL;PRIVATE_LOG_SHA256='+
              (Get-FileHash -LiteralPath $privateLog -Algorithm SHA256).Hash.ToLowerInvariant())
            throw 'KTERM_PUBLICATION_ORIGINAL_SOURCE_TEST_FAILED'
          }
          $marks=@([IO.File]::ReadAllLines($privateLog)|Where-Object {$_ -match '^KTERM_SNAPSHOT_BARRIER=PASS;CASE=(fee-held|book-held|fee-error);'})
          if($marks.Count -ne 3 -or
             @($marks|Where-Object {$_ -notmatch ';BROKER_WRITES=0;SCOPED_REVISION_SAFE=TRUE$'}).Count -ne 0){
            throw 'KTERM_PUBLICATION_EVIDENCE_INCOMPLETE'
          }
          foreach($marker in $marks){Write-Host $marker}
          Write-Host ('KTERM_SNAPSHOT_BARRIER_GATE=PASS;CASE_COUNT=3;SOURCE_SHA='+$env:KTERM_SHA+
            ';NO_RELEASE_OR_LIVE_BROKER=TRUE;ORIGINAL_COMPOSITE_SCOPE_RETAINED=TRUE'+
            ';PERFORMANCE_GAIN=UNMEASURED;FIELD_CAUSE=UNVERIFIED')
      - name: Remove private source and local test fixtures
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:RUNNER_TEMP
          $root=Join-Path $base ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root) {
            $path=[IO.Path]::GetFullPath($root)
            $scope=[IO.Path]::GetFullPath($base).TrimEnd('\')+'\'
            if(-not $path.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -or
               [IO.Path]::GetFileName($path) -cne ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)){
              throw 'KTERM_P5_PRIVATE_CLEANUP_REFUSED'
            }
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_P5_PRIVATE_CLEANUP=PASS;PUBLIC_PRIVATE_FILES=0;LIVE_ORDERS=0'
