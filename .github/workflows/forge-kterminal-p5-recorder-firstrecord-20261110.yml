name: K Terminal P5 original two-journal WPF acceptance timing
on:
  push:
    branches: [qualification/kterminal-p5-recorder-firstrecord-20261110]
    paths: [.github/workflows/forge-kterminal-p5-recorder-firstrecord-20261110.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kterminal-pr88-full-window-ae11818c
  cancel-in-progress: false
jobs:
  owner-local-paper-qualification:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 20
    env:
      KTERM_SHA: 5f56896a1aeefdf5e412d47210026dd6d882229f
      KTERM_BASE: bcebdc1a7a0487f9d6061a8e643c76069335d896
      KTERM_RECORDER_BLOB: afbef54ac539df0e7dc001c1c44a0edd2dea0a25
      KTERM_TEST_BLOB: d7ce3ba615a98f83c1a0f3c1a1308603835487ca
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Admit previously approved Windows owner and disarmed environment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-recorder-firstrecord-20261110' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows') { throw 'KTERM_P5_OWNER_IDENTITY_REFUSED' }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET',
              'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')) {
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_P5_OWNER_BROKER_ENV_REFUSED'}
          }
          if(@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_P5_EXISTING_APP_PRESERVED_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_P5_WORKSPACE_NOT_FRESH'}
          [void][IO.Directory]::CreateDirectory($root)
          Write-Host 'KTERM_P5_OWNER_ISOLATED_DISARMED=PASS;NO_BROKER_WRITES=TRUE'
      - name: Stage pinned private K Terminal candidate and compare only two recorder files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          [void][IO.Directory]::CreateDirectory($stage)
          & git -C $stage init -q *> (Join-Path $root 'private-git-init.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_GIT_INIT_FAILED'}
          $source='https://github.com/Kboomllc/K-Terminal.git'
          & git -C $stage fetch -q --no-tags --depth=9 $source $env:KTERM_SHA *> (Join-Path $root 'private-git-fetch.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_PRIVATE_SOURCE_UNAVAILABLE'}
          & git -C $stage checkout -q --detach $env:KTERM_SHA *> (Join-Path $root 'private-git-checkout.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_CHECKOUT_FAILED'}
          $sha=(& git -C $stage rev-parse HEAD | Out-String).Trim()
          $tree=(& git -C $stage rev-parse 'HEAD^{tree}' | Out-String).Trim()
          $parent=(& git -C $stage rev-parse 'HEAD~8' | Out-String).Trim()
          $rec=(& git -C $stage rev-parse 'HEAD:verification/KTerminal-Live-Session-Recorder-v1.2.ps1' | Out-String).Trim()
          $test=(& git -C $stage rev-parse 'HEAD:verification/test-kterminal-recorder-v1.2.ps1' | Out-String).Trim()
          if($sha -cne $env:KTERM_SHA -or $parent -cne $env:KTERM_BASE -or
             $rec -cne $env:KTERM_RECORDER_BLOB -or $test -cne $env:KTERM_TEST_BLOB -or
             $tree -cnotmatch '^[0-9a-f]{40}$' -or
             @(& git -C $stage status --porcelain).Count -ne 0){throw 'KTERM_P5_SOURCE_CUSTODY_REFUSED'}
          $changed=@(& git -C $stage diff --name-only HEAD~8 HEAD)
          $expected=@('verification/KTerminal-Live-Session-Recorder-v1.2.ps1','verification/test-kterminal-recorder-v1.2.ps1')
          if($changed.Count -ne 2 -or @($changed | Where-Object {$_ -cnotin $expected}).Count -ne 0){
            throw 'KTERM_P5_TWO_FILE_SCOPE_DRIFT'
          }
          foreach($private in @('.env','config.json','data')){
            if(Test-Path -LiteralPath (Join-Path $stage $private)){throw 'KTERM_P5_PRIVATE_STATE_REFUSED'}
          }
          Write-Host ('KTERM_P5_EXACT_SOURCE=PASS;SHA='+$sha+';TREE='+$tree+';TWO_FILE_SCOPE=PASS')
      - name: Pinned Windows Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Test original two-log LiveReader to hidden WPF event row with incomplete and duplicate controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'source'
          $fixture=Join-Path $root 'event-fixture'
          [void][IO.Directory]::CreateDirectory($fixture)
          $script=Join-Path $root 'private-event-wpf-test.ps1'
          $log=Join-Path $root 'private-event-wpf-test.log'
          $payload=@'
          param([Parameter(Mandatory=$true)][string]$Root,
                [Parameter(Mandatory=$true)][string]$Fixture)
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($PSVersionTable.PSVersion.Major -ne 5 -or
             [Threading.Thread]::CurrentThread.GetApartmentState() -ne 'STA'){
            throw 'KTERM_EVENT_WPF_NEEDS_POWERSHELL_51_STA'
          }
          Add-Type -AssemblyName PresentationFramework
          Add-Type -AssemblyName System.Web.Extensions
          Add-Type -Path (Join-Path $Root 'journal-reader.cs') -ReferencedAssemblies @('System.dll','System.Core.dll','System.Web.Extensions.dll')
          Add-Type -Path (Join-Path $Root 'event-presentation.cs') -ReferencedAssemblies @('System.dll','System.Core.dll')
          . (Join-Path $Root 'display-timezone.ps1')
          $tokens=$null;$errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile((Join-Path $Root 'dashboard-ui.ps1'),[ref]$tokens,[ref]$errors)
          if(@($errors).Count -ne 0){throw 'KTERM_EVENT_WPF_ORIGINAL_DASHBOARD_PARSE_FAILED'}
          foreach($name in @('ConvertTo-KTerminalEventColumns','New-KTerminalEventRow',
              'Show-KTerminalOrderActivity','Refresh-EventStream')){
            $definition=$ast.Find({
              param($node)
              $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -ceq $name
            },$true)
            if($null -eq $definition){throw ('KTERM_EVENT_WPF_ORIGINAL_HANDLER_MISSING_'+$name)}
            . ([scriptblock]::Create($definition.Extent.Text))
          }
          $converter=[Windows.Media.BrushConverter]::new()
          $brushPrimary=$converter.ConvertFromString('#E8F5F5')
          $brushMuted=$converter.ConvertFromString('#859D9D')
          $brushAccent=$converter.ConvertFromString('#13D4D4')
          $brushNegative=$converter.ConvertFromString('#E6596E')
          $script:authorityEventLine=''
          $script:eventRenderedNotice=''
          $script:eventNotice=$null
          $script:eventQueue=[Collections.Generic.Queue[string]]::new()
          $script:eventReplayRows=0
          $script:eventNextRead=[datetime]::MinValue
          $script:eventReadJob=$null
          $script:p5DesktopEnabled=$false
          $script:selectedAsset='BTC-USDC'
          $script:nativeChart=$null
          $script:displayTimeZone='UTC'
          $view=[Windows.Controls.ListBox]::new()
          $head=[Windows.Controls.Grid]::new()
          for($i=0;$i-lt9;$i++){
            $column=[Windows.Controls.ColumnDefinition]::new()
            $column.Width=[Windows.GridLength]::new(96)
            $head.ColumnDefinitions.Add($column)
          }
          $controls=@{EventStream=$view;EventHeaderGrid=$head}
          $window=[Windows.Window]::new()
          $window.ShowInTaskbar=$false
          $window.Width=800;$window.Height=350
          $window.Content=$view
          # Create a real WPF visual tree but never make the window visible.
          $window.Visibility=[Windows.Visibility]::Hidden
          $first=Join-Path $Fixture 'ckb-execution.log'
          $second=Join-Path $Fixture 'k-terminal-execution.log'
          $oldStamp=[DateTimeOffset]::UtcNow.AddMinutes(-2).ToString('yyyy-MM-ddTHH:mm:ss.fffzzz',[Globalization.CultureInfo]::InvariantCulture)
          $old='['+$oldStamp+'] BUY L1 | ACCEPTED | HISTORICAL_SYNTHETIC'
          [IO.File]::WriteAllText($first,$old+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText($second,'',[Text.UTF8Encoding]::new($false))
          $script:eventTail=[KTerminal.Journal.LiveReader]::new([string[]]@($first,$second))
          $tick=[Windows.Threading.DispatcherTimer]::new()
          $tick.Interval=[TimeSpan]::FromMilliseconds(50)
          $tick.Add_Tick({Refresh-EventStream})
          function Pump([int]$max,[scriptblock]$done) {
            $timer=[Diagnostics.Stopwatch]::StartNew()
            do{
              $frame=[Windows.Threading.DispatcherFrame]::new()
              $wake=[Windows.Threading.DispatcherTimer]::new()
              $wake.Interval=[TimeSpan]::FromMilliseconds(10)
              $wake.Add_Tick({$wake.Stop();$frame.Continue=$false}.GetNewClosure())
              $wake.Start()
              [Windows.Threading.Dispatcher]::PushFrame($frame)
              if(& $done){return $timer.ElapsedMilliseconds}
            }while($timer.ElapsedMilliseconds -lt $max)
            return -1
          }
          function HasRow([string]$stamp){
            foreach($entry in $view.Items){
              if($entry -is [Windows.Controls.Grid] -and [string]$entry.Tag -ceq $stamp){
                if($entry.Children.Count -lt 3 -or $entry.Children[2].Text -notmatch 'ACCEPTED'){
                  throw 'KTERM_EVENT_WPF_ACCEPTED_STATUS_RENDER_INCORRECT'
                }
                return $true
              }
            }
            return $false
          }
          try{
            $tick.Start()
            $replay=Pump 1800 {HasRow $oldStamp}
            if($replay -lt 0){throw 'KTERM_EVENT_WPF_INITIAL_REPLAY_MISSING'}
            # The source's first display page marks startup replay; the new
            # accepted row below must be fresh and distinct from old history.
            $stamp=[DateTimeOffset]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ss.fffzzz',[Globalization.CultureInfo]::InvariantCulture)
            $line='['+$stamp+'] BUY L1 | ACCEPTED | SYNTHETIC_MAKER_ONLY_ACCEPTED'
            $bytes=[Text.UTF8Encoding]::new($false)
            $half=$line.Substring(0,$line.Length-8)
            [IO.File]::AppendAllText($first,$half,$bytes)
            $premature=Pump 350 {HasRow $stamp}
            if($premature -ge 0){throw 'KTERM_EVENT_WPF_INCOMPLETE_JOURNAL_ROW_DISPLAYED'}
            $acceptedStart=[Diagnostics.Stopwatch]::StartNew()
            [IO.File]::AppendAllText($first,$line.Substring($half.Length)+[Environment]::NewLine,$bytes)
            $elapsed=Pump 2500 {HasRow $stamp}
            if($elapsed -lt 0){throw 'KTERM_EVENT_WPF_NEW_ACCEPTED_NOT_VISIBLE'}
            $acceptedStart.Stop()
            $count=@($view.Items|Where-Object {$_ -is [Windows.Controls.Grid] -and [string]$_.Tag -ceq $stamp}).Count
            if($count -ne 1){throw 'KTERM_EVENT_WPF_DUPLICATE_BEFORE_OVERLAP'}
            # Same durable record in both original observed logs must remain
            # exactly one displayed event; zero inferred fills or duplicate
            # accepted-order rows.
            [IO.File]::AppendAllText($second,$line+[Environment]::NewLine,$bytes)
            $null=Pump 450 {$false}
            $count=@($view.Items|Where-Object {$_ -is [Windows.Controls.Grid] -and [string]$_.Tag -ceq $stamp}).Count
            if($count -ne 1){throw 'KTERM_EVENT_WPF_TWO_SOURCE_OVERLAP_NOT_DEDUPLICATED'}
            Write-Output ('KTERM_EVENT_WPF=PASS;SOURCE_TO_HIDDEN_WPF_ITEM_MS='+$elapsed+
              ';WPF_POLL_MS=50;SOURCE_POLL_MIN_MS=200;INCOMPLETE_ROW_REFUSED=TRUE'+
              ';DUPLICATE_CROSS_LOG_ROWS=1;ORIGINAL_READER=TRUE;ORIGINAL_REFRESH_HANDLER=TRUE'+
              ';ORIGINAL_EVENT_ROW_FACTORY=TRUE;ORDER_ACK_IS_SYNTHETIC=TRUE'+
              ';FULL_DESKTOP_STARTED=FALSE;VENUE_REQUESTS=0;REAL_PIXEL_PAINT=UNVERIFIED')
          }finally{$tick.Stop();$window.Close()}
          '@
          [IO.File]::WriteAllText($script,$payload,[Text.UTF8Encoding]::new($false))
          $clock=[Diagnostics.Stopwatch]::StartNew()
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -STA -File $script -Root $src -Fixture $fixture *> $log
          $exit=$LASTEXITCODE
          $clock.Stop()
          if($exit -ne 0){
            Write-Host ('KTERM_EVENT_WPF=FAIL;PRIVATE_LOG_SHA256='+
              (Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant())
            throw 'KTERM_EVENT_WPF_SOURCE_HARNESS_FAILED'
          }
          $marks=@([IO.File]::ReadAllLines($log)|Where-Object {$_ -match '^KTERM_EVENT_WPF=PASS;'})
          if($marks.Count -ne 1){throw 'KTERM_EVENT_WPF_RESULT_CARDINALITY_FAILED'}
          Write-Host $marks[0]
          Write-Host ('KTERM_EVENT_WPF_HARNESS=PASS;WALL_MS='+$clock.ElapsedMilliseconds+
            ';SOURCE_SHA='+$env:KTERM_SHA+';NO_INSTALL=TRUE;NO_BROKER_IO=TRUE')
      - name: Remove private source and local test fixtures
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:RUNNER_TEMP
          $root=Join-Path $base ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root) {
            $path=[IO.Path]::GetFullPath($root)
            $scope=[IO.Path]::GetFullPath($base).TrimEnd('\')+'\'
            if(-not $path.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -or
               [IO.Path]::GetFileName($path) -cne ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)){
              throw 'KTERM_P5_PRIVATE_CLEANUP_REFUSED'
            }
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_P5_PRIVATE_CLEANUP=PASS;PUBLIC_PRIVATE_FILES=0;LIVE_ORDERS=0'
