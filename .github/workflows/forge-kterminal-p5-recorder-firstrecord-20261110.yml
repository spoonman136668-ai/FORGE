name: K Terminal P5 unknown broker ACK no-repost matrix
on:
  push:
    branches: [qualification/kterminal-p5-recorder-firstrecord-20261110]
    paths: [.github/workflows/forge-kterminal-p5-recorder-firstrecord-20261110.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kterminal-pr88-full-window-ae11818c
  cancel-in-progress: false
jobs:
  owner-local-paper-qualification:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 20
    env:
      KTERM_SHA: 5f56896a1aeefdf5e412d47210026dd6d882229f
      KTERM_BASE: bcebdc1a7a0487f9d6061a8e643c76069335d896
      KTERM_RECORDER_BLOB: afbef54ac539df0e7dc001c1c44a0edd2dea0a25
      KTERM_TEST_BLOB: d7ce3ba615a98f83c1a0f3c1a1308603835487ca
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Admit previously approved Windows owner and disarmed environment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-recorder-firstrecord-20261110' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows') { throw 'KTERM_P5_OWNER_IDENTITY_REFUSED' }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET',
              'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')) {
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_P5_OWNER_BROKER_ENV_REFUSED'}
          }
          if(@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_P5_EXISTING_APP_PRESERVED_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_P5_WORKSPACE_NOT_FRESH'}
          [void][IO.Directory]::CreateDirectory($root)
          Write-Host 'KTERM_P5_OWNER_ISOLATED_DISARMED=PASS;NO_BROKER_WRITES=TRUE'
      - name: Stage pinned private K Terminal candidate and compare only two recorder files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          [void][IO.Directory]::CreateDirectory($stage)
          & git -C $stage init -q *> (Join-Path $root 'private-git-init.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_GIT_INIT_FAILED'}
          $source='https://github.com/Kboomllc/K-Terminal.git'
          & git -C $stage fetch -q --no-tags --depth=9 $source $env:KTERM_SHA *> (Join-Path $root 'private-git-fetch.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_PRIVATE_SOURCE_UNAVAILABLE'}
          & git -C $stage checkout -q --detach $env:KTERM_SHA *> (Join-Path $root 'private-git-checkout.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_CHECKOUT_FAILED'}
          $sha=(& git -C $stage rev-parse HEAD | Out-String).Trim()
          $tree=(& git -C $stage rev-parse 'HEAD^{tree}' | Out-String).Trim()
          $parent=(& git -C $stage rev-parse 'HEAD~8' | Out-String).Trim()
          $rec=(& git -C $stage rev-parse 'HEAD:verification/KTerminal-Live-Session-Recorder-v1.2.ps1' | Out-String).Trim()
          $test=(& git -C $stage rev-parse 'HEAD:verification/test-kterminal-recorder-v1.2.ps1' | Out-String).Trim()
          if($sha -cne $env:KTERM_SHA -or $parent -cne $env:KTERM_BASE -or
             $rec -cne $env:KTERM_RECORDER_BLOB -or $test -cne $env:KTERM_TEST_BLOB -or
             $tree -cnotmatch '^[0-9a-f]{40}$' -or
             @(& git -C $stage status --porcelain).Count -ne 0){throw 'KTERM_P5_SOURCE_CUSTODY_REFUSED'}
          $changed=@(& git -C $stage diff --name-only HEAD~8 HEAD)
          $expected=@('verification/KTerminal-Live-Session-Recorder-v1.2.ps1','verification/test-kterminal-recorder-v1.2.ps1')
          if($changed.Count -ne 2 -or @($changed | Where-Object {$_ -cnotin $expected}).Count -ne 0){
            throw 'KTERM_P5_TWO_FILE_SCOPE_DRIFT'
          }
          foreach($private in @('.env','config.json','data')){
            if(Test-Path -LiteralPath (Join-Path $stage $private)){throw 'KTERM_P5_PRIVATE_STATE_REFUSED'}
          }
          Write-Host ('KTERM_P5_EXACT_SOURCE=PASS;SHA='+$sha+';TREE='+$tree+';TWO_FILE_SCOPE=PASS')
      - name: Pinned Windows Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Probe previously untested timeout HTTP 503 and malformed-ACK no-repost negatives
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((go version) -notmatch 'go1\.26\.5 windows/amd64'){throw 'KTERM_UNKNOWN_NEGATIVE_GO_VERSION_MISMATCH'}
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'source'
          $testFile=Join-Path $src 'pkg\kterm_unknown_outcome_temporary_test.go'
          if(Test-Path -LiteralPath $testFile){throw 'KTERM_UNKNOWN_NEGATIVE_FILE_PREEXISTS'}
          $test=@'
package pkg

import (
  "context"
  "encoding/json"
  "fmt"
  "io"
  "net/http"
  "os"
  "path/filepath"
  "strings"
  "testing"
  "time"
)

// Only added in a temporary, owner-verified checkout, never committed into
// the original K Terminal source. Its in-memory transport refuses all
// unknown HTTP routes and does not use real brokerage credentials.
func TestKTermTemporaryUnknownPostMatrix(t *testing.T) {
  type receipt struct {
    Product string `json:"product"`
    Failure string `json:"failure"`
    Posts int `json:"posts"`
    ReplayPosts int `json:"replay_posts"`
    State string `json:"state"`
    Durable bool `json:"durable"`
  }
  var receipts []receipt
  for _, product := range []string{"BTC-USDC","XRP-USDC"} {
    for _, kind := range []string{"lost_timeout_after_transport","transient_503","malformed_success_200"} {
      name := product+"/"+kind
      t.Run(name, func(t *testing.T) {
        h,n,cache := stage3BuyFirstDeferredFixture(t,product,false)
        stage3BuyLifecycleAuthority(t,n) // Synthetic exclusive authority; no external venue.
        evidenceRoot := t.TempDir()
        fp,err := os.OpenFile(filepath.Join(evidenceRoot,"request-evidence.jsonl"),os.O_CREATE|os.O_APPEND|os.O_WRONLY,0600)
        if err != nil {t.Fatal(err)}
        defer fp.Close()
        var evidence []NativeOrderEvidence
        n.Record=func(v NativeOrderEvidence) error {
          raw,e := json.Marshal(v); if e!=nil{return e}
          if _,e=fp.Write(append(raw,'\n'));e!=nil{return e}
          if e=fp.Sync();e!=nil{return e}
          evidence=append(evidence,v)
          return nil
        }
        posts,books,clocks := 0,0,0
        var submitted AdvancedOrderRequest
        base := lookupRoundTripFunc(func(req *http.Request) (*http.Response,error) {
          switch req.URL.Path {
          case "/api/v3/brokerage/best_bid_ask":
            books++
            return makerBookResponse(makerTestBook(n.Snapshot.BestBid,n.Snapshot.BestAsk,product,time.Now()),time.Now()),nil
          case "/api/v3/brokerage/time":
            clocks++
            return makerTimeResponse(time.Now()),nil
          case "/api/v3/brokerage/orders":
            posts++
            if req.Method!=http.MethodPost {return nil,fmt.Errorf("non-POST order transport denied")}
            if e:=json.NewDecoder(req.Body).Decode(&submitted);e!=nil{return nil,e}
            if submitted.ProductID!=product || submitted.Side!=OrderSideBuy ||
              submitted.OrderConfiguration.LimitLimitGTC==nil ||
              !submitted.OrderConfiguration.LimitLimitGTC.PostOnly ||
              submitted.ClientOrderID=="" {return nil,fmt.Errorf("maker/scope/identity violated")}
            switch kind {
            case "lost_timeout_after_transport":
              time.Sleep(125*time.Millisecond) // Intentional bounded loss after a POST was intercepted.
              return nil,context.DeadlineExceeded
            case "transient_503":
              return lookupFixtureResponse(map[string]any{"success":false,"error_response":map[string]string{"error":"TEMPORARILY_UNAVAILABLE"}},http.StatusServiceUnavailable),nil
            case "malformed_success_200":
              return &http.Response{StatusCode:http.StatusOK,Status:"200 OK",Header:make(http.Header),
                Body:io.NopCloser(strings.NewReader("{\"success\":true,\"success_response\":"))},nil
            default:
              return nil,fmt.Errorf("invalid failure control")
            }
          default:
            return nil,fmt.Errorf("non-fixture HTTP route denied: %s",req.URL.Path)
          }
        })
        h.advancedOrderManager=nativeQuoteRecoveryFixture(t,n,lookupRoundTripFunc(func(req *http.Request) (*http.Response,error) {
          return (nativeGuardedTransport{gate:n.Authorize,base:base}).RoundTrip(req)
        }))
        h.advancedOrderManager.UseNativeMarketCache(cache)
        original := n.Signal
        receiptDir:=t.TempDir()
        _,err=h.ExecuteNativeSignal(n,receiptDir)
        if !IsOrderSubmissionOutcomeUnknown(err) {t.Fatalf("unknown outcome not classified: %v",err)}
        if posts!=1 || books!=1 || clocks!=1 || n.Requests!=1 || n.Signal!=original {
          t.Fatalf("bad protected source submission: posts=%d books=%d clocks=%d request=%d",posts,books,clocks,n.Requests)
        }
        if len(evidence)!=2 || evidence[0].State!="REQUEST_READY" ||
          evidence[1].State!="OUTCOME_UNKNOWN" || evidence[0].EventID!=original.EventID ||
          evidence[1].EventID!=original.EventID || evidence[1].Error=="" {
          t.Fatalf("unknown event was not durably distinguished from a rejection")
        }
        if e:=fp.Sync();e!=nil{t.Fatal(e)}
        persisted,e:=stage3ReadJournalRecords(filepath.Join(evidenceRoot,"request-evidence.jsonl"))
        if e!=nil || len(persisted)!=2 || persisted[1].State!="OUTCOME_UNKNOWN" {
          t.Fatalf("required unknown event missing from reopened evidence: %v",e)
        }
        reloaded,e:=NewTrancheController(filepath.Dir(h.tranches.path),h.tranches.state.Scope)
        if e!=nil {t.Fatal(e)}
        reservation,ok:=reloaded.state.Reservations[original.EventID]
        if !ok || reservation.ClientID!=submitted.ClientOrderID ||
          reservation.Quantity<=0 || reservation.Price<=0 {
          t.Fatalf("unknown order reservation missing or altered")
        }
        beforePosts:=posts
        restarted:=&NativeConstruction{Signal:original}
        result,replayErr:=h.ExecuteNativeSignal(restarted,receiptDir)
        output,ok:=result.(map[string]any)
        if replayErr!=nil || !ok || output["status"]!="DUPLICATE_NO_REPLAY" ||
          posts!=beforePosts || restarted.Requests!=0 {
          t.Fatalf("unknown result replay submitted an order: posts=%d err=%v",posts,replayErr)
        }
        receipts=append(receipts,receipt{Product:product,Failure:kind,
          Posts:posts,ReplayPosts:posts-beforePosts,State:evidence[1].State,Durable:true})
      })
    }
  }
  if len(receipts)!=6 {t.Fatalf("incomplete original-source unknown outcome negative matrix")}
  raw,err:=json.Marshal(struct {Schema string `json:"schema"`; Cases []receipt `json:"cases"`}{
    Schema:"kterm.synthetic-unknown-outcome-matrix.v1",Cases:receipts})
  if err!=nil {t.Fatal(err)}
  if e:=os.WriteFile(os.Getenv("KTERM_UNKNOWN_MATRIX_OUTPUT"),raw,0600);e!=nil{t.Fatal(e)}
}
          '@
          [IO.File]::WriteAllText($testFile,$test,[Text.UTF8Encoding]::new($false))
          $status=@(& git -C $src status --porcelain)
          if($status.Count -ne 1 -or [string]$status[0] -notmatch '^\?\? pkg/kterm_unknown_outcome_temporary_test\.go$'){
            throw 'KTERM_UNKNOWN_NEGATIVE_UNEXPECTED_WORKTREE'
          }
          $env:KTERM_UNKNOWN_MATRIX_OUTPUT=Join-Path $root 'private-unknown-matrix.json'
          $env:K_TERMINAL_P5_LATENCY='0'
          $env:K_TERMINAL_NATIVE_TIMING='0'
          $env:K_TERMINAL_GITHUB_TOKEN=''
          $env:HTTP_PROXY='http://127.0.0.1:9'
          $env:HTTPS_PROXY='http://127.0.0.1:9'
          $env:ALL_PROXY='http://127.0.0.1:9'
          $env:NO_PROXY=''
          $log=Join-Path $root 'private-unknown-matrix-test.log'
          $clock=[Diagnostics.Stopwatch]::StartNew()
          Push-Location $src
          try {
            & go test -run '^TestKTermTemporaryUnknownPostMatrix$' -count=1 -timeout 10m ./pkg *> $log
            $code=$LASTEXITCODE
          } finally {Pop-Location}
          $clock.Stop()
          if($code -ne 0 -or -not [IO.File]::Exists($env:KTERM_UNKNOWN_MATRIX_OUTPUT)){
            Write-Host ('KTERM_UNKNOWN_NEGATIVE=FAIL;PRIVATE_LOG_SHA256='+(Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant())
            throw 'KTERM_UNKNOWN_NEGATIVE_ORIGINAL_TRANSPORT_FAILED'
          }
          $p=[IO.File]::ReadAllText($env:KTERM_UNKNOWN_MATRIX_OUTPUT)|ConvertFrom-Json
          if($p.schema -cne 'kterm.synthetic-unknown-outcome-matrix.v1' -or @($p.cases).Count -ne 6){
            throw 'KTERM_UNKNOWN_NEGATIVE_REPORT_INVALID'
          }
          foreach($product in @('BTC-USDC','XRP-USDC')){
            foreach($failure in @('lost_timeout_after_transport','transient_503','malformed_success_200')){
              $x=@($p.cases|Where-Object {$_.product -ceq $product -and $_.failure -ceq $failure})
              if($x.Count -ne 1 -or $x[0].state -cne 'OUTCOME_UNKNOWN' -or
                 $x[0].posts -ne 1 -or $x[0].replay_posts -ne 0 -or $x[0].durable -ne $true){
                throw 'KTERM_UNKNOWN_NEGATIVE_MISSING_CASE_OR_GUARD'
              }
              Write-Host ('KTERM_UNKNOWN_NEGATIVE_CASE=PASS;PRODUCT='+$product+
                ';CONDITION='+$failure+';MOCK_POSTS=1;REPLAY_POSTS=0'+
                ';DURABLE_UNKNOWN_RECEIPT=TRUE;EXACT_MAKER_RESERVATION_RETAINED=TRUE')
            }
          }
          Write-Host ('KTERM_UNKNOWN_NEGATIVE=PASS;SOURCE_SHA='+$env:KTERM_SHA+
            ';CASES=6;MOCK_POSTS=6;LIVE_POSTS=0;UNKNOWN_STATES_DURABLE=6'+
            ';DUPLICATE_REPLAY_POSTS=0;TOOLCHAIN_GUARD=PASS;WORKTREE_TEST_ONLY=TRUE'+
            ';TOTAL_WALL_MS='+$clock.ElapsedMilliseconds+';FIELD_TIMEOUT_CAUSE=UNVERIFIED')
      - name: Remove private source and local test fixtures
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:RUNNER_TEMP
          $root=Join-Path $base ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root) {
            $path=[IO.Path]::GetFullPath($root)
            $scope=[IO.Path]::GetFullPath($base).TrimEnd('\')+'\'
            if(-not $path.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -or
               [IO.Path]::GetFileName($path) -cne ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)){
              throw 'KTERM_P5_PRIVATE_CLEANUP_REFUSED'
            }
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_P5_PRIVATE_CLEANUP=PASS;PUBLIC_PRIVATE_FILES=0;LIVE_ORDERS=0'
