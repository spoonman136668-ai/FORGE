name: K Terminal P5 source-locked offline PAPER artifact acceptance
on:
  push:
    branches: [qualification/kterminal-p5-recorder-firstrecord-20261110]
    paths: [.github/workflows/forge-kterminal-p5-recorder-firstrecord-20261110.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kterminal-pr88-full-window-ae11818c
  cancel-in-progress: false
jobs:
  owner-local-paper-qualification:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 20
    env:
      KTERM_SHA: 5f56896a1aeefdf5e412d47210026dd6d882229f
      KTERM_BASE: bcebdc1a7a0487f9d6061a8e643c76069335d896
      KTERM_RECORDER_BLOB: afbef54ac539df0e7dc001c1c44a0edd2dea0a25
      KTERM_TEST_BLOB: d7ce3ba615a98f83c1a0f3c1a1308603835487ca
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Admit previously approved Windows owner and disarmed environment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-recorder-firstrecord-20261110' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows') { throw 'KTERM_P5_OWNER_IDENTITY_REFUSED' }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET',
              'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')) {
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_P5_OWNER_BROKER_ENV_REFUSED'}
          }
          if(@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_P5_EXISTING_APP_PRESERVED_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_P5_WORKSPACE_NOT_FRESH'}
          [void][IO.Directory]::CreateDirectory($root)
          Write-Host 'KTERM_P5_OWNER_ISOLATED_DISARMED=PASS;NO_BROKER_WRITES=TRUE'
      - name: Stage pinned private K Terminal candidate and compare only two recorder files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          [void][IO.Directory]::CreateDirectory($stage)
          & git -C $stage init -q *> (Join-Path $root 'private-git-init.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_GIT_INIT_FAILED'}
          $source='https://github.com/Kboomllc/K-Terminal.git'
          & git -C $stage fetch -q --no-tags --depth=9 $source $env:KTERM_SHA *> (Join-Path $root 'private-git-fetch.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_PRIVATE_SOURCE_UNAVAILABLE'}
          & git -C $stage checkout -q --detach $env:KTERM_SHA *> (Join-Path $root 'private-git-checkout.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_P5_CHECKOUT_FAILED'}
          $sha=(& git -C $stage rev-parse HEAD | Out-String).Trim()
          $tree=(& git -C $stage rev-parse 'HEAD^{tree}' | Out-String).Trim()
          $parent=(& git -C $stage rev-parse 'HEAD~8' | Out-String).Trim()
          $rec=(& git -C $stage rev-parse 'HEAD:verification/KTerminal-Live-Session-Recorder-v1.2.ps1' | Out-String).Trim()
          $test=(& git -C $stage rev-parse 'HEAD:verification/test-kterminal-recorder-v1.2.ps1' | Out-String).Trim()
          if($sha -cne $env:KTERM_SHA -or $parent -cne $env:KTERM_BASE -or
             $rec -cne $env:KTERM_RECORDER_BLOB -or $test -cne $env:KTERM_TEST_BLOB -or
             $tree -cnotmatch '^[0-9a-f]{40}$' -or
             @(& git -C $stage status --porcelain).Count -ne 0){throw 'KTERM_P5_SOURCE_CUSTODY_REFUSED'}
          $changed=@(& git -C $stage diff --name-only HEAD~8 HEAD)
          $expected=@('verification/KTerminal-Live-Session-Recorder-v1.2.ps1','verification/test-kterminal-recorder-v1.2.ps1')
          if($changed.Count -ne 2 -or @($changed | Where-Object {$_ -cnotin $expected}).Count -ne 0){
            throw 'KTERM_P5_TWO_FILE_SCOPE_DRIFT'
          }
          foreach($private in @('.env','config.json','data')){
            if(Test-Path -LiteralPath (Join-Path $stage $private)){throw 'KTERM_P5_PRIVATE_STATE_REFUSED'}
          }
          Write-Host ('KTERM_P5_EXACT_SOURCE=PASS;SHA='+$sha+';TREE='+$tree+';TWO_FILE_SCOPE=PASS')
      - name: Pinned Windows Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Download only the previously qualified immutable private PAPER artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13846458790
          run-id: 43003258044
          repository: spoonman136668-ai/FORGE
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/kterm-p5-firstfile-${{ github.run_id }}/artifact
      - name: Verify exact ZIP content then execute original relocated offline PAPER acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $root=Join-Path $env:RUNNER_TEMP ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          $download=Join-Path $root 'artifact\K-Terminal-PAPER-ACCEPTANCE-5f56896a'
          $zip=Join-Path $download 'K-Terminal-PAPER-ACCEPTANCE-5f56896a.zip'
          if(-not [IO.File]::Exists($zip)){throw 'KTERM_G22_EXPECTED_ARTIFACT_NOT_FOUND'}
          if(@(Get-ChildItem -LiteralPath $download -File).Count -ne 1){throw 'KTERM_G22_ARTIFACT_SCOPE_DRIFT'}
          $zipsha=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($zipsha -cne 'ad21bc5b3016b025a26675573bc654126b7d78f609ee37784f74e475a52cf5bc'){
            throw 'KTERM_G22_PREVIOUSLY_QUALIFIED_ZIP_HASH_DRIFT'
          }
          $archive=[IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries=@($archive.Entries|Where-Object {$_.Name})
            if($entries.Count -ne 70){throw 'KTERM_G22_ARCHIVE_FILE_COUNT_DRIFT'}
            $seen=@{}
            foreach($e in $entries){
              $name=$e.FullName
              if([string]::IsNullOrWhiteSpace($name) -or $seen.ContainsKey($name) -or
                 $name -match '(?i)(^|/)(\.env|config\.json|data|credentials|pending-program-update\.json|\.git|\.build)(/|$)' -or
                 $name -match '(^/|^\.\.|/\.\./|:|\\)' -or
                 $e.Length -gt 150MB){throw 'KTERM_G22_ARCHIVE_ENTRY_REFUSED'}
              $seen[$name]=$true
            }
            if(-not $seen.ContainsKey('ACCEPTANCE-MANIFEST.json')){throw 'KTERM_G22_MISSING_MANIFEST'}
            $manifestEntry=$archive.GetEntry('ACCEPTANCE-MANIFEST.json')
            $sr=New-Object IO.StreamReader($manifestEntry.Open())
            try{$manifest=($sr.ReadToEnd()|ConvertFrom-Json)}finally{$sr.Dispose()}
            if($manifest.schema -cne 'kterminal.paper.staging.v1' -or
               $manifest.source_sha -cne $env:KTERM_SHA -or
               $manifest.source_tree -cne '8996ef668f167215edcbfd306ac819e53b3b4b86' -or
               $manifest.live_deployment_qualified -ne $false -or
               $manifest.no_config_or_private_state -ne $true -or
               @($manifest.files).Count -ne 69) {throw 'KTERM_G22_MANIFEST_PROVENANCE_DRIFT'}
            foreach($item in $manifest.files){
              $e=$archive.GetEntry([string]$item.path)
              if($null -eq $e -or $e.Length -ne [long]$item.bytes){throw 'KTERM_G22_MANIFEST_MEMBER_DRIFT'}
              $s=$e.Open()
              try{
                $hasher=[Security.Cryptography.SHA256]::Create()
                try{$digest=([BitConverter]::ToString($hasher.ComputeHash($s))).Replace('-','').ToLowerInvariant()}
                finally{$hasher.Dispose()}
              }finally{$s.Dispose()}
              if($digest -cne [string]$item.sha256){throw 'KTERM_G22_MANIFEST_HASH_DRIFT'}
            }
          }finally{$archive.Dispose()}
          $pkg=Join-Path $root 'artifact-unpacked'
          if(Test-Path -LiteralPath $pkg){throw 'KTERM_G22_EXTRACT_ROOT_EXISTS'}
          [IO.Compression.ZipFile]::ExtractToDirectory($zip,$pkg)
          $engine=Join-Path $pkg 'K-Terminal-Engine.exe'
          $launcher=Join-Path $pkg 'K-Terminal.exe'
          if(-not [IO.File]::Exists($engine) -or -not [IO.File]::Exists($launcher)){
            throw 'KTERM_G22_MISSING_NORMAL_BINARIES'
          }
          $build=( & go version -m $engine | Out-String )
          if($build -notmatch ('vcs\.revision='+[regex]::Escape($env:KTERM_SHA)) -or
             $build -notmatch 'vcs\.modified=false'){throw 'KTERM_G22_ENGINE_NOT_EXACT_CLEAN_BUILD'}
          Write-Host ('KTERM_G22_ARTIFACT_CUSTODY=PASS;SOURCE_SHA='+$env:KTERM_SHA+
            ';ZIP_SHA256='+$zipsha+';ENTRIES=70;NO_CONFIG=TRUE;NO_DATA=TRUE')
          # The existing original source G22 harness performs isolated PAPER
          # startup, refusal of a stale BUY, forced restart and synthetic
          # localhost WS accepted fill. It explicitly does NOT exercise LIVE.
          $fixture=Join-Path $root 'paper-runtime'
          [void][IO.Directory]::CreateDirectory($fixture)
          $env:RUNNER_TEMP=$fixture
          $env:K_TERMINAL_EXECUTION_MODE='PAPER'
          $env:K_TERMINAL_SELECTED_ASSET='BTC-USDC'
          $env:K_TERMINAL_P5_LATENCY='0'
          $env:K_TERMINAL_NATIVE_TIMING='0'
          $env:HTTP_PROXY='http://127.0.0.1:9'
          $env:HTTPS_PROXY='http://127.0.0.1:9'
          $env:ALL_PROXY='http://127.0.0.1:9'
          $env:NO_PROXY=''
          $env:K_TERMINAL_GITHUB_TOKEN=''
          $tools=Join-Path $root 'source\tools\graphify'
          $proof=Join-Path $fixture 'private-g22-proof.json'
          $privateLog=Join-Path $root 'private-g22-runtime.log'
          $clock=[Diagnostics.Stopwatch]::StartNew()
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $tools 'g22_relocated_acceptance.ps1') -SourceRoot $pkg -SourceSHA $env:KTERM_SHA -EvidencePath $proof -VerificationToolsRoot $tools *> $privateLog
          $exit=$LASTEXITCODE
          $clock.Stop()
          if($exit -ne 0 -or -not [IO.File]::Exists($proof)){
            $digest=(Get-FileHash -LiteralPath $privateLog -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host ('KTERM_G22_OFFLINE_RUNTIME=FAIL;PRIVATE_LOG_SHA256='+$digest+';RAW_LOGS_PRIVATE=TRUE')
            throw 'KTERM_G22_EXACT_PACKAGE_RUNTIME_FAILED'
          }
          $p=Get-Content -LiteralPath $proof -Raw|ConvertFrom-Json
          $expectedEngine=(Get-FileHash -LiteralPath $engine -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedLauncher=(Get-FileHash -LiteralPath $launcher -Algorithm SHA256).Hash.ToLowerInvariant()
          if($p.schema -cne 'kterminal.ice.g22-relocated-package.v1' -or
             $p.source_sha -cne $env:KTERM_SHA -or
             $p.source_engine_sha256 -cne $expectedEngine -or
             $p.staged_engine_sha256 -cne $expectedEngine -or
             $p.source_launcher_sha256 -cne $expectedLauncher -or
             $p.staged_launcher_sha256 -cne $expectedLauncher -or
             $p.untagged_engine_normal_paper_startup_passed -ne $true -or
             $p.untagged_engine_positive_local_ws_passed -ne $true -or
             $p.forced_engine_restart_passed -ne $true -or
             $p.exact_restart_revision -ne 0 -or
             $p.zero_real_broker_orders -ne $true -or
             $p.private_history_accessed -ne $false -or
             $p.actual_launcher_wpf_interactive_session_run -ne $false -or
             $p.full_g22_installed_gui_qualified -ne $false){
            throw 'KTERM_G22_PROOF_BOUNDARY_MISMATCH'
          }
          Write-Host ('KTERM_G22_OFFLINE_RUNTIME=PASS;RUN_MS='+$clock.ElapsedMilliseconds+
            ';NORMAL_ENGINE_PAPER=PASS;LOCAL_WS_SYNTHETIC=PASS;COLD_RESTART=PASS;BROKER_POSTS=0;INTERACTIVE_GUI=UNVERIFIED;FIELD_LATENCY=UNVERIFIED')
      - name: Remove private source and local test fixtures
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:RUNNER_TEMP
          $root=Join-Path $base ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root) {
            $path=[IO.Path]::GetFullPath($root)
            $scope=[IO.Path]::GetFullPath($base).TrimEnd('\')+'\'
            if(-not $path.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -or
               [IO.Path]::GetFileName($path) -cne ('kterm-p5-firstfile-'+$env:GITHUB_RUN_ID)){
              throw 'KTERM_P5_PRIVATE_CLEANUP_REFUSED'
            }
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_P5_PRIVATE_CLEANUP=PASS;PUBLIC_PRIVATE_FILES=0;LIVE_ORDERS=0'
