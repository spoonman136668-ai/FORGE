name: K Terminal native snapshot freshness exact-source Windows qualification
on:
  push:
    branches: [qualification/kterminal-p5-firstuse-artifact-20261112]
    paths: [.github/workflows/forge-kterminal-p5-recorder-firstrecord-20261110.yml]
permissions:
  contents: read
concurrency:
  group: kterminal-pr88-full-window-ae11818c
  cancel-in-progress: false
jobs:
  owner-p5-firstuse:
    name: K Terminal PR96 exact-source disarmed first-use archive qualification
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 115
    env:
      KTERM_SHA: d253b257fac5c508f2a333828497f3c0f0c9eb51
      KTERM_BASE: cea643af9d5abf3b18e45c5f33cae01694677cc2
      KTERM_TREE: a9d7934a24bf7dd1bbbde3e9ed980e23f1bc313b
      KTERM_REISSUE_ONLY: 'false'
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOFLAGS: '-p=1'
      GOMAXPROCS: '2'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Authorize only existing Windows owner and isolated disarmed scope
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-firstuse-artifact-20261112' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:K_TERMINAL_EXECUTION_MODE -cne 'PAPER' -or
             $env:K_TERMINAL_P5_LATENCY -cne '0' -or
             $env:K_TERMINAL_NATIVE_TIMING -cne '0'){
            throw 'KTERM_P5_FIRSTUSE_OWNER_SCOPE_REFUSED'
          }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
            'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
            'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET',
            'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')){
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_P5_FIRSTUSE_BROKER_ENV_REFUSED'}
          }
          if(@(Get-Process -Name 'K-Terminal*' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_P5_FIRSTUSE_EXISTING_SESSION_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr96-firstuse-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_P5_FIRSTUSE_REUSED_ROOT_REFUSED'}
          [void][IO.Directory]::CreateDirectory($root)
          Write-Host 'KTERM_P5_FIRSTUSE_OWNER_ADMISSION=PASS;BROKER_SECRETS=0;NO_INSTALL=TRUE'
      - name: Retrieve private exact-SHA source and verify three file/blob identities
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr96-firstuse-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'source'
          [void][IO.Directory]::CreateDirectory($src)
          & git -C $src init -q *> (Join-Path $root 'git-init.private.log')
          if($LASTEXITCODE-ne0){throw 'KTERM_PR96_GIT_INIT_FAILED'}
          $remote='https://github.com/Kboomllc/K-Terminal.git'
          & git -C $src fetch -q --no-tags --depth=60 $remote $env:KTERM_SHA $env:KTERM_BASE *> (Join-Path $root 'git-fetch.private.log')
          if($LASTEXITCODE-ne0){throw 'KTERM_PR96_PRIVATE_SOURCE_UNAVAILABLE'}
          & git -C $src checkout -q --detach $env:KTERM_SHA *> (Join-Path $root 'git-checkout.private.log')
          if($LASTEXITCODE-ne0){throw 'KTERM_PR96_CHECKOUT_FAILED'}
          $head=(& git -C $src rev-parse HEAD | Out-String).Trim()
          $tree=(& git -C $src rev-parse 'HEAD^{tree}' | Out-String).Trim()
          if($head -cne $env:KTERM_SHA -or $tree -cne $env:KTERM_TREE -or
             @(& git -C $src status --porcelain --untracked-files=no).Count-ne0){
            throw 'KTERM_PR96_IMMUTABLE_SOURCE_DRIFT'
          }
          $blobs=@{
            'tools/qualification/p5_assemble_source_bound_firstuse.ps1'='74c89b757105af10aef4aa637ce58c944f0b6e68'
            'tools/qualification/p5_verify_firstuse_archive.py'='49b7e369bc15c204a97607480a939e7038d7995a'
            'tools/qualification/test_p5_verify_firstuse_archive.py'='e013cfa5946f234c45809b54c6f3ef023a13038e'
            'pkg/native-snapshot-freshness_test.go'='1a1f58fba665c48f530c907fb83cf4d120481ecd'
            'application-launch.ps1'='5fbf25b8e3f0d621225c0d9220554466ced085db'
            'pkg/advanced-orders.go'='27bb67895bde1be5d987f369639c4b091cd5e3ad'
            'pkg/dashboard-orders.go'='7ca5dfb7445e43b521d634cca4d9ed856605d72a'
            'pkg/terminal-dashboard.go'='5c3da4374e8b00fac7a181305bf57d95b1547b0c'
            'pkg/dashboard-orders_test.go'='7fc9f8048934e83cf49ebb1c6db9ef75037d6c01'
            'BUILD.ps1'='8eb3fbf5121c8b307c71ddc1895e0489ff431a89'
            'cmd/launcher/desktop-session.cs'='527b0fe353b65514eaacb4b09745a3f1d101d2f6'
            'desktop-session.ps1'='d1f263aaba3894bd54d6368b3d60354a0dd6e4fa'
            'ui-runtime-loader.ps1'='e4565b2e1db5bc132bb57e3f5b5cd7cab420041e'
            'verification/test-launch-lifecycle.ps1'='55aa0fd96b1a0b5a7d8ee1bb05ef78d9cac21294'
            'pkg/stage3-report-full-root-v2_test.go'='4c9ad176d434e59553b066df5c4b48d92cd7a2b2'
          }
          foreach($p in $blobs.Keys){
            $actual=(& git -C $src rev-parse ('HEAD:'+$p) | Out-String).Trim()
            if($actual -cne $blobs[$p]){throw 'KTERM_PR96_QUALIFIER_BLOB_DRIFT'}
          }
          $changed=@(& git -C $src diff --name-only $env:KTERM_BASE $env:KTERM_SHA)
          if($LASTEXITCODE-ne0 -or $changed.Count-ne15 -or
             @($changed|Where-Object{$_ -cnotin @($blobs.Keys)}).Count-ne0){
            throw 'KTERM_PR96_FIFTEEN_FILE_SCOPE_DRIFT'
          }
          foreach($private in @('config.json','data','reporting','logs','notifications','.env')){
            if(Test-Path -LiteralPath (Join-Path $src $private)){throw 'KTERM_PR96_PRIVATE_STATE_REFUSED'}
          }
          Write-Host ('KTERM_PR96_SOURCE_CUSTODY=PASS;SHA='+$head+';TREE='+$tree+';PRODUCTION_APP_CHANGE=ORDER_DISPLAY_WAKE_PAPER_DEFAULT_AND_PR78_NESTED_CHILD_OWNERSHIP;FULL_GO_REQUALIFICATION=REQUIRED')
      - name: Pinned original Windows Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Pinned original Python for independent ZIP verifier
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Mandatory full exact-candidate Windows Go regression and vet
        # Mandatory full exact-source regression after the child-job fix.
        # Mandatory full exact candidate regression since launcher code changed.
        # Previous qualified Go blob receipts alone are not acceptance.
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr96-firstuse-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'source'
          if((go version | Out-String).Trim() -notmatch 'go1\.26\.5 windows/amd64' -or
             (python --version | Out-String).Trim() -notmatch '^Python 3\.12\.\d+$'){
            throw 'KTERM_PR96_WINDOWS_TOOLCHAIN_DRIFT'
          }
          # Restore the source-qualified test workspace contract that passed
          # for the same production application Go blobs in FORGE run 43135678106.
          # The test-only Go clock-resolution change is separately requalified.
          # This environment applies only within this regression step.
          $env:RUNNER_TEMP=Join-Path $root 'test-temp'
          $env:GOCACHE=Join-Path $root 'go-cache'
          $env:GOMODCACHE=Join-Path $root 'go-modules'
          $env:K_TERMINAL_TEST_WORKSPACE=Join-Path $root 'test-workspace'
          $env:KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT=Join-Path $root 'test-workspace/tail'
          $env:KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT=Join-Path $root 'test-workspace/post'
          $env:KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT=Join-Path $root 'test-workspace/private'
          foreach($dir in @($env:RUNNER_TEMP,$env:GOCACHE,$env:GOMODCACHE,
             $env:K_TERMINAL_TEST_WORKSPACE,
             $env:KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT,
             $env:KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT,
             $env:KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT)){
            [void][IO.Directory]::CreateDirectory($dir)
          }
          # New display-code controls first: an exact-source cheap FAIL stops
          # this gate before repeating the expensive mandatory full regression.
          $orderViewLog=Join-Path $root 'order-view-focused.private.jsonl'
          $orderViewClock=[Diagnostics.Stopwatch]::StartNew()
          Push-Location $src
          try{
            & go test -json -p 1 -count=2 -timeout 7m -run '^(TestDashboardOrderWakeupsCoalesceWithoutResurrectingTerminalOrders|TestDashboardOrderWakeupsReuseLastFinancialObservation|TestDashboardOrderFastWakeRetainsFinancialRefreshError)$' ./pkg *> $orderViewLog
            $orderViewExit=$LASTEXITCODE
          }finally{Pop-Location}
          $orderViewClock.Stop()
          $orderViewDigest=(Get-FileHash -LiteralPath $orderViewLog -Algorithm SHA256).Hash.ToLowerInvariant()
          $orderViewFails=[System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          $allowed=@('TestDashboardOrderWakeupsCoalesceWithoutResurrectingTerminalOrders',
            'TestDashboardOrderWakeupsReuseLastFinancialObservation',
            'TestDashboardOrderFastWakeRetainsFinancialRefreshError')
          foreach($line in [IO.File]::ReadLines($orderViewLog)){
            if($line -notlike '*"Action":"fail"*'){continue}
            try{$event=ConvertFrom-Json -InputObject $line -ErrorAction Stop}catch{continue}
            if($event.Action -cne 'fail' -or [string]$event.Package -cne 'k-terminal/pkg'){continue}
            if([string]$event.Test -cin $allowed){[void]$orderViewFails.Add([string]$event.Test)}
          }
          foreach($name in @($orderViewFails|Sort-Object)){
            Write-Host ('KTERM_PR96_ORDER_VIEW_FAILED_TEST='+$name)
          }
          Write-Host ('KTERM_PR96_ORDER_VIEW_FOCUSED=EXIT_'+$orderViewExit+
            ';MS='+$orderViewClock.ElapsedMilliseconds+';REPEATS=2'+
            ';FAILED_TESTS='+$orderViewFails.Count+';PRIVATE_LOG_SHA256='+$orderViewDigest+
            ';NO_RAW_TEST_OUTPUT=TRUE')
          if($orderViewExit-ne0){throw 'KTERM_PR96_ORDER_VIEW_FOCUSED_FAILED_STOP'}
          # The prior full Windows regression failed only this historical
          # report-root test. Diagnose exactly this test before spending another
          # full-regression run; do not publish the raw fixture or auth logs.
          $aliasLog=Join-Path $root 'report-alias-focused.private.jsonl'
          $aliasClock=[Diagnostics.Stopwatch]::StartNew()
          Push-Location $src
          try{
            & go test -json -p 1 -count=3 -timeout 15m -run '^TestStage3ReportFullRootPublicAliasFallback$' ./pkg *> $aliasLog
            $aliasExit=$LASTEXITCODE
          }finally{Pop-Location}
          $aliasClock.Stop()
          $aliasDigest=(Get-FileHash -LiteralPath $aliasLog -Algorithm SHA256).Hash.ToLowerInvariant()
          $aliasFailCases=[System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          $aliasReasonCodes=[ordered]@{
            'fresh alias case did not retain its original uninitialized settlement premise'='INITIAL_SETTLEMENT_PREMISE'
            'actual native read-only configuration/scope missing'='SCOPED_CONFIG_PREMISE'
            'original new read-only service constructor lost its exact scope/context'='CONTEXT_PREMISE'
            'original fresh scoped dashboard accounts'='ACCOUNT_READ'
            'original shared read-only HTTP client missing'='HTTP_CLIENT_MISSING'
            'alias-only wrapper did not retain original scoped context/metrics'='SCOPED_TRANSPORT'
            'original exact-product GET-only fresh quote premise'='FRESH_BOOK_CLOCK'
            'actual flat verified PM/scoped dashboard account premise changed'='PM_SCOPE'
            'original internal dashboard observer did not establish the exact owned settlement baseline'='SETTLEMENT_BASELINE'
            'original producer did not create the intended public alias premise'='ALIAS_PRODUCER'
            'original public alias was detached or requalified'='PUBLIC_ALIAS'
            'escaped full fallback lost original financial payload or rehabilitated ownership'='FULL_FALLBACK'
            'unqualified full persistence discarded a historical referenced object'='REFERENCE_PRESERVATION'
          }
          $aliasFound=[System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          $aliasBookStages=0
          $aliasBaselineStages=0
          foreach($line in [IO.File]::ReadLines($aliasLog)){
            if($line -notmatch '"Action":"(?:fail|output)"'){continue}
            try{$event=ConvertFrom-Json -InputObject $line -ErrorAction Stop}catch{continue}
            if([string]$event.Package -cne 'k-terminal/pkg'){continue}
            $testName=[string]$event.Test
            if(-not $testName.StartsWith('TestStage3ReportFullRootPublicAliasFallback',[StringComparison]::Ordinal)){continue}
            if($event.Action -ceq 'fail' -and $testName -cmatch '^TestStage3ReportFullRootPublicAliasFallback/(BTC-USDC|XRP-USDC)$'){
              [void]$aliasFailCases.Add($Matches[1])
            }
            if($event.Action -ceq 'output'){
              $out=[string]$event.Output
              if($out.Contains('ORIGINAL_REPORT_ALIAS_FRESH_BOOK_STAGE')){$aliasBookStages++}
              if($out.Contains('ORIGINAL_REPORT_ALIAS_BASELINE_STAGE')){$aliasBaselineStages++}
              foreach($phrase in $aliasReasonCodes.Keys){
                if($out.Contains([string]$phrase)){[void]$aliasFound.Add([string]$aliasReasonCodes[$phrase])}
              }
            }
          }
          foreach($case in @($aliasFailCases|Sort-Object)){
            Write-Host ('KTERM_PR96_REPORT_ALIAS_FAILED_PRODUCT='+$case)
          }
          foreach($reason in @($aliasFound|Sort-Object)){
            Write-Host ('KTERM_PR96_REPORT_ALIAS_REASON='+$reason)
          }
          Write-Host ('KTERM_PR96_REPORT_ALIAS_FOCUSED=EXIT_'+$aliasExit+
            ';MS='+$aliasClock.ElapsedMilliseconds+';REPEATS=3;FAILED_PRODUCTS='+$aliasFailCases.Count+
            ';BOOK_STAGES='+$aliasBookStages+';BASELINE_STAGES='+$aliasBaselineStages+
            ';REASON_CODES='+$aliasFound.Count+';PRIVATE_LOG_SHA256='+$aliasDigest+
            ';NO_RAW_TEST_OUTPUT=TRUE')
          if($aliasExit-ne0){throw 'KTERM_PR96_REPORT_ALIAS_FOCUSED_FAILED_STOP'}
          # Focused synthetic, in-memory GET-only failure triage before expensive
          # mandatory full regression; never disclose raw fixture/test output.
          $focused=Join-Path $root 'native-snapshot-focused.private.jsonl'
          $focusClock=[Diagnostics.Stopwatch]::StartNew()
          Push-Location $src
          try{
            & go test -json -p 1 -count=3 -timeout 5m -run '^TestNativeSnapshotAccountTimestampAndFeePublicationAreAtomic$' ./pkg *> $focused
            $focusExit=$LASTEXITCODE
          }finally{Pop-Location}
          $focusClock.Stop()
          $focusDigest=(Get-FileHash -LiteralPath $focused -Algorithm SHA256).Hash.ToLowerInvariant()
          $reasonCodes=[ordered]@{
            'ancillary book read published partial account or fee evidence'='PARTIAL_PUBLICATION'
            'account revision published before required book evidence'='PREMATURE_REVISION'
            'bounded synthetic book stage was not reached'='BOOK_STAGE_DEADLINE'
            'synthetic snapshot refresh exceeded its deadline'='REFRESH_DEADLINE'
            'failure-path request budget mismatch'='GET_BUDGET_MISMATCH'
            'failed scoped refresh mutated composite account or fee state'='FAILURE_MUTATED_STATE'
            'failed refresh emitted account revision'='FAILURE_REVISION'
            'failed refresh notified an account change'='FAILURE_NOTIFICATION'
            'complete scoped snapshot and fee did not publish together'='ATOMIC_PUBLICATION_MISMATCH'
            'account timestamp postdated account-page request or was renewed by ancillary reads'='ACCOUNT_OBSERVATION_CLOCK'
            'successful complete snapshot did not advance account revision'='SUCCESS_REVISION_MISSING'
            'successful complete snapshot did not notify waiters'='SUCCESS_NOTIFICATION_MISSING'
          }
          $failedSubtests=[System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          $reasons=[System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          $testRoot='TestNativeSnapshotAccountTimestampAndFeePublicationAreAtomic'
          foreach($line in [IO.File]::ReadLines($focused)){
            if($line -notmatch '"Action":"(?:fail|output)"'){continue}
            try{$obj=ConvertFrom-Json -InputObject $line -ErrorAction Stop}
            catch{continue}
            if([string]$obj.Package -cne 'k-terminal/pkg'){continue}
            $name=[string]$obj.Test
            if($obj.Action -ceq 'fail' -and
               $name -cmatch '^TestNativeSnapshotAccountTimestampAndFeePublicationAreAtomic/(complete|two_page_account_scope|fee_503|book_503|wrong_portfolio)$'){
              [void]$failedSubtests.Add($Matches[1])
            }
            if($obj.Action -ceq 'output' -and $name.StartsWith($testRoot,[StringComparison]::Ordinal)){
              foreach($phrase in $reasonCodes.Keys){
                if(([string]$obj.Output).Contains([string]$phrase)){
                  [void]$reasons.Add([string]$reasonCodes[$phrase])
                }
              }
            }
          }
          foreach($label in @($failedSubtests|Sort-Object)){
            Write-Host ('KTERM_PR96_FOCUSED_FAILED_SUBTEST='+$label)
          }
          foreach($code in @($reasons|Sort-Object)){
            Write-Host ('KTERM_PR96_FOCUSED_REASON_CODE='+$code)
          }
          Write-Host ('KTERM_PR96_FOCUSED_ATOMIC=EXIT_'+$focusExit+
            ';MS='+$focusClock.ElapsedMilliseconds+';REPEATS=3'+
            ';SUBTESTS_FAILED='+$failedSubtests.Count+';REASONS='+$reasons.Count+
            ';PRIVATE_LOG_SHA256='+$focusDigest+';NO_RAW_OUTPUT=TRUE')
          if($focusExit-ne0){throw 'KTERM_PR96_FOCUSED_ATOMIC_FAILURE_STOP'}
          Push-Location $src
          try{
            $sw=[Diagnostics.Stopwatch]::StartNew()
            $full=Join-Path $root 'full-regression.private.jsonl'
            # Exact tested original regimen: explicit long-package timeout,
            # deterministic no-cache runs, and structured bounded diagnostics.
            & go test -json -p 1 -count=1 -timeout 60m ./... *> $full
            $result=$LASTEXITCODE
            $sw.Stop()
            if($result-ne0){
              $d=(Get-FileHash -LiteralPath $full -Algorithm SHA256).Hash.ToLowerInvariant()
              $pkgs=[System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
              $tests=[System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
              $failEvents=0
              foreach($line in [IO.File]::ReadLines($full)){
                if($line -notlike '*"Action":"fail"*'){continue}
                try{$entry=ConvertFrom-Json -InputObject $line -ErrorAction Stop}
                catch{continue}
                if($entry.Action -cne 'fail'){continue}
                $pkg=[string]$entry.Package
                if($pkg -cnotmatch '^k-terminal(?:/[A-Za-z0-9_.-]+)*$'){continue}
                $failEvents++
                [void]$pkgs.Add($pkg)
                $test=([string]$entry.Test -split '/')[0]
                if($test -cmatch '^Test[A-Za-z0-9_]{1,110}$'){
                  [void]$tests.Add(($pkg+':'+$test))
                }
              }
              Write-Host ('KTERM_PR96_REGRESSION_DIAGNOSTIC=CLASSIFIED;FAIL_EVENTS='+$failEvents+
                 ';FAILED_PACKAGES='+$pkgs.Count+';FAILED_ROOT_TESTS='+$tests.Count+
                 ';NO_PRIVATE_TEST_OUTPUT=TRUE')
              foreach($pkg in @($pkgs|Sort-Object|Select-Object -First 8)){
                Write-Host ('KTERM_PR96_FAILED_PACKAGE='+$pkg)
              }
              foreach($testName in @($tests|Sort-Object|Select-Object -First 12)){
                Write-Host ('KTERM_PR96_FAILED_TEST='+$testName)
              }
              if($failEvents-eq0){
                Write-Host 'KTERM_PR96_REGRESSION_DIAGNOSTIC=NO_ALLOWLISTED_FAIL_EVENTS;CAUSE_UNCLASSIFIED'
              }
              Write-Host ('KTERM_PR96_FULL_REGRESSION=FAIL;EXIT='+$result+';MS='+$sw.ElapsedMilliseconds+';PRIVATE_LOG_SHA256='+$d)
              throw 'KTERM_PR96_FULL_REGRESSION_FAILED'
            }
            Write-Host ('KTERM_PR96_FULL_REGRESSION=PASS;MS='+$sw.ElapsedMilliseconds+';SOURCE='+$env:KTERM_SHA)
            $sw.Restart()
            & go vet ./... *> (Join-Path $root 'go-vet.private.log')
            $result=$LASTEXITCODE
            $sw.Stop()
            if($result-ne0){
              $d=(Get-FileHash -LiteralPath (Join-Path $root 'go-vet.private.log') -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host ('KTERM_PR96_GO_VET=FAIL;EXIT='+$result+';MS='+$sw.ElapsedMilliseconds+';PRIVATE_LOG_SHA256='+$d)
              throw 'KTERM_PR96_GO_VET_FAILED'
            }
            Write-Host ('KTERM_PR96_GO_VET=PASS;MS='+$sw.ElapsedMilliseconds)
          }finally{Pop-Location}
          if((& git -C $src rev-parse HEAD | Out-String).Trim() -cne $env:KTERM_SHA -or
             @(& git -C $src status --porcelain --untracked-files=no).Count-ne0){
            throw 'KTERM_PR96_POST_TEST_SOURCE_DRIFT'
          }
      - name: Assemble original eight binaries and independently verify first-use ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr96-firstuse-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'source'
          $out=Join-Path $root 'artifact-only'
          $script=Join-Path $src 'tools/qualification/p5_assemble_source_bound_firstuse.ps1'
          foreach($name in @('git.exe','go.exe','python.exe','powershell.exe')){
            $present=$null-ne(Get-Command $name -CommandType Application -ErrorAction SilentlyContinue)
            Write-Host ('KTERM_PR96_PACKAGE_TOOL_PRESENT_'+$name.ToUpperInvariant()+'='+$present)
          }
          # Verify the same tools resolve inside the Windows PowerShell 5.1 child.
          # This is GET-only and prints only booleans.
          $probe=Join-Path $root 'winps-command-probe.private.log'
          $cmd='foreach($name in @("git.exe","go.exe","python.exe","powershell.exe")){Write-Output ($name+":"+[bool](Get-Command $name -CommandType Application -ErrorAction SilentlyContinue))}'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $cmd *> $probe
          $probeSuccess=$LASTEXITCODE-eq0
          Write-Host ('KTERM_PR96_WINDOWS_POWERSHELL_TOOL_PROBE=EXIT_'+$LASTEXITCODE)
          if($probeSuccess){
            $safe=@([IO.File]::ReadAllLines($probe))
            foreach($row in $safe){
              if($row -match '^(git|go|python|powershell)\.exe:(True|False)$'){
                Write-Host ('KTERM_PR96_WINPS_'+$Matches[1].ToUpperInvariant()+'='+$Matches[2])
              }
            }
          }
          # Parse exactly the Git blob in Windows PowerShell 5.1 before attempting
          # any build. Emit only error IDs/line numbers, never raw private output.
          $env:KTERM_PR96_SCRIPT_PATH=$script
          $parseCmd='$t=$null;$e=$null;[System.Management.Automation.Language.Parser]::ParseFile($env:KTERM_PR96_SCRIPT_PATH,[ref]$t,[ref]$e)|Out-Null;if($e.Count){foreach($v in $e|Select-Object -First 3){Write-Output ("PARSE_ID="+$v.ErrorId+";LINE="+$v.Extent.StartLineNumber)};exit 1}else{Write-Output "PASS"}'
          $parseLog=Join-Path $root 'assembler-parse.private.log'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $parseCmd *> $parseLog
          $parseExit=$LASTEXITCODE
          $valid=@([IO.File]::ReadAllLines($parseLog)|Where-Object{$_ -eq 'PASS' -or $_ -match '^PARSE_ID=[A-Za-z0-9_]+;LINE=[0-9]{1,3}$'})
          foreach($line in $valid|Select-Object -First 3){
            Write-Host ('KTERM_PR96_ASSEMBLER_PARSE='+$line)
          }
          if($parseExit-ne0 -or $valid -cnotcontains 'PASS'){
            throw 'KTERM_PR96_ASSEMBLER_PARSER_REFUSED'
          }
          $env:KTERM_PR96_PACKAGE_SOURCE=$src
          $env:KTERM_PR96_PACKAGE_OUT=$out
          # Catch exact-source failures inside the same Windows PowerShell 5.1
          # process and print only its intrinsic exception class and line number.
          $cmd='$ErrorActionPreference="Stop";try{if(-not(Test-Path -LiteralPath $env:KTERM_PR96_SCRIPT_PATH -PathType Leaf)){throw "KTERM_PR96_SCRIPT_MISSING"};& $env:KTERM_PR96_SCRIPT_PATH -ExpectedSourceSha $env:KTERM_SHA -ExpectedTreeSha $env:KTERM_TREE -SourceRoot $env:KTERM_PR96_PACKAGE_SOURCE -OutputDirectory $env:KTERM_PR96_PACKAGE_OUT}catch{$n=[string]$_.Exception.CommandName;$k="UNKNOWN";if($n -ceq $env:KTERM_PR96_SCRIPT_PATH){$k="ASSEMBLER_FILE"}elseif($n -cmatch "^[A-Za-z][A-Za-z0-9_.-]{0,48}$" -and $n -cnotmatch "(?i)api|key|secret|token|pass|auth|coinbase|private|account|wallet"){$k=$n};if($k -ceq "UNKNOWN"){if([string]::IsNullOrEmpty($n)){$k="EMPTY"}elseif($n -match "^[A-Za-z]:[/\\]"){$k="ABSOLUTE_PATH"}elseif($n -match "[/\\]"){$k="RELATIVE_PATH"}elseif($n -match "\s"){$k="MULTI_WORD_COMMAND"}else{$k="OTHER_NAME"}};$stack=[string]$_.ScriptStackTrace;$frame=[regex]::Match($stack,"p5_assemble_source_bound_firstuse\.ps1:\s*line\s+([0-9]{1,3})");Write-Output ("KTERM_PR96_PRIVATE_EXCEPTION_TYPE="+$_.Exception.GetType().Name);Write-Output ("KTERM_PR96_PRIVATE_EXCEPTION_LINE="+$_.InvocationInfo.ScriptLineNumber);Write-Output ("KTERM_PR96_PRIVATE_EXCEPTION_COMMAND="+$k);if($frame.Success){Write-Output ("KTERM_PR96_PRIVATE_EXCEPTION_SOURCE_LINE="+$frame.Groups[1].Value)};exit 1}'
          $clock=[Diagnostics.Stopwatch]::StartNew()
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -STA -Command $cmd *> (Join-Path $root 'package.private.log')
          $exit=$LASTEXITCODE
          $clock.Stop()
          if($exit-ne0){
            $log=Join-Path $root 'package.private.log'
            $digest=(Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant()
            # Keep the raw private log off GitHub, expose only fixed-format
            # fail-closed assembler codes and non-sensitive failure classes.
            $raw=[IO.File]::ReadAllText($log)
            foreach($line in [IO.File]::ReadLines($log)){
              if($line -match '^KTERM_PR96_PRIVATE_EXCEPTION_TYPE=([A-Za-z]{2,50}(Exception|Error))$'){
                Write-Host ('KTERM_PR96_EXCEPTION_TYPE='+$Matches[1])
              }elseif($line -match '^KTERM_PR96_PRIVATE_EXCEPTION_LINE=([0-9]{1,3})$'){
                Write-Host ('KTERM_PR96_EXCEPTION_LINE='+$Matches[1])
              }elseif($line -match '^KTERM_PR96_PRIVATE_EXCEPTION_COMMAND=([A-Za-z][A-Za-z0-9._-]{0,48})$'){
                Write-Host ('KTERM_PR96_EXCEPTION_COMMAND='+$Matches[1])
              }elseif($line -match '^KTERM_PR96_PRIVATE_EXCEPTION_SOURCE_LINE=([0-9]{1,3})$'){
                Write-Host ('KTERM_PR96_EXCEPTION_SOURCE_LINE='+$Matches[1])
              }
            }
            $codes=@([regex]::Matches($raw,'P5_PACKAGE_[A-Z0-9_]{4,80}')|
              ForEach-Object{$_.Value}|Sort-Object -Unique)
            foreach($code in $codes|Select-Object -First 6){
              Write-Host ('KTERM_PR96_PACKAGING_FAILURE_CODE='+$code)
            }
            if($codes.Count-eq0){
              $allowed=@('go','go.exe','git','git.exe','python','python.exe',
                'powershell','powershell.exe','Get-Item','Get-FileHash','Get-Command',
                'Get-Process','Get-Content','ConvertFrom-Json','Join-Path','Split-Path',
                'Sort-Object','Test-Path','Assert-Plain','Hash','Get-ChildItem')
              $term=[regex]::Match($raw,"(?i)(?:the\s+)?term\s+['\u2018\u2019]?(?<identifier>[^'\r\n\u2018\u2019]{1,80}?)['\u2018\u2019]?\s+is not recognized")
              if($term.Success -and $term.Groups["identifier"].Value -cin $allowed){
                Write-Host ('KTERM_PR96_UNAVAILABLE_COMMAND='+$term.Groups["identifier"].Value)
              }elseif($term.Success){
                $name=$term.Groups["identifier"].Value
                if($name -cmatch '^[A-Za-z][A-Za-z0-9._-]{0,48}$' -and
                   $name -cnotmatch '(?i)api|key|secret|token|pass|auth|coinbase|private|account|wallet'){
                  Write-Host ('KTERM_PR96_UNKNOWN_IDENTIFIER='+$name)
                }else{
                  Write-Host ('KTERM_PR96_UNKNOWN_IDENTIFIER_SHA256='+
                    [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($name))).ToLowerInvariant())
                }
              }else{
                Write-Host 'KTERM_PR96_UNAVAILABLE_COMMAND=NO_LITERAL_IDENTIFIER'
              }
              $line=[regex]::Match($raw,'p5_assemble_source_bound_firstuse\.ps1:(\d{1,3})')
              if($line.Success){
                Write-Host ('KTERM_PR96_ASSEMBLER_FAIL_LINE='+$line.Groups[1].Value)
              }
              $kind='UNCLASSIFIED'
              if($raw -match 'ParserError|Unexpected token|Missing closing'){
                $kind='POWERSHELL_PARSER_ERROR'
              }elseif($raw -match 'is not recognized as the name of a cmdlet'){
                $kind='COMMAND_UNAVAILABLE'
              }elseif($raw -match 'Cannot find path|Could not find'){
                $kind='FILE_MISSING'
              }elseif($raw -match 'Access is denied|UnauthorizedAccessException'){
                $kind='ACCESS_DENIED'
              }elseif($raw -match 'Method invocation failed|MethodException'){
                $kind='POWERSHELL_METHOD_ERROR'
              }
              Write-Host ('KTERM_PR96_PACKAGING_FAILURE_CLASS='+$kind)
            }
            Write-Host ('KTERM_PR96_FIRSTUSE_PACKAGE=FAIL;EXIT='+$exit+
               ';MS='+$clock.ElapsedMilliseconds+';PRIVATE_LOG_SHA256='+$digest+
               ';REGRESSION=NOT_RUN_CANDIDATE')
            throw 'KTERM_PR96_FIRSTUSE_PACKAGE_FAILED'
          }
          $proof=Get-Content -LiteralPath (Join-Path $out 'FIRST-USE-RECEIPT.json') -Raw|ConvertFrom-Json
          $zip=Join-Path $out $proof.archive
          if($proof.source_sha -cne $env:KTERM_SHA -or $proof.source_tree -cne $env:KTERM_TREE -or
             $proof.binaries -ne 8 -or $proof.roundtrip -cne 'PASS' -or
             $proof.deployment -cne 'NOT_AUTHORIZED' -or
             $proof.field_performance -cne 'UNVERIFIED' -or
             $proof.original_desktop_smoke -cne 'NOT_RUN' -or
             (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne $proof.archive_sha256){
            throw 'KTERM_PR96_PACKAGE_RECEIPT_INVALID'
          }
          $regressionProof='PASS_CURRENT_CANDIDATE'
          Write-Host ('KTERM_PR96_FIRSTUSE_PACKAGE=PASS;ZIP_SHA256='+$proof.archive_sha256+
            ';BINARIES='+$proof.binaries+';FILES='+$proof.files+
            ';MS='+$clock.ElapsedMilliseconds+';FULL_REGRESSION='+$regressionProof+
            ';NEGATIVE_CONTROLS=PASS;WPF_SMOKE=NOT_RUN'+
            ';LIVE_ORDERS=0;NO_INSTALL=TRUE;FIELD=UNVERIFIED'+
            ';PRIVATE_BINARIES_NOT_UPLOADED=TRUE')
      - name: Validate extracted package WPF windows offline without launching application
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:K_TERMINAL_EXECUTION_MODE -cne 'PAPER' -or
             $env:K_TERMINAL_P5_LATENCY -cne '0' -or
             $env:K_TERMINAL_NATIVE_TIMING -cne '0'){
            throw 'KTERM_PR96_WPF_DISARMED_CONTEXT_REFUSED'
          }
          foreach($name in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
            'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET')){
            if([Environment]::GetEnvironmentVariable($name)){
              throw 'KTERM_PR96_WPF_BROKER_CONTEXT_REFUSED'
            }
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr96-firstuse-'+$env:GITHUB_RUN_ID)
          $out=Join-Path $root 'artifact-only'
          $proof=Get-Content -LiteralPath (Join-Path $out 'FIRST-USE-RECEIPT.json') -Raw|ConvertFrom-Json
          if($proof.source_sha -cne $env:KTERM_SHA -or $proof.source_tree -cne $env:KTERM_TREE -or
             $proof.roundtrip -cne 'PASS' -or $proof.deployment -cne 'NOT_AUTHORIZED'){
            throw 'KTERM_PR96_WPF_PACKAGE_RECEIPT_REFUSED'
          }
          $zip=Join-Path $out ([string]$proof.archive)
          if((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne $proof.archive_sha256){
            throw 'KTERM_PR96_WPF_PACKAGE_SHA_REFUSED'
          }
          $sandbox=Join-Path $root 'wpf-hidden-package'
          if(Test-Path -LiteralPath $sandbox){throw 'KTERM_PR96_WPF_STAGING_NOT_FRESH'}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip,$sandbox)
          foreach($name in @('config.json','data','reporting','notifications','logs')){
            if(Test-Path -LiteralPath (Join-Path $sandbox $name)){
              throw 'KTERM_PR96_WPF_PRIVATE_STATE_REFUSED'
            }
          }
          $winps=@'
          param([Parameter(Mandatory)][string]$PackageRoot)
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($PSVersionTable.PSEdition -cne 'Desktop'){throw 'KTERM_WPF_DESKTOP_EDITION_REQUIRED'}
          foreach($cmd in @('K-Terminal.exe','K-Terminal-Engine.exe')){
            if(-not(Test-Path -LiteralPath (Join-Path $PackageRoot $cmd) -PathType Leaf)){
              throw 'KTERM_WPF_PACKAGE_BINARY_MISSING'
            }
          }
          if(Test-Path -LiteralPath (Join-Path $PackageRoot 'config.json')){
            throw 'KTERM_WPF_INSTALLED_CONFIGURATION_REFUSED'
          }
          . (Join-Path $PackageRoot 'appearance.ps1')
          Initialize-KTerminalAppearance $PackageRoot
          foreach($spec in @(
            [pscustomobject]@{File='application-launch.ps1';Required=@('ContinueButton','PaperMode','LiveMode','CancelButton')},
            [pscustomobject]@{File='dashboard-ui.ps1';Required=@('EventHistoryButton','ChartAddTabButton')}
          )){
            $source=[IO.File]::ReadAllText((Join-Path $PackageRoot $spec.File))
            $pattern='(?ms)^\[xml\]\$xaml\s*=\s*@' + [char]39 + '\r?\n(.*?)\r?\n' + [char]39 + '@'
            $match=[regex]::Match($source,$pattern)
            if(-not $match.Success){throw 'KTERM_WPF_XAML_LITERAL_MISSING'}
            $window=Read-KTerminalThemedXaml ([xml]$match.Groups[1].Value)
            try{
              if(-not ($window -is [Windows.Window]) -or $window.IsVisible){
                throw 'KTERM_WPF_HIDDEN_WINDOW_REQUIRED'
              }
              foreach($control in $spec.Required){
                if($null-eq$window.FindName($control)){
                  throw 'KTERM_WPF_REQUIRED_CONTROL_MISSING'
                }
              }
              $window.Measure([Windows.Size]::new(960,900))
              $window.Arrange([Windows.Rect]::new(0,0,960,900))
              $window.UpdateLayout()
            }finally{
              if($null-ne$window){$window.Close()}
            }
          }
          if(Test-Path -LiteralPath (Join-Path $PackageRoot 'config.json')){
            throw 'KTERM_WPF_UNEXPECTED_CONFIGURATION_CREATED'
          }
          Write-Output 'KTERM_PR96_PACKAGED_WPF_HIDDEN_WINDOWS=PASS;WINDOWS=2;NO_LAUNCH=TRUE;NO_BROKER=TRUE'
          '@
          $probe=Join-Path $root 'wpf-hidden-probe.private.ps1'
          [IO.File]::WriteAllText($probe,$winps,[Text.UTF8Encoding]::new($false))
          $log=Join-Path $root 'wpf-hidden-probe.private.log'
          $clock=[Diagnostics.Stopwatch]::StartNew()
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -STA -File $probe -PackageRoot $sandbox *> $log
          $exit=$LASTEXITCODE
          $clock.Stop()
          $digest=(Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant()
          if($exit-ne0){
            $raw=[IO.File]::ReadAllText($log)
            $codes=@([regex]::Matches($raw,'KTERM_WPF_[A-Z0-9_]{4,80}')|
              ForEach-Object{$_.Value}|Sort-Object -Unique)
            foreach($code in $codes|Select-Object -First 4){
              Write-Host ('KTERM_PR96_PACKAGED_WPF_FAILURE_CODE='+$code)
            }
            if($codes.Count-eq0){Write-Host 'KTERM_PR96_PACKAGED_WPF_FAILURE_CODE=UNCLASSIFIED'}
            Write-Host ('KTERM_PR96_PACKAGED_WPF=FAIL;MS='+$clock.ElapsedMilliseconds+
              ';PRIVATE_LOG_SHA256='+$digest+';NO_RAW_PRIVATE_OUTPUT=TRUE')
            throw 'KTERM_PR96_PACKAGED_WPF_HIDDEN_REVIEW_FAILED'
          }
          if(-not([IO.File]::ReadAllText($log)).Contains('KTERM_PR96_PACKAGED_WPF_HIDDEN_WINDOWS=PASS')){
            throw 'KTERM_PR96_PACKAGED_WPF_RECEIPT_MISSING'
          }
          Write-Host ('KTERM_PR96_PACKAGED_WPF=PASS;WINDOWS=2;MS='+$clock.ElapsedMilliseconds+
            ';ZIP_SHA256='+$proof.archive_sha256+
            ';NO_APP_EXECUTION=TRUE;NO_LIVE_TRADING=TRUE;FIRST_USE_LAUNCH=NOT_RUN'+
            ';PRIVATE_LOG_SHA256='+$digest)
      - name: Test packaged compiled UI and bounded early startup failures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:K_TERMINAL_EXECUTION_MODE -cne 'PAPER' -or
             $env:K_TERMINAL_P5_LATENCY -cne '0' -or
             $env:K_TERMINAL_NATIVE_TIMING -cne '0'){
            throw 'KTERM_PR96_UI_LIFECYCLE_DISARM_REFUSED'
          }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET')){
            if([Environment]::GetEnvironmentVariable($key)){
              throw 'KTERM_PR96_UI_LIFECYCLE_BROKER_ENV_REFUSED'
            }
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr96-firstuse-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'source'
          $sandbox=Join-Path $root 'wpf-hidden-package'
          $fixtureTemp=Join-Path $root 'ui-fixture-temp'
          [void][IO.Directory]::CreateDirectory($fixtureTemp)
          $env:TEMP=$fixtureTemp;$env:TMP=$fixtureTemp
          foreach($mode in @('ui','lifecycle')){
            $log=Join-Path $root ($mode+'.private.log')
            $clock=[Diagnostics.Stopwatch]::StartNew()
            if($mode -ceq 'ui'){
              & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -STA -File (Join-Path $src 'verification/test-ui-runtime.ps1') -Root $sandbox -OutputDirectory (Join-Path $root 'ui-verifier-results') *> $log
            }else{
              & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -STA -File (Join-Path $src 'verification/test-launch-lifecycle.ps1') -Root $sandbox *> $log
            }
            $rc=$LASTEXITCODE;$clock.Stop()
            $digest=(Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant()
            if($rc-ne0){
              Write-Host ('KTERM_PR96_UI_LIFECYCLE_'+$mode.ToUpperInvariant()+'=FAIL;EXIT='+$rc+
                ';MS='+$clock.ElapsedMilliseconds+';PRIVATE_LOG_SHA256='+$digest)
              throw 'KTERM_PR96_UI_LIFECYCLE_FAILED'
            }
            Write-Host ('KTERM_PR96_UI_LIFECYCLE_'+$mode.ToUpperInvariant()+'=PASS;MS='+
              $clock.ElapsedMilliseconds+';PRIVATE_LOG_SHA256='+$digest)
          }
      - name: Fresh portable package first-use PAPER prelaunch smoke with bounded lifetime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:K_TERMINAL_EXECUTION_MODE -cne 'PAPER' -or
             $env:K_TERMINAL_P5_LATENCY -cne '0' -or
             $env:K_TERMINAL_NATIVE_TIMING -cne '0' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1'){
            throw 'KTERM_PR96_FIRSTUSE_OWNER_OR_DISARM_REFUSED'
          }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET')){
            if([Environment]::GetEnvironmentVariable($key)){
              throw 'KTERM_PR96_FIRSTUSE_CREDENTIAL_ENV_REFUSED'
            }
          }
          $session=[Diagnostics.Process]::GetCurrentProcess().SessionId
          if($session -eq 0 -or
             @((Get-Process explorer -ErrorAction SilentlyContinue)|
               Where-Object{$_.SessionId -eq $session}).Count -eq 0){
            throw 'KTERM_PR96_FIRSTUSE_INTERACTIVE_SESSION_UNQUALIFIED'
          }
          if(@(Get-Process -Name 'K-Terminal*' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_PR96_FIRSTUSE_EXISTING_APPLICATION_PROCESS_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr96-firstuse-'+$env:GITHUB_RUN_ID)
          $sandbox=Join-Path $root 'wpf-hidden-package'
          $out=Join-Path $root 'artifact-only'
          $receipt=Get-Content -LiteralPath (Join-Path $out 'FIRST-USE-RECEIPT.json') -Raw|ConvertFrom-Json
          $zip=Join-Path $out ([string]$receipt.archive)
          if($receipt.source_sha -cne $env:KTERM_SHA -or
             $receipt.source_tree -cne $env:KTERM_TREE -or
             $receipt.roundtrip -cne 'PASS' -or
             $receipt.default_authority -ceq 'LIVE' -or
             (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne $receipt.archive_sha256){
            throw 'KTERM_PR96_FIRSTUSE_PACKAGE_IDENTITY_REFUSED'
          }
          if(-not (Test-Path -LiteralPath (Join-Path $sandbox 'application-launch.ps1') -PathType Leaf) -or
              (Test-Path -LiteralPath (Join-Path $sandbox 'config.json')) -or
              (Test-Path -LiteralPath (Join-Path $sandbox 'data'))){
            throw 'KTERM_PR96_FIRSTUSE_PACKAGE_STATE_REFUSED'
          }
          $data=Join-Path $sandbox 'data'
          [void][IO.Directory]::CreateDirectory($data)
          # Cold first-use: do not preseed PAPER preferences. Product must
          # select PAPER on its own, without config or broker credentials.
          if(Test-Path -LiteralPath (Join-Path $data 'ui-preferences-smoke.json')){
            throw 'KTERM_PR96_SMOKE_PREFERENCES_NOT_FRESH'
          }
          $script=Join-Path $sandbox 'application-launch.ps1'
          $psi=[Diagnostics.ProcessStartInfo]::new()
          $psi.FileName=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $psi.Arguments='-NoProfile -NonInteractive -ExecutionPolicy Bypass -STA -File "'+$script+
              '" -SmokeTest -SmokeTestDelayMs 500'
          $psi.WorkingDirectory=$sandbox
          $psi.UseShellExecute=$false
          $psi.CreateNoWindow=$true
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          $log=Join-Path $root 'firstuse-paper-smoke.private.log'
          $clock=[Diagnostics.Stopwatch]::StartNew()
          $proc=$null;$timedOut=$false;$exit=-1
          try{
            $proc=[Diagnostics.Process]::Start($psi)
            if($null-eq$proc){throw 'KTERM_PR96_SMOKE_PROCESS_NOT_STARTED'}
            $stdout=$proc.StandardOutput.ReadToEndAsync()
            $stderr=$proc.StandardError.ReadToEndAsync()
            $timedOut=-not $proc.WaitForExit(30000)
            if($timedOut){
              $proc.Kill()
              [void]$proc.WaitForExit(5000)
            }else{$exit=$proc.ExitCode}
            [IO.File]::WriteAllText($log,$stdout.GetAwaiter().GetResult()+
                $stderr.GetAwaiter().GetResult(),[Text.UTF8Encoding]::new($false))
          }finally{
            if($null-ne$proc){
              if(-not $proc.HasExited){$proc.Kill();[void]$proc.WaitForExit(5000)}
              $proc.Dispose()
            }
            $clock.Stop()
          }
          if($timedOut){throw 'KTERM_PR96_FIRSTUSE_SMOKE_TIMEOUT_30S'}
          $digest=(Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant()
          if($exit-ne0){
            Write-Host ('KTERM_PR96_FIRSTUSE_PRELAUNCH=FAIL;EXIT='+$exit+
              ';MS='+$clock.ElapsedMilliseconds+';PRIVATE_LOG_SHA256='+$digest)
            throw 'KTERM_PR96_FIRSTUSE_PRELAUNCH_PROCESS_FAILED'
          }
          $launchPath=Join-Path $data '.application-launch-smoke.json'
          $strategyPath=Join-Path $data '.strategy-launch-smoke.json'
          if(-not(Test-Path -LiteralPath $launchPath -PathType Leaf) -or
             -not(Test-Path -LiteralPath $strategyPath -PathType Leaf)){
            throw 'KTERM_PR96_FIRSTUSE_PAPER_SESSION_NOT_PUBLISHED'
          }
          $sessionData=Get-Content -LiteralPath $launchPath -Raw|ConvertFrom-Json
          $strategy=Get-Content -LiteralPath $strategyPath -Raw|ConvertFrom-Json
          if($sessionData.schema_version -ne 2 -or
             $sessionData.execution_state -cne 'DISARMED' -or
             $sessionData.mode -cne 'PAPER' -or
             $sessionData.credential_source -cne 'NONE' -or
             [bool]$sessionData.native_signals_enabled -or
             $sessionData.PSObject.Properties['preflight'] -or
             $strategy.schema_version -ne 1 -or
             (Test-Path -LiteralPath (Join-Path $sandbox 'config.json')) -or
             (Test-Path -LiteralPath (Join-Path $data '.application-launch-session.json')) -or
             (Test-Path -LiteralPath (Join-Path $data '.strategy-launch-session.json'))){
            throw 'KTERM_PR96_FIRSTUSE_PAPER_SESSION_SAFETY_REFUSED'
          }
          if(@(Get-Process -Name 'K-Terminal*' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_PR96_FIRSTUSE_PROCESS_LEFT_RUNNING_REFUSED'
          }
          Write-Host ('KTERM_PR96_FIRSTUSE_PAPER_PRELAUNCH=PASS;EXIT=0;MS='+$clock.ElapsedMilliseconds+
            ';SOURCE='+$env:KTERM_SHA+';ZIP_SHA256='+$receipt.archive_sha256+
            ';SMOKE_SESSION=DISARMED_PAPER;COLD_DEFAULT=PAPER;CONFIG_CREATED=FALSE;LIVE_ORDERS=0'+
            ';ENGINE_LAUNCHED=FALSE;DASHBOARD_LAUNCHED=FALSE;REAL_EXE_FIRST_USE=NOT_RUN'+
            ';CLEAN_EXIT=TRUE;PRIVATE_LOG_SHA256='+$digest)
