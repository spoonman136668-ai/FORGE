name: ITD-02 MG03 original DoorKey equal public seven action Wingless Go and Ygg R12
on:
  push:
    branches:
      - research/itd02-mg03-equal-public-doorkey-seven-20261028
permissions:
  contents: read
jobs:
  authentic-seven-action-door-key-paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Git newline source policy
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact-source clean checkout without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original Wingless Go 1.25.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Full source pinned true Farama DoorKey and two separate native policies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash research/lcrm01/mg03_ci.sh
      - name: Keep both independent process evidence and errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-mg03-original-door-key-seven-action-wingless-go-ygg-r12
          path: |
            ${{ runner.temp }}/mg03/first.json
            ${{ runner.temp }}/mg03/second.json
            ${{ runner.temp }}/mg03/comparison.json
            ${{ runner.temp }}/mg03/first.log
            ${{ runner.temp }}/mg03/second.log
          retention-days: 30
          if-no-files-found: warn
