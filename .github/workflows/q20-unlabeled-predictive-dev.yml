name: Q20 unlabeled intervention predictive state — frozen Windows Linux
on:
  push:
    branches: [research/q20-unlabeled-predictive-state-20261022]
    paths: [.github/workflows/q20-unlabeled-predictive-dev.yml]
permissions:
  contents: read
concurrency:
  group: q20-frozen-label-free-fit-dev-once
  cancel-in-progress: false
jobs:
  source-free-dev:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hosted-linux
            host: '["ubuntu-24.04"]'
          - name: hosted-windows
            host: '["windows-2022"]'
    runs-on: ${{ fromJSON(matrix.host) }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require exact frozen role-blind source and four additive paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $baseline='ecbd672f0b3bba34d6e92d2f1475ea6dc80f605f'
          $parent='4ee253cfe6b2ad3f5d79ea581c03a07472f6e2fa'
          $actual=(& git rev-parse HEAD^).Trim()
          if($LASTEXITCODE-ne0 -or $actual-cne$parent){throw 'Q20_PREEXECUTION_CODE_SHA_DRIFT'}
          $ancestor=(& git merge-base $baseline HEAD).Trim()
          if($LASTEXITCODE-ne0 -or $ancestor-cne$baseline){throw 'Q20_PROTECTED_BASELINE_DRIFT'}
          $expected=@(
            '.github/workflows/q20-unlabeled-predictive-dev.yml',
            'research/q20_unlabeled/FROZEN_PROTOCOL.json',
            'research/q20_unlabeled/experiment.py',
            'research/q20_unlabeled/test_experiment.py'
          )
          $changed=@(& git diff --name-only $baseline HEAD)
          if($LASTEXITCODE-ne0 -or (Compare-Object $expected $changed)){
            throw 'Q20_FROZEN_FOUR_ADDITIONS_ONLY'
          }
          foreach($p in @(
            @('research/q20_unlabeled/FROZEN_PROTOCOL.json','b517e5fc03680bdd04ec357e6d84ebdf3cb3b4c8'),
            @('research/q20_unlabeled/experiment.py','cd638adba88804fa24980a7400f44d7beafd1c99'),
            @('research/q20_unlabeled/test_experiment.py','5f4a1fbeac0fa3d5720262d70106d184a30ef5c0')
          )){
            $one=(& git rev-parse ('HEAD:'+$p[0])).Trim()
            $two=(& git hash-object --no-filters -- $p[0]).Trim()
            if($LASTEXITCODE-ne0 -or $one-cne$p[1] -or $two-cne$p[1]){
              throw ('Q20_PINNED_BLOB_OR_WORKTREE_BYTE_DRIFT_'+$p[0])
            }
          }
          Write-Host 'Q20_FROZEN_PROTOCOL_AND_SOURCE_IDENTITY=PASS'
      - name: Focused unsupervised training custody equivariance and EM controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & python -B -m unittest discover -s research/q20_unlabeled -p test_experiment.py -v
          if($LASTEXITCODE-ne0){throw 'Q20_FOCUSED_TEST_FAILURE'}
          & python -B research/q20_unlabeled/experiment.py --mode selftest
          if($LASTEXITCODE-ne0){throw 'Q20_UNSUPERVISED_ROLE_SELFTEST_FAILURE'}
          Write-Host 'Q20_ROLE_BLIND_FOCUSED_GUARDS=PASS'
      - name: Train predictive state, RNN, logistic, symbolic and unlabeled HMM; evaluate oracle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP ('q20-'+$env:RUNNER_OS+'-'+$env:GITHUB_RUN_ID+'.log')
          if(Test-Path -LiteralPath $log){throw 'Q20_EXISTING_RECEIPT'}
          & python -B research/q20_unlabeled/experiment.py --mode train-dev 2>&1 |
            Tee-Object -FilePath $log
          if($LASTEXITCODE-ne0){throw 'Q20_FROZEN_REAL_TRAIN_DEV_FAILED'}
          $lines=@(Get-Content -LiteralPath $log |
            Where-Object {$_ -like 'Q20_RESULT_JSON=*'})
          if($lines.Count-ne1){throw 'Q20_RESULT_RECEIPT_MISSING_OR_DUPLICATE'}
          $receipt=$lines[0].Substring(16)|ConvertFrom-Json
          if($receipt.fit_episodes-ne192 -or $receipt.dev_episodes-ne64 -or
             $receipt.unfamiliar_held_family_generated-ne$false -or
             $receipt.original_scientific_source_episodes-ne0 -or
             $receipt.protected_first_use-ne$false -or
             $receipt.supervised_hidden_labels_used-ne$false -or
             $receipt.only_public_future_observation_labels_used-ne$true -or
             $receipt.oracle_has_privileged_world_identifiers-ne$true){
            throw 'Q20_CUSTODY_OR_SOURCEFREE_SCOPE_FALSE'
          }
          Write-Host ('Q20_RECEIPT_LOG_SHA256='+((Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant()))
          Write-Host 'Q20_FIVE_TRAINED_CONTROLS_AND_PRIVILEGED_ORACLE_EVALUATED=PASS'
          Write-Host 'Q20_HELD_ORIGINAL_SOURCE_PROTECTED_FIRST_USE=ZERO'
      - name: Fail closed on source mutation and historical authority bypass
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dirty=@(& git status --porcelain --untracked-files=all)
          if($LASTEXITCODE-ne0 -or $dirty.Count-ne0){throw 'Q20_WORKTREE_WAS_MUTATED'}
          Write-Host 'Q20_REPOSITORY_SOURCE_CLEAN=PASS'
          Write-Host 'Q20_FULL_FORGE_G61_AND_CKB_SCIENTIFIC_ADMISSION=NOT_CLAIMED'
          Write-Host 'Q20_ORIGINAL_SOURCE_AND_UNFAMILIAR_FIRST_USE=BLOCKED'
