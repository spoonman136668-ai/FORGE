name: Mass Research K4I FIT information sufficiency and public transfer
on:
  push:
    branches: [research/mass-lcrm01-k4i-infosufficiency-20261024]
permissions:
  contents: read
jobs:
  prospective-information-sufficiency:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Execute frozen K4I real tasks and context-conditioned controls
        run: bash research/lcrm01/k4i_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-k4i-original-fit-information-public-evidence
          path: |
            ${{ runner.temp }}/k4i/original-fit-information.json
            ${{ runner.temp }}/k4i/original-fit-information.log
          if-no-files-found: warn
          retention-days: 90
