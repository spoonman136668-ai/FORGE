name: FORGE CPU LLM Evaluation G92 archived receipt Linux Windows final qualification

on:
  push:
    branches: [research/cpu-llm-g92-fused-newgelu-gpt2-20261031]
    paths:
      - 'docs/research/CPU-G92-GPT2-NATIVE-FUSED-NEWGELU-ARTIFACT-RECEIPT-20261031.json'
      - 'docs/research/CPU-G92-GPT2-NATIVE-FUSED-NEWGELU-FINAL-QUALIFICATION-TRIGGER-20261031.md'

permissions:
  contents: read

concurrency:
  group: forge-cpu-llm-g92-archived-receipt-regression
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable G92 result, artifact and original source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:research/llm_g54)" = "204af0f5502269be4288c6c56f689526d03c77fb"
          test "$(git rev-parse HEAD:research/llm_g55)" = "2e40d5bd574bf9f57f81c4ecf5fd611f9ef753e3"
          test "$(git rev-parse HEAD:research/llm_g56)" = "7a728365dd6bdef415c8427d2a87791f6049ab2a"
          test "$(git rev-parse HEAD:research/llm_g57)" = "dbabd811207e52764568fc4100bb7fa151255cff"
          test "$(git rev-parse HEAD:research/llm_g58)" = "9c391b65ae0c1275191c3856d967f46ec5597038"
          test "$(git rev-parse HEAD:research/llm_g59)" = "693d705b2e5f42886660ebc30e73ee73d5f6d911"
          test "$(git rev-parse HEAD:research/llm_g60)" = "7681d55047cb7793542b1f340d2a1eaa15617f67"
          test "$(git rev-parse HEAD:research/llm_g61)" = "f1bc119d185d301e5b80929a75cbacf66a48d79c"
          test "$(git rev-parse HEAD:research/llm_g62)" = "f7345e7250e242f7b30964b486ce3c91640b34cd"
          test "$(git rev-parse HEAD:research/llm_g63)" = "651d9e92106c43c594eb2e9486f08446b902eee9"
          test "$(git rev-parse HEAD:research/llm_g64)" = "59b6203707a891fe36a02d0e83d1c173e6aa6b1f"
          test "$(git rev-parse HEAD:research/llm_g65)" = "18ddbdbe436728b04f660b870abc924bdf21e554"
          test "$(git rev-parse HEAD:research/llm_g66)" = "f3d0980ead446b0a89d5defe6531b1e00283b546"
          test "$(git rev-parse HEAD:research/llm_g67)" = "ed268f83fbffa0cc13343d8647201c7798d070b9"
          test "$(git rev-parse HEAD:research/llm_g68)" = "88fc035bb77e3192f2b69567d2226090c8a05361"
          test "$(git rev-parse HEAD:research/llm_g70)" = "681c4022516e370a7edf9205d90a39e69b0a784f"
          test "$(git rev-parse HEAD:docs/research/CPU-G92-GPT2-NATIVE-FUSED-NEWGELU-PREREG-20261031.md)" = "76eab273938df2cce95e8b4b560007db21028ca4"
          test "$(git rev-parse HEAD:research/cpu_g92/g92_native_gelu_original.py)" = "0f4e61e0f5dd28cd6246f462122ba5e794556002"
          test "$(git rev-parse HEAD:research/cpu_g92/test_g92_native_gelu_original.py)" = "245aeb5d8e1882f1fdaa6b833241dfc36d2c9c2a"
          test "$(git rev-parse HEAD:docs/research/CPU-G92-GPT2-NATIVE-FUSED-NEWGELU-ARTIFACT-RECEIPT-20261031.json)" = "61c3769395cdc26643bb3d1b5170b4e0e86fd576"
          python - <<'PY'
          import json
          p="docs/research/CPU-G92-GPT2-NATIVE-FUSED-NEWGELU-ARTIFACT-RECEIPT-20261031.json"
          r=json.load(open(p,encoding="utf-8"))
          assert r["schema"]=="forge.cpu-llm-g92.archive-receipt.v1"
          assert r["execution"]["workflow_run_id"]==41221347806
          assert r["execution"]["artifact_id"]==13050640468
          assert r["execution"]["artifact_zip_sha256"]=="646381d59ab1095c75675feb533611190180c8dc3607df10cad2cb509a3e7b78"
          assert r["execution"]["artifact_result_json_sha256"]=="061febfaa8017ece42170de76c3e790113e5d1eeb4cee06a4f7db805523c6946"
          assert r["dispatch"]["candidate_aten_gelu"]==12 and r["dispatch"]["baseline_aten_gelu"]==0
          assert r["results"]["engineering"]=="PASS" and r["results"]["correctness"]=="PASS"
          assert r["results"]["decision"]=="NATIVE_GELU_NO_GO"
          assert r["results"]["timed_authentic_responses"]==96 and r["results"]["timed_authentic_generated_tokens"]==768
          assert r["design"]["scientific_acceptance"]=="NOT_GRANTED" and r["design"]["promotion_allowed"] is False
          print("G92_ARCHIVED_RECEIPT=PASS")
          PY
          python -B -m py_compile research/cpu_g92/g92_native_gelu_original.py research/cpu_g92/test_g92_native_gelu_original.py
          python -B -m unittest discover -s research/cpu_g92 -p 'test_g92_native_gelu_original.py' -v
      - name: FORGE isolation and authority regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: F139 controller and native custody regression
        shell: bash
        run: python3 -B -m unittest discover -s f139 -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go tests, race, vet and build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable G92 result and original source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:docs/research/CPU-G92-GPT2-NATIVE-FUSED-NEWGELU-PREREG-20261031.md)" = "76eab273938df2cce95e8b4b560007db21028ca4"
          test "$(git rev-parse HEAD:research/cpu_g92/g92_native_gelu_original.py)" = "0f4e61e0f5dd28cd6246f462122ba5e794556002"
          test "$(git rev-parse HEAD:research/cpu_g92/test_g92_native_gelu_original.py)" = "245aeb5d8e1882f1fdaa6b833241dfc36d2c9c2a"
          test "$(git rev-parse HEAD:docs/research/CPU-G92-GPT2-NATIVE-FUSED-NEWGELU-ARTIFACT-RECEIPT-20261031.json)" = "61c3769395cdc26643bb3d1b5170b4e0e86fd576"
          python - <<'PY'
          import json
          r=json.load(open("docs/research/CPU-G92-GPT2-NATIVE-FUSED-NEWGELU-ARTIFACT-RECEIPT-20261031.json",encoding="utf-8"))
          assert r["results"]["decision"]=="NATIVE_GELU_NO_GO"
          assert r["dispatch"]["candidate_aten_gelu"]==12 and r["dispatch"]["baseline_aten_gelu"]==0
          assert r["results"]["engineering"]=="PASS" and r["results"]["correctness"]=="PASS"
          assert r["results"]["timed_authentic_responses"]==96
          assert r["results"]["timed_authentic_generated_tokens"]==768
          print("G92_ARCHIVED_RECEIPT=PASS")
          PY
          python -B -m py_compile research/cpu_g92/g92_native_gelu_original.py research/cpu_g92/test_g92_native_gelu_original.py
          python -B -m unittest discover -s research/cpu_g92 -p 'test_g92_native_gelu_original.py' -v
      - name: FORGE isolation and authority regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: F139 controller and native custody regression
        shell: pwsh
        run: python -B -m unittest discover -s f139 -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Native Windows Go qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_TEST_FAILED' }
          go test -race -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_RACE_FAILED' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_VET_FAILED' }
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_BUILD_FAILED' }
