name: FORGE F139 V38 guarded original-owner forward installation
# A scoped event-only route for already-implemented original owner source
# operations. Never creates a scheduler, queue, worker, or rival controller.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  actions: read
  pull-requests: read
# Serialize with the existing original V41 controller owner route.
concurrency:
  group: forge-f139-v41-original-owner-live-install
  cancel-in-progress: false
jobs:
  hybrid-v38-original-forward-readiness:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'spoonman136668-ai' &&
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.event.issue.number == 807 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-HYBRID-V41-FORWARD-READINESS ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 20
    steps:
      - name: Checkout exact protected-main source without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Independently authenticate original owner and execute frozen stage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: .
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
             $env:GITHUB_REF -cne 'refs/heads/main' -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or
             $env:OPENAI_API_KEY) { throw 'F139_V38_FORWARD_OWNER_GUARD_DENIED' }
          $sha=(& git -C $env:GITHUB_WORKSPACE rev-parse HEAD|Out-String).Trim()
          $dirty=@(& git -C $env:GITHUB_WORKSPACE status --porcelain --untracked-files=all)
          if($LASTEXITCODE -ne 0 -or $sha -cne $env:GITHUB_SHA -or $dirty.Count -ne 0){
            throw 'F139_V38_FORWARD_SOURCE_CHANGED_OR_DIRTY'
          }
          $ev=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
          if($ev.action -cne 'created' -or
             $ev.comment.user.login -cne 'spoonman136668-ai' -or
             $ev.sender.login -cne 'spoonman136668-ai' -or
             ([string]$ev.comment.body).StartsWith('F139-HYBRID-V41-FORWARD-READINESS ') -ne $true) {
            throw 'F139_V38_FORWARD_EXACT_OWNER_EVENT_REQUIRED'
          }
          & python -B -m f139.nci04_v41_hybrid_forward_readiness --target $env:GITHUB_SHA
          if($LASTEXITCODE -ne 0){throw 'F139_V38_FORWARD_HYBRID_V38_ORIGINAL_FORWARD_READINESS_NOT_ACCEPTED'}

