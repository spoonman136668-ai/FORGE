name: MP-AI05 unseen phrasing cleanup validation
on:
  push:
    branches: [qualification/mpai05-fastpath-20261026]
    paths: ['.github/workflows/mpai05-unseen-cleaning.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 10
    steps:
      - name: Fresh cases and alternate conversational template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MPAI05_ROOT = Join-Path $env:RUNNER_TEMP ('mpai05-unseen-' + $env:GITHUB_RUN_ID)
          git clone --quiet --depth 1 https://github.com/spoonman136668-ai/Mind-Palace.git $env:MPAI05_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'CLONE_FAILED' }
          @'
          import os,sys,json,re,subprocess
          from pathlib import Path
          root=Path(os.environ['MPAI05_ROOT'])
          sha=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()
          assert sha=='7ad7230a82e3c748aa5336b7288ad2b45d42630c','SOURCE_DRIFT'
          sys.path.insert(0,str(root/'tools'))
          from mindpalace_readonly import MemorySnapshot
          snap=MemorySnapshot(root,sha,['Mind-Palace'])
          eligible=sorted((r for r in snap.index if r.get('project')=='Mind-Palace'
            and r.get('source_refs') and len(str(r.get('statement','')).split())>=12
            and r['id'] not in ('boundary/authority-order','boundary/no-secrets')),key=lambda r:r['id'])
          assert len(eligible)>=24,'INSUFFICIENT_DISTINCT_CASES'
          cases=eligible[12:24]
          stop={'the','and','for','with','from','this','that','which','when','into','only','must','shall','have','were','been','each','such','their','are','not'}
          scores={v:{'top1':0,'top4':0} for v in ('raw','clean')}
          prefix='I am trying to remember something from an earlier conversation about '
          suffix='. Would you check the context and tell me whether any relevant notes were recorded?'
          for idx,record in enumerate(cases):
              words=[w.lower() for w in re.findall(r'[a-zA-Z0-9]+',record['statement']) if len(w)>4 and w.lower() not in stop]
              unique=list(dict.fromkeys(words))
              clue=' '.join(unique[i] for i in (0,len(unique)//2,len(unique)-1) if i<len(unique))
              assert clue
              original=prefix+clue+suffix
              # Predeclared alternate phrasing removal; does not mutate the source or read protected holdouts.
              cleaned=original.removeprefix(prefix).removesuffix(suffix)
              for variant,q in (('raw',original),('clean',cleaned)):
                  result=snap.recall(sha,q,['Mind-Palace'],'continuation')
                  ids=[m['id'] for m in result['matches'][:4]]
                  rank=ids.index(record['id'])+1 if record['id'] in ids else None
                  scores[variant]['top1']+=int(rank==1)
                  scores[variant]['top4']+=int(rank is not None)
                  print('MPAI05_UNSEEN_CASE='+json.dumps({'case':idx+13,'variant':variant,'rank':rank}))
          print('MPAI05_UNSEEN_SCORES='+json.dumps(scores,sort_keys=True))
          print('MPAI05_UNSEEN_SOURCE_PIN='+sha)
          print('MPAI05_UNSEEN_HOLDOUT_ACCESS=0')
          print('MPAI05_UNSEEN_METHOD=NEW_RECORDS_ALTERNATE_TEMPLATE_EXACT_STRIPPING')
          print('MPAI05_UNSEEN_EXECUTION=PASS')
          '@ | python
          if ($LASTEXITCODE -ne 0) { throw 'UNSEEN_TEST_FAILED' }
