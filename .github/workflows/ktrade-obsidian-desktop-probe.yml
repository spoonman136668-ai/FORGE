name: KTRADE Obsidian desktop availability probe
on:
  push:
    branches: [qualification/ktrade-obsidian-desktop-20261028]
    paths: [.github/workflows/ktrade-obsidian-desktop-probe.yml]
permissions:
  contents: read
jobs:
  desktop-probe:
    if: github.repository == 'spoonman136668-ai/FORGE' && github.actor == 'spoonman136668-ai'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 7
    steps:
      - name: Detect eligible interactive desktop and installed Obsidian without mutations
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Windows.Forms
          $p=[System.Diagnostics.Process]::GetCurrentProcess()
          $interactive=[Environment]::UserInteractive
          $screenCount=@([System.Windows.Forms.Screen]::AllScreens).Count
          $paths=@(
            (Join-Path $env:LOCALAPPDATA 'Programs/Obsidian/Obsidian.exe'),
            (Join-Path $env:LOCALAPPDATA 'Obsidian/Obsidian.exe'),
            (Join-Path $env:ProgramFiles 'Obsidian/Obsidian.exe')
          )
          $present=@($paths|Where-Object {Test-Path -LiteralPath $_ -PathType Leaf}).Count -gt 0
          $others=@(Get-Process -Name Obsidian -ErrorAction SilentlyContinue)
          Write-Host ('KTRADE_DESKTOP_SESSION_ID='+$p.SessionId)
          Write-Host ('KTRADE_DESKTOP_USER_INTERACTIVE='+$interactive)
          Write-Host ('KTRADE_DESKTOP_SCREEN_COUNT='+$screenCount)
          Write-Host ('KTRADE_OBSIDIAN_EXE_INSTALLED='+$present)
          Write-Host ('KTRADE_OBSIDIAN_EXISTING_PROCESS_COUNT='+$others.Count)
          if($p.SessionId -gt 0 -and $interactive -and $screenCount -gt 0){
            Write-Host 'KTRADE_GUI_AUTOMATION_POSSIBLE=YES'
          }else{
            Write-Host 'KTRADE_GUI_AUTOMATION_POSSIBLE=NO'
          }
          Write-Host 'KTRADE_OBSIDIAN_PROBE_READ_ONLY=PASS'
