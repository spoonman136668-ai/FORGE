name: MP-AI159 actual model error census on frozen research sources
on:
  push:
    branches: [qualification/mpai159-error-census-20261028]
    paths: ['.github/workflows/mpai159-error-census-development.yml']
permissions:
  contents: read
concurrency:
  group: mpai159-proof-binding-20261028
  cancel-in-progress: false
jobs:
  real-relational-safety:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CREDENTIAL_INTERACTIVE: 'never'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Freeze provenance, run focused gates and offline paired safety trial
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){
            throw 'MPAI159_UNEXPECTED_RUNNER'
          }
          $scratch=Join-Path $env:SystemDrive ('m159-'+$env:GITHUB_RUN_ID)
          $experiment=Join-Path $scratch 'experiment'
          $source=Join-Path $scratch 'original'
          $manifest='evaluation/mpai159-frozen-error-census-v1.json'
          try {
            if(Test-Path -LiteralPath $scratch){throw 'MPAI159_SCRATCH_COLLISION'}
            New-Item -ItemType Directory -Path $scratch -ErrorAction Stop | Out-Null
            $env:TEMP=Join-Path $scratch 'tmp'
            $env:TMP=$env:TEMP
            New-Item -ItemType Directory -Path $env:TEMP -ErrorAction Stop | Out-Null
            $remote='https://github.com/spoonman136668-ai/Mind-Palace.git'
            & git clone --quiet --single-branch --branch proposal/mpai159-error-census-20261028 $remote $experiment *> (Join-Path $scratch 'experiment-private-clone.log')
            if($LASTEXITCODE -ne 0){throw 'MPAI159_EXPERIMENT_PRIVATE_CLONE_FAILED'}
            & git clone --quiet --single-branch --branch proposal/mpai-evidence-sufficiency-20261028 $remote $source *> (Join-Path $scratch 'original-private-clone.log')
            if($LASTEXITCODE -ne 0){throw 'MPAI159_ORIGINAL_PRIVATE_CLONE_FAILED'}
            if((& git -C $experiment rev-parse HEAD).Trim() -cne '22e12fb009c004184e7ec083758af3c72b2f0927'){
              throw 'MPAI159_EXPERIMENT_SOURCE_DRIFT'
            }
            if((& git -C $source rev-parse HEAD).Trim() -cne '7dd66f4b9e80b488ccb880fb62ddae8e7cb01987'){
              throw 'MPAI159_ORIGINAL_SOURCE_DRIFT'
            }
            $manifestAtHead=(& git -C $experiment rev-parse "HEAD:$manifest").Trim()
            $manifestAtFreeze=(& git -C $experiment rev-parse "207c23be101d1d75dd0b600dbbf37a656fae1972:$manifest").Trim()
            if($manifestAtHead -cne $manifestAtFreeze){throw 'MPAI159_PREDECLARED_MANIFEST_CHANGED'}
            if((Get-FileHash -Algorithm SHA256 (Join-Path $source '.ice/records.json')).Hash.ToLowerInvariant() -cne 'fecf51aa59bd24bfac0c852d53f88c88e6d7c9c1de6848e6c1bab5f45a3c9742'){
              throw 'MPAI159_ACCEPTED_MEMORY_DRIFT'
            }
            Push-Location $experiment
            try {
              & python -B -m unittest discover -s tests -p test_mpai159_error_classify.py -v
              if($LASTEXITCODE -ne 0){throw 'MPAI159_RELATIONAL_UNIT_TESTS_FAILED'}
              Write-Output 'MPAI159_ERROR_CLASS_TESTS=PASS'
              & python -B -c 'import ast,pathlib; [ast.parse(pathlib.Path(p).read_text(encoding="utf8")) for p in ("agentic/mpai159_error_classify.py","agentic/mpai158_field_verify.py","agentic/mpai158_field_propose.py","tools/mpai159_real_error_census.py","tests/test_mpai159_error_classify.py")]'
              if($LASTEXITCODE -ne 0){throw 'MPAI159_SOURCE_SYNTAX_FAILED'}
              Write-Output 'MPAI159_SOURCE_SYNTAX=PASS'
            } finally {Pop-Location}
            $privateLog=Join-Path $scratch 'private-offline-model-and-source.log'
            & python -B (Join-Path $experiment 'tools/mpai159_real_error_census.py') --experiment $experiment --original $source --scratch $scratch *> $privateLog
            $code=$LASTEXITCODE
            # Public logs allow only numerical totals and approved state markers.
            $safe=Get-Content -LiteralPath $privateLog | Where-Object {$_ -match '^MPAI159_[A-Z0-9_]+=[A-Za-z0-9_.]+$'}
            foreach($line in $safe){Write-Output $line}
            if($code -ne 0){throw 'MPAI159_PRIVATE_REAL_MODEL_TRIAL_FAILED'}
            foreach($required in @('MPAI159_DIAGNOSTIC_COMPLETED=PASS',
              'MPAI159_BLIND_HOLDOUT=FALSE',
              'MPAI159_SCIENTIFIC_COMPOSE=NO_GO')){
              if($safe -cnotcontains $required){throw 'MPAI159_RECEIPT_INCOMPLETE'}
            }
            foreach($location in @($experiment,$source)){
              $dirty=@(& git -C $location status --porcelain --untracked-files=all)
              if($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0){throw 'MPAI159_SOURCE_WORKTREE_DIRTY'}
            }
            Write-Output 'MPAI159_PRIVATE_SOURCE_AND_MEMORY_UNMODIFIED=PASS'
            Write-Output 'MPAI159_PRODUCTION_WRITES=0'
          } finally {
            Set-Location $env:SystemDrive\
            if(Test-Path -LiteralPath $scratch){Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction Stop}
          }
