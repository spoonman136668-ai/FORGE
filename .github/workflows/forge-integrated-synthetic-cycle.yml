name: FORGE integrated two-lane safe research-cycle acceptance

# Runs the exact source-level portfolio/policy integration plus TWO
# separate native synthetic OS workers. It never dispatches real science.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'nativeevidence/**'
      - 'reference/research-intake/f100-frozen-successor-contract.json'
      - 'reference/research-intake/f101-wingless-development-freeze.json'
      - 'reference/research-intake/f102-yggdrasil-role-dev-freeze.json'
      - 'reference/research-intake/f99-authentic-development-negative-history.json'
      - 'cmd/forge-model-free-loop/**'
      - '.github/workflows/forge-integrated-synthetic-cycle.yml'
  schedule:
    - cron: '19 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'cmd/forge-research-cycle/**'
      - 'cmd/forge-model-free-loop/**'
      - 'promptlineage/**'
      - 'genenv/**'
      - 'optimizerstages/**'
      - 'nativeevidence/**'
      - 'reference/research-intake/f100-frozen-successor-contract.json'
      - 'reference/research-intake/f101-wingless-development-freeze.json'
      - 'reference/research-intake/f102-yggdrasil-role-dev-freeze.json'
      - 'reference/research-intake/f99-authentic-development-negative-history.json'
      - 'evoportfolio/**'
      - 'classification/**'
      - 'subprocesssupervisor/**'
      - 'cmd/forge-sandbox-worker/**'
      - '.github/workflows/forge-integrated-synthetic-cycle.yml'

permissions:
  contents: read

concurrency:
  group: forge-integrated-synthetic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  two-lane-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify frozen policy and full two-lane source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -count=1 ./cmd/forge-research-cycle ./cmd/forge-model-free-loop ./promptlineage ./genenv ./optimizerstages ./evoportfolio ./classification ./researchstate ./subprocesssupervisor ./syntheticsupervisor ./sandboxworker
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_INTEGRATED_SCIENTIFIC_CONTROLS_FAILED' }
      - name: Execute separately pinned native synthetic Wingless and Yggdrasil processes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $worker = Join-Path $env:RUNNER_TEMP ("forge-sandbox-worker" + $extension)
          go build -o $worker ./cmd/forge-sandbox-worker
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_SYNTHETIC_BINARY_BUILD_FAILED' }
          $workerHash = (Get-FileHash -LiteralPath $worker -Algorithm SHA256).Hash.ToLowerInvariant()
          $dir = Join-Path $env:RUNNER_TEMP 'forge-synthetic-processes'
          $frozen = Join-Path $env:GITHUB_WORKSPACE 'cmd/research-portfolio-select'
          $histories = Join-Path $env:GITHUB_WORKSPACE 'cmd/forge-research-cycle/fixtures'
          $raw = & go run ./cmd/forge-research-cycle --synthetic-only --worker-executable $worker --worker-sha256 $workerHash --new-dir $dir --portfolio-dir $frozen --history-dir $histories
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_DUAL_LANE_SYNTHETIC_OPERATION_FAILED' }
          $proof = $raw | ConvertFrom-Json
          if ($proof.schema -ne 'forge.integrated-research-cycle.v1' -or
              $proof.scientific_execution_authorized -or $proof.accepted_ref_mutation -or
              $proof.research_originals_executed -ne 0 -or
              $proof.synthetic.real_scientific_cycles -ne 0 -or
              -not $proof.synthetic.wingless_verified -or
              -not $proof.synthetic.yggdrasil_verified -or
              $proof.lanes.Count -ne 2 -or
              $proof.lanes[0].lane -ne 'Wingless' -or
              $proof.lanes[1].lane -ne 'Yggdrasil') {
            throw 'FORGE_OPERATIONAL_PROOF_FALSE_AUTHORITY_OR_LOST_LANE'
          }
          foreach ($lane in $proof.lanes) {
            if ($lane.dispatch_authorized -or $lane.scientific_accepted -or
                $lane.historical_negative_count -lt 1 -or
                $lane.historical_mixed_count -lt 1 -or
                $lane.finalists.Count -lt 1 -or
                $lane.nonfinalists.Count -lt 1) {
              throw 'FORGE_RESEARCH_ENHANCEMENT_OR_NEGATIVE_LOST'
            }
          }
          $out = Join-Path $env:RUNNER_TEMP 'forge-cycle-proof.json'
          [System.IO.File]::WriteAllText($out, ($raw -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          Write-Host 'SYNTHETIC_TWO_LANE_CYCLE=PASS'
          Write-Host 'ORIGINAL_SCIENCE_CONSUMED=0'
          Write-Host 'UNATTENDED_PROD_AUTONOMY_NOT_CLAIMED=TRUE'
      - name: Run both frozen model-free proposal generators and stage advisory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = & go run ./cmd/forge-model-free-loop --synthetic-only --source-ref $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_MODEL_FREE_GENERATORS_FAILED' }
          $raw2 = & go run ./cmd/forge-model-free-loop --synthetic-only --source-ref $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0 -or ($raw -join "`n") -cne ($raw2 -join "`n")) {
            throw 'FORGE_MODEL_FREE_PROPOSAL_NONDETERMINISTIC'
          }
          $proof = ($raw -join "`n") | ConvertFrom-Json
          if ($proof.schema -cne 'forge.model-free.two-lane-untested-advisory.v1' -or
              $proof.source_commit_sha -cne $env:GITHUB_SHA -or
              $proof.evidence_type -cne 'SYNTHETIC_FROZEN_SOURCE_ONLY_NOT_NEW_SCIENTIFIC_EVIDENCE' -or
              $proof.lanes.Count -ne 2 -or
              $proof.lanes[0].lane -cne 'Wingless' -or
              $proof.lanes[1].lane -cne 'Yggdrasil' -or
              $proof.model_invocations -ne 0 -or $proof.codex_invocations -ne 0 -or
              $proof.network_calls -ne 0 -or $proof.new_scientific_originals -ne 0 -or
              $proof.scientific_first_use_authorized -or
              $proof.real_research_progress_established -or
              $proof.policy_promotion_authorized -or $proof.accepted_ref_mutations -ne 0) {
            throw 'FORGE_MODEL_FREE_SOURCE_ONLY_BOUNDARY_FAILED'
          }
          $ids = @{}
          foreach ($lane in $proof.lanes) {
            if ($lane.prompt_candidates -ne 2 -or $lane.environment_candidates -ne 2 -or
                $lane.negative_records -ne 1 -or $lane.invalid_records -ne 1 -or
                $lane.mixed_records -ne 1 -or $lane.proposal_ids.Count -ne 4 -or
                -not $lane.all_candidates_untested -or -not $lane.full_population_screened -or
                $lane.science_accepted -or $lane.original_dispatch_authorized -or
                $lane.advisory_assessment -cne 'BOUNDED_UNTESTED_NOVELTY_PROPOSALS_READY') {
              throw 'FORGE_MODEL_FREE_MISSING_CANDIDATES_OR_UNEARNED_AUTHORITY'
            }
            foreach ($id in $lane.proposal_ids) {
              if ($ids.ContainsKey([string]$id)) { throw 'FORGE_MODEL_FREE_DUPLICATE_CANDIDATE' }
              $ids[[string]$id] = $true
            }
          }
          $out = Join-Path $env:RUNNER_TEMP 'forge-model-free-advisory.json'
          [System.IO.File]::WriteAllText($out, ($raw -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          $hash = (Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'forge-model-free-advisory.sha256'),
            "$hash  forge-model-free-advisory.json`n", [System.Text.UTF8Encoding]::new($false))
          Write-Host 'FORGE_MODEL_FREE_FROZEN_TWO_LANE_ADVISORY=PASS'
          Write-Host 'MODEL_EXECUTION_AND_NEW_ORIGINAL_SCIENCE=ZERO'
          Write-Host 'PROPOSALS_ARE_SYNTHETIC_AND_UNTESTED=TRUE'
      - name: Validate native historical-source identity and science-denial tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python -B -m unittest discover -s nativeevidence -p 'test_f98_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_F98_EVIDENCE_ADVERSARIAL_TESTS_FAILED' }
          & $python -B -m unittest discover -s nativeevidence -p 'test_f99_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_F99_REAL_ARCHIVE_ADVERSARIAL_TESTS_FAILED' }
      - name: Qualify bounded F100 real-negative successor preregistration (source-only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python -B -m unittest discover -s nativeevidence -p 'test_f100_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_F100_PREREG_ADVERSARIAL_TESTS_FAILED' }
          $outdir = Join-Path $env:RUNNER_TEMP 'forge-f100-development'
          New-Item -ItemType Directory -Path $outdir -Force | Out-Null
          $reportPath = Join-Path $outdir 'f100-successor-prereg-proof.json'
          & $python -B nativeevidence/f100_frozen_successors.py --source-ref $env:GITHUB_SHA |
            Out-File -FilePath $reportPath -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_F100_FROZEN_CONTRACT_FAILED' }
          $proof=Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($proof.schema -cne 'forge.autonomy.f100.development-successor-preregistration-proof.v1' -or
              $proof.forge_source_sha -cne $env:GITHUB_SHA -or
              $proof.f99_parent_git_blob_sha -cne 'a280814e324d80bcc2590bbab939446180683e45' -or
              $proof.lanes.Count -ne 2 -or
              $proof.lanes[0].lane -cne 'Wingless' -or
              $proof.lanes[1].lane -cne 'Yggdrasil' -or
              $proof.candidates_frozen -ne 4 -or
              $proof.historical_development_negative_pairs -ne 288 -or
              $proof.new_experiments_executed -ne 0 -or
              $proof.new_results_observed -ne 0 -or
              $proof.trainable_policy_updates -ne 0 -or
              $proof.model_calls -ne 0 -or $proof.codex_calls -ne 0 -or
              $proof.paid_external_model_calls -ne 0 -or
              $proof.scientific_first_use_authorized -or
              $proof.autonomous_research_established -or
              $proof.accepted_ref_mutations -ne 0) {
            throw 'FORGE_F100_UNAUTHORIZED_SCIENTIFIC_OR_MODEL_EXECUTION'
          }
          $all=@()
          foreach ($lane in $proof.lanes) {
            if ($lane.candidate_ids.Count -ne 2 -or
                $lane.public_development_seed_count -ne 48 -or
                $lane.implementation_started -or
                $lane.science_first_use_authorized -or
                $lane.retrospective_learned_correct_pairs -ne 0 -or
                $lane.retrospective_coded_control_pairs -ne $lane.authentic_negative_pairs) {
              throw 'FORGE_F100_FROZEN_DEV_BOUNDARY_FAILED'
            }
            $all += $lane.candidate_ids
          }
          if (@($all | Select-Object -Unique).Count -ne 4) {
            throw 'FORGE_F100_DUPLICATED_CANDIDATE_LINEAGE'
          }
          $digest=(Get-FileHash -LiteralPath $reportPath -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $outdir 'f100-successor-prereg-proof.sha256'),
            "$digest  f100-successor-prereg-proof.json`n",
            [System.Text.UTF8Encoding]::new($false))
          Write-Host 'FORGE_F100_FROZEN_FOUR_CANDIDATE_DEV_DESIGN=PASS'
          Write-Host 'FORGE_F100_NEW_SCIENCE_AND_AUTONOMOUS_MODEL=ZERO'
      - name: Execute bounded Wingless F101 learned public-development mechanism and frozen controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python=if ($IsWindows) { 'python' } else { 'python3' }
          & $python -B -m unittest discover -s nativeevidence -p 'test_f101_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_F101_DEPTH_LEARNER_ADVERSARIAL_TESTS_FAILED' }
          $outdir=Join-Path $env:RUNNER_TEMP 'forge-f101-development'
          New-Item -ItemType Directory -Path $outdir -Force | Out-Null
          $out=Join-Path $outdir 'f101-wingless-public-dev.json'
          & $python -B nativeevidence/f101_wingless_public_depth.py --source-ref $env:GITHUB_SHA |
            Out-File -FilePath $out -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_F101_REAL_LEARNED_DEV_MECHANISM_FAILED' }
          $d=Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($d.schema -cne 'forge.autonomy.f101.public-development-mechanism-feasibility.v1' -or
              $d.source_sha -cne $env:GITHUB_SHA -or
              $d.lane -cne 'Wingless' -or $d.candidate_id -cne 'W100-C1' -or
              $d.development_pair_count -ne 144 -or
              $d.training_pair_count -ne 96 -or
              $d.public_dev_assessment_pairs -ne 48 -or
              $d.trainable_parameter_count -ne 4 -or
              $d.training_updates -ne 100 -or
              $d.control_training_updates -ne 100 -or
              $d.independently_accepted_scientific_gain -or
              $d.protected_first_use_authorized -or
              $d.fresh_scientific_original_executed -or
              $d.optimizer_promotion_authorized -or
              $d.accepted_ref_mutations -ne 0 -or
              $d.codex_calls -ne 0 -or
              $d.external_model_api_calls -ne 0 -or
              $d.chatgpt_work_tasks -ne 0 -or
              -not $d.previous_W_F10_negative_preserved) {
            throw 'FORGE_F101_PUBLIC_DEV_OR_SCIENCE_BOUNDARY_DRIFT'
          }
          $scores=$d.public_dev_accuracy_by_arm
          if ($scores.learned_depth_conditioned -lt 0.75 -or
              $scores.size_matched_depth_blind -gt 0.85 -or
              $scores.always_yes_shortcut -ne 0 -or
              $scores.coded_exact_depth_oracle -ne 1 -or
              -not $d.public_development_screen_passed) {
            throw 'FORGE_F101_PUBLIC_DEV_SCREEN_FAILED_NO_SCIENCE_CLAIM'
          }
          $hash=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $outdir 'f101-wingless-public-dev.sha256'),
            "$hash  f101-wingless-public-dev.json`n",
            [System.Text.UTF8Encoding]::new($false))
          Write-Host 'FORGE_F101_REAL_BOUNDED_PUBLIC_DEVELOPMENT=PASS'
          Write-Host 'FORGE_F101_PROSPECTIVE_ORIGINALS_AND_MODEL_APIS=ZERO'
      - name: Qualify learned Yggdrasil F102 typed-role public development and controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python=if ($IsWindows) { 'python' } else { 'python3' }
          & $python -B -m unittest discover -s nativeevidence -p 'test_f102_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_F102_TYPED_ROLE_ADVERSARIAL_TESTS_FAILED' }
          $outdir=Join-Path $env:RUNNER_TEMP 'forge-f102-development'
          New-Item -ItemType Directory -Path $outdir -Force | Out-Null
          $out=Join-Path $outdir 'f102-yggdrasil-public-dev.json'
          & $python -B nativeevidence/f102_yggdrasil_public_roles.py --source-ref $env:GITHUB_SHA |
            Out-File -FilePath $out -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_F102_REAL_LEARNED_ROLE_COMPOSITION_FAILED' }
          $d=Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($d.schema -cne 'forge.autonomy.f102.yggdrasil-public-dev-real-learned-role-composer.v1' -or
              $d.source_sha -cne $env:GITHUB_SHA -or
              $d.lane -cne 'Yggdrasil' -or $d.candidate_id -cne 'Y100-C1' -or
              $d.total_public_development_pairs -ne 144 -or
              $d.training_pairs -ne 96 -or
              $d.public_development_assessment_pairs -ne 48 -or
              $d.trainable_parameters -ne 18 -or
              $d.learned_training_updates -ne 100 -or
              $d.blind_control_training_updates -ne 100 -or
              $d.scientific_originals_executed -ne 0 -or
              $d.independent_scientific_results_accepted -ne 0 -or
              $d.first_use_authorized -or $d.optimizer_promotion_authorized -or
              $d.accepted_ref_mutations -ne 0 -or
              $d.codex_invocations -ne 0 -or
              $d.external_model_api_calls -ne 0 -or $d.chatgpt_work_tasks -ne 0 -or
              $d.ckb_plane_accessed -or
              -not $d.historical_Y_F9_zero_of_192_negative_preserved -or
              -not $d.coded_oracle_only_control) {
            throw 'FORGE_F102_PUBLIC_DEVELOPMENT_NONAUTHORITY_DRIFT'
          }
          $scores=$d.paired_public_dev_accuracy
          if ($scores.learned_typed_role_composer -lt 0.75 -or
              $scores.size_matched_role_blind -ne 0 -or
              $scores.always_yes_shortcut -ne 0 -or
              $scores.coded_typed_role_oracle -ne 1 -or
              $d.node_renaming_prediction_agreement -ne 1 -or
              $d.worst_role_family_accuracy -lt 0.60 -or
              -not $d.public_development_screen_passed) {
            throw 'FORGE_F102_FROZEN_PUBLIC_DEVELOPMENT_SCREEN_FAILED'
          }
          $digest=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $outdir 'f102-yggdrasil-public-dev.sha256'),
            "$digest  f102-yggdrasil-public-dev.json`n",
            [System.Text.UTF8Encoding]::new($false))
          Write-Host 'FORGE_F102_YGGDRASIL_LEARNED_ROLE_DEVELOPMENT=PASS'
          Write-Host 'FORGE_F102_PROTECTED_FIRST_USE_AND_PAID_MODELS=ZERO'
      - name: Train and audit F103 learned Yggdrasil variable-binding public development
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python=if ($IsWindows) { 'python' } else { 'python3' }
          & $python -B -m unittest discover -s nativeevidence -p 'test_f103_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_F103_VARIABLE_BINDING_ADVERSARIAL_TESTS_FAILED' }
          $outdir=Join-Path $env:RUNNER_TEMP 'forge-f103-development'
          New-Item -ItemType Directory -Path $outdir -Force | Out-Null
          $out=Join-Path $outdir 'f103-yggdrasil-variable-binding-dev.json'
          & $python -B nativeevidence/f103_yggdrasil_public_binding.py --source-ref $env:GITHUB_SHA |
            Out-File -FilePath $out -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_F103_LEARNED_BINDER_EXECUTION_FAILED' }
          $d=Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($d.schema -cne 'forge.autonomy.f103.yggdrasil-public-dev-learned-variable-binding.v1' -or
              $d.source_sha -cne $env:GITHUB_SHA -or
              $d.lane -cne 'Yggdrasil' -or $d.candidate_id -cne 'Y100-C2' -or
              $d.total_development_pairs -ne 144 -or
              $d.training_pairs -ne 96 -or $d.assessment_pairs -ne 48 -or
              $d.trainable_parameters -ne 20 -or
              $d.learned_training_updates -ne 100 -or
              $d.variable_blind_training_updates -ne 100 -or
              $d.first_use_authorized -or $d.scientific_originals_executed -ne 0 -or
              $d.independent_scientific_results_accepted -ne 0 -or
              $d.optimizer_promotion_authorized -or
              $d.accepted_ref_mutations -ne 0 -or $d.codex_invocations -ne 0 -or
              $d.paid_api_calls -ne 0 -or $d.chatgpt_work_tasks -ne 0 -or
              $d.ckb_plane_accessed -or
              -not $d.historical_Y_F9_negative_0_of_192_preserved -or
              -not $d.oracle_only_separate_control) {
            throw 'FORGE_F103_UNEARNED_SCIENTIFIC_AUTHORITY_OR_SOURCE_DRIFT'
          }
          $scores=$d.paired_public_dev_accuracy
          if ($scores.learned_variable_slot_binder -lt 0.75 -or
              ($scores.learned_variable_slot_binder - $scores.size_matched_role_aware_variable_blind) -lt 0.15 -or
              $d.worst_group_accuracy -lt 0.60 -or
              $d.variable_renaming_agreement -lt 0.95 -or
              $d.node_renaming_agreement -ne 1 -or
              $scores.size_matched_role_aware_variable_blind -ne 0 -or
              $scores.always_yes_shortcut -ne 0 -or
              $scores.coded_exact_binding_oracle -ne 1 -or
              -not $d.public_development_screen_passed) {
            throw 'FORGE_F103_FROZEN_PUBLIC_DEV_SCREEN_FAILED_RETAIN_NEGATIVE'
          }
          $digest=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $outdir 'f103-yggdrasil-variable-binding-dev.sha256'),
            "$digest  f103-yggdrasil-variable-binding-dev.json" + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false))
          Write-Host 'FORGE_F103_LEARNED_VARIABLE_BINDING_PUBLIC_DEV=PASS'
          Write-Host 'FORGE_F103_PROTECTED_FIRST_USE_AND_PAID_INFERENCE=ZERO'
      - name: Read optional historical research archives (separate from core synthetic acceptance)
        id: f98_external_observer
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'forge-f98-evidence'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          foreach ($lane in @(
            @{Name='wingless'; Repo='Wingless'; Run='38646170288'},
            @{Name='yggdrasil'; Repo='Yggdrasil'; Run='38646109265'}
          )) {
            $prefix = Join-Path $root $lane.Name
            & gh api ("repos/spoonman136668-ai/"+$lane.Repo+"/actions/runs/"+$lane.Run) |
              Out-File -FilePath ($prefix+'-run.json') -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'FORGE_F98_UPSTREAM_RUN_UNAVAILABLE' }
            & gh api ("repos/spoonman136668-ai/"+$lane.Repo+"/actions/runs/"+$lane.Run+"/artifacts") |
              Out-File -FilePath ($prefix+'-artifacts.json') -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'FORGE_F98_UPSTREAM_ARCHIVE_UNAVAILABLE' }
          }
          $out = Join-Path $root 'f98-real-source-shadow.json'
          $sourceArgs = @($env:GITHUB_SHA,
            (Join-Path $root 'wingless-run.json'), (Join-Path $root 'wingless-artifacts.json'),
            (Join-Path $root 'yggdrasil-run.json'), (Join-Path $root 'yggdrasil-artifacts.json'))
          & $python -B nativeevidence/f98_historical_shadow.py @sourceArgs |
            Out-File -FilePath $out -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_F98_REAL_GITHUB_SOURCE_CUSTODY_FAILED' }
          $report = Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($report.schema -cne 'forge.autonomy.f98.real-historical-metadata-shadow.v1' -or
              $report.forge_source_sha -cne $env:GITHUB_SHA -or
              $report.genuinely_observed_lanes -ne 2 -or
              $report.historical_reviewed_records.Count -ne 2 -or
              $report.new_trainable_genenv_records -ne 0 -or
              $report.model_calls -ne 0 -or $report.codex_calls -ne 0 -or
              $report.new_scientific_originals_executed -ne 0 -or
              $report.experiment_worker_dispatched -or
              $report.sealed_original_first_use_authorized -or
              $report.optimizer_promotion_authorized -or
              $report.accepted_reference_mutations -ne 0 -or
              $report.ckb_plane_accessed) {
            throw 'FORGE_F98_UNEARNED_SCIENCE_OR_MODEL_EXECUTION_CLAIM'
          }
          foreach ($lane in $report.historical_reviewed_records) {
            if (-not $lane.github_run_metadata_verified -or
                -not $lane.artifact_metadata_zip_digest_verified -or
                $lane.actual_zip_bytes_downloaded_and_rehashed -or
                $lane.contained_row_data_reaudited_now -or
                $lane.authenticated_train_only_feature_vectors_available -or
                $lane.genenv_train_history_admitted -or
                $lane.original_science_accepted) {
              throw 'FORGE_F98_ARCHIVE_SOURCE_METADATA_MISREPRESENTED'
            }
          }
          # F99 is part of the OPTIONAL, quarantinable historical observer:
          # authentic ZIP bytes are rehashed and rows reaggregated, never
          # treated as a live scientific original or GenEnv policy training.
          $f99Path = Join-Path $root 'f99-historical-development-negatives.json'
          & $python -B nativeevidence/f99_real_archive.py --download-readonly --source-ref $env:GITHUB_SHA |
            Out-File -FilePath $f99Path -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_F99_PINNED_ARCHIVE_BYTES_FAILED' }
          $f99 = Get-Content -LiteralPath $f99Path -Raw | ConvertFrom-Json
          if ($f99.schema -cne 'forge.autonomy.f99.row-reaggregated-train-only-shadow.v1' -or
              $f99.forge_source_sha -cne $env:GITHUB_SHA -or
              $f99.cohorts.Count -ne 2 -or
              $f99.cohorts[0].lane -cne 'Wingless' -or
              $f99.cohorts[1].lane -cne 'Yggdrasil' -or
              $f99.archived_negative_development_records -ne 2 -or
              $f99.training_only_observations_observed -ne 2 -or
              $f99.genenv_training_activated -or
              $f99.independent_originals_accepted -ne 0 -or
              $f99.protected_first_use_authorized -or
              $f99.new_originals_dispatched -ne 0 -or
              $f99.accepted_ref_mutations -ne 0 -or
              $f99.codex_calls -ne 0 -or $f99.model_calls -ne 0 -or
              $f99.paid_api_calls -ne 0) {
            throw 'FORGE_F99_ACTUAL_DEV_EVIDENCE_FALSE_SCIENCE_CLAIM'
          }
          foreach ($entry in $f99.cohorts) {
            if (-not $entry.actual_archive_bytes_rehashed -or
                -not $entry.contained_json_rows_reaggregated -or
                -not $entry.historical_development_negative_only -or
                $entry.independently_accepted_scientific_original -or
                $entry.genenv_training_activated -or
                $entry.independently_reaggregated_learned_correct_pairs -ne 0 -or
                $entry.independently_reaggregated_coded_control_pairs -ne
                  $entry.observed_historical_development_pairs) {
              throw 'FORGE_F99_ROW_LEVEL_EVIDENCE_UNVERIFIED'
            }
          }
          Write-Host 'FORGE_F99_AUTHENTIC_ZIP_AND_ROW_LEVEL_NEGATIVES=PASS'
          Write-Host 'FORGE_F99_TRAIN_ONLY_HISTORICAL_OBSERVATIONS=2'
          Write-Host 'FORGE_F99_PROSPECTIVE_SCIENCE_AND_OPTIMIZER_ACTIVATION=ZERO'
          Get-ChildItem $root -File | Where-Object { $_.Name -ne 'source-sha256.txt' } | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Out-File -FilePath (Join-Path $root 'source-sha256.txt') -Encoding utf8
          Write-Host 'FORGE_REAL_HISTORICAL_SOURCE_METADATA_TWO_LANES=PASS'
          Write-Host 'AUTHENTIC_TRAINABLE_MODEL_FEATURE_RECORDS=ZERO'
          Write-Host 'SCIENTIFIC_ORIGINAL_FIRSTUSE_AND_POLICY_TRAINING=DENIED'
      - name: Quarantine unavailable external provenance without corrupting synthetic core
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $status = '${{ steps.f98_external_observer.outcome }}'
          if ($status -ne 'success') {
            $root = Join-Path $env:RUNNER_TEMP 'forge-f98-evidence'
            if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force
            }
            Write-Host '::warning title=FORGE external historical provenance::F98_ARCHIVE_EVIDENCE_NOT_QUALIFIED_NO_ADMISSION'
            Write-Host 'F98_TRAINABLE_RECORDS_AND_SCIENTIFIC_PERMITS=ZERO'
          }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-safe-cycle-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/forge-cycle-proof.json
            ${{ runner.temp }}/forge-model-free-advisory.json
            ${{ runner.temp }}/forge-model-free-advisory.sha256
            ${{ runner.temp }}/forge-f98-evidence/
            ${{ runner.temp }}/forge-f100-development/
            ${{ runner.temp }}/forge-f101-development/
            ${{ runner.temp }}/forge-f102-development/
            ${{ runner.temp }}/forge-f103-development/
            ${{ runner.temp }}/forge-synthetic-processes
          retention-days: 30
          if-no-files-found: error
