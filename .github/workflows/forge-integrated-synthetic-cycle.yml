name: FORGE integrated two-lane safe research-cycle acceptance

# Runs the exact source-level portfolio/policy integration plus TWO
# separate native synthetic OS workers. It never dispatches real science.
on:
  workflow_dispatch:
    inputs:
      origin:
        description: 'Development-only manual request or F136 source-qualified completion'
        type: choice
        required: false
        default: manual
        options:
          - manual
          - f136-completion
          - f137-scheduled-recovery
      parent_run_id:
        description: 'Source run ID for F136 completion dispatch (never science authority)'
        type: string
        required: false
      parent_source_sha:
        description: 'Prior verified main source SHA (never science authority)'
        type: string
        required: false
  pull_request:
    branches: [main]
    paths:
      - 'nativeevidence/**'
      - 'cmd/forge-model-free-loop/**'
      - 'nativeevidence/f118_*.py'
      - 'reference/research-intake/f118-autonomous-feedback-freeze.json'
      - '.github/workflows/forge-integrated-synthetic-cycle.yml'
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches: [main]
    paths:
      - 'cmd/forge-research-cycle/**'
      - 'cmd/forge-model-free-loop/**'
      - 'promptlineage/**'
      - 'genenv/**'
      - 'optimizerstages/**'
      - 'nativeevidence/**'
      - 'reference/research-intake/f118-autonomous-feedback-freeze.json'
      - 'evoportfolio/**'
      - 'classification/**'
      - 'subprocesssupervisor/**'
      - 'cmd/forge-sandbox-worker/**'
      - '.github/workflows/forge-integrated-synthetic-cycle.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: forge-integrated-synthetic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  two-lane-synthetic:
    outputs:
      f125_admitted: ${{ steps.f129-admission.outputs.f125 }}
      f127_admitted: ${{ steps.f129-admission.outputs.f127 }}
      f128_admitted: ${{ steps.f129-admission.outputs.f128 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen policy and full two-lane source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -count=1 ./cmd/forge-research-cycle ./cmd/forge-model-free-loop ./promptlineage ./genenv ./optimizerstages ./evoportfolio ./classification ./researchstate ./subprocesssupervisor ./syntheticsupervisor ./sandboxworker
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_INTEGRATED_SCIENTIFIC_CONTROLS_FAILED' }
      - name: Execute separately pinned native synthetic Wingless and Yggdrasil processes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $worker = Join-Path $env:RUNNER_TEMP ("forge-sandbox-worker" + $extension)
          go build -o $worker ./cmd/forge-sandbox-worker
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_SYNTHETIC_BINARY_BUILD_FAILED' }
          $workerHash = (Get-FileHash -LiteralPath $worker -Algorithm SHA256).Hash.ToLowerInvariant()
          $dir = Join-Path $env:RUNNER_TEMP 'forge-synthetic-processes'
          $frozen = Join-Path $env:GITHUB_WORKSPACE 'cmd/research-portfolio-select'
          $histories = Join-Path $env:GITHUB_WORKSPACE 'cmd/forge-research-cycle/fixtures'
          $raw = & go run ./cmd/forge-research-cycle --synthetic-only --worker-executable $worker --worker-sha256 $workerHash --new-dir $dir --portfolio-dir $frozen --history-dir $histories
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_DUAL_LANE_SYNTHETIC_OPERATION_FAILED' }
          $proof = $raw | ConvertFrom-Json
          if ($proof.schema -ne 'forge.integrated-research-cycle.v1' -or
              $proof.scientific_execution_authorized -or $proof.accepted_ref_mutation -or
              $proof.research_originals_executed -ne 0 -or
              $proof.synthetic.real_scientific_cycles -ne 0 -or
              -not $proof.synthetic.wingless_verified -or
              -not $proof.synthetic.yggdrasil_verified -or
              $proof.lanes.Count -ne 2 -or
              $proof.lanes[0].lane -ne 'Wingless' -or
              $proof.lanes[1].lane -ne 'Yggdrasil') {
            throw 'FORGE_OPERATIONAL_PROOF_FALSE_AUTHORITY_OR_LOST_LANE'
          }
          foreach ($lane in $proof.lanes) {
            if ($lane.dispatch_authorized -or $lane.scientific_accepted -or
                $lane.historical_negative_count -lt 1 -or
                $lane.historical_mixed_count -lt 1 -or
                $lane.finalists.Count -lt 1 -or
                $lane.nonfinalists.Count -lt 1) {
              throw 'FORGE_RESEARCH_ENHANCEMENT_OR_NEGATIVE_LOST'
            }
          }
          $out = Join-Path $env:RUNNER_TEMP 'forge-cycle-proof.json'
          [System.IO.File]::WriteAllText($out, ($raw -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          Write-Host 'SYNTHETIC_TWO_LANE_CYCLE=PASS'
          Write-Host 'ORIGINAL_SCIENCE_CONSUMED=0'
          Write-Host 'UNATTENDED_PROD_AUTONOMY_NOT_CLAIMED=TRUE'
      - name: Run both frozen model-free proposal generators and stage advisory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = & go run ./cmd/forge-model-free-loop --synthetic-only --source-ref $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_MODEL_FREE_GENERATORS_FAILED' }
          $raw2 = & go run ./cmd/forge-model-free-loop --synthetic-only --source-ref $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0 -or ($raw -join "`n") -cne ($raw2 -join "`n")) {
            throw 'FORGE_MODEL_FREE_PROPOSAL_NONDETERMINISTIC'
          }
          $proof = ($raw -join "`n") | ConvertFrom-Json
          if ($proof.schema -cne 'forge.model-free.two-lane-untested-advisory.v1' -or
              $proof.source_commit_sha -cne $env:GITHUB_SHA -or
              $proof.evidence_type -cne 'SYNTHETIC_FROZEN_SOURCE_ONLY_NOT_NEW_SCIENTIFIC_EVIDENCE' -or
              $proof.lanes.Count -ne 2 -or
              $proof.lanes[0].lane -cne 'Wingless' -or
              $proof.lanes[1].lane -cne 'Yggdrasil' -or
              $proof.model_invocations -ne 0 -or $proof.codex_invocations -ne 0 -or
              $proof.network_calls -ne 0 -or $proof.new_scientific_originals -ne 0 -or
              $proof.scientific_first_use_authorized -or
              $proof.real_research_progress_established -or
              $proof.policy_promotion_authorized -or $proof.accepted_ref_mutations -ne 0) {
            throw 'FORGE_MODEL_FREE_SOURCE_ONLY_BOUNDARY_FAILED'
          }
          $ids = @{}
          foreach ($lane in $proof.lanes) {
            if ($lane.prompt_candidates -ne 2 -or $lane.environment_candidates -ne 2 -or
                $lane.negative_records -ne 1 -or $lane.invalid_records -ne 1 -or
                $lane.mixed_records -ne 1 -or $lane.proposal_ids.Count -ne 4 -or
                -not $lane.all_candidates_untested -or -not $lane.full_population_screened -or
                $lane.science_accepted -or $lane.original_dispatch_authorized -or
                $lane.advisory_assessment -cne 'BOUNDED_UNTESTED_NOVELTY_PROPOSALS_READY') {
              throw 'FORGE_MODEL_FREE_MISSING_CANDIDATES_OR_UNEARNED_AUTHORITY'
            }
            foreach ($id in $lane.proposal_ids) {
              if ($ids.ContainsKey([string]$id)) { throw 'FORGE_MODEL_FREE_DUPLICATE_CANDIDATE' }
              $ids[[string]$id] = $true
            }
          }
          $out = Join-Path $env:RUNNER_TEMP 'forge-model-free-advisory.json'
          [System.IO.File]::WriteAllText($out, ($raw -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          $hash = (Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'forge-model-free-advisory.sha256'),
            "$hash  forge-model-free-advisory.json`n", [System.Text.UTF8Encoding]::new($false))
          Write-Host 'FORGE_MODEL_FREE_FROZEN_TWO_LANE_ADVISORY=PASS'
          Write-Host 'MODEL_EXECUTION_AND_NEW_ORIGINAL_SCIENCE=ZERO'
          Write-Host 'PROPOSALS_ARE_SYNTHETIC_AND_UNTESTED=TRUE'
      - name: F118 autonomy-first bounded decision and evidence feedback
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $python=if ($IsWindows) { 'python' } else { 'python3' }
          & $python -B -m unittest discover -s nativeevidence -p 'test_f118_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F118_FEEDBACK_TESTS_FAILED' }
          $dir=Join-Path $env:RUNNER_TEMP 'forge-f118-autonomy'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $arguments=@('--advisory',(Join-Path $env:RUNNER_TEMP 'forge-model-free-advisory.json'),
            '--source-ref',$env:GITHUB_SHA,'--run-id',$env:GITHUB_RUN_ID,
            '--event',$env:GITHUB_EVENT_NAME,'--output',(Join-Path $dir 'state.json'))
          if ($env:GITHUB_EVENT_NAME -eq 'schedule') {
            $index=& gh api ("repos/"+$env:GITHUB_REPOSITORY+
              "/actions/workflows/forge-integrated-synthetic-cycle.yml/runs?branch=main&event=schedule&per_page=40") | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'F118_SCHEDULE_GITHUB_READ_FAILED' }
            foreach ($prior in @($index.workflow_runs | Sort-Object id -Descending)) {
              if ([int64]$prior.id -ge [int64]$env:GITHUB_RUN_ID -or
                  $prior.conclusion -cne 'success' -or $prior.run_attempt -ne 1 -or
                  $prior.event -cne 'schedule' -or $prior.head_branch -cne 'main') { continue }
              $list=& gh api ("repos/"+$env:GITHUB_REPOSITORY+
                 "/actions/runs/"+$prior.id+"/artifacts?per_page=100") | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw 'F118_PREVIOUS_ARTIFACT_DISCOVERY_FAILED' }
              $matches=@($list.artifacts | Where-Object {
                $_.name -ceq 'forge-f118-feedback-ubuntu-latest' -and -not $_.expired
              })
              if ($matches.Count -eq 0) { continue }
              if ($matches.Count -ne 1) { throw 'F118_PREVIOUS_DUPLICATE_RECEIPT' }
              $previousDir=Join-Path $dir 'previous'
              New-Item -ItemType Directory -Force -Path $previousDir | Out-Null
              & gh run download $prior.id --repo $env:GITHUB_REPOSITORY -n 'forge-f118-feedback-ubuntu-latest' -D $previousDir
              if ($LASTEXITCODE -ne 0) { throw 'F118_PREVIOUS_DOWNLOAD_FAILED' }
              $previous=Join-Path $previousDir 'state.json'
              $receipt=Join-Path $previousDir 'state.sha256'
              if (-not (Test-Path $previous) -or -not (Test-Path $receipt)) { throw 'F118_PREVIOUS_INCOMPLETE' }
              $actual=(Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash.ToLowerInvariant()
              if ((Get-Content -LiteralPath $receipt -Raw).Trim() -cne "$actual  state.json") {
                throw 'F118_PREVIOUS_CHECKSUM_FAIL'
              }
              $meta=Join-Path $dir 'github-run-metadata.json'
              [System.IO.File]::WriteAllText($meta,($prior | ConvertTo-Json -Depth 15 -Compress),
                [System.Text.UTF8Encoding]::new($false))
              $arguments+=@('--previous',$previous,'--previous-meta',$meta)
              break
            }
          }
          & $python -B nativeevidence/f118_autonomy_feedback.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'F118_MODEL_FREE_ACTION_EXECUTION_FAILED' }
          $state=Join-Path $dir 'state.json'
          $d=Get-Content -LiteralPath $state -Raw | ConvertFrom-Json
          if ($d.schema -cne 'forge.autonomy.f118.model-free-development-feedback.v1' -or
              $d.source_sha -cne $env:GITHUB_SHA -or
              [int64]$d.run_id -ne [int64]$env:GITHUB_RUN_ID -or
              $d.evaluations.Count -ne 2 -or
              $d.evaluations[0].lane -cne 'Wingless' -or
              $d.evaluations[1].lane -cne 'Yggdrasil' -or
              -not $d.model_free_selection_and_execution_performed -or
              -not $d.feedback_available_to_next_run -or
              $d.qualified_unattended_repetitions -or
              $d.science_screen_performed -or
              $d.new_scientific_originals -ne 0 -or
              $d.accepted_ref_mutations -ne 0 -or
              $d.optimizer_promotions -ne 0 -or
              $d.codex_calls -ne 0 -or $d.paid_model_calls -ne 0 -or
              $d.ckb_plane_contact -or $d.cloudflare_writes -ne 0 -or
              $d.new_schedulers -ne 0 -or $d.independent_science_accepted) {
            throw 'F118_FALSE_AUTONOMY_SCIENCE_OR_SOURCE'
          }
          foreach ($x in $d.evaluations) {
            if ($x.outcome -notin @('PASS','FAIL','TIMEOUT') -or
                $x.this_is_scientific_candidate_validation) { throw 'F118_UNSAFE_OUTCOME' }
            Write-Host ('F118_AUTO_SELECTED '+$x.lane+' '+$x.engineering_readiness_suite+' '+$x.outcome)
          }
          $sha=(Get-FileHash -LiteralPath $state -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $dir 'state.sha256'),
            "$sha  state.json" + [Environment]::NewLine,[System.Text.UTF8Encoding]::new($false))
          Write-Host ('F118_FEEDBACK='+$d.continuity)
          Write-Host 'F118_MODEL_FREE_SOURCE_ONLY_NO_SCIENCE_PROMOTION=PASS'
      - name: F119 second real autonomy cycle consuming current F118 feedback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $python=if ($IsWindows) { 'python' } else { 'python3' }
          & $python -B -m unittest discover -s nativeevidence -p 'test_f119_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F119_AUTONOMOUS_FEEDBACK_TESTS_FAILED' }
          $dir=Join-Path $env:RUNNER_TEMP 'forge-f119-autonomy'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $f118Dir=Join-Path $env:RUNNER_TEMP 'forge-f118-autonomy'
          $first=Join-Path $f118Dir 'state.json'
          $firstReceipt=Join-Path $f118Dir 'state.sha256'
          if (-not (Test-Path -LiteralPath $first) -or -not (Test-Path -LiteralPath $firstReceipt)) {
            throw 'F119_FIRST_ACTUAL_ACTION_REPORT_MISSING'
          }
          $initialHash=(Get-FileHash -LiteralPath $first -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content -LiteralPath $firstReceipt -Raw).Trim() -cne "$initialHash  state.json") {
            throw 'F119_FIRST_ACTUAL_ACTION_RECEIPT_DRIFT'
          }
          $immutableFirst=Join-Path $dir 'first-state.json'
          Copy-Item -LiteralPath $first -Destination $immutableFirst
          $audit=Join-Path $dir 'second-round-audit.json'
          $carried=Join-Path $dir 'next-schedule-state.json'
          $args2=@('--advisory',(Join-Path $env:RUNNER_TEMP 'forge-model-free-advisory.json'),
              '--first',$immutableFirst,'--source-ref',$env:GITHUB_SHA,
              '--run-id',$env:GITHUB_RUN_ID,'--event',$env:GITHUB_EVENT_NAME,
              '--audit-out',$audit,'--next-state-out',$carried)
          & $python -B nativeevidence/f119_second_round.py @args2
          if ($LASTEXITCODE -ne 0) { throw 'F119_SECOND_ACTUAL_ACTION_PAIR_FAILED' }
          $result=Get-Content -LiteralPath $audit -Raw | ConvertFrom-Json
          $updated=Get-Content -LiteralPath $carried -Raw | ConvertFrom-Json
          if ($result.schema -cne 'forge.autonomy.f119.actual-two-round-development-feedback.v1' -or
              $result.source_sha -cne $env:GITHUB_SHA -or
              [int64]$result.run_id -ne [int64]$env:GITHUB_RUN_ID -or
              $result.event -cne $env:GITHUB_EVENT_NAME -or
              $result.first_round.Count -ne 2 -or $result.second_round.Count -ne 2 -or
              $result.first_round[0].lane -cne 'Wingless' -or
              $result.first_round[1].lane -cne 'Yggdrasil' -or
              $result.second_round[0].lane -cne 'Wingless' -or
              $result.second_round[1].lane -cne 'Yggdrasil' -or
              $result.total_real_package_checks_this_run -ne 4 -or
              $result.model_free_autonomous_feedback_decisions -ne 4 -or
              -not $result.feedback_retained_for_next_scheduled_run -or
              $result.two_distinct_GitHub_scheduled_runs_observed -or
              $result.research_hypothesis_fitness_established -or
              $result.unrestricted_learning_established -or
              $result.original_science_executed -ne 0 -or
              $result.accepted_refs_mutated -ne 0 -or
              $result.optimizer_promotions -ne 0 -or
              $result.Codex_calls -ne 0 -or $result.paid_model_calls -ne 0 -or
              $result.new_schedulers -ne 0 -or $result.ckb_plane_contact -or
              $result.cloudflare_writes -ne 0 -or $result.Mind_Palace_writes -ne 0 -or
              $updated.schema -cne 'forge.autonomy.f118.model-free-development-feedback.v1' -or
              $updated.source_sha -cne $env:GITHUB_SHA -or
              $updated.evaluations.Count -ne 2 -or
              $updated.qualified_unattended_repetitions -or
              $updated.new_scientific_originals -ne 0 -or
              $updated.accepted_ref_mutations -ne 0) {
            throw 'F119_FALSE_WITHIN_RUN_LOOP_OR_UNEARNED_SCIENCE'
          }
          # Reuse the original F118 scheduled archive name and source-bound
          # schema so its next real scheduled run reads ALL FOUR actions.
          [System.IO.File]::WriteAllBytes($first,[System.IO.File]::ReadAllBytes($carried))
          $finalHash=(Get-FileHash -LiteralPath $first -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText($firstReceipt,
            "$finalHash  state.json"+[Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false))
          foreach ($entry in $result.second_round) {
            Write-Host ('F119_REAL_SECOND_ACTION '+$entry.lane+
              ' index='+$entry.proposal_position+' suite='+$entry.engineering_readiness_suite+
              ' outcome='+$entry.outcome+' reason='+$entry.selection_reason)
          }
          $sha=(Get-FileHash -LiteralPath $audit -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $dir 'second-round-audit.sha256'),
            "$sha  second-round-audit.json"+[Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false))
          Write-Host 'F119_FOUR_ACTUAL_BOUNDED_DEVELOPMENT_CHECKS=PASS'
          Write-Host 'F119_NEW_SCIENTIFIC_ORIGINALS_AND_OPTIMIZER_PROMOTIONS=ZERO'
      - name: F120 train-only generated graph challenges and disjoint research-development confirmation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $python=if ($IsWindows) { 'python' } else { 'python3' }
          & $python -B -m unittest discover -s nativeevidence -p 'test_f120_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F120_GENERATED_ENVIRONMENT_ADVERSARIAL_TESTS_FAILED' }
          $root=Join-Path $env:RUNNER_TEMP 'forge-f120-development'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $advisory=Join-Path $env:RUNNER_TEMP 'forge-model-free-advisory.json'
          $receipt=Join-Path $env:RUNNER_TEMP 'forge-model-free-advisory.sha256'
          if (-not (Test-Path -LiteralPath $advisory) -or
              -not (Test-Path -LiteralPath $receipt)) { throw 'F120_CURRENT_SOURCE_GENERATOR_MISSING' }
          $sha=(Get-FileHash -LiteralPath $advisory -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content -LiteralPath $receipt -Raw).Trim() -cne "$sha  forge-model-free-advisory.json") {
            throw 'F120_GENERATOR_BYTES_UNAUTHENTICATED'
          }
          $report=Join-Path $root 'f120-controlled-graph-development.json'
          $cmd=@('--advisory',$advisory,'--source-ref',$env:GITHUB_SHA,
            '--run-id',$env:GITHUB_RUN_ID,'--event',$env:GITHUB_EVENT_NAME,
            '--output',$report)
          & $python -B nativeevidence/f120_generated_environment.py @cmd
          if ($LASTEXITCODE -ne 0) { throw 'F120_EXECUTABLE_GENERATED_ENVIRONMENTS_QUARANTINED' }
          $r=Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($r.schema -cne 'forge.autonomy.f120.generated-environment-controlled-public-experiment.v1' -or
              $r.source_sha -cne $env:GITHUB_SHA -or
              [int64]$r.run_id -ne [int64]$env:GITHUB_RUN_ID -or
              $r.lanes.Count -ne 2 -or
              $r.actual_generated_environments_executed -ne 4 -or
              $r.paired_training_graphs -ne 96 -or
              $r.paired_disjoint_confirmation_graphs -ne 192 -or
              -not $r.train_only_selection -or
              -not $r.research_development_environment_feedback_available -or
              $r.scientific_hypothesis_fitness_accepted -or
              -not $r.mechanism_claims_still_untested -or
              $r.independent_science_accepted -ne 0 -or
              $r.scientific_first_use_authorized -or
              $r.originals_dispatched -ne 0 -or
              $r.accepted_ref_mutations -ne 0 -or
              $r.optimizer_promotions -ne 0 -or
              $r.Codex_calls -ne 0 -or
              $r.paid_model_calls -ne 0 -or
              $r.new_scheduler -or
              $r.ckb_plane_contact -or
              $r.cloudflare_writes -ne 0 -or
              $r.mind_palace_writes -ne 0) {
            throw 'F120_FALSE_SCIENTIFIC_SUCCESS_OR_SOURCE_PROVENANCE'
          }
          foreach ($lane in $r.lanes) {
            if ($lane.training.Count -ne 2 -or
                $lane.confirmation.Count -ne 2 -or
                -not $lane.selected_mechanism_claim_is_untested -or
                $lane.novel_scientific_mechanism_validated) {
              throw 'F120_MISSING_TWO_GENUINE_ENVIRONMENT_CANDIDATES_OR_UNEARNED_MODEL_CLAIM'
            }
            foreach ($trial in ($lane.training + $lane.confirmation)) {
              if ($trial.paired_records.Count -ne $trial.pairs) {
                throw 'F120_MISSING_PER_CASE_CONTROL_EVIDENCE'
              }
            }
            Write-Host ('F120_PUBLIC_DEV_NEXT_CHALLENGE '+$lane.lane+
              ' generated_candidate_index='+$lane.selected_generated_environment_index+
              ' heldout_gap='+$lane.confirmation_chosen_gap)
          }
          $digest=(Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $root 'f120-controlled-graph-development.sha256'),
            "$digest  f120-controlled-graph-development.json"+[Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false))
          Write-Host 'F120_GENERATED_CHALLENGE_EXPERIMENT_AND_SOURCE_ONLY_NEGATIVES=ARCHIVED'
      - name: F129 authenticated scheduled-stage admission and first-run bootstrap
        id: f129-admission
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $py=if ($IsWindows) { 'python' } else { 'python3' }
          & $py -B -m unittest discover -s nativeevidence -p 'test_f129_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F129_ADVERSARIAL_TESTS_FAILED' }
          & $py -B -m unittest discover -s nativeevidence -p 'test_f130_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F130_POSTMERGE_SOURCE_ADMISSION_TEST_FAILED' }
          & $py -B -m unittest discover -s nativeevidence -p 'test_f136_*.py' -v
