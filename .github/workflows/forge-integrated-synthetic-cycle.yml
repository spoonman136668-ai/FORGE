  f127-cross-os-byte-proof:
    needs: two-lane-synthetic
    if: github.event_name == 'schedule' && needs.two-lane-synthetic.outputs.f127_admitted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: forge-f127-synthesized-program-*
          path: f127-artifacts
          merge-multiple: false
      - name: Verify independent Ubuntu and Windows generated AST receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          reports=[]
          for os in ("ubuntu-latest","windows-latest"):
              folder=Path("f127-artifacts")/("forge-f127-synthesized-program-"+os)
              raw=(folder/"f127-program-synthesis.json").read_bytes()
              receipt=(folder/"f127-program-synthesis.sha256").read_text().strip()
              digest=hashlib.sha256(raw).hexdigest()
              assert receipt==digest+"  f127-program-synthesis.json",("F127_BAD_RECEIPT",os)
              obj=json.loads(raw)
              assert obj["schema"]=="forge.autonomy.f127.evidence-driven-program-synthesis-development.v1"
              assert obj["source_only_heldout"]["paired_correct"]==64
              assert obj["scientific_originals_dispatched"]==0
              reports.append(raw)
          assert reports[0]==reports[1],"F127_DIFFERENT_GENERATED_MECHANISMS_ACROSS_OS"
          print("F127_CROSS_OS_IDENTICAL",hashlib.sha256(reports[0]).hexdigest())
          PY

  f128-cross-platform-mechanism-proof:
    needs: two-lane-synthetic
    if: github.event_name == 'schedule' && needs.two-lane-synthetic.outputs.f128_admitted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: forge-f128-refinement-*
          path: f128-proof
          merge-multiple: false
      - name: Independently verify Ubuntu and Windows generated operators
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          reports=[]
          for os in ("ubuntu-latest","windows-latest"):
              root=Path("f128-proof")/("forge-f128-refinement-"+os)
              raw=(root/"f128-operator-expansion.json").read_bytes()
              receipt=(root/"f128-operator-expansion.sha256").read_text().strip()
              h=hashlib.sha256(raw).hexdigest()
              assert receipt==h+"  f128-operator-expansion.json",("F128_BAD_SOURCE_RECEIPT",os)
              data=json.loads(raw)
              assert data["schema"]=="forge.autonomy.f128.counterexample-expanded-mechanism-development.v1"
              assert data["candidate_count"]>0 and data["candidate_count"]<=128
              assert data["prior_linear_program_train_paired_correct"]==0
              assert data["heldout_generator_a"]["paired_correct"]==40
              assert data["heldout_generator_b"]["paired_correct"]==40
              assert data["scientific_originals_dispatched"]==0
              reports.append(raw)
          assert reports[0]==reports[1],"F128_OS_OPERATOR_OR_EVIDENCE_DRIFT"
          print("F128_BYTE_IDENTICAL",hashlib.sha256(reports[0]).hexdigest())
          PY

  f129-durable-cross-run-proof:
    needs: two-lane-synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: forge-f129-admission-*
          path: f129-admission-proof
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          pattern: forge-f124-autonomy-*
          path: f129-f124-proof
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          pattern: forge-f126-original-negative-agenda-*
          path: f129-f126-proof
          merge-multiple: false
      - name: Confirm both scheduled-stage gate decisions and durable F124/F126 receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          def read_pair(base,prefix,name,receipt):
              values=[]
              for os in ("ubuntu-latest","windows-latest"):
                  folder=Path(base)/(prefix+os)
                  raw=(folder/name).read_bytes()
                  expected=(folder/receipt).read_text(encoding="utf-8").strip()
                  actual=hashlib.sha256(raw).hexdigest()
                  assert expected==actual+"  "+name,("F129_BAD_RECEIPT",base,os)
                  values.append(raw)
              assert values[0]==values[1],("F129_DIVERGENT_HOST_RECORDS",base)
              return json.loads(values[0])
          gate=read_pair("f129-admission-proof","forge-f129-admission-",
                         "f129-admission.json","f129-admission.sha256")
          f124=read_pair("f129-f124-proof","forge-f124-autonomy-",
                         "state.json","state.sha256")
          f126=read_pair("f129-f126-proof","forge-f126-original-negative-agenda-",
                         "f126-original-negative-selected-agenda.json",
                         "f126-original-negative-selected-agenda.sha256")
          assert gate["schema"]=="forge.autonomy.f129.staged-scheduled-bootstrap-development.v1"
          assert gate["run_id"]==f124["run_id"]==f126["run_id"]
          assert gate["source_sha"]==f124["source_sha"]==f126["source_sha"]
          assert f124["scientific_originals"]==0
          assert f126["new_accepted_scientific_originals"]==0
          assert f126["accepted_ref_mutations"]==0
          assert not gate["two_genuine_scheduled_main_runs_proven"]
          if gate["event"]=="schedule":
              assert f124["event"]=="schedule" and f126["event"]=="schedule"
              if gate["admissions"]["F125"]["admitted"]:
                  assert f124["continuity"]=="VERIFIED_PREVIOUS_F124_SCHEDULE"
                  assert f124["generation"]>=2 and f124["prior_record_sha256"]
              else:
                  assert f124["continuity"]=="BOOTSTRAP_NO_PREVIOUS_F124_SCHEDULE"
                  assert f124["generation"]==1
          else:
              assert gate["event"] in ("pull_request","push","workflow_dispatch")
              assert not gate["development_pr_evidence_mode"]
              assert gate["non_scheduled_source_bootstrap"]
              assert not gate["genuine_scheduled_source"]
              assert all(not gate["admissions"][stage]["admitted"]
                         for stage in ("F125","F127","F128"))
          for stage in ("F125","F127","F128"):
              entry=gate["admissions"][stage]
              assert isinstance(entry["admitted"],bool)
              if gate["event"]=="schedule" and entry["admitted"]:
                  assert isinstance(entry["prior_run_id"],int)
                  assert entry["prior_run_id"]<gate["run_id"]
              if not entry["admitted"]:
                  assert entry["prior_run_id"] is None
          print("F129_SOURCE_PRESERVING_SCHEDULE_ADMISSION_PASS",
                hashlib.sha256(json.dumps(gate,sort_keys=True,separators=(",",":")).encode()).hexdigest())
          PY
