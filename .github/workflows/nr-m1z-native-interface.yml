name: NR-M1Z Existing Native Predictive-State Interface (Source-only)
on:
  pull_request:
    paths:
      - 'research/nr-m1x/nr_m1z_*.py'
      - 'research/nr-m1x/test_nr_m1z_interface.py'
      - 'research/nr-m1x/NR_M1Z_PREREG.json'
      - '.github/workflows/nr-m1z-native-interface.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-existing-native-interface:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact standalone original native source-only interface test
        run: python -B -m unittest discover -s research/nr-m1x -p 'test_nr_m1z_interface.py' -v
      - name: Reject tracked source mutations
        run: git diff --exit-code

# This test does NOT execute Farama, approve any cohort or modify native repos.