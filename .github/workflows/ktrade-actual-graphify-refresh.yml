name: KTRADE actual Graphify Obsidian refresh via existing FORGE Windows runner
on:
  push:
    branches:
      - qualification/ktrade-actual-knowledge-refresh-20261027
    paths:
      - .github/workflows/ktrade-actual-graphify-refresh.yml
permissions:
  contents: read
jobs:
  refresh:
    if: github.actor == 'spoonman136668-ai'
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 40
    env:
      KTRADE_EXPECTED_SOURCE: a359e86d05e5ba24b71a1f4bdd8a5e36ebd31b58
      KTRADE_KNOWLEDGE_BASE: bff5c67f0d9af2af7b653bd9351a9d1ef99c3822
      GRAPHIFY_QUERY_LOG_DISABLE: '1'
      GRAPHIFY_QUERY_LOG_RESPONSES: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Regenerate and publish source-pinned private advisory artifacts, never main
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'self-hosted'){throw 'LOCAL_WINDOWS_REQUIRED'}
          if(-not (Get-Command gh -ErrorAction SilentlyContinue)){throw 'GH_LOCAL_AUTH_TOOL_MISSING'}
          if(-not (Get-Command uvx -ErrorAction SilentlyContinue)){throw 'GRAPHIFY_UVX_TOOL_MISSING'}
          $scratch=Join-Path $env:RUNNER_TEMP ('private-ktrade-graph-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $scratch){throw 'SCRATCH_COLLISION'}
          New-Item -ItemType Directory -Path $scratch|Out-Null
          $source=Join-Path $scratch 'source'
          $knowledge=Join-Path $scratch 'knowledge'
          $log=Join-Path $scratch 'private-tool-output.log'
          try {
            # This host is registered for FORGE. It must have separately authorized
            # read/write GitHub CLI access to these PRIVATE repos; never reuse
            # FORGE GITHUB_TOKEN or copy secrets into public artifacts.
            & gh repo clone spoonman136668-ai/ktrade $source -- --no-checkout *> $log
            if($LASTEXITCODE -ne 0){throw 'PRIVATE_KTRADE_CLONE_FAILED'}
            & git -C $source checkout --detach $env:KTRADE_EXPECTED_SOURCE *> $log
            if($LASTEXITCODE -ne 0){throw 'PRIVATE_SOURCE_SHA_NOT_FOUND'}
            if((git -C $source rev-parse HEAD).Trim() -cne $env:KTRADE_EXPECTED_SOURCE -or
               @(git -C $source status --porcelain --untracked-files=all).Count -gt 0){throw 'SOURCE_NOT_PINNED_CLEAN'}
            & gh repo clone spoonman136668-ai/ktrade-knowledge $knowledge *> $log
            if($LASTEXITCODE -ne 0){throw 'PRIVATE_KNOWLEDGE_CLONE_FAILED'}
            & git -C $knowledge fetch origin knowledge/source-pinned-graphify-refresh-20261027 *> $log
            if($LASTEXITCODE -ne 0){throw 'KNOWLEDGE_BRANCH_NOT_FOUND'}
            & git -C $knowledge checkout -B knowledge/source-pinned-graphify-refresh-20261027 FETCH_HEAD *> $log
            if($LASTEXITCODE -ne 0 -or (git -C $knowledge rev-parse HEAD).Trim() -cne $env:KTRADE_KNOWLEDGE_BASE){throw 'KNOWLEDGE_BASE_DRIFT'}
            if(@(git -C $knowledge status --porcelain --untracked-files=all).Count -gt 0){throw 'KNOWLEDGE_NOT_CLEAN'}
            $version=(& uvx --from 'graphifyy==0.9.53' graphify --version 2>$log) -join ' '
            if($LASTEXITCODE -ne 0 -or $version -notmatch '0\.9\.53'){throw 'GRAPHIFY_VERSION_DRIFT'}
            Push-Location $source
            try {
              & uvx --from 'graphifyy==0.9.53' graphify extract . --code-only --force *> $log
              if($LASTEXITCODE -ne 0){throw 'GRAPHIFY_SOURCE_EXTRACTION_FAILED'}
              $original=Join-Path $source 'graphify-out/graph.json'
              if(-not (Test-Path -LiteralPath $original -PathType Leaf)){throw 'SOURCE_GRAPH_MISSING'}
              $newVault=Join-Path $scratch 'generated-vault'
              & uvx --from 'graphifyy==0.9.53' graphify export obsidian --graph $original --dir $newVault *> $log
              if($LASTEXITCODE -ne 0){throw 'OBSIDIAN_EXPORT_FAILED'}
            }finally{Pop-Location}
            $notes=@(Get-ChildItem -LiteralPath $newVault -File -Recurse -Filter '*.md')
            if($notes.Count -lt 1 -or $notes.Count -gt 25000){throw 'OBSIDIAN_NOTE_COUNT_LIMIT'}
            $noteBytes=($notes|Measure-Object -Property Length -Sum).Sum
            if($noteBytes -gt 125000000){throw 'OBSIDIAN_BYTES_LIMIT'}
            $newGraph=Join-Path $knowledge 'Graphify/Source/graph.json'
            $targetVault=Join-Path $knowledge 'Graphify/Obsidian'
            New-Item -ItemType Directory -Force (Split-Path $newGraph -Parent) | Out-Null
            Copy-Item -LiteralPath $original -Destination $newGraph -Force
            if(Test-Path $targetVault){Remove-Item $targetVault -Recurse -Force}
            Copy-Item -LiteralPath $newVault -Destination $targetVault -Recurse -Force
            $digest=(Get-FileHash $newGraph -Algorithm SHA256).Hash.ToLowerInvariant()
            $record=[ordered]@{
              schema='ktrade.graphify.source-pinned.v2'
              source_repo='spoonman136668-ai/ktrade'
              source_commit=$env:KTRADE_EXPECTED_SOURCE
              source_branch='main'
              graphify_version='0.9.53'
              mode='code-only'
              model_calls=0
              graph_sha256=$digest
              obsidian_notes=$notes.Count
              binding_status='bound-clean'
              authority='advisory_navigation_only'
              promotion_authorized=$false
            }
            $record|ConvertTo-Json -Depth 5|Set-Content -LiteralPath (Join-Path $knowledge 'Graphify/Source/LAST-BUILD.json') -Encoding utf8
            @(
              '# Graphify — KTRADE'
              ''
              'Advisory source-pinned, code-only graph and Obsidian navigation.'
              ('Source: spoonman136668-ai/ktrade @ '+$env:KTRADE_EXPECTED_SOURCE)
              'Generator: graphifyy 0.9.53 (no model calls).'
              ('Graph SHA-256: '+$digest)
              ('Obsidian notes: '+$notes.Count)
              ''
              'This reflects the pinned ktrade source, not ckb DIC drafts or other review branches.'
              'This is not release acceptance, runtime evidence, or approval to trade.'
            )|Set-Content (Join-Path $knowledge 'Graphify/README.md') -Encoding utf8
            & git -C $knowledge add -A -- Graphify/Source/graph.json Graphify/Source/LAST-BUILD.json Graphify/Obsidian Graphify/README.md
            if($LASTEXITCODE -ne 0){throw 'GIT_STAGE_FAILED'}
            $paths=@(git -C $knowledge diff --cached --name-only)
            if($paths.Count -lt 2 -or @($paths|Where-Object {$_ -notlike 'Graphify/*'}).Count -gt 0){throw 'GENERATED_SCOPE_FAILED'}
            & git -C $knowledge -c user.name='FORGE source-pinned knowledge' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh exact-KTRADE advisory Graphify and Obsidian source map' *> $log
            if($LASTEXITCODE -ne 0){throw 'KNOWLEDGE_COMMIT_FAILED'}
            & git -C $knowledge push origin HEAD:knowledge/source-pinned-graphify-refresh-20261027 *> $log
            if($LASTEXITCODE -ne 0){throw 'PRIVATE_KNOWLEDGE_BRANCH_PUSH_FAILED'}
            Write-Host 'KTRADE_GRAPHIFY_OBSIDIAN_LOCAL_REFRESH=PASS'
            Write-Host ('KTRADE_EXACT_SOURCE_SHA='+$env:KTRADE_EXPECTED_SOURCE)
            Write-Host ('KTRADE_GENERATED_NOTES='+$notes.Count)
            Write-Host ('KTRADE_GENERATED_GRAPH_SHA256='+$digest)
            Write-Host 'KTRADE_PRODUCTION_AND_MAIN_UNMODIFIED=PASS'
          }finally{
            Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue
          }
