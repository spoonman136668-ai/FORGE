    if: github.actor == 'spoonman136668-ai' && github.event.created == true && (github.ref == format('refs/heads/f139-owner-release-restore-42188092420-{0}', github.sha) || github.ref == format('refs/heads/f139-owner-release-restore-42195953740-{0}', github.sha))
