            Write-Host 'F139_V38_ORIGINAL_NATIVE_REACTIVATION=PASS'
            Write-Host 'F139_V38_EXISTING_TASK_RESUMED=PASS'
            Write-Host 'F139_V38_SCIENTIFIC_FIRST_USE=FALSE'
            Write-Host 'F139_V38_NEW_CONTROLLER=FALSE'
            Write-Host 'F139_V38_PAID_API_CALLS=0'
