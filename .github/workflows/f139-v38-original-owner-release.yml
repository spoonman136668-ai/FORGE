                  $remaining=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction Stop |
                    Where-Object {$_.CommandLine -and
                      $_.CommandLine.Contains('f139.local_controller') -and
                      $_.CommandLine.Contains($dbPath)})
                  if($remaining.Count -eq 0){break}
                  Start-Sleep -Seconds 1
                }
                if([string](Get-ScheduledTask -TaskName $name -ErrorAction Stop).State -cne 'Disabled' -or
                   $remaining.Count -ne 0) {
                  throw 'F139_V38_POSTMUTATION_QUIESCENCE_UNVERIFIED'
                }
                Write-Warning 'F139_V38_POSTMUTATION_EXISTING_TASK_DISABLED_AND_QUIESCENT'
              } catch {
                Write-Warning 'F139_V38_POSTMUTATION_EXISTING_TASK_HOLD_UNVERIFIED'
              }
            }
            throw
          }

  recover-pretransition-v38:
