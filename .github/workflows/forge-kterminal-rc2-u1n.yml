name: RC2-U1N K-Terminal corrected nested-fixture Windows qualification
on:
  push:
    branches: [qualification/kterminal-rc2-u1n-corrected-final-20261021]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 85
    env:
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '1'
      GOFLAGS: '-p=1'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: FORGE source and runner isolation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-rc2-u1n-corrected-final-20261021' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:RUNNER_OS -cne 'Windows' -or
              $env:K_TERMINAL_EXECUTION_MODE -cne 'PAPER') { throw 'RC2_U1N_ISOLATION_FAILED' }
          $diff=@(git diff --name-only 5662e3586bc9d12c90033b7c0344ca65ea1ad2a0 HEAD)
          if (($diff -join '|') -cne '.github/workflows/forge-kterminal-rc2-u1n.yml') { throw 'RC2_U1N_FORGE_SCOPE_DRIFT' }
          foreach ($n in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
                'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET')) {
            if (-not [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($n))) { throw 'RC2_U1N_BROKER_ENV_BLOCKED' }
          }
          Write-Host 'RC2_U1N_ISOLATION=PASS'
      - name: Checkout pinned private combined K-Terminal
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: ca0f2ce5c518620ab50f6f75bfa12d25f2b55de1
          path: kterminal-private
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Original source, changed-file scope and PowerShell parser
        shell: pwsh
        working-directory: kterminal-private
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne 'ca0f2ce5c518620ab50f6f75bfa12d25f2b55de1') { throw 'RC2_U1N_SOURCE_DRIFT' }
          $expected=@('dashboard-ui.ps1','pkg/p5-runtime-latency-observer.go','tools/graphify/doc.go',
              'tools/graphify/g27_type_calls.go','tools/graphify/g30_type_calls.go',
              'tools/graphify/g31_interpackage_calls.go','tools/graphify/g44_ast_call_witness.go')
          $actual=@(git diff --name-only eb5d225ae73b698a59c68d840daf1ec678e1a0ec HEAD)
          if (($actual -join '|') -cne ($expected -join '|')) { throw 'RC2_U1N_SEVEN_FILE_SCOPE_FAIL' }
          $t=$null;$e=$null
          [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path 'dashboard-ui.ps1').Path,[ref]$t,[ref]$e) | Out-Null
          if (@($e).Count -gt 0) { throw 'RC2_U1N_WPF_PARSE_FAIL' }
          Write-Host 'RC2_U1N_SCOPE_AND_WPF_PARSER=PASS'
      - name: Establish source-required nested Windows fixture custody
        shell: bash
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/rc2-u1n/workspace"
          mkdir -p "$w/auth" "$w/tail" "$w/private"
          for d in "$w/auth" "$w/tail" "$w/private"; do
            test -d "$d"
            [[ "$d" == "$w/"* ]] || { echo RC2_U1N_NESTED_RETENTION=FAIL; exit 2; }
          done
          {
            echo "K_TERMINAL_TEST_WORKSPACE=$w"
            echo "KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT=$w/auth"
            echo "KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT=$w/tail"
            echo "KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT=$w/private"
          } >> "$GITHUB_ENV"
          echo RC2_U1N_NESTED_RETENTION=PASS
          echo RC2_U1N_PRIOR_IDENTICAL_SOURCE_COMPILE_AND_P5_PASS_RUN=39580773094
      - name: Seven remaining original native test roots with corrected fixture custody
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          go version | grep -q 'go1.26.5 windows/amd64'
          set +e
          go test -json -count=1 -p=1 -parallel=1 -timeout=35m '-run=^(TestNativeRuntimeProfileColdV2OriginalActorReady|TestNativeRuntimeProfileColdV2UnauthorizedChangeBlocked|TestStage3MixedNativeHistoryProductionIntelligenceV2|TestStage3NativeHistoricalHistoryCheckpointV2|TestStage3NativeActiveProductionShutdown|TestStage3DrawdownMarkProcessKillBoundariesV1|TestStage3AuthenticatedNativeSellPostBoundaries)$' ./pkg > "$RUNNER_TEMP/rc2-u1n-focus-private.jsonl" 2> "$RUNNER_TEMP/rc2-u1n-focus-private.stderr"
          rc=$?
          set -e
          export RC2_U1N_FOCUS_EXIT="$rc"
          python -B - <<'PY'
          import json,os,pathlib,re,sys
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'rc2-u1n-focus-private.jsonl'
          if not p.is_file() or p.stat().st_size>180000000:
              print('RC2_U1N_FOCUSED_LOG_BOUNDS=FAIL');sys.exit(2)
          roots=['TestNativeRuntimeProfileColdV2OriginalActorReady','TestNativeRuntimeProfileColdV2UnauthorizedChangeBlocked',
              'TestStage3MixedNativeHistoryProductionIntelligenceV2','TestStage3NativeHistoricalHistoryCheckpointV2',
              'TestStage3NativeActiveProductionShutdown','TestStage3DrawdownMarkProcessKillBoundariesV1',
              'TestStage3AuthenticatedNativeSellPostBoundaries']
          actions={n:[] for n in roots};bad=0;packagefails=0
          for line in p.open(encoding='utf-8',errors='replace'):
              try:d=json.loads(line)
              except ValueError:bad+=1;continue
              name=d.get('Test')
              if name in actions and d.get('Action') in ('run','pass','fail','skip'):
                  actions[name].append(d['Action'])
              if d.get('Action')=='fail' and not isinstance(name,str):packagefails+=1
          failed=[]
          for name,items in actions.items():
              status='FAIL' if 'fail' in items else 'PASS' if 'pass' in items else 'SKIP' if 'skip' in items else 'INCOMPLETE'
              print('RC2_U1N_FOCUSED_'+name+'='+status)
              if status!='PASS':failed.append(name)
          print('RC2_U1N_FOCUS_JSON_PARSE_ERRORS='+str(bad))
          print('RC2_U1N_FOCUS_PACKAGE_FAIL_COUNT='+str(packagefails))
          if int(os.environ['RC2_U1N_FOCUS_EXIT']) or failed or bad or packagefails:
              print('RC2_U1N_FOCUSED_GATE=FAIL_NOT_WAIVED');sys.exit(1)
          print('RC2_U1N_FOCUSED_GATE=PASS')
          PY
      - name: Full Windows regression with bounded failing test names
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          set +e
          go test -json -count=1 -p=1 -parallel=1 -timeout=36m ./... > "$RUNNER_TEMP/rc2-u1n-full-private.jsonl" 2> "$RUNNER_TEMP/rc2-u1n-stderr-private"
          rc=$?
          set -e
          export RC2_U1N_EXIT="$rc"
          python -B - <<'PY'
          import json,os,pathlib,re,sys
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'rc2-u1n-full-private.jsonl'
          if not p.is_file() or p.stat().st_size>120000000:
              print('RC2_U1N_LOG_BOUND=FAIL');sys.exit(2)
          failed=set();packages=0;parse=0
          for line in p.open(encoding='utf-8',errors='replace'):
              try: e=json.loads(line)
              except ValueError:parse+=1;continue
              if e.get('Action')!='fail':continue
              name=e.get('Test')
              if not isinstance(name,str):packages+=1;continue
              root=name.split('/')[0]
              if re.fullmatch(r'Test[A-Za-z0-9_]{1,100}',root):failed.add(root)
          if int(os.environ['RC2_U1N_EXIT']):
              print('RC2_U1N_FULL_REGRESSION=FAIL_NOT_WAIVED')
              print('RC2_U1N_FAILED_TEST_ROOTS='+(','.join(sorted(failed)[:8]) if failed else 'NOT_REPORTED'))
              print('RC2_U1N_PACKAGE_FAILURES='+str(packages))
              print('RC2_U1N_PARSE_FAILURES='+str(parse))
              sys.exit(1)
          if failed or packages or parse:
              print('RC2_U1N_STRUCTURED_LOG_INCONSISTENT');sys.exit(2)
          print('RC2_U1N_FULL_REGRESSION=PASS')
          PY
      - name: Vet and stopped Windows build
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          if ! go vet ./... > "$RUNNER_TEMP/rc2-u1n-vet-private" 2>&1; then
            echo RC2_U1N_VET=FAIL
            exit 1
          fi
          echo RC2_U1N_VET=PASS
          if ! go build ./... > "$RUNNER_TEMP/rc2-u1n-build-private" 2>&1; then
            echo RC2_U1N_BUILD=FAIL
            exit 1
          fi
          echo RC2_U1N_STOPPED_BUILD=PASS
          echo RC2_U1N_SEVEN_SECOND_FIELD_LATENCY=NOT_MEASURED
