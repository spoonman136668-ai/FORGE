name: MP-AI source cards original FORGE Windows read-only qualification
on:
  push:
    branches: [qualification/mpai-sourcecards-original-windows-20261028]
    paths: ['.github/workflows/mpai-structured-evidence-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: mpai-sourcecards-original-windows-20261028
  cancel-in-progress: false
jobs:
  read-only-qualification:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 24
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CREDENTIAL_INTERACTIVE: 'never'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: 'core.longpaths'
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Pin private Mind-Palace candidate, run genuine Windows tests, preserve source immutability
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') {
            throw 'MPAI_SOURCECARDS_WRONG_ORIGINAL_RUNNER'
          }
          $expected='529d856cb2cac05e5b945711c82ad3199700c4c4'
          $expectedRecords='fecf51aa59bd24bfac0c852d53f88c88e6d7c9c1de6848e6c1bab5f45a3c9742'
          $scratch=Join-Path $env:RUNNER_TEMP ('mpai-sourcecard-'+$env:GITHUB_RUN_ID)
          $repo=Join-Path $scratch 'private-source'
          $changedLocation=$false
          try {
            if(Test-Path -LiteralPath $scratch) { throw 'MPAI_SOURCECARDS_SCRATCH_ALREADY_EXISTS' }
            New-Item -ItemType Directory -Path $scratch -ErrorAction Stop | Out-Null
            & git clone --quiet --single-branch --branch proposal/mpai-optin-source-cards-20261028 https://github.com/spoonman136668-ai/Mind-Palace.git $repo *> (Join-Path $scratch 'private-clone.log')
            if($LASTEXITCODE -ne 0) { throw 'MPAI_SOURCECARDS_PRIVATE_CLONE_FAILED' }
            $seen=(& git -C $repo rev-parse HEAD).Trim()
            if($seen -cne $expected) { throw 'MPAI_SOURCECARDS_EXACT_SOURCE_DRIFT' }
            $records=Join-Path $repo '.ice/records.json'
            if((Get-FileHash -Algorithm SHA256 -LiteralPath $records).Hash.ToLowerInvariant() -cne $expectedRecords) {
              throw 'MPAI_SOURCECARDS_ACCEPTED_MEMORY_HASH_DRIFT'
            }
            $guard=@('.ice/records.json','.ice/source-ledger.json','archive/index.json',
              '.ice/remote-bootstrap.json','.ice/remote-catalog.json','.ice/remote-index.ndjson',
              '.ice/chat-delta-state.json','.ice/project-state-capsules.json','.ice/project-dependency-graph.json')
            $before=@{}
            foreach($rel in $guard) {
              $p=Join-Path $repo $rel
              if(-not(Test-Path -LiteralPath $p)) { throw ('MPAI_SOURCECARDS_REQUIRED_GUARD_MISSING:'+ $rel) }
              $before[$rel]=(Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash
            }
            Push-Location $repo
            $changedLocation=$true
            foreach($pattern in @('test_mpai_source_cards.py','test_mpn1_mcp.py',
              'test_mpai01_mcp_adapter.py','test_mpai02_probe_mcp.py',
              'test_mpai04_admitted_memory.py','test_mpai_integrated_cycle.py')) {
              Write-Host ('MPAI_TEST_NAME='+$pattern)
              & python -B -m unittest discover -s tests -p $pattern -v
              if($LASTEXITCODE -ne 0) { throw ('MPAI_SOURCECARDS_PYTHON_TEST_FAILED:'+ $pattern) }
            }
            Write-Host 'MPAI_SOURCECARDS_SIX_FOCUSED_SUITES=PASS'
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\Test-All.ps1
            if($LASTEXITCODE -ne 0) { throw 'MPAI_SOURCECARDS_ORIGINAL_WINDOWS_FULL_REGRESSION_FAILED' }
            Write-Host 'MPAI_SOURCECARDS_FULL_WINDOWS_REGRESSION=PASS'
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\mind.ps1 validate
            if($LASTEXITCODE -ne 0) { throw 'MPAI_SOURCECARDS_STORE_VALIDATION_FAILED' }
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\archive.ps1 validate
            if($LASTEXITCODE -ne 0) { throw 'MPAI_SOURCECARDS_ARCHIVE_VALIDATION_FAILED' }
            foreach($rel in $guard) {
              if((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $repo $rel)).Hash -cne $before[$rel]) {
                throw ('MPAI_SOURCECARDS_PROTECTED_SOURCE_MUTATED:'+ $rel)
              }
            }
            if(@(& git -C $repo status --porcelain --untracked-files=all).Count -ne 0) {
              throw 'MPAI_SOURCECARDS_CHECKOUT_MUTATED'
            }
            Write-Host 'MPAI_SOURCECARDS_NINE_PROTECTED_HASHES=PASS'
            Write-Host ('MPAI_SOURCECARDS_EXACT_CANDIDATE_SHA='+$expected)
            Write-Host ('MPAI_SOURCECARDS_RECORD_DIGEST='+$expectedRecords)
            Write-Host 'MPAI_SOURCECARDS_PRODUCTION_WRITES=0'
            Write-Host 'MPAI_SOURCECARDS_MODEL_CALLS=0'
            Write-Host 'MPAI_SOURCECARDS_INDEPENDENT_HOLDOUT=NOT_RUN'
            Write-Host 'MPAI_SOURCECARDS_SCIENCE_COMPOSE=NO_GO'
          } finally {
            if($changedLocation) { Pop-Location }
            if(Test-Path -LiteralPath $scratch) {
              Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction Stop
            }
          }
