name: L9 neural SELECT evaluator prefit qualification
on:
  push:
    branches: [research/optimizer-language-l9-webnlg-transfer-20261023]
    paths:
      - '.github/workflows/optimizer-language-l9-neural-select-prefit.yml'
permissions:
  contents: read
concurrency:
  group: l9-neural-select-prefit-repaired-20261024
  cancel-in-progress: false
jobs:
  static-and-adversarial:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify frozen neural SELECT evaluator and test on both OSes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '45b866c843bf99c2ee3d34da2b6b50f5c8d0c286'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/optimizer-language-l9-neural-select-prefit.yml'
          p='research/optimizer_language_l9'
          test "$(git rev-parse HEAD:$p/l9_model_suite.py)" = '710ce648a30ffc55647f689c5f4aa3ac13b07066'
          test "$(git rev-parse HEAD:$p/l9_neural_select_only.py)" = '91f8108af5e6f3a25e2a8ca07dc3674bd2358f4e'
          test "$(git rev-parse HEAD:$p/test_l9_neural_select_only.py)" = '482c3d2f63aa392a9ed6b9ead4a38c038fb05da4'
          test "$(git rev-parse HEAD:$p/L9_MODEL_CONTRACT.json)" = '4eab05a2b9011ebbaa34d01778e7f185807704c2'
          test "$(git rev-parse HEAD:$p/L9_SPLIT_RECEIPT.json)" = 'ca3e41e2835713bc922c56542656489f202c55cf'
          python -m py_compile "$p/l9_neural_select_only.py" "$p/test_l9_neural_select_only.py"
          (cd "$p" && python -m unittest -v test_l9_neural_select_only.py test_l9_neural_train_only.py test_l9_train_select_candidate.py test_l9_model_suite.py test_l9_split_builder.py)
          python -c 'import pathlib,shutil; [shutil.rmtree(p) for p in pathlib.Path("research/optimizer_language_l9").rglob("__pycache__")]'
          test -z "$(git status --porcelain)"
          echo L9_NEURAL_SELECT_PREFIT=PASS
          echo L9_NEURAL_CHECKPOINT_SELECT_EXPOSURE=FALSE
          echo L9_AUDIT_DEV_REFERENCE_CONSUMED=FALSE
          echo L9_OFFICIAL_TEST_CONSUMED=FALSE
