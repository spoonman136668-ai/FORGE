name: FORGE F139 V38 original owner bounded task guard diagnostic once
# No schedule, automatic push or dispatch; only a NEW owner issue #807 comment.
# The workflow never reads SQLite content, mutates tasks, or repeats failed V38.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  actions: read
  pull-requests: read
# The ORIGINAL V41 owner activity and this diagnosis cannot overlap.
concurrency:
  group: forge-f139-v41-original-owner-live-install
  cancel-in-progress: false
jobs:
  original-owner-v38-guard-diagnostic:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'spoonman136668-ai' &&
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.event.issue.number == 807 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-V38-HELD-TASK-GUARD-DIAG ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 10
    steps:
      - name: Checkout exact trusted protected-main source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read original guard only and emit bounded exit code
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: .
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
             $env:GITHUB_REF -cne 'refs/heads/main' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or
             $env:OPENAI_API_KEY) {
            throw 'F139_V38_GUARD_DIAG_WRONG_ORIGINAL_OWNER_OR_EVENT'
          }
          $checkout=(& git rev-parse HEAD | Out-String).Trim()
          $dirty=@(& git status --porcelain --untracked-files=all)
          $guard=(& git rev-parse 'HEAD:f139/nci04_v41_hybrid_forward_owner_profile.py' | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or
             $checkout -cne $env:GITHUB_SHA -or
             $dirty.Count -ne 0 -or
             $guard -cne '9bda78341bc3651e8b7b0a24ea6c7858dbff05c6') {
            throw 'F139_V38_GUARD_DIAG_SOURCE_DRIFT'
          }
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $required='F139-V38-HELD-TASK-GUARD-DIAG '+$env:GITHUB_SHA+' 6886633573'
          if($event.action -cne 'created' -or
             [string]$event.comment.body -cne $required -or
             $event.comment.user.login -cne 'spoonman136668-ai' -or
             $event.comment.author_association -cne 'OWNER' -or
             $event.sender.login -cne 'spoonman136668-ai') {
            throw 'F139_V38_GUARD_DIAG_FRESH_CANONICAL_OWNER_INTENT_REQUIRED'
          }
          & python -B -m f139.nci04_v38_held_task_guard_diagnostic
          if($LASTEXITCODE -ne 0) {
            throw 'F139_V38_ORIGINAL_OWNER_READONLY_DIAG_UNCLASSIFIED'
          }
          Write-Output 'F139_V38_GUARD_DIAG_ONE_SHOT=PASS_READONLY_CLASSIFICATION_ONLY'
          Write-Output 'F139_V38_ORIGINAL_SQLITE_OPENED=FALSE'
          Write-Output 'F139_V38_ORIGINAL_TASK_MUTATIONS=ZERO'
          Write-Output 'F139_V38_SCIENTIFIC_FIRST_USE=FALSE'
