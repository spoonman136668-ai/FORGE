name: F124-DH READONLY exact causal information and cost frontier
on:
  push:
    branches: [research/f124dh-information-budget-efficiency-20261019]
    paths: [.github/workflows/forge-f124dh-readonly-rank-audit.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: f124dh-readonly-original-DG-evidence
  cancel-in-progress: false
jobs:
  independently-readonly-reconcile:
    name: independent-readonly-original-rank-lower-bound
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen preregistration before post-result source-free code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 266d3dfa71a48409c22c9680057cbc8d843b41b4 HEAD
          git merge-base --is-ancestor f456de2ffbb8f73a292e4de330362e2f519c99f6 HEAD
          python -B -m json.tool research/north-star-transfer/f124dh-frozen-original-rank-audit.json >/dev/null
          echo 'F124DH_ORIGINAL_READONLY_PREANALYSIS_FROZEN=PASS'
      - name: Verify original DG hosted provider source and complete run, not another source birth
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url="https://api.github.com/repos/spoonman136668-ai/FORGE/actions/runs/39355584842"
          req=urllib.request.Request(url,headers={
            "Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
            "Accept":"application/vnd.github+json",
            "X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req,timeout=25) as resp:
              p=json.load(resp)
          assert p["head_sha"]=="f6c98b741c4726589e33bbb192d4ce4598d669e5"
          assert p["run_attempt"]==1
          assert p["status"]=="completed" and p["conclusion"]=="success"
          print("F124DH_AUTHENTIC_PRIOR_GITHUB_SOURCEFREE_RUN=PASS")
          PY
      - name: Retrieve ONLY immutable 72 original source-free process receipts, not oracles or model code
        uses: actions/download-artifact@v4
        with:
          name: f124dg-original-all-72-sourcefree-active-evidence
          run-id: 39355584842
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/f124dg-original-complete-readonly
      - name: Exact 163-rank theoretical bound, fully read-only independent CPU policy frontier
        shell: bash
        run: |
          set -euo pipefail
          python -B research/north-star-transfer/f124dh_readonly_rank_frontier.py \
            --source "$RUNNER_TEMP/f124dg-original-complete-readonly" \
            --out "$RUNNER_TEMP/f124dh-readonly-bound"
      - name: Retain full source-safe rank and native CPU conclusions with exact original digest
        uses: actions/upload-artifact@v4
        with:
          name: f124dh-qualified-readonly-original-DG-information-bound
          path: ${{ runner.temp }}/f124dh-readonly-bound/original-readonly-rank-lower-bounds.json
          if-no-files-found: error
          retention-days: 90
