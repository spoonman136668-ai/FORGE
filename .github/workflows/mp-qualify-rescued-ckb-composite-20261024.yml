name: MP qualify rescued CKB composite candidate
on:
  push:
    branches: [recovery/ckb-installed-source-snapshot-20261024]
    paths: [.github/workflows/mp-qualify-rescued-ckb-composite-20261024.yml]
permissions:
  contents: read
concurrency:
  group: mp-qualify-rescued-ckb-composite-20261024
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reconstruct and qualify rescued composite against live config snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          function Need([bool]$v,[string]$c){if(-not $v){throw ('MP_COMPOSITE_'+$c)}}
          function Sha([string]$p){return (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()}
          Need ($env:GITHUB_REF -ceq 'refs/heads/recovery/ckb-installed-source-snapshot-20261024') 'BRANCH'
          Need ($env:RUNNER_OS -ceq 'Windows' -and $env:RUNNER_NAME -ceq 'FORGE-CODEX-REMOTE') 'RUNNER'
          $parent='832de53e512ed455f4c39184169dd770a77c5961'
          Need ((& git.exe rev-parse 'HEAD^').Trim() -ceq $parent) 'PARENT'
          $changed=@(& git.exe diff --name-only $parent HEAD)
          Need ($changed.Count -eq 1 -and $changed[0] -ceq '.github/workflows/mp-qualify-rescued-ckb-composite-20261024.yml') 'SCOPE'
          Remove-Item Env:GITHUB_TOKEN,Env:GH_TOKEN,Env:OPENAI_API_KEY,Env:AZURE_OPENAI_API_KEY -ErrorAction SilentlyContinue

          $ckbRepo='https://github.com/spoonman136668-ai/ckb-plane.git'
          $base='ceee64384ebfd6b9e00108ae22488505a68c53d1'
          $remote=@(& git.exe ls-remote --exit-code $ckbRepo 'refs/heads/main')
          Need ($LASTEXITCODE -eq 0 -and $remote.Count -eq 1 -and ([string]($remote[0]-split '\s+')[0]) -ceq $base) 'MAIN_DRIFT'

          $rescueRoot=Join-Path $env:GITHUB_WORKSPACE 'recovery\ckb-installed-source-snapshot-20261024\source'
          $manifestPath=Join-Path $rescueRoot 'RESCUE-MANIFEST.json'
          Need (Test-Path -LiteralPath $manifestPath -PathType Leaf) 'RESCUE_MANIFEST'
          Need ((Sha $manifestPath) -ceq '8e0a58912b7dac47a5600d508f8e86d44a7ace1f28383fd446e5b67167af81cd') 'RESCUE_MANIFEST_HASH'
          $manifest=Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          Need (@($manifest).Count -eq 205) 'RESCUE_FILE_COUNT'
          $assetManifestPath=Join-Path $rescueRoot 'RESCUE-EMBED-ASSET-MANIFEST.json'
          Need (Test-Path -LiteralPath $assetManifestPath -PathType Leaf) 'ASSET_MANIFEST'
          Need ((Sha $assetManifestPath) -ceq '09b4c02abf877c280048c5eb8d66881126db99e4777f1035eff38288d581f4d9') 'ASSET_MANIFEST_HASH'
          $assetManifest=Get-Content -LiteralPath $assetManifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          Need (@($assetManifest).Count -eq 5) 'ASSET_FILE_COUNT'
          $overlay=@($manifest)+@($assetManifest)
          Need ($overlay.Count -eq 210) 'OVERLAY_COUNT'

          $live='C:\Users\camar\GolandProjects\ckb-plane'
          $liveConfig=Join-Path $live 'config\autonomy.yaml'
          $liveExe=Join-Path $live 'bin\ckb-plane.exe'
          Need (Test-Path -LiteralPath $liveConfig -PathType Leaf) 'LIVE_CONFIG'
          Need (Test-Path -LiteralPath $liveExe -PathType Leaf) 'LIVE_EXE'
          $protected=@($liveConfig,$liveExe)
          foreach($p in @(
            (Join-Path $live 'config\local-operations.json'),
            (Join-Path $live 'internal\plane\model.go'),
            (Join-Path $live 'internal\plane\autonomy.go'),
            (Join-Path $live 'internal\plane\engine.go'),
            (Join-Path $live 'internal\plane\status_projection.go'),
            (Join-Path $live 'scripts\Start-CKBPlane.ps1')
          )){if(Test-Path -LiteralPath $p -PathType Leaf){$protected += $p}}
          $pre=@{}
          foreach($p in $protected){$pre[$p]=Sha $p}
          $procs=@(Get-CimInstance Win32_Process -Filter "Name='ckb-plane.exe'" -ErrorAction Stop)
          Need ($procs.Count -eq 1) 'CONTROLLER_SINGLETON'
          $controllerPid=[int]$procs[0].ProcessId

          $scratch=Join-Path $env:RUNNER_TEMP ('mp-composite-'+$env:GITHUB_RUN_ID)
          Need (-not (Test-Path -LiteralPath $scratch)) 'SCRATCH_COLLISION'
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $clone=Join-Path $scratch 'ckb'
          $snapshot=Join-Path $scratch 'live-snapshot.db'
          $configCopy=Join-Path $scratch 'autonomy.yaml'
          Copy-Item -LiteralPath $liveConfig -Destination $configCopy -Force
          $liveConfigHash=Sha $liveConfig
          Write-Host ('MP_COMPOSITE_LIVE_CONFIG_SHA256='+$liveConfigHash)

          $py=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          try {
            & python.exe -B -c $py $live $liveConfig $snapshot
            Need ($LASTEXITCODE -eq 0) 'SNAPSHOT'

            & git.exe clone --quiet --filter=blob:none --no-checkout $ckbRepo $clone
            Need ($LASTEXITCODE -eq 0) 'CLONE'
            & git.exe -C $clone checkout --quiet --detach $base
            Need ($LASTEXITCODE -eq 0 -and ((& git.exe -C $clone rev-parse HEAD).Trim() -ceq $base)) 'BASE_CHECKOUT'
            $source=Join-Path $clone 'snapshot\source'

            foreach($row in @($overlay)){
              $rel=([string]$row.path).Replace('/','\')
              $src=Join-Path $rescueRoot $rel
              $dst=Join-Path $source $rel
              Need (Test-Path -LiteralPath $src -PathType Leaf) ('RESCUE_PATH_'+$rel)
              Need ((Sha $src) -ceq [string]$row.sha256) ('RESCUE_HASH_'+$rel)
              New-Item -ItemType Directory -Path (Split-Path -Parent $dst) -Force | Out-Null
              Copy-Item -LiteralPath $src -Destination $dst -Force
              Need ((Sha $dst) -ceq [string]$row.sha256) ('OVERLAY_HASH_'+$rel)
            }
            Write-Host 'MP_COMPOSITE_OVERLAY_210=PASS'

            $testPath=Join-Path $source 'internal\plane\mp_recovery_live_compat_test.go'
            $go=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
            [IO.File]::WriteAllText($testPath,$go,[Text.UTF8Encoding]::new($false))

            Push-Location $source
            try {
              $env:MP_LIVE_CONFIG_COPY=$configCopy
              $env:MP_LIVE_ROOT=$live
              $env:MP_LIVE_DB_SNAPSHOT=$snapshot

              & go.exe test ./internal/plane -run '^(TestMPRecoveryLiveCompatibility|Test.*Preservation.*|Test.*R220.*|Test.*MindPalace.*)$' -count=1
              Need ($LASTEXITCODE -eq 0) 'FOCUSED'
              Write-Host 'MP_COMPOSITE_FOCUSED=PASS'

              & go.exe test ./... -count=1
              Need ($LASTEXITCODE -eq 0) 'FULL_REGRESSION'
              Write-Host 'MP_COMPOSITE_FULL_REGRESSION=PASS'

              $built=Join-Path $scratch 'ckb-plane-rescued-composite.exe'
              & go.exe build -trimpath -o $built ./cmd/ckb-plane
              Need ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $built -PathType Leaf)) 'BUILD'
              Write-Host ('MP_COMPOSITE_BUILD_SHA256='+(Sha $built))
              Write-Host 'MP_COMPOSITE_LIVE_CONFIG_PARSE_AND_INIT=PASS'
              Write-Host 'MP_COMPOSITE_SECOND_CONTROLLER_STARTS=0'
            } finally {
              Remove-Item Env:MP_LIVE_CONFIG_COPY,Env:MP_LIVE_ROOT,Env:MP_LIVE_DB_SNAPSHOT -ErrorAction SilentlyContinue
              Pop-Location
            }

            $after=@(Get-CimInstance Win32_Process -Filter "Name='ckb-plane.exe'" -ErrorAction Stop)
            Need ($after.Count -eq 1 -and [int]$after[0].ProcessId -eq $controllerPid) 'CONTROLLER_POSTIMAGE'
            foreach($p in $protected){Need ((Sha $p) -ceq $pre[$p]) ('PROTECTED_POSTIMAGE_'+[IO.Path]::GetFileName($p))}
            Write-Host 'MP_COMPOSITE_CONTROLLER_AND_PROTECTED_FILES_UNCHANGED=PASS'
            Write-Host 'MP_COMPOSITE_LIVE_SQLITE_WRITES=0'
            Write-Host 'MP_COMPOSITE_QUEUE_MUTATIONS=0'
            Write-Host 'MP_COMPOSITE_CONTROLLER_COMMANDS=0'
            Write-Host 'MP_COMPOSITE_PRODUCTION_WRITES=0'
          } finally {
            if(Test-Path -LiteralPath $scratch){Remove-Item -LiteralPath $scratch -Recurse -Force}
            Need (-not (Test-Path -LiteralPath $scratch)) 'SCRATCH_CLEAN'
            Write-Host 'MP_COMPOSITE_SCRATCH_CLEAN=PASS'
          }
