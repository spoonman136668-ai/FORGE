name: Mind-Palace G77 exact receipt delta Windows qualification
on:
  push:
    branches: [qualification/mpgraph-g77-receipt-delta-20261028]
    paths:
      - .github/workflows/mpgraph-g77-exact-receipts-delta.yml
permissions:
  contents: read
concurrency:
  group: mpgraph-g77-delta-20261028
  cancel-in-progress: false
jobs:
  qualify-receipt-delta:
    if: github.repository == 'spoonman136668-ai/FORGE' && github.actor == 'spoonman136668-ai'
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 18
    env:
      MP_EXPECTED: 'a8761a9004d677e25536061bcd73387496475dbd'
      MP_BRANCH: 'docs/forge-graphify-g67-review-20261028'
      KNOWLEDGE_EXPECTED: '3eaa9f770de2aef93efbefc6e4ea24a492c87570'
      GIT_TERMINAL_PROMPT: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      RESEARCH_SCIENTIFIC_AUTHORITY: '0'
      RESEARCH_PROMOTION_ALLOWED: '0'
      KTRADE_LIVE_AUTHORITY: '0'
    steps:
      - name: Exact isolated qualification harness checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify private exact commit and source-only receipts with original Windows checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'self-hosted'){throw 'MPGRAPHG77_RUNNER_OR_REPO_MISMATCH'}
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'MPGRAPHG77_HARNESS_DRIFT'}
          if($env:RESEARCH_SCIENTIFIC_AUTHORITY -cne '0' -or $env:RESEARCH_PROMOTION_ALLOWED -cne '0' -or $env:KTRADE_LIVE_AUTHORITY -cne '0'){throw 'MPGRAPHG77_AUTHORITY_BOUNDARY'}
          $who=(& gh api user --jq .login 2>$null | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $who -cne 'spoonman136668-ai'){throw 'MPGRAPHG77_WRONG_IDENTITY'}
          $private=(& gh repo view spoonman136668-ai/Mind-Palace --json isPrivate --jq .isPrivate 2>$null | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $private -cne 'true'){throw 'MPGRAPHG77_PRIVATE_SOURCE_UNVERIFIED'}
          $scratch=Join-Path $env:SystemDrive ('mg77-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $scratch){throw 'MPGRAPHG77_SCRATCH_COLLISION'}
          $null=New-Item -ItemType Directory -Path $scratch
          $src=Join-Path $scratch 'private-mind-palace'
          $log=Join-Path $scratch 'private-regression.log'
          try{
            & git -c core.longpaths=true -c 'credential.helper=!gh auth git-credential' clone --quiet --depth 1 --branch $env:MP_BRANCH https://github.com/spoonman136668-ai/Mind-Palace.git $src *> $log
            if($LASTEXITCODE -ne 0){throw 'MPGRAPHG77_PRIVATE_CLONE_FAILED'}
            $sha=(& git -C $src rev-parse HEAD | Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $sha -cne $env:MP_EXPECTED){throw 'MPGRAPHG77_EXACT_PR_HEAD_CHANGED'}
            $ice=Join-Path $src '.ice/records.json'
            $ledger=Join-Path $src '.ice/source-ledger.json'
            $ih=(Get-FileHash -LiteralPath $ice -Algorithm SHA256).Hash
            $lh=(Get-FileHash -LiteralPath $ledger -Algorithm SHA256).Hash
            Write-Host 'MPGRAPHG77_EXACT_PRIVATE_PR_SHA=PASS'
            Push-Location $src
            try {
              & python -B tests/test_advisory_graphify_registry.py *> $log
              if($LASTEXITCODE -ne 0){throw 'MPGRAPHG77_FOCUSED_RECEIPT_TEST_FAILED'}
              Write-Host 'MPGRAPHG77_FOCUSED_HISTORY_GUI_CONNECTOR_HASH=PASS'
              $r=Get-Content -LiteralPath 'docs/ADVISORY_GRAPHIFY_SNAPSHOTS.json' -Raw -Encoding utf8 | ConvertFrom-Json
              if($r.snapshots.Count -ne 3 -or $r.candidate_snapshots.Count -ne 1){throw 'MPGRAPHG77_LEGACY_CANDIDATE_COUNT'}
              $c=$r.candidate_snapshots[0]
              if($c.knowledge_commit -cne $env:KNOWLEDGE_EXPECTED -or $c.authentic_desktop_gui -cne 'PASS_EXACT_CANDIDATE_REAL_OBSIDIAN_DESKTOP' -or $c.authentic_gui_run -cne 'https://github.com/spoonman136668-ai/FORGE/actions/runs/40784318275' -or $c.chatgpt_graph_sha256_verification -cne 'PASS_INDEPENDENT_RECOMPUTATION_2026-10-28'){throw 'MPGRAPHG77_RECEIPT_MISMATCH'}
              if($c.promotion_authorized -ne $false -or $c.scientific_acceptance -cne 'NOT_GRANTED' -or $c.status -cne 'REVIEW_ONLY_PRIVATE_KNOWLEDGE_PR_UNMERGED' -or $r.snapshots[0].knowledge_commit -cne '068b99f8891a839c6c014bb77da778641a3a9540'){throw 'MPGRAPHG77_HISTORY_OR_PROMOTION_CHANGED'}
              Write-Host 'MPGRAPHG77_ADVISORY_RELEASE_BOUNDARY=PASS'
              & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/mind.ps1 validate *> $log
              if($LASTEXITCODE -ne 0){throw 'MPGRAPHG77_CURATED_VALIDATION_FAILED'}
              Write-Host 'MPGRAPHG77_CURATED_VALIDATE=PASS'
              & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/archive.ps1 validate *> $log
              if($LASTEXITCODE -ne 0){throw 'MPGRAPHG77_ARCHIVE_VALIDATION_FAILED'}
              Write-Host 'MPGRAPHG77_ARCHIVE_VALIDATE=PASS'
            } finally { Pop-Location }
            if((Get-FileHash -LiteralPath $ice -Algorithm SHA256).Hash -cne $ih -or (Get-FileHash -LiteralPath $ledger -Algorithm SHA256).Hash -cne $lh){throw 'MPGRAPHG77_CURATED_ICE_MUTATED'}
            if(@(git -C $src status --porcelain=v1 --untracked-files=no).Count -ne 0 -or (git -C $src rev-parse HEAD).Trim() -cne $env:MP_EXPECTED){throw 'MPGRAPHG77_PRIVATE_SOURCE_CHANGED'}
            Write-Host 'MPGRAPHG77_PRIVATE_SOURCE_AND_ICE_UNCHANGED=PASS'
            Write-Host 'MPGRAPHG77_DELTA_QUALIFICATION=PASS'
          } finally{
            Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host 'MPGRAPHG77_SCRATCH_CLEANUP_REQUESTED=TRUE'
          }
