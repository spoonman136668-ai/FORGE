name: MP-AI23 authentic local model decision feedback development probe
on:
  push:
    branches: [oneoff/mpai21-owner-approved-two-record-admission-20261029]
    paths: ['.github/workflows/mpai23-real-model-memory-decision-development.yml']
permissions:
  contents: read
jobs:
  original-windows:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 28
    env:
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: Never
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTHONIOENCODING: utf-8
      HF_HUB_DISABLE_TELEMETRY: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preregistered bounded matched actual CPU model trial (no production writes)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai'){
             throw 'MPAI23_ORIGINAL_OWNER_WINDOWS_REQUIRED'
          }
          if($env:OPENAI_API_KEY){ throw 'MPAI23_PAID_API_DENIED' }
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){
            throw 'MPAI23_SOURCE_COMMIT_DRIFT'
          }
          $pin=(git rev-parse 'HEAD:tools/mpai23_pairwise_memory_development.py').Trim()
          if($LASTEXITCODE -ne 0 -or $pin -cne 'c8339bfb276d119baf74e275a50721bf35959886'){
            throw 'MPAI23_FROZEN_TRIAL_CODE_DRIFT'
          }
          & python.exe -B -c 'import ast,pathlib;ast.parse(pathlib.Path("tools/mpai23_pairwise_memory_development.py").read_text(encoding="utf-8"))'
          if($LASTEXITCODE -ne 0){ throw 'MPAI23_SOURCE_SYNTAX_FAILED' }
          $scratch=Join-Path $env:RUNNER_TEMP ('mpai23-private-'+$env:GITHUB_RUN_ID)
          $source=Join-Path $scratch 'source'
          $trial=Join-Path $scratch 'trial'
          $privateLog=Join-Path $scratch 'private.log'
          function Assert([bool]$ok,[string]$why){
            if(-not $ok){throw ('MPAI23_'+$why)}
          }
          Assert (-not(Test-Path -LiteralPath $scratch)) 'SCRATCH_COLLISION'
          New-Item -ItemType Directory -Path $scratch -ErrorAction Stop|Out-Null
          $env:MPAI23_PRIVATE_SCRATCH=$trial
          $env:MPAI23_PRIVATE_SOURCE=$source
          try{
            & git.exe clone --quiet --depth 1 --single-branch --branch main https://github.com/spoonman136668-ai/Mind-Palace.git $source
            Assert ($LASTEXITCODE -eq 0) 'PRIVATE_SOURCE_AUTH'
            Assert ((& git.exe -C $source rev-parse HEAD).Trim() -ceq '84ad556910c869afa2f171673d5a5b4041a4a9b4') 'EXACT_ACCEPTED_SNAPSHOT'
            & python.exe -B tools/mpai23_pairwise_memory_development.py *> $privateLog
            $status=$LASTEXITCODE
            $raw=Get-Content -LiteralPath $privateLog -Raw
            if($status -ne 0){
              $phase=[regex]::Match($raw,'MPAI23_FAILURE_STAGE=([A-Z_]+)')
              $why=[regex]::Match($raw,'MPAI23_FAILURE_CLASS=(MPAI23_[A-Z0-9_]+)')
              if($phase.Success){Write-Output ('MPAI23_SAFE_FAILURE_STAGE='+$phase.Groups[1].Value)}
              if($why.Success){Write-Output ('MPAI23_SAFE_FAILURE_CLASS='+$why.Groups[1].Value)}
              throw 'MPAI23_LOCAL_MODEL_TRIAL_FAILED_PRIVATE_LOG'
            }
            foreach($mark in @(
              'MPAI23_ACCEPTED_SOURCE_AND_RECORDS=PASS',
              'MPAI23_MODEL_EXACT_SHA256=PASS',
              'MPAI23_REAL_LOCAL_MODEL_CALLS=12',
              'MPAI23_SAME_MODEL_AND_TASKS=PASS',
              'MPAI23_INDEPENDENT_HOLDOUT=FALSE',
              'MPAI23_TRUE_UNFAMILIAR_TRANSFER=NOT_PROVEN',
              'MPAI23_SCIENTIFIC_ACCEPTANCE=FALSE',
              'MPAI23_MODEL_PROMOTION=FALSE',
              'MPAI23_PRODUCTION_MEMORY_WRITES=0'
            )){
              Assert ($raw.Contains($mark)) 'MISSING_MODEL_RECEIPT'
            }
            foreach($line in ($raw -split [char]10)){
              $line=$line.Trim()
              if($line -match '^MPAI23_(ARM_(NO_MEMORY|PLACEBO|ACCEPTED_MEMORY)|PREREGISTRATION_SHA256|MODEL_LOAD_MS|PEAK_WORKING_SET_BYTES|REAL_LOCAL_MODEL_CALLS|ACCEPTED_SOURCE_AND_RECORDS|MODEL_EXACT_SHA256|SAME_MODEL_AND_TASKS|INDEPENDENT_HOLDOUT|TRUE_UNFAMILIAR_TRANSFER|SCIENTIFIC_ACCEPTANCE|MODEL_PROMOTION|PRODUCTION_MEMORY_WRITES)=[A-Za-z0-9_,.:{}"\-]+$'){
                Write-Output $line
              }
            }
            $dirty=@(& git.exe -C $source status --porcelain --untracked-files=all)
            Assert ($LASTEXITCODE -eq 0 -and $dirty.Count -eq 0) 'PRIVATE_SOURCE_MUTATED'
            $workDirty=@(& git.exe status --porcelain --untracked-files=all)
            Assert ($LASTEXITCODE -eq 0 -and $workDirty.Count -eq 0) 'PUBLIC_WORKSPACE_MUTATED'
            Write-Output 'MPAI23_ORIGINAL_WINDOWS_RESEARCH_QUALIFIED=PASS'
          } finally {
            Set-Location $env:RUNNER_TEMP
            Remove-Item Env:MPAI23_PRIVATE_SCRATCH,Env:MPAI23_PRIVATE_SOURCE -ErrorAction SilentlyContinue
            if(Test-Path -LiteralPath $scratch){
              Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction Stop
            }
            Write-Output ('MPAI23_SCRATCH_REMOVED='+[string](-not(Test-Path -LiteralPath $scratch)))
          }
