name: KTRADE PR253 original Pine native physical 125 percent with reversible scaling
on:
  push:
    branches: [qualification/ktrade-pr253-owner-native-readonly-20261113]
    paths:
      # W199 one-shot operator-authorized physical-125% Pine acceptance.
      # No schedule, live trading, installed-data or protected-ref authority.
      - .github/workflows/ktrade-pr253-owner-native-pine-physical125-20261120.yml
permissions:
  contents: read
concurrency:
  group: ktrade-pr253-owner-native-pine-physical125-once
  cancel-in-progress: false
jobs:
  native:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 35
    env:
      KTRADE_EXPECTED_SOURCE: '07d7e41063a0c1506a290d1497f84de8173da292'
      KTRADE_EXPECTED_TREE: '07ab753cfc02dd24b6e27c1c106f821f14c62534'
      KTRADE_LIVE_TRADING: 'false'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      KTRADE_PAPER_SESSION_ROOT: ''
      KTRADE_PAPER_CUSTODY_REVIEW_ROOT: ''
      KTRADE_PROMOTION_ALLOWED: '0'
    steps:
      - name: Verify operator configured 20 minute screen saver at physical 150 percent DPI without changes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             [Security.Principal.WindowsIdentity]::GetCurrent().Name -ine 'LINKDEADKB\camar' -or
             [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){
            throw 'KTRADE_OWNER_SAVER_PREP_SCOPE_REFUSED'
          }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class KtradePr253NonsecureSaverPrep {
            public delegate bool MonitorCallback(IntPtr monitor,IntPtr dc,IntPtr rect,IntPtr data);
            [DllImport("user32.dll",SetLastError=true)]
            public static extern IntPtr SetThreadDpiAwarenessContext(IntPtr ctx);
            [DllImport("user32.dll",SetLastError=true)]
            public static extern bool EnumDisplayMonitors(IntPtr dc,IntPtr rect,MonitorCallback cb,IntPtr data);
            [DllImport("shcore.dll")] public static extern int GetDpiForMonitor(IntPtr h,int kind,out uint x,out uint y);
            public static string[] PhysicalDpi(){
              var prior=SetThreadDpiAwarenessContext(new IntPtr(-4));
              if(prior==IntPtr.Zero)throw new Exception("PER_MONITOR_V2_CONTEXT_REQUIRED");
              try{
                var list=new System.Collections.Generic.List<string>();
                MonitorCallback cb=(IntPtr h,IntPtr dc,IntPtr rect,IntPtr data)=>{
                  uint x,y;var hr=GetDpiForMonitor(h,0,out x,out y);
                  if(hr!=0)throw new Exception("PHYSICAL_MONITOR_DPI_READ_FAILED_"+hr);
                  list.Add(x.ToString()+":"+y.ToString());
                  return true;
                };
                if(!EnumDisplayMonitors(IntPtr.Zero,IntPtr.Zero,cb,IntPtr.Zero))
                  throw new Exception("PHYSICAL_MONITOR_ENUM_FAILED_"+Marshal.GetLastWin32Error());
                return list.ToArray();
              }finally{
                if(SetThreadDpiAwarenessContext(prior)==IntPtr.Zero)
                  throw new Exception("PER_MONITOR_V2_CONTEXT_RESTORE_FAILED");
              }
            }
            [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr OpenInputDesktop(uint flags,bool inherit,uint access);
            [DllImport("user32.dll",SetLastError=true)] public static extern bool CloseDesktop(IntPtr h);
            [DllImport("user32.dll",SetLastError=true,CharSet=CharSet.Unicode)]
            public static extern bool GetUserObjectInformation(IntPtr h,int i,StringBuilder b,uint size,out uint needed);
            [DllImport("user32.dll",SetLastError=true)] public static extern bool SystemParametersInfo(uint a,uint b,ref uint c,uint f);
            [DllImport("user32.dll",SetLastError=true)] public static extern bool SystemParametersInfo(uint a,uint b,IntPtr c,uint f);
            public static string Desktop(){
              var h=OpenInputDesktop(0,false,1);
              if(h==IntPtr.Zero)return "UNAVAILABLE";
              try{
                var s=new StringBuilder(128);uint size;
                return GetUserObjectInformation(h,2,s,(uint)(s.Capacity*2),out size)?s.ToString():"UNAVAILABLE";
              }finally{CloseDesktop(h);}
            }
            public static uint Timeout(){
              uint v=0;if(!SystemParametersInfo(0xE,0,ref v,0))throw new Exception("SAVER_GET_REFUSED");return v;
            }
          }
          '@
          $physicalPreimage=@([KtradePr253NonsecureSaverPrep]::PhysicalDpi())
          if($physicalPreimage.Count -ne 1 -or $physicalPreimage[0] -cne '144:144'){
            throw ('KTRADE_PR253_PHYSICAL_150_DPI_NOT_PRESENT_NO_MUTATION='+($physicalPreimage -join ','))
          }
          Write-Host ('KTRADE_PR253_PHYSICAL_150_PREP=PASS;effective_monitor_dpi='+($physicalPreimage -join ','))
          $prePath=Join-Path $env:RUNNER_TEMP ('ktrade-pr253-saver-'+$env:GITHUB_RUN_ID+'.json')
          if(Test-Path -LiteralPath $prePath){throw 'KTRADE_OWNER_SAVER_PREIMAGE_ALREADY_EXISTS'}
          $reg=Get-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -ErrorAction Stop
          $effective=[KtradePr253NonsecureSaverPrep]::Timeout()
          Write-Host ('KTRADE_OWNER_MANUAL20_READONLY_OBSERVED='+(@{
            effective_timeout_seconds=$effective
            registry_timeout_seconds=[string]$reg.ScreenSaveTimeOut
            screen_saver_enabled=([string]$reg.ScreenSaveActive -ceq '1')
            screen_saver_secure=([string]$reg.ScreenSaverIsSecure -ceq '1')
            system_blank_saver=([IO.Path]::GetFileName([string]$reg.'SCRNSAVE.EXE') -ieq 'scrnsave.scr')
            settings_changed_by_job=$false
          }|ConvertTo-Json -Compress))
          if([string]$reg.ScreenSaveActive -cne '1' -or
             [string]$reg.ScreenSaveTimeOut -cne '1200' -or
             [string]$reg.ScreenSaverIsSecure -cne '0' -or
             [IO.Path]::GetFileName([string]$reg.'SCRNSAVE.EXE') -ine 'scrnsave.scr' -or
             $effective -ne 1200){
            throw 'KTRADE_OWNER_SAVER_CONFIG_DRIFT_REFUSED'
          }
          foreach($p in @('HKCU:\Software\Policies\Microsoft\Windows\Control Panel\Desktop',
                          'HKLM:\Software\Policies\Microsoft\Windows\Control Panel\Desktop')){
            if(Test-Path -LiteralPath $p){throw 'KTRADE_OWNER_SAVER_POLICY_PRESENT_REFUSED'}
          }
          if(@(Get-Process LogonUI -ErrorAction SilentlyContinue|
               Where-Object {$_.SessionId -eq 1}).Count -ne 0){
            throw 'KTRADE_OWNER_SAVER_LOGON_SCREEN_PRESENT_REFUSED'
          }
          $desktop=[KtradePr253NonsecureSaverPrep]::Desktop()
          if($desktop -cnotin @('Default','Screen-saver')){
            throw ('KTRADE_OWNER_SAVER_UNRECOGNIZED_DESKTOP_'+$desktop)
          }
          if($desktop -cne 'Default'){throw 'KTRADE_OWNER_MANUAL20_DEFAULT_DESKTOP_REQUIRED'}
          Write-Host 'KTRADE_OWNER_MANUAL20_READONLY_PREFLIGHT=PASS;physical_dpi=144:144;timeout_seconds=1200;settings_changed=false'
      - name: Prove native UTC deadline interpretation and fail-closed negative controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted'){
            throw 'W169_UTC_GUARD_WRONG_RUNNER_REFUSED'
          }
          $prior=$env:KTRADE_NATIVE_DEADLINE_UTC
          try{
            $now=[DateTime]::UtcNow
            $future=$now.AddSeconds(102)
            $env:KTRADE_NATIVE_DEADLINE_UTC=$future.ToString('o')
            $end=[DateTimeOffset]::Parse($env:KTRADE_NATIVE_DEADLINE_UTC,
              [Globalization.CultureInfo]::InvariantCulture).UtcDateTime
            if($end.Kind -ne [DateTimeKind]::Utc -or
               !([DateTime]::UtcNow -lt $end)){
              throw 'W169_UTC_FUTURE_DEADLINE_FALSE_NEGATIVE'
            }
            $env:KTRADE_NATIVE_DEADLINE_UTC=([DateTimeOffset]::new($future,[TimeSpan]::Zero).ToOffset([TimeSpan]::FromHours(-5))).ToString('o')
            $same=[DateTimeOffset]::Parse($env:KTRADE_NATIVE_DEADLINE_UTC,
              [Globalization.CultureInfo]::InvariantCulture).UtcDateTime
            if($same.Kind -ne [DateTimeKind]::Utc -or
               $same.Ticks -ne $end.Ticks -or
               !([DateTime]::UtcNow -lt $same)){
              throw 'W169_UTC_EXPLICIT_OFFSET_FALSE_NEGATIVE'
            }
            $env:KTRADE_NATIVE_DEADLINE_UTC=$now.AddSeconds(-1).ToString('o')
            if([DateTime]::UtcNow -lt [DateTimeOffset]::Parse(
               $env:KTRADE_NATIVE_DEADLINE_UTC,[Globalization.CultureInfo]::InvariantCulture).UtcDateTime){
              throw 'W169_UTC_EXPIRED_DEADLINE_FALSE_POSITIVE'
            }
            $env:KTRADE_NATIVE_DEADLINE_UTC='not-a-timestamp'
            $malformedRejected=$false
            try{
              [void][DateTimeOffset]::Parse($env:KTRADE_NATIVE_DEADLINE_UTC,
                [Globalization.CultureInfo]::InvariantCulture)
            }catch [FormatException]{$malformedRejected=$true}
            if(!$malformedRejected){throw 'W169_UTC_MALFORMED_ACCEPTED'}
            Write-Host ('W169_UTC_GUARD_NEGATIVES=PASS;future_102s=true;offset_minus5_equivalence=true;expired=false;malformed=refused;local_utc_offset='+[TimeZoneInfo]::Local.BaseUtcOffset)
          }finally{
            $env:KTRADE_NATIVE_DEADLINE_UTC=$prior
          }
      - name: Build frozen exact-source Wails fixture before desktop access
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:KTRADE_LIVE_TRADING -cne 'false' -or
             $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or
             $env:KTRADE_PROMOTION_ALLOWED -cne '0'){
            throw 'W169_PREBUILD_SCOPE_REFUSED'
          }
          foreach($tool in @('go.exe','git.exe','gh.exe','node.exe','npm.cmd')){
            if(!(Get-Command $tool -ErrorAction SilentlyContinue)){
              throw ('W169_PREBUILD_TOOL_MISSING_'+$tool)
            }
          }
          if(@(Get-Process -Name ktrade,ktrade-engine -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'W169_OWNER_APP_RUNNING_REFUSED'
          }
          $base=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $id=[guid]::NewGuid().ToString('N')
          $root=Join-Path $base ('ktrade-pr253-real-native-'+$id)
          $source=Join-Path $root 'product'
          $pkg=Join-Path $base ('ktrade-w03-package-'+$id)
          $log=Join-Path $root 'private-build.log'
          if(Test-Path -LiteralPath $root){throw 'W169_ROOT_NOT_FRESH'}
          if(Test-Path -LiteralPath $pkg){throw 'W169_PKG_NOT_FRESH'}
          New-Item -ItemType Directory -Path $root -ErrorAction Stop|Out-Null
          $env:GH_PROMPT_DISABLED='1'
          $env:GIT_TERMINAL_PROMPT='0'
          $env:GOTOOLCHAIN='go1.26.11'
          $env:GOPATH=Join-Path $root 'go-path'
          $env:GOMODCACHE=Join-Path $root 'go-mod-cache'
          $env:GOCACHE=Join-Path $root 'go-build-cache'
          $env:npm_config_cache=Join-Path $root 'npm-cache'
          $env:TEMP=$base
          $env:TMP=$base
          $ok=$false
          try{
            & gh.exe repo clone spoonman136668-ai/ktrade $source -- --filter=blob:none --no-checkout *> $log
            if($LASTEXITCODE -ne 0){throw 'W169_PRIVATE_CLONE_FAILED'}
            & git.exe -C $source fetch --no-tags --depth 1 origin refs/heads/feature/rb3-workstation-ui-refresh-20261108 *> $log
            if($LASTEXITCODE -ne 0){throw 'W169_PINNED_BRANCH_FETCH_FAILED'}
            $fetched=(& git.exe -C $source rev-parse FETCH_HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $fetched -cne $env:KTRADE_EXPECTED_SOURCE){throw 'W169_KTRADE_HEAD_DRIFT'}
            & git.exe -C $source checkout --detach $env:KTRADE_EXPECTED_SOURCE *> $log
            if($LASTEXITCODE -ne 0){throw 'W169_CHECKOUT_FAILED'}
            $head=(& git.exe -C $source rev-parse HEAD).Trim()
            $tree=(& git.exe -C $source rev-parse 'HEAD^{tree}').Trim()
            if($head -cne $env:KTRADE_EXPECTED_SOURCE -or
               $tree -cne $env:KTRADE_EXPECTED_TREE -or
               @(& git.exe -C $source status --porcelain --untracked-files=no).Count -ne 0){
              throw 'W169_SOURCE_TREE_DRIFT'
            }
            $ver=((& go.exe version) -join ' ')
            if($LASTEXITCODE -ne 0 -or $ver -notmatch '^go version go1\.26\.11 '){throw 'W169_GO_UNAVAILABLE'}
            $pin=(Get-Content (Join-Path $source 'windows/Go-Toolchain.version') -Raw).Trim()
            if($pin -cne 'go1.26.11'){throw 'W169_GO_CONTRACT_DRIFT'}
            Push-Location $source
            try{
              & npm.cmd ci --ignore-scripts --no-audit --no-fund --silent *> $log
              if($LASTEXITCODE -ne 0){throw 'W169_NPM_FAILED'}
              & node.exe scripts/stage_offline_vendor.cjs *> $log
              if($LASTEXITCODE -ne 0){throw 'W169_VENDOR_STAGE_FAILED'}
            }finally{Pop-Location}
            $env:KTRADE_W13_QUALIFICATION_ONLY='1'
            $env:KTRADE_W41_QUALIFICATION_ONLY='1'
            try{
              # W185: capture one exact-source build with deterministic, bounded
              # classified evidence. No network replay, no private output.
              $buildClock=[Diagnostics.Stopwatch]::StartNew()
              & (Join-Path $source 'windows/Build-KTRADE-WailsPortable.ps1') -OutputRoot $pkg -ExpectedSourceSha $head -W13QualificationFixture -W41ColdFixture *> $log
              if($LASTEXITCODE -ne 0){throw 'W169_PACKAGE_BUILD_FAILED'}
              Write-Host ('W185_SOURCE_PINNED_BUILD=PASS;seconds='+[int]$buildClock.Elapsed.TotalSeconds+
                ';previous_failed_run_class=FETCH_OBSERVED_FAILURE_CAUSE_UNVERIFIED;private_output_withheld=true')
            }catch{
              # Original private diagnostic source remains only under RUNNER_TEMP.
              # No source paths, module names, Go errors or owner information
              # are exported into the public FORGE job logs.
              $tail=@(Get-Content -LiteralPath $log -Tail 250 -ErrorAction SilentlyContinue)
              $message=($tail -join ' ')
              $kind=if($message -match '(?i)no space left|disk full|not enough space'){'DISK'}
                elseif($message -match '(?i)out of memory|cannot allocate memory|signal: killed'){'MEMORY'}
                elseif($message -match '(?i)(connection reset|proxyconnect|TLS handshake|network is unreachable|connection refused|timeout|no such host|unexpected EOF|dial tcp|i/o timeout|HTTP 5[0-9][0-9]|HTTP 429)'){'NETWORK'}
                elseif($message -match '(?i)(undefined:|cannot use|syntax error|build constraints exclude|import cycle|does not implement)'){'SOURCE_COMPILE'}
                elseif($message -match '(?i)(access is denied|permission denied|cannot access the file|sharing violation)'){'WINDOWS_FILE_ACCESS'}
                elseif($message -match '(?i)go: downloading|go: download'){'FETCH_OBSERVED_FAILURE_CAUSE_UNVERIFIED'}
                else{'UNCLASSIFIED'}
              $failedStage=if($message -match 'W03_NATIVE_ENGINE_BUILD_FAILED'){'ENGINE_COMPILE'}
                elseif($message -match 'W03_WAILS_SHELL_BUILD_FAILED'){'WAILS_COMPILE'}
                elseif($message -match 'W03_VENDOR_ASSET_MISSING'){'ASSET_STAGE'}
                else{'UNKNOWN'}
              $fetchCount=@($tail|Where-Object {$_ -match '^go: downloading '}).Count
              $networkErrorCount=@($tail|Where-Object {$_ -match '(?i)(connection reset|proxyconnect|TLS handshake|network is unreachable|timeout|no such host|dial tcp|HTTP 5[0-9][0-9]|HTTP 429)'}).Count
              $compileErrorCount=@($tail|Where-Object {$_ -match '(?i)(undefined:|cannot use|syntax error|build constraints exclude|does not implement)'}).Count
              $fetchStatus=if($message -match '(?i)\b(?:HTTP |status:?)\s*(401|403|404|408|429|500|502|503|504)\b'){$Matches[1]}else{'NONE'}
              $sourceCache=if(Test-Path -LiteralPath $env:GOMODCACHE){'PRESENT'}else{'ABSENT'}
              Write-Host ('W185_PREBUILD_DIAG=FAIL;stage='+$failedStage+';class='+$kind+
                ';fetch_lines='+$fetchCount+';network_error_lines='+$networkErrorCount+
                ';compile_error_lines='+$compileErrorCount+';http_status='+$fetchStatus+
                ';isolated_modcache='+$sourceCache+
                ';seconds='+[int]$buildClock.Elapsed.TotalSeconds+
                ';no_replay=true;user_files_unchanged=true;desktop_not_entered=true')
              Write-Host ('W169_BUILD_FAILURE_CLASS='+$kind+';private_build_log_lines='+$tail.Count+';user_files_unchanged=true;desktop_not_entered=true')
              throw 'W169_PACKAGE_BUILD_FAILED'
            }
            $manifest=Get-Content -LiteralPath (Join-Path $pkg 'source-manifest.json') -Raw|ConvertFrom-Json
            $shell=Join-Path $pkg 'KTRADE-WailsPortable/ktrade.exe'
            $engine=Join-Path $pkg 'KTRADE-WailsPortable/ktrade-engine.exe'
            if($manifest.source_sha -cne $head -or
               $manifest.go_version -cne 'go1.26.11' -or
               $manifest.fixture_mode -cne 'w41-frozen-disposable-restart' -or
               $manifest.live_armed -ne $false -or
               $manifest.paper_started -ne $false -or
               $manifest.release_candidate -ne $false -or
               !(Test-Path -LiteralPath $shell -PathType Leaf) -or
               !(Test-Path -LiteralPath $engine -PathType Leaf) -or
               (Test-Path -LiteralPath (Join-Path $pkg 'KTRADE-WailsPortable/data/webview2-profile'))){
              throw 'W169_PREBUILT_PACKAGE_CUSTODY_REFUSED'
            }
            if((Get-FileHash -LiteralPath $shell -Algorithm SHA256).Hash.ToLowerInvariant() -cne $manifest.wails_exe_sha256 -or
               (Get-FileHash -LiteralPath $engine -Algorithm SHA256).Hash.ToLowerInvariant() -cne $manifest.engine_exe_sha256){
              throw 'W169_BINARY_HASH_MISMATCH'
            }
            if(@(& git.exe -C $source status --porcelain --untracked-files=no).Count -ne 0){
              throw 'W169_SOURCE_CHANGED_BY_BUILD'
            }
            Add-Content -LiteralPath $env:GITHUB_ENV -Value ('KTRADE_PREPARED_ROOT='+$root)
            Add-Content -LiteralPath $env:GITHUB_ENV -Value ('KTRADE_PREPARED_PKG_ROOT='+$pkg)
            $ok=$true
            Write-Host ('W169_PREBUILD=PASS;source_sha='+$head+';tree_sha='+$tree+
              ';go=go1.26.11;fixture=W41;disarmed=true;desktop_input_used=false;app_launched=false')
          }finally{
            Remove-Item Env:\KTRADE_W13_QUALIFICATION_ONLY,Env:\KTRADE_W41_QUALIFICATION_ONLY -ErrorAction SilentlyContinue
            if(!$ok){
              foreach($p in @($pkg,$root)){
                if((Test-Path -LiteralPath $p) -and
                   [IO.Path]::GetDirectoryName($p).TrimEnd('\') -ceq $base -and
                   [IO.Path]::GetFileName($p) -cmatch '^ktrade-(?:w03-package|pr253-real-native)-[a-f0-9]{32}$'){
                  Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue
                }
              }
            }
          }
      - name: Run frozen original Pine editor at physical 125 percent and restore 150
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $env:RUNNER_OS -cne 'Windows' -or
             [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1 -or
             [Security.Principal.WindowsIdentity]::GetCurrent().Name -ine 'LINKDEADKB\camar' -or
             $env:KTRADE_EXPECTED_SOURCE -cne '07d7e41063a0c1506a290d1497f84de8173da292' -or
             $env:KTRADE_LIVE_TRADING -cne 'false' -or
             $env:KTRADE_PROMOTION_ALLOWED -cne '0'){
            throw 'KTRADE_W189_OWNER_RUNNER_AUTHORITY_REFUSED'
          }
          if(@(Get-Process -Name ktrade,ktrade-engine -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTRADE_W189_INSTALLED_APP_RUNNING_REFUSED'
          }
          $reg=Get-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -ErrorAction Stop
          if([string]$reg.ScreenSaveActive -cne '1' -or
             [string]$reg.ScreenSaveTimeOut -cne '1200' -or
             [string]$reg.ScreenSaverIsSecure -cne '0'){
            throw 'KTRADE_W189_MANUAL_SAVER_CONTRACT_DRIFT_REFUSED'
          }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class KtradeW189Native {
            [StructLayout(LayoutKind.Sequential)] public struct Rect {
              public int left,top,right,bottom;
            }
            public delegate bool MonitorCallback(IntPtr monitor,IntPtr dc,ref Rect rect,IntPtr data);
            [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr SetThreadDpiAwarenessContext(IntPtr c);
            [DllImport("user32.dll",SetLastError=true)] public static extern bool EnumDisplayMonitors(IntPtr dc,IntPtr rect,MonitorCallback cb,IntPtr data);
            [DllImport("shcore.dll")] public static extern int GetDpiForMonitor(IntPtr m,int type,out uint x,out uint y);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr OpenInputDesktop(uint f,bool i,uint a);
            [DllImport("user32.dll")] public static extern bool CloseDesktop(IntPtr h);
            [DllImport("user32.dll",SetLastError=true,CharSet=CharSet.Unicode)]
            public static extern bool GetUserObjectInformation(IntPtr h,int i,StringBuilder b,uint s,out uint n);
            public static string Desktop(){
              var h=OpenInputDesktop(0,false,1);if(h==IntPtr.Zero)return "UNAVAILABLE";
              try{var b=new StringBuilder(128);uint n;return GetUserObjectInformation(h,2,b,(uint)(b.Capacity*2),out n)?b.ToString():"UNAVAILABLE";}
              finally{CloseDesktop(h);}
            }
            public static string ReadDpi(){
              var old=SetThreadDpiAwarenessContext(new IntPtr(-4));
              if(old==IntPtr.Zero)throw new Exception("W189_DPI_READ_CONTEXT_REQUIRED");
              try{
                var a=new List<string>();
                MonitorCallback cb=(IntPtr m,IntPtr dc,ref Rect r,IntPtr data)=>{
