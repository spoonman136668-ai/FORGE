          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class KtradeManual20Independent {
            [DllImport("user32.dll",SetLastError=true)]
            public static extern bool SystemParametersInfo(uint action,uint param,ref uint value,uint flags);
            public static uint Read(){
              uint v=0;
              if(!SystemParametersInfo(0x000E,0,ref v,0))
                throw new Exception("MANUAL20_SAVER_READ_FAILED");
              return v;
            }
          }
          '@
          $seconds=[KtradeManual20Independent]::Read()
          $reg=Get-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -ErrorAction Stop
          Write-Host ('KTRADE_OWNER_MANUAL20_INDEPENDENT_OBSERVED='+(@{
            effective_timeout_seconds=$seconds
            registry_timeout_seconds=[string]$reg.ScreenSaveTimeOut
            settings_changed_by_job=$false
          }|ConvertTo-Json -Compress))
          if($seconds -ne 1200 -or [string]$reg.ScreenSaveTimeOut -cne '1200'){
            throw 'KTRADE_OWNER_MANUAL20_SETTINGS_CHANGED'
          }
          Write-Host 'KTRADE_OWNER_MANUAL20_INDEPENDENT_READBACK=PASS;effective_seconds=1200;registry_seconds=1200;settings_changed=false;scheduled_tasks_created=false'
