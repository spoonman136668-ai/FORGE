name: K-Terminal RC2-O same-volume fsync latency attribution
on:
  push:
    branches: [diagnostics/kterminal-original-local-preflight-20261019]
    paths: [.github/workflows/kt-rc2o-fsync-crossover.yml]
permissions:
  contents: read
concurrency:
  group: kterm-rc2o-fsync-crossover-20261020
  cancel-in-progress: false
jobs:
  windows-paired-fsync:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOFLAGS: '-p=1'
      GOMAXPROCS: '2'
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
    steps:
      - name: Checkout FORGE diagnostic tooling only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read-only frozen K-Terminal original
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: eb5d225ae73b698a59c68d840daf1ec678e1a0ec
          path: kt-original
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Read-only exact PR73 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: b8c2052d530cdff93462dfccc21b28f3824e5531
          path: kt-candidate
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Exact Windows Go 1.26.5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Check source custody and no broker credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/FORGE
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/diagnostics/kterminal-original-local-preflight-20261019
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git -C kt-original rev-parse HEAD)" = eb5d225ae73b698a59c68d840daf1ec678e1a0ec
          test "$(git -C kt-candidate rev-parse HEAD)" = b8c2052d530cdff93462dfccc21b28f3824e5531
          test -z "$(git -C kt-original status --porcelain)"
          test -z "$(git -C kt-candidate status --porcelain)"
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          go version | grep -F 'go1.26.5 windows/amd64'
          for key in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET; do
            test -z "${!key:-}"
          done
          echo KTERM_RC2O_FROZEN_REPOS_NO_BROKER=PASS
      - name: Measure normal versus bounded same-volume synthetic fsync contention
        shell: bash
        run: |
          set -euo pipefail
          python -B qualification/kterminal/rc2o_fsync_crossover.py \
            kt-original kt-candidate \
            qualification/kterminal/rc2n_nine_attempt_phase_probe_test.go \
            qualification/kterminal/rc2o_synthetic_fsync_pressure.py \
            "$RUNNER_TEMP/kterm-rc2o-paired-evidence"
          echo KTERM_RC2O_SOURCE_TRADING_LOGIC=UNCHANGED
          echo KTERM_RC2O_FULL_REGRESSION=NOT_RUN
          echo KTERM_RC2O_RELEASE=BLOCKED
      - name: Retain redacted fsync crossover and native phase evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kterm-rc2o-redacted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kterm-rc2o-paired-evidence/rc2o-redacted-comparison.json
          if-no-files-found: warn
          retention-days: 20
