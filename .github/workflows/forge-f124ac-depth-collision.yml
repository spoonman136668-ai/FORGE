name: F124-AC frozen cross-family causal transfer and packed Wingless
on:
  push:
    branches: [research/f124ac-hop-failure-and-packed-collision-20261017]
    paths:
      - 'reference/research-intake/f124ac-frozen-depth-collision-diagnostics.json'
      - 'nativeevidence/f124ac_*.py'
      - 'nativeevidence/test_f124ac_*.py'
      - '.github/workflows/forge-f124ac-depth-collision.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: f124ac-frozen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-source-focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: New family oracle separated, exact source lineage, original inference untouched
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if ($IsWindows) { 'python' } else { 'python3' }
          if ((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'F124AC_EXACT_HEAD_DRIFT' }
          foreach ($pattern in @('test_f124ac_*.py','test_f124ab_*.py')) {
            & $py -B -m unittest discover -s nativeevidence -p $pattern -v
            if ($LASTEXITCODE -ne 0) { throw "F124AC_FROZEN_SOURCE_FAILED_$pattern" }
          }
          & $py -B isolationguard/check.py
          if ($LASTEXITCODE -ne 0) { throw 'F124AC_CROSS_PROJECT_ISOLATION_FAILED' }
          Write-Output 'F124AC_PROTECTED_FIRST_USE=false'

  source-verified-independent-development:
    needs: frozen-source-focused
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate all seven original provider run/artifact receipts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sources=@(
            @{id='39078269441';head='5b52da1e38d5ff5671c582676790daf0462dd18d';artifact='12116979526';digest='sha256:fefa2135a029660f36970a66b08809aaa128c5f6d2b3c5705ef8a29a9b4f014c'},
            @{id='39082424955';head='01560f7f4f1aab5737cfd045dffd7faaccfb0608';artifact='12120010101';digest='sha256:b1b483e03a1ba8f9a66e75e11d48481573d24926b8f17dc77db076158c3168f3'},
            @{id='39083528704';head='6ba96aaaeff083a5e2f54020c70d2a717e431a10';artifact='12119184999';digest='sha256:93cf41e63c5fd458376778fd54f6da9eaa8677b390be763b6b214ca26fa6089a'},
            @{id='39085219061';head='af17fadc6bb66e30a6f7ebd1a6a629398cc09709';artifact='12119928375';digest='sha256:77774cd7a47d3e1d9357d52e6e82e28fbf7fe6bfc2e1fcaa5c4e94f13c941c0f'},
            @{id='39085922140';head='4f7fa505737acae4568df755b4804c384b057980';artifact='12120417300';digest='sha256:7d84f022f02ec607c9db09ba854141057c72f0ecb4cc7592ef298e778690f639'},
            @{id='39086773832';head='f4d8770482cce0d0f282420b45a1bd931cf81bd5';artifact='12121042723';digest='sha256:4efb86146c361e50d1c177faa979382bd9eb7e88fe1d8e5783f3e4e15efb23de'},
            @{id='39087469247';head='62db833856e523c45c82cf11f3d76bf0f5d7c257';artifact='12121202417';digest='sha256:c1be59e13a674b8b2a1f7846544db81b617d041f26761934df18bca3fcb03036'},
            @{id='39088963241';head='53bf4555ef3a88dbc126af4ff060aadecc976d9b';artifact='12122111712';digest='sha256:4894889c447de6b334b73602d3157bbb58dd4cd9c2c85ae2e268f3b24d132771'},
            @{id='39090219587';head='0a17074b9c801d7ddc76f995d9d14bb53c4234c1';artifact='12121389887';digest='sha256:fb481eccb0cbb9664f6c604a47e16b9fa37c6013bc711b1155ccdb7a185c0d83'}
          )
          foreach ($p in $sources) {
            $run=(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($p.id)" | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne $p.head -or
                $run.status -cne 'completed' -or $run.conclusion -cne 'success' -or
                $run.event -cne 'push') { throw 'F124AC_ORIGINAL_PROVIDER_RUN_IDENTITY' }
            $index=(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($p.id)/artifacts" | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0) { throw 'F124AC_ORIGINAL_ARTIFACT_INDEX' }
            $found=@($index.artifacts | Where-Object { "$($_.id)" -ceq $p.artifact })
            if ($found.Count -ne 1 -or $found[0].digest -cne $p.digest -or $found[0].expired) {
              throw 'F124AC_ORIGINAL_PROVIDER_ARTIFACT'
            }
          }
          Write-Output 'F124AC_SOURCE_AUTHENTICITY=PASS'
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39078269441
          github-token: ${{ github.token }}
          name: f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d
          path: historical-o
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39082424955
          github-token: ${{ github.token }}
          name: f124t-source-verified-fresh-development-01560f7f4f1aab5737cfd045dffd7faaccfb0608
          path: historical-t
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39083528704
          github-token: ${{ github.token }}
          name: f124u-preregistered-fresh-development-6ba96aaaeff083a5e2f54020c70d2a717e431a10
          path: historical-u
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39085219061
          github-token: ${{ github.token }}
          name: f124w-frozen-hop-trace-and-indexed-fresh-af17fadc6bb66e30a6f7ebd1a6a629398cc09709
          path: historical-w
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39085922140
          github-token: ${{ github.token }}
          name: f124x-fresh-readout-and-runtime-4f7fa505737acae4568df755b4804c384b057980
          path: historical-x
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39086773832
          github-token: ${{ github.token }}
          name: f124y-authentic-budgeted-experiment-f4d8770482cce0d0f282420b45a1bd931cf81bd5
          path: historical-y
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39087469247
          github-token: ${{ github.token }}
          name: f124z-frozen-fresh-development-62db833856e523c45c82cf11f3d76bf0f5d7c257
          path: historical-z
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39088963241
          github-token: ${{ github.token }}
          name: f124aa-immutable-fresh-family-evidence-53bf4555ef3a88dbc126af4ff060aadecc976d9b
          path: historical-aa
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39090219587
          github-token: ${{ github.token }}
          name: f124ab-frozen-soft-hamming-packed-pareto-0a17074b9c801d7ddc76f995d9d14bb53c4234c1
          path: historical-ab
      - name: Authenticate nine raw receipts then frozen read-only per-hop and collision diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sources=@(
            @{path='historical-o/f124o-independent-two-learned-development.json';sha='025c97abc8eb69079d7d7d0f59bfdb81235b9ad9ab83e230f32b542d2cfbdb5d'},
            @{path='historical-t/f124t-fresh-absolute-development.json';sha='a2f7b3641c2f84f684372918849170c97912c7a104fa4dbe264bcbd6d444c2d2'},
            @{path='historical-u/f124u-fresh-cell-and-readout-development.json';sha='63a2a57973444752d4002bc4718ec63de88a26ed05142627305de3a94fa9fb41'},
            @{path='historical-w/f124w-fresh-hop-survival-and-checksum.json';sha='122c0f1db5547a1ce2074c73c0b4b4d089c7f00eaf4573327676be3b7b521698'},
            @{path='historical-x/f124x-new-validation-and-runtime.json';sha='457f7be9312bd30b4ce052aed11edfd929fd02e715aa85ede7b9a58b2be355ba'},
            @{path='historical-y/f124y-fresh-budget-and-calibration.json';sha='13608eabec0d63103199f48cea0fdc861fe84ee64527007229d4bcf422d05353'},
            @{path='historical-z/f124z-fresh-sparse-and-public-continuity.json';sha='d6e19c5b9a572eefab5e0927a41abad6d34c3654c80605f7980b6e0908c3e44c'},
            @{path='historical-aa/f124aa-new-transfer-and-packed.json';sha='fda2f1dbf130062b347e0e46862fe409b5af2c95a98fd3ca97c0e8642ff7d034'},
            @{path='historical-ab/f124ab-fresh-soft-hamming-and-packed-pareto.json';sha='270202bae8773bd39c33116b0b365716bd23d53f2a92d7395f77d4a7baee67b9'}
          )
          foreach ($item in $sources) {
            if ((Get-FileHash -LiteralPath $item.path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $item.sha) {
              throw 'F124AC_HISTORICAL_RAW_SHA_DRIFT'
            }
          }
          $out=Join-Path $env:RUNNER_TEMP 'f124ac-fresh-depth-failure-and-packed-aliases.json'
          & python3 -B nativeevidence/f124ac_development_evidence.py --o $sources[0].path --t $sources[1].path --u $sources[2].path --w $sources[3].path --x $sources[4].path --y $sources[5].path --z $sources[6].path --aa $sources[7].path --ab $sources[8].path --output $out
          if ($LASTEXITCODE -ne 0) { throw 'F124AC_QUALIFIED_OBSERVER_FAILED' }
          $receipt=Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($receipt.schema -cne 'forge.research.f124ac.fresh-long-depth-packed-failure-diagnostics.v1' -or
              $receipt.freeze_git_blob -cne 'be5f9a3121beca097ca81f4451e73c1927aae595' -or
              $receipt.original_ab_json_sha256 -cne '270202bae8773bd39c33116b0b365716bd23d53f2a92d7395f77d4a7baee67b9' -or
              $receipt.lanes.Count -ne 2 -or -not $receipt.zero_new_training -or
              -not $receipt.frozen_model_weights -or $receipt.protected_first_use -or
              $receipt.independent_science_acceptance -or $receipt.optimizer_promotion -or
              $receipt.production -or $receipt.accepted_ref_mutations -ne 0 -or
              $receipt.cost_matched_superiority) { throw 'F124AC_AUTHORITY_OR_RECEIPT_QUARANTINE' }
          foreach ($lane in $receipt.lanes) {
            foreach ($cohort in @($lane.FIT,$lane.DEV)) {
              if ($cohort.paired_source_graphs -ne 48 -or -not $cohort.original_source_only -or
                  @($cohort.arms.PSObject.Properties).Count -ne
                   $(if ($lane.lane -ceq 'Yggdrasil') {3} else {2})) {
                throw 'F124AC_UNQUALIFIED_SOURCE_DENOMINATOR'
              }
              foreach ($item in $cohort.arms.PSObject.Properties) {
                if ($item.Value.pairs -ne 48 -or $item.Value.case_sha256.Count -ne 48 -or
                    $item.Value.max_retained -gt 9 -or
                    ($lane.lane -ceq 'Yggdrasil' -and $item.Value.max_active -gt 7) -or
                    ($lane.lane -ceq 'Wingless' -and $item.Value.max_active -gt 64)) {
                  throw 'F124AC_UNCHANGED_ORIGINAL_CELL_BUDGET'
                }
              }
              $diag=$cohort.posthoc_diagnostics
              if ($diag.positive_case_hashes.Count -ne 48 -or
                  $diag.source_blind_trace_hashes.Count -ne 48 -or
                  ($diag.terminal_reference_survived + $diag.terminal_reference_missing) -ne 48 -or
                  $diag.long_depth_cases -ne 12) {
                throw 'F124AC_INCOMPLETE_CAUSAL_ERROR_TRACE'
              }
            }
            if ($lane.lane -ceq 'Yggdrasil') {
              Write-Output "F124AC_YGG_DEV=$($lane.DEV.arms.soft_AB.paired)/48;long_depth=$($lane.DEV.posthoc_diagnostics.family_causal_loss.extended_depth.positive_errors)/12"
            } else {
              Write-Output "F124AC_WING_DEV=$($lane.DEV.arms.one_state_AB.paired)/48;alias_sets=$($lane.DEV.posthoc_diagnostics.aliases.all_packed_alias_sets)"
            }
          }
          $sha=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($out+'.sha256'),$sha+'  f124ac-fresh-depth-failure-and-packed-aliases.json'+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          Write-Output "F124AC_RAW_RECEIPT_SHA256=$sha"
      - uses: actions/upload-artifact@v4
        with:
          name: f124ac-frozen-depth-failure-packed-aliases-${{ github.sha }}
          path: |
            ${{ runner.temp }}/f124ac-fresh-depth-failure-and-packed-aliases.json
            ${{ runner.temp }}/f124ac-fresh-depth-failure-and-packed-aliases.json.sha256
          if-no-files-found: error
          retention-days: 90

  one-full-regression:
    needs: source-verified-independent-development
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: One exact-head Go full test race vet build and science isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
          echo "F124AC_FULL_SOURCE_HEAD=$GITHUB_SHA"
          echo "F124AC_SCIENCE_ACCEPTED=false"
