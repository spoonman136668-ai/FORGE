name: FORGE read-only six-original archive custody intake

# A bounded one-cohort preservation job. Does NOT start or classify science.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'researcharchive/**'
      - 'historycoverage/**'
      - 'cmd/forge-history-coverage/**'
      - 'cmd/forge-research-archive/**'
      - 'reference/research-originals/20261013-six-recent-archive-cohort.json'
      - 'reference/research-originals/20261014-two-legacy-archive-cohort.json'
      - '.github/workflows/forge-research-archive-cohort.yml'
  push:
    branches: [main]
    paths:
      - 'researcharchive/**'
      - 'historycoverage/**'
      - 'cmd/forge-history-coverage/**'
      - 'cmd/forge-research-archive/**'
      - 'reference/research-originals/20261013-six-recent-archive-cohort.json'
      - 'reference/research-originals/20261014-two-legacy-archive-cohort.json'
      - '.github/workflows/forge-research-archive-cohort.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: forge-research-archive-cohort-readonly
  cancel-in-progress: false

jobs:
  archive-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Qualify negative-preserving original archive evidence gate
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./researcharchive ./cmd/forge-research-archive
      - name: Fetch only exactly pinned original scientific archive bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/forge-six-originals"
          mkdir -p "$root"
          manifest="$GITHUB_WORKSPACE/reference/research-originals/20261013-six-recent-archive-cohort.json"
          cp "$manifest" "$root/source-manifest.json"
          jq -ce '.schema == "forge.research-archive.frozen-cohort.v1" and (.entries | length) == 6' "$manifest" >/dev/null
          jq -c '.entries[]' "$manifest" | while IFS= read -r item; do
            repo="$(jq -er '.repository' <<<"$item")"
            rid="$(jq -er '.run_id' <<<"$item")"
            artifact="$(jq -er '.artifact_id' <<<"$item")"
            gh api "repos/$repo/actions/runs/$rid" > "$root/$rid.run.json"
            gh api "repos/$repo/actions/artifacts/$artifact" > "$root/$rid.artifact.json"
            gh api "repos/$repo/actions/artifacts/$artifact/zip" > "$root/$rid.zip"
          done
          go run ./cmd/forge-research-archive \
            --manifest "$manifest" \
            --evidence-dir "$root" > "$root/observation.json"
      - name: Enforce complete archival integrity without acceptance authority
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/forge-six-originals"
          jq -e '
            .schema == "forge.research-archive.original-byte-inventory.v1" and
            .mode == "ORIGINAL_ARCHIVE_BYTE_PRESERVATION_NOT_SCIENTIFIC_CUSTODY" and
            .archive_count == 6 and .wingless_count == 3 and .yggdrasil_count == 3 and
            .original_execution_authorized == false and
            .complete_ckb_custody == false and
            .scientific_accepted == false and
            .accepted_ref_mutation == false and
            (.observations | length) == 6 and
            all(.observations[];
              .archival_integrity_verified == true and
              .preregistration_verified == false and
              .first_use_reconciled == false and
              .scientific_accepted == false and
              .scientific_classification == "UNQUALIFIED_ORIGINAL_EVIDENCE_PRESERVED")
          ' "$root/observation.json" >/dev/null
          echo 'SIX_REAL_ORIGINAL_ARCHIVES=BYTE_VERIFIED_AND_PRESERVED'
          echo 'WINGLESS_ORIGINALS=3'
          echo 'YGGDRASIL_ORIGINALS=3'
          echo 'CKB_FIRST_USE_CUSTODY=UNRECONCILED'
          echo 'RESEARCH_EXECUTION_AUTHORIZED=FALSE'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-six-real-originals-readonly
          path: ${{ runner.temp }}/forge-six-originals
          retention-days: 90
          if-no-files-found: error

  legacy-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Qualify existing original-archive verifier
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./researcharchive ./cmd/forge-research-archive
      - name: Verify pinned W-R9 and Y022 original bytes without execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/forge-legacy-originals"
          mkdir -p "$root"
          manifest="$GITHUB_WORKSPACE/reference/research-originals/20261014-two-legacy-archive-cohort.json"
          cp "$manifest" "$root/source-manifest.json"
          jq -e '.schema == "forge.research-archive.frozen-cohort.v1" and (.entries | length) == 2' "$manifest" >/dev/null
          jq -c '.entries[]' "$manifest" | while IFS= read -r item; do
            repo="$(jq -er '.repository' <<<"$item")"
            rid="$(jq -er '.run_id' <<<"$item")"
            artifact="$(jq -er '.artifact_id' <<<"$item")"
            gh api "repos/$repo/actions/runs/$rid" > "$root/$rid.run.json"
            gh api "repos/$repo/actions/artifacts/$artifact" > "$root/$rid.artifact.json"
            gh api "repos/$repo/actions/artifacts/$artifact/zip" > "$root/$rid.zip"
          done
          go run ./cmd/forge-research-archive --manifest "$manifest" --evidence-dir "$root" > "$root/observation.json"
      - name: Require two byte-verifiable legacy originals without science acceptance
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/forge-legacy-originals"
          jq -e '
            .schema == "forge.research-archive.original-byte-inventory.v1" and
            .mode == "ORIGINAL_ARCHIVE_BYTE_PRESERVATION_NOT_SCIENTIFIC_CUSTODY" and
            .archive_count == 2 and .wingless_count == 1 and .yggdrasil_count == 1 and
            .original_execution_authorized == false and
            .complete_ckb_custody == false and
            .scientific_accepted == false and
            .accepted_ref_mutation == false and
            (.observations | length) == 2 and
            all(.observations[];
              .archival_integrity_verified == true and
              .preregistration_verified == false and
              .first_use_reconciled == false and
              .scientific_accepted == false and
              .scientific_classification == "UNQUALIFIED_ORIGINAL_EVIDENCE_PRESERVED")
          ' "$root/observation.json" >/dev/null
          (cd "$root"; sha256sum source-manifest.json *.run.json *.artifact.json *.zip observation.json > verified-originals.sha256; sha256sum --check verified-originals.sha256)
          echo 'W_R9_Y022_ORIGINALS_BYTE_VERIFIED=PASS'
          echo 'SCIENTIFIC_ACCEPTANCE_AND_FIRST_USE=UNCHANGED'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-two-legacy-originals-readonly
          path: ${{ runner.temp }}/forge-legacy-originals
          retention-days: 90
          if-no-files-found: error

  historical-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify historical coverage parser and negative contracts
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./historycoverage ./cmd/forge-history-coverage
      - name: Read all GitHub-visible run/artifact metadata, no original execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/forge-history-coverage"
          mkdir -p "$root"
          for lane in Wingless Yggdrasil; do
            repo="spoonman136668-ai/$lane"
            key="$(tr '[:upper:]' '[:lower:]' <<< "$lane")"
            gh api "repos/$repo/actions/runs?per_page=1" --jq '.total_count' > "$root/$key-runs-total"
            gh api "repos/$repo/actions/artifacts?per_page=1" --jq '.total_count' > "$root/$key-artifacts-total"
            gh api --paginate "repos/$repo/actions/runs?per_page=100" --jq '.workflow_runs[] | @json' > "$root/$key-runs.ndjson"
            gh api --paginate "repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[] | @json' > "$root/$key-artifacts.ndjson"
          done
          go run ./cmd/forge-history-coverage \
            --wingless-runs "$root/wingless-runs.ndjson" \
            --wingless-artifacts "$root/wingless-artifacts.ndjson" \
            --yggdrasil-runs "$root/yggdrasil-runs.ndjson" \
            --yggdrasil-artifacts "$root/yggdrasil-artifacts.ndjson" \
            --wingless-runs-total "$(cat "$root/wingless-runs-total")" \
            --wingless-artifacts-total "$(cat "$root/wingless-artifacts-total")" \
            --yggdrasil-runs-total "$(cat "$root/yggdrasil-runs-total")" \
            --yggdrasil-artifacts-total "$(cat "$root/yggdrasil-artifacts-total")" \
            > "$root/observation.json"
      - name: Retain full gap inventory and explicitly deny scientific claims
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/forge-history-coverage"
          jq -e '
            .schema == "forge.research-history-coverage.v1" and
            .mode == "GITHUB_ACCESSIBLE_METADATA_AUDIT_NOT_RAW_CUSTODY" and
            .full_historical_scientific_coverage_verified == false and
            .long_term_original_bytes_retained == false and
            .independent_scientific_custody_qualified == false and
            .new_scientific_execution == false and
            .accepted_ref_mutation == false and
            .wingless.observed_run_count > 0 and
            .yggdrasil.observed_run_count > 0
          ' "$root/observation.json" > /dev/null
          jq -c '{wingless: {runs: .wingless.observed_run_count, original_named: .wingless.original_named_count, expired: .wingless.original_expired_count, unavailable_digest: .wingless.original_missing_digest_count}, yggdrasil: {runs: .yggdrasil.observed_run_count, original_named: .yggdrasil.original_named_count, expired: .yggdrasil.original_expired_count, unavailable_digest: .yggdrasil.original_missing_digest_count}, accessible_window_reconciled: .github_accessible_snapshot_reconciled, scientific_coverage_complete: .full_historical_scientific_coverage_verified}' "$root/observation.json"
          (cd "$root"; sha256sum observation.json > summary.sha256; sha256sum --check summary.sha256)
          echo 'HISTORICAL_COVERAGE_GAPS_EXPLICITLY_INVENTORIED=PASS'
          echo 'PRIVATE_OFFSITE_RETENTION_AND_INDEPENDENT_CUSTODY=NOT_PROVEN'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-research-coverage-gap-inventory
          path: |
            ${{ runner.temp }}/forge-history-coverage/observation.json
            ${{ runner.temp }}/forge-history-coverage/summary.sha256
          retention-days: 90
          if-no-files-found: error
