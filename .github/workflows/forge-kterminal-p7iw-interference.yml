name: FORGE K-Terminal P7-I/W private observer interaction
on:
  push:
    branches: [qualification/kterminal-p7iw-interference-pair-20261019]
permissions:
  contents: read
  actions: read
concurrency:
  group: forge-kterm-p7iw-${{ github.sha }}
  cancel-in-progress: false

jobs:
  original-windows-pair-and-half:
    runs-on: windows-2022
    timeout-minutes: 46
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '4'
      GOFLAGS: '-p=1'
      GOMEMLIMIT: '1536MiB'
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout public FORGE qualification control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze source, runner and research isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/FORGE
          test "$GITHUB_REF" = refs/heads/qualification/kterminal-p7iw-interference-pair-20261019
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Windows
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 296f2784621b92006f3e217012fafa54b8aed1f6 HEAD
          git diff --name-only 296f2784621b92006f3e217012fafa54b8aed1f6 HEAD | sort > "$RUNNER_TEMP/p7iw-actual.txt"
          printf '%s\n' '.github/workflows/forge-kterminal-p7iw-interference.yml' 'tools/qualification/kterminal_p7iw_pair_screen.py' | sort > "$RUNNER_TEMP/p7iw-allowed.txt"
          diff -u "$RUNNER_TEMP/p7iw-allowed.txt" "$RUNNER_TEMP/p7iw-actual.txt"
          test -z "$(git status --porcelain)"
          test "$GOMAXPROCS" = 4
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          test "$K_TERMINAL_NATIVE_TIMING" = 0
          test "$K_TERMINAL_P5_LATENCY" = 0
          echo P7IW_FORGE_HOSTED_SCOPE=PASS
          echo P7IW_SCIENCE_AND_WORKSTATION_RUNNERS=UNTOUCHED
      - name: Checkout exact frozen K-Terminal private source read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: ba11a398586df9fe5233624d9cf115aeec76d11a
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Download sealed prior FORGE package failure receipt
        uses: actions/download-artifact@v4
        with:
          name: forge-kterminal-p7iu-39301561797
          run-id: 39301561797
          github-token: GH_${{ secrets.FORGE_KTERM_QUAL }}
          path: ${{ runner.temp }}/p7iu-previous
      - name: Download sealed prior FORGE isolated focused-test receipt
        uses: actions/download-artifact@v4
        with:
          name: forge-kterminal-p7iv-39315197440
          run-id: 39315197440
          github-token: GH_${{ secrets.FORGE_KTERM_QUAL }}
          path: ${{ runner.temp }}/p7iv-previous
      - name: Install exact original Windows Go 1.26.5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Authenticate private source, execute pair then bounded first-half screening
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Windows
          test "$(git rev-parse HEAD)" = ba11a398586df9fe5233624d9cf115aeec76d11a
          test "$(git rev-parse HEAD:pkg/stage3-original-observer-forced-cuts_test.go)" = bee85ee3441b0f66399ab6c42f8b09635ba44c6b
          test "$(git rev-parse HEAD:pkg/stage3-native-authenticated-sell-post-crash_test.go)" = 8fc5727f722510b2bfff0cfe9d4eb0565c6cb5fc
          test "$(git rev-parse HEAD:go.mod)" = b3ede0d8444c08b3e7b23f1396374359b54134c6
          test -z "$(git status --porcelain)"
          go version | grep 'go1.26.5 windows/amd64' >/dev/null
          for name in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET; do
            if [[ -n "$(printenv "$name" 2>/dev/null || true)" ]]; then
              echo P7IW_BROKER_CREDENTIAL_ENV_PRESENT
              exit 2
            fi
          done
          python -B ../tools/qualification/kterminal_p7iw_pair_screen.py
      - name: Retain sanitized evidence only, without original private test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-kterminal-p7iw-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p7iw-sanitized/receipt.json
            ${{ runner.temp }}/p7iw-sanitized/receipt.sha256
          retention-days: 30
          if-no-files-found: warn
