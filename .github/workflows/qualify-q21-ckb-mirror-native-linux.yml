name: Q21 CKB exact development-consumer source-only Linux qualification

on:
  push:
    branches: [qualify/q21-ckb-exact-linux-sourceonly-20261022]
    paths:
      - '.github/workflows/qualify-q21-ckb-mirror-native-linux.yml'
      - 'research/q21_ckb_native_mirror/**'

permissions:
  contents: read

concurrency:
  group: q21-ckb-sourceonly-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-linux-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify all four CKB Python source objects byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^')" = 'ecbd672f0b3bba34d6e92d2f1475ea6dc80f605f'
          test "$(git diff --name-only HEAD^ HEAD | wc -l | tr -d ' ')" = 5
          declare -A pins=(
            [admit_exact.py]=cebda244cf0899e60ef07162969b594340b67b74
            [test_admit_exact.py]=ea99a2a92c431087e885c7ccc8ee93bc9728fd97
            [execute_dev.py]=722e47dcdbf5affd2102dbf2d329c4c55ea40d69
            [test_execute_dev.py]=8864f6d00dc7bd843f40238e6c597856495a4d7a
          )
          for filename in "${!pins[@]}"; do
            path="research/q21_ckb_native_mirror/$filename"
            test "$(git rev-parse "HEAD:$path")" = "${pins[$filename]}"
            test "$(git hash-object --no-filters "$path")" = "${pins[$filename]}"
          done
          echo 'Q21_MIRROR_CKB_EXACT_GIT_BLOBS=PASS'
      - name: Native Linux admission and development-consumer refusal tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/q21_ckb_native_mirror -p 'test_*.py' -v
          python -B research/q21_ckb_native_mirror/admit_exact.py --mode preflight
          python -B research/q21_ckb_native_mirror/execute_dev.py --mode preflight
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'Q21_CKB_NATIVE_LINUX_SOURCE_ONLY=PASS'
          echo 'Q21_SCIENTIFIC_ADMISSION=NOT_REQUESTED'
          echo 'Q21_DEVELOPMENT_COHORTS_GENERATED=0'
