name: F124-AJ raw bit neural operator against explicit fixed controls
on:
  push:
    branches: [research/f124aj-learned-operator-20261018]
permissions: {contents: read, actions: read}
concurrency:
  group: f124aj-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-on-both-OS:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Freeze new FIT DEV source, no bit-index operator, original fixed controls and 16 cells
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if ($IsWindows) {'python'} else {'python3'}
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'F124AJ_HEAD_NOT_EXACT' }
          & $py -B -m unittest discover -s nativeevidence -p 'test_f124aj_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F124AJ_FROZEN_SOURCE_QUALIFICATION_FAILED' }
          & $py -B isolationguard/check.py
          if ($LASTEXITCODE -ne 0) { throw 'F124AJ_ORIGINAL_FORGE_ISOLATION_FAILED' }
          Write-Output 'F124AJ_PROTECTED_FIRST_USE=false'
  raw-neural-FIT:
    needs: source-on-both-OS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: FIT only raw bit 49-weight operator SGD 140 epochs then zero-FP and positive-sensitivity selection
        shell: bash
        run: |
          set -euo pipefail
          python3 -B nativeevidence/f124aj_raw_neural.py --output "$RUNNER_TEMP/f124aj-fit.json"
          python3 - "$RUNNER_TEMP/f124aj-fit.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a["schema"]=="forge.research.f124aj.raw-shared-operator-FIT.v1"
          assert a["freeze_blob"]=="42d0a025bc2aba88032f28eecd58ef45bce8dfc5"
          assert a["trained"]["params"]==49 and a["trained"]["epochs"]==140
          assert a["trained"]["FIT_samples"]==288 and a["trained"]["weight_change_L2"]>0
          assert a["learned_parameters"]==49 and a["selected_threshold_parameter"]==1
          assert a["no_DEV_training_or_selection"]
          assert not a["protected_first_use"] and not a["science_accepted"]
          assert len(a["FIT_curve"])==11
          for family in ("near_event","far_event","role_collision"):
              for phase in ("DEV","untrained_DEV"):
                  x=a[phase][family]
                  assert x["pairs"]==48 and len(x["cases"])==48
                  assert all(d["pairs"]==16 for d in x["by_depth"].values())
          PY
          sha256sum "$RUNNER_TEMP/f124aj-fit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: f124aj-FIT-train-original-neural-${{ github.sha }}
          path: ${{ runner.temp }}/f124aj-fit.json
          retention-days: 90
          if-no-files-found: error
  authentic-comparison:
    needs: raw-neural-FIT
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: f124aj-FIT-train-original-neural-${{ github.sha }}
          path: fit
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39078269441
          github-token: ${{ github.token }}
          name: f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d
          path: o
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39081990918
          github-token: ${{ github.token }}
          name: f124r-fresh-two-lane-causal-evidence-522601491c10ebfeb36e7dca2627ff5366b51abb
          path: r
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39082745397
          github-token: ${{ github.token }}
          name: f124s-source-backed-development-bc59de4f118b37d9a501dd8a944e210540222a27
          path: s
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39084599471
          github-token: ${{ github.token }}
          name: f124u-source-backed-independent-development-7d8df58e3fd7363e5c91b39a426ff3430fedf20d
          path: u
      - name: Authenticated fitted O U versus original fixed symbolic and genuinely raw neural
        shell: bash
        run: |
          set -euo pipefail
          python3 -B nativeevidence/f124aj_comparison.py --original-o o/f124o-independent-two-learned-development.json --original-r r/f124r-fresh-calibrated-continuous-development.json --original-s s/f124s-fresh-packed-key-cell-credit-development.json --original-u u/f124u-bounded-index-fresh-causal-rank-development.json --trained-receipt fit/f124aj-fit.json --output "$RUNNER_TEMP/f124aj-comparison.json"
          python3 - "$RUNNER_TEMP/f124aj-comparison.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a["schema"]=="forge.research.f124aj.original-vs-raw-learned.v1"
          assert a["freeze_blob"]=="42d0a025bc2aba88032f28eecd58ef45bce8dfc5"
          assert a["original_historical_fitted_weights_unchanged"]
          assert a["trained_network_49_global_params_and_threshold"]==50
          assert a["original_state_cell_count_limit"]==16 and a["new_DEV_never_selected"]
          assert not a["protected_first_use"] and not a["science_accepted"]
          for phase in ("FIT","DEV"):
              for family in ("near_event","far_event","role_collision"):
                  for arm,row in a[phase][family]["arms"].items():
                      assert row["pairs"]==48 and len(row["cases"])==48
                      assert all(d["pairs"]==16 for d in row["by_depth"].values())
          PY
          sha256sum "$RUNNER_TEMP/f124aj-comparison.json"
      - uses: actions/upload-artifact@v4
        with:
          name: f124aj-independent-neural-vs-fixed-${{ github.sha }}
          path: ${{ runner.temp }}/f124aj-comparison.json
          retention-days: 90
          if-no-files-found: error
  actual-cost-on-both-OS:
    needs: raw-neural-FIT
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: f124aj-FIT-train-original-neural-${{ github.sha }}
          path: fit
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39078269441
          github-token: ${{ github.token }}
          name: f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d
          path: o
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39081990918
          github-token: ${{ github.token }}
          name: f124r-fresh-two-lane-causal-evidence-522601491c10ebfeb36e7dca2627ff5366b51abb
          path: r
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39082745397
          github-token: ${{ github.token }}
          name: f124s-source-backed-development-bc59de4f118b37d9a501dd8a944e210540222a27
          path: s
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39084599471
          github-token: ${{ github.token }}
          name: f124u-source-backed-independent-development-7d8df58e3fd7363e5c91b39a426ff3430fedf20d
          path: u
      - name: Six arms real peak RSS Python heap CPU and wall on identical 96 public graphs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if ($IsWindows) {'python'} else {'python3'}
          $env:PYTHONHASHSEED='0'
          $out=Join-Path $env:RUNNER_TEMP "f124aj-cost-${{ matrix.os }}.json"
          & $py -B nativeevidence/f124aj_physical.py --bench --original-o o/f124o-independent-two-learned-development.json --original-r r/f124r-fresh-calibrated-continuous-development.json --original-s s/f124s-fresh-packed-key-cell-credit-development.json --original-u u/f124u-bounded-index-fresh-causal-rank-development.json --trained-receipt fit/f124aj-fit.json --output $out
          if ($LASTEXITCODE -ne 0) { throw 'F124AJ_ACTUAL_RAM_OR_CPU_FAILED' }
          $v=Get-Content $out -Raw | ConvertFrom-Json
          if ($v.schema -cne 'forge.research.f124aj.six-arm-total-physical-cost.v1' -or
              $v.freeze_blob -cne '42d0a025bc2aba88032f28eecd58ef45bce8dfc5' -or
              $v.raw.Count -ne 18 -or $v.original_max_cells -ne 16 -or
              -not $v.extra_global_params_counted -or -not $v.larger_packed_state_counted -or
              $v.protected_first_use -or $v.science_accepted) { throw 'F124AJ_COST_CUSTODY_MISMATCH' }
          foreach ($arm in @('historical_O_combined','historical_U_combined','fixed_consistency16','fixed_collisionfree','untrained_raw_neural','trained_raw_neural')) {
            $m=$v.summary.$arm
            if ($m.repetitions -ne 3 -or $m.median_wall_ns -le 0 -or
                $m.median_cpu_ns -le 0 -or $m.median_peak_process_RSS_bytes -le 0) {
              throw 'F124AJ_MISSING_RESOURCE_REP'
            }
            Write-Output "F124AJ_COST_$($arm):rss=$($m.median_peak_process_RSS_bytes):wall=$($m.median_wall_ns):cpu=$($m.median_cpu_ns):heap=$($m.median_Python_heap_bytes)"
          }
          Write-Output "F124AJ_RESOURCE_SHA256=$((Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant())"
      - uses: actions/upload-artifact@v4
        with:
          name: f124aj-neural-vs-symbolic-RAM-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/f124aj-cost-${{ matrix.os }}.json
          retention-days: 90
          if-no-files-found: error
  one-final-Go-regression:
    needs: [authentic-comparison, actual-cost-on-both-OS]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env: {GOMAXPROCS: '2', GOFLAGS: '-p=2', GOMEMLIMIT: '1536MiB'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - name: Exactly one original Go test race vet build and FORGE isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
          echo "F124AJ_EXACT_QUALIFIED_HEAD=$GITHUB_SHA"
          echo 'F124AJ_PROTECTED_FIRST_USE=false'
