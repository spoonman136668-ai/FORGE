name: FORGE G29 Public Source Atlas
on:
  pull_request:
    paths:
      - 'cmd/forge-code-atlas/**'
      - '.ice/public-code-atlas.*'
      - '.github/workflows/forge-g29-source-atlas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go AST focused unit qualification
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/forge-code-atlas
          go vet ./cmd/forge-code-atlas
      - name: G61 reconcile exact G60 source delta, retain immutable G29 baseline
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/forge-code-atlas --g61 --g61-out "$RUNNER_TEMP/G61"
      - name: Verify source navigator output stays runner-private
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "G61"
          proof = json.loads((p/"G61_DELTA_PROVENANCE.json").read_text(encoding="utf-8"))
          atlas = json.loads((p/"G61_SOURCE_ATLAS.json").read_text(encoding="utf-8"))
          assert (proof["exact_blob_reused"],proof["modified_files"],proof["added_files"],proof["csharp_files"]) == (747,16,18,1)
          assert atlas["counts"]["files"] == 781
          assert any(s["file"]=="scripts/F139WindowsJobSupervisor.cs" and s["name"]=="F139WindowsJobSupervisor" and s["evidence_basis"]=="lexical-locator-only" for s in atlas["symbols"])
          assert (p/"G61_SOURCE_ATLAS.html").stat().st_size > 1000
          print("FORGE_G61_NAVIGATION_EVIDENCE_PASS")
          PY
      - name: Clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
