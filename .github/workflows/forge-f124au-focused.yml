name: F124-AU frozen operator-agnostic and one-packed source focused
on:
  push:
    branches: [research/f124au-learned-public-relation-and-packed-witness-20261018]
    paths:
      - '.github/workflows/forge-f124au-focused.yml'
      - 'nativeevidence/f124au_train_source.py'
      - 'nativeevidence/f124au_public_relation_model.py'
      - 'nativeevidence/f124au_packed_witness.py'
      - 'nativeevidence/test_f124au_frozen_source_and_models.py'
      - 'reference/research-intake/f124au-frozen-public-relation-and-packed-witness.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: f124au-focused-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focus:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source and candidate focused qualification with unchanged parent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'F124AU_HEAD_CHANGED' }
          $spec='reference/research-intake/f124au-frozen-public-relation-and-packed-witness.json'
          if ((git hash-object $spec).Trim() -cne '421785b12f13a9675e682d07489ca3cca934332c' -or
              (git log -1 --format=%H -- $spec).Trim() -cne '1be5f40d3486ecf4a2c8f6964ab2a8d3d80888e9' -or
              (git rev-parse '8b910711c143e9ab2940b61969824957d3fee1f9:nativeevidence/f124at_train_source.py').Trim() -cne 'e4da961ea74eb286824487c6f20fb3327ae40dc5') {
            throw 'F124AU_ORIGINAL_SOURCE_FREEZE_DRIFT'
          }
          $py=if($IsWindows){'python'}else{'python3'}
          & $py -B -m unittest discover -s nativeevidence -p 'test_f124au_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F124AU_MODEL_FOCUSED_FAILED' }
          & $py -B isolationguard/check.py
          if ($LASTEXITCODE -ne 0) { throw 'F124AU_ISOLATION_FAILED' }
          Write-Output 'F124AU_BOUNDED_IMPLEMENTATION_FOCUSED=PASS'
          Write-Output 'F124AU_NEW_TRAIN_SELECTED=false'
          Write-Output 'F124AU_NEW_DEV_CONSUMED=false'
  historical-parent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Authenticate AT original negative and final regression
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $r=gh api 'repos/spoonman136668-ai/FORGE/actions/runs/39138289418' | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $r.status -cne 'completed' -or $r.conclusion -cne 'success' -or
             $r.head_sha -cne '8b910711c143e9ab2940b61969824957d3fee1f9') {
            throw 'F124AU_PARENT_FULL_REGRESSION_INVALID'
          }
          $t=gh api 'repos/spoonman136668-ai/FORGE/actions/runs/39138041247' | ConvertFrom-Json
          $a=gh api 'repos/spoonman136668-ai/FORGE/actions/runs/39138041247/artifacts' | ConvertFrom-Json
          $artifact=@($a.artifacts | Where-Object {$_.id -eq 12139584964})
          if($LASTEXITCODE -ne 0 -or $t.status -cne 'completed' -or $t.conclusion -cne 'success' -or
             $t.head_sha -cne '699ba7abc460bc0763eed2f11d10bdf766e4604b' -or
             $artifact.Count -ne 1 -or $artifact[0].expired -or
             $artifact[0].digest -cne 'sha256:765aa8cea697f18914948a3269280b91371359bd62c1bd7f9da1546aa4246a1a'){
            throw 'F124AU_AT_ORIGINAL_NEGATIVE_CUSTODY_INVALID'
          }
          Write-Output 'F124AU_HISTORICAL_ORIGINAL_AUTHENTICATED=PASS'
