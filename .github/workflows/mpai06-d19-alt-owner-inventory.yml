name: D19 alternative runner owner-file read-only custody probe
on:
  push:
    branches: [qualification/mpai06-d19-alt-runner-owner-preimage-20261025]
    paths: ['.github/workflows/mpai06-d19-alt-owner-inventory.yml']
permissions:
  contents: read
concurrency:
  group: mpai06-d19-alt-owner-inventory-once-20261025
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    steps:
      - name: Verify whether separate isolated Windows runner can access original owner files read-only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          function Need([bool]$yes,[string]$label){if(-not $yes){throw ('D19_'+$label)}}
          Need ($env:GITHUB_REPOSITORY -ceq 'spoonman136668-ai/FORGE' -and
                $env:RUNNER_NAME -ceq 'FORGE-CODEX-REMOTE') 'EXACT_NONCOMPETING_RUNNER'
          Remove-Item Env:OPENAI_API_KEY,Env:AZURE_OPENAI_API_KEY,Env:CODEX_HOME -ErrorAction SilentlyContinue
          $sameHost=($env:COMPUTERNAME -ieq 'LINKDEADKB')
          Write-Host ('D19_ORIGINAL_WORKSTATION_HOST_MATCH='+$sameHost.ToString().ToUpperInvariant())
          $ownerRoot='C:\Users\camar\GolandProjects\Mind-Palace'
          $ownerExists=(Test-Path -LiteralPath $ownerRoot -PathType Container)
          $planeRoot='C:\ProgramData\CKBR\plane'
          $planeExists=(Test-Path -LiteralPath $planeRoot -PathType Container)
          Write-Host ('D19_ORIGINAL_USER_OWNER_REPO_VISIBLE='+$ownerExists.ToString().ToUpperInvariant())
          Write-Host ('D19_ORIGINAL_PLANE_INSTALL_ROOT_VISIBLE='+$planeExists.ToString().ToUpperInvariant())
          $canAttest=$sameHost -and $ownerExists -and $planeExists
          if($canAttest){
            $git=(Get-Command git.exe -ErrorAction SilentlyContinue)
            if($null -ne $git){
              $sha=(& $git.Source -C $ownerRoot rev-parse HEAD | Out-String).Trim()
              $valid=($LASTEXITCODE -eq 0 -and $sha -ceq '7ad7230a82e3c748aa5336b7288ad2b45d42630c')
              Write-Host ('D19_ORIGINAL_OWNER_ACCEPTED_MAIN_MATCH='+$valid.ToString().ToUpperInvariant())
            }
            foreach($entry in @(
              @{name='CONFIG'; rel='config/autonomy.yaml'},
              @{name='REGISTRY'; rel='config/local-operations.json'},
              @{name='BINARY'; rel='bin/ckb-plane.exe'},
              @{name='CONTEXT_OPERATION'; rel='operations/Read-MindPalaceContext.ps1'}
            )){
              $path=Join-Path $planeRoot $entry.rel
              $exists=Test-Path -LiteralPath $path -PathType Leaf
              Write-Host ('D19_'+$entry.name+'_PRESENT='+$exists.ToString().ToUpperInvariant())
              if($exists){
                $item=Get-Item -LiteralPath $path -Force
                Need (-not (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) 'PATH_REPARSE'
                $digest=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
                Write-Host ('D19_'+$entry.name+'_PREIMAGE_SHA256='+$digest)
              }
            }
          } else {
            Write-Host 'D19_ALTERNATE_RUNNER_OWNER_PRIVILEGED_CUSTODY=NOT_ESTABLISHED'
          }
          # Separate exact-source inventory on this SAME physical workstation.
          # Directory listing is limited to three already source-grounded roots;
          # never print file bodies or mutable queue content.
          $roots=[ordered]@{
            USER_CKB_REPO='C:\Users\camar\GolandProjects\ckb-plane'
            PROGRAMDATA_CKBR='C:\ProgramData\CKBR'
            PROGRAMDATA_CKBPLANE='C:\ProgramData\CKBR\ckb-plane'
          }
          foreach($row in $roots.GetEnumerator()){
            $present=Test-Path -LiteralPath $row.Value -PathType Container
            Write-Host ('D19_'+$row.Key+'_ROOT_VISIBLE='+$present.ToString().ToUpperInvariant())
          }
          $lookups=@(
            'config/autonomy.yaml',
            'config/local-operations.json',
            'bin/ckb-plane.exe',
            'operations/Read-MindPalaceContext.ps1',
            'operations/Read-PlaneHealth.ps1'
          )
          foreach($prefix in @('C:\Users\camar\GolandProjects\ckb-plane','C:\ProgramData\CKBR','C:\ProgramData\CKBR\ckb-plane')){
            $label=if($prefix -like '*GolandProjects*'){'USER_CKB'}elseif($prefix.EndsWith('ckb-plane')){'DATA_CKB'}else{'DATA_ROOT'}
            foreach($relative in $lookups){
              $candidate=Join-Path $prefix $relative
              $exists=Test-Path -LiteralPath $candidate -PathType Leaf
              $id=($relative -replace '[^A-Za-z0-9]','_').ToUpperInvariant()
              Write-Host ('D19_'+$label+'_'+$id+'_FOUND='+$exists.ToString().ToUpperInvariant())
              if($exists){
                $item=Get-Item -LiteralPath $candidate -Force
                Need (-not (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) 'OWNER_PREIMAGE_REPARSE'
                $digest=(Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
                Write-Host ('D19_'+$label+'_'+$id+'_SHA256='+$digest)
              }
            }
          }
          $administrator=([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host ('D19_ALTERNATE_RUNNER_ADMIN_ROLE='+$administrator.ToString().ToUpperInvariant())
          Write-Host 'D19_ORIGINAL_RUNNING_CONTROLLER_IDLE=NOT_VERIFIED'
          # Native owner inventory, deliberately read only. Do not invoke
          # controller status (known to reject historical YAML), invoke local
          # operations, adjust the registry, or open pending record contents.
          $ckbRoot='C:\Users\camar\GolandProjects\ckb-plane'
          $registryPath=Join-Path $ckbRoot 'config/local-operations.json'
          $controllerPath=Join-Path $ckbRoot 'bin/ckb-plane.exe'
          $mindRoot='C:\Users\camar\GolandProjects\Mind-Palace'
          $pendingPath=Join-Path $mindRoot '.mind-runtime/pending.jsonl'
          if(Test-Path -LiteralPath $registryPath -PathType Leaf){
            $reg=Get-Content -LiteralPath $registryPath -Raw | ConvertFrom-Json
            $ids=@($reg.operations | ForEach-Object {[string]$_.id})
            Write-Host ('D19_REGISTERED_LOCAL_OPERATION_COUNT='+$ids.Count)
            foreach($id in @('mind-palace-context','plane-health','mind-palace-feedback-stage-d16')){
              $matched=@($reg.operations | Where-Object {[string]$_.id -ceq $id})
              Write-Host ('D19_REGISTRY_'+($id -replace '[^A-Za-z0-9]','_').ToUpperInvariant()+'_COUNT='+$matched.Count)
              if($matched.Count -eq 1){
                Write-Host ('D19_REGISTRY_'+($id -replace '[^A-Za-z0-9]','_').ToUpperInvariant()+'_EXPECTED_SHA256='+[string]$matched[0].script_sha256)
              }
            }
          }
          $pendingPresent=Test-Path -LiteralPath $pendingPath -PathType Leaf
          Write-Host ('D19_ORIGINAL_MINDPALACE_PENDING_PRESENT='+$pendingPresent.ToString().ToUpperInvariant())
          if($pendingPresent){
            $pendingItem=Get-Item -LiteralPath $pendingPath -Force
            Need (-not (($pendingItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) 'PENDING_REPARSE'
            $pendingDigest=(Get-FileHash -LiteralPath $pendingPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $pendingCount=@(Get-Content -LiteralPath $pendingPath | Where-Object {-not [string]::IsNullOrWhiteSpace($_)}).Count
            Write-Host ('D19_ORIGINAL_MINDPALACE_PENDING_COUNT='+$pendingCount)
            Write-Host ('D19_ORIGINAL_MINDPALACE_PENDING_SHA256='+$pendingDigest)
          }
          $processReadable=$false
          try {
            $native=@(Get-CimInstance Win32_Process -Filter "Name='ckb-plane.exe'" -ErrorAction Stop)
            $processReadable=$true
            Write-Host ('D19_NATIVE_CKBPLANE_PROCESS_COUNT='+$native.Count)
            $exactPath=0
            foreach($p in $native){
              if(-not [string]::IsNullOrWhiteSpace($p.ExecutablePath) -and
                [IO.Path]::GetFullPath([string]$p.ExecutablePath).Equals([IO.Path]::GetFullPath($controllerPath),[StringComparison]::OrdinalIgnoreCase)){
                $exactPath++
              }
            }
            Write-Host ('D19_PROCESS_MATCHES_INSTALLED_EXE='+$exactPath)
          } catch {
            Write-Host 'D19_NATIVE_PROCESS_QUERY=NOT_AUTHENTICATED'
          }
          if($processReadable){Write-Host 'D19_NATIVE_PROCESS_QUERY=PASS'}
          try {
            $task=Get-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction Stop
            Write-Host ('D19_ORIGINAL_CONTROLLER_SCHEDULED_TASK_STATE='+[string]$task.State)
          }catch{Write-Host 'D19_ORIGINAL_CONTROLLER_SCHEDULED_TASK_STATE=UNAVAILABLE'}
          # Identify exact running image identity; do not inspect command-line
          # arguments (which may contain private operator data).
          if($processReadable){
            foreach($p in $native){
              $image=[string]$p.ExecutablePath
              if([string]::IsNullOrWhiteSpace($image)){
                Write-Host 'D19_RUNNING_CKB_IMAGE=PATH_NOT_AVAILABLE'
                continue
              }
              $exact=[IO.Path]::GetFullPath($image)
              $ownerPrefix='C:\Users\camar\GolandProjects\ckb-plane'
              $programPrefix='C:\ProgramData\CKBR'
              if($exact.StartsWith($ownerPrefix,[StringComparison]::OrdinalIgnoreCase)){
                $class='OWNER_CKB_CHECKOUT'
                $rel=$exact.Substring($ownerPrefix.Length).TrimStart('\')
                Write-Host ('D19_RUNNING_CKB_IMAGE_RELATIVE_PATH='+$rel)
              } elseif($exact.StartsWith($programPrefix,[StringComparison]::OrdinalIgnoreCase)){
                $class='CKBR_PROGRAMDATA'
                $rel=$exact.Substring($programPrefix.Length).TrimStart('\')
                Write-Host ('D19_RUNNING_CKB_IMAGE_RELATIVE_PATH='+$rel)
              }else{
                $class='OTHER_UNVERIFIED_INSTALL_ROOT'
              }
              Write-Host ('D19_RUNNING_CKB_IMAGE_CLASS='+$class)
              if($class -ne 'OTHER_UNVERIFIED_INSTALL_ROOT' -and
                 (Test-Path -LiteralPath $exact -PathType Leaf)){
                $imgItem=Get-Item -LiteralPath $exact -Force
                Need (-not (($imgItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) 'EXECUTABLE_REPARSE'
                Write-Host ('D19_RUNNING_CKB_IMAGE_SHA256='+(Get-FileHash -LiteralPath $exact -Algorithm SHA256).Hash.ToLowerInvariant())
              }
            }
          }
          Write-Host 'D19_IDLE_STATE=NOT_PROVEN_BY_PROCESS_OR_TASK_METADATA'
          # Validate the ORIGINAL native release-store pointer and running
          # release preimages without editing either the active release or task.
          $store='C:\ProgramData\CKBR\release-store\ckb-plane'
          $releaseId='PLANE-R220-LIVECOMPAT-20261023'
          $release=Join-Path $store ('releases\'+$releaseId)
          $pointer=Join-Path $store 'state/active-release'
          $ptrExists=Test-Path -LiteralPath $pointer -PathType Leaf
          $relExists=Test-Path -LiteralPath $release -PathType Container
          Write-Host ('D19_RELEASE_STORE_TARGET_EXISTS='+$relExists.ToString().ToUpperInvariant())
          Write-Host ('D19_RELEASE_STORE_ACTIVE_POINTER_EXISTS='+$ptrExists.ToString().ToUpperInvariant())
          if($ptrExists){
            $ptr=([IO.File]::ReadAllText($pointer,[Text.Encoding]::UTF8)).Trim()
            Write-Host ('D19_RELEASE_STORE_POINTER_MATCHES_PROCESS_RELEASE='+($ptr -ceq $releaseId).ToString().ToUpperInvariant())
            Write-Host ('D19_RELEASE_STORE_POINTER_SHA256='+(Get-FileHash -LiteralPath $pointer -Algorithm SHA256).Hash.ToLowerInvariant())
          }
          if($relExists){
            foreach($part in @('release-manifest.json','release-seal.json','bin/ckb-plane.exe')){
              $candidate=Join-Path $release $part
              $exists=Test-Path -LiteralPath $candidate -PathType Leaf
              $name=($part -replace '[^A-Za-z0-9]','_').ToUpperInvariant()
              Write-Host ('D19_RELEASE_'+$name+'_EXISTS='+$exists.ToString().ToUpperInvariant())
              if($exists){
                $item=Get-Item -LiteralPath $candidate -Force
                Need (-not (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) 'RELEASE_REPARSE'
                Write-Host ('D19_RELEASE_'+$name+'_SHA256='+(Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant())
              }
            }
          }
          Write-Host 'D19_NO_CONTROLLER_OR_MEMORY_WRITES=PASS'
          Write-Host 'D19_CODEX_MODEL_CALLS=0'
