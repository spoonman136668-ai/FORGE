name: Mass K5E nonlinear interleaved causal transfer
on:
  push:
    branches: [research/mass-lcrm01-k5e-nonlinear-interleaved-20261024]
permissions:
  contents: read
jobs:
  original-new-world-causal-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 14
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original source native and full interleaved unknown-parent causal science
        run: bash research/lcrm01/k5e_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-k5e-original-interleaved-nonlinear-evidence
          path: |
            ${{ runner.temp }}/k5e/process-a.json
            ${{ runner.temp }}/k5e/process-b.json
            ${{ runner.temp }}/k5e/comparison.json
            ${{ runner.temp }}/k5e/process-a.log
            ${{ runner.temp }}/k5e/process-b.log
          if-no-files-found: warn
          retention-days: 90
