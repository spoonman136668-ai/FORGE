name: ITD-02 MG17-D retrospective original door-to-goal delay witness
on:
  push:
    branches: [research/itd02-mg17d-delayed-chain-source-witness-20261029]
permissions:
  contents: read
  actions: read
jobs:
  independent-source-delayed-consequence-audit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Original blob line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Source pinned
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python source 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Freeze verified original-source ancestry and audit implementation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cccd5c428c7412274504e8721fe83e58a28359f1 "$GITHUB_SHA"
          git merge-base --is-ancestor 3f036130c46cf705d76c13c32e99456b9ad6bc8b "$GITHUB_SHA"
          test "$(git hash-object research/lcrm01/mg17d_delayed_chain_witness_freeze.json)" = cdddd80ba98cc730fdf0cadad2cb6a4fb0687748
          test "$(git hash-object research/lcrm01/mg17d_verify_delayed_witness.py)" = e7a867131654100aeb8117b2c1a472715ca22ace
          echo MG17D_RETROSPECTIVE_FREEZE_AND_ORIGINAL_AUTHORITY_PASS
      - name: Retrieve already-qualified original-world source artifact WITHOUT resetting source environments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mg17d/original"
          gh run download 40854091686 --repo spoonman136668-ai/FORGE --name itd02-mg17c-native-local-original-world-development-evidence --dir "$RUNNER_TEMP/mg17d/original"
          test -s "$RUNNER_TEMP/mg17d/original/first.json"
          test -s "$RUNNER_TEMP/mg17d/original/second.json"
          test -s "$RUNNER_TEMP/mg17d/original/comparison.json"
          (cd "$RUNNER_TEMP/mg17d/original" &&
            python -m zipfile -c "$RUNNER_TEMP/mg17d/recovered-original-world.zip" first.json second.json comparison.json)
      - name: Independently verify 42 original episodes, authentic per-action source and true delayed door-to-reward witnesses
        shell: bash
        run: |
          set -euo pipefail
          python -B research/lcrm01/mg17d_verify_delayed_witness.py --archive "$RUNNER_TEMP/mg17d/recovered-original-world.zip" --output "$RUNNER_TEMP/mg17d/witness.json"
          test -s "$RUNNER_TEMP/mg17d/witness.json"
          python -B -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['fully_audited_independent_original_processes']==2 and d['selected_actions']==5065 and len(d['delayed_public_witnesses'])==3 and d['scientific_first_use'] is False and d['causal_generalization_or_native_advantage_proven'] is False" "$RUNNER_TEMP/mg17d/witness.json"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo MG17D_ORIGINAL_SOURCE_DELAYED_PUBLIC_CHAIN_WITNESS_PASS__NOT_CAUSAL_SCIENCE
      - name: Preserve only compact audited witness; unchanged original archived at source run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-mg17d-authentic-delayed-public-consequence-audit-${{ matrix.os }}
          path: ${{ runner.temp }}/mg17d/witness.json
          if-no-files-found: warn
          retention-days: 30
