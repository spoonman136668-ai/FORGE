name: Optimizer L6 source-pinned hierarchical subword and RNN controls

on:
  push:
    branches: [research/optimizer-language-l6-hierarchical-20261023]
    paths:
      - '.github/workflows/optimizer-language-l6.yml'
      - 'research/optimizer_language_l6/**'

permissions:
  contents: read

concurrency:
  group: optimizer-language-l6-hierarchical
  cancel-in-progress: false

jobs:
  native-new-public-words:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      L6_EXTERNAL_CORPUS_PATH: ${{ github.workspace }}/../l6-pride-original.txt
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned free CPU numerical dependency
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.1.3
          if ($LASTEXITCODE -ne 0) { throw 'L6_FREE_NUMPY_WHEEL_NOT_AVAILABLE' }
      - name: Enforce protocol-first exact nine-file additive work boundary and original baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent='fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5'
          $ancestor=(& git merge-base $parent HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ancestor -cne $parent) {
            throw 'L6_MAIN_PARENT_CUSTODY_DRIFT'
          }
          $expected=@(
            '.github/workflows/optimizer-language-l6.yml',
            'research/optimizer_language_l6/L6_FROZEN_PROTOCOL.json',
            'research/optimizer_language_l6/source.py',
            'research/optimizer_language_l6/l5_original_models.py',
            'research/optimizer_language_l6/hierarchy.py',
            'research/optimizer_language_l6/neural.py',
            'research/optimizer_language_l6/runner.py',
            'research/optimizer_language_l6/test_hierarchy.py',
            'research/optimizer_language_l6/compare.py'
          )
          $actual=@(& git diff --name-only $parent HEAD)
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne $expected.Count -or
              (Compare-Object $actual $expected)) {
            throw 'L6_NOT_AN_ISOLATED_ADDITIVE_RESEARCH_DELTA'
          }
          $pins=@{
            'research/optimizer_language_l6/L6_FROZEN_PROTOCOL.json'='a7ec20af84e09d1165f17fd712d539716ce15412'
            'research/optimizer_language_l6/l5_original_models.py'='aa606643c05ba12c107aeaf823d9f3dd91b01300'
          }
          foreach ($path in $pins.Keys) {
            $gitBlob=(& git rev-parse ('HEAD:'+$path)).Trim()
            $diskBlob=(& git hash-object --no-filters -- $path).Trim()
            if ($LASTEXITCODE -ne 0 -or $gitBlob -cne $pins[$path] -or
                $diskBlob -cne $pins[$path]) {
              throw ('L6_FROZEN_PROTOCOL_OR_ORIGINAL_CONTROL_DRIFT_'+$path)
            }
          }
          Write-Host 'L6_PROSPECTIVE_SOURCE_PROTOCOL_AND_ORIGINAL_L5_MODEL=PASS'
          Write-Host 'L6_PRIOR_NATIVE_Q21_FSA_FORGE_RESEARCH_UNCHANGED=PASS'
      - name: Acquire different public text only after verifying raw Git object
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B -c "import sys;sys.path.insert(0,'research/optimizer_language_l6');from source import acquire;print('L6_NEW_EXTERNAL_RAW_SHA256='+acquire(sys.argv[1]))" $env:L6_EXTERNAL_CORPUS_PATH
          if ($LASTEXITCODE -ne 0) { throw 'L6_PUBLIC_SOURCE_GIT_BLOB_CUSTODY_FAIL' }
      - name: Twelve source ablation neural full BPTT gradient tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B -m unittest discover -s research/optimizer_language_l6 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'L6_FOCUSED_NEURAL_HIERARCHICAL_TEST_FAIL' }
          Write-Host 'L6_FOCUSED_TESTS=PASS'
      - name: Fit isolated hierarchy ablation recurrent neural and previous character baselines
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $receipt=Join-Path $env:RUNNER_TEMP 'l6-native-realword-results.json'
          python -B research/optimizer_language_l6/runner.py $env:L6_EXTERNAL_CORPUS_PATH | Tee-Object -FilePath $receipt
          if ($LASTEXITCODE -ne 0) { throw 'L6_FROZEN_PUBLIC_DEV_MODEL_FAILURE' }
          Write-Host 'L6_TRAIN_SELECT_DEV_6_ARMS=EMITTED'
          Write-Host 'L6_PROTECTED_Q21_AND_PRIOR_EXPOSED_DEV_REUSE=ZERO'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l6-new-words-native-${{ matrix.os }}
          path: ${{ runner.temp }}/l6-native-realword-results.json
          if-no-files-found: error
          retention-days: 14
      - name: One unchanged final FORGE Go test vet build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo L6_FINAL_GO_REGRESSION=PASS
      - name: Reject any checked-in external source or active work mutation
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dirty=@(& git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) { throw 'L6_DIRTY_RESEARCH_CUSTODY_OR_QUEUE' }
          Write-Host 'L6_NCI_ITD_BIO_Q21_FORGE_NATIVE=UNCHANGED'

  independent-reconciliation:
    needs: native-new-public-words
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: l6-new-words-native-ubuntu-24.04
          path: l6-native/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: l6-new-words-native-windows-2022
          path: l6-native/windows
      - name: Independently compare three source hashes and all 18 model role fidelity receipts
        shell: bash
        run: |
          set -euo pipefail
          python -B research/optimizer_language_l6/compare.py \
            l6-native/linux/l6-native-realword-results.json \
            l6-native/windows/l6-native-realword-results.json \
            l6-native/l6-independent-windows-linux-comparison.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l6-public-hierarchy-and-rnn-cross-native
          path: l6-native/l6-independent-windows-linux-comparison.json
          if-no-files-found: error
          retention-days: 30
