name: L9 cancelled-original v3 source and GitHub custody preflight
on:
  pull_request:
    branches: [research/optimizer-language-l9-webnlg-transfer-20261023]
permissions:
  contents: read
  actions: read
concurrency:
  group: l9-original-cancelled-v3-readonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  cancelled-job-custody:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Recheck original immutable L9 source and exact three-file v3 delta
        shell: bash
        run: |
          set -euo pipefail
          base=1bb07974b6d2cd063e11e0d801eba6d95f1a1a24
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse HEAD:research/optimizer_language_l9/l9_model_suite.py)" = 710ce648a30ffc55647f689c5f4aa3ac13b07066
          test "$(git rev-parse HEAD:research/optimizer_language_l9/l9_neural_select_only.py)" = 91f8108af5e6f3a25e2a8ca07dc3674bd2358f4e
          test "$(git rev-parse HEAD:research/optimizer_language_l9/l9_transformer_select_reuse_v2.py)" = 129b95487e8ea7c28e1e09179c009b6e87cbd653
          git diff --name-only "$base" HEAD | python -B -c 'import sys; a=set(sys.stdin.read().splitlines()); b={"research/optimizer_language_l9/l9_transformer_select_cancel_v3.py","research/optimizer_language_l9/test_l9_transformer_select_cancel_v3.py",".github/workflows/l9-cancelled-original-v3-prefit.yml"}; assert a==b,(a,b)'
      - name: Cancellation-only negatives and original-source identity tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/optimizer_language_l9 -p test_l9_transformer_select_cancel_v3.py -v
          python -B -m unittest discover -s research/optimizer_language_l9 -p test_l9_transformer_select_reuse_v2.py -v
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Independently attest both cancelled original GitHub runs, zero artifacts and pinned prefit
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/l9-cancelled-original-v3-custody.json" <<'PY'
          import hashlib,json,os,pathlib,sys,urllib.request
          sys.path.insert(0,str(pathlib.Path('research/optimizer_language_l9').resolve()))
          import l9_transformer_select_cancel_v3 as v3
          base='https://api.github.com/repos/spoonman136668-ai/FORGE/actions'
          def fetch(url):
              req=urllib.request.Request(url,headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'L9-CANCELLED-V3-CUSTODY-NO-SCIENCE'})
              return json.load(urllib.request.urlopen(req,timeout=60))
          prefit=fetch(base+'/runs/'+str(v3.REQUIRED_PREFIT_RUN))
          rows=[]
          for seed in sorted(v3.ORIGINAL_JOBS):
              ref=v3.ORIGINAL_JOBS[seed]
              job=fetch(base+'/jobs/'+str(ref['job_id']))
              run=fetch(base+'/runs/'+str(ref['run_id']))
              artifacts=fetch(base+'/runs/'+str(ref['run_id'])+'/artifacts?per_page=100')
              assert v3.assert_admission(seed,job,run,prefit,artifacts)
              rows.append({
                  'seed':seed,'original_job_id':ref['job_id'],
                  'original_run_id':ref['run_id'],
                  'original_run_head_sha':ref['head_sha'],
                  'original_job_conclusion':job['conclusion'],
                  'original_run_conclusion':run['conclusion'],
                  'original_artifact_count':artifacts['total_count'],
                  'cancellation_cause':'UNKNOWN_NOT_INFERRED',
                  'no_v1_receipt_accepted':True,
              })
          output={
              'schema':'forge.optimizer.language.l9.cancelled-original-custody-source-only-v3',
              'frozen_model_suite_git_blob':'710ce648a30ffc55647f689c5f4aa3ac13b07066',
              'frozen_v1_evaluator_git_blob':'91f8108af5e6f3a25e2a8ca07dc3674bd2358f4e',
              'v3_schema':v3.SCHEMA,
              'two_original_runs_cancelled_no_artifacts':True,
              'prefit_source_sha':v3.REQUIRED_PREFIT_HEAD,
              'originals':rows,
              'development_scoring_executed':False,
              'audit_dev_reference_consumed':False,
              'official_test_consumed':False,
              'four_arm_selection_sealed':False,
              'scientific_go':False,
          }
          raw=(json.dumps(output,sort_keys=True,separators=(',',':'))+'\n').encode()
          pathlib.Path(sys.argv[1]).write_bytes(raw)
          print('L9_CANCELLED_ORIGINAL_CUSTODY_BOTH_SEEDS=PASS')
          print('L9_CANCELLED_V3_PREFIT_SHA256='+hashlib.sha256(raw).hexdigest())
          print('L9_CANCELLATION_CAUSE=NOT_ESTABLISHED')
          print('L9_AUDIT_DEV_CONSUMED=FALSE')
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: l9-cancel-v3-custody-${{ matrix.os }}
          path: ${{ runner.temp }}/l9-cancelled-original-v3-custody.json
          if-no-files-found: ignore
