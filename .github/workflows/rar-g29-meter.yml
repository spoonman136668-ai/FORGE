name: RAR G29 source-only Go CPU and RSS verification
on:
  pull_request:
    paths:
      - 'research/replay_acceleration/g29/**'
      - '.github/workflows/rar-g29-meter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metering:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build isolated Go meter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          go build -o "rar-g29-meter$suffix" ./research/replay_acceleration/g29
          if ($LASTEXITCODE -ne 0) { throw 'G29_BUILD_FAILED' }
      - name: Measure idle busy and two-child Go workloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          python research/replay_acceleration/g29/verify.py (Join-Path $PWD "rar-g29-meter$suffix")
          if ($LASTEXITCODE -ne 0) { throw 'G29_METER_NEGATIVE' }
      - uses: actions/upload-artifact@v4
        with:
          name: rar-g29-${{ matrix.os }}
          path: rar_g29_receipt.json
          if-no-files-found: error
