name: ITD-02 MG09B authentic DoorKey raw-public native versus conventional
on:
  push:
    branches:
      - research/itd02-mg09b-equal-information-original-world-20261029
permissions:
  contents: read
jobs:
  authentic-raw-public-paired-original-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Original Git Linux source line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Source-exact candidate from authenticated current commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Pinned original Python environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned native Go 1.25.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Reproduce two complete real-world 4-arm source evaluations
        shell: bash
        run: bash research/lcrm01/mg09b_ci.sh
      - name: Keep real original source per-action records even on source failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-mg09b-real-original-doorkey-equal-raw-public
          path: |
            ${{ runner.temp }}/mg09b/first.json
            ${{ runner.temp }}/mg09b/second.json
            ${{ runner.temp }}/mg09b/comparison.json
            ${{ runner.temp }}/mg09b/first.log
            ${{ runner.temp }}/mg09b/second.log
          retention-days: 30
          if-no-files-found: warn
