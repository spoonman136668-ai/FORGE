name: FORGE K-Terminal native SELL parallel-test matched Windows qualification
on:
  push:
    branches: [qualification/kterminal-native-sell-parallel-20261106]
    paths: [.github/workflows/forge-kterminal-native-sell-parallel-20261106.yml]
permissions:
  contents: read
concurrency:
  group: forge-kterminal-rc2-timing-exact-sha
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      FORGE_BASE: 6988f1ebfe53fe54b13c5decbd58246b74ac2ad7
      KTERM_SHA: e7cf517a8b282ff8da7903b4aca985ad5adb81de
      KTERM_BASE_SHA: 35ac33f85073c7521fb74c050bf92e7e35484ca3
      KTERM_BASE_TREE: 9c63b23fa30f6b927525fd2e32682f330bcd7c5e
      KTERM_TREE: 2dd3dd0a8613859c1526f1de96f6a02cfc9c19f6
      KTERM_BASELINE: fc2c35998f8e917577aa9c80db6b970e82b9bd01
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
    steps:
      - name: Checkout exact FORGE qualification scope
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify isolated hosted Windows runner and workflow-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'spoonman136668-ai/FORGE'
          test "$GITHUB_REF" = 'refs/heads/qualification/kterminal-native-sell-parallel-20261106'
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$FORGE_BASE" HEAD
          test "$(git diff --name-only "$FORGE_BASE" HEAD)" = '.github/workflows/forge-kterminal-native-sell-parallel-20261106.yml'
          test -z "$(git status --porcelain)"
          echo KTERM_RC2_FORGE_SCOPE=PASS
      - name: Checkout private K-Terminal exact source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Kboomllc/K-Terminal
          ref: e7cf517a8b282ff8da7903b4aca985ad5adb81de
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Checkout identical-source original baseline for paired measurement
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: 35ac33f85073c7521fb74c050bf92e7e35484ca3
          path: kterminal-baseline
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Set up pinned original Windows Go 1.26.5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify private source identity, clean checkout and zero broker authority
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          test "$(git rev-parse HEAD)" = "$KTERM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$KTERM_TREE"
          test -z "$(git status --porcelain)"
          test "$(git -C ../kterminal-baseline rev-parse HEAD)" = "$KTERM_BASE_SHA"
          test "$(git -C ../kterminal-baseline rev-parse 'HEAD^{tree}')" = "$KTERM_BASE_TREE"
          test -z "$(git -C ../kterminal-baseline status --porcelain)"
          test ! -e .env
          test ! -e config.json
          test ! -e ../kterminal-baseline/.env
          test ! -e ../kterminal-baseline/config.json
          go version | grep -F 'go1.26.5 windows/amd64' >/dev/null
          for name in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET KTERM_COINBASE_TEST_KEY_NAME KTERM_COINBASE_TEST_KEY_SECRET; do
            if [[ -n "${!name:-}" ]]; then echo KTERM_RC2_BROKER_AUTHORITY_REFUSED; exit 2; fi
          done
          safe="$RUNNER_TEMP/kterm-rc2-safe"
          mkdir -p "$safe"
          echo PASS > "$safe/source.ok"
          echo KTERM_RC2_EXACT_SOURCE=PASS
      - name: Paired baseline and candidate native SELL test with unchanged real confirmation windows
        shell: bash
        run: |
          set -euo pipefail
          safe="$RUNNER_TEMP/kterm-rc2-safe"
          mkdir -p "$safe"
          run_case() {
            label="$1"
            module="$2"
            root="$RUNNER_TEMP/native-sell-pair-$label"
            mkdir -p "$root/tail" "$root/post" "$root/private"
            (
              cd "$GITHUB_WORKSPACE/$module"
              export K_TERMINAL_TEST_WORKSPACE="$root"
              export KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT="$root/tail"
              export KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT="$root/post"
              export KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT="$root/private"
              export GOMAXPROCS=2
              go test -json -p 1 -parallel 2 -count=1 -timeout 18m '-run=^TestStage3AuthenticatedNativeSellPostBoundaries$' ./pkg > "$RUNNER_TEMP/native-sell-$label.private.jsonl" 2> "$RUNNER_TEMP/native-sell-$label.private.stderr"
            )
          }
          set +e
          run_case candidate kterminal-private
          cand_rc=$?
          base_rc=99
          if [ "$cand_rc" -eq 0 ]; then
            run_case baseline kterminal-baseline
            base_rc=$?
          fi
          set -e
          CAND_RC="$cand_rc" BASE_RC="$base_rc" python -B - <<'PY'
          import hashlib,json,os,pathlib,re,sys
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          safe=temp/'kterm-rc2-safe'
          top='TestStage3AuthenticatedNativeSellPostBoundaries'
          needed={top,top+'/BTC-USDC',top+'/XRP-USDC'}
          valid=re.compile(r'^Test[A-Za-z0-9_]+(?:/[A-Za-z0-9_.#-]+)*$')
          def inspect(label):
              path=temp/('native-sell-'+label+'.private.jsonl')
              events=bad=0
              passed={};failed=set()
              if path.exists():
                  for line in path.open(encoding='utf-8-sig',errors='replace'):
                      try: e=json.loads(line)
                      except (ValueError,TypeError):bad+=1;continue
                      if not isinstance(e,dict):bad+=1;continue
                      events+=1
                      name,action,elapsed=e.get('Test'),e.get('Action'),e.get('Elapsed')
                      if isinstance(name,str) and valid.fullmatch(name):
                          if action=='fail': failed.add(name)
                          if action=='pass' and name in needed and isinstance(elapsed,(int,float)) and 0<=elapsed<1800:
                              passed[name]=round(float(elapsed),5)
              rc=int(os.environ['CAND_RC'] if label=='candidate' else os.environ['BASE_RC'])
              good=(rc==0 and events>0 and bad==0 and set(passed)==needed and not failed)
              return {'exit_code':rc,'events':events,'malformed':bad,'seconds':passed,'failed_test_names':sorted(failed),'pass':good}
          base=inspect('baseline');candidate=inspect('candidate')
          ok=base['pass'] and candidate['pass']
          x=base['seconds'].get(top);y=candidate['seconds'].get(top)
          ratio=round(x/y,4) if ok and y and y>0 else None
          data={'schema':'kterminal.native-sell-parallel.same-runner.v1',
                'baseline_sha':os.environ['KTERM_BASE_SHA'],'candidate_sha':os.environ['KTERM_SHA'],
                'forge_sha':os.environ['GITHUB_SHA'],'toolchain':'go1.26.5 windows/amd64',
                'command':'go test -json -p 1 -parallel 2 -count=1 -timeout 18m -run=<native-sell-boundaries> ./pkg',
                'gomaxprocs':2,'matched_single_pair':True,'baseline':base,'candidate':candidate,
                'speedup_ratio':ratio,'disposition':'VALID_PAIRED_MEASUREMENT' if ok else 'INVALID_PAIRED_MEASUREMENT',
                'live_orders':0,'production_changed':False,'raw_logs_exported':False}
          raw=json.dumps(data,sort_keys=True,separators=(',',':')).encode()
          (safe/'comparison.json').write_bytes(raw)
          digest=hashlib.sha256(raw).hexdigest()
          (safe/'comparison.sha256').write_text(digest,encoding='ascii')
          print('KTERM_NATIVE_SELL_PAIR='+data['disposition'])
          print('KTERM_NATIVE_SELL_SPEEDUP_RATIO='+str(ratio))
          print('KTERM_NATIVE_SELL_PAIR_DIGEST='+digest)
          if ok: (safe/'comparison.ok').write_text('PASS',encoding='ascii')
          else: sys.exit(2)
          PY
      - name: Focused RC2 reconciliation and negative-recovery cases
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          pat='^(TestHistoricalPnLDormantAccountWarmRefreshAvoidsOldTransactionPages|TestHistoricalPnLCompleteThenWarmThenDueAuditPaging|TestHistoricalPnLFullAuditClockAndImmutableJournal|TestHistoricalPnLFullAuditClockMetadataFailureAndRecovery|TestHistoricalPnLReconciliationScopesAnchorsToConfiguredPortfolio)$'
          root="$RUNNER_TEMP/kterm-rc2-focused-isolation"
          mkdir -p "$root/tail" "$root/post" "$root/private"
          export K_TERMINAL_TEST_WORKSPACE="$root"
          export KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT="$root/tail"
          export KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT="$root/post"
          export KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT="$root/private"
          go test -p 1 -count=1 -timeout 16m "-run=$pat" ./pkg > "$RUNNER_TEMP/kterm-rc2-focused-private.log" 2>&1
          echo PASS > "$RUNNER_TEMP/kterm-rc2-safe/focused.ok"
          echo KTERM_RC2_FOCUSED=PASS
      - name: One mandatory full original Windows Go regression with sanitized timing custody
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kterm-rc2-full-isolation"
          mkdir -p "$root/tail" "$root/post" "$root/private"
          export K_TERMINAL_TEST_WORKSPACE="$root"
          export KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT="$root/tail"
          export KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT="$root/post"
          export KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT="$root/private"
          started=$(date +%s)
          set +e
          go test -json -p 1 -count=1 -timeout 60m ./... > "$RUNNER_TEMP/kterm-rc2-full-private.jsonl" 2> "$RUNNER_TEMP/kterm-rc2-full-private.stderr"
          rc=$?
          set -e
          elapsed=$(( $(date +%s) - started ))
          KTERM_FULL_RC="$rc" KTERM_WALL_SECONDS="$elapsed" python -B - <<'PY'
          import hashlib, json, os, pathlib, re, sys
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          safe = temp / 'kterm-rc2-safe'
          safe.mkdir(exist_ok=True)
          raw = temp / 'kterm-rc2-full-private.jsonl'
          test_pat = re.compile(r'^Test[A-Za-z0-9_]+(?:/[A-Za-z0-9_.#-]+)*$')
          package_pat = re.compile(r'^k-terminal/[A-Za-z0-9_./-]+$')
          tests, packages, failed_tests, failed_packages = [], [], set(), set()
          failure_classes = set()
          target = 'TestPrototypeConsumedInitialNativeProtectedAuthorityNegatives/BTC-USDC/foreign_signal_session'
          classes = {
              'expired_quote_snapshot': 'stale or future quote snapshot',
              'expired_account_snapshot': 'stale or future account snapshot',
              'expired_product_snapshot': 'stale or future product snapshot',
              'snapshot_premise': 'foreign authority control failed an unrelated snapshot premise',
              'authority_premise': 'original current authority premise is invalid',
              'incorrect_foreign_rejection': 'actual protected native authority did not specifically reject foreign evidence',
              'changed_financial_or_journal_bytes': 'foreign authority rejection changed exact financial/journal/claim bytes',
          }
          event_count = malformed_count = 0
          if raw.is_file():
              with raw.open('r', encoding='utf-8-sig', errors='replace') as src:
                  for line in src:
                      try: e = json.loads(line)
                      except (ValueError, TypeError):
                          malformed_count += 1
                          continue
                      if not isinstance(e, dict):
                          malformed_count += 1
                          continue
                      event_count += 1
                      action, test, package, elapsed = (e.get(x) for x in ('Action','Test','Package','Elapsed'))
                      if action == 'output' and test == target:
                          output = e.get('Output')
                          if isinstance(output,str):
                              for category, phrase in classes.items():
                                  if phrase in output: failure_classes.add(category)
                      if action == 'fail':
                          if isinstance(test,str) and test_pat.fullmatch(test): failed_tests.add(test)
                          elif test is None and isinstance(package,str) and package_pat.fullmatch(package): failed_packages.add(package)
                      if action != 'pass' or not isinstance(elapsed,(float,int)) or not 0 <= elapsed < 100000:
                          continue
                      if isinstance(test,str) and test_pat.fullmatch(test):
                          tests.append({'name':test,'seconds':round(float(elapsed),5)})
                      elif test is None and isinstance(package,str) and package_pat.fullmatch(package):
                          packages.append({'name':package,'seconds':round(float(elapsed),5)})
          payload = {
              'schema':'kterminal-regression-durations.forge.v1',
              'kterminal_source_sha':os.environ['KTERM_SHA'],
              'kterminal_source_tree':os.environ['KTERM_TREE'],
              'forge_qualification_sha':os.environ['GITHUB_SHA'],
              'baseline_sha':os.environ['KTERM_BASELINE'],
              'toolchain':'go1.26.5 windows/amd64',
              'command':'go test -json -p 1 -count=1 -timeout 60m ./...',
              'full_test_exit':int(os.environ['KTERM_FULL_RC']),
              'wall_seconds':int(os.environ['KTERM_WALL_SECONDS']),
              'event_count':event_count,
              'malformed_count':malformed_count,
              'top_tests':sorted(tests,key=lambda z:z['seconds'],reverse=True)[:12],
              'top_packages':sorted(packages,key=lambda z:z['seconds'],reverse=True)[:12],
              'failed_tests':sorted(failed_tests),
              'failure_classes':sorted(failure_classes),
              'failed_packages':sorted(failed_packages),
              'private_logs_exported':False,
              'broker_orders':0,
              'field_performance_verified':False,
          }
          contents = json.dumps(payload,sort_keys=True,separators=(',',':')).encode()
          (safe/'durations.json').write_bytes(contents)
          (safe/'durations.sha256').write_text(hashlib.sha256(contents).hexdigest(),encoding='ascii')
          qualified = (payload['full_test_exit']==0 and event_count>0 and malformed_count==0 and
                       len(tests)>0 and len(packages)>0 and not failed_tests and not failed_packages)
          if qualified:
              (safe/'full.ok').write_text('PASS',encoding='ascii')
          print('KTERM_RC2_FULL_DISPOSITION='+('PASS' if qualified else 'FAIL'))
          print('KTERM_RC2_FULL_EVENT_COUNT='+str(event_count))
          print('KTERM_RC2_FAILURE_CLASSES='+','.join(sorted(failure_classes)))
          print('KTERM_RC2_TIMING_DIGEST='+hashlib.sha256(contents).hexdigest())
          if not qualified: sys.exit(2)
          PY
      - name: Vet complete original Windows source
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          go vet ./... > "$RUNNER_TEMP/kterm-rc2-vet-private.log" 2>&1
          echo PASS > "$RUNNER_TEMP/kterm-rc2-safe/vet.ok"
          echo KTERM_RC2_VET=PASS
      - name: Build unpromoted original Windows K-Terminal engine
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/kterm-rc2-unpromoted-engine.exe" . > "$RUNNER_TEMP/kterm-rc2-build-private.log" 2>&1
          test -f "$RUNNER_TEMP/kterm-rc2-unpromoted-engine.exe"
          echo PASS > "$RUNNER_TEMP/kterm-rc2-safe/build.ok"
          echo KTERM_RC2_BUILD=PASS
      - name: Seal privacy-safe exact-SHA qualification receipt, even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib,json,os,pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          safe = temp/'kterm-rc2-safe'
          safe.mkdir(exist_ok=True)
          flags={n:((safe/(n+'.ok')).read_text(encoding='ascii').strip() if (safe/(n+'.ok')).is_file() else 'NOT_RUN') for n in ('source','comparison','focused','full','vet','build')}
          dur=safe/'durations.json'
          digest=safe/'durations.sha256'
          actual=hashlib.sha256(dur.read_bytes()).hexdigest() if dur.is_file() else None
          declared=digest.read_text(encoding='ascii').strip() if digest.is_file() else None
          duration_status='MATCH' if actual and actual==declared else ('MISSING' if not actual or not declared else 'MISMATCH')
          comparison=safe/'comparison.json'
          comparison_digest=safe/'comparison.sha256'
          comparison_status='MATCH' if comparison.is_file() and comparison_digest.is_file() and hashlib.sha256(comparison.read_bytes()).hexdigest()==comparison_digest.read_text(encoding='ascii').strip() else 'MISSING_OR_MISMATCH'
          passed=all(v=='PASS' for v in flags.values()) and duration_status=='MATCH' and comparison_status=='MATCH'
          receipt={
              'schema':'forge.kterminal.native-sell-parallel.original-windows.v1',
              'forge_qualification_sha':os.environ['GITHUB_SHA'],
              'kterminal_source_sha':os.environ['KTERM_SHA'],
              'kterminal_source_tree':os.environ['KTERM_TREE'],
              'baseline_sha':os.environ['KTERM_BASELINE'],
              'disposition':'FULL_VET_BUILD_AND_DURATION_PASS_UNPROMOTED' if passed else 'QUALIFICATION_BLOCKED',
              'checks':flags,
              'duration_evidence_status':duration_status,
              'duration_sha256':actual if duration_status=='MATCH' else None,
              'comparison_evidence_status':comparison_status,
              'comparison_sha256':hashlib.sha256(comparison.read_bytes()).hexdigest() if comparison_status=='MATCH' else None,
              'desktop_accepted':False,
              'field_performance_verified':False,
              'installed':False,
              'merged_or_promoted':False,
              'broker_orders':0,
              'production_data_changed':False,
          }
          body=json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()
          (safe/'receipt.json').write_bytes(body)
          (safe/'receipt.sha256').write_text(hashlib.sha256(body).hexdigest(),encoding='ascii')
          print('KTERM_RC2_QUALIFICATION='+receipt['disposition'])
          print('KTERM_RC2_RECEIPT_DIGEST='+hashlib.sha256(body).hexdigest())
          PY
      - name: Upload only sanitized timings and receipt, never private logs or binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kterminal-native-sell-parallel-safe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kterm-rc2-safe/receipt.json
            ${{ runner.temp }}/kterm-rc2-safe/receipt.sha256
            ${{ runner.temp }}/kterm-rc2-safe/durations.json
            ${{ runner.temp }}/kterm-rc2-safe/durations.sha256
            ${{ runner.temp }}/kterm-rc2-safe/comparison.json
            ${{ runner.temp }}/kterm-rc2-safe/comparison.sha256
          retention-days: 30
          if-no-files-found: error