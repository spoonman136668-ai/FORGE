name: AC27 independent MG12 original-goal and native/control trajectory audit
on:
  pull_request:
    paths:
      - 'research/ac07_sourcefree/ac27_*'
      - 'research/ac07_sourcefree/test_ac27_*'
      - 'docs/research/AC-27-*'
      - '.github/workflows/forge-ac27-mg12-source-attribution.yml'
permissions:
  contents: read
  actions: read
jobs:
  independent-original-source-attribution:
    name: AC27 exact two-process native/control attribution / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout isolated retrospective audit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python standard library, no new environment imports
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch only frozen original two-process MG12 evidence
        uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 40842082092
          github-token: ${{ github.token }}
          name: itd02-mg12-original-doorkey-native-successor-four-arm-evidence
          path: mg12-source
      - name: Focused negative provenance and public only attribution tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/ac07_sourcefree -p 'test_ac27_*.py' -v
      - name: Independently verify every original source-selected action, reward and native/conventional trace
        shell: bash
        run: |
          set -euo pipefail
          python -B research/ac07_sourcefree/ac27_mg12_goal_attribution.py --first "$GITHUB_WORKSPACE/mg12-source/first.json" --second "$GITHUB_WORKSPACE/mg12-source/second.json" --comparison "$GITHUB_WORKSPACE/mg12-source/comparison.json" --out "$RUNNER_TEMP/ac27-original-goal-attribution.json"
          python - "$RUNNER_TEMP/ac27-original-goal-attribution.json" <<'PY'
          import json,hashlib,pathlib,sys
          p=pathlib.Path(sys.argv[1]);r=json.loads(p.read_text(encoding="utf-8"))
          assert r["schema"]=="forge.ac27.mg12-original-source-retrospective-attribution.v1"
          assert r["mg12_exact_qualified_head"]=="7293165c299f4ff9d5b945e0bb601d5b929219e1"
          assert r["original_two_independent_processes_source_sha256"]=="4c5b48288f1d8c61561527da5b4f0767c220d06d3f1fbeaf07f27b3d8ca6675c"
          assert r["original_source_episode_count"]==12
          assert r["original_source_selected_actions_replayed"]==2229
          assert r["original_source_new_actions_executed"]==0
          assert r["original_two_process_selected_evidence_identical"] is True
          assert len(r["selected_action_trajectories"])==12
          assert len(r["exact_source_action_and_transition_comparisons"])==9
          assert [r["role_summary"][k]["original_goal_completed_episodes"] for k in (
             "wingless_dk13","yggdrasil_r17","conventional_public_successor","random")]==[1,1,1,0]
          assert r["all_ygg_original_actions_and_transitions_identical_to_conventional"] is True
          assert r["wingless_finished_15_steps_ahead_of_ygg_and_conventional_on_one_goal_seed"] is True
          assert r["retrospective_not_preregistered_before_source_execution"] is True
          for k in ("native_architecture_superiority_established","unknown_family_transfer_tested",
               "private_agent_pose_or_source_oracle_used","original_models_controller_or_queue_modified",
               "scientific_first_use","scientific_admission"):
              assert r[k] is False,k
          print("AC27_ORIGINAL_MG12_TWO_PROCESS_REAL_GOALS=PASS")
          print("AC27_YGG_VS_CONVENTIONAL_ACTION_PARITY=EXACT")
          print("AC27_NATIVE_SUPERIORITY=NOT_ESTABLISHED")
          print("AC27_REPORT_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Archive bounded exact-original source attribution, no new actions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ac27-original-mg12-native-attribution-${{ matrix.os }}
          path: ${{ runner.temp }}/ac27-original-goal-attribution.json
          retention-days: 30
          if-no-files-found: error
