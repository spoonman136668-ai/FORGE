name: FORGE F139 original-owner fresh existing-task rebind (disabled only)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  actions: read
jobs:
  rebind-disabled-original-task:
    if: >-
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.actor == 'spoonman136668-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event.action == 'created' &&
      github.event.issue.number == 1830 &&
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == 'spoonman136668-ai' &&
      github.event.comment.user.login == 'spoonman136668-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-FRESH-DEV-TASK-REBIND ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    concurrency:
      group: forge-f139-fresh-existing-disabled-task-rebind
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Checkout exact protected main with history and no retained credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Independently rebind existing disabled original task once
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
             $env:GITHUB_REF -cne 'refs/heads/main' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:OPENAI_API_KEY) {
            throw 'F139_FRESH_REBIND_OWNER_CONTEXT_DENIED'
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File f139/nci04_fresh_owner_rebind.ps1 -Target $env:GITHUB_SHA
          if($LASTEXITCODE -ne 0) {
            throw 'F139_FRESH_OWNER_TASK_REBIND_FAILED_CUSTODY_HOLD'
          }
          Write-Output 'F139_FRESH_EXISTING_OWNER_TASK_REBOUND_DISABLED=PASS'
          Write-Output 'F139_WORKER_DISPATCH_AUTHORIZED=FALSE'
          Write-Output 'F139_SCIENTIFIC_FIRST_USE=FALSE'
  release-existing-fresh-task:
    if: >-
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.actor == 'spoonman136668-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event.action == 'created' &&
      github.event.issue.number == 1830 &&
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == 'spoonman136668-ai' &&
      github.event.comment.user.login == 'spoonman136668-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-FRESH-DEV-WORKER-RELEASE ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    concurrency:
      group: forge-f139-fresh-existing-disabled-task-rebind
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Checkout exact protected main and no retained credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Independently qualify and release the existing original owner task once
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
             $env:GITHUB_REF -cne 'refs/heads/main' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:OPENAI_API_KEY -or $env:CLOUDFLARE_API_TOKEN) {
            throw 'F139_FRESH_RELEASE_OWNER_CONTEXT_DENIED'
          }
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          $sid=''
          try{$sid=(New-Object Security.Principal.NTAccount([string]$task.Principal.UserId)).Translate([Security.Principal.SecurityIdentifier]).Value}catch{}
          if($task.State -ne 'Disabled' -or $task.Settings.Enabled -ne $false -or
             @($task.Actions).Count -ne 1 -or
             ([string]$task.Principal.UserId -ine $who.Name -and $sid -cne $who.User.Value)){
            throw 'F139_FRESH_RELEASE_EXISTING_OWNER_DENIED'
          }
          $a=[string]$task.Actions[0].Arguments
          $key=[regex]::Match($a,'(?i)(?:^|\s)-EncryptedKeyFile\s+"([^"]+)"')
          $py=[regex]::Match($a,'(?i)(?:^|\s)-PythonExe\s+"([^"]+)"')
          if(-not $key.Success -or -not $py.Success -or
             -not(Test-Path -LiteralPath $key.Groups[1].Value -PathType Leaf) -or
             -not(Test-Path -LiteralPath $py.Groups[1].Value -PathType Leaf)){
            throw 'F139_FRESH_RELEASE_EXISTING_DPAPI_ROUTE_DENIED'
          }
          $secure=Import-Clixml -LiteralPath $key.Groups[1].Value
          if(-not($secure -is [Security.SecureString])){throw 'F139_FRESH_RELEASE_DPAPI_TYPE'}
          $ptr=[Runtime.InteropServices.Marshal]::SecureStringToBSTR($secure)
          try{$env:F139_WORKER_HMAC_KEY=[Runtime.InteropServices.Marshal]::PtrToStringBSTR($ptr)}
          finally{[Runtime.InteropServices.Marshal]::ZeroFreeBSTR($ptr)}
          try {
            & $py.Groups[1].Value -B -m f139.nci04_fresh_owner_worker_release
            if($LASTEXITCODE -ne 0){throw 'F139_FRESH_RELEASE_BLOCKED_NO_REPLAY'}
          } finally {
            Remove-Item Env:F139_WORKER_HMAC_KEY -ErrorAction SilentlyContinue
          }

  # Separate owner-authenticated diagnostic for a failed, potentially partial
  # release. Never re-enters the release code, changes tasks, writes SQLite,
  # reveals task paths/DPAPI keys, dispatches workers or grants authority.
  fresh-release-readonly-audit:
    if: ${{ github.repository == 'spoonman136668-ai/FORGE' && github.actor == 'spoonman136668-ai' && github.ref == 'refs/heads/main' && github.event.action == 'created' && github.event.issue.number == 1830 && github.event.issue.state == 'open' && github.event.comment.user.login == 'spoonman136668-ai' && github.event.comment.author_association == 'OWNER' && !github.event.issue.pull_request && startsWith(github.event.comment.body, 'F139-FRESH-DEV-RELEASE-CUSTODY-READONLY ') }}
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    concurrency:
      group: forge-f139-fresh-existing-disabled-task-rebind
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - name: Checkout exact protected main without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read existing task, installed source and both ledger heads only
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          function Need([bool]$ok,[string]$code){
            if(-not $ok){throw ('F139_FRESH_RELEASE_READONLY_'+$code)}
          }
          Need ($env:GITHUB_REPOSITORY -ceq 'spoonman136668-ai/FORGE' -and
            $env:GITHUB_ACTOR -ceq 'spoonman136668-ai' -and
            $env:GITHUB_EVENT_NAME -ceq 'issue_comment' -and
            $env:GITHUB_REF -ceq 'refs/heads/main' -and
            $env:RUNNER_NAME -ceq 'FORGE-CODEX-REMOTE' -and
            $env:GITHUB_RUN_ATTEMPT -ceq '1' -and
            $env:GITHUB_SHA -cmatch '^[a-f0-9]{40}$' -and
            -not $env:OPENAI_API_KEY -and -not $env:CLOUDFLARE_API_TOKEN) 'OWNER_CONTEXT'
          $ev=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
          $request='F139-FRESH-DEV-RELEASE-CUSTODY-READONLY '+$env:GITHUB_SHA+' 44889700647'
          Need ($ev.action -ceq 'created' -and
            $ev.repository.full_name -ceq 'spoonman136668-ai/FORGE' -and
            $ev.issue.number -eq 1830 -and $ev.issue.state -ceq 'open' -and
            $ev.issue.user.login -ceq 'spoonman136668-ai' -and
            $null -eq $ev.issue.PSObject.Properties['pull_request'] -and
            $ev.sender.login -ceq 'spoonman136668-ai' -and
            $ev.comment.user.login -ceq 'spoonman136668-ai' -and
            $ev.comment.author_association -ceq 'OWNER' -and
            $ev.comment.body -ceq $request -and
            [int64]$ev.comment.id -gt 7060587332) 'SIGNED_SOURCE_EVENT'
          $head=(& git rev-parse HEAD|Out-String).Trim()
          $tree=(& git rev-parse 'HEAD^{tree}'|Out-String).Trim()
          Need ($LASTEXITCODE -eq 0 -and $head -ceq $env:GITHUB_SHA -and
            $tree -cmatch '^[a-f0-9]{40}$' -and
            @(& git status --porcelain --untracked-files=all).Count -eq 0) 'CHECKOUT'
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          Need (@($task.Actions).Count -eq 1 -and @($task.Triggers).Count -eq 3) 'ORIGINAL_TOPOLOGY'
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          $sid=''
          try{
            $sid=(New-Object Security.Principal.NTAccount([string]$task.Principal.UserId)).Translate([Security.Principal.SecurityIdentifier]).Value
          }catch{}
          Need (([string]$task.Principal.UserId -ieq $who.Name -or
            $sid -ceq $who.User.Value)) 'ORIGINAL_SID'
          function Arg([string]$name){
            $m=[regex]::Match([string]$task.Actions[0].Arguments,'(?i)(?:^|\s)-'+$name+'\s+"([^"]+)"')
            Need $m.Success ('ORIGINAL_ACTION_MISSING_'+$name)
            return [string]$m.Groups[1].Value
          }
          $repoRoot=Arg 'RepositoryRoot'
          $dbPath=Arg 'Database'
          $py=Arg 'PythonExe'
          $wrapper=Arg 'File'
          $key=Arg 'EncryptedKeyFile'
          $base=Join-Path $env:LOCALAPPDATA 'FORGE-F139'
          $old=Join-Path $base 'release-candidates\408139c0a10fd4836a22422c8df041aa64dfa001'
          $new=Join-Path $base ('release-candidates\'+ 'dce4c672078d6b293286e13f051fdc9a0e54f1da')
          $fresh=Join-Path $base 'f139-fresh-dev-44831323193\state.sqlite'
          $historic=Join-Path $base 'state.sqlite'
          Need (([IO.Path]::GetFullPath($dbPath) -ieq [IO.Path]::GetFullPath($fresh)) -and
            (Test-Path -LiteralPath $py -PathType Leaf) -and
            (Test-Path -LiteralPath $key -PathType Leaf) -and
            (Test-Path -LiteralPath $fresh -PathType Leaf) -and
            (Test-Path -LiteralPath $historic -PathType Leaf) -and
            ([IO.Path]::GetFileName($wrapper) -ceq 'Run-FORGE-F139.ps1')) 'ORIGINAL_FILES'
          $installed='UNKNOWN'
          if([IO.Path]::GetFullPath($repoRoot) -ieq [IO.Path]::GetFullPath($old)){$installed='ADMISSION_SOURCE'}
          if([IO.Path]::GetFullPath($repoRoot) -ieq [IO.Path]::GetFullPath($new)){$installed='QUALIFIED_RELEASE'}
          $installedSha=''
          if(Test-Path -LiteralPath $repoRoot -PathType Container){
            $installedSha=(& git -C $repoRoot rev-parse HEAD 2>$null|Out-String).Trim()
          }
          $releasePresent=Test-Path -LiteralPath $new -PathType Container
          $controllerCount=@(Get-CimInstance Win32_Process -Filter "Name='python.exe' OR Name='pythonw.exe'" |
            Where-Object { $_.CommandLine -and $_.CommandLine.Contains('f139.local_controller') }).Count
          $inspect=@'
          import json,sqlite3,sys
          from pathlib import Path
          def fetch(path):
              p=Path(path).resolve()
              con=sqlite3.connect(p.as_uri()+"?mode=ro",uri=True,isolation_level=None,timeout=10)
              con.row_factory=sqlite3.Row
              try:
                  con.execute("PRAGMA query_only=ON")
                  assert con.execute("PRAGMA query_only").fetchone()[0]==1
                  assert con.execute("PRAGMA quick_check").fetchone()[0]=="ok"
                  m=dict(con.execute("SELECT source_sha,head_seq,head_hash FROM meta WHERE id=1").fetchone())
                  stages={str(x["stage"]):int(x["n"]) for x in con.execute("SELECT stage,count(*) AS n FROM tasks GROUP BY stage")}
                  counts={k:int(con.execute("SELECT count(*) FROM events WHERE kind=?",(k,)).fetchone()[0]) for k in ("FRESH_WORKER_RELEASE_AUTHENTICATED","BEFORE_DISPATCH_INTENT","PROVIDER_VERIFIED_TERMINAL","FRESH_WORKER_PROVIDER_NEGATIVE")}
                  return {"head_seq":m["head_seq"],"head_hash":m["head_hash"],"source_sha":m["source_sha"],"stages":stages,"event_counts":counts}
              finally:
                  con.close()
          print("F139_CUSTODY_SQL="+json.dumps({"historical":fetch(sys.argv[1]),"fresh":fetch(sys.argv[2])},sort_keys=True,separators=(",",":")))
          '@
          $raw=@($inspect|& $py -B - $historic $fresh)
          Need ($LASTEXITCODE -eq 0 -and $raw.Count -eq 1 -and
            [string]$raw[0] -clike 'F139_CUSTODY_SQL=*') 'READONLY_SQL'
          $sqlRecord=([string]$raw[0]).Substring('F139_CUSTODY_SQL='.Length)|ConvertFrom-Json
          # Read-only classification of the interrupted source-forward PREPARE.
          # Never open the DPAPI signing key or print certificate contents.
          $forwardTarget='a3ea44c8db090b6a5cbaa47eb9520956bff13b7e'
          $forwardTree='f30cff4ed9f0f26aeaaf79aa9a5f658d97fe1c2a'
          $forwardStage=Join-Path $base ('release-candidates\'+$forwardTarget)
          $forwardCert=Join-Path (Split-Path -Parent $fresh) 'fresh-original-owner-source-forward.json'
          $forwardTaskBinding='OTHER_SOURCE'
          if([IO.Path]::GetFullPath($repoRoot) -ieq [IO.Path]::GetFullPath($forwardStage)){
            $forwardTaskBinding='TARGET_STAGE'
          }
          $forwardStageClass='ABSENT'
          if(Test-Path -LiteralPath $forwardStage){
            $forwardStageClass='INVALID_OR_UNVERIFIED'
            $item=Get-Item -LiteralPath $forwardStage -Force -ErrorAction Stop
            if($item.PSIsContainer -and
                ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0){
              $stageSha=(& git -c core.fsmonitor=false --no-optional-locks -C $forwardStage rev-parse HEAD 2>$null|Out-String).Trim()
              $stageTree=(& git -c core.fsmonitor=false --no-optional-locks -C $forwardStage rev-parse 'HEAD^{tree}' 2>$null|Out-String).Trim()
              $stageDirty=@(& git -c core.fsmonitor=false --no-optional-locks -C $forwardStage status --porcelain --untracked-files=all 2>$null)
              $stageRemote=@(& git -c core.fsmonitor=false --no-optional-locks -C $forwardStage remote 2>$null)
              if($LASTEXITCODE -eq 0 -and $stageSha -ceq $forwardTarget -and
                  $stageTree -ceq $forwardTree -and $stageDirty.Count -eq 0 -and
                  $stageRemote.Count -eq 0){
                $forwardStageClass='PINNED_CLEAN_NO_REMOTE'
              }
            }
          }
          $forwardCertClass='ABSENT'
          if(Test-Path -LiteralPath $forwardCert){
            $forwardCertClass='PRESENT_UNVERIFIED'
            $certItem=Get-Item -LiteralPath $forwardCert -Force -ErrorAction Stop
            if(-not $certItem.PSIsContainer -and
                ($certItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0 -and
                $certItem.Length -gt 0 -and $certItem.Length -le 8192){
              $forwardCertClass='PRESENT_BOUNDED_UNVERIFIED'
            }
          }
          $result=@{
            schema='forge.f139.fresh-original-owner-cold-readonly.v1'
            trigger_sha=$env:GITHUB_SHA
            observed_task_state=[string]$task.State
            task_enabled=[bool]$task.Settings.Enabled
            installed_source_class=$installed
            installed_source_sha=$installedSha
            release_install_directory_exists=[bool]$releasePresent
            controller_process_count=[int]$controllerCount
            source_forward_task_binding=$forwardTaskBinding
            source_forward_stage_class=$forwardStageClass
            source_forward_certificate_class=$forwardCertClass
            sqlite=$sqlRecord
            task_mutations=0
            sqlite_mutations=0
            worker_dispatches=0
            scientific_first_use=$false
          }
          Write-Host ('F139_FRESH_CUSTODY_READONLY_V1='+($result|ConvertTo-Json -Depth 12 -Compress))
          Write-Host 'F139_FRESH_CUSTODY_READONLY_MUTATIONS=0'
