name: UQ51F historical synthetic preservation and full regression
on:
  push:
    branches: [diagnostics/mind-palace-private-bridge-20261013]
    paths:
      - '.github/workflows/mind-palace-uq51-frozen-regression-qualify.yml'
permissions:
  contents: read
concurrency:
  group: mind-palace-uq51-frozen-synthetic-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 40
    steps:
      - name: Checkout exact diagnostics event
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pinned private-source qualification, one complete Windows regression, zero writes
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: 'Never'
          GH_PROMPT_DISABLED: '1'
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/diagnostics/mind-palace-private-bridge-20261013' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){
             throw 'UQ51F_RUNNER_OR_EVENT_IDENTITY_MISMATCH'
          }
          Remove-Item Env:GH_TOKEN,Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $native=Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\Modules'
          if(Test-Path -LiteralPath $native -PathType Container){$env:PSModulePath=$native+[IO.Path]::PathSeparator+$env:PSModulePath}
          $remote='https://github.com/spoonman136668-ai/Mind-Palace.git'
          $pinnedHead='1642168c137da7aadf453462419f8db61ad304ad'
          $pinnedMain='5e7414966bdcb6e75776ea3422b98422b20c9025'
          $branch='engineering/uq51-frozen-regression-preservation-20261021'
          $scratch=Join-Path $env:RUNNER_TEMP ('uq51f-private-'+$env:GITHUB_RUN_ID)
          $root=Join-Path $scratch 'repo'
          $logs=Join-Path $scratch 'logs'
          $guard=@('.ice/records.json','.ice/source-ledger.json','archive/index.json',
            '.ice/remote-bootstrap.json','.ice/remote-catalog.json','.ice/remote-index.ndjson',
            '.ice/chat-delta-state.json','.ice/project-state-capsules.json','.ice/project-dependency-graph.json')
          function Require([bool]$OK,[string]$Message) {
            if(-not $OK){throw ('UQ51F_'+$Message)}
          }
          function Pin([string]$ref,[string]$expected){
            $rows=@(& git.exe ls-remote --exit-code $remote $ref)
            Require ($LASTEXITCODE -eq 0 -and $rows.Count -eq 1 -and
              (([string]$rows[0] -split '\s+')[0]) -ceq $expected) ('REF_DRIFT_'+$ref)
          }
          function RunPrivate([string]$Name,[string]$Relative){
            $out=Join-Path $logs ($Name+'.out')
            $err=Join-Path $logs ($Name+'.err')
            $scriptPath=Join-Path $root $Relative
            Require (Test-Path -LiteralPath $scriptPath -PathType Leaf) ('TEST_MISSING_'+$Name)
            $p=Start-Process -FilePath 'powershell.exe' -ArgumentList @(
              '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$scriptPath
            ) -WorkingDirectory $root -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            if($p.ExitCode -ne 0){
              # Deliberately expose only bounded diagnostic tokens on the PUBLIC FORGE runner.
              # Raw stderr/stdout stay under private scratch and are destroyed in finally.
              $failureText=[IO.File]::ReadAllText($err)
              $codeMatches=@([regex]::Matches($failureText,'UQ[0-9]+[A-Z]?_[A-Z0-9_]+') |
                ForEach-Object { $_.Value } | Select-Object -Unique)
              $classMatches=@([regex]::Matches($failureText,
                'ParserError|ParameterBindingException|PropertyNotFoundException|CommandNotFoundException|RuntimeException|MethodException|InvalidOperation|ParseException') |
                ForEach-Object { $_.Value } | Select-Object -Unique)
              $reported=if($codeMatches.Count -gt 0){$codeMatches[0]}else{'UNCLASSIFIED'}
              $failureClass=if($classMatches.Count -gt 0){$classMatches[0]}else{'UNCLASSIFIED'}
              Write-Host ('UQ51F_PRIVATE_FAILURE_STAGE='+$Name)
              Write-Host ('UQ51F_PRIVATE_FAILURE_CODE='+$reported)
              Write-Host ('UQ51F_PRIVATE_FAILURE_CLASS='+$failureClass)
              # One bounded, redacted terminal diagnostic. Never publish raw private logs.
              if($Name -ceq 'focused-uq51-fixture' -and $reported -ceq 'UNCLASSIFIED'){
                $lines=@($failureText -split '\r?\n' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
                $last=if($lines.Count -gt 0){[string]$lines[-1]}else{'EMPTY_STDERR'}
                $last=[regex]::Replace($last,'(?i)[A-Z]:\\[^\s:\)\]]+','<PRIVATE_PATH>')
                $last=[regex]::Replace($last,'[a-fA-F0-9]{32,}','<DIGEST>')
                $last=[regex]::Replace($last,'[\x00-\x1f\x7f]',' ')
                if($last.Length -gt 180){$last=$last.Substring(0,180)}
                Write-Host ('UQ51F_REDACTED_FIXTURE_ERROR='+$last)
                $first=if($lines.Count -gt 0){[string]$lines[0]}else{'EMPTY_STDERR'}
                $first=[regex]::Replace($first,'(?i)[A-Z]:\\[^\s:\)\]]+','<PRIVATE_PATH>')
                $first=[regex]::Replace($first,'[a-fA-F0-9]{32,}','<DIGEST>')
                $first=[regex]::Replace($first,'[\x00-\x1f\x7f]',' ')
                if($first.Length -gt 180){$first=$first.Substring(0,180)}
                Write-Host ('UQ51F_REDACTED_FIXTURE_FIRST_ERROR='+$first)
              }
              if($Name -ceq 'full-regression'){
                $testMatches=@([regex]::Matches([IO.File]::ReadAllText($out),'RUN Test-[A-Za-z0-9_-]+\.ps1') |
                  ForEach-Object { $_.Value } )
                $lastTest=if($testMatches.Count -gt 0){$testMatches[-1]}else{'NONE'}
                Write-Host ('UQ51F_FULL_LAST_TEST='+$lastTest)
              }
              throw ('UQ51F_TEST_FAILED_'+$Name+'_EXIT_'+$p.ExitCode)
            }
            if($Name -ceq 'native'){
              $body=[IO.File]::ReadAllText($out)
              foreach($marker in @('UQ51F_NATIVE_EXACT_SUPERSEDE=PASS',
                'UQ51F_WRONG_HEAD_FAIL_CLOSED=PASS','UQ51F_PROTECTED_HASH_PARITY=PASS',
                'UQ51F_NATIVE_SOURCE_QUALIFICATION=PASS')){
                Require ($body.Contains($marker)) ('MISSING_MARKER_'+$marker)
              }
            }
            Write-Host ('UQ51F_'+$Name.ToUpperInvariant()+'=PASS')
          }
          if(Test-Path -LiteralPath $scratch){throw 'UQ51F_STALE_PRIVATE_SCRATCH'}
          New-Item -ItemType Directory -Path $logs -Force|Out-Null
          try {
            Pin 'refs/heads/main' $pinnedMain
            Pin ('refs/heads/'+$branch) $pinnedHead
            & git.exe clone --quiet --single-branch --branch $branch $remote $root
            Require ($LASTEXITCODE -eq 0) 'PRIVATE_CLONE_FAILED'
            $head=(& git.exe -C $root rev-parse HEAD|Out-String).Trim()
            Require ($head -ceq $pinnedHead) 'SOURCE_HEAD_DRIFT'
            $before=@{}
            foreach($item in $guard){
              $before[$item]=(Get-FileHash -LiteralPath (Join-Path $root $item) -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            RunPrivate 'focused-uq51-fixture' 'tests/Test-RepoSourceTransaction.ps1'
            RunPrivate 'focused-uq53-crash' 'tests/Test-RepoSourceCrashRecovery.ps1'
            RunPrivate 'focused-uq55-fencing' 'tests/Test-RepoSourceWriterFencing.ps1'
            RunPrivate 'full-regression' 'tests/Test-All.ps1'
            foreach($item in $guard){
              $after=(Get-FileHash -LiteralPath (Join-Path $root $item) -Algorithm SHA256).Hash.ToLowerInvariant()
              Require ($after -ceq $before[$item]) ('DURABLE_HASH_DRIFT_'+$item)
            }
            $dirty=(& git.exe -C $root status --porcelain=v1 --untracked-files=no|Out-String).Trim()
            Require ($LASTEXITCODE -eq 0 -and -not $dirty) 'CHECKOUT_DIRTY'
            Pin 'refs/heads/main' $pinnedMain
            Pin ('refs/heads/'+$branch) $pinnedHead
            Write-Host 'UQ51F_NINE_PROTECTED_HASHES=PASS'
            Write-Host 'UQ51F_SOURCE_BRANCH_AND_MAIN_STABLE=PASS'
            Write-Host 'UQ51F_PRODUCTION_MEMORY_WRITES=0'
            Write-Host 'UQ51F_GIT_PUSHES=0'
            Write-Host 'UQ51F_CODEX_AND_PAID_INFERENCE=0'
            Write-Host 'UQ51F_FULL_WINDOWS_QUALIFICATION=PASS'
          } finally {
            if(Test-Path -LiteralPath $scratch){Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction Stop}
            if(Test-Path -LiteralPath $scratch){throw 'UQ51F_PRIVATE_SCRATCH_RETAINED'}
            Write-Host 'UQ51F_PRIVATE_SCRATCH_CLEAN=PASS'
          }
