name: FORGE AC-07 remaining originals source-free qualification
on:
  push:
    branches:
      - research/ac07-remaining-originals-sourcefree-20261028
    paths:
      - 'research/ac07_sourcefree/**'
      - 'docs/research/AC-08-PORTFOLIO-CONSOLIDATION-DECISION.md'
      - 'docs/research/AC-10-DTR-SOURCE-NATIVE-COMPATIBILITY-PREFLIGHT.md'
      - 'docs/research/AC-11-AUTHENTIC-DTR-DEPENDENCY-PUBLIC-SMOKE-PROTOCOL.md'
      - 'docs/research/AC-12-GENUINE-UPSTREAM-IMPORT-REPAIR-PROTOCOL.md'
      - 'docs/research/AC-13-REAL-PYTORCH-TORCHVISION-REPAIR-PROTOCOL.md'
      - '.github/workflows/forge-ac07-remaining-sourcefree.yml'
  pull_request:
    branches:
      - research/ac06-restricted-originals-sourcefree-20261028
    paths:
      - 'research/ac07_sourcefree/**'
      - 'docs/research/AC-08-PORTFOLIO-CONSOLIDATION-DECISION.md'
      - 'docs/research/AC-10-DTR-SOURCE-NATIVE-COMPATIBILITY-PREFLIGHT.md'
      - 'docs/research/AC-11-AUTHENTIC-DTR-DEPENDENCY-PUBLIC-SMOKE-PROTOCOL.md'
      - 'docs/research/AC-12-GENUINE-UPSTREAM-IMPORT-REPAIR-PROTOCOL.md'
      - 'docs/research/AC-13-REAL-PYTORCH-TORCHVISION-REPAIR-PROTOCOL.md'
      - '.github/workflows/forge-ac07-remaining-sourcefree.yml'
permissions:
  contents: read
concurrency:
  group: forge-ac07-sourcefree-${{ github.ref }}
  cancel-in-progress: true
jobs:
  remaining:
    name: source-free original complements / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AC10_UPSTREAM_ROOT: ${{ github.workspace }}/ac10_upstream
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact Git commit and AC-06 parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor aac74498ec2be61af140b0e2602da8a73d6221e2 "$GITHUB_SHA"
          test ! -e research/ac07_sourcefree/launch.json
          echo "AC07_SOURCE_IDENTITY=PASS"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check out authentic external upstream DTR at frozen commit
        uses: actions/checkout@v4
        with:
          repository: CausalAILab/Causal-Gymnasium
          ref: c94e9a4cd3641588b6b8507e71ccee5c27032bdf
          path: ac10_upstream
          persist-credentials: false
          fetch-depth: 1
      - name: Focused AC-07 and AC-06 source-free regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/ac07_sourcefree -p 'test_*.py' -v
          python -B -m unittest discover -s research/ac06_sourcefree -p 'test_*.py' -v
          python -B -m unittest discover -s research/ac05_sourcefree -p 'test_*.py' -v
          echo "AC07_SOURCEFREE_REGRESSIONS=PASS"
      - name: Execute restricted 15-claim complement with all negatives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ac07"
          python -B research/ac07_sourcefree/remaining.py > "$RUNNER_TEMP/ac07/report.json"
          python - "$RUNNER_TEMP/ac07/report.json" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]); r=json.loads(p.read_text(encoding='utf-8'))
          assert r["schema"]=="forge.ac07.remaining-originals.sourcefree.v1"
          assert r["scope"]=="SYNTHETIC_DEVELOPMENT_ONLY"
          assert r["families"]==9
          assert len(r["observations"])==27
          assert len(r["restricted_new_original_ids"])==15
          assert r["combined_ac06_ac07_original_id_coverage"]==30
          assert r["physical_substitute_not_physical_result"]==["U03","U06"]
          assert r["relevant_baseline_improvement_proven"] is False
          assert r["scientific_first_use"] is False
          assert r["scientific_admission"] is False
          assert r["native_model_or_architecture_changed"] is False
          assert r["independent_itd02_consequence_source_verified"] is False
          assert r["controller_or_queue_modified"] is False
          print("AC07_ORIGINAL_COMPLEMENT_DEVELOPMENT=PASS")
          print("AC07_REPORT_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Reconcile all 36 source-free candidates without scientific admission
        shell: bash
        run: |
          set -euo pipefail
          python -B research/ac07_sourcefree/ac08_portfolio.py > "$RUNNER_TEMP/ac07/portfolio.json"
          python - "$RUNNER_TEMP/ac07/portfolio.json" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]); r=json.loads(p.read_text(encoding="utf-8"))
          assert r["schema"]=="forge.ac08.portfolio-reconciliation.sourcefree.v1"
          assert r["scope"]=="READ_ONLY_RECONCILIATION_OF_SYNTHETIC_DEVELOPMENT"
          assert r["unique_claim_count"]==36
          assert r["original_count"]==30 and r["native_hypothesis_count"]==6
          assert len(r["portfolio_rows"])==36
          assert len({x["claim_id"] for x in r["portfolio_rows"]})==36
          assert r["physical_substitute_only_ids"]==["U03","U06"]
          assert r["scientific_first_use_authorized"] is False
          assert r["scientific_admission_authorized"] is False
          assert r["model_promotion_authorized"] is False
          assert r["controller_or_queue_changed"] is False
          assert r["native_model_learning_superiority_proven"] is False
          assert r["independent_itd02_consequence_source_verified"] is False
          print("AC08_PORTFOLIO_36_OF_36_SOURCE_ONLY=PASS")
          print("AC08_REPORT_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: AC-10 pinned original DTR import and no-episode packaging qualification
        shell: bash
        run: |
          set -euo pipefail
          python -B research/ac07_sourcefree/ac10_upstream_contract.py --upstream "$AC10_UPSTREAM_ROOT" --out "$RUNNER_TEMP/ac07/ac10-report.json"
          python - "$RUNNER_TEMP/ac07/ac10-report.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert r["schema"]=="forge.ac10.upstream-dtr-source-compatibility.v1"
          assert r["upstream"]["sha"]=="c94e9a4cd3641588b6b8507e71ccee5c27032bdf"
          assert r["upstream"]["tree"]=="fd8d8a67c1fc7fa62274dc7e12fb1e77945632f0"
          assert r["original_source_interactions_performed"]==0
          assert r["native_model_training_performed"] is False
          assert r["scientific_first_use"] is False
          assert r["accepted_science_or_native_models_changed"] is False
          assert r["controller_or_f139_queue_changed"] is False
          print("AC10_SOURCE_NATIVE_IMPORT_PREFLIGHT_COMPLETED")
          print("AC10_RUNTIME_IMPORT_STATUS="+r["import_probe"]["status"])
          PY
      - name: AC-11 install original upstream dependencies and run constrained public smoke
        shell: bash
        run: |
          set -euo pipefail
          python -B research/ac07_sourcefree/ac11_original_dtr.py --upstream "$AC10_UPSTREAM_ROOT" --out "$RUNNER_TEMP/ac07/ac11-report.json" --freeze "$RUNNER_TEMP/ac07/ac11-freeze.txt" --venv "$RUNNER_TEMP/ac11_venv"
          python - "$RUNNER_TEMP/ac07/ac11-report.json" <<'PY'
          import json,sys,hashlib,pathlib
          p=pathlib.Path(sys.argv[1]); r=json.loads(p.read_text(encoding="utf-8"))
          assert r["schema"]=="forge.ac11.original-dtr-public-compatibility.v1"
          assert r["scope"]=="AUTHENTIC_SOURCE_PUBLIC_DEVELOPMENT_ONLY"
          assert r["upstream_source_sha"]=="c94e9a4cd3641588b6b8507e71ccee5c27032bdf"
          assert r["upstream_tree_sha"]=="fd8d8a67c1fc7fa62274dc7e12fb1e77945632f0"
          assert r["original_setup_py_used"] is True
          assert r["full_declared_dependency_install_attempted"] is True
          assert r["real_scientific_first_use"] is False
          assert r["native_model_training_performed"] is False
          assert r["accepted_model_or_controller_modified"] is False
          assert r["reserved_fit_seeds_used"] is False
          assert r["reserved_validation_seeds_used"] is False
          assert r["reserved_dev_seeds_used"] is False
          if r["public_development_smoke_status"]=="ACTUAL_SOURCE_PUBLIC_SMOKE_PASS":
              assert r["source_owned_episodes_executed"]==2
              assert r["source_owned_actions_executed"]==4
              assert r["public_smoke"]["source_env_exposed_to_learner"] is False
              assert r["public_smoke"]["learner_receives_unfiltered_info"] is False
              print("AC11_AUTHENTIC_PUBLIC_SMOKE=PASS")
          else:
              print("AC11_AUTHENTIC_PUBLIC_SMOKE=BLOCKED")
              print("AC11_BLOCKER="+str(r["installation_diagnostic"]))
              if r["source_public_smoke_attempted"]:
                  assert r["source_owned_episodes_executed"] is None
                  assert r["source_owned_actions_executed"] is None
              else:
                  assert r["source_owned_episodes_executed"]==0
                  assert r["source_owned_actions_executed"]==0
          print("AC11_DIAGNOSTIC_REPORT_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: AC-12 try verified pinned real Minigrid wheel after exact first original import error
        shell: bash
        run: |
          set -euo pipefail
          python -B research/ac07_sourcefree/ac12_import_repair.py --upstream "$AC10_UPSTREAM_ROOT" --venv "$RUNNER_TEMP/ac11_venv" --out "$RUNNER_TEMP/ac07/ac12-report.json" --freeze "$RUNNER_TEMP/ac07/ac12-freeze.txt"
          python - "$RUNNER_TEMP/ac07/ac12-report.json" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]); r=json.loads(p.read_text(encoding="utf-8"))
          assert r["schema"]=="forge.ac12.source-native-missing-dependency.v1"
          assert r["scope"]=="EXACT_AUTHENTIC_UPSTREAM_PUBLIC_DEVELOPMENT_ONLY"
          assert r["original_source_sha"]=="c94e9a4cd3641588b6b8507e71ccee5c27032bdf"
          assert r["original_source_tree"]=="fd8d8a67c1fc7fa62274dc7e12fb1e77945632f0"
          assert r["original_dtr_sha256"]=="e31eff82f862355057653d150967bb44a5ed57a6acaad57f7ecf2a551f6c6811"
          assert r["pinned_extra_name"]=="minigrid==2.3.1"
          assert r["reserved_fit_validation_dev_seeds_used"] is False
          assert r["science_unknown_family_touched"] is False
          assert r["fitted_models_count"]==0
          assert r["native_model_modified"] is False
          assert r["original_first_use_authorized"] is False
          assert r["scientific_admission"] is False
          assert r["forged_causal_source_created"] is False
          assert r["source_files_edited"] is False
          assert r["controller_or_queue_mutated"] is False
          if r["pinned_extra_install_attempted"] and r["dependency_install_return_code"]==0:
              assert r["authentic_pypi_wheel_sha256_verified"] is True
          if r["public_smoke_status"]=="ACTUAL_ORIGINAL_PUBLIC_SMOKE_PASS":
              assert r["source_public_episodes_executed"]==2
              assert r["source_public_actions_executed"]==4
              assert r["public_smoke"]["learner_receives_unfiltered_info"] is False
              print("AC12_AUTHENTIC_PUBLIC_SOURCE=PASS")
          else:
              print("AC12_AUTHENTIC_PUBLIC_SOURCE=BLOCKED")
              print("AC12_FIRST_MISSING="+str(r["first_original_import"]["exception"]["module"]))
              print("AC12_NEXT_MISSING="+str(r["original_import_after_pinned_extra"]["exception"]["module"]))
              if r["public_smoke_attempted"]:
                  assert r["source_public_episodes_executed"] is None
                  assert r["source_public_actions_executed"] is None
              else:
                  assert r["source_public_episodes_executed"]==0
                  assert r["source_public_actions_executed"]==0
          print("AC12_REPORT_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: AC-13 authenticate official CPU PyTorch wheels and original DTR import
        shell: bash
        run: |
          set -euo pipefail
          python -B research/ac07_sourcefree/ac13_cpu_torchvision.py --upstream "$AC10_UPSTREAM_ROOT" --venv "$RUNNER_TEMP/ac11_venv" --ac12-report "$RUNNER_TEMP/ac07/ac12-report.json" --out "$RUNNER_TEMP/ac07/ac13-report.json" --freeze "$RUNNER_TEMP/ac07/ac13-freeze.txt"
          python - "$RUNNER_TEMP/ac07/ac13-report.json" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]); r=json.loads(p.read_text(encoding="utf-8"))
          assert r["schema"]=="forge.ac13.original-pytorch-cpu-import.v1"
          assert r["scope"]=="AUTHENTIC_ORIGINAL_PUBLIC_DEVELOPMENT_COMPATIBILITY_ONLY"
          assert r["original_commit"]=="c94e9a4cd3641588b6b8507e71ccee5c27032bdf"
          assert r["original_tree"]=="fd8d8a67c1fc7fa62274dc7e12fb1e77945632f0"
          assert r["original_dtr_sha256"]=="e31eff82f862355057653d150967bb44a5ed57a6acaad57f7ecf2a551f6c6811"
          assert r["cpu_only"] is True
          assert r["pinned_torch"]=="2.3.1+cpu"
          assert r["pinned_torchvision"]=="0.18.1+cpu"
          assert r["reserved_fit_validation_dev_used"] is False
          assert r["unknown_family_used"] is False
          assert r["trained_native_model"] is False
          assert r["scientific_first_use"] is False
          assert r["scientific_admission"] is False
          assert r["source_edited"] is False
          assert r["controller_or_queue_mutated"] is False
          assert r["accepted_model_changed"] is False
          for pkg,value in r["downloaded_sha256"].items():
              assert value==r["official_index_sha256"][pkg]
          if r["public_smoke_status"]=="ACTUAL_SOURCE_PUBLIC_SMOKE_PASS":
              assert r["source_owned_episodes"]==2 and r["source_owned_actions"]==4
              assert r["public_smoke"]["source_env_exposed_to_learner"] is False
              assert r["public_smoke"]["learner_receives_unfiltered_info"] is False
              print("AC13_REAL_PUBLIC_SOURCE_SMOKE=PASS")
          else:
              print("AC13_REAL_PUBLIC_SOURCE_SMOKE=BLOCKED")
              print("AC13_PACKAGE_BLOCKER="+str(r["failure_class"]))
              if r["source_public_smoke_attempted"]:
                  assert r["source_owned_episodes"] is None
                  assert r["source_owned_actions"] is None
              else:
                  assert r["source_owned_episodes"]==0
                  assert r["source_owned_actions"]==0
          print("AC13_DEVELOPMENT_DIAGNOSTIC=PASS")
          print("AC13_EVIDENCE_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Retain source-free evidence per operating system
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forge-ac07-${{ matrix.os }}-sourcefree-restricted
          path: |
            ${{ runner.temp }}/ac07/report.json
            ${{ runner.temp }}/ac07/portfolio.json
            ${{ runner.temp }}/ac07/ac10-report.json
            ${{ runner.temp }}/ac07/ac11-report.json
            ${{ runner.temp }}/ac07/ac11-freeze.txt
            ${{ runner.temp }}/ac07/ac12-report.json
            ${{ runner.temp }}/ac07/ac12-freeze.txt
            ${{ runner.temp }}/ac07/ac13-report.json
            ${{ runner.temp }}/ac07/ac13-freeze.txt
          retention-days: 30
          if-no-files-found: error
