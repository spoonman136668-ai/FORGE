name: Mass K4V existing original FIT-only native policy replay (no MiniGrid)
on:
  push:
    branches: [research/mass-lcrm01-k4v-fit-only-native-replay-20261024]
    paths:
      - .github/workflows/lcrm01-k4v-fit-only-native-replay.yml
      - research/lcrm01/k4v_*
permissions:
  contents: read
  actions: read
concurrency:
  group: k4v-readonly-actual-fit-${{ github.sha }}
  cancel-in-progress: false
jobs:
  historical-fit-only-native-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      GOTOOLCHAIN: local
    steps:
      - name: Checkout exact isolated scientific-source-readonly branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 12
          persist-credentials: false
      - name: Python 3.11 standard library only
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Go 1.25.5 native source compiler only
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Verify frozen BEFORE replay code and deny other source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'research/mass-lcrm01-k4v-fit-only-native-replay-20261024'
          test "$GITHUB_REPOSITORY" = 'spoonman136668-ai/FORGE'
          test "$(git rev-parse '95333ac8bf48a3e6c07bcc8537f8fe9c6bdbbaed^')" = 'cfb99220f2d369c8e0e91dd641fc3562f828c407'
          git merge-base --is-ancestor 95333ac8bf48a3e6c07bcc8537f8fe9c6bdbbaed HEAD
          test "$(git hash-object research/lcrm01/k4v_frozen_native_fit_replay.json)" = 'a31337f46f1a436b99f01c3b35acbf503e15f441'
          python - <<'PY'
          from pathlib import Path
          code=Path('research/lcrm01/k4v_fit_replay.py').read_text()
          compile(code,'k4v_fit_replay.py','exec')
          assert 'minigrid' not in code.lower().replace('no minigrid','').replace('new minigrid','').replace('original minigrid',''), 'UNQUALIFIED_SIMULATOR_CODE'
          assert 'CHECK_original_results' not in code and 'DEV_original_results' not in code
          print('K4V_PROTOCOL_FREEZE_AND_REPLAY_SOURCE=PASS')
          PY
      - name: Retrieve exactly one already-consumed, hash-locked K4R original artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k4v"
          curl --fail --location --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            'https://api.github.com/repos/spoonman136668-ai/FORGE/actions/artifacts/12561177548/zip' \
            -o "$RUNNER_TEMP/k4v/original-k4r.zip"
          printf 'ba8c36c240cf6c7614231d78f307715aedab215ad36199be4d45c36d681720fd  %s\n' "$RUNNER_TEMP/k4v/original-k4r.zip" | sha256sum -c -
          echo K4V_ORIGINAL_ALREADY_CONSUMED_ZIP_HASH=PASS
      - name: Replay only original FIT with actual untouched source-owned Go and Python learner methods
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B research/lcrm01/k4v_fit_replay.py \
            --archive "$RUNNER_TEMP/k4v/original-k4r.zip" \
            --wing-test research/lcrm01/k4v_wing_native_fit_test.go \
            --output "$RUNNER_TEMP/k4v/k4v_derived_source_only_receipt.json"
          python - <<'PY'
          import json,os,pathlib
          x=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'k4v/k4v_derived_source_only_receipt.json').read_text())
          assert x['result']=='AUTHENTIC_FIT_NATIVE_SOURCE_ONLY_REPLAY_PASS'
          assert x['new_original_minigrid_episodes']==0
          assert x['original_check_dev_reused_for_evaluation'] is False
          assert x['native_scientific_accepted'] is False
          for k in ('a','b'):
              assert x['cases'][k]['original_source_transition_count']==5955
              assert x['cases'][k]['wingless']['updates']==5955
              assert x['cases'][k]['yggdrasil']['updates']==5955
          print('K4V_RESULT_SOURCE_ONLY_PASS_FSA_HOLD=PASS')
          PY
          git diff --exit-code
          git diff --cached --exit-code
      - name: Preserve derived summary ONLY, not source or original heldout
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-k4v-historical-fit-only-native-replay
          path: ${{ runner.temp }}/k4v/k4v_derived_source_only_receipt.json
          if-no-files-found: warn
          retention-days: 90
