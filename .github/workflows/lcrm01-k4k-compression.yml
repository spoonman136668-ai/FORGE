name: Mass Research K4K frozen compressed memory quality cost
on:
  push:
    branches: [research/mass-lcrm01-k4k-memory-compression-20261024]
permissions:
  contents: read
jobs:
  compression-mechanism:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Frozen K4K original prospective science and two process quality cost checks
        run: bash research/lcrm01/k4k_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-k4k-original-compressed-memory-quality-cost
          path: |
            ${{ runner.temp }}/k4k/process-a.json
            ${{ runner.temp }}/k4k/process-b.json
            ${{ runner.temp }}/k4k/comparison.json
            ${{ runner.temp }}/k4k/process-a.log
            ${{ runner.temp }}/k4k/process-b.log
          if-no-files-found: warn
          retention-days: 90
