name: F124-AZ first source-new 48-answer equal-budget nonlinear FIT-SCREEN
on:
  push:
    branches: [research/f124az-public-evidence-joint-inverse-20261018]
    paths: ['.github/workflows/forge-f124az-original-train.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: f124az-original-prospective-fit-screen-one-use
  cancel-in-progress: false
jobs:
  original-source-new-train:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 35
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reauthenticate original frozen source and independently qualified models BEFORE any new TRAIN construction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          f=reference/research-intake/f124az-frozen-public-gated-affine-feistel.json
          test "$(git hash-object "$f")" = '9aaaef5c9b724be4afd0d7fa4783285139290540'
          test "$(git log -1 --format=%H -- "$f")" = '71a906e3a0721e23870138577e863f788162e226'
          test "$(git rev-parse 'a1916139fbc2ce99e180c727ba94b716406aaefe:nativeevidence/f124ay_train_source.py')" = '7ef2e017fb652f5f19c3ef54ae584c750a591f56'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39149237214" --jq '[.head_sha,.status,.conclusion,.event] | join(" ")')" = 'd6b87ef5a4161ce94abc2468998e5362ccf91dfd completed success push'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39148373796" --jq '[.head_sha,.status,.conclusion] | join(" ")')" = 'a1916139fbc2ce99e180c727ba94b716406aaefe completed success'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39147909442/artifacts" --jq '.artifacts[] | select(.id==12144565111 and .expired==false) | .digest')" = 'sha256:38a442b07b998e623b980243dc3dc06764ae119778cdf817e2be8054457d940a'
          python3 -B -m unittest discover -s nativeevidence -p 'test_f124az_*.py' -v
          python3 -B isolationguard/check.py
          echo F124AZ_NEW_FROZEN_SOURCE_MODEL=PASS
          echo F124AZ_DEV_GENERATED=0
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39078269441
          github-token: ${{ github.token }}
          name: f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d
          path: originals/o
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39082424955
          github-token: ${{ github.token }}
          name: f124t-source-verified-fresh-development-01560f7f4f1aab5737cfd045dffd7faaccfb0608
          path: originals/t
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39118489510
          github-token: ${{ github.token }}
          name: f124an-calibrated-source-isolation-ca46eba41179a1c6d9cd0bfa74119782c6d11d88
          path: originals/an
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39122374949
          github-token: ${{ github.token }}
          name: f124ao-first-dev-evidence-a0d15c8cf307a9c7972728899b525f79717049c7
          path: originals/ao
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39123857883
          github-token: ${{ github.token }}
          name: f124ap-authentic-train-only-c5330bbff435febe198c55e9da19beb17bc613d8
          path: originals/ap
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39124962572
          github-token: ${{ github.token }}
          name: f124aq-train-1d4222158da000f66f6ad28033c9b15f4dcabe93
          path: originals/aq
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39133441550
          github-token: ${{ github.token }}
          name: f124ar-original-train-d261861f31c34152ffe9d7081302f764ac02fb7d
          path: originals/ar
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39136517506
          github-token: ${{ github.token }}
          name: f124as-original-new-train-06ca4e0dc54a619de8ec623c97ff1ef1ce0496b5
          path: originals/as_train
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39136910292
          github-token: ${{ github.token }}
          name: f124as-original-first-dev-449fc54cecccb6e30eaa13016f9d1828532714ac
          path: originals/as_dev
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39138041247
          github-token: ${{ github.token }}
          name: f124at-fresh-diagnostic-699ba7abc460bc0763eed2f11d10bdf766e4604b
          path: originals/at
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39140097345
          github-token: ${{ github.token }}
          name: f124au-original-fit-screen-ec8a61f41fce6b4f29d8ae30a4ec52fafbde95af
          path: originals/au
      - name: Authenticated historical original weights and new prospective 24 FIT / 24 SCREEN
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '025c97abc8eb69079d7d7d0f59bfdb81235b9ad9ab83e230f32b542d2cfbdb5d  originals/o/f124o-independent-two-learned-development.json' \
            'a2f7b3641c2f84f684372918849170c97912c7a104fa4dbe264bcbd6d444c2d2  originals/t/f124t-fresh-absolute-development.json' \
            '7226e267ac02090069690ebb40e92696a2cba1bd56a567d838fc6e48880cff9c  originals/an/f124an-calibrated-affine-wing-isolation.json' \
            '37d61d2130fc73f28fd96d32b85d018dee231c5319dd515b2024132f7855cb52  originals/ao/f124ao-first-dev-independent-evidence.json' \
            '56bb2b97a2d0ae5babc0884e55841252ecefd6a11748f33425753e6309ef1417  originals/ap/f124ap-authentic-kernel-hop-train.json' \
            'd3a3935cc58d0fe69f46a496ae130a434360bee4169dc22bdad72385af3aa5b0  originals/aq/f124aq-train.json' \
            '8e8a062ed46af068cf490044f9f5f548d78cc31655ca7fe2061f4ad8ddfd0446  originals/ar/f124ar-original-fresh-train.json' \
            'f012c3c34ee7f859932b5d4274e53d675f683568b2cda74cbeeee6407c785b7b  originals/as_train/f124as-original-train.json' \
            'd6d6c184ec4a06df0c33de1a0490d8fb67d1d9897ec78529d51e85547b0d48f7  originals/as_dev/f124as-first-dev.json' \
            '8050c9f4bae5821c4bc2d222d1c4985a41e3c86cb4af1c3cedf1a70c1a94422d  originals/at/f124at-original-fresh-train.json' | sha256sum --check --strict
          python3 -B - <<'PY'
          import json,sys
          sys.path.insert(0,'nativeevidence')
          from f124av_fit_screen import parent
          base,delta=parent.lineage(
              'originals/o/f124o-independent-two-learned-development.json',
              'originals/t/f124t-fresh-absolute-development.json',
              'originals/an/f124an-calibrated-affine-wing-isolation.json',
              'originals/ao/f124ao-first-dev-independent-evidence.json',
              'originals/ap/f124ap-authentic-kernel-hop-train.json',
              'originals/aq/f124aq-train.json',
              'originals/ar/f124ar-original-fresh-train.json',
              'originals/as_train/f124as-original-train.json',
              'originals/as_dev/f124as-first-dev.json',
              'originals/at/f124at-original-fresh-train.json',
          )
          assert len(base['Yggdrasil'])==7 and len(delta['Yggdrasil'])==2
          with open('/tmp/f124az-original-7-base.json','w') as f:json.dump(base['Yggdrasil'],f)
          with open('/tmp/f124az-original-2-delta.json','w') as f:json.dump(delta['Yggdrasil'],f)
          print('F124AZ_HISTORICAL_DONOR_WEIGHTS=PASS')
          PY
          python3 -B nativeevidence/f124az_fit_screen.py \
            --base /tmp/f124az-original-7-base.json \
            --delta /tmp/f124az-original-2-delta.json \
            --output "${{ runner.temp }}/f124az-original-fit-screen.json"
          python3 -B -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["schema"]=="forge.research.f124az.original-joint-inverse-equal48-first-TRAIN.v1"; assert d["source_freeze_blob"]=="9aaaef5c9b724be4afd0d7fa4783285139290540"; assert d["FIT_paired_cases"]==d["SCREEN_paired_cases"]==24 and len(d["FIT_models"])==len(d["SCREEN_models"])==8; assert d["SCREEN_did_not_retrain_or_respecify"] is True and d["Ygg_DEV_generated"]==0 and d["Ygg_DEV_consumed"] is False and d["Wingless_DEV_generated"]==0 and d["Wingless_DEV_consumed"] is False and d["optimizer_promotion"] is False' "${{ runner.temp }}/f124az-original-fit-screen.json"
          sha256sum "${{ runner.temp }}/f124az-original-fit-screen.json" > "${{ runner.temp }}/f124az-original-fit-screen.json.sha256"
          echo F124AZ_FIRST_AUTHENTIC_NEW_TRAIN=PASS
          echo F124AZ_NEW_DEV_CONSUMED=false
      - uses: actions/upload-artifact@v4
        with:
          name: f124az-original-public-joint-eight-arm-fit-screen-${{ github.sha }}
          path: |
            ${{ runner.temp }}/f124az-original-fit-screen.json
            ${{ runner.temp }}/f124az-original-fit-screen.json.sha256
          retention-days: 90
          if-no-files-found: error
