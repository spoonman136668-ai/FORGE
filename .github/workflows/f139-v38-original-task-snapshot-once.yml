name: FORGE F139 V38 original held task independent read-only snapshot once
# Exact owner-only issue #807 event; no schedule/dispatch, DB/task writes, or replay.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  actions: read
  pull-requests: read
concurrency:
  group: forge-f139-v41-original-owner-live-install
  cancel-in-progress: false
jobs:
  original-owner-readonly-task-snapshot:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'spoonman136668-ai' &&
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.event.issue.number == 807 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-V38-ORIGINAL-TASK-SNAPSHOT ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 10
    steps:
      - name: Checkout exact protected main without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read one original task metadata snapshot without task or SQLite changes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: .
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
              $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
              $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or
              $env:OPENAI_API_KEY) {
            throw 'F139_TASK_SNAPSHOT_WRONG_OWNER_OR_EVENT'
          }
          $head=(& git rev-parse HEAD | Out-String).Trim()
          $dirty=@(& git status --porcelain --untracked-files=all)
          $guard=(& git rev-parse 'HEAD:f139/nci04_v41_hybrid_forward_owner_profile.py' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or
              $head -cne $env:GITHUB_SHA -or
              $dirty.Count -ne 0 -or
              $guard -cne '9bda78341bc3651e8b7b0a24ea6c7858dbff05c6') {
            throw 'F139_TASK_SNAPSHOT_ORIGINAL_GUARD_OR_SOURCE_CHANGED'
          }
          $ev=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $required='F139-V38-ORIGINAL-TASK-SNAPSHOT '+$env:GITHUB_SHA+' 6887172639'
          if ($ev.action -cne 'created' -or
              [string]$ev.comment.body -cne $required -or
              $ev.comment.author_association -cne 'OWNER' -or
              $ev.comment.user.login -cne 'spoonman136668-ai' -or
              $ev.sender.login -cne 'spoonman136668-ai') {
            throw 'F139_TASK_SNAPSHOT_FRESH_OWNER_INTENT_REQUIRED'
          }
          & python -B -m f139.nci04_v38_original_task_snapshot
          if ($LASTEXITCODE -ne 0) {
            throw 'F139_TASK_SNAPSHOT_FAIL_CLOSED'
          }
          Write-Output 'F139_TASK_SNAPSHOT_READONLY_CLASSIFICATION=TRUE'
          Write-Output 'F139_TASK_SNAPSHOT_TASK_MUTATIONS=ZERO'
          Write-Output 'F139_TASK_SNAPSHOT_SQLITE_OPENED=FALSE'
          Write-Output 'F139_TASK_SNAPSHOT_SCIENTIFIC_FIRST_USE=FALSE'
