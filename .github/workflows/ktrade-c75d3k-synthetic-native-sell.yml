name: KTRADE R25-C75D3I original synthetic-only SELL TP SL source decision qualification
on:
  push:
    branches: [qualification/ktrade-c75d3k-synthetic-native-sell-20261022]
    paths: [.github/workflows/ktrade-c75d3k-synthetic-native-sell.yml]
permissions:
  contents: read
concurrency:
  group: forge-operator-ktrade-c75d3k-review
  cancel-in-progress: false
jobs:
  original-donor-sell-synthetic:
    if: github.repository == 'spoonman136668-ai/FORGE'
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 18
    env:
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: 'Never'
      GOWORK: 'off'
      GOTOOLCHAIN: 'local'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
    steps:
      - name: Qualify original SELL TP SL predicates against synthetic position only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-c75d3k-synthetic-native-sell-20261022' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:KTRADE_CI_PAPER_ONLY -cne '1' -or
             $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or
             $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){
            throw 'D3K_RUNNER_AUTHORITY_INVALID'
          }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME','CDP_API_KEY_PRIVATE_KEY','KTRADE_API_KEY','KTRADE_API_SECRET')){
            if([Environment]::GetEnvironmentVariable($key)){throw 'D3K_BROKER_CREDENTIALS_NOT_PERMITTED'}
          }
          $sourceSha='05b5f4a542c5d9a9710d581fad354ad1fb3dbfb7'
          $sourceParent='2b93b2d08540474fd9e602e9802c377e881d8c87'
          $donorSha='520cfe124fdd7e8dcbf16b6a6f38229b43db7dbc'
          $donorTree='b74808f35e798b1b72e8fb31a49a5f4664ca87b5'
          $expected=@{
            'tests/donor-native-vwap/c75d3h_native_decision_noorders.go'='2f7494d22eba4cc189045c47eeac9be2aebc1cd5'
            'tests/donor-native-vwap/c75d3h_native_decision_noorders_test.go'='0b7b87736281df988e2a36d0985ecad7ab5a7f7a'
            'tests/donor-native-vwap/c75d3i_native_original_owner_state_review.go'='ac75836b2067b8564b8cc46d3215a8698d2f5149'
            'tests/donor-native-vwap/c75d3i_native_original_owner_state_review_test.go'='5caa01eb4f4a52dde55808415452bcb4b1cef9a0'
            'tests/donor-native-vwap/c75d3k_native_original_sell_fixture.go'='6c03f48ec98f7c841468a32d89383334661708a3'
            'tests/donor-native-vwap/c75d3k_native_original_sell_fixture_test.go'='6ac403e955ef0dbb4fd7ca4881fb748edf8aae1b'
            'tests/donor-native-vwap/c75d3f_native_current_vwap.go'='70a912177ba86fb71d059d440a3b1b39ee70674d'
            'tests/donor-native-vwap/c75d3f_native_current_donor_test.go'='1975b048e9743a54326664923fc369a9f43b006f'
          }
          $root=Join-Path $env:RUNNER_TEMP ('ktrade-d3h-native-'+[guid]::NewGuid().ToString('N'))
          $source=Join-Path $root 'candidate'
          $donor=Join-Path $root 'original'
          $seed=Join-Path $root 'module-seed'
          $log=Join-Path $root 'private-run.log'
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          try {
            Write-Host 'D3K_EXISTING_ISOLATED_WINDOWS_RUNNER=PASS'
            & git clone --quiet --no-checkout https://github.com/spoonman136668-ai/ktrade.git $source *> $log
            if($LASTEXITCODE -ne 0){throw 'D3K_EXISTING_MACHINE_KTRADE_READ_UNAVAILABLE'}
            & git -C $source checkout --quiet --detach $sourceSha *> $log
            if($LASTEXITCODE -ne 0){throw 'D3K_FROZEN_KTRADE_REVISION_UNAVAILABLE'}
            & git clone --quiet --no-checkout https://github.com/spoonman136668-ai/ckb.git $donor *> $log
            if($LASTEXITCODE -ne 0){throw 'D3K_EXISTING_MACHINE_ORIGINAL_READ_UNAVAILABLE'}
            & git -C $donor checkout --quiet --detach $donorSha *> $log
            if($LASTEXITCODE -ne 0){throw 'D3K_FROZEN_ORIGINAL_REVISION_UNAVAILABLE'}
            if((& git -C $source rev-parse HEAD).Trim() -cne $sourceSha -or
               (& git -C $donor rev-parse HEAD).Trim() -cne $donorSha -or
               (& git -C $donor rev-parse 'HEAD^{tree}').Trim() -cne $donorTree){
              throw 'D3K_SOURCE_COMMIT_TREE_DRIFT'
            }
            $delta=@(& git -C $source diff --name-only $sourceParent $sourceSha | Sort-Object)
            $want=@($expected.Keys | Where-Object {$_ -match 'c75d3k_' } | Sort-Object)
            if($delta.Count -ne 2 -or @(Compare-Object $want $delta).Count -ne 0){
              throw 'D3K_SOURCE_DELTA_NOT_TWO_ADDED_FILES'
            }
            foreach($path in $expected.Keys){
              $blob=(& git -C $source rev-parse ('HEAD:'+$path)).Trim()
              if($blob -cne $expected[$path]){throw 'D3K_PINNED_NATIVE_BLOB_DRIFT'}
            }
            Write-Host 'D3K_FROZEN_DONOR_AND_KTRADE_GIT_IDENTITIES=PASS'
            New-Item -ItemType Directory -Path $seed | Out-Null
            Copy-Item -LiteralPath (Join-Path $donor 'go.mod') -Destination $seed
            Copy-Item -LiteralPath (Join-Path $donor 'go.sum') -Destination $seed
            $env:GOMODCACHE=Join-Path $root 'go-module-cache'
            $env:GOPROXY='https://proxy.golang.org'
            $env:GOSUMDB='sum.golang.org'
            Push-Location $seed
            try{
              & go mod download *> $log
              if($LASTEXITCODE -ne 0){throw 'D3K_PUBLIC_GO_MODULE_CACHE_MISSING'}
            } finally {Pop-Location}
            $env:GOPROXY='off'
            $env:GOSUMDB='off'
            foreach($name in @('c75d3f_native_current_vwap.go','c75d3f_native_current_donor_test.go','c75d3h_native_decision_noorders.go','c75d3h_native_decision_noorders_test.go','c75d3i_native_original_owner_state_review.go','c75d3i_native_original_owner_state_review_test.go','c75d3k_native_original_sell_fixture.go','c75d3k_native_original_sell_fixture_test.go')){
              Copy-Item -LiteralPath (Join-Path $source ('tests/donor-native-vwap/'+$name)) -Destination (Join-Path $donor ('pkg/'+$name)) -ErrorAction Stop
            }
            $actual=@(& git -C $donor status --porcelain=v1 --untracked-files=all)
            if($actual.Count -ne 8 -or
               (@($actual | Where-Object {$_ -notmatch '^\?\? pkg/c75d3[fhik]_[a-z0-9_]+\.go$'}).Count -ne 0)){
              throw 'D3K_SOURCE_INJECTION_SCOPE_DRIFT'
            }
            Push-Location $donor
            try {
              & go test -mod=readonly -tags=ktrade_donor_shadow -count=1 -timeout=9m -run '^(TestC75D3F|TestC75D3H|TestC75D3I|TestC75D3K)' ./pkg *> $log
              if($LASTEXITCODE -ne 0){
                $failures=@(Get-Content -LiteralPath $log | Where-Object {$_ -cmatch '^--- FAIL: (TestC75D3K[A-Za-z0-9_]+)' } | ForEach-Object {
                  if($_ -cmatch '^--- FAIL: (TestC75D3K[A-Za-z0-9_]+)'){$Matches[1]}
                } | Select-Object -Unique -First 8)
                foreach($name in $failures){Write-Host ('D3K_FAILED_TEST='+$name)}
                # Only the synthetic fixture test's static case IDs and
                # decision enums are printed. No raw private logs or values.
                $syntheticLines=@(Get-Content -LiteralPath $log)
                foreach($item in $syntheticLines){
                  if($item -match '--- FAIL: TestC75D3KSyntheticSellTakeProfitStopLossPrecedence/([a-z_]+)'){
                    Write-Host ('D3K_SYNTHETIC_FAILED_CASE='+$Matches[1])
                  }
                  if($item -match 'native original position gate rejected fixture'){
                    Write-Host 'D3K_SYNTHETIC_FAILURE_CLASS=NATIVE_FIXTURE_REJECTED'
                  }
                  if($item -match 'original native "([A-Z ]+)" observation unqualified'){
                    Write-Host ('D3K_SYNTHETIC_FAILURE_CLASS=DECISION_NOT_EXPECTED_'+($Matches[1] -replace ' ','_'))
                  }
                  if($item -match 'repeat same completed bar altered native inert decision'){
                    Write-Host 'D3K_SYNTHETIC_FAILURE_CLASS=NONDETERMINISTIC_OBSERVATION'
                  }
                }
                $sites=@(Get-Content -LiteralPath $log | Where-Object {$_ -cmatch '(c75d3k_[a-z0-9_]+\.go):(\d+):(\d+):' } | ForEach-Object {
                  if($_ -cmatch '(c75d3k_[a-z0-9_]+\.go):(\d+):(\d+):'){($Matches[1]+':'+$Matches[2]+':'+$Matches[3])}
                } | Select-Object -Unique -First 8)
                foreach($site in $sites){Write-Host ('D3K_COMPILER_SITE='+$site)}
                throw 'D3K_ORIGINAL_SOURCE_DECISION_TEST_FAILED'
              }
              Write-Host 'D3K_ORIGINAL_DONOR_NATIVE_DECISION_TESTS=PASS'
              & go vet -mod=readonly -tags=ktrade_donor_shadow ./pkg *> $log
              if($LASTEXITCODE -ne 0){throw 'D3K_ORIGINAL_DONOR_VET_FAILED'}
              Write-Host 'D3K_ORIGINAL_DONOR_NATIVE_VET=PASS'
              $binary=Join-Path $root 'native-noorder-regression.exe'
              & go test -c -mod=readonly -tags=ktrade_donor_shadow -o $binary ./pkg *> $log
              if($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $binary -PathType Leaf)){
                throw 'D3K_ORIGINAL_NATIVE_TEST_BINARY_FAILED'
              }
              Write-Host 'D3K_ORIGINAL_NATIVE_TEST_BUILD=PASS'
              Write-Host ('D3K_TEST_BINARY_SHA256='+((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()))
            } finally {Pop-Location}
            Write-Host 'D3K_SYNTHETIC_ONLY_SELL_TP_SL_PREDICATES=PASS'
            Write-Host 'D3K_ORIGINAL_SOURCE_UNCHANGED=PASS'
            Write-Host 'D3K_AUTHENTIC_OWNER_STATE=NOT_SUPPLIED'
            Write-Host 'D3K_REAL_OWNER_SELL_TP_SL_PARITY=NOT_QUALIFIED'
            Write-Host 'D3K_PAPER_ORDER_AUTHORITY=FALSE'
            Write-Host 'D3K_LIVE_BROKER_AUTHORITY=FALSE'
          } finally {
            if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue}
            Write-Host 'D3K_PRIVATE_SOURCE_OR_TEST_LOG_EXPORTED=FALSE'
          }
