name: FORGE R8 five optimizer shadow bridge qualification
on:
  push:
    branches: [research/optimizer-bridge-five-method-shadow-20261014-r1]
  pull_request:
    paths:
      - 'optimizerbridge/**'
      - 'cmd/forge-optimizer-shadow/**'
      - '.github/workflows/forge-optimizer-bridge-shadow.yml'
permissions:
  contents: read
jobs:
  dual-lane-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Five-way signed-history synthetic qualification and negatives
        run: |
          set -euo pipefail
          go test -count=1 ./optimizerbridge ./cmd/forge-optimizer-shadow ./dreamrsi ./evoportfolio ./promptlineage ./thetaadapt ./genenv
      - name: One full FORGE repository regression
        run: go test ./...
      - name: No real originals, authorization or Cloudflare secrets
        run: |
          echo "OPTIMIZER_BRIDGE_SYNTHETIC_ONLY=TRUE"
          echo "RESEARCH_ORIGINALS_EXECUTED=0"
          echo "CLOUDFLARE_NOT_CONFIGURED_OR_PROBED_BY_THIS_WORKFLOW=TRUE"
          echo "FSA_OR_CONTROLLER_NOT_CREATED=TRUE"

      - name: Existing Cloudflare read-only binding probe
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/optimizer-bridge-five-method-shadow-20261014-r1'
        env:
          CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_ALTERNATE: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ALT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_BUCKET_SECRET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CF_BUCKET_VAR: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CF_BUCKET_ALT: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # Strictly bounded provider GET-only probe: no key output, no writes,
          # no bucket listing and no science/evidence original consumption.
          import json, os, re, urllib.request, urllib.error
          def configured(*names):
              return next((os.environ.get(n,"").strip() for n in names if os.environ.get(n,"").strip()),"")
          token=configured("CF_TOKEN_PRIMARY","CF_TOKEN_ALTERNATE")
          account=configured("CF_ACCOUNT_SECRET","CF_ACCOUNT_VAR","CF_ACCOUNT_ALT")
          bucket=configured("CF_BUCKET_SECRET","CF_BUCKET_VAR","CF_BUCKET_ALT")
          key=configured("R2_ACCESS_KEY")
          secret=configured("R2_SECRET_KEY")
          print("CF_PROBE_MODE=ONE_SHOT_READ_ONLY_NO_RESOURCES")
          print("CF_S3_CREDENTIAL_PAIR_BOUND="+("TRUE" if key and secret else "FALSE"))
          print("CF_ACCOUNT_ID_BOUND="+("TRUE" if account else "FALSE"))
          print("CF_BUCKET_ID_BOUND="+("TRUE" if bucket else "FALSE"))
          if not token:
              print("CF_API_TOKEN_BINDING=ABSENT")
              print("CF_BUCKET_READBACK=NOT_ATTEMPTED")
              print("CF_AUTHENTIC_SCIENTIFIC_EVIDENCE=NOT_QUALIFIED")
              raise SystemExit(0)
          def get(path):
              req=urllib.request.Request("https://api.cloudflare.com/client/v4/"+path,
                  headers={"Authorization":"Bearer "+token,"Accept":"application/json"},
                  method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=8) as r:
                      raw=r.read(32768)
                      if r.read(1): return "OVERSIZE",None
                      obj=json.loads(raw)
                      return ("OK" if obj.get("success") is True else "REJECTED"),obj
              except urllib.error.HTTPError as e:
                  return ("HTTP_"+str(e.code)),None
              except Exception:
                  return "TRANSPORT_UNAVAILABLE",None
          valid_account=bool(re.fullmatch(r"[a-fA-F0-9]{32}",account or ""))
          verify,response=get("user/tokens/verify")
          active=bool(verify=="OK" and isinstance(response,dict) and
                      (response.get("result") or {}).get("status")=="active")
          print("CF_USER_TOKEN_VERIFY="+("ACTIVE" if active else verify))
          if not active and verify in ("HTTP_401","HTTP_403") and valid_account:
              # Cloudflare account-owned tokens have a separate verify API.
              state,response=get("accounts/"+account+"/tokens/verify")
              active=bool(state=="OK" and isinstance(response,dict) and
                          (response.get("result") or {}).get("status")=="active")
              print("CF_ACCOUNT_TOKEN_VERIFY="+("ACTIVE" if active else state))
          print("CF_AUTHENTICATED_TOKEN="+("TRUE" if active else "FALSE"))
          if not active:
              print("CF_BUCKET_READBACK=NOT_ATTEMPTED")
          elif not valid_account:
              print("CF_BUCKET_READBACK=NOT_ATTEMPTED_ACCOUNT_BINDING_INVALID")
          elif not re.fullmatch(r"[a-z0-9][a-z0-9-]{1,62}",bucket or ""):
              # Exactly one bounded read-only metadata page. Never expose names
              # or assume a discovered bucket is authorized science custody.
              state,obj=get("accounts/"+account+"/r2/buckets?per_page=20")
              if state!="OK" or not isinstance((obj or {}).get("result"),dict):
                  print("CF_BUCKET_DISCOVERY="+state)
              else:
                  buckets=obj["result"].get("buckets")
                  if not isinstance(buckets,list):
                      print("CF_BUCKET_DISCOVERY=MALFORMED")
                  else:
                      candidates=[b for b in buckets
                        if isinstance(b,dict) and isinstance(b.get("name"),str) and
                        any(k in b["name"].lower() for k in ("forge","research","science","evidence"))]
                      cursor=(obj.get("result_info") or {}).get("cursor")
                      print("CF_BUCKET_DISCOVERY=METADATA_VERIFIED")
                      print("CF_BUCKETS_RETURNED="+str(len(buckets)))
                      print("CF_RESEARCH_NAMED_BUCKETS_RETURNED="+str(len(candidates)))
                      print("CF_MORE_BUCKET_PAGES="+("TRUE" if cursor else "FALSE"))
              print("CF_BUCKET_READBACK=NOT_ATTEMPTED_WITHOUT_EXACT_BUCKET_BINDING")
          else:
              state,obj=get("accounts/"+account+"/r2/buckets/"+bucket)
              print("CF_BUCKET_READBACK="+("METADATA_VERIFIED" if state=="OK" and
                    isinstance((obj or {}).get("result"),dict) and
                    (obj["result"].get("name")==bucket) else state))
          print("CF_AUTHENTIC_SCIENTIFIC_EVIDENCE=NOT_QUALIFIED")
          print("CF_PROBE_ORIGINAL_EXECUTIONS=0")
          PY
