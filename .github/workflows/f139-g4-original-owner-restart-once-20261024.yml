name: F139 G4 restore single original Windows development owner
on:
  push:
    branches: [cutover/f139-g4-single-owner-20261024]
    paths: [.github/workflows/f139-g4-original-owner-restart-once-20261024.yml]
permissions:
  contents: read
concurrency:
  group: f139-g4-original-owner-single-restart
  cancel-in-progress: false
jobs:
  original-owner-restart:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Restore existing owner task only after immutable source and policy admission
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $repo='spoonman136668-ai/FORGE'
          $source='8eca700c39223e176dea55f488b6f3397ce4e27a'
          $taskName='FORGE-F139-UnifiedController'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_RUN_ATTEMPT -cne '1' -or $env:OPENAI_API_KEY){throw 'UNQUALIFIED_RESTART_OWNER'}
          $protected=(& gh api "repos/$repo/branches/main" --jq '.commit.sha'|Out-String).Trim()
          $policy=((& gh api "repos/$repo/issues/807" --jq '.body'|Out-String).Trim()|ConvertFrom-Json)
          if($LASTEXITCODE -ne 0 -or $protected -cne $source -or
             $policy.source_sha -cne $source -or $policy.enabled -ne $true -or
             $policy.scientific_first_use -ne $false -or $policy.new_controller -ne $false -or
             $policy.new_scheduler -ne $false -or $policy.new_queue -ne $false){
             throw 'F139_ORIGINAL_RESTART_POLICY_SOURCE_DRIFT'
          }
          $t=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          if([string]$t.State -cne 'Disabled' -or @($t.Actions).Count -ne 1 -or
             @($t.Triggers).Count -ne 3){throw 'F139_ORIGINAL_NOT_PREPARED_FOR_SINGLE_RESTART'}
          $who=[Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $taskId=[string]$t.Principal.UserId
          $sid=if($taskId -match '^S-1-'){$taskId}else{
             (New-Object Security.Principal.NTAccount($taskId)).Translate([Security.Principal.SecurityIdentifier]).Value
          }
          if($sid -cne $who){throw 'F139_ORIGINAL_RESTART_SID_DRIFT'}
          $arg=[string]$t.Actions[0].Arguments
          function Extract([string]$key){
             $m=[regex]::Match($arg,'(?i)(?:^|\s)-'+$key+'\s+"([^"]+)"')
             if(-not $m.Success){throw 'F139_RESTART_TASK_ARGUMENT_DRIFT'}
             return $m.Groups[1].Value
          }
          $root=Extract 'RepositoryRoot'
          $db=Extract 'Database'
          $python=Extract 'PythonExe'
          if([IO.Path]::GetFullPath($db) -ine [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'FORGE-F139\state.sqlite'))){throw 'F139_RESTART_ORIGINAL_DB_DRIFT'}
          $checkout=(& git.exe -C $root rev-parse HEAD|Out-String).Trim()
          $dirty=(& git.exe -C $root status --porcelain --untracked-files=all|Out-String).Trim()
          if($checkout -cne $source -or $dirty.Length -ne 0){throw 'F139_RESTART_CHECKOUT_NOT_PROTECTED_CLEAN'}
          $existing=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction Stop|
              Where-Object{$_.CommandLine -and $_.CommandLine.Contains('f139.local_controller') -and $_.CommandLine.Contains($db)})
          if($existing.Count -ne 0){throw 'F139_RESTART_ANOTHER_CONTROLLER_ALREADY_ACTIVE'}
          $check=@'
          import pathlib,sqlite3,sys
          p=pathlib.Path(sys.argv[1]).resolve(strict=True)
          source=sys.argv[2];head=sys.argv[3]
          c=sqlite3.connect(p.as_uri()+"?mode=ro",uri=True)
          try:
              m=c.execute("SELECT source_sha,head_seq,head_hash,enabled,legacy_suspended FROM meta WHERE id=1").fetchone()
              assert m==(source,195,head,1,1)
              assert dict(c.execute("SELECT stage,COUNT(*) FROM tasks GROUP BY stage").fetchall())=={"QUARANTINED":11,"VERIFIED":18}
          finally:c.close()
          print("F139_G4_RESTART_SOURCE_LEDGER=PASS")
          '@
          & $python -B -c $check $db $source 'ffac6f9e7aae42016272a10cd74c317e83c046f90efb28ff90f20f53c7640f94'
          if($LASTEXITCODE -ne 0){throw 'F139_RESTART_LEDGER_INVALID'}
          Enable-ScheduledTask -TaskName $taskName -ErrorAction Stop|Out-Null
          $enabled=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          if([string]$enabled.State -ceq 'Ready'){
             Start-ScheduledTask -TaskName $taskName -ErrorAction Stop
          }elseif([string]$enabled.State -cne 'Running'){
             throw 'F139_RESTART_ENABLE_DID_NOT_ARM'
          }
          $running=$false
          for($i=0;$i -lt 18;$i++){
             Start-Sleep -Milliseconds 500
             $task=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
             $p=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction Stop|
               Where-Object{$_.CommandLine -and $_.CommandLine.Contains('f139.local_controller') -and $_.CommandLine.Contains($db)})
             if([string]$task.State -ceq 'Running' -and $p.Count -eq 1){
                $running=$true;break
             }
          }
          if(-not $running){throw 'F139_RESTART_ORIGINAL_PROCESS_NOT_CONFIRMED'}
          Write-Output 'F139_G4_ORIGINAL_SINGLE_TASK_RESTARTED=PASS'
          Write-Output 'F139_G4_ORIGINAL_CONTROLLER_PROCESS_COUNT=1'
          Write-Output 'F139_G4_OWNER_SOURCE_POLICY_PIN=PASS'
          Write-Output 'F139_G4_SCIENTIFIC_FIRST_USE=FALSE'
