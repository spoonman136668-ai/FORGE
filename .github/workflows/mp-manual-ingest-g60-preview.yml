name: MP G60 exact-source manual ingestion classification (read only)
on:
  push:
    branches: [review/mp-manual-ingest-g60-20261029]
    paths: ['.github/workflows/mp-manual-ingest-g60-preview.yml']
permissions:
  contents: read
jobs:
  classify:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 15
    steps:
      - name: Verify original-source classification and existing ledger only
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: 'Never'
          GH_PROMPT_DISABLED: '1'
          EXPECTED_MP_SOURCE: 'fd9d1d5cec917063a0a9d2d263affe7f0cce3f12'
          EXPECTED_BATCH_BLOB: '9b5c042a4fef661fd7cebf775bcb2b35082c496c'
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){throw 'G60_WRONG_RUNNER'}
          Remove-Item Env:GH_TOKEN,Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $repo='https://github.com/spoonman136668-ai/Mind-Palace.git'
          $root=Join-Path $env:RUNNER_TEMP ('mp-g60-classify-'+$env:GITHUB_RUN_ID)
          $src=Join-Path $root 'source'
          $batch='pilots/chat-history/nci04-mr29-p6o-20261021.batch.json'
          $guard=@('.ice/records.json','.ice/source-ledger.json','archive/index.json',
            '.ice/remote-bootstrap.json','.ice/remote-catalog.json','.ice/remote-index.ndjson',
            '.ice/chat-delta-state.json','.ice/project-state-capsules.json','.ice/project-dependency-graph.json')
          if(Test-Path -LiteralPath $root){throw 'G60_SCRATCH_COLLISION'}
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          try {
            & git clone --quiet --depth 1 --branch main $repo $src 2> (Join-Path $root 'clone-errors.log')
            if($LASTEXITCODE -ne 0){throw 'G60_PRIVATE_CLONE_UNAVAILABLE'}
            $actual=(& git -C $src rev-parse HEAD).Trim()
            if($actual -cne $env:EXPECTED_MP_SOURCE){throw 'G60_MAIN_SOURCE_DRIFT'}
            $actualBlob=(& git -C $src rev-parse ('HEAD:'+$batch)).Trim()
            if($actualBlob -cne $env:EXPECTED_BATCH_BLOB){throw 'G60_COLLECTOR_BATCH_CHANGED'}
            $before=@{}
            foreach($p in $guard){$before[$p]=(Get-FileHash -LiteralPath (Join-Path $src $p) -Algorithm SHA256).Hash}
            $ledger=Get-Content -LiteralPath (Join-Path $src '.ice/source-ledger.json') -Raw | ConvertFrom-Json
            $data=Get-Content -LiteralPath (Join-Path $src $batch) -Raw | ConvertFrom-Json
            if(@($data.candidates).Count -ne 2 -or @($data.sources | Where-Object { $_.role -eq 'primary' }).Count -ne 2){throw 'G60_NOT_EXACT_TWO_CANDIDATES'}
            foreach($primary in @($data.sources | Where-Object {$_.role -eq 'primary'})){
              if(@($ledger.entries | Where-Object {$_.source_ref -ceq $primary.ref}).Count -ne 0){throw 'G60_EXISTING_SOURCE_IDENTITY_REVIEW'}
            }
            $log=Join-Path $root 'classify.json'
            Push-Location $src
            try { & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'tools/collect.ps1' classify -InputPath $batch *> $log
              $code=$LASTEXITCODE
            } finally {Pop-Location}
            if($code -ne 0){throw 'G60_CLASSIFICATION_FAILED_PRIVATE_OUTPUT_WITHHELD'}
            $classified=Get-Content -LiteralPath $log -Raw | ConvertFrom-Json
            if([string]$classified.schema -cne 'mind-palace.collector-result.v1'){throw 'G60_CLASSIFIER_SCHEMA'}
            $c=$classified.result.counts
            Write-Host 'G60_PINNED_ACCEPTED_MAIN=PASS'
            Write-Host 'G60_SOURCE_BATCH_BLOB=PASS'
            Write-Host ('G60_CLASSIFIER_NEW='+[int]$c.new)
            Write-Host ('G60_CLASSIFIER_MERGE='+[int]$c.merge)
            Write-Host ('G60_CLASSIFIER_REVIEW='+[int]$c.review)
            Write-Host ('G60_CLASSIFIER_ARCHIVE='+[int]$c.archive)
            Write-Host ('G60_CLASSIFIER_SUPERSEDE='+[int]$c.supersede)
            Write-Host ('G60_CLASSIFIER_IGNORE='+[int]$c.ignore)
            foreach($p in $guard){if((Get-FileHash -LiteralPath (Join-Path $src $p) -Algorithm SHA256).Hash -cne $before[$p]){throw 'G60_PROTECTED_STATE_DRIFT'}}
            if(@(& git -C $src status --porcelain=v1 --untracked-files=no).Count -gt 0){throw 'G60_TRACKED_SOURCE_CHANGED'}
            Write-Host 'G60_NINE_PROTECTED_HASHES_UNCHANGED=PASS'
            Write-Host 'G60_PRODUCTION_WRITES=0'
            Write-Host 'G60_RESEARCH_SCIENCE_ADMISSION=NOT_GRANTED'
          } finally {
            if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop}
          }
      - name: Private scratch destroyed
        if: always()
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP ('mp-g60-classify-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop}
          if(Test-Path -LiteralPath $root){throw 'G60_SCRATCH_RETAINED'}
          Write-Host 'G60_PRIVATE_SCRATCH_CLEAN=PASS'
