name: Mass K4W read-only native FIT credit attribution (no simulator)
on:
  push:
    branches: [research/mass-lcrm01-k4w-native-credit-forensics-20261024]
    paths:
      - research/lcrm01/k4w_*
      - .github/workflows/lcrm01-k4w-fit-credit-forensics.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: k4w-retrospective-${{ github.sha }}
  cancel-in-progress: false
jobs:
  exact-source-original-fit-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout exact isolated mass research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify freeze preceded any attribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = research/mass-lcrm01-k4w-native-credit-forensics-20261024
          test "$(git rev-parse 6fc866b833bc4455a7ee3f23b7cc8eeace38ef6c^)" = e8401cb3aa59da0227732c259bddcef97ad48769
          git merge-base --is-ancestor 6fc866b833bc4455a7ee3f23b7cc8eeace38ef6c HEAD
          test "$(git hash-object research/lcrm01/k4w_frozen_credit_attribution.json)" = 15ecf279d5db3389c397f61f02a628a59e5bf66e
          python - <<'PY'
          import ast,pathlib
          src=pathlib.Path('research/lcrm01/k4w_fit_failure_diagnostic.py').read_text()
          root=ast.parse(src)
          assert not any(n.module and n.module.startswith("minigrid") for n in ast.walk(root) if isinstance(n,ast.ImportFrom))
          assert not any(alias.name.startswith("minigrid") for n in ast.walk(root) if isinstance(n,ast.Import) for alias in n.names)
          assert "DEV_public_outcomes" not in src and "CHECK_public_outcomes" not in src
          print('K4W_FROZEN_FIT_ONLY_SOURCE_AUDIT=PASS')
          PY
      - name: Download exact existing K4U original evidence, never source simulator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k4w"
          curl --fail --location --silent --show-error --retry 2 \
             -H "Authorization: Bearer $GH_TOKEN" \
             -H "Accept: application/vnd.github+json" \
             -H "X-GitHub-Api-Version: 2022-11-28" \
             'https://api.github.com/repos/spoonman136668-ai/FORGE/actions/artifacts/12563001215/zip' \
             -o "$RUNNER_TEMP/k4w/original-k4u.zip"
          printf 'c3ab85da20f559a1fa6cd43fa9151f2c1f921a03096d5112ace090a6f976e65f  %s\n' "$RUNNER_TEMP/k4w/original-k4u.zip" | sha256sum -c -
      - name: Re-evaluate only saved FIT information and exact Ygg native source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B research/lcrm01/k4w_fit_failure_diagnostic.py \
            --original "$RUNNER_TEMP/k4w/original-k4u.zip" \
            --output "$RUNNER_TEMP/k4w/k4w_source_only_receipt.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"k4w/k4w_source_only_receipt.json"
          x=json.loads(p.read_text())
          assert x["FIT_only"] and x["source_original_episodes_executed"]==0
          assert x["scientific_accepted"] is False and x["scientific_first_use"] is False
          assert sum(y["FIT_events"] for y in x["FIT_signal"].values())==6114
          assert x["Yggdrasil_original_native_fit"]["original_ygg_checkpoint_sha256"]=="9df4b58603491232361e7f2e0db755a1b1a7501f2455c840dd361fe3d3175acf"
          print("K4W_ARCHIVED_SOURCE_ATOMIC_CHECKPOINT_VERIFIED=PASS")
          PY
          git diff --exit-code
      - name: Preserve derived FIT-only diagnostic, no original rows
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-k4w-retrospective-original-fit-credit
          path: ${{ runner.temp }}/k4w/k4w_source_only_receipt.json
          if-no-files-found: warn
          retention-days: 90
