name: ACC56 authentic original U25 Levin bounded search
on:
  pull_request:
    paths:
      - 'docs/research/ACC-56-*'
      - 'research/acceleration/acc56_go_u25/**'
      - '.github/workflows/forge-acc56-u25-go.yml'
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 40
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check authentic original U25 and source-prereg-before-code
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 647ec6cc3412c19a011f978f12b487c657f80112 HEAD
          git merge-base --is-ancestor 269f161ed8db9db067bde6b9d80de05d51a57488 HEAD
          test "$(git hash-object docs/research/ACC-56-U25-STAGE-B-CPU-PREREG.md)" = 5645eeaf3b28d1b4a588d70134facacae6855b59
          test "$(git hash-object docs/research/ACC-56-U25-LEVIN-PREREG.md)" = 690d16f9cfb8214dba4f3db29d6491943bae5560
          test "$(git hash-object research/ac07_sourcefree/ac08_portfolio.py)" = 5126c860771fb024ccfc14c3f7ee8925edf29787
          python - <<'PY'
          import ast,pathlib
          t=ast.parse(pathlib.Path('research/ac07_sourcefree/ac08_portfolio.py').read_text())
          a=ast.literal_eval(next(v.value for v in t.body if isinstance(v,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='ORIGINAL_NAMES' for x in v.targets)))
          assert len(a)==30 and a[24]=='Levin-style bounded program search'
          print('ACC56_ORIGINAL_U25_SOURCE_PREREG_PASS')
          PY
          test "$(git hash-object research/acceleration/acc56_go_u25/go.mod)" = 952eaecc0b29297abfeab1e018f802012406bd14
          test "$(git hash-object research/acceleration/acc56_go_u25/main.go)" = a5fd3fe8bca3435e166491b4b1fe8d954a11a028
          test "$(git hash-object research/acceleration/acc56_go_u25/core_test.go)" = 8db889f08bcb15396eff466337503f35c330b61b
          test "$(git hash-object research/acceleration/acc56_go_u25/rss_linux.go)" = 6d0b62ca5b34f400649132f27e446cd180308bc4
          test "$(git hash-object research/acceleration/acc56_go_u25/rss_windows.go)" = 96e8010b630c97372e18dfeb41e3f0701970101f
      - name: Preserve 36 original research source screening records
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acceleration -p 'test_acc34_scoreboard.py' -v
          python -B research/acceleration/acc34_scoreboard.py --full "$RUNNER_TEMP/acc56-36.json"
      - name: Test vet build and run 80 genuinely cold native workers
        shell: bash
        run: |
          set -euo pipefail
          cd research/acceleration/acc56_go_u25
          go test -count=1 ./...
          go vet ./...
          BIN="$RUNNER_TEMP/acc56"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$BIN.exe"; fi
          go build -trimpath -o "$BIN" .
          "$BIN" -out "$RUNNER_TEMP/acc56-report.json"
      - name: Audit source and real child CPU and heldout predictions
        shell: bash
        run: |
          python - "$RUNNER_TEMP/acc56-report.json" <<'PY'
          import json,sys,math
          a=json.load(open(sys.argv[1]))
          assert a['Schema']=='forge.acc56.u25.stageb.nativego.v1'
          assert a['NativeChildCount']==len(a['Trials'])==80 and len(a['Cohorts'])==4
          assert not a['ScientificFirstUse'] and not a['NativeModelAcceleration']
          seen=set();pairs={}
          for r in a['Trials']:
            w=r['Worker'];k=(w['Family'],w['Arm'],w['Seed'])
            assert k not in seen;seen.add(k)
            assert w['Tasks']==64 and w['TrainPoints']==768 and w['TestPoints']==2048
            assert w['Candidates']==169 and w['EvaluatedPerTask']==64
            assert w['EvaluationReplications']==4096 and w['Evaluations']==64*64*12*4096
            assert w['PeakRSSBytes']>0 and r['CPUSeconds']>0 and r['WallSeconds']>0
            assert 0<=w['CorrectHeldout']<=2048 and 0<=w['CorrectTrain']<=768
            assert math.isfinite(w['HeldoutAccuracy'])
            assert all(len(w[f])==64 for f in ('InputSHA256','TruthSHA256','PredictionSHA256','SelectedSHA256'))
            p=(w['Family'],w['Seed']);v=(w['InputSHA256'],w['TruthSHA256'])
            assert p not in pairs or pairs[p]==v
            pairs[p]=v
          assert len(seen)==80 and len(pairs)==20
          print('ACC56_U25_80_REAL_NATIVE_CPU_RSS_WORKERS_PASS')
          print('ACC56_U25_CLASSIFICATION='+a['Classification'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc56-u25-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/acc56-report.json
            ${{ runner.temp }}/acc56-36.json
          retention-days: 30
          if-no-files-found: warn
  crossos:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: acc56-u25-*
          path: artifacts
      - shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('artifacts')
          a=json.loads((p/'acc56-u25-ubuntu-latest'/'acc56-report.json').read_text())
          b=json.loads((p/'acc56-u25-windows-latest'/'acc56-report.json').read_text())
          assert {a['OS'],b['OS']}=={'linux','windows'}
          key=lambda t:(t['Worker']['Family'],t['Worker']['Arm'],t['Worker']['Seed'])
          aa={key(t):t['Worker'] for t in a['Trials']}
          bb={key(t):t['Worker'] for t in b['Trials']}
          assert len(aa)==len(bb)==80 and set(aa)==set(bb)
          for k in aa:
            for field in ('InputSHA256','TruthSHA256','PredictionSHA256','SelectedSHA256','Candidates','EvaluatedPerTask','Evaluations','CorrectHeldout','CorrectTrain'):
              assert aa[k][field]==bb[k][field],(k,field)
          print('ACC56_U25_CROSSOS_80_OF_80_HELDOUT_PASS')
          print('ACC56_LINUX='+a['Classification'])
          print('ACC56_WINDOWS='+b['Classification'])
          print('ACC56_ACTUAL_NATIVE_MODEL_GENERALIZATION_UNVERIFIED')
          PY
