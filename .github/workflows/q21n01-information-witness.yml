name: Q21N-01 source-free exact information witness

on:
  push:
    branches: [research/q21n01-population-identifiability-20261023]
    paths:
      - '.github/workflows/q21n01-information-witness.yml'
      - 'research/q21n01_forge_native/population_witness.py'
      - 'research/q21n01_forge_native/test_population_witness.py'

permissions:
  contents: read

concurrency:
  group: q21n01-information-sourceonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sourceonly-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 12
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm exact Q21N-01 parent and unchanged source/role protocol
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='dd33d0d16ed2e097e5bde8fa5bb2328b677b8ca9'
          $common=(& git merge-base $base HEAD).Trim()
          if($LASTEXITCODE-ne0 -or $common-cne$base){throw 'Q21N01_INFORMATION_PARENT_DRIFT'}
          $expected=@(
            '.github/workflows/q21n01-information-witness.yml',
            'research/q21n01_forge_native/population_witness.py',
            'research/q21n01_forge_native/test_population_witness.py'
          )
          $actual=@(& git diff --name-only $base HEAD)
          if($LASTEXITCODE-ne0 -or $actual.Count-ne3 -or
             (Compare-Object $expected $actual)){throw 'Q21N01_INFORMATION_SCOPE_DRIFT'}
          $pins=@{
            'research/q21_information_budget/FROZEN_PROTOCOL.json'='d7c35c10f80b36a758b78e0deedf36d74bf5767d'
            'research/q21n01_forge_native/FROZEN_PROTOCOL.json'='2b913a183043d06fd9eac7b18a36499a89517a49'
            'research/q21n01_forge_native/generator.py'='e1889bf12e0a1fa1db5b202c2fae6a6e6cd1f612'
            'research/q21n01_forge_native/population_witness.py'='a13cbcb7f0662e98b36690eea4eafeba8bcafd26'
            'research/q21n01_forge_native/test_population_witness.py'='b713bef999c2f78fa4ccb9e576ee645ee333ba46'
          }
          foreach($path in $pins.Keys){
            $sha=(& git rev-parse ('HEAD:'+$path)).Trim()
            $bytes=(& git hash-object --no-filters -- $path).Trim()
            if($LASTEXITCODE-ne0 -or $sha-cne$pins[$path] -or
               $bytes-cne$pins[$path]){throw ('Q21N01_FROZEN_SOURCE_DRIFT_'+$path)}
          }
          Write-Host 'Q21N01_ALL_IMMUTABLE_SOURCE_OBJECTS=PASS'
      - name: Exact-law public history entropy proof with no frozen cohorts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B -m unittest discover -s research/q21n01_forge_native -p 'test_*.py' -v
          if($LASTEXITCODE-ne0){throw 'Q21N01_EXACT_BAYES_TEST_FAILED'}
          python -B research/q21n01_forge_native/population_witness.py
          if($LASTEXITCODE-ne0){throw 'Q21N01_BAYES_WITNESS_FAILED'}
          Write-Host 'Q21N01_INFORMATION_SUFFICIENCY_THEORY=PASS'
          Write-Host 'Q21N01_TRAINING_PERFORMED=NO'
          Write-Host 'Q21N01_COHORTS_GENERATED=ZERO'
          Write-Host 'Q21N01_FSA_AUTHORIZATION=NOT_REQUESTED'
      - name: One original Go regression, vet and build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo Q21N01_FULL_STANDARD_REGRESSION=PASS
      - name: Clean source, no science first-use
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dirty=@(& git status --porcelain --untracked-files=all)
          if($dirty.Count-ne0){throw 'Q21N01_WORKTREE_DIRTY'}
          Write-Host 'Q21N01_WORKTREE_CLEAN=PASS'
          Write-Host 'Q21N01_FIRST_USE=NOT_PERFORMED'
