name: FORGE R18 D1 parser-only diagnostic
on:
  push:
    branches: [ops/forge-r18-one-time-install-20261015]
    paths: ['.github/workflows/forge-r18-parse-diagnose-readonly.yml']
permissions:
  contents: read
jobs:
  explain-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_ALT: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ALT: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm failed migration state and test EXPLAIN only
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/d1retention"
          python3 - <<'PY'
          import os,install_remote as m,urllib.request,urllib.error,json,re
          token=os.environ.get("CF_TOKEN_PRIMARY") or os.environ.get("CF_TOKEN_ALT")
          account=(os.environ.get("CF_ACCOUNT_SECRET") or
                   os.environ.get("CF_ACCOUNT_VAR") or os.environ.get("CF_ACCOUNT_ALT"))
          api=m.Cloudflare(account,token)
          dbid=m.single_deployed_database(api)
          before,oldhash=m.schema_snapshot(api,dbid)
          if before:raise SystemExit("R18_PARSE_BLOCKED=ARCHIVE_NAMESPACE_NONEMPTY")
          rows=m.sql_query(api,dbid,"SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name LIMIT 2")
          if len(rows)!=1:raise SystemExit("R18_PARSE_BLOCKED=AMBIGUOUS_EXISTING_SCHEMA")
          tab=rows[0].get("name")
          if not isinstance(tab,str) or not re.fullmatch("[A-Za-z_][A-Za-z0-9_]{0,63}",tab):
              raise SystemExit("R18_PARSE_BLOCKED=INVALID_IDENTIFIER")
          sqls=[
            "EXPLAIN CREATE TABLE forge_r18_probe_test(k TEXT);",
            ('EXPLAIN CREATE TRIGGER forge_r18_probe_trigger BEFORE INSERT ON "'+
             tab+'" BEGIN SELECT 1; END;'),
          ]
          for label,sql in zip(("TABLE","TRIGGER"),sqls):
              req=urllib.request.Request("https://api.cloudflare.com/client/v4/accounts/"+
                  account+"/d1/database/"+dbid+"/query",
                  headers={"Authorization":"Bearer "+token,
                           "Content-Type":"application/json","Accept":"application/json"},
                  data=json.dumps({"sql":sql,"params":[]}).encode(),method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=12) as resp:
                      raw=resp.read(16385)
                  ok=len(raw)<=16384 and json.loads(raw).get("success") is True
                  print("R18_EXPLAIN_"+label+"="+("OK_NO_DDL" if ok else "BAD_RESPONSE"))
              except urllib.error.HTTPError as ex:
                  # Never print raw Cloudflare body. Classify only known SQL errors.
                  message=ex.read(4097).decode("utf-8","replace").lower()
                  kind=("INCOMPLETE_INPUT" if "incomplete input" in message else
                        "SYNTAX" if "syntax error" in message else
                        "PERMISSION" if "permission" in message or "auth" in message else
                        "OTHER")
                  print("R18_EXPLAIN_"+label+"=HTTP_"+str(ex.code)+"_"+kind)
              except Exception:
                  print("R18_EXPLAIN_"+label+"=TRANSPORT_OR_SHAPE_ERROR")
          after,newhash=m.schema_snapshot(api,dbid)
          if after or newhash!=oldhash:
              raise SystemExit("R18_PARSE_BLOCKED=SCHEMA_DRIFT")
          print("R18_PARSE_DIAGNOSTIC=NON_MUTATING_SCHEMA_IDENTICAL")
          PY
