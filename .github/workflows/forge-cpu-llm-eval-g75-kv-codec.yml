name: FORGE CPU LLM Evaluation G75 source-free compressed KV feasibility
on:
  push:
    branches: [research/cpu-llm-evaluation-g75-kv-compression-screen-20261030]
    paths:
      - '.github/workflows/forge-cpu-llm-eval-g75-kv-codec.yml'
      - 'research/cpu_g75/**'
permissions:
  contents: read
concurrency:
  group: forge-cpu-llm-evaluation-g75-sourcefree
  cancel-in-progress: false
jobs:
  qualified-sourcefree:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original prereg separately committed before G75 code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD
          git merge-base --is-ancestor 64db89c76b93581d36dae3cc90800535d866612e HEAD
          test "$(git rev-parse HEAD:docs/research/CPU-G75-SYNTHETIC-KV-INT8-CODEC-PREEXEC-20261030.md)" = "0cabe80a191980c92b6d3f1a0f8ded7b054da0d0"
          git diff --exit-code 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD -- research/llm_g54 research/llm_g55 research/llm_g56 research/llm_g57 research/llm_g58 research/llm_g59 research/llm_g60 research/llm_g61 research/llm_g62 research/llm_g63 research/llm_g64 research/llm_g65 research/llm_g66 research/llm_g67 research/llm_g68 research/llm_g70
          git diff --check 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD
          python -B -m py_compile research/cpu_g75/g75_kv_codec.py research/cpu_g75/test_g75_kv_codec.py
          echo CPU_G75_IMMUTABLE_PREREG_AND_SOURCE=PASS
      - name: Install only locked source-free numerical packages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'psutil==7.1.3'
          python -m pip check
          python -m pip freeze > cpu_g75_sourcefree_environment.txt
      - name: Run exact source-frozen negative controls and paired feasibility
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/cpu_g75 -p 'test_g75_kv_codec.py' -v
          python research/cpu_g75/g75_kv_codec.py
          python - <<'PY'
          import json
          r=json.load(open("cpu_g75_sourcefree_result.json",encoding="utf-8"))
          assert r["gate"]=="CPU_G75"
          assert r["engineering"]=="PASS" and r["correctness"]=="PASS_SHAPE_MEMORY_CONTROLS_ONLY"
          assert r["feasibility"] in ("NO_GO_FEASIBILITY","FEASIBILITY_GO_FOR_SEPARATE_ORIGINAL_PREREG")
          assert len(r["measurements"])==3
          assert all(len(a["trials"])==10 for a in r["measurements"])
          assert not r["original_pretrained_model_executed"] and r["synthetic_native_shaped_only"]
          assert not r["promotion_allowed"] and r["scientific_acceptance"]=="NOT_GRANTED"
          print("CPU_G75_AUTHENTIC_NATIVE_SHAPE_ONLY=PASS")
          print("CPU_G75_FROZEN_FEASIBILITY="+r["feasibility"])
          PY
      - name: Preserve original source-free results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-g75-kv-codec-sourcefree-${{ runner.os }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            cpu_g75_sourcefree_result.json
            cpu_g75_sourcefree_environment.txt
