name: ITD02 TW3B development-only action-slot qualification
on:
  push:
    branches:
      - research/itd02-tw4-noevent-action-slots-20261025
permissions:
  contents: read
jobs:
  focused-dev:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Exact source identity and synthetic focused coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor 93456cea8390524de66ed67aee2190f78a2ddd2a HEAD
          if ($LASTEXITCODE -ne 0) { throw 'TW3B_PARENT_IDENTITY_DRIFT' }
          if ((git hash-object research/itd02_typed_world/TW3B_FROZEN_NO_EVENT_ACTION_SLOT_DEV.json).Trim() -cne '2a6ce8372126acaa43c8b2f4802611f9f292f9d7') { throw 'TW3B_FROZEN_PROTOCOL_CHANGED' }
          if ((git hash-object research/itd02_typed_world/TW3_ORIGINAL_ACTION_CONTROL_PREFLIGHT.json).Trim() -cne 'a240be2848fda662de2232fca1d84734ada4d269') { throw 'TW3_ORIGINAL_PROTOCOL_CHANGED' }
          $env:PYTHONDONTWRITEBYTECODE='1'
          $env:PYTHONNOUSERSITE='1'
          python -B -m unittest discover -s research/itd02_typed_world -p 'test_tw*_dev_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'TW3B_FOCUSED_DEV_FAILED' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'TW3B_WORKTREE_DRIFT' }
          Write-Output 'TW3B_SOURCE_FREE_ACTION_SLOT_TESTS=PASS'
          Write-Output 'TW3B_ORIGINAL_RPG_ACTIONS=ZERO'
          Write-Output 'TW3B_FSA_FIRST_USE=DENIED'
  final-forge-regression-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Original FORGE isolation, FSA and F139 regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py'
          python3 -B isolationguard/check.py
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py'
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py'
          python3 -B -m unittest discover -s f139 -p 'test_*.py'
      - name: One full Go regression, race, vet and build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
          git diff --exit-code
          echo 'TW3B_ONE_FINAL_FULL_LINUX_REGRESSION=PASS'
