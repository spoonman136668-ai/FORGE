name: FORGE F139 native Windows controller qualification
# PR-only source tests. No scheduled controller or GitHub workflow handoffs.
on:
  pull_request:
    branches: [main]
    paths:
      - 'f139/**'
      - 'scripts/Install-FORGE-F139.ps1'
      - 'scripts/Run-FORGE-F139.ps1'
      - '.github/workflows/forge-f139-development-worker.yml'
      - '.github/workflows/forge-f139-source-qualification.yml'
      - 'docs/F139-UNIFIED-FORGE-CONTROLLER.md'
permissions:
  contents: read
concurrency:
  group: forge-f139-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native SQLite persistence, automatic two-ticket succession and crash safety
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s f139 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F139_NATIVE_REGRESSION_FAILED' }
          python -B -m compileall -q f139
          if ($LASTEXITCODE -ne 0) { throw 'F139_SYNTAX_FAILED' }
          Write-Host 'F139_LOCAL_SQLITE_AND_RESTART_PROOF=PASS'
          Write-Host 'F139_CLOUDFLARE_CONTROLLER=ABSENT'
          Write-Host 'F139_SCIENTIFIC_ORIGINALS=ZERO'
      - name: Verify native Windows PowerShell 5.1 strict-mode dry run
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5) {
            throw 'F139_WINDOWS_DESKTOP_RUNTIME_UNEXPECTED'
          }
          $before = @(Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction SilentlyContinue)
          $dryRun = & ./scripts/Install-FORGE-F139.ps1 6>&1 | Out-String
          if (-not $?) { throw 'F139_WINDOWS_DESKTOP_DRY_RUN_FAILED' }
          if ($dryRun -notmatch 'F139_BATTERY_ADMISSION_CONFIG=PASS' -or
              $dryRun -notmatch 'F139_INSTALL=DRY_RUN_NO_CHANGES') {
            throw 'F139_BATTERY_POWER_POLICY_NOT_QUALIFIED'
          }
          Write-Host 'F139_BATTERY_POWER_POLICY_WINDOWS_51=PASS'
          $after = @(Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction SilentlyContinue)
          if ($before.Count -ne $after.Count) { throw 'F139_WINDOWS_TASK_MUTATED_BY_DRY_RUN' }
          Write-Host 'F139_WINDOWS_POWERSHELL_51_DRY_RUN=PASS'
      - name: Exercise actual disabled launcher under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $scratch = Join-Path $env:RUNNER_TEMP 'f139-inert-launcher-probe'
          if (Test-Path -LiteralPath $scratch) { throw 'F139_PROBE_DIRECTORY_ALREADY_EXISTS' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $db = Join-Path $scratch 'state.sqlite'
          $key = Join-Path $scratch 'probe.dpapi.xml'
          $log = Join-Path $scratch 'logs\controller.log'
          $sha = (& git rev-parse HEAD).Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'F139_PROBE_SOURCE_INVALID' }
          & python -B -m f139.local_controller --db $db init --source-sha $sha
          if ($LASTEXITCODE -ne 0) { throw 'F139_PROBE_DB_INIT_FAILED' }
          $secret = ConvertTo-SecureString ('f139-ephemeral-test-only-' + ('x' * 48)) -AsPlainText -Force
          $secret | Export-Clixml -LiteralPath $key
          $pythonExe = (Get-Command python -ErrorAction Stop).Source
          $src = (Get-Location).Path
          $launcher = Join-Path $src 'scripts\Run-FORGE-F139.ps1'
          $args = @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass',
            '-File',('"' + $launcher + '"'),
            '-PythonExe',('"' + $pythonExe + '"'),
            '-RepositoryRoot',('"' + $src + '"'),
            '-Database',('"' + $db + '"'),
            '-EncryptedKeyFile',('"' + $key + '"'),'-PollSeconds','15') -join ' '
          $child = Start-Process -FilePath 'powershell.exe' -ArgumentList $args -PassThru -WindowStyle Hidden
          try {
            $observed = $false
            foreach ($i in 1..25) {
              Start-Sleep -Seconds 1
              $child.Refresh()
              if ($child.HasExited) { throw ('F139_NATIVE_LAUNCHER_PREMATURE_EXIT=' + $child.ExitCode) }
              if (Test-Path -LiteralPath $log) {
                $body = [IO.File]::ReadAllText($log)
                if ($body -match 'F139_CONTROLLER_INACTIVE_OR_LEGACY_RUNNING') { $observed = $true; break }
              }
            }
            if (-not $observed) { throw 'F139_EXPECTED_DISABLED_MARKER_ABSENT' }
            $statusText = & python -B -m f139.local_controller --db $db status
            if ($LASTEXITCODE -ne 0) { throw 'F139_PROBE_STATUS_FAILURE' }
            $state = $statusText | ConvertFrom-Json
            if ($state.status.meta.enabled -ne 0 -or $state.status.meta.legacy_suspended -ne 0 -or
                $state.status.meta.head_seq -ne 0 -or @($state.status.tasks).Count -ne 0) {
              throw 'F139_PROBE_DISABLED_DB_MUTATED'
            }
            Write-Host 'F139_POWERSHELL_51_NATIVE_STDERR_LOGGED=PASS'
            Write-Host 'F139_DISABLED_CONTROLLER_PROCESS_ALIVE=PASS'
          } finally {
            $child.Refresh()
            if (-not $child.HasExited) { Stop-Process -Id $child.Id -Force -ErrorAction Stop }
            $child.WaitForExit()
            Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue
          }
      - name: Check native Windows task installation is safe by default
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($file in @('scripts/Install-FORGE-F139.ps1','scripts/Run-FORGE-F139.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "F139_POWERSHELL_PARSE_FAILED:$file" }
          }
          & ./scripts/Install-FORGE-F139.ps1
          if (-not $?) { throw 'F139_INERT_INSTALL_CHECK_FAILED' }
          Write-Host 'F139_WINDOWS_TASK_INSTALL_DEFAULT_INERT=PASS'
