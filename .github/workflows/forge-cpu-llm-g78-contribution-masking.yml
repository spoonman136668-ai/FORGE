name: FORGE CPU LLM G78 original GPT2 selective FFN half-masking feasibility
on:
  push:
    branches: [research/cpu-llm-g78-contribution-masking-20261030]
    paths:
      - '.github/workflows/forge-cpu-llm-g78-contribution-masking.yml'
      - 'research/cpu_g78/**'
permissions:
  contents: read
concurrency:
  group: forge-cpu-g78-original-exactzero
  cancel-in-progress: false
jobs:
  frozen-source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen prereg original parent, no prior research changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD
          git merge-base --is-ancestor f00c272eeda7311a42a18c9fe4c5bec46f8aa9e3 HEAD
          test "$(git rev-parse HEAD:docs/research/CPU-G78-GPT2-FFN-CONTRIBUTION-PREREG-20261030.md)" = "$(git rev-parse f00c272eeda7311a42a18c9fe4c5bec46f8aa9e3:docs/research/CPU-G78-GPT2-FFN-CONTRIBUTION-PREREG-20261030.md)"
          git diff --exit-code 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD -- research/llm_g54 research/llm_g55 research/llm_g56 research/llm_g57 research/llm_g58 research/llm_g59 research/llm_g60 research/llm_g61 research/llm_g62 research/llm_g63 research/llm_g64 research/llm_g65 research/llm_g66 research/llm_g67 research/llm_g68 research/llm_g70
          git diff --check 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD
          python -B -m py_compile research/cpu_g78/g78_contribution.py research/cpu_g78/test_g78_contribution.py
          python -B -m unittest discover -s research/cpu_g78 -p test_g78_contribution.py -v
          echo CPU_G78_FROZEN_SOURCE_ADMISSION=PASS
  original-model-activation-survey:
    needs: frozen-source-admission
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin authentic original FP32 GPT2 CPU environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install --disable-pip-version-check 'transformers==4.48.3' 'huggingface_hub==0.30.2' 'safetensors==0.5.3' 'tokenizers==0.21.1' 'psutil==7.1.3'
          python -m pip check
          python -m pip freeze > cpu_g78_original_environment.txt
      - name: Survey 1152 original heldout FP32 GELU contribution-ranked half-masking projections
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/cpu_g78/g78_contribution.py
          python - <<'PY'
          import json
          r=json.load(open("cpu_g78_original_result.json"))
          assert r["gate"]=="CPU_G78"
          assert r["summary"]["original_activation_pairs"]==1152
          assert r["engineering"]=="PASS"
          assert r["summary"]["original_token_positions"]==96
          assert r["summary"]["original_activation_pairs"]==1152
          assert r["summary"]["retained_per_vector"]==1536 and r["summary"]["masked_per_vector"]==1536
          assert r["feasibility"] in ("GO_FOR_SEPARATE_ORIGINAL_SPARSE_ENGINE","NO_GO_FEASIBILITY")
          assert r["performance"]=="NOT_MEASURED"
          assert r["scientific_acceptance"]=="NOT_GRANTED" and not r["promotion_allowed"]
          print("CPU_G78_ORIGINAL_PRETRAINED_FFN_CUSTODY=PASS")
          print("CPU_G78_FROZEN_FEASIBILITY="+r["feasibility"])
          PY
      - name: Preserve original evidence including blocked errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-g78-original-gpt2-contribution-masking
          retention-days: 30
          if-no-files-found: warn
          path: |
            cpu_g78_original_result.json
            cpu_g78_original_environment.txt
