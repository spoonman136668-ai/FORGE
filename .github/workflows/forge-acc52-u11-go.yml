name: ACC52 original U11 ternary arithmetic Go qualification
on:
  pull_request:
    paths:
      - 'docs/research/ACC-52-*'
      - 'research/acceleration/acc52_go_u11/**'
      - '.github/workflows/forge-acc52-u11-go.yml'
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 40
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original U11 source and prereg-before-code
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 91536cc99f624f6f68ab8b34f45bd636bb98ba3a HEAD
          test "$(git hash-object docs/research/ACC-52-U11-TERNARY-PREREG.md)" = 60be91c103fc093a418c276fbff3bc17aad26d7a
          test "$(git hash-object research/ac07_sourcefree/ac08_portfolio.py)" = 5126c860771fb024ccfc14c3f7ee8925edf29787
          test "$(git hash-object research/acceleration/acc52_go_u11/go.mod)" = 146e7bd24bdc508b536f1b40c6b58922ab77d75f
          test "$(git hash-object research/acceleration/acc52_go_u11/main.go)" = 89f0b5ded1d45749a4486940daa51101d24cd1f7
          test "$(git hash-object research/acceleration/acc52_go_u11/rss_linux.go)" = 6d0b62ca5b34f400649132f27e446cd180308bc4
          test "$(git hash-object research/acceleration/acc52_go_u11/rss_windows.go)" = 96e8010b630c97372e18dfeb41e3f0701970101f
          python - <<'PY'
          import ast,pathlib
          a=ast.parse(pathlib.Path('research/ac07_sourcefree/ac08_portfolio.py').read_text())
          n=ast.literal_eval(next(v.value for v in a.body if isinstance(v,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='ORIGINAL_NAMES' for t in v.targets)))
          assert len(n)==30 and n[10]=='ternary arithmetic kernels'
          print('ACC52_AUTHENTIC_U11_SOURCE_PREREG=PASS')
          PY
      - name: Preserve original 36 candidate negative source checks
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acceleration -p 'test_acc34_scoreboard.py' -v
          python -B research/acceleration/acc34_scoreboard.py --full "$RUNNER_TEMP/acc52-36.json"
      - name: Compile and execute 80 actual cold U11 workers
        shell: bash
        run: |
          set -euo pipefail
          cd research/acceleration/acc52_go_u11
          go test -count=1 ./...
          go vet ./...
          BIN="$RUNNER_TEMP/acc52"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$BIN.exe"; fi
          go build -trimpath -o "$BIN" .
          "$BIN" -out "$RUNNER_TEMP/acc52-report.json"
      - name: Audit all 80 child receipts and exact outputs
        shell: bash
        run: |
          python - "$RUNNER_TEMP/acc52-report.json" <<'PY'
          import json,sys,math
          a=json.load(open(sys.argv[1]))
          assert a['Schema']=='forge.acc52.u11.go.v1'
          assert a['NativeChildCount']==len(a['Rows'])==80 and len(a['Cohorts'])==4
          assert not a['NativeModelSpeedup'] and not a['ScientificFirstUse']
          keys=set();pairs={}
          for row in a['Rows']:
            w=row['Worker'];k=(w['Mode'],w['Regime'],w['Seed'])
            assert k not in keys;keys.add(k)
            assert w['Episodes']==128 and w['Dots']==128*256
            assert w['PeakRSSBytes']>0 and row['CPUSeconds']>0 and row['WallSeconds']>0
            assert w['TruthSHA256']==w['OutputSHA256']
            assert len(w['InputSHA256'])==64
            pair=(w['Regime'],w['Seed']);v=(w['InputSHA256'],w['TruthSHA256'])
            assert pair not in pairs or pairs[pair]==v
            pairs[pair]=v
          assert len(keys)==80 and len(pairs)==20
          for c in a['Cohorts']:
            assert math.isfinite(c['CPURatio']) and math.isfinite(c['RSSRatio'])
          print('ACC52_U11_80_REAL_CPU_RSS_WORKERS=PASS')
          print('ACC52_U11_RESULT='+a['Classification'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc52-u11-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/acc52-report.json
            ${{ runner.temp }}/acc52-36.json
          retention-days: 30
          if-no-files-found: warn
  crossos:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: acc52-u11-*
          path: artifacts
      - shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('artifacts')
          a=json.loads((p/'acc52-u11-ubuntu-latest'/'acc52-report.json').read_text())
          b=json.loads((p/'acc52-u11-windows-latest'/'acc52-report.json').read_text())
          assert {a['OS'],b['OS']}=={'linux','windows'}
          key=lambda t:(t['Worker']['Mode'],t['Worker']['Regime'],t['Worker']['Seed'])
          aa={key(r):r['Worker'] for r in a['Rows']}
          bb={key(r):r['Worker'] for r in b['Rows']}
          assert len(aa)==len(bb)==80 and set(aa)==set(bb)
          for k in aa:
            for f in ('InputSHA256','TruthSHA256','OutputSHA256','LogicalBytes','Dots'):
              assert aa[k][f]==bb[k][f],(k,f)
          print('ACC52_U11_CROSSOS_80_OF_80_EXACT_OUTPUT_PASS')
          print('ACC52_LINUX='+a['Classification'])
          print('ACC52_WINDOWS='+b['Classification'])
          print('ACC52_NATIVE_MODEL_SPEEDUP=UNVERIFIED')
          PY
