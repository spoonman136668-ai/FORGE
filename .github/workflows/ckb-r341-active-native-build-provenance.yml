name: R341 original CKB native running binary Go build provenance only
on:
  push:
    branches: [audit/ckb-r341-active-native-build-id-20261025]
    paths: [.github/workflows/ckb-r341-active-native-build-provenance.yml]
permissions:
  contents: read
concurrency:
  group: r341-original-ckb-active-binary-identity
  cancel-in-progress: false
jobs:
  original-native-image:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    steps:
      - name: Read Go binary build identity, not native database or scheduler records
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-StrictMode -Version 3.0
          $u=[Security.Principal.WindowsIdentity]::GetCurrent()
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF_NAME -cne 'audit/ckb-r341-active-native-build-id-20261025' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $u.Name -ine 'LINKDEADKB\camar' -or
             ![Security.Principal.WindowsPrincipal]::new($u).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){
             throw 'R341_ORIGINAL_ELEVATED_WINDOWS_OWNER_REQUIRED'
          }
          $original=@(Get-CimInstance Win32_Process -Filter "Name='ckb-plane.exe'" -ErrorAction Stop)
          if($original.Count -ne 1){throw 'R341_ORIGINAL_PROCESS_COUNT_CHANGED'}
          $image=[string]$original[0].ExecutablePath
          $observed=(Get-FileHash -LiteralPath $image -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
          if($observed -cne '82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'){
             throw 'R341_ORIGINAL_R303_IMAGE_IDENTITY_CHANGED'
          }
          $config='C:\Users\camar\GolandProjects\ckb-plane\config\autonomy.yaml'
          $cfg=(Get-FileHash -LiteralPath $config -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
          if($cfg -cne 'a14f210a146de9bd248bb4cfdc2e156b19c985a6c964a91881c4391f0a0190dc'){
             throw 'R341_ORIGINAL_EFFECTIVE_CONFIG_IDENTITY_CHANGED'
          }
          $saved=$ErrorActionPreference
          try {
             $ErrorActionPreference='Continue'
             $lines=@(& go.exe version -m $image 2>&1)
             $rc=$LASTEXITCODE
          } finally { $ErrorActionPreference=$saved }
          if($rc -ne 0){throw 'R341_RUNNING_IMAGE_GO_BUILD_METADATA_UNAVAILABLE'}
          $gover=''
          $vcs=''
          $mod=''
          $modified=''
          $builds=@()
          foreach($line in $lines){
             $t=[string]$line
             if($t -match '(?<![A-Za-z0-9])go1\.[0-9]+(?:\.[0-9]+)?'){$gover=$Matches[0]}
             elseif($t -match '^\s*mod\s+([A-Za-z0-9_.\-/]+)\s+'){
                $mod=$Matches[1]
             }
             elseif($t -match '^\s*build\s+vcs\.revision=([0-9a-f]{40})\s*$'){
                $vcs=$Matches[1]
             }
             elseif($t -match '^\s*build\s+vcs\.modified=(true|false)\s*$'){
                $modified=$Matches[1]
             }
             elseif($t -match '^\s*build\s+(GOOS|GOARCH|CGO_ENABLED|vcs)=(Windows|windows|amd64|0|1|git)\s*$'){
                $builds+=($Matches[1]+'='+$Matches[2])
             }
          }
          Write-Output ('R341_GO_VERSION_CAPTURED='+[string]($gover -ne ''))
          Write-Output ('R341_MODULE_NAME_CAPTURED='+[string]($mod -ne ''))
          Write-Output ('R341_GO_METADATA_LINE_COUNT='+$lines.Count)
          if($gover -notmatch '^go1\.[0-9]+(?:\.[0-9]+)?$' -or
             $mod -cnotmatch '^[A-Za-z0-9_.\-/]{1,120}$'){
             throw 'R341_GO_BUILD_METADATA_PARSING_INCOMPLETE'
          }
          Write-Output 'R341_ORIGINAL_NATIVE_IMAGE_AND_EFFECTIVE_CONFIG_IDENTITY=PASS'
          Write-Output ('R341_RUNNING_GO_VERSION='+$gover)
          Write-Output ('R341_RUNNING_GO_MODULE='+$mod)
          Write-Output ('R341_RUNNING_GO_VCS_REVISION='+$(if($vcs){$vcs}else{'NOT_EMBEDDED'}))
          Write-Output ('R341_RUNNING_GO_VCS_MODIFIED='+$(if($modified){$modified}else{'NOT_EMBEDDED'}))
          foreach($entry in $builds){Write-Output ('R341_RUNNING_GO_BUILD_FLAG='+$entry)}

          # Identify only non-sensitive source file identities alongside the
          # existing original executable. No live DB reads, queue inspection,
          # original file writes or process control.
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $paths=@($root, (Join-Path $root 'snapshot\source'))
          $candidateRoots=@($paths|Where-Object {
             (Test-Path -LiteralPath (Join-Path $_ 'go.mod') -PathType Leaf) -and
             (Test-Path -LiteralPath (Join-Path $_ 'internal\plane\autonomy_controls.go') -PathType Leaf) -and
             (Test-Path -LiteralPath (Join-Path $_ 'internal\plane\webui_bridge.go') -PathType Leaf)
          })
          if($candidateRoots.Count -ne 1){
             Write-Output ('R343_ORIGINAL_HOST_GO_CHECKOUT_FOUND='+$candidateRoots.Count)
             Write-Output 'R343_INSTALLED_PROCESS_SOURCE_EQUIVALENCE=UNVERIFIED'
          } else {
             $tree=[string]$candidateRoots[0]
             $mod=[IO.File]::ReadAllText((Join-Path $tree 'go.mod'))
             if($mod -notmatch '(?m)^module ckb-plane\s*$' -or
                $mod -notmatch '(?m)^go 1\.25\.5\s*$'){
                throw 'R343_LOCAL_SOURCE_MODULE_IDENTITY_DRIFT'
             }
             foreach($item in @(
               @{name='autonomy_controls.go'; baseline='2970635f597a2d5f00a7c7468d87b5bae0af27db'; patched='daa7ead6648b0dc58765418c58f570a289bc12ce'},
               @{name='webui_bridge.go';baseline='2dff3a64ca8e5f85a219edea699c6d35fe283300';patched='b929de2ca590589568b77de3355490af454d42c4'},
               @{name='autonomy.go';baseline='f5d99410c80627234c4d38df31a65d82d5087d53';patched=''}
             )){
                $file=Join-Path $tree ('internal\plane\'+[string]$item.name)
                $info=Get-Item -LiteralPath $file -Force -ErrorAction Stop
                if($info.PSIsContainer -or
                   ($info.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){
                   throw 'R343_SOURCE_PATH_NOT_REGULAR_FILE'
                }
                $prior=$ErrorActionPreference
                try{$ErrorActionPreference='Continue';$blob=@(& git.exe hash-object -- $file 2>&1);$rc=$LASTEXITCODE}
                finally{$ErrorActionPreference=$prior}
                if($rc -ne 0 -or $blob.Count -ne 1 -or
                   [string]$blob[0] -notmatch '^[0-9a-f]{40}$'){
                   throw 'R343_SOURCE_BLOB_FINGERPRINT_UNAVAILABLE'
                }
                $hash=[string]$blob[0]
                Write-Output ('R343_LOCAL_SOURCE_'+[string]$item.name+'_MATCH_FROZEN_BASELINE='+[string]($hash -ceq [string]$item.baseline))
                if([string]$item.patched -ne ''){
                   Write-Output ('R343_LOCAL_SOURCE_'+[string]$item.name+'_MATCH_R326_PATCHED='+[string]($hash -ceq [string]$item.patched))
                }
             }
             Write-Output 'R343_ORIGINAL_NATIVE_SOURCE_CHECKOUT_MODULE_VALID=PASS'
             Write-Output 'R343_INSTALLED_BINARY_SOURCE_EQUIVALENCE=NOT_PROVEN_BY_SOURCE_HASHES'
          }

          Write-Output 'R341_NO_NATIVE_DB_QUEUE_TASK_OR_CONTROLLER_MUTATION=TRUE'
