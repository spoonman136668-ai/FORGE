name: Optimizer O21 original native R7 conventional parity (source-only)
on:
  push:
    branches: [research/optimizer-o21-r7-nonlinear-equivalence-20261024]
    paths:
      - "research/optimizer_o21_s0/**"
      - ".github/workflows/optimizer-o21-native-r7-equivalence.yml"
  pull_request:
    paths:
      - "research/optimizer_o21_s0/**"
      - ".github/workflows/optimizer-o21-native-r7-equivalence.yml"
permissions:
  contents: read
jobs:
  source-only-parity:
    name: pinned-r7-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 15
          persist-credentials: false
          path: forge
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/Yggdrasil
          ref: a509c23d8b0d0a11d3d5d38eaa70656c7ab07ddd
          persist-credentials: false
          path: pinned_ygg
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify frozen-first lineage and immutable independent original source
        shell: bash
        run: |
          set -euo pipefail
          cd forge
          test "$(git rev-parse c928077de5ace5ed28d41f1461a5b57b4e56ba9f^)" = "8eca700c39223e176dea55f488b6f3397ce4e27a"
          test "$(git show --format= --name-only c928077de5ace5ed28d41f1461a5b57b4e56ba9f)" = "research/optimizer_o21_s0/PREREG.md"
          git merge-base --is-ancestor c928077de5ace5ed28d41f1461a5b57b4e56ba9f HEAD
          git diff --name-only 8eca700c39223e176dea55f488b6f3397ce4e27a HEAD | python -B -c 'import sys; a=set(sys.stdin.read().splitlines()); e={"research/optimizer_o21_s0/PREREG.md","research/optimizer_o21_s0/compare.py","research/optimizer_o21_s0/test_compare.py",".github/workflows/optimizer-o21-native-r7-equivalence.yml"}; assert a==e,(a,e)'
          cd ../pinned_ygg
          test "$(git rev-parse HEAD)" = "a509c23d8b0d0a11d3d5d38eaa70656c7ab07ddd"
          test "$(git hash-object research/native/itd02/r7/learner.py)" = "204ecd993b954b23e66d6d1e8b3568e7c93183c5"
          test "$(git hash-object research/native/itd02/r7/test_learner.py)" = "bec25db3632c8978f884f1e0a4c41fc78fa8e9f9"
      - name: Test native R7 versus independent equally informed conventional with original source identity
        shell: bash
        env:
          O21_PINNED_YGG: pinned_ygg
        run: |
          set -euo pipefail
          python -B -m unittest discover -s forge/research/optimizer_o21_s0 -p "test_*.py" -v
          python -B forge/research/optimizer_o21_s0/compare.py pinned_ygg > o21-sourceonly-result.json
          python -B -c 'import json; r=json.load(open("o21-sourceonly-result.json")); assert r["public_training_rows"]==1152; assert r["direct_matched_predictions"]==1536; assert r["composed_matched_predictions"]==64; assert r["original_external_environment_steps"]==0; assert not r["science_go"]; print("O21_ENGINEERING_ONLY",r["disposition"],r["equal_model_sha256"],r["direct_correct_native"],r["direct_correct_conventional"])'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o21-r7-sourceonly-${{ matrix.os }}
          path: o21-sourceonly-result.json
          retention-days: 30
