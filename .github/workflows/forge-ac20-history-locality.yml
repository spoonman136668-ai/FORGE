name: AC20 pinned original public-history locality (source-free)
on:
  pull_request:
    paths:
      - 'research/ac07_sourcefree/ac20_*'
      - 'research/ac07_sourcefree/test_ac20_*'
      - 'docs/research/AC-20-*'
      - '.github/workflows/forge-ac20-history-locality.yml'
permissions:
  contents: read
jobs:
  immutable-history-locality:
    name: AC20 original-locality / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the proposed source-free diagnostic
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out exact unchanged historical native source
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/Yggdrasil
          ref: a39171a76d0d7817e3563682bb139a9d7ecf37c4
          path: ac20_ygg
          fetch-depth: 1
          persist-credentials: false
      - name: Check out exact original source solely to verify source blob
        uses: actions/checkout@v4
        with:
          repository: CausalAILab/Causal-Gymnasium
          ref: c94e9a4cd3641588b6b8507e71ccee5c27032bdf
          path: ac20_dtr
          fetch-depth: 1
          persist-credentials: false
      - name: Python standard library only
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused AC20 public-history and no-oracle tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/ac07_sourcefree -p 'test_ac20_*.py' -v
      - name: Verify immutable original source and native readout information bounds
        shell: bash
        run: |
          set -euo pipefail
          python -B research/ac07_sourcefree/ac20_history_locality.py --native "$GITHUB_WORKSPACE/ac20_ygg" --source "$GITHUB_WORKSPACE/ac20_dtr" --out "$RUNNER_TEMP/ac20-public-history.json"
          python - "$RUNNER_TEMP/ac20-public-history.json" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["schema"]=="forge.ac20.sourcefree-public-history-locality.v1"
          assert r["public_history_combinations"]==16
          assert r["ac19_terminal_input_unique_patterns"]==4
          assert r["site4_single_hop_distinct_history_features"]==8
          assert r["site5_single_hop_distinct_history_features"]==8
          assert r["pair_of_original_sites_4_and_5_distinct_history_features"]==16
          assert r["stage1_ac19_observation_action_buckets_with_conflicting_outcomes_at_audit_u_0_5"]==4
          assert r["native_original_training_events"]==0
          assert r["original_dtr_source_episodes_or_actions_executed"]==0
          assert r["original_dtr_source_imported"] is False
          assert r["posthoc_latent_audit_not_provided_to_any_model"] is True
          for key in ("fit_or_dev_model_training_performed", "model_directed_action_or_return_measured",
                      "scientific_first_use", "scientific_admission",
                      "owner_controller_queue_or_native_source_modified"):
              assert r[key] is False,key
          print("AC20_ORIGINAL_GIT_SOURCE_READONLY=PASS")
          print("AC20_SOURCEFREE_INFORMATION_BOUND=PASS")
          print("AC20_REPORT_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Archive bounded source-free diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: ac20-original-public-history-${{ matrix.os }}
          path: ${{ runner.temp }}/ac20-public-history.json
          retention-days: 30
          if-no-files-found: error
