name: Q17C read-only frozen RNN numerical discrepancy audit
on:
  push:
    branches: [audit/q17c-rnn-crossos-math-20261022]
    paths: [.github/workflows/q17c-readonly-math-audit.yml]
permissions:
  contents: read
concurrency:
  group: q17c-crossos-readonly-frozen-initial-math
  cancel-in-progress: false
jobs:
  math-fingerprint:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            host: '["ubuntu-24.04"]'
          - name: windows
            host: '["windows-2022"]'
    runs-on: ${{ fromJSON(matrix.host) }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify only three added audit paths over exact unchanged Q17B parent
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent='a4fe005a18de77a17b4404dc042720da4c640a63'
          $actual=(& git rev-parse HEAD~3).Trim()
          if($LASTEXITCODE-ne0 -or $actual-cne$parent){
            throw 'Q17C_PROVENANCE_PARENT_CHANGED'
          }
          $paths=@(
            '.github/workflows/q17c-readonly-math-audit.yml',
            'research/q17c_audit/FROZEN_AUDIT.json',
            'research/q17c_audit/diagnose.py'
          )
          $changed=@(& git diff --name-only $parent HEAD)
          if($LASTEXITCODE-ne0 -or (Compare-Object $changed $paths)){
            throw 'Q17C_AUDIT_ONLY_THREE_FILES_SCOPE'
          }
          foreach($item in @(
            @('research/q17c_audit/FROZEN_AUDIT.json','02cd82ed887023a15d7e351e9be437a8ead83330'),
            @('research/q17c_audit/diagnose.py','9b14ad57a057552714326b915d3ad19e664a2170'),
            @('research/q17b_twoedge/FROZEN_PROTOCOL.json','7b09596afb9a3e2859f2de20e470c91416d94578'),
            @('research/q17b_twoedge/experiment.py','ba447295eaedd094907e56faef67fad2bfc283c3'),
            @('research/q17b_twoedge/test_experiment.py','b3c0051234312280c0fc286e016320e6156b17df')
          )){
            $real=(& git rev-parse ('HEAD:'+$item[0])).Trim()
            if($LASTEXITCODE-ne0 -or $real-cne$item[1]){
              throw ('Q17C_SCIENCE_OR_AUDIT_BLOB_DRIFT_'+$item[0])
            }
            $disk=(& git hash-object --no-filters -- $item[0]).Trim()
            if($LASTEXITCODE-ne0 -or $disk-cne$item[1]){
              throw ('Q17C_SCIENCE_ONDISK_BYTE_DRIFT_'+$item[0])
            }
          }
          Write-Host 'Q17C_FROZEN_SOURCE_AND_READONLY_AUDIT_ONLY_SCOPE=PASS'
      - name: Fingerprint initial FIT-only math with no optimizer call
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py='python'
          $out=Join-Path $env:RUNNER_TEMP ('q17c-'+$env:RUNNER_OS+'.log')
          if(Test-Path -LiteralPath $out){throw 'Q17C_EXISTING_AUDIT_OUTPUT_NOT_OVERWRITTEN'}
          & $py -B research/q17c_audit/diagnose.py --mode math-audit 2>&1 |
            Tee-Object -FilePath $out
          if($LASTEXITCODE-ne0){throw 'Q17C_INITIAL_OPERANDS_AUDIT_FAILED'}
          $results=@(Get-Content -LiteralPath $out |
                     Where-Object {$_ -like 'Q17C_RESULT_JSON=*'})
          if($results.Count-ne1){throw 'Q17C_RECEIPT_MISSING_OR_DUPLICATED'}
          $obj=$results[0].Substring(17)|ConvertFrom-Json
          if($obj.training_or_model_update_performed-ne$false -or
             $obj.dev_or_held_generated-ne$false -or
             $obj.original_source_episodes-ne0 -or
             $obj.first_batch_indices_prefix.Count-ne12){
            throw 'Q17C_AUDIT_RESULT_CUSTODY_FALSE'
          }
          Write-Host ('Q17C_AUDIT_LOG_SHA256='+((Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()))
          Write-Host 'Q17C_NO_MODEL_UPDATES_AND_INITIAL_MATH=PASS'
      - name: Verify no source, held or original-science writes
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dirty=@(& git status --porcelain --untracked-files=all)
          if($LASTEXITCODE-ne0 -or $dirty.Count-ne0){throw 'Q17C_WORKTREE_DIRTY'}
          Write-Host 'Q17C_SCIENTIFIC_SOURCE_UNCHANGED=PASS'
          Write-Host 'Q17C_NO_RETRAIN_NO_DEV_NO_HELD=TRUE'
          Write-Host 'Q17C_FROZEN_Q17B_NO_GO_PRESERVED=TRUE'
