name: K Terminal PR86 signed BUY origin exact-source Windows qualification
on:
  push:
    branches: [qualification/kterminal-pr86-signed-buy-origin-20261109]
    paths: [.github/workflows/forge-kterminal-pr83-engine-preflight-desktop-20261109.yml]
permissions:
  contents: read
concurrency:
  group: kterminal-pr86-full-window-3e4eeb8f
  cancel-in-progress: false
jobs:
  owner-local-package:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 115
    env:
      KTERM_SHA: c0e85088e7ff2e7c8d989dc93f89df16a462d659
      KTERM_TREE: 3e4eeb8f9a5fd982858cc0a92300f6d28fe952b9
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Admit existing owner Windows runner without trading authority
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-pr86-signed-buy-origin-20261109' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows') { throw 'KTERM_OWNER_LOCAL_HOST_IDENTITY_REFUSED' }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET',
              'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')) {
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_OWNER_LOCAL_BROKER_ENV_REFUSED'}
          }
          if(@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_GUI_EXISTING_PROCESS_PRESERVED_SKIP'
          }
          $session=[Diagnostics.Process]::GetCurrentProcess().SessionId
          if($session -eq 0 -or
             @(Get-Process explorer -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq $session }).Count -eq 0){
            throw 'KTERM_GUI_INTERACTIVE_SESSION_UNVERIFIED'
          }
          $profilePath=[Environment]::GetFolderPath('UserProfile')
          if(-not $profilePath -or $profilePath -notmatch '(?i)^[A-Z]:\\Users\\[^\\]+$' -or
             $profilePath -match '(?i)\\(public|default|systemprofile)$') {throw 'KTERM_OWNER_LOCAL_INTERACTIVE_PROFILE_UNVERIFIED'}
          $download=Join-Path $profilePath 'Downloads'
          if(-not(Test-Path -LiteralPath $download -PathType Container)){throw 'KTERM_OWNER_LOCAL_DOWNLOAD_DIRECTORY_UNAVAILABLE'}
          if((Get-Item -LiteralPath $download -Force).Attributes -band [IO.FileAttributes]::ReparsePoint){throw 'KTERM_OWNER_LOCAL_DOWNLOAD_LINK_REFUSED'}
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr86-full-owner-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_OWNER_LOCAL_STALE_WORKSPACE'}
          [void][IO.Directory]::CreateDirectory($root)
          Write-Host 'KTERM_OWNER_LOCAL_ISOLATION_AND_DISARM=PASS'
      - name: Stage exact private source in disposable Git checkout
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr86-full-owner-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          [void][IO.Directory]::CreateDirectory($stage)
          & git -C $stage init -q *> (Join-Path $root 'git-init-private.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_OWNER_LOCAL_GIT_INIT_FAILED'}
          $cached=Join-Path $env:PUBLIC 'KTerminal'
          $source='https://github.com/Kboomllc/K-Terminal.git'
          if(Test-Path -LiteralPath $cached -PathType Container){
            $tree=''
            try {$tree=(& git -C $cached rev-parse ($env:KTERM_SHA+'^{tree}') 2>$null | Out-String).Trim()}catch {$tree=''}
            if($LASTEXITCODE -eq 0 -and $tree -ceq $env:KTERM_TREE){$source=$cached}
          }
          & git -C $stage fetch -q --no-tags --depth=1 $source $env:KTERM_SHA *> (Join-Path $root 'git-fetch-private.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_OWNER_LOCAL_EXISTING_PRIVATE_SOURCE_UNAVAILABLE'}
          & git -C $stage checkout -q --detach $env:KTERM_SHA *> (Join-Path $root 'git-checkout-private.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_OWNER_LOCAL_CHECKOUT_FAILED'}
          $head=(& git -C $stage rev-parse HEAD | Out-String).Trim()
          $tree=(& git -C $stage rev-parse 'HEAD^{tree}' | Out-String).Trim()
          if($head -cne $env:KTERM_SHA -or $tree -cne $env:KTERM_TREE -or
              @(& git -C $stage status --porcelain).Count -ne 0){throw 'KTERM_OWNER_LOCAL_EXACT_SOURCE_DRIFT'}
          foreach($private in @('.env','config.json','data')){
            if(Test-Path -LiteralPath (Join-Path $stage $private)){throw 'KTERM_OWNER_LOCAL_PRIVATE_RUNTIME_STATE_REFUSED'}
          }
          Write-Host 'KTERM_OWNER_LOCAL_EXACT_SHA_TREE=PASS;PRIVATE_SOURCE_NOT_PUBLISHED=TRUE'
      - name: Pinned Go compiler for same source qualified in FORGE run 42521898369
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Qualify signed BUY origin negatives, full Windows regression and desktop acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((go version) -notmatch 'go1\.26\.5 windows/amd64'){throw 'KTERM_OWNER_LOCAL_GO_VERSION_DRIFT'}
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr86-full-owner-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          $env:GOCACHE=Join-Path $root 'go-cache'
          $env:GOMODCACHE=Join-Path $root 'go-modules'
          $env:K_TERMINAL_TEST_WORKSPACE=Join-Path $root 'test-workspace'
          $env:KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT=Join-Path $root 'test-workspace\tail'
          $env:KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT=Join-Path $root 'test-workspace\post'
          $env:KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT=Join-Path $root 'test-workspace\private'
          foreach($dir in @($env:GOCACHE,$env:GOMODCACHE,$env:K_TERMINAL_TEST_WORKSPACE,
              $env:KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT,$env:KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT,
              $env:KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT)){[void][IO.Directory]::CreateDirectory($dir)}
          # Run new source-specific tests before mandatory exact-SHA full regression.
          # All test output stays in the owner-local disposable workspace.
          # No Coinbase credentials, LIVE mode or order POST is available.
          Push-Location $stage
          try {
            # Exact K Terminal source SHA was unchanged. Reuse the already
            # PASS focused test receipt from run 42711519222 (69,613 ms).
            # The previous run failed only AFTER these tests, in full suite.
            Write-Host 'KTERM_PR86_FOCUSED_REUSE=PASS;RUN=42711519222;MS=69613;SOURCE_SHA=c0e85088e7ff2e7c8d989dc93f89df16a462d659'
            $fullClock=[Diagnostics.Stopwatch]::StartNew()
            & go test -p 1 -count=1 -timeout 60m ./... *> (Join-Path $root 'private-full-regression.log')
            $fullClock.Stop()
            if($LASTEXITCODE -ne 0){
              # Constrain what leaves the disposable private workspace. Print
              # only Go test function identifiers and package-level status,
              # never raw errors, logs, order data or file contents.
              $diag=Join-Path $root 'private-full-regression.log'
              $failCount=0
              $packageCount=0
              $timedOut=$false
              $buildFailed=$false
              $resourceFail=$false
              foreach($line in [IO.File]::ReadLines($diag)){
                if($line -match '^\\s*--- FAIL: (Test[A-Za-z0-9_]+)(?:/([A-Za-z0-9_/-]+))?'){
                  $test=$Matches[1]
                  if($failCount -lt 24){Write-Host ('KTERM_PR86_FULL_FAILED_TEST='+$test)}
                  $failCount++
                } elseif($line -match '^FAIL\\s+(k-terminal(?:/[A-Za-z0-9_./-]+)?)\\s'){
                  $package=$Matches[1]
                  if($packageCount -lt 20){Write-Host ('KTERM_PR86_FULL_FAILED_PACKAGE='+$package)}
                  $packageCount++
                } elseif($line -match '^panic: test timed out after'){
                  $timedOut=$true
                } elseif($line -match '^(?:# |go: build |FAIL\\s+build failed)'){
                  $buildFailed=$true
                } elseif($line -match '(?i)(out of memory|not enough memory|no space left|disk is full|paging file is too small)'){
                  $resourceFail=$true
                }
              }
              Write-Host ('KTERM_PR86_FULL_REGRESSION_DIAGNOSTIC=FAIL;TESTS='+$failCount+';PACKAGES='+$packageCount+';TIMEOUT='+$timedOut+';BUILD='+$buildFailed+';RESOURCE='+$resourceFail+';MS='+$fullClock.ElapsedMilliseconds)
              throw 'KTERM_PR86_FULL_WINDOWS_REGRESSION_FAILED'
            }
            Write-Host ('KTERM_PR86_FULL_WINDOWS_REGRESSION=PASS;MS='+$fullClock.ElapsedMilliseconds)
            & go vet ./... *> (Join-Path $root 'private-vet.log')
            if($LASTEXITCODE -ne 0){throw 'KTERM_PR86_GO_VET_FAILED'}
            Write-Host 'KTERM_PR86_GO_VET=PASS'
          }finally{Pop-Location}
          # The exact source must independently pass its new full regression:
          # PR83's earlier receipts do not qualify this new SHA.
          # Warm exactly the repo-local .build cache used by BUILD.ps1 before
          # launching its Windows PowerShell 5.1 process.
          $env:GOCACHE=Join-Path $stage '.build\cache'
          $env:GOMODCACHE=Join-Path $stage '.build\modules'
          $env:GOPATH=Join-Path $stage '.build\go'
          $env:GOTMPDIR=Join-Path $stage '.build\temp'
          foreach($dir in @($env:GOCACHE,$env:GOMODCACHE,$env:GOPATH,$env:GOTMPDIR)){
            [void][IO.Directory]::CreateDirectory($dir)
          }
          Push-Location $stage
          try {
            $warmTime=[Diagnostics.Stopwatch]::StartNew()
            $flags='-s -w -X k-terminal/pkg.NativeTimingDefaultEnabled=1 -X k-terminal/pkg.NativeTimingBuildRevision=20261006-stage3-readiness-r1'
            & go build -trimpath -ldflags $flags -o K-Terminal-Engine.exe . *> (Join-Path $root 'private-engine-preflight.log')
            $warmTime.Stop()
            if($LASTEXITCODE -ne 0) {
              throw 'KTERM_ORIGINAL_ENGINE_CACHE_PREFLIGHT_FAILED'
            }
            if(-not(Test-Path -LiteralPath 'K-Terminal-Engine.exe' -PathType Leaf)) {
              throw 'KTERM_ORIGINAL_ENGINE_PREFLIGHT_OUTPUT_MISSING'
            }
            Write-Host ('KTERM_PR86_EXACT_ENGINE_PREFLIGHT=PASS;MS='+$warmTime.ElapsedMilliseconds+';SOURCE_SHA='+$env:KTERM_SHA)
          }finally{Pop-Location}
          # Preserve the existing canonical build script byte-for-byte.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File (Join-Path $stage 'BUILD.ps1') *> (Join-Path $root 'private-build.log')
          if($LASTEXITCODE -ne 0){
            # Keep full private build log inside this disposable owner workspace.
            # Publish only recognized nonsecret failure classes, never raw
            # log lines, source locations, broker data or environment values.
            $buildReport=Join-Path $root 'private-build.log'
            $raw=if(Test-Path -LiteralPath $buildReport){[IO.File]::ReadAllText($buildReport)}else{''}
            $class='UNCLASSIFIED_BUILD_FAILURE'
            if($raw -match '(?i)Build failed: K-Terminal-Engine\.exe'){$class='ENGINE_BINARY_BUILD'}
            elseif($raw -match '(?i)Build failed: K-Terminal-Account-Lookup\.exe'){$class='ACCOUNT_LOOKUP_BUILD'}
            elseif($raw -match '(?i)Build failed: K-Terminal-Chart(?:-History)?\.exe'){$class='CHART_BUILD'}
            elseif($raw -match '(?i)Build failed: K-Terminal-Subminute-Chart\.exe'){$class='SUBMINUTE_CHART_BUILD'}
            elseif($raw -match '(?i)Build failed: K-Terminal-Intelligence\.exe'){$class='INTELLIGENCE_BUILD'}
            elseif($raw -match '(?i)Build failed: K-Terminal-Notifications\.exe'){$class='NOTIFICATIONS_BUILD'}
            elseif($raw -match '(?i)Build failed: K-Terminal\.exe'){$class='CSHARP_LAUNCHER_BUILD'}
            elseif($raw -match '(?i)Build failed: KTerminal\.UI\.dll'){$class='WPF_UI_BUILD'}
            elseif($raw -match 'KTERM_DESKTOP_UI_BUILD_INCOMPLETE'){$class='UI_ASSEMBLY_OR_MANIFEST_MISSING'}
            elseif($raw -match 'KTERM_DESKTOP_UI_MANIFEST_MISMATCH'){$class='UI_MANIFEST_HASH_MISMATCH'}
            elseif($raw -match 'KTERM_BUILD_OBSOLETE_CSHARP_CHILD_BREAKAWAY_REFUSED'){$class='OBSOLETE_LAUNCHER_REFUSED'}
            elseif($raw -match '(?i)Windows \.NET Framework compiler is required'){$class='CSHARP_COMPILER_UNAVAILABLE'}
            elseif($raw -match '(?i)(module lookup disabled|no such host|proxyconnect|connection refused|TLS handshake)'){$class='DEPENDENCY_NETWORK'}
            if($class -eq 'UNCLASSIFIED_BUILD_FAILURE'){
              if($raw -match '(?i)(not enough memory|out of memory|cannot allocate memory|The paging file is too small)'){$class='RESOURCE_MEMORY'}
              elseif($raw -match '(?i)(There is not enough space on the disk|No space left on device|disk is full)'){$class='RESOURCE_DISK'}
              elseif($raw -match '(?i)(Access is denied|permission denied|being used by another process|sharing violation)'){$class='RESOURCE_FILE_LOCK'}
              elseif($raw -match '(?i)(timed out|deadline exceeded|interrupted|canceled|aborted)'){$class='RESOURCE_TIMEOUT_OR_INTERRUPTION'}
              elseif($raw -match '(?i)(could not find|cannot find the path specified|does not exist|file not found)'){$class='BUILD_INPUT_MISSING'}
              elseif($raw -match '(?i)(compiler|compilation error|syntax error|undefined:|invalid operation|error CS[0-9]+)'){$class='COMPILATION_DIAGNOSTIC'}
              elseif($raw -match '(?i)(Unrecognized|not recognized as the name|not recognized as an internal)'){$class='TOOL_UNAVAILABLE'}
            }
            Write-Host ('KTERM_PR86_BUILD_DIAGNOSTIC=FAIL;CLASS='+$class+';OUTPUT_PRESENT='+[bool]($raw.Length -gt 0)+';BROKER_WRITES=0')
            throw 'KTERM_OWNER_LOCAL_COMPLETE_BUILD_FAILED'
          }
          Write-Host 'KTERM_OWNER_LOCAL_COMPLETE_DESKTOP_BUILD=PASS'
          $ui=Join-Path $root 'ui-fixture'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File (Join-Path $stage 'verification\test-ui-runtime.ps1') -Root $stage -OutputDirectory $ui *> (Join-Path $root 'private-ui-fixture.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_OWNER_LOCAL_UI_RUNTIME_TEST_FAILED'}
          Write-Host 'KTERM_OWNER_LOCAL_COMPILED_UI_RUNTIME=PASS'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File (Join-Path $stage 'verification\test-launch-lifecycle.ps1') -Root $stage *> (Join-Path $root 'private-launch-fixture.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_OWNER_LOCAL_LAUNCHER_LIFECYCLE_FAILED'}
          Write-Host 'KTERM_OWNER_LOCAL_LAUNCH_LIFECYCLE=PASS'
          $package=Join-Path $root 'stage'
          $zip=Join-Path $root ('KTerminal-PR86-FullQualification-'+$env:KTERM_SHA.Substring(0,12)+'-R'+$env:GITHUB_RUN_ID+'.zip')
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $stage 'verification\package-first-install.ps1') -SourceRoot $stage -StageDirectory $package -ZipPath $zip *> (Join-Path $root 'private-package.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_OWNER_LOCAL_COMPLETE_ZIP_PACKAGE_FAILED'}
          $unpack=Join-Path $root 'unpacked'
          Expand-Archive -LiteralPath $zip -DestinationPath $unpack -ErrorAction Stop
          $manifest=Get-Content -LiteralPath (Join-Path $unpack 'package-manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if($manifest.source_sha -cne $env:KTERM_SHA){throw 'KTERM_OWNER_LOCAL_PACKAGE_SHA_DRIFT'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File (Join-Path $unpack 'INSTALL-KTerminal.ps1') -SourceRoot $unpack -Destination (Join-Path $root 'smoke-installed') -NoLaunch *> (Join-Path $root 'private-install-smoke.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_OWNER_LOCAL_NO_LAUNCH_INSTALL_FAILED'}
          if(-not(Test-Path -LiteralPath (Join-Path $root 'smoke-installed\K-Terminal.exe') -PathType Leaf)){throw 'KTERM_OWNER_LOCAL_INSTALLED_DESKTOP_MISSING'}
          $install=Join-Path $root 'smoke-installed'
          if(Test-Path -LiteralPath (Join-Path $install 'config.json')){throw 'KTERM_GUI_LIVE_CONFIG_REFUSED'}
          $exe=Join-Path $install 'K-Terminal.exe'
          $gui=$null
          $visible=$false
          try {
            $gui=Start-Process -FilePath $exe -WorkingDirectory $install -PassThru -ErrorAction Stop
            for($attempt=0;$attempt -lt 8;$attempt++){
              Start-Sleep -Seconds 1
              $gui.Refresh()
              if($gui.HasExited){break}
              $cim=@(Get-CimInstance Win32_Process -ErrorAction Stop)
              $ids=@([int]$gui.Id)
              $descendants=@()
              for($depth=0;$depth -lt 5;$depth++){
                $children=@($cim | Where-Object { $_.ParentProcessId -in $ids -and $_.ProcessId -notin $ids })
                if($children.Count -eq 0){break}
                $ids=@($ids+@($children|ForEach-Object { [int]$_.ProcessId }))
                $descendants=@($descendants+$children)
              }
              foreach($child in $descendants){
                $cp=Get-Process -Id ([int]$child.ProcessId) -ErrorAction SilentlyContinue
                if($null -ne $cp -and $cp.SessionId -eq [Diagnostics.Process]::GetCurrentProcess().SessionId -and
                   $cp.MainWindowHandle -ne [IntPtr]::Zero){$visible=$true;break}
              }
              if($visible){break}
            }
            if(Test-Path -LiteralPath (Join-Path $install 'data\logs\desktop-startup-status.txt')){throw 'KTERM_GUI_EARLY_STARTUP_FAILURE'}
            $gui.Refresh()
            if($gui.HasExited){throw 'KTERM_GUI_EARLY_EXIT'}
            if(-not $visible){throw 'KTERM_GUI_VISIBLE_NATIVE_WINDOW_UNVERIFIED'}
            if(Test-Path -LiteralPath (Join-Path $install 'config.json')){throw 'KTERM_GUI_UNEXPECTED_CONFIG'}
            Write-Host 'KTERM_PR86_REAL_NATIVE_GUI=PASS;ISOLATED=TRUE;NO_BROKER_AUTH=TRUE;LIVE_ORDERS=0'
          } finally {
            if($null -ne $gui){
              $gui.Refresh()
              if(-not $gui.HasExited){$gui.Kill();[void]$gui.WaitForExit(10000)}
              $gui.Dispose()
            }
          }
          Write-Host 'KTERM_OWNER_LOCAL_ZIP_HASH_AND_FRESH_INSTALL=PASS;GUI_LAUNCHED_AND_STOPPED=TRUE;LIVE_ORDERS=0'
          $profilePath=[Environment]::GetFolderPath('UserProfile')
          $download=Join-Path $profilePath 'Downloads'
          if(-not $profilePath -or $profilePath -notmatch '(?i)^[A-Z]:\\Users\\[^\\]+$' -or
             $profilePath -match '(?i)\\(public|default|systemprofile)$' -or
             -not(Test-Path -LiteralPath $download -PathType Container) -or
             ((Get-Item -LiteralPath $download -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)){
            throw 'KTERM_OWNER_LOCAL_INSTALLER_DESTINATION_UNVERIFIED'
          }
          $file=[IO.Path]::GetFileName($zip)
          $target=Join-Path $download $file
          if(Test-Path -LiteralPath $target){throw 'KTERM_OWNER_LOCAL_INSTALLER_ALREADY_EXISTS'}
          $expected=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Copy-Item -LiteralPath $zip -Destination $target -ErrorAction Stop
          $actual=(Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -cne $expected) {
            Remove-Item -LiteralPath $target -Force -ErrorAction SilentlyContinue
            throw 'KTERM_OWNER_LOCAL_DELIVERY_HASH_MISMATCH'
          }
          Write-Host ('KTERM_OWNER_LOCAL_DOWNLOADS_ZIP=PASS;FILE='+$file+';ZIP_SHA256='+$actual+';LIVE_ORDERS=0')
      - name: Remove temporary private source and fixtures
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr86-full-owner-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root) {
            $path=[IO.Path]::GetFullPath($root)
            $scope=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')+'\'
            if(-not $path.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -or
               [IO.Path]::GetFileName($path) -cne ('kterm-pr86-full-owner-'+$env:GITHUB_RUN_ID)){
              throw 'KTERM_OWNER_LOCAL_PRIVATE_CLEANUP_REFUSED'
            }
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_OWNER_LOCAL_PRIVATE_TEMP_CLEAN=PASS;PUBLIC_PRIVATE_FILES=0'
