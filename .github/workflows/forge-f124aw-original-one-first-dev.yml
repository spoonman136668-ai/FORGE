        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object reference/research-intake/f124aw-frozen-original-ygg-first-dev.json)" = e86cbf31e179bb4a1d4ceeee039c3d017ba27789
          test "$(git log -1 --format=%H -- reference/research-intake/f124aw-frozen-original-ygg-first-dev.json)" = 1415ad0cba12b9f89c626b0786fdca3544e975b6
          test "$(git hash-object reference/research-intake/f124aw-original-model-identity-erratum.json)" = b80ba4b6e6d8df60a42137bc021ed38d1e993845
          test "$(git hash-object nativeevidence/f124aw_one_original_dev.py)" = fc710df2d15a069461ad669483e2655d985d3525
          test "$(git hash-object nativeevidence/f124aw_independent_preflight.py)" = 4c0fa0afc1cafafb5c7a8ea1a1ea85df6e9cbb2b
          test "$(git rev-parse '0c54bee8cc9a69bd87a7852a236b0e0bc57e01c4:nativeevidence/f124av_informative_inverse.py')" = 0364e6a00c2bc3ffcda0e91ab2fe292e6bd8fbd5
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39144700158" --jq '[.head_sha,.status,.conclusion] | join(" ")' | grep -Fx 'ffbc188963f673c20b6d7ecd3c4613aa4551614d completed success'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39144700224" --jq '[.head_sha,.status,.conclusion] | join(" ")' | grep -Fx 'ffbc188963f673c20b6d7ecd3c4613aa4551614d completed success'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39141593876" --jq '[.head_sha,.status,.conclusion,.event] | join(" ")' | grep -Fx 'b6f48b01ecc5dfea159e275a7becf69b3b3f4c76 completed success push'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39141593876/artifacts" --jq '.artifacts[] | select(.id==12141722057 and .expired==false) | .digest' | grep -Fx 'sha256:05977f984699c359864b622fb9124013ae85536bdadfaedbb063f907c63f4504'
          echo 'F124AW_SOURCE_AND_INDEPENDENT_PREDEV_ATTESTATION=PASS'
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39078269441
          github-token: ${{ github.token }}
          name: f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d
          path: originals/o
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39082424955
          github-token: ${{ github.token }}
          name: f124t-source-verified-fresh-development-01560f7f4f1aab5737cfd045dffd7faaccfb0608
          path: originals/t
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39118489510
          github-token: ${{ github.token }}
          name: f124an-calibrated-source-isolation-ca46eba41179a1c6d9cd0bfa74119782c6d11d88
          path: originals/an
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39122374949
          github-token: ${{ github.token }}
          name: f124ao-first-dev-evidence-a0d15c8cf307a9c7972728899b525f79717049c7
          path: originals/ao
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39123857883
          github-token: ${{ github.token }}
          name: f124ap-authentic-train-only-c5330bbff435febe198c55e9da19beb17bc613d8
          path: originals/ap
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39124962572
          github-token: ${{ github.token }}
          name: f124aq-train-1d4222158da000f66f6ad28033c9b15f4dcabe93
          path: originals/aq
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39133441550
          github-token: ${{ github.token }}
          name: f124ar-original-train-d261861f31c34152ffe9d7081302f764ac02fb7d
          path: originals/ar
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39136517506
          github-token: ${{ github.token }}
          name: f124as-original-new-train-06ca4e0dc54a619de8ec623c97ff1ef1ce0496b5
          path: originals/as_train
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39136910292
          github-token: ${{ github.token }}
          name: f124as-original-first-dev-449fc54cecccb6e30eaa13016f9d1828532714ac
          path: originals/as_dev
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39138041247
          github-token: ${{ github.token }}
          name: f124at-fresh-diagnostic-699ba7abc460bc0763eed2f11d10bdf766e4604b
          path: originals/at
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39140097345
          github-token: ${{ github.token }}
          name: f124au-original-fit-screen-ec8a61f41fce6b4f29d8ae30a4ec52fafbde95af
          path: originals/au
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39141593876
          github-token: ${{ github.token }}
          name: f124av-original-fit-screen-b6f48b01ecc5dfea159e275a7becf69b3b3f4c76
          path: originals/av
      - name: Verify original bytes and independent source/weights without DEV birth
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '025c97abc8eb69079d7d7d0f59bfdb81235b9ad9ab83e230f32b542d2cfbdb5d  originals/o/f124o-independent-two-learned-development.json' \
            'a2f7b3641c2f84f684372918849170c97912c7a104fa4dbe264bcbd6d444c2d2  originals/t/f124t-fresh-absolute-development.json' \
            '7226e267ac02090069690ebb40e92696a2cba1bd56a567d838fc6e48880cff9c  originals/an/f124an-calibrated-affine-wing-isolation.json' \
            '37d61d2130fc73f28fd96d32b85d018dee231c5319dd515b2024132f7855cb52  originals/ao/f124ao-first-dev-independent-evidence.json' \
            '56bb2b97a2d0ae5babc0884e55841252ecefd6a11748f33425753e6309ef1417  originals/ap/f124ap-authentic-kernel-hop-train.json' \
            'd3a3935cc58d0fe69f46a496ae130a434360bee4169dc22bdad72385af3aa5b0  originals/aq/f124aq-train.json' \
            '8e8a062ed46af068cf490044f9f5f548d78cc31655ca7fe2061f4ad8ddfd0446  originals/ar/f124ar-original-fresh-train.json' \
            'f012c3c34ee7f859932b5d4274e53d675f683568b2cda74cbeeee6407c785b7b  originals/as_train/f124as-original-train.json' \
            'd6d6c184ec4a06df0c33de1a0490d8fb67d1d9897ec78529d51e85547b0d48f7  originals/as_dev/f124as-first-dev.json' \
            '8050c9f4bae5821c4bc2d222d1c4985a41e3c86cb4af1c3cedf1a70c1a94422d  originals/at/f124at-original-fresh-train.json' \
            '7e0cc7b084e70fed69ac9f38eb5e66ecac1e33a14a4cccfa5919677d41e95fff  originals/au/f124au-original-fit-screen.json' \
            'f7cbfc844e64510a172a4144bd90a56a37ec6f76b805e5b39cb2bf953e40641d  originals/av/f124av-original-fit-screen.json' | sha256sum --check --strict
          python3 -B nativeevidence/f124aw_independent_preflight.py \
            --o originals/o/f124o-independent-two-learned-development.json \
            --t originals/t/f124t-fresh-absolute-development.json \
            --an originals/an/f124an-calibrated-affine-wing-isolation.json \
            --ao originals/ao/f124ao-first-dev-independent-evidence.json \
            --ap originals/ap/f124ap-authentic-kernel-hop-train.json \
            --aq originals/aq/f124aq-train.json \
            --ar originals/ar/f124ar-original-fresh-train.json \
            --as_train originals/as_train/f124as-original-train.json \
            --as_dev originals/as_dev/f124as-first-dev.json \
            --at originals/at/f124at-original-fresh-train.json \
            --av originals/av/f124av-original-fit-screen.json \
            --output "$RUNNER_TEMP/f124aw-independent-nonconsuming-preflight.json"
          python3 -B -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["schema"]=="forge.research.f124aw.independent-before-first-dev-preflight.v1" and d["frozen_selection"]=={"query_condition":"balanced_basis48","fit_bit_budget":12,"min_CHECK_correct":96} and d["DEV_cases_created"]==0 and d["DEV_consumed"] is False and d["Wingless_DEV_cases_created"]==0 and len(d["original_donor_Ygg_weights"])==7 and len(d["original_donor_Ygg_delta"])==2' "$RUNNER_TEMP/f124aw-independent-nonconsuming-preflight.json"
          python3 -B nativeevidence/f124aw_one_original_dev.py --mode preflight
          echo 'F124AW_INDEPENDENT_SELECT_LOCK_AND_WEIGHTS=PASS'
          echo 'F124AW_DEV_SOURCE_OPENED=false'
      - uses: actions/upload-artifact@v4
        with:
          name: f124aw-independent-no-dev-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/f124aw-independent-nonconsuming-preflight.json
          if-no-files-found: error
          retention-days: 90

  exactly-one-original-Yggdrasil-DEV:
    if: github.run_attempt == 1
    needs: independent-source-and-selection-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lock first original DEV to one execution and exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object nativeevidence/f124aw_one_original_dev.py)" = fc710df2d15a069461ad669483e2655d985d3525
          test "$(git hash-object reference/research-intake/f124aw-frozen-original-ygg-first-dev.json)" = e86cbf31e179bb4a1d4ceeee039c3d017ba27789
          echo 'F124AW_EXACT_HEAD_SINGLE_FIRST_USE_LOCK=PASS'
      - uses: actions/download-artifact@v4
        with:
          name: f124aw-independent-no-dev-preflight-${{ github.sha }}
          path: preflight
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39141593876
          github-token: ${{ github.token }}
          name: f124av-original-fit-screen-b6f48b01ecc5dfea159e275a7becf69b3b3f4c76
          path: original-AV
      - name: Execute one prospectively frozen Yggdrasil DEV and archive unretuned result
        shell: bash
        run: |
          set -euo pipefail
          echo 'f7cbfc844e64510a172a4144bd90a56a37ec6f76b805e5b39cb2bf953e40641d  original-AV/f124av-original-fit-screen.json' | sha256sum --check --strict
          python3 - <<'PY'
          import json,pathlib,os
          p=json.load(open("preflight/f124aw-independent-nonconsuming-preflight.json"))
          assert p["DEV_cases_created"]==0 and p["DEV_consumed"] is False and p["frozen_selection"]=={"query_condition":"balanced_basis48","fit_bit_budget":12,"min_CHECK_correct":96}
          pathlib.Path(os.environ["RUNNER_TEMP"],"original-ygg-base.json").write_text(json.dumps(p["original_donor_Ygg_weights"]))
          pathlib.Path(os.environ["RUNNER_TEMP"],"original-ygg-delta.json").write_text(json.dumps(p["original_donor_Ygg_delta"]))
          PY
          python3 -B nativeevidence/f124aw_one_original_dev.py \
            --mode one-original-dev \
            --av-original original-AV/f124av-original-fit-screen.json \
            --base-ygg "$RUNNER_TEMP/original-ygg-base.json" \
            --delta-ygg "$RUNNER_TEMP/original-ygg-delta.json" \
            --output "$RUNNER_TEMP/f124aw-first-DEV.json"
          python3 -B -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["schema"]=="forge.research.f124aw.single-original-selected-ygg-dev-first-use.v1"; assert d["Yggdrasil_DEV_consumed"] is True and d["Yggdrasil_DEV_first_use_count"]==1; assert set(d["models"])=={"selected_public_active48","original_AS_24","original_AO_24","true_inverse_ORACLE_ONLY"}; assert all(x["pairs"]==48 and x["max_active"]<=7 and x["max_retained"]<=9 for x in d["models"].values()); assert d["physical_and_public_resource_census"]["total_public_calls"]==2304 and d["physical_and_public_resource_census"]["extra_public_calls"]==1152; assert d["Wingless_DEV_generated"]==0 and d["Wingless_DEV_consumed"] is False and not d["optimizer_promotion"] and not d["protected_science_acceptance"]' "$RUNNER_TEMP/f124aw-first-DEV.json"
          sha256sum "$RUNNER_TEMP/f124aw-first-DEV.json" > "$RUNNER_TEMP/f124aw-first-DEV.json.sha256"
          echo 'F124AW_FIRST_YGG_DEV_COMPLETE=PASS'
          echo 'F124AW_WINGLESS_DEV_UNUSED=true'
          echo 'F124AW_PROTECTED_SCIENCE_ACCEPTED=false'
      - uses: actions/upload-artifact@v4
        with:
          name: f124aw-one-original-Ygg-DEV-${{ github.sha }}
          path: |
            ${{ runner.temp }}/f124aw-first-DEV.json
            ${{ runner.temp }}/f124aw-first-DEV.json.sha256
          if-no-files-found: error
          retention-days: 90

  one-final-complete-Go-regression:
    needs: exactly-one-original-Yggdrasil-DEV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Exactly one full Go regression, race, vet and build after authentic first-use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
          echo 'F124AW_ONE_FINAL_FULL_REGRESSION=PASS'
          echo "F124AW_QUALIFIED_EXACT_HEAD=$GITHUB_SHA"
          echo 'F124AW_SCIENTIFIC_ACCEPTANCE=false'
