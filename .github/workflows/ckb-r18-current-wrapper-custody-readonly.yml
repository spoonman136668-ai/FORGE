name: R220 owner-registry exact read-only custody
on:
  push:
    branches: [diagnostics/ckb-rb1-live-admission-20261022]
    paths: [.github/workflows/ckb-r18-current-wrapper-custody-readonly.yml]
permissions:
  contents: read
concurrency:
  group: r220-owner-registry-readonly-20261023
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Attest exact private registry and scripts on owner host without exporting contents
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-StrictMode -Version 3.0
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $who.Name -ine 'LINKDEADKB\camar' -or
             ![Security.Principal.WindowsPrincipal]::new($who).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/diagnostics/ckb-rb1-live-admission-20261022' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             (& git.exe rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or
             @(& git.exe status --porcelain).Count -ne 0){throw 'R220_OWNER_READONLY_AUTHORITY_DRIFT'}
          $changed=@(& git.exe diff --name-only HEAD^ HEAD)
          if($LASTEXITCODE-ne0 -or $changed.Count-ne1 -or
             $changed[0] -cne '.github/workflows/ckb-r18-current-wrapper-custody-readonly.yml'){
            throw 'R220_OWNER_READONLY_SCOPE_DRIFT'
          }
          function Sha([string]$p){
            if(!(Test-Path -LiteralPath $p -PathType Leaf)){throw 'R220_OWNER_REQUIRED_FILE_MISSING'}
            (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $config=Join-Path $root 'config\autonomy.yaml'
          $registry=Join-Path $root 'config\local-operations.json'
          $expectedRegistry='f625142599d2557342f637f0c65ec86be11598a95b80c9a625764795bfbfa84a'
          $expectedConfig='a14f210a146de9bd248bb4cfdc2e156b19c985a6c964a91881c4391f0a0190dc'
          $oldExe='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R18-RB1-ADMISSION-20261023\bin\ckb-plane.exe'
          $oldSha='0f2474480a2ff075b52d524e2f6935d3e86903ff029657e23f50b4356b8d9ffc'
          if((Sha $config)-cne$expectedConfig -or (Sha $oldExe)-cne$oldSha){
            throw 'R220_OWNER_INSTALLED_PREIMAGE_CHANGED'
          }
          $txt=[IO.File]::ReadAllText($config)
          $m=[regex]::Matches($txt,'(?m)^\s*local_operations_sha256:\s*([0-9a-f]{64})\s*$')
          $p=[regex]::Matches($txt,'(?m)^\s*local_operations_config:\s*(\S+)\s*$')
          if($m.Count-ne1 -or $p.Count-ne1 -or
             $m[0].Groups[1].Value-cne$expectedRegistry -or
             $p[0].Groups[1].Value-cne'config/local-operations.json'){
            throw 'R220_OWNER_PINNED_REGISTRY_CONFIG_DRIFT'
          }
          if((Sha $registry)-cne$expectedRegistry){throw 'R220_OWNER_REGISTRY_BYTES_MISMATCH'}
          Write-Host 'R220_EXACT_OWNER_REGISTRY_SHA256=PASS'
          $obj=(Get-Content -LiteralPath $registry -Raw -ErrorAction Stop)|ConvertFrom-Json
          if($obj.schema-cne'ckb-plane.local-operations.v1'){throw 'R220_OWNER_REGISTRY_SCHEMA_DRIFT'}
          $count=0
          $ids=@{}
          foreach($op in @($obj.operations)){
            if([string]$op.id -cnotmatch '^[a-z0-9][a-z0-9-]{0,79}$' -or $ids.ContainsKey([string]$op.id) -or
               [string]$op.script -cnotmatch '^operations/[A-Za-z0-9_-]+\.ps1$' -or
               [string]$op.script_sha256 -cnotmatch '^[0-9a-f]{64}$'){
              throw 'R220_OWNER_REGISTRY_OPERATION_CONTRACT_DRIFT'
            }
            $ids[[string]$op.id]=$true
            $script=Join-Path $root ([string]$op.script).Replace('/','\')
            if((Sha $script) -cne ([string]$op.script_sha256)){
              throw 'R220_OWNER_OPERATION_SCRIPT_HASH_DRIFT'
            }
            $count++
          }
          if($count-lt1){throw 'R220_OWNER_REGISTRY_EMPTY'}
          Write-Host ('R220_EXACT_OWNER_OPERATION_SCRIPTS=PASS count='+$count)
          $task=Get-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction Stop
          $procs=@((Get-CimInstance Win32_Process -Filter "Name='ckb-plane.exe'" -ErrorAction Stop)|
            Where-Object {[string]$_.CommandLine -match '(?i)\bcontroller\s+run\b'})
          if([string]$task.State -cne 'Running' -or $procs.Count-ne1 -or
             [string]$procs[0].ExecutablePath -ine $oldExe){throw 'R220_OWNER_CONTROLLER_SINGLETON_DRIFT'}
          Write-Host 'R220_CURRENT_CONTROLLER_SINGLETON=PASS'
          Write-Host 'R220_OWNER_REGISTRY_CUSTODY_READONLY=PASS'
          Write-Host 'R220_LIVE_MUTATION=FALSE'
