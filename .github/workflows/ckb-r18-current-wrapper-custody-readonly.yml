name: R221 postcutover sustained native and queue read-only audit
on:
  push:
    branches: [diagnostics/ckb-rb1-live-admission-20261022]
    paths: [.github/workflows/ckb-r18-current-wrapper-custody-readonly.yml]
permissions:
  contents: read
concurrency:
  group: r220-owner-postcutover-readonly-20261023
  cancel-in-progress: false
jobs:
  accept:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify immutable live R220 image, original rollback custody and native single authority
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version 3.0
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $who.Name -ine 'LINKDEADKB\camar' -or
             ![Security.Principal.WindowsPrincipal]::new($who).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) -or
             $env:GITHUB_REF -cne 'refs/heads/diagnostics/ckb-rb1-live-admission-20261022' -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             (& git.exe rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or
             @(& git.exe status --porcelain).Count -ne 0){throw 'R220_READONLY_OWNER_AUTHORITY_DRIFT'}
          $changed=@(& git.exe diff --name-only HEAD^ HEAD)
          if($LASTEXITCODE-ne0 -or $changed.Count-ne1 -or $changed[0] -cne '.github/workflows/ckb-r18-current-wrapper-custody-readonly.yml'){
            throw 'R220_READONLY_SOURCE_SCOPE_DRIFT'
          }
          function Sha([string]$p){
            if(!(Test-Path -LiteralPath $p -PathType Leaf)){throw 'R220_READONLY_FILE_MISSING'}
            (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $old='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R18-RB1-ADMISSION-20261023'
          $new='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R220-LIVECOMPAT-20261023'
          $oldExe=Join-Path $old 'bin\ckb-plane.exe'
          $newExe=Join-Path $new 'bin\ckb-plane.exe'
          $wrapper='C:\ProgramData\CKBR\cutover\PLANE-R18-OWNER-CUTOVER-39809195564\Start-R18-Controller.ps1'
          $receipt='C:\ProgramData\CKBR\cutover\PLANE-R220-LIVECOMPAT-20261023\cutover-pass.json'
          $config=Join-Path $root 'config\autonomy.yaml'
          $bridge=Join-Path $root 'config\webui-bridge.json'
          $registry=Join-Path $root 'config\local-operations.json'
          $expectedNew='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          if((Sha $oldExe)-cne'0f2474480a2ff075b52d524e2f6935d3e86903ff029657e23f50b4356b8d9ffc' -or
             (Sha $newExe)-cne$expectedNew -or
             (Sha $config)-cne'a14f210a146de9bd248bb4cfdc2e156b19c985a6c964a91881c4391f0a0190dc' -or
             (Sha $bridge)-cne'afcbac12e6fe6b3545d3ca89b556418f4bb444fb54ca2911ebcbef28308d63f2' -or
             (Sha $registry)-cne'f625142599d2557342f637f0c65ec86be11598a95b80c9a625764795bfbfa84a'){
            throw 'R220_POSTCUTOVER_IMAGE_OR_CONFIG_DRIFT'
          }
          $task=Get-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction Stop
          $process=@((Get-CimInstance Win32_Process -Filter "Name='ckb-plane.exe'" -ErrorAction Stop)|
            Where-Object {[string]$_.CommandLine -match '(?i)\bcontroller\s+run\b'})
          if([string]$task.State-cne'Running' -or @($task.Actions).Count-ne1 -or
             [string]$task.Actions[0].WorkingDirectory -ine $root -or
             $process.Count-ne1 -or [string]$process[0].ExecutablePath -ine $newExe){
            throw 'R220_POSTCUTOVER_TASK_SINGLETON_INVALID'
          }
          $wrapperText=[IO.File]::ReadAllText($wrapper)
          if(($wrapperText.Split(@($new),[StringSplitOptions]::None).Length-1)-ne1 -or
              $wrapperText.Contains($old)){throw 'R220_POSTCUTOVER_WRAPPER_PIN_INVALID'}
          Write-Host 'R220_POSTCUTOVER_TASK_AND_BINARY_SINGLETON=PASS'
          $pass=Get-Content -LiteralPath $receipt -Raw -ErrorAction Stop|ConvertFrom-Json
          if([string]$pass.status-cne'CUTOVER_PASS' -or
             [string]$pass.live_executable_sha256-cne$expectedNew -or
             [string]$pass.qualified_windows_run-cne'40033968112' -or
             [string]$pass.owner_native_proof_run-cne'40034952106' -or
             [bool]$pass.second_controller -or
             [bool]$pass.ktrade_action_issued){
            throw 'R220_POSTCUTOVER_DURABLE_RECEIPT_INVALID'
          }
          Write-Host 'R220_POSTCUTOVER_DURABLE_CUTOVER_RECEIPT=PASS'
          $token=([IO.File]::ReadAllText((Join-Path $root 'state\operator.token'))).Trim()
          if($token.Length-ne64){throw 'R220_NATIVE_OPERATOR_TOKEN_INVALID'}
          $native=Invoke-RestMethod -Method Get -Uri 'http://127.0.0.1:8791/api/native' -Headers @{Authorization=('Bearer '+$token)} -TimeoutSec 8
          if([string]$native.authority-cne'plane' -or [string]$native.generation-cne'6' -or
             [bool]$native.heartbeat_stale -or [bool]$native.paused -or
             [bool]$native.accepted_ref_mutation_allowed){
            throw 'R220_POSTCUTOVER_NATIVE_STATUS_INVALID'
          }
          Write-Host 'R220_POSTCUTOVER_NATIVE_AUTHORITY_GENERATION_HEARTBEAT=PASS'
          $db=Join-Path $root 'state\autonomy.db'
          $src=@'
          import sqlite3,sys,json
          from pathlib import Path
          db=Path(sys.argv[1]).resolve(strict=True)
          con=sqlite3.connect('file:'+db.as_posix()+'?mode=ro',uri=True,timeout=8)
          con.execute('pragma query_only=on')
          try:
              settings=dict(con.execute("select key,value from settings where key in ('autonomy_authority','autonomy_generation','paused')"))
              leases=con.execute("select count(*) from worker_leases").fetchone()[0]
              print(json.dumps({'settings':settings,'leases':leases},separators=(',',':')))
          finally: con.close()
          '@
          $rows=@(& python.exe -B -c $src $db)
          if($LASTEXITCODE-ne0 -or $rows.Count-ne1){throw 'R220_POSTCUTOVER_READONLY_DB_FAILED'}
          $state=$rows[0]|ConvertFrom-Json
          if([string]$state.settings.autonomy_authority-cne'plane' -or
             [string]$state.settings.autonomy_generation-cne'6' -or
             [string]$state.settings.paused-cne'false'){
            throw 'R220_POSTCUTOVER_DB_AUTHORITY_DRIFT'
          }
          Write-Host ('R220_POSTCUTOVER_CURRENT_WORKER_LEASES='+[string]$state.leases)
          Write-Host 'R220_POSTCUTOVER_DB_READONLY_AUTHORITY=PASS'
          Write-Host 'R220_POSTCUTOVER_NO_KTRADE_WORKORDER_ACTIONS=PASS'
          Write-Host 'R220_POSTCUTOVER_LIVE_ACCEPTANCE=PASS'

          # R221: contrast repeated live native reads and bounded SQL aggregates.
          # This does not mutate queues, worker leases, KTRADE, or science.
          $audit=@'
          import json,sqlite3,sys
          from pathlib import Path
          db=Path(sys.argv[1]).resolve(strict=True)
          con=sqlite3.connect('file:'+db.as_posix()+'?mode=ro',uri=True,timeout=8)
          con.execute('PRAGMA query_only=ON')
          def counts(table):
              return dict(con.execute("SELECT state,COUNT(*) FROM "+table+" GROUP BY state").fetchall())
          try:
              work=counts("work_orders")
              queue=counts("queue_items")
              leases=int(con.execute("SELECT COUNT(*) FROM worker_leases").fetchone()[0])
              unfinished=int(con.execute("SELECT COUNT(*) FROM process_records WHERE finished=0").fetchone()[0])
              head=int(con.execute("SELECT COALESCE(MAX(id),0) FROM events").fetchone()[0])
              settings=dict(con.execute("SELECT key,value FROM settings WHERE key IN ('paused','autonomy_authority','autonomy_generation')"))
              print(json.dumps(dict(work_orders=work,queue=queue,leases=leases,unfinished=unfinished,event_head=head,settings=settings),sort_keys=True,separators=(',',':')))
          finally:
              con.close()
          '@
          function Observe-R221 {
            $out=@(& python.exe -B -c $audit $db)
            if($LASTEXITCODE-ne0 -or @($out).Count-ne1){throw 'R221_STATE_OBSERVATION_READ_FAILED'}
            $row=$out[0]|ConvertFrom-Json
            if([string]$row.settings.autonomy_authority -cne 'plane' -or
               [string]$row.settings.autonomy_generation -cne '6' -or
               [string]$row.settings.paused -cne 'false'){
              throw 'R221_STATE_OBSERVATION_AUTHORITY_DRIFT'
            }
            return $row
          }
          $initial=Observe-R221
          $pid1=[int]$process[0].ProcessId
          Start-Sleep -Seconds 12
          $task2=Get-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction Stop
          $procs2=@((Get-CimInstance Win32_Process -Filter "Name='ckb-plane.exe'" -ErrorAction Stop)|
            Where-Object {[string]$_.CommandLine -match '(?i)\bcontroller\s+run\b'})
          if([string]$task2.State-cne'Running' -or $procs2.Count-ne1 -or
             [string]$procs2[0].ExecutablePath -ine $newExe){
            throw 'R221_SUSTAINED_NATIVE_SINGLETON_DRIFT'
          }
          $native2=Invoke-RestMethod -Method Get -Uri 'http://127.0.0.1:8791/api/native' -Headers @{Authorization=('Bearer '+$token)} -TimeoutSec 8
          if([string]$native2.authority-cne'plane' -or [string]$native2.generation-cne'6' -or
             [bool]$native2.heartbeat_stale -or [bool]$native2.paused -or
             [bool]$native2.accepted_ref_mutation_allowed){
            throw 'R221_SUSTAINED_NATIVE_AUTHORITY_DRIFT'
          }
          $end=Observe-R221
          if([int64]$end.event_head -lt [int64]$initial.event_head){
            throw 'R221_EVENT_LEDGER_REGRESSION'
          }
          Write-Host 'R221_SUSTAINED_LIVE_NATIVE_TWO_SAMPLES=PASS'
          Write-Host ('R221_INITIAL_EVENT_HEAD='+[string]$initial.event_head)
          Write-Host ('R221_FINAL_EVENT_HEAD='+[string]$end.event_head)
          Write-Host ('R221_INITIAL_WORK_ORDER_STATES='+($initial.work_orders|ConvertTo-Json -Compress))
          Write-Host ('R221_FINAL_WORK_ORDER_STATES='+($end.work_orders|ConvertTo-Json -Compress))
          Write-Host ('R221_INITIAL_QUEUE_STATES='+($initial.queue|ConvertTo-Json -Compress))
          Write-Host ('R221_FINAL_QUEUE_STATES='+($end.queue|ConvertTo-Json -Compress))
          Write-Host ('R221_WORKER_LEASES_AT_FINAL='+[string]$end.leases)
          Write-Host ('R221_UNFINISHED_PROCESS_RECORDS_AT_FINAL='+[string]$end.unfinished)
          Write-Host 'R221_INDEPENDENT_READ_ONLY_PROGRESS_SNAPSHOT=PASS'

