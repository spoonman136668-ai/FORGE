name: F139 V19 i1138 isolated upstream G29 source-atlas regression diagnostic
on:
  push:
    branches: [qualification/f139-v19-i1138-atlas-failure-isolation-20261029]
    paths: [.github/workflows/f139-v19-i1138-atlas-failure-isolation.yml]
permissions:
  contents: read
concurrency:
  group: f139-v19-i1138-atlas-diagnostic-20261029
  cancel-in-progress: false
jobs:
  isolated-regression:
    if: >-
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.actor == 'spoonman136668-ai' &&
      github.ref == 'refs/heads/qualification/f139-v19-i1138-atlas-failure-isolation-20261029' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/Yggdrasil
          ref: 021423311027517c9096c76bed7d35ac53c4a229
          path: baseline
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/Yggdrasil
          ref: 339276862e42a067344990dc20d907f203009b90
          path: candidate
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare pristine upstream G29 checks to in-place staging of same authenticated candidate bytes
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          original=021423311027517c9096c76bed7d35ac53c4a229
          proposed=339276862e42a067344990dc20d907f203009b90
          path=yggdrasil/public_causal_cells.py
          [ "$(git -C baseline rev-parse HEAD)" = "$original" ]
          [ "$(git -C candidate rev-parse HEAD)" = "$proposed" ]
          [ "$(git -C candidate rev-parse HEAD^)" = "$original" ]
          [ "$(git -C baseline status --porcelain --untracked-files=all)" = '' ]
          [ "$(git -C candidate status --porcelain --untracked-files=all)" = '' ]
          diff_names="$(git -C candidate diff --name-only HEAD^ HEAD)"
          [ "$diff_names" = "$path" ]
          [ "$(git -C candidate diff --numstat HEAD^ HEAD | wc -l | tr -d ' ')" = 1 ]
          echo 'F139_I1138_EXACT_PARENT_SINGLE_FILE=PASS'
          set +e
          (cd baseline && python -B -m unittest discover -s tests -p test_code_atlas.py -v) > original-atlas.log 2>&1
          baseline_rc=$?
          (cd candidate && python -B -m unittest discover -s tests -p test_code_atlas.py -v) > candidate-atlas.log 2>&1
          candidate_rc=$?
          set -e
          echo '=== F139 I1138 CLEAN BASELINE ATLAS TEST DETAILS ==='
          tail -n 75 original-atlas.log
          echo '=== F139 I1138 CLEAN COMMITTED CANDIDATE ATLAS TEST DETAILS ==='
          tail -n 75 candidate-atlas.log
          echo "F139_I1138_PRISTINE_BASELINE_ATLAS_RETURN_CODE=$baseline_rc"
          echo "F139_I1138_PRISTINE_CANDIDATE_ATLAS_RETURN_CODE=$candidate_rc"
          cp "candidate/$path" "baseline/$path"
          cmp "baseline/$path" "candidate/$path"
          [ "$(git -C baseline diff --name-only)" = "$path" ]
          echo 'F139_I1138_STAGED_CANDIDATE_BYTES=EXACT'
          set +e
          (cd baseline && python -B -m unittest discover -s tests -p test_code_atlas.py -v) > staged-atlas.log 2>&1
          staged_rc=$?
          set -e
          echo '=== F139 I1138 UNCOMMITTED ISOLATED WORKER-STAGED G29 TEST DETAILS ==='
          tail -n 100 staged-atlas.log
          echo "F139_I1138_STAGED_ATLAS_RETURN_CODE=$staged_rc"
          echo "F139_I1138_BASELINE_AND_STAGE_COMPARISON=OBSERVED"
          echo 'F139_I1138_NO_OWNER_SQLITE_WORKER_RETRY_OR_SOURCE_MUTATION=TRUE'
