name: ITD-02 MG51 original MG50 predictive public-change versus goal relevance read-only audit
on:
  push:
    branches: [research/itd02-mg51-mg50-original-goal-relevance-attribution-20261029]
permissions:
  contents: read
  actions: read
jobs:
  frozen-source-only-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact LF source settings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout unchanged pinned MG50 research and MG51 source-only diagnostic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify source lineage and all original policy binaries remain untouched
        shell: pwsh
        run: |
          git merge-base --is-ancestor 037c3237b3a34258fe81b7d184ec9d04447f9fff $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'MG51_AUDIT_METRIC_FREEZE_NOT_BEFORE_EXECUTABLE' }
          $changed=@(git diff --name-only 9b4c85c02926a3591a9feff8b821e47e3b5c4668 $env:GITHUB_SHA)
          $expected=@('research/lcrm01/mg51_mg50_goal_relevance_audit_prereg.json',
            'research/lcrm01/mg51_mg50_goal_relevance_audit.py',
            '.github/workflows/itd02-mg51-mg50-goal-relevance-audit.yml')
          if (@(Compare-Object $changed $expected).Count -ne 0) { throw 'MG51_UNAUTHORIZED_MODEL_OR_SOURCE_CHANGE' }
          python -B research/lcrm01/mg51_mg50_goal_relevance_audit.py --preflight
          if ($LASTEXITCODE -ne 0) { throw 'MG51_DIAGNOSTIC_PREFLIGHT_FAIL' }
          if (git status --porcelain --untracked-files=all) { throw 'MG51_SOURCE_NOT_CLEAN' }
          Write-Host MG51_FROZEN_READONLY_AUDIT_CROSS_HOST_SOURCE_PREFLIGHT_PASS_NO_SCIENCE
  pinned-exposed-source-only-audit:
    needs: frozen-source-only-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact LF source settings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download exact immutable original MG50 original-world evidence archive, no new action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mg51"
          curl --fail --silent --show-error --location --max-time 120 --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/spoonman136668-ai/FORGE/actions/artifacts/12939728373/zip" \
            --output "$RUNNER_TEMP/mg51/mg50-immutable.zip"
          test "$(stat -c%s "$RUNNER_TEMP/mg51/mg50-immutable.zip")" -lt 20000000
          printf '%s  %s\n' 94dce7d4643640620afd9e67b370bbd05bfd6fd60bf012301ed3c1f69c910527 "$RUNNER_TEMP/mg51/mg50-immutable.zip" | sha256sum --check --status
          echo MG51_ORIGINAL_EXPOSED_ARCHIVE_BYTE_CUSTODY_PASS
      - name: Audit original MG50 source public transitions and genuine goal-relevance associations
        shell: bash
        run: |
          set -euo pipefail
          python -B research/lcrm01/mg51_mg50_goal_relevance_audit.py \
            --archive "$RUNNER_TEMP/mg51/mg50-immutable.zip" \
            --output "$RUNNER_TEMP/mg51/report.json" \
            > "$RUNNER_TEMP/mg51/diagnostic.log"
          grep -F 'MG51_MG50_ORIGINAL_SOURCE_GOAL_RELEVANCE_DIAGNOSTIC_PASS_NO_SCIENCE' "$RUNNER_TEMP/mg51/diagnostic.log"
          grep -F 'MG51_TWO_COMPLETE_ORIGINAL_MG50_SOURCE_PROCESSES_VERIFIED' "$RUNNER_TEMP/mg51/diagnostic.log"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo MG51_EXPOSED_SOURCE_ONLY_AUDIT_COMPLETE_NO_FARAMA_ACTION_OR_SCIENTIFIC_FIRST_USE
      - name: Upload compact original-source validated diagnostic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mg51-mg50-original-goal-relevance-audit
          path: |
            ${{ runner.temp }}/mg51/report.json
            ${{ runner.temp }}/mg51/diagnostic.log
          if-no-files-found: warn
          retention-days: 30
