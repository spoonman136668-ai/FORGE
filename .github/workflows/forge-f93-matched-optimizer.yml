name: FORGE F93 matched-block optimizer source qualification
on:
  push:
    branches: [engineering/f93-matched-block-optimizer-design-20261016-r1]
    paths:
      - 'optimizerstages/f93_*'
      - '.github/workflows/forge-f93-matched-optimizer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'optimizerstages/f93_*'
      - '.github/workflows/forge-f93-matched-optimizer.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: forge-f93-matched-optimizer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  matched-block-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Read F92 qualified optimizer source as historical provenance only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api --method GET repos/spoonman136668-ai/FORGE/actions/runs/38964701683 > "$RUNNER_TEMP/f93-f92.json"
          python3 - "$RUNNER_TEMP/f93-f92.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["id"]==38964701683
          assert r["repository"]["full_name"]=="spoonman136668-ai/FORGE"
          assert r["head_sha"]=="1ff520ee4ae84a24d84ece0fc7cce69c4c8aa845"
          assert r["status"]=="completed" and r["conclusion"]=="success"
          assert r["name"]=="FORGE F92 six-arm precision feasibility guard"
          print("F93_AUTHENTIC_F92_SOURCE_CI=PASS")
          print("F93_GENUINE_MATCHED_TRIAL_ORIGINALS=NOT_ESTABLISHED")
          PY
      - name: Match-block math and adversarial fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -run '^TestF93' -v ./optimizerstages
          go test -count=1 ./optimizerstages ./dreamrsi ./evoportfolio ./thetaadapt ./promptlineage ./genenv
          go vet ./optimizerstages
          echo 'F93_MATCHED_COMPARISONS=SOURCE_ONLY_NOT_PROSPECTIVE'
          echo 'F93_INDEPENDENT_TASK_BLOCKS_AND_UNIFORM_RANDOMIZATION=NOT_VERIFIED'
          echo 'F93_POLICY_PROMOTION=DENIED'
          echo 'F93_THETAEVOLVE_ACCEPTED_TRAINING=DENIED'
          echo 'F93_SCIENTIFIC_DISPATCH=ZERO'
          echo 'F93_CLOUDFLARE_WRITES=ZERO'
          echo 'F93_CKB_DEPENDENCIES=ZERO'
      - name: Whole FORGE source regression and vet
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo 'F93_MATCHED_BLOCK_SOURCE_QUALIFICATION=PASS'
