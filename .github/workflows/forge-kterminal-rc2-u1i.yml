name: RC2-U1I fixture-corrected matched K-Terminal failed-test control
on:
  push:
    branches: [qualification/kterminal-rc2-u1i-fixture-differential-20261021]
permissions:
  contents: read
jobs:
  windows-differential:
    runs-on: windows-latest
    timeout-minutes: 29
    env:
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '1'
      GOFLAGS: '-p=1'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify isolated hosted FORGE source and PAPER only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-rc2-u1i-fixture-differential-20261021' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:RUNNER_OS -cne 'Windows' -or
              $env:K_TERMINAL_EXECUTION_MODE -cne 'PAPER' -or
              $env:K_TERMINAL_P5_LATENCY -cne '0' -or
              $env:K_TERMINAL_NATIVE_TIMING -cne '0') { throw 'RC2_U1I_ISOLATION_FAIL' }
          $d=@(git diff --name-only 5662e3586bc9d12c90033b7c0344ca65ea1ad2a0 HEAD)
          if (($d -join '|') -cne '.github/workflows/forge-kterminal-rc2-u1i.yml') {
            throw 'RC2_U1I_FORGE_SOURCE_DRIFT'
          }
          foreach ($n in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
                           'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET')) {
            if (-not [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($n))) {
              throw 'RC2_U1I_BROKER_CREDENTIAL_BLOCK'
            }
          }
          Write-Host 'RC2_U1I_ISOLATION=PASS'
      - name: Checkout PR74-only frozen Windows control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: bfb11fca02a970c869642b00bc9096ef5f2ed67a
          path: kterm-control
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Checkout exact combined RC2-U1E candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: ca0f2ce5c518620ab50f6f75bfa12d25f2b55de1
          path: kterm-candidate
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Retest eight failing roots with correct isolated retention fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C kterm-control rev-parse HEAD)" = bfb11fca02a970c869642b00bc9096ef5f2ed67a
          test "$(git -C kterm-candidate rev-parse HEAD)" = ca0f2ce5c518620ab50f6f75bfa12d25f2b55de1
          go version | grep -q 'go1.26.5 windows/amd64'
          echo RC2_U1I_SOURCE_IDENTITIES=PASS
          roots='TestNativeRecoveryFinancialReceiptAfterVerifiedRefreshProgress|TestNativeRuntimeProfileColdV2OriginalActorReady|TestNativeRuntimeProfileColdV2UnauthorizedChangeBlocked|TestStage3AuthenticatedNativeSellPostBoundaries|TestStage3DrawdownMarkProcessKillBoundariesV1|TestStage3MixedNativeHistoryProductionIntelligenceV2|TestStage3NativeActiveProductionShutdown|TestStage3NativeHistoricalHistoryCheckpointV2'
          for case in control candidate; do
            # The original crash/recovery tests demand owner-controlled, pre-existing,
            # absolute directories. Isolate all retention fixtures by source identity.
            export K_TERMINAL_TEST_WORKSPACE="$RUNNER_TEMP/rc2u1i-$case/workspace"
            export KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT="$RUNNER_TEMP/rc2u1i-$case/auth"
            export KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT="$RUNNER_TEMP/rc2u1i-$case/tail"
            export KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT="$RUNNER_TEMP/rc2u1i-$case/private"
            mkdir -p "$K_TERMINAL_TEST_WORKSPACE" "$KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT" "$KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT" "$KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT"
            for entry in "$K_TERMINAL_TEST_WORKSPACE" "$KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT" "$KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT" "$KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT"; do
              test -d "$entry"
              [[ "$entry" == /* || "$entry" =~ ^[A-Za-z]:[/\\] ]] || { echo RC2_U1I_FIXTURE_NOT_ABSOLUTE; exit 2; }
            done
            echo "RC2_U1I_${case}_FIXTURE_CUSTODY=PASS"
            pushd "kterm-$case" > /dev/null
            set +e
            go test -json -count=1 -p=1 -parallel=1 -timeout=10m "-run=^($roots)$" ./pkg > "$RUNNER_TEMP/rc2u1i-$case-private.jsonl" 2> "$RUNNER_TEMP/rc2u1i-$case-private.stderr"
            rc=$?
            set -e
            popd > /dev/null
            echo "RC2_U1I_${case}_EXIT=$rc"
            if [[ "$rc" -ne 0 && "$rc" -ne 1 ]]; then exit 2; fi
          done
          python -B - <<'PY'
          import json,os,pathlib,re,sys
          roots=['TestNativeRecoveryFinancialReceiptAfterVerifiedRefreshProgress',
            'TestNativeRuntimeProfileColdV2OriginalActorReady','TestNativeRuntimeProfileColdV2UnauthorizedChangeBlocked',
            'TestStage3AuthenticatedNativeSellPostBoundaries','TestStage3DrawdownMarkProcessKillBoundariesV1',
            'TestStage3MixedNativeHistoryProductionIntelligenceV2',
            'TestStage3NativeActiveProductionShutdown','TestStage3NativeHistoricalHistoryCheckpointV2']
          verdict={}
          for case in ('control','candidate'):
              path=pathlib.Path(os.environ['RUNNER_TEMP'])/('rc2u1i-'+case+'-private.jsonl')
              if not path.exists() or path.stat().st_size>90000000:
                  print('RC2_U1I_PRIVATE_OUTPUT_BOUND=FAIL');sys.exit(2)
              events={n:[] for n in roots}
              bad=0
              for line in path.open(encoding='utf-8',errors='replace'):
                  try:row=json.loads(line)
                  except ValueError:bad+=1;continue
                  n=row.get('Test')
                  if n in events and row.get('Action') in ('run','pass','fail','skip'):
                      events[n].append(row['Action'])
              if bad or any('run' not in a or not any(x in a for x in ('pass','fail','skip')) for a in events.values()):
                  print('RC2_U1I_'+case.upper()+'_INCOMPLETE=TRUE')
                  sys.exit(2)
              verdict[case]={n:('FAIL' if 'fail' in a else 'SKIP' if 'skip' in a else 'PASS') for n,a in events.items()}
              for n in roots:print('RC2_U1I_'+case.upper()+'_'+n+'='+verdict[case][n])
          if any('SKIP' in (verdict['control'][n],verdict['candidate'][n]) for n in roots):
              print('RC2_U1I_DIFFERENTIAL=INCOMPLETE_SKIPPED');sys.exit(2)
          introduced=[n for n in roots if verdict['control'][n]=='PASS' and verdict['candidate'][n]=='FAIL']
          inherited=[n for n in roots if verdict['control'][n]=='FAIL' and verdict['candidate'][n]=='FAIL']
          print('RC2_U1I_INHERITED_FAILED_ROOTS='+(','.join(inherited) if inherited else 'NONE'))
          print('RC2_U1I_INTRODUCED_FAILED_ROOTS='+(','.join(introduced) if introduced else 'NONE'))
          print('RC2_U1I_FULL_REGRESSION=NOT_RERUN')
          print('RC2_U1I_RELEASE_ACCEPTANCE=BLOCKED')
          if introduced:
              print('RC2_U1I_MATCHED_FOCUSED_DIFFERENTIAL=FAIL');sys.exit(1)
          print('RC2_U1I_MATCHED_FOCUSED_DIFFERENTIAL=NO_NEW_FAILURES')
          PY
