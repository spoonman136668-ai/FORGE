name: ITD-02 MG15 Wingless/Ygg online-learning versus cold-frozen original public ablation
on:
  push:
    branches:
      - research/itd02-mg15-wingless-learning-ablation-20261029
permissions:
  contents: read
jobs:
  two-process-original-selected-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Original source LF policy
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact authenticated development source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Source Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Native Go 1.25.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Two independent authentic original Farama 4-arm source evaluations
        shell: bash
        run: bash research/lcrm01/mg15_ci.sh
      - name: Preserve original selected source and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-mg15-original-door-key-motion-source-evidence
          path: |
            ${{ runner.temp }}/mg15/first.json
            ${{ runner.temp }}/mg15/second.json
            ${{ runner.temp }}/mg15/comparison.json
            ${{ runner.temp }}/mg15/first.log
            ${{ runner.temp }}/mg15/second.log
          retention-days: 30
          if-no-files-found: warn
