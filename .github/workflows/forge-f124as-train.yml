name: F124-AS first authentic TRAIN screen (no DEV)
on:
  push:
    branches: [research/f124as-noise-tolerant-relational-code-and-packed-counterfactual-20261018]
    paths:
      - '.github/workflows/forge-f124as-train.yml'
      - 'nativeevidence/f124as_train_selection.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: f124as-original-train-screen
  cancel-in-progress: false
jobs:
  original-fresh-train:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 35
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preimplementation source and real original historical custody
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          f=reference/research-intake/f124as-frozen-noisy-relations-and-packed-forks.json
          test "$(git hash-object "$f")" = 8920dcdc81e5cfb4355d0943eff1be359926ab04
          test "$(git log -1 --format=%H -- "$f")" = 78bc985278f74f114414b6f39a2296ff73c939fa
          test "$(git rev-parse 'bc5c1dad37637247f105c98d98c1dd0ed2ae1f92:nativeevidence/f124ar_train_source.py')" = 8fe8af6f16dbe730f791994252a2bf136be6f337
          gh api repos/spoonman136668-ai/FORGE/actions/runs/39136089497 --jq '.head_sha + " " + .conclusion' | grep -Fx '75b37350fee1c5460ab8e66406e588f6b46f7883 success'
          while read -r run head artifact digest; do
            test -n "$run" || continue
            actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '[.head_sha,.status,.conclusion,.event] | join(" ")')
            test "$actual" = "$head completed success push" || { echo "F124AS_ORIGINAL_RUN_IDENTITY_FAILURE:$run"; exit 1; }
            got=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq ".artifacts[] | select(.id==$artifact and .expired==false) | .digest")
            test "$got" = "$digest" || { echo "F124AS_ORIGINAL_ARTIFACT_DRIFT:$run"; exit 1; }
          done <<'PROVENANCE'
          39078269441 5b52da1e38d5ff5671c582676790daf0462dd18d 12116979526 sha256:fefa2135a029660f36970a66b08809aaa128c5f6d2b3c5705ef8a29a9b4f014c
          39082424955 01560f7f4f1aab5737cfd045dffd7faaccfb0608 12120010101 sha256:b1b483e03a1ba8f9a66e75e11d48481573d24926b8f17dc77db076158c3168f3
          39118489510 ca46eba41179a1c6d9cd0bfa74119782c6d11d88 12132914773 sha256:eb30d76eccdf8f33e24b6348c43d17acb50c3fcbafec8ec039a6b4239593abeb
          39122374949 a0d15c8cf307a9c7972728899b525f79717049c7 12134498287 sha256:5d189c95dfdc00ce5a00b7170236d9514175b2b3b77fc7407522c16ecf878f2c
          39123857883 c5330bbff435febe198c55e9da19beb17bc613d8 12135381471 sha256:008018afc6bb3b564439191dea0ac38423fd651609e7885a9068b714c36f09ef
          39124962572 1d4222158da000f66f6ad28033c9b15f4dcabe93 12136050383 sha256:59120d20472eb45661c9c5599a6e832824866abc25cf8e68e34d8d604f841a97
          39133441550 d261861f31c34152ffe9d7081302f764ac02fb7d 12138622197 sha256:af5ad2a392481dbb7819bb28a0524b308330c2065b98ed20688de35a6516e0a7
          PROVENANCE
          echo 'F124AS_HISTORICAL_PROVIDER_CUSTODY=PASS'
      - uses: actions/download-artifact@v4
        with:
