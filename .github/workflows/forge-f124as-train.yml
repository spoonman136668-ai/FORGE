          python3 -B nativeevidence/f124as_train_selection.py \
            --o originals/o/f124o-independent-two-learned-development.json \
            --t originals/t/f124t-fresh-absolute-development.json \
            --an originals/an/f124an-calibrated-affine-wing-isolation.json \
            --ao originals/ao/f124ao-first-dev-independent-evidence.json \
            --ap originals/ap/f124ap-authentic-kernel-hop-train.json \
            --aq originals/aq/f124aq-train.json \
            --ar originals/ar/f124ar-original-fresh-train.json \
            --output "$RUNNER_TEMP/f124as-original-train.json"
          python3 -B -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p["schema"]=="forge.research.f124as.original-source-authenticated-train-selection.v1"; assert p["preimplementation_freeze_blob"]=="8920dcdc81e5cfb4355d0943eff1be359926ab04"; assert len(p["TRAIN"]["Yggdrasil"]["candidate_grid"])==8 and len(p["TRAIN"]["Wingless"]["candidate_grid"])==7; assert p["new_sources"]["Yggdrasil"]["pairs"]==p["new_sources"]["Wingless"]["pairs"]==48 and p["DEV_cases_generated"]==0 and p["DEV_consumed"] is False and p["optimizer_promotion"] is False' "$RUNNER_TEMP/f124as-original-train.json"
          sha256sum "$RUNNER_TEMP/f124as-original-train.json" > "$RUNNER_TEMP/f124as-original-train.json.sha256"
          echo 'F124AS_ORIGINAL_TRAIN_ONLY=PASS'
          echo 'F124AS_DEV_CONSUMED=false'
      - uses: actions/upload-artifact@v4
        with:
          name: f124as-original-new-train-${{ github.sha }}
          path: |
            ${{ runner.temp }}/f124as-original-train.json
            ${{ runner.temp }}/f124as-original-train.json.sha256
          if-no-files-found: error
          retention-days: 90
