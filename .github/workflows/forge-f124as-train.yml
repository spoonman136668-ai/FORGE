          github-token: ${{ github.token }}
          name: f124ap-authentic-train-only-c5330bbff435febe198c55e9da19beb17bc613d8
          path: originals/ap
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39124962572
          github-token: ${{ github.token }}
          name: f124aq-train-1d4222158da000f66f6ad28033c9b15f4dcabe93
          path: originals/aq
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39133441550
          github-token: ${{ github.token }}
          name: f124ar-original-train-d261861f31c34152ffe9d7081302f764ac02fb7d
          path: originals/ar
      - name: Verify raw bytes then screen all frozen NEW TRAIN-only candidates
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '025c97abc8eb69079d7d7d0f59bfdb81235b9ad9ab83e230f32b542d2cfbdb5d  originals/o/f124o-independent-two-learned-development.json' \
