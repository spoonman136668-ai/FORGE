name: F124-BB append-only original scientific raw evidence archival
on:
  push:
    branches: [research/f124bb-public-disagreement-veto-20261018]
    paths: ['.github/workflows/forge-f124bb-durable-original.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: f124bb-single-original-append-only-receipt
  cancel-in-progress: false
jobs:
  original-archive:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39163058506
          github-token: ${{ github.token }}
          name: f124bb-original-public-disagreement-ten-arm-fit-screen-5f1779f7b248993a50e1fd6b073827323b084f24
          path: original
      - name: Authenticate provider first-use and append original bytes ONLY to feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'research/f124bb-public-disagreement-veto-20261018'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39163058506" --jq '[.head_sha,.status,.conclusion,.event] | join(" ")')" = '5f1779f7b248993a50e1fd6b073827323b084f24 completed success push'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39163058506/artifacts" --jq '.artifacts[] | select(.id==12149792073 and .expired==false) | .digest')" = 'sha256:0b70a5390d400c65426598b4c0a8c00811f65915d61ade99464303e2ae4cec1b'
          echo 'd430f9887adb33c82aa68cd58818677dadd06ddf237e3315aef9c1beeb437f48  original/f124bb-original-fit-screen.json' | sha256sum --check --strict
          dest='reference/research-intake/originals/f124bb-original-public-disagreement-ten-arm-fit-screen.json'
          if gh api "repos/$GITHUB_REPOSITORY/contents/$dest?ref=$GITHUB_REF_NAME" --silent >/dev/null 2>&1; then
            echo F124BB_APPEND_ONLY_ORIGINAL_ALREADY_EXISTS
            exit 1
          fi
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          test "$remote_sha" = "$GITHUB_SHA" || { echo 'F124BB_FEATURE_BRANCH_DRIFT_STOP'; exit 1; }
          python3 -B - <<'PY'
          import json
          d=json.load(open('original/f124bb-original-fit-screen.json'))
          assert d['schema']=='forge.research.f124bb.original-disagreement-public-contrast-TRAIN.v1'
          assert d['source_freeze_blob']=='56e77ac974b4c4673d9d1ba5e012357719165711'
          assert d['FIT_selected_before_held_SCREEN'] is None
          assert d['FIT_control_paired']==12
          assert d['SCREEN_models']['joint_balanced48']['paired']==21
          assert d['SCREEN_models']['disagreement_balanced_veto2']['paired']==21
          assert all(x['public_response_calls']==1152 for x in d['SCREEN_models'].values())
          assert d['SCREEN_strict_frozen_joint_success'] is False
          assert d['FIT_models']['joint_random48']['FP']==0
          assert d['SCREEN_models']['joint_random48']['FP']==1
          assert all(not row['public_CHECK_veto_applied'] for arm in d['FIT_models'].values() for row in arm['case_outcomes'] if row.get('public_CHECK_veto_applied') is not None)
          assert all(not row['public_CHECK_veto_applied'] for arm in d['SCREEN_models'].values() for row in arm['case_outcomes'] if row.get('public_CHECK_veto_applied') is not None)
          assert d['Ygg_DEV_generated']==d['Wingless_DEV_generated']==0
          assert d['Ygg_DEV_consumed'] is False and d['Wingless_DEV_consumed'] is False
          assert len(d['FIT_models'])==len(d['SCREEN_models'])==10
          print('F124BB_FULL_ORIGINAL_SOURCE_NEGATIVE_AUTHENTICATED=PASS')
          PY
          # A 311 KB original exceeds OS argument-size limits when passed as -f.
          # Pipe immutable encoded bytes through a temporary JSON request body.
          python3 -B - <<'PY'
          import base64,json,os
          original=open("original/f124bb-original-fit-screen.json","rb").read()
          request={
              "message":"F124-BB append original unmodified authenticated 10-arm disagreement TRAIN FIT SCREEN case evidence",
              "content":base64.b64encode(original).decode("ascii"),
              "branch":os.environ["GITHUB_REF_NAME"]}
          with open("/tmp/f124bb-original-append-request.json","w",encoding="utf-8") as f:
              json.dump(request,f,separators=(",",":"))
          print("F124BB_ORIGINAL_RAW_REQUEST_READY=PASS")
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$dest" \
            --input /tmp/f124bb-original-append-request.json \
            --jq '[.commit.sha,.content.sha] | join(" ")'
          echo F124BB_ORIGINAL_RAW_LONGTERM_REPOSITORY_ARCHIVED=PASS
          echo F124BB_NO_SCIENTIFIC_PROMOTION=true
