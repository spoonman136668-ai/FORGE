name: R333 original CKB attempt4 shallow Git marker read-only
on:
  push:
    branches: [audit/ckb-r333-attempt4-shallow-marker-readonly-20261025]
    paths: [.github/workflows/ckb-r333-attempt4-shallow-marker-readonly.yml]
permissions:
  contents: read
concurrency:
  group: r333-existing-original-owner-readonly-git-custody
  cancel-in-progress: false
jobs:
  observe:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Inspect existing pinned private attempt4 ancestry boundary only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version 3.0
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF_NAME -cne 'audit/ckb-r333-attempt4-shallow-marker-readonly-20261025' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $who.Name -ine 'LINKDEADKB\camar' -or
             ![Security.Principal.WindowsPrincipal]::new($who).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){
            throw 'R333_AUTHENTIC_ORIGINAL_OWNER_REQUIRED'
          }
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $source='C:\Users\camar\GolandProjects\ktrade-rb1-plane'
          $db=Join-Path $root 'state\autonomy.db'
          $config=Join-Path $root 'config\autonomy.yaml'
          $id='KTRADE_RB1_SINGLE_TRACK_20261022'
          $base='bde51540fe5da8e2fbf7b6e6ce5043ad373e1a96'
          $parent='8101e4822b336a5f6d297410f76d51db1b6fe52c'
          $workerBranch='codex/ktrade-rb1-single-track-20261022'
          function Sha([string]$p){(Get-FileHash -LiteralPath $p -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()}
          function G([string]$cwd,[string[]]$argv){
            $prior=$ErrorActionPreference
            try{$ErrorActionPreference='Continue';$out=@(& git.exe -C $cwd @argv 2>&1);$rc=$LASTEXITCODE}
            finally{$ErrorActionPreference=$prior}
            return @{rc=$rc;value=($out -join [Environment]::NewLine).Trim()}
          }
          $procs=@(Get-CimInstance Win32_Process -Filter "Name='ckb-plane.exe'" -ErrorAction Stop)
          if($procs.Count -ne 1){throw 'R333_NATIVE_ORIGINAL_PROCESS_COUNT_CHANGED'}
          if((Sha ([string]$procs[0].ExecutablePath)) -cne '82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678' -or
             (Sha $config) -cne 'a14f210a146de9bd248bb4cfdc2e156b19c985a6c964a91881c4391f0a0190dc'){
            throw 'R333_ORIGINAL_R303_PROCESS_CONFIG_DRIFT'
          }
          $py=@'
          import json,sqlite3,sys
          from pathlib import Path
          path=Path(sys.argv[1]).resolve(strict=True)
          db=sqlite3.connect(path.as_uri()+'?mode=ro',uri=True,timeout=10)
          try:
              db.execute('PRAGMA query_only=ON')
              vals=dict(db.execute("SELECT key,value FROM settings WHERE key IN ('autonomy_authority','autonomy_generation')"))
              if vals.get('autonomy_authority')!='plane' or vals.get('autonomy_generation')!='6':
                  raise RuntimeError('R333_PLANE_AUTHORITY_GENERATION_CHANGED')
              row=db.execute('SELECT state,attempt,workspace FROM work_orders WHERE id=?',(sys.argv[2],)).fetchone()
              if not row or row[0]!='BLOCKED' or int(row[1])!=4:
                  raise RuntimeError('R333_ORIGINAL_ATTEMPT4_WORKORDER_NOT_BLOCKED')
              lease=db.execute('SELECT COUNT(*) FROM worker_leases WHERE work_order_id=?',(sys.argv[2],)).fetchone()[0]
              if lease!=0: raise RuntimeError('R333_WORKER_LEASE_NOT_QUIESCENT')
              print(json.dumps({'state':row[0],'attempt':row[1],'workspace':row[2],'lease_count':lease},separators=(',',':')))
          finally:db.close()
          '@
          $raw=@(& python.exe -B -c $py $db $id)
          if($LASTEXITCODE -ne 0 -or $raw.Count -ne 1){throw 'R333_WORKORDER_IDENTITY_READ_UNAVAILABLE'}
          $record=$raw[0]|ConvertFrom-Json
          $work=[IO.Path]::GetFullPath([string]$record.workspace)
          $prefix=[IO.Path]::GetFullPath((Join-Path $root 'workspaces\s'))+[IO.Path]::DirectorySeparatorChar
          if(!$work.StartsWith($prefix,[StringComparison]::OrdinalIgnoreCase) -or
             (Split-Path -Leaf $work) -cne 'worktree' -or
             !(Test-Path -LiteralPath $work -PathType Container)){
            throw 'R333_ATTEMPT4_PRIVATE_WORKTREE_IDENTITY_INVALID'
          }
          $private=Join-Path (Split-Path -Parent $work) 'repository'
          $shallow=Join-Path $private '.git\shallow'
          $head=G $work @('rev-parse','HEAD')
          $branch=G $work @('symbolic-ref','--short','HEAD')
          $sHead=G $source @('rev-parse','HEAD')
          $sShallow=G $source @('rev-parse','--is-shallow-repository')
          $aShallow=G $work @('rev-parse','--is-shallow-repository')
          $ancestor=G $work @('merge-base','--is-ancestor',$base,'HEAD')
          $baseObject=G $work @('cat-file','-e',($base+'^{commit}'))
          $parentObject=G $work @('cat-file','-e',($parent+'^{commit}'))
          $workStatus=G $work @('status','--porcelain')
          $sourceStatus=G $source @('status','--porcelain')
          $refs=G $private @('for-each-ref','--format=%(refname) %(objectname)')
          $predicates=[ordered]@{
            WORKTREE_HEAD_PINN=($head.rc -eq 0 -and $head.value -ceq $base)
            WORKTREE_BRANCH_PINNED=($branch.rc -eq 0 -and $branch.value -ceq $workerBranch)
            SOURCE_HEAD_PINNED=($sHead.rc -eq 0 -and $sHead.value -ceq $base)
            SOURCE_SHALLOW=($sShallow.rc -eq 0 -and $sShallow.value -ceq 'true')
            WORKTREE_SHALLOW=($aShallow.rc -eq 0 -and $aShallow.value -ceq 'true')
            BASE_OBJECT_PRESENT=($baseObject.rc -eq 0)
            PARENT_OBJECT_MISSING=($parentObject.rc -ne 0)
            ANCESTRY_EXIT128=($ancestor.rc -eq 128)
            SOURCE_CLEAN=($sourceStatus.rc -eq 0 -and $sourceStatus.value -eq '')
            WORKTREE_STATUS_READABLE=($workStatus.rc -eq 0)
            PRIVATE_REFS_READABLE=($refs.rc -eq 0)
          }
          foreach($k in $predicates.Keys){Write-Output ('R333_PREIMAGE_'+$k+'='+[string]$predicates[$k])}
          if($head.rc -ne 0 -or $head.value -cne $base -or
             $branch.rc -ne 0 -or $branch.value -cne $workerBranch -or
             $sHead.rc -ne 0 -or $sHead.value -cne $base -or
             $sShallow.rc -ne 0 -or $sShallow.value -cne 'true' -or
             $aShallow.rc -ne 0 -or $aShallow.value -cne 'true' -or
             $baseObject.rc -ne 0 -or $parentObject.rc -eq 0 -or
             $ancestor.rc -ne 128 -or
             $sourceStatus.rc -ne 0 -or $sourceStatus.value -ne '' -or
             $workStatus.rc -ne 0 -or $refs.rc -ne 0){
            throw 'R333_SHALLOW_ANCESTRY_ROOT_CAUSE_PREIMAGE_CHANGED'
          }
          if(!(Test-Path -LiteralPath $shallow -PathType Leaf)){throw 'R333_SHALLOW_MARKER_MISSING'}
          $item=Get-Item -LiteralPath $shallow -Force -ErrorAction Stop
          if(($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw 'R333_SHALLOW_MARKER_ALIAS_FORBIDDEN'}
          $bytes=[IO.File]::ReadAllBytes($shallow)
          if($bytes.Length -gt 4096 -or $bytes.Length -lt 40){throw 'R333_SHALLOW_MARKER_BOUNDS_INVALID'}
          $text=[Text.Encoding]::ASCII.GetString($bytes)
          $lines=@($text -split "\r?\n" | Where-Object {$_ -ne ''})
          if($lines.Count -gt 64 -or @($lines|Where-Object {$_ -notmatch '^[0-9a-f]{40}$'}).Count -gt 0){
            throw 'R333_SHALLOW_MARKER_CONTENT_INVALID'
          }
          Write-Output 'R333_ORIGINAL_R303_RUNNING_PROCESS_AND_GENERATION6=PASS'
          Write-Output 'R333_EXACT_NATIVE_WORKORDER_BLOCKED_ATTEMPT4_ZERO_LEASE=PASS'
          Write-Output 'R333_SOURCE_AND_PRIVATE_HEADS_EXACT_PIN=PASS'
          Write-Output 'R333_WORKTREE_BRANCH_CORRECT=PASS'
          Write-Output 'R333_ANCESTRY_EXIT_128_REPRODUCED=PASS'
          Write-Output ('R333_PRIVATE_SHALLOW_MARKER_SHA256='+[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant())
          Write-Output ('R333_PRIVATE_SHALLOW_LINES='+$lines.Count)
          Write-Output ('R333_PRIVATE_BOUNDARY_INCLUDES_BASE='+[string]($lines -ccontains $base))
          Write-Output ('R333_PRIVATE_BOUNDARY_INCLUDES_PARENT='+[string]($lines -ccontains $parent))
          Write-Output ('R333_WORKTREE_HAS_CHANGES='+[string]($workStatus.value -ne ''))
          Write-Output ('R333_PRIVATE_REFS_AVAILABLE='+[string]($refs.rc -eq 0))
          Write-Output 'R333_NO_ORIGINAL_WORK_ORDER_REASON_QUERIED=TRUE'
          Write-Output 'R333_NO_PRIVATE_GIT_METADATA_OR_QUEUE_WRITES=TRUE'
          Write-Output 'R333_NO_CONTROLLER_CUTOVER_DISPATCH_RETRY_OR_CODEX=TRUE'
