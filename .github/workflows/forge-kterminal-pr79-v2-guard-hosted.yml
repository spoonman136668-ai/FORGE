name: FORGE K-Terminal PR79 one-GET guard original Windows qualification
on:
  push:
    branches: [qualification/kterminal-pr79-v2-get-guard-hosted-20261105]
    paths: [.github/workflows/forge-kterminal-pr79-v2-guard-hosted.yml]
permissions:
  contents: read
concurrency:
  group: forge-kterminal-pr79-hosted-source
  cancel-in-progress: false
jobs:
  original-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      KTERM_SHA: 9eb3197af01bc4a48bfd6036c6bc8f82a15b0c0a
      KTERM_TREE: f62b451b1f79381212fa08c36f298cc3c36ec1c3
      FORGE_BASE: eb31df857423e14a8319b244d2417d1ee740c27f
    steps:
      - name: Checkout exact FORGE qualification scope
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify existing hosted runner and isolated workflow-only change
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "spoonman136668-ai/FORGE"
          test "$GITHUB_REF" = "refs/heads/qualification/kterminal-pr79-v2-get-guard-hosted-20261105"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = "Windows"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$FORGE_BASE" HEAD
          test "$(git diff --name-only "$FORGE_BASE" HEAD)" = ".github/workflows/forge-kterminal-pr79-v2-guard-hosted.yml"
          test -z "$(git status --porcelain)"
          echo KTERM_PR79_FORGE_HOSTED_SOURCE_SCOPE=PASS
      - name: Checkout private original K-Terminal source using existing qualified read permission
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: 9eb3197af01bc4a48bfd6036c6bc8f82a15b0c0a
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Use original Windows Go 1.26.5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify exact private tree, guard blobs and absence of broker authority
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = "Windows"
          test "$K_TERMINAL_EXECUTION_MODE" = "PAPER"
          test "$(git rev-parse HEAD)" = "$KTERM_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$KTERM_TREE"
          test "$(git rev-parse HEAD:pkg/coinbase_v2_accounts_probe_guard.go)" = "ef92940f4e699f0871777fe80fe36981c2d97e5a"
          test "$(git rev-parse HEAD:pkg/coinbase_v2_accounts_probe_guard_test.go)" = "b0e229e2ace153deead952fac37879f921f80a18"
          test -z "$(git status --porcelain)"
          test ! -e .env
          test ! -e config.json
          go version | grep -F 'go1.26.5 windows/amd64' >/dev/null
          for key in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then
              echo KTERM_PR79_UNEXPECTED_BROKER_CREDENTIAL
              exit 2
            fi
          done
          echo KTERM_PR79_PINNED_WINDOWS_SOURCE_AND_NO_BROKER_CREDENTIALS=PASS
      - name: Focused exact-source synthetic one-GET and negative controls
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          go test -mod=readonly -p 1 -count=1 -timeout 5m '-run=^TestV2AccountsProbe' ./pkg
          echo KTERM_PR79_FOCUSED_WINDOWS=PASS
      - name: Checkout exact frozen PR73 baseline for controlled comparison
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: bcebdc1a7a0487f9d6061a8e643c76069335d896
          path: kterminal-baseline
          persist-credentials: false
          fetch-depth: 1
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Compare bounded adjacent test families to isolate ordering dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Windows
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          test "$(git -C kterminal-private rev-parse HEAD)" = "$KTERM_SHA"
          test "$(git -C kterminal-private rev-parse 'HEAD^{tree}')" = "$KTERM_TREE"
          test "$(git -C kterminal-baseline rev-parse HEAD)" = bcebdc1a7a0487f9d6061a8e643c76069335d896
          test "$(git -C kterminal-baseline rev-parse 'HEAD^{tree}')" = a2e5b7dc4a634b5a36d53677cdcb6de47060e21f
          for file in pkg/countdown-activation_test.go pkg/stage3-report-full-root-v2_test.go; do
            test "$(git -C kterminal-private rev-parse "HEAD:$file")" = "$(git -C kterminal-baseline rev-parse "HEAD:$file")"
          done
          for source in kterminal-private kterminal-baseline; do
            test ! -e "$source/.env"
            test -z "$(git -C "$source" status --porcelain)"
          done
          for key in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET KTERM_COINBASE_TEST_KEY_NAME KTERM_COINBASE_TEST_KEY_SECRET; do
            if [[ -n "$(printenv "$key" || true)" ]]; then echo KTERM_FAMILY_BROKER_CREDENTIAL_REFUSED;exit 2;fi
          done
          echo KTERM_PR79_FAMILY_EXACT_FROZEN_BASELINE_AND_SOURCE=PASS
          pattern='^(TestCountdown.*|TestReconciliationCancellationStopsReadRetry|TestStage3ReportFullRoot.*)$'
          for arm in baseline candidate; do
            if [[ "$arm" = baseline ]]; then source="kterminal-baseline"; else source="kterminal-private"; fi
            root="$RUNNER_TEMP/kterm-pr79-family-$arm"
            test ! -e "$root"
            mkdir -p "$root/tail" "$root/post" "$root/private"
            export K_TERMINAL_TEST_WORKSPACE="$root"
            export KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT="$root/tail"
            export KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT="$root/post"
            export KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT="$root/private"
            set +e
            (cd "$source" && go test -json -mod=readonly -p 1 -count=2 -timeout 15m "-run=$pattern" ./pkg) > "$RUNNER_TEMP/pr79-family-$arm-private.jsonl" 2> "$RUNNER_TEMP/pr79-family-$arm-private.stderr"
            code=$?
            set -e
            printf '%s' "$code" > "$RUNNER_TEMP/pr79-family-$arm-exit"
          done
          python - <<'PY'
          import hashlib,json,os,pathlib,re
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          targets=("TestCountdownBeginsReconciliationAndSuccessfulExpiryEnablesAlerts","TestStage3ReportFullRootPublicAliasFallback")
          receipt={"schema":"kterminal.pr79.ordered-family-comparison.v1",
                   "baseline_sha":"bcebdc1a7a0487f9d6061a8e643c76069335d896",
                   "candidate_sha":"9eb3197af01bc4a48bfd6036c6bc8f82a15b0c0a",
                   "frozen_test_file_blobs_equal":True,"test_count":2,
                   "test_selection":"Countdown group + ReconciliationCancellationStopsReadRetry + Stage3ReportFullRoot group",
                   "full_suite_executed":False,"credentials_loaded":False,
                   "broker_requests":0,"installed":False,"arms":{}}
          for arm in ("baseline","candidate"):
            counts={name:{"pass":0,"fail":0} for name in targets}
            top_fail=set();total=0;bad=0;package_failures=0;top_pass=0
            path=temp/("pr79-family-"+arm+"-private.jsonl")
            for line in path.open(encoding="utf-8-sig",errors="replace") if path.is_file() else ():
              try:evt=json.loads(line)
              except (ValueError,TypeError):bad+=1;continue
              if not isinstance(evt,dict):bad+=1;continue
              total+=1
              action,name=evt.get("Action"),evt.get("Test")
              if isinstance(name,str) and "/" not in name:
                if action=="pass":top_pass+=1
                if name in counts and action in ("pass","fail"):counts[name][action]+=1
                if action=="fail" and re.fullmatch(r"Test[A-Za-z0-9_]{1,120}",name):top_fail.add(name)
              elif action=="fail" and not isinstance(name,str):package_failures+=1
            rc=int((temp/("pr79-family-"+arm+"-exit")).read_text())
            receipt["arms"][arm]={"go_exit":rc,"json_events":total,"malformed_events":bad,
                    "top_level_passes":top_pass,"failed_top_level_symbols":sorted(top_fail)[:20],
                    "unnamed_package_failures":package_failures,"target_counts":counts}
            print("KTERM_PR79_FAMILY_"+arm.upper()+"_EXIT="+str(rc)+";TOP_PASS="+str(top_pass)+";MALFORMED="+str(bad))
            for name in targets:
              print("KTERM_PR79_FAMILY_"+arm.upper()+"_"+name+"=PASS:"+str(counts[name]["pass"])+";FAIL:"+str(counts[name]["fail"]))
            for name in sorted(top_fail)[:20]:
              print("KTERM_PR79_FAMILY_"+arm.upper()+"_FAILED_STATIC_TEST="+name)
          safe=temp/"pr79-family-safe";safe.mkdir(exist_ok=False)
          body=json.dumps(receipt,sort_keys=True,separators=(",",":")).encode()
          (safe/"receipt.json").write_bytes(body)
          digest=hashlib.sha256(body).hexdigest()
          (safe/"receipt.sha256").write_text(digest,encoding="ascii")
          print("KTERM_PR79_FAMILY_RECEIPT_SHA256="+digest)
          print("KTERM_PR79_FAMILY_FULL_REGRESSION_STILL_FAILED=TRUE")
          PY
          test "$(git -C kterminal-private rev-parse HEAD)" = "$KTERM_SHA"
          test "$(git -C kterminal-baseline rev-parse HEAD)" = bcebdc1a7a0487f9d6061a8e643c76069335d896
      - name: Upload only sanitized family-comparison receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kterm-pr79-family-comparison-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr79-family-safe/receipt.json
            ${{ runner.temp }}/pr79-family-safe/receipt.sha256
          retention-days: 90
          if-no-files-found: warn
