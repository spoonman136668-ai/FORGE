name: FORGE K-Terminal PR79 one-GET guard original Windows qualification
on:
  push:
    branches: [qualification/kterminal-pr79-v2-get-guard-hosted-20261105]
    paths: [.github/workflows/forge-kterminal-pr79-v2-guard-hosted.yml]
permissions:
  contents: read
concurrency:
  group: forge-kterminal-pr79-hosted-source
  cancel-in-progress: false
jobs:
  original-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      KTERM_SHA: 9eb3197af01bc4a48bfd6036c6bc8f82a15b0c0a
      KTERM_TREE: f62b451b1f79381212fa08c36f298cc3c36ec1c3
      FORGE_BASE: eb31df857423e14a8319b244d2417d1ee740c27f
    steps:
      - name: Checkout exact FORGE qualification scope
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify existing hosted runner and isolated workflow-only change
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "spoonman136668-ai/FORGE"
          test "$GITHUB_REF" = "refs/heads/qualification/kterminal-pr79-v2-get-guard-hosted-20261105"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = "Windows"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$FORGE_BASE" HEAD
          test "$(git diff --name-only "$FORGE_BASE" HEAD)" = ".github/workflows/forge-kterminal-pr79-v2-guard-hosted.yml"
          test -z "$(git status --porcelain)"
          echo KTERM_PR79_FORGE_HOSTED_SOURCE_SCOPE=PASS
      - name: Checkout private original K-Terminal source using existing qualified read permission
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: 9eb3197af01bc4a48bfd6036c6bc8f82a15b0c0a
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Use original Windows Go 1.26.5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify exact private tree, guard blobs and absence of broker authority
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = "Windows"
          test "$K_TERMINAL_EXECUTION_MODE" = "PAPER"
          test "$(git rev-parse HEAD)" = "$KTERM_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$KTERM_TREE"
          test "$(git rev-parse HEAD:pkg/coinbase_v2_accounts_probe_guard.go)" = "ef92940f4e699f0871777fe80fe36981c2d97e5a"
          test "$(git rev-parse HEAD:pkg/coinbase_v2_accounts_probe_guard_test.go)" = "b0e229e2ace153deead952fac37879f921f80a18"
          test -z "$(git status --porcelain)"
          test ! -e .env
          test ! -e config.json
          go version | grep -F 'go1.26.5 windows/amd64' >/dev/null
          for key in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then
              echo KTERM_PR79_UNEXPECTED_BROKER_CREDENTIAL
              exit 2
            fi
          done
          echo KTERM_PR79_PINNED_WINDOWS_SOURCE_AND_NO_BROKER_CREDENTIALS=PASS
      - name: Focused exact-source synthetic one-GET and negative controls
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          go test -mod=readonly -p 1 -count=1 -timeout 5m '-run=^TestV2AccountsProbe' ./pkg
          echo KTERM_PR79_FOCUSED_WINDOWS=PASS
      - name: Checkout exact frozen PR73 baseline for controlled comparison
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: bcebdc1a7a0487f9d6061a8e643c76069335d896
          path: kterminal-baseline
          persist-credentials: false
          fetch-depth: 1
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: One unchanged PR73 full-regression Windows baseline with sanitized failure custody
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Windows
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          test "$(git -C kterminal-private rev-parse HEAD)" = "$KTERM_SHA"
          test "$(git -C kterminal-private rev-parse 'HEAD^{tree}')" = "$KTERM_TREE"
          test "$(git -C kterminal-baseline rev-parse HEAD)" = bcebdc1a7a0487f9d6061a8e643c76069335d896
          test "$(git -C kterminal-baseline rev-parse 'HEAD^{tree}')" = a2e5b7dc4a634b5a36d53677cdcb6de47060e21f
          for file in pkg/countdown-activation_test.go pkg/stage3-report-full-root-v2_test.go; do
            test "$(git -C kterminal-private rev-parse "HEAD:$file")" = "$(git -C kterminal-baseline rev-parse "HEAD:$file")"
          done
          test -z "$(git -C kterminal-baseline status --porcelain)"
          test -z "$(git -C kterminal-private status --porcelain)"
          test ! -e kterminal-baseline/.env
          test ! -e kterminal-private/.env
          for name in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET KTERM_COINBASE_TEST_KEY_NAME KTERM_COINBASE_TEST_KEY_SECRET; do
            if [[ -n "$(printenv "$name" || true)" ]]; then
              echo KTERM_PR79_BASELINE_UNEXPECTED_CREDENTIAL_PRESENT
              exit 2
            fi
          done
          root="$RUNNER_TEMP/pr79-frozen-full-baseline"
          test ! -e "$root"
          mkdir -p "$root/tail" "$root/post" "$root/private"
          export K_TERMINAL_TEST_WORKSPACE="$root"
          export KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT="$root/tail"
          export KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT="$root/post"
          export KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT="$root/private"
          go version | grep -F 'go1.26.5 windows/amd64' >/dev/null
          echo KTERM_PR79_FULL_BASELINE_PINNED_SOURCE_TOOLCHAIN_AND_SCRATCH=PASS
          set +e
          (cd kterminal-baseline && go test -json -mod=readonly -p 1 -count=1 -timeout 60m ./...) > "$RUNNER_TEMP/pr79-full-baseline-private.jsonl" 2> "$RUNNER_TEMP/pr79-full-baseline-private-stderr.txt"
          rc=$?
          set -e
          PR79_BASELINE_RC="$rc" python - <<'PY'
          import hashlib,json,os,pathlib,re,sys
          tmp=pathlib.Path(os.environ["RUNNER_TEMP"])
          events=tmp/"pr79-full-baseline-private.jsonl"
          failures=set();packages=set();invalid=0;total=0;top_pass=0;top_fail=0;unnamed_fail=0
          targets={"TestCountdownBeginsReconciliationAndSuccessfulExpiryEnablesAlerts",
                   "TestStage3ReportFullRootPublicAliasFallback"}
          target_result={name:{"pass":0,"fail":0} for name in targets}
          for line in events.open(encoding="utf-8-sig",errors="replace") if events.exists() else ():
            try:obj=json.loads(line)
            except (ValueError,TypeError):invalid+=1;continue
            if not isinstance(obj,dict):invalid+=1;continue
            total+=1
            name=obj.get("Test")
            action=obj.get("Action")
            package=obj.get("Package")
            if isinstance(name,str) and "/" not in name and re.fullmatch(r"Test[A-Za-z0-9_]{1,120}",name):
              if action=="pass":top_pass+=1
              if action=="fail":top_fail+=1;failures.add(name)
              if name in target_result and action in ("pass","fail"):target_result[name][action]+=1
            if action=="fail" and not isinstance(name,str):
              unnamed_fail+=1
              if isinstance(package,str) and re.fullmatch(r"[A-Za-z0-9_./-]{1,120}",package):
                packages.add(package)
          rc=int(os.environ["PR79_BASELINE_RC"])
          receipt={
            "schema":"kterminal.pr79.frozen-pr73-full-windows-baseline.v1",
            "baseline_source_sha":"bcebdc1a7a0487f9d6061a8e643c76069335d896",
            "baseline_tree":"a2e5b7dc4a634b5a36d53677cdcb6de47060e21f",
            "candidate_source_sha":"9eb3197af01bc4a48bfd6036c6bc8f82a15b0c0a",
            "prior_candidate_full_result":"FAIL",
            "prior_candidate_failure_symbols":sorted(targets),
            "toolchain":"go1.26.5 windows/amd64",
            "command":"go test -json -mod=readonly -p 1 -count=1 -timeout 60m ./...",
            "go_exit":rc,"events":total,"malformed_events":invalid,
            "top_level_test_passes":top_pass,"top_level_test_failures":top_fail,
            "failed_test_symbols":sorted(failures)[:24],
            "failed_packages":sorted(packages)[:20],
            "unnamed_package_failures":unnamed_fail,
            "target_test_disposition":target_result,
            "full_baseline_status":"PASS" if rc==0 and total>0 and invalid==0 and top_fail==0 and unnamed_fail==0 else "FAIL",
            "secrets_loaded":False,"broker_network_calls_intended":0,
            "private_logs_exported":False,"installation_or_promotion":False
          }
          safe=tmp/"pr79-baseline-full-safe"
          safe.mkdir(exist_ok=False)
          body=json.dumps(receipt,sort_keys=True,separators=(",",":")).encode()
          (safe/"receipt.json").write_bytes(body)
          digest=hashlib.sha256(body).hexdigest()
          (safe/"receipt.sha256").write_text(digest,encoding="ascii")
          print("KTERM_PR79_PR73_FULL_BASELINE="+receipt["full_baseline_status"])
          print("KTERM_PR79_PR73_FULL_EVENTS="+str(total)+";MALFORMED="+str(invalid))
          print("KTERM_PR79_PR73_FULL_GO_EXIT="+str(rc))
          for name in sorted(targets):
            d=target_result[name]
            print("KTERM_PR79_PR73_FULL_TARGET_"+name+"=PASS:"+str(d["pass"])+";FAIL:"+str(d["fail"]))
          for name in receipt["failed_test_symbols"]:
            print("KTERM_PR79_PR73_FULL_FAILED_TEST="+name)
          for name in receipt["failed_packages"]:
            print("KTERM_PR79_PR73_FULL_FAILED_PACKAGE="+name)
          print("KTERM_PR79_PR73_FULL_RECEIPT_SHA256="+digest)
          if receipt["full_baseline_status"]!="PASS":sys.exit(2)
          PY
          test "$(git -C kterminal-baseline rev-parse HEAD)" = bcebdc1a7a0487f9d6061a8e643c76069335d896
          test -z "$(git -C kterminal-baseline status --porcelain)"
          echo KTERM_PR79_PR73_FULL_BASELINE=PASS
      - name: Upload sanitized original full baseline witness only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kterm-pr73-frozen-full-baseline-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr79-baseline-full-safe/receipt.json
            ${{ runner.temp }}/pr79-baseline-full-safe/receipt.sha256
          retention-days: 90
          if-no-files-found: warn
