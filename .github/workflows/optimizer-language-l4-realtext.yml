name: Optimizer L4 byte-pinned external real-text public language screen

on:
  push:
    branches: [research/optimizer-language-l4-pinned-realtext-20261023]
    paths:
      - '.github/workflows/optimizer-language-l4-realtext.yml'
      - 'research/optimizer_language_l4/**'

permissions:
  contents: read

concurrency:
  group: optimizer-language-l4-realtext
  cancel-in-progress: false

jobs:
  public-native-realtext:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      L4_EXTERNAL_CORPUS_PATH: ${{ runner.temp }}/l4-original.txt
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce frozen original/real corpus identity and isolated source-only Git delta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent='fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5'
          $ancestor=(& git merge-base $parent HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ancestor -cne $parent) {
            throw 'L4_EXISTING_SCIENTIFIC_HISTORY_DRIFT'
          }
          $expected=@(
            '.github/workflows/optimizer-language-l4-realtext.yml',
            'research/optimizer_language_l4/L4_FROZEN_PROTOCOL.json',
            'research/optimizer_language_l4/source.py',
            'research/optimizer_language_l4/models.py',
            'research/optimizer_language_l4/runner.py',
            'research/optimizer_language_l4/test_realtext.py',
            'research/optimizer_language_l4/compare.py'
          )
          $actual=@(& git diff --name-only $parent HEAD)
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne $expected.Count -or
              (Compare-Object $actual $expected)) {
            throw 'L4_UNAUTHORIZED_NONADDITIVE_SOURCE_MUTATION'
          }
          $p='research/optimizer_language_l4/L4_FROZEN_PROTOCOL.json'
          $expect='d180d02a92d5fddceacba319f34a541b9d5929ad'
          $blob=(& git rev-parse ('HEAD:'+$p)).Trim()
          $disk=(& git hash-object --no-filters -- $p).Trim()
          if ($LASTEXITCODE -ne 0 -or $blob -cne $expect -or $disk -cne $expect) {
            throw 'L4_FROZEN_EXTERNAL_CORPUS_PREREGISTRATION_DRIFT'
          }
          Write-Host 'L4_PREREG_AND_ACTIVE_RESEARCH_ISOLATION=PASS'
      - name: Fetch once by immutable commit and verify Git blob BEFORE parsing source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B -c "import sys; sys.path.insert(0,'research/optimizer_language_l4'); from source import acquire; print('L4_VERIFIED_EXTERNAL_RAW_SHA256='+acquire(sys.argv[1]))" $env:L4_EXTERNAL_CORPUS_PATH
          if ($LASTEXITCODE -ne 0) { throw 'L4_EXTERNAL_BYTE_SHA_DRIFT_OR_UNAVAILABLE' }
      - name: Twelve adversarial protected custody and real text trained control tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B -m unittest discover -s research/optimizer_language_l4 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'L4_FOCUSED_EXTERNAL_SOURCE_TEST_FAILURE' }
          Write-Host 'L4_FOCUSED_SOURCE_AND_MODELS=PASS'
      - name: Fit source-disjoint real-text public controls and record complete signed results
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $receipt=Join-Path $env:RUNNER_TEMP 'l4-realtext-public-receipt.json'
          python -B research/optimizer_language_l4/runner.py $env:L4_EXTERNAL_CORPUS_PATH | Tee-Object -FilePath $receipt
          if ($LASTEXITCODE -ne 0) { throw 'L4_EXTERNAL_CORPUS_FIT_EVAL_FAILURE' }
          Write-Host 'L4_TRAIN_SELECT_DEV_ROLES_RECONCILE=EMITTED'
          Write-Host 'L4_PROTECTED_SCIENCE_AND_PREVIOUS_DEV=ZERO'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l4-native-realtext-${{ matrix.os }}
          path: ${{ runner.temp }}/l4-realtext-public-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Full unchanged FORGE Go test vet build single Linux regression
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo L4_SINGLE_FINAL_GO_REGRESSION=PASS
      - name: Ensure no original source changes or checked-in raw corpus
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dirty=@(& git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) { throw 'L4_EXTERNAL_TEXT_OR_AUTHORITY_SOURCE_MUTATION' }
          Write-Host 'L4_NO_NCI_ITD_BIO_Q21_FORGE_NATIVE_MUTATIONS=PASS'

  independent-native-reconciliation:
    needs: public-native-realtext
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: l4-native-realtext-ubuntu-24.04
          path: native-results/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: l4-native-realtext-windows-2022
          path: native-results/windows
      - name: Fail closed on external blob raw SHA, three source digests and all trained model predictions
        shell: bash
        run: |
          set -euo pipefail
          python -B research/optimizer_language_l4/compare.py \
            native-results/linux/l4-realtext-public-receipt.json \
            native-results/windows/l4-realtext-public-receipt.json \
            native-results/l4-independent-cross-os.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l4-pinned-external-native-comparison
          path: native-results/l4-independent-cross-os.json
          if-no-files-found: error
          retention-days: 30
