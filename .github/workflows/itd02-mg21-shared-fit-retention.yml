name: ITD-02 MG21 original-world native selected action engineering
on:
  push:
    branches: [research/itd02-mg21-shared-fit-retention-engineering-20261029]
permissions:
  contents: read
jobs:
  authentic-original-native-actions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Original source LF
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen prospective before original execution and exact 5-file scope
        shell: pwsh
        run: |
          git merge-base --is-ancestor be533627e9cbc7f35314257ceadbf21f5e873d4e $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'MG21_PARENT_RESEARCH_GATE_MISSING' }
          git merge-base --is-ancestor 9827d206a3ec2876a8e09e14388f383272d2b271 $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'MG21_PROSPECTIVE_SOURCE_PREREG_NOT_OLDER_THAN_EXECUTABLE' }
          $files = @(
            '.github/workflows/itd02-mg21-shared-fit-retention.yml'
            'research/lcrm01/mg21_original_source_shared_fit_prereg.json'
            'research/lcrm01/mg21_wingless_shared_fit_bridge.go'
            'research/lcrm01/mg21_original_tabular_control.py'
            'research/lcrm01/mg21_native_retention_actors.py'
            'research/lcrm01/mg21_probe_source.py'
            'research/lcrm01/mg21_original_shared_fit_retention.py'
          )
          $changes = @(git diff --name-only be533627e9cbc7f35314257ceadbf21f5e873d4e $env:GITHUB_SHA)
          if (@(Compare-Object $files $changes).Count -ne 0) { throw 'MG21_OUTSIDE_RESEARCH_ONLY_SCOPE' }
          $pins = @{
            'research/lcrm01/mg21_original_source_shared_fit_prereg.json'='c1f13480c51e9d5d5ce6b4dbcb1040951304659b'
            'research/lcrm01/mg21_wingless_shared_fit_bridge.go'='3fb26e8f21082227fb1b78c3e8a12d85e7005eff'
            'research/lcrm01/mg21_original_tabular_control.py'='c99fce4b00fa1742f2e0b0efd60d1e5d01762825'
            'research/lcrm01/mg21_native_retention_actors.py'='d0a66e7b7d331c78718fc3fba480abe68e62a820'
            'research/lcrm01/mg21_probe_source.py'='49fd786140f64ba56df8a341b54956f79cb22088'
            'research/lcrm01/mg21_original_shared_fit_retention.py'='06da53287646165e894414137ba21133169baa72'
          }
          foreach ($p in $pins.Keys) {
            if ((git hash-object $p).Trim() -ne $pins[$p]) { throw "MG21_SOURCE_BLOB_IDENTITY_DRIFT:$p" }
          }
          if (git status --porcelain --untracked-files=all) { throw 'MG21_DIRTY_RESEARCH_SOURCE' }
          Write-Host 'MG21_PROSPECTIVE_SOURCE_ONLY_PROTOCOL_AND_PIN_PASS'
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Go 1.25.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Pin original Farama and independent native candidates; replay twice
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root=Join-Path $env:RUNNER_TEMP 'mg21'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          function Fetch-Pin([string]$dest,[string]$remote,[string]$revision) {
            git init -q $dest
            if ($LASTEXITCODE -ne 0) { throw 'MG21_SOURCE_INIT_FAILED' }
            git -C $dest remote add origin $remote
            if ($LASTEXITCODE -ne 0) { throw 'MG21_REMOTE_FAILED' }
            git -C $dest fetch --no-tags --depth 1 origin $revision
            if ($LASTEXITCODE -ne 0) { throw 'MG21_SOURCE_FETCH_FAILED' }
            git -C $dest checkout --detach -q $revision
            if ($LASTEXITCODE -ne 0) { throw 'MG21_SOURCE_CHECKOUT_FAILED' }
            if ((git -C $dest rev-parse HEAD).Trim() -ne $revision) { throw 'MG21_SOURCE_COMMIT_MISMATCH' }
          }
          $src=Join-Path $root 'minigrid'
          $wing=Join-Path $root 'wingless'
          $ygg=Join-Path $root 'yggdrasil'
          Fetch-Pin $src 'https://github.com/Farama-Foundation/Minigrid.git' '7f5853792ea7f04f75614661006d87fcf949f26d'
          Fetch-Pin $wing 'https://github.com/spoonman136668-ai/Wingless.git' 'ebbadd157cc1df6eabfa5a550c8876ca87dc91e9'
          Fetch-Pin $ygg 'https://github.com/spoonman136668-ai/Yggdrasil.git' 'f0dd99d59ce00da7ad17ff49900a1af6d2322a77'
          if ((git -C $wing hash-object research/native/itd02/mg19/genuine_mission.go).Trim() -ne 'df6111abd421f601b976273abf61aaad6d0bf61a') { throw 'MG21_GO_MG19_CHANGED' }
          if ((git -C $ygg hash-object research/native/itd02/mg19/genuine_mission_cells.py).Trim() -ne '6a2a60eb9c9b77436421aa7ccbe785d29a163280') { throw 'MG21_YGG_MG19_CHANGED' }
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          if ($LASTEXITCODE -ne 0) { throw 'MG21_PYTHON_TOOLCHAIN' }
          python -m pip install 'numpy==1.26.4' 'gymnasium==1.1.1' 'pygame-ce==2.5.3'
          if ($LASTEXITCODE -ne 0) { throw 'MG21_REAL_WORLD_DEPENDENCIES' }
          python -m pip install --no-deps -e $src
          if ($LASTEXITCODE -ne 0) { throw 'MG21_FARAMA_ORIGINAL_INSTALL_FAILED' }
          Push-Location $wing
          try {
            go test -count=1 ./research/native/itd02/mg19/... ./research/native/itd02/dk16/...
            if ($LASTEXITCODE -ne 0) { throw 'MG21_NATIVE_GO_REGRESSION' }
            $exe=Join-Path $root 'native-mg19'
            if ($IsWindows) { $exe="$exe.exe" }
            go build -trimpath -o $exe "$env:GITHUB_WORKSPACE/research/lcrm01/mg21_wingless_shared_fit_bridge.go"
            if ($LASTEXITCODE -ne 0) { throw 'MG21_ORIGINAL_GO_ACTOR_BUILD' }
          } finally { Pop-Location }
          $env:PYTHONPATH="$ygg$([IO.Path]::PathSeparator)$(Join-Path $env:GITHUB_WORKSPACE 'research/lcrm01')"
          python -B -m unittest -q research.native.itd02.mg19.test_genuine_mission_cells
          if ($LASTEXITCODE -ne 0) { throw 'MG21_NATIVE_YGG_REGRESSION' }
          $program='research/lcrm01/mg21_original_shared_fit_retention.py'
          $first=Join-Path $root 'first.json'
          $second=Join-Path $root 'second.json'
          python -B $program --source-root $src --native-go $exe --output $first
          if ($LASTEXITCODE -ne 0) { throw 'MG21_REAL_ORIGINAL_FIRST_SOURCE_RUN_FAIL' }
          python -B $program --source-root $src --native-go $exe --output $second
          if ($LASTEXITCODE -ne 0) { throw 'MG21_REAL_ORIGINAL_SECOND_SOURCE_RUN_FAIL' }
          python -B $program --compare $first $second
          if ($LASTEXITCODE -ne 0) { throw 'MG21_REAL_SOURCE_NONDETERMINISTIC' }
          # Read-only engineering interpretation of quarantined original-source receipts.
          # This is descriptive, not a success threshold or scientific test.
          $summary = @'
import json,sys
r=json.load(open(sys.argv[1],encoding="utf-8"))
totals={}
for row in r["original_native_probe_records"]:
    role=row["role"]
    item=totals.setdefault(role,dict(positive_rewards=0,terminated=0,
        truncated=0,steps=0,distinct_public=0,episodes=0))
    item["positive_rewards"]+=row["positive_rewards"]
    item["terminated"]+=int(row["terminated"])
    item["truncated"]+=int(row["truncated"])
    item["steps"]+=row["probe_steps"]
    item["distinct_public"]+=row["distinct_public"]
    item["episodes"]+=1
assert len(r["source_fit_receipts"])==4 and len(r["original_native_probe_records"])==28
assert set(totals)=={"go_fit","go_fresh","ygg_fit","ygg_fresh",
                    "tabular_fit","tabular_fresh","random"}
print("MG21_FROZEN_ORIGINAL_SOURCE_FIT_STEPS "+
    json.dumps({x["family"]:x["shared_original_fit_count"] for x in r["source_fit_receipts"]},sort_keys=True))
print("MG21_OBSERVED_ARM_METRICS_ENGINEERING_ONLY "+
    json.dumps(totals,sort_keys=True,separators=(",",":")))
'@
          $summary | python -B - $first
          if ($LASTEXITCODE -ne 0) { throw 'MG21_SOURCE_RECEIPT_METRICS_FAILED' }
          if (git status --porcelain --untracked-files=all) { throw 'MG21_WORKTREE_DIRTY' }
          Write-Host 'MG21_ORIGINAL_SELECTED_ACTION_SOURCE_ENGINEERING_QUALIFIED_NOT_SCIENCE'
      - name: Retain original source full receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mg21-quarantined-original-native-source-${{ matrix.os }}
          path: ${{ runner.temp }}/mg21/*.json
          retention-days: 30
          if-no-files-found: warn
