name: FORGE R18E checkpoint evidence source qualification
on:
  push:
    branches:
      - proposal/r18e-checkpoint-evidence-20261011
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Exact R18D and bounded source scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5a7c385d53b418b90bf93545dff34eb30296ff2d
          python - <<'PY'
          import subprocess
          rows=subprocess.check_output(["git","diff","--name-status","HEAD^","HEAD"],text=True).splitlines()
          wanted={"evoportfolio/verify.go","evoportfolio/verify_test.go",".github/workflows/qualify-r18e-evidence.yml"}
          assert len(rows)==3 and all(x.startswith("A\t") for x in rows),rows
          assert {x.split("\t")[1] for x in rows}==wanted,rows
          PY
      - name: Focused full Go tests vet build and race
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./evoportfolio
          go test -count=1 ./...
          go vet ./...
          go build ./...
          if [ "$RUNNER_OS" = Linux ]; then go test -race -count=1 ./...; fi
          echo "FORGE_R18E_SOURCE_ONLY=PASS"
