name: F124-AI collision-free identity versus FIT-only calibration
on:
  push:
    branches: [research/f124ai-collision-free-calibration-20261018]
permissions: {contents: read, actions: read}
concurrency:
  group: f124ai-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-and-ablation:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Freeze blob and new FIT DEV source, exact hand coding, original 16 cells
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if ($IsWindows) {'python'} else {'python3'}
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'F124AI_SOURCE_HEAD_DRIFT' }
          & $py -B -m unittest discover -s nativeevidence -p 'test_f124ai_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F124AI_NEW_SOURCE_OR_BOUND_FAILURE' }
          & $py -B isolationguard/check.py
          if ($LASTEXITCODE -ne 0) { throw 'F124AI_ISOLATION_FAILED' }
          Write-Output 'F124AI_PROTECTED_FIRST_USE=false'
  FIT-only-train:
    needs: source-and-ablation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Learn only probability calibration on FIT labels; seal zero-FP threshold first
        shell: bash
        run: |
          set -euo pipefail
          python3 -B nativeevidence/f124ai_calibration.py --train --output "$RUNNER_TEMP/f124ai-fit.json"
          python3 - "$RUNNER_TEMP/f124ai-fit.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["schema"]=="forge.research.f124ai.FIT-calibration-receipt.v1"
          assert d["freeze_blob"]=="2aed58ccfd0c7b506a84849c0aa2d9310428621f"
          assert d["bit_identity_collisions"]==0 and len(d["identity_code_hex"])==16
          assert d["no_DEV_used_for_training"] and d["fitted"]["epochs"]==100
          assert d["fitted"]["weight_update_l2"]>0
          assert d["global_calibrated_param_count"]==3
          assert d["independent_science_accepted"] is False
          PY
          sha256sum "$RUNNER_TEMP/f124ai-fit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: f124ai-only-new-FIT-calibration-${{ github.sha }}
          path: ${{ runner.temp }}/f124ai-fit.json
          retention-days: 90
          if-no-files-found: error
  authentic-DEV-comparison:
    needs: FIT-only-train
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: f124ai-only-new-FIT-calibration-${{ github.sha }}
          path: fit
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39078269441
          github-token: ${{ github.token }}
          name: f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d
          path: o
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39081990918
          github-token: ${{ github.token }}
          name: f124r-fresh-two-lane-causal-evidence-522601491c10ebfeb36e7dca2627ff5366b51abb
          path: r
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39082745397
          github-token: ${{ github.token }}
          name: f124s-source-backed-development-bc59de4f118b37d9a501dd8a944e210540222a27
          path: s
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39084599471
          github-token: ${{ github.token }}
          name: f124u-source-backed-independent-development-7d8df58e3fd7363e5c91b39a426ff3430fedf20d
          path: u
      - name: Original O U, fixed injective index, untrained, trained and stronger fixed consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 -B nativeevidence/f124ai_calibration.py --evaluate --original-o o/f124o-independent-two-learned-development.json --original-r r/f124r-fresh-calibrated-continuous-development.json --original-s s/f124s-fresh-packed-key-cell-credit-development.json --original-u u/f124u-bounded-index-fresh-causal-rank-development.json --trained-receipt fit/f124ai-fit.json --output "$RUNNER_TEMP/f124ai-comparison.json"
          python3 - "$RUNNER_TEMP/f124ai-comparison.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["schema"]=="forge.research.f124ai.fixed-vs-learned-independent-DEV.v1"
          assert x["freeze_blob"]=="2aed58ccfd0c7b506a84849c0aa2d9310428621f"
          assert x["old_original_O_U_weights_unchanged"]
          assert x["DEV_no_fit_selection"] and x["global_trained_parameters"]==3
          assert not x["protected_first_use"] and not x["independent_science_accepted"]
          for phase in ("FIT","DEV"):
              for fam in ("adjacent_noise","delayed_noise","reused_role_noise"):
                  for name,z in x[phase][fam]["arms"].items():
                      assert len(z["cases"])==48
                      assert all(d["pairs"]==16 for d in z["by_depth"].values())
          PY
          sha256sum "$RUNNER_TEMP/f124ai-comparison.json"
      - uses: actions/upload-artifact@v4
        with:
          name: f124ai-fixed-versus-learned-DEV-${{ github.sha }}
          path: ${{ runner.temp }}/f124ai-comparison.json
          retention-days: 90
          if-no-files-found: error
  actual-physical-cost:
    needs: FIT-only-train
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: f124ai-only-new-FIT-calibration-${{ github.sha }}
          path: fit
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39078269441
          github-token: ${{ github.token }}
          name: f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d
          path: o
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39081990918
          github-token: ${{ github.token }}
          name: f124r-fresh-two-lane-causal-evidence-522601491c10ebfeb36e7dca2627ff5366b51abb
          path: r
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39082745397
          github-token: ${{ github.token }}
          name: f124s-source-backed-development-bc59de4f118b37d9a501dd8a944e210540222a27
          path: s
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39084599471
          github-token: ${{ github.token }}
          name: f124u-source-backed-independent-development-7d8df58e3fd7363e5c91b39a426ff3430fedf20d
          path: u
      - name: Six arms, identical 96 source graphs, fresh 3x OS high-water RSS CPU and Python heap
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if ($IsWindows) {'python'} else {'python3'}
          $env:PYTHONHASHSEED='0'
          $out=Join-Path $env:RUNNER_TEMP "f124ai-cost-${{ matrix.os }}.json"
          & $py -B nativeevidence/f124ai_physical.py --bench --original-o o/f124o-independent-two-learned-development.json --original-r r/f124r-fresh-calibrated-continuous-development.json --original-s s/f124s-fresh-packed-key-cell-credit-development.json --original-u u/f124u-bounded-index-fresh-causal-rank-development.json --trained-receipt fit/f124ai-fit.json --output $out
          if ($LASTEXITCODE -ne 0) { throw 'F124AI_REAL_RESOURCE_QUALIFICATION_FAILED' }
          $d=Get-Content $out -Raw | ConvertFrom-Json
          if ($d.schema -cne 'forge.research.f124ai.same-host-total-model-cost.v1' -or
              $d.freeze_blob -cne '2aed58ccfd0c7b506a84849c0aa2d9310428621f' -or
              $d.raw.Count -ne 18 -or
              $d.original_persistent_cell_limit -ne 16 -or
              $d.protected_first_use -or $d.independent_science_accepted) {
            throw 'F124AI_COST_RECEIPT_OR_PROVENANCE_FAIL'
          }
          foreach ($arm in @('historical_O_combined','historical_U_combined','fixed_consistency16','fixed_collisionfree_index','untrained_collisionfree_calibrator','trained_collisionfree_calibrator')) {
            $m=$d.summary.$arm
            if ($m.repetitions -ne 3 -or $m.median_wall_ns -le 0 -or
                $m.median_cpu_ns -le 0 -or $m.median_process_peak_RSS_bytes -le 0) {
              throw 'F124AI_INCOMPLETE_SAME_HOST_COST'
            }
            Write-Output "F124AI_COST_$($arm):wall_ns=$($m.median_wall_ns):RSS=$($m.median_process_peak_RSS_bytes):cpu_ns=$($m.median_cpu_ns):heap=$($m.median_Python_alloc_peak_bytes)"
          }
          Write-Output "F124AI_RESOURCE_SHA256=$((Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant())"
      - uses: actions/upload-artifact@v4
        with:
          name: f124ai-total-RAM-and-CPU-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/f124ai-cost-${{ matrix.os }}.json
          retention-days: 90
          if-no-files-found: error
  final-one-original-regression:
    needs: [authentic-DEV-comparison, actual-physical-cost]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env: {GOMAXPROCS: '2', GOFLAGS: '-p=2', GOMEMLIMIT: '1536MiB'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - name: Exactly one full Go test race vet build and original FORGE isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
          echo "F124AI_EXACT_HEAD=$GITHUB_SHA"
          echo 'F124AI_PROTECTED_FIRST_USE=false'
