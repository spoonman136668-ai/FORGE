name: K Terminal one-shot desktop session read-only preflight
on:
  push:
    branches:
      - qualification/kterminal-p5-firstuse-artifact-20261112
    paths:
      - .github/workflows/forge-kterminal-desktop-readonly-preflight-20261113.yml
permissions:
  contents: read
concurrency:
  group: kterminal-desktop-readonly-preflight-20261113
  cancel-in-progress: false
jobs:
  desktop-preflight:
    name: K Terminal Windows runner desktop eligibility, no installation
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    env:
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
    steps:
      - name: Confirm isolated owner and measure interactive desktop eligibility read-only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-firstuse-artifact-20261112' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows'){ throw 'KTERM_DESKTOP_PREFLIGHT_WRONG_OWNER' }
          if($env:K_TERMINAL_EXECUTION_MODE -cne 'PAPER' -or
             $env:K_TERMINAL_P5_LATENCY -cne '0' -or
             $env:K_TERMINAL_NATIVE_TIMING -cne '0'){ throw 'KTERM_DESKTOP_PREFLIGHT_NOT_DISARMED' }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
             'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
             'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET')){
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_DESKTOP_PREFLIGHT_BROKER_ENV_PRESENT'}
          }
          $self=[Diagnostics.Process]::GetCurrentProcess()
          $sess=[int]$self.SessionId
          $shells=@(Get-Process -Name explorer -ErrorAction SilentlyContinue)
          $same=@($shells|Where-Object {$_.SessionId -eq $sess})
          $distinct=@($shells|Select-Object -ExpandProperty SessionId -Unique)
          $apps=@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue)
          $targetRoot=$null
          if($env:LOCALAPPDATA){$targetRoot=Join-Path $env:LOCALAPPDATA 'KTerminal-Personal-Qualified-3d8ff329485e'}
          $targetExists=($null -ne $targetRoot -and (Test-Path -LiteralPath $targetRoot))
          $legacyRootExists=($env:LOCALAPPDATA -and (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'KTerminal-Personal')))
          $interactive=($sess -gt 0 -and $same.Count -gt 0 -and [Environment]::UserInteractive)
          $eligible=($interactive -and $apps.Count -eq 0 -and -not $targetExists)
          Write-Host ('KTERM_OWNER_DESKTOP_READONLY=PASS;RUNNER_NAME_VERIFIED=TRUE'+
             ';RUNNER_SESSION_NONZERO='+($sess -gt 0)+
             ';SAME_SESSION_EXPLORER='+($same.Count -gt 0)+
             ';RUNNER_USER_INTERACTIVE='+[Environment]::UserInteractive+
             ';VISIBLE_EXPLORER_SESSIONS='+$distinct.Count+
             ';KTERM_RUNNING_PROCESSES='+$apps.Count+
             ';NEW_SIDEBYSIDE_TARGET_EXISTS='+$targetExists+
             ';RUNNER_PROFILE_LEGACY_DEFAULT_EXISTS='+[bool]$legacyRootExists+
             ';DIRECT_SIDEBYSIDE_DESKTOP_ELIGIBLE='+$eligible+
             ';NO_PATHS_OR_IDENTITIES_EXPORTED=TRUE'+
             ';NO_INSTALL=TRUE;NO_LAUNCH=TRUE;NO_BROKER_REQUESTS=TRUE'+
             ';NO_USER_FILES_MODIFIED=TRUE;NO_SCHEDULED_TASKS=TRUE')
          if(-not $interactive){Write-Host 'KTERM_NEXT_GATE=SERVICE_OR_DIFFERENT_SESSION;DO_NOT_INSTALL_OR_LAUNCH_FROM_THIS_RUNNER_CONTEXT'}
          elseif($apps.Count -gt 0){Write-Host 'KTERM_NEXT_GATE=EXISTING_APP_RUNNING;DO_NOT_INSTALL_OR_LAUNCH'}
          elseif($targetExists){Write-Host 'KTERM_NEXT_GATE=QUALIFIED_TARGET_ALREADY_EXISTS;DO_NOT_OVERWRITE_OR_INSTALL'}
          else{Write-Host 'KTERM_NEXT_GATE=INTERACTIVE_SIDEBYSIDE_POSSIBLE;DEPLOYMENT_SEPARATE_GATE'}
      - name: Inspect original versus qualified K Terminal roots by metadata only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-firstuse-artifact-20261112' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:K_TERMINAL_EXECUTION_MODE -cne 'PAPER'){throw 'KTERM_RECOVERY_METADATA_WRONG_OWNER_OR_MODE'}
          if(-not $env:LOCALAPPDATA){throw 'KTERM_RECOVERY_METADATA_PROFILE_MISSING'}
          $sess=[Diagnostics.Process]::GetCurrentProcess().SessionId
          if($sess -le 0 -or
             @(Get-Process -Name explorer -ErrorAction SilentlyContinue | Where-Object {$_.SessionId -eq $sess}).Count -lt 1){
             throw 'KTERM_RECOVERY_METADATA_DESKTOP_SESSION_REFUSED'
          }
          $apps=@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue)
          if($apps.Count -gt 0){throw 'KTERM_RECOVERY_METADATA_ACTIVE_APPLICATION_REFUSED'}
          $legacy=Join-Path $env:LOCALAPPDATA 'KTerminal-Personal'
          $new=Join-Path $env:LOCALAPPDATA 'KTerminal-Personal-Qualified-3d8ff329485e'
          $legacyExists=Test-Path -LiteralPath $legacy -PathType Container
          $newExists=Test-Path -LiteralPath $new -PathType Container
          if(-not $newExists){throw 'KTERM_RECOVERY_METADATA_QUALIFIED_INSTALL_MISSING'}
          foreach($root in @($new,$(if($legacyExists){$legacy}))){
             $info=Get-Item -LiteralPath $root -Force -ErrorAction Stop
             if(($info.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw 'KTERM_RECOVERY_METADATA_REPARSE_ROOT_REFUSED'}
          }
          $manifestPath=Join-Path $new 'FIRST-USE-MANIFEST.json'
          if(-not(Test-Path -LiteralPath $manifestPath -PathType Leaf)){throw 'KTERM_RECOVERY_METADATA_MANIFEST_MISSING'}
          $m=Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if($m.source_sha -cne '3d8ff329485e0e97e452e953656976e68c33296a' -or
             $m.source_tree -cne '73d44fee8672717ddfc05704a05f4b2b55156257' -or
             $m.default_authority -cne 'DISARMED' -or [bool]$m.live_trading_authorized){
              throw 'KTERM_RECOVERY_METADATA_QUALIFIED_SOURCE_DRIFT'
          }
          $exerow=@($m.files|Where-Object {[string]$_.path -ceq 'K-Terminal.exe'})
          if($exerow.Count -ne 1){throw 'KTERM_RECOVERY_METADATA_EXE_MANIFEST_INVALID'}
          $exe=Join-Path $new 'K-Terminal.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf) -or
             (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne [string]$exerow[0].sha256){
             throw 'KTERM_RECOVERY_METADATA_INSTALLED_EXE_HASH_INVALID'
          }
          $oldData=Join-Path $legacy 'data'
          $oldConfig=Join-Path $legacy 'config.json'
          $oldExe=Join-Path $legacy 'K-Terminal.exe'
          $oldNative=Join-Path $oldData 'native-runtime'
          $oldAlerts=Join-Path $oldData 'alerts'
          $dataExists=($legacyExists -and (Test-Path -LiteralPath $oldData -PathType Container))
          $oldTopLevelCount=0
          if($dataExists){
             $d=Get-Item -LiteralPath $oldData -Force
             if(($d.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw 'KTERM_RECOVERY_METADATA_REPARSE_DATA_REFUSED'}
             $oldTopLevelCount=@(Get-ChildItem -LiteralPath $oldData -Force -ErrorAction Stop | Select-Object -First 129).Count
          }
          $nativeCount=0
          if($dataExists -and (Test-Path -LiteralPath $oldNative -PathType Container)){
             $nativeCount=@(Get-ChildItem -LiteralPath $oldNative -File -ErrorAction Stop | Select-Object -First 129).Count
          }
          $alertsCount=0
          if($dataExists -and (Test-Path -LiteralPath $oldAlerts -PathType Container)){
             $alertsCount=@(Get-ChildItem -LiteralPath $oldAlerts -File -ErrorAction Stop | Select-Object -First 129).Count
          }
          $qualifiedConfig=Test-Path -LiteralPath (Join-Path $new 'config.json') -PathType Leaf
          if($qualifiedConfig){throw 'KTERM_RECOVERY_METADATA_QUALIFIED_CONFIG_UNEXPECTED'}
          Write-Host ('KTERM_RECOVERY_ROOT_METADATA=PASS;QUALIFIED_INSTALL_EXISTS=TRUE'+
             ';QUALIFIED_EXE_HASH=PASS;QUALIFIED_SOURCE_PIN=PASS'+
             ';QUALIFIED_CONFIG_PRESENT=FALSE;LIVE_DISABLED=TRUE'+
             ';LEGACY_DEFAULT_ROOT_EXISTS='+[bool]$legacyExists+
             ';LEGACY_DEFAULT_EXE_PRESENT='+[bool]($legacyExists -and (Test-Path -LiteralPath $oldExe -PathType Leaf))+
             ';LEGACY_CONFIG_PRESENT='+[bool]($legacyExists -and (Test-Path -LiteralPath $oldConfig -PathType Leaf))+
             ';LEGACY_DATA_DIR_PRESENT='+[bool]$dataExists+
             ';LEGACY_DATA_TOP_LEVEL_ENTRIES_CAPPED_129='+$oldTopLevelCount+
             ';LEGACY_NATIVE_RUNTIME_DIR_PRESENT='+[bool]($dataExists -and (Test-Path -LiteralPath $oldNative -PathType Container))+
             ';LEGACY_NATIVE_RUNTIME_FILES_CAPPED_129='+$nativeCount+
             ';LEGACY_ALERTS_DIR_PRESENT='+[bool]($dataExists -and (Test-Path -LiteralPath $oldAlerts -PathType Container))+
             ';LEGACY_ALERTS_FILES_CAPPED_129='+$alertsCount+
             ';APPS_RUNNING=0;NO_FILE_CONTENTS_ACCESSED=TRUE;NO_PRIVATE_PATHS_EXPORTED=TRUE'+
             ';NO_CREDENTIALS_ACCESSED=TRUE;NO_BROKER_REQUESTS=TRUE;NO_STATE_MUTATION=TRUE')
          Write-Host 'KTERM_NEXT_GATE=AUTHENTICATED_ORIGINAL_LEDGER_CUSTODY_NOT_ESTABLISHED;KEEP_LIVE_DISABLED'
      - name: Check canonical BTC lot and TP custody file presence only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-firstuse-artifact-20261112' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:K_TERMINAL_EXECUTION_MODE -cne 'PAPER'){throw 'KTERM_BTC_CUSTODY_PRESENCE_SCOPE_REFUSED'}
          if(@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue).Count -ne 0){
             throw 'KTERM_BTC_CUSTODY_PRESENCE_ACTIVE_APP_REFUSED'
          }
          $legacy=Join-Path $env:LOCALAPPDATA 'KTerminal-Personal'
          $data=Join-Path $legacy 'data'
          if(-not(Test-Path -LiteralPath $data -PathType Container)){throw 'KTERM_BTC_CUSTODY_PRESENCE_NO_LEGACY_DATA'}
          $root=Get-Item -LiteralPath $data -Force
          if(($root.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw 'KTERM_BTC_CUSTODY_PRESENCE_REPARSE_REFUSED'}
          $known=@{
             'LOT_SNAPSHOT'='ladder-lots-BTC-USDC.json'
             'POSITION_SNAPSHOT'='position-state-BTC-USDC.json'
             'ACCOUNT_BINDING'='account-binding.json'
             'PERFORMANCE_SUMMARY'='performance-summary-BTC-USDC.json'
             'CONSUMED_POSITION_WAL'='ladder-lots-BTC-USDC.json.consumed.position.wal'
             'CONSUMED_HISTORY_WAL'='ladder-lots-BTC-USDC.json.consumed.history.wal'
             'CONSUMED_ARCHIVE_WAL'='ladder-lots-BTC-USDC.json.consumed.archive.wal'
             'CONSUMED_REPORT_WAL'='ladder-lots-BTC-USDC.json.consumed.report.wal'
             'NATIVE_LEDGER_ORIGIN'='native-runtime/ledger-origin.json'
             'NATIVE_CHECKPOINT'='native-runtime/checkpoint.json'
             'NATIVE_RECONCILIATION_METRICS'='native-runtime/reconciliation-metrics.json'
          }
          $result=@{}
          foreach($key in $known.Keys){
             $file=Join-Path $data ($known[$key].Replace('/','\'))
             $item=Get-Item -LiteralPath $file -Force -ErrorAction SilentlyContinue
             if($item -and ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){
                throw 'KTERM_BTC_CUSTODY_PRESENCE_REPARSE_FILE_REFUSED'
             }
             $result[$key]=($null -ne $item -and -not $item.PSIsContainer)
          }
          $candidateLots=@(Get-ChildItem -LiteralPath $data -File -Filter 'ladder-lots-*.json' -ErrorAction Stop | Select-Object -First 9).Count
          $candidatePositions=@(Get-ChildItem -LiteralPath $data -File -Filter 'position-state-*.json' -ErrorAction Stop | Select-Object -First 9).Count
          $segments=@('LOT_SNAPSHOT','POSITION_SNAPSHOT','ACCOUNT_BINDING','PERFORMANCE_SUMMARY',
             'CONSUMED_POSITION_WAL','CONSUMED_HISTORY_WAL','CONSUMED_ARCHIVE_WAL','CONSUMED_REPORT_WAL',
             'NATIVE_LEDGER_ORIGIN','NATIVE_CHECKPOINT','NATIVE_RECONCILIATION_METRICS')
          $pairs=@($segments|ForEach-Object {$_+'='+[bool]$result[$_]})
          Write-Host ('KTERM_BTC_ORIGINAL_CUSTODY_PRESENCE=PASS;'+($pairs -join ';')+
             ';LOT_SNAPSHOT_FILES_CAPPED_9='+$candidateLots+
             ';POSITION_SNAPSHOT_FILES_CAPPED_9='+$candidatePositions+
             ';NO_FILE_BYTES_READ=TRUE;NO_CONFIG_READ=TRUE;NO_PRIVATE_IDENTIFIERS_EXPORTED=TRUE'+
             ';NO_CREDENTIALS_USED=TRUE;NO_NETWORK_OR_BROKER_REQUESTS=TRUE;NO_WRITES=TRUE')
          Write-Host 'KTERM_BTC_PROVENANCE_AUTHORITY=UNVERIFIED;SAVED_FILE_PRESENCE_IS_NOT_SIGNED_LOT_OWNERSHIP'
