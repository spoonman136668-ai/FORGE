# One-shot maintenance ONLY, not a controller, consumer, timer, queue or scheduler.
# Does not alter pinned V41 original-owner workflow: same runner and concurrency.
# Every stage requires a DISTINCT owner-authored issue #807 comment.
# No schedule, workflow_dispatch, PR trigger, automatic task restart or science.
name: FORGE F139 V38 guarded original-owner forward installation

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  actions: read
  pull-requests: read

concurrency:
  group: forge-f139-v41-original-owner-live-install
  cancel-in-progress: false

jobs:
  hybrid-v38-original-forward-readiness:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'spoonman136668-ai' &&
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.event.issue.number == 807 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-HYBRID-V41-FORWARD-READINESS ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout immutable protected-main candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read-only original held-1830 and merged-source qualification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
             $env:GITHUB_REF -cne 'refs/heads/main' -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or
             $env:OPENAI_API_KEY) {
            throw 'F139_V38_FORWARD_ORIGINAL_OWNER_FIRST_ATTEMPT_DENIED'
          }
          $sha=(& git -C $env:GITHUB_WORKSPACE rev-parse HEAD|Out-String).Trim()
          $dirty=@(& git -C $env:GITHUB_WORKSPACE status --porcelain --untracked-files=all)
          if($LASTEXITCODE -ne 0 -or $sha -cne $env:GITHUB_SHA -or $dirty.Count -ne 0){
            throw 'F139_V38_FORWARD_PROTECTED_MAIN_CHECKOUT_DRIFT'
          }
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
          if($event.action -cne 'created' -or
             $event.issue.number -ne 807 -or
             $event.sender.login -cne 'spoonman136668-ai' -or
             $event.comment.user.login -cne 'spoonman136668-ai' -or
             $event.comment.author_association -cne 'OWNER' -or
             -not ([string]$event.comment.body).StartsWith('F139-HYBRID-V41-FORWARD-READINESS ', [System.StringComparison]::Ordinal)){
            throw 'F139_V38_FORWARD_DISTINCT_OWNER_COMMENT_REQUIRED'
          }
          $original=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if(@($original.Actions).Count -ne 1 -or
             [string]$original.State -cne 'Disabled' -or
             $original.Settings.Enabled -ne $false){
            throw 'F139_V38_FORWARD_ORIGINAL_TASK_NOT_QUIESCED'
          }
          $arguments=[string]$original.Actions[0].Arguments
          $match=[regex]::Match($arguments, '(?i)(?:^|\s)-PythonExe\s+"([^"]+)"')
          if(-not $match.Success -or
             -not (Test-Path -LiteralPath $match.Groups[1].Value -PathType Leaf)){
            throw 'F139_V38_FORWARD_ORIGINAL_PYTHON_NOT_QUALIFIED'
          }
          Push-Location $env:GITHUB_WORKSPACE
          try {
            & $match.Groups[1].Value -m f139.nci04_v41_hybrid_forward_readiness --target $env:GITHUB_SHA
            if($LASTEXITCODE -ne 0) {
              throw 'F139_V38_FORWARD_OWNER_GATE_NOT_QUALIFIED'
            }
          } finally {
            Pop-Location
          }

