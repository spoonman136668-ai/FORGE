name: Optimizer L9 WebNLG metadata-only source custody
on:
  push:
    branches: [research/optimizer-language-l9-webnlg-transfer-20261023]
    paths:
      - '.github/workflows/optimizer-language-l9-source-custody.yml'
      - 'research/optimizer_language_l9/L9_FROZEN_PROTOCOL.json'
permissions:
  contents: read
concurrency:
  group: optimizer-language-l9-source-custody
  cancel-in-progress: false
jobs:
  source-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Verify protocol-first lineage and resolve WebNLG Git metadata without corpus blob reads
        shell: bash
        run: |
          set -euo pipefail
          protocol_commit='3e74d5825d6cd7f2d0ef064841b4103fcef3c6dc'
          parent='58dc4cc483349249c98f1620b51b843b9e927468'
          test "$(git rev-parse HEAD~1)" = "$protocol_commit"
          test "$(git rev-parse HEAD~2)" = "$parent"
          changed_protocol="$(git diff --name-only "$parent" "$protocol_commit")"
          test "$changed_protocol" = 'research/optimizer_language_l9/L9_FROZEN_PROTOCOL.json'
          python - <<'PY'
          import json, pathlib
          p=json.loads(pathlib.Path('research/optimizer_language_l9/L9_FROZEN_PROTOCOL.json').read_text())
          assert p['schema']=='forge.optimizer.language.l9.webnlg-cross-domain-v1'
          assert p['status']=='PROTOCOL_ONLY_COMMITTED_BEFORE_WEBNLG_SOURCE_PARSE_OR_MODEL_CODE'
          assert p['frozen_parent_main']=='58dc4cc483349249c98f1620b51b843b9e927468'
          assert p['source']['repository_master_tip_required_prefix']=='587fa698'
          assert p['source']['release_tree_required_commit_prefix']=='a7ea49b5'
          assert 'Official WebNLG test data is protected' in p['source']['rules'][3]
          print('L9_PROTOCOL_FIRST_AND_GOVERNANCE=PASS')
          PY
          root="$RUNNER_TEMP/webnlg-metadata"
          test ! -e "$root"
          git clone --quiet --filter=blob:none --no-checkout https://gitlab.com/shimorina/webnlg-dataset.git "$root"
          master="$(git -C "$root" rev-parse origin/master^{commit})"
          case "$master" in 587fa698*) ;; *) echo "L9_WEBNLG_MASTER_PREFIX_DRIFT=$master"; exit 1;; esac
          release="$(git -C "$root" rev-parse a7ea49b5^{commit})"
          case "$release" in a7ea49b5*) ;; *) echo "L9_WEBNLG_RELEASE_PREFIX_DRIFT=$release"; exit 1;; esac
          git -C "$root" merge-base --is-ancestor "$release" "$master"
          train_tree="$(git -C "$root" rev-parse "$release:release_v3.0/en/train")"
          dev_tree="$(git -C "$root" rev-parse "$release:release_v3.0/en/dev")"
          test_tree="$(git -C "$root" rev-parse "$release:release_v3.0/en/test")"
          test "$(git -C "$root" cat-file -t "$train_tree")" = tree
          test "$(git -C "$root" cat-file -t "$dev_tree")" = tree
          test "$(git -C "$root" cat-file -t "$test_tree")" = tree
          train_files="$(git -C "$root" ls-tree -r --name-only "$release" release_v3.0/en/train | wc -l | tr -d ' ')"
          dev_files="$(git -C "$root" ls-tree -r --name-only "$release" release_v3.0/en/dev | wc -l | tr -d ' ')"
          test_files="$(git -C "$root" ls-tree -r --name-only "$release" release_v3.0/en/test | wc -l | tr -d ' ')"
          test "$train_files" -gt 0
          test "$dev_files" -gt 0
          test "$test_files" -gt 0
          # No checkout, cat-file blob, show, archive, or raw URL operation occurs.
          # Tree/object IDs and path counts are metadata-only custody.
          echo "L9_WEBNLG_MASTER_FULL_SHA=$master"
          echo "L9_WEBNLG_RELEASE_FULL_SHA=$release"
          echo "L9_WEBNLG_TRAIN_TREE_SHA1=$train_tree"
          echo "L9_WEBNLG_DEV_TREE_SHA1=$dev_tree"
          echo "L9_WEBNLG_TEST_TREE_SHA1_PROTECTED=$test_tree"
          echo "L9_WEBNLG_TRAIN_FILE_COUNT=$train_files"
          echo "L9_WEBNLG_DEV_FILE_COUNT=$dev_files"
          echo "L9_WEBNLG_TEST_FILE_COUNT_METADATA_ONLY=$test_files"
          echo "L9_CORPUS_BLOB_READS=0"
          echo "L9_MODEL_CODE_PRESENT=0"
          echo "L9_OFFICIAL_TEST_CONTENT_CONSUMED=FALSE"
          rm -rf "$root"
          test ! -e "$root"
          echo "L9_METADATA_ONLY_SOURCE_CUSTODY=PASS"
