name: FORGE RBACKUP local key setup
on:
  push:
    branches:
      - qualification/forge-rbackup-token-probe-20261026
permissions:
  contents: read
jobs:
  setup:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 20
    steps:
      - name: Check out FORGE
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned private RBACKUP source
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/rbackup
          ref: 5f1ca0f36be9bbbf2141e5558707f7ec11bab68a
          token: ${{ secrets.RBACKUP_WRITE_TOKEN }}
          path: rbackup
          persist-credentials: false
      - name: Run owner-controlled local custody launcher without D1 access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'RBACKUP_KEY_SETUP_WRONG_RUNNER' }
          $primary = Join-Path $env:LOCALAPPDATA 'rbackup-custody\primary\identity.txt'
          $recovery = Join-Path $env:LOCALAPPDATA 'rbackup-custody\recovery\identity.txt'
          $hasPrimary = Test-Path -LiteralPath $primary -PathType Leaf
          $hasRecovery = Test-Path -LiteralPath $recovery -PathType Leaf
          if ($hasPrimary -xor $hasRecovery) { throw 'RBACKUP_PARTIAL_KEY_PAIR_PRESERVED_NO_OVERWRITE' }
          $tempRoot = Join-Path $env:RUNNER_TEMP 'rbackup-age-tools'
          New-Item -ItemType Directory -Force -Path $tempRoot | Out-Null
          $env:GOBIN = Join-Path $tempRoot 'bin'
          $env:GOPATH = Join-Path $tempRoot 'gopath'
          $env:GOMODCACHE = Join-Path $tempRoot 'gomodcache'
          $env:GOCACHE = Join-Path $tempRoot 'gocache'
          New-Item -ItemType Directory -Force -Path $env:GOBIN,$env:GOPATH,$env:GOMODCACHE,$env:GOCACHE | Out-Null
          go install filippo.io/age/cmd/age@v1.2.1
          if ($LASTEXITCODE -ne 0) { throw 'RBACKUP_AGE_BUILD_FAILED' }
          go install filippo.io/age/cmd/age-keygen@v1.2.1
          if ($LASTEXITCODE -ne 0) { throw 'RBACKUP_AGE_KEYGEN_BUILD_FAILED' }
          $env:PATH = $env:GOBIN + [IO.Path]::PathSeparator + $env:PATH
          Push-Location rbackup
          try {
            if ($hasPrimary -and $hasRecovery) {
              & .\scripts\Initialize-RbackupLocalCustody.ps1 -VerifyExisting -AcceptSameDiskLossRisk
            } else {
              & .\scripts\Initialize-RbackupLocalCustody.ps1 -CreateNewKey -AcceptSameDiskLossRisk
            }
            if (-not $?) { throw 'RBACKUP_LOCAL_CUSTODY_LAUNCHER_FAILED' }
          } finally {
            Pop-Location
            Remove-Item -LiteralPath $tempRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path -LiteralPath $primary -PathType Leaf) -or -not (Test-Path -LiteralPath $recovery -PathType Leaf)) { throw 'RBACKUP_KEY_FILES_MISSING_AFTER_SETUP' }
          Write-Output 'RBACKUP_LOCAL_KEY_FILES=READY'
          Write-Output 'RBACKUP_KEY_CONTENTS=NEVER_PRINTED'
          Write-Output 'RBACKUP_REAL_EXPORT=NOT_EXECUTED'
          Write-Output 'CLOUDFLARE_ACCESS=NONE'
