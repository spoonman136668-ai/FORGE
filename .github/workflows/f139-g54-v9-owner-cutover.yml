              proof=build_v12_owner_approval(db, sys.argv[3], int(sys.argv[4]))
              with sqlite3.connect(sys.argv[2]) as out:
                  db.conn.backup(out)
              pathlib.Path(sys.argv[5]).write_bytes(canonical(proof))
              print("F139_V12_ORIGINAL_G54_G3_AND_996_CUSTODY=PASS")
              print("F139_V12_ORIGINAL_LEDGER_BACKUP=PASS")
          finally:
              db.close()
