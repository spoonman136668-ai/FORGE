              if(-not $line.StartsWith('{')){continue}
              try {$e=$line | ConvertFrom-Json}catch{continue}
              $entries += [pscustomobject]@{
                timestamp=(OptionalField $e 'at')
                disposition=(OptionalField $e 'disposition')
                blocked=(OptionalField $e 'blocked')
                error=(OptionalField $e 'error')
                reason=(OptionalField $e 'reason')
                ticket=(OptionalField $e 'ticket')
                issue_number=(OptionalField $e 'issue_number')
                candidates=(OptionalField $e 'candidates')
                rejected=(OptionalField $e 'rejected')
                steering_selection=(OptionalField $e 'steering_selection')
                detail=(OptionalField $e 'detail')
              }
            }
            Write-Host ('F139_G54_CONTROLLER_LOG_TAIL=' + (($entries | Select-Object -Last 30 | ConvertTo-Json -Compress -Depth 6)))
            $plainLines=@(Get-Content -LiteralPath $log | Select-Object -Last 80 |
              Where-Object {$_ -notmatch '^\s*\{'})
            Write-Host ('F139_G54_CONTROLLER_STARTUP_LOG_TAIL=' + ($plainLines | ConvertTo-Json -Compress -Depth 3))
          } else { Write-Host 'F139_G54_CONTROLLER_LOG=MISSING' }
          $taskInfo=Get-ScheduledTaskInfo -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          $triggerSummary=@()
          foreach($trigger in $task.Triggers) {
            $triggerSummary += [pscustomobject]@{
              enabled=(OptionalField $trigger 'Enabled')
              start_boundary=(OptionalField $trigger 'StartBoundary')
              end_boundary=(OptionalField $trigger 'EndBoundary')
              repetition_interval=(OptionalField $trigger.Repetition 'Interval')
              repetition_duration=(OptionalField $trigger.Repetition 'Duration')
            }
          }
          Write-Host ('F139_G54_OWNER_TASK_ENABLED=' + [string]$task.Settings.Enabled)
          Write-Host ('F139_G54_OWNER_TASK_LAST_RESULT=' + [string]$taskInfo.LastTaskResult)
          Write-Host ('F139_G54_OWNER_TASK_ACTION=' + [string]$task.Actions[0].Execute)
          Write-Host ('F139_G54_OWNER_TASK_ARGUMENTS=' + [string]$task.Actions[0].Arguments)
          Write-Host ('F139_G54_OWNER_TASK_TRIGGERS=' + ($triggerSummary | ConvertTo-Json -Compress -Depth 5))
          $taskEvents=@()
          try {
            $taskEvents=@(Get-WinEvent -FilterHashtable @{
              LogName='Microsoft-Windows-TaskScheduler/Operational'
              StartTime=(Get-Date).AddHours(-12)
            } -MaxEvents 200 -ErrorAction Stop |
              Where-Object {$_.Message -like '*FORGE-F139-UnifiedController*'} |
              Select-Object -First 12 Id,TimeCreated,LevelDisplayName,Message)
          } catch {}
          Write-Host ('F139_G54_TASKSCHEDULER_EVENTS=' + ($taskEvents | ConvertTo-Json -Compress -Depth 4))
          Write-Host ('F139_G54_OWNER_TASK_STATE=' + [string]$task.State)
          Write-Host ('F139_G54_OWNER_TASK_LAST_RUN=' + [string]$taskInfo.LastRunTime)
          Write-Host ('F139_G54_OWNER_TASK_NEXT_RUN=' + [string]$taskInfo.NextRunTime)
          Write-Host ('F139_G54_DEPLOYED_SOURCE_SHA=' + $deployedSource)
          Write-Host 'F139_G54_STATUS_READ_ONLY=PASS'
