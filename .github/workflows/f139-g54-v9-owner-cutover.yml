              assert stages.get("QUARANTINED",0)>=15 and stages.get("VERIFIED",0)>=21
              assert set(stages)<={"QUARANTINED","VERIFIED"}
              neg=con.execute("SELECT stage,run_id,quarantine_reason FROM tasks WHERE ticket='f139-nci04-i989-e49569d4a8b7-58834924'").fetchone()
              good=con.execute("SELECT stage,run_id FROM tasks WHERE ticket='f139-nci04-i996-e49569d4a8b7-015c3104'").fetchone()
