              assert tuple(good)==("VERIFIED",40465676857)
              g3={row["kind"]:row["count"] for row in con.execute("SELECT kind,COUNT(*) AS count FROM events WHERE kind IN ('G3_DRAFT_ATTEMPTED','G3_DRAFT_AUTHENTICATED') GROUP BY kind")}
              assert g3.get("G3_DRAFT_ATTEMPTED",0)==1 and g3.get("G3_DRAFT_AUTHENTICATED",0)<=1
              model=con.execute("SELECT COUNT(*) FROM events WHERE kind='MODEL_DRAFT_ATTEMPTED'").fetchone()[0]
              assert model==0
              print("F139_V12_ORIGINAL_READONLY_PREFLIGHT=PASS "+json.dumps({"head_seq":m["head_seq"],"head_hash":m["head_hash"],"source_sha":m["source_sha"],"stages":stages,"g3":g3,"model_draft_attempts":model},sort_keys=True))
          finally: con.close()
          '@ | & $python -B - $db $old
          if($LASTEXITCODE -ne 0){throw 'F139_V12_ORIGINAL_LEDGER_RO_VERIFICATION_FAILED'}
          Write-Host 'F139_V12_ORIGINAL_TASK_RUNNING=PASS'
          Write-Host 'F139_V12_ORIGINAL_G54_NEGATIVE_UNREPLAYED=PASS'
          Write-Host 'F139_V12_READONLY_ONLY=PASS'

