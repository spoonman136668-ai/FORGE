name: RAR G32 concurrent nested Go resource smoke
on:
  pull_request:
    paths:
      - 'research/replay_acceleration/g32/**'
      - '.github/workflows/rar-g32-tree.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concurrent-tree:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build native stand-alone bounded tree
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          go build -o "rar-g32$suffix" ./research/replay_acceleration/g32
          if ($LASTEXITCODE -ne 0) { throw 'G32_BUILD_FAILED' }
      - name: Probe concurrent nested descendants
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          python research/replay_acceleration/g32/verify.py (Join-Path $PWD "rar-g32$suffix")
          if ($LASTEXITCODE -ne 0) { throw 'G32_PROBE_FAILED' }
      - uses: actions/upload-artifact@v4
        with:
          name: rar-g32-${{ matrix.os }}
          path: rar_g32_receipt.json
          if-no-files-found: error
