name: Optimizer O9 learned public episodic write read routing

on:
  push:
    branches: [research/optimizer-o9-learned-memory-routing-20261023]
    paths:
      - '.github/workflows/optimizer-o9-sourceonly.yml'
      - 'research/optimizer_o9/**'

permissions:
  contents: read

concurrency:
  group: optimizer-o9-sourceonly
  cancel-in-progress: false

jobs:
  native-public-development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check exact parent and immutable frozen protocol and O8 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = 'fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5'
          $ancestor = (& git merge-base $parent HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ancestor -cne $parent) {
            throw 'O9_PARENT_DRIFT'
          }
          $expected = @(
            '.github/workflows/optimizer-o9-sourceonly.yml',
            'research/optimizer_o9/O9_FROZEN_PROTOCOL.json',
            'research/optimizer_o9/o8_frozen_recurrent.py',
            'research/optimizer_o9/public_source.py',
            'research/optimizer_o9/routing.py',
            'research/optimizer_o9/controls.py',
            'research/optimizer_o9/runner.py',
            'research/optimizer_o9/test_routing.py'
          )
          $actual = @(& git diff --name-only $parent HEAD)
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne $expected.Count -or
              (Compare-Object $actual $expected)) {
            throw 'O9_BOUNDED_SOURCE_DELTA_DRIFT'
          }
          $pins = @{
            'research/optimizer_o9/O9_FROZEN_PROTOCOL.json' = 'e102d3cae15df8557c1386a796ea2888544fe9f3'
            'research/optimizer_o9/o8_frozen_recurrent.py' = '6f0e9d58718efdae0e448e9387d325cf653a81fc'
          }
          foreach ($p in $pins.Keys) {
            $blob = (& git rev-parse ('HEAD:'+$p)).Trim()
            $disk = (& git hash-object --no-filters -- $p).Trim()
            if ($LASTEXITCODE -ne 0 -or $blob -cne $pins[$p] -or
                $disk -cne $pins[$p]) {
              throw ('O9_FROZEN_BLOB_DRIFT_'+$p)
            }
          }
          Write-Host 'O9_FROZEN_SOURCE_IDENTITY=PASS'
      - name: Public source, exact gradients and no hidden role regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s research/optimizer_o9 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'O9_FOCUSED_SOURCE_TESTS_FAILURE' }
          Write-Host 'O9_FOCUSED_TESTS=PASS'
      - name: Fresh public TRAIN SELECT DEV fitted routing and explicit comparisons
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B research/optimizer_o9/runner.py
          if ($LASTEXITCODE -ne 0) { throw 'O9_EIGHT_ARM_EXECUTION_FAILURE' }
          Write-Host 'O9_PUBLIC_ONLY_ALL_EIGHT_ARMS=EMITTED'
          Write-Host 'O9_FSA_PROTECTED_ROLE_USAGE=ZERO'
      - name: One final FORGE Go regression test vet build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo O9_FINAL_GO_REGRESSION=PASS
      - name: Verify no working tree side effects
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(& git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) { throw 'O9_DIRTY_SOURCE_TREE' }
          Write-Host 'O9_NO_NATIVE_INTEGRATION_OR_CONTROLLER_MUTATION=PASS'
