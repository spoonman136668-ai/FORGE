name: F139 original Windows owner GitHub credential and quota read-only audit
on:
  push:
    branches: [cutover/f139-g4-single-owner-20261024]
    paths: [.github/workflows/f139-original-credential-api-readonly-20261024.yml]
permissions:
  contents: read
jobs:
  owner-api-diagnosis:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 6
    steps:
      - name: Inspect gh default credential route with no injected API token
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){throw 'F139_OWNER_NOT_ORIGINAL'}
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if([string]$task.State -cne 'Running'){throw 'F139_OWNER_NOT_RUNNING'}
          $current=[Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $name=[string]$task.Principal.UserId
          $sid=if($name -match '^S-1-'){$name}else{
             (New-Object Security.Principal.NTAccount($name)).Translate(
                 [Security.Principal.SecurityIdentifier]).Value
          }
          if($sid -cne $current){throw 'F139_OWNER_SID_DIFFERENT'}
          $probe=@'
          import json,os,re,shutil,subprocess,time
          exe=shutil.which("gh")
          assert exe,"GH_MISSING"
          env=dict(os.environ)
          env.pop("GH_TOKEN",None)
          env.pop("GITHUB_TOKEN",None)
          def run(route):
              p=subprocess.run([exe,"api",route],env=env,stdin=subprocess.DEVNULL,
                 stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=28,text=True)
              if p.returncode:
                  err=p.stderr.lower()
                  label=("RATE_LIMIT" if "rate limit" in err else
                         "BAD_CREDENTIALS" if "bad credentials" in err or "authentication" in err else
                         "NOT_FOUND" if "404" in err else
                         "DENIED" if "403" in err else
                         "HTTP_UNCLASSIFIED")
                  print("F139_OWNER_GH_"+route.split("/")[-1].upper()+"_EXIT="+str(p.returncode))
                  print("F139_OWNER_GH_ERROR_CLASS="+label)
                  return None
              return json.loads(p.stdout)
          rate=run("rate_limit")
          if rate is not None:
              quota=rate.get("resources",{}).get("core",{})
              print("F139_OWNER_GH_RATE_LIMIT=" + str(quota.get("limit")))
              print("F139_OWNER_GH_RATE_REMAINING=" + str(quota.get("remaining")))
              print("F139_OWNER_GH_RATE_RESET="+str(quota.get("reset")))
              print("F139_OWNER_GH_RATE_READ=PASS")
          else:
              print("F139_OWNER_GH_RATE_READ=BLOCKED")
          main=run("repos/spoonman136668-ai/FORGE/branches/main")
          if main is not None:
              print("F139_OWNER_GH_PROTECTED_MAIN="+main.get("commit",{}).get("sha",""))
          policy=run("repos/spoonman136668-ai/FORGE/issues/807")
          if policy is not None:
              print("F139_OWNER_GH_POLICY_SOURCE="+json.loads(policy["body"])["source_sha"])
          print("F139_OWNER_GH_DIAGNOSTIC_READONLY=TRUE")
          '@
          $python=(Get-Command python.exe -ErrorAction Stop).Source
          & $python -B -c $probe
          if($LASTEXITCODE -ne 0){throw 'F139_OWNER_GITHUB_AUTH_PROBE_FAILED'}
