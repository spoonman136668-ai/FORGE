name: ACC35 original 36-idea acceleration native Go reversible memory cost
on:
  pull_request:
    paths:
      - 'research/acceleration/acc35_go_memory/**'
      - 'docs/research/ACC-35-*'
      - '.github/workflows/forge-acc35-reversible-memory.yml'
permissions:
  contents: read
jobs:
  native-go-sourcefree-memory:
    name: ACC35 exact public memory replay / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Verify exact immutable source and original acceleration portfolio
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/research/ACC-35-REVERSIBLE-MEMORY-FUSION-PREREG.md)" = b1e8e385f9e0eb963ab31024b91e9542477baad2
          test "$(git hash-object research/acceleration/acc35_go_memory/go.mod)" = 2b47fa9c379aede47a1fcb17ae2b00d8bd78a641
          test "$(git hash-object research/acceleration/acc35_go_memory/main.go)" = 5b2a456288ffc378d132036cb7e909e9bc6186d9
          test "$(git hash-object research/acceleration/acc35_go_memory/main_test.go)" = a7a0024d4f20360bdf0837c00b556269e636b70e
          test "$(git hash-object research/acceleration/acc34_scoreboard.py)" = 9f85860fc63cbe091180001a04f9bbe6f441af0e
          python -B -m unittest discover -s research/acceleration -p 'test_acc34_scoreboard.py' -v
          python -B research/acceleration/acc34_scoreboard.py --full "$RUNNER_TEMP/acc35-original36.json"
          echo ACC35_INDEPENDENT_36_ACCELERATION_ID_CUSTODY=PASS
      - name: Genuine native Go public delayed contradictory outcome/cold replay tests
        shell: bash
        run: |
          set -euo pipefail
          (cd research/acceleration/acc35_go_memory && go test -count=1 -v ./... && go vet ./...)
          echo ACC35_REVERSIBLE_PUBLIC_MEMORY_AND_LOSSY_COUNTEREXAMPLE=PASS
      - name: Five paired 16-cold-history native Go whole-child process resource trials
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/acc35_memory"
          if [ "$RUNNER_OS" = Windows ]; then binary="$RUNNER_TEMP/acc35_memory.exe"; fi
          (cd research/acceleration/acc35_go_memory && go build -trimpath -o "$binary" .)
          "$binary" benchmark > "$RUNNER_TEMP/acc35-native-go-report.json"
          python - "$RUNNER_TEMP/acc35-native-go-report.json" <<'PY'
          import hashlib,json,math,pathlib,sys
          p=pathlib.Path(sys.argv[1]);raw=p.read_bytes();r=json.loads(raw)
          assert r["schema"]=="forge.acc35.acd3.native-go-memory-fusion.v1"
          assert r["candidate"]=="AC-D3"
          assert r["repetitions"]==5 and r["cold_sessions_per_worker"]==16
          assert r["events_per_session"]==4096
          assert r["original_source_episodes"]==0
          assert r["scientific_first_use"] is False
          assert r["native_model_acceleration_proven"] is False
          assert len(r["trials"])==40 and len(r["summaries"])==2
          assert {s["scenario"] for s in r["summaries"]}=={
              "nonconflicting","delayed_counterexample"}
          assert all(t["worker"]["event_insertions"]==4096*16 for t in r["trials"])
          assert all(t["whole_child_cpu_ns"]>0 and t["worker"]["serialized_checkpoint_bytes"]>0
                     for t in r["trials"])
          assert all(s["fusion_exact"] and s["dictionary_exact"] and
                 all(math.isfinite(s[k]) and s[k]>0 for k in (
                 "fusion_cpu_over_dict","fusion_checkpoint_bytes_over_dict",
                 "fusion_go_sys_over_dict")) for s in r["summaries"])
          assert next(s for s in r["summaries"] if s["scenario"]=="delayed_counterexample")["lossy_wrong_outcomes"]>0
          if r["classification"]=="ACC35_ACD3_BOUNDED_GO_MEMORY_ENGINEERING_POSITIVE_NO_SCIENCE":
              assert all(s["engineering_pass"] for s in r["summaries"])
          else:
              assert r["classification"]=="ACC35_ACD3_NO_AMORTIZED_NATIVE_GO_WIN"
              assert not all(s["engineering_pass"] for s in r["summaries"])
          print("ACC35_WHOLE_NATIVE_GO_RESOURCE_CLASSIFICATION="+r["classification"])
          print("ACC35_RESOURCE_SUMMARIES="+json.dumps(r["summaries"],sort_keys=True))
          print("ACC35_REPORT_SHA256="+hashlib.sha256(raw).hexdigest())
          print("ACC35_REAL_NATIVE_MODEL_ACCELERATION=NOT_ESTABLISHED")
          PY
      - name: Archive complete 36 portfolio custody and measured Go source-free resources
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: acc35-original36-go-memory-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/acc35-original36.json
            ${{ runner.temp }}/acc35-native-go-report.json
          retention-days: 30
          if-no-files-found: error
