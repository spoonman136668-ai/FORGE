name: FORGE FSA read-only Cloudflare D1 inventory
on:
  push:
    branches: [qualification/forge-rbackup-token-probe-20261026]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    steps:
      - name: List D1 metadata without exposing identifiers or calling export
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'FSA_D1_INVENTORY_WRONG_RUNNER' }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) { throw 'FSA_D1_API_TOKEN_UNAVAILABLE' }
          if ($env:CLOUDFLARE_ACCOUNT_ID -notmatch '^[0-9a-fA-F]{32}$') { throw 'FSA_D1_ACCOUNT_ID_UNAVAILABLE' }
          $headers = @{ Authorization = "Bearer $($env:CLOUDFLARE_API_TOKEN)"; Accept = 'application/json' }
          try {
            $uri = "https://api.cloudflare.com/client/v4/accounts/$($env:CLOUDFLARE_ACCOUNT_ID)/d1/database?per_page=100&page=1"
            $response = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -TimeoutSec 30
            if ($response.success -ne $true) { throw 'FSA_D1_INVENTORY_DENIED' }
            $items = @($response.result)
            $total = [int]$response.result_info.total_count
            $targetNames = @($items | Where-Object { [string]$_.name -match '(?i)(fsa|forge)' })
            Write-Output 'FSA_D1_READONLY_INVENTORY=PASS'
            Write-Output "FSA_D1_DATABASES_RETURNED=$($items.Count)"
            Write-Output "FSA_D1_DATABASES_TOTAL=$total"
            Write-Output "FSA_D1_NAMES_MATCHING_FSA_OR_FORGE=$($targetNames.Count)"
            Write-Output "FSA_D1_LIST_COMPLETE=$([bool]($items.Count -ge $total))"
            Write-Output 'FSA_D1_NAMES_AND_IDS=NOT_PRINTED'
            Write-Output 'FSA_D1_EXPORT=NOT_CALLED'
            Write-Output 'FSA_D1_WRITE=NONE'
          } catch {
            $status = 'none'
            try { if ($_.Exception.Response.StatusCode) { $status = [string][int]$_.Exception.Response.StatusCode } } catch {}
            Write-Output "FSA_D1_READONLY_INVENTORY=BLOCKED"
            Write-Output "FSA_D1_HTTP_STATUS=$status"
            Write-Output "FSA_D1_ERROR_TYPE=$($_.Exception.GetType().Name)"
            throw 'FSA_D1_READONLY_INVENTORY_FAILED'
          } finally {
            $headers.Clear()
            Remove-Item Env:CLOUDFLARE_API_TOKEN,Env:CLOUDFLARE_ACCOUNT_ID -ErrorAction SilentlyContinue
          }
