name: Wingless R1 R2 original Go transport source contract
on:
  push:
    branches: [repair/itd02-wingless-go-wire-20261024]
permissions:
  contents: read
jobs:
  go-public-observation-wire-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Fetch exact frozen native source files and verify Git blob identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k4t/go/research/native/itd02/r1" "$RUNNER_TEMP/k4t/go/research/native/itd02/r2"
          python -B - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          p=json.loads(Path("research/lcrm01/k4y_frozen_learned_affordance.json").read_text())
          root=Path(os.environ["RUNNER_TEMP"])/"k4t/go/research/native/itd02"
          for k, rel in (("wingless_R1","r1/policy.go"),("wingless_R2","r2/affordance.go")):
              spec=p["source"][k]
              url="https://api.github.com/repos/"+spec["repo"]+"/contents/"+quote(spec["file"],safe="/")+"?ref="+spec["head"]
              headers={"Accept":"application/vnd.github+json","User-Agent":"FORGE-K4T-Source-Only",
                       "Authorization":"Bearer "+os.environ["GH_TOKEN"]}
              with urlopen(Request(url,headers=headers),timeout=45) as r:
                  result=json.load(r)
              raw=base64.b64decode(result["content"].replace(chr(10),""),validate=True)
              git_blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
              if result["sha"]!=git_blob or git_blob!=spec["blob"]:
                  raise RuntimeError("WINGLESS_ORIGINAL_NATIVE_SOURCE_IDENTITY_DRIFT")
              (root/rel).write_bytes(raw)
              print("K4T_"+k+"_ORIGINAL_BLOB="+git_blob)
          PY
      - name: Compile and vet original native R1 and R2 bridges without any environment execution
        shell: bash
        run: |
          set -euo pipefail
          printf 'module github.com/spoonman136668-ai/Wingless\n\ngo 1.25.0\n' > "$RUNNER_TEMP/k4t/go/go.mod"
          sed 's|"k4u/wingless"|"github.com/spoonman136668-ai/Wingless/research/native/itd02/r1"|' research/lcrm01/k4u_wingless_bridge.go > "$RUNNER_TEMP/k4t/go/bridge_r1.go"
          cp research/lcrm01/k4y_wingless_r2_bridge.go "$RUNNER_TEMP/k4t/go/bridge_r2.go"
          (cd "$RUNNER_TEMP/k4t/go" && go vet ./research/native/itd02/... && go build -trimpath -o "$RUNNER_TEMP/k4t/wingless-r1" bridge_r1.go && go build -trimpath -o "$RUNNER_TEMP/k4t/wingless-r2" bridge_r2.go)
      - name: Verify Python wire schema and real original Go learning/round trip
        env:
          WINGLESS_R1_NATIVE_BRIDGE: ${{ runner.temp }}/k4t/wingless-r1
          WINGLESS_R2_NATIVE_BRIDGE: ${{ runner.temp }}/k4t/wingless-r2
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/research/lcrm01"
          python -B -m unittest discover -s research/lcrm01 -p 'test_k4t_wingless_wire.py' -v
          echo K4T_SOURCE_ONLY_NATIVE_TRANSPORT=PASS

  final-standard-regression:
    needs: go-public-observation-wire-source-only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Enforce exact stacked base and three-file bounded repair
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='b01627841e6014750b3f03bcd58873d08375f93d'
          & git merge-base --is-ancestor $base HEAD
          if($LASTEXITCODE-ne0){throw 'K4T_BASE_ANCESTRY_DRIFT'}
          $changed=@(& git diff --name-only $base HEAD)
          if($LASTEXITCODE-ne0){throw 'K4T_DIFF_QUERY_FAILED'}
          $expected=@(
            '.github/workflows/lcrm01-k4t-wingless-go-wire.yml',
            'research/lcrm01/k4u_native_minigrid.py',
            'research/lcrm01/test_k4t_wingless_wire.py'
          )
          if(Compare-Object $expected $changed){throw 'K4T_REPAIR_SCOPE_DRIFT'}
          Write-Host 'K4T_THREE_FILE_REPAIR_IDENTITY=PASS'
      - name: Affected source-only K4U K4X K4Y interface and K4T guards
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($IsLinux){
            $env:PYTHONPATH="$env:GITHUB_WORKSPACE/research/lcrm01"
            foreach($pattern in @('test_k4u_sourceonly.py','test_k4x_sourceonly.py','test_k4y_sourceonly.py','test_k4t_wingless_wire.py')){
              & python -B -m unittest discover -s research/lcrm01 -p $pattern -v
              if($LASTEXITCODE-ne0){throw ('K4T_AFFECTED_INTERFACE_FAILED_'+$pattern)}
            }
            Write-Host 'K4T_AFFECTED_INTERFACE_REGRESSION=PASS'
          }else{
            # Original source-only MiniGrid modules import POSIX-only resource.
            # Parse those original files on Windows; run their real tests on Linux.
            foreach($p in @('research/lcrm01/k4u_native_minigrid.py',
                            'research/lcrm01/k4x_curriculum_intervention.py',
                            'research/lcrm01/k4y_native_affordance.py',
                            'research/lcrm01/test_k4t_wingless_wire.py')){
              & python -B -c "import ast,sys;ast.parse(open(sys.argv[1],encoding='utf-8').read())" $p
              if($LASTEXITCODE-ne0){throw ('K4T_WINDOWS_SOURCE_SYNTAX_FAILED_'+$p)}
            }
            Write-Host 'K4T_WINDOWS_LINUX_ONLY_SOURCE_AST=PASS'
          }
      - name: One standard FORGE isolation controller Go regression vet build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & python -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          if($LASTEXITCODE-ne0){throw 'K4T_ISOLATION_UNIT_FAIL'}
          & python -B isolationguard/check.py
          if($LASTEXITCODE-ne0){throw 'K4T_ISOLATION_CHECK_FAIL'}
          & python -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          if($LASTEXITCODE-ne0){throw 'K4T_FSA_SCRIPT_FAIL'}
          & python -B -m unittest discover -s fsad1 -p 'test_*.py' -v
          if($LASTEXITCODE-ne0){throw 'K4T_FSAD1_FAIL'}
          & python -B -m unittest discover -s f139 -p 'test_*.py'
          if($LASTEXITCODE-ne0){throw 'K4T_F139_REGRESSION_FAIL'}
          # Existing standalone IPC bridges are compiled separately in the prior
          # original-source job. The root FORGE module cannot import them.
          $module=(& go list -m).Trim()
          if($LASTEXITCODE-ne0 -or $module-ne'github.com/spoonman136668-ai/forge'){
            throw 'K4T_GO_ROOT_MODULE_IDENTITY_DRIFT'
          }
          $records=@(& go list -e -f '{{.ImportPath}}|{{if .Incomplete}}INCOMPLETE{{else}}OK{{end}}' ./...)
          if($LASTEXITCODE-ne0){throw 'K4T_GO_PACKAGE_DISCOVERY_FAILED'}
          $incomplete=@($records | Where-Object {$_ -match '\|INCOMPLETE$'})
          $expected="$module/research/lcrm01|INCOMPLETE"
          if($incomplete.Count-ne1 -or $incomplete[0]-cne$expected){
            throw ('K4T_UNEXPECTED_INCOMPLETE_GO_PACKAGES_'+($incomplete -join ','))
          }
          $packages=@($records | Where-Object {$_ -match '\|OK$'} | ForEach-Object { ($_ -split '\|')[0] })
          if($packages.Count -lt 30){throw 'K4T_GO_PACKAGE_COVERAGE_BELOW_FLOOR'}
          Write-Host ('K4T_COMPLETE_FORGE_GO_PACKAGES='+$packages.Count)
          & go test -count=1 $packages
          if($LASTEXITCODE-ne0){throw 'K4T_GO_FULL_APPLICABLE_REGRESSION_FAIL'}
          if($IsLinux){
            & go test -race -count=1 $packages
            if($LASTEXITCODE-ne0){throw 'K4T_GO_RACE_REGRESSION_FAIL'}
          }
          & go vet $packages
          if($LASTEXITCODE-ne0){throw 'K4T_GO_VET_FAIL'}
          & go build $packages
          if($LASTEXITCODE-ne0){throw 'K4T_GO_BUILD_FAIL'}
          Write-Host 'K4T_FINAL_FULL_APPLICABLE_REGRESSION=PASS'
      - name: Verify clean checkout and no scientific execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dirty=@(& git status --porcelain --untracked-files=all)
          if($LASTEXITCODE-ne0 -or $dirty.Count-ne0){throw 'K4T_SOURCE_TREE_DIRTY'}
          Write-Host 'K4T_SOURCE_TREE_CLEAN=PASS'
          Write-Host 'K4T_CONSUMED_MINIGRID_COHORTS=NOT_EXECUTED'
          Write-Host 'K4T_SCIENTIFIC_FIRST_USE=NOT_AUTHORIZED'
