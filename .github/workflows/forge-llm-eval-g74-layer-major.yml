name: FORGE LLM Evaluation G74 authentic GPT2 CPU layer-major microbatch
on:
  push:
    branches: [research/llm-evaluation-g74-layer-major-20261030]
    paths:
      - '.github/workflows/forge-llm-eval-g74-layer-major.yml'
      - 'research/llm_g74/**'
permissions:
  contents: read
concurrency:
  group: forge-cpu-llm-evaluation-g74-authentic
  cancel-in-progress: false
jobs:
  frozen-source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable G70 baseline and prereg before source test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD
          git merge-base --is-ancestor 000ed3607eaa0b55313f9d0f5387a0f87262bdc1 HEAD
          test "$(git rev-parse HEAD:docs/research/G74-GPT2-LAYER-MAJOR-BATCH-PREEXEC-20261030.md)" = "$(git rev-parse 000ed3607eaa0b55313f9d0f5387a0f87262bdc1:docs/research/G74-GPT2-LAYER-MAJOR-BATCH-PREEXEC-20261030.md)"
          git diff --exit-code 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD -- research/llm_g54 research/llm_g55 research/llm_g56 research/llm_g57 research/llm_g58 research/llm_g59 research/llm_g60 research/llm_g61 research/llm_g62 research/llm_g63 research/llm_g64 research/llm_g65 research/llm_g66 research/llm_g67 research/llm_g68 research/llm_g70
          git diff --check 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD
          python -B -m unittest discover -s research/llm_g74 -p test_g74_layer_major.py -v
          echo G74_SOURCE_FREE_ADMISSION=PASS
  authenticated-original-gpt2:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    needs: frozen-source-admission
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original pretrained CPU environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install --disable-pip-version-check 'transformers==4.48.3' 'huggingface_hub==0.30.2' 'safetensors==0.5.3' 'tokenizers==0.21.1' 'psutil==7.1.3'
          python -m pip check
          python -m pip freeze > g74_original_environment.txt
      - name: Execute independently original human-heldout and matched batching controls
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/llm_g74/g74_layer_major.py
          python - <<'PY'
          import json
          v=json.load(open("g74_original_result.json"))
          assert v["gate"]=="G74"
          assert v["engineering"]=="PASS" and v["correctness"]=="PASS"
          assert v["summary"]["timed_response_count"]==144
          assert v["performance"] in ("GO","NO_GO")
          assert v["scientific_acceptance"]=="NOT_GRANTED" and not v["promotion_allowed"]
          print("G74_ORIGINAL_MODEL_EXACT_PARITY=PASS")
          print("G74_FROZEN_PERFORMANCE="+v["performance"])
          PY
      - name: Preserve original evidence including failure or blocked runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g74-gpt2-original-layer-major
          retention-days: 30
          if-no-files-found: warn
          path: |
            g74_original_result.json
            g74_original_environment.txt
