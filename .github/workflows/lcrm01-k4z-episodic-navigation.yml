name: Mass K4Z prospective native episodic causal navigation
on:
  push:
    branches: [research/mass-lcrm01-k4z-episodic-navigation-20261024]
permissions:
  contents: read
jobs:
  real-original-mini-grid-firstuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original public source and native episodic memory qualification
        run: bash research/lcrm01/k4z_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-k4z-original-episodic-navigation-research
          path: |
            ${{ runner.temp }}/k4z/process-a.json
            ${{ runner.temp }}/k4z/process-b.json
            ${{ runner.temp }}/k4z/comparison.json
            ${{ runner.temp }}/k4z/process-a.log
            ${{ runner.temp }}/k4z/process-b.log
          if-no-files-found: warn
          retention-days: 90
