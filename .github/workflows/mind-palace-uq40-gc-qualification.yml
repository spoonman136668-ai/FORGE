name: UQ40 independent scratch reaper synthetic qualification
# Separate workflow survives interrupted/cancelled private intake poll jobs.
# No Mind-Palace network access, no GitHub read token and no scientific dependency.
on:
  push:
    branches: [qualification/uq39-mind-palace-reconciled-scheduler]
    paths:
      - '.github/workflows/mind-palace-uq40-gc-qualification.yml'
permissions:
  contents: read
concurrency:
  group: uq40-scratch-gc-qualification
  cancel-in-progress: false
jobs:
  reap:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 10
    steps:
      - name: Fail-closed cleanup of abandoned scoped private directories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){
            throw 'UQ40_GC_RUNNER_IDENTITY_MISMATCH'
          }
          Remove-Item Env:GH_TOKEN,Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          # Verify the exact reviewed PR head, then exercise stale-versus-recent
          # scratch cleanup using synthetic, non-private fixture files.
          $candidate = @(& git.exe ls-remote --exit-code 'https://github.com/spoonman136668-ai/FORGE.git' 'refs/heads/engineering/uq37-mind-palace-scheduled-poll')
          if($LASTEXITCODE -ne 0 -or $candidate.Count -ne 1 -or ([string]$candidate[0] -split '\s+')[0] -cne '5390fdda63c604c83ab1c29ff42c25366d5d15f2'){
            throw 'UQ40_GC_PR_HEAD_DRIFT'
          }
          $base = Join-Path $env:RUNNER_TEMP 'mp37-private-scratch'
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          $expired = Join-Path $base ('run-' + $env:GITHUB_RUN_ID + '1')
          $recent = Join-Path $base ('run-' + $env:GITHUB_RUN_ID + '2')
          foreach($p in @($expired,$recent)){
            if(Test-Path -LiteralPath $p){throw 'UQ40_SYNTHETIC_DIR_ALREADY_EXISTS'}
            New-Item -ItemType Directory -Path $p | Out-Null
            [IO.File]::WriteAllText((Join-Path $p 'synthetic.txt'),'synthetic fixture only')
          }
          (Get-Item -LiteralPath (Join-Path $expired 'synthetic.txt')).LastWriteTimeUtc = [DateTime]::UtcNow.AddHours(-2)
          (Get-Item -LiteralPath $expired).LastWriteTimeUtc = [DateTime]::UtcNow.AddHours(-2)
          if(-not (Test-Path -LiteralPath $base -PathType Container)){
            Write-Host 'UQ40_PRIVATE_GC_EMPTY=PASS'
            exit 0
          }
          $threshold = [DateTime]::UtcNow.AddMinutes(-45)
          $removed = 0
          $retained = 0
          $dirs = @(Get-ChildItem -LiteralPath $base -Directory -Force -ErrorAction Stop)
          foreach($d in $dirs){
            if($d.Name -cnotmatch '^run-[0-9]+$'){
              throw 'UQ40_UNRECOGNIZED_PRIVATE_SCRATCH_ENTRY'
            }
            $latest = $d.LastWriteTimeUtc
            foreach($child in @(Get-ChildItem -LiteralPath $d.FullName -Recurse -Force -ErrorAction Stop)){
              if($child.LastWriteTimeUtc -gt $latest){$latest=$child.LastWriteTimeUtc}
            }
            if($latest -gt $threshold){
              $retained++
              continue
            }
            Remove-Item -LiteralPath $d.FullName -Recurse -Force -ErrorAction Stop
            if(Test-Path -LiteralPath $d.FullName){throw 'UQ40_PRIVATE_GC_DELETION_FAILED'}
            $removed++
          }
          Write-Host ('UQ40_EXPIRED_PRIVATE_SCRATCH_REMOVED='+$removed)
          Write-Host ('UQ40_RECENT_PRIVATE_SCRATCH_RETAINED='+$retained)
          Write-Host 'UQ40_INDEPENDENT_PRIVATE_SCRATCH_GC=PASS'
          if(Test-Path -LiteralPath $expired){throw 'UQ40_EXPIRED_FIXTURE_NOT_REAPED'}
          if(-not (Test-Path -LiteralPath $recent)){throw 'UQ40_RECENT_FIXTURE_PREMATURELY_REAPED'}
          Remove-Item -LiteralPath $recent -Recurse -Force -ErrorAction Stop
          if(Test-Path -LiteralPath $recent){throw 'UQ40_RECENT_FIXTURE_CLEANUP_FAILED'}
          Write-Host 'UQ40_INDEPENDENT_REAPER_SYNTHETIC_TEST=PASS'
