name: FORGE KABOOM R12 read-only audit pinned-source offline qualification
on:
  push:
    branches: [qualification/kaboom-pr105-source-offline-20261114]
    paths: [.github/workflows/forge-kaboom-pr105-offline-20261114.yml]
permissions:
  contents: read
concurrency:
  group: forge-kaboom-pr107-source-offline-20261114
  cancel-in-progress: false
env:
  FORGE_BASE: c611c4362e3cc867984448a03ecdf3be923d2ef1
  KABOOM_SOURCE_SHA: cfc2a178dcfc48c456f2f1c51430f9e9388cd435
  KABOOM_SOURCE_TREE: 2d5e1c15a28292372772c35a30d27f1e110f9668
  K_TERMINAL_EXECUTION_MODE: PAPER
  GOTOOLCHAIN: local
  GOTELEMETRY: 'off'
  CGO_ENABLED: '0'
jobs:
  native-windows:
    if: false # qualified already: FORGE #43662371347
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout isolated FORGE qualification ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify runner and single-file FORGE scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/FORGE
          test "$GITHUB_REF" = refs/heads/qualification/kaboom-pr105-source-offline-20261114
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$FORGE_BASE" HEAD
          test "$(git diff --name-only "$FORGE_BASE" HEAD)" = .github/workflows/forge-kaboom-pr105-offline-20261114.yml
          test -z "$(git status --porcelain)"
          echo KABOOM_FORGE_WINDOWS_ISOLATION=PASS
      - name: Checkout private exact-source candidate, no retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Kboomllc/K-Terminal
          ref: cfc2a178dcfc48c456f2f1c51430f9e9388cd435
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Install pinned Windows Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify exact private tree and absent broker authority
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$KABOOM_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$KABOOM_SOURCE_TREE"
          test -z "$(git status --porcelain)"
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          test ! -e .env
          test ! -e config.json
          go version | grep -F 'go1.26.5 windows/amd64' > /dev/null
          for name in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET; do
            if [[ -n "${!name:-}" ]]; then echo KABOOM_BROKER_AUTHORITY_REFUSED; exit 2; fi
          done
          mkdir -p "$RUNNER_TEMP/kaboom-safe"
          echo PASS > "$RUNNER_TEMP/kaboom-safe/source.ok"
          echo KABOOM_WINDOWS_EXACT_SOURCE=PASS
      - name: Complete Windows native Go tests, vet and build without application activation
        shell: bash
        working-directory: kterminal-private/kaboom-core
        run: |
          set -euo pipefail
          go test -p 1 -count=1 -timeout 35m ./... > "$RUNNER_TEMP/kaboom-native-test-private.log" 2>&1
          echo PASS > "$RUNNER_TEMP/kaboom-safe/native-test.ok"
          echo KABOOM_WINDOWS_FULL_NATIVE_TEST=PASS
          go vet ./... > "$RUNNER_TEMP/kaboom-vet-private.log" 2>&1
          echo PASS > "$RUNNER_TEMP/kaboom-safe/vet.ok"
          echo KABOOM_WINDOWS_GO_VET=PASS
          go build ./... > "$RUNNER_TEMP/kaboom-build-private.log" 2>&1
          echo PASS > "$RUNNER_TEMP/kaboom-safe/build.ok"
          echo KABOOM_WINDOWS_GO_BUILD=PASS
      - name: Seal privacy-safe Windows result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kaboom-safe"
          {
            echo schema=forge.kaboom-pr107.windows-offline.v1
            echo kterminal_sha=$KABOOM_SOURCE_SHA
            echo kterminal_tree=$KABOOM_SOURCE_TREE
            echo forge_qualification_sha=$GITHUB_SHA
            echo runner=github-hosted-windows
            for key in source native-test vet build; do
              if test -f "$RUNNER_TEMP/kaboom-safe/$key.ok"; then echo "$key=PASS"; else echo "$key=UNVERIFIED_OR_FAIL"; fi
            done
            echo application_launched=false
            echo deployment_authorized=false
            echo private_logs_exported=false
          } > "$RUNNER_TEMP/kaboom-safe/status.txt"
      - name: Upload sanitized Windows receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaboom-pr107-windows-offline-safe-${{ github.run_id }}
          path: ${{ runner.temp }}/kaboom-safe/status.txt
          if-no-files-found: error
          retention-days: 14
  architecture-linux:
    if: false # qualified already: FORGE #43662371347
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated FORGE qualification ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify runner and single-file FORGE scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/FORGE
          test "$GITHUB_REF" = refs/heads/qualification/kaboom-pr105-source-offline-20261114
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$FORGE_BASE" HEAD
          test "$(git diff --name-only "$FORGE_BASE" HEAD)" = .github/workflows/forge-kaboom-pr105-offline-20261114.yml
          test -z "$(git status --porcelain)"
          echo KABOOM_FORGE_LINUX_ISOLATION=PASS
      - name: Checkout private exact-source candidate, no retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Kboomllc/K-Terminal
          ref: cfc2a178dcfc48c456f2f1c51430f9e9388cd435
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Python and Go toolchains
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Go 1.26.5 toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify source custody, ICE/Obsidian negative controls and Go syntax
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$KABOOM_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$KABOOM_SOURCE_TREE"
          test -z "$(git status --porcelain)"
          test ! -e .env
          test ! -e config.json
          mkdir -p "$RUNNER_TEMP/kaboom-safe"
          echo PASS > "$RUNNER_TEMP/kaboom-safe/source.ok"
          python tools/architecture/verify_source_custody.py > "$RUNNER_TEMP/kaboom-custody-private.log" 2>&1
          echo PASS > "$RUNNER_TEMP/kaboom-safe/custody.ok"
          python tools/architecture/generate.py --check > "$RUNNER_TEMP/kaboom-check-private.log" 2>&1
          python -m unittest discover -s tools/architecture -p 'test_*.py' -v > "$RUNNER_TEMP/kaboom-negative-private.log" 2>&1
          git diff --exit-code > "$RUNNER_TEMP/kaboom-diff-private.log" 2>&1
          python -m unittest discover -s tools/acceptance -p 'test_*.py' -v > "$RUNNER_TEMP/kaboom-shadow-auditor-private.log" 2>&1
          echo PASS > "$RUNNER_TEMP/kaboom-safe/audit-tests.ok"
          echo PASS > "$RUNNER_TEMP/kaboom-safe/architecture.ok"
          GO111MODULE=off go run tools/architecture/verify_go_syntax.go kaboom-core > "$RUNNER_TEMP/kaboom-ast-private.log" 2>&1
          echo PASS > "$RUNNER_TEMP/kaboom-safe/go-syntax.ok"
          echo KABOOM_LINUX_CUSTODY_ARCHITECTURE_AST=PASS
      - name: Install exact Graphify wheel with verified hash
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/graphify-wheel" 'graphifyy==0.9.92' > "$RUNNER_TEMP/kaboom-graphify-install-private.log" 2>&1
          wheel="$RUNNER_TEMP/graphify-wheel/graphifyy-0.9.92-py3-none-any.whl"
          echo '9722846e627a369150107dd792145c3e3a53e3d3da46f7a7bff9f96b75da857c  '"$wheel" | sha256sum -c - > "$RUNNER_TEMP/kaboom-graphify-hash-private.log" 2>&1
          python -m pip install "$wheel" >> "$RUNNER_TEMP/kaboom-graphify-install-private.log" 2>&1
          python -c "from importlib.metadata import version; assert version('graphifyy')=='0.9.92'"
      - name: Diagnose isolated KABOOM code-only Graphify publication, no private maps exported
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          if ! graphify extract . --code-only --max-workers 4 > "$RUNNER_TEMP/kaboom-graphify-private.log" 2>&1; then
            echo KABOOM_GRAPHIFY_EXTRACT=FAIL; exit 1
          fi
          echo KABOOM_GRAPHIFY_EXTRACT=PASS
          if ! graphify cluster-only . --no-label >> "$RUNNER_TEMP/kaboom-graphify-private.log" 2>&1; then
            echo KABOOM_GRAPHIFY_CLUSTER=FAIL; exit 1
          fi
          echo KABOOM_GRAPHIFY_CLUSTER=PASS
          python - <<'GRAPHSHAPE'
          import json, pathlib
          path=pathlib.Path('graphify-out/graph.json')
          data=json.loads(path.read_text())
          print('KABOOM_GRAPHIFY_JSON_BYTES='+str(path.stat().st_size))
          print('KABOOM_GRAPHIFY_JSON_KIND='+type(data).__name__)
          if isinstance(data, dict):
              print('KABOOM_GRAPHIFY_JSON_KEYS='+','.join(sorted(data.keys())))
              for key in ('nodes','edges','links','entities','relations'):
                  x=data.get(key)
                  print('KABOOM_GRAPHIFY_'+key.upper()+'_SHAPE='+type(x).__name__+',count='+str(len(x) if hasattr(x,'__len__') else 'none'))
              print('KABOOM_GRAPHIFY_HAS_KABOOM_CORE='+str('kaboom-core' in path.read_text().lower()))
          GRAPHSHAPE
          if ! python tools/architecture/publish_graphify.py --root . --input graphify-out --output "$RUNNER_TEMP/kaboom-private-verified-graph" --source-sha "$KABOOM_SOURCE_SHA" > "$RUNNER_TEMP/kaboom-graphify-publisher-private.log" 2>&1; then
            grep -E '^KABOOM_GRAPHIFY_PUBLICATION=FAIL:' "$RUNNER_TEMP/kaboom-graphify-publisher-private.log" | head -1 | cut -c 1-160 || true
            echo KABOOM_GRAPHIFY_PUBLISHER=FAIL; exit 1
          fi
          echo KABOOM_GRAPHIFY_PUBLISHER=PASS
          for f in graph.json graph.html GRAPH_REPORT.md source-manifest.json; do
            test -s "$RUNNER_TEMP/kaboom-private-verified-graph/$f"
          done
          echo PASS > "$RUNNER_TEMP/kaboom-safe/graphify.ok"
          echo KABOOM_LINUX_GRAPHIFY_CODE_ONLY=PASS
      - name: Seal privacy-safe architecture result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kaboom-safe"
          {
            echo schema=forge.kaboom-pr107.architecture-offline.v1
            echo kterminal_sha=$KABOOM_SOURCE_SHA
            echo kterminal_tree=$KABOOM_SOURCE_TREE
            echo forge_qualification_sha=$GITHUB_SHA
            echo runner=github-hosted-linux
            for key in source custody architecture audit-tests go-syntax graphify; do
              if test -f "$RUNNER_TEMP/kaboom-safe/$key.ok"; then echo "$key=PASS"; else echo "$key=UNVERIFIED_OR_FAIL"; fi
            done
            echo private_maps_exported=false
            echo deployment_authorized=false
          } > "$RUNNER_TEMP/kaboom-safe/status.txt"
      - name: Upload sanitized architecture receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaboom-pr107-architecture-offline-safe-${{ github.run_id }}
          path: ${{ runner.temp }}/kaboom-safe/status.txt
          if-no-files-found: error
          retention-days: 14


  local-kterm-graphify-publish-once:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Exact source-bound Graphify, ICE, Obsidian check and derived-only main publication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:GITHUB_REF -cne 'refs/heads/qualification/kaboom-pr105-source-offline-20261114' -or
              $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
              $env:RUNNER_OS -cne 'Windows' -or
              $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'KABOOM_LOCAL_WRONG_RUNNER_OR_EVENT' }
          $want='1d5b4fefa9f7573fcdf05a5fc9ceb94f72536269'
          $wantTree='2d5e1c15a28292372772c35a30d27f1e110f9668'
          $wantDigest='202af9fe36e41dc0f7b48347c69c161387aa5019ba7df022061ed6a4892ae666'
          $head=(& gh api repos/Kboomllc/K-Terminal/git/ref/heads/main --jq '.object.sha' 2>$null).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $want) { throw 'KABOOM_LOCAL_SOURCE_MAIN_DRIFT' }
          $writer=(& gh api repos/Kboomllc/K-Terminal --jq '.permissions.push // false' 2>$null).Trim()
          if ($LASTEXITCODE -ne 0 -or $writer -cne 'true') { throw 'KABOOM_LOCAL_WRITER_DENIED' }
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) { throw 'KABOOM_LOCAL_PYTHON_UNAVAILABLE' }
          $temp=Join-Path $env:RUNNER_TEMP ("kaboom-private-graphify-" + $env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $temp) { throw 'KABOOM_LOCAL_TEMP_ALREADY_EXISTS' }
          New-Item -ItemType Directory -Path $temp | Out-Null
          try {
            $source=Join-Path $temp 'source'
            $venv=Join-Path $temp 'venv'
            $wheels=Join-Path $temp 'wheels'
            $published=Join-Path $temp 'published'
            New-Item -ItemType Directory -Path $wheels | Out-Null
            & gh repo clone Kboomllc/K-Terminal $source -- --quiet *> (Join-Path $temp 'clone-private.log')
            if ($LASTEXITCODE -ne 0) { throw 'KABOOM_LOCAL_PRIVATE_CLONE_FAILED' }
            if ((& git -C $source rev-parse HEAD).Trim() -cne $want -or
                (& git -C $source rev-parse 'HEAD^{tree}').Trim() -cne $wantTree) { throw 'KABOOM_LOCAL_TREE_MISMATCH' }
            & python -m venv $venv
            if ($LASTEXITCODE -ne 0) { throw 'KABOOM_LOCAL_VENV_FAILED' }
            $p=Join-Path $venv 'Scripts\python.exe'
            $graph=Join-Path $venv 'Scripts\graphify.exe'
            & $p -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --dest $wheels 'graphifyy==0.9.92' *> (Join-Path $temp 'pip-private.log')
            if ($LASTEXITCODE -ne 0) { throw 'KABOOM_LOCAL_GRAPHIFY_WHEEL_DOWNLOAD_FAILED' }
            $wheel=Join-Path $wheels 'graphifyy-0.9.92-py3-none-any.whl'
            if (-not (Test-Path -LiteralPath $wheel) -or
                (Get-FileHash -LiteralPath $wheel -Algorithm SHA256).Hash.ToLowerInvariant() -cne '9722846e627a369150107dd792145c3e3a53e3d3da46f7a7bff9f96b75da857c') {
                throw 'KABOOM_LOCAL_GRAPHIFY_WHEEL_HASH_REFUSED'
            }
            & $p -m pip install --disable-pip-version-check --no-input --no-cache-dir $wheel *> (Join-Path $temp 'install-private.log')
            if ($LASTEXITCODE -ne 0) { throw 'KABOOM_LOCAL_GRAPHIFY_DEPENDENCIES_FAILED' }
            Push-Location $source
            try {
              & $p tools/architecture/generate.py --check *> (Join-Path $temp 'ice-private.log')
              if ($LASTEXITCODE -ne 0) { throw 'KABOOM_LOCAL_ICE_OBSIDIAN_STALE' }
              & $p tools/architecture/verify_source_custody.py *> (Join-Path $temp 'custody-private.log')
              if ($LASTEXITCODE -ne 0) { throw 'KABOOM_LOCAL_SOURCE_CUSTODY_FAIL' }
              & $p -c "import json; assert json.load(open('.ice/manifest.json'))['source_content_sha256'] == '$wantDigest'"
              if ($LASTEXITCODE -ne 0) { throw 'KABOOM_LOCAL_DIGEST_MISMATCH' }
              & $graph extract . --code-only --max-workers 4 *> (Join-Path $temp 'extract-private.log')
              if ($LASTEXITCODE -ne 0) { throw 'KABOOM_LOCAL_GRAPHIFY_EXTRACT_FAILED' }
              & $graph cluster-only . --no-label *> (Join-Path $temp 'cluster-private.log')
              if ($LASTEXITCODE -ne 0) { throw 'KABOOM_LOCAL_GRAPHIFY_CLUSTER_FAILED' }
              & $p tools/architecture/publish_graphify.py --root . --input graphify-out --output $published --source-sha $want *> (Join-Path $temp 'validate-private.log')
              if ($LASTEXITCODE -ne 0) { throw 'KABOOM_LOCAL_GRAPHIFY_VALIDATION_FAILED' }
              & git diff --quiet --exit-code
              if ($LASTEXITCODE -ne 0) { throw 'KABOOM_LOCAL_SOURCE_CHANGED' }
              Write-Output 'KABOOM_LOCAL_NATIVE_GRAPHIFY=PASS'
              $env:KABOOM_RUN_PRIVATE_REPORT_DIR=$published
              $env:KABOOM_RUN_PRIVATE_EXPECTED_SHA=$want
              $env:KABOOM_RUN_PRIVATE_EXPECTED_TREE=$wantTree
              $env:KABOOM_RUN_PRIVATE_EXPECTED_DIGEST=$wantDigest
              $py=@'
          import hashlib, json, os, pathlib, subprocess, sys, tempfile
          root=pathlib.Path(os.environ['KABOOM_RUN_PRIVATE_REPORT_DIR'])
          old=os.environ['KABOOM_RUN_PRIVATE_EXPECTED_SHA']
          tree=os.environ['KABOOM_RUN_PRIVATE_EXPECTED_TREE']
          digest=os.environ['KABOOM_RUN_PRIVATE_EXPECTED_DIGEST']
          repo='repos/Kboomllc/K-Terminal/'
          names=('graph.json','graph.html','GRAPH_REPORT.md','source-manifest.json')
          m=json.loads((root/'source-manifest.json').read_text(encoding='utf8'))
          assert m['source_commit']==old and m['source_content_sha256']==digest,'SOURCE_RECEIPT_MISMATCH'
          assert m['graphify_version']=='0.9.92' and m['extraction'].startswith('code-only'),'TOOLCHAIN_RECEIPT_MISMATCH'
          assert set(m['files_sha256'])==set(names)-{'source-manifest.json'},'OUTPUT_COVERAGE_MISMATCH'
          for name, digest_expected in m['files_sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest_expected,'OUTPUT_HASH_MISMATCH'
          def gh(method,route,payload=None):
              cmd=['gh','api','--method',method,repo+route,'--header','Accept: application/vnd.github+json']
              if payload is None:
                  p=subprocess.run(cmd,capture_output=True,text=True,encoding='utf-8')
              else:
                  with tempfile.NamedTemporaryFile(mode='w',encoding='utf-8',suffix='.json',dir=os.environ['RUNNER_TEMP'],delete=False) as f:
                      json.dump(payload,f,ensure_ascii=False); path=f.name
                  try:
                      p=subprocess.run(cmd+['--input',path],capture_output=True,text=True,encoding='utf-8')
                  finally: pathlib.Path(path).unlink(missing_ok=True)
              if p.returncode:raise RuntimeError('PRIVATE_GITHUB_'+method+'_'+route.split('/')[0]+'_FAILED')
              return json.loads(p.stdout)
          def mainhead():return gh('GET','git/ref/heads/main')['object']['sha']
          assert mainhead()==old,'MAIN_ADVANCED_BEFORE_PUBLISH'
          blobs=[]
          for name in names:
              data=(root/name).read_text(encoding='utf-8')
              assert data and len(data.encode('utf-8'))<=32*1024*1024,'OUTPUT_EMPTY_OR_OVERSIZE'
              b=gh('POST','git/blobs',{'content':data,'encoding':'utf-8'})
              blobs.append({'path':'docs/graphify/'+name,'mode':'100644','type':'blob','sha':b['sha']})
          newtree=gh('POST','git/trees',{'base_tree':tree,'tree':blobs})['sha']
          assert newtree!=tree,'NO_DERIVED_CHANGE'
          newcommit=gh('POST','git/commits',{'message':'docs(kaboom): publish verified code-only Graphify reports [skip ci]','tree':newtree,'parents':[old]})['sha']
          assert mainhead()==old,'MAIN_ADVANCED_DURING_PUBLISH'
          gh('PATCH','git/refs/heads/main',{'sha':newcommit,'force':False})
          assert mainhead()==newcommit,'MAIN_READBACK_MISMATCH'
          print('KABOOM_LOCAL_GRAPHIFY_MAIN_PUBLICATION=PASS')
          print('KABOOM_LOCAL_GRAPHIFY_NEW_MAIN='+newcommit)
          print('KABOOM_LOCAL_GRAPHIFY_NEW_TREE='+newtree)
          print('KABOOM_LOCAL_GRAPHIFY_FILES=4')
          '@
              $py | & $p -
              if ($LASTEXITCODE -ne 0) { throw 'KABOOM_LOCAL_PUBLICATION_FAILED' }
            } finally {
              Pop-Location
            }
          } finally {
            Remove-Item -LiteralPath $temp -Recurse -Force -ErrorAction SilentlyContinue
          }
