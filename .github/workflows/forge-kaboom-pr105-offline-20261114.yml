name: FORGE KABOOM ZIP Graphify and ICE source sync once
on:
  push:
    branches: [qualification/kaboom-pr105-source-offline-20261114]
    paths: [.github/workflows/forge-kaboom-pr105-offline-20261114.yml]
permissions:
  contents: read
jobs:
  publish-kaboom-derived:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 55
    steps:
      - name: Generate and hash-verify native architecture and publish derived-only branch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kaboom-pr105-source-offline-20261114' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'KABOOM_DERIVED_UNAUTHORIZED_RUNNER'}
          $want='e0e3b82df828cccba3be4067301a7c839d8fb8b3'
          $branch='engineering/kaboom-20261114-3-intake-claude-20261115'
          $head=(& gh api ('repos/Kboomllc/K-Terminal/git/ref/heads/'+$branch) --jq '.object.sha' 2>$null)
          if($LASTEXITCODE -ne 0 -or $head.Trim() -cne $want){throw 'KABOOM_SOURCE_DRIFT'}
          $writer=(& gh api repos/Kboomllc/K-Terminal --jq '.permissions.push // false' 2>$null)
          if($LASTEXITCODE -ne 0 -or $writer.Trim() -cne 'true'){throw 'KABOOM_WRITER_DENIED'}
          $tmp=Join-Path $env:RUNNER_TEMP ('kaboom-new-maps-'+$env:GITHUB_RUN_ID)
          if(Test-Path $tmp){throw 'KABOOM_TEMP_COLLISION'}
          New-Item -ItemType Directory -Path $tmp | Out-Null
          try {
            $repo=Join-Path $tmp 'source'
            $venv=Join-Path $tmp 'venv'
            $wheels=Join-Path $tmp 'wheels'
            New-Item -ItemType Directory -Path $wheels | Out-Null
            & gh repo clone Kboomllc/K-Terminal $repo -- -c core.autocrlf=false --quiet *> (Join-Path $tmp 'private-clone.log')
            if($LASTEXITCODE -ne 0){throw 'KABOOM_PRIVATE_CLONE_FAILED'}
            & git -C $repo -c core.autocrlf=false checkout --detach $want *> (Join-Path $tmp 'private-checkout.log')
            if($LASTEXITCODE -ne 0 -or (& git -C $repo rev-parse HEAD).Trim() -cne $want){throw 'KABOOM_EXACT_CHECKOUT_FAILED'}
            Push-Location $repo
            try {
              & python -B tools/architecture/verify_source_custody.py
              if($LASTEXITCODE -ne 0){throw 'KABOOM_SOURCE_CUSTODY_FAILED'}
              & python -B tools/architecture/generate.py
              if($LASTEXITCODE -ne 0){throw 'KABOOM_GENERATE_FAILED'}
              & python -B tools/architecture/generate.py --check
              if($LASTEXITCODE -ne 0){throw 'KABOOM_GENERATE_CHECK_FAILED'}
              & python -B -m venv $venv
              if($LASTEXITCODE -ne 0){throw 'KABOOM_GRAPHIFY_VENV_FAILED'}
              $py=Join-Path $venv 'Scripts/python.exe'
              $graph=Join-Path $venv 'Scripts/graphify.exe'
              & $py -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --dest $wheels 'graphifyy==0.9.92' *> (Join-Path $tmp 'private-pip-download.log')
              if($LASTEXITCODE -ne 0){throw 'KABOOM_GRAPHIFY_WHEEL_DOWNLOAD_FAILED'}
              $wheel=Join-Path $wheels 'graphifyy-0.9.92-py3-none-any.whl'
              if(-not(Test-Path -LiteralPath $wheel -PathType Leaf) -or
                 (Get-FileHash -LiteralPath $wheel -Algorithm SHA256).Hash.ToLowerInvariant() -cne '9722846e627a369150107dd792145c3e3a53e3d3da46f7a7bff9f96b75da857c'){throw 'KABOOM_GRAPHIFY_WHEEL_HASH_FAIL'}
              & $py -m pip install --disable-pip-version-check --no-input --no-cache-dir $wheel *> (Join-Path $tmp 'private-pip-install.log')
              if($LASTEXITCODE -ne 0){throw 'KABOOM_GRAPHIFY_INSTALL_FAILED'}
              & $graph extract . --code-only --max-workers 4 *> (Join-Path $tmp 'private-graphify-extract.log')
              if($LASTEXITCODE -ne 0){throw 'KABOOM_GRAPHIFY_EXTRACT_FAILED'}
              & $graph cluster-only . --no-label *> (Join-Path $tmp 'private-graphify-cluster.log')
              if($LASTEXITCODE -ne 0){throw 'KABOOM_GRAPHIFY_CLUSTER_FAILED'}
              & $py tools/architecture/publish_graphify.py --root . --input graphify-out --output docs/graphify --source-sha $want *> (Join-Path $tmp 'private-graphify-validate.log')
              if($LASTEXITCODE -ne 0){throw 'KABOOM_GRAPHIFY_PUBLISH_FAILED'}
              $ice=Get-Content '.ice/manifest.json' -Raw | ConvertFrom-Json
              $g=Get-Content 'docs/graphify/source-manifest.json' -Raw | ConvertFrom-Json
              if($ice.source_content_sha256 -cne $g.source_content_sha256 -or
                 $g.source_commit -cne $want -or
                 $g.graphify_version -cne '0.9.92'){throw 'KABOOM_ARCHITECTURE_CROSS_DIGEST_MISMATCH'}
              & git -C $repo diff --exit-code -- kaboom-core tools/architecture CLAUDE.md
              if($LASTEXITCODE -ne 0){throw 'KABOOM_APP_SOURCE_CHANGED'}
              & git -C $repo -c core.autocrlf=false add -- .ice docs/obsidian docs/graphify
              if($LASTEXITCODE -ne 0){throw 'KABOOM_DERIVED_STAGE_FAILED'}
              $diff=@(& git -C $repo diff --cached --name-only)
              if($diff.Count -lt 3){throw 'KABOOM_DERIVED_NO_SYNC_PAYLOAD'}
              foreach($name in $diff){
                if($name -cnotmatch '^(?:\.ice/(?:manifest\.json|file-descriptions\.json|source-file-descriptions\.ice|symbol-dependency-map\.ice|code-graph\.json)|docs/obsidian/(?:KABOOM\.md|Modules/[a-z]+\.md)|docs/graphify/(?:graph\.json|graph\.html|GRAPH_REPORT\.md|source-manifest\.json))$'){
                  throw 'KABOOM_UNEXPECTED_STAGED_PATH'
                }
              }
              $check='import hashlib,json,pathlib,subprocess,sys; r=pathlib.Path(sys.argv[1]); m=json.loads((r/"docs/graphify/source-manifest.json").read_text(encoding="utf-8")); files=("graph.json","graph.html","GRAPH_REPORT.md"); digests={n:hashlib.sha256(subprocess.check_output(["git","-C",str(r),"show",":docs/graphify/"+n])).hexdigest() for n in files}; assert all(digests[n]==m["files_sha256"][n] for n in files), "GIT_STAGED_GRAPHIFY_HASH_MISMATCH"; print("KABOOM_STAGED_GRAPHIFY_GIT_BLOB_HASHES=PASS")'
              & python -B -c $check $repo
              if($LASTEXITCODE -ne 0){throw 'KABOOM_STAGED_GIT_HASH_CHECK_FAILED'}
              $readback=(& gh api ('repos/Kboomllc/K-Terminal/git/ref/heads/'+$branch) --jq '.object.sha' 2>$null)
              if($LASTEXITCODE -ne 0 -or $readback.Trim() -cne $want){throw 'KABOOM_REF_DRIFT_BEFORE_PUSH'}
              & git -C $repo -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(kaboom): sync ICE Obsidian Graphify for reviewed ZIP [skip ci]' *> (Join-Path $tmp 'private-commit.log')
              if($LASTEXITCODE -ne 0){throw 'KABOOM_DERIVED_COMMIT_FAILED'}
              $candidate=(& git -C $repo rev-parse HEAD).Trim()
              & git -C $repo -c credential.helper='!gh auth git-credential' push origin ('HEAD:refs/heads/'+$branch) *> (Join-Path $tmp 'private-push.log')
              if($LASTEXITCODE -ne 0){throw 'KABOOM_DERIVED_PUSH_FAILED'}
              $new=(& gh api ('repos/Kboomllc/K-Terminal/git/ref/heads/'+$branch) --jq '.object.sha' 2>$null)
              if($LASTEXITCODE -ne 0 -or $new.Trim() -cne $candidate){throw 'KABOOM_DERIVED_PUSH_READBACK_FAILED'}
              Write-Output ('KABOOM_EXACT_SOURCE_DERIVED_PUBLICATION=PASS;sha='+$new+';changed_files='+$diff.Count)
              Write-Output ('KABOOM_SOURCE_DIGEST='+$ice.source_content_sha256)
              Write-Output ('KABOOM_GRAPHIFY_NODES='+$g.graph_nodes+';EDGES='+$g.graph_edges)
              Write-Output 'KABOOM_SOURCE_MODIFICATION=NONE;LIVE_ACTION=NONE'
            } finally {Pop-Location}
          } finally {Remove-Item -LiteralPath $tmp -Force -Recurse -ErrorAction SilentlyContinue}
