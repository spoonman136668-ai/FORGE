name: FORGE KABOOM ZIP source qualification once
on:
  push:
    branches: [qualification/kaboom-pr105-source-offline-20261114]
    paths: [.github/workflows/forge-kaboom-pr105-offline-20261114.yml]
permissions:
  contents: read
jobs:
  zip-source-regression:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 65
    steps:
      - name: Install exact Windows Go 1.26.5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: Qualify pinned private source, architecture and Go regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kaboom-pr105-source-offline-20261114' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'KABOOM_WRONG_RUNNER'}
          $want='1c14ec1691a9c27bc59e7f68b900d3d1e4704b98'
          $branch='engineering/kaboom-20261114-3-intake-claude-20261115'
          $current=(& gh api ('repos/Kboomllc/K-Terminal/git/ref/heads/'+$branch) --jq '.object.sha' 2>$null)
          if($LASTEXITCODE -ne 0 -or $current.Trim() -cne $want){throw 'KABOOM_CANDIDATE_SHA_DRIFT'}
          $tool=(& go env GOVERSION).Trim()
          if($LASTEXITCODE -ne 0 -or $tool -cne 'go1.26.5'){throw ('KABOOM_GO126_REQUIRED;observed='+$tool)}
          Write-Output 'KABOOM_EXACT_WINDOWS_GO126=PASS'
          $tmp=Join-Path $env:RUNNER_TEMP ('kaboom-qualified-'+$env:GITHUB_RUN_ID)
          if(Test-Path $tmp){throw 'KABOOM_TEMP_COLLISION'}
          New-Item -ItemType Directory -Path $tmp | Out-Null
          try {
            $root=Join-Path $tmp 'source'
            & gh repo clone Kboomllc/K-Terminal $root -- -c core.autocrlf=false --quiet *> (Join-Path $tmp 'private-clone.log')
            if($LASTEXITCODE -ne 0){throw 'KABOOM_PRIVATE_CLONE_FAILED'}
            & git -C $root -c core.autocrlf=false checkout --detach $want *> (Join-Path $tmp 'private-checkout.log')
            if($LASTEXITCODE -ne 0 -or (& git -C $root rev-parse HEAD).Trim() -cne $want){throw 'KABOOM_EXACT_CHECKOUT_FAILED'}
            $env:GOTOOLCHAIN='local'
            $env:GOTELEMETRY='off'
            $env:CGO_ENABLED='0'
            $env:K_TERMINAL_EXECUTION_MODE='PAPER'
            $env:PYTHONDONTWRITEBYTECODE='1'
            Push-Location $root
            try {
              & python -B tools/architecture/verify_source_custody.py
              if($LASTEXITCODE -ne 0){throw 'KABOOM_UPDATED_SOURCE_CUSTODY_FAILED'}
              & python -B tools/architecture/generate.py
              if($LASTEXITCODE -ne 0){throw 'KABOOM_GENERATION_FAILED'}
              & python -B tools/architecture/generate.py --check
              if($LASTEXITCODE -ne 0){throw 'KABOOM_GENERATION_CHECK_FAILED'}
              & python -B -m unittest discover -s tools/architecture -p 'test_*.py' -v
              if($LASTEXITCODE -ne 0){throw 'KABOOM_ARCHITECTURE_TEST_FAIL'}
              Write-Output 'KABOOM_NEW_SOURCE_ARCHITECTURE=PASS'
              Push-Location (Join-Path $root 'kaboom-core')
              try {
                & go test -p 1 -count=1 -timeout 35m ./...
                if($LASTEXITCODE -ne 0){throw 'KABOOM_WINDOWS_GO_TEST_FAILED'}
                Write-Output 'KABOOM_WINDOWS_GO_TEST=PASS'
                & go vet ./...
                if($LASTEXITCODE -ne 0){throw 'KABOOM_WINDOWS_GO_VET_FAILED'}
                Write-Output 'KABOOM_WINDOWS_GO_VET=PASS'
                & go build ./...
                if($LASTEXITCODE -ne 0){throw 'KABOOM_WINDOWS_GO_BUILD_FAILED'}
                Write-Output 'KABOOM_WINDOWS_GO_BUILD=PASS'
              } finally {Pop-Location}
              & git -C $root diff --exit-code -- kaboom-core tools/architecture
              if($LASTEXITCODE -ne 0){throw 'KABOOM_TEST_MUTATED_SOURCE'}
              $after=(& gh api ('repos/Kboomllc/K-Terminal/git/ref/heads/'+$branch) --jq '.object.sha' 2>$null)
              if($LASTEXITCODE -ne 0 -or $after.Trim() -cne $want){throw 'KABOOM_POSTQUAL_REF_DRIFT'}
              Write-Output 'KABOOM_EXACT_SOURCE_QUALIFIED=PASS;BROKER_ACTIONS=ZERO'
            } finally {Pop-Location}
          } finally {Remove-Item -LiteralPath $tmp -Recurse -Force -ErrorAction SilentlyContinue}
