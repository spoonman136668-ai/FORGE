name: FORGE PR109 exact ICE benchmark Windows validation and record
on:
  push:
    branches: [qualification/kaboom-pr105-source-offline-20261114]
    paths: [.github/workflows/forge-kaboom-pr105-offline-20261114.yml]
permissions:
  contents: read
jobs:
  pr109-finalization:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 35
    steps:
      - name: Pin Go 1.26.5 exact native regression
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: Qualify exact benchmark source and append one fresh result to PR branch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kaboom-pr105-source-offline-20261114' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted'){throw 'PR109_UNQUALIFIED_RUNNER'}
          $want='b8d953f31d34edab0725a52e87f5792231db7455'
          $branch='engineering/retrieval-timing-benchmark-20261115'
          $ref=(& gh api ('repos/Kboomllc/K-Terminal/git/ref/heads/'+$branch) --jq '.object.sha' 2>$null)
          if($LASTEXITCODE -ne 0 -or $ref.Trim() -cne $want){throw 'PR109_BRANCH_DRIFT'}
          $push=(& gh api repos/Kboomllc/K-Terminal --jq '.permissions.push // false' 2>$null)
          if($LASTEXITCODE -ne 0 -or $push.Trim() -cne 'true'){throw 'PR109_WRITER_DENIED'}
          $tool=(& go env GOVERSION).Trim()
          if($LASTEXITCODE -ne 0 -or $tool -cne 'go1.26.5'){throw 'PR109_GO1265_REQUIRED'}
          $tmp=Join-Path $env:RUNNER_TEMP ('pr109-finalize-'+$env:GITHUB_RUN_ID)
          if(Test-Path $tmp){throw 'PR109_TEMP_COLLISION'}
          New-Item -ItemType Directory -Path $tmp | Out-Null
          try {
            $repo=Join-Path $tmp 'source'
            $env:GIT_TERMINAL_PROMPT='0'
            $env:GIT_HTTP_LOW_SPEED_LIMIT='1024'
            $env:GIT_HTTP_LOW_SPEED_TIME='20'
            & gh repo clone Kboomllc/K-Terminal $repo -- -c core.autocrlf=false --quiet --depth 1 --single-branch --branch $branch *> (Join-Path $tmp 'clone.log')
            if($LASTEXITCODE -ne 0){throw 'PR109_PRIVATE_CLONE_FAILED'}
            & git -C $repo -c core.autocrlf=false checkout --detach $want *> (Join-Path $tmp 'checkout.log')
            if($LASTEXITCODE -ne 0 -or (& git -C $repo rev-parse HEAD).Trim() -cne $want){throw 'PR109_CHECKOUT_DRIFT'}
            $env:GOTOOLCHAIN='local'
            $env:GOTELEMETRY='off'
            $env:CGO_ENABLED='0'
            $env:K_TERMINAL_EXECUTION_MODE='PAPER'
            $env:PYTHONDONTWRITEBYTECODE='1'
            Push-Location $repo
            try {
              & python -B tools/architecture/verify_source_custody.py
              if($LASTEXITCODE -ne 0){throw 'PR109_SOURCE_CUSTODY_FAILED'}
              & python -B tools/architecture/generate.py --check
              if($LASTEXITCODE -ne 0){throw 'PR109_ICE_OBSIDIAN_STALE'}
              & python -B -m unittest discover -s tools/architecture -p 'test_*.py' -v
              if($LASTEXITCODE -ne 0){throw 'PR109_ARCHITECTURE_FULL_TESTS_FAILED'}
              Write-Output 'PR109_FULL_ARCHITECTURE_TESTS=PASS'
              $verify='import json,hashlib,pathlib,subprocess,sys; r=pathlib.Path(sys.argv[1]); a=json.loads((r/".ice/manifest.json").read_text()); g=json.loads((r/"docs/graphify/source-manifest.json").read_text()); names=("graph.json","graph.html","GRAPH_REPORT.md"); actual={x:hashlib.sha256(subprocess.check_output(["git","-C",str(r),"show","HEAD:docs/graphify/"+x])).hexdigest() for x in names}; assert a["source_content_sha256"]==g["source_content_sha256"]=="0de9aad699e703a3c2d5ec2656c94f18d89f432834c1d3d7b68357489a76673f"; assert g["source_commit"]=="77c1d2a5efd8eeca1502acae4e337c905e46d297"; assert all(actual[x]==g["files_sha256"][x] for x in names); print("PR109_GRAPHIFY_GIT_BLOBS=PASS")'
              & python -B -c $verify $repo
              if($LASTEXITCODE -ne 0){throw 'PR109_GRAPHIFY_INTEGRITY_FAILED'}
              Push-Location (Join-Path $repo 'kaboom-core')
              try {
                & go test -p 1 -count=1 -timeout 35m ./...
                if($LASTEXITCODE -ne 0){throw 'PR109_GO_TEST_FAILED'}
                Write-Output 'PR109_GO_FULL=PASS'
                & go vet ./...
                if($LASTEXITCODE -ne 0){throw 'PR109_GO_VET_FAILED'}
                Write-Output 'PR109_GO_VET=PASS'
                & go build ./...
                if($LASTEXITCODE -ne 0){throw 'PR109_GO_BUILD_FAILED'}
                Write-Output 'PR109_GO_BUILD=PASS'
              } finally {Pop-Location}
              $series=Join-Path $repo 'docs/graphify/retrieval-benchmark.jsonl'
              $before=[IO.File]::ReadAllBytes($series)
              & python -B tools/architecture/retrieval_benchmark.py --repeat 7 --record
              if($LASTEXITCODE -ne 0){throw 'PR109_BENCHMARK_RECORD_FAILED'}
              $check='import json,pathlib,subprocess,sys; r=pathlib.Path(sys.argv[1]); old=subprocess.check_output(["git","-C",str(r),"show","HEAD:docs/graphify/retrieval-benchmark.jsonl"]); new=(r/"docs/graphify/retrieval-benchmark.jsonl").read_bytes(); assert new.startswith(old) and len(new.splitlines())==len(old.splitlines())+1,"PR109_HISTORY_NOT_APPEND_ONLY"; last=json.loads(new.splitlines()[-1]); ref=json.loads((r/"docs/graphify/retrieval-benchmark-latest.json").read_text()); ice=json.loads((r/".ice/manifest.json").read_text()); assert last["source_content_sha256"]==ref["source_content_sha256"]==ice["source_content_sha256"]; assert last["freshness"]=="FRESH" and ref["freshness"]=="FRESH"; assert last["aggregate"]["queries_total"]==last["aggregate"]["queries_valid"]==127; assert ref["headline_speedup"]==last["aggregate"]["speedup"]; print("PR109_BENCHMARK_RECORD=PASS;queries=127;digest="+ice["source_content_sha256"]); print("PR109_SPEEDUP="+json.dumps(last["aggregate"]["speedup"],sort_keys=True))'
              & python -B -c $check $repo
              if($LASTEXITCODE -ne 0){throw 'PR109_BENCHMARK_FRESHNESS_FAILED'}
              & git -C $repo diff --exit-code -- kaboom-core tools/architecture CLAUDE.md .ice docs/obsidian
              if($LASTEXITCODE -ne 0){throw 'PR109_UNAUTHORIZED_SOURCE_MUTATION'}
              & git -C $repo -c core.autocrlf=false add -- docs/graphify/retrieval-benchmark.jsonl docs/graphify/retrieval-benchmark-latest.json
              if($LASTEXITCODE -ne 0){throw 'PR109_STAGE_FAILED'}
              $staged=@(& git -C $repo diff --cached --name-only)
              if($staged.Count -ne 2 -or $staged -notcontains 'docs/graphify/retrieval-benchmark.jsonl' -or $staged -notcontains 'docs/graphify/retrieval-benchmark-latest.json'){throw 'PR109_UNEXPECTED_STAGED_FILES'}
              $ref2=(& gh api ('repos/Kboomllc/K-Terminal/git/ref/heads/'+$branch) --jq '.object.sha' 2>$null)
              if($LASTEXITCODE -ne 0 -or $ref2.Trim() -cne $want){throw 'PR109_DRIFT_PRE_PUBLISH'}
              & git -C $repo -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(kaboom): append qualified exact-source ICE benchmark result [skip ci]' *> (Join-Path $tmp 'commit.log')
              if($LASTEXITCODE -ne 0){throw 'PR109_DERIVED_COMMIT_FAILED'}
              $published=(& git -C $repo rev-parse HEAD).Trim()
              & git -C $repo -c credential.helper='!gh auth git-credential' push origin ('HEAD:refs/heads/'+$branch) *> (Join-Path $tmp 'push.log')
              if($LASTEXITCODE -ne 0){throw 'PR109_DERIVED_PUSH_FAILED'}
              $ref3=(& gh api ('repos/Kboomllc/K-Terminal/git/ref/heads/'+$branch) --jq '.object.sha' 2>$null)
              if($LASTEXITCODE -ne 0 -or $ref3.Trim() -cne $published){throw 'PR109_PUBLISHED_READBACK_FAILED'}
              Write-Output ('PR109_ENGINEERING_AND_BENCHMARK=PASS;head='+$published)
              Write-Output 'PR109_LIVE_ACTION=NONE;APP_SOURCE_MUTATION=ZERO'
            } finally {Pop-Location}
          } finally {Remove-Item -LiteralPath $tmp -Recurse -Force -ErrorAction SilentlyContinue}
