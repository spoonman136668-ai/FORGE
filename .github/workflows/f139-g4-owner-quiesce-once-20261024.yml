name: F139 G4 one-shot original-owner quiesce
on:
  push:
    branches: [cutover/f139-g4-single-owner-20261024]
    paths: [.github/workflows/f139-g4-owner-quiesce-once-20261024.yml]
permissions:
  contents: read
concurrency:
  group: f139-g4-original-owner-one-shot-cutover
  cancel-in-progress: false
jobs:
  original-owner-quiesce:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate and quiesce only the original owner, without database writes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $repo='spoonman136668-ai/FORGE'
          $main='52e007e83be08b851283fc4a6e213ea506469f43'
          $expectedPR='e343974a863fbb51e7bc11d67233718e7cf1ae65'
          $taskName='FORGE-F139-UnifiedController'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_REPOSITORY -cne $repo -or
             $env:GITHUB_REF -cne 'refs/heads/cutover/f139-g4-single-owner-20261024' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:OPENAI_API_KEY){
            throw 'F139_G4_QUIESCE_RUNNER_OR_AUTHORITY_INVALID'
          }
          $protected=(& gh api "repos/$repo/branches/main" --jq '.commit.sha'|Out-String).Trim()
          $policy=((& gh api "repos/$repo/issues/807" --jq '.body'|Out-String).Trim()|ConvertFrom-Json)
          $pr=(& gh api "repos/$repo/pulls/863"|ConvertFrom-Json)
          if($LASTEXITCODE -ne 0 -or $protected -cne $main -or
             $policy.source_sha -cne $main -or
             $policy.enabled -ne $true -or
             $policy.scientific_first_use -ne $false -or
             $policy.new_controller -ne $false -or
             $policy.new_scheduler -ne $false -or
             $policy.new_queue -ne $false -or
             $pr.state -cne 'open' -or $pr.draft -ne $false -or
             $pr.head.sha -cne $expectedPR -or
             $pr.base.sha -cne $main -or $pr.merged -eq $true){
            throw 'F139_G4_QUIESCE_PROTECTED_PR_OR_POLICY_DRIFT'
          }
          $task=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          Write-Output ('F139_G4_QUIESCE_OBSERVED_TASK_STATE=' + [string]$task.State)
          Write-Output ('F139_G4_QUIESCE_OBSERVED_ACTION_COUNT=' + @($task.Actions).Count)
          Write-Output ('F139_G4_QUIESCE_OBSERVED_TRIGGER_COUNT=' + @($task.Triggers).Count)
          if([string]$task.State -cnotin @('Ready','Running') -or
             @($task.Actions).Count -ne 1 -or
             @($task.Triggers).Count -ne 3){
            throw 'F139_G4_QUIESCE_OWNER_NOT_IDLE'
          }
          $taskID=[string]$task.Principal.UserId
          $sid=if($taskID -match '^S-1-'){$taskID}else{
            (New-Object Security.Principal.NTAccount($taskID)).Translate(
               [Security.Principal.SecurityIdentifier]).Value
          }
          if($sid -cne [Security.Principal.WindowsIdentity]::GetCurrent().User.Value){
            throw 'F139_G4_QUIESCE_OWNER_SID_DRIFT'
          }
          $arg=[string]$task.Actions[0].Arguments
          function Extract([string]$key){
            $m=[regex]::Match($arg,'(?i)(?:^|\s)-'+$key+'\s+"([^"]+)"')
            if(-not $m.Success){throw 'F139_G4_QUIESCE_OWNER_ARGUMENTS'}
            return $m.Groups[1].Value
          }
          $db=Extract 'Database'
          $root=Extract 'RepositoryRoot'
          $python=Extract 'PythonExe'
          $expectedDB=Join-Path $env:LOCALAPPDATA 'FORGE-F139\state.sqlite'
          if([IO.Path]::GetFullPath($db) -ine [IO.Path]::GetFullPath($expectedDB) -or
             [IO.Path]::GetFullPath($root) -ieq [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)){
             throw 'F139_G4_QUIESCE_WRONG_DB_OR_WORKSPACE'
          }
          $checkout=(& git.exe -C $root rev-parse HEAD|Out-String).Trim()
          $dirty=(& git.exe -C $root status --porcelain --untracked-files=all|Out-String).Trim()
          if($checkout -cne $main -or $dirty.Length -gt 0){
             throw 'F139_G4_QUIESCE_ORIGINAL_CHECKOUT_DRIFT'
          }
          $script=@'
          import json, pathlib, sqlite3, sys
          path=pathlib.Path(sys.argv[1]).resolve(strict=True)
          source=sys.argv[2]
          con=sqlite3.connect(path.as_uri()+"?mode=ro",uri=True,timeout=30)
          try:
              con.row_factory=sqlite3.Row
              con.execute("PRAGMA query_only=ON")
              meta=dict(con.execute("SELECT * FROM meta WHERE id=1").fetchone())
              tasks=[dict(r) for r in con.execute("SELECT ticket,stage FROM tasks ORDER BY ticket")]
              assert meta["source_sha"]==source and meta["enabled"]==1 and meta["legacy_suspended"]==1
              assert meta["head_seq"]>=193
              assert len(tasks)>=29
              assert all(x["stage"] in ("VERIFIED","QUARANTINED") for x in tasks)
              assert sum(x["stage"]=="VERIFIED" for x in tasks)>=18
              assert sum(x["stage"]=="QUARANTINED" for x in tasks)>=11
              assert con.execute("SELECT COUNT(*) FROM events").fetchone()[0]==meta["head_seq"]
              print("F139_G4_OWNER_QUIESCE_NO_ACTIVE_OR_PENDING=PASS")
              print("F139_G4_QUIESCE_HEAD_SEQ="+str(meta["head_seq"]))
              print("F139_G4_QUIESCE_HEAD_SHA256="+meta["head_hash"])
          finally:con.close()
          '@
          & $python -B -c $script $db $main
          if($LASTEXITCODE -ne 0){throw 'F139_G4_QUIESCE_ORIGINAL_SQLITE_NOT_TERMINAL'}
          $again=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          $mainAgain=(& gh api "repos/$repo/branches/main" --jq '.commit.sha'|Out-String).Trim()
          if([string]$again.State -cnotin @('Ready','Running') -or $mainAgain -cne $main){
             throw 'F139_G4_QUIESCE_WINDOW_MOVED'
          }
          # The original controller runs a long-lived Python loop. Its
          # kernel lock is held only for a reconciliation tick, so acquire it
          # before disabling/stopping that same original task. No replay.
          $quiesce=@'
          import pathlib,sqlite3,subprocess,sys
          root=pathlib.Path(sys.argv[1]).resolve(strict=True)
          path=pathlib.Path(sys.argv[2]).resolve(strict=True)
          source=sys.argv[3]
          sys.path.insert(0,str(root))
          from f139.local_controller import SingleOwner
          def state():
              con=sqlite3.connect(path.as_uri()+"?mode=ro",uri=True,timeout=20)
              try:
                  con.row_factory=sqlite3.Row
                  con.execute("PRAGMA query_only=ON")
                  meta=dict(con.execute("SELECT * FROM meta WHERE id=1").fetchone())
                  tasks=[r["stage"] for r in con.execute("SELECT stage FROM tasks")]
                  assert meta["source_sha"]==source and meta["enabled"]==1
                  assert meta["legacy_suspended"]==1 and meta["head_seq"]>=193
                  assert len(tasks)>=29 and all(t in ("VERIFIED","QUARANTINED") for t in tasks)
                  assert con.execute("SELECT COUNT(*) FROM events").fetchone()[0]==meta["head_seq"]
                  return (meta["head_seq"],meta["head_hash"],tuple(tasks))
              finally:con.close()
          with SingleOwner(path.with_suffix(".lock")):
              before=state()
              ps=r"""
          $ErrorActionPreference='Stop'
          $name='FORGE-F139-UnifiedController'
          $t=Get-ScheduledTask -TaskName $name -ErrorAction Stop
          if([string]$t.State -cnotin @('Ready','Running')){throw 'OWNER_STATE_CHANGED_UNDER_LOCK'}
          Disable-ScheduledTask -TaskName $name -ErrorAction Stop|Out-Null
          try{Stop-ScheduledTask -TaskName $name -ErrorAction Stop}catch{
              # A disabled task that has already exited need not be stopped.
              $active=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction Stop|
                  Where-Object{$_.CommandLine -and $_.CommandLine.Contains('f139.local_controller') -and
                    $_.CommandLine.Contains($env:F139_EXPECTED_TASK_DATABASE)})
              if($active.Count -gt 0){throw 'OWNER_PYTHON_STILL_ACTIVE'}
          }
          for($i=0;$i -lt 20;$i++){
              $state=Get-ScheduledTask -TaskName $name -ErrorAction Stop
              $active=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction Stop|
                  Where-Object{$_.CommandLine -and $_.CommandLine.Contains('f139.local_controller') -and
                    $_.CommandLine.Contains($env:F139_EXPECTED_TASK_DATABASE)})
              if([string]$state.State -ceq 'Disabled' -and $active.Count -eq 0){break}
              Start-Sleep -Milliseconds 350
          }
          if([string]$state.State -cne 'Disabled' -or $active.Count -gt 0){
              throw 'ORIGINAL_OWNER_DID_NOT_STOP'
          }
          Write-Output 'F139_G4_ORIGINAL_TASK_STOPPED_UNDER_LOCK=PASS'
          """
              env=dict(__import__("os").environ)
              env["F139_EXPECTED_TASK_DATABASE"]=str(path)
              result=subprocess.run(["powershell.exe","-NoProfile","-NonInteractive","-Command",ps],
                  env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=50,text=True)
              if result.returncode!=0:
                  print("F139_G4_QUIESCE_STOP_BLOCKED",file=sys.stderr)
                  raise SystemExit(1)
              assert "F139_G4_ORIGINAL_TASK_STOPPED_UNDER_LOCK=PASS" in result.stdout
              assert state()==before,"ORIGINAL_LEDGER_CHANGED_DURING_QUIESCE"
              print("F139_G4_ORIGINAL_TASK_STOPPED_UNDER_LOCK=PASS")
              print("F139_G4_ORIGINAL_EVENT_HEAD_PRESERVED="+before[1])
              print("F139_G4_ORIGINAL_SQLITE_WRITES=ZERO")
          '@
          & $python -B -c $quiesce $root $db $main
          if($LASTEXITCODE -ne 0){throw 'F139_G4_QUIESCE_LOCKED_STOP_FAILED'}
          Write-Output 'F139_G4_NO_NEW_CONTROLLER=TRUE'
          Write-Output 'F139_G4_SCIENTIFIC_FIRST_USE=FALSE'
