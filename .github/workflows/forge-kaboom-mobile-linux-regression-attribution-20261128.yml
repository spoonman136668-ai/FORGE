name: K-Terminal matched Linux regression failure attribution
on:
  push:
    branches: [qualification/kaboom-mobile-linux-regression-attribution-20261128]
    paths: [.github/workflows/forge-kaboom-mobile-linux-regression-attribution-20261128.yml]
permissions:
  contents: read
concurrency:
  group: kaboom-mobile-native-interop-20261128
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      K_TERMINAL_EXECUTION_MODE: PAPER
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Verify existing isolated hosted qualification route
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/FORGE
          test "$GITHUB_REF" = refs/heads/qualification/kaboom-mobile-linux-regression-attribution-20261128
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_ACTOR" = spoonman136668-ai
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ENVIRONMENT" = github-hosted
          for n in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET ALERTS_PUBLISH_TOKEN OPS_WORKER_TOKEN KT_STATE_FILE OPS_TOTP_KEY_FILE OPS_DEVICES_FILE OPS_SWITCH_FILE OPS_JOURNAL_KEY OPS_LOCAL_SWITCH_FILE ALERTS_DATA_DIR; do
            test -z "$(printenv "$n" || true)" || { echo REVIEW_RUNTIME_AUTHORITY_BLOCKED; exit 2; }
          done
          echo REVIEW_LINUX_ISOLATION=PASS
      - name: Checkout exact accepted development baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: 56ac1f8d96f5d999cdf5e1a353c0f278deebee05
          path: baseline
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Checkout detached review source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: fa1790e94231595f98395db9c644f3ef3e19978c
          path: candidate
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Exact source and synthetic Linux regression (sanitized)
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN OPENAI_API_KEY ANTHROPIC_API_KEY OPENROUTER_API_KEY GEMINI_API_KEY AZURE_OPENAI_API_KEY
          umask 077
          logs="$RUNNER_TEMP/kaboom-review-linux-$GITHUB_RUN_ID"
          mkdir "$logs"
          test "$(git -C baseline rev-parse HEAD)" = 56ac1f8d96f5d999cdf5e1a353c0f278deebee05
          test "$(git -C baseline rev-parse HEAD^{tree})" = 8ab25855f542bec394fea4ee8b93ba9430124926
          test "$(git -C baseline rev-parse HEAD:kaboom-core)" = bbd095b3c7e932db16fb22d1390d951fba96ad92
          test "$(git -C candidate rev-parse HEAD)" = fa1790e94231595f98395db9c644f3ef3e19978c
          test "$(git -C candidate rev-parse HEAD^{tree})" = 1148a3994ecf87e77df092d9bb4e887e7d10cb15
          test "$(git -C candidate rev-parse HEAD:kaboom-core)" = 4f67c606140234a0e3a61564b3d46a436e22dea4
          test -z "$(git -C baseline status --porcelain)"
          test -z "$(git -C candidate status --porcelain)"
          diff -qr baseline/.ice candidate/.ice > "$logs/ice.log" 2>&1
          diff -qr baseline/tools/architecture candidate/tools/architecture > "$logs/architecture.log" 2>&1
          python -B baseline/tools/architecture/verify_source_custody.py > "$logs/base.log" 2>&1
          echo REVIEW_BASE_CUSTODY=PASS
          rc=0
          python -B candidate/tools/architecture/verify_source_custody.py > "$logs/candidate.log" 2>&1 || rc=$?
          test "$rc" = 1
          grep -qE 'KABOOM_SOURCE_CUSTODY=FAIL: SOURCE_OVERLAY_CANDIDATE_CHANGED: kaboom-core/internal/engine/(engine|live|loop)\.go' "$logs/candidate.log"
          echo REVIEW_UNAPPROVED_OVERLAY_REJECTED=PASS
          test "$(go env GOVERSION)" = go1.26.5
          # Both arms use the same Go, flags, environment and hosted machine.
          # The earlier focused/interop/JS passes remain valid at this exact SHA.
          export GOPATH="$RUNNER_TEMP/kaboom-review-linux-$GITHUB_RUN_ID/gopath"
          export GOMODCACHE="$GOPATH/pkg/mod"
          export GOCACHE="$RUNNER_TEMP/kaboom-review-linux-$GITHUB_RUN_ID/gocache"
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          for arm in baseline candidate; do
            (cd "$arm/kaboom-core" && go mod download) > "$logs/$arm-deps.log" 2>&1 || { echo REVIEW_DEPENDENCY_PROVISION_FAIL; exit 2; }
          done
          export GOPROXY=off GOSUMDB=off
          for arm in baseline candidate; do
            started=$(date +%s)
            rc=0
            (cd "$arm/kaboom-core" && go test -json -p 1 -count=1 -timeout 35m ./...) > "$logs/$arm-full.jsonl" 2>&1 || rc=$?
            printf '%s\n' "$rc" > "$logs/$arm-exit"
            printf 'REVIEW_ARM=%s EXIT=%s ELAPSED_SECONDS=%s\n' "$arm" "$rc" "$(($(date +%s)-started))"
          done
          python - "$logs" <<'PY'
          import hashlib,json,pathlib,re,sys
          root=pathlib.Path(sys.argv[1])
          def digest(s):
              return hashlib.sha256(s.encode()).hexdigest()[:20]
          def inspect(arm):
              raw=(root/(arm+'-full.jsonl')).read_text(errors='replace')
              rows=[]
              for line in raw.splitlines():
                  try: rows.append(json.loads(line))
                  except ValueError: continue
              failures={(r.get('Package',''),r.get('Test','')) for r in rows if r.get('Action')=='fail'}
              failures={p for p in failures if p[0]}
              status=int((root/(arm+'-exit')).read_text())
              passed=sum(r.get('Action')=='pass' and bool(r.get('Test')) and '/' not in r['Test'] for r in rows)
              skips=sum(r.get('Action')=='skip' and bool(r.get('Test')) and '/' not in r['Test'] for r in rows)
              print(f'REVIEW_ARM_INVENTORY={arm} PASSED_TOPLEVEL={passed} SKIPPED_TOPLEVEL={skips} FAIL_EVENTS={len(failures)}')
              for pkg,test in sorted(failures)[:40]:
                  print(f'REVIEW_FAILURE_ARM={arm} PACKAGE_SHA={digest(pkg)} TEST_SHA={digest(test) if test else "PACKAGE"} SCOPE={"engine" if pkg.endswith("/internal/engine") else "admission" if pkg.endswith("/internal/remoteadmission") else "other"}')
              for category,pattern in [('timeout',r'test timed out|context deadline exceeded'),('panic',r'panic:'),('compile',r'build failed|undefined:|syntax error'),('filesystem',r'permission denied|file exists|no such file|not a directory'),('platform',r'windows|linux|unsupported platform'),('network',r'connection refused|network is unreachable|TLS handshake timeout')]:
                  if re.search(pattern,raw,re.I): print(f'REVIEW_FAILURE_HINT={arm}:{category}')
              if status and not failures: print(f'REVIEW_FAILURE_UNCLASSIFIED={arm}')
              return status,failures
          b,bf=inspect('baseline')
          c,cf=inspect('candidate')
          print(f'REVIEW_MATCHED_FAILURE_EVENTS={len(bf&cf)} CANDIDATE_ONLY={len(cf-bf)} BASELINE_ONLY={len(bf-cf)}')
          if b==0 and c==0: print('REVIEW_ATTRIBUTION=BOTH_PASS_PRIOR_FAILURE_UNRESOLVED')
          elif b!=0 and c!=0 and bf and bf==cf: print('REVIEW_ATTRIBUTION=REPRODUCED_BASELINE_FAILURE')
          elif c!=0 and b==0: print('REVIEW_ATTRIBUTION=CANDIDATE_FAILURE')
          elif c!=0: print('REVIEW_ATTRIBUTION=MIXED_OR_UNCLASSIFIED_FAILURE')
          else: print('REVIEW_ATTRIBUTION=BASELINE_ONLY_FAILURE')
          # This is a diagnostic, not acceptance. Preserve failures as failures.
          sys.exit(1 if b or c else 0)
          PY
          test "$(git -C baseline rev-parse HEAD)" = 56ac1f8d96f5d999cdf5e1a353c0f278deebee05
          test "$(git -C candidate rev-parse HEAD)" = fa1790e94231595f98395db9c644f3ef3e19978c
          test -z "$(git -C baseline status --porcelain)"
          test -z "$(git -C candidate status --porcelain)"
          echo REVIEW_DIAGNOSTIC_COMPLETE_NO_APPROVAL_NO_REF_WRITE
      - name: Remove private scratch logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/kaboom-review-linux-$GITHUB_RUN_ID"
          echo REVIEW_PRIVATE_LOGS_REMOVED=PASS
