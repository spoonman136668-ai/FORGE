name: FORGE CPU LLM Evaluation G87 original GPT2 fullgraph Inductor screen

on:
  push:
    branches: [research/cpu-llm-g87-inductor-gpt2-20261031]
    paths:
      - '.github/workflows/forge-cpu-llm-g87-inductor-original-model.yml'
      - 'research/cpu_g87/**'

permissions:
  contents: read

concurrency:
  group: forge-cpu-llm-g87-inductor-original-model
  cancel-in-progress: false

jobs:
  frozen-source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact G70 baseline, frozen G87 preregistration and source blobs
        shell: bash
        run: |
          set -euo pipefail
          BASE=20a540d0241519e2e9d90ace868ffd6db60bd065
          PREREG=7f2cfff5f2348a28141df4c63792a3bfb659175c
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          git merge-base --is-ancestor "$PREREG" HEAD
          test "$(git rev-parse HEAD:docs/research/CPU-G87-GPT2-INDUCTOR-PREREG-20261031.md)" = "77a95f712d533f10f0165fae86967d4577943945"
          test "$(git rev-parse HEAD:research/cpu_g87/g87_inductor_original.py)" = "bc7f8739d0b75dcd59a4a8c15619aa41e9c2fdaf"
          test "$(git rev-parse HEAD:research/cpu_g87/test_g87_inductor_original.py)" = "5d9139a97ca5fc488b1156979fb2c250a5e83870"
          git diff --exit-code "$BASE" HEAD -- research/llm_g54 research/llm_g55 research/llm_g56 research/llm_g57 research/llm_g58 research/llm_g59 research/llm_g60 research/llm_g61 research/llm_g62 research/llm_g63 research/llm_g64 research/llm_g65 research/llm_g66 research/llm_g67 research/llm_g68 research/llm_g70
          python -B -m py_compile research/cpu_g87/g87_inductor_original.py research/cpu_g87/test_g87_inductor_original.py
          python -B -m unittest discover -s research/cpu_g87 -p 'test_g87_inductor_original.py' -v
          echo CPU_G87_FROZEN_SOURCE_ADMISSION=PASS

  original-model-inductor:
    needs: frozen-source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TORCHINDUCTOR_COMPILE_THREADS: '2'
      MAX_JOBS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      ENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify native CPU host and frozen source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          test "$(git rev-parse HEAD:research/cpu_g87/g87_inductor_original.py)" = "bc7f8739d0b75dcd59a4a8c15619aa41e9c2fdaf"
          python -B -m unittest discover -s research/cpu_g87 -p 'test_g87_inductor_original.py' -v
      - name: Install pinned original CPU model and Inductor runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 huggingface-hub==0.30.2 safetensors==0.5.3 tokenizers==0.21.1 psutil==7.1.3
          python -m pip check
          python - <<'PY'
          import torch, transformers
          assert torch.__version__ == "2.5.1+cpu", torch.__version__
          assert torch.version.cuda is None
          assert transformers.__version__ == "4.48.3"
          assert hasattr(torch, "compile")
          import torch._inductor
          print("G87_PINNED_CPU_INDUCTOR_RUNTIME=PASS")
          PY
          python -m pip freeze > cpu_g87_environment.txt
          uname -a >> cpu_g87_environment.txt
          lscpu >> cpu_g87_environment.txt
      - name: Run original GPT2 eager versus fullgraph Inductor comparison
        shell: bash
        run: |
          set -euo pipefail
          python research/cpu_g87/g87_inductor_original.py
          python - <<'PY'
          import json
          r=json.load(open("cpu_g87_original_result.json",encoding="utf-8"))
          assert r["schema"]=="forge.cpu-llm-g87.authentic-inductor-compilation.v1"
          assert r["gate"]=="CPU_G87"
          assert r["preregistration_commit"]=="7f2cfff5f2348a28141df4c63792a3bfb659175c"
          assert r["engineering"]=="PASS" and r["correctness"]=="PASS"
          assert r["summary"]["timed_authentic_responses"]==96
          assert r["summary"]["timed_authentic_generated_tokens"]==768
          assert len(r["original_paired_trials"])==48
          assert r["decision"] in ("INDUCTOR_PASS","INDUCTOR_NO_GO")
          assert r["scientific_acceptance"]=="NOT_GRANTED" and not r["promotion_allowed"]
          print("CPU_G87_ORIGINAL_INDUCTOR_RESULT="+r["decision"])
          PY
      - name: Upload original measurement and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-g87-original-gpt2-inductor
          retention-days: 30
          if-no-files-found: warn
          path: |
            cpu_g87_original_result.json
            cpu_g87_environment.txt
