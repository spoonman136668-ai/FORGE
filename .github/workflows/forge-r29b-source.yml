name: FORGE R29B source-only scientific qualification
on:
  push:
    branches: [engineering/r29b-wake-recovery-r1]
    paths:
      - 'research/r29b-wingless/**'
      - '.github/workflows/forge-r29b-source.yml'
permissions:
  contents: read
  issues: read
jobs:
  frozen-source-review:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent frozen source and negative controls
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B research/r29b-wingless/source_only_test.py
          python -B -m unittest discover -s research/r29b-wingless -p 'test_*.py' -v
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/6157939822" --jq .user.login | grep -Fx spoonman136668-ai
          echo 'R29B_ISSUE_ACCESS_PREFLIGHT=PASS'
          echo 'R29B_PROSPECTIVE_LAUNCH_AUTHORIZED=FALSE'
          echo 'R29B_ORIGINAL_SCIENCE_EXECUTED=FALSE'
