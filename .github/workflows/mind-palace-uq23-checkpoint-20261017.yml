name: Mind-Palace UQ23 operator-authorized one-record checkpoint
on:
  push:
    branches: [diagnostics/mind-palace-private-bridge-20261013]
    paths:
      - '.github/mind-palace-catchup/UQ23-LIVE-CHECKPOINT-20261017.txt'
permissions:
  contents: read
concurrency:
  group: mind-palace-uq23-source-one-shot
  cancel-in-progress: false
jobs:
  validate:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 30
    steps:
      - name: Verify an authentic bounded browser-chat operator direction on promoted main
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: 'Never'
          GH_PROMPT_DISABLED: '1'
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'UQ23_WRONG_RUNNER_REPOSITORY'}
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){throw 'UQ23_WRONG_RUNNER'}
          Remove-Item Env:GH_TOKEN,Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $remote='https://github.com/spoonman136668-ai/Mind-Palace.git'
          $main='becba8e8d81c4884e9e534c7241cedd67572ff4d'
          $sourceHead='becba8e8d81c4884e9e534c7241cedd67572ff4d'
          $sourceBlob='3bbb92ba9b6a154726ded6710dc9a4f26e785b47'
          $sourceBranch='intake/chat-20261017-pr58-authorization-uq20'
          $sourcePath='pilots/chat-history/2026-10-17-pr58-authorization.extraction.json'
          $sourceRef='chat:2026-10-17-mind-palace-pr58-explicit-merge-authorization'
          $sourceVersion='visible-selected-operator-direction-20261017-r1'
          $candidateId='decision/mind-palace-pr58-explicit-merge-authorization-20261017'
          $root=Join-Path $env:RUNNER_TEMP ('mp-uq23-'+$env:GITHUB_RUN_ID)
          $utf8=New-Object Text.UTF8Encoding($false)
          function CheckRef([string]$name,[string]$sha){
            $r=@(& git.exe ls-remote --exit-code $remote $name)
            if($LASTEXITCODE -ne 0 -or $r.Count -ne 1 -or ([string]$r[0] -split '\s+')[0] -cne $sha){throw ('UQ23_REMOTE_REF_DRIFT_'+$name)}
          }
          function ToJson([string]$path,$obj){
            [IO.File]::WriteAllText($path,((ConvertTo-Json -InputObject $obj -Depth 24)+[Environment]::NewLine),$utf8)
          }
          function RunJson([string]$code,[string]$file,[string[]]$arguments){
            $raw=(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $file @arguments 2>&1|Out-String).Trim()
            if($LASTEXITCODE -ne 0){Write-Host ('UQ23_TOOL_ERROR='+($raw.Substring(0,[Math]::Min(450,$raw.Length))));throw ('UQ23_'+$code+'_FAILED')}
            try{return ($raw | ConvertFrom-Json -ErrorAction Stop)}catch{throw ('UQ23_'+$code+'_NOT_JSON')}
          }
          if(Test-Path $root){throw 'UQ23_SCRATCH_ALREADY_EXISTS'}
          try {
            CheckRef 'refs/heads/main' $main
            CheckRef ('refs/heads/'+$sourceBranch) $sourceHead
            & git.exe clone --quiet --single-branch --branch main $remote $root
            if($LASTEXITCODE -ne 0){throw 'UQ23_PRIVATE_MAIN_CLONE_FAILED'}
            Push-Location $root
            try{
              if((& git.exe rev-parse HEAD|Out-String).Trim() -cne $main){throw 'UQ23_MAIN_SHA_DRIFT'}
              if((& git.exe status --porcelain=v1|Out-String).Trim()){throw 'UQ23_INITIAL_CHECKOUT_DIRTY'}
              $protected=@(
                '.ice/records.json','.ice/source-ledger.json','archive/index.json',
                '.ice/remote-bootstrap.json','.ice/remote-catalog.json',
                '.ice/remote-index.ndjson','.ice/chat-delta-state.json'
              )
              $before=@{}
              foreach($p in $protected){$before[$p]=(Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()}
              & git.exe fetch --quiet --no-tags origin ('refs/heads/'+$sourceBranch)
              if($LASTEXITCODE -ne 0 -or (& git.exe rev-parse FETCH_HEAD|Out-String).Trim() -cne $sourceHead){throw 'UQ23_SOURCE_HEAD_NOT_FROZEN'}
              $spec=$sourceHead+':'+$sourcePath
              if((& git.exe rev-parse $spec|Out-String).Trim() -cne $sourceBlob){throw 'UQ23_SOURCE_BLOB_DRIFT'}
              $runtime=Join-Path $root '.mind-runtime'
              New-Item -ItemType Directory -Path $runtime -Force|Out-Null
              $extract=Join-Path $runtime 'source.json'
              $body=(& git.exe show $spec|Out-String)
              if($LASTEXITCODE -ne 0){throw 'UQ23_SOURCE_READ_FAILED'}
              [IO.File]::WriteAllText($extract,$body,$utf8)
              $d=Get-Content -LiteralPath $extract -Raw|ConvertFrom-Json
              if([string]$d.schema -cne 'mind-palace.chat-extraction.v1' -or
                 [string]$d.conversation.ref -cne $sourceRef -or
                 [string]$d.conversation.version -cne $sourceVersion -or
                 $null -ne $d.conversation.content_sha256 -or
                 @($d.turns).Count -ne 1 -or [string]$d.turns[0].role -cne 'operator' -or
                 @($d.candidates).Count -ne 1 -or
                 [string]$d.candidates[0].claim_class -cne 'operator_decision' -or
                 [bool]$d.candidates[0].details.full_chat_history_coverage -or
                 [bool]$d.candidates[0].details.background_chat_history_collection_proven){
                throw 'UQ23_BOUNDED_SOURCE_MISMATCH'
              }
              if(@($d.corroborating_sources).Count -ne 1 -or
                 [string]$d.corroborating_sources[0].version -cne '10220f4ff28ed49b3f8b6b64029fcb20b3cee4' -or
                 [string]$d.corroborating_sources[0].authority -cne 'authoritative'){
                throw 'UQ23_GITHUB_CORROBORATION_MISMATCH'
              }
              Write-Host 'UQ23_NEW_REAL_OPERATOR_SOURCE_PROVENANCE=PASS'
              $v=RunJson 'CHAT_VALIDATE' '.\tools\chat-collect.ps1' @('validate','-InputPath',$extract)
              if(-not [bool]$v.valid -or [int]$v.candidates -ne 1 -or [int]$v.forced_archive -ne 0){
                throw 'UQ23_NEW_CHAT_SOURCE_VALIDATION_FAILED'
              }
              $batchPath=Join-Path $runtime 'batch.json'
              $batch=RunJson 'CHAT_BUILD' '.\tools\chat-collect.ps1' @('build','-InputPath',$extract,'-OutputPath',$batchPath)
              if([string]$batch.schema -cne 'mind-palace.collector-batch.v1' -or @($batch.candidates).Count -ne 1 -or
                 @($batch.sources|Where-Object{[string]$_.role -ceq 'primary'}).Count -ne 1 -or
                 ([string]$batch.candidates[0].kind+'/'+[string]$batch.candidates[0].key) -cne $candidateId){
                 throw 'UQ23_CANONICAL_BATCH_MISMATCH'
              }
              $inventory=Join-Path $runtime 'inventory.json'
              ToJson $inventory (@{schema='mind-palace.source-inventory.v1';version=1;generated_at='2026-10-17T09:25:45Z';
                 sources=@(@{scope='chat-history';type='chat';ref=$sourceRef;version=$sourceVersion;
                 content_sha256=$null;authority='historical';label='single explicit operator PR58 authorization'})})
              $plan=RunJson 'PLAN' '.\tools\backfill-plan.ps1' @('plan','-InventoryPath',$inventory,'-Scope','chat-history')
              if([string]$plan.status -cne 'ready' -or [int]$plan.unseen -ne 1 -or
                 [int]$plan.process -ne 1 -or [int]$plan.review -ne 0 -or [int]$plan.batch_count -ne 1){
                throw 'UQ23_SOURCE_LEDGER_RECONCILIATION_NOT_ONE_UNSEEN'
              }
              Write-Host 'UQ23_PRODUCTION_LEDGER_ONE_UNSEEN_SOURCE=PASS'
              $map=Join-Path $runtime 'map.json'
              ToJson $map (@{schema='mind-palace.backfill-collector-map.v1';version=1;batches=@(@{
                 batch_id=[string]$plan.batches[0].batch_id;collector_batch_path=$batchPath})})
              $dry=RunJson 'DRY_RUN' '.\tools\backfill-cycle.ps1' @('dry-run','-InventoryPath',$inventory,'-CollectorMapPath',$map,'-Scope','chat-history')
              if(-not [bool]$dry.durable_state_unchanged){throw 'UQ23_DRY_RUN_CHANGED_DURABLE_STATE'}
              Write-Host ('UQ23_CLASSIFY_STATUS='+[string]$dry.status)
              Write-Host ('UQ23_NEW_COUNT='+[int]$dry.counts.new)
              Write-Host ('UQ23_MERGE_COUNT='+[int]$dry.counts.merge)
              Write-Host ('UQ23_REVIEW_COUNT='+[int]$dry.counts.review)
              Write-Host ('UQ23_SUPERSEDE_COUNT='+[int]$dry.counts.supersede)
              if([int]$dry.candidate_count -ne 1 -or [int]$dry.counts.review -ne 0 -or
                 [int]$dry.counts.supersede -ne 0 -or [int]$dry.counts.new -ne 1 -or
                 [int]$dry.counts.merge -ne 0 -or -not [bool]$dry.ready_for_apply){
                throw 'UQ23_NEW_SOURCE_NOT_UNAMBIGUOUS_ONE_NEW'
              }
              Write-Host 'UQ23_EXACT_ONE_NEW_SOURCE_AND_RECORD_DRYRUN=PASS'
              $originalRecords=@(Get-Content '.ice/records.json' -Raw|ConvertFrom-Json)
              $originalLedger=Get-Content '.ice/source-ledger.json' -Raw|ConvertFrom-Json
              $originalIds=@($originalRecords|ForEach-Object{[string]$_.id})
              $apply=RunJson 'SHADOW_APPLY' '.\tools\backfill-apply.ps1' @('-InventoryPath',$inventory,'-CollectorMapPath',$map,'-Scope','chat-history','-ConfirmApply')
              if([string]$apply.schema -cne 'mind-palace.backfill-apply-result.v1' -or
                 [string]$apply.status -cne 'applied' -or -not [bool]$apply.applied -or
                 [int]$apply.counts.new -ne 1 -or [int]$apply.counts.merge -ne 0 -or
                 [int]$apply.counts.review -ne 0 -or [int]$apply.counts.supersede -ne 0 -or
                 [int]$apply.ledger_entries_added -ne 1 -or -not [bool]$apply.parity -or
                 -not [bool]$apply.backfill_complete){throw 'UQ23_SHADOW_APPLY_BAD_STATUS'}
              $newRecords=@(Get-Content '.ice/records.json' -Raw|ConvertFrom-Json)
              $newLedger=Get-Content '.ice/source-ledger.json' -Raw|ConvertFrom-Json
              if($newRecords.Count -ne $originalRecords.Count+1 -or
                 $newLedger.entries.Count -ne $originalLedger.entries.Count+1 -or
                 @($newRecords|Where-Object{[string]$_.id -ceq $candidateId}).Count -ne 1 -or
                 @($newRecords|Where-Object{[string]$_.id -and $originalIds -cnotcontains [string]$_.id}).Count -ne 1 -or
                 @($newLedger.entries|Where-Object{[string]$_.source_ref -ceq $sourceRef}).Count -ne 1){
                 throw 'UQ23_ONE_RECORD_ONE_SOURCE_LEDGER_PARITY_FAILED'
              }
              Write-Host 'UQ23_SHADOW_ONE_RECORD_ONE_LEDGER_APPLY=PASS'
              $checkpoint=RunJson 'CHECKPOINT_VALIDATE' '.\tools\update-checkpoint.ps1' @('validate')
              if([string]$checkpoint.schema -cne 'mind-palace.update-checkpoint-result.v1' -or
                 [string]$checkpoint.status -cne 'ready'){throw 'UQ23_CHECKPOINT_NOT_READY'}
              Write-Host 'UQ23_GUARDED_CHECKPOINT_VALIDATE=PASS'
              $query='Mind-Palace operator decision October 17 authorize merging PR #58 browser chat source'
              $pack=RunJson 'RETRIEVE' '.\tools\context-pack.ps1' @('-Text',$query,'-Project','Mind-Palace','-MaxRecords','35','-MaxBytes','65536')
              if(@($pack.records|Where-Object{[string]$_.id -ceq $candidateId}).Count -ne 1){
                 throw 'UQ23_NEW_RECORD_MISSING_FROM_RETRIEVAL'
              }
              Write-Host 'UQ23_SHADOW_RECORD_RETRIEVAL=PASS'
              $parity=RunJson 'SOURCE_REPLAY' '.\tools\source-reconcile.ps1' @('reconcile','-InventoryPath',$inventory,'-Scope','chat-history')
              if(-not [bool]$parity.parity -or [int]$parity.skip -ne 1 -or [int]$parity.process -ne 0){
                throw 'UQ23_NONIDEMPOTENT_SOURCE_REPLAY'
              }
              Write-Host 'UQ23_ONE_SOURCE_REPLAY_IDEMPOTENT=PASS'
              $expectedDirty=@('.ice/records.json','.ice/source-ledger.json',
                 'archive/index.json','.ice/remote-bootstrap.json',
                 '.ice/remote-catalog.json','.ice/remote-index.ndjson',
                 '.ice/project-state-capsules.json','.ice/project-dependency-graph.json')
              $dirty=@(& git.exe diff --name-only)
              if($LASTEXITCODE -ne 0 -or $dirty -cnotcontains '.ice/records.json' -or
                 $dirty -cnotcontains '.ice/source-ledger.json' -or
                 @($dirty|Where-Object{$expectedDirty -cnotcontains [string]$_}).Count -ne 0){
                 throw 'UQ23_UNAUTHORIZED_DIRTY_SURFACE'
              }
              foreach($p in @('.ice/chat-delta-state.json')){
                 if((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant() -cne $before[$p]){
                    throw 'UQ23_UNAUTHORIZED_CHAT_DELTA_STATE_MUTATION'
                 }
              }
              CheckRef 'refs/heads/main' $main
              CheckRef ('refs/heads/'+$sourceBranch) $sourceHead
              Write-Host 'UQ23_PRODUCTION_MAIN_STILL_PINNED_PRECOMMIT=PASS'
              Write-Host 'UQ23_CODEX_CALLS=0'
              # Operator explicitly approved PR59 source and the guarded persistent checkpoint.
              & git.exe config user.name 'Mind-Palace bounded checkpoint'
              & git.exe config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              if($LASTEXITCODE -ne 0){throw 'UQ23_LOCAL_GIT_IDENTITY_FAILED'}
              $pushDry=@(& git.exe push --dry-run origin HEAD:main 2>&1)
              if($LASTEXITCODE -ne 0){throw ('UQ23_PUSH_PERMISSION_BLOCKED_'+($pushDry|Out-String).Trim())}
              Write-Host 'UQ23_GIT_WRITE_PREFLIGHT=PASS'
              CheckRef 'refs/heads/main' $main
              $checkpointApplied=RunJson 'COMMIT_CHECKPOINT' '.\tools\update-checkpoint.ps1' @('commit',
                '-Message','checkpoint: authorized PR59 chat decision','-ConfirmCheckpoint')
              if([string]$checkpointApplied.schema -cne 'mind-palace.update-checkpoint-result.v1' -or
                 [string]$checkpointApplied.status -cne 'committed' -or
                 -not [bool]$checkpointApplied.committed -or -not [bool]$checkpointApplied.pushed -or
                 [string]$checkpointApplied.base_commit -cne $main -or
                 [string]$checkpointApplied.commit -notmatch '^[a-f0-9]{40}$'){
                throw 'UQ23_CHECKPOINT_COMMIT_NOT_ACCEPTED'
              }
              $commit=[string]$checkpointApplied.commit
              CheckRef 'refs/heads/main' $commit
              if((& git.exe rev-parse HEAD|Out-String).Trim() -cne $commit){throw 'UQ23_CHECKPOINT_COMMIT_HEAD_MISMATCH'}
              if((& git.exe status --porcelain=v1|Out-String).Trim()){throw 'UQ23_DIRTY_POST_COMMIT'}
              Write-Host ('UQ23_PRODUCTION_CHECKPOINT_SHA='+$commit)
              Write-Host 'UQ23_AUTHORIZED_SOURCE_RECORD_DURABLY_COMMITTED=PASS'
            }finally{Pop-Location}
          }finally{
            if(Test-Path $root){Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue}
          }
