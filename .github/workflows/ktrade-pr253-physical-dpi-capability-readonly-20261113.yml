name: KTRADE PR253 owner physical monitor DPI readback (no changes)
on:
  push:
    branches: [qualification/ktrade-pr253-owner-native-readonly-20261113]
    paths:
      - .github/workflows/ktrade-pr253-physical-dpi-capability-readonly-20261113.yml
permissions:
  contents: read
concurrency:
  group: ktrade-pr253-owner-physical-dpi-readback
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    env:
      KTRADE_PR253_EXPECTED_SOURCE: '07d7e41063a0c1506a290d1497f84de8173da292'
      KTRADE_PR253_EXPECTED_TREE: '07ab753cfc02dd24b6e27c1c106f821f14c62534'
    steps:
      - name: Verify exact owner runner and enumerate physical effective DPI at per-monitor v2 awareness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          $who=[Security.Principal.WindowsIdentity]::GetCurrent().Name
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $env:KTRADE_PR253_EXPECTED_SOURCE -cne '07d7e41063a0c1506a290d1497f84de8173da292' -or
             $env:KTRADE_PR253_EXPECTED_TREE -cne '07ab753cfc02dd24b6e27c1c106f821f14c62534' -or
             $who -ine 'LINKDEADKB\camar' -or
             [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){
            throw 'KTRADE_PR253_DPI_CAPABILITY_WRONG_OWNER_OR_REF'
          }
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class KtradePr253PhysicalDpiReadback {
            [StructLayout(LayoutKind.Sequential)] public struct Rect {
              public int left, top, right, bottom;
            }
            public delegate bool DisplayMonitorCallback(IntPtr mon,IntPtr dc,ref Rect rect,IntPtr extra);
            [DllImport("user32.dll",SetLastError=true)]
            public static extern IntPtr SetThreadDpiAwarenessContext(IntPtr context);
            [DllImport("user32.dll",SetLastError=true)]
            public static extern bool EnumDisplayMonitors(IntPtr dc,IntPtr region,DisplayMonitorCallback callback,IntPtr extra);
            [DllImport("shcore.dll")]
            public static extern int GetDpiForMonitor(IntPtr monitor,int type,out uint x,out uint y);
            public static string[] Read(){
              var records=new List<string>();
              // This changes ONLY this diagnostic thread's DPI awareness,
              // not any monitor, global display or application setting.
              IntPtr old=SetThreadDpiAwarenessContext(new IntPtr(-4));
              if(old==IntPtr.Zero)throw new Exception("PER_MONITOR_V2_READ_CONTEXT_NOT_AVAILABLE");
              try {
                DisplayMonitorCallback callback=(IntPtr mon,IntPtr dc,ref Rect r,IntPtr extra)=>{
                  uint x,y;int hr=GetDpiForMonitor(mon,0,out x,out y);
                  if(hr!=0)throw new Exception("READ_ONLY_GET_DPI_FOR_MONITOR_FAILED_"+hr);
                  if(x<96||x>480||y<96||y>480)throw new Exception("READ_ONLY_DPI_OUT_OF_RANGE");
                  int w=r.right-r.left,h=r.bottom-r.top;
                  if(w<=0||h<=0)throw new Exception("READ_ONLY_DISPLAY_RECT_INVALID");
                  records.Add(x.ToString()+","+y.ToString()+","+w.ToString()+","+h.ToString());
                  return true;
                };
                if(!EnumDisplayMonitors(IntPtr.Zero,IntPtr.Zero,callback,IntPtr.Zero))
                  throw new Exception("READ_ONLY_MONITOR_ENUM_FAILED_"+Marshal.GetLastWin32Error());
                if(records.Count==0||records.Count>8)throw new Exception("READ_ONLY_MONITOR_COUNT_UNSUPPORTED");
                return records.ToArray();
              }finally{
                IntPtr restored=SetThreadDpiAwarenessContext(old);
                if(restored==IntPtr.Zero)throw new Exception("READ_THREAD_AWARENESS_RESTORE_FAILED");
              }
            }
          }
          '@
          $snapshot=@([KtradePr253PhysicalDpiReadback]::Read())
          $seen=@()
          for($i=0;$i -lt $snapshot.Count;$i++){
            $part=$snapshot[$i].Split(',')
            if($part.Count -ne 4){throw 'KTRADE_PR253_DPI_SNAPSHOT_SHAPE_REFUSED'}
            $x=[int]$part[0];$y=[int]$part[1]
            $scale=if($x -eq $y){[int][Math]::Round(100*$x/96)}else{'NON_SQUARE'}
            $seen+=([ordered]@{
              monitor_number=$i+1
              reported_effective_dpi_x=$x;reported_effective_dpi_y=$y
              observed_scale_percent=$scale
              monitor_rect_pixels_width=[int]$part[2];monitor_rect_pixels_height=[int]$part[3]
            })
          }
          $screensaver=Get-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -ErrorAction Stop
          $exactCurrent=(@($seen|Where-Object {$_.reported_effective_dpi_x -eq 96 -and $_.reported_effective_dpi_y -eq 96}).Count -eq $seen.Count)
          $targets=@(120,144,192)
          $currentlyPresent=@($seen|Where-Object {$_.reported_effective_dpi_x -in $targets -and $_.reported_effective_dpi_y -eq $_.reported_effective_dpi_x}|
            ForEach-Object {$_.observed_scale_percent}|Select-Object -Unique)
          Write-Host ('KTRADE_PR253_PHYSICAL_DPI_CAPABILITY='+([ordered]@{
            schema='ktrade.pr253.physical-dpi-observer.v1'
            candidate_sha=$env:KTRADE_PR253_EXPECTED_SOURCE
            candidate_tree=$env:KTRADE_PR253_EXPECTED_TREE
            runner=$env:RUNNER_NAME;host=$env:COMPUTERNAME
            session=[Diagnostics.Process]::GetCurrentProcess().SessionId
            monitor_count=$seen.Count
            actual_monitor_dpi=$seen
            all_monitors_100_percent=$exactCurrent
            already_present_target_scales=$currentlyPresent
            targets_unqualified_percent=@(125,150,200)
            current_screen_saver_timeout_seconds=[string]$screensaver.ScreenSaveTimeOut
            monitor_display_scale_modified=$false
            display_resolution_modified=$false
            registry_or_saved_settings_modified=$false
            user_mouse_or_keyboard_input_injected=$false
            runner_controller_modified=$false
            scheduled_task_created=$false
            app_launched=$false
            physical_matrix_125_150_200_qualified=$false
          }|ConvertTo-Json -Compress -Depth 6))
      - name: Read-only 200 percent Settings UIA capability with foreground restoration
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $env:RUNNER_OS -cne 'Windows' -or
             [Security.Principal.WindowsIdentity]::GetCurrent().Name -ine 'LINKDEADKB\camar' -or
             [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){
            throw 'KTRADE_W186_UIA_OWNER_SCOPE_REFUSED'
          }
          if(@(Get-Process -Name ktrade,ktrade-engine -ErrorAction SilentlyContinue).Count -gt 0){
            Write-Host 'KTRADE_W186_UIA_CAPABILITY=BLOCKED_OWNER_APP_RUNNING;display_changed=false'
            return
          }
          # Existing Windows Settings is read-only eligible: do not relaunch,
          # navigate, close, or steal focus from the owner-owned window.
          $existingSettings=(@(Get-Process -Name SystemSettings -ErrorAction SilentlyContinue).Count -gt 0)
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class KtradeW186Desktop {
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr OpenInputDesktop(uint flags,bool inherit,uint access);
            [DllImport("user32.dll",SetLastError=true)] public static extern bool CloseDesktop(IntPtr h);
            [DllImport("user32.dll",SetLastError=true,CharSet=CharSet.Unicode)]
            public static extern bool GetUserObjectInformation(IntPtr h,int i,StringBuilder b,uint size,out uint needed);
            public static string Desktop(){
              var h=OpenInputDesktop(0,false,1);
              if(h==IntPtr.Zero)return "UNAVAILABLE";
              try {
                var b=new StringBuilder(128);uint needed;
                return GetUserObjectInformation(h,2,b,(uint)(b.Capacity*2),out needed)?
                  b.ToString():"UNAVAILABLE";
              } finally{CloseDesktop(h);}
            }
          }
          '@
          if([KtradeW186Desktop]::Desktop() -cne 'Default'){
            Write-Host 'KTRADE_W186_UIA_CAPABILITY=BLOCKED_SECURE_OR_SAVER_DESKTOP;display_changed=false'
            return
          }
          $priorForeground=[KtradeW186Desktop]::GetForegroundWindow()
          $settingsWindow=$null
          $ownedSettings=$false
          try {
            # Only open the Windows Settings DISPLAY page. Do not click, select,
            # expand a control, inject input or change any display setting.
            if(!$existingSettings){
              Start-Process -FilePath 'explorer.exe' -ArgumentList 'ms-settings:display' -ErrorAction Stop
              $ownedSettings=$true
            }else{
              Write-Host 'KTRADE_W187_EXISTING_SETTINGS_READ_ONLY=true;no_navigation=true'
            }
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $windowFilter=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
              [System.Windows.Automation.ControlType]::Window)
            for($try=0;$try -lt 24;$try++){
              $windows=$root.FindAll([System.Windows.Automation.TreeScope]::Children,$windowFilter)
              foreach($w in $windows){
                if([string]$w.Current.Name -match '(?i)(^| - )settings$'){
                  $settingsWindow=$w
                  break
                }
              }
              if($null -ne $settingsWindow){break}
              Start-Sleep -Milliseconds 250
            }
            if($null -eq $settingsWindow){
              Write-Host 'KTRADE_W186_UIA_CAPABILITY=BLOCKED_SETTINGS_WINDOW_UNOBSERVED;display_changed=false'
            }else{
              $comboFilter=[System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                [System.Windows.Automation.ControlType]::ComboBox)
              $combos=$settingsWindow.FindAll([System.Windows.Automation.TreeScope]::Descendants,$comboFilter)
              $scale=@()
              foreach($item in $combos){
                if([string]$item.Current.Name -match '(?i)\bscale\b'){
                  $patterns=@($item.GetSupportedPatterns()|ForEach-Object {$_.Id})
                  $scale+=([ordered]@{
                    supported_expand_collapse=($patterns -contains [System.Windows.Automation.ExpandCollapsePattern]::Pattern.Id)
                    supported_selection=($patterns -contains [System.Windows.Automation.SelectionPattern]::Pattern.Id)
                    supported_value=($patterns -contains [System.Windows.Automation.ValuePattern]::Pattern.Id)
                  })
                }
              }
              Write-Host ('KTRADE_W186_UIA_CAPABILITY='+([ordered]@{
                schema='ktrade.pr253.w186.windows-settings-scale-readonly.v1'
                result=if($scale.Count -eq 1){'SINGLE_LABELED_SCALE_SELECTOR'}else{'NO_UNAMBIGUOUS_SCALE_SELECTOR'}
                visible_combo_count=$combos.Count
                matching_scale_controls=$scale.Count
                patterns=$scale
                windows_scale_changed=$false
                registry_or_saved_settings_modified=$false
                keyboard_or_mouse_input_injected=$false
                user_data_touched=$false
                physical_200_percent_accepted=$false
              }|ConvertTo-Json -Compress -Depth 5))
            }
          }finally{
            # Never close a pre-existing owner Settings process. The preflight
            # refused that state before launching its own Settings page.
            if($ownedSettings -and $null -ne $settingsWindow){
              $pat=$null
              if($settingsWindow.TryGetCurrentPattern(
                [System.Windows.Automation.WindowPattern]::Pattern,[ref]$pat)){
                try{$pat.Close()}catch{Write-Host 'KTRADE_W186_SETTINGS_CLOSE_REFUSED'}
              }else{Write-Host 'KTRADE_W186_SETTINGS_CLOSE_UNAVAILABLE'}
            }
            if($priorForeground -ne [IntPtr]::Zero){
              $restored=[KtradeW186Desktop]::SetForegroundWindow($priorForeground)
              Write-Host ('KTRADE_W186_FOREGROUND_RESTORE='+$(if($restored){'PASS'}else{'UNVERIFIED'}))
            }
            Write-Host 'KTRADE_W186_NO_SCALING_MUTATION=true;scheduled_tasks_created=false;live_disarmed=true'
          }
