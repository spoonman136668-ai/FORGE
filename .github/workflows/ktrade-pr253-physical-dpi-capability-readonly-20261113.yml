name: KTRADE PR253 owner physical monitor DPI readback (no changes)
on:
  push:
    branches: [qualification/ktrade-pr253-owner-native-readonly-20261113]
    paths:
      - .github/workflows/ktrade-pr253-physical-dpi-capability-readonly-20261113.yml
permissions:
  contents: read
concurrency:
  group: ktrade-pr253-owner-physical-dpi-readback
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    env:
      KTRADE_PR253_EXPECTED_SOURCE: '59842e83f01fb6e1af780ede5a7395a9c7cce47a'
    steps:
      - name: Verify exact owner runner and enumerate physical effective DPI at per-monitor v2 awareness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          $who=[Security.Principal.WindowsIdentity]::GetCurrent().Name
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $env:KTRADE_PR253_EXPECTED_SOURCE -cne '59842e83f01fb6e1af780ede5a7395a9c7cce47a' -or
             $who -ine 'LINKDEADKB\camar' -or
             [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){
            throw 'KTRADE_PR253_DPI_CAPABILITY_WRONG_OWNER_OR_REF'
          }
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class KtradePr253PhysicalDpiReadback {
            [StructLayout(LayoutKind.Sequential)] public struct Rect {
              public int left, top, right, bottom;
            }
            public delegate bool DisplayMonitorCallback(IntPtr mon,IntPtr dc,ref Rect rect,IntPtr extra);
            [DllImport("user32.dll",SetLastError=true)]
            public static extern IntPtr SetThreadDpiAwarenessContext(IntPtr context);
            [DllImport("user32.dll",SetLastError=true)]
            public static extern bool EnumDisplayMonitors(IntPtr dc,IntPtr region,DisplayMonitorCallback callback,IntPtr extra);
            [DllImport("shcore.dll")]
            public static extern int GetDpiForMonitor(IntPtr monitor,int type,out uint x,out uint y);
            public static string[] Read(){
              var records=new List<string>();
              // This changes ONLY this diagnostic thread's DPI awareness,
              // not any monitor, global display or application setting.
              IntPtr old=SetThreadDpiAwarenessContext(new IntPtr(-4));
              if(old==IntPtr.Zero)throw new Exception("PER_MONITOR_V2_READ_CONTEXT_NOT_AVAILABLE");
              try {
                DisplayMonitorCallback callback=(IntPtr mon,IntPtr dc,ref Rect r,IntPtr extra)=>{
                  uint x,y;int hr=GetDpiForMonitor(mon,0,out x,out y);
                  if(hr!=0)throw new Exception("READ_ONLY_GET_DPI_FOR_MONITOR_FAILED_"+hr);
                  if(x<96||x>480||y<96||y>480)throw new Exception("READ_ONLY_DPI_OUT_OF_RANGE");
                  int w=r.right-r.left,h=r.bottom-r.top;
                  if(w<=0||h<=0)throw new Exception("READ_ONLY_DISPLAY_RECT_INVALID");
                  records.Add(x.ToString()+","+y.ToString()+","+w.ToString()+","+h.ToString());
                  return true;
                };
                if(!EnumDisplayMonitors(IntPtr.Zero,IntPtr.Zero,callback,IntPtr.Zero))
                  throw new Exception("READ_ONLY_MONITOR_ENUM_FAILED_"+Marshal.GetLastWin32Error());
                if(records.Count==0||records.Count>8)throw new Exception("READ_ONLY_MONITOR_COUNT_UNSUPPORTED");
                return records.ToArray();
              }finally{
                IntPtr restored=SetThreadDpiAwarenessContext(old);
                if(restored==IntPtr.Zero)throw new Exception("READ_THREAD_AWARENESS_RESTORE_FAILED");
              }
            }
          }
          '@
          $snapshot=@([KtradePr253PhysicalDpiReadback]::Read())
          $seen=@()
          for($i=0;$i -lt $snapshot.Count;$i++){
            $part=$snapshot[$i].Split(',')
            if($part.Count -ne 4){throw 'KTRADE_PR253_DPI_SNAPSHOT_SHAPE_REFUSED'}
            $x=[int]$part[0];$y=[int]$part[1]
            $scale=if($x -eq $y){[int][Math]::Round(100*$x/96)}else{'NON_SQUARE'}
            $seen+=([ordered]@{
              monitor_number=$i+1
              reported_effective_dpi_x=$x;reported_effective_dpi_y=$y
              observed_scale_percent=$scale
              monitor_rect_pixels_width=[int]$part[2];monitor_rect_pixels_height=[int]$part[3]
            })
          }
          $screensaver=Get-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -ErrorAction Stop
          $exactCurrent=(@($seen|Where-Object {$_.reported_effective_dpi_x -eq 96 -and $_.reported_effective_dpi_y -eq 96}).Count -eq $seen.Count)
          $targets=@(120,144,192)
          $currentlyPresent=@($seen|Where-Object {$_.reported_effective_dpi_x -in $targets -and $_.reported_effective_dpi_y -eq $_.reported_effective_dpi_x}|
            ForEach-Object {$_.observed_scale_percent}|Select-Object -Unique)
          Write-Host ('KTRADE_PR253_PHYSICAL_DPI_CAPABILITY='+([ordered]@{
            schema='ktrade.pr253.physical-dpi-observer.v1'
            candidate_sha=$env:KTRADE_PR253_EXPECTED_SOURCE
            runner=$env:RUNNER_NAME;host=$env:COMPUTERNAME
            session=[Diagnostics.Process]::GetCurrentProcess().SessionId
            monitor_count=$seen.Count
            actual_monitor_dpi=$seen
            all_monitors_100_percent=$exactCurrent
            already_present_target_scales=$currentlyPresent
            targets_unqualified_percent=@(125,150,200)
            current_screen_saver_timeout_seconds=[string]$screensaver.ScreenSaveTimeOut
            monitor_display_scale_modified=$false
            display_resolution_modified=$false
            registry_or_saved_settings_modified=$false
            user_mouse_or_keyboard_input_injected=$false
            runner_controller_modified=$false
            scheduled_task_created=$false
            app_launched=$false
            physical_matrix_125_150_200_qualified=$false
          }|ConvertTo-Json -Compress -Depth 6))
