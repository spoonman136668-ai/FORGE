name: FORGE independent advisory knowledge integrity qualification
on:
  push:
    branches: [qualification/source-standards-forge-advisory-20261028]
    paths:
      - .github/workflows/source-standards-forge-knowledge-verify.yml
permissions:
  contents: read
concurrency:
  group: source-standards-forge-private-integrity
  cancel-in-progress: false
jobs:
  independent-committed-artifact:
    if: github.repository == 'spoonman136668-ai/FORGE' && github.actor == 'spoonman136668-ai'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20
    env:
      FORGE_ADVISORY_SHA: '068b99f8891a839c6c014bb77da778641a3a9540'
      FORGE_SOURCE_SHA: '3775bed30891ff748197a539afe5b92813680e26'
      RESEARCH_SCIENTIFIC_AUTHORITY: '0'
      RESEARCH_PROMOTION_ALLOWED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch exact harness with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Cold-verify private committed graph and 7016-note Obsidian vault
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'self-hosted'){throw 'FORGE_QUALIFY_WRONG_RUNNER'}
          if($env:RESEARCH_SCIENTIFIC_AUTHORITY -cne '0' -or $env:RESEARCH_PROMOTION_ALLOWED -cne '0'){throw 'FORGE_QUALIFY_AUTHORITY_UNSAFE'}
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'FORGE_QUALIFY_HARNESS_DRIFT'}
          $who=(& gh api user --jq .login 2>$null | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $who -cne 'spoonman136668-ai'){throw 'FORGE_QUALIFY_WRONG_IDENTITY'}
          $private=(& gh repo view spoonman136668-ai/forge-knowledge --json isPrivate --jq .isPrivate | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $private -cne 'true'){throw 'FORGE_QUALIFY_KNOWLEDGE_NOT_PRIVATE'}
          $source=(& gh api repos/spoonman136668-ai/FORGE/git/ref/heads/main --jq .object.sha | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $source -cne $env:FORGE_SOURCE_SHA){throw 'FORGE_QUALIFY_SOURCE_MAIN_CHANGED'}
          $root=Join-Path $env:SystemDrive ('fq'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'FORGE_QUALIFY_SCRATCH_EXISTS'}
          $null=New-Item -ItemType Directory -Path $root
          $repo=Join-Path $root 'knowledge'
          $privateLog=Join-Path $root 'clone.log'
          try{
            $env:GIT_TERMINAL_PROMPT='0'
            & git -c 'credential.helper=!gh auth git-credential' clone --no-checkout --filter=blob:none 'https://github.com/spoonman136668-ai/forge-knowledge.git' $repo *> $privateLog
            if($LASTEXITCODE -ne 0){throw 'FORGE_QUALIFY_PRIVATE_CLONE_FAILED'}
            & git -C $repo config core.longpaths true
            & git -C $repo checkout --detach $env:FORGE_ADVISORY_SHA *> $privateLog
            if($LASTEXITCODE -ne 0){throw 'FORGE_QUALIFY_KNOWLEDGE_CHECKOUT_FAILED'}
            if((git -C $repo rev-parse HEAD).Trim() -cne $env:FORGE_ADVISORY_SHA){throw 'FORGE_QUALIFY_SHA_DRIFT'}
            & python -B ./tools/qualification/forge-advisory-verify.py $repo
            if($LASTEXITCODE -ne 0){throw 'FORGE_QUALIFY_ARTIFACT_FAILED'}
            if(@(git -C $repo status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'FORGE_QUALIFY_TRACKED_MUTATION'}
            Write-Host 'FORGE_QUALIFY_INDEPENDENT_COLD_CHECKOUT=PASS'
            Write-Host 'FORGE_QUALIFY_NATIVE_ATLAS_AND_MAIN_UNMODIFIED=PASS'
          }finally{
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }
