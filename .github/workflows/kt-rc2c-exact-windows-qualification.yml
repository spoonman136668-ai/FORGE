name: K-Terminal RC2-C exact-candidate Windows qualification
on:
  push:
    branches: [diagnostics/kterminal-original-local-preflight-20261019]
    paths: [.github/workflows/kt-rc2c-exact-windows-qualification.yml]
permissions:
  contents: read
concurrency:
  group: kterm-rc2c-exact-b8c2052d530cdff93462dfccc21b28f3824e5531
  cancel-in-progress: false
jobs:
  original-windows-qualification:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
    steps:
      - name: Checkout FORGE qualification workflow (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm isolated hosted Windows execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/FORGE
          test "$GITHUB_REF" = refs/heads/diagnostics/kterminal-original-local-preflight-20261019
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo KTERM_RC2C_EXISTING_HOSTED_WINDOWS=PASS
      - name: Checkout frozen private original K-Terminal candidate read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: b8c2052d530cdff93462dfccc21b28f3824e5531
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Checkout frozen original baseline to classify inherited negatives
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: eb5d225ae73b698a59c68d840daf1ec678e1a0ec
          path: kterminal-original-baseline
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Setup existing pinned Go 1.26.5 toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Exact source identity and no broker credentials
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b8c2052d530cdff93462dfccc21b28f3824e5531
          test "$(git rev-parse HEAD:pkg/coinbase-performance-reconciler.go)" = ce588db3a222d5edd1b5f226946b4e1994969de2
          test -z "$(git status --porcelain)"
          go version | grep -F 'go1.26.5 windows/amd64'
          for n in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET; do
            if [[ -n "${!n:-}" ]]; then echo KTERM_RC2C_CREDENTIAL_BLOCK=FAIL; exit 2; fi
          done
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          echo KTERM_RC2C_EXACT_SOURCE=PASS
          echo KTERM_RC2C_REAL_COINBASE_ACCESS=NONE
      - name: Focused native audit-clock tests and exact predecessor comparison
        shell: bash
        run: |
          set -euo pipefail
          regex='^(TestHistoricalPnL.*|TestHistoricalOrderScope.*|TestHistoricalScope.*|TestIncrementalRestart.*|TestNativeObservation.*|TestPerformanceDrawdown.*|TestStage3NativeHistoricalHistoryCheckpointV2)$'
          test "$(git -C kterminal-private rev-parse HEAD)" = b8c2052d530cdff93462dfccc21b28f3824e5531
          test "$(git -C kterminal-original-baseline rev-parse HEAD)" = eb5d225ae73b698a59c68d840daf1ec678e1a0ec
          set +e
          (cd kterminal-private && go test -json -count=1 -p=1 -parallel=1 -timeout=18m ./pkg -run "$regex") > "$RUNNER_TEMP/rc2c-candidate.jsonl" 2> "$RUNNER_TEMP/rc2c-candidate-stderr.txt"
          candidate_rc=$?
          (cd kterminal-original-baseline && go test -json -count=1 -p=1 -parallel=1 -timeout=18m ./pkg -run "$regex") > "$RUNNER_TEMP/rc2c-original.jsonl" 2> "$RUNNER_TEMP/rc2c-original-stderr.txt"
          original_rc=$?
          set -e
          export RC2C_CANDIDATE_RC="$candidate_rc"
          export RC2C_ORIGINAL_RC="$original_rc"
          python -B - <<'PY'
          import json,os,pathlib,sys,re
          def read(name):
              counts={"pass":0,"fail":0,"run":0}
              fail=set()
              pkg_fail=set()
              target=False
              errors=0
              path=pathlib.Path(os.environ["RUNNER_TEMP"])/("rc2c-"+name+".jsonl")
              for line in path.open(encoding="utf-8",errors="replace"):
                  try:v=json.loads(line)
                  except ValueError:errors+=1;continue
                  action,t,pkg=v.get("Action"),v.get("Test"),v.get("Package")
                  if t and action in counts:counts[action]+=1
                  if t=="TestHistoricalPnLFullAuditClockAndImmutableJournal" and action=="pass":target=True
                  if action=="fail":
                      if t:fail.add(t)
                      elif pkg:pkg_fail.add(pkg)
              return counts,fail,pkg_fail,target,errors
          c,cf,cp,ct,ce=read("candidate")
          o,of,op,ot,oe=read("original")
          print("KTERM_RC2C_TARGET_AUDIT_TEST_PASS="+str(ct).upper())
          print("KTERM_RC2C_CANDIDATE_PASSED="+str(c["pass"]))
          print("KTERM_RC2C_CANDIDATE_FAILED="+str(c["fail"]))
          print("KTERM_RC2C_ORIGINAL_PASSED="+str(o["pass"]))
          print("KTERM_RC2C_ORIGINAL_FAILED="+str(o["fail"]))
          print("KTERM_RC2C_CANDIDATE_INHERITED_TEST_FAILS="+str(len(cf&of)))
          print("KTERM_RC2C_CANDIDATE_ONLY_TEST_FAILS="+str(len(cf-of)))
          for item in sorted(cf|of):
              if not re.fullmatch(r"[A-Za-z0-9_./-]{1,220}",item):continue
              origin=("BOTH" if item in cf and item in of else "CANDIDATE" if item in cf else "BASELINE")
              print("KTERM_RC2C_FAILURE_TEST="+origin+":"+item)
          print("KTERM_RC2C_COMPARISON_BROKEN="+str(ce>0 or oe>0 or bool(cp-of) or bool(op-cp)).upper())
          good=(int(os.environ["RC2C_CANDIDATE_RC"])==0 and not cf and not cp and ct and ce==0)
          print("KTERM_RC2C_FOCUSED="+("PASS" if good else "FAILED_NOT_WAIVED"))
          if not good:sys.exit(2)
          PY
      - name: Diagnose inherited Stage3 fixture failure with redacted diagnostic markers
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd kterminal-original-baseline && go test -json -count=1 -p=1 -parallel=1 -timeout=8m ./pkg -run '^TestStage3NativeHistoricalHistoryCheckpointV2/BTC-USDC/success$') > "$RUNNER_TEMP/rc2d-isolated-stage3.jsonl" 2> "$RUNNER_TEMP/rc2d-isolated-stage3-stderr.txt"
          stage3rc=$?
          set -e
          export RC2D_STAGE3_RC="$stage3rc"
          python -B - <<'PY'
          import json,os,pathlib,re
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"rc2d-isolated-stage3.jsonl"
          markers=set()
          test_failures=[]
          target_run=0
          first_detail=""
          loc=re.compile(r'([a-zA-Z0-9_-]+_test\\.go):(\\d+):')
          for line in p.open(encoding="utf-8",errors="replace"):
              try:x=json.loads(line)
              except ValueError:continue
              name=x.get("Test","")
              if name.startswith("TestStage3NativeHistoricalHistoryCheckpointV2"):
                  if x.get("Action")=="run":target_run+=1
                  if x.get("Action")=="fail":test_failures.append(name)
                  if x.get("Action")=="output":
                      msg=x.get("Output","")
                      for m in loc.finditer(msg):
                          markers.add(m.group(1)+":"+m.group(2))
                      for label,pattern in [
                          ("FIXTURE_ROOT","owned fixture root"),
                          ("READY_PREMISE","original READY premise"),
                          ("COLD_CUTOFF","cold cutoff"),
                          ("ORIGINAL_HISTORICAL_PRODUCER","historical producer did not qualify"),
                          ("AUTHORITY_STATE","authority.*(BLOCKED|FAILED)"),
                          ("CHECKPOINT_IDENTITY","checkpoint"),
                          ("STARTUP_TIMEOUT","timed out|timeout"),
                          ("TEST_PANIC","panic:"),
                          ("GO_COMPILATION","build failed"),
                          ("TRADING_SCOPE","execution authority"),
                      ]:
                          if re.search(pattern,msg,re.I):first_detail=first_detail or label
          print("RC2D_PREDECESSOR_STAGE3_EXIT="+str(int(os.environ["RC2D_STAGE3_RC"])))
          print("RC2D_PREDECESSOR_STAGE3_RUN_NODES="+str(target_run))
          print("RC2D_PREDECESSOR_STAGE3_FAILED_NODES="+str(len(test_failures)))
          print("RC2D_PREDECESSOR_STAGE3_SOURCE_LOCATIONS="+",".join(sorted(markers)[:25]))
          print("RC2D_PREDECESSOR_STAGE3_REASON_CLASS="+(first_detail or "UNCLASSIFIED"))
          print("RC2D_PREDECESSOR_STAGE3_FAIL_CLOSED=TRUE")
          PY
      - name: One complete original Windows regression
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          set +e
          go test -json -count=1 -p=1 -parallel=1 -timeout=38m ./... > "$RUNNER_TEMP/rc2c-full.jsonl" 2> "$RUNNER_TEMP/rc2c-full-stderr.txt"
          rc=$?
          set -e
          export KTERM_RC2C_EXIT="$rc"
          python -B - <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"rc2c-full.jsonl"
          passed=failed=errors=0; packages=set(); failures=set()
          for line in p.open(encoding="utf-8",errors="replace"):
              try:e=json.loads(line)
              except ValueError:errors+=1;continue
              if e.get("Action")=="pass" and e.get("Test"):passed+=1
              if e.get("Action")=="fail":
                  if e.get("Test"):failed+=1
                  failures.add(e.get("Package","unknown"))
              if e.get("Action")=="pass" and not e.get("Test"):packages.add(e.get("Package","unknown"))
          good=int(os.environ["KTERM_RC2C_EXIT"])==0 and failed==0 and errors==0 and not failures
          print("KTERM_RC2C_FULL_PASS_NODES="+str(passed))
          print("KTERM_RC2C_FULL_FAILED_NODES="+str(failed))
          print("KTERM_RC2C_FULL_PASS_PACKAGES="+str(len(packages)))
          print("KTERM_RC2C_FULL_FAILED_PACKAGES="+str(len(failures)))
          print("KTERM_RC2C_FULL_WINDOWS_REGRESSION="+("PASS" if good else "FAIL_NOT_WAIVED"))
          if not good:sys.exit(2)
          PY
      - name: Original Windows Go build after passing full regression
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          go build -p=1 ./...
          echo KTERM_RC2C_WINDOWS_GO_BUILD=PASS
          echo KTERM_RC2C_NO_MERGE_NO_INSTALL_NO_LIVE_BROKER=PASS
