name: K-Terminal original UI assembly provenance
on:
  push:
    branches: [diagnostics/kterminal-original-local-preflight-20261019]
    paths: [.github/workflows/kt-original-local-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    steps:
      - name: Inspect original UI DLL without modifying it
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:COMPUTERNAME -cne 'LINKDEADKB') { throw 'WRONG_RUNNER' }
          Write-Host 'KTERM_LOCAL_RUNNER=PASS'
          $candidates = @(Get-ChildItem -LiteralPath 'C:\Users' -Directory | ForEach-Object { Join-Path $_.FullName 'Downloads\Personal.v1.1.5.-.BTC\Personal' } | Where-Object { Test-Path -LiteralPath $_ -PathType Container })
          if ($candidates.Count -ne 1) { Write-Host ('KTERM_ROOT_COUNT=' + $candidates.Count); throw 'ROOT_NOT_UNIQUE' }
          $root = $candidates[0]
          $dll = Join-Path $root 'KTerminal.UI.dll'
          $manifestPath = Join-Path $root 'ui-runtime-manifest.json'
          Write-Host ('KTERM_UI_DLL_PRESENT=' + (Test-Path -LiteralPath $dll -PathType Leaf))
          Write-Host ('KTERM_UI_MANIFEST_PRESENT=' + (Test-Path -LiteralPath $manifestPath -PathType Leaf))
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw 'DLL_MISSING' }
          $zoneLines = @()
          try { $zoneLines = @(Get-Content -LiteralPath $dll -Stream Zone.Identifier -ErrorAction Stop) } catch { }
          $zoneIds = @($zoneLines | Where-Object { $_.StartsWith('ZoneId=') } | ForEach-Object { $_.Substring(7) })
          if ($zoneIds.Count -eq 0) { Write-Host 'KTERM_DLL_MOTW=ABSENT' } else { Write-Host ('KTERM_DLL_ZONE_ID=' + ($zoneIds -join ',')) }
          $dllHash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if (Test-Path -LiteralPath $manifestPath -PathType Leaf) {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if ([string]$manifest.sha256 -ceq $dllHash) { Write-Host 'KTERM_DLL_MANIFEST_HASH=PASS' } else { Write-Host 'KTERM_DLL_MANIFEST_HASH=MISMATCH' }
          }
          try {
            $identity = [Reflection.AssemblyName]::GetAssemblyName($dll)
            Write-Host 'KTERM_DLL_METADATA=READABLE'
          } catch { Write-Host ('KTERM_DLL_METADATA_ERROR=' + $_.Exception.GetType().Name) }
          try {
            $null = [Reflection.Assembly]::LoadFrom($dll)
            Write-Host 'KTERM_DLL_LOAD=PASS'
          } catch {
            $e = $_.Exception
            Write-Host 'KTERM_DLL_LOAD=FAIL'
            Write-Host ('KTERM_DLL_LOAD_EXCEPTION=' + $e.GetType().Name)
            if ($e.InnerException) { Write-Host ('KTERM_DLL_INNER_HRESULT=0x' + $e.InnerException.HResult.ToString('X8')) }
          }
          Write-Host 'KTERM_NO_ORIGINAL_FILES_MODIFIED=TRUE'
