name: Mind-Palace one-shot guarded Windows checkpoint (operator authorized)
on:
  push:
    branches: [diagnostics/mind-palace-private-bridge-20261013]
    paths:
      - '.github/mind-palace-catchup/ENABLE-20261013.txt'
permissions:
  contents: read
jobs:
  apply:
    if: ${{ github.event_name == 'push' && github.actor == 'spoonman136668-ai' && github.repository == 'spoonman136668-ai/FORGE' }}
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 55
    steps:
      - name: Exact source evidence, accepted backfill, and guarded checkpoint
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: 'Never'
          GH_PROMPT_DISABLED: '1'
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){throw 'RUNNER_IDENTITY_MISMATCH'}
          if($env:GITHUB_REF -cne 'refs/heads/diagnostics/mind-palace-private-bridge-20261013'){throw 'WORKFLOW_REF_MISMATCH'}
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          $expectedMain='7246a98cb60c549a11c688b6370506d50b99c0db'
          $expectedHead='971495071fe6fe841a920cd91fcbc7ea88550067'
          $remote='https://github.com/spoonman136668-ai/Mind-Palace.git'
          $root=Join-Path $env:RUNNER_TEMP ('mp-apply-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'ISOLATED_ROOT_ALREADY_EXISTS'}
          $src=@(
            'pilots/chat-history/2026-10-13-hosted-catchup.batch.json',
            'pilots/chat-history/2026-10-13-hosted-catchup.inventory.json',
            'pilots/chat-history/2026-10-13-hosted-catchup.source-slice.json'
          )
          function Assert-Exit([string]$code) {
            if($LASTEXITCODE -ne 0){throw ($code+':'+$LASTEXITCODE)}
          }
          function Invoke-PowerShellGuarded([string]$label,[string]$script,[string[]]$arguments){
            $text=(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script @arguments 2>&1|Out-String).Trim()
            $rc=$LASTEXITCODE
            if($rc -ne 0){throw ('MIND_PALACE_'+$label+'_FAILED:'+ $rc)}
            Write-Host ('MIND_PALACE_'+$label+'=PASS')
            return $text
          }
          try{
            $write=(& gh.exe api 'repos/spoonman136668-ai/Mind-Palace' --jq '.permissions.push' 2>$null|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $write -cne 'true'){throw 'MIND_PALACE_EXISTING_CREDENTIAL_WRITE_UNAVAILABLE'}
            & git.exe clone --quiet --branch main $remote $root
            Assert-Exit 'PRIVATE_CLONE_FAILED'
            $head=(& git.exe -C $root rev-parse HEAD|Out-String).Trim()
            if($head -cne $expectedMain){throw 'PREIMAGE_MAIN_SHA_DRIFT'}
            & git.exe -C $root fetch --quiet --no-tags origin mind-palace/hosted-catchup-20261013
            Assert-Exit 'FETCH_QUALIFIED_SOURCE_FAILED'
            $sourceHead=(& git.exe -C $root rev-parse FETCH_HEAD|Out-String).Trim()
            if($sourceHead -cne $expectedHead){throw 'QUALIFIED_SOURCE_SHA_DRIFT'}
            $changed=@(& git.exe -C $root diff --name-only $expectedMain $sourceHead)
            $allowed=@($src)+@('.github/workflows/mind-palace-hosted-catchup-20261013.yml')
            if($changed.Count -ne 4 -or @($changed|Where-Object{$_ -notin $allowed}).Count -ne 0){throw 'QUALIFIED_SOURCE_SCOPE_DRIFT'}
            Push-Location $root
            try {
              if((& git.exe status --porcelain=v1|Out-String).Trim()){throw 'MAIN_WORKTREE_NOT_CLEAN'}
              & git.exe checkout $sourceHead -- $src
              Assert-Exit 'EXACT_EVIDENCE_STAGING_FAILED'
              $staged=@(& git.exe diff --cached --name-only)
              if($staged.Count -ne 3 -or @($staged|Where-Object{$_ -notin $src}).Count -ne 0){throw 'EVIDENCE_PATH_SET_DRIFT'}
              & git.exe diff --cached --check
              Assert-Exit 'EVIDENCE_DIFF_CHECK_FAILED'
              # Commit only the three selected partial source files. Deliberately
              # exclude the draft PR's hosted workflow to avoid a second writer.
              & git.exe config user.name 'mind-palace-bounded-operator'
              & git.exe config user.email 'spoonman136668-ai@users.noreply.github.com'
              & git.exe commit -qm 'evidence: selected Oct 13 partial operator decision catch-up'
              Assert-Exit 'EVIDENCE_COMMIT_FAILED'
              $evidenceSha=(& git.exe rev-parse HEAD|Out-String).Trim()
              & git.exe fetch --quiet --no-tags origin main
              Assert-Exit 'MAIN_REFETCH_FAILED'
              $remoteMain=(& git.exe rev-parse FETCH_HEAD|Out-String).Trim()
              if($remoteMain -cne $expectedMain){throw 'REMOTE_MAIN_CONCURRENT_DRIFT'}
              & git.exe push --quiet origin 'HEAD:refs/heads/main'
              Assert-Exit 'EVIDENCE_FAST_FORWARD_PUSH_FAILED'
              $remoteAfter=(@(& git.exe ls-remote origin refs/heads/main)|Select-Object -First 1)
              if(([string]$remoteAfter).Split([char[]]@(" ","`t"),[System.StringSplitOptions]::RemoveEmptyEntries)[0] -cne $evidenceSha){throw 'EVIDENCE_REMOTE_SHA_MISMATCH'}
              & git.exe fetch --quiet --no-tags origin main
              Assert-Exit 'POST_EVIDENCE_ORIGIN_FETCH_FAILED'
              if(((& git.exe rev-parse origin/main|Out-String).Trim()) -cne $evidenceSha){throw 'POST_EVIDENCE_TRACKING_SHA_DRIFT'}
              Write-Host 'PARTIAL_SOURCE_EVIDENCE_CHECKPOINT=PASS'
              $inventory='.\pilots\chat-history\2026-10-13-hosted-catchup.inventory.json'
              $batch='.\pilots\chat-history\2026-10-13-hosted-catchup.batch.json'
              $plan=Invoke-PowerShellGuarded 'PLAN' '.\tools\backfill-plan.ps1' @('plan','-InventoryPath',$inventory)
              $p=$plan|ConvertFrom-Json
              if($p.status -cne 'ready' -or @($p.batches).Count -ne 1){throw 'POST_EVIDENCE_PLAN_BLOCKED'}
              New-Item -ItemType Directory '.mind-runtime' -Force | Out-Null
              $map=@{schema='mind-palace.backfill-collector-map.v1';version=1;batches=@(@{batch_id=[string]$p.batches[0].batch_id;collector_batch_path=[IO.Path]::GetFullPath((Join-Path $root 'pilots\chat-history\2026-10-13-hosted-catchup.batch.json'))})}
              $mapPath=Join-Path $root '.mind-runtime\hosted-map.json'
              [IO.File]::WriteAllText($mapPath,($map|ConvertTo-Json -Depth 10),[Text.Encoding]::UTF8)
              $d=Invoke-PowerShellGuarded 'DRY_RUN' '.\tools\backfill-cycle.ps1' @('dry-run','-InventoryPath',$inventory,'-CollectorMapPath',$mapPath)
              $preview=$d|ConvertFrom-Json
              if($preview.status -cne 'ready' -or -not [bool]$preview.ready_for_apply -or [int]$preview.counts.review -ne 0 -or [int]$preview.counts.supersede -ne 0){throw 'POST_EVIDENCE_CLASSIFICATION_BLOCKED'}
              $applied=Invoke-PowerShellGuarded 'BOUNDED_APPLY' '.\tools\backfill-apply.ps1' @('-InventoryPath',$inventory,'-CollectorMapPath',$mapPath,'-ConfirmApply')
              $result=$applied|ConvertFrom-Json
              if($result.schema -cne 'mind-palace.backfill-apply-result.v1' -or $result.status -cne 'applied' -or -not [bool]$result.parity -or -not [bool]$result.backfill_complete -or -not [bool]$result.git_commit_required){throw 'APPLY_ATTESTATION_INVALID'}
              $null=Invoke-PowerShellGuarded 'CHECKPOINT_VALIDATE' '.\tools\update-checkpoint.ps1' @('validate')
              $null=Invoke-PowerShellGuarded 'CHECKPOINT_COMMIT' '.\tools\update-checkpoint.ps1' @('commit','-Message','checkpoint: bounded Oct 13 operator decision catch-up','-ConfirmCheckpoint')
              $final=(& git.exe rev-parse HEAD|Out-String).Trim()
              $remoteFinal=(@(& git.exe ls-remote origin refs/heads/main)|Select-Object -First 1)
              if(([string]$remoteFinal).Split([char[]]@(" ","`t"),[System.StringSplitOptions]::RemoveEmptyEntries)[0] -cne $final){throw 'FINAL_REMOTE_SHA_MISMATCH'}
              if((& git.exe status --porcelain=v1|Out-String).Trim()){throw 'FINAL_WORKTREE_DIRTY'}
              Write-Host ('MIND_PALACE_CHECKPOINT_SHA='+$final)
              Write-Host 'MIND_PALACE_DURABLE_INGESTION=PASS'
              Write-Host 'MIND_PALACE_PARTIAL_COVERAGE_ONLY=TRUE'
              Write-Host 'CKB_PLANE_KTRADE_RESEARCH_MUTATED=FALSE'
            }finally {Pop-Location}
          }finally {
            if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue}
          }
