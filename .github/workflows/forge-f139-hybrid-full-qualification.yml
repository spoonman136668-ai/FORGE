name: FORGE F139 Hybrid source-only full regression
# Full exact-source acceptance for the existing native owner/SQLite/worker
# implementation. No research owner activation, secrets, runtime or scheduled task.
on:
  pull_request:
    branches: [main]
    paths:
      - 'f139/hybrid_owner_admission.py'
      - 'f139/local_controller.py'
      - 'f139/nci04_native_contract.py'
      - 'f139/nci04_native_worker.py'
      - 'f139/nci04_owner_issue.py'
      - 'f139/nci04_owner_ledger.py'
      - 'f139/nci04_autonomy_feed.py'
      - 'f139/verify_ticket.py'
      - 'f139/test_hybrid_owner_admission.py'
      - 'f139/test_hybrid_native_admission.py'
      - '.github/workflows/forge-f139-development-worker.yml'
      - '.github/workflows/forge-f139-hybrid-full-qualification.yml'
permissions:
  contents: read
jobs:
  full-exact-candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 36
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable PR candidate SHA and clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Complete native F139 Python regressions and compilation
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s f139 -p 'test_*.py' -v
          python -B -m compileall -q f139
      - name: Complete original Go tests without unrelated G145 benchmark selector
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
      - name: Linux original Go race regression
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 ./...
      - name: Preserve qualification boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "F139_HYBRID_OWNER_CANDIDATE_SOURCE=$(git rev-parse HEAD)"
          echo "F139_HYBRID_FULL_REGRESSION=PASS"
          echo "F139_HYBRID_ORIGINAL_OWNER_MIGRATION=NOT_EXECUTED"
          echo "F139_HYBRID_SCIENTIFIC_FIRST_USE=NOT_EXECUTED"
          echo "F139_HYBRID_MODEL_TRAINING=NOT_EXECUTED"
