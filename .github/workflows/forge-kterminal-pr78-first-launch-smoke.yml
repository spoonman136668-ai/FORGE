name: FORGE K-Terminal unified exact-artifact installed PAPER desktop acceptance
on:
  push:
    branches: [qualification/kterminal-rc2-timing-hosted-20261106]
    paths: [.github/workflows/forge-kterminal-pr78-first-launch-smoke.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: forge-kterminal-unified-disarmed-firstlaunch-cddbe6a6
  cancel-in-progress: false
jobs:
  first-launch:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      KTERM_SHA: cddbe6a6f8587d4f1699a36aabcd0f986a39692b
      KTERM_TREE: 801fde8794e262c81eac24e1ca04889e56bb3f79
      KTERM_QUALIFIED_RUN: '43397610217'
      KTERM_QUALIFIED_FORGE_SHA: b9360c95c4fa6c178e06e931ba60311daff6315d
      KTERM_ARTIFACT_ID: '14026016279'
      KTERM_INNER_ZIP_SHA256: 88c233b6bbd556bb9dd86a6b74ce24d8e2c5644f5bcd6b64d323fd0a1720b016
      KTERM_OUTER_ZIP_SHA256: 873cd98e50abfcfa757dfc87c07d390278fe48c0594c89ce59ed0be7e29b73d2
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_NATIVE_TIMING: '0'
      K_TERMINAL_P5_LATENCY: '0'
    steps:
      - name: Checkout existing FORGE qualification workflow without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Admit only this exact source-bound and no-broker Windows host action
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'spoonman136668-ai/FORGE'
          test "$GITHUB_REF" = 'refs/heads/qualification/kterminal-rc2-timing-hosted-20261106'
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD^)" = '877a0f0acd0456ff97311a4b8ef8450feb3ffeae'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/forge-kterminal-pr78-first-launch-smoke.yml'
          test -z "$(git status --porcelain)"
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          test "$K_TERMINAL_P5_LATENCY" = 0
          test "$K_TERMINAL_NATIVE_TIMING" = 0
          for name in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET KTERM_COINBASE_TEST_KEY_NAME KTERM_COINBASE_TEST_KEY_SECRET; do
            if [[ -n "$(printenv "$name" || true)" ]]; then echo KTERM_BROKER_CREDENTIAL_REFUSED; exit 2; fi
          done
          echo KTERM_UNIFIED_NATIVE_HOST_AND_SOURCE_SCOPE=PASS
      - name: Retrieve only qualified exact-SHA package and verify fresh extracted installation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'KTERM_UNIFIED_HOST_REFUSED'}
          $root=Join-Path $env:RUNNER_TEMP ('kterm-unified-firstlaunch-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_UNIFIED_STAGE_ALREADY_EXISTS'}
          [void][IO.Directory]::CreateDirectory($root)
          $headers=@{Authorization=('Bearer '+$env:GH_TOKEN);Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $run=Invoke-RestMethod -Uri ('https://api.github.com/repos/spoonman136668-ai/FORGE/actions/runs/'+$env:KTERM_QUALIFIED_RUN) -Headers $headers -Method Get
          if($run.conclusion -cne 'success' -or $run.head_sha -cne $env:KTERM_QUALIFIED_FORGE_SHA -or $run.run_attempt -ne 1){throw 'KTERM_UNIFIED_FULL_REGRESSION_RUN_NOT_QUALIFIED'}
          $jobs=Invoke-RestMethod -Uri ('https://api.github.com/repos/spoonman136668-ai/FORGE/actions/runs/'+$env:KTERM_QUALIFIED_RUN+'/jobs?per_page=100') -Headers $headers -Method Get
          $passing=@($jobs.jobs|Where-Object{$_.name -ceq 'K Terminal unified custody + first-use exact-source Windows qualification' -and $_.conclusion -ceq 'success'})
          if($passing.Count-ne1){throw 'KTERM_UNIFIED_FULL_REGRESSION_JOB_NOT_QUALIFIED'}
          foreach($name in @('Mandatory full exact-candidate Windows Go regression and vet','Assemble original eight binaries and independently verify first-use ZIP','Validate extracted package WPF windows offline without launching application','Test packaged compiled UI and bounded early startup failures','Fresh portable package first-use PAPER prelaunch smoke with bounded lifetime')){
            if(@($passing[0].steps|Where-Object{$_.name -ceq $name -and $_.conclusion -ceq 'success'}).Count-ne1){throw ('KTERM_UNIFIED_MISSING_PASS_STEP: '+$name)}
          }
          $outer=Join-Path $root 'qualified-artifact.zip'
          Invoke-WebRequest -Uri ('https://api.github.com/repos/spoonman136668-ai/FORGE/actions/artifacts/'+$env:KTERM_ARTIFACT_ID+'/zip') -Headers $headers -Method Get -MaximumRedirection 5 -OutFile $outer
          if((Get-FileHash -LiteralPath $outer -Algorithm SHA256).Hash.ToLowerInvariant()-cne $env:KTERM_OUTER_ZIP_SHA256){throw 'KTERM_UNIFIED_OUTER_ARTIFACT_SHA256_MISMATCH'}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $outerDir=Join-Path $root 'outer';[IO.Compression.ZipFile]::ExtractToDirectory($outer,$outerDir)
          $inner=Join-Path $outerDir 'K-Terminal-Disarmed-FirstUse-cddbe6a6f858.zip'
          $receipt=Join-Path $outerDir 'FIRST-USE-RECEIPT.json'
          if(-not[IO.File]::Exists($inner)-or-not[IO.File]::Exists($receipt)){throw 'KTERM_UNIFIED_ARTIFACT_MEMBERS_MISSING'}
          $r=Get-Content -LiteralPath $receipt -Raw|ConvertFrom-Json
          if($r.source_sha -cne $env:KTERM_SHA -or $r.source_tree -cne $env:KTERM_TREE -or $r.archive_sha256 -cne $env:KTERM_INNER_ZIP_SHA256 -or $r.files-ne73 -or $r.binaries-ne8 -or $r.roundtrip -cne 'PASS'){throw 'KTERM_UNIFIED_RECEIPT_IDENTITY_DRIFT'}
          if((Get-FileHash -LiteralPath $inner -Algorithm SHA256).Hash.ToLowerInvariant()-cne $env:KTERM_INNER_ZIP_SHA256){throw 'KTERM_UNIFIED_INNER_ARTIFACT_SHA256_MISMATCH'}
          $unpack=Join-Path $root 'source';[IO.Compression.ZipFile]::ExtractToDirectory($inner,$unpack)
          $m=Get-Content -LiteralPath (Join-Path $unpack 'FIRST-USE-MANIFEST.json') -Raw|ConvertFrom-Json
          if($m.source_sha -cne $env:KTERM_SHA -or $m.source_tree -cne $env:KTERM_TREE -or $m.default_authority -cne 'DISARMED' -or $m.live_trading_authorized -or $m.binary_count-ne8 -or @($m.files).Count-ne73){throw 'KTERM_UNIFIED_MANIFEST_REFUSED'}
          if(Test-Path -LiteralPath (Join-Path $unpack 'config.json')){throw 'KTERM_UNIFIED_CREDENTIAL_CONFIG_FOUND'}
          if(Test-Path -LiteralPath (Join-Path $unpack 'data')){throw 'KTERM_UNIFIED_ACCOUNT_STATE_FOUND'}
          $target=Join-Path $env:RUNNER_TEMP 'kterm-pr78-real-first-launch'
          if(Test-Path -LiteralPath $target){throw 'KTERM_UNIFIED_EXISTING_INSTALL_REFUSED'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File (Join-Path $unpack 'INSTALL-KTerminal.ps1') -SourceRoot $unpack -Destination $target -NoLaunch *> (Join-Path $root 'private-install.log')
          if($LASTEXITCODE-ne0){throw 'KTERM_UNIFIED_FRESH_INSTALL_FAILED'}
          foreach($required in @('K-Terminal.exe','K-Terminal-Engine.exe','KTerminal.UI.dll','ui-runtime-manifest.json')){
            if(-not[IO.File]::Exists((Join-Path $target $required))){throw 'KTERM_UNIFIED_INSTALLED_MEMBER_MISSING'}
          }
          if(Test-Path -LiteralPath (Join-Path $target 'config.json')){throw 'KTERM_UNIFIED_INSTALLED_CREDENTIAL_REFUSED'}
          $dll=Join-Path $target 'KTerminal.UI.dll'
          Set-Content -LiteralPath $dll -Stream Zone.Identifier -Value ('[ZoneTransfer]'+[Environment]::NewLine+'ZoneId=3') -ErrorAction Stop
          $expect=@($m.files|Where-Object{$_.path -ceq 'KTerminal.UI.dll'})
          if($expect.Count-ne1 -or (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()-cne [string]$expect[0].sha256){throw 'KTERM_UNIFIED_UI_ASSEMBLY_SHA_MISMATCH'}
          Write-Host 'KTERM_UNIFIED_EXACT_PACKAGE_FRESH_INSTALL=PASS;QUALIFIED_RUN=43397610217;SOURCE=cddbe6a6f858;LIVE_ORDERS=0'
      - name: Actually start installed K-Terminal.exe and verify visible prelaunch window
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:RUNNER_TEMP 'kterm-pr78-real-first-launch'
          if(-not(Test-Path -LiteralPath (Join-Path $target 'K-Terminal.exe'))){throw 'KTERM_UNIFIED_INSTALLED_LAUNCHER_MISSING'}
          if(Test-Path -LiteralPath (Join-Path $target 'config.json')){throw 'KTERM_UNIFIED_UNEXPECTED_LIVE_CONFIG'}
          $launcher=Start-Process -FilePath (Join-Path $target 'K-Terminal.exe') -WorkingDirectory $target -PassThru
          if($null -eq $launcher){throw 'KTERM_UNIFIED_REAL_LAUNCH_FAILED'}
          $visible=$false
          $sw=[Diagnostics.Stopwatch]::StartNew()
          try {
            while($sw.Elapsed.TotalSeconds -lt 35){
              Start-Sleep -Milliseconds 650
              $launcher.Refresh()
              if($launcher.HasExited){throw 'KTERM_UNIFIED_LAUNCHER_EXITED_BEFORE_PRELAUNCH_UI'}
              $status=Join-Path $target 'data\logs\desktop-startup-status.txt'
              if([IO.File]::Exists($status)){throw 'KTERM_UNIFIED_REAL_STARTUP_REPORTED_UI_FAILURE'}
              # Confirm any window belongs to this launcher's owned process tree.
              $procs=@(Get-CimInstance Win32_Process -ErrorAction Stop | Select-Object ProcessId,ParentProcessId)
              $owned=New-Object 'System.Collections.Generic.HashSet[int]'
              $null=$owned.Add([int]$launcher.Id)
              for($round=0;$round -lt 7;$round++){
                foreach($p in $procs){
                  if($owned.Contains([int]$p.ParentProcessId)){$null=$owned.Add([int]$p.ProcessId)}
                }
              }
              foreach($p in @(Get-Process -Name powershell -ErrorAction SilentlyContinue)){
                if($owned.Contains([int]$p.Id) -and $p.MainWindowTitle -ceq 'K-Terminal v1.1.5 Launch'){
                  $visible=$true
                  break
                }
              }
              if($visible){break}
            }
            if(-not$visible){throw 'KTERM_UNIFIED_PRELAUNCH_WINDOW_NOT_OBSERVED'}
            if(Test-Path -LiteralPath (Join-Path $target 'data\.application-launch-session.json')){throw 'KTERM_UNIFIED_UNEXPECTED_SESSION_ACTIVATION'}
            if(Test-Path -LiteralPath (Join-Path $target 'data\native-runtime')){throw 'KTERM_UNIFIED_UNEXPECTED_ENGINE_START'}
            Write-Host 'KTERM_UNIFIED_INSTALLED_REAL_PRELAUNCH_WINDOW=PASS;DASHBOARD_NOT_ACTIVATED;BROKER_ORDERS=0'
          }
          finally {
            try {
              $launcher.Refresh()
              if(-not$launcher.HasExited){
                Stop-Process -Id $launcher.Id -Force -ErrorAction Stop
                [void]$launcher.WaitForExit(10000)
              }
            } finally { $launcher.Dispose() }
          }
      - name: Choose PAPER via native Windows UI Automation and verify the real dashboard
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:RUNNER_TEMP 'kterm-pr78-real-first-launch'
          if(-not[IO.File]::Exists((Join-Path $target 'K-Terminal.exe'))){throw 'KTERM_UNIFIED_REAL_DASHBOARD_INSTALL_MISSING'}
          if([IO.File]::Exists((Join-Path $target 'config.json'))){throw 'KTERM_UNIFIED_BROKER_CONFIG_REFUSED'}
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes
          $root=[Windows.Automation.AutomationElement]::RootElement
          $tree=[Windows.Automation.TreeScope]::Children
          $desc=[Windows.Automation.TreeScope]::Descendants
          $idProperty=[Windows.Automation.AutomationElement]::AutomationIdProperty
          $nameProperty=[Windows.Automation.AutomationElement]::NameProperty
          $launcher=Start-Process -FilePath (Join-Path $target 'K-Terminal.exe') -WorkingDirectory $target -PassThru
          if($null-eq$launcher){throw 'KTERM_UNIFIED_REAL_DASHBOARD_LAUNCHER_MISSING'}
          function OwnedProcesses {
            $rows=@(Get-CimInstance Win32_Process -ErrorAction Stop | Select-Object ProcessId,ParentProcessId)
            $owned=New-Object 'System.Collections.Generic.HashSet[int]'
            $null=$owned.Add([int]$launcher.Id)
            for($round=0;$round-lt8;$round++){foreach($p in $rows){if($owned.Contains([int]$p.ParentProcessId)){$null=$owned.Add([int]$p.ProcessId)}}}
            return ,$owned
          }
          function FindOwnedWindow([string]$title){
            $win=$root.FindFirst($tree,[Windows.Automation.PropertyCondition]::new($nameProperty,$title))
            if($null-eq$win){return $null}
            $owned=OwnedProcesses
            if(-not$owned.Contains([int]$win.Current.ProcessId)){throw 'KTERM_UNIFIED_FOREIGN_WINDOW_REFUSED'}
            return $win
          }
          $clock=[Diagnostics.Stopwatch]::StartNew()
          try {
            $prelaunch=$null
            while($clock.Elapsed.TotalSeconds-lt35){
              $launcher.Refresh()
              if($launcher.HasExited){throw 'KTERM_UNIFIED_PRELAUNCH_EXITED_EARLY'}
              $prelaunch=FindOwnedWindow 'K-Terminal v1.1.5 Launch'
              if($null-ne$prelaunch){break}
              Start-Sleep -Milliseconds 500
            }
            if($null-eq$prelaunch){throw 'KTERM_UNIFIED_PRELAUNCH_UIA_NOT_FOUND'}
            $paper=$prelaunch.FindFirst($desc,[Windows.Automation.PropertyCondition]::new($idProperty,'PaperMode'))
            if($null-eq$paper){$paper=$prelaunch.FindFirst($desc,[Windows.Automation.PropertyCondition]::new($nameProperty,'PAPER TEST'))}
            if($null-eq$paper){throw 'KTERM_UNIFIED_PAPER_SELECTION_NOT_FOUND'}
            if(-not$paper.Current.IsEnabled){throw 'KTERM_UNIFIED_PAPER_SELECTION_DISABLED'}
            $paper.GetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern).Select()
            Start-Sleep -Milliseconds 350
            $launch=$prelaunch.FindFirst($desc,[Windows.Automation.PropertyCondition]::new($idProperty,'ContinueButton'))
            if($null-eq$launch){$launch=$prelaunch.FindFirst($desc,[Windows.Automation.PropertyCondition]::new($nameProperty,'LAUNCH'))}
            if($null-eq$launch-or-not$launch.Current.IsEnabled){throw 'KTERM_UNIFIED_PAPER_LAUNCH_CONTROL_NOT_READY'}
            $launch.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke()
            $dashboard=$null
            $clock.Restart()
            while($clock.Elapsed.TotalSeconds-lt80){
              $launcher.Refresh()
              if($launcher.HasExited){throw 'KTERM_UNIFIED_DASHBOARD_PROCESS_EXITED'}
              if([IO.File]::Exists((Join-Path $target 'data\logs\desktop-startup-status.txt'))){throw 'KTERM_UNIFIED_DASHBOARD_STARTUP_ERROR'}
              $session=Join-Path $target 'data\.application-launch-session.json'
              if([IO.File]::Exists($session)){
                $state=Get-Content -LiteralPath $session -Raw | ConvertFrom-Json
                if($state.mode-cne'PAPER'-or$state.execution_state-cne'DISARMED'){throw 'KTERM_UNIFIED_DASHBOARD_WRONG_MODE_OR_ARMED'}
              }
              $dashboard=FindOwnedWindow 'K-Terminal v1.1.5 - DASHBOARD'
              if($null-ne$dashboard -and [IO.File]::Exists($session)){break}
              Start-Sleep -Milliseconds 600
            }
            if($null-eq$dashboard){throw 'KTERM_UNIFIED_DASHBOARD_WINDOW_NOT_OBSERVED'}
            Start-Sleep -Seconds 5
            $launcher.Refresh()
            if($launcher.HasExited){throw 'KTERM_UNIFIED_DASHBOARD_NOT_STABLE'}
            if($null-eq(FindOwnedWindow 'K-Terminal v1.1.5 - DASHBOARD')){throw 'KTERM_UNIFIED_DASHBOARD_WINDOW_DISAPPEARED'}
            if([IO.File]::Exists((Join-Path $target 'config.json'))){throw 'KTERM_UNIFIED_DASHBOARD_CREATED_LIVE_CONFIG'}
            if([IO.Directory]::Exists((Join-Path $target 'data\native-runtime'))){throw 'KTERM_UNIFIED_DASHBOARD_STARTED_LIVE_ENGINE'}
            Write-Host 'KTERM_UNIFIED_REAL_PAPER_DASHBOARD_VISIBLE_STABLE=PASS;DISARMED=TRUE;BROKER_ORDERS=0'
          } finally {
            try {
              $launcher.Refresh()
              if(-not$launcher.HasExited){
                Stop-Process -Id $launcher.Id -Force -ErrorAction Stop
                [void]$launcher.WaitForExit(10000)
              }
            } finally { $launcher.Dispose() }
          }
      - name: Sanitize disposition and clean only ephemeral run-owned artifacts
        if: always()
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP ('kterm-unified-firstlaunch-'+$env:GITHUB_RUN_ID)
          $install=Join-Path $env:RUNNER_TEMP 'kterm-pr78-real-first-launch'
          foreach($path in @($root,$install)){
            $scope=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')+'\'
            $full=[IO.Path]::GetFullPath($path)
            if($full.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -and $full -ne $scope.TrimEnd('\')){
              if([IO.Directory]::Exists($full)){try{Remove-Item -LiteralPath $full -Recurse -Force -ErrorAction Stop}catch{Write-Host 'KTERM_UNIFIED_EPHEMERAL_CLEANUP_INCOMPLETE'}}
            }
          }
          Write-Host 'KTERM_UNIFIED_DESKTOP_ACCEPTANCE_FINISHED;BROKER_REQUESTS=0;NO_OWNER_INSTALL=TRUE'
