name: FORGE K-Terminal PR78 exact-source installed first-launch smoke
on:
  push:
    branches: [qualification/kterminal-rc2-timing-hosted-20261106]
    paths: [.github/workflows/forge-kterminal-pr78-first-launch-smoke.yml]
permissions:
  contents: read
concurrency:
  group: forge-kterminal-pr78-installed-first-launch-once
  cancel-in-progress: false
jobs:
  first-launch:
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      FORGE_BASE: 64564eda2fb9d479dd936a1420f206d22e422e50
      KTERM_SHA: 957b917b22083f1ae03f35377c60b48b66b689a3
      KTERM_TREE: b8479246aa3d0433bdb980732d6dcd6f85ab4c39
      QUALIFIED_RUN: 'UNVERIFIED_NEW_HEAD'
      QUALIFIED_FORGE_SHA: 848aff4f37e6d01cb050f8403bac24f4088e7815
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_NATIVE_TIMING: '0'
      K_TERMINAL_P5_LATENCY: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
    steps:
      - name: Checkout existing FORGE qualification branch without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify one-file workflow change and retained qualified source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'spoonman136668-ai/FORGE'
          test "$GITHUB_REF" = 'refs/heads/qualification/kterminal-rc2-timing-hosted-20261106'
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$QUALIFIED_FORGE_SHA" HEAD
          test "$(git rev-list --count "$QUALIFIED_FORGE_SHA"..HEAD)" = 1
          test "$(git diff --name-only "$QUALIFIED_FORGE_SHA" HEAD)" = '.github/workflows/forge-kterminal-pr78-first-launch-smoke.yml'
          actual="$(git diff --name-only "$FORGE_BASE" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/workflows/forge-kterminal-rc2-focused-negative-20261106.yml' '.github/workflows/forge-kterminal-rc2-timing-exact-sha.yml' '.github/workflows/forge-kterminal-pr78-first-launch-smoke.yml' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"
          echo KTERM_PR78_STARTUP_SCOPE=PASS
      - name: Checkout previously qualified private K-Terminal source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: 957b917b22083f1ae03f35377c60b48b66b689a3
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Set up original pinned Windows Go 1.26.5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify exact private SHA and zero broker authority
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$KTERM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$KTERM_TREE"
          test -z "$(git status --porcelain)"
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          test ! -e config.json
          test ! -e .env
          test ! -d data
          go version | grep -F 'go1.26.5 windows/amd64' > /dev/null
          for name in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET KTERM_COINBASE_TEST_KEY_NAME KTERM_COINBASE_TEST_KEY_SECRET K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK; do
            if [[ -n "$(printenv "$name" || true)" ]]; then echo KTERM_PR78_BROKER_AUTHORITY_REFUSED; exit 2; fi
          done
          echo KTERM_PR78_EXACT_SOURCE_DISARMED=PASS
      - name: Focused source-inactive fail-closed and exact-config Coinbase audit diagnostics
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          go test -p 1 -count=1 -timeout 15m -run '^(TestUnarmed|TestCoinbaseCold|TestCoinbaseLegacy|TestLegacyObservation|TestBrokerHistory|TestBrokerOnlyAudit|TestUnarmedBrokerAudit)' ./pkg > "$RUNNER_TEMP/kterm-pr78-broker-display-focused-private.log" 2>&1
          echo KTERM_PR78_BROKER_OBSERVER_FOCUSED_NEGATIVES=PASS
      - name: Mandatory full exact-head Windows regression and vet
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kterm-pr78-broker-display-isolation"
          mkdir -p "$root/tail" "$root/post" "$root/private"
          export K_TERMINAL_TEST_WORKSPACE="$root"
          export KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT="$root/tail"
          export KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT="$root/post"
          export KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT="$root/private"
          go test -p 1 -count=1 -timeout 60m ./... > "$RUNNER_TEMP/kterm-pr78-broker-display-full-private.log" 2>&1
          go vet ./... > "$RUNNER_TEMP/kterm-pr78-broker-display-vet-private.log" 2>&1
          echo KTERM_PR78_BROKER_OBSERVER_FULL_REGRESSION_VET=PASS
      - name: Build private desktop and install only into ephemeral isolated folder
        shell: pwsh
        working-directory: kterminal-private
        run: |
          $ErrorActionPreference='Stop'
          $privateRoot=Join-Path $env:GITHUB_WORKSPACE 'kterminal-private'
          $log=Join-Path $env:RUNNER_TEMP 'kterm-pr78-launch-build-private.log'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File (Join-Path $privateRoot 'BUILD.ps1') *> $log
          if($LASTEXITCODE -ne 0){throw 'KTERM_PR78_STARTUP_REBUILD_FAILED'}
          $uiOut=Join-Path $env:RUNNER_TEMP 'kterm-pr78-zonefix-ui-proof'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File (Join-Path $privateRoot 'verification\test-ui-runtime.ps1') -Root $privateRoot -OutputDirectory $uiOut *> (Join-Path $env:RUNNER_TEMP 'kterm-pr78-zonefix-ui-test-private.log')
          if($LASTEXITCODE -ne 0){
            $privateLog=Join-Path $env:RUNNER_TEMP 'kterm-pr78-zonefix-ui-test-private.log'
            $evidence=if([IO.File]::Exists($privateLog)){[IO.File]::ReadAllText($privateLog)}else{''}
            $digest=if([IO.File]::Exists($privateLog)){(Get-FileHash -LiteralPath $privateLog -Algorithm SHA256).Hash.ToLowerInvariant()}else{'MISSING'}
            $categories=[ordered]@{
              SOURCE_MUTATED='(?i)(stale assembly was loaded|stale source|source hash|source drift)'
              INVALID_HASH='(?i)(integrity check failed|corrupt UI assembly)'
              REMOTE_ZONE='(?i)(not supported|0x80131515|loadfrom|remote|internet|zone)'
              STREAM_UNSUPPORTED='(?i)(parameter.*stream|stream.*parameter|named.*stream)'
              TYPE_LOAD='(?i)(unable to find type|type.*not found|could not load type)'
              MARKUP='(?i)(markup|theme|prelaunch shading|button)'
              ZONE_REGRESSION='(?i)(Internet-marked verified UI assembly failed)'
              POWERSHELL_SYNTAX='(?i)(ParserError|ParseException|UnexpectedToken)'
              FILE_ACCESS='(?i)(Access to the path|access denied|UnauthorizedAccessException)'
              FILE_MISSING='(?i)(cannot find path|not found|FileNotFoundException)'
            }
            $classes=@($categories.Keys|Where-Object{$evidence-match$categories[$_]})
            if($classes.Count-eq0){$classes=@('UNCLASSIFIED')}
            Write-Host ('KTERM_PR78_UI_TEST_PRIVATE_LOG_SHA256='+$digest)
            Write-Host ('KTERM_PR78_UI_TEST_FAILURE_CLASSES='+($classes -join ','))
            $scriptLines=[regex]::Matches($evidence,'(?i)test-ui-runtime\.ps1:(\d{1,3})')
            $lineNos=@($scriptLines|ForEach-Object{[int]$_.Groups[1].Value}|Sort-Object -Unique)
            Write-Host ('KTERM_PR78_UI_TEST_SCRIPT_LINES='+($lineNos -join ','))
            throw 'KTERM_PR78_DOWNLOADED_DLL_REGRESSION_FAILED'
          }
          $stage=Join-Path $env:RUNNER_TEMP 'kterm-pr78-launch-package'
          $zip=Join-Path $env:RUNNER_TEMP 'kterm-pr78-launch-private.zip'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $privateRoot 'verification\package-first-install.ps1') -SourceRoot $privateRoot -StageDirectory $stage -ZipPath $zip *> (Join-Path $env:RUNNER_TEMP 'kterm-pr78-launch-package-private.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_PR78_STARTUP_PACKAGING_FAILED'}
          $extracted=Join-Path $env:RUNNER_TEMP 'kterm-pr78-extracted-from-zip'
          Expand-Archive -LiteralPath $zip -DestinationPath $extracted -ErrorAction Stop
          $sourceDLL=Join-Path $extracted 'KTerminal.UI.dll'
          Set-Content -LiteralPath $sourceDLL -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" -ErrorAction Stop
          if($null-eq(Get-Item -LiteralPath $sourceDLL -Stream Zone.Identifier -ErrorAction Stop)){throw 'KTERM_PR78_ZONE_FIXTURE_MISSING'}
          $target=Join-Path $env:RUNNER_TEMP 'kterm-pr78-real-first-launch'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $extracted 'INSTALL-KTerminal.ps1') -SourceRoot $extracted -Destination $target -NoLaunch *> (Join-Path $env:RUNNER_TEMP 'kterm-pr78-launch-install-private.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_PR78_STARTUP_INSTALL_FAILED'}
          if(Test-Path -LiteralPath (Join-Path $target 'config.json')){throw 'KTERM_PR78_STARTUP_UNEXPECTED_CONFIG'}
          $installedDll=Join-Path $target 'KTerminal.UI.dll'
          $manifest=Get-Content -LiteralPath (Join-Path $target 'ui-runtime-manifest.json') -Raw | ConvertFrom-Json
          if((Get-FileHash -LiteralPath $installedDll -Algorithm SHA256).Hash.ToLowerInvariant()-cne[string]$manifest.sha256){throw 'KTERM_PR78_INSTALLED_UI_HASH_INVALID'}
          # Reapply an Internet zone after installation: the runtime loader must
          # still recover, even when a user runs the extracted app directly.
          Set-Content -LiteralPath $installedDll -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" -ErrorAction Stop
          Write-Host 'KTERM_PR78_REBUILT_FRESH_INSTALL=PASS;LIVE_ORDERS=0'
      - name: Actually start installed K-Terminal.exe and verify visible prelaunch window
        shell: pwsh
        working-directory: kterminal-private
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:RUNNER_TEMP 'kterm-pr78-real-first-launch'
          if(-not(Test-Path -LiteralPath (Join-Path $target 'K-Terminal.exe'))){throw 'KTERM_PR78_INSTALLED_LAUNCHER_MISSING'}
          if(Test-Path -LiteralPath (Join-Path $target 'config.json')){throw 'KTERM_PR78_UNEXPECTED_LIVE_CONFIG'}
          $launcher=Start-Process -FilePath (Join-Path $target 'K-Terminal.exe') -WorkingDirectory $target -PassThru
          if($null -eq $launcher){throw 'KTERM_PR78_REAL_LAUNCH_FAILED'}
          $visible=$false
          $sw=[Diagnostics.Stopwatch]::StartNew()
          try {
            while($sw.Elapsed.TotalSeconds -lt 35){
              Start-Sleep -Milliseconds 650
              $launcher.Refresh()
              if($launcher.HasExited){throw 'KTERM_PR78_LAUNCHER_EXITED_BEFORE_PRELAUNCH_UI'}
              $status=Join-Path $target 'data\logs\desktop-startup-status.txt'
              if([IO.File]::Exists($status)){throw 'KTERM_PR78_REAL_STARTUP_REPORTED_UI_FAILURE'}
              # Confirm any window belongs to this launcher's owned process tree.
              $procs=@(Get-CimInstance Win32_Process -ErrorAction Stop | Select-Object ProcessId,ParentProcessId)
              $owned=New-Object 'System.Collections.Generic.HashSet[int]'
              $null=$owned.Add([int]$launcher.Id)
              for($round=0;$round -lt 7;$round++){
                foreach($p in $procs){
                  if($owned.Contains([int]$p.ParentProcessId)){$null=$owned.Add([int]$p.ProcessId)}
                }
              }
              foreach($p in @(Get-Process -Name powershell -ErrorAction SilentlyContinue)){
                if($owned.Contains([int]$p.Id) -and $p.MainWindowTitle -ceq 'K-Terminal v1.1.5 Launch'){
                  $visible=$true
                  break
                }
              }
              if($visible){break}
            }
            if(-not$visible){throw 'KTERM_PR78_PRELAUNCH_WINDOW_NOT_OBSERVED'}
            if(Test-Path -LiteralPath (Join-Path $target 'data\.application-launch-session.json')){throw 'KTERM_PR78_UNEXPECTED_SESSION_ACTIVATION'}
            if(Test-Path -LiteralPath (Join-Path $target 'data\native-runtime')){throw 'KTERM_PR78_UNEXPECTED_ENGINE_START'}
            Write-Host 'KTERM_PR78_INSTALLED_REAL_PRELAUNCH_WINDOW=PASS;DASHBOARD_NOT_ACTIVATED;BROKER_ORDERS=0'
          }
          finally {
            try {
              $launcher.Refresh()
              if(-not$launcher.HasExited){
                Stop-Process -Id $launcher.Id -Force -ErrorAction Stop
                [void]$launcher.WaitForExit(10000)
              }
            } finally { $launcher.Dispose() }
          }
      - name: Choose PAPER via native Windows UI Automation and verify the real dashboard
        shell: pwsh
        working-directory: kterminal-private
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:RUNNER_TEMP 'kterm-pr78-real-first-launch'
          if(-not[IO.File]::Exists((Join-Path $target 'K-Terminal.exe'))){throw 'KTERM_PR78_REAL_DASHBOARD_INSTALL_MISSING'}
          if([IO.File]::Exists((Join-Path $target 'config.json'))){throw 'KTERM_PR78_BROKER_CONFIG_REFUSED'}
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes
          $root=[Windows.Automation.AutomationElement]::RootElement
          $tree=[Windows.Automation.TreeScope]::Children
          $desc=[Windows.Automation.TreeScope]::Descendants
          $idProperty=[Windows.Automation.AutomationElement]::AutomationIdProperty
          $nameProperty=[Windows.Automation.AutomationElement]::NameProperty
          $launcher=Start-Process -FilePath (Join-Path $target 'K-Terminal.exe') -WorkingDirectory $target -PassThru
          if($null-eq$launcher){throw 'KTERM_PR78_REAL_DASHBOARD_LAUNCHER_MISSING'}
          function OwnedProcesses {
            $rows=@(Get-CimInstance Win32_Process -ErrorAction Stop | Select-Object ProcessId,ParentProcessId)
            $owned=New-Object 'System.Collections.Generic.HashSet[int]'
            $null=$owned.Add([int]$launcher.Id)
            for($round=0;$round-lt8;$round++){foreach($p in $rows){if($owned.Contains([int]$p.ParentProcessId)){$null=$owned.Add([int]$p.ProcessId)}}}
            return ,$owned
          }
          function FindOwnedWindow([string]$title){
            $win=$root.FindFirst($tree,[Windows.Automation.PropertyCondition]::new($nameProperty,$title))
            if($null-eq$win){return $null}
            $owned=OwnedProcesses
            if(-not$owned.Contains([int]$win.Current.ProcessId)){throw 'KTERM_PR78_FOREIGN_WINDOW_REFUSED'}
            return $win
          }
          $clock=[Diagnostics.Stopwatch]::StartNew()
          try {
            $prelaunch=$null
            while($clock.Elapsed.TotalSeconds-lt35){
              $launcher.Refresh()
              if($launcher.HasExited){throw 'KTERM_PR78_PRELAUNCH_EXITED_EARLY'}
              $prelaunch=FindOwnedWindow 'K-Terminal v1.1.5 Launch'
              if($null-ne$prelaunch){break}
              Start-Sleep -Milliseconds 500
            }
            if($null-eq$prelaunch){throw 'KTERM_PR78_PRELAUNCH_UIA_NOT_FOUND'}
            $paper=$prelaunch.FindFirst($desc,[Windows.Automation.PropertyCondition]::new($idProperty,'PaperMode'))
            if($null-eq$paper){$paper=$prelaunch.FindFirst($desc,[Windows.Automation.PropertyCondition]::new($nameProperty,'PAPER TEST'))}
            if($null-eq$paper){throw 'KTERM_PR78_PAPER_SELECTION_NOT_FOUND'}
            if(-not$paper.Current.IsEnabled){throw 'KTERM_PR78_PAPER_SELECTION_DISABLED'}
            $paper.GetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern).Select()
            Start-Sleep -Milliseconds 350
            $launch=$prelaunch.FindFirst($desc,[Windows.Automation.PropertyCondition]::new($idProperty,'ContinueButton'))
            if($null-eq$launch){$launch=$prelaunch.FindFirst($desc,[Windows.Automation.PropertyCondition]::new($nameProperty,'LAUNCH'))}
            if($null-eq$launch-or-not$launch.Current.IsEnabled){throw 'KTERM_PR78_PAPER_LAUNCH_CONTROL_NOT_READY'}
            $launch.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke()
            $dashboard=$null
            $clock.Restart()
            while($clock.Elapsed.TotalSeconds-lt80){
              $launcher.Refresh()
              if($launcher.HasExited){throw 'KTERM_PR78_DASHBOARD_PROCESS_EXITED'}
              if([IO.File]::Exists((Join-Path $target 'data\logs\desktop-startup-status.txt'))){throw 'KTERM_PR78_DASHBOARD_STARTUP_ERROR'}
              $session=Join-Path $target 'data\.application-launch-session.json'
              if([IO.File]::Exists($session)){
                $state=Get-Content -LiteralPath $session -Raw | ConvertFrom-Json
                if($state.mode-cne'PAPER'-or$state.execution_state-cne'DISARMED'){throw 'KTERM_PR78_DASHBOARD_WRONG_MODE_OR_ARMED'}
              }
              $dashboard=FindOwnedWindow 'K-Terminal v1.1.5 - DASHBOARD'
              if($null-ne$dashboard -and [IO.File]::Exists($session)){break}
              Start-Sleep -Milliseconds 600
            }
            if($null-eq$dashboard){throw 'KTERM_PR78_DASHBOARD_WINDOW_NOT_OBSERVED'}
            Start-Sleep -Seconds 5
            $launcher.Refresh()
            if($launcher.HasExited){throw 'KTERM_PR78_DASHBOARD_NOT_STABLE'}
            if($null-eq(FindOwnedWindow 'K-Terminal v1.1.5 - DASHBOARD')){throw 'KTERM_PR78_DASHBOARD_WINDOW_DISAPPEARED'}
            if([IO.File]::Exists((Join-Path $target 'config.json'))){throw 'KTERM_PR78_DASHBOARD_CREATED_LIVE_CONFIG'}
            if([IO.Directory]::Exists((Join-Path $target 'data\native-runtime'))){throw 'KTERM_PR78_DASHBOARD_STARTED_LIVE_ENGINE'}
            Write-Host 'KTERM_PR78_REAL_PAPER_DASHBOARD_VISIBLE_STABLE=PASS;DISARMED=TRUE;BROKER_ORDERS=0'
          } finally {
            try {
              $launcher.Refresh()
              if(-not$launcher.HasExited){
                Stop-Process -Id $launcher.Id -Force -ErrorAction Stop
                [void]$launcher.WaitForExit(10000)
              }
            } finally { $launcher.Dispose() }
          }
      - name: Write sanitized first-launch disposition only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo KTERM_PR78_STARTUP_PROBE_FINISHED
          echo KTERM_SOURCE_SHA="$KTERM_SHA"
          echo QUALIFIED_SOURCE_RUN="$QUALIFIED_RUN"
          echo KTERM_LIVE_ORDERS=0
          echo KTERM_PRIVATE_LOGS_AND_BINARIES_NOT_PUBLISHED
