name: ITD-02 MG17-C authentic original local-consequence seven-arm trial
on:
  push:
    branches: [research/itd02-mg17c-original-world-local-effect-20261029]
permissions:
  contents: read
jobs:
  original-farama-native-and-independent-conventional:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Exact original source LF mode
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact original research source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Original Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Native Go 1.25.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Independently execute complete original public seven-arm development trial twice
        shell: bash
        run: bash research/lcrm01/mg17c_ci.sh
      - name: Retain complete authentic source events even for negative results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-mg17c-native-local-original-world-development-evidence
          path: |
            ${{ runner.temp }}/mg17c/first.json
            ${{ runner.temp }}/mg17c/second.json
            ${{ runner.temp }}/mg17c/comparison.json
            ${{ runner.temp }}/mg17c/first.log
            ${{ runner.temp }}/mg17c/second.log
          retention-days: 30
          if-no-files-found: warn
