name: MP-AI05 source-only paired constructor unit qualification
on:
  push:
    branches: [qualification/mpai05-offline-private-proof-20261027]
    paths:
      - '.github/workflows/mpai05-private-pair-source-tests.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 6
    steps:
      - name: Verify pinned private source and run synthetic tests without holdout access
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_CREDENTIAL_INTERACTIVE: 'never'
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
              $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE') {throw 'MPAI05_BAD_TEST_RUNNER'}
          $scratch=Join-Path $env:RUNNER_TEMP ('mpai05-pair-unit-'+$env:GITHUB_RUN_ID)
          $root=Join-Path $scratch 'source'
          try {
            New-Item -ItemType Directory -Path $scratch -ErrorAction Stop | Out-Null
            & git clone --quiet --single-branch --branch proposal/mpai05-paired-retrieval-construction-20261027 'https://github.com/spoonman136668-ai/Mind-Palace.git' $root *> (Join-Path $scratch 'private-clone.log')
            if($LASTEXITCODE -ne 0){throw 'MPAI05_TEST_SOURCE_UNAVAILABLE'}
            if((& git -C $root rev-parse HEAD).Trim() -cne '1517cdc39cc6696f2e51d8a1f31084cd457ab191'){
              throw 'MPAI05_TEST_SOURCE_SHA_DRIFT'
            }
            $log=Join-Path $scratch 'private-synthetic-unit.log'
            Push-Location $root
            try {
              & python -B -m unittest discover -s tests -p test_mpai05_construct_pairs.py -v *> $log
              $exit=$LASTEXITCODE
            } finally {Pop-Location}
            $raw=[IO.File]::ReadAllText($log)
            if($exit -ne 0){throw 'MPAI05_PAIR_SOURCE_TEST_FAILED'}
            $m=[regex]::Match($raw,'Ran ([0-9]{1,2}) tests? in')
            if(-not $m.Success -or [int]$m.Groups[1].Value -ne 11){throw 'MPAI05_UNIT_COUNT_MISMATCH'}
            if($raw -notmatch '(?m)^OK\s*$'){throw 'MPAI05_UNIT_TERMINAL_NOT_OK'}
            $dirty=@(& git -C $root status --porcelain --untracked-files=all)
            if($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0){throw 'MPAI05_UNIT_SOURCE_MUTATED'}
            Write-Host 'MPAI05_PRIVATE_PAIR_UNIT_TESTS=11_PASS'
            Write-Host 'MPAI05_PRIVATE_PAIR_SOURCE_PIN=PASS'
            Write-Host 'MPAI05_PRIVATE_PAIR_SOURCE_CLEAN=TRUE'
            Write-Host 'MPAI05_PRIVATE_HOLDOUT_READ=FALSE'
            Write-Host 'MPAI05_MODEL_CALLS=0'
            Write-Host 'MPAI05_PRIVATE_LOG_EXPORTED=FALSE'
          } finally {
            Set-Location $env:RUNNER_TEMP
            if(Test-Path -LiteralPath $scratch){Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction Stop}
          }
