name: FORGE R30 owner predecision original first-use qualification
on:
  push:
    branches: [engineering/r30-owner-predecision-firstuse-20261015-r1]
permissions:
  contents: read
concurrency:
  group: forge-r30-owner-predecision-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Qualify cryptographic owner predecision, original first-use, no replay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          go test -count=1 ./originalclaim ./workerreconcile
      - name: Full Go regression and race, vet and build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
      - name: Explicit limit of tested native first-use hook
        shell: bash
        run: |
          echo 'R30_NATIVE_OWNER_PREDECISION_HOOK=QUALIFIED_CODE_ONLY'
          echo 'R30_INDEPENDENT_OWNER_DEPLOYMENT=NOT_PERFORMED'
          echo 'R30_ACTUAL_RANDOMIZED_POLICY_HISTORY=NOT_PRESENT'
          echo 'R30_ORIGINAL_SCIENCE_DISPATCHED=0'
          echo 'R30_CLOUDFLARE_WRITES=0'
  windows:
    runs-on: windows-latest
    timeout-minutes: 22
    env:
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Native Windows first-use and entire Go regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'R30_SOURCE_SHA_DRIFT' }
          go test -count=1 ./originalclaim ./workerreconcile
          if ($LASTEXITCODE -ne 0) { throw 'R30_WINDOWS_FIRSTUSE_FAILED' }
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'R30_WINDOWS_REGRESSION_FAILED' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'R30_WINDOWS_VET_FAILED' }
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw 'R30_WINDOWS_BUILD_FAILED' }
