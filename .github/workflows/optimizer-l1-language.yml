name: Optimizer L1 synthetic language parallel realization

on:
  push:
    branches: [research/optimizer-l1-parallel-language-20261023]
    paths:
      - '.github/workflows/optimizer-l1-language.yml'
      - 'research/optimizer_language_l1/**'

permissions:
  contents: read

concurrency:
  group: optimizer-l1-language
  cancel-in-progress: false

jobs:
  native-public-language:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify parent source scope and prospectively frozen language protocol
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent='fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5'
          $ancestor=(& git merge-base $parent HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ancestor -cne $parent) {
            throw 'L1_ANCESTRY_IDENTITY_DRIFT'
          }
          $expected=@(
            '.github/workflows/optimizer-l1-language.yml',
            '.github/workflows/optimizer-l1-sourceonly.yml',
            'research/optimizer_l1/L1_FROZEN_CHARTER.json',
            'research/optimizer_l1/compare_source.py',
            'research/optimizer_l1/public_source.py',
            'research/optimizer_l1/qualify_source.py',
            'research/optimizer_l1/test_source.py',
            'research/optimizer_language_l1/L1_FROZEN_PROTOCOL.json',
            'research/optimizer_language_l1/compare.py',
            'research/optimizer_language_l1/learners.py',
            'research/optimizer_language_l1/public_language.py',
            'research/optimizer_language_l1/runner.py',
            'research/optimizer_language_l1/test_realization.py'
          )
          $actual=@(& git diff --name-only $parent HEAD)
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne $expected.Count -or
              (Compare-Object $actual $expected)) {
            throw 'L1_CONSOLIDATED_EXACT_THIRTEEN_FILE_ADDITIVE_SCOPE_DRIFT'
          }
          $proto='research/optimizer_language_l1/L1_FROZEN_PROTOCOL.json'
          $blob='efcd5c7f322d58a3cadabcb2f7f926a9cadd56d4'
          $head=(& git rev-parse ('HEAD:'+$proto)).Trim()
          $disk=(& git hash-object --no-filters -- $proto).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $blob -or $disk -cne $blob) {
            throw 'L1_FROZEN_PROTOCOL_BLOB_DRIFT'
          }
          # Exact union of the independent precommitted charter and model 
          # tracks; neither frozen protocol is modified or weakened.
          $pins=@{
            'research/optimizer_l1/L1_FROZEN_CHARTER.json'='3ad23bfc02403494f30e85bbed30b62aca620e3c'
            'research/optimizer_language_l1/L1_FROZEN_PROTOCOL.json'='efcd5c7f322d58a3cadabcb2f7f926a9cadd56d4'
          }
          foreach ($fp in $pins.Keys) {
            $original=(& git rev-parse ('HEAD:'+$fp)).Trim()
            $local=(& git hash-object --no-filters -- $fp).Trim()
            if ($LASTEXITCODE -ne 0 -or $original -cne $pins[$fp] -or
                $local -cne $pins[$fp]) { throw 'L1_DUAL_FROZEN_PROTOCOL_DRIFT' }
          }
          Write-Host 'L1_PRECOMMITTED_IDENTITY_AND_THIRTEEN_FILE_SCOPE=PASS'
      - name: Eleven adversarial public role and language training tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B -m unittest discover -s research/optimizer_language_l1 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'L1_FOCUSED_LANGUAGE_TEST_FAIL' }
          Write-Host 'L1_FOCUSED_TESTS=PASS'
      - name: Fresh meaning-aligned public TRAIN SELECT DEV and compositional probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $receipt=Join-Path $env:RUNNER_TEMP 'l1-public-language-receipt.json'
          python -B research/optimizer_language_l1/runner.py | Tee-Object -FilePath $receipt
          if ($LASTEXITCODE -ne 0) { throw 'L1_MODEL_FIT_OR_DEV_FAILURE' }
          Write-Host 'L1_SIX_PUBLIC_LANGUAGE_ARMS=EMITTED'
          Write-Host 'L1_Q21_FSA_HELD_FIRST_USE=ZERO'
          Write-Host 'L1_NO_NATIVE_LLM_INTEGRATION=PASS'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l1-native-language-${{ matrix.os }}
          path: ${{ runner.temp }}/l1-public-language-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: One final full FORGE Go test vet build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo L1_ONE_FINAL_FULL_GO_REGRESSION=PASS
      - name: Keep source-only worktree clean
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dirty=@(& git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) { throw 'L1_WORKTREE_OR_CONTROLLER_SIDE_EFFECT' }
          Write-Host 'L1_NO_Q21_CKB_FORGE_WINGLESS_YGGDRASIL_MUTATION=PASS'

  reconcile-native-quality:
    needs: native-public-language
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: l1-native-language-ubuntu-24.04
          path: native-language/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: l1-native-language-windows-2022
          path: native-language/windows
      - name: Fail closed on four source hashes six checkpoints and 72 fidelity metrics
        shell: bash
        run: |
          set -euo pipefail
          python -B research/optimizer_language_l1/compare.py \
            native-language/linux/l1-public-language-receipt.json \
            native-language/windows/l1-public-language-receipt.json \
            native-language/l1-independent-native-acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l1-independent-public-language-reconciliation
          path: native-language/l1-independent-native-acceptance.json
          if-no-files-found: error
          retention-days: 30
