name: FORGE F139 original V20 exact V3 terminal settlement (one-shot)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: forge-f139-v20-v3-original-terminal-once
  cancel-in-progress: false
jobs:
  original-v20-terminal:
    # This workflow is INERT until separately merged via protected main and
    # explicitly approved by the owner. It does NOT dispatch any new worker.
    if: >-
      github.actor == 'spoonman136668-ai' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 807 &&
      startsWith(github.event.comment.body, 'F139-V20-V3-TERMINAL ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Settle exactly one pre-existing V20 original-owner V3 receipt
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          F139_TERMINAL_COMMENT: ${{ github.event.comment.body }}
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $old='db7a1d0f324478183c54df417624053448d6b08b'
          $prefix='F139-V20-V3-TERMINAL '
          $taskName='FORGE-F139-UnifiedController'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:F139_TERMINAL_COMMENT -cnotmatch '^F139-V20-V3-TERMINAL [a-f0-9]{40}$') {
            throw 'F139_V20_TERMINAL_UNAUTHORIZED_EVENT'
          }
          $releaseSHA=$env:F139_TERMINAL_COMMENT.Substring($prefix.Length)
          if($releaseSHA -cne $env:GITHUB_SHA -or
             (& git rev-parse HEAD | Out-String).Trim() -cne $releaseSHA -or
             @(& git status --porcelain --untracked-files=all).Count -ne 0) {
            throw 'F139_V20_TERMINAL_RELEASE_SOURCE_NOT_EXACT'
          }
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if($event.issue.number -ne 807 -or
             $event.issue.user.login -cne 'spoonman136668-ai' -or
             $event.comment.user.login -cne 'spoonman136668-ai' -or
             [string]$event.comment.body -cne $env:F139_TERMINAL_COMMENT -or
             [int64]$event.comment.id -le 0) {
            throw 'F139_V20_TERMINAL_OWNER_COMMENT_IDENTITY_DRIFT'
          }
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          if(-not [Security.Principal.WindowsPrincipal]::new($who).IsInRole(
               [Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'F139_V20_TERMINAL_ESCALATED_OWNER_REQUIRED'
          }
          $main=(& gh api repos/spoonman136668-ai/FORGE/branches/main | ConvertFrom-Json)
          $policy=(& gh api repos/spoonman136668-ai/FORGE/issues/807 | ConvertFrom-Json)
          $ownerPolicy=[string]$policy.body | ConvertFrom-Json
          $release=(& gh api "repos/spoonman136668-ai/FORGE/branches/f139-owner-release-$old" | ConvertFrom-Json)
          $provider=(& gh api repos/spoonman136668-ai/FORGE/actions/runs/40969568784 | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0 -or $main.protected -ne $true -or
             $main.commit.sha -cne $releaseSHA -or
             $policy.state -cne 'open' -or
             $policy.user.login -cne 'spoonman136668-ai' -or
             $ownerPolicy.schema -cne 'forge.f139.native-autonomy-feed-owner-policy.v1' -or
             $ownerPolicy.source_sha -cne $old -or $ownerPolicy.enabled -ne $true -or
             $ownerPolicy.scientific_first_use -ne $false -or
             $ownerPolicy.paid_model_calls -ne 0 -or
             $ownerPolicy.new_controller -ne $false -or
             $ownerPolicy.new_scheduler -ne $false -or
             $ownerPolicy.new_queue -ne $false -or
             $release.protected -ne $true -or $release.commit.sha -cne $old -or
             $provider.id -ne 40969568784 -or
             $provider.head_sha -cne $old -or
             $provider.head_branch -cne "f139-owner-release-$old" -or
             $provider.status -cne 'completed' -or
             $provider.conclusion -cne 'success' -or
             $provider.run_attempt -ne 1) {
            throw 'F139_V20_TERMINAL_POLICY_RELEASE_OR_PROVIDER_DRIFT'
          }
          $task=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          $principal=[string]$task.Principal.UserId
          $sid=''
          try {$sid=(New-Object Security.Principal.NTAccount($principal)).Translate(
             [Security.Principal.SecurityIdentifier]).Value} catch {}
          if([string]$task.State -cnotin @('Ready','Running') -or
             @($task.Actions).Count -ne 1 -or
             @($task.Triggers).Count -ne 3 -or
             [string]$task.Actions[0].Arguments -notmatch '(?i)(?:^|\s)-PollSeconds\s+300(?:\s|$)' -or
             ($principal -ine $who.Name -and $sid -cne $who.User.Value)) {
            throw 'F139_V20_TERMINAL_ORIGINAL_TASK_OR_OWNER_SID_DRIFT'
          }
          function Field([string]$key) {
            $match=[regex]::Match([string]$task.Actions[0].Arguments,
                  '(?i)(?:^|\s)-'+$key+'\s+"([^"]+)"')
            if(-not $match.Success){throw 'F139_V20_TERMINAL_ORIGINAL_TASK_ARGUMENT_DRIFT'}
            return $match.Groups[1].Value
          }
          $root=Field 'RepositoryRoot'
          $db=Field 'Database'
          $python=Field 'PythonExe'
          $keyFile=Field 'EncryptedKeyFile'
          if(-not(Test-Path -LiteralPath $db -PathType Leaf) -or
             -not(Test-Path -LiteralPath $python -PathType Leaf) -or
             -not(Test-Path -LiteralPath $keyFile -PathType Leaf) -or
             (& git -C $root rev-parse HEAD | Out-String).Trim() -cne $old -or
             @(& git -C $root status --porcelain --untracked-files=all).Count -ne 0) {
            throw 'F139_V20_TERMINAL_ORIGINAL_INSTALLED_RELEASE_DRIFT'
          }
          Write-Host 'F139_V20_TERMINAL_ORIGINAL_OWNER_PREFLIGHT=PASS'
          $stopped=$false
          $resumed=$false
          try {
            Disable-ScheduledTask -TaskName $taskName -ErrorAction Stop | Out-Null
            $stopped=$true
            if([string]$task.State -ceq 'Running') {
              Stop-ScheduledTask -TaskName $taskName -ErrorAction Stop | Out-Null
            }
            $children=@()
            for($i=0;$i -lt 40;$i++) {
              $children=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
                Where-Object {$_.CommandLine -and
                  $_.CommandLine.Contains('f139.local_controller') -and
                  $_.CommandLine.Contains($db)})
              if($children.Count -eq 0){break}
              Start-Sleep -Seconds 1
            }
            if($children.Count -ne 0 -or
               [string](Get-ScheduledTask -TaskName $taskName).State -cne 'Disabled') {
              throw 'F139_V20_TERMINAL_ORIGINAL_OWNER_NOT_QUIESCENT'
            }
            $backup=Join-Path (Split-Path $db -Parent) (
              'f139-v20-before-once-'+$env:GITHUB_RUN_ID+'.sqlite')
            if(Test-Path -LiteralPath $backup) {throw 'F139_V20_TERMINAL_BACKUP_COLLISION'}
            @'
          import pathlib,sqlite3,sys
          old="db7a1d0f324478183c54df417624053448d6b08b"
          with sqlite3.connect("file:"+sys.argv[1].replace("\\","/")+"?mode=ro",uri=True) as source:
              source.execute("PRAGMA query_only=ON")
              assert source.execute("PRAGMA quick_check").fetchone()[0]=="ok"
              row=source.execute("SELECT source_sha,head_seq,head_hash FROM meta WHERE id=1").fetchone()
              assert row==(old,328,"004aab55338a08230bd8644566e564293d41dbcee5b397521566dfbbbdc3eed4")
              with sqlite3.connect(sys.argv[2]) as backup: source.backup(backup)
          print("F139_V20_TERMINAL_COLD_SQLITE_BACKUP=PASS")
          '@ | & $python -B - $db $backup
            if($LASTEXITCODE -ne 0){throw 'F139_V20_TERMINAL_ORIGINAL_COLD_BACKUP_DENIED'}
            $secure=Import-Clixml -LiteralPath $keyFile
            if(-not($secure -is [Security.SecureString])) {
              throw 'F139_V20_TERMINAL_DPAPI_ORIGINAL_SECRET_INVALID'
            }
            $ptr=[Runtime.InteropServices.Marshal]::SecureStringToBSTR($secure)
            try {$env:F139_WORKER_HMAC_KEY=[Runtime.InteropServices.Marshal]::PtrToStringBSTR($ptr)}
            finally {[Runtime.InteropServices.Marshal]::ZeroFreeBSTR($ptr)}
            try {
              if($env:F139_WORKER_HMAC_KEY.Length -lt 32) {
                throw 'F139_V20_TERMINAL_OWNER_SECRET_LENGTH_INVALID'
              }
              # Execute the exact merged code in the job checkout, not a
              # mutation of the original installed V20 checkout or a new loop.
              Set-Location -LiteralPath $env:GITHUB_WORKSPACE
              & $python -B -m f139.nci04_v20_original_terminal_once $db
              if($LASTEXITCODE -ne 0) {throw 'F139_V20_TERMINAL_SIGNED_SETTLEMENT_DENIED'}
              Write-Host 'F139_V20_TERMINAL_EXACT_ORIGINAL_RECEIPT=PASS'
            } finally {
              Remove-Item Env:F139_WORKER_HMAC_KEY -ErrorAction SilentlyContinue
            }
          } finally {
            if($stopped) {
              Enable-ScheduledTask -TaskName $taskName -ErrorAction Stop | Out-Null
              Start-ScheduledTask -TaskName $taskName -ErrorAction Stop | Out-Null
              $state=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
              if([string]$state.State -cnotin @('Ready','Running') -or
                 $state.Settings.Enabled -ne $true) {
                throw 'F139_V20_TERMINAL_ORIGINAL_TASK_RESUME_READBACK_FAILED'
              }
              $resumed=$true
              Write-Host 'F139_V20_TERMINAL_EXISTING_TASK_RESUMED=PASS'
            }
          }
          if(-not $resumed) {throw 'F139_V20_TERMINAL_EXISTING_TASK_NOT_RESUMED'}
          Write-Host 'F139_V20_TERMINAL_NEW_CONTROLLER=FALSE'
          Write-Host 'F139_V20_TERMINAL_SCIENTIFIC_FIRST_USE=FALSE'
          Write-Host 'F139_V20_TERMINAL_PAID_MODEL_CALLS=0'
