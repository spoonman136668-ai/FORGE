name: KTRADE PR253 exact-source native headless package and drawing checks
on:
  push:
    branches: [qualification/ktrade-pr253-owner-native-readonly-20261113]
    paths:
      - .github/workflows/ktrade-pr253-exact-headless-wails-20261113.yml
permissions:
  contents: read
concurrency:
  group: ktrade-pr253-owner-headless-source-wails
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 45
    env:
      KTRADE_EXPECTED_SOURCE: '59842e83f01fb6e1af780ede5a7395a9c7cce47a'
      KTRADE_EXPECTED_TREE: 'df46e1b6c9adf46eb9ba69e83ce4dbd8dc8feb97'
      KTRADE_LIVE_TRADING: 'false'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      KTRADE_PROMOTION_ALLOWED: '0'
    steps:
      - name: Run exact source chart drawing regressions and build isolated Windows Wails fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:KTRADE_LIVE_TRADING -cne 'false' -or
             $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or
             $env:KTRADE_PROMOTION_ALLOWED -cne '0'){
            throw 'KTRADE_PR253_HEADLESS_SCOPE_REFUSED'
          }
          foreach($tool in @('go.exe','git.exe','gh.exe','node.exe','npm.cmd')){
            if(!(Get-Command $tool -ErrorAction SilentlyContinue)){
              throw ('KTRADE_PR253_HEADLESS_MISSING_'+$tool)
            }
          }
          $guid=[guid]::NewGuid().ToString('N')
          $runnerTemp=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $root=Join-Path $runnerTemp ('ktrade-pr253-headless-'+$guid)
          $source=Join-Path $root 'source'
          $stageLog=Join-Path $root 'private-stage.log'
          $pkg=Join-Path $runnerTemp ('ktrade-w03-package-'+$guid)
          $oldTemp=$env:TEMP
          $oldTmp=$env:TMP
          $oldGoToolchain=$env:GOTOOLCHAIN
          $oldGoPath=$env:GOPATH
          $oldGoModCache=$env:GOMODCACHE
          $oldGoCache=$env:GOCACHE
          $oldNpmCache=$env:npm_config_cache
          $scope='PRECHECK'
          $testsPassed=$false
          $built=$false
          $head=''
          $tree=''
          New-Item -ItemType Directory -Path $root -ErrorAction Stop|Out-Null
          try{
            $env:TEMP=$runnerTemp
            $env:TMP=$runnerTemp
            $env:GOTOOLCHAIN='go1.26.10'
            $env:GOPATH=Join-Path $root 'go-path'
            $env:GOMODCACHE=Join-Path $root 'go-mod-cache'
            $env:GOCACHE=Join-Path $root 'go-build-cache'
            $env:npm_config_cache=Join-Path $root 'npm-cache'
            $env:GH_PROMPT_DISABLED='1'
            $env:GIT_TERMINAL_PROMPT='0'
            $goVersion=((& go.exe version) -join ' ')
            if($LASTEXITCODE -ne 0 -or $goVersion -notmatch '^go version go1\.26\.10 '){
              throw 'KTRADE_PR253_HEADLESS_PINNED_GO_UNAVAILABLE'
            }
            $scope='PRIVATE_CLONE'
            & gh.exe repo clone spoonman136668-ai/ktrade $source -- --filter=blob:none --no-checkout *> $stageLog
            if($LASTEXITCODE -ne 0){throw 'KTRADE_PR253_HEADLESS_PRIVATE_SOURCE_UNAVAILABLE'}
            $scope='PINNED_SOURCE'
            & git.exe -C $source fetch --no-tags --depth 1 origin $env:KTRADE_EXPECTED_SOURCE *> $stageLog
            if($LASTEXITCODE -ne 0){throw 'KTRADE_PR253_HEADLESS_PINNED_FETCH_FAILED'}
            & git.exe -C $source checkout --detach $env:KTRADE_EXPECTED_SOURCE *> $stageLog
            if($LASTEXITCODE -ne 0){throw 'KTRADE_PR253_HEADLESS_PINNED_CHECKOUT_FAILED'}
            $head=(& git.exe -C $source rev-parse HEAD).Trim()
            $tree=(& git.exe -C $source rev-parse 'HEAD^{tree}').Trim()
            if($head -cne $env:KTRADE_EXPECTED_SOURCE -or
               $tree -cne $env:KTRADE_EXPECTED_TREE -or
               @(& git.exe -C $source status --porcelain --untracked-files=no).Count -ne 0){
              throw 'KTRADE_PR253_HEADLESS_SOURCE_TREE_DRIFT'
            }
            $pin=(Get-Content (Join-Path $source 'windows/Go-Toolchain.version') -Raw).Trim()
            if($pin -cne 'go1.26.10'){throw 'KTRADE_PR253_HEADLESS_TOOLCHAIN_PIN_DRIFT'}
            $scope='FOCUSED_NODE_TESTS'
            $tests=@(
              'tests/w149_advanced_drawings.test.cjs',
              'tests/w151_parallel_channel.test.cjs',
              'tests/w160_native_drawings_observer.test.cjs',
              'tests/w145_tick_intervals.test.cjs',
              'tests/rb3_w96_medium_viewport_controls.test.cjs',
              'tests/rb3_w98_pine_native_accessibility.test.cjs'
            )
            Push-Location $source
            try{
              & node.exe --test @tests *> $stageLog
              if($LASTEXITCODE -ne 0){throw 'KTRADE_PR253_HEADLESS_FOCUSED_TESTS_FAILED'}
              $testsPassed=$true
            }finally{Pop-Location}
            Write-Host ('KTRADE_PR253_HEADLESS_FOCUSED_TESTS=PASS;source_sha='+$head+';tests=6')
            $scope='OFFLINE_VENDOR_STAGE'
            Push-Location $source
            try{
              & npm.cmd ci --ignore-scripts --no-audit --no-fund --silent *> $stageLog
              if($LASTEXITCODE -ne 0){throw 'KTRADE_PR253_HEADLESS_NPM_CI_FAILED'}
              & node.exe scripts/stage_offline_vendor.cjs *> $stageLog
              if($LASTEXITCODE -ne 0){throw 'KTRADE_PR253_HEADLESS_VENDOR_STAGE_FAILED'}
            }finally{Pop-Location}
            $scope='NATIVE_WAILS_BUILD'
            $env:KTRADE_W13_QUALIFICATION_ONLY='1'
            $env:KTRADE_W41_QUALIFICATION_ONLY='1'
            & (Join-Path $source 'windows/Build-KTRADE-WailsPortable.ps1') -OutputRoot $pkg -ExpectedSourceSha $head -W13QualificationFixture -W41ColdFixture *> $stageLog
            if($LASTEXITCODE -ne 0){throw 'KTRADE_PR253_HEADLESS_NATIVE_BUILD_FAILED'}
            $manifest=Get-Content (Join-Path $pkg 'source-manifest.json') -Raw|ConvertFrom-Json
            $shell=Join-Path $pkg 'KTRADE-WailsPortable/ktrade.exe'
            $engine=Join-Path $pkg 'KTRADE-WailsPortable/ktrade-engine.exe'
            if($manifest.source_sha -cne $head -or
               $manifest.go_version -cne 'go1.26.10' -or
               $manifest.fixture_mode -cne 'w41-frozen-disposable-restart' -or
               $manifest.live_armed -ne $false -or
               $manifest.paper_started -ne $false -or
               $manifest.release_candidate -ne $false -or
               !(Test-Path -LiteralPath $shell -PathType Leaf) -or
               !(Test-Path -LiteralPath $engine -PathType Leaf)){
              throw 'KTRADE_PR253_HEADLESS_PACKAGE_RECEIPT_REFUSED'
            }
            $sHash=(Get-FileHash -LiteralPath $shell -Algorithm SHA256).Hash.ToLowerInvariant()
            $eHash=(Get-FileHash -LiteralPath $engine -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sHash -cne $manifest.wails_exe_sha256 -or
               $eHash -cne $manifest.engine_exe_sha256){
              throw 'KTRADE_PR253_HEADLESS_BINARY_HASH_MISMATCH'
            }
            $built=$true
            Write-Host ('KTRADE_PR253_HEADLESS_PACKAGE='+([ordered]@{
              schema='ktrade.pr253.exact-headless-wails.v1'
              source_sha=$head;tree_sha=$tree
              go_toolchain='go1.26.10'
              drawing_test_files=6
              drawing_regressions_pass=$testsPassed
              wails_sha256=$sHash
              engine_sha256=$eHash
              fixture_mode=[string]$manifest.fixture_mode
              native_package_verified=$true
              live_armed=$false
              user_install_modified=$false
              user_display_modified=$false
              application_launched=$false
              git_release_modified=$false
              controller_or_runner_modified=$false
            }|ConvertTo-Json -Compress -Depth 5))
          }finally{
            Remove-Item Env:\KTRADE_W13_QUALIFICATION_ONLY,Env:\KTRADE_W41_QUALIFICATION_ONLY -ErrorAction SilentlyContinue
            $env:TEMP=$oldTemp
            $env:TMP=$oldTmp
            $env:GOTOOLCHAIN=$oldGoToolchain
            $env:GOPATH=$oldGoPath
            $env:GOMODCACHE=$oldGoModCache
            $env:GOCACHE=$oldGoCache
            $env:npm_config_cache=$oldNpmCache
            if(Test-Path -LiteralPath $pkg -PathType Container){Remove-Item -LiteralPath $pkg -Recurse -Force -ErrorAction SilentlyContinue}
            if(Test-Path -LiteralPath $root -PathType Container){Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue}
            Write-Host ('KTRADE_PR253_HEADLESS_CLEANUP='+([ordered]@{
              last_phase=$scope;focused_tests_pass=$testsPassed;native_build_pass=$built
              installed_app_untouched=$true
              physical_display_untouched=$true
              no_foreground_or_pointer_input=$true
              no_live_trading=$true
            }|ConvertTo-Json -Compress -Depth 3))
          }
          if(!$built){throw 'KTRADE_PR253_HEADLESS_BUILD_UNVERIFIED'}
