name: F139 resume exact original owner from sealed V4 event96
on:
  push:
    branches: [operate/f139-v4-final-owner-resume-20261023]
permissions:
  contents: read
  actions: read
concurrency:
  group: f139-original-owner-v4-final-resume-once
  cancel-in-progress: false
jobs:
  original-owner-v4-resume:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Original owner, exact release and owner event96 preflight no mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $repo='spoonman136668-ai/FORGE'
          $target='fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5'
          $old='fd8474235d2197533189f35b002f5602268a497b'
          $hash96='3a2fb20fc5cf98a5ac4223ddf8ba17497682302565d733365a5dd371f6a02947'
          if($env:GITHUB_REPOSITORY -cne $repo -or
             $env:GITHUB_REF -cne 'refs/heads/operate/f139-v4-final-owner-resume-20261023' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:OPENAI_API_KEY){
            throw 'F139_RESUME_OWNER_REPOSITORY_OR_SECRET_BOUNDARY'
          }
          $main=(& gh api "repos/$repo/branches/main" | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0 -or $main.commit.sha -cne $target -or -not $main.protected){
            throw 'F139_RESUME_PROTECTED_MAIN_CHANGED'
          }
          foreach($runId in @(39937039450,39937048069,39937048117)){
            $r=(& gh api "repos/$repo/actions/runs/$runId" | ConvertFrom-Json)
            if($LASTEXITCODE -ne 0 -or $r.status -cne 'completed' -or
               $r.conclusion -cne 'success' -or
               $r.head_sha -cne '68ccff05a6b7235b759ecb767b1e703ebfc93852'){
              throw ('F139_RESUME_SOURCE_QUALIFICATION_MISSING_'+$runId)
            }
          }
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          $principal=[string]$task.Principal.UserId
          $sid=if($principal -match '^S-1-'){$principal}else{
            (New-Object Security.Principal.NTAccount($principal)).Translate(
              [Security.Principal.SecurityIdentifier]).Value
          }
          if($sid -cne $who.User.Value -or @($task.Actions).Count -ne 1 -or
             $task.State -ne 'Disabled'){throw 'F139_RESUME_ORIGINAL_OWNER_NOT_DISABLED'}
          $argsText=[string]$task.Actions[0].Arguments
          $opts=@{}
          foreach($key in @('RepositoryRoot','PythonExe','Database','EncryptedKeyFile','File')){
            $m=[regex]::Match($argsText,'(?i)(?:^|\s)-'+$key+'\s+"([^"]+)"')
            if(-not $m.Success){throw ('F139_RESUME_TASK_PARAMETER_'+$key)}
            $opts[$key]=$m.Groups[1].Value
          }
          if([IO.Path]::GetFileName($opts.File) -cne 'Run-FORGE-F139.ps1' -or
             [IO.Path]::GetFullPath($opts.Database) -ine
             [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'FORGE-F139\state.sqlite')) -or
             !(Test-Path -LiteralPath $opts.EncryptedKeyFile -PathType Leaf) -or
             !(Test-Path -LiteralPath $opts.PythonExe -PathType Leaf)){
            throw 'F139_RESUME_ORIGINAL_TASK_CUSTODY_DRIFT'
          }
          $root=[IO.Path]::GetFullPath($opts.RepositoryRoot)
          $source=(& git -C $root rev-parse HEAD | Out-String).Trim()
          $clean=(& git -C $root status --porcelain --untracked-files=all | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $source -cne $old -or $clean.Length -gt 0){
            throw 'F139_RESUME_ORIGINAL_CHECKOUT_NOT_FROZEN'
          }
          $processes=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
            Where-Object {$_.CommandLine -and
              $_.CommandLine.Contains('f139.local_controller') -and
              $_.CommandLine.Contains($opts.Database)})
          if($processes.Count -ne 0){throw 'F139_RESUME_ORIGINAL_PROCESS_NOT_QUIESCED'}
          $py=$opts.PythonExe
          Push-Location -LiteralPath $root
          try{
            $state=(& $py -B -m f139.local_controller --db $opts.Database status |
              Out-String | ConvertFrom-Json).status
            if($LASTEXITCODE -ne 0 -or $state.meta.source_sha -cne $old -or
               $state.meta.head_seq -ne 96 -or
               $state.meta.head_hash -cne $hash96 -or
               $state.meta.enabled -ne 1 -or $state.meta.legacy_suspended -ne 1 -or
               @($state.tasks | Where-Object {$_.stage -eq 'QUARANTINED'}).Count -ne 4 -or
               @($state.tasks | Where-Object {$_.stage -eq 'VERIFIED'}).Count -ne 11 -or
               @($state.tasks | Where-Object {$_.stage -notin @('VERIFIED','QUARANTINED')}).Count -ne 0){
              throw 'F139_RESUME_OWNER_EVENT96_OR_NEGATIVE_CUSTODY_DRIFT'
            }
            Write-Output 'F139_ORIGINAL_V4_EVENT96_VERIFIED=PASS'
            Write-Output 'F139_ORIGINAL_FOUR_NEGATIVES_PRESERVED=PASS'
            Write-Output 'F139_ORIGINAL_OWNER_TASK_DISABLED_PRECUTOVER=TRUE'
          }finally{Pop-Location}
      - name: One-time qualified owner source98 transition and original task restart
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $repo='spoonman136668-ai/FORGE'
          $target='fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5'
          $old='fd8474235d2197533189f35b002f5602268a497b'
          $hash96='3a2fb20fc5cf98a5ac4223ddf8ba17497682302565d733365a5dd371f6a02947'
          $main=(& gh api "repos/$repo/branches/main" | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0 -or $main.commit.sha -cne $target -or -not $main.protected){
            throw 'F139_RESUME_PROTECTED_MAIN_MOVED_BEFORE_MUTATION'
          }
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if($task.State -ne 'Disabled'){throw 'F139_RESUME_TASK_NOT_DISABLED'}
          $argsText=[string]$task.Actions[0].Arguments
          $opts=@{}
          foreach($key in @('RepositoryRoot','PythonExe','Database')){
            $m=[regex]::Match($argsText,'(?i)(?:^|\s)-'+$key+'\s+"([^"]+)"')
            if(-not $m.Success){throw 'F139_RESUME_ORIGINAL_TASK_ARGUMENT_DRIFT'}
            $opts[$key]=$m.Groups[1].Value
          }
          $root=[IO.Path]::GetFullPath($opts.RepositoryRoot)
          $py=$opts.PythonExe
          $db=$opts.Database
          $source=(& git -C $root rev-parse HEAD | Out-String).Trim()
          $clean=(& git -C $root status --porcelain --untracked-files=all | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $source -cne $old -or $clean.Length -gt 0){
            throw 'F139_RESUME_PREVIOUS_CHECKOUT_CHANGED'
          }
          $active=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
            Where-Object {$_.CommandLine -and
              $_.CommandLine.Contains('f139.local_controller') -and
              $_.CommandLine.Contains($db)})
          if($active.Count -ne 0){throw 'F139_RESUME_OWNER_CONTROLLER_ALREADY_RUNNING'}
          & git -C $root fetch --no-tags origin main
          if($LASTEXITCODE -ne 0){throw 'F139_RESUME_PROTECTED_SOURCE_FETCH_FAILED'}
          $fetched=(& git -C $root rev-parse FETCH_HEAD | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $fetched -cne $target){
            throw 'F139_RESUME_PROTECTED_SOURCE_CHANGED_KEEP_DISABLED'
          }
          & git -C $root checkout --detach $target
          if($LASTEXITCODE -ne 0){throw 'F139_RESUME_EXACT_CHECKOUT_FAILED'}
          $checkout=(& git -C $root rev-parse HEAD | Out-String).Trim()
          $dirty=(& git -C $root status --porcelain --untracked-files=all | Out-String).Trim()
          if($checkout -cne $target -or $dirty.Length -ne 0){
            throw 'F139_RESUME_WORKTREE_DIRTY_KEEP_DISABLED'
          }
          Push-Location -LiteralPath $root
          try{
            $prior=(& $py -B -m f139.local_controller --db $db status |
              Out-String | ConvertFrom-Json).status
            if($LASTEXITCODE -ne 0 -or $prior.meta.source_sha -cne $old -or
               $prior.meta.head_seq -ne 96 -or
               $prior.meta.head_hash -cne $hash96){
              throw 'F139_RESUME_OWNER_EVENT96_MOVED_KEEP_DISABLED'
            }
            $approvalPath=Join-Path $env:RUNNER_TEMP 'f139-v4-final-transition.json'
            $proof=[ordered]@{
              schema='forge.f139.nci04.owner-source-transition-approval.v1'
              from_source_sha=$old
              to_source_sha=$target
              expected_event_head_sha256=$hash96
              sealed_23_event_head_sha256='eea95c859f9a59f700612c3b7b39152abc78827981976e9d86567c29fa03ff87'
              native_development_only=$true
              scientific_first_use=$false
              new_controller=$false
              paid_api_calls=0
            }
            [IO.File]::WriteAllText($approvalPath,($proof|ConvertTo-Json -Compress),
              (New-Object Text.UTF8Encoding($false)))
            try{
              & $py -B -m f139.local_controller --db $db transition-qualified-native --approval $approvalPath
              if($LASTEXITCODE -ne 0){throw 'F139_RESUME_V4_SOURCE_TRANSITION_REJECTED'}
            }finally{Remove-Item -LiteralPath $approvalPath -Force -ErrorAction SilentlyContinue}
            $post=(& $py -B -m f139.local_controller --db $db status |
              Out-String | ConvertFrom-Json).status
            if($LASTEXITCODE -ne 0 -or $post.meta.head_seq -ne 97 -or
               $post.meta.source_sha -cne $target){
              throw 'F139_RESUME_V4_SOURCE_EVENT97_NOT_DURABLE'
            }
            $approvalPath=Join-Path $env:RUNNER_TEMP 'f139-v4-final-native-activation.json'
            $enable=[ordered]@{
              schema='forge.f139.nci04.owner-native-approval.v1'
              source_sha=$target
              expected_event_head_sha256=$post.meta.head_hash
              native_development_approved=$true
              scientific_first_use=$false
              create_controller=$false
              paid_api_calls=0
            }
            [IO.File]::WriteAllText($approvalPath,($enable|ConvertTo-Json -Compress),
              (New-Object Text.UTF8Encoding($false)))
            try{
              & $py -B -m f139.local_controller --db $db activate-native --approval $approvalPath
              if($LASTEXITCODE -ne 0){throw 'F139_RESUME_V4_NATIVE_OWNER_ACTIVATION_REJECTED'}
            }finally{Remove-Item -LiteralPath $approvalPath -Force -ErrorAction SilentlyContinue}
            $now=(& $py -B -m f139.local_controller --db $db status |
              Out-String | ConvertFrom-Json).status
            if($LASTEXITCODE -ne 0 -or $now.meta.source_sha -cne $target -or
               $now.meta.head_seq -ne 98 -or
               $now.meta.enabled -ne 1 -or $now.meta.legacy_suspended -ne 1 -or
               @($now.tasks | Where-Object {$_.stage -eq 'QUARANTINED'}).Count -ne 4 -or
               @($now.tasks | Where-Object {$_.stage -eq 'VERIFIED'}).Count -ne 11 -or
               @($now.tasks | Where-Object {$_.stage -notin @('QUARANTINED','VERIFIED')}).Count -ne 0){
              throw 'F139_RESUME_ORIGINAL_LEDGER98_INVALID_KEEP_DISABLED'
            }
            $main=(& gh api "repos/$repo/branches/main" | ConvertFrom-Json)
            if($LASTEXITCODE -ne 0 -or $main.commit.sha -cne $target){
              throw 'F139_RESUME_MAIN_MOVED_BEFORE_RESTART_KEEP_DISABLED'
            }
            Enable-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' | Out-Null
            Start-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
            $live=$false
            for($i=0;$i -lt 12;$i++){
              Start-Sleep -Seconds 2
              $running=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
                Where-Object {$_.CommandLine -and
                  $_.CommandLine.Contains('f139.local_controller') -and
                  $_.CommandLine.Contains($db)})
              if($running.Count -eq 1){$live=$true;break}
            }
            if(-not $live){throw 'F139_RESUME_ORIGINAL_CONTROLLER_NOT_RUNNING'}
            Write-Output 'F139_ORIGINAL_V4_OWNER_RECOVERY=PASS'
            Write-Output 'F139_ORIGINAL_CONTROLLER_PROCESSES=1'
            Write-Output ('F139_ORIGINAL_SOURCE_SHA='+$target)
            Write-Output ('F139_ORIGINAL_EVENT_HEAD_SEQ='+[string]$now.meta.head_seq)
            Write-Output ('F139_ORIGINAL_EVENT_SHA256='+$now.meta.head_hash)
            Write-Output 'F139_TWO_NATIVE_WORKER_SLOTS=PRESERVED'
            Write-Output 'F139_NATIVE_OWNER_ACTIVATED=TRUE'
            Write-Output 'F139_REPLAYED_PROVIDER_RUNS=0'
            Write-Output 'F139_PROTECTED_SCIENTIFIC_FIRST_USE=FALSE'
          }finally{Pop-Location}
