name: Mass K4Q read-only original evidence authentication
on:
  push:
    branches: [research/mass-lcrm01-k4q-readonly-evidence-20261024]
permissions:
  contents: read
  actions: read
jobs:
  original-source-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 16
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve once-used physical source artifact — no simulator installed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k4q-verification"
          curl --fail --location --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            'https://api.github.com/repos/spoonman136668-ai/FORGE/actions/artifacts/12559802244/zip' \
            -o "$RUNNER_TEMP/k4q-verification/original.zip"
          printf '6fbee44dd3df6c5d74c899ae8f36bcb45abd799b5954504f9a150d06f414da9f  %s\n' "$RUNNER_TEMP/k4q-verification/original.zip" | sha256sum -c -
      - name: Verify original first-use members, frozen evidence, no new rewards
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import zipfile,hashlib,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"k4q-verification"
          pinned={
            "process-a.json":"96ee057212bd4f384ccc30e2039871782e3cb58c42ca1a056538aae76ca1773d",
            "process-b.json":"dd6fc3221efb276e25cdf32825edea9a14cd1e2aeb9d859429a0b54d3bc35b44",
            "process-a.log":"badb8ca7d5340a229f612e49e2ca369c4829b0e697afeb89558f2a65dae3f45d",
            "process-b.log":"badb8ca7d5340a229f612e49e2ca369c4829b0e697afeb89558f2a65dae3f45d"
          }
          with zipfile.ZipFile(root/"original.zip") as z:
            assert set(z.namelist())==set(pinned),"ORIGINAL_ARTIFACT_MEMBERS_CHANGED"
            for name,digest in pinned.items():
              raw=z.read(name)
              assert hashlib.sha256(raw).hexdigest()==digest, "ORIGINAL_ARTIFACT_SHA_DRIFT_"+name
              (root/name).write_bytes(raw)
          print("K4Q_ORIGINAL_ARTIFACT_MEMBERS_VERIFIED=PASS")
          PY
      - name: Run syntax-repaired comparator ONLY on exact already-consumed source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/lcrm01 python -B research/lcrm01/k4q_compare.py \
            --first "$RUNNER_TEMP/k4q-verification/process-a.json" \
            --second "$RUNNER_TEMP/k4q-verification/process-b.json" \
            --output "$RUNNER_TEMP/k4q-verification/comparison.json" | tee "$RUNNER_TEMP/k4q-verification/comparison.log"
          python -B - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"k4q-verification"
          c=json.loads((root/"comparison.json").read_text())
          a=json.loads((root/"process-a.json").read_text())
          b=json.loads((root/"process-b.json").read_text())
          assert c["result"]=="NO_QUALIFIED_CAUSAL_OBSERVABILITY_SOURCE"
          assert c["exact_original_science_agreement"] is True
          assert c["differing_fields"]==[]
          assert c["scientific_first_use"] is False and c["scientific_accepted"] is False
          assert all(p["source_qualification"]["result"]=="SOURCE_INFORMATION_OR_BASELINE_LEARNABILITY_NOT_QUALIFIED" for p in (a,b))
          assert all(p["source_qualification"]["forward_qualified_task_families"]==3 for p in (a,b))
          assert all(p["source_qualification"]["hindsight_action_diverse_families"]==1 for p in (a,b))
          print("K4Q_ORIGINAL_SCIENTIFIC_NO_GO_PRESERVED=PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-k4q-readonly-authenticated-original-verdict
          path: |
            ${{ runner.temp }}/k4q-verification/comparison.json
            ${{ runner.temp }}/k4q-verification/comparison.log
          if-no-files-found: warn
          retention-days: 90
