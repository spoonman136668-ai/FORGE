name: FORGE R25 prospective evidence read-only acceptance
on:
  push:
    branches: [research/r25-prospective-evidence-intake-20261015-r1]
permissions:
  contents: read
concurrency:
  group: forge-r25-owner-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Focused real-owner interface and negative trust tests
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./dreamrsi ./cmd/forge-prospective-shadow
      - name: Single final full regression, race, vet and build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
      - name: No scientific execution or source authority
        shell: bash
        run: |
          set -euo pipefail
          test ! -e snapshot
          test ! -e research/successor-builder
          ! grep -R --include='*.go' -E 'github.com/spoonman136668-ai/(ckb-plane|Wingless|Yggdrasil)|os.StartProcess|net/http.Post' .
          echo 'R25_REAL_OWNER_SOURCE=NOT_PROVIDED'
          echo 'R25_ACTUAL_OPTIMIZER_GAIN=NOT_ESTABLISHED'
          echo 'R25_SCIENTIFIC_EXECUTION=0'
          echo 'R25_CLOUDFLARE_WRITES=0'
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Native Windows focused and full acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'R25_SOURCE_SHA_DRIFT' }
          go test -count=1 ./dreamrsi ./cmd/forge-prospective-shadow
          if ($LASTEXITCODE -ne 0) { throw 'R25_WINDOWS_FOCUSED_FAILED' }
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'R25_WINDOWS_REGRESSION_FAILED' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'R25_WINDOWS_VET_FAILED' }
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw 'R25_WINDOWS_BUILD_FAILED' }
