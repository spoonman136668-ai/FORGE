name: F124-CH one-time internal E/F prospective native-science experiment
on:
  push:
    branches: [research/f124ch-internal-blinded-ef-20261019]
    paths:
      - .github/workflows/forge-f124ch-firstuse.yml
permissions:
  contents: read
concurrency:
  group: f124ch-source-birth-then-firstuse-original-928-929-once
  cancel-in-progress: false
jobs:
  frozen-source-only-mathematics:
    if: github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Immutable original research, exact fresh E/F protocol then source math and Python-only syntax
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $prior='fd2204c9f39910e95de19ab21b730b3a380a25c2'
          if ((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'CH_SOURCE_ACTUAL_PROVIDER_SHA_DRIFT' }
          & git merge-base --is-ancestor 62eb3584f42d3edd5caddc7667b567e81489af4f HEAD
          if ($LASTEXITCODE -ne 0) { throw 'CH_FROZEN_BEFORE_ANY_EF_SOURCE_BIRTH' }
          if ((& git rev-parse '62eb3584f42d3edd5caddc7667b567e81489af4f:research/north-star-transfer/f124ch-frozen-internal-prospective-EF.json').Trim() -cne 'aff8e38e55a503c1656316e551425ad3c7b7e266') { throw 'CH_PRECODE_ORIGINAL_BLOB_CHANGED' }
          $source=@{
            'research/north-star-transfer/f124ch_internal_source.py'='b014c0c80c2278618adf21e4da085b05d1129cf7'
            'research/north-star-transfer/f124cb_dual_link_learner.py'='8a10bf8cec12afc7d8703e3586d8eba91ebfdc7c'
            'research/north-star-transfer/f124cc_trained_two_link_control.py'='29c0c02f54ea539bed0910fe82adcc86d3aff94d'
            'research/north-star-transfer/f124bq_program_learner.py'='91ad02a4f3893e3537dddc2390666e3c2d2db5d1'
            'research/north-star-transfer/f124bx_learned_flag.py'='74b907aba821678d5f8a59b06f85f5e87cb05002'
            'research/north-star-transfer/f124bz_binding_candidate.py'='8f24a4aab3e880d7ba5f89a2af6ab210912d865c'
            'research/north-star-transfer/f124ca_trained_symbol_control.py'='a5cc942d17e8410420fd4003e9a13ff3cd2e819e'
            'nativeevidence/f124az_joint_public_inverse.py'='0122190aa3a0972ffb4a709bc1bdd8179c8ba6c7'
            'nativeevidence/f124ag_transition_models.py'='94d2ae8266da792d254ac54baf3056bbd9b49412'
            'research/north-star-transfer/f124bv-frozen-independent-science.json'='5a509951aacb3de7cbec0c0e895d3b9c8ce4dce5'
          }
          foreach ($path in $source.Keys) {
            if ((& git rev-parse ('HEAD:'+$path)).Trim() -cne $source[$path]) { throw "CH_ORIGINAL_SOURCE_SHA_OR_TRAINED_CONTROL_DRIFT:$path" }
          }
          $actual=@(& git diff --name-only $prior HEAD | Where-Object { $_ } | Sort-Object)
          $expected=@(
            '.github/workflows/forge-f124ch-firstuse.yml',
            '.github/workflows/forge-f124ch-source-only.yml',
            'research/north-star-transfer/f124ch-frozen-internal-prospective-EF.json',
            'research/north-star-transfer/f124ch_birth_original.py',
            'research/north-star-transfer/f124ch_internal_source.py',
            'research/north-star-transfer/f124ch_prospective_eval.py',
            'research/north-star-transfer/test_f124ch_source_only_math.py'
          ) | Sort-Object
          if ((@($actual) -join '|') -cne (@($expected) -join '|')) { throw 'CH_UNFROZEN_OTHER_WORKSTREAM_SOURCE_MUTATION' }
          & python -B -m unittest discover -s research/north-star-transfer -p test_f124ch_source_only_math.py -v
          if ($LASTEXITCODE -ne 0) { throw 'CH_UNFAMILIAR_SOURCE_ALGEBRA_INVALID' }
          & python -B -m py_compile research/north-star-transfer/f124ch_birth_original.py research/north-star-transfer/f124ch_prospective_eval.py
          if ($LASTEXITCODE -ne 0) { throw 'CH_EVALUATOR_SYNTAX_BEFORE_BIRTH_INVALID' }
          & python -B isolationguard/check.py
          if ($LASTEXITCODE -ne 0) { throw 'CH_GOVERNANCE_SOURCE_ISOLATION_FAILED' }
          Write-Output 'F124CH_FROZEN_PREBIRTH_EXACT_SOURCE_ALGORITHM=PASS'
          Write-Output 'F124CH_NO_OLD_OR_PROTECTED_CASE_USED=PASS'
          Write-Output 'F124CH_NO_MODEL_RAN_BEFORE_SOURCE_BIRTH=PASS'
  first-original-internal-source-birth:
    if: github.run_attempt == 1
    needs: frozen-source-only-mathematics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Seal all original 24 unfamiliar E/F task identities and private symbolic oracle BEFORE the scoring job
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:research/north-star-transfer/f124ch_internal_source.py)" = b014c0c80c2278618adf21e4da085b05d1129cf7
          root="$RUNNER_TEMP/f124ch-original-source-birth"
          mkdir -p "$root"
          python3 -B research/north-star-transfer/f124ch_birth_original.py \
            --git-head "$GITHUB_SHA" --out "$root/original-24-case-birth.json"
          python3 -B - "$root/original-24-case-birth.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert len(x['original_all_24_firstuse_cases'])==24
          assert len(set(x['original_all_24_task_digests']))==24
          assert x['original_source_identity']=='INTERNALLY_AUTHORED_NOT_EXTERNAL'
          assert x['case_birth_before_evaluation'] is True
          assert x['model_or_native_scoring_executed'] is False
          assert x['new_EF_replication_cohorts_created'] is False
          assert x['BV_924_925_unchanged'] and x['CE_926_927_unchanged']
          print('F124CH_PRE_SCORING_ALL_24_SOURCE_BIRTHS_SEALED=PASS')
          PY
          (cd "$root" && sha256sum original-24-case-birth.json > original-source-birth.sha256 && sha256sum -c original-source-birth.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: f124ch-original-source-birth-before-scoring
          path: ${{ runner.temp }}/f124ch-original-source-birth/
          retention-days: 90
          if-no-files-found: error
  actual-one-time-blinded-native-and-whole-process-comparison:
    if: github.run_attempt == 1
    needs: first-original-internal-source-birth
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      development_pass: ${{ steps.observations.outputs.development_pass }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: f124ch-original-source-birth-before-scoring
          path: ${{ runner.temp }}/f124ch-original-source-birth/
      - name: Read exact ORIGINAL source-born archive and execute all 24 source-blind cases once; preserve all raw negatives
        id: observations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          birth="$RUNNER_TEMP/f124ch-original-source-birth"
          (cd "$birth" && sha256sum -c original-source-birth.sha256)
          root="$RUNNER_TEMP/f124ch-original-complete-decision-cost"
          mkdir -p "$root"
          export F124CH_ORIGINAL_APPEND_JOURNAL="$root/append-original-168-native-840-process.jsonl"
          python3 -B research/north-star-transfer/f124ch_prospective_eval.py \
            --birth "$birth/original-24-case-birth.json" \
            --out "$root/first-original-EF-all-results.json"
          python3 -B - "$root/first-original-EF-all-results.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='mass.f124ch.original-internal-prospective-EF-840-OS-process.v1'
          assert len(x['original_168_native_preflights'])==168
          assert len(x['original_840_full_OS_process_measurements'])==840
          assert len(x['all_24_prospective_case_outcomes'])==24
          assert x['source_origin_internally_authored_not_external'] is True
          assert not x['independent_research_group_replication_claimed']
          assert not x['old_BV_924_925_and_CE_926_927_firstuse']
          assert not x['new_E_F_128x2_protected_cohorts_opened']
          assert not x['optimizer_or_production_promoted']
          assert not x['science_accepted']
          with open(sys.argv[2],'a') as f:
              f.write('development_pass='+str(x['frozen_scientific_development_gate_passed']).lower()+'\n')
          print('F124CH_ALL_24_EF_PROSPECTIVE_FIRSTUSE_AND_840_OS_PROCESS_NEGATIVES_RETAINED=PASS')
          print('F124CH_GENUINE_INTERNAL_BLINDED_DEVELOPMENT='+str(x['frozen_scientific_development_gate_passed']))
          PY
          (cd "$root" && sha256sum first-original-EF-all-results.json append-original-168-native-840-process.jsonl > ORIGINAL_SHA256SUMS && sha256sum -c ORIGINAL_SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f124ch-original-prospective-EF-168-native-840-process-${{ github.sha }}
          path: ${{ runner.temp }}/f124ch-original-complete-decision-cost/
          retention-days: 90
          if-no-files-found: warn
  final-one-Go-regression-only-after-strict-development-parity:
    needs: actual-one-time-blinded-native-and-whole-process-comparison
    if: needs.actual-one-time-blinded-native-and-whole-process-comparison.outputs.development_pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: One complete Go regression ONLY after original native-work resource admission
        shell: bash
        run: |
          set -euo pipefail
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo F124CH_ONE_COMPLETE_GO_REGRESSION=PASS
          echo F124CH_PROTECTED_EF_COHORTS_NOT_OPENED=true
