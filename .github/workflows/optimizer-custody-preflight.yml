name: FORGE existing optimizer custody read-only preflight
on:
  push:
    branches: [qualification/optimizer-custody-preflight-20261103]
permissions: {}
concurrency:
  group: forge-optimizer-custody-preflight-20261103
  cancel-in-progress: false
jobs:
  existing-owner-readonly:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    steps:
      - name: Read existing private-vault registration without touching owner state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/optimizer-custody-preflight-20261103' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') {
            throw 'OPTIMIZER_CUSTODY_WRONG_EXISTING_OWNER_ROUTE'
          }
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if($event.created -ne $true -or $event.deleted -ne $false -or
             $event.forced -ne $false -or $event.before -cne ('0'*40) -or
             $event.after -cne $env:GITHUB_SHA -or
             $event.sender.login -cne 'spoonman136668-ai') {
            throw 'OPTIMIZER_CUSTODY_CREATE_ONLY_FIRST_ATTEMPT_REQUIRED'
          }
          # Existing authenticated owner session only; never print credentials.
          if(Test-Path Env:GH_TOKEN){Remove-Item Env:GH_TOKEN}
          if(Test-Path Env:GITHUB_TOKEN){Remove-Item Env:GITHUB_TOKEN}
          $PSNativeCommandUseErrorActionPreference=$false
          $who=(& gh api user --jq .login 2>$null | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $who -cne 'spoonman136668-ai') {
            throw 'OPTIMIZER_CUSTODY_EXISTING_OWNER_SESSION_UNAVAILABLE'
          }
          function Read-OwnerPolicy {
            $raw=(& gh api repos/spoonman136668-ai/FORGE/issues/807 2>$null | Out-String)
            if($LASTEXITCODE -ne 0){throw 'OPTIMIZER_CUSTODY_OWNER_POLICY_READ_UNAVAILABLE'}
            $issue=$raw | ConvertFrom-Json
            $p=$issue.body | ConvertFrom-Json
            if($issue.state -cne 'open' -or $issue.user.login -cne 'spoonman136668-ai' -or
               $p.schema -cne 'forge.f139.native-autonomy-feed-owner-policy.v1' -or
               $p.enabled -ne $true -or
               $p.source_sha -cne 'b8d571763e6035b6c7cc602de8c562449142c573' -or
               $p.scientific_first_use -ne $false -or $p.paid_model_calls -ne 0) {
              throw 'OPTIMIZER_CUSTODY_OWNER_POLICY_DRIFT'
            }
            return [string]$issue.body
          }
          $before=Read-OwnerPolicy
          $taskBefore=[string](Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController').State
          if($taskBefore -cnotin @('Running','Ready')){throw 'OPTIMIZER_CUSTODY_OWNER_NOT_ENABLED'}
          $repoRaw=(& gh api repos/spoonman136668-ai/rbackup 2>$null | Out-String)
          if($LASTEXITCODE -ne 0){throw 'OPTIMIZER_CUSTODY_PRIVATE_REPO_READ_UNAVAILABLE'}
          $repo=$repoRaw | ConvertFrom-Json
          if($repo.full_name -cne 'spoonman136668-ai/rbackup' -or $repo.private -ne $true) {
            throw 'OPTIMIZER_CUSTODY_PRIVATE_REPO_IDENTITY_MISMATCH'
          }
          $runnerRaw=(& gh api 'repos/spoonman136668-ai/rbackup/actions/runners?per_page=100' 2>$null | Out-String)
          if($LASTEXITCODE -ne 0){throw 'OPTIMIZER_CUSTODY_CURRENT_RUNNER_READ_UNAVAILABLE'}
          $runners=$runnerRaw | ConvertFrom-Json
          if($runners.total_count -gt 100 -or @($runners.runners).Count -ne $runners.total_count) {
            throw 'OPTIMIZER_CUSTODY_RUNNER_INVENTORY_INCOMPLETE'
          }
          $matching=@($runners.runners | Where-Object {
            $labels=@($_.labels | ForEach-Object {$_.name})
            $labels -contains 'self-hosted' -and $labels -contains 'Windows' -and
            $labels -contains 'X64' -and $labels -contains 'rbackup-custody'
          })
          $online=@($matching | Where-Object {$_.status -ceq 'online'})
          $idle=@($online | Where-Object {$_.busy -eq $false})
          $after=Read-OwnerPolicy
          $taskAfter=[string](Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController').State
          if($before -cne $after -or $taskAfter -cnotin @('Running','Ready')) {
            throw 'OPTIMIZER_CUSTODY_OWNER_CONTINUITY_CHANGED'
          }
          $result=[ordered]@{
            schema='forge.optimizer.existing-custody-preflight.v1'
            source_sha=$env:GITHUB_SHA
            utc=[DateTime]::UtcNow.ToString('o')
            private_repository_verified=$true
            matching_runner_count=$matching.Count
            online_matching_runner_count=$online.Count
            idle_online_matching_runner_count=$idle.Count
            physical_isolation_verified=$false
            independently_signed_optimizer_bundle_verified=$false
            owner_policy_unchanged=$true
            owner_task_state=$taskAfter
            provider_writes=0
            database_reads=0
            new_controllers=0
            paid_model_calls=0
            scientific_first_use=$false
          }
          Write-Host ('OPTIMIZER_EXISTING_CUSTODY_PREFLIGHT='+($result | ConvertTo-Json -Compress))
          if($online.Count -eq 0) {
            Write-Host 'OPTIMIZER_NEXT_INPUT_ACTION=EXISTING_PRIVATE_VAULT_OWNER_ENROLL_OR_RECONNECT_DEDICATED_ISOLATED_RUNNER'
          } else {
            Write-Host 'OPTIMIZER_NEXT_INPUT_ACTION=VERIFY_EXISTING_CUSTODY_WORKFLOW_AND_PHYSICAL_ISOLATION_BEFORE_ANY_EXPORT'
          }
