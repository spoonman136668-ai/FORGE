name: FORGE R29B operator-cleared single original and independent R30 preparation
on:
  push:
    branches: [research/r29b-execute-firstuse]
    paths: ['research/r29b-wingless/launch.json']
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: forge-r29b-single-original
  cancel-in-progress: false
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact operator authorization, CKB wake and once-only ledger
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "${GITHUB_REF}" = refs/heads/research/r29b-execute-firstuse
          test "$(git diff --name-only HEAD^ HEAD)" = research/r29b-wingless/launch.json
          test "$(git rev-parse HEAD:research/r29b-wingless/prereg.json)" = ccc7896760d07adcbc385ac6f1a04b4a449969d7
          test "$(git rev-parse HEAD:research/r29b-wingless/execute.py)" = 86d391121b3bfd058c8d92dbc96cfc248df2288d
          test "$(git rev-parse HEAD:research/r29b-wingless/review.py)" = c2da8b98603f50435a035e2b9979111f521644ad
          mkdir -p "$RUNNER_TEMP/r29b-original"
          git fetch --no-tags origin refs/heads/research/forge-first-use-claims-r29b
          git show FETCH_HEAD:W-FORGE-R29B-SMOOTH-ROBUST-01.json > "$RUNNER_TEMP/r29b-claim.json"
          python3 - <<'PY'
          import json,os
          c=json.load(open(os.environ["RUNNER_TEMP"]+"/r29b-claim.json"))
          for k in ("operator_approval_comment_id","wake_run_id"):
              value=c.get(k)
              if type(value) is not int or not 0<value<2**63:raise SystemExit("R29B_INVALID_EXTERNAL_REFERENCE")
          with open(os.environ["RUNNER_TEMP"]+"/r29b-refs.env","w") as f:
              f.write(f'APPROVAL_ID={c["operator_approval_comment_id"]}\n')
              f.write(f'WAKE_ID={c["wake_run_id"]}\n')
          PY
          source "$RUNNER_TEMP/r29b-refs.env"
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${APPROVAL_ID}" > "$RUNNER_TEMP/r29b-approval.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/forge-r29b-once.yml/runs?event=push&per_page=100" > "$RUNNER_TEMP/r29b-runs.json"
          python3 -B research/r29b-wingless/wake_bridge.py \
            --claim "$RUNNER_TEMP/r29b-claim.json" \
            --launch research/r29b-wingless/launch.json \
            --approval "$RUNNER_TEMP/r29b-approval.json" \
            --runs "$RUNNER_TEMP/r29b-runs.json" \
            --source "$(git rev-parse HEAD^)" \
            --run-id "$GITHUB_RUN_ID" \
            --github-sha "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/r29b-original/clearance.json"
          printf 'FIRST_USE_CONSUMED_BEFORE_SCIENTIFIC_COMPUTE\n' > "$RUNNER_TEMP/r29b-original/started.txt"
      - uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/Wingless
          ref: b1e4972f04142f1f35f76f9483b12491dec4846c
          path: wingless-method
          persist-credentials: false
      - name: Execute bounded and fresh R29B scientific original once
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C wingless-method rev-parse HEAD)" = b1e4972f04142f1f35f76f9483b12491dec4846c
          python3 -B research/r29b-wingless/execute.py \
            --manifest research/r29b-wingless/prereg.json \
            --wingless-root wingless-method \
            --out "$RUNNER_TEMP/r29b-original/original.json" \
            --run-id "$GITHUB_RUN_ID"
          (cd "$RUNNER_TEMP/r29b-original" && sha256sum original.json > original.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-r29b-firstuse-original
          path: ${{ runner.temp }}/r29b-original
          retention-days: 90
          if-no-files-found: warn
  independent-review-and-r30:
    needs: original
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: needs.original.result == 'success'
        with:
          name: forge-r29b-firstuse-original
          path: ${{ runner.temp }}/r29b-evidence
      - name: Quarantine interrupted or indeterminate consumed attempt
        if: needs.original.result != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r29b-evidence"
          printf '{"schema":"forge.r29b.independent-original-review.v1","outcome":"CONSUMED_INDETERMINATE","independently_validated":false,"original_replay_allowed":false,"science_production_accepted":false}\n' > "$RUNNER_TEMP/r29b-evidence/independent-review.json"
      - name: Independently verify raw evidence and prepare R30
        if: needs.original.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r29b-evidence"
          sha256sum --check original.sha256
          test -s clearance.json
          test -s started.txt
          python3 -B "$GITHUB_WORKSPACE/research/r29b-wingless/review.py" \
            --manifest "$GITHUB_WORKSPACE/research/r29b-wingless/prereg.json" \
            --raw "$PWD/original.json" \
            --out "$PWD/independent-review.json"
          python3 -B "$GITHUB_WORKSPACE/research/r29b-wingless/r30_successor.py" \
            --manifest "$GITHUB_WORKSPACE/research/r29b-wingless/prereg.json" \
            --original "$PWD/original.json" \
            --review "$PWD/independent-review.json" \
            --output "$PWD/r30-proposal.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-r29b-independent-review-and-r30
          path: |
            ${{ runner.temp }}/r29b-evidence/independent-review.json
            ${{ runner.temp }}/r29b-evidence/r30-proposal.json
          retention-days: 90
          if-no-files-found: warn
