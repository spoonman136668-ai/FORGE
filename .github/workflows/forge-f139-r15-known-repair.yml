name: FORGE F139 R15 isolated known-repair red-green proof
# Push-only finite source test; not a scheduler, admission or original owner.
on:
  push:
    branches: [proposal/f139-r15-isolated-autorepair-proof-20261022, proposal/f139-r18-unified-recovery-20261022]
permissions:
  contents: read
  actions: read
jobs:
  bounded-known-repair:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout source-only proof under exact branch head
        uses: actions/checkout@v4
        with:
          path: proof
          persist-credentials: false
      - name: Original protected FORGE source, pinned
        uses: actions/checkout@v4
        with:
          ref: 536b91a392b7bbc50200a6e8842d152f2e23d8bb
          path: original
          fetch-depth: 0
          persist-credentials: false
      - name: Previously qualified bounded native recovery, pinned
        uses: actions/checkout@v4
        with:
          ref: 6068f39b5b85cdb4b7770e6700a72077636af679
          path: repaired
          fetch-depth: 0
          persist-credentials: false
      - name: Original authentic failed Windows source, pinned
        uses: actions/checkout@v4
        with:
          ref: 6909880012bcd7161c24c6de1877046ce97bdb7f
          path: failed
          persist-credentials: false
      - name: Independently qualified repaired Windows source, pinned
        uses: actions/checkout@v4
        with:
          ref: 382a6668ca3e63bd4f16b7043bf5f9a7749886f7
          path: qualified
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert integrated R14 and R17 immutable source blobs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = [ordered]@{
            'f139/nci04_native_worker.py' = 'c92d0002a2882bc171a66526da64f24962369847'
            'f139/test_nci04_output_capture.py' = 'd8bfcbd88a71e7bd2cde827ab2cc90a9705c4a91'
            'f139/r15_isolated_autorepair.py' = '0898dc8e26818f8dcc117cfcb2baeb8ceace9748'
            'f139/r15_provider_failure_repair.py' = 'c92096e87214590e74fb0681d243aa6ce410d84c'
            'f139/r16_semantic_repair.py' = '72a0a1f6f99168a30e6b116cea9bbd4a5d4f70be'
            'f139/test_r16_semantic_repair.py' = '819e39821053efc19d04c11d4da0d46b85ef3785'
          }
          foreach ($pair in $expected.GetEnumerator()) {
            $actual = (& git -C proof hash-object $pair.Key | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -cne $pair.Value) {
              throw ('R18_QUALIFIED_SOURCE_BLOB_DRIFT_' + $pair.Key)
            }
          }
          Write-Output 'R18_SOURCE_INTEGRATION_BLOBS=6_OF_6_PASS'
      - name: Automatically reproduce, repair in isolation, and qualify
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:GITHUB_REF -cnotin @('refs/heads/proposal/f139-r15-isolated-autorepair-proof-20261022', 'refs/heads/proposal/f139-r18-unified-recovery-20261022') -or
              $env:OPENAI_API_KEY -or $env:F139_WORKER_HMAC_KEY) {
            throw 'R15_ISOLATION_OR_SOURCE_DRIFT'
          }
          python -B proof/f139/r15_isolated_autorepair.py original repaired
          if ($LASTEXITCODE -ne 0) { throw 'R15_GENUINE_REPAIR_REHEARSAL_FAILED' }
          Write-Output 'R15_ISOLATED_RED_GREEN_NATIVE_REPAIR=PASS'
          Write-Output 'R15_OWNER_CONTROLLER_AND_SCIENCE_UNTOUCHED=TRUE'
      - name: Read authenticated immutable GitHub run and job evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path evidence -ErrorAction Stop | Out-Null
          $repo = 'spoonman136668-ai/FORGE'
          & gh api "repos/$repo/actions/runs/39782884958" > evidence/failed-run.json
          if ($LASTEXITCODE -ne 0) { throw 'R15_FAILED_PROVIDER_RUN_NOT_AUTHENTICATED' }
          & gh api "repos/$repo/actions/runs/39783112103" > evidence/passed-run.json
          if ($LASTEXITCODE -ne 0) { throw 'R15_QUALIFIED_PROVIDER_RUN_NOT_AUTHENTICATED' }
          & gh api "repos/$repo/actions/runs/39782884958/jobs?per_page=100" > evidence/failed-jobs.json
          if ($LASTEXITCODE -ne 0) { throw 'R15_FAILED_PROVIDER_JOBS_NOT_AUTHENTICATED' }
          & gh api "repos/$repo/actions/runs/39783112103/jobs?per_page=100" > evidence/passed-jobs.json
          if ($LASTEXITCODE -ne 0) { throw 'R15_QUALIFIED_PROVIDER_JOBS_NOT_AUTHENTICATED' }
          & gh api "repos/$repo/actions/jobs/119838389983/logs" > evidence/failed-log.txt
          $match = if ((Test-Path evidence/failed-log.txt)) {
            Select-String -Path evidence/failed-log.txt -Pattern 'PermissionError: \[WinError 32\]' -Quiet
          } else { $false }
          if ($LASTEXITCODE -ne 0 -or -not $match) {
            & gh run view 39782884958 --repo $repo --job 119838389983 --log > evidence/failed-log.txt
            if ($LASTEXITCODE -ne 0) { throw 'R15_ORIGINAL_FAILURE_LOG_NOT_AUTHENTICATED' }
          }
          Write-Output 'R15_PROVIDER_LOG_AND_JOB_GET=PASS'
      - name: Select known repair from actual provider failure evidence and verify exact result
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GH_TOKEN -or $env:GITHUB_TOKEN -or $env:OPENAI_API_KEY -or
              $env:F139_WORKER_HMAC_KEY) {
            throw 'R15_REPAIR_STEP_CREDENTIAL_INHERITANCE_REJECTED'
          }
          $env:PYTHONPATH = (Resolve-Path -LiteralPath 'proof').Path
          python -B -m unittest -v f139.test_r16_semantic_repair
          if ($LASTEXITCODE -ne 0) { throw 'R16_AST_REPAIR_ADVERSARIAL_NEGATIVE' }
          Write-Output 'R16_SYNTHESIS_FOCUSED=PASS'
          python -B proof/f139/r15_provider_failure_repair.py evidence failed qualified
          if ($LASTEXITCODE -ne 0) { throw 'R16_AUTHENTIC_FAILURE_DRIVEN_REPAIR_FAILED' }
          Write-Output 'R16_AUTHENTIC_PROVIDER_DRIVEN_AST_REPAIR=PASS'
