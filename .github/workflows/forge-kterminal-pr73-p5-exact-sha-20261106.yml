name: FORGE K-Terminal PR78 exact-SHA final Windows qualification with P5 assertion custody
on:
  push:
    branches: [qualification/kterminal-pr73-p5-source-20261106]
    paths: [.github/workflows/forge-kterminal-pr73-p5-exact-sha-20261106.yml]
permissions:
  contents: read
concurrency:
  group: forge-kterminal-pr73-p5-exact-sha
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      FORGE_BASE: e63ce9d9ce48afbe5697798a86db7cb61db51cbf
      KTERM_SHA: 070ad561de7183f7f28e363d96d354a62f509172
      KTERM_TREE: e5e611ef50a8dd0b5b4ba5c5947c7320c08d31ae
      KTERM_BASELINE: 5011b62101b338a0744552f9496edaa737a181bb
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
    steps:
      - name: Checkout exact FORGE qualification scope
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify isolated hosted Windows runner and workflow-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'spoonman136668-ai/FORGE'
          test "$GITHUB_REF" = 'refs/heads/qualification/kterminal-pr73-p5-source-20261106'
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$FORGE_BASE" HEAD
          test "$(git diff --name-only "$FORGE_BASE" HEAD)" = '.github/workflows/forge-kterminal-pr73-p5-exact-sha-20261106.yml'
          test -z "$(git status --porcelain)"
          echo KTERM_RC2_FORGE_SCOPE=PASS
      - name: Checkout private K-Terminal exact source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Kboomllc/K-Terminal
          ref: 070ad561de7183f7f28e363d96d354a62f509172
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Set up pinned original Windows Go 1.26.5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify private source identity, clean checkout and zero broker authority
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          test "$(git rev-parse HEAD)" = "$KTERM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$KTERM_TREE"
          test "$(git rev-parse HEAD:go.mod)" = 'b3ede0d8444c08b3e7b23f1396374359b54134c6'
          test "$(git rev-parse HEAD:dashboard-ui.ps1)" = 'd05a1f0e258560dacf4585de1164ae1bb6bb85ea'
          test "$(git rev-parse HEAD:pkg/p5-runtime-latency-observer.go)" = '44eed034cba007601b8bf79f6d54d4d9b6930517'
          test "$(git rev-parse HEAD:pkg/p5-runtime-latency-observer_test.go)" = '1997d963ef501a7ff11d69868ce6291f48803595'
          test "$(git rev-parse HEAD:pkg/native-vwap-diagnostic-one-shot.go)" = '856339788928c054996763b9ccd7528a6c9c6d65'
          test "$(git rev-parse HEAD:pkg/native-vwap-diagnostic-post-transport_test.go)" = 'b4bbfde23526f1d94f57d60d2838f4ea50b7b301'
          test "$(git rev-parse HEAD:pkg/native-vwap-diagnostic-prepost-boundary_test.go)" = '0132b744bec8395305fb235179a8076608db524e'
          test "$(git rev-parse HEAD:pkg/tranche-pressure-cycle_test.go)" = '4954c4840e8dab9b65b7aa49061166565bfa0352'
          test "$(git rev-parse HEAD:pkg/tranche-breadth-cycle_test.go)" = '91d9657293d195cf16406d8b7df50b50f3c47935'
          test "$(git rev-parse HEAD:pkg/tranche-pressure-live_test.go)" = '2eb0ae96490d331c763b6fe2a75c06408ae65b67'
          test -z "$(git status --porcelain)"
          test ! -e .env
          test ! -e config.json
          go version | grep -F 'go1.26.5 windows/amd64' >/dev/null
          for name in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET KTERM_COINBASE_TEST_KEY_NAME KTERM_COINBASE_TEST_KEY_SECRET K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK; do
            if [[ -n "${!name:-}" ]]; then echo KTERM_RC2_BROKER_AUTHORITY_REFUSED; exit 2; fi
          done
          safe="$RUNNER_TEMP/kterm-rc2-safe"
          mkdir -p "$safe"
          echo PASS > "$safe/source.ok"
          echo KTERM_RC2_EXACT_SOURCE=PASS
      - name: Validate original PowerShell desktop parser without running application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = Join-Path $env:GITHUB_WORKSPACE 'kterminal-private\dashboard-ui.ps1'
          $tokens = $null
          $issues = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$issues)
          if ($null -eq $ast -or @($issues).Count -ne 0) { throw 'PR73_WPF_PARSE_FAILED' }
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'kterm-rc2-safe\wpf.ok') -Value 'PASS' -NoNewline
          Write-Host 'KTERM_PR73_WPF_PARSER=PASS;INTERACTIVE_DESKTOP=NOT_TESTED'
      - name: PR78 original one-POST safety, failed-evidence and transport controls
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kterminal-pr78-safety"
          mkdir -p "$root/tail" "$root/post" "$root/private"
          export K_TERMINAL_TEST_WORKSPACE="$root"
          export KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT="$root/tail"
          export KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT="$root/post"
          export KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT="$root/private"
          go test -json -p 1 -count=1 -timeout 20m '-run=^TestVWAPDiagnosticOneBuy' ./pkg > "$RUNNER_TEMP/kterminal-pr78-safety-private.jsonl" 2> "$RUNNER_TEMP/kterminal-pr78-safety-private.stderr"
          python -B - <<'PY'
          import json,os,pathlib,sys
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          expected={
            "TestVWAPDiagnosticOneBuyRequiresExactOptInAndOnePostDurability",
            "TestVWAPDiagnosticOneBuyAdversarialFinalAmountsFailBeforeLock",
            "TestVWAPDiagnosticOneBuyRejectsPartialEnvironmentAndWrongSide",
            "TestVWAPDiagnosticOneBuyFinalizedNativeRequestEnforcesCapBeforeEvidence",
            "TestVWAPDiagnosticOneBuyMinimumPromotionCannotBreakEightDollarCap",
            "TestVWAPDiagnosticOneBuyKnownPrePOSTEvidenceFailurePreservesUnusedPOST",
            "TestVWAPDiagnosticOneBuyTransportLockOnlyAfterFinalGuards",
            "TestVWAPDiagnosticOneBuyTransportConcurrentOnePOST",
            "TestVWAPDiagnosticOneBuyMissingTransportContextFailsClosed",
          }
          passed=set(); failed=set(); malformed=events=0
          for line in (root/"kterminal-pr78-safety-private.jsonl").open(encoding="utf-8-sig",errors="replace"):
            try: e=json.loads(line)
            except (ValueError,TypeError): malformed+=1;continue
            if not isinstance(e,dict): malformed+=1;continue
            events+=1
            n=e.get("Test"); a=e.get("Action")
            if a=="pass" and n in expected: passed.add(n)
            if a=="fail" and isinstance(n,str): failed.add(n)
          ok=(events>0 and malformed==0 and not failed and passed==expected)
          print("PR78_SAFETY_EXPECTED_PASS="+str(len(passed))+"/"+str(len(expected)))
          print("PR78_SAFETY_DISPOSITION="+("PASS" if ok else "FAIL"))
          if not ok:sys.exit(2)
          PY
          echo PASS > "$RUNNER_TEMP/kterm-rc2-safe/safety.ok"
      - name: Fixed-clock pressure test and stale-evidence negative controls
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kterminal-pressure-clock"
          mkdir -p "$root/tail" "$root/post" "$root/private"
          export K_TERMINAL_TEST_WORKSPACE="$root"
          export KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT="$root/tail"
          export KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT="$root/post"
          export KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT="$root/private"
          go test -json -p 1 -count=12 -timeout 14m '-run=^TestPressureTPBoundaryUsesCurrentFeedNotPreviousVote$' ./pkg > "$RUNNER_TEMP/pressure-clock-private.jsonl" 2> "$RUNNER_TEMP/pressure-clock-private.stderr"
          pat='^Test(BreadthFirstReservationFailsClosedForExpiredFlatChangedAndWriteFailure|LivePressureRejectsBadMissingStaleEvidence|BreadthFirstBuyUsesLatestFlatEvidenceAndRejectsRacingObservation)$'
          go test -json -p 1 -count=1 -timeout 14m "-run=$pat" ./pkg > "$RUNNER_TEMP/pressure-negative-private.jsonl" 2> "$RUNNER_TEMP/pressure-negative-private.stderr"
          python -B - <<'PY'
          import json,os,pathlib,sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          target='TestPressureTPBoundaryUsesCurrentFeedNotPreviousVote'
          controls={
            'TestBreadthFirstReservationFailsClosedForExpiredFlatChangedAndWriteFailure',
            'TestLivePressureRejectsBadMissingStaleEvidence',
            'TestBreadthFirstBuyUsesLatestFlatEvidenceAndRejectsRacingObservation'
          }
          def result(file):
            passed={};failed=[];bad=events=0
            for raw in (root/file).open(encoding='utf-8-sig',errors='replace'):
              try:e=json.loads(raw)
              except (TypeError,ValueError):bad+=1;continue
              if not isinstance(e,dict):bad+=1;continue
              events+=1
              n,a=e.get('Test'),e.get('Action')
              if a=='pass' and isinstance(n,str):passed[n]=passed.get(n,0)+1
              if a=='fail':failed.append(n or 'PACKAGE')
            return passed,failed,bad,events
          a,af,ab,ae=result('pressure-clock-private.jsonl')
          b,bf,bb,be=result('pressure-negative-private.jsonl')
          count=sum(b.get(n,0)==1 for n in controls)
          ok=(ae>0 and be>0 and ab==0 and bb==0 and not af and not bf
              and a.get(target,0)==12 and count==len(controls))
          print('KTERM_PRESSURE_FIXED_CLOCK_REPETITIONS='+str(a.get(target,0))+'/12')
          print('KTERM_PRESSURE_STALE_NEGATIVE_CONTROLS='+str(count)+'/'+str(len(controls)))
          print('KTERM_PRESSURE_FIXED_CLOCK_DISPOSITION='+('PASS' if ok else 'FAIL'))
          if not ok:sys.exit(2)
          PY
          echo PASS > "$RUNNER_TEMP/kterm-rc2-safe/pressure.ok"
      - name: Focused P5 observer privacy, original POST guards and reconciliation controls
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          pat='^(TestP5LatencyDisabledByDefaultAndUnknownOperationRefused|TestP5StrictOutputExcludesTradingIdentifiersAndRawErrors|TestP5BucketCountsAndTimingGuards|TestP5AcceptedPersistencePhasesRemainPrivate|TestP5OriginalTrackPaginationReadOnlyAndBucketed|TestP5OneShotDiagnosticOriginalNativeSignal|TestP5OnlyOriginalOrderCreationPostReportsResponseHeaders|TestHistoricalPnLDormantAccountWarmRefreshAvoidsOldTransactionPages|TestHistoricalPnLCompleteThenWarmThenDueAuditPaging|TestHistoricalPnLFullAuditClockAndImmutableJournal|TestHistoricalPnLFullAuditClockMetadataFailureAndRecovery|TestHistoricalPnLReconciliationScopesAnchorsToConfiguredPortfolio)$'
          root="$RUNNER_TEMP/kterm-rc2-focused-isolation"
          mkdir -p "$root/tail" "$root/post" "$root/private"
          export K_TERMINAL_TEST_WORKSPACE="$root"
          export KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT="$root/tail"
          export KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT="$root/post"
          export KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT="$root/private"
          go test -json -p 1 -count=1 -timeout 16m "-run=$pat" ./pkg > "$RUNNER_TEMP/kterm-rc2-focused-private.jsonl" 2> "$RUNNER_TEMP/kterm-rc2-focused-private.stderr"
          python -B - <<'PY'
          import json,os,pathlib,re,sys
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'kterm-rc2-focused-private.jsonl'
          required={'TestP5LatencyDisabledByDefaultAndUnknownOperationRefused',
                    'TestP5StrictOutputExcludesTradingIdentifiersAndRawErrors',
                    'TestP5BucketCountsAndTimingGuards',
                    'TestP5AcceptedPersistencePhasesRemainPrivate',
                    'TestP5OriginalTrackPaginationReadOnlyAndBucketed',
                    'TestP5OneShotDiagnosticOriginalNativeSignal',
                    'TestP5OnlyOriginalOrderCreationPostReportsResponseHeaders',
                    'TestHistoricalPnLCompleteThenWarmThenDueAuditPaging',
                    'TestHistoricalPnLFullAuditClockAndImmutableJournal',
                    'TestHistoricalPnLFullAuditClockMetadataFailureAndRecovery',
                    'TestHistoricalPnLDormantAccountWarmRefreshAvoidsOldTransactionPages',
                    'TestHistoricalPnLReconciliationScopesAnchorsToConfiguredPortfolio'}
          allowed=re.compile(r'^Test[A-Za-z0-9_]+(?:/[A-Za-z0-9_.#-]+)*$')
          passed=set();failed=set();bad=events=0
          for line in path.open(encoding='utf-8-sig',errors='replace'):
            try:e=json.loads(line)
            except (ValueError,TypeError):bad+=1;continue
            if not isinstance(e,dict):bad+=1;continue
            events+=1
            name,action=e.get('Test'),e.get('Action')
            if isinstance(name,str) and allowed.fullmatch(name):
              if action=='pass' and name in required:passed.add(name)
              if action=='fail':failed.add(name)
          ok=events>0 and bad==0 and not failed and required.issubset(passed)
          print('KTERM_PR73_FOCUSED_REQUIRED_PASS='+str(len(passed)))
          print('KTERM_PR73_FOCUSED_REQUIRED_TOTAL='+str(len(required)))
          print('KTERM_PR73_FOCUSED_DISPOSITION='+('PASS' if ok else 'FAIL'))
          if not ok:sys.exit(2)
          PY
          echo PASS > "$RUNNER_TEMP/kterm-rc2-safe/focused.ok"
          echo KTERM_RC2_FOCUSED=PASS
      - name: One mandatory full original Windows Go regression with sanitized timing custody
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kterm-rc2-full-isolation"
          mkdir -p "$root/tail" "$root/post" "$root/private"
          export K_TERMINAL_TEST_WORKSPACE="$root"
          export KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT="$root/tail"
          export KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT="$root/post"
          export KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT="$root/private"
          started=$(date +%s)
          set +e
          go test -json -p 1 -count=1 -timeout 60m ./... > "$RUNNER_TEMP/kterm-rc2-full-private.jsonl" 2> "$RUNNER_TEMP/kterm-rc2-full-private.stderr"
          rc=$?
          set -e
          elapsed=$(( $(date +%s) - started ))
          KTERM_FULL_RC="$rc" KTERM_WALL_SECONDS="$elapsed" python -B - <<'PY'
          import hashlib, json, os, pathlib, re, sys
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          safe = temp / 'kterm-rc2-safe'
          safe.mkdir(exist_ok=True)
          raw = temp / 'kterm-rc2-full-private.jsonl'
          test_pat = re.compile(r'^Test[A-Za-z0-9_]+(?:/[A-Za-z0-9_.#-]+)*$')
          package_pat = re.compile(r'^k-terminal/[A-Za-z0-9_./-]+$')
          tests, packages, failed_tests, failed_packages = [], [], set(), set()
          failure_classes = set()
          target = 'TestPrototypeConsumedInitialNativeProtectedAuthorityNegatives/BTC-USDC/foreign_signal_session'
          classes = {
              'expired_quote_snapshot': 'stale or future quote snapshot',
              'expired_account_snapshot': 'stale or future account snapshot',
              'expired_product_snapshot': 'stale or future product snapshot',
              'snapshot_premise': 'foreign authority control failed an unrelated snapshot premise',
              'authority_premise': 'original current authority premise is invalid',
              'incorrect_foreign_rejection': 'actual protected native authority did not specifically reject foreign evidence',
              'changed_financial_or_journal_bytes': 'foreign authority rejection changed exact financial/journal/claim bytes',
          }
          # Preserve P5 assertion identity without exporting raw/private test output.
          p5_target = 'TestP5OneShotDiagnosticOriginalNativeSignal/unknown_first_post_no_retry'
          p5_classes = {
              'p5_post_count_mismatch':'one-POST diagnostic outcome mismatch:',
              'p5_unknown_outcome_not_retained':'unknown/blocked POST did not retain uncertainty:',
              'p5_same_event_replay':'same-event duplicate replayed a POST:',
              'p5_fresh_construction_replay':'fresh native construction replayed or changed original receipt:',
              'p5_cold_process_replay':'broker-free cold-process replay failed:',
              'p5_missing_original_receipt':'original native receipt not retained for replay:',
              'p5_cold_process_receipt_mutated':'cold-process replay mutated receipt or reached venue:',
              'p5_accepted_case_unexpected_error':'accepted synthetic native maker call failed:',
          }
          event_count = malformed_count = 0
          if raw.is_file():
              with raw.open('r', encoding='utf-8-sig', errors='replace') as src:
                  for line in src:
                      try: e = json.loads(line)
                      except (ValueError, TypeError):
                          malformed_count += 1
                          continue
                      if not isinstance(e, dict):
                          malformed_count += 1
                          continue
                      event_count += 1
                      action, test, package, elapsed = (e.get(x) for x in ('Action','Test','Package','Elapsed'))
                      if action == 'output' and test == target:
                          output = e.get('Output')
                          if isinstance(output,str):
                              for category, phrase in classes.items():
                                  if phrase in output: failure_classes.add(category)
                      if action == 'output' and test == p5_target:
                          output = e.get('Output')
                          if isinstance(output,str):
                              for category, phrase in p5_classes.items():
                                  if phrase in output: failure_classes.add(category)
                      if action == 'fail':
                          if isinstance(test,str) and test_pat.fullmatch(test): failed_tests.add(test)
                          elif test is None and isinstance(package,str) and package_pat.fullmatch(package): failed_packages.add(package)
                      if action != 'pass' or not isinstance(elapsed,(float,int)) or not 0 <= elapsed < 100000:
                          continue
                      if isinstance(test,str) and test_pat.fullmatch(test):
                          tests.append({'name':test,'seconds':round(float(elapsed),5)})
                      elif test is None and isinstance(package,str) and package_pat.fullmatch(package):
                          packages.append({'name':package,'seconds':round(float(elapsed),5)})
          if p5_target in failed_tests and not any(z.startswith('p5_') for z in failure_classes):
              failure_classes.add('p5_failure_unclassified')
          payload = {
              'schema':'kterminal-regression-durations.forge.v1',
              'kterminal_source_sha':os.environ['KTERM_SHA'],
              'kterminal_source_tree':os.environ['KTERM_TREE'],
              'forge_qualification_sha':os.environ['GITHUB_SHA'],
              'baseline_sha':os.environ['KTERM_BASELINE'],
              'toolchain':'go1.26.5 windows/amd64',
              'command':'go test -json -p 1 -count=1 -timeout 60m ./...',
              'full_test_exit':int(os.environ['KTERM_FULL_RC']),
              'wall_seconds':int(os.environ['KTERM_WALL_SECONDS']),
              'event_count':event_count,
              'malformed_count':malformed_count,
              'top_tests':sorted(tests,key=lambda z:z['seconds'],reverse=True)[:12],
              'top_packages':sorted(packages,key=lambda z:z['seconds'],reverse=True)[:12],
              'failed_tests':sorted(failed_tests),
              'failure_classes':sorted(failure_classes),
              'failed_packages':sorted(failed_packages),
              'private_logs_exported':False,
              'broker_orders':0,
              'field_performance_verified':False,
          }
          contents = json.dumps(payload,sort_keys=True,separators=(',',':')).encode()
          (safe/'durations.json').write_bytes(contents)
          (safe/'durations.sha256').write_text(hashlib.sha256(contents).hexdigest(),encoding='ascii')
          qualified = (payload['full_test_exit']==0 and event_count>0 and malformed_count==0 and
                       len(tests)>0 and len(packages)>0 and not failed_tests and not failed_packages)
          if qualified:
              (safe/'full.ok').write_text('PASS',encoding='ascii')
          print('KTERM_RC2_FULL_DISPOSITION='+('PASS' if qualified else 'FAIL'))
          print('KTERM_RC2_FULL_EVENT_COUNT='+str(event_count))
          print('KTERM_RC2_FAILURE_CLASSES='+','.join(sorted(failure_classes)))
          print('KTERM_RC2_TIMING_DIGEST='+hashlib.sha256(contents).hexdigest())
          if not qualified: sys.exit(2)
          PY
      - name: Vet complete original Windows source
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          go vet ./... > "$RUNNER_TEMP/kterm-rc2-vet-private.log" 2>&1
          echo PASS > "$RUNNER_TEMP/kterm-rc2-safe/vet.ok"
          echo KTERM_RC2_VET=PASS
      - name: Build unpromoted original Windows K-Terminal engine
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/kterm-rc2-unpromoted-engine.exe" . > "$RUNNER_TEMP/kterm-rc2-build-private.log" 2>&1
          test -f "$RUNNER_TEMP/kterm-rc2-unpromoted-engine.exe"
          echo PASS > "$RUNNER_TEMP/kterm-rc2-safe/build.ok"
          echo KTERM_RC2_BUILD=PASS
      - name: Seal privacy-safe exact-SHA qualification receipt, even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib,json,os,pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          safe = temp/'kterm-rc2-safe'
          safe.mkdir(exist_ok=True)
          flags={n:((safe/(n+'.ok')).read_text(encoding='ascii').strip() if (safe/(n+'.ok')).is_file() else 'NOT_RUN') for n in ('source','wpf','safety','pressure','focused','full','vet','build')}
          dur=safe/'durations.json'
          digest=safe/'durations.sha256'
          actual=hashlib.sha256(dur.read_bytes()).hexdigest() if dur.is_file() else None
          declared=digest.read_text(encoding='ascii').strip() if digest.is_file() else None
          duration_status='MATCH' if actual and actual==declared else ('MISSING' if not actual or not declared else 'MISMATCH')
          passed=all(v=='PASS' for v in flags.values()) and duration_status=='MATCH'
          receipt={
              'schema':'forge.kterminal.pr78-fixed-clock.original-windows.v1',
              'forge_qualification_sha':os.environ['GITHUB_SHA'],
              'kterminal_source_sha':os.environ['KTERM_SHA'],
              'kterminal_source_tree':os.environ['KTERM_TREE'],
              'baseline_sha':os.environ['KTERM_BASELINE'],
              'disposition':'FULL_VET_BUILD_AND_DURATION_PASS_UNPROMOTED' if passed else 'QUALIFICATION_BLOCKED',
              'checks':flags,
              'duration_evidence_status':duration_status,
              'duration_sha256':actual if duration_status=='MATCH' else None,
              'desktop_accepted':False,
              'field_performance_verified':False,
              'installed':False,
              'merged_or_promoted':False,
              'broker_orders':0,
              'production_data_changed':False,
          }
          body=json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()
          (safe/'receipt.json').write_bytes(body)
          (safe/'receipt.sha256').write_text(hashlib.sha256(body).hexdigest(),encoding='ascii')
          print('KTERM_RC2_QUALIFICATION='+receipt['disposition'])
          print('KTERM_RC2_RECEIPT_DIGEST='+hashlib.sha256(body).hexdigest())
          PY
