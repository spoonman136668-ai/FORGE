name: FORGE K-Terminal PR78 known-prePOST negative control (offline)
on:
  push:
    branches: [qualification/kterminal-pr73-p5-source-20261106]
    paths: [.github/workflows/forge-kterminal-pr73-p5-exact-sha-20261106.yml]
permissions:
  contents: read
concurrency:
  group: forge-kterminal-pr78-prepost-negative-control
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      FORGE_BASE: 25075376cec877f94f9389577ab32695230741d0
      KTERM_SHA: e2b887f63f017d3a84d0c714589a31d94368e3a6
      KTERM_TREE: 3c291d3a0f76801babcfe425abc3402c03d0cc19
      KTERM_BASELINE: 248326e5ae994fa710ecaea2fc61ff422863f8e8
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
    steps:
      - name: Checkout exact FORGE qualification branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify isolated hosted Windows and workflow-only change
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'spoonman136668-ai/FORGE'
          test "$GITHUB_REF" = 'refs/heads/qualification/kterminal-pr73-p5-source-20261106'
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$FORGE_BASE" HEAD
          test "$(git diff --name-only "$FORGE_BASE" HEAD)" = '.github/workflows/forge-kterminal-pr73-p5-exact-sha-20261106.yml'
          test -z "$(git status --porcelain)"
          echo PR78_FORGE_SCOPE=PASS
      - name: Checkout exact private K Terminal source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: e2b887f63f017d3a84d0c714589a31d94368e3a6
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Set up original pinned Windows Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify exact PR78 source, test custody, and zero live authority
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$KTERM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$KTERM_TREE"
          test "$(git rev-parse HEAD:go.mod)" = b3ede0d8444c08b3e7b23f1396374359b54134c6
          test "$(git rev-parse HEAD:pkg/native-vwap-diagnostic-one-shot.go)" = a6e33346f8e4a3fb0c2142106f15cf0dd9a2defd
          test "$(git rev-parse HEAD:pkg/native-vwap-diagnostic-prepost-boundary_test.go)" = 0132b744bec8395305fb235179a8076608db524e
          test -z "$(git status --porcelain)"
          test ! -e .env
          test ! -e config.json
          go version | grep -F 'go1.26.5 windows/amd64' >/dev/null
          for name in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET KTERM_COINBASE_TEST_KEY_NAME KTERM_COINBASE_TEST_KEY_SECRET K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK; do
            if [[ -n "${!name:-}" ]]; then echo PR78_BROKER_OR_LIVE_OPTIN_REFUSED; exit 2; fi
          done
          mkdir -p "$RUNNER_TEMP/kterminal-pr78-safe"
          echo PASS > "$RUNNER_TEMP/kterminal-pr78-safe/source.ok"
          echo PR78_EXACT_SOURCE_ZERO_AUTHORITY=PASS
      - name: Recheck the existing five PR78 safety tests (no broker)
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          pattern='^TestVWAPDiagnosticOneBuy(RequiresExactOptInAndOnePostDurability|AdversarialFinalAmountsFailBeforeLock|RejectsPartialEnvironmentAndWrongSide|FinalizedNativeRequestEnforcesCapBeforeEvidence|MinimumPromotionCannotBreakEightDollarCap)$'
          go test -json -p 1 -count=1 -timeout 12m "-run=$pattern" ./pkg > "$RUNNER_TEMP/kterminal-pr78-focused-private.jsonl" 2> "$RUNNER_TEMP/kterminal-pr78-focused-private.stderr"
          python -B - <<'PY'
          import json,os,pathlib,re,sys
          file=pathlib.Path(os.environ['RUNNER_TEMP'])/'kterminal-pr78-focused-private.jsonl'
          required={'TestVWAPDiagnosticOneBuyRequiresExactOptInAndOnePostDurability','TestVWAPDiagnosticOneBuyAdversarialFinalAmountsFailBeforeLock','TestVWAPDiagnosticOneBuyRejectsPartialEnvironmentAndWrongSide','TestVWAPDiagnosticOneBuyFinalizedNativeRequestEnforcesCapBeforeEvidence','TestVWAPDiagnosticOneBuyMinimumPromotionCannotBreakEightDollarCap'}
          passed=set();failed=set();bad=events=0
          for raw in file.open(encoding='utf-8-sig',errors='replace'):
            try: event=json.loads(raw)
            except (ValueError,TypeError): bad+=1;continue
            if not isinstance(event,dict): bad+=1;continue
            events+=1
            test=event.get('Test')
            if isinstance(test,str) and event.get('Action')=='pass' and test in required: passed.add(test)
            if isinstance(test,str) and event.get('Action')=='fail': failed.add(test)
          ok=events>0 and bad==0 and not failed and required.issubset(passed)
          print('PR78_POSITIVE_SAFETY_TESTS='+str(len(passed))+'/'+str(len(required)))
          print('PR78_POSITIVE_DISPOSITION='+('PASS' if ok else 'FAIL'))
          if not ok: sys.exit(2)
          PY
          echo PASS > "$RUNNER_TEMP/kterminal-pr78-safe/positive.ok"
      - name: Demonstrate known-unsent evidence failure consumes the one-POST lock
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          set +e
          go test -json -p 1 -count=1 -timeout 8m '-run=^TestVWAPDiagnosticOneBuyKnownPrePOSTEvidenceFailurePreservesUnusedPOST$' ./pkg > "$RUNNER_TEMP/kterminal-pr78-negative-private.jsonl" 2> "$RUNNER_TEMP/kterminal-pr78-negative-private.stderr"
          rc=$?
          set -e
          PR78_NEGATIVE_TEST_RC="$rc" python -B - <<'PY'
          import json,os,pathlib,sys
          file=pathlib.Path(os.environ['RUNNER_TEMP'])/'kterminal-pr78-negative-private.jsonl'
          target='TestVWAPDiagnosticOneBuyKnownPrePOSTEvidenceFailurePreservesUnusedPOST'
          marker='known pre-POST evidence failure burned the one-POST allowance'
          failed=0;passed=0;matched=False;other_fail=[];malformed=events=0
          for raw in file.open(encoding='utf-8-sig',errors='replace'):
            try: e=json.loads(raw)
            except (ValueError,TypeError): malformed+=1;continue
            if not isinstance(e,dict): malformed+=1;continue
            events+=1
            name=e.get('Test');action=e.get('Action')
            if name==target and action=='fail': failed+=1
            if name==target and action=='pass': passed+=1
            if action=='fail' and isinstance(name,str) and name!=target: other_fail.append(name)
            if name==target and action=='output' and isinstance(e.get('Output'),str) and marker in e['Output']: matched=True
          ok=(int(os.environ['PR78_NEGATIVE_TEST_RC'])!=0 and failed==1 and passed==0 and matched and not other_fail and malformed==0 and events>0)
          print('PR78_KNOWN_PREPOST_LOCK_CONSUMPTION='+('CONFIRMED' if ok else 'UNVERIFIED'))
          print('PR78_NEGATIVE_TEST_EXPECTED_FAIL='+('PASS' if ok else 'FAIL'))
          if not ok: sys.exit(2)
          PY
          echo PASS > "$RUNNER_TEMP/kterminal-pr78-safe/negative.ok"
      - name: Seal evidence of diagnostic only (not regression or trade acceptance)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import os,json,hashlib,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'kterminal-pr78-safe'
          root.mkdir(exist_ok=True)
          checks={name: ('PASS' if (root/(name+'.ok')).is_file() and (root/(name+'.ok')).read_text().strip()=='PASS' else 'NOT_VERIFIED') for name in ('source','positive','negative')}
          ok=all(v=='PASS' for v in checks.values())
          obj={'schema':'forge.kterminal.pr78.prepost-negative.v1','forge_qualification_sha':os.environ['GITHUB_SHA'],'kterminal_source_sha':os.environ['KTERM_SHA'],'kterminal_source_tree':os.environ['KTERM_TREE'],'baseline_sha':os.environ['KTERM_BASELINE'],'checks':checks,'disposition':'PREPOST_NEGATIVE_DEFECT_CONFIRMED_DEVELOPMENT_ONLY' if ok else 'DIAGNOSTIC_UNVERIFIED','full_regression':'NOT_RUN_INTENTIONALLY_FAILING_TEST','vet':'NOT_RUN','build':'NOT_RUN','installed':False,'live_authorized':False,'broker_orders':0,'deployment_accepted':False}
          body=json.dumps(obj,sort_keys=True,separators=(',',':')).encode()
          (root/'receipt.json').write_bytes(body)
          digest=hashlib.sha256(body).hexdigest()
          (root/'receipt.sha256').write_text(digest)
          print('PR78_DIAGNOSTIC_DISPOSITION='+obj['disposition'])
          print('PR78_RECEIPT_SHA256='+digest)
          PY
      - name: Upload sanitized receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kterminal-pr78-prepost-negative-safe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kterminal-pr78-safe/receipt.json
            ${{ runner.temp }}/kterminal-pr78-safe/receipt.sha256
          retention-days: 30
          if-no-files-found: error
