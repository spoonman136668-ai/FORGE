name: FORGE CPU LLM G80 original GPT2 phase-cost attribution
on:
  push:
    branches: [research/cpu-llm-g80-original-phase-profile-20261030]
    paths:
      - '.github/workflows/forge-cpu-llm-g80-original-phase-profile.yml'
      - 'research/cpu_g80/**'
permissions:
  contents: read
concurrency:
  group: forge-cpu-g80-original-latency-profile
  cancel-in-progress: false
jobs:
  frozen-source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable G70 source and prereg frozen before executable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD
          git merge-base --is-ancestor b2d8b285b004cb2e496f7541a4c8edd5d545e329 HEAD
          test "$(git rev-parse HEAD:docs/research/CPU-G80-GPT2-ORIGINAL-PHASE-COST-PREREG-20261030.md)" = "$(git rev-parse b2d8b285b004cb2e496f7541a4c8edd5d545e329:docs/research/CPU-G80-GPT2-ORIGINAL-PHASE-COST-PREREG-20261030.md)"
          git diff --exit-code 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD -- research/llm_g54 research/llm_g55 research/llm_g56 research/llm_g57 research/llm_g58 research/llm_g59 research/llm_g60 research/llm_g61 research/llm_g62 research/llm_g63 research/llm_g64 research/llm_g65 research/llm_g66 research/llm_g67 research/llm_g68 research/llm_g70
          git diff --check 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD
          python -B -m py_compile research/cpu_g80/g80_phase_profile.py research/cpu_g80/test_g80_phase_profile.py
          python -B -m unittest discover -s research/cpu_g80 -p test_g80_phase_profile.py -v
          echo CPU_G80_FROZEN_SOURCE_DIAGNOSTIC_ADMISSION=PASS
  original-gpt2-phase-attribution:
    needs: frozen-source-admission
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin original pretrained GPT2 FP32 CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install --disable-pip-version-check 'transformers==4.48.3' 'huggingface_hub==0.30.2' 'safetensors==0.5.3' 'tokenizers==0.21.1' 'psutil==7.1.3'
          python -m pip check
          python -m pip freeze > cpu_g80_original_environment.txt
      - name: Run unprofiled true original full decode phases then separately profile original operators
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/cpu_g80/g80_phase_profile.py
          python - <<'PY'
          import json
          r=json.load(open("cpu_g80_original_result.json",encoding="utf-8"))
          assert r["gate"]=="CPU_G80" and r["engineering"]=="PASS"
          assert len(r["original_unprofiled_responses"])==72
          assert len(r["original_profiler_diagnostics"])==3
          assert r["priority"] in ("TARGET_CACHED_FORWARD","TARGET_PREFILL","TARGET_PYTHON_TOKEN","NO_SINGLE_DOMINANT_PHASE")
          assert r["performance"]=="NOT_EVALUATED"
          assert r["scientific_acceptance"]=="NOT_GRANTED" and not r["promotion_allowed"]
          print("CPU_G80_ORIGINAL_PRETRAINED_PHASE_PROVENANCE=PASS")
          print("CPU_G80_DIAGNOSTIC_PRIORITY="+r["priority"])
          PY
      - name: Preserve original diagnostic with all negative/blocked evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-g80-original-gpt2-phase-profile
          retention-days: 30
          if-no-files-found: warn
          path: |
            cpu_g80_original_result.json
            cpu_g80_original_environment.txt
