name: FORGE F108-O original TRAIN annotation shape audit
on:
  push:
    branches: [engineering/f108o-freebase-original-schema-20261017-r1]
    paths:
      - 'noveltyeval/f108o_*'
      - 'noveltyeval/test_f108o_*'
      - 'docs/F108O-*'
      - '.github/workflows/forge-f108o-original-schema.yml'
permissions:
  contents: read
jobs:
  authentic-train-only-annotation-structure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kelvin-jiang/FreebaseQA
          ref: d16aae5149aaa25e43ff2a7bd00a06f280ca19b9
          path: source-freebaseqa-train
          sparse-checkout: |
            README.md
            LICENSE
            FreebaseQA-train.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Authoritative exact Git identities and no DEV/EVAL content access
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source-freebaseqa-train rev-parse HEAD)" = 'd16aae5149aaa25e43ff2a7bd00a06f280ca19b9'
          test "$(git -C source-freebaseqa-train rev-parse HEAD:FreebaseQA-train.json)" = '24dc4b13a9c4a0ad734732db094c124d086b7d67'
          test "$(git -C source-freebaseqa-train rev-parse HEAD:FreebaseQA-dev.json)" = '2e16ac381efb7b9e362cbf9bd0cee90006244ea8'
          test "$(git -C source-freebaseqa-train rev-parse HEAD:FreebaseQA-eval.json)" = 'd7d06ae721aedca26a0838d0113cddc1aa6774a8'
          test ! -e source-freebaseqa-train/FreebaseQA-dev.json
          test ! -e source-freebaseqa-train/FreebaseQA-eval.json
      - name: Synthetic answer subtree denial and strict original source custody
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s noveltyeval -p 'test_f108o_original_train_annotation_shape.py' -v
      - name: Authentic 20358 question and all parse annotation type path inventory
        shell: bash
        run: |
          set -euo pipefail
          python -B noveltyeval/f108o_original_train_annotation_shape.py --upstream source-freebaseqa-train --out f108o-train-shape.json
          python - <<'PY'
          import json
          x=json.load(open('f108o-train-shape.json',encoding='utf-8'))
          assert x['schema']=='forge.optimizer.f108o.original-freebase-train-annotation-shape.v1'
          assert x['status']=='PUBLIC_FREEBASE_TRAIN_SCHEMA_SHAPE_ONLY'
          assert x['source_commit']=='d16aae5149aaa25e43ff2a7bd00a06f280ca19b9'
          assert x['train_git_blob']=='24dc4b13a9c4a0ad734732db094c124d086b7d67'
          assert x['train_original_bytes']==23888089
          s=x['source_data']
          assert s['original_train_rows']==s['unique_question_ids']==20358
          assert s['original_parse_entries']==37306
          assert s['no_source_scalar_values_published'] is True
          assert s['no_answer_subtree_walked'] is True
          assert 0<s['path_type_entries']<=512
          assert all(isinstance(y['count'],int) and y['count']>=0 for y in s['schema_occurrences'])
          for key in ('dev_or_eval_qa_bytes_read','train_original_field_values_published',
                      'train_answers_used_for_linking','trained_linker_modified',
                      'new_scientific_firstuse','qualified_entity_linker',
                      'qualified_role_translator','qualified_freebase_graph',
                      'accepted_science','accepted_ref_mutation',
                      'dream_pareto_promotion','thetaevolve_accepted_training','science_dispatch'):
            assert x[key] is False,key
          assert x['model_calls']==x['codex_calls']==x['cloudflare_writes']==0
          print('F108O_ORIGINAL_TRAIN_ANNOTATION_SHAPE_COUNT='+str(s['path_type_entries']))
          print('F108O_ANSWER_SUBTREE_INACCESSIBLE_AND_EVAL_UNTOUCHED')
          PY
          sha256sum f108o-train-shape.json > f108o-train-shape.sha256
          sha256sum -c f108o-train-shape.sha256
      - name: Frozen after Stage A dual-OS source schema - flat TRAIN accessor tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s noveltyeval -p 'test_f108o_train_native_flat_linker.py' -v
      - name: Original 20358 TRAIN only, 37306 flat parses - bounded revised lexical linker
        shell: bash
        run: |
          set -euo pipefail
          python -B noveltyeval/f108o_train_native_flat_linker.py --upstream source-freebaseqa-train --out f108o-native-flat-linker.json
          python - <<'PY'
          import json
          x=json.load(open('f108o-native-flat-linker.json',encoding='utf-8'))
          assert x['schema']=='forge.optimizer.f108o.flat-train-lexical-linker.v1'
          assert x['status']=='PUBLIC_FREEBASE_TRAIN_NATIVE_FLAT_SCHEMA_LINKER_DIAGNOSTIC'
          assert x['source_commit']=='d16aae5149aaa25e43ff2a7bd00a06f280ca19b9'
          assert x['train_git_blob']=='24dc4b13a9c4a0ad734732db094c124d086b7d67'
          assert x['train_original_bytes']==23888089
          s=x['source_stats']
          assert s['original_train_rows']==s['unique_question_ids']==20358
          assert s['original_parse_entries']==37306
          assert s['valid_opaque_mid_parse_entries']+s['invalid_opaque_mid_parse_entries']==37306
          assert s['unique_mentions']+s['ambiguous_mentions']==s['total_mentions']
          assert 0<=s['total_mentions']<=100000
          assert sum(s['opaque_chain_length_bands'].values())==37306
          assert x['question_only_population']==20358
          assert sum(x['question_only_link_status_counts'].values())==20358
          assert x['source_native_opaque_mid'] is True
          assert x['inferential_chain_is_opaque_string'] is True
          for name in ('answers_used_for_linking','answers_read_or_compared',
                       'dev_or_eval_qa_read','source_values_published',
                       'f107_frozen_parser_modified',
                       'independent_linker_accuracy_qualified',
                       'freebase_graph_qualified','role_translator_qualified',
                       'independent_scientific_firstuse','accepted_science',
                       'accepted_ref_mutation','dream_pareto_promotion',
                       'thetaevolve_accepted_training','science_dispatch'):
            assert x[name] is False,name
          assert x['real_qa_scored']==x['model_calls']==x['codex_calls']==x['cloudflare_writes']==0
          print('F108O_TRAIN_ONLY_LINKING='+json.dumps(x['question_only_link_status_counts'],sort_keys=True))
          print('F108O_SCHEMA_NATIVE_TRAIN_STATS='+json.dumps(s,sort_keys=True))
          print('F108O_NO_GOLD_SCORING_NO_DEV_OR_EVAL_BYTES_NO_SCIENTIFIC_FIRSTUSE')
          PY
          sha256sum f108o-native-flat-linker.json > f108o-native-flat-linker.sha256
          sha256sum -c f108o-native-flat-linker.sha256
      - name: Mandatory complete exact-head Go regression vet build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo 'F108O_CODEX_CKB_CLOUDFLARE_SCIENTIFIC_PROMOTION=ZERO'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-f108o-original-train-schema-${{ matrix.os }}
          path: |
            f108o-train-shape.json
            f108o-train-shape.sha256
            f108o-native-flat-linker.json
            f108o-native-flat-linker.sha256
          retention-days: 45
          if-no-files-found: error
