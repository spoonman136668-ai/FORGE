name: FORGE F49 authentic real science TRAIN audit and F50 advisory
on:
  push:
    branches: [research/f49-authentic-train-to-f50-20261015-r1]
permissions:
  contents: read
  actions: read
jobs:
  real-f49-science-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Exact source and independent auditor negative tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/test_f49_real_train_review.py -v
      - name: Fetch and independently recount fresh Wingless Yggdrasil evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/f49";mkdir -p "$root/Wingless" "$root/Yggdrasil"
          for rec in \
            'Wingless 38807569165 737120f5522ba6c984119bfca0b7c16f4c94f18c 12005934542 W-F49-fresh-identifiability-TRAIN-NO-ORIGINAL sha256:069a2d8ee3a609b70491b1fb34db8432dae29c422f4bb56435636eab6b4273da' \
            'Yggdrasil 38807773617 b839631fc5dae1ba5df5355a5a0eb2a3248f89e5 12007765048 Y-F49-public-paired-anchor-TRAIN-NO-ORIGINAL sha256:26c0f59e8875ac32de3598c5acc5d91785e31f50ce6716f92e5bc44fda1c96d1'
          do
            read -r lane run head artifact name digest <<< "$rec"
            gh api "repos/spoonman136668-ai/$lane/actions/runs/$run" > "$root/$lane/github-run.json"
            jq -e --arg h "$head" --argjson r "$run" \
              '.id==$r and .head_sha==$h and .run_attempt==1 and .status=="completed" and .conclusion=="success"' \
              "$root/$lane/github-run.json" >/dev/null
            gh api "repos/spoonman136668-ai/$lane/actions/artifacts/$artifact" > "$root/$lane/github-artifact.json"
            jq -e --arg name "$name" --arg digest "$digest" --argjson run "$run" --argjson id "$artifact" \
              '.id==$id and .name==$name and .digest==$digest and .expired==false and .workflow_run.id==$run' \
              "$root/$lane/github-artifact.json" >/dev/null
            gh run download "$run" --repo "spoonman136668-ai/$lane" -n "$name" -D "$root/$lane"
          done
          python3 -B scripts/f49_real_train_review.py \
            --wingless "$root/Wingless" --yggdrasil "$root/Yggdrasil" --out "$root/next.json"
          python3 -B scripts/f49_real_train_review.py \
            --wingless "$root/Wingless" --yggdrasil "$root/Yggdrasil" --out "$root/repeat.json"
          cmp "$root/next.json" "$root/repeat.json"
          jq -e '(.decisions|length)==2 and .two_fresh_train_experiments_reviewed==true and
            .research_workers_dispatched==0 and .protected_primary_originals_executed==0 and
            .independent_scientific_originals_accepted==0 and
            .dream_rsi_prospective_gain_proven==false and .theta_policy_improvement_authorized==false' \
            "$root/next.json" >/dev/null
          (cd "$root";sha256sum next.json > next.sha256)
          echo 'F49_GENUINE_NEW_TRAIN_EVIDENCE_RECOUNT_TO_F50_HYPOTHESES=PASS'
      - name: One full regression vet build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-f49-real-results-and-f50-hypotheses-not-science-approved
          path: |
            ${{ runner.temp }}/f49/next.json
            ${{ runner.temp }}/f49/next.sha256
            ${{ runner.temp }}/f49/Wingless/github-run.json
            ${{ runner.temp }}/f49/Wingless/github-artifact.json
            ${{ runner.temp }}/f49/Yggdrasil/github-run.json
            ${{ runner.temp }}/f49/Yggdrasil/github-artifact.json
          retention-days: 30
          if-no-files-found: error
