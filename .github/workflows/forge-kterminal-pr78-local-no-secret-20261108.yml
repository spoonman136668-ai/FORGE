name: K Terminal PR78 local-source no-secret Windows qualification
on:
  push:
    branches: [qualification/kterminal-rc2-timing-hosted-20261106]
    paths: [.github/workflows/forge-kterminal-pr78-local-no-secret-20261108.yml]
permissions:
  contents: read
concurrency:
  group: kterminal-pr78-local-exact-23b3d6a7-20261108
  cancel-in-progress: false
jobs:
  qualify-local:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 115
    env:
      KTERM_SHA: 23b3d6a79421cf5d491aa1fd4f1605c3555ed254
      KTERM_TREE: 3672d7e8e35bf6412c2871ceb057ddbf58dc4b6c
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: 'never'
    steps:
      - name: Prove existing isolated Windows host and broker-disarmed process
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-rc2-timing-hosted-20261106' -or
              $env:GITHUB_EVENT_NAME -cne 'push' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
              $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
              $env:RUNNER_OS -cne 'Windows') { throw 'KTERM_LOCAL_RUNNER_IDENTITY_REFUSED' }
          foreach($name in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'KTERM_COINBASE_TEST_KEY_NAME','KTERM_COINBASE_TEST_KEY_SECRET',
              'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')) {
            if([Environment]::GetEnvironmentVariable($name)){throw 'KTERM_LOCAL_BROKER_AUTHORITY_REFUSED'}
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr78-local-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_LOCAL_NONFRESH_WORKSPACE'}
          $null=New-Item -Path $root -ItemType Directory
          Write-Host 'KTERM_LOCAL_ISOLATION_AND_NO_BROKER=PASS'
      - name: Stage exact private Git tree with existing local access only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr78-local-'+$env:GITHUB_RUN_ID)
          if(-not(Test-Path -LiteralPath $root -PathType Container)){throw 'KTERM_LOCAL_WORKSPACE_MISSING'}
          $stage=Join-Path $root 'source'
          $null=New-Item -Path $stage -ItemType Directory
          $archive=Join-Path $root 'source-only.zip'
          $localSource=Join-Path $env:PUBLIC 'KTerminal'
          $cached=$false
          if(Test-Path -LiteralPath $localSource -PathType Container) {
            $tree=''
            try {
              $tree=(& git -C $localSource rev-parse ($env:KTERM_SHA+'^{tree}') 2>$null | Out-String).Trim()
            } catch { $tree='' }
            if($LASTEXITCODE -eq 0 -and $tree -ceq $env:KTERM_TREE){$cached=$true}
          }
          if($cached) {
            & git -C $localSource archive --format=zip --output=$archive $env:KTERM_SHA *> (Join-Path $root 'private-source-stage.log')
            if($LASTEXITCODE -ne 0){throw 'KTERM_LOCAL_CACHED_ARCHIVE_FAILED'}
            Write-Host 'KTERM_LOCAL_SOURCE=EXACT_CACHED_OBJECT'
          } else {
            $repo=Join-Path $root 'git'
            $null=New-Item -Path $repo -ItemType Directory
            & git -C $repo init -q *> (Join-Path $root 'private-git-init.log')
            if($LASTEXITCODE -ne 0){throw 'KTERM_LOCAL_ISOLATED_GIT_INIT_FAILED'}
            & git -C $repo remote add origin https://github.com/Kboomllc/K-Terminal.git
            if($LASTEXITCODE -ne 0){throw 'KTERM_LOCAL_REMOTE_NOT_CONFIGURED'}
            # Fetch uses ONLY Git's existing runner-local authentication.
            # No GitHub private token, FORGE_KTERM_QUAL secret, external credential,
            # or credential value is provided or copied into this workflow.
            & git -C $repo fetch --no-tags --depth=1 origin $env:KTERM_SHA *> (Join-Path $root 'private-fetch.log')
            if($LASTEXITCODE -ne 0){throw 'KTERM_LOCAL_PREEXISTING_GIT_ACCESS_UNAVAILABLE'}
            $tree=(& git -C $repo rev-parse ($env:KTERM_SHA+'^{tree}') | Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $tree -cne $env:KTERM_TREE){throw 'KTERM_LOCAL_SOURCE_TREE_DRIFT'}
            & git -C $repo archive --format=zip --output=$archive $env:KTERM_SHA *> (Join-Path $root 'private-archive.log')
            if($LASTEXITCODE -ne 0){throw 'KTERM_LOCAL_SOURCE_ARCHIVE_FAILED'}
            Write-Host 'KTERM_LOCAL_SOURCE=EXISTING_LOCAL_AUTHENTICATION'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $stage -ErrorAction Stop
          if((Test-Path -LiteralPath (Join-Path $stage '.env')) -or
             (Test-Path -LiteralPath (Join-Path $stage 'config.json')) -or
             (Test-Path -LiteralPath (Join-Path $stage 'data'))){throw 'KTERM_LOCAL_PRIVATE_RUNTIME_FILES_PRESENT'}
          if(-not(Test-Path -LiteralPath (Join-Path $stage 'go.mod'))){throw 'KTERM_LOCAL_SOURCE_ARCHIVE_INCOMPLETE'}
          Write-Host 'KTERM_LOCAL_EXACT_PRIVATE_TREE=PASS;SOURCE_EXPORTED_TO_PUBLIC_ARTIFACTS=FALSE'
      - name: Set up pinned Go 1.26.5 for original Windows source
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Full exact-tree Windows regression and Go vet without broker
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr78-local-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          if((go version) -notmatch 'go1\.26\.5 windows/amd64'){throw 'KTERM_LOCAL_GO_TOOLCHAIN_MISMATCH'}
          $env:K_TERMINAL_TEST_WORKSPACE=Join-Path $root 'test-workspace'
          $env:KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT=Join-Path $root 'test-workspace\tail'
          $env:KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT=Join-Path $root 'test-workspace\post'
          $env:KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT=Join-Path $root 'test-workspace\private'
          $env:GOCACHE=Join-Path $root 'go-cache'
          $env:GOMODCACHE=Join-Path $root 'go-modules'
          foreach($d in @($env:K_TERMINAL_TEST_WORKSPACE,$env:KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT,$env:KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT,$env:KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT,$env:GOCACHE,$env:GOMODCACHE)){[void][IO.Directory]::CreateDirectory($d)}
          Push-Location $stage
          try {
            & go test -p 1 -count=1 -timeout 60m ./... *> (Join-Path $root 'private-regression.log')
            if($LASTEXITCODE -ne 0){throw 'KTERM_LOCAL_FULL_WINDOWS_REGRESSION_FAILED'}
            Write-Host 'KTERM_LOCAL_FULL_WINDOWS_REGRESSION=PASS'
            & go vet ./... *> (Join-Path $root 'private-vet.log')
            if($LASTEXITCODE -ne 0){throw 'KTERM_LOCAL_FULL_GO_VET_FAILED'}
            Write-Host 'KTERM_LOCAL_FULL_GO_VET=PASS'
          } finally {Pop-Location}
      - name: Rebuild complete desktop binaries without launching application
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr78-local-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          $env:GOCACHE=Join-Path $root 'go-cache'
          $env:GOMODCACHE=Join-Path $root 'go-modules'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File (Join-Path $stage 'BUILD.ps1') *> (Join-Path $root 'private-desktop-build.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_LOCAL_FULL_DESKTOP_BUILD_FAILED'}
          foreach($file in @('K-Terminal.exe','K-Terminal-Engine.exe','KTerminal.UI.dll','ui-runtime-manifest.json')) {
            if(-not(Test-Path -LiteralPath (Join-Path $stage $file) -PathType Leaf)){throw 'KTERM_LOCAL_DESKTOP_ARTIFACT_MISSING'}
          }
          Write-Host 'KTERM_LOCAL_DESKTOP_BUILD=PASS;BROKER_ORDERS=0;APPLICATION_NOT_LAUNCHED'
      - name: Clean transient private source and logs, preserve no copies
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr78-local-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root) {
            $safe=[IO.Path]::GetFullPath($root)
            $base=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')+'\'
            if(-not $safe.StartsWith($base,[StringComparison]::OrdinalIgnoreCase) -or
                [IO.Path]::GetFileName($safe) -cne ('kterm-pr78-local-'+$env:GITHUB_RUN_ID)) {
              throw 'KTERM_LOCAL_CLEANUP_BOUNDARY_REFUSED'
            }
            Remove-Item -LiteralPath $safe -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_LOCAL_PRIVATE_WORKSPACE_CLEAN=PASS;PUBLISHED_PRIVATE_SOURCE=0;LIVE_ORDERS=0'
