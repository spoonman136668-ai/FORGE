name: FORGE autonomous qualified FSA merge
# R21: Existing scheduler repurposed for independently hosted READ-ONLY
# source evidence. Source merging remains hard-disabled until a separate
# tested GitHub-native atomic promotion gate is accepted.
on:
  schedule:
    - cron: '12,22,32,42,52,2 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [FORGE FSA-source qualification]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: forge-source-merge
  cancel-in-progress: false
jobs:
  merge:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authenticate trusted default-branch source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'SOURCE_AUDITOR_TRUSTED_DEFAULT_BRANCH=TRUE'
      - name: Independently audit current source-only PRs, without merging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fsa_source_audit.py
          echo 'AUTOMERGE_WRITE_PERMISSION=NONE'
          echo 'RESEARCH_DISPATCH=DISABLED'
