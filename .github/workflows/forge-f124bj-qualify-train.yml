name: F124-BJ witnessed TRAIN source and true metatraining cost, no U/R
on:
  push:
    branches: [research/f124bj-qualified-train-cost-20261018]
permissions:
  contents: read
concurrency:
  group: f124bj-firstuse-original-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-source-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check exact foundation, source births, negative controls without TRAIN generation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'BJ_EXACT_HEAD' }
          & git merge-base --is-ancestor 'fa794c078a0f6fd367ec14d0eae3fd742bf154b7' HEAD
          if ($LASTEXITCODE -ne 0) { throw 'BJ_BI_SOURCE_DRIFT' }
          $wanted = @(
            '.github/workflows/forge-f124bj-qualify-train.yml',
            'research/north-star-transfer/f124bj-train-freeze.json',
            'research/north-star-transfer/f124bj_affine_source.py',
            'research/north-star-transfer/f124bj_shear_source.py',
            'research/north-star-transfer/f124bj_witness.py',
            'research/north-star-transfer/f124bj_train_measure.py',
            'research/north-star-transfer/test_f124bj_before_firstuse.py'
          )
          $diff = @(& git diff --name-only 'fa794c078a0f6fd367ec14d0eae3fd742bf154b7' HEAD | Where-Object { $_ })
          if ((@($diff | Sort-Object) -join '|') -cne (@($wanted | Sort-Object) -join '|')) { throw 'BJ_PATCH_SCOPE_WIDENED' }
          & git merge-base --is-ancestor '9627b45e4c6f788cf1dd5a47f879f8115e94ae5e' HEAD
          if ($LASTEXITCODE -ne 0) { throw 'BJ_FROZEN_PREREG_MISSING' }
          & git cat-file -e '9627b45e4c6f788cf1dd5a47f879f8115e94ae5e:research/north-star-transfer/f124bj_affine_source.py' 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'BJ_SOURCE_ALREADY_EXISTED_AT_PREREG' }
          & python -B -m unittest discover -s research/north-star-transfer -p test_f124bj_before_firstuse.py -v
          if ($LASTEXITCODE -ne 0) { throw 'BJ_PRE_FIRST_USE_FAILURE' }
          & python -B -m unittest discover -s research/north-star-transfer -p test_f124bi_readiness.py -v
          if ($LASTEXITCODE -ne 0) { throw 'BJ_BI_BASELINE_REGRESSION' }
          & python -B isolationguard/check.py
          if ($LASTEXITCODE -ne 0) { throw 'BJ_CROSS_PROJECT_ISOLATION' }
          Write-Output 'F124BJ_NONCONSUMING_PREFLIGHT=PASS'
  original-github-provider-witness:
    needs: original-source-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently authenticate provider source birth prior to first TRAIN use
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          root="$RUNNER_TEMP/f124bj"
          mkdir -p "$root"
          python3 -B research/north-star-transfer/f124bj_witness.py \
            --provider --output "$root/provider-source-before-train.json"
          python3 -B - "$root/provider-source-before-train.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a['source_git_provider_authenticated'] is True
          assert len(a['birth_order']) == 3
          assert a['generated_registered_train'] == 0
          assert a['generated_U_or_R'] == 0
          assert a['training_scientific_acceptance'] is False
          assert a['whole_task_resource_parity'] is False
          assert a['historical_source_overlap_comprehensively_audited'] is False
          print('F124BJ_ORIGINAL_SOURCE_PROVIDER_CUSTODY=PASS')
          print('F124BJ_SOURCE_FIRST_USE_WAITING_FOR_JOB_BARRIER=true')
          PY
          sha256sum "$root/provider-source-before-train.json" > "$root/source-manifest.sha256"
          (cd "$root" && sha256sum --check source-manifest.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: f124bj-provider-pretrain-birth-witness-${{ github.sha }}
          path: ${{ runner.temp }}/f124bj/
          retention-days: 90
          if-no-files-found: error
  authentic-train-cost:
    needs: original-github-provider-witness
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Use exactly 192 new public TRAIN sources once and measure actual metatraining
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          root="$RUNNER_TEMP/f124bj"
          mkdir -p "$root"
          python3 -B research/north-star-transfer/f124bj_train_measure.py \
            --mode TRAIN --output "$root/once-TRAIN192-metacost.json"
          python3 -B - "$root/once-TRAIN192-metacost.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['registered_TRAIN_task_count']==192
          assert d['registered_TRAIN_uses']==1
          assert [x['task_id'] for x in d['training_public_receipts']]==list(range(900000,900192))
          assert len(set(x['public_sha256'] for x in d['training_public_receipts']))==192
          assert d['training_forward_evaluations']==192*2608
          assert d['TRAIN_total_cpu_ns']>0 and d['TRAIN_peak_process_RSS_bytes']>0
          assert len(d['learned_prior_weights_hex'])==8
          assert d['validation_or_unseen_source_consumed']==0
          assert d['whole_task_cpu_and_memory_parity'] is False
          assert d['scientific_admission'] is False
          print('F124BJ_IMMUTABLE_TRAIN_192_COST=PASS')
          PY
      - name: Compare identical negative public task pairs with frozen prior and AZ control
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/f124bj"
          python3 -B - "$root/once-TRAIN192-metacost.json" "$root/partial-task-fit.json" <<'PY'
          import json,subprocess,sys,pathlib,hashlib,os
          source=json.load(open(sys.argv[1]))
          prior=source['learned_prior_weights_hex']
          cmd=[sys.executable,'-B','research/north-star-transfer/f124bj_train_measure.py']
          results={}
          for tag in ('U','R'):
              obs={}
              for arm in ('prior_kernel','AZ'):
                  proc=subprocess.run(cmd+['--mode','FIT','--arm',arm,'--tag',tag,
                                    '--prior-hex',prior],check=True,text=True,
                                    capture_output=True,timeout=180)
                  data=json.loads(proc.stdout)
                  assert data['public_n']==48
                  assert data['complete_native_graph_CPU_ns'] is None
                  assert data['complete_cognition_state_memory'] is None
                  assert data['resource_parity'] is False
                  assert data['child_CPU_ns']>0 and data['child_peak_process_RSS_bytes']>0
                  obs[arm]=data
              assert obs['prior_kernel']['public_sha256']==obs['AZ']['public_sha256']
              results[tag]=obs
          raw={'schema':'mass.f124bj.original-training-and-negative-fixture-resource.v1',
               'exact_head':source['source_commit'],
               'TRAIN_total_cpu_ns':source['TRAIN_total_cpu_ns'],
               'TRAIN_amortized_per_128_ns_ceil':
                    source['amortized_training_CPU_ns_ceiling_per_128'],
               'measured_negative_tasks':results,
               'training_cases_used':192,'registered_heldouts_used':0,
               'complete_native_scoring_measured':False,
               'whole_task_cost_parity':False,
               'independent_external_scientific_admission':False,
               'optimizer_promotion':False}
          p=pathlib.Path(sys.argv[2])
          p.write_text(json.dumps(raw,indent=2,sort_keys=True)+'\n')
          print('F124BJ_FIT_ONLY_MATCHED_REAL_CPU_RSS=PASS')
          print('F124BJ_FULL_WHOLE_TASK_RESOURCE_PARITY=false')
          PY
          sha256sum "$root/once-TRAIN192-metacost.json" "$root/partial-task-fit.json" \
            > "$root/training-cost-sha256.txt"
          (cd "$root" && sha256sum --check training-cost-sha256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: f124bj-original-train192-cost-not-ood-science-${{ github.sha }}
          path: ${{ runner.temp }}/f124bj/
          retention-days: 90
          if-no-files-found: error
  one-full-regression:
    needs: authentic-train-cost
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Required one complete regression, vet and build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go vet ./...
          go build ./...
          mkdir -p "$RUNNER_TEMP/f124bj"
          sha256sum research/north-star-transfer/f124bj-train-freeze.json \
            research/north-star-transfer/f124bj_affine_source.py \
            research/north-star-transfer/f124bj_shear_source.py \
            research/north-star-transfer/f124bj_witness.py \
            research/north-star-transfer/f124bj_train_measure.py \
            research/north-star-transfer/test_f124bj_before_firstuse.py \
            .github/workflows/forge-f124bj-qualify-train.yml \
            > "$RUNNER_TEMP/f124bj/source-sha256.txt"
          printf 'EXACT_HEAD=%s\nTRAIN192_FIRST_USE_CONSUMED=true\nUNSEEN_U_R_CONSUMED=false\nINDEPENDENT_EXTERNAL_SCIENCE_AUTHENTICATED=false\nFULL_NATIVE_GRAPH_RESOURCE_PARITY=false\nSCIENCE_ADMISSION=false\nOPTIMIZER_PROMOTION=false\n' "$GITHUB_SHA" \
            > "$RUNNER_TEMP/f124bj/qualification.txt"
          echo F124BJ_FINAL_INTEGRATION=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: f124bj-integration-not-science-${{ github.sha }}
          path: ${{ runner.temp }}/f124bj/
          retention-days: 90
          if-no-files-found: error
