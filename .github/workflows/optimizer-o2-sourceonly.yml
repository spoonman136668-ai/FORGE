name: Optimizer O2 source-only replay mechanism qualification

on:
  push:
    branches: [research/optimizer-o2-selective-consolidation-20261023]
    paths:
      - '.github/workflows/optimizer-o2-sourceonly.yml'
      - 'research/optimizer_o2/**'

permissions:
  contents: read

concurrency:
  group: optimizer-o2-sourceonly
  cancel-in-progress: false

jobs:
  native-public-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 12
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact baseline and additive O2-only delta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '00f33f56139f792a65cd193200706d13f93fe0b3'
          $ancestor = (& git merge-base $base HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ancestor -cne $base) { throw 'O2_BASE_IDENTITY_DRIFT' }
          $expected = @(
            '.github/workflows/optimizer-o2-sourceonly.yml',
            'research/optimizer_o2/O2_FROZEN_SOURCEONLY_PROTOCOL.json',
            'research/optimizer_o2/public_replay.py',
            'research/optimizer_o2/handwritten_preflight.py',
            'research/optimizer_o2/test_public_replay.py'
          )
          $actual = @(& git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne $expected.Count -or (Compare-Object $expected $actual)) {
            throw 'O2_SCOPE_DRIFT'
          }
          Write-Host 'O2_QUALIFIED_PARENT_BOUNDED_DELTA=PASS'
      - name: Public-only mechanism tests and all-arm diagnostic receipts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s research/optimizer_o2 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'O2_PUBLIC_TESTS_FAILED' }
          python -B research/optimizer_o2/handwritten_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'O2_PUBLIC_PREFLIGHT_FAILED' }
          Write-Host 'O2_PUBLIC_ONLY_TESTS=PASS'
          Write-Host 'O2_DEV_HANDWRITTEN_ONLY=TRUE'
          Write-Host 'O2_PROTECTED_COHORTS=ZERO'
          Write-Host 'O2_SCIENCE_ADMISSION=NONE'
      - name: One complete FORGE Go regression, vet and build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo O2_FULL_GO_REGRESSION=PASS
      - name: Confirm worktree clean
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(& git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) { throw 'O2_DIRTY_WORKTREE' }
          Write-Host 'O2_NO_SCIENCE_DISPATCH=PASS'
