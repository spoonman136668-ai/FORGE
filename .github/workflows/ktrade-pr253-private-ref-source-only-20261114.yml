name: KTRADE PR253 one-time private ref checkout without desktop access
on:
  push:
    branches: [qualification/ktrade-pr253-owner-native-readonly-20261113]
    paths:
      - .github/workflows/ktrade-pr253-private-ref-source-only-20261114.yml
permissions:
  contents: read
concurrency:
  group: ktrade-pr253-private-ref-source-only-once
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    env:
      KTRADE_EXPECTED_SOURCE: '65ac7b90727cc06983fab5d42e1e6e9d25afdcde'
      KTRADE_EXPECTED_TREE: '0be7fdefa086d59beb443227a1c2f7774bbf836b'
      KTRADE_LIVE_TRADING: 'false'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_PROMOTION_ALLOWED: '0'
    steps:
      - name: Source-only private PR ref fetch and clean exact-SHA checkout
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:KTRADE_LIVE_TRADING -cne 'false' -or
             $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or
             $env:KTRADE_PROMOTION_ALLOWED -cne '0'){
            throw 'KTRADE_SOURCE_ONLY_SCOPE_REFUSED'
          }
          foreach($tool in @('gh.exe','git.exe')){
            if(!(Get-Command $tool -ErrorAction SilentlyContinue)){
              throw ('KTRADE_SOURCE_ONLY_TOOL_MISSING_'+$tool)
            }
          }
          $base=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $root=Join-Path $base ('ktrade-source-ref-once-'+[guid]::NewGuid().ToString('N'))
          $source=Join-Path $root 'source'
          $privateLog=Join-Path $root 'private-source.log'
          $env:GH_PROMPT_DISABLED='1'
          $env:GIT_TERMINAL_PROMPT='0'
          if(Test-Path -LiteralPath $root){throw 'KTRADE_SOURCE_ONLY_ROOT_NOT_FRESH'}
          New-Item -ItemType Directory -Path $root -ErrorAction Stop|Out-Null
          $ok=$false
          try{
            & gh.exe repo clone spoonman136668-ai/ktrade $source -- --filter=blob:none --no-checkout *> $privateLog
            if($LASTEXITCODE -ne 0){throw 'KTRADE_SOURCE_ONLY_PRIVATE_CLONE_FAILED'}
            & git.exe -C $source fetch --no-tags --depth 1 origin refs/heads/feature/rb3-workstation-ui-refresh-20261108 *> $privateLog
            if($LASTEXITCODE -ne 0){throw 'KTRADE_SOURCE_ONLY_NAMED_REF_FETCH_FAILED'}
            $fetched=(& git.exe -C $source rev-parse FETCH_HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $fetched -cne $env:KTRADE_EXPECTED_SOURCE){
              throw 'KTRADE_SOURCE_ONLY_PINNED_SHA_DRIFT'
            }
            & git.exe -C $source checkout --detach $env:KTRADE_EXPECTED_SOURCE *> $privateLog
            if($LASTEXITCODE -ne 0){throw 'KTRADE_SOURCE_ONLY_DETACHED_CHECKOUT_FAILED'}
            $head=(& git.exe -C $source rev-parse HEAD).Trim()
            $tree=(& git.exe -C $source rev-parse 'HEAD^{tree}').Trim()
            if($LASTEXITCODE -ne 0 -or $head -cne $env:KTRADE_EXPECTED_SOURCE -or
               $tree -cne $env:KTRADE_EXPECTED_TREE -or
               @(& git.exe -C $source status --porcelain --untracked-files=no).Count -ne 0 -or
               (Test-Path -LiteralPath (Join-Path $source '.env'))){
              throw 'KTRADE_SOURCE_ONLY_EXACT_TREE_OR_CUSTODY_REFUSED'
            }
            $ok=$true
            Write-Host ('KTRADE_PR253_PRIVATE_REF_SOURCE_ONLY=PASS;source_sha='+$head+
              ';tree_sha='+$tree+';runner=FORGE-CODEX-REMOTE;app_launched=false;display_unchanged=true;broker_contacted=false')
          }finally{
            if(Test-Path -LiteralPath $root -PathType Container){
              if([IO.Path]::GetDirectoryName($root).TrimEnd('\') -cne $base -or
                 [IO.Path]::GetFileName($root) -cnotmatch '^ktrade-source-ref-once-[a-f0-9]{32}$'){
                throw 'KTRADE_SOURCE_ONLY_CLEANUP_SCOPE_REFUSED'
              }
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop
            }
            Write-Host ('KTRADE_PR253_SOURCE_ONLY_CLEANUP=PASS;source_verified='+$ok+
              ';installed_app_untouched=true;pointer_untouched=true;display_unchanged=true;live_armed=false')
          }
          if(!$ok){throw 'KTRADE_PR253_SOURCE_ONLY_UNVERIFIED'}
