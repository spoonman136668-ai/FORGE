name: Mass Research K4G action-identifiability prospective public study
on:
  push:
    branches: [research/mass-lcrm01-k4g-action-identifiability-20261024]
permissions:
  contents: read
jobs:
  calibrated-action-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Run frozen action-sensitivity and fitted-control public experiment
        run: bash research/lcrm01/k4g_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-k4g-original-public-action-identifiability
          path: |
            ${{ runner.temp }}/k4g/original-public-dev.json
            ${{ runner.temp }}/k4g/original-public-dev.log
          if-no-files-found: warn
          retention-days: 90
