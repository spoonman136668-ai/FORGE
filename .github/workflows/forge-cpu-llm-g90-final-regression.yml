name: FORGE CPU LLM Evaluation G90 archived receipt Linux Windows final qualification

on:
  push:
    branches: [research/cpu-llm-g90-batched-throughput-gpt2-20261031]
    paths:
      - 'docs/research/CPU-G90-GPT2-BATCHED-THROUGHPUT-ARTIFACT-RECEIPT-20261031.json'
      - 'docs/research/CPU-G90-GPT2-BATCHED-THROUGHPUT-QUALIFICATION-TRIGGER-20261031.md'

permissions:
  contents: read

concurrency:
  group: forge-cpu-llm-g90-archived-receipt-regression
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify frozen G90 source, archived receipt and disposition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:research/llm_g54)" = "204af0f5502269be4288c6c56f689526d03c77fb"
          test "$(git rev-parse HEAD:research/llm_g55)" = "2e40d5bd574bf9f57f81c4ecf5fd611f9ef753e3"
          test "$(git rev-parse HEAD:research/llm_g56)" = "7a728365dd6bdef415c8427d2a87791f6049ab2a"
          test "$(git rev-parse HEAD:research/llm_g57)" = "dbabd811207e52764568fc4100bb7fa151255cff"
          test "$(git rev-parse HEAD:research/llm_g58)" = "9c391b65ae0c1275191c3856d967f46ec5597038"
          test "$(git rev-parse HEAD:research/llm_g59)" = "693d705b2e5f42886660ebc30e73ee73d5f6d911"
          test "$(git rev-parse HEAD:research/llm_g60)" = "7681d55047cb7793542b1f340d2a1eaa15617f67"
          test "$(git rev-parse HEAD:research/llm_g61)" = "f1bc119d185d301e5b80929a75cbacf66a48d79c"
          test "$(git rev-parse HEAD:research/llm_g62)" = "f7345e7250e242f7b30964b486ce3c91640b34cd"
          test "$(git rev-parse HEAD:research/llm_g63)" = "651d9e92106c43c594eb2e9486f08446b902eee9"
          test "$(git rev-parse HEAD:research/llm_g64)" = "59b6203707a891fe36a02d0e83d1c173e6aa6b1f"
          test "$(git rev-parse HEAD:research/llm_g65)" = "18ddbdbe436728b04f660b870abc924bdf21e554"
          test "$(git rev-parse HEAD:research/llm_g66)" = "f3d0980ead446b0a89d5defe6531b1e00283b546"
          test "$(git rev-parse HEAD:research/llm_g67)" = "ed268f83fbffa0cc13343d8647201c7798d070b9"
          test "$(git rev-parse HEAD:research/llm_g68)" = "88fc035bb77e3192f2b69567d2226090c8a05361"
          test "$(git rev-parse HEAD:research/llm_g70)" = "681c4022516e370a7edf9205d90a39e69b0a784f"
          test "$(git rev-parse HEAD:docs/research/CPU-G90-GPT2-BATCHED-THROUGHPUT-PREREG-20261031.md)" = "5c8ccc1c7a1a0924e1bd0441a785581135302e5a"
          test "$(git rev-parse HEAD:research/cpu_g90/g90_batching_original.py)" = "de66558c81dd85b376d863addaaccdc11e92de79"
          test "$(git rev-parse HEAD:research/cpu_g90/test_g90_batching_original.py)" = "ed5bce6f0dae67a09c18d7db57155f28ba70c061"
          test "$(git rev-parse HEAD:docs/research/CPU-G90-GPT2-BATCHED-THROUGHPUT-ARTIFACT-RECEIPT-20261031.json)" = "c78d40edfe2a4817d10b769c93b2b491e2fa0161"
          python - <<'PY'
          import json
          p="docs/research/CPU-G90-GPT2-BATCHED-THROUGHPUT-ARTIFACT-RECEIPT-20261031.json"
          r=json.load(open(p,encoding="utf-8"))
          assert r["schema"]=="forge.cpu-llm-g90.archive-receipt.v1"
          assert r["execution"]["workflow_run_id"]==41217105263
          assert r["execution"]["artifact_id"]==13049080046
          assert r["execution"]["artifact_zip_sha256"]=="ec1ad765aae41799aa1489795ab8a6259425fb4586037b9d313602fa7c9b6870"
          assert r["execution"]["artifact_result_json_sha256"]=="29f36fc348f0e5137719698be9725dfc457530aff608a5fc10a09a6a5faab8a1"
          assert r["results"]["engineering"]=="PASS" and r["results"]["correctness"]=="PASS"
          assert r["results"]["decision"]=="BATCHING_NO_GO"
          assert r["results"]["timed_authentic_responses"]==240 and r["results"]["timed_authentic_generated_tokens"]==1920
          assert r["results"]["qualification"][0]["throughput_speedup"]<1.20
          assert r["design"]["scientific_acceptance"]=="NOT_GRANTED" and r["design"]["promotion_allowed"] is False
          print("G90_ARCHIVED_RECEIPT=PASS")
          PY
          python -B -m py_compile research/cpu_g90/g90_batching_original.py research/cpu_g90/test_g90_batching_original.py
          python -B -m unittest discover -s research/cpu_g90 -p 'test_g90_batching_original.py' -v
      - name: FORGE isolation and authority regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: F139 controller and native custody regression
        shell: bash
        run: python3 -B -m unittest discover -s f139 -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go tests, race, vet and build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify frozen G90 source, archived receipt and disposition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:docs/research/CPU-G90-GPT2-BATCHED-THROUGHPUT-PREREG-20261031.md)" = "5c8ccc1c7a1a0924e1bd0441a785581135302e5a"
          test "$(git rev-parse HEAD:research/cpu_g90/g90_batching_original.py)" = "de66558c81dd85b376d863addaaccdc11e92de79"
          test "$(git rev-parse HEAD:research/cpu_g90/test_g90_batching_original.py)" = "ed5bce6f0dae67a09c18d7db57155f28ba70c061"
          test "$(git rev-parse HEAD:docs/research/CPU-G90-GPT2-BATCHED-THROUGHPUT-ARTIFACT-RECEIPT-20261031.json)" = "c78d40edfe2a4817d10b769c93b2b491e2fa0161"
          python - <<'PY'
          import json
          r=json.load(open("docs/research/CPU-G90-GPT2-BATCHED-THROUGHPUT-ARTIFACT-RECEIPT-20261031.json",encoding="utf-8"))
          assert r["results"]["decision"]=="BATCHING_NO_GO"
          assert r["results"]["engineering"]=="PASS" and r["results"]["correctness"]=="PASS"
          assert r["results"]["timed_authentic_responses"]==240
          assert r["results"]["timed_authentic_generated_tokens"]==1920
          print("G90_ARCHIVED_RECEIPT=PASS")
          PY
          python -B -m py_compile research/cpu_g90/g90_batching_original.py research/cpu_g90/test_g90_batching_original.py
          python -B -m unittest discover -s research/cpu_g90 -p 'test_g90_batching_original.py' -v
      - name: FORGE isolation and authority regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s isolationguard -p 'test_*.py' -v
          python3 -B isolationguard/check.py
          python3 -B -m unittest discover -s scripts -p 'test_fsa_*py' -v
          python3 -B -m unittest discover -s fsad1 -p 'test_*.py' -v
      - name: F139 controller and native custody regression
        shell: pwsh
        run: python -B -m unittest discover -s f139 -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Native Windows source qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_TEST_FAILED' }
          go test -race -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_RACE_FAILED' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_VET_FAILED' }
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_BUILD_FAILED' }
