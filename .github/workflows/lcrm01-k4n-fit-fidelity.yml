name: Mass Research K4N FIT-only decision fidelity memory
on:
  push:
    branches: [research/mass-lcrm01-k4n-decision-coreset-20261024]
permissions:
  contents: read
jobs:
  prospective-original-public-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Run source-frozen FIT-only memory study in two independent processes
        run: bash research/lcrm01/k4n_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-k4n-original-two-process-decision-fidelity-evidence
          path: |
            ${{ runner.temp }}/k4n/process-a.json
            ${{ runner.temp }}/k4n/process-b.json
            ${{ runner.temp }}/k4n/comparison.json
            ${{ runner.temp }}/k4n/process-a.log
            ${{ runner.temp }}/k4n/process-b.log
          if-no-files-found: warn
          retention-days: 90
