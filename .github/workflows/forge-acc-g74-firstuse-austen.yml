name: FORGE ACC G74 first-use Austen full-FP32 precision and FP16 greedy cost study
on:
  push:
    branches: [research/acc-g74-firstuse-austen-20261030]
    paths:
      - 'research/acc_g74/**'
      - '.github/workflows/forge-acc-g74-firstuse-austen.yml'
permissions:
  contents: read
concurrency:
  group: forge-acc-g73-original-rtx-precision
  cancel-in-progress: false
jobs:
  g74-austen-firstuse:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify frozen prereg and compile original-source scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'G74_EXECUTED_SOURCE_SHA_DRIFT' }
          if (-not (Test-Path 'docs/research/ACC-G74-PREEXEC-20261030.md')) { throw 'G74_PREEXEC_NOT_FROZEN' }
          & python -m py_compile research/acc_g74/g74_firstuse_austen.py research/acc_g74/test_g74.py
          if ($LASTEXITCODE -ne 0) { throw 'G74_SOURCE_COMPILE_FAILED' }
          Write-Output 'G74_SOURCE_PREREG_AND_SYNTAX=PASS'
      - name: Create isolated disposable pinned runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $volume=(Get-Item $env:RUNNER_TEMP).PSDrive
          if ($volume.Free -lt 10000000000) { throw 'G74_TEMP_SPACE_LT_10GB' }
          foreach ($name in @('acc-g74-venv','acc-g74-hf','acc-g74-wikitext-test.txt','acc-g74-austen.txt')) {
            $p=Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $p) { throw "G74_TEMP_PATH_COLLISION:$p" }
          }
          & python -c 'import sys; assert (3,10)<=sys.version_info[:2]<=(3,13),sys.version'
          if ($LASTEXITCODE -ne 0) { throw 'G74_PYTHON_VERSION_DRIFT' }
          & python -m venv (Join-Path $env:RUNNER_TEMP 'acc-g74-venv')
          if ($LASTEXITCODE -ne 0) { throw 'G74_ISOLATED_VENV_FAILED' }
      - name: Install exact original Blackwell CUDA and HF software
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:RUNNER_TEMP 'acc-g74-venv\Scripts\python.exe'
          $env:PYTHONNOUSERSITE='1'
          & $p -m pip install --disable-pip-version-check --no-cache-dir 'torch==2.8.0+cu128' --index-url 'https://download.pytorch.org/whl/cu128'
          if ($LASTEXITCODE -ne 0) { throw 'G74_TORCH_2_8_CUDA128_FAILED' }
          & $p -m pip install --disable-pip-version-check --no-cache-dir 'transformers==4.52.3' 'huggingface_hub==0.30.2' 'safetensors==0.5.3' 'tokenizers==0.21.1'
          if ($LASTEXITCODE -ne 0) { throw 'G74_TRANSFORMERS_PINS_FAILED' }
          & $p -m pip freeze | Out-File -LiteralPath 'g74_pip_freeze.txt' -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'G74_DEPENDENCY_PROVENANCE_FAILED' }
      - name: Run 18 focused first-use and source qualification controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:RUNNER_TEMP 'acc-g74-venv\Scripts\python.exe'
          & $p -m unittest discover -s research/acc_g74 -p test_g74.py -v
          if ($LASTEXITCODE -ne 0) { throw 'G74_FROZEN_SOURCE_NEGATIVES_FAILED' }
          Write-Output 'G74_18_FOCUSED_SOURCE_TESTS=PASS'
      - name: Original RTX Austen first-use FP32 exactness and FP16 greedy cost qualification
        shell: pwsh
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
          TOKENIZERS_PARALLELISM: 'false'
          PYTHONNOUSERSITE: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:RUNNER_TEMP 'acc-g74-venv\Scripts\python.exe'
          $env:HF_HOME=Join-Path $env:RUNNER_TEMP 'acc-g74-hf'
          $env:G74_CORPUS=Join-Path $env:RUNNER_TEMP 'acc-g74-wikitext-test.txt'
          $env:G74_FRESH=Join-Path $env:RUNNER_TEMP 'acc-g74-austen.txt'
          $env:G74_RESULT=Join-Path (Get-Location).Path 'g74_result.json'
          & $p -u research/acc_g74/g74_firstuse_austen.py
          if ($LASTEXITCODE -ne 0) { throw 'G74_SOURCE_GPU_OR_SOURCE_IDENTITY_BLOCKED' }
          & $p -c 'import json; r=json.load(open("g74_result.json")); c=r["classification"]; assert r["status"]=="PASS_COMPLETE_FROZEN_ORIGINAL_GPU_MEASUREMENT"; assert len(r["cases"])==5 and len(r["prompt_hashes_sha256"])==5; assert set(r["original_forced_logits"])==set(("original_fp16","original_fp32_full")); assert all(len(r["original_forced_logits"][v][m])==3 for v in ("original_fp16","original_fp32_full") for m in ("cached_one_by_one","cached_chunk_48","full_no_cache")); assert all(len(r["cases"][i]["variants"][v]["runs"][a])==3 for i in range(5) for v in ("original_fp16","original_fp32_full") for a in ("baseline","candidate")); assert c["firstuse_fp32_reference_screen"] in ("FRESH_FP32_REFERENCE_PASS_ONLY","NO_GO_REFERENCE"); assert c["cross_precision_practical_screen"] in ("CROSS_PRECISION_PRACTICAL_PASS_ONLY","NO_GO_CROSS_PRECISION"); assert all(row["source"]=="g74_firstuse_austen_git_pin" for row in r["cases"][1:]); assert c["original_g63"]=="FAIL_NO_GO_UNCHANGED"; assert c["original_g73"]=="REFERENCE_ONLY_PASS_NOT_SCIENTIFIC"; assert not c["pretraining_heldout_proven"]; assert c["scientific_acceptance"]=="NOT_GRANTED"; assert not c["qualified_novel_acceleration"]; print("G74_AUTHENTIC_RTX_FRESH_SOURCE_EVIDENCE=PASS"); print("G74_REFERENCE="+c["firstuse_fp32_reference_screen"]); print("G74_CROSS_PRECISION="+c["cross_precision_practical_screen"])'
          if ($LASTEXITCODE -ne 0) { throw 'G74_FROZEN_QUALIFICATION_DATA_INCOMPLETE' }
      - name: Upload numeric evidence and runtime pins only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-g74-original-rtx-austen-firstuse-direct-cost
          path: |
            g74_result.json
            g74_pip_freeze.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Delete disposable software weights and both text sources
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($name in @('acc-g74-venv','acc-g74-hf','acc-g74-wikitext-test.txt','acc-g74-austen.txt')) {
            $p=Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction Stop }
          }
          Write-Output 'G74_DISPOSABLE_MODEL_SOFTWARE_AND_CORPORA_CLEANUP=PASS'
