name: MP-AI usage continuity from accepted memory to scoped consumers
on:
  push:
    branches: [proposal/mpai-usage-continuity-20261029]
    paths: ['.github/workflows/mpai-usage-continuity-20261029.yml']
permissions:
  contents: read
jobs:
  accepted-memory-cold-readback:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-pinned real accepted Mind-Palace usage recall and proposal (zero writers)
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: 'Never'
          GH_PROMPT_DISABLED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){
            throw 'MPAI_USAGE_WRONG_ORIGINAL_WINDOWS_RUNNER'
          }
          if($env:OPENAI_API_KEY){throw 'MPAI_USAGE_PAID_API_NOT_AUTHORIZED'}
          if($env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'MPAI_USAGE_NO_REPLAY'}
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){
            throw 'MPAI_USAGE_FORGE_HEAD_DRIFT'
          }
          $privateRepo='https://github.com/spoonman136668-ai/Mind-Palace.git'
          $mpBranch='review/mpai-usage-continuity-20261029'
          $mpSource='638bc9b2883c6b01f81383a5c4afa87738641047'
          $newTestBlob='68dc50ca43f2d40044a26379c77d6e90a6d29392'
          $priorSource='f31e4203892730ddbe24d44ce5674f5678d498aa'
          $scratch=Join-Path $env:RUNNER_TEMP ('mpai-usage-source-'+$env:GITHUB_RUN_ID)
          $root=Join-Path $scratch 'repo'
          $testLog=Join-Path $scratch 'private-test.log'
          $guard=@(
            '.ice/records.json','.ice/source-ledger.json','archive/index.json',
            '.ice/remote-bootstrap.json','.ice/remote-catalog.json',
            '.ice/remote-index.ndjson','.ice/chat-delta-state.json',
            '.ice/project-state-capsules.json','.ice/project-dependency-graph.json')
          $need=@(
            'tools/mindpalace_readonly.py','tools/mindpalace_mcp.py',
            'agentic/mpai01_probe.py','agentic/mpai01_reflect.py',
            'tests/test_mpai_usage_continuity.py',
            'tests/test_mpai_integrated_cycle.py')+$guard
          if(Test-Path -LiteralPath $scratch){throw 'MPAI_USAGE_SCRATCH_COLLISION'}
          New-Item -Path $scratch -ItemType Directory -ErrorAction Stop | Out-Null
          try {
            $remote=@(git.exe ls-remote --exit-code $privateRepo ('refs/heads/'+$mpBranch))
            if($LASTEXITCODE -ne 0 -or $remote.Count -ne 1 -or
               -not ([string]$remote[0]).StartsWith($mpSource)){
              throw 'MPAI_USAGE_MP_SOURCE_REF_DRIFT'
            }
            & git.exe clone --quiet --filter=blob:none --no-checkout --single-branch --branch $mpBranch $privateRepo $root
            if($LASTEXITCODE -ne 0){throw 'MPAI_USAGE_PRIVATE_SOURCE_CLONE_DENIED'}
            if((git.exe -C $root config --get remote.origin.partialclonefilter | Out-String).Trim() -cne 'blob:none'){
              throw 'MPAI_USAGE_PRIVATE_BLOB_FILTER_MISSING'
            }
            $patterns=@($need|ForEach-Object{'/'+$_})
            & git.exe -C $root sparse-checkout set --no-cone @patterns
            if($LASTEXITCODE -ne 0){throw 'MPAI_USAGE_SPARSE_CONTRACT_FAILED'}
            & git.exe -C $root checkout --force $mpSource
            if($LASTEXITCODE -ne 0 -or
               (git.exe -C $root rev-parse HEAD | Out-String).Trim() -cne $mpSource){
              throw 'MPAI_USAGE_EXACT_MP_COMMIT_DRIFT'
            }
            $actual=(git.exe -C $root rev-parse 'HEAD:tests/test_mpai_usage_continuity.py' | Out-String).Trim()
            if($actual -cne $newTestBlob){throw 'MPAI_USAGE_NEW_TEST_BLOB_CHANGED'}
            # Existing UQ51 synthetic fixture requires its real frozen ancestor.
            # Do not use a depth-one clone for canonical Test-All.ps1.
            $frozenFixture='90d2dc1e79f0fcdcf49fba7680e29b5760e80d6b'
            & git.exe -C $root merge-base --is-ancestor $frozenFixture $mpSource
            if($LASTEXITCODE -ne 0){throw 'MPAI_USAGE_FROZEN_FIXTURE_HISTORY_UNAVAILABLE'}
            Write-Output 'MPAI_USAGE_ORIGINAL_FROZEN_FIXTURE_HISTORY=PASS'
            # The accepted records source identity is pinned independently;
            # a shallow clone cannot be used to infer branch ancestry.
            $acceptedIceTree='842b8c1318db3b826bdb7243b0cdf0d5d8efedc2'
            $actualIce=(git.exe -C $root rev-parse 'HEAD:.ice' | Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $actualIce -cne $acceptedIceTree){
              throw 'MPAI_USAGE_ACCEPTED_MEMORY_TREE_DRIFT'
            }
            $core=(git.exe -C $root rev-parse 'HEAD:tools/mindpalace_readonly.py' | Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $core -cne '085e00c7bfc0d9f724874c93c75b7c4a79040dc0'){
              throw 'MPAI_USAGE_READONLY_CORE_PIN_DRIFT'
            }
            $mcp=(git.exe -C $root rev-parse 'HEAD:tools/mindpalace_mcp.py' | Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $mcp -cne '9d1d27c7c95f311beab707d53251353b9e5b5311'){
              throw 'MPAI_USAGE_MCP_INTERFACE_DRIFT'
            }
            $before=@{}
            foreach($name in $guard){
              $p=Join-Path $root $name
              if(-not (Test-Path -LiteralPath $p -PathType Leaf)){
                throw 'MPAI_USAGE_PROTECTED_RECORD_MISSING'
              }
              $before[$name]=(Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash
            }
            & git.exe -C $root sparse-checkout disable
            if($LASTEXITCODE -ne 0){throw 'MPAI_USAGE_FULL_CHECKOUT_FAILED'}
            $requiredBlobs=@{
              'tests/Test-All.ps1'='439797231d3a093628f95f783f5f30dbf93fe5bf'
              'tests/test_mpn1_mcp.py'='338fa9c2275a1ae0a942485bce0518898bf5fb57'
              'tests/test_mpai_integrated_cycle.py'='8b23ba85b8cba42222859ba1883ecbbfa1f10c43'
            }
            foreach($file in $requiredBlobs.Keys){
              $actual=(git.exe -C $root rev-parse ('HEAD:'+$file) | Out-String).Trim()
              if($LASTEXITCODE -ne 0 -or $actual -cne $requiredBlobs[$file]){
                throw 'MPAI_USAGE_REQUIRED_INTEGRATION_BLOB_DRIFT'
              }
            }
            Set-Location $root
            & python -B -m unittest discover -s tests -p test_mpai_usage_continuity.py -v *> $testLog
            $exit=$LASTEXITCODE
            $raw=Get-Content -LiteralPath $testLog -Raw -ErrorAction Stop
            if($exit -ne 0 -or $raw -notmatch 'Ran 10 tests' -or
               $raw -notmatch '(?m)^OK(?:\s|$)'){
              foreach($m in [regex]::Matches($raw,'(?m)^(FAIL|ERROR): (test_[a-z0-9_]{3,90}) \(')){
                Write-Output ('MPAI_USAGE_FAILED_TEST='+$m.Groups[2].Value)
              }
              throw 'MPAI_USAGE_REAL_SOURCE_TEST_FAILED_PRIVATE'
            }
            foreach($marker in @(
              'MPAI_USAGE_NINE_PROTECTED_HASHES_UNCHANGED=PASS',
              'MPAI_USAGE_ACCEPTED_SOURCE_COLD_PROCESS_COUNT=2',
              'MPAI_USAGE_SOURCE_BACKED_RECORDS=3',
              'MPAI_USAGE_ACCEPTED_FEEDBACK_ALTERED=FALSE',
              'MPAI_USAGE_SCIENTIFIC_ACCEPTANCE=FALSE',
              'MPAI_USAGE_AUTO_DISCOVERY_ENABLED=FALSE')){
              if(-not $raw.Contains($marker)){throw 'MPAI_USAGE_INCOMPLETE_REAL_SOURCE_RECEIPT'}
            }
            Write-Output 'MPAI_USAGE_REAL_ACCEPTED_SOURCE_TESTS=10_PASS'
            foreach($line in ($raw -split [char]10)){
              if($line -match '^MPAI_USAGE_[A-Z_]+=(PASS|FALSE|[0-9]+)$'){
                Write-Output $line
              }
            }
            Remove-Item -LiteralPath $testLog -Force
            & python -B -m unittest discover -s tests -p test_mpai_integrated_cycle.py -v *> $testLog
            $exit=$LASTEXITCODE
            $raw=Get-Content -LiteralPath $testLog -Raw -ErrorAction Stop
            if($exit -ne 0 -or $raw -notmatch 'Ran 10 tests' -or
               $raw -notmatch '(?m)^OK(?:\s|$)'){
              foreach($m in [regex]::Matches($raw,'(?m)^(FAIL|ERROR): (test_[a-z0-9_]{3,90}) \(')){
                Write-Output ('MPAI_USAGE_EXISTING_FAILED_TEST='+$m.Groups[2].Value)
              }
              throw 'MPAI_USAGE_EXISTING_MCP_REGRESSION_PRIVATE'
            }
            Write-Output 'MPAI_USAGE_EXISTING_INTEGRATED_REGRESSION=10_PASS'
            & python -B -m unittest discover -s tests -p test_mpn1_mcp.py -v *> $testLog
            $rc=$LASTEXITCODE
            $report=Get-Content -LiteralPath $testLog -Raw
            if($rc -ne 0 -or $report -notmatch '(?m)^OK(?:\s|$)'){
              throw 'MPAI_USAGE_MCP_STDIO_LOOPBACK_FAILED_PRIVATE'
            }
            Write-Output 'MPAI_USAGE_MCP_STDIO_LOOPBACK_REGRESSION=PASS'
            # UQ51 repository-transaction fixture clones the current branch;
            # create a local-only name for this exact pinned detached commit.
            & git.exe -C $root switch --create mpai-qual-only
            if($LASTEXITCODE -ne 0){throw 'MPAI_USAGE_LOCAL_TEST_BRANCH_FAILED'}
            $onBranch=(git.exe -C $root rev-parse HEAD | Out-String).Trim()
            $branchName=(git.exe -C $root branch --show-current | Out-String).Trim()
            if($onBranch -cne $mpSource -or $branchName -cne 'mpai-qual-only'){
              throw 'MPAI_USAGE_TEST_BRANCH_SOURCE_DRIFT'
            }
            Write-Output 'MPAI_USAGE_LOCAL_BRANCH_SAME_SOURCE_SHA=PASS'
            & pwsh.exe -NoProfile -NonInteractive -File (Join-Path $root 'tests/Test-All.ps1') *> $testLog
            $rc=$LASTEXITCODE
            $report=Get-Content -LiteralPath $testLog -Raw
            if($rc -ne 0 -or -not $report.Contains('Mind-Palace regression suite passed')){
              Write-Output ('MPAI_USAGE_FULL_WINDOWS_EXIT_NONZERO='+[string]($rc -ne 0))
              $lastTest='NO_TEST_MARKER'
              foreach($logLine in $report.Split([char]10)){
                $lineText=$logLine.Trim()
                if($lineText.StartsWith('RUN Test-') -and $lineText.EndsWith('.ps1') -and $lineText.Length -le 80){
                  $lastTest=$lineText
                }
              }
              Write-Output ('MPAI_USAGE_FULL_LAST_TEST='+$lastTest)
              foreach($errorKind in @('CommandNotFoundException','UnauthorizedAccessException','NativeCommandError','ParameterBindingException','PSSecurityException','RuntimeException','MethodException','FileNotFoundException','DirectoryNotFoundException','InvalidOperationException','ParserError')){
                if($report.Contains($errorKind)){
                  Write-Output ('MPAI_USAGE_FULL_ERROR_KIND='+$errorKind)
                  break
                }
              }
              if($report.Contains('running scripts is disabled')){
                Write-Output 'MPAI_USAGE_FULL_EXECUTION_POLICY_BLOCK=TRUE'
              }
              throw 'MPAI_USAGE_FULL_WINDOWS_REGRESSION_FAILED_PRIVATE'
            }
            Write-Output 'MPAI_USAGE_FULL_WINDOWS_TEST_ALL=PASS'
            foreach($name in $guard){
              $now=(Get-FileHash -LiteralPath (Join-Path $root $name) -Algorithm SHA256).Hash
              if($before[$name] -cne $now){throw 'MPAI_USAGE_PROTECTED_SOURCE_CHANGED'}
            }
            $dirty=@(git.exe -C $root status --porcelain=v1 --untracked-files=all)
            if($LASTEXITCODE -ne 0 -or $dirty.Count -gt 0){
              throw 'MPAI_USAGE_SOURCE_WORKTREE_CHANGED'
            }
            $remoteAfter=@(git.exe ls-remote --exit-code $privateRepo ('refs/heads/'+$mpBranch))
            if($LASTEXITCODE -ne 0 -or $remoteAfter.Count -ne 1 -or
               -not ([string]$remoteAfter[0]).StartsWith($mpSource)){
              throw 'MPAI_USAGE_REMOTE_PIN_DRIFT'
            }
            Write-Output 'MPAI_USAGE_SOURCE_PIN=PASS'
            Write-Output 'MPAI_USAGE_PROTECTED_MEMORY_WRITES=0'
            Write-Output 'MPAI_USAGE_NEW_CONTROLLERS=0'
            Write-Output 'MPAI_USAGE_REAL_CLIENT_IDENTITY_PROVEN=FALSE'
            Write-Output 'MPAI_USAGE_BEHAVIORAL_IMPROVEMENT_PROVEN=FALSE'
          } finally {
            Set-Location $env:RUNNER_TEMP
            if(Test-Path -LiteralPath $scratch){
              Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction Stop
            }
            Write-Output ('MPAI_USAGE_PRIVATE_SCRATCH_CLEAN='+[string](-not (Test-Path -LiteralPath $scratch)))
          }
