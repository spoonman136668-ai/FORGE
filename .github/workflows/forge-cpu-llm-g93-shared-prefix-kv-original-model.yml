name: FORGE CPU LLM Evaluation G93 original GPT2 shared-prefix KV reuse

on:
  push:
    branches: [research/cpu-llm-g93-shared-prefix-kv-gpt2-20261031]
    paths:
      - '.github/workflows/forge-cpu-llm-g93-shared-prefix-kv-original-model.yml'
      - 'research/cpu_g93/**'

permissions:
  contents: read

concurrency:
  group: forge-cpu-llm-g93-shared-prefix-kv
  cancel-in-progress: false

jobs:
  frozen-source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify G70 baseline, frozen G93 preregistration and source identity
        shell: bash
        run: |
          set -euo pipefail
          BASE=20a540d0241519e2e9d90ace868ffd6db60bd065
          PREREG=047ec14a2e27eedc0bb1e47e050fd4a071b94a6f
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          git merge-base --is-ancestor "$PREREG" HEAD
          test "$(git rev-parse HEAD:docs/research/CPU-G93-GPT2-SHARED-PREFIX-KV-REUSE-PREREG-20261031.md)" = "c7b5ecc3a97d6eb56c3fa7da3fd1ac680ae7c995"
          test "$(git rev-parse HEAD:research/cpu_g93/g93_shared_prefix_kv_original.py)" = "76272435b9a3cd770256922cffcbe453fcdfc2a5"
          test "$(git rev-parse HEAD:research/cpu_g93/test_g93_shared_prefix_kv_original.py)" = "301ca9386c5cd6fa9b0483d3aec1f203bff72edf"
          git diff --exit-code "$BASE" HEAD -- research/llm_g54 research/llm_g55 research/llm_g56 research/llm_g57 research/llm_g58 research/llm_g59 research/llm_g60 research/llm_g61 research/llm_g62 research/llm_g63 research/llm_g64 research/llm_g65 research/llm_g66 research/llm_g67 research/llm_g68 research/llm_g70
          python -B -m py_compile research/cpu_g93/g93_shared_prefix_kv_original.py research/cpu_g93/test_g93_shared_prefix_kv_original.py
          python -B -m unittest discover -s research/cpu_g93 -p 'test_g93_shared_prefix_kv_original.py' -v
          echo CPU_G93_FROZEN_SOURCE_ADMISSION=PASS

  original-model-shared-prefix-kv:
    needs: frozen-source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify native CPU host and exact frozen source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          test "$(git rev-parse HEAD:research/cpu_g93/g93_shared_prefix_kv_original.py)" = "76272435b9a3cd770256922cffcbe453fcdfc2a5"
          python -B -m unittest discover -s research/cpu_g93 -p 'test_g93_shared_prefix_kv_original.py' -v
      - name: Install pinned original CPU GPT2 runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 huggingface-hub==0.30.2 safetensors==0.5.3 tokenizers==0.21.1 psutil==7.1.3
          python -m pip check
          python - <<'PY'
          import torch,transformers
          assert torch.__version__=="2.5.1+cpu",torch.__version__
          assert torch.version.cuda is None
          assert transformers.__version__=="4.48.3"
          print("G93_PINNED_CPU_RUNTIME=PASS")
          PY
          python -m pip freeze > cpu_g93_environment.txt
          uname -a >> cpu_g93_environment.txt
          lscpu >> cpu_g93_environment.txt
      - name: Run original GPT2 full-prefill versus shared-prefix KV reuse
        shell: bash
        run: |
          set -euo pipefail
          python research/cpu_g93/g93_shared_prefix_kv_original.py
          python - <<'PY'
          import json
          r=json.load(open("cpu_g93_original_result.json",encoding="utf-8"))
          assert r["schema"]=="forge.cpu-llm-g93.authentic-shared-prefix-kv.v1"
          assert r["gate"]=="CPU_G93"
          assert r["preregistration_commit"]=="047ec14a2e27eedc0bb1e47e050fd4a071b94a6f"
          assert r["engineering"]=="PASS" and r["correctness"]=="PASS"
          assert r["metrics"]["timed_authentic_responses"]==96
          assert r["metrics"]["timed_authentic_generated_tokens"]==768
          assert len(r["paired_cohort_trials"])==4
          assert r["decision"] in ("SHARED_PREFIX_KV_PASS","SHARED_PREFIX_KV_NO_GO")
          assert r["scientific_acceptance"]=="NOT_GRANTED" and not r["promotion_allowed"]
          print("CPU_G93_ORIGINAL_SHARED_PREFIX_RESULT="+r["decision"])
          PY
      - name: Upload original measurement and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-g93-original-gpt2-shared-prefix-kv
          retention-days: 30
          if-no-files-found: warn
          path: |
            cpu_g93_original_result.json
            cpu_g93_environment.txt
