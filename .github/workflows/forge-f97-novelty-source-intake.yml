name: FORGE F97 external-source novelty intake and contamination guard
on:
  push:
    branches: [engineering/f97-external-novelty-intake-20261016-r1]
    paths:
      - 'noveltyeval/f97_*'
      - 'cmd/f97audit/**'
      - '.github/workflows/forge-f97-novelty-source-intake.yml'
  pull_request:
    branches: [main]
    paths:
      - 'noveltyeval/f97_*'
      - 'cmd/f97audit/**'
      - '.github/workflows/forge-f97-novelty-source-intake.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: forge-f97-optimizer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  external-test-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify actual F96 test-engineering provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api repos/spoonman136668-ai/FORGE/actions/runs/38970490131 > "$RUNNER_TEMP/f97-f96-source.json"
          python3 - "$RUNNER_TEMP/f97-f96-source.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          assert x["id"]==38970490131
          assert x["repository"]["full_name"]=="spoonman136668-ai/FORGE"
          assert x["head_sha"]=="5b5064868fb7bbf72630661574e6c484df73429f"
          assert x["name"]=="FORGE F96 frozen source mechanism benchmark qualification"
          assert x["status"]=="completed" and x["conclusion"]=="success"
          print("F97_AUTHENTIC_F96_SOURCE_ENGINEERING=QUALIFIED")
          print("F97_AUTHENTIC_EXTERNAL_TEST_WITNESS=NOT_ESTABLISHED")
          PY
      - name: Signed test contract and renamed F96 contamination rejection
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -run '^TestF97' -v ./noveltyeval
          go vet ./noveltyeval ./cmd/f97audit
          go test -count=1 ./noveltyeval ./noveltymechanisms ./optimizerstages ./promptlineage ./genenv ./dreamrsi ./evoportfolio ./thetaadapt
          echo 'F97_SOURCE_SIGNATURE_CONSISTENCY=TESTED_WITH_EPHEMERAL_TEST_KEYS'
          echo 'F97_RENAMING_INVARIANT_LEAKAGE_SCREEN=TESTED'
          echo 'F97_GENUINE_EXTERNAL_PREREGISTRATION=NOT_RECEIVED'
          echo 'F97_SEALED_FIRSTUSE=NOT_PERFORMED'
          echo 'F97_SCIENTIFIC_GENERALIZATION=NOT_ESTABLISHED'
          echo 'F97_THETA_ACCEPTED_TRAINING=DENIED'
          echo 'F97_SCIENCE_DISPATCH=ZERO'
          echo 'F97_CLOUDFLARE_WRITES=ZERO'
          echo 'F97_CKB_DEPENDENCIES=ZERO'
      - name: Full FORGE test vet and build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo 'F97_FROZEN_CONTAMINATION_INTAKE_SOURCE_QUALIFIED=PASS'
