name: MP-AI05 synthetic signed provenance and independent verifier probe
on:
  push:
    branches: [qualification/mpai05-offline-private-proof-20261027]
    paths: ['.github/workflows/mpai05-synthetic-signed-provenance.yml']
permissions:
  contents: read
concurrency:
  group: mpai05-synthetic-attestation-probe
  cancel-in-progress: false
jobs:
  sign-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Generate only non-private synthetic receipt with exact run binding
        shell: bash
        env:
          REPO_NAME: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          obj={"schema":"mpai05.public-synthetic-provenance.v1",
               "purpose":"signed-provenance-transport-probe-not-scientific-evidence",
               "repository":os.environ["REPO_NAME"],
               "source_ref":os.environ["REF_NAME"],
               "source_sha":os.environ["COMMIT_SHA"],
               "run_id":os.environ["RUN_NUMBER"],
               "private_holdouts":0,"model_calls":0,
               "provider_identity_authenticated":False,
               "independent_custody_authenticated":False,
               "scientific_admission":False}
          with open("mpai05-public-synthetic-receipt.json","w",encoding="utf-8") as f:
              json.dump(obj,f,sort_keys=True,separators=(",",":"))
          PY
          echo 'MPAI05_SYNTHETIC_PROVENANCE_SOURCE=PASS'
      - name: Generate GitHub Sigstore provenance for public synthetic bytes
        uses: actions/attest@v4
        with:
          subject-path: mpai05-public-synthetic-receipt.json
      - name: Transfer synthetic-only bytes to independent hosted verifier job
        uses: actions/upload-artifact@v4
        with:
          name: mpai05-public-synthetic-receipt
          path: mpai05-public-synthetic-receipt.json
          if-no-files-found: error
          retention-days: 1

  verify-on-independent-job:
    runs-on: ubuntu-latest
    needs: sign-synthetic
    timeout-minutes: 8
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Retrieve only synthetic receipt
        uses: actions/download-artifact@v4
        with:
          name: mpai05-public-synthetic-receipt
      - name: Verify GitHub-signed producer workflow, source ref, immutable commit and tamper rejection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          set -euo pipefail
          file=mpai05-public-synthetic-receipt.json
          signer='spoonman136668-ai/FORGE/.github/workflows/mpai05-synthetic-signed-provenance.yml'
          gh attestation verify "$file" --repo "$REPO_NAME" --signer-workflow "$signer" --source-ref "$REF_NAME" --source-digest "$COMMIT_SHA" > verified-private.log
          echo 'MPAI05_GITHUB_ATTESTATION=PASS'
          python3 - <<'PY'
          import json, os
          data=json.load(open("mpai05-public-synthetic-receipt.json",encoding="utf-8"))
          assert data["schema"]=="mpai05.public-synthetic-provenance.v1"
          assert data["repository"]==os.environ["REPO_NAME"]
          assert data["source_ref"]==os.environ["REF_NAME"]
          assert data["source_sha"]==os.environ["COMMIT_SHA"]
          assert data["run_id"]==os.environ["RUN_NUMBER"]
          assert data["private_holdouts"]==0
          assert data["model_calls"]==0
          assert data["provider_identity_authenticated"] is False
          assert data["independent_custody_authenticated"] is False
          assert data["scientific_admission"] is False
          PY
          echo 'MPAI05_GITHUB_PROVENANCE_SOURCE_IDENTITY=PASS'
          cp "$file" tampered.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tampered.json")
          b=p.read_bytes()
          p.write_bytes(b.replace(b'0',b'1',1))
          assert p.read_bytes()!=Path("mpai05-public-synthetic-receipt.json").read_bytes()
          PY
          if gh attestation verify tampered.json --repo "$REPO_NAME" --signer-workflow "$signer" > tampered-private.log 2>&1; then
            echo 'MPAI05_TAMPERED_SYNTHETIC_ATTESTATION=UNEXPECTED_ACCEPT'
            exit 1
          fi
          echo 'MPAI05_TAMPERED_SYNTHETIC_ATTESTATION=REJECTED'
          echo 'MPAI05_INDEPENDENT_TRUST_DOMAINS=NOT_PROVISIONED'
          echo 'MPAI05_REAL_PRIVATE_CUSTODY=NOT_AUTHENTICATED'
          echo 'MPAI05_MODEL_CALLS=0'
          echo 'MPAI05_PRIVATE_DATA=NOT_READ'
          echo 'MPAI05_SCIENTIFIC_ADMISSION=FALSE'
