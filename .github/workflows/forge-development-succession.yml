name: FORGE source-qualified development completion succession

# Event-driven, one-shot gate for the existing development workflow.
# This workflow has NO cron. The integrated workflow's existing schedule
# is its ten-minute fallback. It never dispatches scientific originals.
on:
  workflow_dispatch:
    inputs:
      origin:
        description: 'Explicit development-only Windows recovery wake'
        type: choice
        options: [f137-windows-wake]
        required: true
      source_sha:
        description: 'Protected main SHA observed by Windows wake'
        type: string
        required: true
      wake_nonce:
        description: 'Fresh local non-secret correlation nonce, 32 lowercase hex'
        type: string
        required: true
  workflow_run:
    workflows:
      - FORGE integrated two-lane safe research-cycle acceptance
      - FORGE live two-lane research metadata observer
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - 'nativeevidence/f136_succession.py'
      - 'nativeevidence/test_f136_succession.py'
      - 'nativeevidence/test_f137_observer_bootstrap.py'
      - 'nativeevidence/f137_windows_wake.py'
      - 'nativeevidence/test_f137_windows_wake.py'
      - 'reference/research-intake/f136-development-succession-freeze.json'
      - '.github/workflows/forge-development-succession.yml'

permissions:
  contents: read

concurrency:
  group: forge-f136-development-successor-controller
  cancel-in-progress: false

jobs:
  pr-guard-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check bounded F136 and F137 source-only successor rules
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s nativeevidence -p 'test_f136_*.py' -v
          python3 -B -m unittest discover -s nativeevidence -p 'test_f137_*.py' -v

  windows-wake-syntax:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify silent SYSTEM PowerShell syntax without running wake or dispatch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errorsFound = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $pwd 'scripts/f137-windows-wake.ps1'),
            [ref]$tokens,[ref]$errorsFound)
          if ($errorsFound.Count -ne 0) {
            $errorsFound | Format-List
            throw 'F137_WINDOWS_SYNTAX_INVALID'
          }
          Write-Host 'F137_WINDOWS_WAKE_SYNTAX=PASS'
          Write-Host 'F137_WAKE_DISPATCH_EXECUTED=FALSE'

  source-gated-successor:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'FORGE integrated two-lane safe research-cycle acceptance' &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate frozen source, bounded decision rules and no-science denials
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s nativeevidence -p 'test_f136_*.py' -v
          python3 -B -m unittest discover -s nativeevidence -p 'test_f137_*.py' -v
          echo 'F136_CONTROLLER_PROVENANCE_TESTS=PASS'
      - name: Reconcile genuine successful main run and bounded historical source
        if: github.event_name == 'workflow_run'
        id: gate
        shell: bash
        env:
          PARENT_RUN: ${{ github.event.workflow_run.id }}
          PAUSE: ${{ vars.FORGE_DEV_AUTONOMY_PAUSE }}
        run: |
          set -euo pipefail
          # A restarted or manually rerun controller may not replay dispatch.
          test "$GITHUB_RUN_ATTEMPT" = "1"
          root="$RUNNER_TEMP/forge-f136-succession"
          mkdir -p "$root"
          # Obtain authoritative GitHub data independently of webhook fields.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN" > "$root/prior.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN/artifacts?per_page=100" > "$root/artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha' > "$root/main.sha"
          # Collect up to 300 newest integrated runs. The Python evaluator
          # stops if the oldest observed run has not crossed UTC midnight.
          for page in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forge-integrated-synthetic-cycle.yml/runs?branch=main&per_page=100&page=$page" > "$root/page-$page.json"
          done
          python3 - "$root" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          pages=[json.loads((root/f"page-{n}.json").read_text()) for n in (1,2,3)]
          rows=[r for p in pages for r in p["workflow_runs"]]
          assert len(rows)==len({r["id"] for r in rows}),"F136_GITHUB_PAGINATION_DUPLICATE"
          assert rows and len(rows)<=300,"F136_GITHUB_HISTORY_BOUNDS"
          (root/"recent.json").write_text(json.dumps(
              {"total_count":pages[0]["total_count"],"workflow_runs":rows},
              sort_keys=True,separators=(",",":")))
          PY
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          main_sha="$(tr -d '\r\n' < "$root/main.sha")"
          # A workflow_run executes on default-branch code, not the source
          # workflow head. Reject any checkout drifting from authenticated
          # protected main while this one-shot controller was queued.
          test "$(git rev-parse HEAD)" = "$main_sha"
          paused=false
          if [[ "$PAUSE" == 'true' ]]; then paused=true; fi
          # Preflight decision does not require zipped payload readback. We
          # open the six source archives only if the cheap gate is eligible.
          cat > "$root/preflight.py" <<'PY'
          import sys,json
          from pathlib import Path
          from datetime import datetime
          sys.path.insert(0,"nativeevidence")
          import f136_succession as g
          d=Path(sys.argv[1])
          out=g.decision(
              g.strict((d/"prior.json").read_bytes()),
              g.strict((d/"artifacts.json").read_bytes()),
              g.strict((d/"recent.json").read_bytes()),
              (d/"main.sha").read_text().strip(),
              g.stamp(sys.argv[2]),
              paused=(sys.argv[3]=="true"))
          (d/"preflight.json").write_text(json.dumps(out,sort_keys=True))
          print("F136_PREFLIGHT_DISPATCH="+str(out["dispatch"]))
          PY
          python3 "$root/preflight.py" "$root" "$stamp" "$paused"
          eligible="$(jq -r '.dispatch' "$root/preflight.json")"
          if [[ "$eligible" != "true" ]]; then
            # Only the *sole* near-fallback veto permits one bounded pause.
            # Recheck after the nominal slot; never relax the frozen F136 gate.
            delay="$(python3 - "$root/preflight.json" "$stamp" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"nativeevidence")
          import f136_succession as g
          report=g.strict(Path(sys.argv[1]).read_bytes())
          print(g.single_recheck_delay_seconds(report,g.stamp(sys.argv[2])))
          PY
            )"
            if [[ "$delay" != "0" ]]; then
              cp "$root/preflight.json" "$root/preflight-initial.json"
              echo "F136_POST_SLOT_RECHECK_ONCE_SECONDS=$delay"
              sleep "$delay"
              test "$GITHUB_RUN_ATTEMPT" = "1"
              gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha' > "$root/main.sha"
              test "$(git rev-parse HEAD)" = "$(tr -d '\r\n' < "$root/main.sha")"
              for page in 1 2 3; do
                gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forge-integrated-synthetic-cycle.yml/runs?branch=main&per_page=100&page=$page" > "$root/page-$page.json"
              done
              python3 - "$root" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          pages=[json.loads((root/f"page-{n}.json").read_text()) for n in (1,2,3)]
          rows=[r for p in pages for r in p["workflow_runs"]]
          assert len(rows)==len({r["id"] for r in rows}),"F136_RECHECK_GITHUB_PAGINATION_DUPLICATE"
          assert rows and len(rows)<=300,"F136_RECHECK_GITHUB_HISTORY_BOUNDS"
          (root/"recent.json").write_text(json.dumps(
              {"total_count":pages[0]["total_count"],"workflow_runs":rows},
              sort_keys=True,separators=(",",":")))
          PY
              stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              paused=false
              if [[ "$PAUSE" == 'true' ]]; then paused=true; fi
              python3 "$root/preflight.py" "$root" "$stamp" "$paused"
              eligible="$(jq -r '.dispatch' "$root/preflight.json")"
              echo "F136_POST_SLOT_RECHECK_ONCE_DECISION=$eligible"
            fi
          fi
          if [[ "$eligible" != "true" ]]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            jq -r '.reasons[]' "$root/preflight.json" | sed 's/^/F136_DECLINED_/'
            exit 0
          fi
          for prefix in forge-f124-autonomy- forge-f126-original-negative-agenda- forge-f129-admission-; do
            for os in ubuntu-latest windows-latest; do
              name="$prefix$os"
              mkdir -p "$root/$name"
              gh run download "$PARENT_RUN" --repo "$GITHUB_REPOSITORY" -n "$name" -D "$root/$name"
            done
          done
          python3 -B nativeevidence/f136_succession.py \
            --trigger "$root/prior.json" \
            --artifacts-index "$root/artifacts.json" \
            --recent "$root/recent.json" \
            --main-sha "$main_sha" \
            --now "$stamp" --paused "$paused" \
            --report-dir "$root" \
            --output "$root/f136-decision.json"
          test "$(jq -r '.dispatch' "$root/f136-decision.json")" = "true"
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "parent=$PARENT_RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo 'F136_AUTHENTIC_SIX_ARCHIVES_AND_DAILY_BUDGET_PASS'
      - name: Dispatch exactly one existing source-only development successor
        if: github.event_name == 'workflow_run' && steps.gate.outputs.dispatch == 'true'
        shell: bash
        env:
          PARENT_RUN: ${{ steps.gate.outputs.parent }}
          EXPECTED_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$EXPECTED_SHA"
          # GitHub GITHUB_TOKEN allows workflow_dispatch. No PAT, no paid API,
          # no code write, and no new scheduler or scientific first-use.
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/forge-integrated-synthetic-cycle.yml/dispatches" \
            -f ref=main -f 'inputs[origin]=f136-completion' \
            -f "inputs[parent_run_id]=$PARENT_RUN" \
            -f "inputs[parent_source_sha]=$EXPECTED_SHA"
          echo 'F136_ONE_DEVELOPMENT_SUCCESSOR_DISPATCHED=TRUE'
          echo 'F136_SCIENCE_ORIGINALS_AND_OPTIMIZER_PROMOTIONS=ZERO'
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_run'
        with:
          name: forge-f136-completion-decision-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/forge-f136-succession/preflight.json
            ${{ runner.temp }}/forge-f136-succession/preflight-initial.json
            ${{ runner.temp }}/forge-f136-succession/f136-decision.json
          if-no-files-found: warn
          retention-days: 14

  # F137 reuse of an already scheduled read-only observer; no new cron or controller.
  source-gated-observer-recovery:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'FORGE live two-lane research metadata observer' &&
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source-bound recovery and scientific denial tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python3 -B -m unittest discover -s nativeevidence -p 'test_f136_*.py' -v
          python3 -B -m unittest discover -s nativeevidence -p 'test_f137_*.py' -v
          echo 'F137_SCHEDULE_OBSERVER_GUARDS=PASS'
      - name: Reconcile genuine scheduled observer, artifacts, source and daily budget
        id: gate
        shell: bash
        env:
          PARENT_RUN: ${{ github.event.workflow_run.id }}
          PAUSE: ${{ vars.FORGE_DEV_AUTONOMY_PAUSE }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          root="$RUNNER_TEMP/forge-f137-scheduled-recovery"
          mkdir -p "$root"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN" > "$root/observer.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN/artifacts?per_page=100" > "$root/artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha' > "$root/main.sha"
          for page in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forge-integrated-synthetic-cycle.yml/runs?branch=main&per_page=100&page=$page" > "$root/page-$page.json"
          done
          test "$(git rev-parse HEAD)" = "$(tr -d '\r\n' < "$root/main.sha")"
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          paused=false
          if [[ "$PAUSE" == 'true' ]]; then paused=true; fi
          python3 - "$root" "$stamp" "$paused" <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"nativeevidence")
          import f136_succession as f
          root=Path(sys.argv[1])
          pages=[f.strict((root/("page-"+str(p)+".json")).read_bytes())
                 for p in (1,2,3)]
          rows=[r for p in pages for r in p["workflow_runs"]]
          if len(rows)!=len({r["id"] for r in rows}):
              raise f.Invalid("F137_GITHUB_HISTORY_DUPLICATE")
          if not rows or len(rows)>300:
              raise f.Invalid("F137_GITHUB_HISTORY_BOUNDS")
          report=f.observer_bootstrap_decision(
              f.strict((root/"observer.json").read_bytes()),
              f.strict((root/"artifacts.json").read_bytes()),
              {"total_count":pages[0]["total_count"],"workflow_runs":rows},
              (root/"main.sha").read_text().strip(),f.stamp(sys.argv[2]),
              paused=(sys.argv[3]=="true"))
          (root/"decision.json").write_text(
              json.dumps(report,sort_keys=True,separators=(",",":"))+"\n")
          print("F137_SCHEDULED_OBSERVER_ONLY_DEVELOPMENT="+str(report["dispatch"]))
          print("F137_NO_SCIENTIFIC_ORIGINALS_OR_ACCEPTED_REFS=PASS")
          for reason in report["reasons"]:
              print("F137_DECLINED_"+reason)
          PY
          if [[ "$(jq -r '.dispatch' "$root/decision.json")" != "true" ]]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "parent=$PARENT_RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$(tr -d '\r\n' < "$root/main.sha")" >> "$GITHUB_OUTPUT"
      - name: Dispatch exactly one existing development-only integrated cycle
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        env:
          PARENT_RUN: ${{ steps.gate.outputs.parent }}
          EXPECTED_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$EXPECTED_SHA"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/forge-integrated-synthetic-cycle.yml/dispatches" \
            -f ref=main -f 'inputs[origin]=f137-scheduled-recovery' \
            -f "inputs[parent_run_id]=$PARENT_RUN" \
            -f "inputs[parent_source_sha]=$EXPECTED_SHA"
          echo 'F137_ONE_EXISTING_DEVELOPMENT_CYCLE_DISPATCHED=TRUE'
          echo 'F137_GENUINE_INTEGRATED_SCHEDULE_CLAIMED=FALSE'
          echo 'F137_SCIENCE_ORIGINALS_AND_OPTIMIZER_PROMOTIONS=ZERO'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-f137-scheduled-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/forge-f137-scheduled-recovery/decision.json
          if-no-files-found: warn
          retention-days: 14

  # Windows Task Scheduler only supplies wake requests; this existing controller
  # owns ALL state decisions, source verification and restricted dispatch.
  # This cannot be accepted as genuine GitHub cron or scientific first-use.
  source-gated-windows-bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.origin == 'f137-windows-wake'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      WAKE_NONCE: ${{ inputs.wake_nonce }}
      PINNED_SHA: ${{ inputs.source_sha }}
      PAUSE: ${{ vars.FORGE_DEV_AUTONOMY_PAUSE }}
      ENABLED: ${{ vars.FORGE_F137_WINDOWS_WAKE_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify fail-closed F136 and Windows wake protocol
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s nativeevidence -p 'test_f136_*.py' -v
          python3 -B -m unittest discover -s nativeevidence -p 'test_f137_*.py' -v
          echo 'F137_WINDOWS_WAKE_SOURCE_GUARD=PASS'
      - name: Reconcile independent provider source, budget, other wake and integrated runs
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          root="$RUNNER_TEMP/forge-f137-windows"
          mkdir -p "$root"
          check_state() {
            gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha' > "$root/main.sha"
            test "$(git rev-parse HEAD)" = "$(tr -d '\r\n' < "$root/main.sha")"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$root/wake.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forge-development-succession.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$root/wake-history.json"
            for page in 1 2 3; do
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forge-integrated-synthetic-cycle.yml/runs?branch=main&per_page=100&page=$page" > "$root/page-$page.json"
            done
          }
          evaluate() {
            stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            paused=false; enabled=false
            if [[ "$PAUSE" == 'true' ]]; then paused=true; fi
            if [[ "$ENABLED" == 'true' ]]; then enabled=true; fi
            python3 -B nativeevidence/f137_windows_wake.py \
              --root "$root" --now "$stamp" \
              --pinned-sha "$PINNED_SHA" --nonce "$WAKE_NONCE" \
              --paused "$paused" --enabled "$enabled" \
              --output "$root/decision.json"
          }
          check_state
          evaluate
          if [[ "$(jq -r '.dispatch' "$root/decision.json")" != 'true' ]]; then
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An independent read before POST narrows the duplicate window;
          # it is not a claim of global atomic reservation.
          check_state
          evaluate
          if [[ "$(jq -r '.dispatch' "$root/decision.json")" != 'true' ]]; then
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'dispatch=true' >> "$GITHUB_OUTPUT"
          echo "sha=$(tr -d '\r\n' < "$root/main.sha")" >> "$GITHUB_OUTPUT"
          echo 'F137_WINDOWS_WAKE_ELIGIBLE_FOR_ONE_DEVELOPMENT_CYCLE=TRUE'
      - name: Dispatch one existing synthetic two-lane development cycle
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$EXPECTED_SHA"
          test "$ENABLED" = "true"
          test "$PAUSE" != "true"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/forge-integrated-synthetic-cycle.yml/dispatches" \
            -f ref=main -f 'inputs[origin]=f137-windows-recovery' \
            -f "inputs[parent_run_id]=$GITHUB_RUN_ID" \
            -f "inputs[parent_source_sha]=$EXPECTED_SHA"
          echo 'F137_WINDOWS_ONE_DEVELOPMENT_BOOTSTRAP_DISPATCHED=TRUE'
          echo 'F137_GENUINE_GITHUB_SCHEDULE_OR_FIRST_USE_PROVEN=FALSE'
          echo 'F137_PROTECTED_SCIENCE_AND_CKB_PLANE_MUTATIONS=ZERO'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-f137-windows-decision-${{ github.run_id }}
          path: ${{ runner.temp }}/forge-f137-windows/decision.json
          if-no-files-found: warn
          retention-days: 14
