name: FORGE R19A INVALID block parity qualification
on:
  push:
    branches:
      - proposal/r19a-invalid-progression-fix-20261011
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Source identity and frozen design scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 8abcbf83c4821f31b9745de5a52b3bb3f4deeb28
          python - <<'PY'
          import subprocess
          rows=subprocess.check_output(["git","diff","--name-status","HEAD^","HEAD"],text=True).splitlines()
          expected={"evoportfolio/checkpoint.go":"M","evoportfolio/r19_invalid_test.go":"A",".github/workflows/qualify-r19a-invalid.yml":"A"}
          assert len(rows)==3,rows
          assert all(expected.get(x.split("\t")[1])==x.split("\t")[0] for x in rows),rows
          PY
      - name: Full tests vet build and race
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./evoportfolio
          go test -count=1 ./...
          go vet ./...
          go build ./...
          if [ "$RUNNER_OS" = Linux ]; then go test -race -count=1 ./...; fi
          echo R19A_INVALID_BLOCK=PASS
