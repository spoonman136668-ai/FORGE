name: ACC46 original U24 local cellular learning native Go qualification
on:
  pull_request:
    paths:
      - 'research/acceleration/acc46_go_u24/**'
      - 'docs/research/ACC-46-*'
      - '.github/workflows/forge-acc46-original-u24-go.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-u24-native:
    name: ACC46 U24 60 cold Go workers / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Authenticate U24 original identity BEFORE Go executable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/ac07_sourcefree/ac08_portfolio.py)" = 5126c860771fb024ccfc14c3f7ee8925edf29787
          python - <<'PY'
          import ast,pathlib
          node=ast.parse(pathlib.Path('research/ac07_sourcefree/ac08_portfolio.py').read_text())
          names=ast.literal_eval(next(x.value for x in node.body if isinstance(x,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='ORIGINAL_NAMES' for t in x.targets)))
          assert len(names)==30
          assert names[23]=='cellular-automata local learning'
          assert names[21]=='low-rank/tensor-train factorization'
          assert names[12]=='fixed-size KV sketches'
          assert names[9]=='holographic associative memory'
          print('ACC46_ORIGINAL_U24_AUTHENTIC_IDENTITY=PASS')
          PY
      - name: Require both prereg documents BEFORE source and exact Go source blob custody
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e000726ee3e5f040db534efa4eb32c400de99cd3 HEAD
          git merge-base --is-ancestor ed0b0b5760480d5e09098674823f015cc460085f HEAD
          test "$(git hash-object docs/research/ACC-46-U24-LOCAL-CA-PREREG.md)" = 85d353c6dd1891753af714c25e6a66784baeaf20
          test "$(git hash-object docs/research/ACC-46-U24-SOURCE-DISTRIBUTION-PRECODE.md)" = ddc28a944171465b0fc0e1e54edb2b302af4a79d
          test "$(git hash-object research/ac06_sourcefree/restricted.py)" = 19c5ce8f485900f06adaffe97f998c83c78aab4c
          test "$(git hash-object research/acceleration/acc46_go_u24/go.mod)" = 31065831177cc0b40543cac5f14432cd8448d10c
          test "$(git hash-object research/acceleration/acc46_go_u24/core.go)" = 5949ea942abbf9c15446ea77de274650552d039f
          test "$(git hash-object research/acceleration/acc46_go_u24/worker.go)" = adce7803b3d380b3c28d92d504ead05ddb773c88
          test "$(git hash-object research/acceleration/acc46_go_u24/main.go)" = 76bd2db1f21c5c9d426a9d6f1eb611e510bcabd9
          test "$(git hash-object research/acceleration/acc46_go_u24/core_test.go)" = eb39258bd17046adf19e7799c0717e20100a51df
          test "$(git hash-object research/acceleration/acc46_go_u24/rss_linux.go)" = 6d0b62ca5b34f400649132f27e446cd180308bc4
          test "$(git hash-object research/acceleration/acc46_go_u24/rss_windows.go)" = 96e8010b630c97372e18dfeb41e3f0701970101f
          test -z "$(git status --porcelain --untracked-files=all)"
          echo ACC46_U24_PREREG_FIRST_NATIVE_GO_SOURCE_HASHES=PASS
      - name: Verify original 36-research evidence remains restricted and unchanged
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acceleration -p 'test_acc34_scoreboard.py' -v
          python -B research/acceleration/acc34_scoreboard.py --full "$RUNNER_TEMP/acc46-36.json"
          python - "$RUNNER_TEMP/acc46-36.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding='utf-8'))
          assert {z['claim_id'] for z in j['rows']}==({f'U{i:02}' for i in range(1,31)}|{f'AC-D{i}' for i in range(1,7)})
          assert j['stage2_qualified_native_model_speedups']==0
          assert not j['scientific_admission'] and not j['scientific_first_use']
          print('ACC46_ORIGINAL_36_NEGATIVE_EVIDENCE_RETAINED=PASS')
          PY
      - name: Run U24 focused Go tests vet build and 60 true worker resource samples
        shell: bash
        run: |
          set -euo pipefail
          cd research/acceleration/acc46_go_u24
          go test -count=1 -v ./...
          go vet ./...
          BIN="$RUNNER_TEMP/acc46"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$BIN.exe"; fi
          go build -trimpath -o "$BIN" .
          "$BIN" -out "$RUNNER_TEMP/acc46-report.json"
      - name: Validate all original U24 FIT heldout native CPU and physical RSS measurements
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/acc46-report.json" <<'PY'
          import json,sys,math
          j=json.load(open(sys.argv[1],encoding='utf-8'))
          assert j['Schema']=='forge.acc46.original-u24.cellular-learning.nativego.v1'
          assert j['OS'] in ('linux','windows')
          assert j['OriginalHypotheses']==30 and j['AdditionalHypotheses']==6
          assert not j['ScientificFirstUse'] and not j['NativeModelAcceleration']
          assert j['NativeChildCount']==len(j['Records'])==60 and len(j['Comparisons'])==3
          assert j['Classification'] in ('U24_NO_GENERAL_VERIFIED_NATIVE_GO_RESOURCE_WIN','U24_RESTRICTED_NATIVE_GO_ENGINEERING_POSITIVE_ONLY')
          names=('GLOBAL_FREQ','REGION_FREQ','CELL_FREQ','LOCAL_CA')
          source={};seen=set()
          for row in j['Records']:
            w=row['Worker'];key=(w['Mode'],w['Regime'],w['Seed'])
            assert key not in seen;seen.add(key)
            assert w['Mode'] in names and w['Regime'] in ('UNIFORM','FOUR_REGIONS','RULE_SHIFT')
            assert w['Episodes']==256 and w['FitStateCount']==256*256
            assert w['HeldoutStateCount']==256*256
            assert w['EvaluatedCells']==256*256*64
            assert w['UnseenCells']>0 and w['CorrectUnseen']<=w['UnseenCells']
            assert w['PeakRSSBytes']>0 and w['MemoryMetric']=='OS_PROCESS_PEAK_PHYSICAL_RSS_BYTES'
            assert row['CPUSeconds']>0 and row['WallSeconds']>0
            assert w['LogicalBytes']=={'GLOBAL_FREQ':32,'REGION_FREQ':128,'CELL_FREQ':2048,'LOCAL_CA':2048}[w['Mode']]
            assert w['NeighborMessageReads']==(4*w['EvaluatedCells'] if w['Mode']=='LOCAL_CA' else 0)
            assert all(math.isfinite(w[z]) for z in ('ErrorRate','UnseenErrorRate'))
            assert all(len(w[z])==64 for z in ('SourceSHA256','FitSHA256','TruthSHA256','PredictionSHA256'))
            cohort=(w['Regime'],w['Seed'])
            reference=(w['SourceSHA256'],w['FitSHA256'],w['TruthSHA256'],w['UnseenCells'])
            assert cohort not in source or source[cohort]==reference
            source[cohort]=reference
          assert len(seen)==60 and len(source)==15
          for c in j['Comparisons']:
            assert c['FastestControl'] in names[:3]
            assert c['AccuracyControl'] in names[:3] and c['UnseenControl'] in names[:3]
            assert all(math.isfinite(c[k]) for k in ('ErrorGap','UnseenGap','CPURatio','RSSRatio'))
          print('ACC46_U24_NATIVE_60_REAL_CPU_RSS_FIT_HELDOUT=PASS')
          print('ACC46_U24_CLASSIFICATION='+j['Classification'])
          PY
      - name: Retain raw all 60 worker and original 36-register receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc46-original-u24-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/acc46-report.json
            ${{ runner.temp }}/acc46-36.json
          retention-days: 30
          if-no-files-found: warn
  crossos:
    name: ACC46 independent original U24 source, FIT, truth, prediction parity
    runs-on: ubuntu-latest
    needs: original-u24-native
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: acc46-original-u24-*
          path: artifacts
          merge-multiple: false
      - name: Independently audit all 60 identical source and heldout predictions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('artifacts')
          a=json.loads((p/'acc46-original-u24-ubuntu-latest'/'acc46-report.json').read_text())
          b=json.loads((p/'acc46-original-u24-windows-latest'/'acc46-report.json').read_text())
          assert {a['OS'],b['OS']}=={'linux','windows'}
          key=lambda x:(x['Worker']['Mode'],x['Worker']['Regime'],x['Worker']['Seed'])
          aa={key(x):x['Worker'] for x in a['Records']}
          bb={key(x):x['Worker'] for x in b['Records']}
          assert len(aa)==len(bb)==60 and set(aa)==set(bb)
          for k in aa:
            for field in ('SourceSHA256','FitSHA256','TruthSHA256','PredictionSHA256',
                          'EvaluatedCells','CorrectCells','UnseenCells','CorrectUnseen',
                          'NeighborMessageReads','LogicalBytes','FitStateCount','HeldoutStateCount'):
              assert aa[k][field]==bb[k][field],(k,field)
          x=json.loads((p/'acc46-original-u24-ubuntu-latest'/'acc46-36.json').read_text())
          y=json.loads((p/'acc46-original-u24-windows-latest'/'acc46-36.json').read_text())
          assert x['rows']==y['rows'] and len(x['rows'])==36
          print('ACC46_U24_CROSSOS_SOURCE_FIT_TRUTH_PREDICTIONS_60_OF_60_PASS')
          print('ACC46_LINUX='+a['Classification'])
          print('ACC46_WINDOWS='+b['Classification'])
          passed=all(z['Classification']=='U24_RESTRICTED_NATIVE_GO_ENGINEERING_POSITIVE_ONLY' for z in (a,b))
          print('ACC46_ORIGINAL_U24_GENERAL_GO_ACCELERATION='+('YES' if passed else 'NO'))
          print('ACC46_NATIVE_MODEL_ACCELERATION=UNVERIFIED')
          PY
