name: FORGE R30 R31 frozen source and permission qualification
on:
  push:
    branches: [engineering/r30-r31-bounded-autocycle-r1]
    paths:
      - 'research/r30-wingless/**'
      - 'research/r31-wingless/**'
      - 'research/r30-r31/**'
      - '.github/workflows/forge-r30-source.yml'
      - '.github/workflows/forge-r30-capped-cycle.yml'
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  source-review:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen science, negative controls, permission preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/r30-r31 -p 'test_*.py' -v
          python -B -m py_compile research/r30-wingless/execute.py research/r30-wingless/review.py research/r31-wingless/execute.py research/r31-wingless/review.py research/r30-r31/*.py
          test "$(git rev-parse HEAD:research/r30-wingless/prereg.json)" = 835def227a9db297424509bbe44d1d5eaec2a6c5
          test "$(git rev-parse HEAD:research/r31-wingless/prereg.json)" = 70ff7d722f0e3814e9fba777bdfa1a4134eaf59d
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/6158093960" --jq .user.login | grep -Fx spoonman136668-ai
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=1" --jq .total_count | grep -E '^[0-9]+$'
          echo 'R30_R31_CAPPED_SOURCE_QUALIFIED=PASS'
          echo 'R30_R31_SCIENTIFIC_ORIGINALS_STARTED=0'
