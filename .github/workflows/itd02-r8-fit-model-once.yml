name: ITD02 R8 one-time FIT model preservation
on:
  push:
    branches: [research/itd02-r8-bridge-sourceonly-20261026]
    paths:
      - '.github/workflows/itd02-r8-fit-model-once.yml'
permissions:
  contents: read
concurrency:
  group: itd02-r8-fit-model-preservation-once
  cancel-in-progress: false
jobs:
  fit-model-preservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact FIT model export candidate
        uses: actions/checkout@v4
        with:
          ref: 0040d48293f67c5e81ed34a872cf8100e249241a
          persist-credentials: false
      - name: Verify model preservation source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0040d48293f67c5e81ed34a872cf8100e249241a
          test -f research/lcrm01/itd02_r8_frozen_original_minigrid_01.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exporter fail-closed fixtures without consuming original worlds
        shell: bash
        run: |
          PYTHONPATH=research/lcrm01 python -B -m unittest research.lcrm01.test_itd02_r8_fit_model_export -v
      - name: Execute frozen original-world FIT and export exact learned model
        shell: bash
        run: bash research/lcrm01/itd02_r8_fit_only_ci.sh
      - name: Retain both model and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itd02-r8-fit-model-preservation
          path: |
            ${{ runner.temp }}/itd02-r8-fit/fit-receipt.json
            ${{ runner.temp }}/itd02-r8-fit/fitted-sixfield-model.json
          if-no-files-found: warn
          retention-days: 45
