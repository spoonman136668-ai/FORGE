name: Mass K5C authentic concurrent episodic memory interference
on:
  push:
    branches: [research/mass-lcrm01-k5c-concurrent-memory-20261024]
permissions:
  contents: read
jobs:
  physical-parallel-original-memory-worlds:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 16
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticated frozen original physical multiworld recall and strong controls
        run: bash research/lcrm01/k5c_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-k5c-original-concurrent-memory-and-ablation
          path: |
            ${{ runner.temp }}/k5c/process-a.json
            ${{ runner.temp }}/k5c/process-b.json
            ${{ runner.temp }}/k5c/comparison.json
            ${{ runner.temp }}/k5c/process-a.log
            ${{ runner.temp }}/k5c/process-b.log
          if-no-files-found: warn
          retention-days: 90
