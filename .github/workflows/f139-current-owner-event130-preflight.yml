name: F139 exact owner recovery preflight event130
on:
  push:
    branches: [operations/f139-58dc-event130-recovery-20261023]
permissions:
  contents: read
concurrency:
  group: f139-original-owner-cutover
  cancel-in-progress: false
jobs:
  current-owner-preflight:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Original F139 identity, task, DB, source and negative custody read only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:OPENAI_API_KEY){
            throw 'F139_PRECHECK_UNQUALIFIED_RUNNER'
          }
          $expectedSource='58dc4cc483349249c98f1620b51b843b9e927468'
          $oldSource='9047b840b1e33f15a8a9da9670a8ca0bcf7169d7'
          $expectedHead='388de03a55a2020dca352a9b3aefd75424eb2349a6dd33fa745a5f09927853a5'
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if(@($task.Actions).Count -ne 1 -or $task.State -ne 'Running'){throw 'F139_TASK_NOT_RUNNING'}
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $owner=[string]$task.Principal.UserId
          $sid=if($owner -match '^S-1-'){$owner}else{
            (New-Object Security.Principal.NTAccount($owner)).Translate(
              [Security.Principal.SecurityIdentifier]).Value
          }
          if($sid -cne $identity.User.Value){throw 'F139_ORIGINAL_OWNER_SID_DRIFT'}
          $opts=[string]$task.Actions[0].Arguments
          function Opt([string]$name){
            $m=[regex]::Match($opts,'(?i)(?:^|\s)-'+$name+'\s+"([^"]+)"')
            if(-not $m.Success){throw ('F139_ORIGINAL_TASK_MISSING_'+$name)}
            return $m.Groups[1].Value
          }
          $root=Opt 'RepositoryRoot';$db=Opt 'Database';$python=Opt 'PythonExe'
          if([IO.Path]::GetFileName((Opt 'File')) -cne 'Run-FORGE-F139.ps1'){
            throw 'F139_WRAPPER_DRIFT'
          }
          if([IO.Path]::GetFullPath($db) -ine
              [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'FORGE-F139\state.sqlite'))){
            throw 'F139_ORIGINAL_DB_PATH_DRIFT'
          }
          $head=(& git.exe -C $root rev-parse HEAD|Out-String).Trim()
          $dirty=(& git.exe -C $root status --porcelain --untracked-files=all|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne $expectedSource -or $dirty.Length -ne 0){
            throw 'F139_OWNER_CHECKOUT_UNQUALIFIED'
          }
          $code=@'
          import json,sqlite3,sys
          from pathlib import Path
          p=Path(sys.argv[1]).resolve(strict=True)
          uri=p.as_uri()+'?mode=ro'
          with sqlite3.connect(uri,uri=True,timeout=20) as con:
              con.row_factory=sqlite3.Row
              con.execute('PRAGMA query_only=ON')
              meta=dict(con.execute('SELECT source_sha,head_seq,head_hash,enabled,legacy_suspended FROM meta WHERE id=1').fetchone())
              pending=[dict(x) for x in con.execute("SELECT ticket,stage FROM tasks WHERE stage IN ('READY','START_RISK','WAIT_PROVIDER')")]
              negative=[dict(x) for x in con.execute("SELECT ticket,stage,source_sha,quarantine_reason FROM tasks WHERE stage='QUARANTINED' ORDER BY ticket")]
              allrows=list(con.execute('SELECT stage,COUNT(*) AS n FROM tasks GROUP BY stage'))
              print(json.dumps({'meta':meta,'pending':pending,'negative':negative,'stages':{x['stage']:x['n'] for x in allrows}},sort_keys=True))
          '@
          $raw=(& $python -B -c $code $db | Out-String).Trim()
          if($LASTEXITCODE -ne 0){throw 'F139_ORIGINAL_RO_DB_READ_FAILED'}
          $state=$raw|ConvertFrom-Json
          if($state.meta.source_sha -cne $oldSource -or
            [int]$state.meta.head_seq -ne 130 -or
            $state.meta.head_hash -cne $expectedHead -or
            [int]$state.meta.enabled -ne 1 -or
            [int]$state.meta.legacy_suspended -ne 1 -or
            @($state.pending).Count -ne 0 -or @($state.negative).Count -ne 6){
            throw 'F139_LIVE_EXPECTED_LEDGER_DRIFT'
          }
          $tickets=@($state.negative|ForEach-Object {$_.ticket}|Sort-Object)
          $expected=@('f139-nci04-i696-5662e3586bc9-7bb8f27f',
                      'f139-nci04-i706-09f3d7447900-09dc99f4',
                      'f139-nci04-i768-a42202ef02da-da7c4746',
                      'f139-nci04-i769-a42202ef02da-2512ea2c',
                      'f139-nci04-i813-9047b840b1e3-9dad93e1',
                      'f139-nci04-i814-9047b840b1e3-de06e1ba')|Sort-Object
          if(($tickets -join '|') -cne ($expected -join '|') -or
             @($state.negative|Where-Object {$_.quarantine_reason -cne 'FAILED_OR_CANCELLED_NO_REPLAY'}).Count -ne 0){
            throw 'F139_NEGATIVE_TASK_IDENTITY_DRIFT'
          }
          $children=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
             Where-Object {$_.CommandLine -and $_.CommandLine.Contains('f139.local_controller') -and
                           $_.CommandLine.Contains($db)})
          if($children.Count -ne 1){throw 'F139_ORIGINAL_PROCESS_CARDINALITY_DRIFT'}
          Write-Output 'F139_CURRENT_SOURCE_OWNER_PREFLIGHT=PASS'
          Write-Output 'F139_EVENT130_AND_SIX_NEGATIVES=PASS'
          Write-Output 'F139_NO_PENDING_TASKS=PASS'
          Write-Output 'F139_ORIGINAL_OWNER_PROCESS=1'
          Write-Output 'F139_LIVE_CUTOVER_NOT_EXECUTED=TRUE'
