name: E-D29 official MiniGrid DoorKey research smoke
on:
  push:
    branches: [research/e-research-e1c-advisory-20261029]
    paths:
      - '.github/workflows/e-research-ed29-doorkey-smoke.yml'
      - 'research/e_research/ed28_official_minigrid_doorkey_smoke.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e-research-ed29-doorkey-smoke
  cancel-in-progress: false
jobs:
  source-pinned-doorkey:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded public dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy==1.26.4' 'gymnasium==1.1.1' 'pygame-ce==2.5.3'
      - name: Fetch and authenticate original MiniGrid source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/official"
          git init -q "$RUNNER_TEMP/official/minigrid"
          git -C "$RUNNER_TEMP/official/minigrid" remote add origin https://github.com/Farama-Foundation/Minigrid.git
          git -C "$RUNNER_TEMP/official/minigrid" fetch --no-tags --depth 1 origin 7f5853792ea7f04f75614661006d87fcf949f26d
          git -C "$RUNNER_TEMP/official/minigrid" checkout -q --detach 7f5853792ea7f04f75614661006d87fcf949f26d
          test "$(git -C "$RUNNER_TEMP/official/minigrid" rev-parse HEAD)" = 7f5853792ea7f04f75614661006d87fcf949f26d
          test "$(git -C "$RUNNER_TEMP/official/minigrid" hash-object minigrid/envs/empty.py)" = 8810bb0fa156d18475022edd8859b135ef745a5f
          test "$(git -C "$RUNNER_TEMP/official/minigrid" hash-object minigrid/envs/doorkey.py)" = df5b29ef063be34e6d83b8b478e092c6e3e01512
          python -m pip install --no-deps -e "$RUNNER_TEMP/official/minigrid"
      - name: Execute authentic DoorKey reset step and replay
        shell: bash
        run: |
          set -euo pipefail
          python -B research/e_research/ed28_official_minigrid_doorkey_smoke.py
      - name: Preserve full DoorKey replay traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e-research-ed37-official-doorkey-traces
          path: ${{ runner.temp }}/ed37-doorkey/
          if-no-files-found: warn
          retention-days: 45
