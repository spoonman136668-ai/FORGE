name: CKB-plane R18 current owner task and process audit read only
on:
  push:
    branches: [audit/ckb-r18-current-task-custody-20261022]
    paths: [.github/workflows/ckb-r18-current-task-custody.yml]
permissions:
  contents: read
jobs:
  owner-audit:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    steps:
      - name: Classify the currently scheduled controller launcher and process under elevated owner identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version 3.0
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          $admin=[Security.Principal.WindowsPrincipal]::new($who)
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/audit/ckb-r18-current-task-custody-20261022' -or
             $who.Name -ine 'LINKDEADKB\camar' -or
             !$admin.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'R18_CURRENT_CUSTODY_WRONG_OWNER'
          }
          $old='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-THROUGHPUT-R1P\bin\ckb-plane.exe'
          $r3='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R18-OWNER-STATUS-R3\bin\ckb-plane.exe'
          $r4='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R18-OWNER-STATUS-R4\bin\ckb-plane.exe'
          $task=Get-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction Stop
          $info=Get-ScheduledTaskInfo -TaskName 'CKB-plane Controller' -ErrorAction Stop
          $actions=@($task.Actions)
          $act=@(foreach($a in $actions) {
            $args=[string]$a.Arguments
            $classification=if($args -like '*Start-R1P-Controller.ps1*'){'R1P'}
              elseif($args -like '*Start-R18-Controller.ps1*'){'R18'}
              elseif($args -match '(?i)ckb-plane'){'CKB_OTHER'}
              else{'UNKNOWN'}
            [ordered]@{launcher_class=$classification;exec_basename=Split-Path -Leaf ([string]$a.Execute);
              argument_sha256=([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($args)))).ToLowerInvariant();
              argument_bytes=[Text.Encoding]::UTF8.GetByteCount($args);
              mentions_r1p=$args.Contains('PLANE-THROUGHPUT-R1P');mentions_r3=$args.Contains('PLANE-R18-OWNER-STATUS-R3');
              mentions_r4=$args.Contains('PLANE-R18-OWNER-STATUS-R4')}
          })
          $procs=@(Get-CimInstance Win32_Process -Filter "Name='ckb-plane.exe'" -ErrorAction Stop)
          $class=@(foreach($p in $procs){
            $kind=if([string]$p.ExecutablePath -ieq $old){'R1P'}
              elseif([string]$p.ExecutablePath -ieq $r3){'R18_R3'}
              elseif([string]$p.ExecutablePath -ieq $r4){'R18_R4'}
              elseif($null -eq $p.ExecutablePath){'INVISIBLE'}
              else{'OTHER'}
            $sha=$null
            if($p.ExecutablePath -and (Test-Path -LiteralPath $p.ExecutablePath -PathType Leaf)) {
              $sha=(Get-FileHash -LiteralPath $p.ExecutablePath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            [ordered]@{pid=[int]$p.ProcessId;image_class=$kind;image_sha256=$sha}
          })
          $cfg='C:\Users\camar\GolandProjects\ckb-plane\config\autonomy.yaml'
          $result=[ordered]@{
            schema='ckb-plane.r18.current-owner-task-custody.v1'
            task_state=[string]$task.State
            task_user=[string]$task.Principal.UserId
            runlevel=[string]$task.Principal.RunLevel
            action_count=$actions.Count
            actions=$act
            last_task_result=[int]$info.LastTaskResult
            processes=$class
            config_sha256=(Get-FileHash -LiteralPath $cfg -Algorithm SHA256).Hash.ToLowerInvariant()
            task_mutated=$false
            process_mutated=$false
          }
          $json=$result|ConvertTo-Json -Depth 6 -Compress
          if([Text.Encoding]::UTF8.GetByteCount($json) -gt 4096){throw 'R18_TASK_REPORT_EXCEEDS_BOUND'}
          Write-Host ('R18_CURRENT_CUSTODY='+$json)
          Write-Host 'R18_READONLY_CUSTODY_AUDIT=PASS'
      - name: Verify native R18 status and original data custody in place — no restart
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version 3.0
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
              $env:GITHUB_REF -cne 'refs/heads/audit/ckb-r18-current-task-custody-20261022' -or
              $who.Name -ine 'LINKDEADKB\camar') {throw 'R18_STATUS_WRONG_OWNER'}
          $task=Get-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction Stop
          if ($task.State -ne 'Running' -or
              @($task.Actions).Count -ne 1 -or
              [string]$task.Actions[0].Arguments -notlike '*Start-R18-Controller.ps1*'){
            throw 'R18_ACTIVE_TASK_NO_LONGER_ORIGINAL_R18_LAUNCHER'
          }
          $process=@(Get-CimInstance Win32_Process -Filter "Name='ckb-plane.exe'" -ErrorAction Stop)
          if ($process.Count -ne 1 -or
              [string]::IsNullOrWhiteSpace([string]$process[0].ExecutablePath)) {
            throw 'R18_RUNNING_EXE_NOT_SINGLETON'
          }
          $exe=[string]$process[0].ExecutablePath
          $expected='c4e314e14db5f1890e275439171cb22343581d601ba86a4bedfd2e66efe501e2'
          if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) {
            throw 'R18_ACTIVE_BINARY_IDENTITY_DRIFT'
          }
          $config='C:\Users\camar\GolandProjects\ckb-plane\config\autonomy.yaml'
          if ((Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash.ToLowerInvariant() -cne
              '6ff5310bf343a72c07343874f06ba9060567549d1ddbb8dd5e4c17691201967c') {
            throw 'R18_ACTIVE_CONFIG_IDENTITY_DRIFT'
          }
          $out=Join-Path $env:RUNNER_TEMP ('R18LiveStatus-'+$env:GITHUB_RUN_ID+'.out')
          $err=Join-Path $env:RUNNER_TEMP ('R18LiveStatus-'+$env:GITHUB_RUN_ID+'.err')
          try {
            $client=Start-Process -FilePath $exe -ArgumentList @('controller','status','--config',('"' + $config + '"')) -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError $err -ErrorAction Stop
            if (!$client.WaitForExit(45000)) {
              try {$client.Kill()} catch {}
              throw 'R18_STATUS_CLI_TIMED_OUT'
            }
            if ($client.ExitCode -ne 0) {throw 'R18_STATUS_CLI_FAILED'}
            if ((Get-Item -LiteralPath $out).Length -gt 16777216) {throw 'R18_STATUS_TOO_LARGE'}
            $body=[IO.File]::ReadAllText($out)
            $status=ConvertFrom-Json -InputObject $body -ErrorAction Stop
            $blockers=@($status.blockers | Where-Object {$null -ne $_})
            $post=@(Get-CimInstance Win32_Process -Filter "Name='ckb-plane.exe'" -ErrorAction Stop)
            if ($post.Count -ne 1 -or $post[0].ProcessId -ne $process[0].ProcessId) {
              throw 'R18_RUNTIME_SINGLETON_CHANGED_DURING_READONLY_STATUS'
            }
            $report=[ordered]@{
              schema='ckb-plane.r18.live-posttransition-readonly.v1'
              running_r18_sha256=$expected
              native_cli_exit=0
              status_json_valid=$true
              authority=[string]$status.authority
              generation=[string]$status.generation
              paused=[bool]$status.paused
              controller_status=[string]$status.controller_status
              heartbeat_stale=[bool]$status.heartbeat_stale
              heartbeat_at_present=![string]::IsNullOrWhiteSpace([string]$status.heartbeat_at)
              blocker_count=$blockers.Count
              status_jobs_count=@($status.jobs).Count
              queue_length=@($status.queue).Count
              task_state=[string]$task.State
              active_process_count=$post.Count
              active_process_pid=[int]$post[0].ProcessId
              task_action_modified=$false
              live_controller_restarted=$false
              work_dispatched=$false
              live_database_written_by_audit=$false
            }
            $json=$report|ConvertTo-Json -Compress -Depth 5
            if([Text.Encoding]::UTF8.GetByteCount($json) -gt 4096){throw 'R18_STATUS_REPORT_OVERSIZED'}
            Write-Host ('R18_LIVE_READONLY_POSTTRANSITION='+$json)
            if ([string]$status.authority -cne 'plane' -or
                [string]$status.generation -cne '6' -or
                $status.heartbeat_stale -ne $false -or
                [string]::IsNullOrWhiteSpace([string]$status.heartbeat_at)) {
              throw 'R18_NATIVE_STATUS_AUTHORITY_OR_HEARTBEAT_UNHEALTHY'
            }
            Write-Host 'R18_LIVE_NATIVE_STATUS_AND_SINGLETON=PASS'
          } finally {
            Remove-Item -LiteralPath $out,$err -Force -ErrorAction SilentlyContinue
          }
      - name: Determine existing CKB-plane work dispatch readiness from query-only SQLite
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version 3.0
          $wid=[Security.Principal.WindowsIdentity]::GetCurrent()
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_REF -cne 'refs/heads/audit/ckb-r18-current-task-custody-20261022' -or
             $wid.Name -ine 'LINKDEADKB\camar') {throw 'R18_QUEUE_READONLY_WRONG_OWNER'}
          $db='C:\Users\camar\GolandProjects\ckb-plane\state\autonomy.db'
          if(!(Test-Path -LiteralPath $db -PathType Leaf)){throw 'R18_QUEUE_STATE_MISSING'}
          $py=(Get-Command python.exe -ErrorAction Stop).Source
          $temp=Join-Path $env:RUNNER_TEMP ('R18-Queue-ReadOnly-'+$env:GITHUB_RUN_ID+'.py')
          if(Test-Path -LiteralPath $temp){throw 'R18_QUEUE_TEMP_ALREADY_EXISTS'}
          $program=@'
          import sqlite3,json,sys
          from pathlib import Path
          path=Path(sys.argv[1]).resolve(strict=True)
          db=sqlite3.connect("file:"+path.as_posix()+"?mode=ro",uri=True,timeout=3)
          try:
           db.execute("PRAGMA query_only=ON")
           tables={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
           required={"work_orders","queue_items","worker_leases","settings"}
           if not required.issubset(tables):raise RuntimeError("R18_QUEUE_REQUIRED_TABLE_MISSING")
           q=dict(db.execute("SELECT state,count(*) FROM queue_items GROUP BY state ORDER BY state"))
           w=dict(db.execute("SELECT state,count(*) FROM work_orders GROUP BY state ORDER BY state"))
           leases=db.execute("SELECT count(*) FROM worker_leases").fetchone()[0]
           setting=dict(db.execute("SELECT key,value FROM settings WHERE key IN ('paused','autonomy_authority','autonomy_generation')"))
           if sum(q.values())>5000 or sum(w.values())>5000:raise RuntimeError("R18_QUEUE_ROWS_EXCEED_BOUND")
           print("R18_DISPATCH_READINESS="+json.dumps({"queue_states":q,"work_order_states":w,
            "active_leases":leases,"paused":setting.get("paused"),
            "authority":setting.get("autonomy_authority"),
            "generation":setting.get("autonomy_generation"),"query_only":True},separators=(",",":")))
          finally:db.close()
          '@
          [IO.File]::WriteAllText($temp,$program,(New-Object Text.UTF8Encoding($false)))
          try {
            $result=@(& $py -B $temp $db)
            if($LASTEXITCODE -ne 0 -or $result.Count -ne 1 -or
               [string]$result[0] -cnotmatch '^R18_DISPATCH_READINESS=\{') {
              throw 'R18_QUEUE_READONLY_SQL_FAILED'
            }
            if([Text.Encoding]::UTF8.GetByteCount([string]$result[0]) -gt 4096){throw 'R18_QUEUE_RECEIPT_OVERSIZED'}
            Write-Host ([string]$result[0])
          } finally {
            Remove-Item -LiteralPath $temp -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'R18_CKB_QUEUE_INSPECTED_WITHOUT_RESUME=PASS'
      - name: Read-only CKB qualification receipt and authority custody inspection
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version 3.0
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_REF -cne 'refs/heads/audit/ckb-r18-current-task-custody-20261022' -or
             $who.Name -ine 'LINKDEADKB\camar') {throw 'R18_QUAL_CUSTODY_WRONG_OWNER'}
          $db='C:\Users\camar\GolandProjects\ckb-plane\state\autonomy.db'
          $py=(Get-Command python.exe -ErrorAction Stop).Source
          $path=Join-Path $env:RUNNER_TEMP ('r18-qual-custody-'+$env:GITHUB_RUN_ID+'.py')
          if(Test-Path -LiteralPath $path){throw 'R18_QUAL_TEMP_PATH_REUSED'}
          $code=@'
          import json,sqlite3,sys
          from pathlib import Path
          p=Path(sys.argv[1]).resolve(strict=True)
          s=sqlite3.connect('file:'+p.as_posix()+'?mode=ro',uri=True,timeout=3)
          try:
           s.execute('PRAGMA query_only=ON')
           data=dict(s.execute("SELECT key,value FROM settings WHERE key IN ('qualification_digest','qualification_receipt','autonomy_authority','autonomy_generation','paused')"))
           path=data.get('qualification_receipt','')
           receipt=None
           if path and Path(path).is_file():
            if Path(path).stat().st_size > 65536: raise ValueError('R18_QUALIFICATION_RECEIPT_TOO_LARGE')
            receipt=json.loads(Path(path).read_text('utf-8'))
           result={'digest_setting_present':bool(data.get('qualification_digest')),
           'receipt_path_configured':bool(path),'receipt_present':bool(receipt),
           'receipt_passed':receipt.get('passed') if receipt else None,
           'receipt_digest_equals_db':(receipt.get('config_and_tool_digest')==data.get('qualification_digest')) if receipt else None,
           'authority':data.get('autonomy_authority'),
           'generation':data.get('autonomy_generation'),'paused':data.get('paused')}
           print('R18_QUALIFICATION_CUSTODY='+json.dumps(result,separators=(',',':')))
          finally:s.close()
          '@
          [IO.File]::WriteAllText($path,$code,(New-Object Text.UTF8Encoding($false)))
          try{
            $output=@(& $py -B $path $db)
            if($LASTEXITCODE -ne 0 -or $output.Count -ne 1 -or [string]$output[0] -cnotmatch '^R18_QUALIFICATION_CUSTODY=\{'){
              throw 'R18_QUALIFICATION_QUERY_FAILED'
            }
            Write-Host ([string]$output[0])
          } finally {
            Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'R18_QUALIFICATION_READONLY_PROBE=PASS'
