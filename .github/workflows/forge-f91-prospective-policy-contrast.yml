name: FORGE F91 frozen prospective policy outcome contrast qualification
on:
  push:
    branches: [engineering/f91-prospective-optimizer-evidence-review-20261016-r1]
    paths:
      - 'optimizerstages/f91_*'
      - 'optimizerstages/f90_signed_policy_observation.go'
      - '.github/workflows/forge-f91-prospective-policy-contrast.yml'
  pull_request:
    branches: [main]
    paths:
      - 'optimizerstages/f91_*'
      - 'optimizerstages/f90_signed_policy_observation.go'
      - '.github/workflows/forge-f91-prospective-policy-contrast.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: forge-f91-optimizer-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-only-evidence-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Re-read authentic protected FORGE F90 original source qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api --method GET repos/spoonman136668-ai/FORGE/actions/runs/38960496153 > "$RUNNER_TEMP/f91-f90-run.json"
          python3 - "$RUNNER_TEMP/f91-f90-run.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["id"]==38960496153
          assert r["repository"]["full_name"]=="spoonman136668-ai/FORGE"
          assert r["head_sha"]=="5c65ff5727fdcfedcc4f6f37bfbd2cf126a2c660"
          assert r["name"]=="FORGE F90 signed policy outcome source consistency"
          assert r["status"]=="completed" and r["conclusion"]=="success"
          print("F91_REAL_FORGE_F90_SOURCE_CI=PASS")
          print("F91_INDEPENDENT_PROSPECTIVE_EXPERIMENTS_VERIFIED=ZERO")
          PY
      - name: Conditional statistics and adversarial owner/provenance controls
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -run '^(TestF89|TestF90|TestF91)' ./optimizerstages -v
          go vet ./optimizerstages
          echo 'F91_FROZEN_SIX_ARM_DIAGNOSTICS=SOURCE_ONLY'
          echo 'F91_REAL_PREOUTCOME_OWNER_WITNESS=NOT_ESTABLISHED'
          echo 'F91_INDEPENDENT_CAUSAL_GAIN=NOT_ESTABLISHED'
          echo 'F91_DREAM_PARETO_PROMOTION=DENIED'
          echo 'F91_THETAEVOLVE_ACCEPTED_TRAINING=DENIED'
          echo 'F91_SCIENTIFIC_DISPATCH=ZERO'
          echo 'F91_CLOUDFLARE_WRITES=ZERO'
      - name: Full FORGE Go regression, vet and build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo 'F91_PROSPECTIVE_CONTRAST_SOURCE_QUALIFICATION=PASS'
