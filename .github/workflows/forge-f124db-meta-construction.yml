name: F124-DB sourcefree learned multi-task causal-program constructor
on:
  push:
    branches: [research/f124db-meta-compositional-constructor-20261019]
    paths: [.github/workflows/forge-f124db-meta-construction.yml]
permissions:
  contents: read
concurrency:
  group: f124db-original-meta-constructor-one-sourcefree-study
  cancel-in-progress: false
jobs:
  original-frozen-meta-qualification:
    name: sourcefree-meta-qualification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned recurrent strong-control dependency
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check numpy==2.3.5
          if ($LASTEXITCODE -ne 0) { throw 'DB_PINNED_NUMPY_MISSING' }
      - name: Verify original BEFORE-SOURCE preregistration and unchanged qualified upstream
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'DB_EXACT_GITHUB_SOURCE_SHA_DRIFT' }
          & git merge-base --is-ancestor e1bd4ac16bb44749be57b9265523be5387a6dc82 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'DB_PREREG_NOT_BEFORE_NEW_STRUCTURE' }
          & git merge-base --is-ancestor 2aad2f400ce4a1df468e66feedb3ba759d48dda6 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'DB_F124DA_ARCHIVED_EVIDENCE_ANCESTRY_MISSING' }
          $f=Get-Content -Raw research/north-star-transfer/f124db-frozen-meta-construction.json | ConvertFrom-Json
          if ($f.schema -cne 'mass.f124db.sourcefree-compositional-constructor-prereg.v1') { throw 'DB_FROZEN_HYPOTHESIS_CHANGED' }
          if (!$f.safeguards.old_science_924_through_937_untouched -or $f.safeguards.new_firstuse_consumed -ne 0 -or $f.safeguards.science_accepted -or $f.safeguards.automatic_merge) { throw 'DB_PROTECTED_SCIENCE_SAFETY_BOUNDARY' }
          foreach ($p in @(@('research/north-star-transfer/f124cz_shared_quadratic_model.py','4f1f4d85eaa8a7785048116486debb09b3a83d67'),@('research/north-star-transfer/f124ct_gated_sequence_control.py','3ef0cc31ce78eee8a5a1bbde71c31b8364108325'))) {
            $actual=(& git rev-parse "HEAD:$($p[0])").Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -cne $p[1]) { throw "DB_EXISTING_STRONG_CONTROL_MUTATED:$($p[0])" }
          }
          Write-Host 'F124DB_META_TRAINING_FREEZE_BEFORE_SOURCE=PASS'
      - name: Meta-train original and independent peer and verify wholly new structural holdouts
        shell: pwsh
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          $ErrorActionPreference='Stop'
          python -B research/north-star-transfer/test_f124db_meta_composition.py -v
          if ($LASTEXITCODE -ne 0) { throw 'DB_SOURCEFREE_COMPOSITION_OR_STRONG_PEER_FAIL' }
          Write-Host 'F124DB_REUSABLE_CAUSAL_OPERATORS_AND_EQUAL_META_PEER=PASS'
  original-hosted-compositional-measurement:
    name: original-hosted-compositional-measurement (${{ matrix.family }}, ${{ matrix.first_seed }})
    needs: original-frozen-meta-qualification
    strategy:
      fail-fast: false
      matrix:
        family: [nested-additive-new-graph, nested-xor-new-graph]
        first_seed: [61, 63]
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned CPU-only strong control
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Run all forty complete Linux OS child-process measurements without scientific source birth
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -B research/north-star-transfer/f124db_whole_os_shard.py \
            --family "${{ matrix.family }}" \
            --first-seed "${{ matrix.first_seed }}" \
            --out "$RUNNER_TEMP/f124db-original-40"
      - name: Retain complete native process evidence for fixed original case roster
        uses: actions/upload-artifact@v4
        with:
          name: f124db-original-sourcefree-${{ matrix.family }}-${{ matrix.first_seed }}
          path: ${{ runner.temp }}/f124db-original-40/shard-*.json
          retention-days: 90
          if-no-files-found: error
  independent-complete-review:
    name: independent-complete-review
    needs: original-hosted-compositional-measurement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read ONLY original complete native process receipt artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: f124db-original-sourcefree-*
          path: ${{ runner.temp }}/f124db-all-original
          merge-multiple: true
      - name: Verify all 160 original independently measured OS processes without rerunning models
        shell: bash
        run: |
          set -euo pipefail
          python -B research/north-star-transfer/f124db_readonly_audit.py \
            --shards "$RUNNER_TEMP/f124db-all-original" \
            --out "$RUNNER_TEMP/f124db-original-review"
      - name: Retain complete sourcefree original evidence and safe summary
        uses: actions/upload-artifact@v4
        with:
          name: f124db-complete-original-160-OS-operator-construction
          path: ${{ runner.temp }}/f124db-original-review/
          retention-days: 90
          if-no-files-found: error
