name: F124-AQ authenticated TRAIN-only scientific screening
on:
  push:
    branches: [research/f124aq-sparse-compositional-and-local-contrast-20261018]
    paths: ['.github/workflows/forge-f124aq-train.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: f124aq-train-first
  cancel-in-progress: false
jobs:
  train-only:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39078269441
          github-token: ${{ github.token }}
          name: f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d
          path: original-o
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39082424955
          github-token: ${{ github.token }}
          name: f124t-source-verified-fresh-development-01560f7f4f1aab5737cfd045dffd7faaccfb0608
          path: original-t
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39118489510
          github-token: ${{ github.token }}
          name: f124an-calibrated-source-isolation-ca46eba41179a1c6d9cd0bfa74119782c6d11d88
          path: original-an
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39122374949
          github-token: ${{ github.token }}
          name: f124ao-first-dev-evidence-a0d15c8cf307a9c7972728899b525f79717049c7
          path: original-ao
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39123857883
          github-token: ${{ github.token }}
          name: f124ap-authentic-train-only-c5330bbff435febe198c55e9da19beb17bc613d8
          path: original-ap
      - name: Verify exact source receipts and train without DEV
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' \
            '025c97abc8eb69079d7d7d0f59bfdb81235b9ad9ab83e230f32b542d2cfbdb5d  original-o/f124o-independent-two-learned-development.json' \
            'a2f7b3641c2f84f684372918849170c97912c7a104fa4dbe264bcbd6d444c2d2  original-t/f124t-fresh-absolute-development.json' \
            '7226e267ac02090069690ebb40e92696a2cba1bd56a567d838fc6e48880cff9c  original-an/f124an-calibrated-affine-wing-isolation.json' \
            '37d61d2130fc73f28fd96d32b85d018dee231c5319dd515b2024132f7855cb52  original-ao/f124ao-first-dev-independent-evidence.json' \
            '56bb2b97a2d0ae5babc0884e55841252ecefd6a11748f33425753e6309ef1417  original-ap/f124ap-authentic-kernel-hop-train.json' | sha256sum --check --strict
          python3 -B nativeevidence/f124aq_train_selection.py \
            --o original-o/f124o-independent-two-learned-development.json \
            --t original-t/f124t-fresh-absolute-development.json \
            --an original-an/f124an-calibrated-affine-wing-isolation.json \
            --ao original-ao/f124ao-first-dev-independent-evidence.json \
            --ap original-ap/f124ap-authentic-kernel-hop-train.json \
            --output "$RUNNER_TEMP/f124aq-train.json"
          python3 -B -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["schema"]=="forge.research.f124aq.authentic-new-train-compositional-v1" and r["freeze_blob"]=="e0a29f6062c45646eb72a31d06be961a7262f1e1"; assert len(r["TRAIN_grids"]["Yggdrasil"])==18 and len(r["TRAIN_grids"]["Wingless"])==7; assert r["DEV_cases_generated"]==0 and not r["DEV_consumed"] and not r["science_accepted"] and not r["optimizer_promotion"]' "$RUNNER_TEMP/f124aq-train.json"
          sha256sum "$RUNNER_TEMP/f124aq-train.json" > "$RUNNER_TEMP/f124aq-train.json.sha256"
          echo 'F124AQ_DEV_FIRST_USE=false'
      - uses: actions/upload-artifact@v4
        with:
          name: f124aq-train-${{ github.sha }}
          path: |
            ${{ runner.temp }}/f124aq-train.json
            ${{ runner.temp }}/f124aq-train.json.sha256
          if-no-files-found: error
          retention-days: 90
