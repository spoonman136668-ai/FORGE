name: K-Terminal original historical reconciliation observation
on:
  push:
    branches: [diagnostics/kterminal-original-local-preflight-20261019]
    paths: [.github/workflows/kt-original-history-reconciliation-observe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    steps:
      - name: Inspect sanitized reconciliation phases and P5 records without launching trading
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:COMPUTERNAME -cne 'LINKDEADKB') { throw 'KTERM_WRONG_RUNNER' }
          Write-Host 'KTERM_RECON_RUNNER=PASS'
          $roots = @(Get-ChildItem -LiteralPath 'C:\Users' -Directory -ErrorAction Stop | ForEach-Object {
            Join-Path $_.FullName 'Downloads\Personal.v1.1.5.-.BTC\Personal'
          } | Where-Object { Test-Path -LiteralPath $_ -PathType Container })
          if ($roots.Count -ne 1) { throw 'KTERM_ORIGINAL_INSTALL_NOT_UNIQUE' }
          $root = $roots[0]
          $engines = @(Get-Process -Name 'K-Terminal-Engine' -ErrorAction SilentlyContinue)
          $originalEngines = 0
          foreach ($engine in $engines) {
            try {
              if ([string]::Equals([IO.Path]::GetDirectoryName([string]$engine.Path),$root,[StringComparison]::OrdinalIgnoreCase)) { $originalEngines++ }
            } catch { }
          }
          Write-Host ('KTERM_ORIGINAL_ENGINE_RUNNING_COUNT=' + $originalEngines)
          function Write-SafeNumber([string]$Prefix, $Node, [string[]]$Names) {
            if ($null -eq $Node) { return }
            foreach ($key in $Names) {
              $property = $Node.PSObject.Properties[$key]
              if ($null -eq $property -or $null -eq $property.Value) { continue }
              $numeric = 0L
              if ([long]::TryParse([string]$property.Value,[ref]$numeric) -and $numeric -ge 0 -and $numeric -le 864000000) {
                Write-Host ($Prefix + $key.ToUpperInvariant() + '=' + $numeric)
              }
            }
          }
          $p = Join-Path $root 'data\native-runtime\reconciliation-metrics.json'
          if (-not (Test-Path -LiteralPath $p -PathType Leaf)) {
            Write-Host 'KTERM_RECON_METRICS=ABSENT'
          } else {
            $f = [IO.FileInfo]::new($p)
            if ($f.Length -lt 2 -or $f.Length -gt 2097152) { Write-Host 'KTERM_RECON_METRICS=INVALID_SIZE' }
            else {
              Write-Host ('KTERM_RECON_METRICS_AGE_MIN=' + [int][Math]::Max(0,([DateTime]::UtcNow-$f.LastWriteTimeUtc).TotalMinutes))
              try {
                $m = Get-Content -LiteralPath $p -Raw | ConvertFrom-Json -ErrorAction Stop
                Write-SafeNumber 'KTERM_RECON_' $m @('duration_ms','api_requests','pagination_pages','retries','observation_passes','order_reads_reused','local_history_records_parsed','local_history_records_reused','authority_ready_ms','final_identity_ms')
                $stages = $m.PSObject.Properties['stage_ms']
                if ($null -ne $stages -and $null -ne $stages.Value) {
                  Write-SafeNumber 'KTERM_RECON_STAGE_' $stages.Value @('permissions_and_accounts','checkpoint_validation','local_accounting_validation','manager_bootstrap','reconcile_observations','complete')
                }
                $files = $m.PSObject.Properties['local_validation_file_ms']
                if ($null -ne $files -and $null -ne $files.Value) {
                  $entries=0; $total=0L; $largest=0L
                  foreach ($item in $files.Value.PSObject.Properties) {
                    $numeric=0L
                    if ([long]::TryParse([string]$item.Value,[ref]$numeric) -and $numeric -ge 0 -and $numeric -le 864000000) {
                      $entries++; $total+=$numeric
                      if ($numeric -gt $largest) { $largest=$numeric }
                    }
                  }
                  Write-Host ('KTERM_LOCAL_VALIDATION_FILES_TIMED=' + $entries)
                  Write-Host ('KTERM_LOCAL_VALIDATION_SUM_MS=' + $total)
                  Write-Host ('KTERM_LOCAL_VALIDATION_MAX_MS=' + $largest)
                }
                Write-Host 'KTERM_RECON_METRICS=PARSED'
              } catch { Write-Host ('KTERM_RECON_METRICS_ERROR_TYPE=' + $_.Exception.GetType().Name) }
            }
          }
          # P5 records are explicitly whitelisted by the original Go implementation.
          # Parse only their fixed schema and numbers; never print source lines,
          # sensitive exceptions, identities, trace IDs or raw history.
          $logDir = Join-Path $root 'data\logs\debug'
          $records = [Collections.Generic.List[object]]::new()
          if (Test-Path -LiteralPath $logDir -PathType Container) {
            $logs = @(Get-ChildItem -LiteralPath $logDir -Filter 'k-terminal-debug-*.log' -File | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 2)
            foreach ($file in $logs) {
              if ($file.Length -le 0) { continue }
              $stream=$null; $reader=$null
              try {
                $stream=[IO.File]::Open($file.FullName,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::ReadWrite)
                $null=$stream.Seek(-[Math]::Min(2097152L,$stream.Length),[IO.SeekOrigin]::End)
                $reader=[IO.StreamReader]::new($stream)
                $chunk=$reader.ReadToEnd()
                $lines=$chunk -split '\r?\n'
                foreach ($line in $lines) {
                  if ($line -notmatch 'P5_SAFE_LATENCY\s+(\{.*\})') { continue }
                  try {
                    $rec=$Matches[1] | ConvertFrom-Json -ErrorAction Stop
                    if ([string]$rec.operation -notin @('account_reconciliation','local_accounting_validation','historical_pnl')) { continue }
                    $records.Add($rec)
                  } catch { }
                }
              } catch { Write-Host ('KTERM_P5_LOG_SCAN_ERROR_TYPE=' + $_.Exception.GetType().Name) }
              finally {
                if ($null -ne $reader) { $reader.Dispose() }
                elseif ($null -ne $stream) { $stream.Dispose() }
              }
            }
          }
          Write-Host ('KTERM_P5_SAFE_RECORDS_FOUND=' + $records.Count)
          $keep = @($records | Select-Object -Last 12)
          foreach ($rec in $keep) {
            $op = [string]$rec.operation
            Write-Host ('KTERM_P5_OPERATION=' + $op)
            Write-Host ('KTERM_P5_SUCCESS=' + ([bool]$rec.success))
            Write-SafeNumber 'KTERM_P5_' $rec @('total_ms')
            $stages=$rec.PSObject.Properties['stages_ms']
            if ($null -ne $stages -and $null -ne $stages.Value) {
              Write-SafeNumber 'KTERM_P5_STAGE_' $stages.Value @('permissions_and_accounts','checkpoint_validation','local_accounting_validation','manager_bootstrap','reconcile_observations','local_inspect','order_scope_validation','read_saved_order_proofs','historical_opening_anchor','historical_cache','historical_transaction_pages','historical_order_scope','historical_closing_anchor','historical_replay','historical_persist')
            }
            $buckets=$rec.PSObject.Properties['record_count_buckets']
            if ($null -ne $buckets -and $null -ne $buckets.Value) {
              Write-SafeNumber 'KTERM_P5_BUCKET_' $buckets.Value @('historical_cached_records_bucket','historical_result_records_bucket')
            }
          }
          Write-Host 'KTERM_NO_ACCOUNT_OR_HISTORY_CONTENT_EXPORTED=TRUE'
          Write-Host 'KTERM_NO_PROGRAM_STARTED_OR_DATA_MODIFIED=TRUE'
          Write-Host 'KTERM_ORIGINAL_RECON_OBSERVATION=COMPLETE'
