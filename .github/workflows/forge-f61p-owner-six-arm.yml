name: FORGE F61P six-arm prospective owner selection preparation
on:
  push:
    branches: [research/f61p-real-owner-six-arm-assignment-20261016-r1]
permissions:
  contents: read
jobs:
  source-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GOFLAGS: "-p=2"
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Exact frozen F60 parent and unchanged Dream/Pareto code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor d398da31c4b619ea06bcdffb33d75c42f1ff1749 HEAD
          test "$(git hash-object dreamrsi/replay.go)" = e9317c400df72b7ea45059e9e8d45d9d4f46baa5
          test "$(git hash-object evoportfolio/island_pareto.go)" = c52fbca609f94fa720f78e94d2f5f71bf3eb7b68
          test "$(git hash-object optimizerbridge/selection_audit.go)" = 48810d9935b0cfd119991b22300cbaa783bd9adb
          go test -count=1 -run '^TestF61P' -v ./optimizerbridge
      - name: Fair source assignment and disallowed research first-use verification
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./optimizerbridge ./dreamrsi ./evoportfolio
          echo F61P_SIX_ARMS_EXACT_PROBABILITY=1/6
          echo F61P_RANDOM_PROOF=SOURCE_ONLY_EXTERNAL_AUDIT_REQUIRED
          echo F61P_EXISTING_OWNER_FIRST_USE=NOT_EXECUTED
          echo F61P_REAL_PROSPECTIVE_SCIENCE_GAIN=NOT_DEMONSTRATED
      - name: One full FORGE regression vet and build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo F61P_FULL_FORGE_REGRESSION=PASS
