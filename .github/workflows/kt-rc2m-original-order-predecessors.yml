name: K-Terminal RC2-M original-order predecessor isolation
on:
  push:
    branches: [diagnostics/kterminal-original-local-preflight-20261019]
    paths: [.github/workflows/kt-rc2m-original-order-predecessors.yml]
permissions:
  contents: read
concurrency:
  group: kterm-rc2m-original-order-20261020
  cancel-in-progress: false
jobs:
  original-go-registration-order:
    runs-on: windows-latest
    timeout-minutes: 28
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOFLAGS: '-p=1'
      GOMAXPROCS: '2'
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
    steps:
      - name: Checkout FORGE diagnostic tooling (not application)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout frozen K-Terminal original
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: eb5d225ae73b698a59c68d840daf1ec678e1a0ec
          path: kt-original
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Checkout exact draft PR73 only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: b8c2052d530cdff93462dfccc21b28f3824e5531
          path: kt-candidate
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Pin Go 1.26.5 on Windows
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify exact checkout custody, no real broker secrets, PAPER-only test mode
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/FORGE
          test "$GITHUB_REF" = refs/heads/diagnostics/kterminal-original-local-preflight-20261019
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Windows
          test "$(git -C kt-original rev-parse HEAD)" = eb5d225ae73b698a59c68d840daf1ec678e1a0ec
          test "$(git -C kt-candidate rev-parse HEAD)" = b8c2052d530cdff93462dfccc21b28f3824e5531
          test -z "$(git -C kt-original status --porcelain)"
          test -z "$(git -C kt-candidate status --porcelain)"
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          go version | grep -F 'go1.26.5 windows/amd64'
          for k in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET; do
            test -z "${!k:-}"
          done
          echo KTERM_RC2M_ISOLATED_SOURCE=PASS
          echo KTERM_RC2M_BROKER=NONE
      - name: Recover original Go registration order and compare immediate predecessors
        shell: bash
        run: |
          set -euo pipefail
          python -B qualification/kterminal/rc2m_predecessor_windows.py \
            kt-original kt-candidate "$RUNNER_TEMP/kterm-rc2m-case-evidence"
          echo KTERM_RC2M_PRODUCTION_ORDER_LOGIC=UNMODIFIED
          echo KTERM_RC2M_ORIGINAL_TWO_SECOND_RETRY_DEADLINE=UNMODIFIED
          echo KTERM_RC2M_FULL_REGRESSION=NOT_SUBSTITUTED
      - name: Preserve redacted exact-order source and fail/pass findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kterm-rc2m-predecessor-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/kterm-rc2m-case-evidence/rc2m-redacted.json
          retention-days: 20
          if-no-files-found: warn
