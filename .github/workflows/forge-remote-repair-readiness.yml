name: FORGE isolated remote repair readiness
on:
  push:
    branches: [proposal/forge-remote-repair-r1]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pull-requests: read
jobs:
  ready:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Confirm dedicated runner and subscription Codex
        shell: pwsh
        env:
          CODEX_HOME: C:\ProgramData\CKBR\codex\home
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OPENAI_API_KEY) { throw 'API_BILLING_PROHIBITED' }
          if ($env:RUNNER_NAME -ne 'FORGE-CODEX-REMOTE') { throw 'WRONG_RUNNER_IDENTITY' }
          $cmd = Get-Command codex -ErrorAction Stop
          $loginStatus = (& $cmd.Source login status 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'SUBSCRIPTION_AUTH_MISSING' }
          if ($loginStatus -notmatch '(?i)logged in using chatgpt') {
              throw 'SUBSCRIPTION_ONLY_LOGIN_REQUIRED'
          }
          Write-Output 'FORGE_ISOLATED_CODEX_READY=PASS'
      - name: Confirm source-only authority boundary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $prs = & gh api "repos/$repo/pulls?state=open&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'PR_DISCOVERY_FAILED' }
          $eligible = @($prs | Where-Object {
              $_.draft -eq $false -and
              $_.user.login -eq 'spoonman136668-ai' -and
              $_.head.repo.full_name -eq $repo -and
              $_.head.ref -match '^proposal/fsa'
          })
          Write-Output "FSA_SOURCE_PROPOSALS_OBSERVED=$($eligible.Count)"
          Write-Output 'REMOTE_REPAIR_EXECUTION=NOT_AUTHORIZED_BY_READINESS_CHECK'
          Write-Output 'AUTO_MERGE=DISABLED'
          Write-Output 'SCIENCE_ACTIVATION=DISABLED'
      - name: D2S read-only Cloudflare archive schema introspection
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops(f139): inspect D2S actual historic D1 schema without record bytes'
        shell: pwsh
        env:
          F139_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          F139_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or $env:RUNNER_OS -cne 'Windows'){throw 'D2S_WRONG_OWNER_RUNNER'}
          $m=(& gh api -X GET repos/spoonman136668-ai/FORGE/branches/main)|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $m.protected -ne $true -or $m.commit.sha -cne '34ca99c1b5b063225566082aee5aa180a15d093b'){throw 'D2S_SOURCE_IDENTITY_DRIFT'}
          $t=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if($t.State -ne 'Running' -or $t.Principal.LogonType -cne 'Interactive'){throw 'D2S_OWNER_NOT_RUNNING'}
          $owner=([Security.Principal.NTAccount]::new([string]$t.Principal.UserId)).Translate([Security.Principal.SecurityIdentifier])
          if($owner.Value -cne [Security.Principal.WindowsIdentity]::GetCurrent().User.Value){throw 'D2S_WRONG_WINDOWS_OWNER'}
          if([string]::IsNullOrWhiteSpace($env:F139_CF_TOKEN) -or $env:F139_CF_ACCOUNT -notmatch '^[a-f0-9]{32}$'){throw 'D2S_PROVIDER_BINDING_ABSENT'}
          $base='https://api.cloudflare.com/client/v4/accounts/'+$env:F139_CF_ACCOUNT
          $headers=@{Authorization=('Bearer '+$env:F139_CF_TOKEN);Accept='application/json'}
          $dbs=Invoke-RestMethod -Uri ($base+'/d1/database?page=1&per_page=100') -Headers $headers -Method Get -TimeoutSec 30
          if($dbs.success -ne $true -or $dbs.result_info.total_count -gt 100 -or @($dbs.result).Count -ne $dbs.result_info.total_count){throw 'D2S_INCOMPLETE_D1_LIST'}
          $found=@($dbs.result | Where-Object{$_.name -match '(?i)forge'})
          if($found.Count -ne 1 -or [string]$found[0].uuid -notmatch '^[a-f0-9-]{36}$'){throw 'D2S_FORGE_D1_AMBIGUOUS'}
          $dbid=[string]$found[0].uuid
          function OnlySelect([string]$sql){
            if($sql -notmatch '^(?i)SELECT ' -or $sql -match '(?i)\b(INSERT|DELETE|UPDATE|DROP|ALTER|CREATE|REPLACE|PRAGMA|ATTACH|DETACH)\b'){throw 'D2S_NON_SELECT_REJECTED'}
            $body=@{sql=$sql;params=@()}|ConvertTo-Json -Compress
            $reply=Invoke-RestMethod -Uri ($base+'/d1/database/'+$dbid+'/query') -Headers $headers -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 30
            if($reply.success -ne $true -or @($reply.result).Count -ne 1 -or $reply.result[0].success -ne $true){throw 'D2S_QUERY_FAILED'}
            if($reply.result[0].meta.changes -ne 0 -or $reply.result[0].meta.rows_written -ne 0){throw 'D2S_UNEXPECTED_SQL_WRITES'}
            return @($reply.result[0].results)
          }
          foreach($table in @('forge_research_originals','forge_research_seals','forge_research_chunks')){
            $sql="SELECT name, type, pk FROM pragma_table_info('$table') ORDER BY cid LIMIT 20"
            $cols=@(OnlySelect $sql)
            if($cols.Count -lt 2 -or $cols.Count -ge 20){throw ('D2S_SCHEMA_ABSENT_OR_TOO_LARGE_'+$table)}
            $names=@($cols|ForEach-Object{[string]$_.name})
            if(@($names|Select-Object -Unique).Count -ne $cols.Count){throw 'D2S_DUPLICATED_COLUMN_METADATA'}
            Write-Output ('F139_D2S_TABLE='+$table)
            Write-Output ('F139_D2S_COLUMN_NAMES='+($names -join ','))
            Write-Output ('F139_D2S_COLUMN_TYPES='+(@($cols|ForEach-Object{[string]$_.type}) -join ','))
          }
          Write-Output 'F139_D2S_HISTORICAL_CONTENT_BYTES=NOT_READ'
          Write-Output 'F139_D2S_PROVIDER_SQL_CHANGES=0'
          Write-Output 'F139_D2S_FSA_AUTHORITY=UNVERIFIED'
          Write-Output 'F139_D2S_SCIENTIFIC_FIRST_USE=BLOCKED'
          Write-Output 'F139_D2S_DISPOSITION=SCHEMA_STRUCTURE_ONLY_NO_SCIENCE'
      - name: D2S bounded historical seal and chunk relational verification
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops(f139): qualify D2S historical archive relationships without raw bytes'
        shell: pwsh
        env:
          F139_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          F139_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'D2S_WRONG_OWNER_RUNNER'}
          if([string]::IsNullOrWhiteSpace($env:F139_CF_TOKEN) -or $env:F139_CF_ACCOUNT -notmatch '^[a-f0-9]{32}$'){throw 'D2S_PROVIDER_BINDING_INVALID'}
          $branch=(& gh api -X GET repos/spoonman136668-ai/FORGE/branches/main)|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $branch.commit.sha -cne '34ca99c1b5b063225566082aee5aa180a15d093b' -or !$branch.protected){throw 'D2S_MAIN_DRIFT'}
          $t=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if($t.State -ne 'Running'){throw 'D2S_OWNER_CONTROLLER_STOPPED'}
          $base='https://api.cloudflare.com/client/v4/accounts/'+$env:F139_CF_ACCOUNT
          $header=@{Authorization=('Bearer '+$env:F139_CF_TOKEN);Accept='application/json'}
          $items=Invoke-RestMethod -Uri ($base+'/d1/database?page=1&per_page=100') -Headers $header -Method Get -TimeoutSec 30
          if($items.success -ne $true -or $items.result_info.total_count -gt 100 -or @($items.result).Count -ne $items.result_info.total_count){throw 'D2S_DATABASE_PAGINATION_DRIFT'}
          $db=@($items.result|Where-Object{$_.name -match '(?i)forge'})
          if($db.Count -ne 1){throw 'D2S_DATABASE_IDENTITY_AMBIGUOUS'}
          $sql=@'
          SELECT
          (SELECT COUNT(*) FROM forge_research_originals) AS n_originals,
          (SELECT COUNT(*) FROM forge_research_seals) AS n_seals,
          (SELECT COUNT(*) FROM forge_research_chunks) AS n_chunks,
          (SELECT COUNT(*) FROM forge_research_originals o LEFT JOIN forge_research_seals s ON o.archive_sha256=s.archive_sha256
            WHERE s.archive_sha256 IS NULL OR LENGTH(o.archive_sha256)!=64 OR LENGTH(o.source_sha)!=40 OR LENGTH(o.frozen_manifest_sha256)!=64
            OR o.chunk_count<1 OR o.original_length<1 OR o.run_id<1 OR o.artifact_id<1
            OR s.declared_restored_sha256!=o.archive_sha256 OR s.declared_restored_length!=o.original_length
            OR LENGTH(s.seal_receipt_sha256)!=64) AS broken_origins,
          (SELECT COUNT(*) FROM forge_research_seals s LEFT JOIN forge_research_originals o ON o.archive_sha256=s.archive_sha256
            WHERE o.archive_sha256 IS NULL) AS orphan_seals,
          (SELECT COUNT(*) FROM forge_research_chunks c LEFT JOIN forge_research_originals o ON o.archive_sha256=c.archive_sha256
            WHERE o.archive_sha256 IS NULL) AS orphan_chunks,
          (SELECT COUNT(*) FROM forge_research_originals o WHERE
            o.chunk_count!=(SELECT COUNT(*) FROM forge_research_chunks c WHERE c.archive_sha256=o.archive_sha256)
            OR o.original_length!=COALESCE((SELECT SUM(LENGTH(c.chunk_bytes)) FROM forge_research_chunks c WHERE c.archive_sha256=o.archive_sha256),0)
            OR (SELECT MIN(c.chunk_index) FROM forge_research_chunks c WHERE c.archive_sha256=o.archive_sha256)!=0
            OR (SELECT MAX(c.chunk_index) FROM forge_research_chunks c WHERE c.archive_sha256=o.archive_sha256)!=(o.chunk_count-1)) AS broken_chunk_layout,
          (SELECT COUNT(*) FROM forge_research_chunks c WHERE LENGTH(c.chunk_sha256)!=64 OR LENGTH(c.chunk_bytes)<1
            OR c.chunk_index<0 OR LENGTH(c.archive_sha256)!=64) AS broken_chunk_metadata
          '@
          $sql=$sql.Trim()
          if(!$sql.StartsWith('SELECT') -or $sql -match '(?i)\b(INSERT|UPDATE|DELETE|DROP|ALTER|CREATE|REPLACE|ATTACH|DETACH)\b'){throw 'D2S_NONREADONLY_SQL'}
          $payload=@{sql=$sql;params=@()}|ConvertTo-Json -Compress
          $r=Invoke-RestMethod -Uri ($base+'/d1/database/'+$db[0].uuid+'/query') -Method Post -Headers $header -ContentType 'application/json' -Body $payload -TimeoutSec 30
          if($r.success -ne $true -or @($r.result).Count -ne 1 -or $r.result[0].success -ne $true -or
             $r.result[0].meta.changes -ne 0 -or $r.result[0].meta.rows_written -ne 0){throw 'D2S_RELATIONAL_QUERY_NOT_AUTHENTIC_READONLY'}
          $rows=@($r.result[0].results)
          if($rows.Count -ne 1){throw 'D2S_INCOMPLETE_RELATIONAL_RESULT'}
          $a=$rows[0]
          if($a.n_originals -ne 6 -or $a.n_seals -ne 6 -or $a.n_chunks -ne 7){throw 'D2S_HISTORICAL_COUNT_CHANGED'}
          Write-Output ('F139_D2S_RELATIONAL_BROKEN_ORIGINS='+$a.broken_origins)
          Write-Output ('F139_D2S_RELATIONAL_ORPHAN_SEALS='+$a.orphan_seals)
          Write-Output ('F139_D2S_RELATIONAL_ORPHAN_CHUNKS='+$a.orphan_chunks)
          Write-Output ('F139_D2S_RELATIONAL_BAD_CHUNK_LAYOUT='+$a.broken_chunk_layout)
          Write-Output ('F139_D2S_RELATIONAL_BAD_CHUNK_METADATA='+$a.broken_chunk_metadata)
          if($a.broken_origins -ne 0 -or $a.orphan_seals -ne 0 -or $a.orphan_chunks -ne 0 -or
             $a.broken_chunk_layout -ne 0 -or $a.broken_chunk_metadata -ne 0){throw 'D2S_LIVE_ARCHIVE_RELATIONSHIP_INCONSISTENT'}
          Write-Output 'F139_D2S_SIX_ORIGINALS_SIX_SEALS_SEVEN_CHUNKS=RELATIONALLY_CONSISTENT'
          Write-Output 'F139_D2S_RAW_ORIGINAL_BYTES=NOT_RETURNED'
          Write-Output 'F139_D2S_CRYPTOGRAPHIC_CHUNK_DIGESTS=NOT_YET_RECOMPUTED'
          Write-Output 'F139_D2S_INDEPENDENT_FSA_SIGNER=NOT_VERIFIED'
          Write-Output 'F139_D2S_SQL_MUTATIONS=ZERO'
          Write-Output 'F139_D2S_FIRST_USE=BLOCKED'
          Write-Output 'F139_D2S_DISPOSITION=LIVE_ARCHIVE_RELATIONAL_CUSTODY_PASS_ONLY'
      - name: D2S bounded cryptographic rehash of already-consumed archival chunks
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops(f139): rehash D2S consumed D1 chunks in memory with strict size caps'
        shell: pwsh
        env:
          F139_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          F139_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or $env:RUNNER_OS -cne 'Windows'){throw 'D2S_WRONG_RUNNER'}
          $protected=(& gh api -X GET repos/spoonman136668-ai/FORGE/branches/main)|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $protected.commit.sha -cne '34ca99c1b5b063225566082aee5aa180a15d093b' -or !$protected.protected){throw 'D2S_MAIN_SOURCE_CHANGED'}
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if($task.State -ne 'Running'){throw 'D2S_CONTROLLER_NOT_RUNNING'}
          $owner=([Security.Principal.NTAccount]::new([string]$task.Principal.UserId)).Translate([Security.Principal.SecurityIdentifier])
          if($owner.Value -cne [Security.Principal.WindowsIdentity]::GetCurrent().User.Value){throw 'D2S_OWNER_MISMATCH'}
          if([string]::IsNullOrWhiteSpace($env:F139_CF_TOKEN) -or $env:F139_CF_ACCOUNT -notmatch '^[a-f0-9]{32}$'){throw 'D2S_D1_CREDENTIAL_BINDING_DRIFT'}
          $root='https://api.cloudflare.com/client/v4/accounts/'+$env:F139_CF_ACCOUNT
          $headers=@{Authorization=('Bearer '+$env:F139_CF_TOKEN);Accept='application/json'}
          $listing=Invoke-RestMethod -Method Get -Uri ($root+'/d1/database?page=1&per_page=100') -Headers $headers -TimeoutSec 25
          if($listing.success -ne $true -or @($listing.result).Count -ne $listing.result_info.total_count -or $listing.result_info.total_count -gt 100){throw 'D2S_D1_LIST_INCOMPLETE'}
          $target=@($listing.result|Where-Object{$_.name -match '(?i)forge'})
          if($target.Count -ne 1){throw 'D2S_FORGE_D1_NOT_UNIQUE'}
          $dbid=[string]$target[0].uuid
          function QueryFixed([string]$sql){
            if(!$sql.StartsWith('SELECT ') -or $sql -match '(?i)\b(UPDATE|DELETE|INSERT|DROP|ALTER|CREATE|ATTACH|DETACH|REPLACE)\b'){throw 'D2S_MUTATING_QUERY_REJECTED'}
            $body=@{sql=$sql;params=@()}|ConvertTo-Json -Compress
            $r=Invoke-RestMethod -Method Post -Uri ($root+'/d1/database/'+$dbid+'/query') -Headers $headers -ContentType 'application/json' -Body $body -TimeoutSec 60
            if($r.success -ne $true -or @($r.result).Count -ne 1 -or $r.result[0].success -ne $true -or $r.result[0].meta.changes -ne 0 -or $r.result[0].meta.rows_written -ne 0){throw 'D2S_QUERY_OR_READONLY_PROOF_FAILED'}
            return @($r.result[0].results)
          }
          $s=@(QueryFixed 'SELECT COUNT(*) AS count_chunks, COALESCE(MAX(LENGTH(chunk_bytes)),0) AS maximum_chunk_bytes, COALESCE(SUM(LENGTH(chunk_bytes)),0) AS total_chunk_bytes FROM forge_research_chunks')
          if($s.Count -ne 1 -or $s[0].count_chunks -ne 7){throw 'D2S_CHUNK_COUNT_CHANGED'}
          $max=[long]$s[0].maximum_chunk_bytes
          $total=[long]$s[0].total_chunk_bytes
          Write-Output ('F139_D2S_LARGEST_ARCHIVED_CHUNK_BYTES='+$max)
          Write-Output ('F139_D2S_TOTAL_ARCHIVED_CHUNK_BYTES='+$total)
          if($max -gt 2097152 -or $total -gt 8388608 -or $max -le 0 -or $total -le 0){throw 'D2S_UNBOUNDED_OR_EMPTY_ARCHIVE_NO_BYTES_FETCHED'}
          $origins=@(QueryFixed 'SELECT archive_sha256, original_length, chunk_count FROM forge_research_originals ORDER BY archive_sha256 LIMIT 7')
          if($origins.Count -ne 6){throw 'D2S_ORIGINAL_COUNT_CHANGED'}
          # Raw prior-consumed archive bytes are transient in this owner-runner process.
          # Never print, persist, upload, or include them in an exception message.
          $chunks=@(QueryFixed 'SELECT archive_sha256, chunk_index, chunk_sha256, HEX(chunk_bytes) AS private_hex FROM forge_research_chunks ORDER BY archive_sha256, chunk_index LIMIT 8')
          if($chunks.Count -ne 7){throw 'D2S_CHUNK_PROVIDER_ROWS_CHANGED'}
          $rehashed=0
          foreach($original in $origins){
            $part=@($chunks | Where-Object{$_.archive_sha256 -ceq $original.archive_sha256} | Sort-Object -Property chunk_index)
            if($part.Count -ne [int]$original.chunk_count){throw 'D2S_ARCHIVE_CHUNK_COUNT_CHANGED'}
            $mem=[IO.MemoryStream]::new()
            try{
              $i=0
              foreach($item in $part){
                if($item.chunk_index -ne $i){throw 'D2S_CHUNK_SEQUENCE_INVALID'}
                $hex=[string]$item.private_hex
                if($hex.Length -gt 4194304 -or $hex.Length%2 -ne 0){throw 'D2S_PRIVATE_BYTES_CAP_INVALID'}
                $bytes=[Convert]::FromHexString($hex)
                $hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
                if($hash -cne [string]$item.chunk_sha256){throw 'D2S_CHUNK_SHA256_MISMATCH'}
                $mem.Write($bytes,0,$bytes.Length)
                $rehashed++;$i++
              }
              if($mem.Length -ne [long]$original.original_length){throw 'D2S_ARCHIVED_LENGTH_INVALID'}
              $full=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($mem.ToArray())).ToLowerInvariant()
              if($full -cne [string]$original.archive_sha256){throw 'D2S_ORIGINAL_SHA256_MISMATCH'}
            }finally{$mem.Dispose()}
          }
          if($rehashed -ne 7){throw 'D2S_NOT_ALL_CHUNKS_VERIFIED'}
          Write-Output 'F139_D2S_CHUNK_SHA256_RECOMPUTED=7_OF_7_PASS'
          Write-Output 'F139_D2S_REASSEMBLED_ARCHIVE_SHA256=6_OF_6_PASS'
          Write-Output 'F139_D2S_SEAL_RECEIPT_SIGNATURES=NOT_YET_INDEPENDENTLY_VERIFIED'
          Write-Output 'F139_D2S_RAW_ARCHIVE_CONTENT_LOGGED=FALSE'
          Write-Output 'F139_D2S_ORIGINALS_EXPORTED=FALSE'
          Write-Output 'F139_D2S_SQL_WRITES=ZERO'
          Write-Output 'F139_D2S_SCIENTIFIC_FIRST_USE=BLOCKED'
          Write-Output 'F139_D2S_DISPOSITION=CRYPTOGRAPHIC_PROVIDER_BYTES_ACCEPTED_NO_FSA_PERMISSION'
      - name: D2T six-origin provider metadata readback
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops(f139): inspect D2T historical provider provenance without original downloads'
        shell: pwsh
        env:
          F139_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          F139_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:RUNNER_OS -cne 'Windows' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'D2T_WRONG_WORKSTATION_RUNNER'}
          $protected=(& gh api -X GET repos/spoonman136668-ai/FORGE/branches/main)|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $protected.protected -ne $true -or $protected.commit.sha -cne '34ca99c1b5b063225566082aee5aa180a15d093b'){throw 'D2T_PROTECTED_MAIN_IDENTITY_DRIFT'}
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if($task.State -ne 'Running' -or $task.Principal.LogonType -cne 'Interactive'){throw 'D2T_OWNER_CONTROLLER_NOT_RUNNING'}
          $owner=([Security.Principal.NTAccount]::new([string]$task.Principal.UserId)).Translate([Security.Principal.SecurityIdentifier])
          if($owner.Value -cne [Security.Principal.WindowsIdentity]::GetCurrent().User.Value){throw 'D2T_WRONG_WINDOWS_OWNER'}
          if([string]::IsNullOrWhiteSpace($env:F139_CF_TOKEN) -or $env:F139_CF_ACCOUNT -notmatch '^[a-f0-9]{32}$'){throw 'D2T_PROVIDER_BINDING_INVALID'}
          $base='https://api.cloudflare.com/client/v4/accounts/'+$env:F139_CF_ACCOUNT
          $headers=@{Authorization=('Bearer '+$env:F139_CF_TOKEN);Accept='application/json'}
          $dbs=Invoke-RestMethod -Uri ($base+'/d1/database?page=1&per_page=100') -Headers $headers -Method Get -TimeoutSec 30
          if($dbs.success -ne $true -or $dbs.result_info.total_count -gt 100 -or @($dbs.result).Count -ne $dbs.result_info.total_count){throw 'D2T_D1_LIST_INCOMPLETE'}
          $found=@($dbs.result|Where-Object{$_.name -match '(?i)forge'})
          if($found.Count -ne 1){throw 'D2T_DATABASE_NOT_UNIQUE'}
          $sql=@'
          SELECT o.archive_sha256,o.lane,o.repository,o.run_id,o.artifact_id,o.source_sha,o.original_length,o.chunk_count,
                 o.scientific_state,s.seal_receipt_sha256
          FROM forge_research_originals o INNER JOIN forge_research_seals s ON s.archive_sha256=o.archive_sha256
          ORDER BY o.archive_sha256 LIMIT 7
          '@
          $sql=$sql.Trim()
          if(!$sql.StartsWith('SELECT ') -or $sql -match '(?i)\b(INSERT|DELETE|UPDATE|DROP|ALTER|CREATE|ATTACH|DETACH)\b'){throw 'D2T_NOT_READONLY_SQL'}
          $body=@{sql=$sql;params=@()}|ConvertTo-Json -Compress
          $reply=Invoke-RestMethod -Method Post -Uri ($base+'/d1/database/'+$found[0].uuid+'/query') -Headers $headers -ContentType 'application/json' -Body $body -TimeoutSec 30
          if($reply.success -ne $true -or @($reply.result).Count -ne 1 -or $reply.result[0].success -ne $true -or
            $reply.result[0].meta.changes -ne 0 -or $reply.result[0].meta.rows_written -ne 0){throw 'D2T_D1_METADATA_NOT_READONLY'}
          $rows=@($reply.result[0].results)
          if($rows.Count -ne 6){throw 'D2T_ORIGINAL_COUNT_DRIFT'}
          $available=0;$unavailable=0;$mismatch=0;$sealed=0;$repoTypes=@{}
          foreach($row in $rows){
            if([string]$row.archive_sha256 -cnotmatch '^[a-f0-9]{64}$' -or [string]$row.seal_receipt_sha256 -cnotmatch '^[a-f0-9]{64}$' -or
               [string]$row.source_sha -cnotmatch '^[a-f0-9]{40}$' -or [long]$row.run_id -le 0 -or [long]$row.artifact_id -le 0 -or
               [long]$row.original_length -le 0 -or [int]$row.chunk_count -le 0){throw 'D2T_D1_ORIGINAL_METADATA_INVALID'}
            $sealed++
            # Do not contact any nonapproved repository or unrelated system.
            $rp=[string]$row.repository
            if($rp -cnotmatch '^spoonman136668-ai/(Wingless|Yggdrasil)$'){throw 'D2T_UNAPPROVED_SOURCE_REPOSITORY'}
            $repoTypes[$rp]=1
            $providerRun=$null;$providerArtifact=$null
            $prev=$ErrorActionPreference
            try{
              $ErrorActionPreference='Continue'
              $runRaw=@(& gh api -X GET ('repos/'+$rp+'/actions/runs/'+[string]$row.run_id) 2>$null)
              $runRc=$LASTEXITCODE
              $artRaw=@(& gh api -X GET ('repos/'+$rp+'/actions/artifacts/'+[string]$row.artifact_id) 2>$null)
              $artRc=$LASTEXITCODE
            }finally{$ErrorActionPreference=$prev}
            if($runRc -ne 0 -or $artRc -ne 0){$unavailable++;continue}
            try{
              $providerRun=($runRaw -join [Environment]::NewLine)|ConvertFrom-Json
              $providerArtifact=($artRaw -join [Environment]::NewLine)|ConvertFrom-Json
            }catch{throw 'D2T_PROVIDER_METADATA_PARSING_REJECTED'}
            if($providerRun.id -ne $row.run_id -or $providerRun.head_sha -cne [string]$row.source_sha -or
              $providerRun.repository.full_name -cne $rp -or
              $providerArtifact.id -ne $row.artifact_id -or $providerArtifact.workflow_run.id -ne $row.run_id){
              $mismatch++;continue
            }
            $available++
          }
          Write-Output ('F139_D2T_HISTORIC_SEAL_DIGEST_RECORDS='+$sealed)
          Write-Output ('F139_D2T_ARCHIVE_PROVIDER_SOURCE_REPOSITORIES='+$repoTypes.Count)
          Write-Output ('F139_D2T_PROVIDER_RUN_AND_ARTIFACT_METADATA_MATCHED='+$available)
          Write-Output ('F139_D2T_PROVIDER_RUN_OR_ARTIFACT_NOT_READABLE='+$unavailable)
          Write-Output ('F139_D2T_PROVIDER_PROVENANCE_MISMATCHES='+$mismatch)
          if($mismatch -ne 0){throw 'D2T_INDEPENDENT_PROVIDER_SOURCE_IDENTITY_MISMATCH'}
          Write-Output 'F139_D2T_ORIGINAL_CONTENT_BYTES=NOT_FETCHED'
          Write-Output 'F139_D2T_SEAL_SIGNATURES=NOT_VERIFIED_BY_DIGEST_METADATA'
          Write-Output 'F139_D2T_PROVIDER_SQL_MUTATIONS=ZERO'
          Write-Output 'F139_D2T_INDEPENDENT_FSA_WITNESS=NOT_ATTESTED'
          Write-Output 'F139_D2T_SCIENTIFIC_FIRST_USE=BLOCKED'
          Write-Output 'F139_D2T_DISPOSITION=HISTORIC_PROVIDER_METADATA_READONLY_AUDIT'
