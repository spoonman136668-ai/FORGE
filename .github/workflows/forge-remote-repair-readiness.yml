name: FORGE isolated remote repair readiness
on:
  push:
    branches: [proposal/forge-remote-repair-r1]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pull-requests: read
jobs:
  ready:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Confirm dedicated runner and subscription Codex
        shell: pwsh
        env:
          CODEX_HOME: C:\ProgramData\CKBR\codex\home
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OPENAI_API_KEY) { throw 'API_BILLING_PROHIBITED' }
          if ($env:RUNNER_NAME -ne 'FORGE-CODEX-REMOTE') { throw 'WRONG_RUNNER_IDENTITY' }
          $cmd = Get-Command codex -ErrorAction Stop
          $loginStatus = (& $cmd.Source login status 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'SUBSCRIPTION_AUTH_MISSING' }
          if ($loginStatus -notmatch '(?i)logged in using chatgpt') {
              throw 'SUBSCRIPTION_ONLY_LOGIN_REQUIRED'
          }
          Write-Output 'FORGE_ISOLATED_CODEX_READY=PASS'
      - name: Confirm source-only authority boundary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $prs = & gh api "repos/$repo/pulls?state=open&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'PR_DISCOVERY_FAILED' }
          $eligible = @($prs | Where-Object {
              $_.draft -eq $false -and
              $_.user.login -eq 'spoonman136668-ai' -and
              $_.head.repo.full_name -eq $repo -and
              $_.head.ref -match '^proposal/fsa'
          })
          Write-Output "FSA_SOURCE_PROPOSALS_OBSERVED=$($eligible.Count)"
          Write-Output 'REMOTE_REPAIR_EXECUTION=NOT_AUTHORIZED_BY_READINESS_CHECK'
          Write-Output 'AUTO_MERGE=DISABLED'
          Write-Output 'SCIENCE_ACTIVATION=DISABLED'
      - name: F139 D2N read-only Windows owner and runner boundary
        if: github.event_name == 'push' && github.ref == 'refs/heads/proposal/forge-remote-repair-r1'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
              $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
              $env:RUNNER_OS -cne 'Windows') {
            throw 'F139_D2N_WRONG_ISOLATED_RUNNER'
          }
          $task = Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if ($task.Principal.LogonType -cne 'Interactive' -or
              $task.Principal.RunLevel -cne 'Limited') {
            throw 'F139_D2N_CONTROLLER_OWNER_POLICY_DRIFT'
          }
          if ($task.Principal.UserId -match '^S-1-') {
            $ownerSID = [Security.Principal.SecurityIdentifier]::new($task.Principal.UserId)
          } else {
            $ownerSID = ([Security.Principal.NTAccount]::new(
              [string]$task.Principal.UserId)).Translate(
              [Security.Principal.SecurityIdentifier])
          }
          $runnerSID = [Security.Principal.WindowsIdentity]::GetCurrent().User
          if (-not $ownerSID -or -not $runnerSID) {
            throw 'F139_D2N_WINDOWS_SID_NOT_VERIFIED'
          }
          $sameUser = $ownerSID.Value -ceq $runnerSID.Value
          $profileKey = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\' + $ownerSID.Value
          $profileResolved = Test-Path -LiteralPath $profileKey
          $ownerDbVisible = $false
          if ($profileResolved) {
            $p = [string](Get-ItemProperty -LiteralPath $profileKey -ErrorAction Stop).ProfileImagePath
            if ([IO.Path]::IsPathRooted($p) -and $p -notmatch '%') {
              $ownerDbVisible = Test-Path -LiteralPath (Join-Path $p 'AppData\Local\FORGE-F139\state.sqlite') -PathType Leaf
            }
          }
          Write-Output 'F139_D2N_RUNNER_IDENTITY=FORGE-CODEX-REMOTE'
          Write-Output ('F139_D2N_RUNNER_IS_TASK_OWNER=' + $sameUser.ToString().ToUpperInvariant())
          Write-Output ('F139_D2N_OWNER_PROFILE_RESOLVED=' + $profileResolved.ToString().ToUpperInvariant())
          Write-Output ('F139_D2N_OWNER_DB_PATH_VISIBLE=' + $ownerDbVisible.ToString().ToUpperInvariant())
          Write-Output ('F139_D2N_CONTROLLER_TASK_STATE=' + [string]$task.State)
          Write-Output 'F139_D2N_DATABASE_WRITES=0'
          Write-Output 'F139_D2N_TASK_MUTATIONS=0'
          Write-Output 'F139_D2N_CONTROLLER_DISPATCHES=0'
          Write-Output 'F139_D2N_SCIENTIFIC_FIRST_USE=BLOCKED'
          if (-not $sameUser) {
            Write-Output 'F139_D2N_OWNER_MUTATION_ADMISSIBLE=FALSE'
            Write-Output 'F139_D2N_DISPOSITION=RUNNER_SERVICE_ACCOUNT_NOT_OWNER_NO_TRANSITION'
          } elseif ($task.State -notin @('Ready','Disabled')) {
            Write-Output 'F139_D2N_OWNER_MUTATION_ADMISSIBLE=FALSE'
            Write-Output 'F139_D2N_DISPOSITION=CONTROLLER_NOT_STOPPED_NO_TRANSITION'
          } else {
            Write-Output 'F139_D2N_OWNER_MUTATION_ADMISSIBLE=BOUNDARY_ONLY_FURTHER_CUSTODY_REQUIRED'
            Write-Output 'F139_D2N_DISPOSITION=READ_ONLY_IDENTITY_PREFLIGHT_PASS'
          }
