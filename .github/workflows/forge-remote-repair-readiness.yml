name: FORGE isolated remote repair readiness
on:
  push:
    branches: [proposal/forge-remote-repair-r1]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pull-requests: read
jobs:
  ready:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Confirm dedicated runner and subscription Codex
        shell: pwsh
        env:
          CODEX_HOME: C:\ProgramData\CKBR\codex\home
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OPENAI_API_KEY) { throw 'API_BILLING_PROHIBITED' }
          if ($env:RUNNER_NAME -ne 'FORGE-CODEX-REMOTE') { throw 'WRONG_RUNNER_IDENTITY' }
          $cmd = Get-Command codex -ErrorAction Stop
          $loginStatus = (& $cmd.Source login status 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'SUBSCRIPTION_AUTH_MISSING' }
          if ($loginStatus -notmatch '(?i)logged in using chatgpt') {
              throw 'SUBSCRIPTION_ONLY_LOGIN_REQUIRED'
          }
          Write-Output 'FORGE_ISOLATED_CODEX_READY=PASS'
      - name: Confirm source-only authority boundary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $prs = & gh api "repos/$repo/pulls?state=open&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'PR_DISCOVERY_FAILED' }
          $eligible = @($prs | Where-Object {
              $_.draft -eq $false -and
              $_.user.login -eq 'spoonman136668-ai' -and
              $_.head.repo.full_name -eq $repo -and
              $_.head.ref -match '^proposal/fsa'
          })
          Write-Output "FSA_SOURCE_PROPOSALS_OBSERVED=$($eligible.Count)"
          Write-Output 'REMOTE_REPAIR_EXECUTION=NOT_AUTHORIZED_BY_READINESS_CHECK'
          Write-Output 'AUTO_MERGE=DISABLED'
          Write-Output 'SCIENCE_ACTIVATION=DISABLED'
      - name: Read-only D2Q 29-event head observation
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops(f139): observe D2Q 29-event head and scientific denial'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:RUNNER_OS -cne 'Windows' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE') { throw 'D2Q_WRONG_RUNNER' }
          $t=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if ($t.State -ne 'Running' -or @($t.Actions).Count -ne 1) { throw 'D2Q_OWNER_CONTROLLER_STOPPED' }
          $owner=([Security.Principal.NTAccount]::new([string]$t.Principal.UserId)).Translate([Security.Principal.SecurityIdentifier])
          if ($owner.Value -cne [Security.Principal.WindowsIdentity]::GetCurrent().User.Value) { throw 'D2Q_OWNER_IDENTITY_DRIFT' }
          $a=[string]$t.Actions[0].Arguments
          $fields=@{}
          foreach($name in @('Database','PythonExe','RepositoryRoot')){
            $m=[regex]::Match($a,'(?i)(?:^|\s)-'+$name+'\s+"([^"]+)"')
            if(!$m.Success){throw ('D2Q_TASK_BINDING_MISSING_'+$name)}
            $fields[$name]=$m.Groups[1].Value
          }
          $src=(& git -C $fields.RepositoryRoot rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $src -cne '34ca99c1b5b063225566082aee5aa180a15d093b'){throw 'D2Q_PROTECTED_SOURCE_MISMATCH'}
          $code=@'
          import sys,sqlite3,json,hashlib
          from pathlib import Path
          p=Path(sys.argv[1]); expect=sys.argv[2]
          c=sqlite3.connect(p.as_uri()+"?mode=ro",uri=True,timeout=20)
          c.row_factory=sqlite3.Row
          try:
              c.execute("PRAGMA query_only=ON")
              m=c.execute("SELECT * FROM meta WHERE id=1").fetchone()
              es=list(c.execute("SELECT seq,kind,payload,prior_sha,sha FROM events ORDER BY seq"))
              ts=list(c.execute("SELECT ticket,stage,source_sha,run_id FROM tasks ORDER BY ticket"))
              assert m['source_sha']==expect and m['enabled']==1 and m['legacy_suspended']==1,'SOURCE_OR_ENABLE_DRIFT'
              assert m['head_seq']==29 and len(es)==29 and len(ts)==5,'EVENT_OR_TASK_COUNT_DRIFT'
              assert all(t['stage']=='VERIFIED' and t['run_id'] for t in ts),'UNVERIFIED_TASK'
              prior="0"*64
              for n,e in enumerate(es,1):
                  assert e['seq']==n and e['prior_sha']==prior,'EVENT_SEQUENCE_DRIFT'
                  body=json.loads(e['payload'])
                  assert json.dumps(body,sort_keys=True,separators=(',',':'),ensure_ascii=True)+'\n'==e['payload'],'NONCANONICAL_EVENT'
                  record={'seq':n,'prior_sha':prior,'kind':e['kind'],'payload':body}
                  sha=hashlib.sha256((json.dumps(record,sort_keys=True,separators=(',',':'),ensure_ascii=True)+'\n').encode()).hexdigest()
                  assert sha==e['sha'],'CHAIN_DIGEST_INVALID'
                  if 'scientific_first_use' in body: assert body['scientific_first_use'] is False,'SCIENCE_ORIGINAL_ADMITTED'
                  if n==23: assert sha=='eea95c859f9a59f700612c3b7b39152abc78827981976e9d86567c29fa03ff87','INDEPENDENT_23_SEAL_MISMATCH'
                  if n==24: assert e['kind']=='SOURCE_TRANSITION_ADMITTED' and body['to_source_sha']==expect,'SOURCE_TRANSITION_DRIFT'
                  prior=sha
              assert es[28]['kind']=='PROVIDER_VERIFIED_TERMINAL','FINAL_EVENT_NOT_TERMINAL'
              assert prior==m['head_hash'],'HEAD_NOT_CONSISTENT'
              assert ts[-1]['run_id']==39414572565,'D2P_RUN_ID_DRIFT'
              print('F139_D2Q_EVENT_HEAD_SHA256='+prior)
              print('F139_D2Q_EVIDENCE_EVENT_COUNT=29')
              print('F139_D2Q_HISTORICAL_PREFIX=23_PRESERVED')
              print('F139_D2Q_FINAL_RUN_ID=39414572565')
              print('F139_D2Q_FIRST_USE=BLOCKED')
          finally:c.close()
          '@
          $loc=(Get-Location).Path
          try {
            Set-Location -LiteralPath $fields.RepositoryRoot
            & $fields.PythonExe -B -c $code $fields.Database $src
            if($LASTEXITCODE -ne 0){throw 'D2Q_NATIVE_EVENT_REPLAY_FAILED'}
          } finally {Set-Location -LiteralPath $loc}
          Write-Output 'F139_D2Q_29_EVENT_READONLY_REPLAY=PASS'
      - name: Checkout GitHub-retained D2Q head witness
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'custody(f139): compare D2Q retained GitHub head against owner SQLite'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify independent GitHub retention and unchanged D2Q owner head
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'custody(f139): compare D2Q retained GitHub head against owner SQLite'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='spoonman136668-ai/FORGE'
          $witness='ops/f139/custody/f139-d2q-event29-head-commitment.json'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:RUNNER_OS -cne 'Windows' -or $env:GITHUB_REPOSITORY -cne $repo) {throw 'D2Q_WRONG_RUNNER'}
          $file=Join-Path $env:GITHUB_WORKSPACE $witness
          $blob=(& git rev-parse ('HEAD:'+$witness)).Trim()
          if($LASTEXITCODE -ne 0 -or $blob -cne 'ac1d93b96daa10ba5bd11eaebc8e861d3c0b9ca9'){throw 'D2Q_COMMIT_BLOB_DRIFT'}
          $external=(& gh api -X GET ('repos/'+$repo+'/contents/'+$witness+'?ref=d1d719c42a5edc0fc38a25860c6b03278ea9afa4'))|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $external.sha -cne $blob -or $external.type -cne 'file'){throw 'D2Q_EXTERNAL_GITHUB_WITNESS_INVALID'}
          $w=Get-Content -LiteralPath $file -Raw|ConvertFrom-Json
          if($w.schema -cne 'forge.f139.d2q.external-github-head-commitment.v1' -or
             $w.observed_event_29_sha256 -cne '2648e4164fdfa95044a7280d133b5257d2de20820d2ea9c5cbbccbb752cc7344' -or
             $w.original_first_use_authorized -ne $false -or $w.scientific_execution_authorized -ne $false -or
             $w.d2p_provider_run_id -ne 39414572565){throw 'D2Q_UNQUALIFIED_EXTERNAL_CLAIM'}
          $t=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if($t.State -ne 'Running' -or @($t.Actions).Count -ne 1){throw 'D2Q_CONTROLLER_NOT_RUNNING'}
          $owner=([Security.Principal.NTAccount]::new([string]$t.Principal.UserId)).Translate([Security.Principal.SecurityIdentifier])
          if($owner.Value -cne [Security.Principal.WindowsIdentity]::GetCurrent().User.Value){throw 'D2Q_WRONG_OWNER'}
          $p=@{}
          foreach($n in @('RepositoryRoot','PythonExe','Database')){
            $m=[regex]::Match([string]$t.Actions[0].Arguments,'(?i)(?:^|\s)-'+$n+'\s+"([^"]+)"')
            if(!$m.Success){throw ('D2Q_TASK_'+$n+'_DRIFT')}
            $p[$n]=$m.Groups[1].Value
          }
          $actual=(& git -C $p.RepositoryRoot rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $actual -cne $w.controller_source_sha){throw 'D2Q_INSTALLED_SOURCE_DRIFT'}
          $audit=@'
          import json,hashlib,sqlite3,sys
          from pathlib import Path
          p=Path(sys.argv[1]); target=sys.argv[2]
          c=sqlite3.connect(p.as_uri()+'?mode=ro',uri=True)
          c.row_factory=sqlite3.Row
          try:
              c.execute('PRAGMA query_only=ON')
              meta=c.execute('SELECT * FROM meta WHERE id=1').fetchone()
              events=list(c.execute('SELECT seq,prior_sha,payload,kind,sha FROM events ORDER BY seq'))
              tasks=list(c.execute('SELECT ticket,stage,run_id FROM tasks ORDER BY ticket'))
              assert len(events)==29 and len(tasks)==5 and meta['head_seq']==29,'D2Q_COUNT_DRIFT'
              assert all(t['stage']=='VERIFIED' for t in tasks),'D2Q_PENDING_OR_FAILED_TASK'
              prior='0'*64
              for i,e in enumerate(events,1):
                  assert e['seq']==i and e['prior_sha']==prior,'D2Q_PREDECESSOR_DRIFT'
                  d=json.loads(e['payload'])
                  assert json.dumps(d,sort_keys=True,separators=(',',':'),ensure_ascii=True)+'\n'==e['payload'],'D2Q_NONCANONICAL'
                  raw=json.dumps({'seq':i,'prior_sha':prior,'kind':e['kind'],'payload':d},sort_keys=True,separators=(',',':'),ensure_ascii=True)+'\n'
                  prior=hashlib.sha256(raw.encode()).hexdigest()
                  assert e['sha']==prior,'D2Q_EVENT_HASH_DRIFT'
                  if i==23:assert prior=='eea95c859f9a59f700612c3b7b39152abc78827981976e9d86567c29fa03ff87','D2Q_SEALED_PREFIX_DRIFT'
                  if 'scientific_first_use' in d:assert d['scientific_first_use'] is False,'D2Q_SCIENCE_ADMITTED'
              assert prior==meta['head_hash']==target,'D2Q_EXTERNAL_HEAD_NOT_REPRODUCIBLE'
              assert tasks[-1]['run_id']==39414572565,'D2Q_PROVIDER_RUN_DRIFT'
              print('F139_D2Q_GITHUB_WITNESS_MATCH=PASS')
          finally:c.close()
          '@
          $old=(Get-Location).Path
          try{
            Set-Location -LiteralPath $p.RepositoryRoot
            & $p.PythonExe -B -c $audit $p.Database $w.observed_event_29_sha256
            if($LASTEXITCODE -ne 0){throw 'D2Q_OWNER_READONLY_REPLAY_FAILED'}
          }finally{Set-Location -LiteralPath $old}
          Write-Output 'F139_D2Q_EXTERNAL_GITHUB_COMMIT=VERIFIED'
          Write-Output 'F139_D2Q_FSA_FIRST_USE_PERMISSION=NOT_ESTABLISHED'
          Write-Output 'F139_D2Q_DISPOSITION=EXTERNAL_HEAD_COMMITMENT_ACCEPTED_SCIENCE_BLOCKED'
