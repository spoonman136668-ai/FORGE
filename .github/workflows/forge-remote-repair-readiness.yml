name: FORGE isolated remote repair readiness
on:
  push:
    branches: [proposal/forge-remote-repair-r1]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pull-requests: read
jobs:
  ready:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Confirm dedicated runner and subscription Codex
        shell: pwsh
        env:
          CODEX_HOME: C:\ProgramData\CKBR\codex\home
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OPENAI_API_KEY) { throw 'API_BILLING_PROHIBITED' }
          if ($env:RUNNER_NAME -ne 'FORGE-CODEX-REMOTE') { throw 'WRONG_RUNNER_IDENTITY' }
          $cmd = Get-Command codex -ErrorAction Stop
          $loginStatus = (& $cmd.Source login status 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'SUBSCRIPTION_AUTH_MISSING' }
          if ($loginStatus -notmatch '(?i)logged in using chatgpt') {
              throw 'SUBSCRIPTION_ONLY_LOGIN_REQUIRED'
          }
          Write-Output 'FORGE_ISOLATED_CODEX_READY=PASS'
      - name: Confirm source-only authority boundary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $prs = & gh api "repos/$repo/pulls?state=open&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'PR_DISCOVERY_FAILED' }
          $eligible = @($prs | Where-Object {
              $_.draft -eq $false -and
              $_.user.login -eq 'spoonman136668-ai' -and
              $_.head.repo.full_name -eq $repo -and
              $_.head.ref -match '^proposal/fsa'
          })
          Write-Output "FSA_SOURCE_PROPOSALS_OBSERVED=$($eligible.Count)"
          Write-Output 'REMOTE_REPAIR_EXECUTION=NOT_AUTHORIZED_BY_READINESS_CHECK'
          Write-Output 'AUTO_MERGE=DISABLED'
          Write-Output 'SCIENCE_ACTIVATION=DISABLED'
      - name: F139 D2U read-only seal signer and remote witness assessment
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops(f139): assess D2U seal signer and external witness trust without science'
        shell: pwsh
        env:
          F139_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          F139_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='spoonman136668-ai/FORGE'
          $source='34ca99c1b5b063225566082aee5aa180a15d093b'
          if($env:GITHUB_REPOSITORY -cne $repo -or $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:RUNNER_OS -cne 'Windows'){throw 'D2U_WRONG_OWNER_RUNNER'}
          $m=(& gh api -X GET repos/spoonman136668-ai/FORGE/branches/main)|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $m.commit.sha -cne $source -or $m.protected -ne $true){throw 'D2U_PROTECTED_SOURCE_DRIFT'}
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if($task.State -ne 'Running' -or $task.Principal.LogonType -cne 'Interactive' -or @($task.Actions).Count -ne 1){throw 'D2U_CONTROLLER_OWNER_DRIFT'}
          $owner=([Security.Principal.NTAccount]::new([string]$task.Principal.UserId)).Translate([Security.Principal.SecurityIdentifier])
          if($owner.Value -cne [Security.Principal.WindowsIdentity]::GetCurrent().User.Value){throw 'D2U_WINDOWS_OWNER_MISMATCH'}
          $pins=@{
            owner_key=Join-Path $env:LOCALAPPDATA 'FORGE-FSA\owner-ed25519.dpapi'
            authority_config=Join-Path $env:LOCALAPPDATA 'FORGE-FSA\authority-public-config.json'
            witness_config=Join-Path $env:LOCALAPPDATA 'FORGE-FSA\witness-public-config.json'
            external_probe_config=Join-Path $env:LOCALAPPDATA 'FORGE-FSA\external-trust-probe.json'
          }
          foreach($key in @('owner_key','authority_config','witness_config','external_probe_config')){
            Write-Output ('F139_D2U_'+$key.ToUpperInvariant()+'_FILE_PRESENT='+([bool](Test-Path -LiteralPath $pins[$key] -PathType Leaf)).ToString().ToUpperInvariant())
          }
          $proc=@(Get-CimInstance Win32_Process -ErrorAction Stop|Where-Object{$_.Name -match '^forge-fsa-(authority|witness|probe)(\.exe)?$'})
          Write-Output ('F139_D2U_LOCAL_TRUST_HOST_PROCESSES='+$proc.Count)
          if([string]::IsNullOrWhiteSpace($env:F139_CF_TOKEN) -or $env:F139_CF_ACCOUNT -notmatch '^[a-f0-9]{32}$'){throw 'D2U_EXISTING_PROVIDER_BINDING_NOT_PRESENT'}
          $root='https://api.cloudflare.com/client/v4/accounts/'+$env:F139_CF_ACCOUNT
          $headers=@{Authorization=('Bearer '+$env:F139_CF_TOKEN);Accept='application/json'}
          $dbs=Invoke-RestMethod -Uri ($root+'/d1/database?page=1&per_page=100') -Headers $headers -Method Get -TimeoutSec 30
          if($dbs.success -ne $true -or $null -eq $dbs.result_info -or $dbs.result_info.total_count -gt 100 -or @($dbs.result).Count -ne $dbs.result_info.total_count){throw 'D2U_D1_DATABASE_LIST_NOT_COMPLETE'}
          $match=@($dbs.result|Where-Object{$_.name -match '(?i)forge'})
          if($match.Count -ne 1 -or [string]$match[0].uuid -notmatch '^[a-f0-9-]{36}$'){throw 'D2U_AMBIGUOUS_D1'}
          $sql="SELECT name FROM pragma_table_info('forge_research_seals') ORDER BY cid LIMIT 20"
          $body=@{sql=$sql;params=@()}|ConvertTo-Json -Compress
          $response=Invoke-RestMethod -Uri ($root+'/d1/database/'+$match[0].uuid+'/query') -Headers $headers -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 30
          if($response.success -ne $true -or @($response.result).Count -ne 1 -or $response.result[0].success -ne $true -or
             $response.result[0].meta.changes -ne 0 -or $response.result[0].meta.rows_written -ne 0){throw 'D2U_SEAL_SCHEMA_NOT_READONLY'}
          $names=@($response.result[0].results|ForEach-Object{[string]$_.name})
          $expected=@('archive_sha256','declared_restored_sha256','declared_restored_length','seal_receipt_sha256')
          if($names.Count -ne 4 -or (($names -join ',') -cne ($expected -join ','))){throw 'D2U_SEAL_SCHEMA_DRIFT'}
          Write-Output 'F139_D2U_LIVE_D1_SEAL_SCHEMA=FOUR_DIGEST_AND_LENGTH_FIELDS'
          Write-Output 'F139_D2U_D1_SEAL_SIGNATURE_BYTES_STORED=FALSE'
          $workers=Invoke-RestMethod -Uri ($root+'/workers/scripts') -Headers $headers -Method Get -TimeoutSec 30
          if($workers.success -ne $true -or $null -eq $workers.result){throw 'D2U_WORKER_INVENTORY_UNAVAILABLE'}
          $ws=@($workers.result)
          if($ws.Count -gt 100){throw 'D2U_WORKER_LIST_BOUND_EXCEEDED'}
          $fsaNamed=@($ws|Where-Object{$_.id -match '(?i)(forge|fsa|witness)'})
          Write-Output ('F139_D2U_CLOUDFLARE_WORKER_SCRIPTS_TOTAL='+$ws.Count)
          Write-Output ('F139_D2U_FSA_NAME_CANDIDATE_WORKERS='+$fsaNamed.Count)
          # A script name does not authenticate endpoint URL, signer, physical independence, or witness signature.
          Write-Output 'F139_D2U_ENDPOINT_MTLS_IDENTITY_PIN_VERIFIED=FALSE'
          Write-Output 'F139_D2U_INDEPENDENT_SEAL_RECEIPT_SIGNATURES=NOT_VERIFIED'
          Write-Output 'F139_D2U_SEPARATE_SIGNED_MONOTONIC_FSA_WITNESS=NOT_VERIFIED'
          Write-Output 'F139_D2U_FSA_FIRST_USE_AUTHORITY=BLOCKED'
          Write-Output 'F139_D2U_D1_WRITES=ZERO'
          Write-Output 'F139_D2U_SCIENTIFIC_DISPATCHES=ZERO'
          Write-Output 'F139_D2U_DISPOSITION=SIGNED_SEAL_AND_INDEPENDENT_FSA_WITNESS_NOT_AUTHENTICATED'
