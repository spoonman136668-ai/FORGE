name: FORGE isolated remote repair readiness
on:
  push:
    branches: [proposal/forge-remote-repair-r1, audit/f139-existing-runner-owner-custody-20261021]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pull-requests: read
jobs:
  ready:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Confirm dedicated runner and subscription Codex
        shell: pwsh
        env:
          CODEX_HOME: C:\ProgramData\CKBR\codex\home
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OPENAI_API_KEY) { throw 'API_BILLING_PROHIBITED' }
          if ($env:RUNNER_NAME -ne 'FORGE-CODEX-REMOTE') { throw 'WRONG_RUNNER_IDENTITY' }
          $cmd = Get-Command codex -ErrorAction Stop
          $loginStatus = (& $cmd.Source login status 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'SUBSCRIPTION_AUTH_MISSING' }
          if ($loginStatus -notmatch '(?i)logged in using chatgpt') {
              throw 'SUBSCRIPTION_ONLY_LOGIN_REQUIRED'
          }
          Write-Output 'FORGE_ISOLATED_CODEX_READY=PASS'
      - name: Confirm source-only authority boundary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $prs = & gh api "repos/$repo/pulls?state=open&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'PR_DISCOVERY_FAILED' }
          $eligible = @($prs | Where-Object {
              $_.draft -eq $false -and
              $_.user.login -eq 'spoonman136668-ai' -and
              $_.head.repo.full_name -eq $repo -and
              $_.head.ref -match '^proposal/fsa'
          })
          Write-Output "FSA_SOURCE_PROPOSALS_OBSERVED=$($eligible.Count)"
          Write-Output 'REMOTE_REPAIR_EXECUTION=NOT_AUTHORIZED_BY_READINESS_CHECK'
          Write-Output 'AUTO_MERGE=DISABLED'
          Write-Output 'SCIENCE_ACTIVATION=DISABLED'

  f139-owner-profile-readonly:
    # One source-branch runner qualification on the existing Windows host.
    # No task mutation, original ledger open, DPAPI secret read, controller
    # start, workflow_dispatch, scientific work, or new runner registration.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/audit/f139-existing-runner-owner-custody-20261021' }}
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    steps:
      - name: Check whether this existing runner has authentic F139 owner custody
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OPENAI_API_KEY) { throw 'F139_PAID_API_FORBIDDEN' }
          $current = [Security.Principal.WindowsIdentity]::GetCurrent()
          $task = Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction SilentlyContinue
          if ($null -eq $task) {
            Write-Host 'F139_EXISTING_RUNNER_TASK=NOT_VISIBLE'
            Write-Host 'F139_EXISTING_RUNNER_OWNER_CUTOVER=BLOCKED'
            exit 0
          }
          if (@($task.Actions).Count -ne 1) {
            Write-Host 'F139_EXISTING_RUNNER_TASK_ACTION=INVALID'
            Write-Host 'F139_EXISTING_RUNNER_OWNER_CUTOVER=BLOCKED'
            exit 0
          }
          $principal = [string]$task.Principal.UserId
          $sid = try {
            (New-Object Security.Principal.NTAccount($principal)).Translate(
              [Security.Principal.SecurityIdentifier]).Value
          } catch { '' }
          $sameOwner = ($principal -ieq $current.Name -or $sid -eq $current.User.Value)
          $db = Join-Path $env:LOCALAPPDATA 'FORGE-F139\state.sqlite'
          $key = Join-Path $env:LOCALAPPDATA 'FORGE-F139\worker-hmac.dpapi.xml'
          $raw = [string]$task.Actions[0].Arguments
          $m = [regex]::Match($raw,'(?i)(?:^|\s)-Database\s+"([^"]+)"')
          $dbBound = $m.Success -and (
            [IO.Path]::GetFullPath($m.Groups[1].Value) -ieq
            [IO.Path]::GetFullPath($db))
          Write-Host ('F139_EXISTING_RUNNER_TASK=' + 'VISIBLE')
          Write-Host ('F139_EXISTING_RUNNER_OWNER_SID_MATCH=' +
            [string]$sameOwner.ToString().ToUpperInvariant())
          Write-Host ('F139_EXISTING_RUNNER_ORIGINAL_DB_BINDING=' +
            [string]$dbBound.ToString().ToUpperInvariant())
          Write-Host ('F139_EXISTING_RUNNER_DB_PRESENT=' +
            [string](Test-Path -LiteralPath $db -PathType Leaf).ToString().ToUpperInvariant())
          Write-Host ('F139_EXISTING_RUNNER_DPAPI_FILE_PRESENT=' +
            [string](Test-Path -LiteralPath $key -PathType Leaf).ToString().ToUpperInvariant())
          Write-Host ('F139_EXISTING_RUNNER_TASK_STATE=' + [string]$task.State)
          if ($sameOwner -and $dbBound -and
              (Test-Path -LiteralPath $db -PathType Leaf) -and
              (Test-Path -LiteralPath $key -PathType Leaf)) {
            Write-Host 'F139_EXISTING_RUNNER_OWNER_CUTOVER=ELIGIBLE_FOR_SEPARATE_QUALIFIED_ACTION'
          } else {
            Write-Host 'F139_EXISTING_RUNNER_OWNER_CUTOVER=BLOCKED'
          }
          Write-Host 'F139_EXISTING_RUNNER_READ_ONLY=PASS'
