name: FORGE isolated remote repair readiness
on:
  push:
    branches: [proposal/forge-remote-repair-r1]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pull-requests: read
jobs:
  ready:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Confirm dedicated runner and subscription Codex
        shell: pwsh
        env:
          CODEX_HOME: C:\ProgramData\CKBR\codex\home
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OPENAI_API_KEY) { throw 'API_BILLING_PROHIBITED' }
          if ($env:RUNNER_NAME -ne 'FORGE-CODEX-REMOTE') { throw 'WRONG_RUNNER_IDENTITY' }
          $cmd = Get-Command codex -ErrorAction Stop
          $loginStatus = (& $cmd.Source login status 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'SUBSCRIPTION_AUTH_MISSING' }
          if ($loginStatus -notmatch '(?i)logged in using chatgpt') {
              throw 'SUBSCRIPTION_ONLY_LOGIN_REQUIRED'
          }
          Write-Output 'FORGE_ISOLATED_CODEX_READY=PASS'
      - name: Confirm source-only authority boundary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $prs = & gh api "repos/$repo/pulls?state=open&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'PR_DISCOVERY_FAILED' }
          $eligible = @($prs | Where-Object {
              $_.draft -eq $false -and
              $_.user.login -eq 'spoonman136668-ai' -and
              $_.head.repo.full_name -eq $repo -and
              $_.head.ref -match '^proposal/fsa'
          })
          Write-Output "FSA_SOURCE_PROPOSALS_OBSERVED=$($eligible.Count)"
          Write-Output 'REMOTE_REPAIR_EXECUTION=NOT_AUTHORIZED_BY_READINESS_CHECK'
          Write-Output 'AUTO_MERGE=DISABLED'
          Write-Output 'SCIENCE_ACTIVATION=DISABLED'
      - name: F139 D2R read-only deployed FSA resource inventory
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops(f139): perform D2R read-only provider trust inventory with owner credentials'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:RUNNER_OS -cne 'Windows'){throw 'F139_D2R_WRONG_RUNNER'}
          $main=& gh api -X GET repos/spoonman136668-ai/FORGE/branches/main | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $main.commit.sha -cne '34ca99c1b5b063225566082aee5aa180a15d093b' -or
             $main.protected -ne $true){throw 'F139_D2R_PROTECTED_MAIN_DRIFT'}
          $controller=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if($controller.State -ne 'Running'){throw 'F139_D2R_NATIVE_CONTROLLER_NOT_RUNNING'}
          $owner=([Security.Principal.NTAccount]::new([string]$controller.Principal.UserId)).Translate([Security.Principal.SecurityIdentifier])
          if($owner.Value -cne [Security.Principal.WindowsIdentity]::GetCurrent().User.Value){throw 'F139_D2R_NOT_CONTROLLER_OWNER'}
          Write-Output 'F139_D2R_CONTROLLER_OWNER_AND_SOURCE=PASS'
          $names=@('CLOUDFLARE_API_TOKEN','CF_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','CF_ACCOUNT_ID','CLOUDFLARE_D1_DATABASE_ID','FSA_D1_DATABASE_ID','FORGE_FSA_AUTHORITY_URL','FORGE_FSA_WITNESS_URL')
          $present=@($names|Where-Object {-not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))})
          Write-Output ('F139_D2R_INHERITED_PROVIDER_CREDENTIAL_FIELDS_PRESENT_COUNT='+$present.Count)
          $githubNames=@(); $githubMetadataAvailable=$false
          try{
            $saved=$ErrorActionPreference
            try{
              $ErrorActionPreference='Continue'
              $metaRaw=@(& gh api -X GET 'repos/spoonman136668-ai/FORGE/actions/secrets?per_page=100' 2>&1)
              $rc=$LASTEXITCODE
            }finally{$ErrorActionPreference=$saved}
            if($rc -eq 0){
              $meta=($metaRaw -join [Environment]::NewLine)|ConvertFrom-Json
              if($meta.total_count -le 100 -and @($meta.secrets).Count -eq $meta.total_count){
                $githubNames=@($meta.secrets|ForEach-Object{[string]$_.name})
                $githubMetadataAvailable=$true
              }
            }
          }catch{}
          Write-Output ('F139_D2R_GITHUB_SECRET_METADATA_READABLE='+$githubMetadataAvailable.ToString().ToUpperInvariant())
          if($githubMetadataAvailable){
            $matching=@($githubNames|Where-Object{$_ -match '^(CF_|CLOUDFLARE_|FORGE_FSA_)'})
            Write-Output ('F139_D2R_REPOSITORY_PROVIDER_SECRET_NAME_COUNT='+$matching.Count)
          }
          $possible=@(
            (Join-Path $env:LOCALAPPDATA 'FORGE-FSA\owner-ed25519.dpapi'),
            (Join-Path $env:LOCALAPPDATA 'FORGE-FSA\authority-public-config.json'),
            (Join-Path $env:LOCALAPPDATA 'FORGE-FSA\witness-public-config.json')
          )
          Write-Output ('F139_D2R_OWNER_KEY_FILE_PRESENT='+([bool](Test-Path -LiteralPath $possible[0] -PathType Leaf)).ToString().ToUpperInvariant())
          Write-Output ('F139_D2R_AUTHORITY_CONFIG_FILE_PRESENT='+([bool](Test-Path -LiteralPath $possible[1] -PathType Leaf)).ToString().ToUpperInvariant())
          Write-Output ('F139_D2R_WITNESS_CONFIG_FILE_PRESENT='+([bool](Test-Path -LiteralPath $possible[2] -PathType Leaf)).ToString().ToUpperInvariant())
          $fsaProcesses=@(Get-CimInstance Win32_Process -ErrorAction Stop |
            Where-Object{$_.Name -match '^forge-fsa-(authority|witness)(\.exe)?$'})
          Write-Output ('F139_D2R_LOCAL_FSA_HOST_PROCESSES='+$fsaProcesses.Count)
          Write-Output 'F139_D2R_D1_ARCHIVE_READBACK=NOT_RUN_WITHOUT_PROVEN_PROVIDER_BINDING'
          Write-Output 'F139_D2R_INDEPENDENT_WITNESS_SIGNATURE=NOT_ATTESTED'
          Write-Output 'F139_D2R_SCIENTIFIC_FIRST_USE=BLOCKED'
          Write-Output 'F139_D2R_DISPOSITION=READONLY_RESOURCE_DISCOVERY_ONLY'
          exit 0
      - name: F139 D2R identify provider secret names without exposing values
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops(f139): identify D2R provider secret bindings read only'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){throw 'D2R_WRONG_RUNNER'}
          $meta=(& gh api -X GET 'repos/spoonman136668-ai/FORGE/actions/secrets?per_page=100')|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $meta.total_count -gt 100 -or @($meta.secrets).Count -ne $meta.total_count){throw 'D2R_SECRET_NAMES_INCOMPLETE'}
          $names=@($meta.secrets|ForEach-Object{[string]$_.name})
          foreach($name in @('CLOUDFLARE_API_TOKEN','CF_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','CF_ACCOUNT_ID','CLOUDFLARE_D1_DATABASE_ID','CF_D1_DATABASE_ID','FORGE_CF_API_TOKEN','FORGE_CLOUDFLARE_API_TOKEN')){
            $found=$names -ccontains $name
            Write-Output ('F139_D2R_SECRET_NAME_'+$name+'='+$found.ToString().ToUpperInvariant())
          }
          Write-Output 'F139_D2R_SECRET_VALUES_ACCESSED=FALSE'
          Write-Output 'F139_D2R_PROVIDER_MUTATIONS=ZERO'
      - name: F139 D2R Cloudflare provider GET-only attestation
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops(f139): inspect existing D2R Cloudflare D1 and Worker metadata read only'
        shell: pwsh
        env:
          F139_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          F139_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'D2R_WRONG_RUNNER'}
          if([string]::IsNullOrWhiteSpace($env:F139_CF_TOKEN) -or $env:F139_CF_ACCOUNT -notmatch '^[a-f0-9]{32}$'){
            throw 'D2R_EXISTING_PROVIDER_SECRET_BINDING_UNAVAILABLE'
          }
          $headers=@{Authorization=('Bearer '+$env:F139_CF_TOKEN);Accept='application/json'}
          $base='https://api.cloudflare.com/client/v4'
          function CFGet([string]$path){
            try {
              $r=Invoke-RestMethod -Uri ($base+'/'+$path) -Method Get -Headers $headers -TimeoutSec 30
              if($r.success -ne $true){return $null}
              return $r
            }catch{return $null}
          }
          $verify=CFGet 'user/tokens/verify'
          if($null -eq $verify -or $verify.result.status -cne 'active'){throw 'D2R_PROVIDER_TOKEN_NOT_VERIFIED'}
          Write-Output 'F139_D2R_CLOUDFLARE_PROVIDER_TOKEN=ACTIVE'
          $dbs=CFGet ('accounts/'+$env:F139_CF_ACCOUNT+'/d1/database?page=1&per_page=100')
          if($null -eq $dbs){Write-Output 'F139_D2R_D1_LIST=DENIED_OR_UNAVAILABLE'}
          else {
            $items=@($dbs.result)
            $info=$dbs.result_info
            if($null -eq $info -or $info.total_count -gt 100 -or $items.Count -ne $info.total_count){throw 'D2R_D1_INVENTORY_PAGINATION_UNVERIFIED'}
            $matches=@($items|Where-Object {$_.name -match '(?i)forge'})
            Write-Output 'F139_D2R_D1_LIST=AUTHENTICATED_GET'
            Write-Output ('F139_D2R_D1_DATABASE_COUNT='+$items.Count)
            Write-Output ('F139_D2R_FORGE_NAMED_D1_COUNT='+$matches.Count)
            if($matches.Count -eq 1){
              $one=$matches[0]
              $detail=CFGet ('accounts/'+$env:F139_CF_ACCOUNT+'/d1/database/'+$one.uuid)
              if($null -ne $detail -and $detail.result.uuid -ceq $one.uuid){
                Write-Output 'F139_D2R_UNIQUE_FORGE_D1_IDENTITY=PROVIDER_GET_MATCH'
                $mark=CFGet ('accounts/'+$env:F139_CF_ACCOUNT+'/d1/database/'+$one.uuid+'/time_travel/bookmark')
                Write-Output ('F139_D2R_D1_TIMETRAVEL_BOOKMARK_METADATA='+(('PRESENT','UNAVAILABLE')[[int]($null -eq $mark)]))
              }else{Write-Output 'F139_D2R_UNIQUE_FORGE_D1_IDENTITY=NOT_VERIFIED'}
            }
          }
          $scripts=CFGet ('accounts/'+$env:F139_CF_ACCOUNT+'/workers/scripts')
          if($null -eq $scripts){Write-Output 'F139_D2R_WORKER_SCRIPTS=DENIED_OR_UNAVAILABLE'}
          else{
            $s=@($scripts.result)
            $fsa=@($s|Where-Object{($_.id -match '(?i)(forge|fsa)')})
            Write-Output 'F139_D2R_WORKER_SCRIPTS=AUTHENTICATED_GET'
            Write-Output ('F139_D2R_FORGE_FSA_NAMED_WORKER_COUNT='+$fsa.Count)
          }
          Write-Output 'F139_D2R_PROVIDER_HTTP_METHODS=GET_ONLY'
          Write-Output 'F139_D2R_SQL_MUTATIONS=ZERO'
          Write-Output 'F139_D2R_FSA_INDEPENDENT_SIGNER_OR_WITNESS=UNVERIFIED'
          Write-Output 'F139_D2R_SCIENTIFIC_FIRST_USE=BLOCKED'
          Write-Output 'F139_D2R_DISPOSITION=PROVIDER_METADATA_ONLY_NO_SCIENCE'
      - name: F139 D2R Cloudflare GET denial classification
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops(f139): classify existing D2R Cloudflare read-only access'
        shell: pwsh
        env:
          F139_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          F139_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'D2R_WRONG_RUNNER'}
          if([string]::IsNullOrWhiteSpace($env:F139_CF_TOKEN) -or $env:F139_CF_ACCOUNT -notmatch '^[a-f0-9]{32}$'){throw 'D2R_ACCOUNT_BINDING_MISSING'}
          $headers=@{Authorization=('Bearer '+$env:F139_CF_TOKEN);Accept='application/json'}
          function InspectGet([string]$path){
            $out=@{status=0;success=$false;result=$null;total=$null}
            try{
              $response=Invoke-WebRequest -Uri ('https://api.cloudflare.com/client/v4/'+$path) -Method Get -Headers $headers -TimeoutSec 20 -UseBasicParsing
              $out.status=[int]$response.StatusCode
              $body=$response.Content|ConvertFrom-Json
              $out.success=$body.success -eq $true
              if($out.success){$out.result=$body.result; $out.total=$body.result_info.total_count}
            }catch{
              try{$out.status=[int]$_.Exception.Response.StatusCode}catch{}
            }
            return $out
          }
          $token=InspectGet 'user/tokens/verify'
          Write-Output ('F139_D2R_PROVIDER_VERIFY_HTTP_STATUS='+$token.status)
          Write-Output ('F139_D2R_PROVIDER_VERIFY_SUCCESS='+$token.success.ToString().ToUpperInvariant())
          if($token.success){
            Write-Output ('F139_D2R_PROVIDER_TOKEN_ACTIVE='+([string]$token.result.status -ceq 'active').ToString().ToUpperInvariant())
          }
          $d1=InspectGet ('accounts/'+$env:F139_CF_ACCOUNT+'/d1/database?page=1&per_page=100')
          Write-Output ('F139_D2R_PROVIDER_D1_LIST_HTTP_STATUS='+$d1.status)
          Write-Output ('F139_D2R_PROVIDER_D1_LIST_SUCCESS='+$d1.success.ToString().ToUpperInvariant())
          if($d1.success){
            $dbs=@($d1.result)
            if($null -eq $d1.total -or $d1.total -gt 100 -or $dbs.Count -ne $d1.total){throw 'D2R_D1_PAGINATION_NOT_PROVEN'}
            Write-Output ('F139_D2R_PROVIDER_DATABASE_COUNT='+$dbs.Count)
            Write-Output ('F139_D2R_PROVIDER_FORGE_NAMED_DB_COUNT='+@($dbs|Where-Object{$_.name -match '(?i)forge'}).Count)
          }
          $workers=InspectGet ('accounts/'+$env:F139_CF_ACCOUNT+'/workers/scripts')
          Write-Output ('F139_D2R_PROVIDER_WORKER_LIST_HTTP_STATUS='+$workers.status)
          Write-Output ('F139_D2R_PROVIDER_WORKER_LIST_SUCCESS='+$workers.success.ToString().ToUpperInvariant())
          if($workers.success){
            Write-Output ('F139_D2R_PROVIDER_FORGE_NAMED_WORKERS='+@($workers.result|Where-Object{$_.id -match '(?i)(forge|fsa)'}).Count)
          }
          Write-Output 'F139_D2R_PROVIDER_METHODS=GET_ONLY'
          Write-Output 'F139_D2R_INDEPENDENT_FSA_WITNESS=NOT_VERIFIED'
          Write-Output 'F139_D2R_SCIENTIFIC_FIRST_USE=BLOCKED'
          Write-Output 'F139_D2R_DISPOSITION=READONLY_AUTH_ACCESS_CLASSIFIED_NOT_ADMITTED'
          exit 0
      - name: F139 D2R bounded D1 SELECT-only schema custody
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops(f139): inspect D2R existing FSA D1 schemas with read-only SELECT'
        shell: pwsh
        env:
          F139_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          F139_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'D2R_WRONG_RUNNER'}
          if([string]::IsNullOrWhiteSpace($env:F139_CF_TOKEN) -or $env:F139_CF_ACCOUNT -notmatch '^[a-f0-9]{32}$'){throw 'D2R_PROVIDER_CREDENTIAL_BINDING_INVALID'}
          $b='https://api.cloudflare.com/client/v4/accounts/'+$env:F139_CF_ACCOUNT
          $h=@{Authorization=('Bearer '+$env:F139_CF_TOKEN);Accept='application/json'}
          $dbs=Invoke-RestMethod -Method Get -Headers $h -Uri ($b+'/d1/database?page=1&per_page=100') -TimeoutSec 30
          if($dbs.success -ne $true -or $null -eq $dbs.result_info -or $dbs.result_info.total_count -gt 100){throw 'D2R_D1_LIST_NOT_PROVEN'}
          $all=@($dbs.result)
          if($all.Count -ne $dbs.result_info.total_count){throw 'D2R_D1_LIST_PARTIAL'}
          $forge=@($all|Where-Object{$_.name -match '(?i)forge'})
          if($forge.Count -ne 1 -or [string]$forge[0].uuid -notmatch '^[a-f0-9-]{36}$'){throw 'D2R_UNIQUE_FORGE_DATABASE_NOT_IDENTIFIED'}
          $dbid=[string]$forge[0].uuid
          $info=Invoke-RestMethod -Method Get -Headers $h -Uri ($b+'/d1/database/'+$dbid) -TimeoutSec 30
          if($info.success -ne $true -or $info.result.uuid -cne $dbid -or $info.result.name -cne $forge[0].name){throw 'D2R_D1_DETAIL_IDENTITY_DRIFT'}
          Write-Output 'F139_D2R_D1_ACCOUNT_AND_DATABASE_IDENTITY=PROVIDER_VERIFIED'
          $book='UNAVAILABLE'
          try{
            $r=Invoke-RestMethod -Method Get -Headers $h -Uri ($b+'/d1/database/'+$dbid+'/time_travel/bookmark') -TimeoutSec 20
            if($r.success -eq $true -and $null -ne $r.result){$book='AVAILABLE_METADATA_ONLY'}
          }catch{}
          Write-Output ('F139_D2R_D1_TIMETRAVEL_BOOKMARK='+$book)
          $sql="SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE 'forge_research_%' OR name LIKE 'forge_fsa_%') ORDER BY name LIMIT 50"
          if($sql -cne "SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE 'forge_research_%' OR name LIKE 'forge_fsa_%') ORDER BY name LIMIT 50"){throw 'D2R_SQL_MUTATION_NOT_ALLOWED'}
          $body=@{sql=$sql;params=@()}|ConvertTo-Json -Compress
          $res=Invoke-RestMethod -Method Post -ContentType 'application/json' -Headers $h -Uri ($b+'/d1/database/'+$dbid+'/query') -Body $body -TimeoutSec 30
          if($res.success -ne $true -or @($res.result).Count -ne 1 -or $res.result[0].success -ne $true){throw 'D2R_D1_SELECT_FAILED'}
          $meta=$res.result[0].meta
          if($meta.changes -ne 0 -or $meta.rows_written -ne 0){throw 'D2R_SQL_NOT_READONLY'}
          $names=@($res.result[0].results|ForEach-Object{[string]$_.name})
          if($names.Count -gt 50 -or @($names|Select-Object -Unique).Count -ne $names.Count){throw 'D2R_TABLES_TOO_MANY_OR_DUPLICATE'}
          Write-Output 'F139_D2R_D1_SCHEMA_QUERY=FIXED_READONLY_SELECT_PASS'
          Write-Output ('F139_D2R_RESEARCH_TABLE_COUNT='+@($names|Where-Object{$_ -like 'forge_research_*'}).Count)
          Write-Output ('F139_D2R_FSA_TABLE_COUNT='+@($names|Where-Object{$_ -like 'forge_fsa_*'}).Count)
          foreach($table in $names){Write-Output ('F139_D2R_PRESENT_TABLE='+$table)}
          Write-Output 'F139_D2R_D1_READBACK_SCIENTIFIC_RECORDS=NOT_ACCESSED'
          Write-Output 'F139_D2R_FSA_SIGNED_CHECKPOINT=NOT_AUTHENTICATED'
          Write-Output 'F139_D2R_INDEPENDENT_WITNESS=NOT_AUTHENTICATED'
          Write-Output 'F139_D2R_FIRST_USE=BLOCKED'
          Write-Output 'F139_D2R_DISPOSITION=READONLY_D1_SCHEMA_INVENTORY'
      - name: F139 D2R bounded D1 historical archive count
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops(f139): count original D2R Cloudflare archives and seals read only'
        shell: pwsh
        env:
          F139_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          F139_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'D2R_WRONG_OWNER_RUNNER'}
          if([string]::IsNullOrWhiteSpace($env:F139_CF_TOKEN) -or $env:F139_CF_ACCOUNT -notmatch '^[a-f0-9]{32}$'){throw 'D2R_PROVIDER_BINDING_ABSENT'}
          $b='https://api.cloudflare.com/client/v4/accounts/'+$env:F139_CF_ACCOUNT
          $h=@{Authorization=('Bearer '+$env:F139_CF_TOKEN);Accept='application/json'}
          $dbs=Invoke-RestMethod -Uri ($b+'/d1/database?page=1&per_page=100') -Headers $h -Method Get -TimeoutSec 30
          if($dbs.success -ne $true -or $dbs.result_info.total_count -gt 100 -or @($dbs.result).Count -ne $dbs.result_info.total_count){throw 'D2R_D1_INVENTORY_DRIFT'}
          $fs=@($dbs.result|Where-Object{$_.name -match '(?i)forge'})
          if($fs.Count -ne 1 -or [string]$fs[0].uuid -notmatch '^[a-f0-9-]{36}$'){throw 'D2R_D1_IDENTITY_AMBIGUOUS'}
          $sql="SELECT 'originals' AS class, COUNT(*) AS total FROM forge_research_originals UNION ALL SELECT 'seals' AS class, COUNT(*) AS total FROM forge_research_seals UNION ALL SELECT 'chunks' AS class, COUNT(*) AS total FROM forge_research_chunks"
          $body=@{sql=$sql;params=@()}|ConvertTo-Json -Compress
          $result=Invoke-RestMethod -Uri ($b+'/d1/database/'+$fs[0].uuid+'/query') -Headers $h -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 30
          if($result.success -ne $true -or @($result.result).Count -ne 1 -or $result.result[0].success -ne $true){throw 'D2R_D1_READONLY_COUNTS_FAILED'}
          $meta=$result.result[0].meta
          if($meta.changes -ne 0 -or $meta.rows_written -ne 0){throw 'D2R_D1_COUNTERS_MUTATED'}
          $r=@($result.result[0].results)
          if($r.Count -ne 3 -or ($r[0].class,$r[1].class,$r[2].class -join ',') -cne 'originals,seals,chunks'){throw 'D2R_COUNT_RESULT_SCHEMA_INVALID'}
          foreach($entry in $r){if([long]$entry.total -lt 0){throw 'D2R_COUNT_INVALID'}}
          Write-Output ('F139_D2R_LIVE_ORIGINAL_ARCHIVE_ROWS='+$r[0].total)
          Write-Output ('F139_D2R_LIVE_ORIGINAL_SEAL_ROWS='+$r[1].total)
          Write-Output ('F139_D2R_LIVE_ARCHIVE_CHUNK_ROWS='+$r[2].total)
          Write-Output 'F139_D2R_ARCHIVE_CONTENTS_READ=FALSE'
          Write-Output 'F139_D2R_D1_SQL_MUTATIONS=ZERO'
          Write-Output 'F139_D2R_FSA_ADMISSION_NAMESPACE=ABSENT_FROM_PRECEDING_INDEPENDENT_SCHEMA_AUDIT'
          Write-Output 'F139_D2R_EXTERNAL_FSA_WITNESS=NOT_AUTHENTICATED'
          Write-Output 'F139_D2R_SCIENTIFIC_FIRST_USE=BLOCKED'
          Write-Output 'F139_D2R_DISPOSITION=HISTORICAL_COUNTS_ONLY_NOT_SCIENTIFIC_AUTHORITY'
