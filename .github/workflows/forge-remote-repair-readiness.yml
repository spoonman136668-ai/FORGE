name: FORGE isolated remote repair readiness
on:
  push:
    branches: [proposal/forge-remote-repair-r1]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pull-requests: read
jobs:
  ready:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Confirm dedicated runner and subscription Codex
        shell: pwsh
        env:
          CODEX_HOME: C:\ProgramData\CKBR\codex\home
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OPENAI_API_KEY) { throw 'API_BILLING_PROHIBITED' }
          if ($env:RUNNER_NAME -ne 'FORGE-CODEX-REMOTE') { throw 'WRONG_RUNNER_IDENTITY' }
          $cmd = Get-Command codex -ErrorAction Stop
          $loginStatus = (& $cmd.Source login status 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'SUBSCRIPTION_AUTH_MISSING' }
          if ($loginStatus -notmatch '(?i)logged in using chatgpt') {
              throw 'SUBSCRIPTION_ONLY_LOGIN_REQUIRED'
          }
          Write-Output 'FORGE_ISOLATED_CODEX_READY=PASS'
      - name: Confirm source-only authority boundary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $prs = & gh api "repos/$repo/pulls?state=open&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'PR_DISCOVERY_FAILED' }
          $eligible = @($prs | Where-Object {
              $_.draft -eq $false -and
              $_.user.login -eq 'spoonman136668-ai' -and
              $_.head.repo.full_name -eq $repo -and
              $_.head.ref -match '^proposal/fsa'
          })
          Write-Output "FSA_SOURCE_PROPOSALS_OBSERVED=$($eligible.Count)"
          Write-Output 'REMOTE_REPAIR_EXECUTION=NOT_AUTHORIZED_BY_READINESS_CHECK'
          Write-Output 'AUTO_MERGE=DISABLED'
          Write-Output 'SCIENCE_ACTIVATION=DISABLED'
      - name: F139 D2R read-only deployed FSA resource inventory
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops(f139): perform D2R read-only provider trust inventory with owner credentials'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:RUNNER_OS -cne 'Windows'){throw 'F139_D2R_WRONG_RUNNER'}
          $main=& gh api -X GET repos/spoonman136668-ai/FORGE/branches/main | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $main.commit.sha -cne '34ca99c1b5b063225566082aee5aa180a15d093b' -or
             $main.protected -ne $true){throw 'F139_D2R_PROTECTED_MAIN_DRIFT'}
          $controller=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if($controller.State -ne 'Running'){throw 'F139_D2R_NATIVE_CONTROLLER_NOT_RUNNING'}
          $owner=([Security.Principal.NTAccount]::new([string]$controller.Principal.UserId)).Translate([Security.Principal.SecurityIdentifier])
          if($owner.Value -cne [Security.Principal.WindowsIdentity]::GetCurrent().User.Value){throw 'F139_D2R_NOT_CONTROLLER_OWNER'}
          Write-Output 'F139_D2R_CONTROLLER_OWNER_AND_SOURCE=PASS'
          $names=@('CLOUDFLARE_API_TOKEN','CF_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','CF_ACCOUNT_ID','CLOUDFLARE_D1_DATABASE_ID','FSA_D1_DATABASE_ID','FORGE_FSA_AUTHORITY_URL','FORGE_FSA_WITNESS_URL')
          $present=@($names|Where-Object {-not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))})
          Write-Output ('F139_D2R_INHERITED_PROVIDER_CREDENTIAL_FIELDS_PRESENT_COUNT='+$present.Count)
          $githubNames=@(); $githubMetadataAvailable=$false
          try{
            $saved=$ErrorActionPreference
            try{
              $ErrorActionPreference='Continue'
              $metaRaw=@(& gh api -X GET 'repos/spoonman136668-ai/FORGE/actions/secrets?per_page=100' 2>&1)
              $rc=$LASTEXITCODE
            }finally{$ErrorActionPreference=$saved}
            if($rc -eq 0){
              $meta=($metaRaw -join [Environment]::NewLine)|ConvertFrom-Json
              if($meta.total_count -le 100 -and @($meta.secrets).Count -eq $meta.total_count){
                $githubNames=@($meta.secrets|ForEach-Object{[string]$_.name})
                $githubMetadataAvailable=$true
              }
            }
          }catch{}
          Write-Output ('F139_D2R_GITHUB_SECRET_METADATA_READABLE='+$githubMetadataAvailable.ToString().ToUpperInvariant())
          if($githubMetadataAvailable){
            $matching=@($githubNames|Where-Object{$_ -match '^(CF_|CLOUDFLARE_|FORGE_FSA_)'})
            Write-Output ('F139_D2R_REPOSITORY_PROVIDER_SECRET_NAME_COUNT='+$matching.Count)
          }
          $possible=@(
            (Join-Path $env:LOCALAPPDATA 'FORGE-FSA\owner-ed25519.dpapi'),
            (Join-Path $env:LOCALAPPDATA 'FORGE-FSA\authority-public-config.json'),
            (Join-Path $env:LOCALAPPDATA 'FORGE-FSA\witness-public-config.json')
          )
          Write-Output ('F139_D2R_OWNER_KEY_FILE_PRESENT='+([bool](Test-Path -LiteralPath $possible[0] -PathType Leaf)).ToString().ToUpperInvariant())
          Write-Output ('F139_D2R_AUTHORITY_CONFIG_FILE_PRESENT='+([bool](Test-Path -LiteralPath $possible[1] -PathType Leaf)).ToString().ToUpperInvariant())
          Write-Output ('F139_D2R_WITNESS_CONFIG_FILE_PRESENT='+([bool](Test-Path -LiteralPath $possible[2] -PathType Leaf)).ToString().ToUpperInvariant())
          $fsaProcesses=@(Get-CimInstance Win32_Process -ErrorAction Stop |
            Where-Object{$_.Name -match '^forge-fsa-(authority|witness)(\.exe)?$'})
          Write-Output ('F139_D2R_LOCAL_FSA_HOST_PROCESSES='+$fsaProcesses.Count)
          Write-Output 'F139_D2R_D1_ARCHIVE_READBACK=NOT_RUN_WITHOUT_PROVEN_PROVIDER_BINDING'
          Write-Output 'F139_D2R_INDEPENDENT_WITNESS_SIGNATURE=NOT_ATTESTED'
          Write-Output 'F139_D2R_SCIENTIFIC_FIRST_USE=BLOCKED'
          Write-Output 'F139_D2R_DISPOSITION=READONLY_RESOURCE_DISCOVERY_ONLY'
          exit 0
      - name: F139 D2R identify provider secret names without exposing values
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops(f139): identify D2R provider secret bindings read only'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){throw 'D2R_WRONG_RUNNER'}
          $meta=(& gh api -X GET 'repos/spoonman136668-ai/FORGE/actions/secrets?per_page=100')|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $meta.total_count -gt 100 -or @($meta.secrets).Count -ne $meta.total_count){throw 'D2R_SECRET_NAMES_INCOMPLETE'}
          $names=@($meta.secrets|ForEach-Object{[string]$_.name})
          foreach($name in @('CLOUDFLARE_API_TOKEN','CF_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','CF_ACCOUNT_ID','CLOUDFLARE_D1_DATABASE_ID','CF_D1_DATABASE_ID','FORGE_CF_API_TOKEN','FORGE_CLOUDFLARE_API_TOKEN')){
            $found=$names -ccontains $name
            Write-Output ('F139_D2R_SECRET_NAME_'+$name+'='+$found.ToString().ToUpperInvariant())
          }
          Write-Output 'F139_D2R_SECRET_VALUES_ACCESSED=FALSE'
          Write-Output 'F139_D2R_PROVIDER_MUTATIONS=ZERO'
      - name: F139 D2R Cloudflare provider GET-only attestation
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ops(f139): inspect existing D2R Cloudflare D1 and Worker metadata read only'
        shell: pwsh
        env:
          F139_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          F139_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'D2R_WRONG_RUNNER'}
          if([string]::IsNullOrWhiteSpace($env:F139_CF_TOKEN) -or $env:F139_CF_ACCOUNT -notmatch '^[a-f0-9]{32}$'){
            throw 'D2R_EXISTING_PROVIDER_SECRET_BINDING_UNAVAILABLE'
          }
          $headers=@{Authorization=('Bearer '+$env:F139_CF_TOKEN);Accept='application/json'}
          $base='https://api.cloudflare.com/client/v4'
          function CFGet([string]$path){
            try {
              $r=Invoke-RestMethod -Uri ($base+'/'+$path) -Method Get -Headers $headers -TimeoutSec 30
              if($r.success -ne $true){return $null}
              return $r
            }catch{return $null}
          }
          $verify=CFGet 'user/tokens/verify'
          if($null -eq $verify -or $verify.result.status -cne 'active'){throw 'D2R_PROVIDER_TOKEN_NOT_VERIFIED'}
          Write-Output 'F139_D2R_CLOUDFLARE_PROVIDER_TOKEN=ACTIVE'
          $dbs=CFGet ('accounts/'+$env:F139_CF_ACCOUNT+'/d1/database?page=1&per_page=100')
          if($null -eq $dbs){Write-Output 'F139_D2R_D1_LIST=DENIED_OR_UNAVAILABLE'}
          else {
            $items=@($dbs.result)
            $info=$dbs.result_info
            if($null -eq $info -or $info.total_count -gt 100 -or $items.Count -ne $info.total_count){throw 'D2R_D1_INVENTORY_PAGINATION_UNVERIFIED'}
            $matches=@($items|Where-Object {$_.name -match '(?i)forge'})
            Write-Output 'F139_D2R_D1_LIST=AUTHENTICATED_GET'
            Write-Output ('F139_D2R_D1_DATABASE_COUNT='+$items.Count)
            Write-Output ('F139_D2R_FORGE_NAMED_D1_COUNT='+$matches.Count)
            if($matches.Count -eq 1){
              $one=$matches[0]
              $detail=CFGet ('accounts/'+$env:F139_CF_ACCOUNT+'/d1/database/'+$one.uuid)
              if($null -ne $detail -and $detail.result.uuid -ceq $one.uuid){
                Write-Output 'F139_D2R_UNIQUE_FORGE_D1_IDENTITY=PROVIDER_GET_MATCH'
                $mark=CFGet ('accounts/'+$env:F139_CF_ACCOUNT+'/d1/database/'+$one.uuid+'/time_travel/bookmark')
                Write-Output ('F139_D2R_D1_TIMETRAVEL_BOOKMARK_METADATA='+(('PRESENT','UNAVAILABLE')[[int]($null -eq $mark)]))
              }else{Write-Output 'F139_D2R_UNIQUE_FORGE_D1_IDENTITY=NOT_VERIFIED'}
            }
          }
          $scripts=CFGet ('accounts/'+$env:F139_CF_ACCOUNT+'/workers/scripts')
          if($null -eq $scripts){Write-Output 'F139_D2R_WORKER_SCRIPTS=DENIED_OR_UNAVAILABLE'}
          else{
            $s=@($scripts.result)
            $fsa=@($s|Where-Object{($_.id -match '(?i)(forge|fsa)')})
            Write-Output 'F139_D2R_WORKER_SCRIPTS=AUTHENTICATED_GET'
            Write-Output ('F139_D2R_FORGE_FSA_NAMED_WORKER_COUNT='+$fsa.Count)
          }
          Write-Output 'F139_D2R_PROVIDER_HTTP_METHODS=GET_ONLY'
          Write-Output 'F139_D2R_SQL_MUTATIONS=ZERO'
          Write-Output 'F139_D2R_FSA_INDEPENDENT_SIGNER_OR_WITNESS=UNVERIFIED'
          Write-Output 'F139_D2R_SCIENTIFIC_FIRST_USE=BLOCKED'
          Write-Output 'F139_D2R_DISPOSITION=PROVIDER_METADATA_ONLY_NO_SCIENCE'
