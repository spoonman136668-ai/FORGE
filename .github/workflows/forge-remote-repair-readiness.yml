name: FORGE isolated remote repair readiness
on:
  push:
    branches: [proposal/forge-remote-repair-r1, audit/f139-existing-runner-owner-custody-20261021]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pull-requests: read
jobs:
  ready:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Confirm dedicated runner and subscription Codex
        shell: pwsh
        env:
          CODEX_HOME: C:\ProgramData\CKBR\codex\home
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OPENAI_API_KEY) { throw 'API_BILLING_PROHIBITED' }
          if ($env:RUNNER_NAME -ne 'FORGE-CODEX-REMOTE') { throw 'WRONG_RUNNER_IDENTITY' }
          $cmd = Get-Command codex -ErrorAction Stop
          $loginStatus = (& $cmd.Source login status 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'SUBSCRIPTION_AUTH_MISSING' }
          if ($loginStatus -notmatch '(?i)logged in using chatgpt') {
              throw 'SUBSCRIPTION_ONLY_LOGIN_REQUIRED'
          }
          Write-Output 'FORGE_ISOLATED_CODEX_READY=PASS'
      - name: Confirm source-only authority boundary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $prs = & gh api "repos/$repo/pulls?state=open&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'PR_DISCOVERY_FAILED' }
          $eligible = @($prs | Where-Object {
              $_.draft -eq $false -and
              $_.user.login -eq 'spoonman136668-ai' -and
              $_.head.repo.full_name -eq $repo -and
              $_.head.ref -match '^proposal/fsa'
          })
          Write-Output "FSA_SOURCE_PROPOSALS_OBSERVED=$($eligible.Count)"
          Write-Output 'REMOTE_REPAIR_EXECUTION=NOT_AUTHORIZED_BY_READINESS_CHECK'
          Write-Output 'AUTO_MERGE=DISABLED'
          Write-Output 'SCIENCE_ACTIVATION=DISABLED'

  f139-owner-profile-readonly:
    # One source-branch runner qualification on the existing Windows host.
    # No task mutation, original ledger open, DPAPI secret read, controller
    # start, workflow_dispatch, scientific work, or new runner registration.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/audit/f139-existing-runner-owner-custody-20261021' }}
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    steps:
      - name: Check whether this existing runner has authentic F139 owner custody
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OPENAI_API_KEY) { throw 'F139_PAID_API_FORBIDDEN' }
          $current = [Security.Principal.WindowsIdentity]::GetCurrent()
          $task = Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction SilentlyContinue
          if ($null -eq $task) {
            Write-Host 'F139_EXISTING_RUNNER_TASK=NOT_VISIBLE'
            Write-Host 'F139_EXISTING_RUNNER_OWNER_CUTOVER=BLOCKED'
            exit 0
          }
          if (@($task.Actions).Count -ne 1) {
            Write-Host 'F139_EXISTING_RUNNER_TASK_ACTION=INVALID'
            Write-Host 'F139_EXISTING_RUNNER_OWNER_CUTOVER=BLOCKED'
            exit 0
          }
          $principal = [string]$task.Principal.UserId
          $sid = try {
            (New-Object Security.Principal.NTAccount($principal)).Translate(
              [Security.Principal.SecurityIdentifier]).Value
          } catch { '' }
          $sameOwner = ($principal -ieq $current.Name -or $sid -eq $current.User.Value)
          $db = Join-Path $env:LOCALAPPDATA 'FORGE-F139\state.sqlite'
          $key = Join-Path $env:LOCALAPPDATA 'FORGE-F139\worker-hmac.dpapi.xml'
          $raw = [string]$task.Actions[0].Arguments
          $m = [regex]::Match($raw,'(?i)(?:^|\s)-Database\s+"([^"]+)"')
          $dbBound = $m.Success -and (
            [IO.Path]::GetFullPath($m.Groups[1].Value) -ieq
            [IO.Path]::GetFullPath($db))
          Write-Host ('F139_EXISTING_RUNNER_TASK=' + 'VISIBLE')
          Write-Host ('F139_EXISTING_RUNNER_OWNER_SID_MATCH=' +
            [string]$sameOwner.ToString().ToUpperInvariant())
          Write-Host ('F139_EXISTING_RUNNER_ORIGINAL_DB_BINDING=' +
            [string]$dbBound.ToString().ToUpperInvariant())
          Write-Host ('F139_EXISTING_RUNNER_DB_PRESENT=' +
            [string](Test-Path -LiteralPath $db -PathType Leaf).ToString().ToUpperInvariant())
          Write-Host ('F139_EXISTING_RUNNER_DPAPI_FILE_PRESENT=' +
            [string](Test-Path -LiteralPath $key -PathType Leaf).ToString().ToUpperInvariant())
          Write-Host ('F139_EXISTING_RUNNER_TASK_STATE=' + [string]$task.State)
          if ($sameOwner -and $dbBound -and
              (Test-Path -LiteralPath $db -PathType Leaf) -and
              (Test-Path -LiteralPath $key -PathType Leaf)) {
            Write-Host 'F139_EXISTING_RUNNER_OWNER_CUTOVER=ELIGIBLE_FOR_SEPARATE_QUALIFIED_ACTION'
          } else {
            Write-Host 'F139_EXISTING_RUNNER_OWNER_CUTOVER=BLOCKED'
          }
          Write-Host 'F139_EXISTING_RUNNER_READ_ONLY=PASS'
      - name: Check original source ledger and GitHub provider evidence without mutation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          $txt=[string]$task.Actions[0].Arguments
          function TaskArg([string]$n) {
            $m=[regex]::Match($txt,'(?i)(?:^|\s)-'+[regex]::Escape($n)+'\s+"([^"]+)"')
            if(!$m.Success) { throw 'F139_OWNER_ARG_ABSENT' }
            return $m.Groups[1].Value
          }
          $root=TaskArg 'RepositoryRoot'
          $python=TaskArg 'PythonExe'
          $db=TaskArg 'Database'
          $sha=(& git -C $root rev-parse HEAD)
          if($LASTEXITCODE -ne 0) { throw 'F139_OWNER_GIT_READ_FAILED' }
          Push-Location $root
          try {
            $raw=& $python -B -m f139.local_controller --db $db status
            if($LASTEXITCODE -ne 0) { throw 'F139_OWNER_LEDGER_READ_FAILED' }
            $s=($raw -join "`n" | ConvertFrom-Json).status
          } finally { Pop-Location }
          $bad=@($s.tasks | Where-Object {$_.stage -eq 'QUARANTINED'})
          $good=@($s.tasks | Where-Object {$_.stage -eq 'VERIFIED'})
          Write-Host ("F139_OWNER_SOURCE=" + $s.meta.source_sha)
          Write-Host ("F139_OWNER_SOURCE_CHECKOUT_IDENTICAL=" + ($sha -ceq $s.meta.source_sha))
          Write-Host ("F139_OWNER_EVENT_COUNT=" + $s.meta.head_seq)
          Write-Host ("F139_OWNER_EVENT_HEAD=" + $s.meta.head_hash)
          Write-Host ("F139_OWNER_VERIFIED_TASKS=" + $good.Count)
          Write-Host ("F139_OWNER_QUARANTINED_TASKS=" + $bad.Count)
          Write-Host ("F139_OWNER_QUARANTINED_ISSUE696=" +
            (@($bad | Where-Object {$_.ticket -like 'f139-nci04-i696-*'}).Count -eq 1))
          $main=(& gh api 'repos/spoonman136668-ai/FORGE/git/ref/heads/main') | ConvertFrom-Json
          if($LASTEXITCODE -ne 0) { throw 'F139_MAIN_READ_FAILED' }
          Write-Host ("F139_PROTECTED_MAIN=" + $main.object.sha)
          $artifact=(& gh api 'repos/spoonman136668-ai/FORGE/actions/runs/39571372972/artifacts?per_page=100') | ConvertFrom-Json
          if($LASTEXITCODE -ne 0) { throw 'F139_ORIGINAL_ARTIFACT_LIST_FAILED' }
          $found=@($artifact.artifacts | Where-Object {$_.id -eq 12332695987})
          Write-Host ("F139_NEGATIVE_ARTIFACT_IDENTITY_VERIFIED=" +
            ($found.Count -eq 1 -and
             $found[0].digest -ceq 'sha256:2092c9dae526689a4b8ac4392b3b053dd088beb4b83b29ba09ac730aeef63c06' -and
             !$found[0].expired))
          Write-Host 'F139_OWNER_BOUNDARY_READ_ONLY=PASS'


      - name: Inspect source syntax without executing staged owner cutover
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://raw.githubusercontent.com/spoonman136668-ai/FORGE/audit/f139-existing-runner-owner-custody-20261021/scripts/Cutover-FORGE-F139-A8-Runner.ps1'
          $response = Invoke-WebRequest -Uri $url -UseBasicParsing
          $scriptText = [string]$response.Content
          if ($scriptText.Length -lt 8000) { throw 'F139_CUTOVER_SCRIPT_UNEXPECTED_SIZE' }
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput(
              $scriptText, [ref]$tokens, [ref]$parseErrors)
          if (@($parseErrors).Count -ne 0) {
            throw 'F139_A8_CUTOVER_SOURCE_PARSE_FAILED'
          }
          if ($null -eq $ast) { throw 'F139_A8_NO_PARSED_SOURCE' }
          Write-Host 'F139_A8_CUTOVER_POWERSHELL_SYNTAX=PASS'
          Write-Host 'F139_A8_CUTOVER_SCRIPT_NOT_EXECUTED=TRUE'

  f139-issue706-native-rehearsal:
    # Requalify original OWNER-labelled issue #706 after SHA256 identity fix.
    # Source-only prereadiness of the first candidate. Not the F139 workflow
    # endpoint and NOT a scheduled owner controller run. Runs without HMAC.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/audit/f139-existing-runner-owner-custody-20261021' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read-only checkout of exact FORGE source qualification harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticated Git clone of original Wingless source at exact commit
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/Wingless
          ref: a5db1727113731988bfccad6ae30a0b8b4d6f9d6
          path: native
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently read exact owner issue, protected main and target tree
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'f139-issue706-readonly'
          New-Item -ItemType Directory -Path $root | Out-Null
          & gh api 'repos/spoonman136668-ai/FORGE/issues/706' > (Join-Path $root 'issue.json')
          if($LASTEXITCODE -ne 0) { throw 'F139_706_ISSUE_PROVIDER_READ_FAILED' }
          & gh api 'repos/spoonman136668-ai/FORGE/git/ref/heads/main' > (Join-Path $root 'main.json')
          if($LASTEXITCODE -ne 0) { throw 'F139_706_MAIN_PROVIDER_READ_FAILED' }
          & gh api 'repos/spoonman136668-ai/Wingless/git/commits/a5db1727113731988bfccad6ae30a0b8b4d6f9d6' > (Join-Path $root 'target.json')
          if($LASTEXITCODE -ne 0) { throw 'F139_706_TARGET_PROVIDER_READ_FAILED' }
          Write-Host 'F139_706_THREE_SOURCE_IDENTITIES_READ_ONLY=PASS'
      - name: Isolated real Wingless candidate, focused then full regression, vet and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $code = @'
          import json,os,sys,tempfile
          from pathlib import Path
          from f139.nci04_owner_issue import inspect_owner_issue
          from f139.nci04_native_worker import qualification_from_bytes
          root=Path(os.environ["RUNNER_TEMP"])/"f139-issue706-readonly"
          read=lambda k:json.loads((root/k).read_text(encoding="utf-8-sig"))
          issue,main,target=read("issue.json"),read("main.json"),read("target.json")
          assert main["object"]["sha"]=="09f3d7447900f99dd3d532c5d3d90ed7e8c20ac3","MAIN_IDENTITY_DRIFT"
          assert target["sha"]=="a5db1727113731988bfccad6ae30a0b8b4d6f9d6","TARGET_COMMIT_DRIFT"
          assert target["tree"]["sha"]=="b80d8baf20915974aca655ec92b9baefe22f5cb1","TARGET_TREE_DRIFT"
          auth=inspect_owner_issue(issue,protected_main=main["object"]["sha"],
              authenticated_target_commit=target["sha"],
              authenticated_target_tree=target["tree"]["sha"])
          assert auth.number==706 and auth.lane=="Wingless"
          native=Path(os.environ["GITHUB_WORKSPACE"])/"native"
          candidate,stage,report=qualification_from_bytes(
              auth.intent_raw,protected_main=main["object"]["sha"],
              target_commit=target["sha"],target_tree_sha=target["tree"]["sha"],
              checkout=native,sandbox_parent=Path(os.environ["RUNNER_TEMP"]))
          assert candidate.before_sha256=="7a42411598e59f66510b4c6505d9e4270156ba3a965be235b06ba001a0d53efa"
          assert candidate.after_sha256=="56cf66f28fd11c2a363d92e06bfed7bf97ae832c43de68e260ac00dfe71e800a"
          output=root/"native-report.json"
          output.write_text(json.dumps(report,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          for cmd in report["commands"]:
              print("F139_706_CMD="+str(cmd["command"]))
              print("F139_706_RESULT="+cmd["outcome"]+" EXIT="+str(cmd["returncode"]))
              if cmd["outcome"]!="PASS":
                  print(cmd["excerpt"][-2600:])
          print("F139_706_NATIVE_QUALIFICATION="+("PASS" if report["qualification_complete"] else "NEGATIVE_RETAINED"))
          print("F139_706_SCIENTIFIC_FIRST_USE=FALSE")
          print("F139_706_ORIGINAL_OWNER_LEDGER_TOUCHED=FALSE")
          print("F139_706_MANUAL_WORKER_DISPATCH=NONE")
          if not report["qualification_complete"]:sys.exit(1)
          '@
          python -B -c $code
          if($LASTEXITCODE -ne 0) { throw 'F139_706_NATIVE_QUALIFICATION_NEGATIVE_RETAINED' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f139-issue706-readonly-${{ matrix.os }}
          path: ${{ runner.temp }}/f139-issue706-readonly/native-report.json
          if-no-files-found: warn
          retention-days: 30
