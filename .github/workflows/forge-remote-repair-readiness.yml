name: FORGE isolated remote repair readiness
on:
  push:
    branches: [proposal/forge-remote-repair-r1]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pull-requests: read
jobs:
  ready:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Confirm dedicated runner and subscription Codex
        shell: pwsh
        env:
          CODEX_HOME: C:\ProgramData\CKBR\codex\home
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OPENAI_API_KEY) { throw 'API_BILLING_PROHIBITED' }
          if ($env:RUNNER_NAME -ne 'FORGE-CODEX-REMOTE') { throw 'WRONG_RUNNER_IDENTITY' }
          $cmd = Get-Command codex -ErrorAction Stop
          $loginStatus = (& $cmd.Source login status 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'SUBSCRIPTION_AUTH_MISSING' }
          if ($loginStatus -notmatch '(?i)logged in using chatgpt') {
              throw 'SUBSCRIPTION_ONLY_LOGIN_REQUIRED'
          }
          Write-Output 'FORGE_ISOLATED_CODEX_READY=PASS'
      - name: Confirm source-only authority boundary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $prs = & gh api "repos/$repo/pulls?state=open&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'PR_DISCOVERY_FAILED' }
          $eligible = @($prs | Where-Object {
              $_.draft -eq $false -and
              $_.user.login -eq 'spoonman136668-ai' -and
              $_.head.repo.full_name -eq $repo -and
              $_.head.ref -match '^proposal/fsa'
          })
          Write-Output "FSA_SOURCE_PROPOSALS_OBSERVED=$($eligible.Count)"
          Write-Output 'REMOTE_REPAIR_EXECUTION=NOT_AUTHORIZED_BY_READINESS_CHECK'
          Write-Output 'AUTO_MERGE=DISABLED'
          Write-Output 'SCIENCE_ACTIVATION=DISABLED'
      - name: D2S read-only witness host principal suitability
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'FORGE-CODEX-REMOTE') { throw 'WITNESS_PROBE_UNEXPECTED_RUNNER' }
          if ($env:OPENAI_API_KEY) { throw 'WITNESS_PROBE_PAID_API_REJECTED' }
          if (-not [System.IO.Path]::IsPathRooted($env:LOCALAPPDATA)) {
            throw 'WITNESS_PROBE_NO_PERSISTENT_WINDOWS_PROFILE'
          }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          if ($null -eq $identity -or $null -eq $identity.User) {
            throw 'WITNESS_PROBE_UNKNOWN_WINDOWS_PRINCIPAL'
          }
          $isSystem = $identity.User.Value -eq 'S-1-5-18'
          $ownerKey = Join-Path $env:LOCALAPPDATA 'FORGE-FSA\owner-ed25519.dpapi'
          $ownerKeyVisible = Test-Path -LiteralPath $ownerKey -PathType Leaf
          $localState = Join-Path $env:LOCALAPPDATA 'FORGE-FSA'
          $existingDir = Test-Path -LiteralPath $localState -PathType Container
          if ($existingDir) {
            $item = Get-Item -LiteralPath $localState -Force
            if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'WITNESS_PROBE_PROFILE_SYMLINK'
            }
          }
          Write-Output "D2S_RUNNER_PRINCIPAL_LOCAL_SYSTEM=$($isSystem.ToString().ToUpperInvariant())"
          Write-Output "D2S_RUNNER_PROFILE_OWNER_KEY_VISIBLE=$($ownerKeyVisible.ToString().ToUpperInvariant())"
          Write-Output 'D2S_OFF_CLOUD_WINDOWS_HOST=OBSERVED_NOT_INDEPENDENTLY_ATTESTED'
          Write-Output 'D2S_SIGNING_KEY_CREATED=FALSE'
          Write-Output 'D2S_FIRSTUSE_AUTHORIZED=FALSE'
      - name: D2T enumerate existing Windows runner principals, no secret reads
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'FORGE-CODEX-REMOTE') { throw 'D2T_WRONG_RUNNER' }
          $current = [Security.Principal.WindowsIdentity]::GetCurrent()
          if (-not $current -or -not $current.User) { throw 'D2T_NO_IDENTITY' }
          $services = @(Get-CimInstance -ClassName Win32_Service -ErrorAction Stop | Where-Object {
            $_.Name -match '(?i)actions\\.runner|github.actions.runner' -or
            $_.DisplayName -match '(?i)actions.runner|github actions runner'
          })
          $withIdentity = @($services | Where-Object { -not [string]::IsNullOrWhiteSpace($_.StartName) })
          if ($services.Count -ne $withIdentity.Count) { throw 'D2T_MISSING_SERVICE_ACCOUNT' }
          $identities = @($withIdentity | ForEach-Object { $_.StartName.ToLowerInvariant() } |
            Sort-Object -Unique)
          $self = $current.Name.ToLowerInvariant()
          $matching = @($withIdentity | Where-Object { $_.StartName.ToLowerInvariant() -eq $self }).Count
          Write-Output "D2T_INSTALLED_RUNNER_SERVICES=$($services.Count)"
          Write-Output "D2T_DISTINCT_SERVICE_PRINCIPALS=$($identities.Count)"
          Write-Output "D2T_CURRENT_PRINCIPAL_SERVICE_MATCHES=$matching"
          Write-Output 'D2T_PRIVILEGE_AND_HOST_INDEPENDENCE=NOT_PROVEN'
          Write-Output 'D2T_READONLY_NO_KEYS_ACCESSED=TRUE'
          Write-Output 'D2T_WITNESS_PROVISIONING=NOT_ATTEMPTED'
      - name: D2U classify existing service security boundary, no secret access
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'FORGE-CODEX-REMOTE') { throw 'D2U_WRONG_RUNNER' }
          if ($env:OPENAI_API_KEY) { throw 'D2U_PAID_API_REJECTED' }
          $me=[Security.Principal.WindowsIdentity]::GetCurrent()
          if (-not $me -or -not $me.User) { throw 'D2U_UNKNOWN_PRINCIPAL' }
          $user=[Security.Principal.WindowsPrincipal]::new($me)
          $admin=$user.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $services=@(Get-CimInstance Win32_Service -ErrorAction Stop | Where-Object {
            $_.Name -match '(?i)actions\\.runner|github.actions.runner' -or
            $_.DisplayName -match '(?i)actions.runner|github actions runner'
          })
          $accounts=@($services | ForEach-Object { $_.StartName } | Sort-Object -Unique)
          if ($accounts.Count -lt 1) { throw 'D2U_NO_SERVICE_IDENTITY' }
          $builtins=@($accounts | Where-Object {
            $_ -eq 'LocalSystem' -or $_ -like 'NT AUTHORITY\*' -or $_ -like 'NT SERVICE\*'
          })
          $other=@($accounts | Where-Object { $builtins -notcontains $_ })
          $ownerExists=Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'FORGE-FSA\\owner-ed25519.dpapi') -PathType Leaf
          Write-Output "D2U_UNIQUE_RUNNER_SERVICE_ACCOUNTS=$($accounts.Count)"
          Write-Output "D2U_BUILTIN_HIGH_PRIVILEGE_OR_SHARED_ACCOUNTS=$($builtins.Count)"
          Write-Output "D2U_NAMED_SERVICE_ACCOUNTS=$($other.Count)"
          Write-Output "D2U_JOB_PRINCIPAL_ADMINISTRATOR=$($admin.ToString().ToUpperInvariant())"
          Write-Output "D2U_JOB_PRINCIPAL_OWNER_KEY_PATH_VISIBLE=$($ownerExists.ToString().ToUpperInvariant())"
          Write-Output 'D2U_NO_WITNESS_SIGNER_ADMITTED=TRUE'
          Write-Output 'D2U_REQUIRES_DEDICATED_NONRUNNER_WITNESS_IDENTITY=TRUE'
          Write-Output 'D2U_KEYS_READ_OR_CREATED=ZERO'

      - name: D2V F139 existing controller read-only development readiness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'D2V_WRONG_RUNNER' }
          $task = Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction SilentlyContinue
          if ($null -eq $task) {
            Write-Output 'D2V_F139_TASK=NOT_VISIBLE'
          } else {
            Write-Output ("D2V_F139_TASK="+$task.State.ToString().ToUpperInvariant())
          }
          $db = Join-Path $env:LOCALAPPDATA 'FORGE-F139\\state.sqlite'
          if (-not (Test-Path -LiteralPath $db -PathType Leaf)) {
            Write-Output 'D2V_F139_DATABASE=NOT_VISIBLE_TO_RUNNER_PROFILE'
          } else {
            @'
          import json,os,pathlib,sqlite3,urllib.parse
          p=pathlib.Path(os.environ["LOCALAPPDATA"])/"FORGE-F139"/"state.sqlite"
          conn=sqlite3.connect("file:"+urllib.parse.quote(p.as_posix(),safe="/:")+"?mode=ro",uri=True,timeout=4)
          try:
              conn.execute("PRAGMA query_only=ON")
              row=conn.execute("SELECT source_sha,epoch,enabled,legacy_suspended,head_seq,starts FROM meta WHERE id=1").fetchone()
              if row is None: raise RuntimeError("D2V_F139_META_MISSING")
              print("D2V_F139_SOURCE_SHA="+str(row[0]))
              print("D2V_F139_EPOCH="+str(row[1]))
              print("D2V_F139_ENABLED="+str(row[2]))
              print("D2V_F139_LEGACY_SUSPENDED="+str(row[3]))
              print("D2V_F139_HEAD_SEQ="+str(row[4]))
              print("D2V_F139_STARTS="+str(row[5]))
              print("D2V_CONTROLLER_DB_READONLY=PASS")
          finally: conn.close()
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'D2V_F139_LOCAL_DB_READONLY_FAILED' }
          }
          Write-Output 'D2V_NO_CONTROLLER_OR_SCIENCE_MUTATIONS=TRUE'

      - name: D2W F139 development source-transition eligibility read-only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $db = Join-Path $env:LOCALAPPDATA 'FORGE-F139\\state.sqlite'
          if (-not (Test-Path -LiteralPath $db -PathType Leaf)) { throw 'D2W_NO_F139_LOCAL_DATABASE' }
          @'
          import os,pathlib,sqlite3,urllib.parse,collections
          p=pathlib.Path(os.environ["LOCALAPPDATA"])/"FORGE-F139"/"state.sqlite"
          db=sqlite3.connect("file:"+urllib.parse.quote(p.as_posix(),safe="/:")+"?mode=ro",uri=True,timeout=4)
          try:
              db.execute("PRAGMA query_only=ON")
              meta=db.execute("SELECT source_sha,head_seq,head_hash,enabled,legacy_suspended FROM meta WHERE id=1").fetchone()
              if not meta: raise RuntimeError("D2W_META_MISSING")
              tasks=db.execute("SELECT lane,stage,source_sha,run_id,evidence_sha FROM tasks ORDER BY ticket").fetchall()
              stages=collections.Counter(r[1] for r in tasks)
              print("D2W_F139_TASKS="+str(len(tasks)))
              for state,count in sorted(stages.items()):
                  print("D2W_F139_TASK_STAGE_"+state+"="+str(count))
              print("D2W_F139_HISTORIC_SOURCE_COUNT="+str(len(set(r[2] for r in tasks))))
              print("D2W_F139_ANY_UNVERIFIED="+str(any(r[1]!="VERIFIED" or r[3] is None or r[4] is None for r in tasks)).upper())
              events=db.execute("SELECT kind FROM events ORDER BY seq DESC LIMIT 8").fetchall()
              print("D2W_F139_RECENT_SOURCE_TRANSITIONS="+str(sum(r[0]=="SOURCE_TRANSITION_ADMITTED" for r in events)))
              print("D2W_F139_META_SOURCE="+str(meta[0]))
              print("D2W_F139_LAST_SEQ="+str(meta[1]))
              print("D2W_F139_CONTROLLER_ENABLED="+str(meta[3]))
              print("D2W_F139_HISTORIC_AUTHORITY_SUSPENDED="+str(meta[4]))
              print("D2W_NO_WORKSTATION_MUTATION=TRUE")
          finally: db.close()
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'D2W_READONLY_STATE_FAILED' }

      - name: D2X integrated development schedule activation audit (read only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $target='forge-integrated-synthetic-cycle.yml'
          $meta=& gh api ("repos/"+$repo+"/actions/workflows/"+$target) 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'D2X_WORKFLOW_METADATA_UNREADABLE' }
          $info=$meta | ConvertFrom-Json
          if ($info.path -cne ('.github/workflows/'+$target)) { throw 'D2X_WORKFLOW_IDENTITY_MISMATCH' }
          Write-Host ('D2X_INTEGRATED_WORKFLOW_STATE='+$info.state)
          Write-Host ('D2X_INTEGRATED_WORKFLOW_ID='+$info.id)
          Write-Host 'D2X_READ_ONLY_NO_SCHEDULER_MUTATION=TRUE'

      - name: D2Y identify exact installed F139 checkout read-only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          $actions=@($task.Actions)
          if ($actions.Count -ne 1) { throw 'D2Y_UNEXPECTED_TASK_ACTION_CARDINALITY' }
          $args=[string]$actions[0].Arguments
          $pattern='(?i)-RepositoryRoot\s+["'']?([^"'']+?)["'']?(?=\s+-|$)'
          if ($args -notmatch $pattern) {
            Write-Host 'D2Y_F139_CHECKOUT_PATH=NOT_EXTRACTED_FAIL_CLOSED'
            return
          }
          $root=$Matches[1].Trim()
          if (-not (Test-Path -LiteralPath (Join-Path $root 'f139/local_controller.py') -PathType Leaf)) {
            throw 'D2Y_F139_ACTIVE_SOURCE_NOT_FOUND'
          }
          $head=(& git -C $root rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cnotmatch '^[a-f0-9]{40}$') { throw 'D2Y_F139_GIT_SOURCE_INVALID' }
          $dirty=@(& git -C $root status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw 'D2Y_F139_GIT_STATUS_UNAVAILABLE' }
          $branch=(& git -C $root branch --show-current).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'D2Y_F139_CHECKOUT_BRANCH_INVALID' }
          Write-Host 'D2Y_F139_CHECKOUT_PATH=EXTRACTED_VERIFIED'
          Write-Host ('D2Y_F139_CHECKOUT_HEAD='+$head)
          Write-Host ('D2Y_F139_CHECKOUT_DIRTY='+($dirty.Count -gt 0).ToString().ToUpperInvariant())
          Write-Host ('D2Y_F139_ON_MAIN='+($branch -ceq 'main').ToString().ToUpperInvariant())
          Write-Host 'D2Y_NO_FILES_OR_TASKS_MODIFIED=TRUE'
