name: FORGE F139 one-shot original owner clean-development standdown
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  actions: read

# Existing original-owner Windows runner and owner task ONLY.
# A generic comment, workflow_dispatch or push never triggers this path.
concurrency:
  group: forge-f139-v54-original-owner
  cancel-in-progress: false

jobs:
  original-owner-standdown:
    if: >-
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.actor == 'spoonman136668-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event.action == 'created' &&
      github.event.issue.number == 1830 &&
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == 'spoonman136668-ai' &&
      github.event.comment.user.login == 'spoonman136668-ai' &&
      github.event.comment.author_association == 'OWNER' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-FRESH-DEV-OWNER-STANDDOWN ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 15
    steps:
      - name: Checkout exact protected main with no retained credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate sole original-owner standdown and preserve event1864
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
              $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1' -or $env:OPENAI_API_KEY) {
            throw 'F139_FRESH_OWNER_STANDDOWN_RUNNER_UNQUALIFIED'
          }
          & "$env:GITHUB_WORKSPACE/f139/nci04_fresh_owner_standdown.ps1" -Target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw 'F139_FRESH_OWNER_STANDDOWN_DENIED'
          }
          Write-Output 'F139_ORIGINAL_TASK_RELEASE_WITHOUT_REBIND=PASS'
          Write-Output 'F139_WORKER_DISPATCH_AUTHORIZED=FALSE'
          Write-Output 'F139_SCIENTIFIC_FIRST_USE=FALSE'
