name: F139 i828 repaired original owner source cutover
on:
  push:
    branches: [operations/f139-i828-bytefix-newsource-live-cutover-20261023]
permissions:
  contents: read
  actions: read
concurrency:
  group: f139-original-owner-cutover
  cancel-in-progress: false
jobs:
  original-windows-source-transition:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Transition exact owner event156 to qualified Windows native byte-fix source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $repo='spoonman136668-ai/FORGE'
          $old='58dc4cc483349249c98f1620b51b843b9e927468'
          $target='995cd823f302ed079c90c602f44d5f4ed104c7da'
          $event156='d084f9b314e4c82953b3ed216d43720c517331112abcc9362762435647bca653'
          $taskName='FORGE-F139-UnifiedController'
          if($env:GITHUB_REPOSITORY -cne $repo -or
             $env:GITHUB_REF -cne 'refs/heads/operations/f139-i828-bytefix-newsource-live-cutover-20261023' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:OPENAI_API_KEY){
            throw 'F139_BYTEFIX_CUTOVER_RUNNER_OR_RETRY_UNQUALIFIED'
          }
          $main=(& gh api "repos/$repo/branches/main" --jq '.commit.sha'|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $main -cne $target) {
            throw 'F139_BYTEFIX_PROTECTED_MAIN_NOT_PINNED'
          }
          $pr=(& gh api "repos/$repo/pulls/829" |Out-String|ConvertFrom-Json)
          if($LASTEXITCODE -ne 0 -or -not $pr.merged -or
             $pr.merge_commit_sha -cne $target -or
             $pr.head.sha -cne '455f0838076fdb19cb7d6bee6ef51680fe54c698'){
            throw 'F139_BYTEFIX_QUALIFIED_PR_NOT_MERGED'
          }
          $policy=(& gh api "repos/$repo/issues/807" --jq '.body'|Out-String).Trim()|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $policy.enabled -ne $false -or
             $policy.source_sha -cne $old){
            throw 'F139_BYTEFIX_FEEDER_NOT_QUIESCED'
          }
          $task=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          if([string]$task.State -cne 'Running' -or @($task.Actions).Count -ne 1){
            throw 'F139_BYTEFIX_ORIGINAL_TASK_NOT_SINGLE_RUNNING'
          }
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          $principal=[string]$task.Principal.UserId
          $sid=if($principal -match '^S-1-'){$principal}else{
            (New-Object Security.Principal.NTAccount($principal)).Translate(
              [Security.Principal.SecurityIdentifier]).Value
          }
          if($sid -cne $who.User.Value){throw 'F139_BYTEFIX_OWNER_SID_DRIFT'}
          $opts=[string]$task.Actions[0].Arguments
          function Arg([string]$name){
            $m=[regex]::Match($opts,'(?i)(?:^|\s)-'+$name+'\s+"([^"]+)"')
            if(-not $m.Success){throw ('F139_BYTEFIX_MISSING_TASK_OPTION_'+$name)}
            return $m.Groups[1].Value
          }
          $root=Arg 'RepositoryRoot'
          $db=Arg 'Database'
          $python=Arg 'PythonExe'
          if([IO.Path]::GetFileName((Arg 'File')) -cne 'Run-FORGE-F139.ps1' -or
             [IO.Path]::GetFullPath($db) -ine
               [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'FORGE-F139\state.sqlite'))){
            throw 'F139_BYTEFIX_ORIGINAL_DB_OR_WRAPPER_DRIFT'
          }
          $head=(& git.exe -C $root rev-parse HEAD |Out-String).Trim()
          $dirty=(& git.exe -C $root status --porcelain --untracked-files=all|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne $old -or $dirty.Length -ne 0){
            throw 'F139_BYTEFIX_OLD_OWNER_CHECKOUT_UNQUALIFIED'
          }
          $read=@'
          import json,pathlib,sqlite3,sys
          p=pathlib.Path(sys.argv[1]).resolve(strict=True)
          con=sqlite3.connect(p.as_uri()+"?mode=ro",uri=True,timeout=20)
          con.row_factory=sqlite3.Row
          try:
              con.execute('PRAGMA query_only=ON')
              m=dict(con.execute(
                  'SELECT source_sha,head_seq,head_hash,enabled,legacy_suspended FROM meta WHERE id=1').fetchone())
              counts={str(x["stage"]):x["n"] for x in con.execute(
                  'SELECT stage,COUNT(*) AS n FROM tasks GROUP BY stage')}
              status={k:int(counts.get(k,0)) for k in
                      ("QUARANTINED","WAIT_PROVIDER","START_RISK","READY")}
              print(json.dumps({'meta':m,'stages':status},sort_keys=True))
          finally:con.close()
          '@
          $raw=(& $python -B -c $read $db|Out-String).Trim()
          if($LASTEXITCODE -ne 0){throw 'F139_BYTEFIX_LIVE_SQLITE_READ_FAILED'}
          $state=$raw|ConvertFrom-Json
          if($state.meta.source_sha -cne $old -or
             [long]$state.meta.head_seq -ne 156 -or
             $state.meta.head_hash -cne $event156 -or
             [int]$state.meta.enabled -ne 1 -or
             [int]$state.meta.legacy_suspended -ne 1 -or
             [int]$state.stages.QUARANTINED -ne 8 -or
             [int]$state.stages.WAIT_PROVIDER -ne 0 -or
             [int]$state.stages.START_RISK -ne 0 -or
             [int]$state.stages.READY -ne 0){
            throw 'F139_BYTEFIX_EXACT_EIGHT_NEGATIVE_EVENT156_DRIFT'
          }
          function OriginalProcesses {
            @(Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction Stop |
              Where-Object {$_.CommandLine -and
                $_.CommandLine.Contains('f139.local_controller') -and
                $_.CommandLine.Contains($db)})
          }
          if(@(OriginalProcesses).Count -ne 1){
            throw 'F139_BYTEFIX_OWNER_PRESTOP_PROCESS_DRIFT'
          }
          $approvalPath=Join-Path $env:RUNNER_TEMP 'f139-bytefix-source-transition.json'
          $activatePath=Join-Path $env:RUNNER_TEMP 'f139-bytefix-native-activation.json'
          $restore=$false
          try{
            $restore=$true
            Stop-ScheduledTask -TaskName $taskName -ErrorAction Stop
            Disable-ScheduledTask -TaskName $taskName -ErrorAction Stop | Out-Null
            $deadline=(Get-Date).AddSeconds(45)
            do{
              Start-Sleep -Milliseconds 500
              $alive=@(OriginalProcesses)
            }while($alive.Count -gt 0 -and (Get-Date) -lt $deadline)
            if($alive.Count -ne 0 -or
               [string](Get-ScheduledTask -TaskName $taskName).State -cne 'Disabled'){
              throw 'F139_BYTEFIX_ORIGINAL_OWNER_NOT_QUIESCED'
            }
            $preRaw=(& $python -B -c $read $db|Out-String).Trim()
            if($LASTEXITCODE -ne 0){throw 'F139_BYTEFIX_QUIESCED_READ_FAILED'}
            $pre=$preRaw|ConvertFrom-Json
            if($pre.meta.source_sha -cne $old -or
               $pre.meta.head_hash -cne $event156 -or
               [long]$pre.meta.head_seq -ne 156){
              throw 'F139_BYTEFIX_SOURCE_OR_HEAD_MOVED_DURING_QUIESCENCE'
            }
            & git.exe -C $root fetch --no-tags origin main
            if($LASTEXITCODE -ne 0){throw 'F139_BYTEFIX_FETCH_NEW_MAIN_FAILED'}
            $fetched=(& git.exe -C $root rev-parse FETCH_HEAD|Out-String).Trim()
            if($fetched -cne $target){throw 'F139_BYTEFIX_FETCH_SOURCE_NOT_EXPECTED'}
            & git.exe -C $root switch --detach $target
            if($LASTEXITCODE -ne 0){throw 'F139_BYTEFIX_EXACT_CHECKOUT_FAILED'}
            if(((& git.exe -C $root rev-parse HEAD|Out-String).Trim()) -cne $target -or
               ((& git.exe -C $root status --porcelain --untracked-files=all|Out-String).Trim()).Length -ne 0){
              throw 'F139_BYTEFIX_EXACT_NEW_CHECKOUT_NOT_CLEAN'
            }
            $proof=@'
          import json,pathlib,sys
          from f139.local_controller import Database,require
          from f139.nci04_owner_ledger import SEALED_OWNER_PREFIX_HEAD
          db=Database(pathlib.Path(sys.argv[1]).resolve(strict=True))
          try:
              db.verify()
              m=db.meta()
              require(m["source_sha"]==sys.argv[2] and
                      m["head_seq"]==156 and m["head_hash"]==sys.argv[3]
                      and db.active() is None and db.ready() is None
                      and len(list(db.conn.execute(
                          "SELECT 1 FROM tasks WHERE stage='QUARANTINED'")))==8
                      and len(db.verified_native_provider_failures())==6,
                      "F139_BYTEFIX_ORIGINAL_NEGATIVE_HISTORY_NOT_VALID")
              approval={
                  "schema":"forge.f139.nci04.owner-source-transition-approval.v1",
                  "from_source_sha":m["source_sha"],
                  "to_source_sha":sys.argv[4],
                  "expected_event_head_sha256":m["head_hash"],
                  "sealed_23_event_head_sha256":SEALED_OWNER_PREFIX_HEAD,
                  "native_development_only":True,
                  "scientific_first_use":False,"new_controller":False,
                  "paid_api_calls":0}
              pathlib.Path(sys.argv[5]).write_text(
                  json.dumps(approval,sort_keys=True),encoding="utf-8")
              print("F139_BYTEFIX_SOURCE_APPROVAL_EXACT=PASS")
          finally:db.close()
          '@
            Push-Location -LiteralPath $root
            try{
              & $python -B -c $proof $db $old $event156 $target $approvalPath
              if($LASTEXITCODE -ne 0){throw 'F139_BYTEFIX_OWNER_SOURCE_PROOF_FAILED'}
              & $python -B -m f139.local_controller --db $db transition-qualified-native --approval $approvalPath
              if($LASTEXITCODE -ne 0){throw 'F139_BYTEFIX_SOURCE_TRANSITION_REJECTED'}
            }finally{Pop-Location}
            $movedRaw=(& $python -B -c $read $db|Out-String).Trim()
            if($LASTEXITCODE -ne 0){throw 'F139_BYTEFIX_READ_AFTER_TRANSITION_FAILED'}
            $moved=$movedRaw|ConvertFrom-Json
            if($moved.meta.source_sha -cne $target -or
               [long]$moved.meta.head_seq -ne 157){
              throw 'F139_BYTEFIX_SOURCE_TRANSITION_NOT_EVENT157'
            }
            $approval=[ordered]@{
              schema='forge.f139.nci04.owner-native-approval.v1'
              source_sha=$target
              expected_event_head_sha256=[string]$moved.meta.head_hash
              native_development_approved=$true
              scientific_first_use=$false
              create_controller=$false
              paid_api_calls=0
            }
            [IO.File]::WriteAllText($activatePath,($approval|ConvertTo-Json -Compress),
              [Text.UTF8Encoding]::new($false))
            Push-Location -LiteralPath $root
            try{
              & $python -B -m f139.local_controller --db $db activate-native --approval $activatePath
              if($LASTEXITCODE -ne 0){throw 'F139_BYTEFIX_NATIVE_ACTIVATION_REJECTED'}
              $verify=@'
          import pathlib,sys
          from f139.local_controller import Database,require
          from f139.nci04_owner_ledger import verify_native_activation
          db=Database(pathlib.Path(sys.argv[1]).resolve(strict=True))
          try:
              db.verify()
              m=db.meta()
              require(m["source_sha"]==sys.argv[2] and
                      m["head_seq"]==158 and verify_native_activation(db)
                      and db.active() is None and db.ready() is None
                      and len(list(db.conn.execute(
                          "SELECT 1 FROM tasks WHERE stage='QUARANTINED'")))==8,
                      "F139_BYTEFIX_SOURCE_ACTIVATION_NOT_FULLY_VERIFIED")
              print("F139_ORIGINAL_BYTEFIX_EVENT158_LEDGER=PASS")
              print("F139_BYTEFIX_NEW_EVENT_HEAD="+m["head_hash"])
              print("F139_SCIENTIFIC_FIRST_USE=FALSE")
          finally:db.close()
          '@
              & $python -B -c $verify $db $target
              if($LASTEXITCODE -ne 0){throw 'F139_BYTEFIX_FINAL_ORIGINAL_LEDGER_INVALID'}
            }finally{Pop-Location}
            Write-Output 'F139_BYTEFIX_ORIGINAL_OWNER_SOURCE_TRANSITION=PASS'
            Write-Output 'F139_BYTEFIX_ORIGINAL_OWNER_NATIVE_ACTIVATION=PASS'
            Write-Output 'F139_BYTEFIX_EIGHT_NEGATIVES_PRESERVED=TRUE'
          }finally{
            Remove-Item -LiteralPath $approvalPath,$activatePath -Force -ErrorAction SilentlyContinue
            if($restore){
              if(@(OriginalProcesses).Count -ne 0){
                throw 'F139_BYTEFIX_ORIGINAL_CHILD_STILL_ALIVE_KEEP_DISABLED'
              }
              $postRaw=(& $python -B -c $read $db|Out-String).Trim()
              if($LASTEXITCODE -ne 0){throw 'F139_BYTEFIX_FINAL_SOURCE_READ_FAILED'}
              $post=$postRaw|ConvertFrom-Json
              $ownerHead=(& git.exe -C $root rev-parse HEAD|Out-String).Trim()
              if($post.meta.source_sha -cne $target -and
                 $post.meta.source_sha -cne $old){
                throw 'F139_BYTEFIX_UNEXPECTED_LEDGER_SOURCE_KEEP_DISABLED'
              }
              if($post.meta.source_sha -cne $ownerHead){
                if($post.meta.source_sha -cne $old){
                  throw 'F139_BYTEFIX_NEW_SOURCE_NOT_CHECKED_OUT_KEEP_DISABLED'
                }
                & git.exe -C $root switch --detach $old
                if($LASTEXITCODE -ne 0){throw 'F139_BYTEFIX_ROLLBACK_OLD_SOURCE_FAILED'}
                Write-Output 'F139_BYTEFIX_OLD_CHECKOUT_RESTORED_AFTER_FAILED_CUTOVER'
              }
              Enable-ScheduledTask -TaskName $taskName -ErrorAction Stop | Out-Null
              Start-ScheduledTask -TaskName $taskName -ErrorAction Stop
              $until=(Get-Date).AddSeconds(45)
              do{
                Start-Sleep -Milliseconds 500
                $task=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
                $alive=@(OriginalProcesses)
                $more=((([string]$task.State -cne 'Running') -or
                        ($alive.Count -ne 1)) -and ((Get-Date) -lt $until))
              }while($more)
              if([string]$task.State -cne 'Running' -or $alive.Count -ne 1){
                throw 'F139_BYTEFIX_SAME_ORIGINAL_OWNER_RESTART_FAILED'
              }
              Write-Output 'F139_BYTEFIX_SAME_ORIGINAL_OWNER_RESTART=PASS'
            }
          }
