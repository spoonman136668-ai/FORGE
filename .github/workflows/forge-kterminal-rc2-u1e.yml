name: RC2-U1E K-Terminal combined Windows qualification
on:
  push:
    branches: [qualification/kterminal-rc2-u1e-combined-20261021]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 39
    env:
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '1'
      GOFLAGS: '-p=1'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: FORGE source and runner isolation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-rc2-u1e-combined-20261021' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:RUNNER_OS -cne 'Windows' -or
              $env:K_TERMINAL_EXECUTION_MODE -cne 'PAPER') { throw 'RC2_U1E_ISOLATION_FAILED' }
          $diff=@(git diff --name-only 5662e3586bc9d12c90033b7c0344ca65ea1ad2a0 HEAD)
          if (($diff -join '|') -cne '.github/workflows/forge-kterminal-rc2-u1e.yml') { throw 'RC2_U1E_FORGE_SCOPE_DRIFT' }
          foreach ($n in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
                'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET')) {
            if (-not [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($n))) { throw 'RC2_U1E_BROKER_ENV_BLOCKED' }
          }
          Write-Host 'RC2_U1E_ISOLATION=PASS'
      - name: Checkout pinned private combined K-Terminal
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: ca0f2ce5c518620ab50f6f75bfa12d25f2b55de1
          path: kterminal-private
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Original source, changed-file scope and PowerShell parser
        shell: pwsh
        working-directory: kterminal-private
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne 'ca0f2ce5c518620ab50f6f75bfa12d25f2b55de1') { throw 'RC2_U1E_SOURCE_DRIFT' }
          $expected=@('dashboard-ui.ps1','pkg/p5-runtime-latency-observer.go','tools/graphify/doc.go',
              'tools/graphify/g27_type_calls.go','tools/graphify/g30_type_calls.go',
              'tools/graphify/g31_interpackage_calls.go','tools/graphify/g44_ast_call_witness.go')
          $actual=@(git diff --name-only eb5d225ae73b698a59c68d840daf1ec678e1a0ec HEAD)
          if (($actual -join '|') -cne ($expected -join '|')) { throw 'RC2_U1E_SEVEN_FILE_SCOPE_FAIL' }
          $t=$null;$e=$null
          [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path 'dashboard-ui.ps1').Path,[ref]$t,[ref]$e) | Out-Null
          if (@($e).Count -gt 0) { throw 'RC2_U1E_WPF_PARSE_FAIL' }
          Write-Host 'RC2_U1E_SCOPE_AND_WPF_PARSER=PASS'
      - name: Compile all Go packages including Graphify
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          go version | grep -q 'go1.26.5 windows/amd64'
          if ! go test -run '^$' -count=1 -p=1 -parallel=1 -timeout=8m ./... > "$RUNNER_TEMP/rc2-u1e-compile-private" 2>&1; then
            echo RC2_U1E_COMPILE=FAIL
            exit 1
          fi
          echo RC2_U1E_COMPILE=PASS
      - name: Focused P5 tests
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          if ! go test -count=1 -p=1 -parallel=1 -timeout=9m '-run=^TestP5' ./pkg > "$RUNNER_TEMP/rc2-u1e-p5-private" 2>&1; then
            echo RC2_U1E_P5_FOCUSED=FAIL
            exit 1
          fi
          echo RC2_U1E_P5_FOCUSED=PASS
      - name: Full Windows regression with bounded failing test names
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          set +e
          go test -json -count=1 -p=1 -parallel=1 -timeout=22m ./... > "$RUNNER_TEMP/rc2-u1e-full-private.jsonl" 2> "$RUNNER_TEMP/rc2-u1e-stderr-private"
          rc=$?
          set -e
          export RC2_U1E_EXIT="$rc"
          python -B - <<'PY'
          import json,os,pathlib,re,sys
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'rc2-u1e-full-private.jsonl'
          if not p.is_file() or p.stat().st_size>120000000:
              print('RC2_U1E_LOG_BOUND=FAIL');sys.exit(2)
          failed=set();packages=0;parse=0
          for line in p.open(encoding='utf-8',errors='replace'):
              try: e=json.loads(line)
              except ValueError:parse+=1;continue
              if e.get('Action')!='fail':continue
              name=e.get('Test')
              if not isinstance(name,str):packages+=1;continue
              root=name.split('/')[0]
              if re.fullmatch(r'Test[A-Za-z0-9_]{1,100}',root):failed.add(root)
          if int(os.environ['RC2_U1E_EXIT']):
              print('RC2_U1E_FULL_REGRESSION=FAIL_NOT_WAIVED')
              print('RC2_U1E_FAILED_TEST_ROOTS='+(','.join(sorted(failed)[:8]) if failed else 'NOT_REPORTED'))
              print('RC2_U1E_PACKAGE_FAILURES='+str(packages))
              print('RC2_U1E_PARSE_FAILURES='+str(parse))
              sys.exit(1)
          if failed or packages or parse:
              print('RC2_U1E_STRUCTURED_LOG_INCONSISTENT');sys.exit(2)
          print('RC2_U1E_FULL_REGRESSION=PASS')
          PY
      - name: Vet and stopped Windows build
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          if ! go vet ./... > "$RUNNER_TEMP/rc2-u1e-vet-private" 2>&1; then
            echo RC2_U1E_VET=FAIL
            exit 1
          fi
          echo RC2_U1E_VET=PASS
          if ! go build ./... > "$RUNNER_TEMP/rc2-u1e-build-private" 2>&1; then
            echo RC2_U1E_BUILD=FAIL
            exit 1
          fi
          echo RC2_U1E_STOPPED_BUILD=PASS
          echo RC2_U1E_SEVEN_SECOND_FIELD_LATENCY=NOT_MEASURED
