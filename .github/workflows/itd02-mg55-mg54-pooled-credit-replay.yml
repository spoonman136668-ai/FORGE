name: ITD-02 MG55 read-only exact MG54 pooled goal-credit actor decision replay
on:
  push:
    branches: [research/itd02-mg55-mg54-pooled-credit-cold-replay-20261029]
permissions:
  contents: read
  actions: read
jobs:
  frozen-source-only-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact LF original-source settings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify frozen MG55 scope and both original native policy sources untouched
        shell: pwsh
        run: |
          git merge-base --is-ancestor 07dbe11894f8858ad3ba358263d06128187cf5df $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'MG55_FROZEN_METRIC_NOT_ANCESTOR' }
          $changed=@(git diff --name-only d14ed35e79ba85e3abb747803fd4c6a5ee5b66c9 $env:GITHUB_SHA)
          $expected=@('research/lcrm01/mg55_mg54_pooled_credit_audit_prereg.json',
            'research/lcrm01/mg55_mg54_pooled_credit_audit.py',
            '.github/workflows/itd02-mg55-mg54-pooled-credit-replay.yml')
          if (@(Compare-Object $changed $expected).Count -ne 0) { throw 'MG55_UNAUTHORIZED_SOURCE_SCOPE_CHANGE' }
          python -B research/lcrm01/mg55_mg54_pooled_credit_audit.py --preflight
          if ($LASTEXITCODE -ne 0) { throw 'MG55_READONLY_PREFLIGHT_FAILED' }
          if (git status --porcelain --untracked-files=all) { throw 'MG55_SOURCE_WORKTREE_NOT_CLEAN' }
          Write-Host MG55_FROZEN_READONLY_DUAL_OS_SOURCE_PREFLIGHT_PASS_NO_SCIENCE
  archived-selected-source-only-audit:
    needs: frozen-source-only-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Original LF checkout configuration
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch exact already-exposed MG54 original source archive without stepping worlds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mg55"
          curl --fail --silent --show-error --location --max-time 120 --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/spoonman136668-ai/FORGE/actions/artifacts/12944275150/zip" \
            --output "$RUNNER_TEMP/mg55/mg54-authenticated.zip"
          test "$(stat -c%s "$RUNNER_TEMP/mg55/mg54-authenticated.zip")" -lt 20000000
          printf '%s  %s\n' ef5a7882dd0775754c359d68da1e7248f39a50f90a55241ccb0757548ca480b1 "$RUNNER_TEMP/mg55/mg54-authenticated.zip" | sha256sum --check --status
          echo MG55_ORIGINAL_EXPOSED_ARCHIVE_CUSTODY_PASS_NO_NEW_FARAMA_WORLD
      - name: Replay actual MG54 own-selected decisions and source cold checkpoints
        shell: bash
        run: |
          set -euo pipefail
          python -B research/lcrm01/mg55_mg54_pooled_credit_audit.py \
            --archive "$RUNNER_TEMP/mg55/mg54-authenticated.zip" \
            --output "$RUNNER_TEMP/mg55/report.json" \
            > "$RUNNER_TEMP/mg55/diagnostic.log"
          grep -F 'MG55_TWO_INDEPENDENT_ORIGINAL_COLD_POLICY_REPLAYS_MATCH' "$RUNNER_TEMP/mg55/diagnostic.log"
          grep -F 'MG55_IMMUTABLE_MG54_POOLED_CREDIT_EXACT_DECISION_REPLAY_PASS_NO_SCIENCE' "$RUNNER_TEMP/mg55/diagnostic.log"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo MG55_READONLY_FULL_SOURCE_REPLAY_COMPLETED_NO_FARAMA_STEP_OR_SCIENCE_PROMOTION
      - name: Preserve compact evidence receipt in original FORGE GitHub run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mg55-mg54-original-source-pooled-decision-audit
          path: |
            ${{ runner.temp }}/mg55/report.json
            ${{ runner.temp }}/mg55/diagnostic.log
          if-no-files-found: warn
          retention-days: 30
