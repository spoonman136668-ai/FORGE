          assert review["historical_task_mismatches"]==result["validation_task_mismatches"]
          assert review["model_sha256"]==result["frozen_model_sha256"]
          assert review["best_fixed_historical_mismatches"]==66
          assert result["scientific_winner_selected"] is False
          assert result["scientific_dispatch_authorized"] is False
          assert result["new_originals"]==result["first_use_claims"]==0
          assert review["new_first_use_claims"]==0
          print("F14_AUTOMATIC_FACTORIZED_PUBLIC_TASK_VALUE=PASS")
          print("F14_INDEPENDENT_RECOMPUTED_SOURCE_REVIEW=PASS")
          print("F14_HISTORICAL_TASK_MISMATCHES="+str(result["validation_task_mismatches"]))
          print("F14_FRESH_FIRST_USE=ZERO")
