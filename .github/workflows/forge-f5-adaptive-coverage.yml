name: FORGE F5 to F6 autonomous engineering qualification
on:
  push:
    branches: [engineering/f9-learned-public-timing-r1]
    paths:
      - 'research/f5_native_coverage/**'
      - 'research/f6_uncertainty/**'
      - 'research/f7_early_coverage/**'
      - 'research/f8_matched_timing/**'
      - 'research/f9_learned_timing/**'
      - 'f5custody/**'
      - 'cmd/forge-f5-firstuse-audit/**'
      - '.github/workflows/forge-f5-adaptive-coverage.yml'
      - '.github/workflows/qualify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/f5_native_coverage/**'
      - 'research/f6_uncertainty/**'
      - 'research/f7_early_coverage/**'
      - 'research/f8_matched_timing/**'
      - 'research/f9_learned_timing/**'
      - 'f5custody/**'
      - 'cmd/forge-f5-firstuse-audit/**'
      - '.github/workflows/forge-f5-adaptive-coverage.yml'
      - '.github/workflows/qualify.yml'
permissions:
  contents: read
jobs:
  independent-policy-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Qualify signed custody rejection and source-content lock
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/f5_native_coverage -p 'test_*.py' -v
          python -B -m unittest discover -s research/f6_uncertainty -p 'test_*.py' -v
          python -B -m unittest discover -s research/f7_early_coverage -p 'test_*.py' -v
          python -B -m unittest discover -s research/f8_matched_timing -p 'test_*.py' -v
          python -B -m unittest discover -s research/f9_learned_timing -p 'test_*.py' -v
          python -B research/f5_native_coverage/verify_source_lock.py --repo-root . --out "$RUNNER_TEMP/f5-source-content-review.json"
          go test ./f5custody ./cmd/forge-f5-firstuse-audit -count=1 -v
          if go run ./cmd/forge-f5-firstuse-audit; then
            echo "UNSIGNED_EMPTY_CUSTODY_WRONGLY_ACCEPTED"
            exit 1
          fi
          python -B -m compileall -q research/f5_native_coverage
          echo F5_PUBLIC_ONLY_MEMORIED_ADAPTATION_TESTS=PASS
          echo F5_SIGNED_ALL_LANE_CUSTODY_NEGATIVE_ENFORCEMENT=PASS
          echo F5_SOURCE_CONTENT_PIN=PASS
          echo F5_SCIENTIFIC_SOURCE_FREEZE=BLOCKED_NO_AUTHENTICATED_COHORT
          echo F5_PROSPECTIVE_FIRST_USE=ZERO
      - uses: actions/upload-artifact@v4
        with:
          name: forge-f5-source-content-audit-${{ matrix.os }}
          path: ${{ runner.temp }}/f5-source-content-review.json
          if-no-files-found: error
          retention-days: 90
  pinned-real-history:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/Yggdrasil
          ref: 5797a257a75fe139313e8486cd1a1ae79c44b148
          path: pinned-yggdrasil-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute F5 public adaptive sensing ONLY on previously used F3 development data
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-yggdrasil-source rev-parse HEAD)" = 5797a257a75fe139313e8486cd1a1ae79c44b148
          test "$(git -C pinned-yggdrasil-source status --porcelain)" = ""
          python -B research/f5_native_coverage/coverage_geometry.py > "$RUNNER_TEMP/f5-geometry.json"
          python -B - "$RUNNER_TEMP/f5-geometry.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m["optimal_offsets"]==[0,1,4,6]
          assert m["optimal"]["worst_pair_exposure"]==7
          assert m["baseline"]["worst_pair_exposure"]==5
          assert m["enumerated_offset_patterns"]==286
          assert m["nonanchor_pair_count"]==91
          assert m["new_first_use_claims"]==0
          assert m["prospective_scientific_execution_authorized"] is False
          print("F5_FULL_NONORACLE_MINIMAX_COVERAGE=PASS")
          PY
          python -B research/f5_native_coverage/run_historical.py --source-root pinned-yggdrasil-source --out "$RUNNER_TEMP/f5-historical-evidence.json"
          python -B research/f5_native_coverage/verify_historical.py --record "$RUNNER_TEMP/f5-historical-evidence.json" --source-root pinned-yggdrasil-source --out "$RUNNER_TEMP/f5-historical-witness.json"
          python -B - "$RUNNER_TEMP/f5-historical-evidence.json" "$RUNNER_TEMP/f5-historical-witness.json" <<'PY'
          import json,sys,copy
          sys.path.insert(0,"research/f5_native_coverage")
          from verify_historical import replay
          r=json.load(open(sys.argv[1]))
          w=json.load(open(sys.argv[2]))
          assert w["status"]=="HISTORICAL_SOURCE_REPLAY_ONLY_NO_NEW_FIRST_USE"
          assert w["replayed_records"]==768
          assert not w["scientific_authority"]
          assert not r["scientific_winner_selected"]
          assert r["new_f5_dev_cohort_accesses"]==0
          assert r["new_f5_sealed_cohort_accesses"]==0
          assert r["first_use_claims_consumed"]==0
          forged=copy.deepcopy(r)
          forged["records"][0]["pre_mismatch"]+=1
          try:replay(forged,"pinned-yggdrasil-source")
          except ValueError:pass
          else:raise AssertionError("F5_METRIC_TAMPER_ACCEPTED")
          altered=copy.deepcopy(r)
          altered["records"][0]["sample_trace"]["addresses"][3]=[8,11]
          try:replay(altered,"pinned-yggdrasil-source")
          except ValueError:pass
          else:raise AssertionError("F5_HIDDEN_SENSOR_TAMPER_ACCEPTED")
          injected=copy.deepcopy(r)
          injected["historical_seeds"][-1]=67640
          try:replay(injected,"pinned-yggdrasil-source")
          except ValueError:pass
          else:raise AssertionError("F5_FRESH_SEED_ACCEPTED")
          print("F5_ACTUAL_PUBLIC_READ_REPLAY_AND_NEGATIVE_ENFORCEMENT=PASS")
          print("F5_FIRST_USE=ZERO")
          PY
      - name: Autonomously prepare independently reviewed successor from actual source replay
        shell: bash
        run: |
          set -euo pipefail
          python -B research/f5_native_coverage/auto_successor.py \
            --record "$RUNNER_TEMP/f5-historical-evidence.json" \
            --witness "$RUNNER_TEMP/f5-historical-witness.json" \
            --geometry "$RUNNER_TEMP/f5-geometry.json" \
            --options research/f5_native_coverage/successor_options.json \
            --out "$RUNNER_TEMP/f5-automatic-successor.json"
          python -B research/f5_native_coverage/verify_auto_successor.py \
            --proposal "$RUNNER_TEMP/f5-automatic-successor.json" \
            --record "$RUNNER_TEMP/f5-historical-evidence.json" \
            --witness "$RUNNER_TEMP/f5-historical-witness.json" \
            --geometry "$RUNNER_TEMP/f5-geometry.json" \
            --options research/f5_native_coverage/successor_options.json \
            --out "$RUNNER_TEMP/f5-automatic-successor-review.json"
          python -B - "$RUNNER_TEMP/f5-automatic-successor.json" "$RUNNER_TEMP/f5-automatic-successor-review.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          review=json.load(open(sys.argv[2]))
          assert s["disposition"]=="SUCCESSOR_PREPARED_CUSTODY_BLOCKED_NO_ORIGINAL"
          assert review["status"]=="PROPOSAL_HONESTLY_PREPARED_NO_ORIGINAL_AUTHORITY"
          assert review["selected_id"]==s["selected"]["proposal_id"]
          assert s["scientific_dispatch_authorized"] is False
          assert s["new_scientific_originals"]==0 and s["new_first_use_claims"]==0
          assert s["new_seed_allocations"]==0 and s["paid_api_calls"]==0
          assert s["not_a_scientific_winner"] is True
          print("F5_EVIDENCE_TO_SUCCESSOR_NO_MANUAL_HANDOFF=PASS")
          print("F5_SCIENCE_AUTHORITY_AND_FIRST_USE=ZERO")
          PY
      - name: Autonomously fit F6 learned uncertainty and independently replay used-F3 validation
        shell: bash
        run: |
          set -euo pipefail
          python -B research/f6_uncertainty/run_engineering.py \
            --parent "$RUNNER_TEMP/f5-historical-evidence.json" \
            --successor "$RUNNER_TEMP/f5-automatic-successor.json" \
            --source-root pinned-yggdrasil-source \
            --out "$RUNNER_TEMP/f6-trained-engineering.json"
          python -B research/f6_uncertainty/verify_engineering.py \
            --record "$RUNNER_TEMP/f6-trained-engineering.json" \
            --parent "$RUNNER_TEMP/f5-historical-evidence.json" \
            --successor "$RUNNER_TEMP/f5-automatic-successor.json" \
            --source-root pinned-yggdrasil-source \
            --out "$RUNNER_TEMP/f6-independent-review.json"
          python -B - "$RUNNER_TEMP/f6-trained-engineering.json" "$RUNNER_TEMP/f6-independent-review.json" <<'PY'
          import sys,json
          model=json.load(open(sys.argv[1]))
          reviewer=json.load(open(sys.argv[2]))
          assert model["model"]["training_seed_ids"]==[67204,67205]
          assert model["model"]["untouched_validation_seed_ids"]==[67206,67207]
          assert len(model["validation_records"])==96
          assert reviewer["validation_cases"]==96
          assert reviewer["status"]=="F3_USED_SPLIT_REPLAY_QUALIFIED_NOT_PROSPECTIVE_SCIENCE"
          assert model["new_cohort_accesses"]==0 and model["new_first_use_claims"]==0
          assert model["new_originals"]==0 and model["scientific_authority"] is False
          assert reviewer["scientific_dispatch_authorized"] is False
          print("FORGE_F5_AUTOMATIC_F6_METHOD_ENGINEERING=PASS")
          print("FORGE_F6_INDEPENDENT_REAL_SOURCE_REPLAY=PASS")
          print("FORGE_F6_SCIENTIFIC_FIRST_USE=ZERO")
          PY
      - name: Autonomously convert reviewed F6 zero-recheck finding into F7 real source engineering
        shell: bash
        run: |
          set -euo pipefail
          python -B research/f7_early_coverage/advance.py \
            --f6 "$RUNNER_TEMP/f6-trained-engineering.json" \
            --f6-review "$RUNNER_TEMP/f6-independent-review.json" \
            --source-root pinned-yggdrasil-source \
            --out "$RUNNER_TEMP/f7-automatic-engineering.json"
          python -B research/f7_early_coverage/verify.py \
            --f7 "$RUNNER_TEMP/f7-automatic-engineering.json" \
            --f6 "$RUNNER_TEMP/f6-trained-engineering.json" \
            --f6-review "$RUNNER_TEMP/f6-independent-review.json" \
            --source-root pinned-yggdrasil-source \
            --out "$RUNNER_TEMP/f7-independent-review.json"
          python -B - "$RUNNER_TEMP/f7-automatic-engineering.json" "$RUNNER_TEMP/f7-independent-review.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          reviewer=json.load(open(sys.argv[2]))
          assert result["status"]=="F3_REUSED_ENGINEERING_SCIENTIFIC_CUSTODY_BLOCKED"
          assert result["parent_trigger"]=="F6_MEMORY_INACTIVE_VALIDATED_F3_USED"
          assert reviewer["status"]=="F3_REUSED_REAL_SOURCE_REPLAY_PASS_NOT_SCIENCE"
          assert reviewer["replayed_trial_arms"]==192
          assert result["geometry"]["min_visible_starts"]==9
          assert result["new_originals"]==result["new_first_use_claims"]==0
          assert result["new_cohort_accesses"]==result["paid_api_calls"]==0
          assert result["scientific_dispatch_authorized"] is False
          assert reviewer["scientific_dispatch_authorized"] is False
          assert result["no_scientific_winner_selected"] is True
          print("F7_AUTONOMOUS_F6_NEGATIVE_TO_QUALIFIED_METHOD=PASS")
          print("F7_NEW_SCIENTIFIC_FIRST_USE=ZERO")
          PY
      - name: Autonomously attribute F7 timing effect with matched physical sensor sets
        shell: bash
        run: |
          set -euo pipefail
          python -B research/f8_matched_timing/advance.py \
            --parent "$RUNNER_TEMP/f7-automatic-engineering.json" \
            --witness "$RUNNER_TEMP/f7-independent-review.json" \
            --source-root pinned-yggdrasil-source \
            --out "$RUNNER_TEMP/f8-timing-engineering.json"
          python -B research/f8_matched_timing/verify.py \
            --record "$RUNNER_TEMP/f8-timing-engineering.json" \
            --parent "$RUNNER_TEMP/f7-automatic-engineering.json" \
            --witness "$RUNNER_TEMP/f7-independent-review.json" \
            --source-root pinned-yggdrasil-source \
            --out "$RUNNER_TEMP/f8-timing-independent-review.json"
          python -B - "$RUNNER_TEMP/f8-timing-engineering.json" "$RUNNER_TEMP/f8-timing-independent-review.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          witness=json.load(open(sys.argv[2]))
          assert result["schema"]=="forge.f8.automatic-f7-matched-timing-engineering.v1"
          assert result["parent_mechanism_uncertainty"]=="F7_EARLY_GAIN_COULD_BE_SENSOR_COUNT_OR_TIMING"
          assert result["matched_physical_sensor_sets"] is True
          assert witness["matched_set_comparisons"]==96
          assert witness["replayed_trial_arms"]==192
          assert witness["status"]=="USED_F3_REAL_SOURCE_REPLAY_ONLY_NO_SCIENCE"
          assert result["new_originals"]==result["new_first_use_claims"]==0
          assert result["new_development_or_sealed_uses"]==result["paid_api_calls"]==0
          assert result["scientific_dispatch_authorized"] is False
          assert witness["scientific_dispatch_authorized"] is False
          print("FORGE_F7_AUTOMATIC_F8_METHOD_ATTRIBUTION=PASS")
          print("FORGE_F8_PROSPECTIVE_FIRST_USE=ZERO")
          PY
      - name: Automatically learn F9 observation order from verified F8 timing evidence
        shell: bash
        run: |
          set -euo pipefail
          python -B research/f9_learned_timing/advance.py \
            --parent "$RUNNER_TEMP/f8-timing-engineering.json" \
            --witness "$RUNNER_TEMP/f8-timing-independent-review.json" \
            --source-root pinned-yggdrasil-source \
            --out "$RUNNER_TEMP/f9-trained-order.json"
          python -B research/f9_learned_timing/verify.py \
            --record "$RUNNER_TEMP/f9-trained-order.json" \
            --parent "$RUNNER_TEMP/f8-timing-engineering.json" \
            --witness "$RUNNER_TEMP/f8-timing-independent-review.json" \
            --source-root pinned-yggdrasil-source \
            --out "$RUNNER_TEMP/f9-independent-order-review.json"
          python -B - "$RUNNER_TEMP/f9-trained-order.json" "$RUNNER_TEMP/f9-independent-order-review.json" <<'PY'
          import json,sys
          parent=json.load(open(sys.argv[1]))
          witness=json.load(open(sys.argv[2]))
          assert parent["schema"]=="forge.f9.automatic-public-order-training.v1"
          assert parent["model"]["training_seeds"]==[67204,67205]
          assert parent["model"]["unseen_in_fit_validation_seeds"]==[67206,67207]
          assert parent["training_case_arms"]==192
          assert parent["validation_case_arms"] in (192,288)
          assert witness["status"]=="PREVIOUSLY_USED_F3_SPLIT_QUALIFIED_NOT_NEW_SCIENCE"
          assert witness["matched_f8_cases"]==96
          assert witness["replayed_training_arms"]==192
          assert witness["replayed_validation_arms"]==parent["validation_case_arms"]
          assert witness["selected_rule"]==parent["model"]["selected_rule"]
          assert witness["scientific_dispatch_authorized"] is False
          assert parent["new_cohort_uses"]==parent["first_use_claims"]==0
          assert parent["scientific_originals"]==parent["paid_api_calls"]==0
          print("FORGE_F8_TO_F9_TRAINED_PUBLIC_OBSERVATION_ORDER=PASS")
          print("FORGE_F9_PREVIOUSLY_USED_ONLY_NO_NEW_FIRST_USE=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forge-f5-historical-public-sensor-adaptation-evidence
          path: |
            ${{ runner.temp }}/f5-historical-evidence.json
            ${{ runner.temp }}/f5-historical-witness.json
            ${{ runner.temp }}/f5-geometry.json
            ${{ runner.temp }}/f5-automatic-successor.json
            ${{ runner.temp }}/f5-automatic-successor-review.json
            ${{ runner.temp }}/f6-trained-engineering.json
            ${{ runner.temp }}/f6-independent-review.json
            ${{ runner.temp }}/f7-automatic-engineering.json
            ${{ runner.temp }}/f7-independent-review.json
            ${{ runner.temp }}/f8-timing-engineering.json
            ${{ runner.temp }}/f8-timing-independent-review.json
            ${{ runner.temp }}/f9-trained-order.json
            ${{ runner.temp }}/f9-independent-order-review.json
          if-no-files-found: error
          retention-days: 90
