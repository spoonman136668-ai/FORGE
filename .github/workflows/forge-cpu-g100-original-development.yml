name: FORGE CPU G100 original GPT2 development comparison
on:
  workflow_dispatch:
  push:
    branches: [research/cpu-llm-g96-admission-policy-20261031]
    paths: ['.github/workflows/forge-cpu-g100-original-development.yml']
# One-shot science evaluation using qualified immutable source. The push trigger
# is removed after the recorded development run; no schedule or controller.
env:
  G100_FROZEN_SHA: d7134d1284d19ab94bd93b74972546630fda5736
permissions: {contents: read, actions: read}
concurrency:
  group: cpu-g100-original-development
  cancel-in-progress: false
jobs:
  source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.admit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7134d1284d19ab94bd93b74972546630fda5736
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Exact-source and full mandatory Linux Windows regression admission
        id: admit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A branch-file push is the only one-shot execution authority.
          # Pin execution to the already fully-qualified model source.
          test "$GITHUB_EVENT_NAME" = "push"
          test "${{ github.event.before }}" = "$G100_FROZEN_SHA"
          test "${{ github.event.forced }}" = "false"
          test "$(git rev-parse HEAD)" = "$G100_FROZEN_SHA"
          test "$GITHUB_REF_NAME" = "research/cpu-llm-g96-admission-policy-20261031"
          python - <<'PY'
          import json,os,urllib.request
          sha=os.environ["G100_FROZEN_SHA"]
          url=f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/runs?head_sha={sha}&per_page=100"
          request=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json","User-Agent":"FORGE-G100-EXACT-HEAD"})
          with urllib.request.urlopen(request,timeout=30) as response:
              runs=json.load(response)["workflow_runs"]
          if not any(r["name"]=="FORGE public Linux and Windows qualification" and
              r["head_sha"]==sha and r["status"]=="completed" and r["conclusion"]=="success" for r in runs):
              raise SystemExit("G100_FULL_REGRESSION_NOT_QUALIFIED")
          print("G100_EXACT_HEAD_FULL_REGRESSION=PASS")
          PY
          test "$(git rev-parse HEAD:research/cpu_g95/g95_multiprefix_lru_original.py)" = "b401c86e4dff2f25eb995a47ba58884838f232eb"
          git merge-base --is-ancestor 856da2432ef4163938711bcb6b0369fbfab2ccbd HEAD
          python -B -m py_compile research/cpu_g97/g100_development_original.py research/cpu_g97/g100_original_adapter.py research/cpu_g97/g100_stream_manifest.py research/cpu_g97/g100_receipt_validator.py
          python -B -m unittest discover -s research/cpu_g97 -p 'test_g100*.py' -v
          echo "source_sha=$G100_FROZEN_SHA" >> "$GITHUB_OUTPUT"
          echo G100_SOURCE_ADMISSION=PASS
  original-model-development:
    needs: source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-admission.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned original CPU GPT2 runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.source-admission.outputs.source_sha }}"
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 huggingface-hub==0.30.2 safetensors==0.5.3 tokenizers==0.21.1 psutil==7.1.3
          python -m pip check
          python -m pip freeze > cpu_g100_development_environment.txt
          uname -a >> cpu_g100_development_environment.txt
          lscpu >> cpu_g100_development_environment.txt
      - name: Run development-only original GPT2 paired comparison
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$G100_FROZEN_SHA" python research/cpu_g97/g100_development_original.py
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          receipt=json.loads(Path("cpu_g100_development_result.json").read_text())
          data=Path("cpu_g100_development_stream.json").read_bytes()
          assert hashlib.sha256(data).hexdigest()==receipt["development_stream_sha256"]
          assert receipt["phase"]=="DEVELOPMENT_ONLY" and not receipt["heldout_executed"] and not receipt["promotion_allowed"]
          assert receipt["source_sha"]==os.environ["G100_FROZEN_SHA"]
          assert receipt["engineering"]=="PASS" and receipt["correctness"]=="PASS"
          assert receipt["decision"] in ("DEVELOPMENT_CANDIDATE","DEVELOPMENT_NO_GO")
          assert set(receipt["strata"])=={"round_robin","bursty","mixed","overflow"}
          assert all(v["exact_parity"] and len(v["repetitions"])==4 for v in receipt["strata"].values())
          assert all(set(r["arms"])=={"no_cache","lru","g97_overflow_bypass","g100_deferred_first_use"}
                     for v in receipt["strata"].values() for r in v["repetitions"])
          print("G100_DEVELOPMENT_ONLY=PASS",receipt["decision"])
          PY
          # Independently reject inconsistent paired rows, metrics, verdicts,
          # source identity or protected-cohort claims before accepting artifacts.
          python -B research/cpu_g97/g100_receipt_validator.py \
            cpu_g100_development_result.json cpu_g100_development_stream.json "$G100_FROZEN_SHA"
      - name: Preserve bounded development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-g100-original-gpt2-development
          retention-days: 30
          if-no-files-found: warn
          path: |
            cpu_g100_development_result.json
            cpu_g100_development_stream.json
            cpu_g100_development_environment.txt
