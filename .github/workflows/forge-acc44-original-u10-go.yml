name: ACC44 authenticated original U10 holographic associative native Go qualification
on:
  pull_request:
    paths:
      - 'research/acceleration/acc44_go_u10/**'
      - 'docs/research/ACC-44-*'
      - '.github/workflows/forge-acc44-original-u10-go.yml'
permissions:
  contents: read
  actions: read
jobs:
  native-u10:
    name: ACC44 authentic U10 native source and 60 cold processes / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Original U10/U13 identity, verify AST before executable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/ac07_sourcefree/ac08_portfolio.py)" = 5126c860771fb024ccfc14c3f7ee8925edf29787
          python - <<'PY'
          import ast
          from pathlib import Path
          module=ast.parse(Path('research/ac07_sourcefree/ac08_portfolio.py').read_text())
          names=ast.literal_eval(next(n.value for n in module.body
             if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and
             t.id=='ORIGINAL_NAMES' for t in n.targets)))
          assert len(names)==30
          assert names[9]=='holographic associative memory'
          assert names[12]=='fixed-size KV sketches'
          print('ACC44_AUTHENTIC_ORIGINAL_U10_HOLOGRAPHIC_U13_KV_IDENTITY=PASS')
          PY
      - name: Original prereg first, source file hashes and original source custody
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2b1bb8ae1959b578e058772f64e509c34bbec54e HEAD
          git merge-base --is-ancestor 0d043576cd105de87ee46c01cd4250bdf00bdb86 HEAD
          test "$(git hash-object docs/research/ACC-44B-U10-CPU-RESOLUTION-PREREG.md)" = c3ce00126a279e49fa83a588786430e2bd7a30e7
          echo ACC44B_256_EPISODE_METERING_PREREG_FIRST=PASS
          test "$(git hash-object docs/research/ACC-44-U10-HOLOGRAPHIC-PREREG.md)" = 571fc5417e44a2485ce7dbb8ea673438d67cf490
          test "$(git hash-object research/ac07_sourcefree/ac08_portfolio.py)" = 5126c860771fb024ccfc14c3f7ee8925edf29787
          test "$(git hash-object research/ac06_sourcefree/restricted.py)" = 19c5ce8f485900f06adaffe97f998c83c78aab4c
          test "$(git hash-object research/acceleration/acc44_go_u10/go.mod)" = d7d078e992e79079cddf56313414fac0b26e5906
          test "$(git hash-object research/acceleration/acc44_go_u10/core.go)" = dcf791a9ec41758b91f60c67234c0c5e695cc09d
          test "$(git hash-object research/acceleration/acc44_go_u10/main.go)" = b94784f163e451b4fac66c3ad81dd2f6675a2fef
          test "$(git hash-object research/acceleration/acc44_go_u10/core_test.go)" = 6f73b4cc3a15a1897d607f5f7a4ab8fc0878b78f
          test "$(git hash-object research/acceleration/acc44_go_u10/rss_linux.go)" = 6d0b62ca5b34f400649132f27e446cd180308bc4
          test "$(git hash-object research/acceleration/acc44_go_u10/rss_windows.go)" = 96e8010b630c97372e18dfeb41e3f0701970101f
          test "$(git status --porcelain --untracked-files=all)" = ""
          echo ACC44_U10_PREREG_FIRST_ORIGINAL_GIT_BLOBS=PASS
      - name: Reproduce all original 36 method identities and negative baselines
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/acceleration -p 'test_acc34_scoreboard.py' -v
          python -B research/acceleration/acc34_scoreboard.py --full "$RUNNER_TEMP/acc44-36.json"
          python - "$RUNNER_TEMP/acc44-36.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          names={v['claim_id'] for v in r['rows']}
          assert names==({f'U{i:02}' for i in range(1,31)}|{f'AC-D{i}' for i in range(1,7)})
          assert not r['scientific_admission'] and not r['scientific_first_use']
          print('ACC44_ORIGINAL_36_NEGATIVE_CUSTODY=PASS')
          PY
      - name: Build, Go test/vet and full native 60-process original U10 experiment
        shell: bash
        run: |
          set -euo pipefail
          cd research/acceleration/acc44_go_u10
          go test -count=1 -v ./...
          go vet ./...
          BIN="$RUNNER_TEMP/acc44"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$BIN.exe"; fi
          go build -trimpath -o "$BIN" .
          "$BIN" -out "$RUNNER_TEMP/acc44-report.json"
      - name: Audit every original U10 source, actual physical RSS and OS CPU receipt
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/acc44-report.json" <<'PY'
          import json,sys,math
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r['Schema']=='forge.acc44.original-u10-holographic-associative-go.v1'
          assert r['OS'] in ('linux','windows')
          assert (r['OriginalHypotheses'],r['AddedHypotheses'])==(30,6)
          assert not r['ScientificFirstUse'] and not r['NativeModelSpeedupProven']
          assert r['NativeChildCount']==60 and len(r['Records'])==60
          assert len(r['Comparisons'])==3
          assert r['Classification'] in ('U10_NO_GENERAL_VERIFIED_NATIVE_GO_RESOURCE_WIN','U10_RESTRICTED_NATIVE_GO_ENGINEERING_POSITIVE_ONLY')
          seen=set();source={}
          for row in r['Records']:
            w=row['Worker'];k=(w['Mode'],w['Cohort'],w['Seed'])
            assert k not in seen;seen.add(k)
            assert w['Mode'] in ('EXACT_ONE','EXACT_TWO','XOR_SUPERPOSE','HRR_CCONV')
            assert w['Cohort'] in ('LIGHT','FULL','OVERLOAD')
            assert w['Episodes']==256
            assert w['Present']==w['Absent']==256*128 and w['QueryCount']==256*256
            assert w['StateBytes']==512 and w['PeakRSSBytes']>0
            assert w['MemoryMetric']=='OS_PROCESS_PEAK_PHYSICAL_RSS_BYTES'
            assert row['CPUSeconds']>0 and row['WallSeconds']>0
            assert len(w['SourceSHA256'])==len(w['TruthSHA256'])==len(w['OutputSHA256'])==64
            assert math.isfinite(w['Recall']) and math.isfinite(w['AbsentFPR'])
            key=(w['Cohort'],w['Seed'])
            ident=(w['SourceSHA256'],w['TruthSHA256'])
            assert key not in source or source[key]==ident
            source[key]=ident
          assert len(seen)==60 and len(source)==15
          for c in r['Comparisons']:
            assert c['FastestControl'] in ('EXACT_ONE','EXACT_TWO','XOR_SUPERPOSE')
            assert c['RecallControl'] in ('EXACT_ONE','EXACT_TWO','XOR_SUPERPOSE')
            assert all(math.isfinite(c[k]) for k in ('CPUratio','RSSratio','RecallGap'))
          print('ACC44_AUTHENTIC_U10_NATIVE_60_OS_PROCESS_CPU_PEAK_RSS=PASS')
          print('ACC44_U10_ENGINEERING_CLASSIFICATION='+r['Classification'])
          PY
      - name: Preserve all raw original method samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc44-u10-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/acc44-report.json
            ${{ runner.temp }}/acc44-36.json
          if-no-files-found: warn
          retention-days: 30

  independent-cross-platform:
    name: ACC44 independent original U10 cross-OS source, truth, prediction reconciliation
    runs-on: ubuntu-latest
    needs: native-u10
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: acc44-u10-*
          path: artifacts
          merge-multiple: false
      - name: Reconcile every integer source, oracle and native prediction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('artifacts')
          a=json.loads((p/'acc44-u10-ubuntu-latest'/'acc44-report.json').read_text())
          b=json.loads((p/'acc44-u10-windows-latest'/'acc44-report.json').read_text())
          assert {a['OS'],b['OS']}=={'linux','windows'}
          assert len(a['Records'])==len(b['Records'])==60
          key=lambda x:(x['Worker']['Mode'],x['Worker']['Cohort'],x['Worker']['Seed'])
          aa={key(x):x['Worker'] for x in a['Records']}
          bb={key(x):x['Worker'] for x in b['Records']}
          assert len(aa)==len(bb)==60 and set(aa)==set(bb)
          for k in aa:
            for field in ('SourceSHA256','TruthSHA256','OutputSHA256',
                          'CorrectPresent','WrongPresent','FalsePositiveAbsent',
                          'InsertCount','QueryCount','StateBytes'):
              assert aa[k][field]==bb[k][field],(k,field)
          x=json.loads((p/'acc44-u10-ubuntu-latest'/'acc44-36.json').read_text())
          y=json.loads((p/'acc44-u10-windows-latest'/'acc44-36.json').read_text())
          assert x['rows']==y['rows'] and len(x['rows'])==36
          print('ACC44_ORIGINAL_U10_CROSSOS_INPUT_TRUTH_PREDICTION_60_OF_60_PASS')
          print('ACC44_U10_LINUX='+a['Classification'])
          print('ACC44_U10_WINDOWS='+b['Classification'])
          globalwin=all(r['Classification']=='U10_RESTRICTED_NATIVE_GO_ENGINEERING_POSITIVE_ONLY' for r in (a,b))
          print('ACC44_ORIGINAL_U10_GLOBAL_GO_ACCELERATION='+('PASS' if globalwin else 'NO'))
          print('ACC44_ORIGINAL_MODEL_NATIVE_SPEEDUP=UNVERIFIED')
          PY
