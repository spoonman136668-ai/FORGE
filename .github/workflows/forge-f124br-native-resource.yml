name: F124-BR authentic native-path low-allocation equivalence and matched OS cost
on:
  push:
    branches: [research/f124br-native-memory-path-20261019]
permissions:
  contents: read
concurrency:
  group: f124br-original-source-neutral-memory-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sourceblind-native-equivalence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require exact original learner and one bounded adapter/probe/test delta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'BR_HEAD_MOVED' }
          & git merge-base --is-ancestor c18445b2a87b2c9932421b4bc18bceb0fd21b294 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'BR_ORIGINAL_EVIDENCE_DRIFT' }
          $expected=@(
            '.github/workflows/forge-f124br-native-parity.yml',
            '.github/workflows/forge-f124br-native-resource.yml',
            'research/north-star-transfer/f124br-frozen-native-memory.json',
            'research/north-star-transfer/f124br_native_view.py',
            'research/north-star-transfer/f124br_native_cost.py',
            'research/north-star-transfer/test_f124br_native_parity.py'
          )
          $diff=@(& git diff --name-only c18445b2a87b2c9932421b4bc18bceb0fd21b294 HEAD | Where-Object { $_ })
          if ((@($diff|Sort-Object) -join '|') -cne (@($expected|Sort-Object) -join '|')) { throw 'BR_SCOPE_WIDENED_OR_NEW_SOURCE' }
          $exact=@{
            'research/north-star-transfer/f124bq_program_learner.py'='91ad02a4f3893e3537dddc2390666e3c2d2db5d1'
            'research/north-star-transfer/f124bq-frozen-program.json'='b22b7b7415bd9c48dfc2b061e3638ac13df77d29'
            'nativeevidence/f124ag_transition_models.py'='94d2ae8266da792d254ac54baf3056bbd9b49412'
            'nativeevidence/f124aj_example_operator_learner.py'='eddf99c06af66f2e46bf4dc0ea050368c283fcb2'
            'nativeevidence/f124az_joint_public_inverse.py'='0122190aa3a0972ffb4a709bc1bdd8179c8ba6c7'
          }
          foreach ($p in $exact.Keys) {
            if ((& git rev-parse ('HEAD:'+$p)).Trim() -cne $exact[$p]) { throw "BR_LEARNER_NATIVE_CONTROL_DRIFT:$p" }
          }
          & python -B -m unittest discover -s research/north-star-transfer -p test_f124br_native_parity.py -v
          if ($LASTEXITCODE -ne 0) { throw 'BR_OLD_AND_NEW_NATIVE_PARITY_FAILED' }
          & python -B isolationguard/check.py
          if ($LASTEXITCODE -ne 0) { throw 'BR_GOVERNANCE_ISOLATION_FAILED' }
          Write-Output 'F124BR_NATIVE_EXACT_SCORE_WORK=PASS'
          Write-Output 'F124BR_NEW_SOURCE_FIRSTUSE=FALSE'
  fresh-process-original-OS-comparison:
    needs: sourceblind-native-equivalence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Same-public 5+5+5 actual process CPU peak RSS against real AZ and original BQ
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/f124br-original-cost"
          python3 -B research/north-star-transfer/f124br_native_cost.py \
            --output "$RUNNER_TEMP/f124br-original-cost/matched-native-15-processes.json"
          python3 -B - "$RUNNER_TEMP/f124br-original-cost/matched-native-15-processes.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))['summary']
          assert d['sample_count']==15
          assert d['fresh_process_samples_per_arm']==5
          assert d['legacy_and_lean_native_score_work_exact'] is True
          assert d['legacy_and_lean_causal_decisions_exact'] is True
          assert d['AZ_scientific_abstention_preserved'] is True
          assert d['AZ_and_candidate_native_work_not_equivalent'] is True
          assert d['full_scientific_resource_parity'] is False
          assert d['old_BM_BN_BO_BP_BQ_cases_replayed'] is False
          assert d['new_prospective_or_protected_cases_used'] is False
          for name in ('AZ','legacy','lean'):
              a=d['arms'][name]
              print('BR_'+name+'_OS_CPU_MEDIAN='+str(a['CPU_median_ns']))
              print('BR_'+name+'_OS_RSS_MEDIAN='+str(a['RSS_median_bytes']))
              print('BR_'+name+'_OS_RSS_MAX='+str(a['RSS_max_bytes']))
          if not (d['lean_source_neutral_os_nonregression_vs_original_AZ']
                  and d['lean_os_nonregression_vs_original_BQ_legacy']):
              raise SystemExit('F124BR_RESOURCE_STOP_NO_NEW_SOURCE_BIRTH')
          print('F124BR_SOURCE_NEUTRAL_RESOURCE_ELIGIBILITY=PASS')
          PY
          (cd "$RUNNER_TEMP/f124br-original-cost" && sha256sum matched-native-15-processes.json > receipt-sha256.txt && sha256sum -c receipt-sha256.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f124br-authentic-15-process-source-neutral-OS-cost-${{ github.sha }}
          path: ${{ runner.temp }}/f124br-original-cost/
          retention-days: 90
          if-no-files-found: warn
  one-consolidated-regression:
    needs: fresh-process-original-OS-comparison
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: One complete unaffected Go regression vet build after focused, resource success
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo F124BR_COMPLETE_ENGINEERING_REGRESSION=PASS
