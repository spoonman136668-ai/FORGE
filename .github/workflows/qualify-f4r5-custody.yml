name: FORGE F4R5 independent custody boundary regression
on:
  push:
    branches:
      - proposal/forge-f4-custody-attestation-r5-20261011
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify frozen lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 307ff24872fbc9a352a66e1a25e177acec39d475
          test "$(git rev-parse HEAD:research/pilot-f4/frozen.json)" = 76b940cae65c2800100bf1c589949bfa17ad3258
      - name: Cross-platform focused and full regression no originals
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./pilotf4 ./fsagithubcustody
          go test -count=1 ./...
          go vet ./...
          go build ./...
          if [ "$RUNNER_OS" = Linux ]; then go test -race -count=1 ./...; fi
          echo "F4_R5_SOURCE_QUALIFIED=PASS external_authority=false"
