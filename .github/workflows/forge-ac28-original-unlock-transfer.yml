name: AC28 fresh original Unlock native transfer versus matched controls
on:
  pull_request:
    paths:
      - 'research/lcrm01/ac28_*'
      - 'research/lcrm01/test_ac28_*'
      - 'docs/research/AC-28-*'
      - '.github/workflows/forge-ac28-original-unlock-transfer.yml'
permissions:
  contents: read
jobs:
  two-process-original-unlock-selected-public-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Original source LF
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Source Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Native Go 1.25.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Reproduce original Farama source with two independent exact four-arm experiments
        shell: bash
        run: bash research/lcrm01/ac28_unlock_ci.sh
      - name: Retain all source events and failed reproduction receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ac28-original-unlock-public-transfer-four-arm-evidence
          path: |
            ${{ runner.temp }}/ac28/first.json
            ${{ runner.temp }}/ac28/second.json
            ${{ runner.temp }}/ac28/comparison.json
            ${{ runner.temp }}/ac28/first.log
            ${{ runner.temp }}/ac28/second.log
          retention-days: 30
          if-no-files-found: warn
