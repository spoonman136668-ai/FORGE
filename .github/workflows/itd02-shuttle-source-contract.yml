name: ITD-02 original Shuttle source contract (read-only)
on:
  pull_request:
    paths:
      - 'research/itd02/shuttle_source_contract.py'
      - 'research/itd02/test_shuttle_source_contract.py'
      - 'research/itd02/test_shuttle_ygg_public_wire.py'
      - '.github/workflows/itd02-shuttle-source-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-contract:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable line ending rewriting
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Authenticate independently authored original source (NO episodes)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shuttle-original"
          git init -q "$RUNNER_TEMP/shuttle-original"
          git -C "$RUNNER_TEMP/shuttle-original" remote add origin https://github.com/mhahsler/pomdp.git
          git -C "$RUNNER_TEMP/shuttle-original" fetch --no-tags --depth 1 origin 05db0c69396128e6960f54d41503dca1e90e221c
          git -C "$RUNNER_TEMP/shuttle-original" checkout --detach -q 05db0c69396128e6960f54d41503dca1e90e221c
          test "$(git -C "$RUNNER_TEMP/shuttle-original" hash-object inst/examples/shuttle_95.POMDP)" = fb8612d67e43112e210a252b29b49f8bdba37863
          echo "ITD02_SHUTTLE_SOURCE_PIN=PASS"
      - name: Source-only public-custody qualification
        shell: bash
        run: |
          set -euo pipefail
          export ITD02_SHUTTLE_SOURCE="$RUNNER_TEMP/shuttle-original/inst/examples/shuttle_95.POMDP"
          export PYTHONPATH="$GITHUB_WORKSPACE/research/itd02"
          python -B -m unittest discover -s research/itd02 -p 'test_shuttle_source_contract.py' -v
          echo "ITD02_ORIGINAL_SOURCE_EPISODES=0"
          echo "ITD02_ORIGINAL_SOURCE_CONTRACT=PASS"
      - name: Authenticate genuine Yggdrasil native public bridge (NO episodes)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ygg-native"
          git init -q "$RUNNER_TEMP/ygg-native"
          git -C "$RUNNER_TEMP/ygg-native" remote add origin https://github.com/spoonman136668-ai/Yggdrasil.git
          git -C "$RUNNER_TEMP/ygg-native" fetch --no-tags --depth 1 origin 5bac4532d223f220f58111de1bc4a7a9219d5a28
          git -C "$RUNNER_TEMP/ygg-native" checkout --detach -q 5bac4532d223f220f58111de1bc4a7a9219d5a28
          test "$(git -C "$RUNNER_TEMP/ygg-native" hash-object yggdrasil/task_runtime.py)" = 68a1423e0bd7206af511212c14b6ce8534154cc2
          test "$(git -C "$RUNNER_TEMP/ygg-native" hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 2825edf231b8501034fa147432052a9e19b37d3d
          test "$(git -C "$RUNNER_TEMP/ygg-native" hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 6d55a848411afb558105d23c6dc73722f842a592
          echo "ITD02_NATIVE_SOURCE_PIN=PASS"
      - name: Original FORGE public wire to genuine Yggdrasil native learner
        shell: bash
        run: |
          set -euo pipefail
          # Native Windows Python uses ';' and drive paths; Git Bash uses ':'.
          export PYTHONPATH="$(python -c 'import os;print(os.pathsep.join((os.path.join(os.environ["RUNNER_TEMP"],"ygg-native"),os.path.join(os.environ["GITHUB_WORKSPACE"],"research","itd02"))))')"
          python -B -m unittest discover -s research/itd02 -p 'test_shuttle_ygg_public_wire.py' -v
          echo "ITD02_CROSS_REPO_PUBLIC_SEAM=PASS"
          echo "ITD02_ORIGINAL_SOURCE_EPISODES=0"
      - name: No tracked modifications
        shell: bash
        run: git diff --exit-code
