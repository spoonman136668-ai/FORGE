name: CKB R217 one-time elevated original PID custody inspection (read-only)
on:
  push:
    branches: [verify/ckb-r217-elevated-pid800-original-owner-20261023]
permissions:
  contents: read
concurrency:
  group: ckb-r217-elevated-original-pid-identity-once
  cancel-in-progress: true
jobs:
  inspect-original-process-only:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 7
    steps:
      - name: Inspect current elevated host and one old PowerShell process without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){
            throw 'R217_ELEVATED_WRONG_OWNER_RUNNER'
          }
          $admin=[Security.Principal.WindowsPrincipal]::new(
             [Security.Principal.WindowsIdentity]::GetCurrent()
          ).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Output ('R217_ELEVATED_ADMIN_TOKEN='+$admin)
          $root='C:\ProgramData\CKBR\research'
          $pin=Join-Path $root 'controller-qualified-sha.txt'
          if(!(Test-Path -LiteralPath $pin -PathType Leaf)){
            Write-Output 'R217_ELEVATED_ORIGINAL_RESEARCH_HOST_NOT_FOUND=TRUE'
            exit 0
          }
          $sha=([IO.File]::ReadAllText($pin,[Text.Encoding]::UTF8)).Trim().ToLowerInvariant()
          if($sha -cne '9d697540cd31c1925cf427bcbcdc9b605d64b536'){
            Write-Output 'R217_ELEVATED_ORIGINAL_SOURCE_NOT_SAME=TRUE'
            exit 0
          }
          Write-Output 'R217_ELEVATED_ORIGINAL_RESEARCH_SOURCE_IDENTICAL=TRUE'
          $p=@(Get-CimInstance Win32_Process -Filter 'ProcessId=800' -ErrorAction Stop)
          if($p.Count -ne 1){
            Write-Output 'R217_ELEVATED_PID800_MISSING_OR_WRONG_HOST=TRUE'
            exit 0
          }
          $process=$p[0]
          $born=([datetime]$process.CreationDate).ToUniversalTime().ToString('o')
          if($born -cne '2026-10-21T09:46:33.4336590Z'){
            Write-Output ('R217_ELEVATED_PID_REUSED_UNSAFE='+$born)
            exit 0
          }
          Write-Output 'R217_ELEVATED_PROCESS_BIRTH_MATCH=PASS'
          $exe=[IO.Path]::GetFileName([string]$process.ExecutablePath)
          $cmd=[string]$process.CommandLine
          $who=''
          $sid=''
          try{
            $o=Invoke-CimMethod -InputObject $process -MethodName GetOwner -ErrorAction Stop
            if($o.ReturnValue -eq 0){$who=([string]$o.Domain)+'\'+([string]$o.User)}
          }catch{}
          try{
            $o=Invoke-CimMethod -InputObject $process -MethodName GetOwnerSid -ErrorAction Stop
            if($o.ReturnValue -eq 0){$sid=[string]$o.Sid}
          }catch{}
          Write-Output ('R217_ELEVATED_PROCESS_EXECUTABLE='+$exe)
          Write-Output ('R217_ELEVATED_PROCESS_OWNER_AVAILABLE='+(![string]::IsNullOrWhiteSpace($sid)))
          Write-Output ('R217_ELEVATED_PROCESS_OWNER_SID='+$sid)
          Write-Output ('R217_ELEVATED_CMDLINE_READABLE='+(![string]::IsNullOrWhiteSpace($cmd)))
          Write-Output ('R217_ELEVATED_CMDLINE_RESEARCH_LOOP='+($cmd -match '(?i)Invoke-ResearchLoop\.ps1'))
          Write-Output ('R217_ELEVATED_CMDLINE_RESEARCH_REFERENCE='+($cmd -match '(?i)(CKBR|research|Invoke-ResearchLoop)'))
          Write-Output ('R217_ELEVATED_PARENT_PID='+$process.ParentProcessId)
          $parent=@(Get-CimInstance Win32_Process -Filter ('ProcessId='+$process.ParentProcessId))
          if($parent.Count -eq 1){
            Write-Output ('R217_ELEVATED_PARENT_EXE='+[IO.Path]::GetFileName([string]$parent[0].ExecutablePath))
          }
          $services=@(Get-CimInstance Win32_Service | Where-Object {
            $_.ProcessId -eq $process.ParentProcessId
          })
          foreach($service in $services){
            Write-Output ('R217_ELEVATED_PARENT_SERVICE='+$service.Name)
            Write-Output ('R217_ELEVATED_PARENT_SERVICE_STATE='+$service.State)
          }
          $children=@(Get-CimInstance Win32_Process | Where-Object {
            $_.ParentProcessId -eq 800
          })
          Write-Output ('R217_ELEVATED_CHILD_COUNT='+$children.Count)
          foreach($child in $children){
            Write-Output ('R217_ELEVATED_CHILD_EXE='+[IO.Path]::GetFileName([string]$child.ExecutablePath))
            Write-Output ('R217_ELEVATED_CHILD_RESEARCH_REFERENCE='+([string]$child.CommandLine -match '(?i)(CKBR|research|Invoke-ResearchLoop)'))
          }
          # One bounded process-activity interval, never suspending or terminating it.
          $before=Get-Process -Id 800 -ErrorAction Stop
          $cpu1=[double]$before.CPU
          Start-Sleep -Seconds 8
          $after=Get-Process -Id 800 -ErrorAction Stop
          $fresh=@(Get-CimInstance Win32_Process -Filter 'ProcessId=800')
          if($fresh.Count -ne 1 -or
             ([datetime]$fresh[0].CreationDate).ToUniversalTime().ToString('o') -cne $born){
            throw 'R217_ELEVATED_PROCESS_REUSED_DURING_OBSERVATION'
          }
          Write-Output ('R217_ELEVATED_EIGHT_SECOND_CPU_DELTA='+[math]::Round(([double]$after.CPU-$cpu1),3))
          $threadSummary=@($after.Threads | Group-Object -Property ThreadState |
             ForEach-Object {$_.Name+':'+$_.Count}) -join ','
          Write-Output ('R217_ELEVATED_THREAD_STATES='+$threadSummary)
          $cfgPath=Join-Path $root 'controller.json'
          if(Test-Path -LiteralPath $cfgPath -PathType Leaf){
            $cfg=Get-Content -LiteralPath $cfgPath -Raw | ConvertFrom-Json
            if($cfg.schema -cne 'ckb-plane.research-loop-controller-config.v1'){
              throw 'R217_ELEVATED_ORIGINAL_CONFIG_SCHEMA_DRIFT'
            }
            $stateRoot=[IO.Path]::GetFullPath([string]$cfg.state_root)
            if(!$stateRoot.StartsWith('C:\ProgramData\CKBR\', [StringComparison]::OrdinalIgnoreCase)){
              throw 'R217_ELEVATED_ORIGINAL_STATE_ROOT_UNEXPECTED'
            }
            $statePath=Join-Path $stateRoot 'state.json'
            $receiptPath=Join-Path $stateRoot 'latest-receipt.json'
            if(Test-Path -LiteralPath $receiptPath -PathType Leaf){
              $receipt=Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
              Write-Output ('R217_ELEVATED_RECEIPT_STATUS='+[string]$receipt.status)
              Write-Output ('R217_ELEVATED_RECEIPT_TIMESTAMP='+[string]$receipt.observed_at_utc)
              Write-Output ('R217_ELEVATED_RECEIPT_WINGLESS='+[string]$receipt.wingless.state)
              Write-Output ('R217_ELEVATED_RECEIPT_YGGDRASIL='+[string]$receipt.yggdrasil.state)
              Write-Output ('R217_ELEVATED_RECEIPT_SCIENCE_OR_RUNTIME_FLAG='+[bool](
                $receipt.codex_used -or $receipt.runtime_launched -or
                $receipt.accepted_ref_mutated))
            }
            if(Test-Path -LiteralPath $statePath -PathType Leaf){
              $state=Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
              Write-Output ('R217_ELEVATED_STATE_FIELD_NAMES='+(
                @($state.PSObject.Properties.Name)|Sort-Object) -join ',')
              if($null -ne $state.lanes){
                foreach($name in @('Wingless','Yggdrasil')){
                  $lane=$state.lanes.PSObject.Properties[$name]
                  if($null -ne $lane){
                    $values=$lane.Value
                    foreach($key in @('state','status','stage')){
                      $entry=$values.PSObject.Properties[$key]
                      if($null -ne $entry){
                        Write-Output ('R217_ELEVATED_STATE_'+$name+'_'+$key+'='+[string]$entry.Value)
                      }
                    }
                  }
                }
              }
            }
            Write-Output ('R217_ELEVATED_MUTEX_CONFIGURED='+(![string]::IsNullOrWhiteSpace([string]$cfg.mutex_name)))
          }
          function OriginalResearchAction($task){
            foreach($action in @($task.Actions)){
              $propArgs=$action.PSObject.Properties['Arguments']
              $propExec=$action.PSObject.Properties['Execute']
              $argsText=if($null-ne$propArgs){[string]$propArgs.Value}else{''}
              $exeText=if($null-ne$propExec){[string]$propExec.Value}else{''}
              if(($exeText+' '+$argsText) -match '(?i)Invoke-ResearchLoop|CKBR\\research'){
                return $true
              }
            }
            return $false
          }
          $tasks=@(Get-ScheduledTask -ErrorAction Stop | Where-Object {
            $_.TaskName -match '(?i)(CKB|research|controller|plane)' -or
            (OriginalResearchAction $_)
          })
          foreach($task in $tasks){
            $isResearch=OriginalResearchAction $task
            $ownerS=[string]$task.Principal.UserId
            $sameSid=$ownerS -ceq $sid
            if(!$sameSid -and ![string]::IsNullOrWhiteSpace($ownerS)){
              try{
                $translated=(New-Object Security.Principal.NTAccount($ownerS)).Translate(
                  [Security.Principal.SecurityIdentifier]).Value
                $sameSid=$translated -ceq $sid
              }catch{}
            }
            Write-Output ('R217_ELEVATED_RELEVANT_TASK='+$task.TaskName+
              ' state='+$task.State+
              ' research_action='+$isResearch+
              ' owner_sid_matches_pid800='+$sameSid)
            try{
              $info=Get-ScheduledTaskInfo -TaskName $task.TaskName -TaskPath $task.TaskPath -ErrorAction Stop
              Write-Output ('R217_ELEVATED_TASK_LAST_RESULT='+$task.TaskName+':'+$info.LastTaskResult)
            }catch{}
          }
          Write-Output ('R217_ELEVATED_TASKS_SCANNED='+$tasks.Count)
          $activeLoop=@(Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" |
            Where-Object { [string]$_.CommandLine -match 'Invoke-ResearchLoop\.ps1' })
          Write-Output ('R217_ELEVATED_ACTUAL_RESEARCH_PROCESSES='+$activeLoop.Count)
          foreach($loop in $activeLoop){
            Write-Output ('R217_ELEVATED_ACTUAL_RESEARCH_PID='+$loop.ProcessId)
          }
          Write-Output 'R217_ELEVATED_INSPECTION_READONLY=PASS'
