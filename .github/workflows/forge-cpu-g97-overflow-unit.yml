name: CPU G97 overflow bypass focused qualification
on:
  push:
    branches: [research/cpu-llm-g96-admission-policy-20261031]
    paths:
      - 'research/cpu_g97/**'
      - '.github/workflows/forge-cpu-g97-overflow-unit.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  focused:
    strategy: {fail-fast: false, matrix: {os: [ubuntu-latest, windows-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Exact-head G97 adversarial qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B -m py_compile research/cpu_g96/g96_admission.py research/cpu_g97/g97_overflow_bypass.py research/cpu_g97/test_g97_overflow_bypass.py
          python -B -m unittest discover -s research/cpu_g97 -p 'test_g97*.py' -v
          python -B -m unittest discover -s research/cpu_g97 -p 'test_g98*.py' -v
