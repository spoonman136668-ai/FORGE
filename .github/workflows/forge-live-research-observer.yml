name: FORGE live two-lane research metadata observer

# Observe actual independent research repositories without taking over
# their workflows or treating green CI as a scientific classification.
on:
  pull_request:
    branches: [main]
    paths:
      - 'researchobserver/**'
      - 'researchintake/**'
      - 'cmd/forge-research-intake/**'
      - 'reference/research-intake/**'
      - 'cmd/forge-research-observer/**'
      - '.github/workflows/forge-live-research-observer.yml'
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    branches: [main]
    paths:
      - 'researchobserver/**'
      - 'researchintake/**'
      - 'cmd/forge-research-intake/**'
      - 'reference/research-intake/**'
      - 'cmd/forge-research-observer/**'
      - '.github/workflows/forge-live-research-observer.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: forge-live-research-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run exact offline metadata and negative classification tests
        run: go test -count=1 ./researchobserver ./cmd/forge-research-observer
      - name: Read the two independent public repositories
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forge-observer"
          gh api 'repos/spoonman136668-ai/Wingless/actions/runs?per_page=50' > "$RUNNER_TEMP/forge-observer/wingless.json"
          gh api 'repos/spoonman136668-ai/Yggdrasil/actions/runs?per_page=50' > "$RUNNER_TEMP/forge-observer/yggdrasil.json"
          go run ./cmd/forge-research-observer \
            --wingless "$RUNNER_TEMP/forge-observer/wingless.json" \
            --yggdrasil "$RUNNER_TEMP/forge-observer/yggdrasil.json" \
            > "$RUNNER_TEMP/forge-observer/observation.json"
      - name: Explicit no-acceptance evidence gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"forge-observer"
          o=json.loads((root/"observation.json").read_text())
          assert o["schema"]=="forge.research.metadata-observation.v1"
          assert o["mode"]=="READ_ONLY_GITHUB_RUN_METADATA_NOT_SCIENTIFIC_EVIDENCE"
          assert o["research_originals_executed"]==0
          assert o["execution_authorized"] is False
          assert o["scientific_accepted"] is False
          assert o["accepted_ref_mutation"] is False
          for key,lane in (("wingless","Wingless"),("yggdrasil","Yggdrasil")):
              r=o[key]
              assert r["lane"]==lane
              assert r["repository"]=="spoonman136668-ai/"+lane
              assert not r["scientific_evidence_authenticated"]
              assert not r["historical_completeness_verified"]
              assert 1<=len(r["runs"])<=50
              assert r["observation_window"]==len(r["runs"])
              for run in r["runs"]:
                  assert run["scientific_classification"]=="UNVERIFIED_NOT_A_SCIENTIFIC_RESULT"
                  assert not run["scientific_accepted"]
                  assert not run["original_first_use_reconciled"]
          print("FORGE_READONLY_TWO_LANE_OBSERVATION=PASS")
          print("SCIENTIFIC_CLASSIFICATIONS_DERIVED_FROM_CI=ZERO")
          print("NEW_ORIGINAL_LAUNCHES=ZERO")
          PY
      - name: Pin exact external GitHub run readbacks and classification bytes
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/forge-observer"
          sha256sum wingless.json yggdrasil.json observation.json > sha256-manifest.txt
          sha256sum --check sha256-manifest.txt
          echo 'FOREIGN_RUN_METADATA_AND_NO_ACCEPTANCE_OBSERVATION_PINNED=PASS'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-observed-research-metadata
          path: ${{ runner.temp }}/forge-observer
          retention-days: 30
          if-no-files-found: error

      - name: Observe current cross-lane PR deltas (read only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/forge-observer"
          gh api 'repos/spoonman136668-ai/Wingless/pulls?state=all&sort=updated&direction=desc&per_page=100' > "$root/wingless-pr.json"
          gh api 'repos/spoonman136668-ai/Yggdrasil/pulls?state=all&sort=updated&direction=desc&per_page=100' > "$root/yggdrasil-pr.json"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"forge-observer"
          items=[]
          for lane in ("Wingless","Yggdrasil"):
              records=json.loads((root/(lane.lower()+"-pr.json")).read_text())
              assert 1<=len(records)<=100
              for r in records:
                  assert r["head"]["repo"]["full_name"]=="spoonman136668-ai/"+lane
                  assert r["base"]["repo"]["full_name"]=="spoonman136668-ai/"+lane
                  items.append(dict(lane=lane,pr=r["number"],head_sha=r["head"]["sha"],title=r["title"],url=r["html_url"],state=r["state"],draft=r["draft"],updated_at=r["updated_at"]))
          items.sort(key=lambda r:(r["lane"],r["pr"],r["head_sha"]))
          (root/"pr-snapshot.json").write_text(json.dumps(dict(schema="forge.cross-lane-research-pr-snapshot.v1",sources=items),ensure_ascii=False)+"\n")
          PY
          go run ./cmd/forge-research-intake --snapshot "$root/pr-snapshot.json" > "$root/pr-observation.json"
          jq -e '.schema == "forge.cross-lane-research-intake.v1" and .scientific_accepted == false and .first_use_cleared == false and .authority_mutated == false' "$root/pr-observation.json" >/dev/null
          (cd "$root"; sha256sum wingless-pr.json yggdrasil-pr.json pr-snapshot.json pr-observation.json > pr-sha256-manifest.txt)
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-observed-crosslane-pr-sources
          path: |
            ${{ runner.temp }}/forge-observer/*-pr.json
            ${{ runner.temp }}/forge-observer/pr-snapshot.json
            ${{ runner.temp }}/forge-observer/pr-observation.json
            ${{ runner.temp }}/forge-observer/pr-sha256-manifest.txt
          retention-days: 90
          if-no-files-found: error
