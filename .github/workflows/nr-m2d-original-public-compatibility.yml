name: NR-M2D Original Public 7-Action Source Contract
on:
  pull_request:
    paths:
      - 'research/nr-m2d/**'
      - '.github/workflows/nr-m2d-original-public-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-public-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Syntax-check original source-pinned public contract and source-free adapter
        run: python -B -m py_compile research/nr-m2d/pinned_original_r10.py research/nr-m2d/full_public_boundary.py research/nr-m2d/test_full_public_boundary.py
      - name: Verify exact original public source and 7-action selected-returned feedback contract
        run: python -B -m unittest discover -s research/nr-m2d -p 'test_*.py' -v
      - name: Confirm no tracked source changes
        run: git diff --exit-code

# This workflow executes zero original Farama worlds and grants no first-use authority.