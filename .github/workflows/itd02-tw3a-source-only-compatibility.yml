name: ITD02 TW3A original-type DEV source-only compatibility
on:
  push:
    branches:
      - research/itd02-tw3-source-custody-20261025
permissions:
  contents: read
jobs:
  tw3a-dev-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact branch/source ancestry and source-only DEV tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor 1d88b61bef6198bc879e19baedd5ffffee3f64f9 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'TW3A_SOURCE_PARENT_DRIFT' }
          if ((git hash-object research/itd02_typed_world/TW3_ORIGINAL_ACTION_CONTROL_PREFLIGHT.json).Trim() -cne 'a240be2848fda662de2232fca1d84734ada4d269') { throw 'FROZEN_TW3_PROTOCOL_CHANGED' }
          if ((git hash-object research/itd02_typed_world/TW2_ORIGINAL_MOVEMENT_OBSERVATION_BOUNDARY.json).Trim() -cne '3788f38b474082ca72033bb6f7ea4a6edef4103e') { throw 'FROZEN_TW2_PROTOCOL_CHANGED' }
          $env:PYTHONDONTWRITEBYTECODE='1'
          $env:PYTHONNOUSERSITE='1'
          python -B -m unittest discover -s research/itd02_typed_world -p 'test_tw*_dev_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'TW3A_DEV_FOCUSED_FAIL' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'TW3A_WORKTREE_DIRTY' }
          Write-Output 'TW3A_SOURCE_ONLY_ORIGINAL_ID_AND_EVENT_ORDER=PASS'
          Write-Output 'TW3A_ORIGINAL_SIM_EXECUTION=ZERO'
          Write-Output 'TW3A_PROTECTED_FIRST_USE=DENIED'
