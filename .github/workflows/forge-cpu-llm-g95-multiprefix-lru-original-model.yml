name: FORGE CPU LLM Evaluation G95 original GPT2 multi-prefix LRU KV
on:
  push:
    branches: [research/cpu-llm-g95-multiprefix-lru-kv-gpt2-20261031]
    paths:
      - '.github/workflows/forge-cpu-llm-g95-multiprefix-lru-original-model.yml'
      - 'research/cpu_g95/**'
permissions:
  contents: read
concurrency:
  group: forge-cpu-llm-g95-multiprefix-lru
  cancel-in-progress: false
jobs:
  source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify G70 baseline and frozen G95 source identity
        shell: bash
        run: |
          set -euo pipefail
          BASE=20a540d0241519e2e9d90ace868ffd6db60bd065
          PREREG=5402308d56b354b599a8f4aecf81a0a15df9715e
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          git merge-base --is-ancestor "$PREREG" HEAD
          test "$(git rev-parse HEAD:docs/research/CPU-G95-GPT2-MULTIPREFIX-LRU-KV-PREREG-20261031.md)" = "248f49e37ec96367890c177d08aa153e545dac68"
          test "$(git rev-parse HEAD:research/cpu_g95/g95_multiprefix_lru_original.py)" = "b401c86e4dff2f25eb995a47ba58884838f232eb"
          test "$(git rev-parse HEAD:research/cpu_g95/test_g95_multiprefix_lru_original.py)" = "1a8dcba25ec602c30cbb0baf2a83666a8b734c93"
          git diff --exit-code "$BASE" HEAD -- research/llm_g54 research/llm_g55 research/llm_g56 research/llm_g57 research/llm_g58 research/llm_g59 research/llm_g60 research/llm_g61 research/llm_g62 research/llm_g63 research/llm_g64 research/llm_g65 research/llm_g66 research/llm_g67 research/llm_g68 research/llm_g70
          python -B -m py_compile research/cpu_g95/g95_multiprefix_lru_original.py research/cpu_g95/test_g95_multiprefix_lru_original.py
          python -B -m unittest discover -s research/cpu_g95 -p 'test_g95_multiprefix_lru_original.py' -v
          echo CPU_G95_SOURCE_ADMISSION=PASS
  original-model-multiprefix-lru:
    needs: source-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify native CPU runner and exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD:research/cpu_g95/g95_multiprefix_lru_original.py)" = "3b1396f28f13ead4ebc1489a0bbf8a83bf2121f6"
          python -B -m unittest discover -s research/cpu_g95 -p 'test_g95_multiprefix_lru_original.py' -v
      - name: Install pinned original CPU GPT2 runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 huggingface-hub==0.30.2 safetensors==0.5.3 tokenizers==0.21.1 psutil==7.1.3
          python -m pip check
          python - <<'PY'
          import torch,transformers
          assert torch.__version__ == "2.5.1+cpu"
          assert torch.version.cuda is None
          assert transformers.__version__ == "4.48.3"
          print("G95_PINNED_CPU_RUNTIME=PASS")
          PY
          python -m pip freeze > cpu_g95_environment.txt
          uname -a >> cpu_g95_environment.txt
          lscpu >> cpu_g95_environment.txt
      - name: Run original GPT2 interleaved multi-prefix LRU cache study
        shell: bash
        run: |
          set -euo pipefail
          python research/cpu_g95/g95_multiprefix_lru_original.py
          python - <<'PY'
          import json
          r=json.load(open("cpu_g95_original_result.json",encoding="utf-8"))
          assert r["schema"] == "forge.cpu-llm-g95.multi-prefix-lru.v1"
          assert r["gate"] == "CPU_G95"
          assert r["preregistration_commit"] == "5402308d56b354b599a8f4aecf81a0a15df9715e"
          assert r["engineering"] == "PASS" and r["correctness"] == "PASS"
          assert r["metrics"]["timed_authentic_responses"] == 768
          assert r["metrics"]["timed_authentic_generated_tokens"] == 6144
          assert r["decision"] in ("MULTIPREFIX_LRU_PASS","MULTIPREFIX_LRU_NO_GO")
          assert r["scientific_acceptance"] == "NOT_GRANTED" and not r["promotion_allowed"]
          assert r["runtime"]["torch_intraop_threads"] == 2
          assert r["runtime"]["torch_interop_threads"] == 1
          print("CPU_G95_RESULT=" + r["decision"])
          PY
      - name: Upload original result and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-g95-original-gpt2-multiprefix-lru
          retention-days: 30
          if-no-files-found: warn
          path: |
            cpu_g95_original_result.json
            cpu_g95_environment.txt
