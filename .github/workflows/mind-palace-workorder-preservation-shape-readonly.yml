name: Mind-Palace blocked workorder preservation shape read-only
on:
  push:
    branches: [diagnostics/mind-palace-private-bridge-20261013]
    paths: ['.github/workflows/mind-palace-workorder-preservation-shape-readonly.yml']
permissions:
  contents: read
concurrency:
  group: mp-workorder-preservation-shape
  cancel-in-progress: false
jobs:
  read:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect only preservation key shape in existing queue database
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: Never
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          function Need([bool]$p,[string]$tag){if(-not $p){throw "MP_WORKORDER_SHAPE_$tag"}}
          Need ($env:GITHUB_REPOSITORY -ceq 'spoonman136668-ai/FORGE' -and
            $env:GITHUB_REF -ceq 'refs/heads/diagnostics/mind-palace-private-bridge-20261013' -and
            $env:RUNNER_NAME -ceq 'FORGE-CODEX-REMOTE') 'ISOLATED_RUNNER'
          Remove-Item Env:GITHUB_TOKEN,Env:GH_TOKEN,Env:OPENAI_API_KEY,Env:AZURE_OPENAI_API_KEY -ErrorAction SilentlyContinue
          $plane=Join-Path $env:USERPROFILE 'GolandProjects\ckb-plane'
          $cfg=Join-Path $plane 'config\autonomy.yaml'
          Need (Test-Path -LiteralPath $cfg -PathType Leaf) 'CONFIG'
          $pre=(Get-FileHash -LiteralPath $cfg -Algorithm SHA256).Hash.ToLowerInvariant()
          $script=@'
          import json, sqlite3, sys, pathlib, re, urllib.parse
          root=pathlib.Path(sys.argv[1]).resolve()
          cfg=pathlib.Path(sys.argv[2]).resolve()
          text=cfg.read_text(encoding="utf-8-sig")
          state_indent=None
          dbrel=None
          for line in text.splitlines():
              indent=len(line)-len(line.lstrip(" "))
              if re.fullmatch(r"\s*state:\s*(?:#.*)?",line):
                  state_indent=indent;continue
              if state_indent is None: continue
              if line.strip() and not line.lstrip().startswith("#") and indent<=state_indent:
                  state_indent=None;continue
              m=re.fullmatch(r"\s*sqlite_path:\s*(.+?)\s*(?:#.*)?",line)
              if m:
                  dbrel=m.group(1).strip().strip("\"'")
                  break
          if not dbrel:
              raise RuntimeError("SQLITE_PATH_NOT_FOUND")
          candidate=pathlib.Path(dbrel)
          dbpath=(candidate if candidate.is_absolute() else root / candidate).resolve()
          if not dbpath.is_relative_to(root) or not dbpath.is_file():
              raise RuntimeError("SQLITE_OUTSIDE_ROOT_OR_MISSING")
          if dbpath.stat().st_size>1024*1024*1024:
              raise RuntimeError("SQLITE_TOO_LARGE")
          # immutable=1 and mode=ro guarantee no SQLite sidecar writes
          uri="file:"+urllib.parse.quote(str(dbpath).replace("\\","/"),safe="/:")+"?mode=ro&immutable=1"
          # Inspect at most 1024 immutable queued envelopes; do not return IDs or contents.
          with sqlite3.connect(uri,uri=True,timeout=1.0) as conn:
              conn.execute("PRAGMA query_only=ON")
              rows=conn.execute("SELECT raw FROM queue_items LIMIT 1025").fetchall()
          if len(rows)>1024:
              raise RuntimeError("TOO_MANY_QUEUE_RECORDS")
          shapes=[]
          mapping_fields={}
          parsed=0
          for (raw,) in rows:
              if not isinstance(raw,(bytes,str)) or len(raw)>1048576:
                  raise RuntimeError("ENVELOPE_INVALID_OR_TOO_LARGE")
              obj=json.loads(raw)
              yamltext=obj.get("work_order_yaml","")
              if not isinstance(yamltext,str) or len(yamltext)>1048576:
                  raise RuntimeError("YAML_INVALID_OR_TOO_LARGE")
              if not yamltext:
                  continue
              parsed+=1
              lines=yamltext.splitlines()
              keys={}
              for i,line in enumerate(lines):
                  match=re.match(r"^(\s*)(preserve|preservation)\s*:\s*(.*?)\s*$",line)
                  if not match:
                      continue
                  key=match.group(2); value=match.group(3)
                  depth=len(match.group(1))
                  if value and not value.startswith("#"):
                      shape="INLINE_SCALAR_OR_FLOW"
                  else:
                      descendants=[s for s in lines[i+1:] if s.strip() and not s.lstrip().startswith("#")]
                      if not descendants:
                          shape="EMPTY"
                      else:
                          nxt=descendants[0]
                          ndepth=len(nxt)-len(nxt.lstrip(" "))
                          shape=("EMPTY" if ndepth<=depth else
                                 "SEQUENCE" if nxt.lstrip().startswith("- ") else
                                 "MAPPING" if re.match(r"^[^:#]+:",nxt.lstrip()) else
                                 "OTHER")
                  keys.setdefault(key,[]).append(shape)
              for shape in keys.get("preservation",[]):
                  shapes.append((shape,len(keys.get("preserve",[]))))
              # Child *field names and value types only*, never actual contents.
              for i,line in enumerate(lines):
                  m=re.match(r"^(\s*)preservation:\s*(?:#.*)?$",line)
                  if not m: continue
                  rootindent=len(m.group(1))
                  children=[]
                  for subline in lines[i+1:]:
                      if not subline.strip() or subline.lstrip().startswith("#"):
                          continue
                      indent=len(subline)-len(subline.lstrip(" "))
                      if indent<=rootindent:
                          break
                      mm=re.match(r"^\s*([A-Za-z][A-Za-z0-9_]{0,39})\s*:\s*(.*?)\s*$",subline)
                      if mm:
                          children.append((indent,mm.group(1),mm.group(2)))
                  if not children: continue
                  minindent=min(a for a,b,c in children)
                  for indent,name,val in children:
                      if indent==minindent:
                          mapping_fields.setdefault(name,set()).add("INLINE" if val and not val.startswith("#") else "BLOCK")

          print("MP_WORKORDER_SHAPE_ENVELOPE_COUNT="+str(len(rows)))
          print("MP_WORKORDER_SHAPE_SOURCE_YAML_COUNT="+str(parsed))
          print("MP_WORKORDER_SHAPE_PRESERVATION_KEY_COUNT="+str(len(shapes)))
          print("MP_WORKORDER_SHAPE_PRESERVATION_TYPES="+",".join(sorted(set(p[0] for p in shapes))) if shapes else "MP_WORKORDER_SHAPE_PRESERVATION_TYPES=NONE")
          print("MP_WORKORDER_SHAPE_COEXISTING_PRESERVE_KEYS="+str(sum(p[1] for p in shapes)))
          print("MP_WORKORDER_SHAPE_MAPPING_FIELD_NAMES="+",".join(sorted(mapping_fields)))
          print("MP_WORKORDER_SHAPE_MAPPING_VALUE_LAYOUTS="+",".join(f"{name}:{'+'.join(sorted(mapping_fields[name]))}" for name in sorted(mapping_fields)))
          print("MP_WORKORDER_SHAPE_READONLY_DB=TRUE")
          print("MP_WORKORDER_SHAPE_CONTENT_DISCLOSED=FALSE")
          '@
          & python.exe -B -c $script $plane $cfg
          Need ($LASTEXITCODE -eq 0) 'PYTHON_EXTRACT'
          Need ((Get-FileHash -LiteralPath $cfg -Algorithm SHA256).Hash.ToLowerInvariant() -ceq $pre) 'CONFIG_MUTATED'
          Write-Host 'MP_WORKORDER_SHAPE_CONFIG_HASH_UNCHANGED=PASS'
          Write-Host 'MP_WORKORDER_SHAPE_CONTROLLER_AND_QUEUE_WRITES=0'
          Write-Host 'MP_WORKORDER_SHAPE_KTRADE_ACTIONS=0'
