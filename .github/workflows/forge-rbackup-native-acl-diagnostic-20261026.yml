name: FORGE RBACKUP native ACL diagnostic
on:
  push:
    branches:
      - qualification/forge-rbackup-token-probe-20261026
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate CreateDirectoryW with a protected ACL in RUNNER_TEMP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'RBACKUP_ACL_DIAGNOSTIC_WRONG_RUNNER' }
          Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          public static class RbackupAtomicDirectoryProbe {
              [StructLayout(LayoutKind.Sequential)]
              private struct SECURITY_ATTRIBUTES {
                  public int nLength;
                  public IntPtr lpSecurityDescriptor;
                  [MarshalAs(UnmanagedType.Bool)] public bool bInheritHandle;
              }
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true, EntryPoint = "CreateDirectoryW")]
              [return: MarshalAs(UnmanagedType.Bool)]
              private static extern bool CreateDirectory(string path, ref SECURITY_ATTRIBUTES securityAttributes);
              public static void Create(string path, byte[] descriptor) {
                  IntPtr memory = Marshal.AllocHGlobal(descriptor.Length);
                  try {
                      Marshal.Copy(descriptor, 0, memory, descriptor.Length);
                      SECURITY_ATTRIBUTES attributes = new SECURITY_ATTRIBUTES {
                          nLength = Marshal.SizeOf(typeof(SECURITY_ATTRIBUTES)),
                          lpSecurityDescriptor = memory,
                          bInheritHandle = false
                      };
                      if (!CreateDirectory(path, ref attributes)) {
                          throw new Win32Exception(Marshal.GetLastWin32Error());
                      }
                  } finally {
                      Marshal.FreeHGlobal(memory);
                  }
              }
          }
          '@
          $owner = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $acl = [Security.AccessControl.DirectorySecurity]::new()
          $acl.SetOwner($owner)
          $acl.SetAccessRuleProtection($true, $false)
          $rule = [Security.AccessControl.FileSystemAccessRule]::new(
            $owner, [Security.AccessControl.FileSystemRights]::FullControl,
            [Security.AccessControl.InheritanceFlags]'ContainerInherit,ObjectInherit',
            [Security.AccessControl.PropagationFlags]::None,
            [Security.AccessControl.AccessControlType]::Allow)
          $acl.AddAccessRule($rule)
          $probe = Join-Path $env:RUNNER_TEMP ('rbackup-acl-probe-' + [guid]::NewGuid().ToString('N'))
          try {
            [RbackupAtomicDirectoryProbe]::Create($probe, $acl.GetSecurityDescriptorBinaryForm())
            $saved = Get-Acl -LiteralPath $probe
            if (@($saved.Access).Count -ne 1) { throw 'RBACKUP_ACL_RULE_COUNT_UNEXPECTED' }
            Write-Output 'RBACKUP_ATOMIC_ACL_CREATE=PASS'
            Write-Output 'RBACKUP_ACL_PRIVATE_RULE_COUNT=1'
          } finally {
            if (Test-Path -LiteralPath $probe) { Remove-Item -LiteralPath $probe -Recurse -Force -ErrorAction SilentlyContinue }
          }
