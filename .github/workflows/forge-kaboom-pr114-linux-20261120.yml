name: FORGE KABOOM PR114 Linux exact-source ICE/Graphify independent qualification
on:
  push:
    branches: [qualification/kaboom-pr114-offline-custody-20261120]
    paths: [.github/workflows/forge-kaboom-pr114-linux-20261120.yml]
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_KTERM_SHA: '8c527217d25dbe438f8547bdc130876a0d7e4a15'
      EXPECTED_KTERM_TREE: 'f65aac53167f25e73cfa8c4858ef7a2eaf7cb461'
      EXPECTED_CORE_TREE: 'bbd095b3c7e932db16fb22d1390d951fba96ad92'
      K_TERMINAL_EXECUTION_MODE: PAPER
      PYTHONDONTWRITEBYTECODE: '1'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
    steps:
      - name: Verify original isolated Linux qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/FORGE
          test "$GITHUB_REF" = refs/heads/qualification/kaboom-pr114-offline-custody-20261120
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ENVIRONMENT" = github-hosted
          for n in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET; do
            test -z "$(printenv "$n" || true)" || { echo BROKER_AUTHORITY_BLOCKED; exit 2; }
          done
          echo KABOOM_PR114_LINUX_ISOLATION=PASS
      - name: Checkout exact candidate, no retained credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Kboomllc/K-Terminal
          ref: 8c527217d25dbe438f8547bdc130876a0d7e4a15
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: Source custody, generated maps, negative controls and Go syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_KTERM_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_KTERM_TREE"
          test "$(git rev-parse HEAD:kaboom-core)" = "$EXPECTED_CORE_TREE"
          test ! -e .env
          test ! -e config.json
          test -z "$(git status --porcelain)"
          python -B tools/architecture/verify_source_custody.py
          python -B tools/architecture/generate.py --check
          python -B -m unittest discover -s tools/architecture -p 'test_*.py' -v
          python -B -m unittest discover -s tools/acceptance -p 'test_*.py' -v
          GO111MODULE=off go run tools/architecture/verify_go_syntax.go kaboom-core
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo KABOOM_PR114_LINUX_CUSTODY_MAPS_NEGATIVES_AST=PASS
      - name: Independently verify pinned code-only Graphify and source receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kaboom-wheel"
          python -m pip download --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/kaboom-wheel" 'graphifyy==0.9.92'
          wheel="$RUNNER_TEMP/kaboom-wheel/graphifyy-0.9.92-py3-none-any.whl"
          echo "9722846e627a369150107dd792145c3e3a53e3d3da46f7a7bff9f96b75da857c  $wheel" | sha256sum -c -
          python -m pip install "$wheel"
          python -c "from importlib.metadata import version; assert version('graphifyy') == '0.9.92'"
          graphify extract . --code-only --max-workers 4 > "$RUNNER_TEMP/kaboom-pr114-graphify-private.log" 2>&1
          graphify cluster-only . --no-label >> "$RUNNER_TEMP/kaboom-pr114-graphify-private.log" 2>&1
          python tools/architecture/publish_graphify.py --root . --input graphify-out --output "$RUNNER_TEMP/kaboom-pr114-graph" --source-sha "$EXPECTED_KTERM_SHA"
          python - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"kaboom-pr114-graph"
          man=json.loads(pathlib.Path(".ice/manifest.json").read_text())
          stamp=json.loads((out/"source-manifest.json").read_text())
          assert stamp["source_commit"]==os.environ["EXPECTED_KTERM_SHA"]
          assert stamp["source_content_sha256"]==man["source_content_sha256"]
          for name in ("graph.json","graph.html","GRAPH_REPORT.md"):
              p=out/name
              assert p.is_file() and p.stat().st_size>0
              assert hashlib.sha256(p.read_bytes()).hexdigest()==stamp["files_sha256"][name]
          PY
          test "$(git rev-parse HEAD)" = "$EXPECTED_KTERM_SHA"
          echo KABOOM_PR114_LINUX_GRAPHIFY=PASS
          echo KABOOM_PR114_LINUX_FINAL=PASS
          echo KABOOM_PR114_ORDERS=ZERO
          echo KABOOM_PR114_DEPLOYMENT=NONE
