name: Optimizer O5 public online-state source-only qualification

on:
  push:
    branches: [research/optimizer-o5-online-local-belief-20261023]
    paths:
      - '.github/workflows/optimizer-o5-sourceonly.yml'
      - 'research/optimizer_o5/**'

permissions:
  contents: read

concurrency:
  group: optimizer-o5-sourceonly
  cancel-in-progress: false

jobs:
  public-development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 14
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact main parent protocol and original O4 comparator blob
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5'
          $common = (& git merge-base $base HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $common -cne $base) { throw 'O5_MAIN_PARENT_DRIFT' }
          $expected = @(
            '.github/workflows/optimizer-o5-sourceonly.yml',
            'research/optimizer_o5/O5_FROZEN_PROTOCOL.json',
            'research/optimizer_o5/o4_frozen_controls.py',
            'research/optimizer_o5/public_source.py',
            'research/optimizer_o5/online_local.py',
            'research/optimizer_o5/public_dev.py',
            'research/optimizer_o5/test_online.py'
          )
          $changes = @(& git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0 -or $changes.Count -ne $expected.Count -or
              (Compare-Object $changes $expected)) { throw 'O5_DELTA_DRIFT' }
          $pins = @{
            'research/optimizer_o5/O5_FROZEN_PROTOCOL.json' = '4de54123164d0e9ad67765f91ddc788d6991ee6b'
            'research/optimizer_o5/o4_frozen_controls.py' = '3ab09e0b9b27a3404ddaf81fdc3c26cc87ba7a4c'
          }
          foreach ($path in $pins.Keys) {
            $headBlob = (& git rev-parse ('HEAD:' + $path)).Trim()
            $diskBlob = (& git hash-object --no-filters -- $path).Trim()
            if ($LASTEXITCODE -ne 0 -or $headBlob -cne $pins[$path] -or
                $diskBlob -cne $pins[$path]) { throw ('O5_SOURCE_BLOB_CHANGED_' + $path) }
          }
          Write-Host 'O5_FROZEN_SOURCE=PASS'
      - name: O5 focused online learning and original HMM controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s research/optimizer_o5 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'O5_ADVERSARIAL_TEST_FAILURE' }
          Write-Host 'O5_FOCUSED_TESTS=PASS'
      - name: Fresh O5 public development full-fitted comparison
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B research/optimizer_o5/public_dev.py
          if ($LASTEXITCODE -ne 0) { throw 'O5_PUBLIC_TRAIN_SELECT_DEV_FAILURE' }
          Write-Host 'O5_PUBLIC_DEV_RECEIPTS=EMITTED'
          Write-Host 'O5_PROTECTED_SCIENCE=NOT_STARTED'
          Write-Host 'O5_SCIENCE_ADMISSION=NONE'
      - name: Single final Go test vet build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo O5_FINAL_GO_REGRESSION=PASS
      - name: Verify no side-effects or dirty worktree
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(& git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) { throw 'O5_WORKTREE_NOT_CLEAN' }
          Write-Host 'O5_DEVELOPMENT_ONLY=PASS'
