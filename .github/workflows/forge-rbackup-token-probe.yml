name: FORGE private RBACKUP credential permission probe
on:
  push:
    branches: [qualification/forge-rbackup-token-probe-20261026]
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    steps:
      - name: Check existing private vault access without disclosure or mutation
        shell: pwsh
        env:
          RBACKUP_WRITE_TOKEN: ${{ secrets.RBACKUP_WRITE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') {
            throw 'RBACKUP_PROBE_WRONG_RUNNER_OR_REPOSITORY'
          }
          if ([string]::IsNullOrWhiteSpace($env:RBACKUP_WRITE_TOKEN)) {
            throw 'RBACKUP_WRITE_TOKEN_UNAVAILABLE'
          }
          $headers = @{
            Authorization = "Bearer $($env:RBACKUP_WRITE_TOKEN)"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          try {
            $repo = Invoke-RestMethod -Method Get -Uri 'https://api.github.com/repos/spoonman136668-ai/rbackup' -Headers $headers -TimeoutSec 20
          } catch {
            throw 'RBACKUP_TOKEN_REPO_READ_DENIED'
          }
          if ($repo.visibility -cne 'private') {
            throw 'RBACKUP_REPOSITORY_VISIBILITY_MISMATCH'
          }
          if ($repo.permissions.push -ne $true) {
            Write-Output 'RBACKUP_PRIVATE_READ=PASS'
            Write-Output 'RBACKUP_WRITE_PERMISSION=ABSENT'
            throw 'RBACKUP_WRITE_PERMISSION_MISSING'
          }
          Write-Output 'RBACKUP_PRIVATE_READ=PASS'
          Write-Output 'RBACKUP_WRITE_PERMISSION=PASS'
          Write-Output 'SECRET_VALUE_OUTPUT=NONE'
          Write-Output 'RBACKUP_MUTATION=NONE'
