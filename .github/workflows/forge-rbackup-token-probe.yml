name: FORGE private RBACKUP Windows custody-source qualification
on:
  push:
    branches: [qualification/forge-rbackup-token-probe-20261026]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 15
    steps:
      - name: Fetch pinned private RBACKUP source, then run offline Windows tests
        shell: pwsh
        env:
          RBACKUP_WRITE_TOKEN: ${{ secrets.RBACKUP_WRITE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $repoName = 'spoonman136668-ai/rbackup'
          $source = 'aac8b2983e89d454e4e65efa50e1ba51d4ee30f8'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'RBACKUP_QUALIFICATION_WRONG_RUNNER' }
          if ([string]::IsNullOrWhiteSpace($env:RBACKUP_WRITE_TOKEN)) { throw 'RBACKUP_WRITE_TOKEN_UNAVAILABLE' }
          $headers = @{ Authorization = "Bearer $($env:RBACKUP_WRITE_TOKEN)"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $root = Join-Path $env:RUNNER_TEMP ('rbackup-source-tests-' + $env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $root) { throw 'RBACKUP_SCRATCH_ALREADY_EXISTS' }
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          $fetchCount = 0
          $phase = 'commit'
          try {
            try {
              $commit = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$repoName/commits/$source" -Headers $headers -TimeoutSec 20
              if ($commit.sha -cne $source) { throw 'RBACKUP_PIN_MISMATCH' }
              $phase = 'tree'
              $treeSha = [string]$commit.commit.tree.sha
              $tree = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$repoName/git/trees/$treeSha?recursive=1" -Headers $headers -TimeoutSec 20
              $files = @(
                'scripts/age_recovery_preflight.py',
                'scripts/age_synthetic_d1_roundtrip.py',
                'scripts/d1_encrypted_export.py',
                'scripts/d1_isolated_restore_verify.py',
                'tests/test_age_recovery_preflight.py',
                'tests/test_age_synthetic_d1_roundtrip.py',
                'tests/test_d1_encrypted_export.py',
                'tests/test_d1_isolated_restore_verify.py'
              )
              foreach ($file in $files) {
                $entry = @($tree.tree | Where-Object { $_.path -ceq $file -and $_.type -ceq 'blob' })
                if ($entry.Count -ne 1 -or [string]$entry[0].sha -notmatch '^[0-9a-f]{40}$') { throw 'RBACKUP_PINNED_BLOB_MISSING' }
                $phase = 'blob'
                $blob = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$repoName/git/blobs/$($entry[0].sha)" -Headers $headers -TimeoutSec 20
                if ($blob.encoding -cne 'base64') { throw 'RBACKUP_PINNED_BLOB_ENCODING_UNEXPECTED' }
                $dest = Join-Path $root ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
                New-Item -ItemType Directory -Path (Split-Path -Parent $dest) -Force | Out-Null
                [IO.File]::WriteAllBytes($dest, [Convert]::FromBase64String(($blob.content -replace '\s', '')))
                $fetchCount++
              }
            } catch {
              $status = 'none'
              try { if ($_.Exception.Response.StatusCode) { $status = [string][int]$_.Exception.Response.StatusCode } } catch {}
              Write-Output "RBACKUP_SOURCE_FETCH_PHASE=$phase"
              Write-Output "RBACKUP_SOURCE_FETCH_HTTP_STATUS=$status"
              Write-Output "RBACKUP_SOURCE_FILES_FETCHED=$fetchCount"
              Write-Output "RBACKUP_SOURCE_FETCH_ERROR_TYPE=$($_.Exception.GetType().Name)"
              throw 'RBACKUP_PINNED_SOURCE_FETCH_FAILED'
            }
            Remove-Item Env:RBACKUP_WRITE_TOKEN,Env:GH_TOKEN,Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
            $headers.Clear()
            Push-Location $root
            try {
              $python = Get-Command python -ErrorAction Stop
              & $python.Source -B -m unittest discover -s tests -p 'test_*.py' -v
              if ($LASTEXITCODE -ne 0) { throw 'RBACKUP_WINDOWS_SOURCE_TESTS_FAILED' }
              Write-Output 'RBACKUP_WINDOWS_SOURCE_TESTS=PASS'
              Write-Output "RBACKUP_SOURCE_SHA=$source"
              Write-Output 'CLOUDFLARE_ACCESS=NONE'
              Write-Output 'D1_EXPORT=NOT_EXECUTED'
              Write-Output 'RBACKUP_WRITE=NONE'
            } finally { Pop-Location }
          } finally {
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          }
