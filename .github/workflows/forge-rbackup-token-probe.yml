name: FORGE private RBACKUP Windows custody-source qualification
on:
  push:
    branches: [qualification/forge-rbackup-token-probe-20261026]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 15
    steps:
      - name: Checkout exact private RBACKUP source without persisted credentials
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/rbackup
          ref: 27d18fd1b29cde338c38d100224890b2f5cb7eb7
          token: ${{ secrets.RBACKUP_WRITE_TOKEN }}
          path: rbackup-source
          fetch-depth: 1
          persist-credentials: false
      - name: Run offline Windows custody-source regression without credentials
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'RBACKUP_QUALIFICATION_WRONG_RUNNER' }
          $root = Join-Path $env:GITHUB_WORKSPACE 'rbackup-source'
          $expected = '27d18fd1b29cde338c38d100224890b2f5cb7eb7'
          try {
            $head = (& git -C $root rev-parse HEAD | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $head -cne $expected) { throw 'RBACKUP_SOURCE_IDENTITY_MISMATCH' }
            if ((& git -C $root status --porcelain --untracked-files=all | Out-String).Trim().Length -gt 0) { throw 'RBACKUP_CHECKOUT_NOT_CLEAN' }
            Remove-Item Env:RBACKUP_WRITE_TOKEN,Env:GH_TOKEN,Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
            $python = Get-Command python -ErrorAction Stop
            Push-Location $root
            try {
              & $python.Source -B -m unittest discover -s tests -p 'test_*.py' -v
              if ($LASTEXITCODE -ne 0) { throw 'RBACKUP_WINDOWS_SOURCE_TESTS_FAILED' }
            } finally { Pop-Location }
            Write-Output 'RBACKUP_WINDOWS_SOURCE_TESTS=PASS'
            Write-Output "RBACKUP_SOURCE_SHA=$head"
            Write-Output 'CLOUDFLARE_ACCESS=NONE'
            Write-Output 'D1_EXPORT=NOT_EXECUTED'
            Write-Output 'RBACKUP_WRITE=NONE'
            $age = [bool](Get-Command age -ErrorAction SilentlyContinue)
            $ageKeygen = [bool](Get-Command age-keygen -ErrorAction SilentlyContinue)
            Write-Output "AGE_BINARY_AVAILABLE=$($age.ToString().ToUpperInvariant())"
            Write-Output "AGE_KEYGEN_AVAILABLE=$($ageKeygen.ToString().ToUpperInvariant())"
            Write-Output "CLOUDFLARE_TOKEN_CONFIGURED=$([bool](-not [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)))"
            Write-Output "CLOUDFLARE_ACCOUNT_ID_CONFIGURED=$([bool](-not [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)))"
            Write-Output "CLOUDFLARE_D1_ID_CONFIGURED=$([bool](-not [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_D1_DATABASE_ID)))"
            $localRoot = Join-Path $env:LOCALAPPDATA 'rbackup-custody'
            $primary = Join-Path $localRoot 'primary/identity.txt'
            $recovery = Join-Path $localRoot 'recovery/identity.txt'
            Write-Output "LOCAL_PRIMARY_IDENTITY_PRESENT=$(Test-Path -LiteralPath $primary -PathType Leaf)"
            Write-Output "LOCAL_RECOVERY_IDENTITY_PRESENT=$(Test-Path -LiteralPath $recovery -PathType Leaf)"
          } finally {
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          }
