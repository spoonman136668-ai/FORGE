name: FORGE NCI-04G7C-1 resource acceptance boundary
on:
  pull_request:
    paths:
      - 'research/nci04g7c1/**'
      - '.github/workflows/forge-nci04g7c1-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-boundary-meter-smoke-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Qualify task interface contract and bounded Linux meter
        run: python3 -B research/nci04g7c1/test_process_meter.py
      - name: Audit evidence-only scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b40a3f038266fec5d065986b9f93d46f02f13d6b HEAD
          diff="$(git diff --name-only b40a3f038266fec5d065986b9f93d46f02f13d6b HEAD | sort)"
          expect="$(printf '%s\n' '.github/workflows/forge-nci04g7c1-boundary.yml' 'research/nci04g7c1/process_meter.py' 'research/nci04g7c1/task_resource_contract.json' 'research/nci04g7c1/test_process_meter.py' | sort)"
          test "$diff" = "$expect"
          test -z "$(git status --porcelain)"
          echo NCI04G7C1_SOURCE_AND_METER_CONTRACT=QUALIFIED
          echo NCI04G7C1_INDEPENDENT_HELDOUT=NOT_ADMITTED
          echo NCI04G7C1_SCIENTIFIC_FIRST_USE=ZERO
          echo NCI04G7C1_ALL_IN_CPU_RSS=NOT_QUALIFIED
