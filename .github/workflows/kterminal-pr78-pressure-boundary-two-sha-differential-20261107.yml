name: K Terminal PR78 nested-job-fixed fresh Windows personal diagnostic build
on:
  push:
    branches: [qualification/kterminal-pr73-p5-source-20261106]
    paths: [.github/workflows/kterminal-pr78-pressure-boundary-two-sha-differential-20261107.yml]
permissions:
  contents: read
concurrency:
  group: kterminal-pr78-fresh-install-package
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      FORGE_PARENT: c4a4fd5406c6d30227e2bbd6e1a1ea8f7f88bd4a
      KTERM_SHA: 070ad561de7183f7f28e363d96d354a62f509172
      KTERM_TREE: e5e611ef50a8dd0b5b4ba5c5947c7320c08d31ae
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
    steps:
      - name: Checkout exact existing FORGE qualification scope
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify only reused workflow changed; no execution authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'spoonman136668-ai/FORGE'
          test "$GITHUB_REF" = 'refs/heads/qualification/kterminal-pr73-p5-source-20261106'
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$FORGE_PARENT" HEAD
          test "$(git diff --name-only "$FORGE_PARENT" HEAD)" = '.github/workflows/kterminal-pr78-pressure-boundary-two-sha-differential-20261107.yml'
          test -z "$(git status --porcelain)"
          echo FRESH_INSTALL_FORGE_SCOPE=PASS
      - name: Checkout original private K Terminal exact PR78 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: 070ad561de7183f7f28e363d96d354a62f509172
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Use original qualified Windows Go 1.26.5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify source, toolchain and no configured credentials
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$KTERM_SHA" || { echo FRESH_PREFLIGHT_FAILED_SOURCE_SHA; exit 3; }
          test "$(git rev-parse 'HEAD^{tree}')" = "$KTERM_TREE" || { echo FRESH_PREFLIGHT_FAILED_SOURCE_TREE; exit 3; }
          test "$(git rev-parse HEAD:BUILD.ps1)" = '1fa3a6b5a001a8ba63132db0d53f9d80c48190e8' || { echo FRESH_PREFLIGHT_FAILED_BUILD_BLOB; exit 3; }
          test "$(git rev-parse HEAD:cmd/launcher/desktop-session.cs)" = '5ca4dfe0c695c4f7b83dbe19f95e4dfc23679efd' || { echo FRESH_PREFLIGHT_FAILED_LAUNCHER_BLOB; exit 3; }
          test "$(git rev-parse HEAD:verification/build-ui-runtime.ps1)" = '892f3a93fe26a7304268667c28a1d5e9d1e87676' || { echo FRESH_PREFLIGHT_FAILED_WPF_BLOB; exit 3; }
          test "$(git rev-parse HEAD:go.mod)" = 'b3ede0d8444c08b3e7b23f1396374359b54134c6' || { echo FRESH_PREFLIGHT_FAILED_GO_MOD; exit 3; }
          test -z "$(git status --porcelain)" || { echo FRESH_PREFLIGHT_FAILED_SOURCE_CLEAN; exit 3; }
          test ! -e .env || { echo FRESH_PREFLIGHT_FAILED_NO_ENV; exit 3; }
          test ! -e config.json || { echo FRESH_PREFLIGHT_FAILED_NO_CONFIG; exit 3; }
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER || { echo FRESH_PREFLIGHT_FAILED_PAPER_MODE; exit 3; }
          go version | grep -F 'go1.26.5 windows/amd64' >/dev/null || { echo FRESH_PREFLIGHT_FAILED_GO_COMPILER; exit 3; }
          for key in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET KTERM_COINBASE_TEST_KEY_NAME KTERM_COINBASE_TEST_KEY_SECRET K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK; do
            if [[ -n "${!key:-}" ]]; then echo FRESH_INSTALL_CREDENTIAL_REFUSED; exit 2; fi
          done
          echo FRESH_INSTALL_EXACT_SOURCE_NO_BROKER=PASS
      - name: Build original complete Windows application and desktop UI
        shell: pwsh
        working-directory: kterminal-private
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'kterm-build-private.log'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\BUILD.ps1 *> $log
          if($LASTEXITCODE -ne 0){throw 'FRESH_INSTALL_ORIGINAL_BUILD_FAILED'}
          $uiLog=Join-Path $env:RUNNER_TEMP 'kterm-ui-private.log'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\verification\build-ui-runtime.ps1 -Root (Get-Location).Path *> $uiLog
          if($LASTEXITCODE -ne 0){throw 'FRESH_INSTALL_ORIGINAL_UI_RUNTIME_FAILED'}
          foreach($name in @('K-Terminal.exe','K-Terminal-Engine.exe','K-Terminal-Account-Lookup.exe','K-Terminal-Chart.exe','K-Terminal-Chart-History.exe','K-Terminal-Subminute-Chart.exe','K-Terminal-Intelligence.exe','K-Terminal-Notifications.exe','KTerminal.UI.dll')){
            $f=Join-Path (Get-Location).Path $name
            if(-not (Test-Path -LiteralPath $f -PathType Leaf)){throw ('FRESH_INSTALL_MISSING_BINARY_'+$name)}
            if((Get-Item -LiteralPath $f).Length -lt 1024){throw ('FRESH_INSTALL_EMPTY_BINARY_'+$name)}
          }
          Write-Host 'FRESH_INSTALL_COMPLETE_ORIGINAL_BUILD=PASS'
      - name: Verify new C# launcher starts a nested job-owned disarmed child
        shell: pwsh
        working-directory: kterminal-private
        run: |
          $ErrorActionPreference='Stop'
          $smoke=Join-Path $env:RUNNER_TEMP ('kterminal-nested-disarmed-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $smoke){throw 'NESTED_SMOKE_ROOT_REUSE'}
          [void][IO.Directory]::CreateDirectory($smoke)
          Copy-Item -LiteralPath (Join-Path (Get-Location).Path 'K-Terminal.exe') -Destination (Join-Path $smoke 'K-Terminal.exe')
          $stub=@'
          Set-Content -LiteralPath (Join-Path $PSScriptRoot 'started.marker') -Value 'PAPER_DISARMED' -Encoding Ascii
          exit 0
          '@
          [IO.File]::WriteAllText((Join-Path $smoke 'launch-kterminal.ps1'),$stub,[Text.UTF8Encoding]::new($false))
          $owner=Start-Process -FilePath (Join-Path $smoke 'K-Terminal.exe') -WorkingDirectory $smoke -PassThru
          if(-not $owner.WaitForExit(25000)){
            try{$owner.Kill()}catch{}
            throw 'NESTED_SUPERVISOR_STALLED'
          }
          if($owner.ExitCode -ne 0){throw ('NESTED_SUPERVISOR_EXIT_'+$owner.ExitCode)}
          if(-not(Test-Path -LiteralPath (Join-Path $smoke 'started.marker'))){throw 'NESTED_CHILD_NOT_STARTED'}
          if((Get-Content -LiteralPath (Join-Path $smoke 'started.marker') -Raw).Trim() -cne 'PAPER_DISARMED'){throw 'NESTED_CHILD_MARKER_MISMATCH'}
          $log=Join-Path $smoke 'data\logs\launcher.log'
          if(-not(Test-Path -LiteralPath $log)){throw 'NESTED_LIFECYCLE_LOG_MISSING'}
          $events=@(Get-Content -LiteralPath $log)
          if(@($events | Where-Object {$_ -match 'STARTED' -and $_ -match 'nested job-owned desktop session'}).Count -ne 1 -or
             @($events | Where-Object {$_ -match 'ENDED' -and $_ -match 'exit=0'}).Count -ne 1){
             throw 'NESTED_LIFECYCLE_NOT_VERIFIED'
          }
          Write-Host 'KTERM_NESTED_DISARMED_CHILD=PASS;BROKER_POSTS=0'
      - name: Assemble credential-free portable first-install ZIP with exact-SHA manifest
        shell: pwsh
        working-directory: kterminal-private
        run: |
          $ErrorActionPreference='Stop'
          $source=(Get-Location).Path
          $out=Join-Path $env:RUNNER_TEMP 'kterminal-pr78-fresh-safe'
          $root=Join-Path $out 'K-Terminal-Personal-PR78-Diagnostic'
          [void][IO.Directory]::CreateDirectory($root)
          $binaries=@('K-Terminal.exe','K-Terminal-Engine.exe','K-Terminal-Account-Lookup.exe','K-Terminal-Chart.exe','K-Terminal-Chart-History.exe','K-Terminal-Subminute-Chart.exe','K-Terminal-Intelligence.exe','K-Terminal-Notifications.exe','KTerminal.UI.dll')
          $rootFiles=@(Get-ChildItem -LiteralPath $source -File | Where-Object {$_.Extension -in @('.ps1','.cs','.json','.bat')} )
          $rootFiles+=@(Get-Item -LiteralPath (Join-Path $source 'VERSION'),(Join-Path $source 'LAUNCHER-REVISION'))
          foreach($f in $rootFiles){Copy-Item -LiteralPath $f.FullName -Destination (Join-Path $root $f.Name)}
          foreach($name in $binaries){Copy-Item -LiteralPath (Join-Path $source $name) -Destination (Join-Path $root $name)}
          Copy-Item -LiteralPath (Join-Path $source 'assets') -Destination (Join-Path $root 'assets') -Recurse
          [void][IO.Directory]::CreateDirectory((Join-Path $root 'diagnostics'))
          Copy-Item -LiteralPath (Join-Path $source 'verification\KTerminal-Live-Session-Recorder-v1.2.ps1') -Destination (Join-Path $root 'diagnostics\KTerminal-Live-Session-Recorder-v1.2.ps1')
          $guide=@'
          K Terminal Personal - PR78 first-install diagnostic package
          
          1. Extract the complete folder to a new, short writable directory on Windows.
          2. This package contains NO config.json, .env, brokerage credentials, or account history.
          3. Open K-Terminal.exe directly from File Explorer. The normal configuration flow applies.
          4. Startup is disarmed and LIVE alerts remain PAUSED. READY does not authorize orders.
          5. Complete normal account/portfolio checks and reconciliation before any activation.
          6. The isolated $5-$8 diagnostic is NOT enabled by installation. A separate authorized
             one-use start must set the original two opt-in environment variables, using a new
             absolute one-POST lock path; never delete an existing lock to retry.
          7. Optional sanitized timing observation uses K_TERMINAL_P5_LATENCY=1 and
             diagnostics/KTerminal-Live-Session-Recorder-v1.2.ps1.
          8. Never publish complete logs, runtime data, or credentials.
          
          This ZIP is an unpromoted test installation, not a live-tested release.
          Source: Kboomllc/K-Terminal@070ad561de7183f7f28e363d96d354a62f509172
          '@
          [IO.File]::WriteAllText((Join-Path $root 'FIRST-INSTALL-README.txt'),$guide,[Text.UTF8Encoding]::new($false))
          foreach($bad in @('config.json','.env','pending-program-update.json','data')){
            if(Test-Path -LiteralPath (Join-Path $root $bad)){throw ('FRESH_INSTALL_PRIVATE_STATE_IN_ARCHIVE_'+$bad)}
          }
          $files=@(Get-ChildItem -LiteralPath $root -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative=$_.FullName.Substring($root.Length+1).Replace('\','/')
            [pscustomobject]@{path=$relative;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant();size=$_.Length}
          })
          if($files.Count -lt 55){throw 'FRESH_INSTALL_INCOMPLETE_PROGRAM_CONTENTS'}
          $manifest=[ordered]@{
            schema='kterminal.first-install.pr78.v1'
            edition='personal'
            revision='PR78-unpromoted-diagnostic'
            source_sha=$env:KTERM_SHA
            source_tree=$env:KTERM_TREE
            forge_package_sha=$env:GITHUB_SHA
            toolchain='go1.26.5 windows/amd64'
            binaries=$binaries
            user_config_included=$false
            live_execution_authorized=$false
            installed=$false
            files=$files
          }
          $json=$manifest|ConvertTo-Json -Depth 7
          [IO.File]::WriteAllText((Join-Path $root 'package-manifest.json'),$json,[Text.UTF8Encoding]::new($false))
          $checks=@($files | ForEach-Object {$_.sha256+'  '+$_.path}) -join "`n"
          [IO.File]::WriteAllText((Join-Path $root 'SHA256SUMS.txt'),($checks+"`n"),[Text.UTF8Encoding]::new($false))
          $zip=Join-Path $out 'K-Terminal-Personal-PR78-Fresh-Install.zip'
          Compress-Archive -LiteralPath $root -DestinationPath $zip -CompressionLevel Optimal
          if(-not(Test-Path -LiteralPath $zip -PathType Leaf)){throw 'FRESH_INSTALL_ZIP_NOT_CREATED'}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive=[IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries=@($archive.Entries|Where-Object{-not $_.FullName.EndsWith('/')})
            if($entries.Count -ne ($files.Count+2)){throw 'FRESH_INSTALL_ZIP_ENTRY_COUNT_MISMATCH'}
            foreach($binary in $binaries){
              if(@($entries|Where-Object{$_.FullName.EndsWith('/'+$binary)}).Count -ne 1){throw ('FRESH_INSTALL_ZIP_BINARY_MISSING_'+$binary)}
            }
            if(@($entries|Where-Object{$_.FullName -match '(?i)(^|/)(config\.json|\.env|data/)' }).Count -gt 0){throw 'FRESH_INSTALL_PRIVATE_FILES_FOUND'}
          } finally {$archive.Dispose()}
          $zipDigest=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $receipt=[ordered]@{
            schema='forge.kterminal.pr78.first-install-package.v1'
            forge_sha=$env:GITHUB_SHA
            kterminal_sha=$env:KTERM_SHA
            kterminal_tree=$env:KTERM_TREE
            package_sha256=$zipDigest
            archive_bytes=(Get-Item -LiteralPath $zip).Length
            package_files=$files.Count
            binaries=$binaries
            build='PASS'
            pack='PASS'
            credential_files=0
            live_orders=0
            installed=$false
            released=$false
            desktop_accepted=$false
          }
          $body=$receipt|ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText((Join-Path $out 'receipt.json'),$body,[Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText((Join-Path $out 'receipt.sha256'),((Get-FileHash -LiteralPath (Join-Path $out 'receipt.json') -Algorithm SHA256).Hash.ToLowerInvariant()),[Text.UTF8Encoding]::new($false))
          Write-Host ('FRESH_INSTALL_PORTABLE_ZIP=PASS;FILES='+$files.Count+';ZIP_SHA256='+$zipDigest)
      - name: Upload portable Windows first-install package and immutable receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kterminal-pr78-personal-fresh-install-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kterminal-pr78-fresh-safe/K-Terminal-Personal-PR78-Fresh-Install.zip
            ${{ runner.temp }}/kterminal-pr78-fresh-safe/receipt.json
            ${{ runner.temp }}/kterminal-pr78-fresh-safe/receipt.sha256
          retention-days: 30
          if-no-files-found: error
