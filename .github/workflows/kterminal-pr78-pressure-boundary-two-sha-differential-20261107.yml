name: K Terminal PR78 P5 unknown-first-POST exact two-SHA offline diagnostic
on:
  push:
    branches: [qualification/kterminal-pr73-p5-source-20261106]
    paths:
      - .github/workflows/kterminal-pr78-pressure-boundary-two-sha-differential-20261107.yml
permissions:
  contents: read
concurrency:
  group: kterminal-pr78-p5-unknown-post-two-sha
  cancel-in-progress: false
jobs:
  bounded-windows:
    name: ${{ matrix.label }}
    runs-on: windows-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pr73-control
            source_sha: bcebdc1a7a0487f9d6061a8e643c76069335d896
            source_tree: a2e5b7dc4a634b5a36d53677cdcb6de47060e21f
          - label: pr78-candidate
            source_sha: ed4df974077793afa7418b45cd595a40b678430f
            source_tree: d1a71153e03458e16b4aff1018be19412aaa16b2
    env:
      FORGE_PARENT: c5ba481c58ed223a64fa6e3c58868ff0ebf7f08f
      TARGET_BLOB: f3e80f01928cb0111665fd1cd13959aee3e93659
      KTERM_SHA: ${{ matrix.source_sha }}
      KTERM_TREE: ${{ matrix.source_tree }}
      TEST_LABEL: ${{ matrix.label }}
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
    steps:
      - name: Checkout exact existing FORGE branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify qualified Windows runner and one-workflow-only change
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'spoonman136668-ai/FORGE'
          test "$GITHUB_REF" = 'refs/heads/qualification/kterminal-pr73-p5-source-20261106'
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$FORGE_PARENT" HEAD
          test "$(git diff --name-only "$FORGE_PARENT" HEAD)" = '.github/workflows/kterminal-pr78-pressure-boundary-two-sha-differential-20261107.yml'
          test -z "$(git status --porcelain)"
          echo P5_TWO_SHA_WORKFLOW_SCOPE=PASS
      - name: Checkout exact original private K Terminal source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: ${{ matrix.source_sha }}
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Set up pinned original Windows Go 1.26.5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify exact SHA and zero broker authority
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$KTERM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$KTERM_TREE"
          test "$(git rev-parse HEAD:pkg/p5-one-post-diagnostic_test.go)" = "$TARGET_BLOB"
          test "$(git rev-parse HEAD:go.mod)" = 'b3ede0d8444c08b3e7b23f1396374359b54134c6'
          test -z "$(git status --porcelain)"
          test ! -e .env
          test ! -e config.json
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          go version | grep -F 'go1.26.5 windows/amd64' >/dev/null
          for key in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET KTERM_COINBASE_TEST_KEY_NAME KTERM_COINBASE_TEST_KEY_SECRET K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK; do
            if [[ -n "${!key:-}" ]]; then echo P5_BROKER_AUTHORITY_REFUSED; exit 2; fi
          done
          mkdir -p "$RUNNER_TEMP/kterminal-p5-safe"
          echo P5_EXACT_ORIGINAL_SOURCE=PASS
      - name: Run 24 P5 unknown-first-POST repetitions without external transport
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kterminal-p5-isolated"
          mkdir -p "$root/tail" "$root/post" "$root/private"
          export K_TERMINAL_TEST_WORKSPACE="$root"
          export KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT="$root/tail"
          export KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT="$root/post"
          export KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT="$root/private"
          start="$(date +%s)"
          set +e
          go test -json -p 1 -count=24 -timeout 12m '-run=^TestP5OneShotDiagnosticOriginalNativeSignal$/^unknown_first_post_no_retry$' ./pkg > "$RUNNER_TEMP/p5-unknown-private.jsonl" 2> "$RUNNER_TEMP/p5-unknown-private.stderr"
          code="$?"
          set -e
          end="$(date +%s)"
          P5_CASE_EXIT="$code" P5_CASE_SECONDS="$((end-start))" python -B - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          dest=root/"kterminal-p5-safe"
          parent="TestP5OneShotDiagnosticOriginalNativeSignal"
          name=parent+"/unknown_first_post_no_retry"
          phrases={
            "one-POST diagnostic outcome mismatch":"POST_COUNTS_MISMATCH",
            "unknown/blocked POST did not retain uncertainty":"UNCERTAINTY_NOT_RETAINED",
            "same-event duplicate replayed a POST":"SAME_EVENT_REPLAY",
            "fresh native construction replayed or changed original receipt":"FRESH_CONSTRUCTION_REPLAY",
            "broker-free cold-process replay failed":"COLD_PROCESS_REPLAY_FAILED",
            "P5_COLD_ENGINE_BOUNDARY_MISMATCH":"COLD_ENGINE_BOUNDARY",
            "P5_COLD_RECEIPT_ADMISSION_FAILED":"COLD_RECEIPT_ADMISSION",
            "cold-process replay mutated receipt or reached venue":"COLD_PROCESS_RECEIPT_MUTATION",
            "original native receipt not retained for replay":"MISSING_RECEIPT"
          }
          passes=failures=parent_failures=other_failures=events=malformed=0
          classes=set()
          for raw in (root/"p5-unknown-private.jsonl").open(encoding="utf-8-sig",errors="replace"):
            try:e=json.loads(raw)
            except (TypeError,ValueError):malformed+=1;continue
            if not isinstance(e,dict):malformed+=1;continue
            events+=1
            test,action=e.get("Test"),e.get("Action")
            if test==name and action=="pass":passes+=1
            if test==name and action=="fail":failures+=1
            if action=="fail" and test==parent:parent_failures+=1
            if action=="fail" and test not in (name,parent,None):other_failures+=1
            if test==name and action=="output" and isinstance(e.get("Output"),str):
              for phrase,label in phrases.items():
                if phrase in e["Output"]:classes.add(label)
          count_valid=(events>0 and malformed==0 and passes+failures==24 and parent_failures==failures and other_failures==0)
          result={
            "schema":"forge.kterminal.pr78-p5-two-sha-diagnostic.v1",
            "label":os.environ["TEST_LABEL"],
            "forge_sha":os.environ["GITHUB_SHA"],
            "source_sha":os.environ["KTERM_SHA"],
            "source_tree":os.environ["KTERM_TREE"],
            "identical_test_blob":os.environ["TARGET_BLOB"],
            "go_toolchain":"go1.26.5 windows/amd64",
            "repetitions":24,
            "passes":passes,
            "failures":failures,
            "parent_failures":parent_failures,
            "failure_classes":sorted(classes),
            "evidence_valid":count_valid,
            "other_failures":other_failures,
            "malformed_events":malformed,
            "go_test_exit":int(os.environ["P5_CASE_EXIT"]),
            "wall_seconds":int(os.environ["P5_CASE_SECONDS"]),
            "broker_orders":0,
            "private_logs_exported":False,
            "production_mutated":False,
            "full_regression_repeated":False
          }
          body=json.dumps(result,sort_keys=True,separators=(",",":")).encode()
          (dest/"result.json").write_bytes(body)
          digest=hashlib.sha256(body).hexdigest()
          (dest/"result.sha256").write_text(digest,encoding="ascii")
          print("P5_UNKNOWN_FIRST_POST_24_PASS="+str(passes))
          print("P5_UNKNOWN_FIRST_POST_24_FAIL="+str(failures))
          print("P5_UNKNOWN_FIRST_POST_CLASSES="+",".join(sorted(classes)))
          print("P5_UNKNOWN_FIRST_POST_EVIDENCE="+("PASS" if count_valid else "UNVERIFIED"))
          print("P5_UNKNOWN_FIRST_POST_RECEIPT_SHA256="+digest)
          if not count_valid:raise SystemExit(2)
          PY
      - name: Upload sanitized comparison receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kterminal-p5-${{ matrix.label }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kterminal-p5-safe/result.json
            ${{ runner.temp }}/kterminal-p5-safe/result.sha256
          retention-days: 21
          if-no-files-found: error
