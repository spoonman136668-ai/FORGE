name: K Terminal PR78 P5 original quote-age boundary offline differential
on:
  push:
    branches: [qualification/kterminal-pr73-p5-source-20261106]
    paths: [.github/workflows/kterminal-pr78-pressure-boundary-two-sha-differential-20261107.yml]
permissions:
  contents: read
concurrency:
  group: kterminal-pr78-p5-quote-age-once
  cancel-in-progress: false
jobs:
  windows:
    name: ${{ matrix.label }}
    runs-on: windows-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: original-1700ms
            quote_age_ms: 1700
          - label: stressed-1950ms
            quote_age_ms: 1950
    env:
      FORGE_PARENT: 962536924ac73651bbaef0912b59e584283e9274
      KTERM_SHA: ed4df974077793afa7418b45cd595a40b678430f
      KTERM_TREE: d1a71153e03458e16b4aff1018be19412aaa16b2
      P5_TEST_BLOB: f3e80f01928cb0111665fd1cd13959aee3e93659
      QUOTE_AGE_MS: ${{ matrix.quote_age_ms }}
      TEST_LABEL: ${{ matrix.label }}
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
    steps:
      - name: Checkout existing FORGE qualification scope
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify one-workflow-only isolated Windows change
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'spoonman136668-ai/FORGE'
          test "$GITHUB_REF" = 'refs/heads/qualification/kterminal-pr73-p5-source-20261106'
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$FORGE_PARENT" HEAD
          test "$(git diff --name-only "$FORGE_PARENT" HEAD)" = '.github/workflows/kterminal-pr78-pressure-boundary-two-sha-differential-20261107.yml'
          test -z "$(git status --porcelain)"
          echo P5_QUOTE_CLOCK_WORKFLOW_SCOPE=PASS
      - name: Checkout original PR78 exact source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: ed4df974077793afa7418b45cd595a40b678430f
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Set up original Windows Go 1.26.5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify exact SHA/test and reject broker credentials
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$KTERM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$KTERM_TREE"
          test "$(git rev-parse HEAD:pkg/p5-one-post-diagnostic_test.go)" = "$P5_TEST_BLOB"
          test "$(git rev-parse HEAD:go.mod)" = 'b3ede0d8444c08b3e7b23f1396374359b54134c6'
          test -z "$(git status --porcelain)"
          test ! -e .env
          test ! -e config.json
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          go version | grep -F 'go1.26.5 windows/amd64' >/dev/null
          for key in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET KTERM_COINBASE_TEST_KEY_NAME KTERM_COINBASE_TEST_KEY_SECRET K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK; do
            if [[ -n "${!key:-}" ]]; then echo P5_BROKER_AUTHORITY_REFUSED; exit 2; fi
          done
          mkdir -p "$RUNNER_TEMP/p5-quote-safe"
          echo P5_ORIGINAL_SOURCE_IDENTITY=PASS
      - name: Apply only diagnostic test-file quote-age perturbation
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          if [[ "$QUOTE_AGE_MS" != '1700' && "$QUOTE_AGE_MS" != '1950' ]]; then
            exit 2
          fi
          python -B - <<'PY'
          import os,pathlib
          path=pathlib.Path("pkg/p5-one-post-diagnostic_test.go")
          old=path.read_bytes()
          needle=b"n.Snapshot.QuoteAt = time.Now().Add(-1700 * time.Millisecond)"
          assert old.count(needle)==1, "nonunique original quote-age fixture"
          ms=int(os.environ["QUOTE_AGE_MS"])
          if ms==1950:
            new=old.replace(needle,b"n.Snapshot.QuoteAt = time.Now().Add(-1950 * time.Millisecond)")
            path.write_bytes(new)
          else:
            assert ms==1700
          print("P5_QUOTE_VARIANT="+str(ms)+"ms")
          print("P5_TEST_ONLY_OVERLAY="+("YES" if ms==1950 else "NO"))
          PY
          if [[ "$QUOTE_AGE_MS" = '1950' ]]; then
            test "$(git diff --name-only)" = 'pkg/p5-one-post-diagnostic_test.go'
            git diff --check
          else
            test -z "$(git status --porcelain)"
          fi
          echo P5_ONLY_SYNTHETIC_TEST_VARIANT=PASS
      - name: Run 18 repeated unknown-first-POST tests and classify safety outcomes
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/p5-quote-isolated"
          mkdir -p "$root/tail" "$root/post" "$root/private"
          export K_TERMINAL_TEST_WORKSPACE="$root"
          export KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT="$root/tail"
          export KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT="$root/post"
          export KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT="$root/private"
          start="$(date +%s)"
          set +e
          go test -json -p 1 -count=18 -timeout 12m '-run=^TestP5OneShotDiagnosticOriginalNativeSignal$/^unknown_first_post_no_retry$' ./pkg > "$RUNNER_TEMP/p5-quote-private.jsonl" 2> "$RUNNER_TEMP/p5-quote-private.stderr"
          exit_code="$?"
          set -e
          end="$(date +%s)"
          P5_EXIT="$exit_code" P5_SECONDS="$((end-start))" python -B - <<'PY'
          import pathlib,os,json,hashlib
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          name="TestP5OneShotDiagnosticOriginalNativeSignal/unknown_first_post_no_retry"
          parent="TestP5OneShotDiagnosticOriginalNativeSignal"
          labels={
            "one-POST diagnostic outcome mismatch":"POST_COUNTS_MISMATCH",
            "unknown/blocked POST did not retain uncertainty":"UNKNOWN_OUTCOME_NOT_RETAINED",
            "same-event duplicate replayed a POST":"SAME_EVENT_REPLAY",
            "fresh native construction replayed or changed original receipt":"FRESH_CONSTRUCTION_REPLAY",
            "broker-free cold-process replay failed":"COLD_PROCESS_REPLAY_FAILED",
            "original native receipt not retained for replay":"MISSING_RECEIPT",
            "cold-process replay mutated receipt or reached venue":"COLD_RECEIPT_MUTATION"
          }
          passed=failed=parent_failed=other_failed=malformed=events=0
          classes=set()
          for raw in (temp/"p5-quote-private.jsonl").open(encoding="utf-8-sig",errors="replace"):
            try:z=json.loads(raw)
            except (ValueError,TypeError):malformed+=1;continue
            if not isinstance(z,dict):malformed+=1;continue
            events+=1
            test,action=z.get("Test"),z.get("Action")
            if test==name and action=="pass":passed+=1
            if test==name and action=="fail":failed+=1
            if test==parent and action=="fail":parent_failed+=1
            if action=="fail" and test not in (name,parent,None):other_failed+=1
            if test==name and action=="output" and isinstance(z.get("Output"),str):
              for phrase,label in labels.items():
                if phrase in z["Output"]:classes.add(label)
          complete=events>0 and malformed==0 and passed+failed==18 and parent_failed==failed and other_failed==0
          result={
            "schema":"forge.kterminal.pr78.p5-quote-age-test-only.v1",
            "source_sha":os.environ["KTERM_SHA"],
            "source_tree":os.environ["KTERM_TREE"],
            "original_p5_test_blob":os.environ["P5_TEST_BLOB"],
            "forge_sha":os.environ["GITHUB_SHA"],
            "quote_age_ms":int(os.environ["QUOTE_AGE_MS"]),
            "test_only_overlay":os.environ["QUOTE_AGE_MS"]=="1950",
            "comparative_experiment_not_qualification":True,
            "go":"go1.26.5 windows/amd64",
            "repetitions":18,
            "passed":passed,
            "failed":failed,
            "parent_failed":parent_failed,
            "classes":sorted(classes),
            "exit_code":int(os.environ["P5_EXIT"]),
            "events":events,
            "malformed":malformed,
            "evidence_complete":complete,
            "elapsed_seconds":int(os.environ["P5_SECONDS"]),
            "broker_orders":0,
            "private_logs_exported":False,
            "production_source_modified":False,
            "full_regression_repeated":False
          }
          out=temp/"p5-quote-safe"
          body=json.dumps(result,sort_keys=True,separators=(",",":")).encode()
          (out/"result.json").write_bytes(body)
          digest=hashlib.sha256(body).hexdigest()
          (out/"result.sha256").write_text(digest,encoding="ascii")
          print("P5_QUOTE_VARIANT_MS="+str(result["quote_age_ms"]))
          print("P5_QUOTE_VARIANT_PASS="+str(passed)+"/18")
          print("P5_QUOTE_VARIANT_FAIL="+str(failed)+"/18")
          print("P5_QUOTE_VARIANT_CLASSES="+",".join(sorted(classes)))
          print("P5_QUOTE_EVIDENCE="+("COMPLETE" if complete else "INCOMPLETE"))
          print("P5_QUOTE_RECEIPT_SHA256="+digest)
          if not complete:raise SystemExit(2)
          PY
      - name: Upload only sanitized diagnostic results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kterminal-p5-quote-${{ matrix.label }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p5-quote-safe/result.json
            ${{ runner.temp }}/p5-quote-safe/result.sha256
          retention-days: 14
          if-no-files-found: error
