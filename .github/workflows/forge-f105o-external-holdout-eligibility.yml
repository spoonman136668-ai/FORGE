name: FORGE F105-O external-origin metadata-only holdout eligibility
on:
  push:
    branches: [engineering/f105o-external-holdout-eligibility-20261017-r1]
    paths:
      - 'noveltyeval/f105o_external_origin_preflight.py'
      - 'noveltyeval/test_f105o_external_origin_preflight.py'
      - 'docs/F105O-FROZEN-EXTERNAL-HOLDOUT-ELIGIBILITY.md'
      - '.github/workflows/forge-f105o-external-holdout-eligibility.yml'
permissions:
  contents: read
jobs:
  qualified-metadata-custody-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - name: Checkout frozen FORGE policy code read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sparse checkout independent-origin README/LICENSE ONLY, no QA files
        uses: actions/checkout@v4
        with:
          repository: kelvin-jiang/FreebaseQA
          ref: d16aae5149aaa25e43ff2a7bd00a06f280ca19b9
          path: external-freebaseqa
          sparse-checkout: |
            README.md
            LICENSE
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Enforce pinned head and untouched external answer/eval sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C external-freebaseqa rev-parse HEAD)" = 'd16aae5149aaa25e43ff2a7bd00a06f280ca19b9'
          test "$(git -C external-freebaseqa rev-parse HEAD:FreebaseQA-eval.json)" = 'd7d06ae721aedca26a0838d0113cddc1aa6774a8'
          test "$(git -C external-freebaseqa rev-parse HEAD:FreebaseQA-train.json)" = '24dc4b13a9c4a0ad734732db094c124d086b7d67'
          test "$(git -C external-freebaseqa rev-parse HEAD:FreebaseQA-dev.json)" = '2e16ac381efb7b9e362cbf9bd0cee90006244ea8'
          test ! -e external-freebaseqa/FreebaseQA-eval.json
          test ! -e external-freebaseqa/FreebaseQA-dev.json
          test ! -e external-freebaseqa/FreebaseQA-train.json
          test -f external-freebaseqa/README.md
          test -f external-freebaseqa/LICENSE
          echo 'F105O_EVAL_FILE_CONTENTS_NEVER_CHECKED_OUT=TRUE'
      - name: Denial-oriented synthetic external evidence and unsealing tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s noveltyeval -p 'test_f105o_*.py' -v
      - name: Actual independent-origin exact original Git metadata eligibility
        shell: bash
        run: |
          set -euo pipefail
          python -B noveltyeval/f105o_external_origin_preflight.py --upstream-sparse external-freebaseqa --out f105o-external-eligibility.json
          python - <<'PY'
          import json
          x=json.load(open('f105o-external-eligibility.json',encoding='utf-8'))
          assert x['schema']=='forge.optimizer.f105o.external-origin-metadata-eligibility.v1'
          assert x['status']=='EXTERNAL_ORIGIN_VERIFIED_COMPATIBILITY_BLOCKED'
          assert x['candidate_repo']=='kelvin-jiang/FreebaseQA'
          assert x['candidate_commit']=='d16aae5149aaa25e43ff2a7bd00a06f280ca19b9'
          assert x['author_declared_population']=={'train':20358,'dev':3994,'eval':3996}
          assert x['data_splits_original_git_metadata']['FreebaseQA-eval.json']['original_git_blob']=='d7d06ae721aedca26a0838d0113cddc1aa6774a8'
          assert x['data_splits_original_git_metadata']['FreebaseQA-eval.json']['original_blob_size']==4660561
          assert x['f104_parent_head']=='cce1aeb9142827aec709971fce2bf6c1f50b164a'
          assert x['f104_policy_frozen_identity']=='inverse-two-hop-exact-root-only-removal.v1'
          assert x['independent_external_author_origin'] is True
          assert x['requires_separate_question_to_typed_role_adapter'] is True
          assert x['requires_separate_freebase_graph_admission'] is True
          assert x['requires_independent_evaluator_custody'] is True
          assert x['graph_over_f100_budget_per_original_readme'] is True
          assert x['candidate_format_is_f101_f102_bracketed_metaqa'] is False
          for k in ('population_verified_by_decoding_samples',
                    'independently_sealed_content_proven',
                    'qa_file_contents_read_by_application',
                    'new_scientific_firstuse',
                    'generalization_qualified','accepted_science',
                    'accepted_ref_mutation','dream_pareto_promotion',
                    'thetaevolve_accepted_training','science_dispatch'):
            assert x[k] is False,k
          assert x['evaluation_questions_seen']==x['evaluation_answers_seen']==x['candidate_questions_scored']==0
          assert x['reported_accuracy'] is None
          assert x['model_calls']==x['codex_calls']==x['cloudflare_writes']==0
          print('F105O_METADATA_READBACK_PASS_COMPATIBILITY_AND_FIRSTUSE_DENIED')
          PY
          sha256sum f105o-external-eligibility.json > f105o-external-eligibility.sha256
          sha256sum -c f105o-external-eligibility.sha256
      - name: One mandatory exact-head full Go regression vet build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo 'F105O_CKB_CLOUDFLARE_CODEX_PAID_MODEL_WRITE_OPERATIONS=ZERO'
          echo 'F105O_EXPOSED_EXTERNAL_QA_SCORES_AND_SCIENTIFIC_FIRSTUSE=ZERO'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-f105o-external-source-metadata-${{ matrix.os }}
          path: |
            f105o-external-eligibility.json
            f105o-external-eligibility.sha256
          retention-days: 45
          if-no-files-found: error
