name: Q21N-01 source-only seven matched comparator qualification

on:
  push:
    branches: [research/q21n01-matched-controls-sourceonly-20261023]
    paths:
      - '.github/workflows/q21n01-matched-controls-sourceonly.yml'
      - 'research/q21n01_forge_native/matched_controls.py'
      - 'research/q21n01_forge_native/test_matched_controls.py'

permissions:
  contents: read

concurrency:
  group: q21n01-seven-arms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 12
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact qualified source and historical comparator blobs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='a42202ef02da3f38c459d4f2bd773f7500717c7c'
          $ancestor=(& git merge-base $base HEAD).Trim()
          if($LASTEXITCODE-ne0 -or $ancestor-cne$base){throw 'Q21N01_MATCHED_PARENT_DRIFT'}
          $expected=@('.github/workflows/q21n01-matched-controls-sourceonly.yml',
             'research/q21n01_forge_native/matched_controls.py',
             'research/q21n01_forge_native/test_matched_controls.py')
          $actual=@(& git diff --name-only $base HEAD)
          if($LASTEXITCODE-ne0 -or $actual.Count-ne3 -or
             (Compare-Object $expected $actual)){throw 'Q21N01_MATCHED_DELTA_DRIFT'}
          $pins=@{
            'research/q21n01_forge_native/FROZEN_PROTOCOL.json'='2b913a183043d06fd9eac7b18a36499a89517a49'
            'research/q21_information_budget/FROZEN_PROTOCOL.json'='d7c35c10f80b36a758b78e0deedf36d74bf5767d'
            'research/q21_information_budget/models.py'='52d539a1faff79a42224effd97805a26a9b11e65'
            'research/q21_information_budget/sourcefree.py'='e1779e270dca010ac386896146a6b60cee0a8f11'
            'research/q21_information_budget/evaluator.py'='4109e68a4fdc32d928343207eb53ce5be54b9003'
            'research/q21n01_forge_native/matched_controls.py'='66e7a234bda230502dd7a71d9f2f3e708bef2bf8'
            'research/q21n01_forge_native/test_matched_controls.py'='589ccae7d1681ca4879eba1e87efb6b53757c21b'
          }
          foreach($path in $pins.Keys){
            $commitObj=(& git rev-parse ('HEAD:'+$path)).Trim()
            $diskObj=(& git hash-object --no-filters -- $path).Trim()
            if($LASTEXITCODE-ne0 -or $commitObj-cne$pins[$path] -or
               $diskObj-cne$pins[$path]){throw ('Q21N01_COMPARATOR_IDENTITY_'+$path)}
          }
          Write-Host 'Q21N01_MATCHED_EXACT_SOURCE=PASS'
      - name: Seven frozen matched FIT-VALID arms on handwritten toys, no cohorts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B -m unittest discover -s research/q21n01_forge_native -p 'test_matched_controls.py' -v
          if($LASTEXITCODE-ne0){throw 'Q21N01_COMPARATOR_TOY_TEST_FAILURE'}
          python -B research/q21n01_forge_native/matched_controls.py
          if($LASTEXITCODE-ne0){throw 'Q21N01_COMPARATOR_TOY_PREFLIGHT_FAILURE'}
          Write-Host 'Q21N01_SEVEN_FROZEN_COMPARATORS_HANDWRITTEN=PASS'
          Write-Host 'Q21N01_FROZEN_FIT_DEV_COHORTS=ZERO'
          Write-Host 'Q21N01_FSA_FIRST_USE=NOT_PERFORMED'
      - name: One Go regression, vet and build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo Q21N01_STANDARD_GO_REGRESSION=PASS
      - name: Confirm no side-effect files were created
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dirty=@(& git status --porcelain --untracked-files=all)
          if($dirty.Count-ne0){throw 'Q21N01_WORKTREE_DIRTY'}
          Write-Host 'Q21N01_WORKTREE_CLEAN=PASS'
          Write-Host 'Q21N01_SCIENCE_DISPATCH=NOT_PERFORMED'
