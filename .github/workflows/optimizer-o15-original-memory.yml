name: Optimizer O15 original POPGym delayed memory and equal-FIT conventional controls
on:
  push:
    branches: [research/optimizer-o15-original-popgym-delayed-memory-20261023]
  pull_request:
    paths: [research/optimizer_o15/**, .github/workflows/optimizer-o15-original-memory.yml]
permissions:
  contents: read
jobs:
  native-original-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 19
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 8
          persist-credentials: false
      - name: Verify immutable first-only contract, original native custody, additive scope
        shell: bash
        run: |
          set -euo pipefail
          first=51ef965365396b3b42ab3564f984eae4c9403167
          parent=58dc4cc483349249c98f1620b51b843b9e927468
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/optimizer_o15/O15_FIRST_PROTOCOL.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;g=set(sys.stdin.read().splitlines());w={"research/optimizer_o15/O15_FIRST_PROTOCOL.md","research/optimizer_o15/runner.py","research/optimizer_o15/test_sourcefree.py","research/optimizer_o15/compare.py",".github/workflows/optimizer-o15-original-memory.yml"};assert g==w,(g,w)'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: proroklab/popgym
          ref: 410d5aa626dae8024f498354d8781a0d1870c399
          path: external/popgym-original
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install exact bounded source-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p o15-evidence
          timeout 170s python -m pip install --no-cache-dir --timeout 30 --retries 1 'numpy==1.26.4' 'gymnasium==0.29.1' >o15-evidence/install.log 2>&1
      - name: Original source-free lag-learning seed/protocol tests before any source episode
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/optimizer_o15/test_sourcefree.py 2>&1 | tee o15-evidence/focused-tests.log
      - name: Original POPGym genuine public FIT and 66,096 rewarded env actions
        shell: bash
        run: |
          set -euo pipefail
          python -B research/optimizer_o15/runner.py --upstream external/popgym-original --out o15-evidence
      - name: Full FORGE regression on original Linux native science run
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./... && go vet ./... && go build ./...
      - name: Archive genuine original source evidence and negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-o15-original-POPGym-${{ matrix.os }}
          path: o15-evidence/
          retention-days: 30
  independent-cross-os:
    needs: [native-original-source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: optimizer-o15-original-POPGym-*
          path: original-source-receipts
          merge-multiple: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Fail closed on independent source SHA, six scenarios, 42 source reward values
        shell: bash
        run: |
          set -euo pipefail
          python -B research/optimizer_o15/compare.py \
            original-source-receipts/optimizer-o15-original-POPGym-ubuntu-24.04/o15-source-native-public-reward-receipt.json \
            original-source-receipts/optimizer-o15-original-POPGym-windows-2025/o15-source-native-public-reward-receipt.json \
            o15-cross-os-acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: optimizer-o15-cross-os-independent-acceptance
          path: o15-cross-os-acceptance.json
          retention-days: 30
