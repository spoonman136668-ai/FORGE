name: Yggdrasil F139 isolated Wilson full regression
on:
  push:
    branches:
      - qualification/f139-wilson-mainline-20261028
    paths:
      - '.github/workflows/qualify-ygg-f139-wilson-mainline-20261028.yml'
permissions:
  contents: read
concurrency:
  group: ygg-f139-wilson-exact-head-20261028
  cancel-in-progress: false
jobs:
  pinned-cross-platform:
    name: source-qualified Wilson full regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FROZEN_YGG_HEAD: 021423311027517c9096c76bed7d35ac53c4a229
      FROZEN_YGG_BASE: e36bef1222c6f3e30fb7d7184af96343671b9263
      FROZEN_WILSON_PIN: f23dc92ff8a6ff30347ee4342c812778649d9166
    steps:
      - name: Stable literal Git checkout
        run: git config --global core.autocrlf false
      - name: Checkout exact Yggdrasil Wilson candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/Yggdrasil
          ref: 021423311027517c9096c76bed7d35ac53c4a229
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact source and historical Wilson blob provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FROZEN_YGG_HEAD"
          test "$(git merge-base "$FROZEN_YGG_BASE" "$FROZEN_YGG_HEAD")" = "$FROZEN_YGG_BASE"
          test "$(git rev-parse "$FROZEN_WILSON_PIN:yggdrasil/public_causal_cells.py")" = c4a69a56cb59a7df3322d6d7fd9101b3c1e89d25
          test "$(git rev-parse HEAD:yggdrasil/public_causal_cells.py)" = c4a69a56cb59a7df3322d6d7fd9101b3c1e89d25
          test "$(git rev-parse HEAD:tests/test_native_cells.py)" = 5ca2b224650253f43d3a5d3e44381b888857ae98
          test "$(git rev-parse HEAD:tests/test_native_cells_wilson.py)" = a950374161461012313cc7e4a1c0904a3c368f05
          expected="$(printf '%s\n' '.ice/code-atlas.html' '.ice/code-atlas.ice' '.ice/code-atlas.json' 'tests/test_native_cells_wilson.py' 'yggdrasil/public_causal_cells.py')"
          test "$(git diff --name-only "$FROZEN_YGG_BASE" HEAD)" = "$expected"
          test "$(git diff --name-only "$FROZEN_WILSON_PIN" HEAD)" = "$(printf '%s\n' '.ice/code-atlas.html' '.ice/code-atlas.ice' '.ice/code-atlas.json')"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo F139_WILSON_EXACT_HISTORICAL_BLOB_AND_SCOPE=PASS
      - name: Focused genuine public-outcome learning and uncertainty negative controls
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_native_cells.py' -v
          python -B -m unittest discover -s tests -p 'test_native_cells_wilson.py' -v
          echo F139_WILSON_ORIGINAL_AND_NEGATIVE_CONTROLS=PASS
      - name: Original checkpoint interface and pinned G29 source validation
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v
          python -B -m unittest discover -s tests -p 'test_portable_checkpoint.py' -v
          echo F139_WILSON_ATLAS_AND_CHECKPOINT=PASS
      - name: One final OS-appropriate complete original regression
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            python -B -m unittest discover -s tests -p 'test_*.py' -v
            echo F139_WILSON_LINUX_FULL=PASS
          else
            python -B - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          alltests = sorted(p.name for p in Path('tests').glob('test_*.py'))
          unsupported = {'test_free_fanout_sidecar.py'}
          assert set(alltests).intersection(unsupported) == unsupported
          supported = [x for x in alltests if x not in unsupported]
          assert 'test_native_cells_wilson.py' in supported and supported
          print('F139_WILSON_WINDOWS_SUPPORTED=' + ','.join(supported),flush=True)
          for name in supported:
              subprocess.run([sys.executable,'-B','-m','unittest','discover','-s','tests','-p',name,'-v'],check=True)
          print('F139_WILSON_WINDOWS_FULL_SUPPORTED=PASS',flush=True)
          print('F139_WILSON_WINDOWS_POSIX_ONLY_FANOUT=NOT_RUN_UNSUPPORTED',flush=True)
          PY
          fi
      - name: Final clean workspace and no external execution authority
        run: |
          set -euo pipefail
          python -B -c "from pathlib import Path; [compile(p.read_bytes(),str(p),'exec') for p in (Path('yggdrasil/public_causal_cells.py'),Path('tests/test_native_cells_wilson.py'))]"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo F139_WILSON_FINAL_SOURCE_CLEAN=PASS
          echo F139_WILSON_SCIENTIFIC_FIRST_USE=FALSE
          echo F139_WILSON_PAID_CALLS=0
          echo F139_WILSON_ACCEPTED_REFS_CHANGED=0
          echo F139_WILSON_OWNER_OR_SCHEDULER_MUTATIONS=0
