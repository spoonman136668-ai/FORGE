name: Optimizer L9 deterministic WebNLG split qualification
on:
  push:
    branches: [research/optimizer-language-l9-webnlg-transfer-20261023]
    paths:
      - '.github/workflows/optimizer-language-l9-split-qualification.yml'
      - 'research/optimizer_language_l9/l9_split_builder.py'
      - 'research/optimizer_language_l9/test_l9_split_builder.py'
      - 'research/optimizer_language_l9/L9_BLOB_MANIFEST.json'
permissions:
  contents: read
concurrency:
  group: optimizer-language-l9-split-qualification
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      summary_sha256: ${{ steps.run.outputs.summary_sha256 }}
      role_sha256: ${{ steps.run.outputs.role_sha256 }}
      records: ${{ steps.run.outputs.records }}
      train: ${{ steps.run.outputs.train }}
      select: ${{ steps.run.outputs.select }}
      audit: ${{ steps.run.outputs.audit }}
      audit_categories: ${{ steps.run.outputs.audit_categories }}
      source_bytes: ${{ steps.run.outputs.source_bytes }}
      quarantine: ${{ steps.run.outputs.quarantine }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 3
      - id: run
        name: Verify source pins and construct split on Linux
        shell: bash
        run: |
          set -euo pipefail
          parent='72a3c9be882466e8180b72eed9f87d92b2bbcb3c'
          test "$(git rev-parse HEAD~1)" = "$parent"
          test "$(git diff --name-only "$parent" HEAD)" = '.github/workflows/optimizer-language-l9-split-qualification.yml'
          pushd research/optimizer_language_l9 >/dev/null
          python -m unittest -v test_l9_split_builder.py
          popd >/dev/null
          ext="$RUNNER_TEMP/webnlg-l9"
          git clone --quiet --filter=blob:none --no-checkout https://gitlab.com/shimorina/webnlg-dataset.git "$ext"
          test "$(git -C "$ext" rev-parse a7ea49b5ffa5011edf81e8530c59b3552a965023^{commit})" = 'a7ea49b5ffa5011edf81e8530c59b3552a965023'
          out="$RUNNER_TEMP/l9-split.json"
          python research/optimizer_language_l9/l9_split_builder.py \
            --repo "$ext" \
            --blob-manifest research/optimizer_language_l9/L9_BLOB_MANIFEST.json \
            --out "$out"
          python - "$out" "$GITHUB_OUTPUT" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text(encoding='utf-8'))
          raw=p.read_bytes(); counts=d['counts']; roles=counts['roles']
          assert d['schema']=='forge.optimizer.language.l9.webnlg-split-manifest-v1'
          assert d['custody']['all_blob_identities_verified_before_first_content_read'] is True
          assert d['custody']['official_test_content_consumed'] is False
          assert d['custody']['reference_text_used_for_role_assignment'] is False
          assert d['custody']['filename_or_entry_id_used_for_role_assignment'] is False
          assert counts['train_audit_graph_overlap']==0
          assert roles['L9_TRAIN']>=1000 and roles['L9_SELECT']>=150 and roles['L9_AUDIT_DEV']>=120
          assert counts['audit_categories_present_in_dev']>=2
          assert counts['quarantined_train_graph_overlap']>=1
          assert d['model_fit_count']==0
          vals={
            'summary_sha256':hashlib.sha256(raw).hexdigest(),
            'role_sha256':d['role_identity_sha256'],
            'records':counts['records_total'],
            'train':roles['L9_TRAIN'],
            'select':roles['L9_SELECT'],
            'audit':roles['L9_AUDIT_DEV'],
            'audit_categories':counts['audit_categories_present_in_dev'],
            'source_bytes':d['custody']['source_bytes_read'],
            'quarantine':counts['quarantined_train_graph_overlap'],
          }
          with open(sys.argv[2],'a',encoding='utf-8') as f:
            for k,v in vals.items(): f.write(f"{k}={v}\n")
          print('L9_SPLIT_LINUX_SUMMARY_SHA256='+vals['summary_sha256'])
          print('L9_SPLIT_LINUX_ROLE_SHA256='+vals['role_sha256'])
          PY
          rm -rf "$ext" "$out"
          echo 'L9_SPLIT_LINUX_TEMP_CLEANUP=PASS'

  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      summary_sha256: ${{ steps.run.outputs.summary_sha256 }}
      role_sha256: ${{ steps.run.outputs.role_sha256 }}
      records: ${{ steps.run.outputs.records }}
      train: ${{ steps.run.outputs.train }}
      select: ${{ steps.run.outputs.select }}
      audit: ${{ steps.run.outputs.audit }}
      audit_categories: ${{ steps.run.outputs.audit_categories }}
      source_bytes: ${{ steps.run.outputs.source_bytes }}
      quarantine: ${{ steps.run.outputs.quarantine }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 3
      - id: run
        name: Verify source pins and construct split on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent='72a3c9be882466e8180b72eed9f87d92b2bbcb3c'
          if((& git rev-parse 'HEAD~1').Trim() -cne $parent){throw 'L9_WINDOWS_PARENT_DRIFT'}
          $changed=@(& git diff --name-only $parent HEAD)
          if($changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/optimizer-language-l9-split-qualification.yml'){throw 'L9_WINDOWS_SCOPE_DRIFT'}
          Push-Location research/optimizer_language_l9
          try {
            python -m unittest -v test_l9_split_builder.py
            if($LASTEXITCODE -ne 0){throw 'L9_WINDOWS_UNIT_TESTS_FAILED'}
          } finally { Pop-Location }
          $ext=Join-Path $env:RUNNER_TEMP 'webnlg-l9'
          & git clone --quiet --filter=blob:none --no-checkout https://gitlab.com/shimorina/webnlg-dataset.git $ext
          if($LASTEXITCODE -ne 0){throw 'L9_WINDOWS_CLONE_FAILED'}
          $release=(& git -C $ext rev-parse 'a7ea49b5ffa5011edf81e8530c59b3552a965023^{commit}').Trim()
          if($release -cne 'a7ea49b5ffa5011edf81e8530c59b3552a965023'){throw 'L9_WINDOWS_RELEASE_DRIFT'}
          $out=Join-Path $env:RUNNER_TEMP 'l9-split.json'
          python research/optimizer_language_l9/l9_split_builder.py --repo $ext --blob-manifest research/optimizer_language_l9/L9_BLOB_MANIFEST.json --out $out
          if($LASTEXITCODE -ne 0){throw 'L9_WINDOWS_SPLIT_FAILED'}
          $d=Get-Content -LiteralPath $out -Raw -Encoding UTF8 | ConvertFrom-Json
          if($d.schema -cne 'forge.optimizer.language.l9.webnlg-split-manifest-v1'){throw 'L9_WINDOWS_SCHEMA'}
          if(-not [bool]$d.custody.all_blob_identities_verified_before_first_content_read){throw 'L9_WINDOWS_CUSTODY'}
          if([bool]$d.custody.official_test_content_consumed){throw 'L9_WINDOWS_TEST_EXPOSURE'}
          if([bool]$d.custody.reference_text_used_for_role_assignment -or [bool]$d.custody.filename_or_entry_id_used_for_role_assignment){throw 'L9_WINDOWS_SHORTCUT'}
          if([int]$d.counts.train_audit_graph_overlap -ne 0){throw 'L9_WINDOWS_GRAPH_LEAKAGE'}
          if([int]$d.counts.roles.L9_TRAIN -lt 1000 -or [int]$d.counts.roles.L9_SELECT -lt 150 -or [int]$d.counts.roles.L9_AUDIT_DEV -lt 120){throw 'L9_WINDOWS_MINIMUMS'}
          if([int]$d.counts.audit_categories_present_in_dev -lt 2){throw 'L9_WINDOWS_AUDIT_CATEGORIES'}
          if([int]$d.counts.quarantined_train_graph_overlap -lt 1){throw 'L9_WINDOWS_QUARANTINE_MISSING'}
          if([int]$d.model_fit_count -ne 0){throw 'L9_WINDOWS_MODEL_FIT'}
          $vals=[ordered]@{
            summary_sha256=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
            role_sha256=[string]$d.role_identity_sha256
            records=[string]$d.counts.records_total
            train=[string]$d.counts.roles.L9_TRAIN
            select=[string]$d.counts.roles.L9_SELECT
            audit=[string]$d.counts.roles.L9_AUDIT_DEV
            audit_categories=[string]$d.counts.audit_categories_present_in_dev
            source_bytes=[string]$d.custody.source_bytes_read
            quarantine=[string]$d.counts.quarantined_train_graph_overlap
          }
          foreach($k in $vals.Keys){Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ($k+'='+$vals[$k]) -Encoding utf8}
          Write-Host ('L9_SPLIT_WINDOWS_SUMMARY_SHA256='+$vals.summary_sha256)
          Write-Host ('L9_SPLIT_WINDOWS_ROLE_SHA256='+$vals.role_sha256)
          Remove-Item -LiteralPath $ext -Recurse -Force
          Remove-Item -LiteralPath $out -Force
          Write-Host 'L9_SPLIT_WINDOWS_TEMP_CLEANUP=PASS'

  reconcile:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Require exact Linux Windows split identity
        shell: bash
        env:
          LINUX_SUMMARY: ${{ needs.linux.outputs.summary_sha256 }}
          WINDOWS_SUMMARY: ${{ needs.windows.outputs.summary_sha256 }}
          LINUX_ROLE: ${{ needs.linux.outputs.role_sha256 }}
          WINDOWS_ROLE: ${{ needs.windows.outputs.role_sha256 }}
          LINUX_RECORDS: ${{ needs.linux.outputs.records }}
          WINDOWS_RECORDS: ${{ needs.windows.outputs.records }}
          LINUX_TRAIN: ${{ needs.linux.outputs.train }}
          WINDOWS_TRAIN: ${{ needs.windows.outputs.train }}
          LINUX_SELECT: ${{ needs.linux.outputs.select }}
          WINDOWS_SELECT: ${{ needs.windows.outputs.select }}
          LINUX_AUDIT: ${{ needs.linux.outputs.audit }}
          WINDOWS_AUDIT: ${{ needs.windows.outputs.audit }}
          LINUX_AUDIT_CATEGORIES: ${{ needs.linux.outputs.audit_categories }}
          WINDOWS_AUDIT_CATEGORIES: ${{ needs.windows.outputs.audit_categories }}
          LINUX_SOURCE_BYTES: ${{ needs.linux.outputs.source_bytes }}
          WINDOWS_SOURCE_BYTES: ${{ needs.windows.outputs.source_bytes }}
          LINUX_QUARANTINE: ${{ needs.linux.outputs.quarantine }}
          WINDOWS_QUARANTINE: ${{ needs.windows.outputs.quarantine }}
        run: |
          set -euo pipefail
          test -n "$LINUX_SUMMARY"
          test "$LINUX_SUMMARY" = "$WINDOWS_SUMMARY"
          test "$LINUX_ROLE" = "$WINDOWS_ROLE"
          test "$LINUX_RECORDS" = "$WINDOWS_RECORDS"
          test "$LINUX_TRAIN" = "$WINDOWS_TRAIN"
          test "$LINUX_SELECT" = "$WINDOWS_SELECT"
          test "$LINUX_AUDIT" = "$WINDOWS_AUDIT"
          test "$LINUX_AUDIT_CATEGORIES" = "$WINDOWS_AUDIT_CATEGORIES"
          test "$LINUX_SOURCE_BYTES" = "$WINDOWS_SOURCE_BYTES"
          test "$LINUX_QUARANTINE" = "$WINDOWS_QUARANTINE"
          test "$LINUX_QUARANTINE" -ge 1
          echo "L9_SPLIT_CROSS_OS_SUMMARY_SHA256=$LINUX_SUMMARY"
          echo "L9_SPLIT_CROSS_OS_ROLE_SHA256=$LINUX_ROLE"
          echo "L9_SPLIT_RECORDS_TOTAL=$LINUX_RECORDS"
          echo "L9_SPLIT_TRAIN_COUNT=$LINUX_TRAIN"
          echo "L9_SPLIT_SELECT_COUNT=$LINUX_SELECT"
          echo "L9_SPLIT_AUDIT_COUNT=$LINUX_AUDIT"
          echo "L9_SPLIT_AUDIT_CATEGORY_COUNT=$LINUX_AUDIT_CATEGORIES"
          echo "L9_SPLIT_SOURCE_BYTES=$LINUX_SOURCE_BYTES"
          echo "L9_SPLIT_QUARANTINED_TRAIN_RECORDS=$LINUX_QUARANTINE"
          echo "L9_SPLIT_MODEL_FIT_COUNT=0"
          echo "L9_SPLIT_OFFICIAL_TEST_CONTENT_CONSUMED=FALSE"
          echo "L9_SPLIT_LINUX_WINDOWS_RECONCILIATION=PASS"
