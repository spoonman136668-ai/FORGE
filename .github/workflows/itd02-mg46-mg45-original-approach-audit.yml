name: ITD-02 MG46 frozen original MG45 public-target approach failure attribution audit
on:
  push:
    branches: [research/itd02-mg46-mg45-original-public-approach-attribution-20261029]
permissions:
  contents: read
  actions: read
jobs:
  frozen-source-only-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact LF source settings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout unchanged pinned MG45 parent plus MG46 diagnostic only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify source lineage and all original policy binaries remain untouched
        shell: pwsh
        run: |
          git merge-base --is-ancestor 831a9d8430fc97a6d43ca5ec84b7999b2c56f92a $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'MG46_AUDIT_METRIC_FREEZE_NOT_BEFORE_EXECUTABLE' }
          $changed=@(git diff --name-only bff9b8551dfd2e64537c59199f032de19dd39f35 $env:GITHUB_SHA)
          $expected=@('research/lcrm01/mg46_mg45_original_public_approach_audit_prereg.json',
            'research/lcrm01/mg46_mg45_original_public_approach_audit.py',
            '.github/workflows/itd02-mg46-mg45-original-approach-audit.yml')
          if (@(Compare-Object $changed $expected).Count -ne 0) { throw 'MG46_UNAUTHORIZED_MODEL_OR_SOURCE_CHANGE' }
          python -B research/lcrm01/mg46_mg45_original_public_approach_audit.py --preflight
          if ($LASTEXITCODE -ne 0) { throw 'MG46_DIAGNOSTIC_PREFLIGHT_FAIL' }
          if (git status --porcelain --untracked-files=all) { throw 'MG46_SOURCE_NOT_CLEAN' }
          Write-Host MG46_FROZEN_READONLY_AUDIT_CROSS_HOST_SOURCE_PREFLIGHT_PASS_NO_SCIENCE
  pinned-exposed-source-only-audit:
    needs: frozen-source-only-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact LF source settings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download exact immutable original MG45 transfer evidence archive, no new world action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mg46"
          curl --fail --silent --show-error --location --max-time 120 --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/spoonman136668-ai/FORGE/actions/artifacts/12936790567/zip" \
            --output "$RUNNER_TEMP/mg46/mg45-immutable.zip"
          test "$(stat -c%s "$RUNNER_TEMP/mg46/mg45-immutable.zip")" -lt 12000000
          printf '%s  %s\n' 14f986ef363fab757a39c79bf48e97e3a14f0fa0273080ab7b82b514bda88ff5 "$RUNNER_TEMP/mg46/mg45-immutable.zip" | sha256sum --check --status
          echo MG46_ORIGINAL_EXPOSED_ARCHIVE_BYTE_CUSTODY_PASS
      - name: Audit original MG45 selected public target absence and approach failure
        shell: bash
        run: |
          set -euo pipefail
          python -B research/lcrm01/mg46_mg45_original_public_approach_audit.py \
            --archive "$RUNNER_TEMP/mg46/mg45-immutable.zip" \
            --output "$RUNNER_TEMP/mg46/report.json" \
            > "$RUNNER_TEMP/mg46/diagnostic.log"
          grep -F 'MG46_MG45_AUTHENTIC_TARGET_ABSENCE_APPROACH_AUDIT_PASS_NO_SCIENCE' "$RUNNER_TEMP/mg46/diagnostic.log"
          grep -F 'MG46_ORIGINAL_MG45_DUAL_PROCESS_SOURCE_CUSTODY_PASS' "$RUNNER_TEMP/mg46/diagnostic.log"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo MG46_EXPOSED_SOURCE_ONLY_AUDIT_COMPLETE_NO_FARAMA_ACTION_OR_SCIENTIFIC_FIRST_USE
      - name: Upload compact original-source validated diagnostic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mg46-mg45-original-target-approach-audit
          path: |
            ${{ runner.temp }}/mg46/report.json
            ${{ runner.temp }}/mg46/diagnostic.log
          if-no-files-found: warn
          retention-days: 30
