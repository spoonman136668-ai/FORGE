name: K-Terminal RC2-T correlated native event to WPF consumer
on:
  push:
    branches: [diagnostics/kterminal-original-local-preflight-20261019]
    paths: [.github/workflows/kt-rc2t-correlated-order-visible-latency.yml]
permissions:
  contents: read
concurrency:
  group: kterminal-rc2t-private-native-wpf-20261021
  cancel-in-progress: false
jobs:
  windows-correlated-latency:
    runs-on: windows-latest
    timeout-minutes: 16
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOFLAGS: '-p=1'
      GOMAXPROCS: '2'
      CGO_ENABLED: '0'
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_NATIVE_TIMING: '0'
    steps:
      - name: Checkout FORGE transient test tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read-only original K-Terminal source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: eb5d225ae73b698a59c68d840daf1ec678e1a0ec
          path: kt-original
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Read-only PR73 K-Terminal exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: b8c2052d530cdff93462dfccc21b28f3824e5531
          path: kt-candidate
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Windows Go 1.26.5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Check custody and prohibit external trading credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/FORGE
          test "$GITHUB_EVENT_NAME" = push
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          test "$(git -C kt-original rev-parse HEAD)" = eb5d225ae73b698a59c68d840daf1ec678e1a0ec
          test "$(git -C kt-candidate rev-parse HEAD)" = b8c2052d530cdff93462dfccc21b28f3824e5531
          test -z "$(git -C kt-original status --porcelain)"
          test -z "$(git -C kt-candidate status --porcelain)"
          go version | grep -F 'go1.26.5 windows/amd64'
          for n in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET; do test -z "${!n:-}"; done
          echo KTERM_RC2T_FROZEN_EXACT_SOURCES=PASS
          echo KTERM_RC2T_NO_BROKER_CREDENTIALS=PASS
      - name: Correlate one synthetic confirmed event via original Go publisher and original WPF consumer
        shell: bash
        run: |
          set -euo pipefail
          python -B qualification/kterminal/rc2t_correlated_windows_harness.py \
            kt-original kt-candidate \
            qualification/kterminal/rc2t_correlated_event_publisher_test.go \
            qualification/kterminal/rc2t_correlated_wpf_consumer.ps1 \
            "$RUNNER_TEMP/kterm-rc2t-evidence"
          echo KTERM_RC2T_SHIPPING_DESKTOP_PHYSICAL_PAINT=NOT_MEASURED
          echo KTERM_RC2T_FULL_REGRESSION=NOT_RUN
          echo KTERM_RC2T_RELEASE=BLOCKED
      - name: Retain only correlated deltas and fail-close codes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kterminal-rc2t-redacted-timelines-${{ github.run_id }}
          path: ${{ runner.temp }}/kterm-rc2t-evidence/rc2t-correlated-redacted.json
          retention-days: 14
          if-no-files-found: warn
