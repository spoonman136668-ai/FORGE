name: F139 dual native workers original-owner isolation qualification
on:
  push:
    branches: [fix/f139-native-two-inflight-single-owner-20261022]
permissions:
  contents: read
jobs:
  dual-native-no-science:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 28
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: f139
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - name: Ensure exact cross-OS source identity
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 15
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify frozen quota source and exact additive dual-worker delta
        shell: bash
        run: |
          set -euo pipefail
          base=31f13a1504ba7004989d9a20d71dbf31048ed485
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD "$base")" = "$base"
          expected="$(printf '%s\n' '.github/workflows/qualify-f139-two-inflight.yml' 'f139/local_controller.py' 'f139/nci04_owner_ledger.py' 'f139/test_nci04_two_inflight.py')"
          test "$(git diff --name-only "$base" HEAD)" = "$expected"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo F139_DUAL_NATIVE_BOUNDED_DELTA=PASS
      - name: Focused authentic native replay and two in-flight tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s f139 -p 'test_nci04_two_inflight.py' -v
          python -B -m unittest discover -s f139 -p 'test_nci04_continuous_cadence.py' -v
          python -B -m unittest discover -s f139 -p 'test_nci04_owner_ledger.py' -v
          python -B -m unittest discover -s f139 -p 'test_nci04_native_successor_catalog.py' -v
          echo F139_NATIVE_TWO_IN_FLIGHT_RESTART_AND_REPLAY=PASS
      - name: One full F139 regression Go vet and build
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s f139 -p 'test_*.py'
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo F139_DUAL_NATIVE_FULL_REGRESSION=PASS
      - name: No controller or original science mutation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          echo F139_SINGLE_ORIGINAL_OWNER_LOCK=UNCHANGED
          echo F139_SIGNED_NATIVE_SOURCE_CUSTODY=UNCHANGED
          echo F139_NATIVE_TWO_CONCURRENT_PROVIDER_SLOTS=QUALIFIED_SOURCE_ONLY
          echo F139_LIVE_PROTECTED_MAIN=UNCHANGED
          echo F139_SCIENTIFIC_FIRST_USE=FALSE
