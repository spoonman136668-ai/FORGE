name: MP-AI38 LoCoMo original evidence identity format schema preflight
on:
  push:
    branches: [oneoff/mpai21-owner-approved-two-record-admission-20261029]
    paths: ['.github/workflows/mpai38-locomo-evidence-schema-preflight.yml']
permissions:
  contents: read
jobs:
  evidence-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-pinned original evidence schema and dialogue IDs without benchmark text
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'spoonman136668-ai/FORGE'
          test "$GITHUB_ACTOR" = 'spoonman136668-ai'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:tools/mpai37_external_memory_effect.py)" = 'f1305323279cf56c1fdda068a5d14933dfbe6ca7'
          test "$(git rev-parse HEAD:tools/mpai38_evidence_schema_probe.py)" = 'ca4fb37467f8aa886ef442b0e387fa06d82709c2'
          out="$(python -B tools/mpai38_evidence_schema_probe.py)"
          printf '%s\n' "$out"
          grep -Fq 'MPAI38_PRIVATE_SOURCE_TEXT_LOGGED=FALSE' <<< "$out"
          grep -Fq 'MPAI38_MODEL_CALLS=0' <<< "$out"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'MPAI38_SOURCE_EVIDENCE_SCHEMA_AUDITED=PASS'
