name: F124-BC one original independent hard-negative FIT and conditional SCREEN
on:
  push:
    branches: [research/f124bc-frozen-hard-negative-source-20261018]
    paths: ['.github/workflows/forge-f124bc-original-fit.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: f124bc-one-original-frozen-hard-source
  cancel-in-progress: false
jobs:
  one-original-source-FIT:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate exact source, prior original negative, first-use and qualified focused gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object reference/research-intake/f124bc-frozen-hard-negative-falsification.json)" = 834945168ad01172dcd63b9e6440cfcc482cc0b1
          test "$(git log -1 --format=%H -- reference/research-intake/f124bc-frozen-hard-negative-falsification.json)" = 0fd49102ab8d7aca68adeac089d88194670b816e
          git merge-base --is-ancestor 0fd49102ab8d7aca68adeac089d88194670b816e HEAD
          test "$(git hash-object nativeevidence/f124bc_hard_negative_source.py)" = ec669582b884a16865dbb22a2372d6b7a2ba3e5d
          test "$(git hash-object nativeevidence/f124bc_original_hard_negative.py)" = 00c82abbc289efaba28a5cc96f0d44b6725208ef
          test "$(git hash-object nativeevidence/test_f124bc_nonconsuming.py)" = 5a6c8e77953a6857b0e82e2ca1758424ffb39357
          test "$(git hash-object nativeevidence/f124bb_train_source.py)" = 1547633c2cea224643e43d08bffeb04ed4e56f7d
          test "$(git hash-object nativeevidence/f124az_joint_public_inverse.py)" = 0122190aa3a0972ffb4a709bc1bdd8179c8ba6c7
          test "$(git hash-object nativeevidence/f124av_informative_inverse.py)" = 0364e6a00c2bc3ffcda0e91ab2fe292e6bd8fbd5
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39166048882" --jq '[.head_sha,.status,.conclusion,.event] | join(" ")')" = 'd1221f454ee37704df39fef73f5cc4b599e6ce61 completed success push'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39163052536" --jq '[.head_sha,.status,.conclusion] | join(" ")')" = '66b2bbdbf855ef48c7f8763c25a939dea510ec1b completed success'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39145084951/artifacts" --jq '.artifacts[] | select(.id==12142901818 and .expired==false) | .digest')" = 'sha256:0f4fe659e490adad0b539272c9fbbf675b96c8c21e029853aff4677337f4a3a3'
          prior=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=research/f124bc-frozen-hard-negative-source-20261018&per_page=100" --jq '[.workflow_runs[] | select(.path==".github/workflows/forge-f124bc-original-fit.yml") | select(.id != (env.GITHUB_RUN_ID | tonumber))] | length')
          test "$prior" = 0 || { echo F124BC_NO_DUPLICATE_FIRST_SOURCE_BIRTH; exit 1; }
          python3 -B -m unittest discover -s nativeevidence -p 'test_f124bc_*.py' -q
          python3 -B isolationguard/check.py
          echo F124BC_FROZEN_SOURCE_FIRST_USE_PREFLIGHT=PASS
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39145084951
          github-token: ${{ github.token }}
          name: f124aw-independent-no-dev-preflight-a0173ff8ab3093dbb24d1b517c416c03502570e1
          path: unchanged-donor
      - name: Original source-only oracle-hard challenge and equal-info joint controls
        shell: bash
        run: |
          set -euo pipefail
          echo '9f0de2f57ef293ad7fcbfaf3f6bd0931c1383ad2fb953bdc8b66f973620aa5c2  unchanged-donor/f124aw-independent-nonconsuming-preflight.json' | sha256sum --check --strict
          python3 - <<'PY'
          import json,os,pathlib
          d=json.load(open('unchanged-donor/f124aw-independent-nonconsuming-preflight.json'))
          assert d["schema"]=="forge.research.f124aw.independent-before-first-dev-preflight.v1"
          assert d["DEV_cases_created"]==d["Wingless_DEV_cases_created"]==0
          assert d["DEV_consumed"] is False
          assert len(d["original_donor_Ygg_weights"])==7 and len(d["original_donor_Ygg_delta"])==2
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          (root/"f124bc-base.json").write_text(json.dumps(d["original_donor_Ygg_weights"]))
          (root/"f124bc-delta.json").write_text(json.dumps(d["original_donor_Ygg_delta"]))
          print("F124BC_ORIGINAL_SOURCEBLIND_DONOR=PASS")
          PY
          python3 -B nativeevidence/f124bc_original_hard_negative.py \
            --base "$RUNNER_TEMP/f124bc-base.json" \
            --delta "$RUNNER_TEMP/f124bc-delta.json" \
            --output "$RUNNER_TEMP/f124bc-original-hard-negative.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"],"f124bc-original-hard-negative.json")
          o=json.loads(p.read_bytes())
          assert o["schema"]=="forge.research.f124bc.original-source-new-hard-negative-falsification.v1"
          assert o["frozen_blob"]=="834945168ad01172dcd63b9e6440cfcc482cc0b1"
          assert o["FIT_pairs"]==24 and len(o["FIT_models"])==4
          assert all(x["pairs"]==24 and x["hard_negative_eligible_cases"]==o["FIT_hard_source_count"] for x in o["FIT_models"].values())
          assert o["protected_DEV_constructed"]==o["Wingless_DEV_constructed"]==0
          assert not o["scientific_protected_acceptance"] and not o["optimizer_promotion"]
          if o["SCREEN_pairs"]==0:
              assert o["SCREEN_models"] is None
              assert o["SCREEN_not_constructed_due_to_frozen_rule"]
              print("F124BC_HELD_SCREEN_SEALED_NO_ELIGIBLE_CHALLENGE=PASS")
          else:
              assert o["SCREEN_pairs"]==24 and len(o["SCREEN_models"])==4
              assert o["FIT_hard_source_count"]>=18 and o["FIT_existing_joint_has_hard_negative_FP"]
              print("F124BC_PRECOMMITTED_HARD_NEGATIVE_HELD_SCREEN_DIAGNOSTIC=PASS")
          print("F124BC_ORIGINAL_FIRST_USE_CONFIRMED=PASS")
          PY
          (cd "$RUNNER_TEMP" && sha256sum f124bc-original-hard-negative.json > f124bc-original-hard-negative.json.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f124bc-original-hard-negative-${{ github.sha }}
          path: |
            ${{ runner.temp }}/f124bc-original-hard-negative.json
            ${{ runner.temp }}/f124bc-original-hard-negative.json.sha256
          retention-days: 90
          if-no-files-found: warn
  one-complete-final-regression:
    needs: one-original-source-FIT
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: One final complete Go test race vet build isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
          echo F124BC_ONE_FINAL_FULL_REGRESSION=PASS
          echo "F124BC_EXACT_SCIENCE_SOURCE=$GITHUB_SHA"
          echo F124BC_PROTECTED_SCIENCE_ACCEPTANCE=false
          echo F124BC_OPTIMIZER_PROMOTION=false
