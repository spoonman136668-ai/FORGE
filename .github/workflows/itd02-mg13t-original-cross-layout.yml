name: ITD-02 MG13-T unassisted cross-layout original DoorKey transfer
on:
  push:
    branches: [research/itd02-mg13t-cross-layout-unassisted-20261029]
permissions:
  contents: read
jobs:
  original-8x8-6x6-fully-unassisted-two-process-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Source Linux LF policy
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact original source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Pinned Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Native Go 1.25.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Evaluate two independently executed authentic unassisted layout cohorts
        shell: bash
        run: bash research/lcrm01/mg13t_ci.sh
      - name: Preserve all negative and successful original-source events
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-mg13t-original-unassisted-8x8-6x6-transfer-evidence
          path: |
            ${{ runner.temp }}/mg13t/first.json
            ${{ runner.temp }}/mg13t/second.json
            ${{ runner.temp }}/mg13t/comparison.json
            ${{ runner.temp }}/mg13t/first.log
            ${{ runner.temp }}/mg13t/second.log
          retention-days: 30
          if-no-files-found: warn
