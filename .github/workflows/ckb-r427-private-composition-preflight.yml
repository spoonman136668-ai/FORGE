name: CKB R429 exact-composite scheduler remedy qualification
on:
  push:
    branches: [audit/ckb-r427-exact-composition-20261027]
    paths:
      - .github/workflows/ckb-r427-private-composition-preflight.yml
permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 90
    steps:
      - name: Pin and execute private original-source replay in isolated scratch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'R428_WRONG_OWNER_RUNNER'}
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          if(-not [Security.Principal.WindowsPrincipal]::new($identity).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){throw 'R428_OWNER_ADMIN_REQUIRED'}
          $user=(& gh api user --jq '.login' 2>$null | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $user -cne 'spoonman136668-ai'){throw 'R428_OWNER_GITHUB_AUTH_UNAVAILABLE'}
          $ref='4278b548a53b8547216aea3fd5012d24d01447fe'
          $blob='5eca99210de7b1f7e32dfeb5324ece871abe5011'
          $api='repos/spoonman136668-ai/ckb-plane/contents/snapshot/source/scripts/Qualify-R428-Exact-R220-Composite.ps1?ref='+$ref
          $metadata=(& gh api $api 2>$null | Out-String | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0 -or $metadata.sha -cne $blob -or $metadata.encoding -cne 'base64'){throw 'R428_PRIVATE_RECIPE_PIN_DRIFT'}
          $temp=Join-Path $env:RUNNER_TEMP ('r428-private-recipe-'+$env:GITHUB_RUN_ID+'.ps1')
          if(Test-Path -LiteralPath $temp){throw 'R428_PRIVATE_SCRIPT_COLLISION'}
          try {
            [IO.File]::WriteAllBytes($temp,[Convert]::FromBase64String(($metadata.content -replace '\s','')))
            $hashed=(& git hash-object --no-filters -- $temp | Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $hashed -cne $blob){throw 'R428_PRIVATE_RECIPE_BYTES_DRIFT'}
            Write-Output 'R428_ORIGINAL_PRIVATE_RECIPE_PIN=PASS'
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $temp
            if($LASTEXITCODE -ne 0){throw 'R428_EXACT_COMPOSITE_REPRODUCTION_FAILED'}
            Write-Output 'R428_REPRODUCTION_WRAPPER=PASS'
          } finally {
            if(Test-Path -LiteralPath $temp){Remove-Item -LiteralPath $temp -Force -ErrorAction Stop}
          }
          Write-Output 'R428_PRIVATE_SCRIPT_REMOVED=PASS'