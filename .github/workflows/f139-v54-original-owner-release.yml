name: FORGE F139 V54 original owner model-free source recovery
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  actions: read
concurrency:
  group: forge-f139-v54-original-owner
  cancel-in-progress: false
jobs:
  detached-owner-rehearsal:
    if: >-
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.actor == 'spoonman136668-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 807 &&
      github.event.issue.user.login == 'spoonman136668-ai' &&
      github.event.comment.user.login == 'spoonman136668-ai' &&
      startsWith(github.event.comment.body, 'F139-V54-OWNER-RELEASE ') &&
      !github.event.issue.pull_request
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 35
    steps:
      - name: Checkout exact source with complete local ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rehearse a v44 source transition and native activation on detached original SQLite
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          & "$env:GITHUB_WORKSPACE/f139/v54_original_owner_repair.ps1" -Mode Rehearse -Main $env:GITHUB_SHA
          if($LASTEXITCODE -ne 0){throw 'F139_V54_DETACHED_REHEARSAL_DENIED'}
  original-owner-forward-repair:
    needs: detached-owner-rehearsal
    if: >-
      success() &&
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.actor == 'spoonman136668-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 807 &&
      github.event.issue.user.login == 'spoonman136668-ai' &&
      github.event.comment.user.login == 'spoonman136668-ai' &&
      startsWith(github.event.comment.body, 'F139-V54-OWNER-RELEASE ') &&
      !github.event.issue.pull_request
    permissions:
      contents: write
      issues: write
      actions: read
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 45
    steps:
      - name: Checkout exact protected source and immutable original custody
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go source-generator toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: One forward-only source update of SAME original owner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          & "$env:GITHUB_WORKSPACE/f139/v54_original_owner_repair.ps1" -Mode Live -Main $env:GITHUB_SHA
          if($LASTEXITCODE -ne 0){throw 'F139_V54_ORIGINAL_LIVE_REPAIR_HOLD'}
