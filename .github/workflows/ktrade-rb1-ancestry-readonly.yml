name: KTRADE RB1 candidate ancestry read-only triage
on:
  push:
    branches: [audit/ckb-r18-health-differential-20261023]
    paths: [.github/workflows/ktrade-rb1-ancestry-readonly.yml]
permissions:
  contents: read
jobs:
  triage:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    steps:
      - name: Inspect immutable candidate Git metadata without reset or ref edits
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-StrictMode -Version 3.0
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/audit/ckb-r18-health-differential-20261023' -or
             $who.Name -ine 'LINKDEADKB\camar' -or
             ![Security.Principal.WindowsPrincipal]::new($who).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){throw 'RB1_OWNER_TRIAGE_AUTHORITY_DRIFT'}
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $db=Join-Path $root 'state\autonomy.db'
          $baseline='bde51540fe5da8e2fbf7b6e6ce5043ad373e1a96'
          $orderID='KTRADE_RB1_SINGLE_TRACK_20261022'
          $py=@'
          import sqlite3,sys,json
          db,w=sys.argv[1:]
          c=sqlite3.connect('file:'+db.replace('\\','/')+'?mode=ro',uri=True,timeout=10)
          c.execute('pragma query_only=on')
          try:
           row=c.execute('select state,attempt,reason,workspace,evidence from work_orders where id=?',(w,)).fetchone()
           if not row: raise RuntimeError('RB1_ID_NOT_FOUND')
           print(json.dumps(dict(zip(('state','attempt','reason','workspace','evidence'),row)),separators=(',',':')))
          finally:c.close()
          '@
          $rows=@(& python.exe -B -c $py $db $orderID)
          if($LASTEXITCODE -ne 0 -or $rows.Count -ne 1){throw 'RB1_STATE_READ_FAILED'}
          $job=($rows[0]|ConvertFrom-Json)
          if([string]$job.state -cne 'BLOCKED' -or [int]$job.attempt -ne 2 -or
             [string]$job.reason -notmatch 'BRANCH_ANCESTRY_INVALID'){throw 'RB1_FAILURE_STATE_CHANGED'}
          $workspace=[IO.Path]::GetFullPath([string]$job.workspace)
          $evidence=[IO.Path]::GetFullPath([string]$job.evidence)
          $workspacePrefix=[IO.Path]::GetFullPath((Join-Path $root 'workspaces\s'))+[IO.Path]::DirectorySeparatorChar
          $evidencePrefix=[IO.Path]::GetFullPath((Join-Path $root 'evidence'))+[IO.Path]::DirectorySeparatorChar
          if(!$workspace.StartsWith($workspacePrefix,[StringComparison]::OrdinalIgnoreCase) -or
             !$evidence.StartsWith($evidencePrefix,[StringComparison]::OrdinalIgnoreCase) -or
             !(Test-Path -LiteralPath $workspace -PathType Container)){throw 'RB1_PRIVATE_WORKSPACE_OUTSIDE_CUSTODY'}
          function RunGit([string[]]$argv) {
            $eap=$ErrorActionPreference
            try{$ErrorActionPreference='Continue'; $out=@(& git.exe -C $workspace @argv 2>&1);$code=$LASTEXITCODE}
            finally{$ErrorActionPreference=$eap}
            return @{ exit=$code; output=($out -join '\n').Trim() }
          }
          $head=RunGit @('rev-parse','HEAD')
          $branch=RunGit @('symbolic-ref','--short','HEAD')
          $base=RunGit @('cat-file','-e',($baseline+'^{commit}'))
          $ancestor=RunGit @('merge-base','--is-ancestor',$baseline,'HEAD')
          $parent=RunGit @('rev-parse','HEAD^')
          $ancestorHead=RunGit @('merge-base','--is-ancestor','HEAD','HEAD')
          $mergeBasePlain=RunGit @('merge-base',$baseline,'HEAD')
          $ancestorWithSafe=RunGit @('-c','safe.directory=*','merge-base','--is-ancestor',$baseline,'HEAD')
          $isShallow=RunGit @('rev-parse','--is-shallow-repository')
          $commits=RunGit @('rev-list','--count',($baseline+'..HEAD'))
          $dirty=RunGit @('status','--porcelain')
          $gitdir=RunGit @('rev-parse','--git-dir')
          $source='C:\Users\camar\GolandProjects\ktrade-rb1-plane'
          $sourceHead=@(& git.exe -C $source rev-parse HEAD)
          if($LASTEXITCODE -ne 0 -or $sourceHead.Count -ne 1 -or $sourceHead[0] -cne $baseline){throw 'RB1_AUTHORIZED_SOURCE_BASELINE_DRIFT'}
          $parentSHA='8101e4822b336a5f6d297410f76d51db1b6fe52c'
          $srcParent=@(& git.exe -C $source cat-file -t $parentSHA 2>&1)
          $srcHasParent=($LASTEXITCODE -eq 0 -and $srcParent.Count -eq 1 -and $srcParent[0] -ceq 'commit')
          $privParent=RunGit @('cat-file','-e',($parentSHA+'^{commit}'))
          $srcMerge=@(& git.exe -C $source merge-base --is-ancestor $baseline HEAD 2>&1)
          $srcMergeExit=$LASTEXITCODE
          $sourceShallow=@(& git.exe -C $source rev-parse --is-shallow-repository 2>&1)
          $sourceShallowExit=$LASTEXITCODE
          $result=[ordered]@{schema='ktrade.r18-rb1-candidate-ancestry-diagnostic.v1';order=$orderID;
            attempt=2;state=$job.state;reason=$job.reason;
            workspace_git_dir_present=($gitdir.exit -eq 0);
            candidate_head=if($head.exit -eq 0){$head.output}else{'INVALID'};
            candidate_branch=if($branch.exit -eq 0){$branch.output}else{'INVALID'};
            expected_worker_branch='codex/ktrade-rb1-single-track-20261022';
            baseline_object_present=($base.exit -eq 0);
            ancestry_exit=$ancestor.exit;
            ancestry_error=if($ancestor.exit -eq 128){[string]$ancestor.output.Substring(0,[Math]::Min(300,$ancestor.output.Length))}else{''};
            self_ancestry_exit=$ancestorHead.exit;
            plain_merge_base_exit=$mergeBasePlain.exit;
            plain_merge_base_result=if($mergeBasePlain.exit -eq 0){$mergeBasePlain.output}else{''};
            safe_override_ancestry_exit=$ancestorWithSafe.exit;
            shallow_repository=if($isShallow.exit -eq 0){$isShallow.output}else{'unknown'};
            parent_exists=($parent.exit -eq 0);
            ahead_count=if($commits.exit -eq 0){$commits.output}else{'UNAVAILABLE'};
            dirty_line_count=if($dirty.exit -eq 0){@($dirty.output -split '\n'|Where-Object {$_ -ne ''}).Count}else{-1};
            verified_expected_parent=$parentSHA;
            source_parent_object_present=$srcHasParent;
            private_parent_object_present=($privParent.exit -eq 0);
            source_self_ancestry_exit=$srcMergeExit;
            source_shallow=if($sourceShallowExit -eq 0){$sourceShallow[0]}else{'unknown'};
            original_git_baseline_unchanged=$true;
            no_mutations=$true}
          Write-Host ('RB1_CANDIDATE_READONLY_DIAGNOSIS='+($result|ConvertTo-Json -Compress -Depth 4))
          # Inventory only metadata from the already BLOCKED attempt: no diff
          # contents, no git repair, no reset, no live controller changes.
          $changedPaths=RunGit @('diff','--name-only','HEAD','--')
          $newPaths=RunGit @('ls-files','--others','--exclude-standard')
          $diffStatus=RunGit @('diff','--check')
          if($changedPaths.exit -ne 0 -or $newPaths.exit -ne 0){throw 'RB1_FAILED_ATTEMPT_FILE_METADATA_UNAVAILABLE'}
          $paths=@($changedPaths.output -split '\n'|Where-Object {$_ -ne ''})+@($newPaths.output -split '\n'|Where-Object {$_ -ne ''})
          $allow=@('cmd/','internal/','pkg/','static/','templates/','strategies/','tests/','tools/','web/','docs/','ui/','assets/')
          $scope=@($paths|ForEach-Object {
            $path=$_
            $approved=($path -eq 'go.mod' -or $path -eq 'go.sum' -or @($allow|Where-Object {$path.StartsWith($_,[StringComparison]::Ordinal)}).Count -gt 0)
            [ordered]@{path=$path;within_requested_scope=$approved}
          })
          $pyDetail=@'
          import sqlite3,sys,json
          c=sqlite3.connect('file:'+sys.argv[1].replace('\\','/')+'?mode=ro',uri=True,timeout=10)
          c.execute('pragma query_only=on')
          try:
           attempts=[dict(attempt=r[0],worker=r[1],exit_code=r[2] if r[2] is not None else 'UNREPORTED') for r in c.execute('select attempt,worker,exit_code from worker_attempts where work_order_id=? order by attempt',(sys.argv[2],))]
           runs=c.execute('select id,result from acceptance_runs where work_order_id=? order by id desc limit 1',(sys.argv[2],)).fetchall()
           checks=[dict(name=r[0],passed=bool(r[1])) for r in c.execute('select name,pass from acceptance_checks where run_id=?',(runs[0][0],))] if runs else []
           print(json.dumps(dict(worker_attempts=attempts,acceptance_checks=checks),separators=(',',':')))
          finally:c.close()
          '@
          $detail=@(& python.exe -B -c $pyDetail $db $orderID)
          if($LASTEXITCODE -ne 0 -or $detail.Count -ne 1){throw 'RB1_WORKER_METADATA_UNAVAILABLE'}
          $inventory=[ordered]@{schema='ktrade.r18-rb1-attempt2-preserved-diff-metadata.v1';
            work_order_id=$orderID;attempt=2;path_inventory=$scope;diff_whitespace_clean=($diffStatus.exit -eq 0);
            native_attempt_and_acceptance_summary=($detail[0]|ConvertFrom-Json);read_only=$true}
          Write-Host ('RB1_PRESERVED_ATTEMPT2_METADATA='+($inventory|ConvertTo-Json -Compress -Depth 6))
          Write-Host 'RB1_PRIVATE_CANDIDATE_PRESERVED=PASS'
