name: KTRADE PR253 genuine native drawings at physical 200 percent with restore
on:
  push:
    branches: [qualification/ktrade-pr253-owner-native-readonly-20261113]
    paths:
      - .github/workflows/ktrade-pr253-owner-native-drawings-physical125-200-20261113.yml
permissions:
  contents: read
concurrency:
  group: ktrade-pr253-owner-native-drawings-once
  cancel-in-progress: false
jobs:
  native:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 35
    env:
      KTRADE_EXPECTED_SOURCE: '07d7e41063a0c1506a290d1497f84de8173da292'
      KTRADE_EXPECTED_TREE: '07ab753cfc02dd24b6e27c1c106f821f14c62534'
      KTRADE_LIVE_TRADING: 'false'
      KTRADE_PROMOTION_ALLOWED: '0'
    steps:
      - name: Confirm owner session and test reversible 150 to 200 to 150 scale without accessing KTRADE
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $env:RUNNER_OS -cne 'Windows' -or
             [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1 -or
             [Security.Principal.WindowsIdentity]::GetCurrent().Name -ine 'LINKDEADKB\camar' -or
             $env:KTRADE_EXPECTED_SOURCE -cne '07d7e41063a0c1506a290d1497f84de8173da292' -or
             $env:KTRADE_LIVE_TRADING -cne 'false' -or
             $env:KTRADE_PROMOTION_ALLOWED -cne '0'){
            throw 'KTRADE_W189_OWNER_RUNNER_AUTHORITY_REFUSED'
          }
          if(@(Get-Process -Name ktrade,ktrade-engine -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTRADE_W189_INSTALLED_APP_RUNNING_REFUSED'
          }
          $reg=Get-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -ErrorAction Stop
          if([string]$reg.ScreenSaveActive -cne '1' -or
             [string]$reg.ScreenSaveTimeOut -cne '1200' -or
             [string]$reg.ScreenSaverIsSecure -cne '0'){
            throw 'KTRADE_W189_MANUAL_SAVER_CONTRACT_DRIFT_REFUSED'
          }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class KtradeW189Native {
            [StructLayout(LayoutKind.Sequential)] public struct Rect {
              public int left,top,right,bottom;
            }
            public delegate bool MonitorCallback(IntPtr monitor,IntPtr dc,ref Rect rect,IntPtr data);
            [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr SetThreadDpiAwarenessContext(IntPtr c);
            [DllImport("user32.dll",SetLastError=true)] public static extern bool EnumDisplayMonitors(IntPtr dc,IntPtr rect,MonitorCallback cb,IntPtr data);
            [DllImport("shcore.dll")] public static extern int GetDpiForMonitor(IntPtr m,int type,out uint x,out uint y);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr OpenInputDesktop(uint f,bool i,uint a);
            [DllImport("user32.dll")] public static extern bool CloseDesktop(IntPtr h);
            [DllImport("user32.dll",SetLastError=true,CharSet=CharSet.Unicode)]
            public static extern bool GetUserObjectInformation(IntPtr h,int i,StringBuilder b,uint s,out uint n);
            public static string Desktop(){
              var h=OpenInputDesktop(0,false,1);if(h==IntPtr.Zero)return "UNAVAILABLE";
              try{var b=new StringBuilder(128);uint n;return GetUserObjectInformation(h,2,b,(uint)(b.Capacity*2),out n)?b.ToString():"UNAVAILABLE";}
              finally{CloseDesktop(h);}
            }
            public static string ReadDpi(){
              var old=SetThreadDpiAwarenessContext(new IntPtr(-4));
              if(old==IntPtr.Zero)throw new Exception("W189_DPI_READ_CONTEXT_REQUIRED");
              try{
                var a=new List<string>();
                MonitorCallback cb=(IntPtr m,IntPtr dc,ref Rect r,IntPtr data)=>{
                  uint x,y;int hr=GetDpiForMonitor(m,0,out x,out y);
                  if(hr!=0)throw new Exception("W189_GET_DPI_FAILED");
                  a.Add(x+":"+y);return true;
                };
                if(!EnumDisplayMonitors(IntPtr.Zero,IntPtr.Zero,cb,IntPtr.Zero) || a.Count!=1)
                  throw new Exception("W189_SINGLE_MONITOR_REQUIRED");
                return a[0];
              }finally{if(SetThreadDpiAwarenessContext(old)==IntPtr.Zero)
                throw new Exception("W189_DPI_READ_CONTEXT_RESTORE_FAILED");}
            }
          }
          '@
          if([KtradeW189Native]::Desktop() -cne 'Default'){
            throw 'KTRADE_W189_DEFAULT_DESKTOP_REQUIRED'
          }
          $before=[KtradeW189Native]::ReadDpi()
          if($before -cne '144:144'){throw ('KTRADE_W189_150_PREIMAGE_REQUIRED_ACTUAL='+$before)}
          $priorForeground=[KtradeW189Native]::GetForegroundWindow()
          $ownedSettings=(@(Get-Process -Name SystemSettings -ErrorAction SilentlyContinue).Count -eq 0)
          $attempted200=$false
          $reverted=$false
          $observed200=$false
          function Get-Scale {
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $f=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
              [System.Windows.Automation.ControlType]::Window)
            $windows=$root.FindAll([System.Windows.Automation.TreeScope]::Children,$f)
            $found=@()
            foreach($w in $windows){
              if([string]$w.Current.Name -notmatch '(?i)\bsettings\b'){continue}
              $cf=[System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                [System.Windows.Automation.ControlType]::ComboBox)
              $combos=$w.FindAll([System.Windows.Automation.TreeScope]::Descendants,$cf)
              foreach($c in $combos){
                if([string]$c.Current.Name -match '(?i)\bscale\b'){
                  $found+=@{window=$w;combo=$c}
                }
              }
            }
            if($found.Count -ne 1){throw 'W189_SINGLE_LABELED_SCALE_COMBO_REQUIRED'}
            return $found[0]
          }
          function Get-Choices([int]$target){
            $context=Get-Scale
            $expand=$context.combo.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
            $expand.Expand()
            Start-Sleep -Milliseconds 320
            $filter=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
              [System.Windows.Automation.ControlType]::ListItem)
            $items=$context.window.FindAll([System.Windows.Automation.TreeScope]::Descendants,$filter)
            $matched=@()
            foreach($i in $items){
              if([string]$i.Current.Name -match ('^\s*'+$target+'\s*%(\s|$)')){$matched+=,$i}
            }
            if($matched.Count -ne 1){throw ('W189_TARGET_LIST_ITEM_UNAVAILABLE_'+$target)}
            return $matched[0]
          }
          function Choose-Scale([int]$target){
            $item=Get-Choices $target
            $pattern=$item.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern)
            $pattern.Select()
          }
          function Confirm-Dpi([string]$wanted){
            for($i=0;$i -lt 30;$i++){
              if([KtradeW189Native]::ReadDpi() -ceq $wanted){return $true}
              Start-Sleep -Milliseconds 300
            }
            return $false
          }
          try{
            # Native Windows Settings UI only; never use registry DPI hacks,
            # display-mode APIs, screen-resolution changes or logoff.
            Start-Process -FilePath explorer.exe -ArgumentList 'ms-settings:display' -ErrorAction Stop
            Start-Sleep -Milliseconds 500
            # First prove BOTH the existing and target value are selectable
            # before applying any change.
            [void](Get-Choices 150)
            [void](Get-Choices 200)
            Choose-Scale 150
            if(!(Confirm-Dpi '144:144')){throw 'W189_ROLLBACK_PATH_PRECHECK_FAILED'}
            Write-Host 'KTRADE_W189_ROLLBACK_150_NOOP_PREFLIGHT=PASS'
            $attempted200=$true
            Choose-Scale 200
            $observed200=Confirm-Dpi '192:192'
            if(!$observed200){throw 'W189_PHYSICAL_200_NOT_OBSERVED'}
            Write-Host 'KTRADE_W190_PHYSICAL_200_MODE_OBSERVED=PASS;dpi=192:192;native_product_acceptance_pending=true'
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $env:KTRADE_LIVE_TRADING -cne 'false' -or
             $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or
             $env:KTRADE_PAPER_SESSION_ROOT -cne '' -or
             $env:KTRADE_PAPER_CUSTODY_REVIEW_ROOT -cne '' -or
             $env:KTRADE_PROMOTION_ALLOWED -cne '0'){
            throw 'KTRADE_OWNER_NATIVE_SCOPE_REFUSED'
          }
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          $principal=[Security.Principal.WindowsPrincipal]::new($who)
          $session=[Diagnostics.Process]::GetCurrentProcess().SessionId
          $explorer=@(Get-Process explorer -ErrorAction SilentlyContinue|
            Where-Object {$_.SessionId -eq $session})
          if([string]$who.Name -ine 'LINKDEADKB\camar' -or
             !$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) -or
             $session -ne 1 -or !$explorer.Count -or
             ![Environment]::UserInteractive){
            throw 'KTRADE_OWNER_NATIVE_INTERACTIVE_DESKTOP_REQUIRED'
          }
          if(@(Get-Process -Name ktrade,ktrade-engine -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTRADE_OWNER_NATIVE_EXISTING_APP_RUNNING_REFUSED'
          }
          $tools=@('git.exe','gh.exe','go.exe','node.exe','npm.cmd')
          foreach($tool in $tools){
            if(!(Get-Command $tool -ErrorAction SilentlyContinue)){
              throw ('KTRADE_OWNER_NATIVE_TOOL_MISSING_'+$tool)
            }
          }
          $goPreimage=(& go.exe version) -join ' '
          if($LASTEXITCODE -ne 0){throw 'KTRADE_OWNER_NATIVE_GO_VERSION_READ_FAILED'}
          Write-Host ('KTRADE_OWNER_NATIVE_GO_PREIMAGE='+$goPreimage)
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class KTradeOwnedDesktop {
            [DllImport("user32.dll",SetLastError=true)]
            public static extern IntPtr SetThreadDpiAwarenessContext(IntPtr ctx);
            public static string[] PhysicalDpi(){
              IntPtr prior=SetThreadDpiAwarenessContext(new IntPtr(-4));
              if(prior==IntPtr.Zero)throw new Exception("PER_MONITOR_V2_CONTEXT_REQUIRED");
              try{return Dpi();}
              finally{
                if(SetThreadDpiAwarenessContext(prior)==IntPtr.Zero)
                  throw new Exception("PER_MONITOR_V2_CONTEXT_RESTORE_FAILED");
              }
            }
            [StructLayout(LayoutKind.Sequential)] public struct P {public int x;public int y;}
            public delegate bool Cb(IntPtr monitor,IntPtr dc,IntPtr rect,IntPtr data);
            [DllImport("user32.dll")] public static extern bool EnumDisplayMonitors(IntPtr dc,IntPtr rect,Cb cb,IntPtr data);
            [DllImport("shcore.dll")] public static extern int GetDpiForMonitor(IntPtr m,int type,out uint x,out uint y);
            [DllImport("user32.dll")] public static extern bool GetCursorPos(out P p);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [StructLayout(LayoutKind.Sequential)] public struct LastInput {public uint cbSize;public uint dwTime;}
            [DllImport("user32.dll")] static extern bool GetLastInputInfo(ref LastInput info);
            [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr OpenInputDesktop(uint flags,bool inherit,uint access);
            [DllImport("user32.dll",SetLastError=true)] public static extern bool CloseDesktop(IntPtr h);
            [DllImport("user32.dll",SetLastError=true,CharSet=CharSet.Unicode)]
            public static extern bool GetUserObjectInformation(IntPtr h,int index,System.Text.StringBuilder name,uint count,out uint needed);
            public static bool InputDesktopIsDefault(){
              IntPtr h=OpenInputDesktop(0,false,1);
              if(h==IntPtr.Zero)return false;
              try{
                var b=new System.Text.StringBuilder(128);uint needed;
                return GetUserObjectInformation(h,2,b,(uint)(b.Capacity*2),out needed) &&
                  string.Equals(b.ToString(),"Default",StringComparison.Ordinal);
              }finally{CloseDesktop(h);}
            }
            [DllImport("user32.dll",SetLastError=true)]
            public static extern bool SystemParametersInfo(uint action,uint param,ref uint value,uint flags);
            [DllImport("user32.dll",SetLastError=true)]
            public static extern bool SystemParametersInfo(uint action,uint param,IntPtr value,uint flags);
            public static uint GetSaverTimeout(){
              uint seconds=0;
              if(!SystemParametersInfo(0x000E,0,ref seconds,0))
                throw new Exception("SCREENSAVER_TIMEOUT_READ_FAILED");
              return seconds;
            }
            public static uint LastInputStamp(){
              var info=new LastInput{cbSize=(uint)Marshal.SizeOf(typeof(LastInput))};
              if(!GetLastInputInfo(ref info))throw new Exception("LAST_INPUT_STAMP_READ_FAILED");
              return info.dwTime;
            }
            public static bool ValidIdle(uint elapsed){return elapsed>=45000 && elapsed<=86400000;}
            public static uint IdleMs(){
              var info=new LastInput{cbSize=(uint)Marshal.SizeOf(typeof(LastInput))};
              if(!GetLastInputInfo(ref info))throw new Exception("LAST_INPUT_READ_FAILED");
              uint elapsed=unchecked((uint)Environment.TickCount-info.dwTime);
              if(elapsed>86400000)throw new Exception("LAST_INPUT_CLOCK_ANOMALY_REFUSED");
              return elapsed;
            }
            public static string[] Dpi(){
              var result=new List<string>();
              if(!EnumDisplayMonitors(IntPtr.Zero,IntPtr.Zero,(m,d,r,u)=>{
                uint x,y;int hr=GetDpiForMonitor(m,0,out x,out y);
                result.Add(hr==0?x.ToString()+":"+y.ToString():"ERR:"+hr);return true;
              },IntPtr.Zero))throw new Exception("MONITOR_ENUM_FAILED");
              return result.ToArray();
            }
          }
          '@
          $beforeDpi=@([KTradeOwnedDesktop]::PhysicalDpi())
          if($beforeDpi.Count -ne 1 -or $beforeDpi[0] -cne '192:192'){
            throw ('KTRADE_OWNER_NATIVE_PHYSICAL_200_DPI_REQUIRED_OBSERVED='+($beforeDpi -join ','))
          }
          Write-Host ('KTRADE_OWNER_NATIVE_PHYSICAL_200_DPI_CONFIRMED='+($beforeDpi -join ','))
          if(-not [KTradeOwnedDesktop]::InputDesktopIsDefault()){
            throw 'KTRADE_OWNER_NATIVE_INPUT_DESKTOP_NOT_DEFAULT'
          }
          $cursor=[KTradeOwnedDesktop+P]::new()
          if(![KTradeOwnedDesktop]::GetCursorPos([ref]$cursor)){
            throw 'KTRADE_OWNER_NATIVE_CURSOR_SNAPSHOT_REFUSED'
          }
          # Deterministic negative controls prevent a 2^32-wrap idle value
          # from admitting pointer operations.
          if(![KTradeOwnedDesktop]::ValidIdle(45000) -or
             [KTradeOwnedDesktop]::ValidIdle(44999) -or
             [KTradeOwnedDesktop]::ValidIdle(4294556138) -or
             [KTradeOwnedDesktop]::ValidIdle(86400001)){
            throw 'KTRADE_OWNER_NATIVE_IDLE_NEGATIVE_CONTROL_FAILED'
          }
          Write-Host 'KTRADE_OWNER_NATIVE_IDLE_GUARD_NEGATIVES=PASS'
          # Read idle with operator-selected 20-minute screen saver unchanged.
          # Historical GETLASTINPUTINFO arithmetic returned a future timestamp; never call it proof before normalization.
          $foreground=[KTradeOwnedDesktop]::GetForegroundWindow()
          if($foreground -eq [IntPtr]::Zero){throw 'KTRADE_OWNER_NATIVE_FOREGROUND_SNAPSHOT_REFUSED'}
          $root=Join-Path $env:RUNNER_TEMP ('ktrade-pr253-real-native-'+[guid]::NewGuid().ToString('N'))
          $source=Join-Path $root 'product'
          $clonelog=Join-Path $root 'private-source.log'
          $derived='Test-KTRADE-W160-OwnerSession-Adapted.ps1'
          New-Item -ItemType Directory -Path $root -ErrorAction Stop|Out-Null
          $succeeded=$false
          $saverOriginal=[uint32]1200
          $originalRegistry='1200'
          try{
            $cfg=Get-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -ErrorAction Stop
            if([string]$cfg.ScreenSaveTimeOut -cne $originalRegistry -or
               [string]$cfg.ScreenSaveActive -cne '1' -or
               [string]$cfg.ScreenSaverIsSecure -cne '0' -or
               [KTradeOwnedDesktop]::GetSaverTimeout() -ne $saverOriginal){
              throw 'KTRADE_OWNER_NATIVE_MANUAL20_READBACK_REFUSED'
            }
            Write-Host 'KTRADE_OWNER_NATIVE_MANUAL20=PASS;timeout_seconds=1200;settings_written=false'
            # The host reported a future-dated LastInputInfo DWORD. Compare
            # observed input *changes* and cursor stability against a monotonic
            # Stopwatch, never subtract future timestamps or trust wrapped idle.
            $lastStamp=[KTradeOwnedDesktop]::LastInputStamp()
            $stationary=[Diagnostics.Stopwatch]::StartNew()
            $deadline=[Diagnostics.Stopwatch]::StartNew()
            $idleQualified=$false
            while($deadline.Elapsed.TotalSeconds -lt 165){
              if(-not [KTradeOwnedDesktop]::InputDesktopIsDefault()){
                throw 'KTRADE_OWNER_NATIVE_DESKTOP_SWITCHED_DURING_IDLE_CHECK'
              }
              $point=[KTradeOwnedDesktop+P]::new()
              if(-not [KTradeOwnedDesktop]::GetCursorPos([ref]$point)){
                throw 'KTRADE_OWNER_NATIVE_CURSOR_UNAVAILABLE_DURING_IDLE_CHECK'
              }
              $next=[KTradeOwnedDesktop]::LastInputStamp()
              if($next -ne $lastStamp -or $point.x -ne $cursor.x -or $point.y -ne $cursor.y){
                $lastStamp=$next
                $cursor=$point
                $stationary.Restart()
              }
              if([KTradeOwnedDesktop]::GetForegroundWindow() -ne $foreground){
                throw 'KTRADE_OWNER_NATIVE_FOREGROUND_CHANGED_DURING_IDLE_CHECK'
              }
              if($stationary.Elapsed.TotalMilliseconds -ge 45000){
                $idleQualified=$true
                break
              }
              Start-Sleep -Seconds 2
            }
            if(-not $idleQualified){
              throw 'KTRADE_OWNER_NATIVE_45_SECOND_STABILITY_NOT_ESTABLISHED'
            }
            $lastStampAtAdmission=[KTradeOwnedDesktop]::LastInputStamp()
            Write-Host 'KTRADE_OWNER_NATIVE_45_SECOND_MONOTONIC_IDLE=PASS'
            if([KTradeOwnedDesktop]::GetSaverTimeout() -ne $saverOriginal -or
               [string](Get-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -ErrorAction Stop).ScreenSaveTimeOut -cne $originalRegistry){
              throw 'KTRADE_MANUAL20_DRIFT_AFTER_IDLE'
            }
            # Exact Go 1.26.11 is loaded only into disposable job caches.
            # Never overwrite the workstation's Go 1.25.5 installation or global user cache.
            $env:GOTOOLCHAIN='go1.26.11'
            $env:GOPATH=Join-Path $root 'go-path'
            $env:GOMODCACHE=Join-Path $root 'go-mod-cache'
            $env:GOCACHE=Join-Path $root 'go-build-cache'
            $goText=(& go.exe version) -join ' '
            Write-Host ('KTRADE_OWNER_NATIVE_JOB_TOOLCHAIN='+$goText)
            if($LASTEXITCODE -ne 0 -or $goText -notmatch '\bgo1\.26\.11\b'){
              throw 'KTRADE_OWNER_NATIVE_PINNED_GO_TOOLCHAIN_UNAVAILABLE'
            }
            $env:GH_PROMPT_DISABLED='1'
            $env:GIT_TERMINAL_PROMPT='0'
            & gh.exe repo clone spoonman136668-ai/ktrade $source -- --filter=blob:none --no-checkout *> $clonelog
            if($LASTEXITCODE -ne 0){throw 'KTRADE_OWNER_NATIVE_PRIVATE_SOURCE_UNAVAILABLE'}
            & git.exe -C $source fetch --no-tags --depth 1 origin $env:KTRADE_EXPECTED_SOURCE *> $clonelog
            if($LASTEXITCODE -ne 0){throw 'KTRADE_OWNER_NATIVE_PINNED_SOURCE_FETCH_FAILED'}
            & git.exe -C $source checkout --detach $env:KTRADE_EXPECTED_SOURCE *> $clonelog
            if($LASTEXITCODE -ne 0){throw 'KTRADE_OWNER_NATIVE_CHECKOUT_FAILED'}
            $head=(& git.exe -C $source rev-parse HEAD).Trim()
            $tree=(& git.exe -C $source rev-parse 'HEAD^{tree}').Trim()
            if($head -cne $env:KTRADE_EXPECTED_SOURCE -or $tree -cne $env:KTRADE_EXPECTED_TREE -or
               @(& git.exe -C $source status --porcelain --untracked-files=no).Count -ne 0){
              throw 'KTRADE_OWNER_NATIVE_EXACT_TREE_OR_CLEAN_REFUSED'
            }
            $original=Join-Path $source 'windows/Test-KTRADE-W160-NativeDrawings.ps1'
            $text=[IO.File]::ReadAllText($original)
            $pattern=[regex]::Escape("Require ("+'$env:GITHUB_REPOSITORY'+" -ceq 'spoonman136668-ai/ktrade' -and")+
              '(?s:.+?)'+[regex]::Escape("'W160_PRIVATE_WINDOWS_QUALIFIER_ONLY'")
            $adapt=@'
          Require ($env:GITHUB_REPOSITORY -ceq 'spoonman136668-ai/FORGE' -and
           $env:RUNNER_OS -ceq 'Windows' -and
           $env:RUNNER_ENVIRONMENT -ceq 'self-hosted' -and
           $env:RUNNER_NAME -ceq 'FORGE-CODEX-REMOTE' -and
           $env:GITHUB_REF -ceq 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113' -and
           $env:RUNNER_TEMP) 'W160_OWNER_FORGE_WINDOWS_QUALIFIER_ONLY'
          '@
            if(([regex]::Matches($text,$pattern)).Count -ne 1){
              throw 'KTRADE_OWNER_NATIVE_W160_HARNESS_SOURCE_DRIFT'
            }
            $adjusted=[regex]::Replace($text,$pattern,[System.Text.RegularExpressions.MatchEvaluator]{param($m) $adapt})
            # Disposable W160 source gets one additional independent native
            # GetDpiForWindow witness per launch; product candidate is pristine.
            $loopAnchor=' for($phase=0;$phase -lt 2;$phase++){'
            $windowAnchor='  [void](Window)'
            if($adjusted.Split(@($loopAnchor),[StringSplitOptions]::None).Count -ne 2 -or
               $adjusted.Split(@($windowAnchor),[StringSplitOptions]::None).Count -ne 2){
              throw 'KTRADE_PR253_W160_DPI_WITNESS_HARNESS_DRIFT'
            }
            $dpiType=@'
           Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class KTradeW160Dpi200 { [DllImport("user32.dll")] public static extern uint GetDpiForWindow(IntPtr hwnd); }'
           for($phase=0;$phase -lt 2;$phase++){
          '@
            $windowProof=@'
            [void](Window)
            $nativeWinDpi=[KTradeW160Dpi200]::GetDpiForWindow($proc.MainWindowHandle)
            Require ($nativeWinDpi -eq 192) 'W160_NATIVE_WINDOW_DPI_200_REQUIRED'
            Write-Host ('W160_NATIVE_WINDOW_DPI_200=PASS;dpi='+$nativeWinDpi)
          '@
            $adjusted=$adjusted.Replace($loopAnchor,$dpiType)
            $adjusted=$adjusted.Replace($windowAnchor,$windowProof)
            $script=Join-Path (Split-Path -Parent $original) $derived
            if(Test-Path -LiteralPath $script){throw 'KTRADE_OWNER_NATIVE_ADAPTED_HARNESS_COLLISION'}
            [IO.File]::WriteAllText($script,$adjusted,[Text.UTF8Encoding]::new($false))
            $nodes=@(Get-Process -Name ktrade,ktrade-engine -ErrorAction SilentlyContinue)
            if($nodes.Count -ne 0){throw 'KTRADE_OWNER_NATIVE_APP_STARTED_DURING_BUILD'}
            if([KTradeOwnedDesktop]::GetSaverTimeout() -ne $saverOriginal -or
               [string](Get-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -ErrorAction Stop).ScreenSaveTimeOut -cne $originalRegistry){
              throw 'KTRADE_MANUAL20_DRIFT_BEFORE_LAUNCH'
            }
            $stampBeforeLaunch=[KTradeOwnedDesktop]::LastInputStamp()
            if($stampBeforeLaunch -ne $lastStampAtAdmission){
              throw 'KTRADE_OWNER_NATIVE_INPUT_CHANGED_DURING_SOURCE_PREPARATION'
            }
            Write-Host ('KTRADE_OWNER_NATIVE_STAGE='+(@{
              schema='ktrade.pr253.owner-native-physical-150dpi.v1'
              source_sha=$head;tree_sha=$tree;dpi=$beforeDpi
              owner_session=$session;monotonic_input_stable=$true
              test_harness='W160_owner_scoped_guard_plus_window_dpi_witness'
              product_source_unchanged=$true;disposable_harness_dpi_witness=$true;display_dpi_unchanged=$true
            }|ConvertTo-Json -Compress))
            if(-not [KTradeOwnedDesktop]::InputDesktopIsDefault()){
              throw 'KTRADE_OWNER_NATIVE_INPUT_DESKTOP_SWITCHED_DURING_BUILD'
            }
            $cursorPrelaunch=[KTradeOwnedDesktop+P]::new()
            if(-not [KTradeOwnedDesktop]::GetCursorPos([ref]$cursorPrelaunch) -or
               [KTradeOwnedDesktop]::GetForegroundWindow() -eq [IntPtr]::Zero){
              throw 'KTRADE_OWNER_NATIVE_POINTER_PRELAUNCH_ACCESS_REFUSED'
            }
            & pwsh.exe -NoProfile -NonInteractive -File $script -ExpectedSourceSha $head -ExpectedTreeSha $tree
            if($LASTEXITCODE -ne 0){throw 'KTRADE_OWNER_NATIVE_W160_ACCEPTANCE_FAILED'}
            $succeeded=$true
          }finally{
            $saverRestored=$false
            try{
              $saverRestored=([KTradeOwnedDesktop]::GetSaverTimeout() -eq $saverOriginal -and
                [string](Get-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -ErrorAction Stop).ScreenSaveTimeOut -ceq $originalRegistry)
            }catch{Write-Host ('KTRADE_MANUAL20_READBACK_EXCEPTION='+$_.Exception.GetType().Name)}
            Write-Host ('KTRADE_OWNER_MANUAL20_SCREENSAVER_READBACK='+(@{
              original_timeout=$saverOriginal
              effective_timeout_restored=$saverRestored
              persistent_registry_unchanged=([string](Get-ItemProperty -Path 'HKCU:\Control Panel\Desktop').ScreenSaveTimeOut -ceq $originalRegistry)
              wallpaper_or_user_account_untouched=$true
              task_created=$false
            }|ConvertTo-Json -Compress))
            $desktopDefault=[KTradeOwnedDesktop]::InputDesktopIsDefault()
            $cursorRestored=if($desktopDefault){[KTradeOwnedDesktop]::SetCursorPos($cursor.x,$cursor.y)}else{$false}
            $foregroundRestored=if($desktopDefault){[KTradeOwnedDesktop]::SetForegroundWindow($foreground)}else{$false}
            $afterDpi=@([KTradeOwnedDesktop]::PhysicalDpi())
            $restored=($afterDpi.Count -eq $beforeDpi.Count -and
              ($afterDpi -join ',') -ceq ($beforeDpi -join ','))
            Write-Host ('KTRADE_OWNER_NATIVE_RESTORE='+(@{
              dpi_before=$beforeDpi;dpi_after=$afterDpi;dpi_unchanged=$restored
              pointer_restoration_attempted=$true;foreground_restoration_attempted=$true
              cursor_restored=$cursorRestored;foreground_restored=$foregroundRestored
              screen_saver_unchanged=$saverRestored
              source_sha=$env:KTRADE_EXPECTED_SOURCE;acceptance_passed=$succeeded
            }|ConvertTo-Json -Compress))
            if($root -and (Test-Path -LiteralPath $root -PathType Container) -and
               [IO.Path]::GetFileName($root) -cmatch '^ktrade-pr253-real-native-[a-f0-9]{32}$' -and
               [IO.Path]::GetDirectoryName($root).TrimEnd('\') -ceq ([IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\'))){
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
            if(!$saverRestored){throw 'KTRADE_MANUAL20_SCREEN_SAVER_CHANGED'}
            if(!$restored){throw 'KTRADE_OWNER_NATIVE_DPI_POSTTEST_RESTORATION_FAILED'}
          }
          if(!$succeeded){throw 'KTRADE_OWNER_NATIVE_NOT_ACCEPTED'}
          Write-Host 'KTRADE_PR253_NATIVE_W160_PHYSICAL_200_PERCENT=PASS'
            Write-Host 'KTRADE_W190_NATIVE_DRAWINGS_AT_PHYSICAL_200=PASS'
          }finally{
            if($attempted200){
              try{
                Choose-Scale 150
                $reverted=Confirm-Dpi '144:144'
              }catch{
                Write-Host ('KTRADE_W189_ROLLBACK_ATTEMPT_ERROR='+$_.Exception.GetType().Name)
              }
            }else{
              $reverted=([KtradeW189Native]::ReadDpi() -ceq '144:144')
            }
            $after=[KtradeW189Native]::ReadDpi()
            if($after -ceq '144:144'){$reverted=$true}
            if($priorForeground -ne [IntPtr]::Zero){
              $fg=[KtradeW189Native]::SetForegroundWindow($priorForeground)
              Write-Host ('KTRADE_W189_FOREGROUND_RESTORE='+$(if($fg){'PASS'}else{'UNVERIFIED'}))
            }
            $regAfter=Get-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -ErrorAction Stop
            $saverStable=([string]$regAfter.ScreenSaveTimeOut -ceq '1200' -and
                          [string]$regAfter.ScreenSaveActive -ceq '1')
            Write-Host ('KTRADE_W189_DPI_RESTORATION='+(@{
              physical_200_observed=$observed200
              before_dpi=$before;after_dpi=$after
              restored_150=$reverted
              screen_saver_unchanged=$saverStable
              product_source_unchanged=$true
              installed_profile_untouched=$true
              broker_disarmed=$true
              scheduled_tasks_created=$false
            }|ConvertTo-Json -Compress))
            if(!$reverted -or !$saverStable){throw 'W189_OWNER_DESKTOP_RESTORE_FAILED'}
          }
      - name: Independently verify owner's 20 minute screen saver remains unchanged after physical 200 restore
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             [Security.Principal.WindowsIdentity]::GetCurrent().Name -ine 'LINKDEADKB\camar'){
            throw 'KTRADE_MANUAL20_INDEPENDENT_SCOPE_REFUSED'
          }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class KtradeManual20Independent {
            [DllImport("user32.dll",SetLastError=true)]
            public static extern bool SystemParametersInfo(uint action,uint param,ref uint value,uint flags);
            public static uint Read(){
              uint v=0;
              if(!SystemParametersInfo(0x000E,0,ref v,0))
                throw new Exception("MANUAL20_SAVER_READ_FAILED");
              return v;
            }
          }
          '@
          $seconds=[KtradeManual20Independent]::Read()
          $reg=Get-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -ErrorAction Stop
          Write-Host ('KTRADE_OWNER_MANUAL20_INDEPENDENT_OBSERVED='+(@{
            effective_timeout_seconds=$seconds
            registry_timeout_seconds=[string]$reg.ScreenSaveTimeOut
            settings_changed_by_job=$false
          }|ConvertTo-Json -Compress))
          if($seconds -ne 1200 -or [string]$reg.ScreenSaveTimeOut -cne '1200'){
            throw 'KTRADE_OWNER_MANUAL20_SETTINGS_CHANGED'
          }
          Write-Host 'KTRADE_OWNER_MANUAL20_INDEPENDENT_READBACK=PASS;effective_seconds=1200;registry_seconds=1200;settings_changed=false;scheduled_tasks_created=false'
