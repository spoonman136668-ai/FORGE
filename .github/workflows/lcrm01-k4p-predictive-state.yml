name: Mass K4P learned compact predictive state and unfamiliar picking
on:
  push:
    branches: [research/mass-lcrm01-k4p-predictive-state-20261024]
permissions:
  contents: read
jobs:
  original-fit-learning-and-novel-worlds:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Verify protocol then run prospective actual transition-learning with matched baselines
        run: bash research/lcrm01/k4p_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-k4p-original-compact-predictive-state-evidence
          path: |
            ${{ runner.temp }}/k4p/process-a.json
            ${{ runner.temp }}/k4p/process-b.json
            ${{ runner.temp }}/k4p/comparison.json
            ${{ runner.temp }}/k4p/process-a.log
            ${{ runner.temp }}/k4p/process-b.log
          if-no-files-found: warn
          retention-days: 90
