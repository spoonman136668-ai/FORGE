name: R317 original CKB running launch and effective configuration binding
on:
  push:
    branches: [audit/mp-r317-native-launch-binding-readonly-20261025]
    paths: [.github/workflows/mp-r317-native-launch-binding-readonly.yml]
permissions:
  contents: read
concurrency:
  group: r317-original-owner-readonly-binding
  cancel-in-progress: false
jobs:
  owner-read-only:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Observe native process configuration and original R18 task startup, never invoke them
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-StrictMode -Version 3.0
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF_NAME -cne 'audit/mp-r317-native-launch-binding-readonly-20261025' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB'){
            throw 'R317_ORIGINAL_OWNER_RUNNER_REF_EVENT_DRIFT'
          }
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $principal=[Security.Principal.WindowsPrincipal]::new($identity)
          if($identity.Name -ine 'LINKDEADKB\camar' -or
             !$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){
            throw 'R317_ORIGINAL_ELEVATED_OWNER_NOT_VERIFIED'
          }
          function Hash([string]$p){
            return (Get-FileHash -LiteralPath $p -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
          }
          function XmlHash([string]$txt){
            $sha=[Security.Cryptography.SHA256]::Create()
            try{return [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($txt))).Replace('-','').ToLowerInvariant()}
            finally{$sha.Dispose()}
          }
          function IsRegular([string]$p){
            if(!(Test-Path -LiteralPath $p -PathType Leaf -ErrorAction Stop)){return $false}
            $cur=Get-Item -LiteralPath $p -ErrorAction Stop
            while($null-ne$cur){
              if(($cur.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){return $false}
              if($cur -is [IO.FileInfo]){$cur=$cur.Directory}
              elseif($cur -is [IO.DirectoryInfo]){$cur=$cur.Parent}
              else{return $false}
            }
            return $true
          }
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $reportedExe=Join-Path $root 'bin\ckb-plane.exe'
          $reportedCfg=Join-Path $root 'config\autonomy.yaml'
          if(!(IsRegular $reportedExe) -or !(IsRegular $reportedCfg)){throw 'R317_DOCUMENTED_FILES_UNREADABLE'}
          $observedExeHash=Hash $reportedExe
          $observedCfgHash=Hash $reportedCfg
          if($observedExeHash -cne '70e815f8e0399aeabb3291fd140b250039b6993f9d2d60e1b7563c56971c19e6' -or
             $observedCfgHash -cne 'a14f210a146de9bd248bb4cfdc2e156b19c985a6c964a91881c4391f0a0190dc'){
            throw 'R317_DOCUMENTED_INSTALLED_SOURCE_CHANGED'
          }
          $processes=@(Get-CimInstance -ClassName Win32_Process -Filter "Name = 'ckb-plane.exe'" -ErrorAction Stop)
          if($processes.Count -ne 1){throw 'R317_NATIVE_SINGLE_PROCESS_NOT_PROVEN'}
          $p=$processes[0]
          $pidInitial=[int]$p.ProcessId
          $born=([datetime]$p.CreationDate).ToUniversalTime().ToString('o')
          $livePath=[string]$p.ExecutablePath
          if([string]::IsNullOrWhiteSpace($livePath) -or ![IO.Path]::IsPathRooted($livePath) -or !(IsRegular $livePath)){
            throw 'R317_LIVE_EXE_PATH_NOT_QUALIFIED'
          }
          $liveExeHash=Hash $livePath
          if($liveExeHash -cne '82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'){
            throw 'R317_ORIGINAL_R303_RUNNING_FILE_IDENTITY_DRIFT'
          }
          $tcp=@(Get-NetTCPConnection -LocalPort 8791 -State Listen -ErrorAction Stop)
          if($tcp.Count -lt 1 -or @($tcp|Where-Object {
            [int]$_.OwningProcess -ne $pidInitial -or $_.LocalAddress -notin @('127.0.0.1','::1')
          }).Count -gt 0){throw 'R317_CURRENT_LOCAL_LISTENER_OWNER_MISMATCH'}
          $task=Get-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction Stop
          if(@($task.Actions).Count -ne 1 -or [string]$task.Principal.UserId -notmatch '(?i)camar$'){
            throw 'R317_ORIGINAL_REGISTERED_TASK_CHANGED'
          }
          $action=$task.Actions[0]
          if([string]$action.Arguments -notmatch '(?i)Start-R18-Controller'){
            throw 'R317_REGISTERED_R18_WRAPPER_DRIFT'
          }
          $xml=Export-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction Stop
          $taskSha=XmlHash $xml
          if($taskSha -cne '84550e47cac80dfd84ec09baea7db6c533c3d88ea39bd88e3c5dd3e0e1406022'){
            throw 'R317_R316_ORIGINAL_TASK_XML_IDENTITY_DRIFT'
          }
          Write-Output 'R317_AUTHENTICATED_EXISTING_ELEVATED_OWNER=PASS'
          Write-Output 'R317_NATIVE_PROCESS_AND_LOOPBACK_IDENTITY=PASS'
          Write-Output 'R317_RUNNING_FILE_SHA256=82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          Write-Output 'R317_TASK_AND_CONFIG_PREIMAGE_IDENTITY=PASS'
          $argsText=[string]$action.Arguments
          $wrapperMatch=[regex]::Match($argsText,'(?i)(?:^|\s)-File\s+(?:"([^"]+)"|(\S+))')
          $wrapperSha=''
          if($wrapperMatch.Success){
            $wrapper=[string]$wrapperMatch.Groups[1].Value
            if([string]::IsNullOrWhiteSpace($wrapper)){$wrapper=[string]$wrapperMatch.Groups[2].Value}
            if([IO.Path]::IsPathRooted($wrapper) -and
               [IO.Path]::GetFileName($wrapper) -ieq 'Start-R18-Controller.ps1' -and
               (IsRegular $wrapper)){
              $wrapperSha=Hash $wrapper
              Write-Output 'R317_REGISTERED_R18_WRAPPER_FILE=READABLE'
              Write-Output ('R317_REGISTERED_R18_WRAPPER_SHA256='+$wrapperSha)
            }else{Write-Output 'R317_REGISTERED_R18_WRAPPER_FILE=UNVERIFIED'}
          }else{Write-Output 'R317_REGISTERED_R18_WRAPPER_FILE=UNPARSEABLE'}
          $argsLive=[string]$p.CommandLine
          $match=[regex]::Match($argsLive,'(?i)(?:^|\s)--config(?:=|\s+)(?:"(?<quoted>[^"]+)"|(?<plain>\S+))')
          $effectiveStatus='NOT_OBSERVABLE'
          if($match.Success){
            $cfgPath=[string]$match.Groups['quoted'].Value
            if([string]::IsNullOrWhiteSpace($cfgPath)){$cfgPath=[string]$match.Groups['plain'].Value}
            if([IO.Path]::IsPathRooted($cfgPath) -and
               [IO.Path]::GetFileName($cfgPath) -ieq 'autonomy.yaml' -and
               (IsRegular $cfgPath)){
              $cfgResolved=Hash $cfgPath
              $sameCfg=[string]::Equals([IO.Path]::GetFullPath($cfgPath),[IO.Path]::GetFullPath($reportedCfg),[StringComparison]::OrdinalIgnoreCase)
              Write-Output ('R317_RUNNING_CONFIG_PATH_MATCHES_DOCUMENTED='+([string]$sameCfg).ToUpperInvariant())
              Write-Output ('R317_RUNNING_CONFIG_SHA256='+$cfgResolved)
              $effectiveStatus=if($sameCfg -and $cfgResolved -ceq $observedCfgHash){'CONFIG_FILE_IDENTITY_MATCH'}else{'CONFIG_DIFFERS_FROM_DOCUMENTED'}
            }else{$effectiveStatus='UNVERIFIABLE_PARAMETER_PATH'}
          }
          Write-Output ('R317_EFFECTIVE_CONFIG_BINDING='+$effectiveStatus)
          Write-Output 'R317_PROCESS_COMMAND_LINE_CONTENT_NOT_EXPORTED=TRUE'
          # Neither task nor process command lines establish process origin or code-page hashes.
          $again=@(Get-CimInstance -ClassName Win32_Process -Filter "Name = 'ckb-plane.exe'" -ErrorAction Stop)
          if($again.Count -ne 1 -or [int]$again[0].ProcessId -ne $pidInitial -or
             ([datetime]$again[0].CreationDate).ToUniversalTime().ToString('o') -cne $born -or
             (Hash $livePath) -cne $liveExeHash -or
             (Hash $reportedExe) -cne $observedExeHash -or
             (Hash $reportedCfg) -cne $observedCfgHash -or
             (XmlHash (Export-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction Stop)) -cne $taskSha -or
             (![string]::IsNullOrWhiteSpace($wrapperSha) -and (Hash $wrapper) -cne $wrapperSha)){
            throw 'R317_ORIGINAL_OWNER_LIVE_PREPOST_IDENTITY_DRIFT'
          }
          Write-Output 'R317_RUNNING_PROCESS_TASK_CONFIG_PREPOST=PASS'
          Write-Output 'R317_RESIDENT_MEMORY_IMAGE_HASH=NOT_VERIFIED'
          Write-Output 'R317_DURABLE_SQLITE_RECOVERY_ESCROW=NOT_ATTESTED'
          Write-Output 'R317_NATIVE_ENGINEERING_SUCCESSOR=NOT_TESTED'
          Write-Output 'R317_LIVE_CUTOVER=DENIED'
          Write-Output 'R317_NO_LIVE_TASK_DB_CONFIG_OR_QUEUE_MUTATIONS=TRUE'
