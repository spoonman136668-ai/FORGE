            if ($LASTEXITCODE -ne 0) { throw 'F125R_FULL_GO_RACE_FAILED' }
          }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'F125R_FULL_GO_VET_FAILED' }
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw 'F125R_FULL_BUILD_FAILED' }
          $dir=Join-Path $env:RUNNER_TEMP 'f125r-development-regression'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $receipt=[ordered]@{
            schema='forge.autonomy.f125r.full-development-regression.v1'
            source_sha=$env:GITHUB_SHA
            platform=$env:RUNNER_OS
            full_go_regression=$true
            go_vet_and_build=$true
            affected_interfaces=$true
            linux_race_executed=($env:RUNNER_OS -eq 'Linux')
            protected_confirmation_read=$false
            scientific_first_use=$false
            scientific_acceptance=$false
            optimizer_promotion=$false
          } | ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText((Join-Path $dir 'regression.json'),
             ($receipt+[Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          Write-Host 'F125R_EXACT_HEAD_REGRESSION=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: f125r-public-full-regression-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/f125r-development-regression/regression.json
          retention-days: 90
          if-no-files-found: error
