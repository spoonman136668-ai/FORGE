name: FORGE V41 native-development activation diagnosis (read-only)
on:
  push:
    branches:
      - diagnostic/f139-v41-private-backup-hash-20261113
    paths:
      - .github/workflows/f139-v41-native-activation-readonly.yml
permissions:
  contents: read
concurrency:
  group: forge-v41-native-activation-readonly-20261113
  cancel-in-progress: false
jobs:
  native-activation-ro:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Checkout inert source-bounded diagnostic
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify original SQLite native-development activation and historical negative custody
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $target='1a40fe4e3ec6e93a1631d59863b95e90981d734e'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/diagnostic/f139-v41-private-backup-hash-20261113' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:OPENAI_API_KEY){throw 'F139_V41_ACTIVATION_RO_OWNER_DENIED'}
          $base=(& git merge-base $target HEAD | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $base -cne $target){throw 'F139_V41_ACTIVATION_RO_SOURCE_DRIFT'}
          $db=Join-Path $env:LOCALAPPDATA 'FORGE-F139/state.sqlite'
          $root=Join-Path (Join-Path $env:LOCALAPPDATA 'FORGE-F139/release-candidates') $target
          if(-not(Test-Path -LiteralPath $db -PathType Leaf) -or
             -not(Test-Path -LiteralPath $root -PathType Container)){
            throw 'F139_V41_ACTIVATION_RO_ORIGINAL_NOT_FOUND'
          }
          $env:PYTHONPATH=$root
          $code=@'
          import json,sys
          from contextlib import closing
          from pathlib import Path
          from f139.local_controller import Database
          from f139.nci04_owner_ledger import verify_native_activation
          path=Path(sys.argv[1])
          target=sys.argv[2]
          with closing(Database.open_readonly(path)) as db:
              m=db.meta()
              assert m["source_sha"]==target and m["head_seq"]>=1828
              rows=db.conn.execute("SELECT seq,payload FROM events WHERE kind='NATIVE_DEVELOPMENT_ACTIVATED' ORDER BY seq").fetchall()
              transitions=db.conn.execute("SELECT seq,payload FROM events WHERE kind='SOURCE_TRANSITION_ADMITTED' ORDER BY seq").fetchall()
              last_activation=json.loads(rows[-1]["payload"]) if rows else {}
              last_transition=json.loads(transitions[-1]["payload"]) if transitions else {}
              failures=dict(db.conn.execute("SELECT stage,COUNT(*) FROM tasks WHERE stage!='VERIFIED' GROUP BY stage").fetchall())
              enabled=verify_native_activation(db)
              activated_for_target=any(json.loads(x["payload"]).get("source_sha")==target for x in rows)
              assert not enabled and not activated_for_target
              assert db.conn.total_changes==0 and db.conn.execute("PRAGMA query_only").fetchone()[0]==1
              print("F139_V41_NATIVE_ACTIVATION_READONLY="+json.dumps({
                  "schema":"forge.f139.v41.native-activation-status-readonly.v1",
                  "source_sha":target,
                  "original_head_seq":m["head_seq"],
                  "original_head_sha256":m["head_hash"],
                  "activation_event_count":len(rows),
                  "source_transition_event_count":len(transitions),
                  "last_activation_source_sha":last_activation.get("source_sha"),
                  "last_transition_to_source_sha":last_transition.get("to_source_sha"),
                  "last_transition_schema":last_transition.get("schema"),
                  "activation_for_deployed_source":activated_for_target,
                  "verify_native_activation":enabled,
                  "failed_or_quarantined_stages":failures,
                  "read_only":True,
                  "original_sqlite_mutations":0,
                  "scientific_first_use":False
              },sort_keys=True,separators=(",",":")))
          '@
          $out=@($code | & python -B - $db $target)
          if($LASTEXITCODE -ne 0 -or $out.Count -ne 1 -or
             $out[0] -cnotmatch '^F139_V41_NATIVE_ACTIVATION_READONLY='){
            throw 'F139_V41_ACTIVATION_RO_ORIGINAL_VERIFICATION_FAILED'
          }
          Write-Output $out[0]
          Write-Output 'F139_V41_MISSING_NATIVE_ACTIVATION_VERIFIED=PASS'
