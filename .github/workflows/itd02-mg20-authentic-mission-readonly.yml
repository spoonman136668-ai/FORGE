name: ITD-02 MG20 authentic source mission read-only native parity
on:
  push:
    branches: [research/itd02-mg20-authentic-mission-native-admission-20261029]
permissions:
  contents: read
  actions: read
jobs:
  authentic-original-mission-native-readonly:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout prospective frozen MG20 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python source runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Go native source compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Authenticated MG17 quarantined replay and immutable MG19 source pins
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git merge-base --is-ancestor 9715598cd35001a184f8ef12d0f0360fa933313f "$GITHUB_SHA"
          git merge-base --is-ancestor a090169d3f56b4da4821a4362050b4861ea08369 "$GITHUB_SHA"
          case "$RUNNER_OS" in
            Windows) ROOT="$(cygpath -u "$RUNNER_TEMP")/mg20" ;;
            *) ROOT="$RUNNER_TEMP/mg20" ;;
          esac
          mkdir -p "$ROOT/wingless" "$ROOT/yggdrasil" "$ROOT/source"
          gh run download 40851660778 --repo spoonman136668-ai/FORGE \
            --name mg17-original-minigrid-public-traces-ubuntu-24.04 \
            --dir "$ROOT/source"
          test -s "$ROOT/source/first.json"
          test -s "$ROOT/source/second.json"
          git init -q "$ROOT/wingless"
          git -C "$ROOT/wingless" remote add origin https://github.com/spoonman136668-ai/Wingless.git
          git -C "$ROOT/wingless" fetch --no-tags --depth 1 origin ebbadd157cc1df6eabfa5a550c8876ca87dc91e9
          git -C "$ROOT/wingless" checkout --detach -q ebbadd157cc1df6eabfa5a550c8876ca87dc91e9
          test "$(git -C "$ROOT/wingless" hash-object research/native/itd02/mg19/genuine_mission.go)" = df6111abd421f601b976273abf61aaad6d0bf61a
          git init -q "$ROOT/yggdrasil"
          git -C "$ROOT/yggdrasil" remote add origin https://github.com/spoonman136668-ai/Yggdrasil.git
          git -C "$ROOT/yggdrasil" fetch --no-tags --depth 1 origin f0dd99d59ce00da7ad17ff49900a1af6d2322a77
          git -C "$ROOT/yggdrasil" checkout --detach -q f0dd99d59ce00da7ad17ff49900a1af6d2322a77
          test "$(git -C "$ROOT/yggdrasil" hash-object research/native/itd02/mg19/genuine_mission_cells.py)" = 6a2a60eb9c9b77436421aa7ccbe785d29a163280
          (cd "$ROOT/wingless" && go build -trimpath -o "$ROOT/mg20-probe.exe" "$GITHUB_WORKSPACE/research/lcrm01/mg20_original_mission_readonly_go.go")
          export PYTHONPATH="$ROOT/yggdrasil:$GITHUB_WORKSPACE/research/lcrm01"
          python -B research/lcrm01/mg20_original_mission_readonly.py \
            --first "$ROOT/source/first.json" \
            --second "$ROOT/source/second.json" \
            --go-binary "$ROOT/mg20-probe.exe" \
            --output "$ROOT/receipt.json"
          test -s "$ROOT/receipt.json"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo MG20_QUARANTINED_SOURCE_NO_TRAINING_ORIGINAL_MISSION_SOURCE_GATE_PASS
      - name: Preserve authenticated read-only source comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mg20-genuine-mission-readonly-${{ matrix.os }}
          path: ${{ runner.temp }}/mg20/receipt.json
          retention-days: 30
          if-no-files-found: warn
  independent-cross-host-receipt:
    needs: authentic-original-mission-native-readonly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mg20-genuine-mission-readonly-*
          path: receipts
      - name: Independently compare two host native source action digests
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          paths=sorted(pathlib.Path("receipts").rglob("receipt.json"))
          if len(paths)!=2:raise SystemExit("MG20_MISSING_CROSS_HOST_CUSTODY")
          rows=[json.loads(p.read_text()) for p in paths]
          assert rows[0]==rows[1],"MG20_NATIVE_SOURCE_CROSS_HOST_DIFFERENCE"
          assert rows[0]["native_training_or_feedback_events"]==0
          assert rows[0]["new_original_source_steps"]==0
          assert rows[0]["read_only_quarantined_original_frames_per_model"]==96
          print("MG20_TWO_HOST_AUTHENTIC_NATIVE_READONLY_MISSION_PARITY_PASS",rows[0]["canonical_receipt_sha256"])
          PY
