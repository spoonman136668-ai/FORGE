name: F124-AD original 16-cell causal evidence accumulation
on:
  push:
    branches: [research/f124ad-intermediate-causal-credit-20261018]
permissions:
  contents: read
  actions: read
concurrency:
  group: f124ad-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Qualify independent source, signed prior selector replay, immutable 7+9 and no oracle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if ($IsWindows) {'python'} else {'python3'}
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'F124AD_EXACT_HEAD_FAIL' }
          & $py -B -m unittest discover -s nativeevidence -p 'test_f124ad_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F124AD_AUTHENTIC_SOURCE_FAIL' }
          & $py -B isolationguard/check.py
          if ($LASTEXITCODE -ne 0) { throw 'F124AD_ISOLATION_FAIL' }
          Write-Output 'F124AD_PROTECTED_FIRST_USE=false'
  authentic-development:
    needs: frozen-source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39078269441
          github-token: ${{ github.token }}
          name: f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d
          path: o
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39081990918
          github-token: ${{ github.token }}
          name: f124r-fresh-two-lane-causal-evidence-522601491c10ebfeb36e7dca2627ff5366b51abb
          path: r
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39082745397
          github-token: ${{ github.token }}
          name: f124s-source-backed-development-bc59de4f118b37d9a501dd8a944e210540222a27
          path: s
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39084599471
          github-token: ${{ github.token }}
          name: f124u-source-backed-independent-development-7d8df58e3fd7363e5c91b39a426ff3430fedf20d
          path: u
      - name: Authenticate pretrained receipts, select FIT-only intermediate credit, score new DEV
        shell: bash
        run: |
          set -euo pipefail
          python3 -B nativeevidence/f124ad_intermediate_credit.py --original-o o/f124o-independent-two-learned-development.json --original-r r/f124r-fresh-calibrated-continuous-development.json --original-s s/f124s-fresh-packed-key-cell-credit-development.json --original-u u/f124u-bounded-index-fresh-causal-rank-development.json --output "$RUNNER_TEMP/f124ad-evidence.json"
          python3 - "$RUNNER_TEMP/f124ad-evidence.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v["schema"]=="forge.research.f124ad.recursive-causal-credit.v1"
          assert v["freeze_blob"]=="2941fdee92a866083a85fff795a118a933873a1a"
          assert v["original_active_slots"]==7 and v["original_retained_slots"]==9
          assert v["DEV_never_selected"] and v["no_added_persistent_cell_fields"]
          assert not v["protected_first_use"] and not v["science_accepted"]
          for arm in ("O","U"):
              for family in ("baseline","exact_credit","mismatch_penalty","combined"):
                  d=v["DEV_scores"][arm][family]
                  if d is not None:
                      assert d["pairs"]==48 and len(d["cases"])==48
                      assert all(s["pairs"]==16 for s in d["by_depth"].values())
          PY
          sha256sum "$RUNNER_TEMP/f124ad-evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: f124ad-source-backed-recursive-credit-${{ github.sha }}
          path: ${{ runner.temp }}/f124ad-evidence.json
          retention-days: 90
          if-no-files-found: error
  one-full-regression:
    needs: authentic-development
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - name: Full original Go tests race vet build and isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
          echo "F124AD_QUALIFIED_HEAD=$GITHUB_SHA"
          echo 'F124AD_ORIGINAL_PROTECTED_FIRST_USE=false'
