name: ITD-02 MG14-U authentic unfamiliar MiniGrid family mission-blind transfer
on:
  push:
    branches: [research/itd02-mg14u-unfamiliar-family-missionblind-20261029]
permissions:
  contents: read
jobs:
  two-original-source-processes-door-key-versus-goal-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Force original LF source semantics
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact research source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Frozen Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Native Go 1.25.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Execute two independent authentic unassisted task-family trials
        shell: bash
        run: bash research/lcrm01/mg14u_ci.sh
      - name: Preserve original mission, source actions and negative results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-mg14u-original-unfamiliar-missionblind-sensory-evidence
          path: |
            ${{ runner.temp }}/mg14u/first.json
            ${{ runner.temp }}/mg14u/second.json
            ${{ runner.temp }}/mg14u/comparison.json
            ${{ runner.temp }}/mg14u/first.log
            ${{ runner.temp }}/mg14u/second.log
          retention-days: 30
          if-no-files-found: warn
