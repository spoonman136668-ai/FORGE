name: F124-AB frozen cross-family causal transfer and packed Wingless
on:
  push:
    branches: [research/f124ab-frozen-transfer-and-packed-state-20261017]
    paths:
      - 'reference/research-intake/f124ab-frozen-transfer-packed-state.json'
      - 'nativeevidence/f124ab_*.py'
      - 'nativeevidence/test_f124ab_*.py'
      - '.github/workflows/forge-f124ab-transfer-packed.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: f124ab-frozen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-source-focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: New family oracle separated, exact source lineage, original inference untouched
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if ($IsWindows) { 'python' } else { 'python3' }
          if ((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'F124AB_EXACT_HEAD_DRIFT' }
          foreach ($pattern in @('test_f124ab_*.py','test_f124aa_*.py')) {
            & $py -B -m unittest discover -s nativeevidence -p $pattern -v
            if ($LASTEXITCODE -ne 0) { throw "F124AB_FROZEN_SOURCE_FAILED_$pattern" }
          }
          & $py -B isolationguard/check.py
          if ($LASTEXITCODE -ne 0) { throw 'F124AB_CROSS_PROJECT_ISOLATION_FAILED' }
          Write-Output 'F124AB_PROTECTED_FIRST_USE=false'

  source-verified-independent-development:
    needs: frozen-source-focused
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate all seven original provider run/artifact receipts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sources=@(
            @{id='39078269441';head='5b52da1e38d5ff5671c582676790daf0462dd18d';artifact='12116979526';digest='sha256:fefa2135a029660f36970a66b08809aaa128c5f6d2b3c5705ef8a29a9b4f014c'},
            @{id='39082424955';head='01560f7f4f1aab5737cfd045dffd7faaccfb0608';artifact='12120010101';digest='sha256:b1b483e03a1ba8f9a66e75e11d48481573d24926b8f17dc77db076158c3168f3'},
            @{id='39083528704';head='6ba96aaaeff083a5e2f54020c70d2a717e431a10';artifact='12119184999';digest='sha256:93cf41e63c5fd458376778fd54f6da9eaa8677b390be763b6b214ca26fa6089a'},
            @{id='39085219061';head='af17fadc6bb66e30a6f7ebd1a6a629398cc09709';artifact='12119928375';digest='sha256:77774cd7a47d3e1d9357d52e6e82e28fbf7fe6bfc2e1fcaa5c4e94f13c941c0f'},
            @{id='39085922140';head='4f7fa505737acae4568df755b4804c384b057980';artifact='12120417300';digest='sha256:7d84f022f02ec607c9db09ba854141057c72f0ecb4cc7592ef298e778690f639'},
            @{id='39086773832';head='f4d8770482cce0d0f282420b45a1bd931cf81bd5';artifact='12121042723';digest='sha256:4efb86146c361e50d1c177faa979382bd9eb7e88fe1d8e5783f3e4e15efb23de'},
            @{id='39087469247';head='62db833856e523c45c82cf11f3d76bf0f5d7c257';artifact='12121202417';digest='sha256:c1be59e13a674b8b2a1f7846544db81b617d041f26761934df18bca3fcb03036'},
            @{id='39088963241';head='53bf4555ef3a88dbc126af4ff060aadecc976d9b';artifact='12122111712';digest='sha256:4894889c447de6b334b73602d3157bbb58dd4cd9c2c85ae2e268f3b24d132771'}
          )
          foreach ($p in $sources) {
            $run=(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($p.id)" | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne $p.head -or
                $run.status -cne 'completed' -or $run.conclusion -cne 'success' -or
                $run.event -cne 'push') { throw 'F124AB_ORIGINAL_PROVIDER_RUN_IDENTITY' }
            $index=(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($p.id)/artifacts" | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0) { throw 'F124AB_ORIGINAL_ARTIFACT_INDEX' }
            $found=@($index.artifacts | Where-Object { "$($_.id)" -ceq $p.artifact })
            if ($found.Count -ne 1 -or $found[0].digest -cne $p.digest -or $found[0].expired) {
              throw 'F124AB_ORIGINAL_PROVIDER_ARTIFACT'
            }
          }
          Write-Output 'F124AB_SOURCE_AUTHENTICITY=PASS'
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39078269441
          github-token: ${{ github.token }}
          name: f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d
          path: historical-o
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39082424955
          github-token: ${{ github.token }}
          name: f124t-source-verified-fresh-development-01560f7f4f1aab5737cfd045dffd7faaccfb0608
          path: historical-t
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39083528704
          github-token: ${{ github.token }}
          name: f124u-preregistered-fresh-development-6ba96aaaeff083a5e2f54020c70d2a717e431a10
          path: historical-u
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39085219061
          github-token: ${{ github.token }}
          name: f124w-frozen-hop-trace-and-indexed-fresh-af17fadc6bb66e30a6f7ebd1a6a629398cc09709
          path: historical-w
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39085922140
          github-token: ${{ github.token }}
          name: f124x-fresh-readout-and-runtime-4f7fa505737acae4568df755b4804c384b057980
          path: historical-x
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39086773832
          github-token: ${{ github.token }}
          name: f124y-authentic-budgeted-experiment-f4d8770482cce0d0f282420b45a1bd931cf81bd5
          path: historical-y
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39087469247
          github-token: ${{ github.token }}
          name: f124z-frozen-fresh-development-62db833856e523c45c82cf11f3d76bf0f5d7c257
          path: historical-z
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39088963241
          github-token: ${{ github.token }}
          name: f124aa-immutable-fresh-family-evidence-53bf4555ef3a88dbc126af4ff060aadecc976d9b
          path: historical-aa
      - name: Original raw SHA, frozen two-family FIT training, independent four-family DEV and Pareto
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sources=@(
            @{path='historical-o/f124o-independent-two-learned-development.json';sha='025c97abc8eb69079d7d7d0f59bfdb81235b9ad9ab83e230f32b542d2cfbdb5d'},
            @{path='historical-t/f124t-fresh-absolute-development.json';sha='a2f7b3641c2f84f684372918849170c97912c7a104fa4dbe264bcbd6d444c2d2'},
            @{path='historical-u/f124u-fresh-cell-and-readout-development.json';sha='63a2a57973444752d4002bc4718ec63de88a26ed05142627305de3a94fa9fb41'},
            @{path='historical-w/f124w-fresh-hop-survival-and-checksum.json';sha='122c0f1db5547a1ce2074c73c0b4b4d089c7f00eaf4573327676be3b7b521698'},
            @{path='historical-x/f124x-new-validation-and-runtime.json';sha='457f7be9312bd30b4ce052aed11edfd929fd02e715aa85ede7b9a58b2be355ba'},
            @{path='historical-y/f124y-fresh-budget-and-calibration.json';sha='13608eabec0d63103199f48cea0fdc861fe84ee64527007229d4bcf422d05353'},
            @{path='historical-z/f124z-fresh-sparse-and-public-continuity.json';sha='d6e19c5b9a572eefab5e0927a41abad6d34c3654c80605f7980b6e0908c3e44c'},
            @{path='historical-aa/f124aa-new-transfer-and-packed.json';sha='fda2f1dbf130062b347e0e46862fe409b5af2c95a98fd3ca97c0e8642ff7d034'}
          )
          foreach ($s in $sources) {
            if ((Get-FileHash -LiteralPath $s.path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $s.sha) {
              throw 'F124AB_RAW_PARENT_HASH_DRIFT'
            }
          }
          $output=Join-Path $env:RUNNER_TEMP 'f124ab-fresh-soft-hamming-and-packed-pareto.json'
          & python3 -B nativeevidence/f124ab_development_evidence.py --o $sources[0].path --t $sources[1].path --u $sources[2].path --w $sources[3].path --x $sources[4].path --y $sources[5].path --z $sources[6].path --aa $sources[7].path --output $output
          if ($LASTEXITCODE -ne 0) { throw 'F124AB_ORIGINAL_MODEL_OR_FIT_DEV_QUARANTINED' }
          $r=Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
          if ($r.schema -cne 'forge.research.f124ab.frozen-soft-hamming-packed-pareto-development.v1' -or
              $r.freeze_git_blob -cne '61724ad438c1609a6738bef7b7a3e239132d8944' -or
              $r.lanes.Count -ne 2 -or -not $r.frozen_model_source_unchanged -or
              -not $r.training_sources_only_new_FIT -or
              -not $r.first_DEV_only_after_FIT_selection -or
              $r.scientific_acceptance -or $r.optimizer_promotion -or
              $r.protected_first_use -or $r.matched_compute_superiority_proven -or
              $r.accepted_ref_mutations -ne 0 -or $r.fit_grid.Count -ne 25) {
            throw 'F124AB_FALSE_SCIENCE_OR_MISSING_HYPOTHESIS'
          }
          foreach ($lane in $r.lanes) {
            foreach ($phase in @($lane.FIT,$lane.DEV)) {
              if ($phase.total_pairs -ne 48 -or -not $phase.reference_only_outside_inference -or
                  @($phase.family_counts.PSObject.Properties).Count -ne 4) {
                throw 'F124AB_FAMILY_DENOMINATOR_OR_SAFETY'
              }
              foreach ($a in $phase.controls.PSObject.Properties) {
                $test=$a.Value
                $n=if ($a.Name -ceq 'strong_fixed') {36} else {48}
                if ($test.pairs -ne $n -or $test.unsupported -ne (48-$n) -or
                    $test.case_sha256.Count -ne $n -or
                    $test.max_retained -gt 9 -or $test.max_counter_slots -gt 16 -or
                    ($lane.lane -ceq 'Yggdrasil' -and $test.max_active -gt 7)) {
                  throw 'F124AB_ORIGINAL_BUDGET_OR_MISSING_CONTROLS'
                }
                foreach ($f in $test.family.PSObject.Properties) {
                  if ($f.Value.pairs+$f.Value.unsupported -ne 12) {
                    throw 'F124AB_FAMILY_NOT_ACCOUNTED'
                  }
                }
              }
            }
            if ($lane.lane -ceq 'Wingless') {
              $bench=$lane.benchmarks
              if ($bench.matched_hardware_superiority -or
                  -not $bench.fixed_control_extended_domain_unsupported -or
                  @($bench.results.PSObject.Properties).Count -ne 5) {
                throw 'F124AB_FALSE_COMPUTE_PARITY'
              }
              foreach ($b in $bench.results.PSObject.Properties) {
                $n=if ($b.Name -ceq 'strong_fixed') {18} else {24}
                if ($b.Value.graphs -ne $n -or
                    $b.Value.timed_calls -ne ($n*3) -or
                    $b.Value.median_runtime_ns -le 0 -or
                    $b.Value.median_peak_python_bytes -le 0) {
                  throw 'F124AB_BENCHMARK_SAMPLE_CENSUS'
                }
              }
              Write-Output "F124AB_WING_VERIFIED=$($lane.DEV.controls.packed_1.paired)/48;$($lane.DEV.controls.packed_2.paired)/48;$($lane.DEV.controls.packed_3.paired)/48;fixed=$($lane.DEV.controls.strong_fixed.paired)/36"
            } else {
              Write-Output "F124AB_YGG_VERIFIED=soft=$($lane.DEV.controls.FIT_soft_head.paired)/48;Z=$($lane.DEV.controls.frozen_Z_exact_0_5.paired)/48;T=$($lane.DEV.controls.original_T.paired)/48;fixed=$($lane.DEV.controls.strong_fixed.paired)/36"
            }
          }
          $sha=(Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($output+'.sha256'),$sha+'  f124ab-fresh-soft-hamming-and-packed-pareto.json'+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          Write-Output "F124AB_RAW_RECEIPT_SHA256=$sha"
      - uses: actions/upload-artifact@v4
        with:
          name: f124ab-frozen-soft-hamming-packed-pareto-${{ github.sha }}
          path: |
            ${{ runner.temp }}/f124ab-fresh-soft-hamming-and-packed-pareto.json
            ${{ runner.temp }}/f124ab-fresh-soft-hamming-and-packed-pareto.json.sha256
          if-no-files-found: error
          retention-days: 90

  one-full-regression:
    needs: source-verified-independent-development
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: One exact-head Go full test race vet build and science isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
          echo "F124AB_FULL_SOURCE_HEAD=$GITHUB_SHA"
          echo "F124AB_SCIENCE_ACCEPTED=false"
