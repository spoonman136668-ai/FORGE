name: ITD-02 MG17 original MiniGrid family source-only qualification
on:
  push:
    branches: [research/itd02-mg17-minigrid-source-family-20261029]
permissions:
  contents: read
jobs:
  original-family-source-qualification-only:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Enforce original LF source on both hosts
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact research-only branch checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Frozen prereg, original ancestor, and bounded delta
        shell: pwsh
        run: |
          git merge-base --is-ancestor 79ee0e379ad4fb3b61a6b4668f41ee257594b152 $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'MG17_FOUR_STAGE_ANCESTOR_MISSING' }
          $expected = @(
            '.github/workflows/itd02-mg17-minigrid-family-source.yml'
            'research/lcrm01/mg17_original_family_source_prereg.json'
            'research/lcrm01/mg17_original_family_source_qual.py'
          )
          $actual = @(git diff --name-only 79ee0e379ad4fb3b61a6b4668f41ee257594b152 $env:GITHUB_SHA)
          if (@(Compare-Object $expected $actual).Count -ne 0) { throw 'MG17_UNEXPECTED_SCOPE' }
          if ((git hash-object research/lcrm01/mg17_original_family_source_prereg.json).Trim() -ne 'c79aa832decf04704387415e763fa4b7b6c84eb0') { throw 'MG17_PREREG_DRIFT' }
          if ((git hash-object research/lcrm01/mg17_original_family_source_qual.py).Trim() -ne 'ff4f7156c2563b172ed0401198050cb98def5c96') { throw 'MG17_PROBE_SOURCE_DRIFT' }
          Write-Host 'MG17_PREREG_PRECEDES_PROBE_SOURCE_PASS'
      - name: Frozen source Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch exact original Farama source and independently replay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'mg17'
          $src = Join-Path $root 'minigrid'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          git init -q $src
          if ($LASTEXITCODE -ne 0) { throw 'MG17_GIT_INIT_FAILED' }
          git -C $src remote add origin https://github.com/Farama-Foundation/Minigrid.git
          if ($LASTEXITCODE -ne 0) { throw 'MG17_GIT_REMOTE_FAILED' }
          git -C $src fetch --no-tags --depth 1 origin 7f5853792ea7f04f75614661006d87fcf949f26d
          if ($LASTEXITCODE -ne 0) { throw 'MG17_GIT_PIN_FETCH_FAILED' }
          git -C $src checkout --detach -q 7f5853792ea7f04f75614661006d87fcf949f26d
          if ($LASTEXITCODE -ne 0) { throw 'MG17_GIT_PIN_CHECKOUT_FAILED' }
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          if ($LASTEXITCODE -ne 0) { throw 'MG17_BOOTSTRAP_DEPENDENCY_FAILED' }
          python -m pip install 'numpy==1.26.4' 'gymnasium==1.1.1' 'pygame-ce==2.5.3'
          if ($LASTEXITCODE -ne 0) { throw 'MG17_SOURCE_DEPENDENCY_FAILED' }
          python -m pip install --no-deps -e $src
          if ($LASTEXITCODE -ne 0) { throw 'MG17_PINNED_SOURCE_INSTALL_FAILED' }
          python research/lcrm01/mg17_original_family_source_qual.py --source-root $src --output (Join-Path $root 'first.json')
          if ($LASTEXITCODE -ne 0) { throw 'MG17_FIRST_SOURCE_REPLAY_FAILED' }
          python research/lcrm01/mg17_original_family_source_qual.py --source-root $src --output (Join-Path $root 'second.json')
          if ($LASTEXITCODE -ne 0) { throw 'MG17_SECOND_SOURCE_REPLAY_FAILED' }
          python research/lcrm01/mg17_original_family_source_qual.py --compare (Join-Path $root 'first.json') (Join-Path $root 'second.json')
          if ($LASTEXITCODE -ne 0) { throw 'MG17_SOURCE_REPLAY_MISMATCH' }
          Write-Host 'MG17_ORIGINAL_UPSTREAM_FAMILY_SOURCE_ENGINEERING_PASS_NO_FIT_NO_SCIENCE'
      - name: Preserve qualified original public action traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mg17-original-minigrid-public-traces-${{ matrix.os }}
          path: ${{ runner.temp }}/mg17/*.json
          retention-days: 30
          if-no-files-found: warn
