name: F124-AJ frozen cross-family causal transfer and packed Wingless
on:
  push:
    branches: [research/f124aj-example-learned-causal-maps-20261018]
    paths:
      - 'reference/research-intake/f124aj-frozen-incontext-operator-learning.json'
      - 'nativeevidence/f124aj_*.py'
      - 'nativeevidence/test_f124aj_*.py'
      - '.github/workflows/forge-f124aj-operator-learning.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: f124aj-frozen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-source-focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: New family oracle separated, exact source lineage, original inference untouched
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if ($IsWindows) { 'python' } else { 'python3' }
          if ((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'F124AJ_EXACT_HEAD_DRIFT' }
          foreach ($pattern in @('test_f124aj_*.py','test_f124ai_*.py')) {
            & $py -B -m unittest discover -s nativeevidence -p $pattern -v
            if ($LASTEXITCODE -ne 0) { throw "F124AJ_FROZEN_SOURCE_FAILED_$pattern" }
          }
          & $py -B isolationguard/check.py
          if ($LASTEXITCODE -ne 0) { throw 'F124AJ_CROSS_PROJECT_ISOLATION_FAILED' }
          Write-Output 'F124AJ_PROTECTED_FIRST_USE=false'

