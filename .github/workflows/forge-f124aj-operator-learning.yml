          name: f124ae-immutable-long-transfer-development-b9438ec1f009af2b421713c468e0acddad63938d
          path: historical-ae
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39108391392
          github-token: ${{ github.token }}
          name: f124af-immutable-terminal-contrast-development-94108177a92e0dddb57475e1d408075f7ee63255
          path: historical-af
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39109432945
          github-token: ${{ github.token }}
          name: f124ag-immutable-internal-causal-discrimination-8a5687eba4a35aa46528b61f1050306ee628b4fe
          path: historical-ag
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39110523568
          github-token: ${{ github.token }}
          name: f124ah-new-semantic-transfer-observation-d56e95cb2383891250aad685bdb0842a141e4d30
          path: historical-ah
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39111523196
          github-token: ${{ github.token }}
          name: f124ai-compositional-train-holdout-7415fff61943dabc34d72decabd15f8c962848bb
          path: historical-ai
      - name: Authenticate sixteen historical scientific receipts, fit support count TRAIN only, qualify true unseen-map HOLDOUT
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sources=@(
            @{path='historical-o/f124o-independent-two-learned-development.json';sha='025c97abc8eb69079d7d7d0f59bfdb81235b9ad9ab83e230f32b542d2cfbdb5d'},
            @{path='historical-t/f124t-fresh-absolute-development.json';sha='a2f7b3641c2f84f684372918849170c97912c7a104fa4dbe264bcbd6d444c2d2'},
            @{path='historical-u/f124u-fresh-cell-and-readout-development.json';sha='63a2a57973444752d4002bc4718ec63de88a26ed05142627305de3a94fa9fb41'},
            @{path='historical-w/f124w-fresh-hop-survival-and-checksum.json';sha='122c0f1db5547a1ce2074c73c0b4b4d089c7f00eaf4573327676be3b7b521698'},
            @{path='historical-x/f124x-new-validation-and-runtime.json';sha='457f7be9312bd30b4ce052aed11edfd929fd02e715aa85ede7b9a58b2be355ba'},
            @{path='historical-y/f124y-fresh-budget-and-calibration.json';sha='13608eabec0d63103199f48cea0fdc861fe84ee64527007229d4bcf422d05353'},
            @{path='historical-z/f124z-fresh-sparse-and-public-continuity.json';sha='d6e19c5b9a572eefab5e0927a41abad6d34c3654c80605f7980b6e0908c3e44c'},
            @{path='historical-aa/f124aa-new-transfer-and-packed.json';sha='fda2f1dbf130062b347e0e46862fe409b5af2c95a98fd3ca97c0e8642ff7d034'},
            @{path='historical-ab/f124ab-fresh-soft-hamming-and-packed-pareto.json';sha='270202bae8773bd39c33116b0b365716bd23d53f2a92d7395f77d4a7baee67b9'},
            @{path='historical-ac/f124ac-fresh-depth-failure-and-packed-aliases.json';sha='1ab3f8228e6f361783abf9fd052d28d60462432511653978b8b3ce966d609dc7'},
            @{path='historical-ad/f124ad-fresh-evidence-anchor-and-fingerprint.json';sha='2a22462f0292f8fe23df3c5bae21bbd2e2a0e9c6e92f21d2f8179cd621c4de3f'},
            @{path='historical-ae/f124ae-frozen-13-15-and-one-state-readout.json';sha='3b7cce04a678601c503df588ee2f17de6a8116cfcd875347e0395f2632decc40'},
            @{path='historical-af/f124af-fresh-terminal-contrast-margin.json';sha='42c8c34a67f02efbfac26ab030ecb1db0361a335f25b0a0540442562d6aa9e3c'},
            @{path='historical-ag/f124ag-original-13-causal-hop-development.json';sha='eaf00275cdf010414c95caac0243622bf5bc9a419d9ae5cfa30b4df2d54b4d3d'},
            @{path='historical-ah/f124ah-fresh-alternative-public-rule.json';sha='fc5e3b4581982d271d8bd87229796addb6c3a579e024463efeb8bb2ffc34abce'},
            @{path='historical-ai/f124ai-compositional-trained-heldout-public-relations.json';sha='7f129ca575dcb6c546150d1019dd32c786c0df8c7be372162e75d48335eb1449'}
          )
          foreach ($p in $sources) {
            if ((Get-FileHash -LiteralPath $p.path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $p.sha) {
              throw 'F124AJ_AUTHENTIC_HISTORICAL_SOURCE_SHA_MISMATCH'
            }
          }
          $out=Join-Path $env:RUNNER_TEMP 'f124aj-example-conditioned-unseen-relations.json'
          & python3 -B nativeevidence/f124aj_development_evidence.py --o $sources[0].path --t $sources[1].path --u $sources[2].path --w $sources[3].path --x $sources[4].path --y $sources[5].path --z $sources[6].path --aa $sources[7].path --ab $sources[8].path --ac $sources[9].path --ad $sources[10].path --ae $sources[11].path --af $sources[12].path --ag $sources[13].path --ah $sources[14].path --ai $sources[15].path --output $out
          if ($LASTEXITCODE -ne 0) { throw 'F124AJ_FROZEN_TRAIN_OR_HOLDOUT_FAILED' }
          $r=Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($r.schema -cne 'forge.research.f124aj.authentic-incontext-operator-induction.v1' -or
              $r.freeze_git_blob -cne 'c6f370fe58c3a4aec38ddc45bfad2d65f6b7f17f' -or
              $r.original_AI_raw_sha256 -cne '7f129ca575dcb6c546150d1019dd32c786c0df8c7be372162e75d48335eb1449' -or
              $r.lanes.Count -ne 2 -or -not $r.support_fit_only_TRAIN -or
              -not $r.HOLDOUT_operators_new_structural_families -or
              -not $r.never_fit_on_HOLDOUT_labels -or
              -not $r.inductive_bias_limited_to_bit_permutation_XOR -or
              -not $r.no_handcoded_operator_classifier -or
              $r.protected_first_use -or $r.independent_science_acceptance -or
              $r.optimizer_promotion -or $r.production -or
              $r.accepted_ref_mutations -ne 0 -or $r.additional_retained_memory -or
              $r.matched_hardware_superiority -or $r.TRAIN_grid.Count -ne 4) {
            throw 'F124AJ_UNQUALIFIED_SCIENCE_OR_AUTHORITY_RECEIPT'
          }
          foreach ($lane in $r.lanes) {
            foreach ($cohort in @($lane.TRAIN,$lane.HOLDOUT)) {
              if ($cohort.pairs -ne 48 -or
                  $cohort.observations.positive_oracle_valid -ne 48 -or
                  $cohort.observations.negative_oracle_invalid -ne 48 -or
                  $cohort.observations.literal_untransformed_positive_paths -ne 0 -or
                  -not $cohort.observations.no_test_label_based_fit -or
                  -not $cohort.observations.semantic_labels_absent_from_public_roles) {
                throw 'F124AJ_NOT_ACTUALLY_CHANGED_CAUSAL_RELATIONS'
              }
              foreach ($arm in $cohort.arms.PSObject.Properties) {
                $n=if ($arm.Name -ceq 'strong_fixed_normalized_supported') {24} else {48}
                if ($arm.Value.pairs -ne $n -or
                    $arm.Value.unsupported -ne (48-$n) -or
                    $arm.Value.case_sha256.Count -ne $n -or
                    $arm.Value.max_retained -gt 9 -or
                    ($lane.lane -ceq 'Yggdrasil' -and $arm.Value.max_active -gt 7) -or
                    ($lane.lane -ceq 'Wingless' -and $arm.Name -ceq 'example_one_packed' -and
                     ($arm.Value.max_active -gt 64 -or
                      $arm.Value.max_states_per_node -ne 1 -or
                      $arm.Value.max_packed_bits_per_state -ne 12))) {
                  throw 'F124AJ_HARD_ORIGINAL_CAPACITY_OR_DENOMINATOR'
                }
                foreach ($fam in $arm.Value.by_family.PSObject.Properties) {
                  if (($fam.Value.pairs+$fam.Value.unsupported) -ne 12) {
                    throw 'F124AJ_ONE_SCIENTIFIC_FAMILY_MISSING'
                  }
                }
              }
              if ($lane.lane -ceq 'Wingless') {
                $diag=$cohort.observations.packed_one_state
                if ($diag.positive_cases -ne 48 -or
                    $diag.positive_digests.Count -ne 48 -or
                    ($diag.final_proxy_present+$diag.final_proxy_absent) -ne 48) {
                  throw 'F124AJ_PACKED_CANDIDATE_SURVIVAL_NOT_QUALIFIED'
                }
              }
            }
            if ($lane.lane -ceq 'Wingless') {
              if ($lane.benchmark.matched_hardware_superiority_claim -or
                  -not $lane.benchmark.measured_learning_plus_model_not_oracle_diagnostics -or
                  @($lane.benchmark.arms.PSObject.Properties).Count -ne 3) {
                throw 'F124AJ_FALSE_RUNTIME_SUPERIORITY'
              }
              foreach ($b in $lane.benchmark.arms.PSObject.Properties) {
                if ($b.Value.graphs -ne 24 -or $b.Value.timed_calls -ne 72 -or
                    $b.Value.p50_ns -le 0 -or $b.Value.p50_peak_python_bytes -le 0) {
                  throw 'F124AJ_INCOMPLETE_MEASURED_MODEL_RESOURCE_COST'
                }
              }
              Write-Output "F124AJ_WING_HOLDOUT=learned_one:$($lane.HOLDOUT.arms.example_one_packed.correct_pairs)/48;original:$($lane.HOLDOUT.arms.raw_original_one.correct_pairs)/48;demos:$($r.selected_demo_count.demos)"
            } else {
              Write-Output "F124AJ_YGG_HOLDOUT=learned:$($lane.HOLDOUT.arms.TRAIN_selected_demonstrations.correct_pairs)/48;original:$($lane.HOLDOUT.arms.original_AG_without_examples.correct_pairs)/48;demos:$($r.selected_demo_count.demos)"
            }
          }
          $hash=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($out+'.sha256'),$hash+'  f124aj-example-conditioned-unseen-relations.json'+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          Write-Output "F124AJ_RAW_SHA256=$hash"
      - uses: actions/upload-artifact@v4
        with:
          name: f124aj-learned-support-holdout-${{ github.sha }}
          path: |
            ${{ runner.temp }}/f124aj-example-conditioned-unseen-relations.json
            ${{ runner.temp }}/f124aj-example-conditioned-unseen-relations.json.sha256
          if-no-files-found: error
          retention-days: 90

  one-full-regression:
    needs: source-verified-independent-development
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: One exact-head Go full test race vet build and science isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
          echo "F124AJ_FULL_SOURCE_HEAD=$GITHUB_SHA"
          echo "F124AJ_SCIENCE_ACCEPTED=false"
