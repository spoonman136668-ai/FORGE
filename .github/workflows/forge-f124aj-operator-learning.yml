            @{id='39109432945';head='8a5687eba4a35aa46528b61f1050306ee628b4fe';artifact='12130290248';digest='sha256:b07abec5e1f6893ba7e08a120463afb12ebd9c46c7d174e2e4ecbed2746375c4'},
            @{id='39110523568';head='d56e95cb2383891250aad685bdb0842a141e4d30';artifact='12129728424';digest='sha256:dd119c571c9d7fe535efb5d89af6a00879f9b9dbae305b1ea5cd28af6b983d8d'},
            @{id='39111523196';head='7415fff61943dabc34d72decabd15f8c962848bb';artifact='12129874376';digest='sha256:7886645f3d1c0e999d3cba503c2a45929b571528e7b51f8dab5c8d28cb10dc99'}
          )
          foreach ($p in $sources) {
            $run=(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($p.id)" | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne $p.head -or
                $run.status -cne 'completed' -or $run.conclusion -cne 'success' -or
                $run.event -cne 'push') { throw 'F124AJ_ORIGINAL_PROVIDER_RUN_IDENTITY' }
            $index=(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($p.id)/artifacts" | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0) { throw 'F124AJ_ORIGINAL_ARTIFACT_INDEX' }
            $found=@($index.artifacts | Where-Object { "$($_.id)" -ceq $p.artifact })
            if ($found.Count -ne 1 -or $found[0].digest -cne $p.digest -or $found[0].expired) {
              throw 'F124AJ_ORIGINAL_PROVIDER_ARTIFACT'
            }
          }
          Write-Output 'F124AJ_SOURCE_AUTHENTICITY=PASS'
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39078269441
          github-token: ${{ github.token }}
          name: f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d
          path: historical-o
      - uses: actions/download-artifact@v4
        with:
