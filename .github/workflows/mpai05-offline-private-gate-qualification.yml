name: MP-AI05 exact pinned offline private gate qualification
on:
  push:
    branches: [qualification/mpai05-offline-private-proof-20261027]
    paths:
      - '.github/workflows/mpai05-offline-private-gate-qualification.yml'
permissions:
  contents: read
concurrency:
  group: mpai05-offline-private-gate
  cancel-in-progress: false
jobs:
  isolated-qualify:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 40
    steps:
      - name: Frozen private-source focused tests and one final Windows regression
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_CREDENTIAL_INTERACTIVE: 'never'
          PYTHONDONTWRITEBYTECODE: '1'
          # UQ51 existing synthetic test requires Windows Git long-path support.
          # Environment is isolated to this GitHub Actions job and child Git only.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'core.longpaths'
          GIT_CONFIG_VALUE_0: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') {
            throw 'MPAI05_RUNNER_IDENTITY_UNAUTHORIZED'
          }
          $expected = 'b32c6bc91c27a77fe12ade75b984c94815402cf7'
          $tree = '5fcb6a63ba0cd87d96a7f5ca9ed109c53e9b2204'
          $branch = 'proposal/mpai05-paired-answer-offline-gate-20261027'
          $scratch = Join-Path $env:RUNNER_TEMP ('mpai05-paired-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          $source = Join-Path $scratch 'source'
          $phase = 'clone'
          try {
            New-Item -ItemType Directory -Path $scratch -ErrorAction Stop | Out-Null
            & git clone --quiet --single-branch --branch $branch 'https://github.com/spoonman136668-ai/Mind-Palace.git' $source *> (Join-Path $scratch 'private-clone.log')
            if ($LASTEXITCODE -ne 0) { throw 'MPAI05_PRIVATE_SOURCE_UNAVAILABLE' }
            $actual = (& git -C $source rev-parse HEAD).Trim()
            $actualTree = (& git -C $source rev-parse 'HEAD^{tree}').Trim()
            if ($actual -cne $expected -or $actualTree -cne $tree) { throw 'MPAI05_SOURCE_IDENTITY_DRIFT' }
            $blobA = (& git -C $source rev-parse 'HEAD:tools/mpai05_paired_gate.py').Trim()
            $blobB = (& git -C $source rev-parse 'HEAD:tests/test_mpai05_paired_gate.py').Trim()
            if ($blobA -cne '3fe4c004c78b7fb8342966380c258e5c644358e2' -or
                $blobB -cne 'db7cefe489a94634e1ef9bf139131fb733fef51a') {
              throw 'MPAI05_FOCUSED_SOURCE_BLOB_DRIFT'
            }
            # The UQ51 synthetic fixture uses an immutable historical commit ancestor.
            # A shallow clone cannot establish that ancestral identity.
            & git -C $source merge-base --is-ancestor '90d2dc1e79f0fcdcf49fba7680e29b5760e80d6b' HEAD
            if ($LASTEXITCODE -ne 0) { throw 'MPAI05_FROZEN_TEST_ANCESTRY_UNAVAILABLE' }
            $clean = @(& git -C $source status --porcelain --untracked-files=all)
            if ($LASTEXITCODE -ne 0 -or $clean.Count -gt 0) { throw 'MPAI05_WORKSPACE_DIRTY_PRE' }
            Write-Host ('MPAI05_SOURCE_COMMIT=' + $actual)
            Write-Host ('MPAI05_SOURCE_TREE=' + $actualTree)
            Push-Location $source
            try {
              $phase = 'focused'
              & python -B -m unittest discover -s tests -p test_mpai05_paired_gate.py -v *> (Join-Path $scratch 'private-focused.log')
              if ($LASTEXITCODE -ne 0) { throw 'MPAI05_FOCUSED_TESTS_FAILED' }
              Write-Host 'MPAI05_FOCUSED_TESTS=PASS'
              $phase = 'store'
              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\mind.ps1 validate *> (Join-Path $scratch 'private-store.log')
              if ($LASTEXITCODE -ne 0) { throw 'MPAI05_STORE_VALIDATION_FAILED' }
              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\archive.ps1 validate *> (Join-Path $scratch 'private-archive.log')
              if ($LASTEXITCODE -ne 0) { throw 'MPAI05_ARCHIVE_VALIDATION_FAILED' }
              Write-Host 'MPAI05_DURABLE_STORE_VALIDATE=PASS'
              Write-Host 'MPAI05_FULL_REGRESSION_PS_HOST=POWERSHELL_7'
              $phase = 'full'
              & pwsh.exe -NoProfile -NonInteractive -File tests\Test-All.ps1 *> (Join-Path $scratch 'private-full.log')
              if ($LASTEXITCODE -ne 0) {
                $failureLog = @(Get-Content -LiteralPath (Join-Path $scratch 'private-full.log') -ErrorAction SilentlyContinue)
                $runTests = @($failureLog | Where-Object { $_ -match '^RUN Test-[A-Za-z0-9_-]+\.ps1\s*$' })
                $safeLast = 'NONE'
                if ($runTests.Count -gt 0) {
                  $safeLast = ([string]$runTests[$runTests.Count - 1]).Trim().Substring(4)
                }
                Write-Host ('MPAI05_FULL_TEST_START_COUNT=' + $runTests.Count)
                Write-Host ('MPAI05_FULL_LAST_TEST=' + $safeLast)
                $safeClass = 'UNCLASSIFIED'
                $joined = ($failureLog -join [char]10)
                if ($joined -match 'Assertion|assert failed') { $safeClass = 'ASSERTION' }
                elseif ($joined -match 'Access is denied|UnauthorizedAccess') { $safeClass = 'ACCESS' }
                elseif ($joined -match 'not recognized as the name of') { $safeClass = 'COMMAND_NOT_FOUND' }
                elseif ($joined -match 'Cannot find path|PathNotFound') { $safeClass = 'PATH_NOT_FOUND' }
                elseif ($joined -match 'ParserError|Unexpected token') { $safeClass = 'PARSER_ERROR' }
                elseif ($joined -match 'cannot be found that matches parameter') { $safeClass = 'PARAMETER_MISMATCH' }
                elseif ($joined -match 'throw ') { $safeClass = 'THROWN_GATE' }
                Write-Host ('MPAI05_FULL_FAILURE_CLASS=' + $safeClass)
                throw 'MPAI05_ONE_FULL_REGRESSION_FAILED'
              }
              Write-Host 'MPAI05_FINAL_WINDOWS_REGRESSION=PASS'
            } finally {
              Pop-Location
            }
            $clean = @(& git -C $source status --porcelain --untracked-files=all)
            if ($LASTEXITCODE -ne 0 -or $clean.Count -gt 0) { throw 'MPAI05_WORKSPACE_DIRTY_POST' }
            Write-Host 'MPAI05_SOURCE_CUSTODY=PASS'
            Write-Host 'MPAI05_MODEL_ANSWER_IMPACT=NOT_TESTED'
            Write-Host 'MPAI05_PRIVATE_DATA_IN_PUBLIC_LOGS=FALSE'
            Write-Host 'MPAI05_PROMOTION=NOT_AUTHORIZED'
          } catch {
            Write-Host ('MPAI05_QUALIFICATION_PHASE=' + $phase)
            throw 'MPAI05_QUALIFICATION_NOT_PASSED'
          } finally {
            Set-Location $env:RUNNER_TEMP
            if (Test-Path -LiteralPath $scratch) {
              Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction Stop
            }
          }
