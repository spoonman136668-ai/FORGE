name: ITD-02 MG12 original post-door source credit and 2-step conventional audit
on:
  push:
    branches: [research/itd02-mg12-postdoor-credit-20261029]
permissions:
  contents: read
jobs:
  original-doorkey-equal-public-stage-free-native-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Preserve original source LF and strict git object hashes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Perform two independent complete genuine Farama DoorKey reproductions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash research/lcrm01/mg12_ci.sh
      - name: Retain full original public selected feedback, negative and positive, independent processes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-mg12-original-farama-stage-free-native-continuity-vs-controls
          path: |
            ${{ runner.temp }}/mg12/first.json
            ${{ runner.temp }}/mg12/second.json
            ${{ runner.temp }}/mg12/comparison.json
            ${{ runner.temp }}/mg12/first.log
            ${{ runner.temp }}/mg12/second.log
          retention-days: 30
          if-no-files-found: warn
