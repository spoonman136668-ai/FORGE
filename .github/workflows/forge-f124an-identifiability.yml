name: F124-AN source-born identifiability and calibrated abstention
on:
  push:
    branches: [research/f124an-identifiability-abstention-20261018]
permissions: {contents: read, actions: read}
concurrency:
  group: f124an-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze-and-indistinguishable-source:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: All-new public source, identical opposite-latent worlds and original sixteen cell controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if ($IsWindows) {'python'} else {'python3'}
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'F124AN_UNQUALIFIED_HEAD' }
          & $py -B -m unittest discover -s nativeevidence -p 'test_f124an_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F124AN_SOURCE_OR_ABSTENTION_ADMISSION' }
          & $py -B isolationguard/check.py
          if ($LASTEXITCODE -ne 0) { throw 'F124AN_ORIGINAL_FORGE_ISOLATION_FAIL' }
          Write-Output 'F124AN_PROTECTED_FIRST_USE=false'
  FIT-learned-abstention:
    needs: freeze-and-indistinguishable-source
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: FIT-only 3-class calibration, require zero forced ambiguity and positive plus negative coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 -B nativeevidence/f124an_identifiability.py --output "$RUNNER_TEMP/f124an-fit.json"
          python3 - "$RUNNER_TEMP/f124an-fit.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["schema"]=="forge.research.f124an.FIT-observable-abstention.v1"
          assert x["freeze_blob"]=="f204c96dc1adc6458d72df574d1e3baeabc03c18"
          assert x["FIT_only_training"] and x["no_DEV_training_or_threshold_selection"]
          assert x["training"]["FIT_samples"]==432
          assert x["training"]["trainable_weights"]==15
          assert x["training"]["epochs"]==160
          assert x["global_model_params"]==16
          assert x["training"]["weight_displacement_L2"]>0
          assert x["original_7_active_9_retained"]
          assert not x["protected_first_use"] and not x["independent_accepted_science"]
          assert len(x["FIT_curve"])==7
          for stage in ("DEV_learned","DEV_untrained","DEV_fixed"):
              for fam in ("near_mask","distant_mask","role_repeat_mask"):
                  a=x[stage][fam]
                  assert len(a["cases"])==48
                  assert all(v["triplets"]==16 for v in a["by_depth"].values())
                  assert all(r["opposite_latent_worlds_public_identical"] for r in a["cases"])
          PY
          sha256sum "$RUNNER_TEMP/f124an-fit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: f124an-FIT-frozen-calibration-and-complete-DEV-${{ github.sha }}
          path: ${{ runner.temp }}/f124an-fit.json
          retention-days: 90
          if-no-files-found: error
  physical-total-cost:
    needs: FIT-learned-abstention
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: f124an-FIT-frozen-calibration-and-complete-DEV-${{ github.sha }}
          path: fit
      - name: Same 96 exact public inputs three fresh runs per arm, actual RSS CPU time heap state bytes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if ($IsWindows) {'python'} else {'python3'}
          $env:PYTHONHASHSEED='0'
          $out=Join-Path $env:RUNNER_TEMP "f124an-cost-${{ matrix.os }}.json"
          & $py -B nativeevidence/f124an_physical.py --bench --trained-receipt fit/f124an-fit.json --output $out
          if ($LASTEXITCODE -ne 0) { throw 'F124AN_MEASURED_COST_FAIL' }
          $d=Get-Content $out -Raw | ConvertFrom-Json
          if ($d.schema -cne 'forge.research.f124an.same-host-full-physical.v1' -or
              $d.freeze_blob -cne 'f204c96dc1adc6458d72df574d1e3baeabc03c18' -or
              $d.raw.Count -ne 9 -or $d.original_cell_cap -ne 16 -or
              -not $d.new_global_params_counted -or -not $d.packed_score_integer_bytes_tracked -or
              $d.protected_first_use -or $d.independent_science_accepted) {
            throw 'F124AN_RESOURCE_IDENTITY'
          }
          foreach ($arm in @('fixed_triage','trained_abstain','untrained_abstain')) {
            $r=$d.summary.$arm
            if ($r.repetitions -ne 3 -or $r.median_wall_ns -le 0 -or
                $r.median_CPU_ns -le 0 -or $r.median_process_peak_RSS_bytes -le 0 -or
                $r.max_original_cells -gt 16) { throw 'F124AN_RESOURCE_MISSING_OR_OVER_CAP' }
            Write-Output "F124AN_COST_$($arm):wall_ns=$($r.median_wall_ns):RSS=$($r.median_process_peak_RSS_bytes):CPU_ns=$($r.median_CPU_ns):HEAP=$($r.median_Python_heap_peak_bytes)"
          }
          Write-Output "F124AN_RESOURCE_SHA256=$((Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant())"
      - uses: actions/upload-artifact@v4
        with:
          name: f124an-real-physical-cost-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/f124an-cost-${{ matrix.os }}.json
          retention-days: 90
          if-no-files-found: error
  one-full-original-Go-regression:
    needs: [FIT-learned-abstention, physical-total-cost]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env: {GOMAXPROCS: '2', GOFLAGS: '-p=2', GOMEMLIMIT: '1536MiB'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - name: Exactly one full Go test race vet build with source isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
          echo "F124AN_EXACT_QUALIFIED_HEAD=$GITHUB_SHA"
          echo 'F124AN_PROTECTED_FIRST_USE=false'
