name: Yggdrasil F139 public-cell foundation exact-source full regression
on:
  push:
    branches:
      - qualification/f139-public-cell-foundation-20261028
    paths:
      - '.github/workflows/qualify-ygg-f139-public-foundation-20261028.yml'
permissions:
  contents: read
concurrency:
  group: ygg-f139-public-foundation-source-20261028
  cancel-in-progress: false
jobs:
  source-bound-native-regression:
    name: qualified native full regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_CANDIDATE: e36bef1222c6f3e30fb7d7184af96343671b9263
      EXPECTED_BASE: 14275a69ee553d2ed17c4a9e551d2486454d58f3
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable platform newline translation for immutable source identity
        run: git config --global core.autocrlf false
      - name: Checkout exact public Yggdrasil development candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/Yggdrasil
          ref: e36bef1222c6f3e30fb7d7184af96343671b9263
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.11 fixed toolchain
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Authenticate exact commit, ancestry, two unchanged Git blobs, five-file scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD:yggdrasil/public_causal_cells.py)" = f2fda603fbed965a3b4e7cc28844b2246bf8ac2b
          test "$(git rev-parse HEAD:tests/test_native_cells.py)" = 5ca2b224650253f43d3a5d3e44381b888857ae98
          expected="$(printf '%s\n' '.ice/code-atlas.html' '.ice/code-atlas.ice' '.ice/code-atlas.json' 'tests/test_native_cells.py' 'yggdrasil/public_causal_cells.py')"
          test "$(git diff --name-only "$EXPECTED_BASE" HEAD)" = "$expected"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo YGG_F139_SOURCE_AND_PROVENANCE_EXACT=PASS
      - name: Focused original public-cell behavior, retention and adversarial checks
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_native_cells.py' -v
          echo YGG_F139_FOCUSED_NATIVE=PASS
      - name: Affected code atlas and checkpoint interfaces
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v
          python -B -m unittest discover -s tests -p 'test_portable_checkpoint.py' -v
          echo YGG_F139_AFFECTED_INTERFACES=PASS
      - name: Exactly one final OS-appropriate original full integration regression
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            python -B -m unittest discover -s tests -p 'test_*.py' -v
            echo YGG_F139_LINUX_FULL_REGRESSION=PASS
          else
            python -B - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          tests = sorted(p.name for p in Path('tests').glob('test_*.py') if p.name != 'test_free_fanout_sidecar.py')
          assert tests, 'NO_SUPPORTED_WINDOWS_TESTS'
          print('YGG_WINDOWS_TEST_DISCOVERY=' + ','.join(tests), flush=True)
          for name in tests:
              subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-p', name, '-v'], check=True)
          print('YGG_F139_WINDOWS_SUPPORTED_FULL_REGRESSION=PASS', flush=True)
          print('YGG_F139_WINDOWS_POSIX_RESOURCE_SUITE=NOT_RUN_UNSUPPORTED', flush=True)
          PY
          fi
      - name: Compilation, unchanged checkout and explicit authority fence
        run: |
          set -euo pipefail
          python -B -c "from pathlib import Path; [compile(p.read_bytes(),str(p),'exec') for p in [Path('yggdrasil/public_causal_cells.py'),Path('tests/test_native_cells.py')]]"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo YGG_F139_SOURCE_CLEAN_AND_COMPILES=PASS
          echo YGG_F139_SCIENTIFIC_FIRST_USE=FALSE
          echo YGG_F139_ACCEPTED_REF_MUTATIONS=0
          echo YGG_F139_PROVIDER_MODEL_CALLS=0
          echo YGG_F139_NO_CONTROLLER_OR_QUEUE_ACTION=TRUE
