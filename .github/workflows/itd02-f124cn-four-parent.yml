name: ITD02 F124CN learned four-parent development-only qualification
on:
  push:
    branches: [research/itd02-f124cn-learned-four-parent-20261025]
permissions:
  contents: read
jobs:
  learned-dev:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Pinned source / frozen-before-code identity and real public training
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          git merge-base --is-ancestor 2f66c7202212aab5682aa41b8cf3523052f36fed HEAD
          if ($LASTEXITCODE -ne 0) { throw "F124CN_PARENT_SOURCE_IDENTITY_DRIFT" }
          $refs=@{
            "research/north-star-transfer/f124cn/FROZEN_PROTOCOL.json"="6455fe858915cdcd1c95ae0c99791b41eac58fb1"
            "research/north-star-transfer/f124cj_internal_source.py"="4e7bbd8f93dab1c7242a9374c75731302b034f31"
            "research/north-star-transfer/f124cb_dual_link_learner.py"="8a10bf8cec12afc7d8703e3586d8eba91ebfdc7c"
            "research/north-star-transfer/f124cc_trained_two_link_control.py"="29c0c02f54ea539bed0910fe82adcc86d3aff94d"
            "research/north-star-transfer/f124cm/FROZEN_PROTOCOL.json"="9a5d4315b4de9956942be910fde6ac54b5147377"
          }
          foreach($key in $refs.Keys){
            if ((git hash-object $key).Trim() -cne $refs[$key]) { throw "F124CN_FROZEN_SOURCE_DRIFT $key" }
          }
          $env:PYTHONDONTWRITEBYTECODE="1"
          $env:PYTHONNOUSERSITE="1"
          python -B -m unittest discover -s research/north-star-transfer/f124cn -p test_learn.py -v
          if ($LASTEXITCODE -ne 0) { throw "F124CN_FOCUSED_TESTS_FAILED" }
          python -B research/north-star-transfer/f124cn/run.py --report "$env:RUNNER_TEMP/f124cn-1.json" --resource "$env:RUNNER_TEMP/f124cn-resource-1.json"
          if ($LASTEXITCODE -ne 0) { throw "F124CN_REAL_LEARNING_FAILED" }
          python -B research/north-star-transfer/f124cn/run.py --report "$env:RUNNER_TEMP/f124cn-2.json" --resource "$env:RUNNER_TEMP/f124cn-resource-2.json"
          if ($LASTEXITCODE -ne 0) { throw "F124CN_INDEPENDENT_EXECUTION_FAILED" }
          if (-not ((Get-FileHash "$env:RUNNER_TEMP/f124cn-1.json" -Algorithm SHA256).Hash -ceq (Get-FileHash "$env:RUNNER_TEMP/f124cn-2.json" -Algorithm SHA256).Hash)) { throw "F124CN_SCIENCE_REPORT_DRIFT" }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "F124CN_WORKTREE_DIRTY" }
          Write-Output "F124CN_SOURCE_ONLY_TRAINED_E2_AND_CONVENTIONAL=PASS"
          Write-Output "F124CN_ORIGINAL_FIRST_USE=ZERO"
          Write-Output "F124CN_NO_NATIVE_ADVANTAGE_CLAIM=TRUE"
  one-final-go-regression:
    needs: [learned-dev]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOFLAGS: "-p=2"
      GOMAXPROCS: "2"
      GOMEMLIMIT: "1536MiB"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Exact-head final Go regression vet build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          git diff --exit-code
          echo 'F124CN_FULL_GO_REGRESSION=PASS'
