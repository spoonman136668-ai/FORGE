name: Mass K4X native source-curriculum intervention on new worlds
on:
  push:
    branches: [research/mass-lcrm01-k4x-experience-curriculum-20261024]
permissions:
  contents: read
jobs:
  genuine-prospective-native-source-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Original frozen native learning with public random and BFS demonstration FIT
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash research/lcrm01/k4x_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-k4x-original-native-curriculum-and-full-traces
          path: |
            ${{ runner.temp }}/k4x/process-a.json
            ${{ runner.temp }}/k4x/process-b.json
            ${{ runner.temp }}/k4x/comparison.json
            ${{ runner.temp }}/k4x/process-a.log
            ${{ runner.temp }}/k4x/process-b.log
          if-no-files-found: warn
          retention-days: 90
