name: ITD-02 MG05 real DoorKey native only and capped public assistance vs conventional
on:
  push:
    branches:
      - research/itd02-mg05-native-only-capped-assistance-20261028
permissions:
  contents: read
jobs:
  native-only-and-bounded-assistance-original-doorkey:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Git original-source Unix newlines
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact-source checkout without retained Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Python 3.11 pinned Original DoorKey toolchain
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original native Wingless Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Run authentic native-only and capped collector trials with two full original-source reproductions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash research/lcrm01/mg05_ci.sh
      - name: Retain independent original-world source evidence, negative outcomes and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-mg05-original-doorkey-native-only-capped-32-64
          path: |
            ${{ runner.temp }}/mg05/first.json
            ${{ runner.temp }}/mg05/second.json
            ${{ runner.temp }}/mg05/comparison.json
            ${{ runner.temp }}/mg05/first.log
            ${{ runner.temp }}/mg05/second.log
          retention-days: 30
          if-no-files-found: warn
