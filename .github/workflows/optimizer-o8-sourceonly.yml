name: Optimizer O8 learned delayed predictive memory qualification

on:
  push:
    branches: [research/optimizer-o8-delayed-predictive-memory-20261023]
    paths:
      - '.github/workflows/optimizer-o8-sourceonly.yml'
      - 'research/optimizer_o8/**'

permissions:
  contents: read

concurrency:
  group: optimizer-o8-sourceonly
  cancel-in-progress: false

jobs:
  native-public-development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact FORGE parent and frozen O8 protocol before any experiment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = 'fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5'
          $ancestor = (& git merge-base $parent HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ancestor -cne $parent) { throw 'O8_PARENT_IDENTITY_DRIFT' }
          $expected = @(
            '.github/workflows/optimizer-o8-sourceonly.yml',
            'research/optimizer_o8/O8_FROZEN_PROTOCOL.json',
            'research/optimizer_o8/public_source.py',
            'research/optimizer_o8/recurrent_memory.py',
            'research/optimizer_o8/public_controls.py',
            'research/optimizer_o8/runner.py',
            'research/optimizer_o8/test_memory.py'
          )
          $actual = @(& git diff --name-only $parent HEAD)
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne $expected.Count -or
              (Compare-Object $actual $expected)) { throw 'O8_BOUNDED_DELTA_DRIFT' }
          $p = 'research/optimizer_o8/O8_FROZEN_PROTOCOL.json'
          $frozenSha = '62fb9c6d1fbb8d5c31d7f6d34440d0152049f5aa'
          $headSha = (& git rev-parse ('HEAD:' + $p)).Trim()
          $diskSha = (& git hash-object --no-filters -- $p).Trim()
          if ($headSha -cne $frozenSha -or $diskSha -cne $frozenSha) {
            throw 'O8_PREREG_BLOB_IDENTITY_DRIFT'
          }
          Write-Host 'O8_SOURCE_AND_FROZEN_BUDGET=PASS'
      - name: Eleven public-only adversarial memory tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s research/optimizer_o8 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'O8_FOCUSED_MEMORY_TEST_FAILED' }
          Write-Host 'O8_FOCUSED_TESTS=PASS'
      - name: Public delayed recall and action-parity fully trained comparisons
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B research/optimizer_o8/runner.py
          if ($LASTEXITCODE -ne 0) { throw 'O8_PUBLIC_TRAIN_SELECT_DEV_FAILURE' }
          Write-Host 'O8_EIGHT_ARM_PUBLIC_DEV_RECEIPT=EMITTED'
          Write-Host 'O8_FIRST_PROTECTED_SCIENTIFIC_USE=NONE'
          Write-Host 'O8_WINGLESS_YGGDRASIL_PROMOTION=NONE'
      - name: Single full FORGE Go test vet build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo O8_FINAL_GO_REGRESSION=PASS
      - name: No side effects or dirty worktree
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(& git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) { throw 'O8_UNEXPECTED_WORKTREE_DIRT' }
          Write-Host 'O8_SOURCEONLY_NO_DISPATCH=PASS'
