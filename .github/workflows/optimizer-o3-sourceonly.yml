name: Optimizer O3 public predictive-state native qualification

on:
  push:
    branches: [research/optimizer-o3-predictive-state-20261023]
    paths:
      - '.github/workflows/optimizer-o3-sourceonly.yml'
      - 'research/optimizer_o3/**'

permissions:
  contents: read

concurrency:
  group: optimizer-o3-sourceonly
  cancel-in-progress: false

jobs:
  native-public-development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 15
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact parent and frozen-prereg additive scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '00f33f56139f792a65cd193200706d13f93fe0b3'
          $ancestor = (& git merge-base $base HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ancestor -cne $base) { throw 'O3_SOURCE_PARENT_DRIFT' }
          $expected = @(
            '.github/workflows/optimizer-o3-sourceonly.yml',
            'research/optimizer_o3/O3_FROZEN_PUBLIC_PROTOCOL.json',
            'research/optimizer_o3/public_source.py',
            'research/optimizer_o3/learners.py',
            'research/optimizer_o3/public_dev_runner.py',
            'research/optimizer_o3/test_public_predictive_state.py'
          )
          $actual = @(& git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne $expected.Count -or
              (Compare-Object $expected $actual)) { throw 'O3_DELTA_SCOPE_DRIFT' }
          $p = 'research/optimizer_o3/O3_FROZEN_PUBLIC_PROTOCOL.json'
          $expectedBlob = 'd8314b2bf604c26b6b3ebb4fd6d21729644ddb0f'
          $gitBlob = (& git rev-parse ('HEAD:' + $p)).Trim()
          $diskBlob = (& git hash-object --no-filters -- $p).Trim()
          if ($gitBlob -cne $expectedBlob -or $diskBlob -cne $expectedBlob) {
            throw 'O3_FROZEN_PREREG_DRIFT'
          }
          Write-Host 'O3_QUALIFIED_BASE_AND_PROTOCOL=PASS'
      - name: Seven adversarial source isolation and fitted-control tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s research/optimizer_o3 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'O3_TEST_FAILURE' }
          Write-Host 'O3_SOURCE_AND_LEARNER_TESTS=PASS'
      - name: All-family genuine fitted public development, no scientific cohort
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B research/optimizer_o3/public_dev_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'O3_PUBLIC_FIT_DEV_FAILURE' }
          Write-Host 'O3_PUBLIC_DEVELOPMENT=COMPLETE'
          Write-Host 'O3_PROTECTED_FIRST_USE=NONE'
          Write-Host 'O3_FSA_ADMISSION=NONE'
          Write-Host 'O3_SCIENTIFIC_GO=NOT_EVALUATED'
      - name: One final Go regression vet and build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo O3_FINAL_GO_REGRESSION=PASS
      - name: Worktree remains clean
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(& git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) { throw 'O3_WORKTREE_DIRTY' }
          Write-Host 'O3_NO_DISPATCH_OR_SOURCE_MUTATION=PASS'
