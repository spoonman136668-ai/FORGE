name: F139 one-time original-owner autonomy recovery V8
# Only exact owner-authored #807 command; original single Windows task and SQLite.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: f139-original-owner-v8-one-time-recovery
  cancel-in-progress: false
jobs:
  recover-original:
    if: ${{ github.actor == 'spoonman136668-ai' && github.event.issue.number == 807 && startsWith(github.event.comment.body, 'F139-V8-OWNER-RECOVER ') }}
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate immutable original owner, main and existing Windows task
        id: gate
        shell: pwsh
        env:
          F139_V8_COMMENT: ${{ github.event.comment.body }}
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $old='72301da157c27fc6fa7d22edce6842c7e4b2a432'
          $prefix='F139-V8-OWNER-RECOVER '
          if($env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:F139_V8_COMMENT -cnotmatch '^F139-V8-OWNER-RECOVER [a-f0-9]{40}$') {
            throw 'F139_V8_WRONG_ORIGINAL_OWNER_EVENT'
          }
          $target=$env:F139_V8_COMMENT.Substring($prefix.Length)
          if($target -cne $env:GITHUB_SHA -or $target -ceq $old -or
             (& git rev-parse HEAD | Out-String).Trim() -cne $target) {
            throw 'F139_V8_EXACT_MAIN_COMMIT_DRIFT'
          }
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          if(-not [Security.Principal.WindowsPrincipal]::new($identity).IsInRole(
                  [Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'F139_V8_ESCALATED_ORIGINAL_OWNER_REQUIRED'
          }
          $me=(& gh api user --jq '.login' | Out-String).Trim()
          $main=(& gh api repos/spoonman136668-ai/FORGE/branches/main | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0 -or $me -cne 'spoonman136668-ai' -or
             $main.protected -ne $true -or $main.commit.sha -cne $target) {
            throw 'F139_V8_PROTECTED_MAIN_OR_OWNER_DRIFT'
          }
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if($event.issue.number -ne 807 -or
             $event.comment.user.login -cne 'spoonman136668-ai' -or
             [string]$event.comment.body -cne $env:F139_V8_COMMENT -or
             [int64]$event.comment.id -le 0) {
            throw 'F139_V8_APPROVAL_EVENT_IDENTITY_DRIFT'
          }
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if([string]$task.State -cnotin @('Ready','Running') -or
             @($task.Actions).Count -ne 1 -or @($task.Triggers).Count -ne 3 -or
             [string]$task.Actions[0].Arguments -notmatch '(?i)(?:^|\s)-PollSeconds\s+300(?:\s|$)') {
            throw 'F139_V8_ORIGINAL_TASK_TOPOLOGY_DRIFT'
          }
          $owner=[string]$task.Principal.UserId
          $sid=''
          try {$sid=(New-Object Security.Principal.NTAccount($owner)).Translate(
                 [Security.Principal.SecurityIdentifier]).Value} catch {}
          if($owner -ine $identity.Name -and $sid -cne $identity.User.Value) {
            throw 'F139_V8_ORIGINAL_OWNER_SID_DRIFT'
          }
          function Field([string]$key) {
            $m=[regex]::Match([string]$task.Actions[0].Arguments,
                   '(?i)(?:^|\s)-'+$key+'\s+"([^"]+)"')
            if(-not $m.Success){throw 'F139_V8_ORIGINAL_TASK_ARG_DRIFT'}
            return $m.Groups[1].Value
          }
          $root=Field 'RepositoryRoot'
          $database=Field 'Database'
          $python=Field 'PythonExe'
          if(-not(Test-Path -LiteralPath $database -PathType Leaf) -or
             -not(Test-Path -LiteralPath $python -PathType Leaf) -or
             (& git -C $root rev-parse HEAD | Out-String).Trim() -cne $old -or
             @(& git -C $root status --porcelain --untracked-files=all).Count -ne 0) {
            throw 'F139_V8_INSTALLED_OLD_SOURCE_DRIFT'
          }
          $policy=(& gh api repos/spoonman136668-ai/FORGE/issues/807 | ConvertFrom-Json)
          $data=[string]$policy.body | ConvertFrom-Json
          if($policy.user.login -cne 'spoonman136668-ai' -or
             $data.schema -cne 'forge.f139.native-autonomy-feed-owner-policy.v1' -or
             $data.enabled -ne $true -or $data.source_sha -cne $old -or
             $data.scientific_first_use -ne $false -or
             $data.max_issue_creations_per_cycle -ne 2 -or
             $data.new_controller -ne $false -or
             $data.new_scheduler -ne $false -or
             $data.new_queue -ne $false -or $data.paid_model_calls -ne 0) {
            throw 'F139_V8_FEED_POLICY_CHANGED'
          }
          "root=$root" }} $env:GITHUB_OUTPUT
          "db=$database" }} $env:GITHUB_OUTPUT
          "python=$python" }} $env:GITHUB_OUTPUT
          "target=$target" }} $env:GITHUB_OUTPUT
          Write-Host 'F139_V8_ORIGINAL_OWNER_PREFLIGHT=PASS'
      - name: Quiesce, preserve, settle #970, transition, and resume original task
        shell: pwsh
        env:
          F139_V8_ROOT: ${{ steps.gate.outputs.root }}
          F139_V8_DB: ${{ steps.gate.outputs.db }}
          F139_V8_PYTHON: ${{ steps.gate.outputs.python }}
          F139_V8_TARGET: ${{ steps.gate.outputs.target }}
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $old='72301da157c27fc6fa7d22edce6842c7e4b2a432'
          $name='FORGE-F139-UnifiedController'
          $root=$env:F139_V8_ROOT
          $db=$env:F139_V8_DB
          $python=$env:F139_V8_PYTHON
          $target=$env:F139_V8_TARGET
          $approval=Join-Path $env:RUNNER_TEMP ('f139-v8-'+$env:GITHUB_RUN_ID+'.json')
          $activate=Join-Path $env:RUNNER_TEMP ('f139-v8-native-'+$env:GITHUB_RUN_ID+'.json')
          $quiesced=$false
          $mutated=$false
          $settle=@'
          import json,pathlib,sys
          from f139.local_controller import Database,GitHub,SingleOwner
          from f139.nci04_g49_prepost_negative import settle_g49_original_prepost
          path=pathlib.Path(sys.argv[1])
          db=Database(path)
          try:
              with SingleOwner(path.with_suffix(".lock")):
                  result=settle_g49_original_prepost(
                      db,GitHub(),owner_quiesced=True,approved_target_sha=sys.argv[2])
                  print("F139_V8_G49_CUSTODY="+json.dumps(result,sort_keys=True))
          finally:
              db.close()
          '@
          $approvalScript=@'
          import json,pathlib,sys
          from f139.local_controller import Database
          from f139.nci04_v8_owner_release import SCHEMA,validate_v8_original_owner
          from f139.nci04_g49_prepost_negative import KIND,SOURCE_V7
          from f139.nci04_native_contract import canonical,digest
          db=Database(pathlib.Path(sys.argv[1]))
          try:
              meta=db.meta()
              transitions=list(db.conn.execute(
                "SELECT sha,payload FROM events WHERE kind='SOURCE_TRANSITION_ADMITTED' ORDER BY seq"))
              assert json.loads(transitions[-1]["payload"])["schema"]=="forge.f139.source-transition.v7"
              record=db.conn.execute("SELECT sha FROM events WHERE kind=?", (KIND,)).fetchone()
              assert record is not None
              negative=sorted(row["ticket"] for row in db.conn.execute(
                  "SELECT ticket FROM tasks WHERE stage='QUARANTINED'"))
              a={"schema":SCHEMA,"from_source_sha":SOURCE_V7,
                 "to_source_sha":sys.argv[2],"owner_event_seq":meta["head_seq"],
                 "owner_event_sha256":meta["head_hash"],
                 "v7_terminal_event_sha256":transitions[-1]["sha"],
                 "prepost_negative_event_sha256":record["sha"],
                 "original_quarantined_tickets_sha256":digest(canonical(negative)),
                 "development_only":True,"scientific_first_use":False,
                 "v2_production_dispatch_authorized":False,
                 "new_controller":False,"new_scheduler":False,
                 "new_queue":False,"paid_api_calls":0}
              validate_v8_original_owner(db,a)
              pathlib.Path(sys.argv[3]).write_bytes(canonical(a))
              print("F139_V8_CANONICAL_APPROVAL=PASS")
          finally:db.close()
          '@
          try {
            Disable-ScheduledTask -TaskName $name -ErrorAction Stop | Out-Null
            Stop-ScheduledTask -TaskName $name -ErrorAction Stop | Out-Null
            $quiesced=$true
            $running=@()
            for($i=0;$i -lt 30;$i++){
              $running=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
                 Where-Object {$_.CommandLine -and
                     $_.CommandLine.Contains('f139.local_controller') -and
                     $_.CommandLine.Contains($db)})
              if($running.Count -eq 0){break}
              Start-Sleep -Seconds 1
            }
            if($running.Count -ne 0 -or
               [string](Get-ScheduledTask -TaskName $name).State -cne 'Disabled') {
              throw 'F139_V8_ORIGINAL_OWNER_NOT_QUIESCENT'
            }
            $backup=Join-Path (Split-Path $db -Parent) (
                'f139-v8-original-'+$env:GITHUB_RUN_ID+'.sqlite')
            if(Test-Path -LiteralPath $backup){throw 'F139_V8_BACKUP_COLLISION'}
            @'
          import pathlib,sqlite3,sys
          from f139.local_controller import Database
          path=pathlib.Path(sys.argv[1]).resolve(strict=True)
          backup=pathlib.Path(sys.argv[2])
          db=Database(path)
          try:
              meta=db.meta()
              assert meta["source_sha"]=="72301da157c27fc6fa7d22edce6842c7e4b2a432"
              assert meta["head_seq"]==225
              assert meta["head_hash"]=="daac64effe3c1422449e44b0250786d4cd1a0e24fc40d3e248743d59fcc01129"
              assert not backup.exists()
              with sqlite3.connect(str(backup)) as out:
                  db.conn.backup(out)
              assert backup.is_file()
              print("F139_V8_ORIGINAL_SQLITE_BACKUP=PASS")
          finally: db.close()
          '@ | & $python -B - $db $backup
            if($LASTEXITCODE -ne 0){throw 'F139_V8_FROZEN_LEDGER_OR_BACKUP_DENIED'}
            & git -C $root fetch --no-tags origin $target
            if($LASTEXITCODE -ne 0 -or
               (& git -C $root rev-parse FETCH_HEAD | Out-String).Trim() -cne $target) {
              throw 'F139_V8_PROTECTED_SOURCE_FETCH_FAILED'
            }
            & git -C $root checkout --detach $target
            if($LASTEXITCODE -ne 0 -or
               (& git -C $root rev-parse HEAD | Out-String).Trim() -cne $target -or
               @(& git -C $root status --porcelain --untracked-files=all).Count -ne 0) {
              throw 'F139_V8_SOURCE_INSTALL_NOT_EXACT'
            }
            Set-Location -LiteralPath $root
            # From this point, even an unsuccessful subprocess might have
            # COMMITTED event226/227 before exiting. Never roll back to V7
            # or restart the owner based solely on its return code.
            $mutated=$true
            $settle | & $python -B - $db $target
            if($LASTEXITCODE -ne 0){throw 'F139_V8_G49_PREPOST_NEGATIVE_FAILED'}
            $approvalScript | & $python -B - $db $target $approval
            if($LASTEXITCODE -ne 0){throw 'F139_V8_APPROVAL_FAILED'}
            & $python -B -m f139.local_controller --db $db transition-qualified-native-v8 --approval $approval
            if($LASTEXITCODE -ne 0){throw 'F139_V8_SINGLE_SOURCE_TRANSITION_FAILED'}
            @'
          import pathlib,sys
          from f139.local_controller import Database
          from f139.nci04_native_contract import canonical
          from f139.nci04_owner_ledger import APPROVAL_SCHEMA
          db=Database(pathlib.Path(sys.argv[1]))
          try:
              db.verify();m=db.meta()
              assert m["source_sha"]==sys.argv[2] and m["head_seq"]==228
              assert db.ready() is None and not db.actives()
              approval={"schema":APPROVAL_SCHEMA,"source_sha":m["source_sha"],
                        "expected_event_head_sha256":m["head_hash"],
                        "native_development_approved":True,
                        "scientific_first_use":False,"create_controller":False,
                        "paid_api_calls":0}
              pathlib.Path(sys.argv[3]).write_bytes(canonical(approval))
          finally:db.close()
          '@ | & $python -B - $db $target $activate
            if($LASTEXITCODE -ne 0){throw 'F139_V8_NATIVE_APPROVAL_BUILD_FAILED'}
            & $python -B -m f139.local_controller --db $db activate-native --approval $activate
            if($LASTEXITCODE -ne 0){throw 'F139_V8_NATIVE_ACTIVATION_FAILED'}
            $issue=(& gh api repos/spoonman136668-ai/FORGE/issues/807 | ConvertFrom-Json)
            $policy=[string]$issue.body | ConvertFrom-Json
            if($policy.schema -cne 'forge.f139.native-autonomy-feed-owner-policy.v1' -or
               $policy.enabled -ne $true -or $policy.source_sha -cne $old -or
               $policy.scientific_first_use -ne $false -or
               $policy.new_controller -ne $false -or
               $policy.new_scheduler -ne $false -or
               $policy.new_queue -ne $false -or
               $policy.paid_model_calls -ne 0 -or
               $policy.max_issue_creations_per_cycle -ne 2) {
              throw 'F139_V8_OWNER_FEED_POLICY_CHANGED_DURING_CUTOVER'
            }
            $policy.source_sha=$target
            $body=$policy | ConvertTo-Json -Compress -Depth 12
            & gh api -X PATCH repos/spoonman136668-ai/FORGE/issues/807 -f "body=$body" --silent
            if($LASTEXITCODE -ne 0){throw 'F139_V8_POLICY_PROMOTION_FAILED'}
            $check=(& gh api repos/spoonman136668-ai/FORGE/issues/807 | ConvertFrom-Json)
            $readback=[string]$check.body | ConvertFrom-Json
            if($readback.enabled -ne $true -or $readback.source_sha -cne $target) {
              throw 'F139_V8_POLICY_READBACK_FAILED'
            }
            Enable-ScheduledTask -TaskName $name -ErrorAction Stop | Out-Null
            Start-ScheduledTask -TaskName $name -ErrorAction Stop | Out-Null
            Write-Host 'F139_V8_ORIGINAL_OWNER_EXCLUSIVE_RECOVERY=PASS'
            Write-Host 'F139_V8_SOURCE_V8_AND_NATIVE_ACTIVATION=PASS'
            Write-Host 'F139_V8_G49_CONSUMED_NEGATIVE_NO_REPLAY=PASS'
            Write-Host 'F139_V8_FIRST_USE=FALSE'
          } catch {
            if($quiesced -and -not $mutated) {
              try {
                & git -C $root checkout --detach $old | Out-Null
                if($LASTEXITCODE -eq 0) {
                  Enable-ScheduledTask -TaskName $name -ErrorAction Stop | Out-Null
                  Start-ScheduledTask -TaskName $name -ErrorAction Stop | Out-Null
                }
              } catch {
                Write-Warning 'F139_V8_UNMUTATED_OWNER_ROLLBACK_NOT_VERIFIED'
              }
            }
            if($mutated) {
              Write-Warning 'F139_V8_ORIGINAL_OWNER_HELD_DISABLED_AFTER_PARTIAL_CUSTODY'
            }
            throw
          }
