name: ITD-02 MG21 original four-family genuine mission online native DEV
on:
  push:
    branches: [research/itd02-mg21-fresh-source-cohort-lineage-20261029]
permissions:
  contents: read
  actions: read
jobs:
  genuine-original-mission-online-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Original SHA LF policy
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact prospective MG21 research source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Original Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original native Go runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Verify prior independent two-OS frozen source-lineage qualification BEFORE first new world reset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor be533627e9cbc7f35314257ceadbf21f5e873d4e "$GITHUB_SHA"
          git merge-base --is-ancestor 39b31af7dcc5fc16bf7d1a7d3e9a15fbbfdcc1f6 "$GITHUB_SHA"
          git merge-base --is-ancestor 61e77e0cf1b1355a5a923694faaae42ed4da016a "$GITHUB_SHA"
          PREVIOUS="$(gh run view 40860504961 --repo spoonman136668-ai/FORGE --json conclusion --jq .conclusion)"
          test "$PREVIOUS" = success
          python -B -m py_compile research/lcrm01/mg21_original_development.py research/lcrm01/mg21_source_lineage_audit.py
          python -B research/lcrm01/mg21_source_lineage_audit.py --output "$RUNNER_TEMP/mg21-lineage.json"
          test -s "$RUNNER_TEMP/mg21-lineage.json"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo MG21_INDEPENDENT_SEED_CUSTODY_PASS_BEFORE_FIRST_TRUE_SOURCE_DEV
      - name: Exact source pin upstream Farama and two independent original native architectures
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mg21-original"
          mkdir -p "$root"
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install 'numpy==1.26.4' 'gymnasium==1.1.1' 'pygame-ce==2.5.3'
          for entry in 'minigrid Farama-Foundation/Minigrid 7f5853792ea7f04f75614661006d87fcf949f26d' 'wingless spoonman136668-ai/Wingless ebbadd157cc1df6eabfa5a550c8876ca87dc91e9' 'yggdrasil spoonman136668-ai/Yggdrasil f0dd99d59ce00da7ad17ff49900a1af6d2322a77'; do
            read -r dir repo revision <<< "$entry"
            git init -q "$root/$dir"
            git -C "$root/$dir" remote add origin "https://github.com/$repo.git"
            git -C "$root/$dir" fetch --no-tags --depth 1 origin "$revision"
            git -C "$root/$dir" checkout --detach -q "$revision"
            test "$(git -C "$root/$dir" rev-parse HEAD)" = "$revision"
          done
          test "$(git -C "$root/minigrid" hash-object minigrid/envs/doorkey.py)" = df5b29ef063be34e6d83b8b478e092c6e3e01512
          test "$(git -C "$root/wingless" hash-object research/native/itd02/mg19/genuine_mission.go)" = df6111abd421f601b976273abf61aaad6d0bf61a
          test "$(git -C "$root/yggdrasil" hash-object research/native/itd02/mg19/genuine_mission_cells.py)" = 6a2a60eb9c9b77436421aa7ccbe785d29a163280
          python -m pip install --no-deps -e "$root/minigrid"
          (cd "$root/wingless" && go test -count=1 ./research/native/itd02/mg19/... && go build -trimpath -o "$root/mg21-go" "$GITHUB_WORKSPACE/research/lcrm01/mg20_wingless_original_source_bridge.go")
          export PYTHONPATH="$root/yggdrasil:$GITHUB_WORKSPACE/research/lcrm01"
          python -B -m unittest -q research.native.itd02.mg19.test_genuine_mission_cells
          echo MG21_AUTHENTIC_FARAMA_AND_NATIVE_MG19_ORIGINAL_SOURCE_PINS_VERIFIED
      - name: Execute first 4-family original source DEV cohort in two independent processes
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mg21-original"
          export PYTHONPATH="$root/yggdrasil:$GITHUB_WORKSPACE/research/lcrm01"
          python -B research/lcrm01/mg21_original_development.py \
            --source-root "$root/minigrid" --native-go "$root/mg21-go" \
            --output "$root/first.json" > "$root/first.log" 2>&1 || {
            tail -80 "$root/first.log"; exit 1;
          }
          tail -5 "$root/first.log"
          python -B research/lcrm01/mg21_original_development.py \
            --source-root "$root/minigrid" --native-go "$root/mg21-go" \
            --output "$root/second.json" > "$root/second.log" 2>&1 || {
            tail -80 "$root/second.log"; exit 1;
          }
          tail -5 "$root/second.log"
          python -B research/lcrm01/mg21_original_development.py \
            --compare "$root/first.json" "$root/second.json" \
            > "$root/comparison.log" 2>&1 || {
            cat "$root/comparison.log";exit 1;
          }
          cat "$root/comparison.log"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo MG21_ORIGINAL_FOUR_FAMILY_DEV_RESULT_PRESERVED_NO_SCIENTIFIC_FIRST_USE
      - name: Preserve original source 32-episode DEV trace and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mg21-original-four-family-native-development-ubuntu
          path: |
            ${{ runner.temp }}/mg21-lineage.json
            ${{ runner.temp }}/mg21-original/first.json
            ${{ runner.temp }}/mg21-original/second.json
            ${{ runner.temp }}/mg21-original/*.log
          retention-days: 30
          if-no-files-found: warn
