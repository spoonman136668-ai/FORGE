name: ACC34 exact 36-candidate acceleration real-Go delta lifecycle falsification
on:
  pull_request:
    paths:
      - 'research/acceleration/acc34_go_delta/**'
      - 'research/acceleration/acc34_portfolio_index.json'
      - 'research/acceleration/test_acc34_portfolio.py'
      - 'docs/research/ACC-34-*'
      - '.github/workflows/forge-acc34-delta-lifecycle.yml'
permissions:
  contents: read
jobs:
  native-go-paired-acceleration:
    name: ACC34 true Go 4-arm CPU/fidelity / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact isolated acceleration research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Go 1.25.5 actual local CPU kernel
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Python 3.11 only for unchanged 36-candidate custody
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact Git source identities and all 36 original acceleration proposals
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/ac07_sourcefree/ac08_portfolio.py)" = 5126c860771fb024ccfc14c3f7ee8925edf29787
          test "$(git rev-parse HEAD:research/acceleration/acc34_portfolio_index.json)" = 29f50adda221c757af629ac093ea59cf2902523d
          test "$(git rev-parse HEAD:research/acceleration/test_acc34_portfolio.py)" = 975f54ad73d5612d97b1cd30a1052de965f65d99
          test "$(git rev-parse HEAD:research/acceleration/acc34_go_delta/isolated_core/core.go)" = a59fe7266f9968733011b58d6eba29ae286dcff9
          test "$(git rev-parse HEAD:research/acceleration/acc34_go_delta/isolated_core/core_test.go)" = c89544fa761fc02d4034e13df2578947f2cccb82
          test "$(git rev-parse HEAD:research/acceleration/acc34_go_delta/cmd/worker/main.go)" = 4573ac78805f662ea8f672f2fb57fc5404c910e7
          test "$(git rev-parse HEAD:research/acceleration/acc34_go_delta/cmd/driver/main.go)" = 35598a68ba3ed64f63f00f2ccb3754beacbc0c0a
          test "$(git rev-parse HEAD:research/acceleration/acc34_go_delta/go.mod)" = 973ad217354d16b49e791eed9c10450ed2801b66
          test "$(git rev-parse HEAD:research/acceleration/acc34_go_delta/core.go)" = 4e41e8e82cd9799d6abaf285dda0f0ee64311905
          test "$(git rev-parse HEAD:research/acceleration/acc34_go_delta/core_test.go)" = 16cd4605f7b50e26694d5ec77ed6352ecd53bd4f
          python -B -m unittest discover -s research/acceleration -p 'test_acc34_portfolio.py' -v
          python -B research/ac07_sourcefree/ac08_portfolio.py > "$RUNNER_TEMP/acc34-ac08-portfolio.json"
          python - "$RUNNER_TEMP/acc34-ac08-portfolio.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["unique_claim_count"]==36
          assert r["original_count"]==30 and r["native_hypothesis_count"]==6
          assert r["physical_substitute_only_ids"]==["U03","U06"]
          assert r["scientific_admission_authorized"] is False
          assert r["model_promotion_authorized"] is False
          assert r["controller_or_queue_changed"] is False
          print("ACC34_EXACT_HISTORICAL_ACC_PORTFOLIO=36_OF_36_PASS")
          PY
      - name: Focused historical synthetic falsifiers and original Go kernel tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/ac05_sourcefree -p 'test_*.py' -v
          python -B -m unittest discover -s research/ac06_sourcefree -p 'test_*.py' -v
          python -B -m unittest discover -s research/ac07_sourcefree -p 'test_remaining.py' -v
          cd research/acceleration/acc34_go_delta
          go test -count=1 -v ./...
          go vet ./...
          echo ACC34_SIX_NATIVE_GO_CORRECTNESS_FALSIFIERS=PASS
      - name: Paired all-in cost, correctness and hidden-conjunction controls
        shell: bash
        run: |
          set -euo pipefail
          cd research/acceleration/acc34_go_delta
          extension=""
          if [ "$RUNNER_OS" = "Windows" ]; then extension=".exe"; fi
          go build -trimpath -o "$RUNNER_TEMP/acc34worker$extension" ./cmd/worker
          go build -trimpath -o "$RUNNER_TEMP/acc34driver$extension" ./cmd/driver
          "$RUNNER_TEMP/acc34driver$extension" -worker "$RUNNER_TEMP/acc34worker$extension" -out "$RUNNER_TEMP/acc34-report.json"
          python - "$RUNNER_TEMP/acc34-report.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["schema"]=="forge.acc34.paired-acd1-sourcefree-native-go-development.v1"
          assert r["registered_candidate_count"]==36
          assert r["worker_source_class"]=="REAL_GO_1_25_PROCESS_FULL_LIFECYCLE"
          assert len(r["all_measured_worker_samples"])==40
          assert len(r["by_scenario"])==2
          assert {x["scenario"] for x in r["by_scenario"]}=={"benign","hidden_interaction"}
          assert all(len(x["pairs"])==5 and x["verified_output_exact"] for x in r["by_scenario"])
          assert r["scientific_first_use"] is False
          assert r["native_models_changed"] is False
          assert r["original_source_episodes"]==0
          assert r["process_cpu_includes_fit_and_verification"] is True
          assert r["go_runtime_sys_is_not_os_peak_rss"] is True
          assert r["classification"] in (
             "ACC34_ACD1_NO_TOTAL_VERIFIED_NATIVE_GO_CPU_WIN__NO_SCIENCE",
             "ACC34_ACD1_VERIFIED_TOTAL_NATIVE_GO_CPU_RESOURCE_POSITIVE__ENGINEERING_ONLY")
          for x in r["by_scenario"]:
              for p in x["pairs"]:
                  assert p["full_child_cpu_ns"]>0 and p["verified_child_cpu_ns"]>0
                  assert p["unavailable_oracle_matches_full"] is True
                  assert p["unverified_diverged_from_full"] is (x["scenario"]=="hidden_interaction")
          print("ACC34_ACTUAL_GO_CPU_RESOURCE_AND_QUALITY_RECEIPTS=PASS")
          print("ACC34_RESOURCE_RESULT="+r["classification"])
          PY
      - name: Preserve raw all-worker resource receipts for auditing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: acc34-sourcefree-acd1-native-go-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/acc34-report.json
            ${{ runner.temp }}/acc34-ac08-portfolio.json
          retention-days: 30
          if-no-files-found: error
  cross-os-correctness:
    name: ACC34 both native Go operating systems independently reproducible
    needs: native-go-paired-acceleration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: acc34-sourcefree-acd1-native-go-*
          path: source-artifacts
      - name: Fail closed on different scientific outcome or source-public traces
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,json
          base=pathlib.Path("source-artifacts")
          files=sorted(base.glob("*/acc34-report.json"))
          assert len(files)==2,[str(x) for x in files]
          a,b=[json.loads(f.read_text(encoding="utf-8")) for f in files]
          assert a["runner_goos"]!=b["runner_goos"]
          assert {a["runner_goos"],b["runner_goos"]}=={"linux","windows"}
          assert len(a["all_measured_worker_samples"])==len(b["all_measured_worker_samples"])==40
          for i,(x,y) in enumerate(zip(a["all_measured_worker_samples"],b["all_measured_worker_samples"])):
              assert (x["seed"],x["scenario"],x["mode"])==(y["seed"],y["scenario"],y["mode"]),i
              for k in ("checksum","events","fit_evaluations","action_evaluations","verification_evaluations","verification_repairs"):
                  assert x["worker"][k]==y["worker"][k],(i,k)
          for x,y in zip(a["by_scenario"],b["by_scenario"]):
              assert x["scenario"]==y["scenario"]
              assert x["verified_output_exact"] and y["verified_output_exact"]
              assert x["undercovered_fit_hidden_interaction_observed"]==y["undercovered_fit_hidden_interaction_observed"]
          print("ACC34_CROSS_OS_ALL_40_WORKER_TRACES_AND_FALSIFIERS=PASS")
          print("ACC34_LINUX_RESULT="+(a if a["runner_goos"]=="linux" else b)["classification"])
          print("ACC34_WINDOWS_RESULT="+(a if a["runner_goos"]=="windows" else b)["classification"])
          PY
