name: F139 G5 single original Windows owner guarded source cutover
on:
  push:
    branches: [audit/f139-r4-single-owner-readiness-20261024]
    paths: [.github/workflows/f139-g5-once-original-owner-cutover.yml]
permissions:
  contents: read
concurrency:
  group: f139-g5-single-original-owner-cutover
  cancel-in-progress: false
jobs:
  source-cutover:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Execute exactly one original-owner guarded cutover
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # The SHA is deliberately unarmed in the staging commit.
          $target='0000000000000000000000000000000000000000'
          if($target -ceq ('0'*40)){
            Write-Host 'F139_G5_STAGED_UNARMED_NO_OWNER_ACTION=PASS'
            exit 0
          }
          $old='8eca700c39223e176dea55f488b6f3397ce4e27a'
          $g4='7844ae6b0e75ce5c1f83de8e47c13457a34e0e0e'
          $repo='spoonman136668-ai/FORGE'
          $name='FORGE-F139-UnifiedController'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_REPOSITORY -cne $repo -or
             $target -cnotmatch '^[a-f0-9]{40}$'){
            throw 'F139_G5_OWNER_RUNNER_OR_SOURCE_INVALID'
          }
          $me=[Security.Principal.WindowsIdentity]::GetCurrent()
          $wp=[Security.Principal.WindowsPrincipal]::new($me)
          if(-not $wp.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){
            throw 'F139_G5_RUNNING_IDENTITY_NOT_ELEVATED'
          }
          $who=(& gh api user --jq '.login' | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $who -cne 'spoonman136668-ai'){
            throw 'F139_G5_OWNER_GITHUB_NOT_AUTHENTICATED'
          }
          $protected=(& gh api "repos/$repo/branches/main" | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0 -or
             [string]$protected.commit.sha -cne $target -or
             $protected.protected -ne $true){
            throw 'F139_G5_PROTECTED_SHA_CHANGED'
          }
          $merged=(& gh api "repos/$repo/pulls/901" | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0 -or $merged.merged -ne $true -or
             [string]$merged.merge_commit_sha -cne $target -or
             [string]$merged.head.sha -cne $g4){
            throw 'F139_G5_PRECISE_INTEGRATION_NOT_MERGED'
          }
          $policyIssue=(& gh api "repos/$repo/issues/807" | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'F139_G5_POLICY_NOT_READABLE'}
          $policy=[string]$policyIssue.body | ConvertFrom-Json
          if([string]$policy.schema -cne 'forge.f139.native-autonomy-feed-owner-policy.v1' -or
             [string]$policy.source_sha -cne $old -or
             $policy.enabled -ne $true -or
             $policy.scientific_first_use -ne $false -or
             $policy.paid_model_calls -ne 0 -or
             $policy.new_controller -ne $false -or
             $policy.new_scheduler -ne $false -or
             $policy.new_queue -ne $false){
            throw 'F139_G5_OWNER_POLICY_DRIFT'
          }
          $task=Get-ScheduledTask -TaskName $name -ErrorAction Stop
          if([string]$task.State -cne 'Running' -or
             @($task.Actions).Count -ne 1 -or @($task.Triggers).Count -ne 3){
            throw 'F139_G5_OWNER_TASK_STATE_DRIFT'
          }
          $ownerId=[string]$task.Principal.UserId
          $sid=''
          try{$sid=(New-Object Security.Principal.NTAccount($ownerId)).Translate(
             [Security.Principal.SecurityIdentifier]).Value}catch{}
          if($ownerId -ine $me.Name -and $sid -cne $me.User.Value){
            throw 'F139_G5_ORIGINAL_OWNER_SID_DRIFT'
          }
          function Arg([string]$n){
            $r=[regex]::Match([string]$task.Actions[0].Arguments,
              '(?i)(?:^|\s)-'+$n+'\s+"([^"]+)"')
            if(-not $r.Success){throw 'F139_G5_ORIGINAL_TASK_ARGUMENT_DRIFT'}
            return $r.Groups[1].Value
          }
          $root=Arg 'RepositoryRoot'
          $db=Arg 'Database'
          $python=Arg 'PythonExe'
          if([IO.Path]::GetFullPath($db) -ine
            [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'FORGE-F139\state.sqlite'))){
            throw 'F139_G5_ORIGINAL_DB_PATH_DRIFT'
          }
          $original=( & git.exe -C $root rev-parse HEAD | Out-String).Trim()
          $dirty=@(& git.exe -C $root status --porcelain --untracked-files=all)
          if($LASTEXITCODE -ne 0 -or $original -cne $old -or $dirty.Count -ne 0){
            throw 'F139_G5_OWNER_CHECKOUT_NOT_CLEAN'
          }
          $query=@'
          import pathlib,sqlite3,sys
          from f139.local_controller import Database
          from f139.nci04_owner_ledger import verify_native_activation
          path=pathlib.Path(sys.argv[1]).resolve(strict=True)
          conn=sqlite3.connect(path.as_uri()+"?mode=ro",uri=True,timeout=20)
          conn.row_factory=sqlite3.Row
          conn.execute("PRAGMA query_only=ON")
          view=object.__new__(Database)
          view.filename=path
          view.conn=conn
          try:
              view.verify()
              m=view.meta()
              assert m["source_sha"]==sys.argv[2] and m["head_seq"]>=206
              assert verify_native_activation(view)
              assert not view.actives() and view.ready() is None
              assert view.conn.execute("SELECT count(*) FROM tasks").fetchone()[0]==31
              assert view.conn.execute("SELECT count(*) FROM tasks WHERE stage='QUARANTINED'").fetchone()[0]==12
              print(m["head_hash"])
          finally:
              conn.close()
          '@
          Push-Location $root
          $stopped=$false
          $migrated=$false
          $enabled=$false
          $approval=Join-Path $env:RUNNER_TEMP ('f139-g5-approval-'+$env:GITHUB_RUN_ID+'.json')
          try{
            $pre=(& $python -B -c $query $db $old | Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $pre -cnotmatch '^[a-f0-9]{64}$'){
              throw 'F139_G5_OWNER_INITIAL_LEDGER_INVALID'
            }
            Write-Host 'F139_G5_BEFORE_STOP_LEDGER_AND_NEGATIVES=PASS'
            Disable-ScheduledTask -TaskName $name -ErrorAction Stop | Out-Null
            $stopped=$true
            # Disable must precede stop to prevent a scheduled relaunch.
            # A stop failure still enters the guarded owner recovery path.
            Stop-ScheduledTask -TaskName $name -ErrorAction Stop | Out-Null
            $count=0
            do{
              Start-Sleep -Seconds 1
              $children=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
                Where-Object { $_.CommandLine -and
                  $_.CommandLine.Contains('f139.local_controller') -and
                  $_.CommandLine.Contains($db) })
              $count++
            }while($children.Count -gt 0 -and $count -lt 25)
            $nowTask=Get-ScheduledTask -TaskName $name
            if($children.Count -gt 0 -or [string]$nowTask.State -cne 'Disabled'){
              throw 'F139_G5_OWNER_NOT_QUIESCED'
            }
            $post=(& $python -B -c $query $db $old | Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $post -cne $pre){
              throw 'F139_G5_PRETRANSITION_LEDGER_MOVED'
            }
            & git.exe -C $root fetch --no-tags origin $target
            if($LASTEXITCODE -ne 0){throw 'F139_G5_PROTECTED_SOURCE_FETCH_FAILED'}
            if(( & git.exe -C $root rev-parse FETCH_HEAD | Out-String).Trim() -cne $target){
              throw 'F139_G5_SOURCE_FETCH_SHA_DRIFT'
            }
            & git.exe -C $root merge-base --is-ancestor $g4 $target
            if($LASTEXITCODE -ne 0){throw 'F139_G5_G4_SOURCE_NOT_IN_MERGE_ANCESTRY'}
            & git.exe -C $root checkout --detach $target
            if($LASTEXITCODE -ne 0){throw 'F139_G5_SOURCE_CHECKOUT_FAILED'}
            if(( & git.exe -C $root rev-parse HEAD | Out-String).Trim() -cne $target -or
               @(& git.exe -C $root status --porcelain --untracked-files=all).Count -ne 0){
              throw 'F139_G5_NEW_SOURCE_NOT_EXACT_CLEAN'
            }
            $transition=@{
              schema='forge.f139.nci04.owner-source-transition-approval.v1'
              from_source_sha=$old
              to_source_sha=$target
              expected_event_head_sha256=$pre
              sealed_23_event_head_sha256='eea95c859f9a59f700612c3b7b39152abc78827981976e9d86567c29fa03ff87'
              native_development_only=$true
              scientific_first_use=$false
              new_controller=$false
              paid_api_calls=0
            } | ConvertTo-Json -Depth 5 -Compress
            [IO.File]::WriteAllText($approval,$transition,[Text.UTF8Encoding]::new($false))
            & $python -B -m f139.local_controller --db $db transition-qualified-native --approval $approval
            if($LASTEXITCODE -ne 0){
              # CLI could have committed before failing readback; do not blind rollback.
              $migrated=$true
              throw 'F139_G5_EXACT_SOURCE_TRANSITION_NOT_CONFIRMED'
            }
            $migrated=$true
            Write-Host 'F139_G5_ORIGINAL_V5_TRANSITION=PASS'
            $newhead=@'
          import sqlite3,sys
          x=sqlite3.connect(sys.argv[1])
          m=x.execute("SELECT source_sha,head_hash FROM meta WHERE id=1").fetchone()
          assert m is not None and m[0]==sys.argv[2]
          print(m[1])
          x.close()
          '@
            $new=(& $python -B -c $newhead $db $target | Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $new -cnotmatch '^[a-f0-9]{64}$'){
              throw 'F139_G5_V5_EVENT_HEAD_NOT_CONFIRMED'
            }
            $activate=@{
              schema='forge.f139.nci04.owner-native-approval.v1'
              source_sha=$target
              expected_event_head_sha256=$new
              native_development_approved=$true
              scientific_first_use=$false
              create_controller=$false
              paid_api_calls=0
            } | ConvertTo-Json -Depth 5 -Compress
            [IO.File]::WriteAllText($approval,$activate,[Text.UTF8Encoding]::new($false))
            & $python -B -m f139.local_controller --db $db activate-native --approval $approval
            if($LASTEXITCODE -ne 0){throw 'F139_G5_PER_SOURCE_ACTIVATION_FAILED'}
            Write-Host 'F139_G5_ORIGINAL_NEW_SOURCE_ACTIVATED=PASS'
            # Retarget the existing exact schema and policy, changing source_sha ONLY.
            $policy.source_sha=$target
            $policyBody=$policy | ConvertTo-Json -Depth 10 -Compress
            $updated=(& gh api --method PATCH "repos/$repo/issues/807" -f "body=$policyBody" | ConvertFrom-Json)
            if($LASTEXITCODE -ne 0 -or
              [string]$updated.body -cne $policyBody){
              throw 'F139_G5_POLICY_RETARGET_UNCONFIRMED'
            }
            Write-Host 'F139_G5_EXISTING_ISSUE_807_RETARGET=PASS'
            Enable-ScheduledTask -TaskName $name -ErrorAction Stop | Out-Null
            $enabled=$true
            Start-ScheduledTask -TaskName $name -ErrorAction Stop
            $n=0
            do {
              Start-Sleep -Seconds 1
              $n++
              $running=[string](Get-ScheduledTask -TaskName $name).State -ceq 'Running'
            } while(-not $running -and $n -lt 30)
            if(-not $running){throw 'F139_G5_ORIGINAL_OWNER_NOT_RESTARTED'}
            Write-Host 'F139_G5_ORIGINAL_WINDOWS_OWNER_RESTARTED=PASS'
            Write-Host 'F139_G5_PROTECTED_NEW_SOURCE_PIN=' + $target
            Write-Host 'F139_G5_NO_SECOND_CONTROLLER_OR_SCIENCE=TRUE'
          }catch{
            if($stopped -and -not $migrated){
              # Only before durable original-ledger mutation may old source resume.
              try{
                & git.exe -C $root checkout --detach $old | Out-Null
                Enable-ScheduledTask -TaskName $name -ErrorAction Stop | Out-Null
                $still=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
                  Where-Object { $_.CommandLine -and
                    $_.CommandLine.Contains('f139.local_controller') -and
                    $_.CommandLine.Contains($db) })
                if($still.Count -eq 0){
                  Start-ScheduledTask -TaskName $name -ErrorAction Stop
                }elseif($still.Count -ne 1){
                  throw 'F139_G5_PRETRANSITION_OWNER_MULTIPLE_CHILDREN'
                }
                Write-Host 'F139_G5_PRETRANSITION_OWNER_RESTORED=PASS'
              }catch{
                Write-Host 'F139_G5_PRETRANSITION_OWNER_RECOVERY_REQUIRES_INSPECTION'
              }
            }elseif($migrated -and -not $enabled){
              Write-Host 'F139_G5_POSTTRANSITION_OWNER_INTENTIONALLY_HELD_DISABLED'
            }
            throw
          }finally{
            Remove-Item -LiteralPath $approval -Force -ErrorAction SilentlyContinue
            Pop-Location
          }
