          python3 -B -m f139.check_genenv_source_integration --result "$result_path"
      - name: Native Windows source qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_TEST_FAILED' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_VET_FAILED' }
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_WINDOWS_BUILD_FAILED' }
      - name: Parse installer PowerShell without executing it
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:F139_PARSE_ONLY='1'
          python -B -m unittest discover -s f139 -p test_nci04_v32_source_transition.py -v
          if($LASTEXITCODE -ne 0){throw 'F139_V32_INSTALLER_PARSE_OR_SOURCE_TEST_FAILED'}
