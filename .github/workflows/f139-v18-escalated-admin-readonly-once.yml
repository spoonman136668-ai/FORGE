name: FORGE F139 V18 single original owner GitHub release-ref admin lock attempt
on:
  push:
    branches: [engineering/f139-v18-escalated-admin-readonly-20261028]
    paths:
      - '.github/workflows/f139-v18-escalated-admin-readonly-once.yml'
permissions:
  contents: read
concurrency:
  group: forge-f139-v18-admin-lock-one-attempt-20261028
  cancel-in-progress: false
jobs:
  original-owner-admin-lock-once:
    if: >-
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.actor == 'spoonman136668-ai' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/engineering/f139-v18-escalated-admin-readonly-20261028' &&
      github.event.head_commit.message == 'FORGE F139 V18 owner admin release-ref lock single attempt 20261028'
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate original escalated owner identity, source, and local account
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1') {
            throw 'F139_V18_ADMIN_LOCK_WRONG_RUNNER_OR_RETRY'
          }
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          if(-not [Security.Principal.WindowsPrincipal]::new($identity).IsInRole(
             [Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'F139_V18_ADMIN_LOCK_ESCALATED_WINDOWS_REQUIRED'
          }
          $sha=(& git rev-parse HEAD | Out-String).Trim()
          $dirty=(& git status --porcelain --untracked-files=all | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $sha -cne $env:GITHUB_SHA -or
             $dirty.Length -ne 0) {
            throw 'F139_V18_ADMIN_LOCK_SOURCE_NOT_EXACT'
          }
          foreach($name in @('GH_TOKEN','GITHUB_TOKEN','GH_ENTERPRISE_TOKEN','GITHUB_ENTERPRISE_TOKEN')) {
            Remove-Item -Path ("Env:"+$name) -ErrorAction SilentlyContinue
          }
          $env:GH_PROMPT_DISABLED='1'
          if(-not(Get-Command gh -ErrorAction SilentlyContinue)) {
            throw 'F139_V18_ADMIN_LOCK_OWNER_GH_CLI_UNAVAILABLE'
          }
          $login=& gh api user --jq .login 2>$null
          if($LASTEXITCODE -ne 0 -or
             [string]$login -cne 'spoonman136668-ai') {
            throw 'F139_V18_ADMIN_LOCK_STORED_OWNER_GH_LOGIN_MISSING'
          }
          Write-Host 'F139_V18_ADMIN_LOCK_ORIGINAL_ESCALATED_OWNER=PASS'
          Write-Host 'F139_V18_ADMIN_LOCK_STORED_OWNER_GITHUB_LOGIN=PASS'
      - name: Execute reviewed bounded administrator release-ref lock with original local GitHub CLI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          foreach($name in @('GH_TOKEN','GITHUB_TOKEN','GH_ENTERPRISE_TOKEN','GITHUB_ENTERPRISE_TOKEN')) {
            Remove-Item -Path ("Env:"+$name) -ErrorAction SilentlyContinue
          }
          $env:GH_PROMPT_DISABLED='1'
          $head=(& git rev-parse HEAD | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) {
            throw 'F139_V18_ADMIN_LOCK_EXACT_SOURCE_DRIFT'
          }
          # CI checks out detached; name a LOCAL branch so the reviewed
          # administrator script can enforce its clean governance source guard.
          & git switch -c governance/f139-release-ref-protection-20261028
          if($LASTEXITCODE -ne 0) {
            throw 'F139_V18_ADMIN_LOCK_LOCAL_GOVERNANCE_CHECKOUT_DENIED'
          }
          & pwsh -NoLogo -NoProfile -File scripts/Install-F139V18ReleaseRuleset.ps1
          if($LASTEXITCODE -ne 0) {
            throw 'F139_V18_ADMIN_LOCK_READONLY_PREFLIGHT_DENIED'
          }
          & pwsh -NoLogo -NoProfile -File scripts/Install-F139V18ReleaseRuleset.ps1 -Apply
          if($LASTEXITCODE -ne 0) {
            throw 'F139_V18_ADMIN_LOCK_GITHUB_ADMIN_WRITE_OR_VERIFICATION_DENIED'
          }
          Write-Host 'F139_V18_ADMIN_LOCK_RULESET_INSTALLED_AND_READBACK=PASS'
          Write-Host 'F139_V18_ADMIN_LOCK_ORIGINAL_TASK_NOT_ACCESSED=TRUE'
          Write-Host 'F139_V18_ADMIN_LOCK_SCIENTIFIC_FIRST_USE=FALSE'
