name: FORGE K-Terminal P7-I/U Windows package interference
on:
  push:
    branches: [qualification/kterminal-p7iu-package-interference-20261019]
permissions:
  contents: read
concurrency:
  group: forge-kterminal-p7iu-${{ github.sha }}
  cancel-in-progress: false
jobs:
  original-package-windows:
    runs-on: windows-2022
    timeout-minutes: 70
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '4'
      GOFLAGS: '-p=1'
      GOMEMLIMIT: '1536MiB'
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout public FORGE control only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify integrated FORGE base and single workflow change
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/FORGE
          test "$GITHUB_REF" = refs/heads/qualification/kterminal-p7iu-package-interference-20261019
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Windows
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 41263bb8aec510b293fc93b81b58df689f089aae HEAD
          test "$(git diff --name-only 41263bb8aec510b293fc93b81b58df689f089aae HEAD)" = .github/workflows/forge-kterminal-p7iu-original-package-interference.yml
          test -z "$(git status --porcelain)"
          test "$GOMAXPROCS" = 4
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          test "$K_TERMINAL_P5_LATENCY" = 0
          test "$K_TERMINAL_NATIVE_TIMING" = 0
          echo P7IU_FORGE_HOSTED_SCOPE=PASS
      - name: Checkout frozen private K-Terminal original source with scoped read key
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: ba11a398586df9fe5233624d9cf115aeec76d11a
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Pin identical Go 1.26.5 Windows compiler
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Original pkg suite with original failed regression scheduling
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Windows
          test "$(git rev-parse HEAD)" = ba11a398586df9fe5233624d9cf115aeec76d11a
          test "$(git rev-parse HEAD:pkg/stage3-original-observer-forced-cuts_test.go)" = bee85ee3441b0f66399ab6c42f8b09635ba44c6b
          test "$(git rev-parse HEAD:pkg/stage3-native-authenticated-sell-post-crash_test.go)" = 8fc5727f722510b2bfff0cfe9d4eb0565c6cb5fc
          test "$(git rev-parse HEAD:go.mod)" = b3ede0d8444c08b3e7b23f1396374359b54134c6
          test -z "$(git status --porcelain)"
          go version | grep 'go1.26.5 windows/amd64' >/dev/null
          for key in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET; do
            if [[ -n "$(printenv "$key" 2>/dev/null || true)" ]]; then
              echo P7IU_BROKER_CREDENTIAL_ENV_PRESENT
              exit 2
            fi
          done
          export K_TERMINAL_TEST_WORKSPACE="$RUNNER_TEMP/p7iu-original"
          export KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT="$RUNNER_TEMP/p7iu-original/tail"
          export KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT="$RUNNER_TEMP/p7iu-original/post"
          export KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT="$RUNNER_TEMP/p7iu-original/private"
          mkdir -p "$KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT" "$KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT" "$KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT"
          start=$(date +%s)
          set +e
          go test -json -count=1 -p=1 -parallel=4 -timeout=60m ./pkg \
            > "$RUNNER_TEMP/p7iu-private-go.jsonl" 2> "$RUNNER_TEMP/p7iu-private-stderr"
          rc=$?
          set -e
          export P7IU_GO_STATUS="$rc"
          export P7IU_ELAPSED_SECONDS="$(( $(date +%s) - start ))"
          python -B - <<'PY'
          import hashlib,json,os,pathlib,sys
          expected_observer="TestStage3OriginalObserverForcedBoundaries"
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          source=root/"p7iu-private-go.jsonl"
          actions={"run":0,"pass":0,"fail":0}
          package_actions={"pass":0,"fail":0}
          other_fails=set()
          subtest_failures=0
          seen=0
          malformed=0
          if source.is_file() and source.stat().st_size <= 110*1024*1024:
              for line in source.read_text(encoding="utf-8-sig",errors="replace").splitlines():
                  try: evt=json.loads(line)
                  except ValueError:
                      malformed+=1
                      continue
                  if not isinstance(evt,dict):
                      malformed+=1
                      continue
                  seen+=1
                  action,name=evt.get("Action"),evt.get("Test")
                  if name is None and action in package_actions:
                      package_actions[action]+=1
                  if name==expected_observer and action in actions:
                      actions[action]+=1
                  elif isinstance(name,str) and name.startswith(expected_observer+"/") and action=="fail":
                      subtest_failures+=1
                  elif isinstance(name,str) and name.startswith("Test") and "/" not in name and action=="fail":
                      # Hash other private test names, never publish names or log lines.
                      other_fails.add(hashlib.sha256(name.encode()).hexdigest()[:16])
          else:
              malformed+=1
          rc=int(os.environ["P7IU_GO_STATUS"])
          complete=seen>0 and malformed==0 and actions["run"]==1 and actions["pass"]+actions["fail"]==1
          disposition=("P7IU_OBSERVER_NOT_COMPLETELY_RECORDED" if not complete else
                       "P7IU_PACKAGE_CONTEXT_OBSERVER_FAILURE_REPRODUCED" if actions["fail"] or subtest_failures else
                       "P7IU_OBSERVER_PASS_OTHER_PACKAGE_FAILURE" if rc or package_actions["fail"] or other_fails else
                       "P7IU_PACKAGE_WHOLE_PASS_FULL_ORIGINAL_REGRESSION_NOT_WAIVED")
          receipt={
            "schema":"forge.kterminal.p7iu.package-interference.v1",
            "forge_sha":os.environ["GITHUB_SHA"],
            "exact_kterminal_source_sha":"ba11a398586df9fe5233624d9cf115aeec76d11a",
            "original_observer_blob":"bee85ee3441b0f66399ab6c42f8b09635ba44c6b",
            "original_failed_full_run":39219426995,
            "previous_all_26_case_pass_run":39300394193,
            "scope":"./pkg",
            "scheduler":"GOMAXPROCS=4; go test -p=1 -parallel=4 -count=1",
            "observer_top_level":actions,
            "observer_failed_subtests":subtest_failures,
            "other_failed_test_name_hash_prefixes":sorted(other_fails)[:15],
            "other_failed_test_name_count":len(other_fails),
            "package_events":package_actions,
            "go_exit":rc,
            "go_events_seen":seen,
            "malformed_records":malformed,
            "elapsed_seconds":int(os.environ["P7IU_ELAPSED_SECONDS"]),
            "disposition":disposition,
            "original_full_suite":"FAILED_NOT_WAIVED",
            "raw_logs_uploaded":False,
            "private_source_uploaded":False,
            "workstation_or_research_runner_used":False,
            "broker_orders":0,
            "installed_desktop_or_real_latency_measured":False
          }
          out=root/"p7iu-sanitized"
          out.mkdir(exist_ok=False)
          raw=json.dumps(receipt,sort_keys=True,separators=(",",":")).encode()
          (out/"receipt.json").write_bytes(raw)
          (out/"receipt.sha256").write_text(hashlib.sha256(raw).hexdigest(),encoding="ascii")
          print("P7IU_OBSERVER_RUN="+str(actions["run"]))
          print("P7IU_OBSERVER_PASS="+str(actions["pass"]))
          print("P7IU_OBSERVER_FAIL="+str(actions["fail"]))
          print("P7IU_OBSERVER_FAILED_SUBTESTS="+str(subtest_failures))
          print("P7IU_OTHER_FAILED_TOP_LEVEL_COUNT="+str(len(other_fails)))
          print("P7IU_DISPOSITION="+disposition)
          print("P7IU_RECEIPT_SHA256="+hashlib.sha256(raw).hexdigest())
          print("P7IU_PRIVATE_LOGS_UPLOADED=FALSE")
          if disposition!="P7IU_PACKAGE_WHOLE_PASS_FULL_ORIGINAL_REGRESSION_NOT_WAIVED":
              sys.exit(2)
          PY
      - name: Retain only sanitized cause-classification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-kterminal-p7iu-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p7iu-sanitized/receipt.json
            ${{ runner.temp }}/p7iu-sanitized/receipt.sha256
          retention-days: 30
          if-no-files-found: warn
