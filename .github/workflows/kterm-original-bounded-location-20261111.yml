name: K Terminal original bounded installation locator
on:
  push:
    branches: [qualification/kterm-original-runtime-readonly-20261111]
    paths: [.github/workflows/kterm-original-bounded-location-20261111.yml]
permissions:
  contents: read
concurrency:
  group: kterminal-pr88-full-window-ae11818c
  cancel-in-progress: false
jobs:
  original-bounded-location:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    steps:
      - name: Check precisely operator-supplied historical K Terminal build location without launch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterm-original-runtime-readonly-20261111' -or
             $env:GITHUB_WORKFLOW -cne 'K Terminal original bounded installation locator' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB') {
            throw 'KTERM_EXACT_USER_PATH_OWNER_REFUSED'
          }
          $knownProfile=Join-Path $env:SystemDrive 'Users\camar'
          $expectedHome=([IO.Path]::GetFullPath($knownProfile)).TrimEnd('\')
          if(-not $expectedHome.EndsWith('\Users\camar',[StringComparison]::OrdinalIgnoreCase)){
            throw 'KTERM_EXACT_USER_PATH_SCOPE_REFUSED'
          }
          # Operator supplied this historical source/build root on Oct 19;
          # it is NOT an approved installed application or current location.
          $build=Join-Path $expectedHome 'K-Terminal-build'
          $roots=@(
            [pscustomobject]@{Label='HISTORICAL_BUILD_ROOT';Path=$build},
            [pscustomobject]@{Label='HISTORICAL_PAPER_BUILD_OUTPUT';Path=(Join-Path $build 'dist\K-Terminal-PAPER')}
          )
          foreach($candidate in $roots){
            $root=$candidate.Path
            $exists=[IO.Directory]::Exists($root)
            $exe=$false;$engine=$false;$configured=$false;$pending=$false;$manifest=$false
            $hashReadable=$false;$reparse=$false
            if($exists){
              $rootInfo=Get-Item -LiteralPath $root -Force -ErrorAction Stop
              $reparse=(($rootInfo.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)
              if(-not $reparse){
                $launcher=Join-Path $root 'K-Terminal.exe'
                $e=Join-Path $root 'K-Terminal-Engine.exe'
                $exe=[IO.File]::Exists($launcher)
                $engine=[IO.File]::Exists($e)
                $configured=([IO.File]::Exists((Join-Path $root 'config.json')) -and
                  [IO.Directory]::Exists((Join-Path $root 'data')))
                $pending=[IO.File]::Exists((Join-Path $root 'pending-program-update.json'))
                $manifest=([IO.File]::Exists((Join-Path $root 'source-manifest.json')) -or
                  [IO.File]::Exists((Join-Path $root 'package-manifest.json')))
                if($exe){
                  $fi=Get-Item -LiteralPath $launcher -Force -ErrorAction Stop
                  if(($fi.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0){
                    $digest=(Get-FileHash -LiteralPath $launcher -Algorithm SHA256 -ErrorAction Stop).Hash
                    $hashReadable=($digest -match '^[a-fA-F0-9]{64}$')
                  }
                }
              }
            }
            Write-Host ('KTERM_EXACT_USER_PATH=PASS;ROLE='+$candidate.Label+
              ';ROOT_PRESENT='+$exists+';REPARSE='+$reparse+
              ';LAUNCHER_PRESENT='+$exe+';ENGINE_PRESENT='+$engine+
              ';CONFIGURED='+$configured+';PENDING_STAGED_UPDATE='+$pending+
              ';MANIFEST_PRESENT='+$manifest+';BINARY_HASH_READABLE='+$hashReadable)
          }

          # Read-only VCS/build provenance for the exact user-supplied
          # staging tree. No install/config, no checkout, no build, no launch.
          $sourceSHA='UNAVAILABLE'
          $gitPresent=[IO.Directory]::Exists((Join-Path $build '.git'))
          if($gitPresent -and (Get-Command git -ErrorAction SilentlyContinue)){
            $env:GIT_OPTIONAL_LOCKS='0'
            $head=@(& git -C $build rev-parse --verify HEAD 2>$null)
            if($LASTEXITCODE -eq 0 -and $head.Count -eq 1 -and
               $head[0] -match '^[0-9a-f]{40}$') {$sourceSHA=$head[0]}
          }
          $paperRoot=Join-Path $build 'dist\K-Terminal-PAPER'
          $goInfo='NO_ENGINE'
          $engineRev='UNAVAILABLE'
          $engineModified='UNAVAILABLE'
          $launcherHash='UNAVAILABLE'
          $engineHash='UNAVAILABLE'
          if([IO.Directory]::Exists($paperRoot)){
            $engine=Join-Path $paperRoot 'K-Terminal-Engine.exe'
            $launcher=Join-Path $paperRoot 'K-Terminal.exe'
            if([IO.File]::Exists($launcher)){
              $info=Get-Item -LiteralPath $launcher -Force -ErrorAction Stop
              if(($info.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0){
                $launcherHash=(Get-FileHash -LiteralPath $launcher -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
            if([IO.File]::Exists($engine)){
              $info=Get-Item -LiteralPath $engine -Force -ErrorAction Stop
              if(($info.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0){
                $engineHash=(Get-FileHash -LiteralPath $engine -Algorithm SHA256).Hash.ToLowerInvariant()
                $goInfo='UNAVAILABLE'
                if(Get-Command go -ErrorAction SilentlyContinue){
                  $env:GOTELEMETRY='off'
                  $env:GOENV='off'
                  $metadata=@(& go version -m $engine 2>$null)
                  if($LASTEXITCODE -eq 0){
                    $goInfo='AVAILABLE'
                    foreach($line in $metadata){
                      if($line -match 'vcs\.revision=([a-f0-9]{40})'){$engineRev=$matches[1]}
                      if($line -match 'vcs\.modified=(true|false)'){$engineModified=$matches[1]}
                    }
                  }
                }
              }
            }
          }
          $sameSource=($sourceSHA -ne 'UNAVAILABLE' -and $sourceSHA -ceq $engineRev -and $engineModified -ceq 'false')
          Write-Host ('KTERM_BUILD_PROVENANCE=PASS;SOURCE_REPO_PRESENT='+$gitPresent+
            ';SOURCE_SHA='+$sourceSHA+';GO_BUILD_INFO='+$goInfo+
            ';ENGINE_VCS_REVISION='+$engineRev+';ENGINE_VCS_MODIFIED='+$engineModified+
            ';ENGINE_VCS_MATCHES_SOURCE='+$sameSource+
            ';LAUNCHER_SHA256='+$launcherHash+';ENGINE_SHA256='+$engineHash+
            ';NO_RELEASE_OR_RUNTIME_QUALIFICATION=TRUE')

          Write-Host 'KTERM_EXACT_USER_PATH_SAFE=PASS;NO_CREDENTIAL_READ=TRUE;NO_CONFIG_CONTENT_READ=TRUE;NO_LOG_READ=TRUE;NO_APP_LAUNCH=TRUE;NO_FILE_WRITE=TRUE;NO_BROKER_IO=TRUE;NO_SCHEDULE=TRUE'
