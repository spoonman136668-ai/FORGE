name: K Terminal original bounded installation locator
on:
  push:
    branches: [qualification/kterm-original-runtime-readonly-20261111]
    paths: [.github/workflows/kterm-original-bounded-location-20261111.yml]
permissions:
  contents: read
concurrency:
  group: kterminal-pr88-full-window-ae11818c
  cancel-in-progress: false
jobs:
  original-bounded-location:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    steps:
      - name: Locate only named K Terminal folders under the owner profile
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterm-original-runtime-readonly-20261111' -or
             $env:GITHUB_WORKFLOW -cne 'K Terminal original bounded installation locator' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB'){
             throw 'KTERM_LOCATION_OWNER_IDENTITY_REFUSED'
          }
          $bases=@(
            (Join-Path $env:USERPROFILE 'Desktop'),
            (Join-Path $env:USERPROFILE 'Documents'),
            (Join-Path $env:USERPROFILE 'Downloads'),
            (Join-Path $env:SystemDrive 'Users\Runner\Desktop')
          )
          $seen=New-Object 'System.Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
          $queue=New-Object 'System.Collections.Generic.Queue[object]'
          foreach($base in $bases){
            if(-not [IO.Directory]::Exists($base)){continue}
            $p=[IO.Path]::GetFullPath($base).TrimEnd('\')
            if($seen.Add($p)){ $queue.Enqueue([pscustomobject]@{Path=$p;Depth=0}) }
          }
          $visited=0
          $exeCandidates=0
          $installedCandidates=0
          $pendingCandidates=0
          $qualifiedCandidateHashRead=0
          $maxVisited=160
          while($queue.Count -gt 0 -and $visited -lt $maxVisited){
            $item=$queue.Dequeue()
            $visited++
            $root=$item.Path
            $di=$null
            try {$di=Get-Item -LiteralPath $root -Force -ErrorAction Stop} catch {continue}
            if(($di.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){continue}
            $launcher=Join-Path $root 'K-Terminal.exe'
            if([IO.File]::Exists($launcher)){
              $exeCandidates++
              $config=[IO.File]::Exists((Join-Path $root 'config.json'))
              $data=[IO.Directory]::Exists((Join-Path $root 'data'))
              if($config -and $data){
                $installedCandidates++
                if([IO.File]::Exists((Join-Path $root 'pending-program-update.json'))){$pendingCandidates++}
                try{
                  $hash=(Get-FileHash -LiteralPath $launcher -Algorithm SHA256 -ErrorAction Stop).Hash
                  if($hash -cmatch '^[A-F0-9]{64}$'){$qualifiedCandidateHashRead++}
                }catch{}
              }
            }
            if($item.Depth -ge 3){continue}
            $children=@()
            try{$children=@(Get-ChildItem -LiteralPath $root -Directory -Force -ErrorAction Stop)}catch{continue}
            foreach($child in $children){
              if(($child.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){continue}
              $name=$child.Name
              # Traverse only folders whose names look like the original app,
              # owner desktop staging containers or edition folders.
              if($item.Depth -ge 1 -and
                 $name -notmatch '(?i)K.?Terminal|KABOOM|Alerts.Fixed|Codex|Runner|Personal|Business|Install|Program'){
                continue
              }
              $candidate=[IO.Path]::GetFullPath($child.FullName)
              if($seen.Add($candidate)){$queue.Enqueue([pscustomobject]@{Path=$candidate;Depth=($item.Depth+1)})}
            }
          }
          $complete=($queue.Count -eq 0)
          Write-Host ('KTERM_LOCATION_BOUNDED=PASS;EXACT_HOST=TRUE;VISITED_DIRS='+$visited+
            ';SCAN_COMPLETE='+$complete+
            ';CANDIDATE_EXES='+$exeCandidates+
            ';CONFIGURED_INSTALLATIONS='+$installedCandidates+
            ';PENDING_UPDATE_CANDIDATES='+$pendingCandidates+
            ';HASH_READABLE_CONFIGURED='+$qualifiedCandidateHashRead)
          if(-not $complete){
            Write-Host 'KTERM_LOCATION_RESULT=INCOMPLETE;REASON=160_DIRECTORY_LIMIT'
          }elseif($installedCandidates -eq 0){
            Write-Host 'KTERM_LOCATION_RESULT=NO_CONFIGURED_INSTALL_UNDER_BOUNDED_HISTORIC_PROFILE'
          }elseif($installedCandidates -eq 1 -and $pendingCandidates -eq 0){
            Write-Host 'KTERM_LOCATION_RESULT=ONE_CONFIGURED_INSTALL_NO_PENDING_UPDATE;SOURCE_QUALIFICATION_STILL_REQUIRED'
          }else{
            Write-Host 'KTERM_LOCATION_RESULT=AMBIGUOUS_OR_HAS_PENDING_UPDATE;NO_LAUNCH_ALLOWED'
          }
          Write-Host 'KTERM_LOCATION_NO_APP_LAUNCH=TRUE;NO_BROKER=TRUE;NO_CONFIG_CONTENTS_READ=TRUE;NO_FILE_MUTATION=TRUE;NO_SCHEDULE=TRUE'
