name: FORGE CPU LLM G79 authenticated minimal-state full decode
on:
  push:
    branches: [research/cpu-llm-g79-minstate-decode-20261030]
    paths:
      - '.github/workflows/forge-cpu-llm-g79-minstate-decode.yml'
      - 'research/cpu_g79/**'
permissions:
  contents: read
concurrency:
  group: forge-cpu-g79-original-full-decode
  cancel-in-progress: false
jobs:
  frozen-source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original prereg and immutable G70 source verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD
          git merge-base --is-ancestor 5b0ad0551ed0a7027eca9bfba2ceba3cdbb64fb7 HEAD
          test "$(git rev-parse HEAD:docs/research/CPU-G79-GPT2-MINSTATE-DECODE-PREEXEC-20261030.md)" = "$(git rev-parse 5b0ad0551ed0a7027eca9bfba2ceba3cdbb64fb7:docs/research/CPU-G79-GPT2-MINSTATE-DECODE-PREEXEC-20261030.md)"
          git diff --exit-code 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD -- research/llm_g54 research/llm_g55 research/llm_g56 research/llm_g57 research/llm_g58 research/llm_g59 research/llm_g60 research/llm_g61 research/llm_g62 research/llm_g63 research/llm_g64 research/llm_g65 research/llm_g66 research/llm_g67 research/llm_g68 research/llm_g70
          git diff --check 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD
          python -B -m py_compile research/cpu_g79/g79_minstate_decode.py research/cpu_g79/test_g79_minstate_decode.py
          python -B -m unittest discover -s research/cpu_g79 -p test_g79_minstate_decode.py -v
          echo CPU_G79_FROZEN_SOURCE_ADMISSION=PASS
  authentic-original-full-decoder:
    needs: frozen-source-admission
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin unchanged original GPT2 PyTorch CPU packages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install --disable-pip-version-check 'transformers==4.48.3' 'huggingface_hub==0.30.2' 'safetensors==0.5.3' 'tokenizers==0.21.1' 'psutil==7.1.3'
          python -m pip check
          python -m pip freeze > cpu_g79_original_environment.txt
      - name: Original heldout full eight-token decode against fastest qualified controls
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/cpu_g79/g79_minstate_decode.py
          python - <<'PY'
          import json
          with open("cpu_g79_original_result.json",encoding="utf-8") as f:r=json.load(f)
          assert r["gate"]=="CPU_G79"
          assert r["engineering"]=="PASS" and r["correctness"]=="PASS"
          assert r["summary"]["timed_original_responses"]==144
          assert r["summary"]["original_greedy_tokens"]==1152
          assert len(r["original_pairs"])==48
          assert r["performance"] in ("NO_GO","GO")
          assert r["scientific_acceptance"]=="NOT_GRANTED" and not r["promotion_allowed"]
          print("CPU_G79_AUTHENTIC_PRETRAINED_FULL_DECODER_PARITY=PASS")
          print("CPU_G79_FROZEN_PERFORMANCE="+r["performance"])
          PY
      - name: Preserve untouched original-model result or failed/blocked evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-g79-original-gpt2-minstate-full-decode
          retention-days: 30
          if-no-files-found: warn
          path: |
            cpu_g79_original_result.json
            cpu_g79_original_environment.txt
