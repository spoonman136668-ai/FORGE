name: KTRADE PR253 exact Go toolchain availability read-only
on:
  push:
    branches: [qualification/ktrade-pr253-owner-native-readonly-20261113]
    paths:
      - .github/workflows/ktrade-pr253-toolchain-readonly-20261113.yml
permissions:
  contents: read
concurrency:
  group: ktrade-pr253-go-readonly
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    env:
      KTRADE_EXPECTED_SOURCE: '59842e83f01fb6e1af780ede5a7395a9c7cce47a'
    steps:
      - name: Read toolchains and owner display without changing settings
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $env:KTRADE_EXPECTED_SOURCE -cne '59842e83f01fb6e1af780ede5a7395a9c7cce47a') {
            throw 'KTRADE_PR253_TOOLCHAIN_SCOPE_REFUSED'
          }
          $go=Get-Command go.exe -ErrorAction Stop
          $ver=(& go.exe version) -join ' '
          $gov=(& go.exe env GOVERSION) -join ' '
          $tool=(& go.exe env GOTOOLCHAIN) -join ' '
          $goRoot=(& go.exe env GOROOT) -join ' '
          $session=[Diagnostics.Process]::GetCurrentProcess().SessionId
          $locations=@(
            'C:\Program Files\Go\bin\go.exe',
            'C:\Go\bin\go.exe',
            'C:\tools\go\bin\go.exe',
            'C:\ProgramData\chocolatey\bin\go.exe',
            'C:\Users\camar\go\bin\go1.26.10.exe'
          )
          $available=@()
          foreach($p in $locations){
            if(Test-Path -LiteralPath $p -PathType Leaf){
              $v=try{(& $p version) -join ' '}catch{'VERSION_ERROR'}
              $available+=@{path=$p;version=$v}
            }
          }
          $baseline=(Get-ItemProperty 'HKCU:\Control Panel\Desktop' -ErrorAction SilentlyContinue)
          Write-Host ('KTRADE_PR253_GO_TOOLCHAIN='+([ordered]@{
            schema='ktrade.pr253.go-toolchain-readonly.v1'
            runner=$env:RUNNER_NAME
            host=$env:COMPUTERNAME
            runner_session=$session
            current_go_executable=$go.Source
            current_go_version=$ver
            go_env_version=$gov
            go_env_toolchain=$tool
            go_env_root=$goRoot
            installed_known_paths=$available
            native_acceptance_executable_ran=$false
            settings_changed=$false
            task_created=$false
            service_changed=$false
            installer_launched=$false
            git_source_touched=$false
          }|ConvertTo-Json -Compress -Depth 6))
      - name: Check current input-desktop and cursor accessibility read-only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113'){
            throw 'KTRADE_INPUT_DESKTOP_SCOPE_REFUSED'
          }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class KtradeInputDesktopReadOnly {
            [StructLayout(LayoutKind.Sequential)] public struct P { public int X; public int Y; }
            [DllImport("user32.dll",SetLastError=true)] public static extern bool GetCursorPos(out P pos);
            [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr OpenInputDesktop(uint flags,bool inherit,uint access);
            [DllImport("user32.dll",SetLastError=true)] public static extern bool CloseDesktop(IntPtr handle);
            [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr GetThreadDesktop(uint threadId);
            [DllImport("kernel32.dll")] public static extern uint GetCurrentThreadId();
            [DllImport("user32.dll",CharSet=CharSet.Unicode,SetLastError=true)]
            public static extern bool GetUserObjectInformation(IntPtr handle,int index,StringBuilder name,uint count,out uint needed);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            public static string Name(IntPtr h){
              if(h==IntPtr.Zero)return "UNAVAILABLE";
              var b=new StringBuilder(128); uint needed;
              if(!GetUserObjectInformation(h,2,b,(uint)(b.Capacity*2),out needed))return "NAME_UNAVAILABLE";
              return b.ToString();
            }
            public static string[] Snapshot(){
              P p; bool cp=GetCursorPos(out p);int last=Marshal.GetLastWin32Error();
              IntPtr handle=OpenInputDesktop(0,false,1);int openLast=Marshal.GetLastWin32Error();
              string inputName=Name(handle),threadName=Name(GetThreadDesktop(GetCurrentThreadId()));
              if(handle!=IntPtr.Zero)CloseDesktop(handle);
              return new[]{
                cp?"CURSOR_OK":"CURSOR_ERROR_"+last.ToString(),
                handle!=IntPtr.Zero?"INPUT_OPEN_OK":"INPUT_OPEN_ERROR_"+openLast.ToString(),
                "INPUT_DESKTOP_"+inputName, "THREAD_DESKTOP_"+threadName,
                GetForegroundWindow()!=IntPtr.Zero?"FOREGROUND_PRESENT":"FOREGROUND_UNAVAILABLE"
              };
            }
          }
          '@
          $data=[KtradeInputDesktopReadOnly]::Snapshot()
          Write-Host ('KTRADE_PR253_INPUT_DESKTOP='+(@{
            schema='ktrade.pr253.input-desktop-readonly.v1'
            host=$env:COMPUTERNAME
            runner=$env:RUNNER_NAME
            session=[Diagnostics.Process]::GetCurrentProcess().SessionId
            desktop_checks=@($data)
            changed_desktop=$false
            changed_mouse=$false
            changed_display=$false
            started_app=$false
            scheduled_task_created=$false
            service_changed=$false
          }|ConvertTo-Json -Compress -Depth 4))
      - name: Qualify pinned Go 1.26.10 in disposable cache without user-profile changes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/ktrade-pr253-owner-native-readonly-20261113' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB' -or
             $env:RUNNER_OS -cne 'Windows') {
            throw 'KTRADE_PINNED_GO_QUALIFIER_SCOPE_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('ktrade-go12610-once-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root -ErrorAction Stop|Out-Null
          $gotVersion=$false
          try{
            $env:GOTOOLCHAIN='go1.26.10'
            $env:GOPATH=Join-Path $root 'gopath'
            $env:GOMODCACHE=Join-Path $root 'gomodcache'
            $env:GOCACHE=Join-Path $root 'buildcache'
            $PSNativeCommandUseErrorActionPreference=$false
            $version=@(& go.exe version 2>&1|ForEach-Object{[string]$_})
            $code=$LASTEXITCODE
            $goLine=($version|Where-Object{$_ -match '^go version ' }|Select-Object -First 1)
            $gotVersion=($code -eq 0 -and [string]$goLine -match '^go version go1\.26\.10 ')
            Write-Host ('KTRADE_PR253_PINNED_GO_ISOLATED='+(@{
              schema='ktrade.pr253.pinned-go-toolchain-disposable.v1'
              host=$env:COMPUTERNAME
              runner=$env:RUNNER_NAME
              version_readback=if($gotVersion){[string]$goLine}else{'VERSION_UNAVAILABLE'}
              go_version_exact=$gotVersion
              cached_under_runner_temp=$true
              installed_system_go_modified=$false
              user_profile_go_cache_modified=$false
              other_service_modified=$false
              native_application_started=$false
              display_modified=$false
              scheduler_created=$false
            }|ConvertTo-Json -Compress -Depth 4))
          }finally{
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }
          if(!$gotVersion){throw 'KTRADE_PINNED_GO_TOOLCHAIN_UNAVAILABLE_ON_THIS_RUNNER'}
