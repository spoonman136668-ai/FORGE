name: MP-AI #147 exact quote synthetic research contract original Windows probe
on:
  push:
    branches: [qualification/mpai-sourcecards-original-windows-20261028]
    paths: ['.github/workflows/mpai147-exact-quote-synthetic.yml']
permissions:
  contents: read
jobs:
  mpai147-targeted:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 7
    steps:
      - name: Verify exact candidate and synthetic test with no production writes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE') { throw 'MPAI147_RUNNER_MISMATCH' }
          $scratch = Join-Path $env:RUNNER_TEMP ('mpai147-readonly-' + $env:GITHUB_RUN_ID)
          $repo = Join-Path $scratch 'source'
          try {
            if(Test-Path -LiteralPath $scratch) { throw 'MPAI147_SCRATCH_COLLISION' }
            New-Item -ItemType Directory -Path $scratch -ErrorAction Stop | Out-Null
            & git clone --quiet --single-branch --branch proposal/mpai-evidence-sufficiency-20261028 https://github.com/spoonman136668-ai/Mind-Palace.git $repo
            if($LASTEXITCODE -ne 0) { throw 'MPAI147_PRIVATE_CLONE_FAILURE' }
            $expected = '26bacd4e81988474b0faca7dc5cf4663963bb634'
            if((& git -C $repo rev-parse HEAD).Trim() -cne $expected) { throw 'MPAI147_SOURCE_DRIFT' }
            $hash = 'fecf51aa59bd24bfac0c852d53f88c88e6d7c9c1de6848e6c1bab5f45a3c9742'
            $store = Join-Path $repo '.ice/records.json'
            if((Get-FileHash -Algorithm SHA256 $store).Hash.ToLowerInvariant() -cne $hash) { throw 'MPAI147_CURATED_DRIFT' }
            Push-Location $repo
            try {
              & python -B -m unittest discover -s tests -p test_mpai_evidence_sufficiency.py -v
              if($LASTEXITCODE -ne 0) { throw 'MPAI147_SYNTHETIC_TEST_FAIL' }
              Write-Output 'MPAI147_ORIGINAL_WINDOWS_SYNTHETIC_TEST=PASS'
              & python -B -m py_compile agentic/mpai_evidence_sufficiency.py tests/test_mpai_evidence_sufficiency.py
              if($LASTEXITCODE -ne 0) { throw 'MPAI147_SYNTAX_FAIL' }
              if((Get-FileHash -Algorithm SHA256 $store).Hash.ToLowerInvariant() -cne $hash) { throw 'MPAI147_STORE_MUTATION' }
              if(@(& git status --porcelain --untracked-files=all).Count -ne 0) { throw 'MPAI147_WORKTREE_MUTATION' }
              Write-Output 'MPAI147_EXACT_SOURCE_AND_NO_WRITES=PASS'
              Write-Output 'MPAI147_MODEL_CALLS=0'
              Write-Output 'MPAI147_HOLDOUT_FIRST_USE=NOT_RUN'
              Write-Output 'MPAI147_SCIENCE_COMPOSE=NO_GO'
            } finally { Pop-Location }
          } finally {
            if(Test-Path -LiteralPath $scratch) { Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction Stop }
          }
