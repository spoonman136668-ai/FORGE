name: FORGE F139 V39 original Windows ACTION_RUNS GET classification once
# One owner-authenticated GET diagnostic, no original task or SQLite access.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  actions: read
concurrency:
  group: forge-f139-v39-original-actions-get-once
  cancel-in-progress: false
jobs:
  original-owner-actions-provider-readonly:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'spoonman136668-ai' &&
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.event.issue.number == 807 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-V39-ACTIONS-GET-DIAG ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 10
    steps:
      - name: Checkout exact protected source without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare bounded issue comment and Actions GET provider outcomes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: .
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
              $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
              $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or
              $env:OPENAI_API_KEY) {
            throw 'F139_V39_OWNER_EVENT_NOT_AUTHORIZED'
          }
          $head=(& git rev-parse HEAD | Out-String).Trim()
          $dirty=@(& git status --porcelain --untracked-files=all)
          $guard=(& git rev-parse 'HEAD:f139/nci04_v41_hybrid_forward_owner_profile.py' | Out-String).Trim()
          $original=(& git rev-parse 'HEAD:.github/workflows/f139-v38-original-task-snapshot-once.yml' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or
              $head -cne $env:GITHUB_SHA -or
              $dirty.Count -ne 0 -or
              $guard -cne '9bda78341bc3651e8b7b0a24ea6c7858dbff05c6' -or
              $original -cne '6857bf5c81d9662f7cf26f4a07eb59e463ac8253') {
            throw 'F139_V39_SOURCE_OR_ORIGINAL_OWNER_GUARD_CHANGED'
          }
          $ev=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $required='F139-V39-ACTIONS-GET-DIAG '+$env:GITHUB_SHA+' 6892377331'
          if ($ev.action -cne 'created' -or
              [string]$ev.comment.body -cne $required -or
              $ev.comment.author_association -cne 'OWNER' -or
              $ev.comment.user.login -cne 'spoonman136668-ai' -or
              $ev.sender.login -cne 'spoonman136668-ai') {
            throw 'F139_V39_FRESH_OWNER_COMMENT_REQUIRED'
          }
          & python -B -m f139.nci04_v39_actions_get_diagnostic
          if ($LASTEXITCODE -ne 0) {
            throw 'F139_V39_PROVIDER_DIAGNOSTIC_FAIL_CLOSED'
          }
