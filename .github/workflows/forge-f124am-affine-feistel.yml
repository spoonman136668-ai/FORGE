            if ((Get-FileHash -LiteralPath $s.path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $s.sha) {
              throw 'F124AM_ORIGINAL_SOURCE_RAW_SHA_DRIFT'
            }
          }
          $out=Join-Path $env:RUNNER_TEMP 'f124am-noisy-affine-feistel-one-packed.json'
          & python3 -B nativeevidence/f124am_development_evidence.py --o $sources[0].path --t $sources[1].path --u $sources[2].path --w $sources[3].path --x $sources[4].path --y $sources[5].path --z $sources[6].path --aa $sources[7].path --ab $sources[8].path --ac $sources[9].path --ad $sources[10].path --ae $sources[11].path --af $sources[12].path --ag $sources[13].path --ah $sources[14].path --ai $sources[15].path --aj $sources[16].path --ak $sources[17].path --al $sources[18].path --output $out
          if ($LASTEXITCODE -ne 0) { throw 'F124AM_NOISY_AFFINE_FEISTEL_DEV_FAILED' }
          $r=Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($r.schema -cne 'forge.research.f124am.authentic-affine-feistel-noisy-and-one-packed-margin.v1' -or
              $r.freeze_git_blob -cne '64481a7c1077e8ae8aafee723ca63d3f33f298a1' -or
              $r.parent_AL_raw_sha256 -cne 'd9e68ab7ad37518224811033251be20e49f0c6c40bee9030c25ad075c67d2720' -or
              $r.lanes.Count -ne 2 -or
              -not $r.frozen_TRAIN_before_first_DEV -or
              -not $r.all_demo_noise_symmetrical -or
              -not $r.feistel_outside_Gf2_hypothesis_class -or
              -not $r.no_DEV_tuning -or -not $r.no_protected_first_use -or
              $r.independent_science_acceptance -or $r.optimizer_promotion -or
              $r.production -or $r.accepted_ref_mutations -ne 0 -or
              $r.extra_retained_state -or $r.matched_hardware_superiority_claim -or
              $r.TRAIN_Ygg_grid.Count -ne 3 -or
              $r.TRAIN_Wing_grid.Count -ne 5) {
            throw 'F124AM_SCIENTIFIC_STATE_OR_FIRST_USE_QUALIFICATION'
          }
          foreach ($lane in $r.lanes) {
            foreach ($period in @($lane.TRAIN,$lane.DEV)) {
              if ($period.paired_source_count -ne 48 -or
                  $period.source_validation.valid_positive -ne 48 -or
                  $period.source_validation.valid_negative -ne 48 -or
                  $period.source_validation.old_equality_positive_paths -ne 0 -or
                  $period.source_validation.affine_pairs -ne 24 -or
                  $period.source_validation.feistel_pairs -ne 24 -or
                  $period.source_validation.noisy_tasks -ne 48 -or
                  $period.source_validation.true_operator_available_in_model) {
                throw 'F124AM_FRESH_NOISY_OUT_OF_CLASS_SOURCE_FAIL'
              }
              foreach ($arm in $period.models.PSObject.Properties) {
                $n=if ($arm.Name -ceq 'strong_fixed_shallow') {24} else {48}
                if ($arm.Value.pairs -ne $n -or
                    $arm.Value.unsupported -ne (48-$n) -or
                    $arm.Value.cases.Count -ne $n -or
                    $arm.Value.max_retained -gt 9 -or
                    ($lane.lane -ceq 'Yggdrasil' -and $arm.Value.max_active -gt 7) -or
                    ($lane.lane -ceq 'Wingless' -and $arm.Name -ceq 'gamma_selected' -and
                     ($arm.Value.max_active -gt 64 -or
                      $arm.Value.max_states_per_node -ne 1 -or
                      $arm.Value.max_bits_per_state -ne 12))) {
                  throw 'F124AM_HISTORIC_HARD_STATE_OR_DENOMINATOR'
                }
                foreach ($fam in $arm.Value.family.PSObject.Properties) {
                  if (($fam.Value.pairs+$fam.Value.unsupported) -ne 12) {
                    throw 'F124AM_FROZEN_STRUCTURAL_FAMILY_INCOMPLETE'
                  }
                }
              }
            }
            if ($lane.lane -ceq 'Wingless') {
              if ($lane.resources.equal_hardware_superiority_claim -or
                  -not $lane.resources.model_plus_example_learner_no_oracle -or
                  @($lane.resources.arms.PSObject.Properties).Count -ne 3) {
                throw 'F124AM_COMPUTE_SUPERIORITY_NOT_ESTABLISHED'
              }
              foreach ($a in $lane.resources.arms.PSObject.Properties) {
                if ($a.Value.graphs -ne 24 -or $a.Value.timed_calls -ne 72 -or
                    $a.Value.median_ns -le 0 -or $a.Value.median_peak_bytes -le 0) {
                  throw 'F124AM_COST_MEASUREMENT_MISSING'
                }
              }
              Write-Output "F124AM_WING_VERIFIED=new:$($lane.DEV.models.gamma_selected.paired)/48;baseline:$($lane.DEV.models.gamma_0_AK.paired)/48;strict:$($lane.strict_win)"
            } else {
              Write-Output "F124AM_YGG_VERIFIED=new:$($lane.DEV.models.learned_affine.paired)/48;oracle:$($lane.DEV.models.oracle_original_AG.paired)/48;support:$($r.selected.Yggdrasil.count)"
            }
          }
          $sha=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($out+'.sha256'),$sha+'  f124am-noisy-affine-feistel-one-packed.json'+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          Write-Output "F124AM_RAW_SHA256=$sha"
      - uses: actions/upload-artifact@v4
        with:
          name: f124am-new-affine-feistel-development-${{ github.sha }}
