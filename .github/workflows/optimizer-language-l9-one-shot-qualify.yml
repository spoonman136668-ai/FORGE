name: L9 one-shot protected audit runner synthetic qualification
on:
  push:
    branches: [research/optimizer-language-l9-webnlg-transfer-20261023]
    paths:
      - '.github/workflows/optimizer-language-l9-one-shot-qualify.yml'
permissions:
  contents: read
concurrency:
  group: l9-one-shot-no-audit-20261024
  cancel-in-progress: false
jobs:
  fail-closed-one-shot-synthetic:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Exact frozen source custody and synthetic-only one-shot negative tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'b9f3fe615bd7bee02e93d874765054902da62100'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/optimizer-language-l9-one-shot-qualify.yml'
          p=research/optimizer_language_l9
          test "$(git rev-parse HEAD:$p/l9_first_use_one_shot.py)" = '4df23fd86435bba094909dd90a17bda8575d8ba8'
          test "$(git rev-parse HEAD:$p/test_l9_first_use_one_shot.py)" = '093f1510377f53dd2cce625d50ea13e0570d718e'
          test "$(git rev-parse HEAD:$p/l9_first_use_source_pipeline.py)" = 'b26ea752197d027a43822dd499896054eb10413a'
          test "$(git rev-parse HEAD:$p/l9_first_use_scoring_core.py)" = '484172758201699fe3ef5481cda03b9ea8e6d0ab'
          test "$(git rev-parse HEAD:$p/l9_audit_pre_admission.py)" = 'cb69fafb9f1d7db51c49f0dcf6ca228630b78893'
          test "$(git rev-parse HEAD:$p/L9_AUDIT_ADMISSION_CONTRACT.json)" = 'b5b51c1cc954830374cbf1d667c57fb5e31a8827'
          test "$(git rev-parse HEAD:$p/l9_model_suite.py)" = '710ce648a30ffc55647f689c5f4aa3ac13b07066'
          test "$(git rev-parse HEAD:$p/l9_split_builder.py)" = '79aa0384fe3fb220e83efdaf0f87d468a076b735'
          test "$(git rev-parse HEAD:$p/l9_neural_select_only.py)" = '91f8108af5e6f3a25e2a8ca07dc3674bd2358f4e'
          test "$(git rev-parse HEAD:$p/l9_transformer_select_reuse_v2.py)" = 'e934b48ea1ab8df3c1f65554b02d240b0c57f811'
          test "$(git rev-parse HEAD:$p/L9_SPLIT_RECEIPT.json)" = 'ca3e41e2835713bc922c56542656489f202c55cf'
          python -m py_compile "$p/l9_first_use_one_shot.py" "$p/test_l9_first_use_one_shot.py"
          (cd "$p" && python -m unittest -v test_l9_first_use_one_shot.py test_l9_first_use_source_pipeline.py test_l9_first_use_scoring_core.py test_l9_audit_pre_admission.py)
          python -c 'import pathlib,shutil; [shutil.rmtree(x) for x in pathlib.Path("research/optimizer_language_l9").rglob("__pycache__")]'
          test -z "$(git status --porcelain)"
          echo L9_ONE_SHOT_SYNTHETIC_GUARDS=PASS
          echo L9_AUDIT_REFERENCE_FIRST_USE=NOT_PERFORMED
          echo L9_OFFICIAL_TEST_UNUSED=TRUE
          echo L9_SCIENTIFIC_GO=FALSE
