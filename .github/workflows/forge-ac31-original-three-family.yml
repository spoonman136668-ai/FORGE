name: AC31 original Farama genuine-mission native three-family development
on:
  pull_request:
    paths:
      - 'research/lcrm01/ac31_*'
      - 'research/lcrm01/test_ac31_*'
      - 'docs/research/AC-31-*'
      - '.github/workflows/forge-ac31-original-three-family.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-source-preflight:
    name: AC31 frozen source-only native contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Read only exact head research protocol
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Standard-library static original source prereg
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail closed before any original Farama source reset
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/lcrm01/ac31_ci.sh)" = 9ccf20b393dd4007f4e2004b1960d2624d5f4ad4
          test "$(git hash-object research/lcrm01/ac31_original_multifamily.py)" = b7165de69b2dfb4f3467f169faa68d37be5ed6f1
          test "$(git hash-object research/lcrm01/ac31_frozen_original_worlds.json)" = 9c5eb6179581cc8fd57f756c805cb630eb0a55ed
          test "$(git hash-object research/lcrm01/ac31_native_go_bridge.go)" = dcd5d876a024f0089d8572290a4d995098e73034
          test "$(git hash-object research/lcrm01/ac31_original_compare.py)" = 0c67f596c929fea7294487f5b96ee923afd2503e
          test "$(git hash-object research/lcrm01/test_ac31_frozen_preflight.py)" = f36dcf4c58ea31af403bdc9fdb219774a4b35947
          python -B -m unittest discover -s research/lcrm01 -p 'test_ac31_frozen_preflight.py' -v
          echo AC31_ORIGINAL_GENUINE_MISSION_SOURCE_PREREG_AND_PREEXECUTION_BOTH_OS=PASS

  exact-source-two-process:
    name: AC31 two independent original Farama three-family processes
    runs-on: ubuntu-latest
    needs: original-source-preflight
    timeout-minutes: 90
    steps:
      - name: Checkout exactly prequalified original protocol head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python original-source runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Go original independent Wingless native compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Pinned original Farama source real selected-action development
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/lcrm01/ac31_ci.sh)" = 9ccf20b393dd4007f4e2004b1960d2624d5f4ad4
          bash research/lcrm01/ac31_ci.sh
      - name: Preserve original successes and real blocked source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ac31-authentic-original-3family-native-five-arm-evidence
          path: |
            ${{ runner.temp }}/ac31/first.json
            ${{ runner.temp }}/ac31/first.log
            ${{ runner.temp }}/ac31/second.json
            ${{ runner.temp }}/ac31/second.log
            ${{ runner.temp }}/ac31/comparison.json
          retention-days: 30
          if-no-files-found: warn
