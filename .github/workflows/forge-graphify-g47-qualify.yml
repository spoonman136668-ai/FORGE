name: FORGE Qualify G46 G47 private Graphify source-only
on:
  push:
    branches: [qualification/graphify-g47-private-readonly-20261019]
permissions:
  contents: read
concurrency:
  group: forge-graphify-g47-private-one-shot
  cancel-in-progress: false
jobs:
  graphify-source-only-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      K_TERM_SHA: '9f63f2a6c15672acee2a89eaf5434621fb69a313'
      K_TERMINAL_EXECUTION_MODE: PAPER
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Identify isolated FORGE GitHub-hosted job
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce no research or workstation execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "spoonman136668-ai/FORGE"
          test "$GITHUB_REF" = "refs/heads/qualification/graphify-g47-private-readonly-20261019"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = "Windows"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 8b7bf1d42cb0b72c74f1221410a648edf8138870 HEAD
          test "$(git diff --name-only 8b7bf1d42cb0b72c74f1221410a648edf8138870 HEAD)" = ".github/workflows/forge-graphify-g47-qualify.yml"
          test -z "$(git status --porcelain)"
          echo FORGE_GRAPHIFY_ISOLATED_GITHUB_HOSTED=PASS
      - name: Read exact private K-Terminal source with existing FORGE read-only token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: 9f63f2a6c15672acee2a89eaf5434621fb69a313
          path: kterminal-private
          # G35 prove_sources compares an immutable historical base blob;
          # shallow depth=1 omits it and cannot qualify the source ancestry.
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Focused G46 G47 source and Chromium checks without private log export
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = Windows
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          test "$(git rev-parse HEAD)" = "$K_TERM_SHA"
          test -z "$(git config --local --get http.https://github.com/.extraheader || true)"
          for key in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then echo G47_BROKER_CREDENTIAL_ENV_BLOCKED; exit 2; fi
          done
          run_private(){
            label="$1"; shift
            if "$@" > "$RUNNER_TEMP/forge-graphify-g47-private-last.log" 2>&1; then
              echo "$label=PASS"
            else
              echo "$label=FAILED"
              grep -Eo 'G(2[0-9]|3[0-9]|4[0-9])_[A-Z0-9_]+' "$RUNNER_TEMP/forge-graphify-g47-private-last.log" | sort -u | head -12 || true
              exit 1
            fi
          }
          run_private G47_PYTHON_COMPILE python -m py_compile tools/graphify/g35_unify.py tools/graphify/g35_browser_check.py tools/graphify/build_symbol_map.py
          run_private G47_JS_SYNTAX node --check tools/graphify/symbol_navigation_ui.js
          run_private G47_AST_NAV_SELFTEST python tools/graphify/build_symbol_map.py --self-test
          run_private G47_OVERLAY_SELFTEST python tools/graphify/g35_unify.py --self-test
          run_private G47_AST_CALL_NEGATIVES go run tools/graphify/g44_ast_call_witness.go --self-test
          run_private G47_INSTALL_BROWSER python -m pip install --disable-pip-version-check playwright==1.56.0
          run_private G47_SYNTHETIC_ACTUAL_CHROMIUM python tools/graphify/g35_browser_check.py --fixture --evidence "$RUNNER_TEMP/g47-fixture-evidence"
          echo G47_FOCUSED_CHROMIUM_QUALIFIED=PASS
      - name: Generate source-only Graphify real atlas and compiler overlays
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$K_TERM_SHA"
          run_private(){
            label="$1"; shift
            if "$@" > "$RUNNER_TEMP/forge-graphify-g47-private-last.log" 2>&1; then echo "$label=PASS";
            else echo "$label=FAILED"; grep -Eo 'G(2[0-9]|3[0-9]|4[0-9])_[A-Z0-9_]+' "$RUNNER_TEMP/forge-graphify-g47-private-last.log" | sort -u | head -12 || true; exit 1; fi
          }
          mkdir -p "$RUNNER_TEMP/graphify-wheel" "$RUNNER_TEMP/g47-g30"
          run_private G47_GRAPHIFY_PINNED_DOWNLOAD python -m pip download --disable-pip-version-check --no-cache-dir --index-url https://pypi.org/simple --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/graphify-wheel" graphifyy==0.9.92
          python - <<'PY'
          import hashlib,os,pathlib
          wheel=pathlib.Path(os.environ["RUNNER_TEMP"])/"graphify-wheel/graphifyy-0.9.92-py3-none-any.whl"
          found=hashlib.sha256(wheel.read_bytes()).hexdigest()
          expected="9722846e627a369150107dd792145c3e3a53e3d3da46f7a7bff9f96b75da857c"
          if found != expected:
              raise SystemExit("GRAPHIFY_WHEEL_SHA256_MISMATCH actual="+found)
          print("G47_GRAPHIFY_DISTRIBUTION_SHA=PASS")
          PY
          run_private G47_GRAPHIFY_PINNED_INSTALL python -m pip install "$RUNNER_TEMP/graphify-wheel/graphifyy-0.9.92-py3-none-any.whl"
          run_private G47_GRAPHIFY_CODE_ONLY_EXTRACT graphify extract . --code-only --max-workers 2
          run_private G47_GRAPHIFY_LOCAL_COMMUNITIES graphify cluster-only .
          # Original Graphify file-catalog consumer requires the exact-bound
          # source manifest generated in the full K-Terminal workflow.
          {
            printf 'repository=Kboomllc/K-Terminal\n'
            printf 'source_sha=%s\n' "$K_TERM_SHA"
            printf 'graphify_version=0.9.92\n'
            printf 'graphify_wheel_sha256=9722846e627a369150107dd792145c3e3d3da46f7a7bff9f96b75da857c\n'
            printf 'extraction=code-only\n'
            printf 'labeling=no-llm\n'
          } > graphify-out/source-manifest.txt
          run_private G47_FILE_CATALOG python tools/graphify/build_file_catalog.py graphify-out
          run_private G47_SYMBOL_GRAPH python tools/graphify/build_symbol_map.py graphify-out
          for pkg in internal/consumedwire internal/reportstore cmd/chart-history; do
            name="${pkg//\//_}"
            run_private "G47_COMPILER_${name}" go run tools/graphify/g30_type_calls.go --root . --sha "$K_TERM_SHA" --package "./$pkg" --out "$RUNNER_TEMP/g47-g30/$name.json"
          done
          run_private G47_INTERPACKAGE_COMPILER go run tools/graphify/g31_interpackage_calls.go --root . --sha "$K_TERM_SHA" --out "$RUNNER_TEMP/g47-g31.json"
          test "$(git rev-parse b55453ffeefe97ce847940eeb17fa85e0ab395a4)" = "b55453ffeefe97ce847940eeb17fa85e0ab395a4" || { echo G47_G35_FROZEN_ANCESTRY_NOT_FETCHED; exit 1; }
          run_private G47_G35_EXACT_ATLAS_OVERLAY python tools/graphify/g35_unify.py --g30-raw "$RUNNER_TEMP/g47-g30" --g31-raw "$RUNNER_TEMP/g47-g31.json" --atlas graphify-out --source-sha "$K_TERM_SHA"
          run_private G47_REAL_AST_WITNESS go run tools/graphify/g44_ast_call_witness.go --root . --sha "$K_TERM_SHA" --input graphify-out/SYMBOL_MAP.json --out "$RUNNER_TEMP/g47-ast-witness.json"
          python - <<'PY'
          import json,os,pathlib
          sha=os.environ["K_TERM_SHA"]
          idx=json.loads(pathlib.Path("graphify-out/SYMBOL_MAP.json").read_text())
          witness=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"g47-ast-witness.json").read_text())
          assert idx["summary"]["source_sha"]==sha
          assert idx["summary"]["source_linked_symbols"] >= 1000
          assert len(idx["type_aware"]["calls"]) >= 5
          assert idx["type_aware"]["summary"]["unresolved_target_promotions"]==0
          assert witness["source_sha"]==sha
          assert witness["verified_unresolved"]==idx["type_aware"]["summary"]["unresolved"]
          assert witness["invented_target_edges"]==0 and witness["runtime_calls_observed"]==0
          print("G47_REAL_SOURCE_AST_AND_COMPILER_CUSTODY=PASS")
          PY
      - name: Verify actual offline Chromium on the original full real-source atlas
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          if python tools/graphify/g35_browser_check.py --atlas graphify-out/KTERMINAL_SYMBOLS.html --sha "$K_TERM_SHA" --evidence "$RUNNER_TEMP/g47-real-evidence" > "$RUNNER_TEMP/g47-browser-private.log" 2>&1; then
            echo G47_REAL_CHROMIUM_BROWSER=PASS
          else
            echo G47_REAL_CHROMIUM_BROWSER=FAILED
            grep -Eo 'G(2[0-9]|3[0-9]|4[0-9])_[A-Z0-9_]+' "$RUNNER_TEMP/g47-browser-private.log" | sort -u | head -12 || true
            exit 1
          fi
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"g47-real-evidence/G35_BROWSER_RECEIPT.json"
          x=json.loads(p.read_text())
          assert x["source_sha"]==os.environ["K_TERM_SHA"]
          for k in ("g42_no_invented_links","g42_bounded_pagination_verified",
                    "g46_exact_file_drilldown_verified","g46_scope_clear_verified",
                    "g46_no_target_navigation_verified",
                    "g47_exact_incoming_source_declaration_verified",
                    "g47_file_origin_not_function_attributed"):
            assert x[k] is True,k
          assert x["external_requests"]==0 and x["trading_execution"] is False
          print("G46_EXACT_FILE_NAVIGATION=PASS")
          print("G47_EXACT_DECLARATION_INCOMING=PASS")
          print("G47_REAL_SOURCE_OFFLINE=PASS")
          print("FORGE_PRIVATE_SOURCE_EXPORTED=FALSE")
          print("FORGE_RESEARCH_RUNNER_USED=FALSE")
          PY
