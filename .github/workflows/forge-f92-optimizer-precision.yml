name: FORGE F92 six-arm precision feasibility guard
on:
  push:
    branches: [engineering/f92-optimizer-power-feasibility-20261016-r1]
    paths:
      - 'optimizerstages/f92_*'
      - '.github/workflows/forge-f92-optimizer-precision.yml'
  pull_request:
    branches: [main]
    paths:
      - 'optimizerstages/f92_*'
      - '.github/workflows/forge-f92-optimizer-precision.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: forge-f92-optimizer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  optimizer-precision-math:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Authenticate existing FORGE F91 engineering source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api --method GET repos/spoonman136668-ai/FORGE/actions/runs/38962995679 > "$RUNNER_TEMP/f92-f91-original.json"
          python3 - "$RUNNER_TEMP/f92-f91-original.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["id"]==38962995679
          assert r["repository"]["full_name"]=="spoonman136668-ai/FORGE"
          assert r["head_sha"]=="714413a8696369593568e4227bf1f5c0cf66919d"
          assert r["name"]=="FORGE F91 frozen prospective policy outcome contrast qualification"
          assert r["status"]=="completed" and r["conclusion"]=="success"
          print("F92_AUTHENTIC_F91_SOURCE_QUALIFICATION=PASS")
          print("F92_PROSPECTIVE_SCIENTIFIC_ORIGINALS=NOT_ESTABLISHED")
          PY
      - name: Strict source-only mathematical power and tampering tests
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -run '^TestF92' -v ./optimizerstages
          go test -count=1 ./optimizerstages ./dreamrsi ./evoportfolio ./thetaadapt ./promptlineage ./genenv
          go vet ./optimizerstages
          echo 'F92_FIVE_POINT_MARGIN_UNDER_16384_CAP=NOT_RESOLVABLE_BY_F91_HOEFFDING_BOUND'
          echo 'F92_PROSPECTIVE_TRIAL_EXECUTION=ZERO'
          echo 'F92_INDEPENDENT_SCIENTIFIC_ACCEPTANCE=ZERO'
          echo 'F92_DREAM_PARETO_PROMOTION=DENIED'
          echo 'F92_THETAEVOLVE_ACCEPTED_TRAINING=DENIED'
          echo 'F92_CLOUDFLARE_WRITES=ZERO'
      - name: Full FORGE source test and build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo 'F92_OPTIMIZER_PRECISION_QUALIFICATION=PASS'
