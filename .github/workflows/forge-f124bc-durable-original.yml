name: F124-BC append-only original scientific raw evidence archival
on:
  push:
    branches: [research/f124bc-public-xor-closure-20261018]
    paths: ['.github/workflows/forge-f124bc-durable-original.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: f124bc-single-original-append-only-receipt
  cancel-in-progress: false
jobs:
  original-archive:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39165921813
          github-token: ${{ github.token }}
          name: f124bc-original-public-closure-ten-arm-fit-screen-b01bb8f81f7b71882bdfdb4c7f10ca81b1a3e85e
          path: original
      - name: Authenticate provider first-use and append original bytes ONLY to feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'research/f124bc-public-xor-closure-20261018'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39165921813" --jq '[.head_sha,.status,.conclusion,.event] | join(" ")')" = 'b01bb8f81f7b71882bdfdb4c7f10ca81b1a3e85e completed success push'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39165921813/artifacts" --jq '.artifacts[] | select(.id==12149764717 and .expired==false) | .digest')" = 'sha256:4d46afc39f507f9d3f8e1377a4235210c1a8f59a2eb5a1aae93dec86a50ed112'
          echo '66170e899274d84c00a075f30fb11375532079d87f065a756c3b1289b125dd83  original/f124bc-original-fit-screen.json' | sha256sum --check --strict
          dest='reference/research-intake/originals/f124bc-original-public-closure-ten-arm-fit-screen.json'
          if gh api "repos/$GITHUB_REPOSITORY/contents/$dest?ref=$GITHUB_REF_NAME" --silent >/dev/null 2>&1; then
            echo F124BC_APPEND_ONLY_ORIGINAL_ALREADY_EXISTS
            exit 1
          fi
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          test "$remote_sha" = "$GITHUB_SHA" || { echo 'F124BC_FEATURE_BRANCH_DRIFT_STOP'; exit 1; }
          python3 -B - <<'PY'
          import json
          d=json.load(open('original/f124bc-original-fit-screen.json'))
          assert d['schema']=='forge.research.f124bc.original-model-independent-public-closure-TRAIN.v1'
          assert d['source_freeze_blob']=='54722a665859b92d4d46b23133469012511db6e2'
          assert d['FIT_selected_before_held_SCREEN'] is None
          assert d['FIT_control_paired']==10
          assert d['SCREEN_models']['joint_balanced48']['paired']==24
          assert d['SCREEN_models']['public_closure_balanced4']['paired']==24
          assert all(x['public_response_calls']==1152 for x in d['SCREEN_models'].values())
          assert d['SCREEN_strict_frozen_joint_success'] is False
          assert d['FIT_models']['joint_random48']['FP']==0
          assert d['SCREEN_models']['joint_random48']['FP']==0
          assert all(not row['public_closure_veto_applied'] for arm in d['FIT_models'].values() for row in arm['case_outcomes'] if row.get('public_CHECK_veto_applied') is not None)
          assert all(not row['public_closure_veto_applied'] for arm in d['SCREEN_models'].values() for row in arm['case_outcomes'] if row.get('public_CHECK_veto_applied') is not None)
          assert d['Ygg_DEV_generated']==d['Wingless_DEV_generated']==0
          assert d['Ygg_DEV_consumed'] is False and d['Wingless_DEV_consumed'] is False
          assert len(d['FIT_models'])==len(d['SCREEN_models'])==10
          print('F124BC_FULL_ORIGINAL_SOURCE_NEGATIVE_AUTHENTICATED=PASS')
          PY
          # A 335 KB original exceeds OS argument-size limits when passed as -f.
          # Pipe immutable encoded bytes through a temporary JSON request body.
          python3 -B - <<'PY'
          import base64,json,os
          original=open("original/f124bc-original-fit-screen.json","rb").read()
          request={
              "message":"F124-BC append original unmodified authenticated 10-arm public closure TRAIN FIT SCREEN case evidence",
              "content":base64.b64encode(original).decode("ascii"),
              "branch":os.environ["GITHUB_REF_NAME"]}
          with open("/tmp/f124bc-original-append-request.json","w",encoding="utf-8") as f:
              json.dump(request,f,separators=(",",":"))
          print("F124BC_ORIGINAL_RAW_REQUEST_READY=PASS")
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$dest" \
            --input /tmp/f124bc-original-append-request.json \
            --jq '[.commit.sha,.content.sha] | join(" ")'
          echo F124BC_ORIGINAL_RAW_LONGTERM_REPOSITORY_ARCHIVED=PASS
          echo F124BC_NO_SCIENTIFIC_PROMOTION=true
