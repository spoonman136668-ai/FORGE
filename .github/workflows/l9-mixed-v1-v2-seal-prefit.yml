name: L9 mixed V1 GRU V2 Transformer actual pinned numerical seal
on:
  pull_request:
    branches: [research/optimizer-language-l9-webnlg-transfer-20261023]
permissions:
  contents: read
  actions: read
concurrency:
  group: l9-mixed-v1-v2-seal-prefit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  static-dev-seal-fail-closed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fail on original model/role/selector drift or unrelated delta
        shell: bash
        run: |
          set -euo pipefail
          parent=3b94e666d97c67a585fa2be2518a173ae14c4824
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git rev-parse HEAD:research/optimizer_language_l9/l9_model_suite.py)" = 710ce648a30ffc55647f689c5f4aa3ac13b07066
          test "$(git rev-parse HEAD:research/optimizer_language_l9/l9_neural_select_only.py)" = 91f8108af5e6f3a25e2a8ca07dc3674bd2358f4e
          test "$(git rev-parse HEAD:research/optimizer_language_l9/l9_seal_select.py)" = af06d6671954b9e8c5cf23c720e5efa89d919528
          git diff --name-only "$parent" HEAD | python -B -c 'import sys; a=set(sys.stdin.read().splitlines()); b={"research/optimizer_language_l9/l9_mixed_v1_v2_seal.py","research/optimizer_language_l9/test_l9_mixed_v1_v2_seal.py",".github/workflows/l9-mixed-v1-v2-seal-prefit.yml"}; assert a==b,(a,b)'
      - name: Validate frozen source inputs and both approved real receipts
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/optimizer_language_l9 -p test_l9_mixed_v1_v2_seal.py -v
          python -B -m unittest discover -s research/optimizer_language_l9 -p test_l9_seal_select.py -v
          python - <<'PY'
          import sys
          sys.path.insert(0,'research/optimizer_language_l9')
          import l9_mixed_v1_v2_seal as mixed
          import l9_seal_select as original
          assert mixed.V2_RECEIPTS[1701]=='d17ffdf04aa8c38a77d23baab2d68219183a599ace8e920aab0cf0f89e83d539'
          assert mixed.V2_RECEIPTS[1702]=='e7da6758df045fbbfdff4b4b024fafcc886bd5a6c309f9d4b35a85cf163f9c3f'
          assert original.SELECT_SCHEMA!=mixed.V2_SCHEMA
          assert original.SCHEMA!=mixed.SCHEMA
          assert mixed.ROLE_SHA=='b9995c1846f5e1d99bf8bc4083dde0ebb41140906284bcf050a7ed6fe0efe726'
          print('L9_MIXED_V1_V2_PREFIT=PASS_ALL_ORIGINAL_RECEIPTS_PINNED')
          print('L9_ORIGINAL_V1_SEAL_UNCHANGED=TRUE')
          print('L9_AUDIT_DEV_CONSUMED=FALSE')
          print('L9_SCIENTIFIC_GO=FALSE')
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Download original five immutable GitHub artifacts, then seal numeric decision only
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP" <<'PY'
          import hashlib,io,json,os,pathlib,sys,urllib.parse,urllib.request,zipfile
          root=pathlib.Path(sys.argv[1]);receipt=root/'l9-authenticated-mixed-inputs'
          receipt.mkdir(exist_ok=False)
          neural=receipt/'neural';neural.mkdir()
          manifest=[
            (12539318731,'262cec449479b429fb04e93b304237a131209294f405813796b3477bd89b80ec',
             'l9-train-select-candidate.json','01f08870677067ca0f0dcfdff004d1ef04cea8465da0d025f904634e2bcd5d47',
             'candidate.json'),
            (12541361319,'8f78cbcecb899f98cbed89ceda4b4e659c61fbc12d7ed685bf65182777c7cae9',
             'l9-gru-select-1701.json','762d7471d0e3f7b24f8789c6b323624f0c86996614d477b5f354651ba19d5474',
             'neural/GRU_SEQ2SEQ-1701.json'),
            (12541590196,'7567051cc25308a3c9b1ab240a6e33a18a3179d180944631fe3ff9e61859e817',
             'l9-gru-select-1702.json','511ad147152fd7e45eab915da2bdd74d2872a50cc6b4a20fe4ab9c5b677bc1e6',
             'neural/GRU_SEQ2SEQ-1702.json'),
            (12552199545,'3a1500bf731d7075634d7babef4b2d027598886672c03ad6251ba099018b5572',
             'l9-transformer-recovered-v2-1701.json','d17ffdf04aa8c38a77d23baab2d68219183a599ace8e920aab0cf0f89e83d539',
             'neural/SMALL_TRANSFORMER-1701.json'),
            (12549494626,'cd6081d42cb514bf5f489e737a9a3ca80c3aefd63b416b619ed488c6dbea7b00',
             'l9-transformer-recovered-v2-1702.json','e7da6758df045fbbfdff4b4b024fafcc886bd5a6c309f9d4b35a85cf163f9c3f',
             'neural/SMALL_TRANSFORMER-1702.json'),
          ]
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,hdrs,newurl):
              redir=super().redirect_request(req,fp,code,msg,hdrs,newurl)
              assert redir is not None
              old=urllib.parse.urlsplit(req.full_url);new=urllib.parse.urlsplit(newurl)
              assert new.scheme=='https','INSECURE_ARTIFACT_REDIRECT'
              if (old.scheme,old.netloc)!=(new.scheme,new.netloc):
                redir.remove_header('Authorization')
              return redir
          opener=urllib.request.build_opener(SafeRedirect())
          for artifact_id,zipsha,name,inner_sha,dest in manifest:
            url=f'https://api.github.com/repos/spoonman136668-ai/FORGE/actions/artifacts/{artifact_id}/zip'
            request=urllib.request.Request(url,headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'L9-Mixed-Seal-Frozen-Custody-Only'})
            data=opener.open(request,timeout=120).read()
            assert hashlib.sha256(data).hexdigest()==zipsha,('ARCHIVE_DRIFT',artifact_id)
            with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert archive.namelist()==[name],('MEMBERS_DRIFT',artifact_id,archive.namelist())
              raw=archive.read(name)
            assert hashlib.sha256(raw).hexdigest()==inner_sha,('INNER_DRIFT',artifact_id)
            destpath=receipt/dest
            assert not destpath.exists(),('RECEIPT_OVERWRITE',dest)
            destpath.write_bytes(raw)
            print('L9_AUTHENTICATED_ARTIFACT_SHA256='+str(artifact_id)+' '+inner_sha)
          print('L9_ALL_FIVE_ORIGINAL_IMMUTABLE_RECEIPTS_VERIFIED=TRUE')
          PY
          python -B research/optimizer_language_l9/l9_mixed_v1_v2_seal.py \
            --candidate-receipt "$RUNNER_TEMP/l9-authenticated-mixed-inputs/candidate.json" \
            --neural-receipts-dir "$RUNNER_TEMP/l9-authenticated-mixed-inputs/neural" \
            --out "$RUNNER_TEMP/l9-mixed-v1-v2-dev-seal.json"
          python - "$RUNNER_TEMP/l9-mixed-v1-v2-dev-seal.json" <<'PY'
          import hashlib,json,sys
          raw=open(sys.argv[1],'rb').read();r=json.loads(raw)
          assert r['schema']=='forge.optimizer.language.l9.mixed-gru-v1-transformer-v2-select-seal-v1'
          assert len(r['neural_checkpoint_selection'])==4
          assert all(row['selected_epoch']==12 for row in r['neural_checkpoint_selection'])
          assert [row['requested_content_proxy_coverage'] for row in r['neural_checkpoint_selection']]==[0.012713936,0.010268949,0.0,0.0]
          assert [row['receipt_type'] for row in r['neural_checkpoint_selection']]==[
              'ORIGINAL_FROZEN_V1','ORIGINAL_FROZEN_V1',
              'SEPARATELY_QUALIFIED_RECOVERY_V2_NOT_V1',
              'SEPARATELY_QUALIFIED_RECOVERY_V2_NOT_V1']
          assert r['all_four_choices_complete'] and not r['original_v1_select_seal_complete']
          assert not r['audit_dev_references_consumed'] and not r['official_test_consumed']
          assert not r['scientific_go'] and not r['independent_semantic_transfer_proven']
          print('L9_AUTHENTICATED_MIXED_V1_V2_FOUR_CHOICE_SELECTION=PASS')
          print('L9_MIXED_SELECTION_RECEIPT_SHA256='+hashlib.sha256(raw).hexdigest())
          print('L9_AUDIT_DEV_UNCONSUMED=TRUE')
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: l9-mixed-four-choice-dev-seal-${{ matrix.os }}
          path: ${{ runner.temp }}/l9-mixed-v1-v2-dev-seal.json
          if-no-files-found: ignore
