name: Mind-Palace UQ37 bounded selected-source intake poll
# This schedule has no effect until explicitly reviewed and merged to FORGE main.
# FORGE supplies an existing isolated Windows runner, not scientific/research authority.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mind-palace-uq37-guarded-source-poll
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 15
    steps:
      - name: Inspect reviewed Mind-Palace source queue, no private data export
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: 'Never'
          GH_PROMPT_DISABLED: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){
            throw 'UQ37_RUNNER_IDENTITY_MISMATCH'
          }
          Remove-Item Env:GH_TOKEN,Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $privateRepo = 'https://github.com/spoonman136668-ai/Mind-Palace.git'
          $expectedToolBlob = 'efee36f895d9163f68cd88b372b27897557a1e6f'
          $root = Join-Path $env:RUNNER_TEMP ('mp37-poll-' + $env:GITHUB_RUN_ID)
          $stdout = Join-Path $env:RUNNER_TEMP ('mp37-poll-' + $env:GITHUB_RUN_ID + '.out')
          $stderr = Join-Path $env:RUNNER_TEMP ('mp37-poll-' + $env:GITHUB_RUN_ID + '.err')
          $native = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\Modules'
          if(-not (Test-Path -LiteralPath $native -PathType Container)){throw 'UQ37_PS_NATIVE_MODULES_UNAVAILABLE'}
          $env:PSModulePath = $native + [IO.Path]::PathSeparator + $env:PSModulePath
          $psExe = (Get-Command powershell.exe -ErrorAction Stop).Source
          $guard = @('.ice/records.json','.ice/source-ledger.json','archive/index.json',
            '.ice/remote-bootstrap.json','.ice/remote-catalog.json','.ice/remote-index.ndjson',
            '.ice/chat-delta-state.json','.ice/project-state-capsules.json','.ice/project-dependency-graph.json')
          function Assert([bool]$ok,[string]$reason){if(-not $ok){throw ('UQ37_POLL_STOP_'+$reason)}}
          function Sha256([string]$path){
            $s=[IO.File]::OpenRead($path);$h=[Security.Cryptography.SHA256]::Create()
            try {return ([BitConverter]::ToString($h.ComputeHash($s))).Replace('-','').ToLowerInvariant()}
            finally {$h.Dispose();$s.Dispose()}
          }
          if(Test-Path -LiteralPath $root){throw 'UQ37_SCRATCH_ALREADY_PRESENT'}
          if((Test-Path -LiteralPath $stdout) -or (Test-Path -LiteralPath $stderr)){throw 'UQ37_LOG_ALREADY_PRESENT'}
          try {
            $beforeRemote = @(& git.exe ls-remote --exit-code $privateRepo refs/heads/main)
            Assert ($LASTEXITCODE -eq 0 -and $beforeRemote.Count -eq 1) 'PRIVATE_REF_UNAVAILABLE'
            $mainHead = ([string]$beforeRemote[0] -split '\s+')[0]
            & git.exe clone --quiet --depth 1 --single-branch --branch main $privateRepo $root
            Assert ($LASTEXITCODE -eq 0) 'PRIVATE_CLONE_FAILED'
            Assert ((& git.exe -C $root rev-parse HEAD | Out-String).Trim() -ceq $mainHead) 'MAIN_MOVED_DURING_CHECKOUT'
            $tool = Join-Path $root 'tools/guarded-unattended-intake.ps1'
            $queue = Join-Path $root 'policies/guarded-chat-source-queue.json'
            Assert ((& git.exe -C $root hash-object -- $tool | Out-String).Trim() -ceq $expectedToolBlob) 'ENGINE_SOURCE_DRIFT_NOT_APPROVED'
            Assert (Test-Path -LiteralPath $queue -PathType Leaf) 'QUEUE_UNAVAILABLE'
            $stateBefore = @{}
            foreach($path in $guard){$stateBefore[$path]=Sha256 (Join-Path $root $path)}
            $argsForChild = @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass',
              '-File',('"'+$tool+'"'),'inspect','-QueuePath',('"'+$queue+'"'),'-MaxSources','1')
            $p=Start-Process -FilePath $psExe -ArgumentList $argsForChild -WorkingDirectory $root -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Assert ($p.ExitCode -eq 0) ('SOURCE_INSPECTION_FAILED_EXIT_'+$p.ExitCode)
            $raw=[IO.File]::ReadAllText($stdout)
            $result=$raw | ConvertFrom-Json -ErrorAction Stop
            Assert ([string]$result.schema -ceq 'mind-palace.guarded-chat-source-queue-result.v1') 'RESULT_SCHEMA'
            Assert ([bool]$result.durable_state_unchanged -and [int]$result.production_memory_writes -eq 0 -and
              [int]$result.source_ledger_writes -eq 0 -and [int]$result.paid_model_invocations -eq 0 -and
              -not [bool]$result.automatic_background_discovery -and
              -not [bool]$result.automatic_production_updates) 'NO_WRITE_BOUNDARY_VIOLATED'
            Assert ([int]$result.inspected_count -le 1) 'INSPECTION_BUDGET_EXCEEDED'
            foreach($path in $guard){Assert ((Sha256 (Join-Path $root $path)) -ceq $stateBefore[$path]) ('DURABLE_DRIFT_'+$path)}
            Assert (@(& git.exe -C $root status --porcelain=v1 --untracked-files=all).Count -eq 0) 'CHECKOUT_DIRTY'
            $afterRemote = @(& git.exe ls-remote --exit-code $privateRepo refs/heads/main)
            Assert ($LASTEXITCODE -eq 0 -and $afterRemote.Count -eq 1 -and
              (([string]$afterRemote[0] -split '\s+')[0]) -ceq $mainHead) 'MAIN_REF_DRIFT'
            if([int]$result.inspected_count -eq 0){
              Write-Host 'UQ37_EMPTY_AUTHORIZED_QUEUE=IDLE'
            } else {
              $state = [string]$result.items[0].disposition
              Assert (@('skip_known','ready_for_authorized_preparation') -contains $state) 'UNSUPPORTED_DISPOSITION'
              Write-Host ('UQ37_BOUNDED_SOURCE_DISPOSITION='+$state)
            }
            Write-Host 'UQ37_NINE_PROTECTED_HASHES_AND_MAIN_REF_STABLE=PASS'
            Write-Host 'UQ37_PRODUCTION_MEMORY_WRITES=0'
            Write-Host 'UQ37_CODEX_AND_PAID_INFERENCE=0'
            Write-Host 'UQ37_SCHEDULED_READONLY_INSPECTION=PASS'
          } finally {
            if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue}
            if(Test-Path -LiteralPath $stdout){Remove-Item -LiteralPath $stdout -Force -ErrorAction SilentlyContinue}
            if(Test-Path -LiteralPath $stderr){Remove-Item -LiteralPath $stderr -Force -ErrorAction SilentlyContinue}
          }
