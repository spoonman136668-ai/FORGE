name: FORGE K-Terminal P7-I/X matched observer-pair controls
on:
  push:
    branches: [qualification/kterminal-p7ix-observer-pair-controls-20261019]
permissions:
  contents: read
  actions: read
concurrency:
  group: forge-kterminal-p7ix-${{ github.sha }}
  cancel-in-progress: false

jobs:
  matched-original-windows-controls:
    runs-on: windows-2022
    timeout-minutes: 46
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '4'
      GOFLAGS: '-p=1'
      GOMEMLIMIT: '1536MiB'
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Credential-free checkout of public FORGE control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed on source drift and disallowed runner class
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/FORGE
          test "$GITHUB_REF" = refs/heads/qualification/kterminal-p7ix-observer-pair-controls-20261019
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Windows
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 8b7bf1d42cb0b72c74f1221410a648edf8138870 HEAD
          git diff --name-only 8b7bf1d42cb0b72c74f1221410a648edf8138870 HEAD | sort > "$RUNNER_TEMP/p7ix-actual"
          printf '%s\n' '.github/workflows/forge-kterminal-p7ix-matched-controls.yml' 'tools/qualification/kterminal_p7ix_controlled_comparison.py' | sort > "$RUNNER_TEMP/p7ix-allowed"
          diff -u "$RUNNER_TEMP/p7ix-allowed" "$RUNNER_TEMP/p7ix-actual"
          test -z "$(git status --porcelain)"
          test "$GOMAXPROCS" = 4
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          test "$K_TERMINAL_P5_LATENCY" = 0
          test "$K_TERMINAL_NATIVE_TIMING" = 0
          echo P7IX_FORGE_HOSTED_EXCLUSIVE=PASS
      - name: Read frozen K-Terminal source via read-only FORGE_KTERM_QUAL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: ba11a398586df9fe5233624d9cf115aeec76d11a
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Authenticate suite failure evidence without raw logs
        uses: actions/download-artifact@v4
        with:
          name: forge-kterminal-p7iu-39301561797
          run-id: 39301561797
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p7iu-previous
      - name: Authenticate focused control evidence without raw logs
        uses: actions/download-artifact@v4
        with:
          name: forge-kterminal-p7iv-39315197440
          run-id: 39315197440
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p7iv-previous
      - name: Authenticate reproduced observer-pair failure evidence
        uses: actions/download-artifact@v4
        with:
          name: forge-kterminal-p7iw-39318410400
          run-id: 39318410400
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p7ix-pair-previous
      - name: Provision pinned Go 1.26.5 Windows
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Match isolated observer, paired observer and optional isolated recovery
        shell: bash
        working-directory: kterminal-private
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Windows
          test "$(git rev-parse HEAD)" = ba11a398586df9fe5233624d9cf115aeec76d11a
          test "$(git rev-parse HEAD:pkg/stage3-original-observer-forced-cuts_test.go)" = bee85ee3441b0f66399ab6c42f8b09635ba44c6b
          test "$(git rev-parse HEAD:pkg/stage3-native-authenticated-sell-post-crash_test.go)" = 8fc5727f722510b2bfff0cfe9d4eb0565c6cb5fc
          test "$(git rev-parse HEAD:go.mod)" = b3ede0d8444c08b3e7b23f1396374359b54134c6
          test -z "$(git status --porcelain)"
          go version | grep 'go1.26.5 windows/amd64' >/dev/null
          for key in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET; do
            if [[ -n "$(printenv "$key" 2>/dev/null || true)" ]]; then
              echo P7IX_BROKER_CREDENTIAL_ENV_PRESENT
              exit 2
            fi
          done
          python -B ../tools/qualification/kterminal_p7ix_controlled_comparison.py
      - name: Retain only sanitized SHA-256 evidence, not private test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-kterminal-p7ix-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p7ix-sanitized/receipt.json
            ${{ runner.temp }}/p7ix-sanitized/receipt.sha256
          retention-days: 30
          if-no-files-found: warn
