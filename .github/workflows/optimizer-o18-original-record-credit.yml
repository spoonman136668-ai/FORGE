name: Optimizer O18 original per-record reward credit memory
on:
  push:
    branches: [research/optimizer-o18-original-record-credit-20261023]
permissions:
  contents: read
jobs:
  native-original-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 27
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 55
          persist-credentials: false
      - name: Immutable protocol-FIRST ancestry and six additive O18 files
        shell: bash
        run: |
          set -euo pipefail
          first=3f0e4a58404ab5d8ed260017b1a3f11737afea0d
          parent=1f8ebc965b84bd858a32bc12abae12e4f889f842
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/optimizer_o18/O18_FIRST_PROTOCOL.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;actual=set(sys.stdin.read().splitlines()); expected={"research/optimizer_o18/O18_FIRST_PROTOCOL.md","research/optimizer_o18/model.py","research/optimizer_o18/test_sourcefree.py","research/optimizer_o18/runner.py","research/optimizer_o18/compare.py",".github/workflows/optimizer-o18-original-record-credit.yml"};assert actual==expected,(actual,expected)'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: proroklab/popgym
          ref: 410d5aa626dae8024f498354d8781a0d1870c399
          path: external/popgym-original
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install exact source-only original POPGym dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p o18-evidence
          timeout 170s python -m pip install --no-cache-dir --timeout 30 --retries 1 'numpy==1.26.4' 'gymnasium==0.29.1' >o18-evidence/install.log 2>&1
      - name: SOURCE-FREE frozen causal eligibility, memory and seed tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/optimizer_o18/test_sourcefree.py 2>&1 | tee o18-evidence/pre-original-source-tests.log
      - name: Genuine original POPGym episodes and 117504 legal original steps
        shell: bash
        run: |
          set -euo pipefail
          python -B research/optimizer_o18/runner.py --upstream external/popgym-original --out o18-evidence
      - name: One final complete public FORGE regression Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
      - name: Preserve original source evidence including valid scientific negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-o18-original-public-${{ matrix.os }}
          path: o18-evidence/
          retention-days: 30
  independent-cross-os:
    needs: [native-original-source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: optimizer-o18-original-public-*
          path: original-evidence
          merge-multiple: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Independently reconcile source roles, 1152 FIT, 864 DEV and 36 reward scalars
        shell: bash
        run: |
          set -euo pipefail
          python -B research/optimizer_o18/compare.py \
            original-evidence/optimizer-o18-original-public-ubuntu-24.04/o18-original-source-actual-reward-receipt.json \
            original-evidence/optimizer-o18-original-public-windows-2025/o18-original-source-actual-reward-receipt.json \
            o18-cross-os-reconciliation.json
      - uses: actions/upload-artifact@v4
        with:
          name: optimizer-o18-cross-os-public-reconciliation
          path: o18-cross-os-reconciliation.json
          retention-days: 30
