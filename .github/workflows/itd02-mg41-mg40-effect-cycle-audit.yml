name: ITD-02 MG41 source-authenticated exposed MG40 reversible action-effect loop audit
on:
  push:
    branches: [research/itd02-mg41-exposed-mg40-reversible-action-loop-audit-20261029]
permissions:
  contents: read
  actions: read
jobs:
  frozen-source-only-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact LF source settings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout unchanged pinned MG40 parent plus MG41 diagnostic only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify source lineage and all original policy binaries remain untouched
        shell: pwsh
        run: |
          git merge-base --is-ancestor 881e41e71e51c39ebbe427ecdf99d7b845e19f03 $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'MG41_AUDIT_METRIC_FREEZE_NOT_BEFORE_EXECUTABLE' }
          $changed=@(git diff --name-only a39c7224debbe16077bbd88e84116d8d9dde827d $env:GITHUB_SHA)
          $expected=@('research/lcrm01/mg41_mg40_public_effect_cycles_prereg.json',
            'research/lcrm01/mg41_mg40_public_effect_cycles.py',
            '.github/workflows/itd02-mg41-mg40-effect-cycle-audit.yml')
          if (@(Compare-Object $changed $expected).Count -ne 0) { throw 'MG41_UNAUTHORIZED_MODEL_OR_SOURCE_CHANGE' }
          python -B research/lcrm01/mg40_action_precondition_dev.py --preflight
          if ($LASTEXITCODE -ne 0) { throw 'MG41_MG40_INHERITED_PREFLIGHT_FAIL' }
          python -B research/lcrm01/mg41_mg40_public_effect_cycles.py --preflight
          if ($LASTEXITCODE -ne 0) { throw 'MG41_DIAGNOSTIC_PREFLIGHT_FAIL' }
          if (git status --porcelain --untracked-files=all) { throw 'MG41_SOURCE_NOT_CLEAN' }
          Write-Host MG41_FROZEN_READONLY_AUDIT_CROSS_HOST_SOURCE_PREFLIGHT_PASS_NO_SCIENCE
  pinned-exposed-source-only-audit:
    needs: frozen-source-only-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact LF source settings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download exact immutable original MG40 evidence archive, no new world action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mg41"
          curl --fail --silent --show-error --location --max-time 120 --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/spoonman136668-ai/FORGE/actions/artifacts/12933106228/zip" \
            --output "$RUNNER_TEMP/mg41/mg40-immutable.zip"
          test "$(stat -c%s "$RUNNER_TEMP/mg41/mg40-immutable.zip")" -lt 12000000
          printf '%s  %s\n' 112e485ccadc8f395264dbf9b490773b8c5add3382cdb3b234405eca427995e7 "$RUNNER_TEMP/mg41/mg40-immutable.zip" | sha256sum --check --status
          echo MG41_ORIGINAL_EXPOSED_ARCHIVE_BYTE_CUSTODY_PASS
      - name: Audit original MG40 selected public pickup/drop cycles and target encounter loss
        shell: bash
        run: |
          set -euo pipefail
          python -B research/lcrm01/mg41_mg40_public_effect_cycles.py \
            --archive "$RUNNER_TEMP/mg41/mg40-immutable.zip" \
            --output "$RUNNER_TEMP/mg41/report.json" \
            > "$RUNNER_TEMP/mg41/diagnostic.log"
          grep -F 'MG41_MG40_EXPOSED_SELECTED_REVERSIBLE_EFFECT_CYCLE_AUDIT_PASS_NO_SCIENCE' "$RUNNER_TEMP/mg41/diagnostic.log"
          grep -F 'MG41_ORIGINAL_MG40_DUAL_PROCESS_SOURCE_CUSTODY_PASS' "$RUNNER_TEMP/mg41/diagnostic.log"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo MG41_EXPOSED_SOURCE_ONLY_AUDIT_COMPLETE_NO_FARAMA_ACTION_OR_SCIENTIFIC_FIRST_USE
      - name: Upload compact original-source validated diagnostic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mg41-mg40-original-reversible-effect-cycles-audit
          path: |
            ${{ runner.temp }}/mg41/report.json
            ${{ runner.temp }}/mg41/diagnostic.log
          if-no-files-found: warn
          retention-days: 30
