name: Mass Research K4F FIT learning and unfamiliar-task DEV
on:
  push:
    branches: [research/mass-lcrm01-k4f-experience-to-action-20261024]
permissions:
  contents: read
jobs:
  actual-public-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Frozen real action-learning and strong matched control study
        run: bash research/lcrm01/k4f_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-k4f-original-fitted-and-unfamiliar-public-development
          path: |
            ${{ runner.temp }}/k4f/first-use-public-dev.json
            ${{ runner.temp }}/k4f/first-use-public-dev.log
          if-no-files-found: warn
          retention-days: 90
