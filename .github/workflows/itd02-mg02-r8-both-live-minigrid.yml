name: ITD-02 MG02 authentic MiniGrid Wingless Go R8 and Yggdrasil local-cell R1
on:
  push:
    branches:
      - research/itd02-mg02-wingless-r8-paired-original-minigrid-20261028
permissions:
  contents: read
jobs:
  original-farama-go-r8-and-ygg-cell-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Original source Unix Git eol policy
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact-source checkout without saved GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Python 3.11 original MG01 environment runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original Wingless R8 native Go compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Verify unchanged Farama and actual native model source then execute both
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash research/lcrm01/mg02_ci.sh
      - name: Preserve both full authentic original processes and fail-closed errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-mg02-farama-wingless-r8-ygg-r1-public-native
          path: |
            ${{ runner.temp }}/mg02/first.json
            ${{ runner.temp }}/mg02/second.json
            ${{ runner.temp }}/mg02/comparison.json
            ${{ runner.temp }}/mg02/first.log
            ${{ runner.temp }}/mg02/second.log
          if-no-files-found: warn
          retention-days: 30
