name: F124-P frozen structural ablations cross-source
on:
  push:
    branches: [research/f124p-frozen-structural-ablations-20261017]
    paths:
      - 'reference/research-intake/f124p-structural-ablation-freeze.json'
      - 'nativeevidence/f124p_*.py'
      - 'nativeevidence/test_f124p_*.py'
      - '.github/workflows/forge-f124p-structural-ablations.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: f124p-frozen-ablations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frozen-source-and-variants:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen original source, public cohorts and single structural deltas
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if ($IsWindows) {'python'} else {'python3'}
          if ((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'F124P_WORKTREE_IDENTITY' }
          & $py -B -m unittest discover -s nativeevidence -p 'test_f124p_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F124P_FOCUSED_TESTS' }
          & $py -B -m unittest discover -s nativeevidence -p 'test_f124o_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F124P_PARENT_MODEL_TESTS' }
          & $py -B isolationguard/check.py
          if ($LASTEXITCODE -ne 0) { throw 'F124P_ISOLATION' }
          Write-Output 'F124P_PROTECTED_FIRST_USE=false'

  independently-authenticated-development:
    needs: frozen-source-and-variants
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify authentic original F124-O run and artifact custody
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $run=(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/39078269441" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or
              $run.head_sha -cne '5b52da1e38d5ff5671c582676790daf0462dd18d' -or
              $run.status -cne 'completed' -or $run.conclusion -cne 'success' -or
              $run.event -cne 'push') { throw 'F124P_ORIGINAL_RUN_CUSTODY' }
          $artifacts=(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/39078269441/artifacts" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'F124P_ORIGINAL_ARTIFACT_LIST' }
          $match=@($artifacts.artifacts | Where-Object {
              "$($_.id)" -ceq '12116979526' -and
              $_.name -ceq 'f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d' })
          if ($match.Count -ne 1 -or $match[0].expired -or
              $match[0].digest -cne 'sha256:fefa2135a029660f36970a66b08809aaa128c5f6d2b3c5705ef8a29a9b4f014c') {
            throw 'F124P_ORIGINAL_ARTIFACT_CUSTODY'
          }
          Write-Output 'F124P_GITHUB_RUN_AND_ARTIFACT_CUSTODY=PASS'
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39078269441
          github-token: ${{ github.token }}
          name: f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d
          path: original-f124o
      - name: Immutable weights; original, two ablations, candidate on both public sources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $receipt='original-f124o/f124o-independent-two-learned-development.json'
          if ((Get-FileHash $receipt -Algorithm SHA256).Hash.ToLowerInvariant() -cne
              '025c97abc8eb69079d7d7d0f59bfdb81235b9ad9ab83e230f32b542d2cfbdb5d') {
            throw 'F124P_WEIGHT_OR_EVIDENCE_IDENTITY_DRIFT'
          }
          $out=Join-Path $env:RUNNER_TEMP 'f124p-immutable-dual-source-ablations.json'
          & python3 -B nativeevidence/f124p_structural_diagnostics.py --f124o-receipt $receipt --output $out
          if ($LASTEXITCODE -ne 0) { throw 'F124P_DEVELOPMENT_PROVENANCE_OR_EVALUATION' }
          $r=Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($r.schema -cne 'forge.research.f124p.source-qualified-frozen-structural-ablation.v1' -or
              $r.preimplementation_freeze_git_blob -cne 'f0b0be02fd0ee6baef77f17ed66fd9cd1ca045ae' -or
              $r.model_training_steps -ne 0 -or $r.lanes.Count -ne 2 -or
              $r.protected_first_use -or $r.scientific_acceptances -ne 0 -or
              $r.optimizer_promotions -ne 0 -or $r.accepted_ref_mutations -ne 0 -or
              $r.codex_calls -ne 0 -or $r.paid_api_calls -ne 0 -or
              $r.resource_matched_superiority_proven -or $r.original_protected_examples_generated -ne 0) {
            throw 'F124P_AUTHORITY_OR_METHOD_DRIFT'
          }
          foreach ($lane in $r.lanes) {
            if ($lane.studies.Count -ne 2 -or -not $lane.development_only -or
                -not $lane.candidate_declared_before_scoring) { throw 'F124P_LANE_STUDY_DRIFT' }
            foreach ($s in $lane.studies) {
              if ($s.pairs -ne 48 -or $s.exact_paired -ne 48 -or $s.role_only_paired -ne 0 -or
                  $s.depth.'7'.pairs -ne 16 -or $s.depth.'8'.pairs -ne 16 -or
                  $s.depth.'9'.pairs -ne 16 -or $s.arms.PSObject.Properties.Count -ne 4) {
                throw 'F124P_CASE_DENOMINATOR_OR_CONTROL_DRIFT'
              }
              foreach ($a in $s.arms.PSObject.Properties) {
                if ($a.Value.case_sha256.Count -ne 48 -or
                    $a.Value.depth.'7'.pairs -ne 16 -or
                    $a.Value.depth.'8'.pairs -ne 16 -or
                    $a.Value.depth.'9'.pairs -ne 16) { throw 'F124P_ARM_DENOMINATOR' }
              }
              Write-Output "F124P_MEASURE=$($lane.lane):$($s.source):original=$($s.arms.original.paired)/48 candidate=$($s.arms.candidate.paired)/48 fixed=$($s.fixed.paired)/48"
            }
          }
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($out+'.sha256'),$sha+'  f124p-immutable-dual-source-ablations.json'+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          Write-Output "F124P_REPORT_SHA256=$sha"
      - uses: actions/upload-artifact@v4
        with:
          name: f124p-qualified-development-${{ github.sha }}
          path: |
            ${{ runner.temp }}/f124p-immutable-dual-source-ablations.json
            ${{ runner.temp }}/f124p-immutable-dual-source-ablations.json.sha256
          retention-days: 90
          if-no-files-found: error

  final-full-regression:
    needs: independently-authenticated-development
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Single required full integration / race / vet / build
        shell: bash
        run: |
          set -euo pipefail
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
          echo "F124P_EXACT_HEAD=$GITHUB_SHA"
          echo "F124P_SCIENTIFIC_PROMOTION=false"
