name: K-Terminal RC2-M2 exact failed predecessor attribution
on:
  push:
    branches: [diagnostics/kterminal-original-local-preflight-20261019]
    paths: [.github/workflows/kt-rc2m2-failed-predecessors.yml]
permissions:
  contents: read
concurrency:
  group: kterm-rc2m2-failed-predecessors-20261020
  cancel-in-progress: false
jobs:
  bounded-exact-predecessor-attribution:
    runs-on: windows-latest
    timeout-minutes: 16
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOFLAGS: '-p=1'
      GOMAXPROCS: '2'
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
    steps:
      - name: Checkout existing FORGE diagnosis tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read-only checkout of original native tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: eb5d225ae73b698a59c68d840daf1ec678e1a0ec
          path: kt-original
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Read-only checkout of PR73 native tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: b8c2052d530cdff93462dfccc21b28f3824e5531
          path: kt-candidate
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Pin original Go 1.26.5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Validate isolated execution identity and deny broker credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/FORGE
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git -C kt-original rev-parse HEAD)" = eb5d225ae73b698a59c68d840daf1ec678e1a0ec
          test "$(git -C kt-candidate rev-parse HEAD)" = b8c2052d530cdff93462dfccc21b28f3824e5531
          test -z "$(git -C kt-original status --porcelain)"
          test -z "$(git -C kt-candidate status --porcelain)"
          go version | grep -F 'go1.26.5 windows/amd64'
          test "$K_TERMINAL_EXECUTION_MODE" = PAPER
          for n in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET; do test -z "${!n:-}"; done
          echo KTERM_RC2M2_ORIGINAL_AND_CANDIDATE_IDENTITIES=PASS
      - name: Repeat exact 24-predecessor group and retain failing test identities
        shell: bash
        run: |
          set -euo pipefail
          python -B qualification/kterminal/rc2m2_failed_predecessors.py \
            kt-original kt-candidate "$RUNNER_TEMP/kt-rc2m2-evidence"
          echo KTERM_RC2M2_TWO_SECOND_LIMIT=UNCHANGED
          echo KTERM_RC2M2_ASSERTIONS=UNCHANGED
          echo KTERM_RC2M2_RELEASE=BLOCKED
      - name: Retain bounded test names and pass-fail evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kterm-rc2m2-failing-test-identity-${{ github.run_id }}
          path: ${{ runner.temp }}/kt-rc2m2-evidence/rc2m2-redacted.json
          retention-days: 20
          if-no-files-found: warn
