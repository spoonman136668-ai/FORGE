name: Optimizer L9 model contract prefit qualification
on:
  push:
    branches: [research/optimizer-language-l9-webnlg-transfer-20261023]
    paths:
      - '.github/workflows/optimizer-language-l9-model-prefit.yml'
permissions:
  contents: read
concurrency:
  group: optimizer-language-l9-model-prefit
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      suite_blob: ${{ steps.q.outputs.suite_blob }}
      tests_blob: ${{ steps.q.outputs.tests_blob }}
      contract_blob: ${{ steps.q.outputs.contract_blob }}
      receipt_blob: ${{ steps.q.outputs.receipt_blob }}
      gru_params: ${{ steps.q.outputs.gru_params }}
      transformer_params: ${{ steps.q.outputs.transformer_params }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 4
      - id: q
        name: Qualify frozen model suite without L9 fitting
        shell: bash
        run: |
          set -euo pipefail
          parent='ef32052abc77785ac5db4594828174a80c6a0e7c'
          test "$(git rev-parse HEAD~1)" = "$parent"
          test "$(git diff --name-only "$parent" HEAD)" = '.github/workflows/optimizer-language-l9-model-prefit.yml'
          root='research/optimizer_language_l9'
          suite="$root/l9_model_suite.py"
          tests="$root/test_l9_model_suite.py"
          contract="$root/L9_MODEL_CONTRACT.json"
          receipt="$root/L9_MODEL_IMPLEMENTATION_RECEIPT.json"
          split="$root/L9_SPLIT_RECEIPT.json"
          test "$(git rev-parse HEAD:$suite)" = '710ce648a30ffc55647f689c5f4aa3ac13b07066'
          test "$(git rev-parse HEAD:$tests)" = '945cde3901f24c446a8dd14fe5b68b2474422424'
          test "$(git rev-parse HEAD:$contract)" = '4eab05a2b9011ebbaa34d01778e7f185807704c2'
          test "$(git rev-parse HEAD:$split)" = 'ca3e41e2835713bc922c56542656489f202c55cf'
          receipt_blob="$(git rev-parse HEAD:$receipt)"
          python -m py_compile "$suite" "$tests"
          pushd "$root" >/dev/null
          python -m unittest -v test_l9_model_suite.py
          python - <<'PY' > "$RUNNER_TEMP/l9-prefit-values"
          import ast,json,pathlib
          import l9_model_suite as m
          c=json.loads(pathlib.Path('L9_MODEL_CONTRACT.json').read_text(encoding='utf-8'))
          r=json.loads(pathlib.Path('L9_MODEL_IMPLEMENTATION_RECEIPT.json').read_text(encoding='utf-8'))
          s=json.loads(pathlib.Path('L9_SPLIT_RECEIPT.json').read_text(encoding='utf-8'))
          assert c['status']=='FROZEN_BEFORE_ANY_L9_MODEL_FIT'
          assert r['status']=='SEALED_BEFORE_ANY_L9_MODEL_FIT'
          assert r['custody']['l9_model_fit_count']==0 and r['custody']['l9_checkpoint_count']==0
          assert s['custody']['model_fit_count']==0
          assert c['required_split']['role_identity_sha256']==s['deterministic_split']['cross_os_role_identity_sha256']
          assert c['required_split']['summary_sha256']==s['deterministic_split']['cross_os_summary_sha256']
          assert m.expected_gru_parameters()==433795
          assert m.expected_transformer_parameters()==449251
          assert max(m.expected_gru_parameters(),m.expected_transformer_parameters()) <= m.PARAMETER_CEILING
          source=pathlib.Path('l9_model_suite.py').read_text(encoding='utf-8')
          tree=ast.parse(source)
          top_torch=[]
          for node in tree.body:
              if isinstance(node,ast.Import):
                  top_torch.extend(a.name for a in node.names if a.name=='torch')
              if isinstance(node,ast.ImportFrom) and node.module=='torch':
                  top_torch.append('torch')
          assert not top_torch, 'torch must remain lazy; import qualification must not instantiate models'
          assert 'build_gru_model' in source and 'build_transformer_model' in source and 'train_neural' in source
          assert 'L9_AUDIT_DEV is forbidden' in source
          print('gru_params='+str(m.expected_gru_parameters()))
          print('transformer_params='+str(m.expected_transformer_parameters()))
          print('candidate_grid='+str(len(m.CANDIDATE_GRID)))
          print('seeds='+','.join(map(str,m.MANDATORY_SEEDS)))
          print('epochs='+','.join(map(str,m.CHECKPOINT_EPOCHS)))
          PY
          popd >/dev/null
          grep -qx 'gru_params=433795' "$RUNNER_TEMP/l9-prefit-values"
          grep -qx 'transformer_params=449251' "$RUNNER_TEMP/l9-prefit-values"
          grep -qx 'candidate_grid=8' "$RUNNER_TEMP/l9-prefit-values"
          grep -qx 'seeds=1701,1702' "$RUNNER_TEMP/l9-prefit-values"
          grep -qx 'epochs=4,8,12' "$RUNNER_TEMP/l9-prefit-values"
          artifacts="$(find "$root" -type f \( -name '*.pt' -o -name '*.pth' -o -name '*.ckpt' -o -name '*.bin' \) -print)"
          test -z "$artifacts"
          test -z "$(git status --porcelain)"
          echo "suite_blob=710ce648a30ffc55647f689c5f4aa3ac13b07066" >> "$GITHUB_OUTPUT"
          echo "tests_blob=945cde3901f24c446a8dd14fe5b68b2474422424" >> "$GITHUB_OUTPUT"
          echo "contract_blob=4eab05a2b9011ebbaa34d01778e7f185807704c2" >> "$GITHUB_OUTPUT"
          echo "receipt_blob=$receipt_blob" >> "$GITHUB_OUTPUT"
          echo "gru_params=433795" >> "$GITHUB_OUTPUT"
          echo "transformer_params=449251" >> "$GITHUB_OUTPUT"
          echo 'L9_MODEL_PREFIT_LINUX_UNIT_AND_STATIC=PASS'
          echo 'L9_MODEL_PREFIT_L9_MODEL_FIT_COUNT=0'
          echo 'L9_MODEL_PREFIT_CHECKPOINT_COUNT=0'
          echo 'L9_MODEL_PREFIT_AUDIT_SELECTION_CONSUMED=FALSE'
          echo 'L9_MODEL_PREFIT_OFFICIAL_TEST_CONSUMED=FALSE'

  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      suite_blob: ${{ steps.q.outputs.suite_blob }}
      tests_blob: ${{ steps.q.outputs.tests_blob }}
      contract_blob: ${{ steps.q.outputs.contract_blob }}
      receipt_blob: ${{ steps.q.outputs.receipt_blob }}
      gru_params: ${{ steps.q.outputs.gru_params }}
      transformer_params: ${{ steps.q.outputs.transformer_params }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 4
      - id: q
        name: Qualify frozen model suite without L9 fitting
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent='ef32052abc77785ac5db4594828174a80c6a0e7c'
          if((& git rev-parse 'HEAD~1').Trim() -cne $parent){throw 'L9_PREFIT_PARENT_DRIFT'}
          $changed=@(& git diff --name-only $parent HEAD)
          if($changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/optimizer-language-l9-model-prefit.yml'){throw 'L9_PREFIT_SCOPE_DRIFT'}
          $root='research/optimizer_language_l9'
          $suite="$root/l9_model_suite.py"
          $tests="$root/test_l9_model_suite.py"
          $contract="$root/L9_MODEL_CONTRACT.json"
          $receipt="$root/L9_MODEL_IMPLEMENTATION_RECEIPT.json"
          $split="$root/L9_SPLIT_RECEIPT.json"
          if((& git rev-parse "HEAD:$suite").Trim() -cne '710ce648a30ffc55647f689c5f4aa3ac13b07066'){throw 'L9_SUITE_BLOB_DRIFT'}
          if((& git rev-parse "HEAD:$tests").Trim() -cne '945cde3901f24c446a8dd14fe5b68b2474422424'){throw 'L9_TEST_BLOB_DRIFT'}
          if((& git rev-parse "HEAD:$contract").Trim() -cne '4eab05a2b9011ebbaa34d01778e7f185807704c2'){throw 'L9_CONTRACT_BLOB_DRIFT'}
          if((& git rev-parse "HEAD:$split").Trim() -cne 'ca3e41e2835713bc922c56542656489f202c55cf'){throw 'L9_SPLIT_BLOB_DRIFT'}
          $receiptBlob=(& git rev-parse "HEAD:$receipt").Trim()
          python -m py_compile $suite $tests
          if($LASTEXITCODE -ne 0){throw 'L9_WINDOWS_COMPILE'}
          Push-Location $root
          try {
            python -m unittest -v test_l9_model_suite.py
            if($LASTEXITCODE -ne 0){throw 'L9_WINDOWS_UNIT'}
            $vals=@'
          import ast,json,pathlib
          import l9_model_suite as m
          c=json.loads(pathlib.Path("L9_MODEL_CONTRACT.json").read_text(encoding="utf-8"))
          r=json.loads(pathlib.Path("L9_MODEL_IMPLEMENTATION_RECEIPT.json").read_text(encoding="utf-8"))
          s=json.loads(pathlib.Path("L9_SPLIT_RECEIPT.json").read_text(encoding="utf-8"))
          assert c["status"]=="FROZEN_BEFORE_ANY_L9_MODEL_FIT"
          assert r["status"]=="SEALED_BEFORE_ANY_L9_MODEL_FIT"
          assert r["custody"]["l9_model_fit_count"]==0 and r["custody"]["l9_checkpoint_count"]==0
          assert s["custody"]["model_fit_count"]==0
          assert c["required_split"]["role_identity_sha256"]==s["deterministic_split"]["cross_os_role_identity_sha256"]
          assert c["required_split"]["summary_sha256"]==s["deterministic_split"]["cross_os_summary_sha256"]
          assert m.expected_gru_parameters()==433795
          assert m.expected_transformer_parameters()==449251
          assert max(m.expected_gru_parameters(),m.expected_transformer_parameters()) <= m.PARAMETER_CEILING
          source=pathlib.Path("l9_model_suite.py").read_text(encoding="utf-8")
          tree=ast.parse(source)
          top=[]
          for node in tree.body:
              if isinstance(node,ast.Import): top.extend(a.name for a in node.names if a.name=="torch")
              if isinstance(node,ast.ImportFrom) and node.module=="torch": top.append("torch")
          assert not top
          assert "L9_AUDIT_DEV is forbidden" in source
          print("L9_WINDOWS_STATIC=PASS")
          '@
            $vals | python -
            if($LASTEXITCODE -ne 0){throw 'L9_WINDOWS_STATIC'}
          } finally { Pop-Location }
          $artifacts=@(Get-ChildItem -LiteralPath $root -Recurse -File | Where-Object {$_.Extension -in @('.pt','.pth','.ckpt','.bin')})
          if($artifacts.Count -ne 0){throw 'L9_WINDOWS_CHECKPOINT_CREATED'}
          if(@(& git status --porcelain).Count -ne 0){throw 'L9_WINDOWS_DIRTY'}
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'suite_blob=710ce648a30ffc55647f689c5f4aa3ac13b07066' -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'tests_blob=945cde3901f24c446a8dd14fe5b68b2474422424' -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'contract_blob=4eab05a2b9011ebbaa34d01778e7f185807704c2' -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('receipt_blob='+$receiptBlob) -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'gru_params=433795' -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'transformer_params=449251' -Encoding utf8
          Write-Host 'L9_MODEL_PREFIT_WINDOWS_UNIT_AND_STATIC=PASS'
          Write-Host 'L9_MODEL_PREFIT_L9_MODEL_FIT_COUNT=0'
          Write-Host 'L9_MODEL_PREFIT_CHECKPOINT_COUNT=0'
          Write-Host 'L9_MODEL_PREFIT_AUDIT_SELECTION_CONSUMED=FALSE'
          Write-Host 'L9_MODEL_PREFIT_OFFICIAL_TEST_CONSUMED=FALSE'

  reconcile:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Reconcile exact model contract identities
        shell: bash
        env:
          LS: ${{ needs.linux.outputs.suite_blob }}
          WS: ${{ needs.windows.outputs.suite_blob }}
          LT: ${{ needs.linux.outputs.tests_blob }}
          WT: ${{ needs.windows.outputs.tests_blob }}
          LC: ${{ needs.linux.outputs.contract_blob }}
          WC: ${{ needs.windows.outputs.contract_blob }}
          LR: ${{ needs.linux.outputs.receipt_blob }}
          WR: ${{ needs.windows.outputs.receipt_blob }}
          LG: ${{ needs.linux.outputs.gru_params }}
          WG: ${{ needs.windows.outputs.gru_params }}
          LX: ${{ needs.linux.outputs.transformer_params }}
          WX: ${{ needs.windows.outputs.transformer_params }}
        run: |
          set -euo pipefail
          test "$LS" = "$WS"
          test "$LT" = "$WT"
          test "$LC" = "$WC"
          test "$LR" = "$WR"
          test "$LG" = "$WG"
          test "$LX" = "$WX"
          test "$LG" = '433795'
          test "$LX" = '449251'
          echo "L9_MODEL_PREFIT_SUITE_BLOB=$LS"
          echo "L9_MODEL_PREFIT_TEST_BLOB=$LT"
          echo "L9_MODEL_PREFIT_CONTRACT_BLOB=$LC"
          echo "L9_MODEL_PREFIT_RECEIPT_BLOB=$LR"
          echo "L9_MODEL_PREFIT_GRU_PARAMS=$LG"
          echo "L9_MODEL_PREFIT_TRANSFORMER_PARAMS=$LX"
          echo 'L9_MODEL_PREFIT_CROSS_OS_RECONCILIATION=PASS'
          echo 'L9_MODEL_PREFIT_L9_MODEL_FIT_COUNT=0'
