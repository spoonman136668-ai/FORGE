name: K Terminal PR83 existing cold-proof scoped open SELL order coverage
on:
  push:
    branches: [qualification/kterminal-v3-fill-report-20261108]
    paths: [.github/workflows/forge-kterminal-pr83-open-sell-coverage-20261109.yml]
permissions:
  contents: read
concurrency:
  group: kterminal-pr83-open-sells-650e49ab
  cancel-in-progress: false
jobs:
  approved-getonly:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 15
    env:
      KTERM_SHA: c5b3757f4cabbf2db3ac2879168ecc8c5660787a
      KTERM_TREE: 650e49abfc321715d30b0d69fb013d1c693901c7
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
    steps:
      - name: Enforce existing scoped runner and authorized local credential file
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-v3-fill-report-20261108' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows'){throw 'KTERM_GETONLY_RUNNER_SCOPE_REFUSED'}
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME',
              'CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET',
              'K_TERMINAL_VWAP_DIAGNOSTIC_MAX_TOTAL_USDC','K_TERMINAL_VWAP_DIAGNOSTIC_ONE_POST_LOCK')){
            if([Environment]::GetEnvironmentVariable($key)){throw 'KTERM_GETONLY_AMBIENT_CREDENTIAL_REFUSED'}
          }
          if(@(Get-Process -Name 'K-Terminal','K-Terminal-Engine' -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'KTERM_GETONLY_ACTIVE_K_TERMINAL_REFUSED'
          }
          $profilePath=[Environment]::GetFolderPath('UserProfile')
          if($profilePath -notmatch '(?i)^[A-Z]:\\Users\\[^\\]+$' -or
             $profilePath -match '(?i)\\(public|default|systemprofile)$'){
            throw 'KTERM_GETONLY_OWNER_PROFILE_REFUSED'
          }
          # Previously approved local credential source, read only. No KTRADE executable
          # or source is used, and no secret can be emitted to the workflow log.
          $credential=Join-Path $profilePath 'GolandProjects\ktrade\.env'
          if(-not(Test-Path -LiteralPath $credential -PathType Leaf)){
            throw 'KTERM_GETONLY_APPROVED_CREDENTIAL_FILE_UNAVAILABLE'
          }
          if((Get-Item -LiteralPath $credential -Force).Attributes -band [IO.FileAttributes]::ReparsePoint){
            throw 'KTERM_GETONLY_CREDENTIAL_LINK_REFUSED'
          }
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr83-open-sells-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'KTERM_GETONLY_NONFRESH_SCRATCH'}
          [void][IO.Directory]::CreateDirectory($root)
          Add-Content -Path $env:GITHUB_ENV -Value ('KTERM_READONLY_CREDENTIAL_FILE='+$credential)
          Write-Host 'KTERM_GETONLY_APPROVED_CREDENTIAL_SOURCE=PASS;NO_SECRETS_COPIED=TRUE'
      - name: Stage original exact private source with existing local access
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr83-open-sells-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          [void][IO.Directory]::CreateDirectory($stage)
          & git -C $stage init -q *> (Join-Path $root 'private-init.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_GETONLY_GIT_INIT_FAILED'}
          $src='https://github.com/Kboomllc/K-Terminal.git'
          $cached=Join-Path $env:PUBLIC 'KTerminal'
          if(Test-Path -LiteralPath $cached -PathType Container){
            $tree=''
            try{$tree=(& git -C $cached rev-parse ($env:KTERM_SHA+'^{tree}') 2>$null|Out-String).Trim()}catch{$tree=''}
            if($LASTEXITCODE -eq 0 -and $tree -ceq $env:KTERM_TREE){$src=$cached}
          }
          # A source-only GET can fail transiently after a preceding owner
          # build succeeds. Retry this exact SHA at most three times; no
          # branch/ref changes, credential copying, or source substitutions.
          $fetched=$false
          for($attempt=1;$attempt -le 3;$attempt++){
            $privateLog=Join-Path $root ('private-fetch-'+$attempt+'.log')
            & git -C $stage fetch -q --no-tags --depth=1 $src $env:KTERM_SHA *> $privateLog
            if($LASTEXITCODE -eq 0){$fetched=$true;break}
            if($attempt -lt 3){Start-Sleep -Seconds (2*$attempt)}
          }
          if(-not $fetched){throw 'KTERM_GETONLY_PRIVATE_SOURCE_UNAVAILABLE_AFTER_BOUNDED_RETRY'}
          & git -C $stage checkout -q --detach $env:KTERM_SHA *> (Join-Path $root 'private-checkout.log')
          if($LASTEXITCODE -ne 0){throw 'KTERM_GETONLY_CHECKOUT_FAILED'}
          $sha=(& git -C $stage rev-parse HEAD | Out-String).Trim()
          $tree=(& git -C $stage rev-parse 'HEAD^{tree}' | Out-String).Trim()
          if($sha -cne $env:KTERM_SHA -or $tree -cne $env:KTERM_TREE -or
             @(& git -C $stage status --porcelain).Count -ne 0){throw 'KTERM_GETONLY_PRIVATE_SOURCE_DRIFT'}
          Write-Host 'KTERM_GETONLY_EXACT_KTERMINAL_SOURCE=PASS'
      - name: Pinned Go compiler
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Original K Terminal V2 account reader and transaction classification (GET only)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((go version) -notmatch 'go1\.26\.5 windows/amd64'){throw 'KTERM_GETONLY_TOOLCHAIN_DRIFT'}
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr83-open-sells-'+$env:GITHUB_RUN_ID)
          $stage=Join-Path $root 'source'
          $test=Join-Path $stage 'pkg\kterminal_approved_open_sells_test.go'
          if(Test-Path -LiteralPath $test){throw 'KTERM_GETONLY_TEST_COLLISION'}
          $code=@'
          package pkg
          import (
            "context"
            "fmt"
            "net/http"
            "net/url"
            "os"
            "regexp"
            "strings"
            "sync/atomic"
            "testing"
            "time"
            "github.com/google/uuid"
          )
          // Prior owner-approved account history boundary: max 64 GET attempts;
          // one strictly scoped BTC base account, v3-only account permission, original
          // portfolios and historical order proof paths. No request can mutate Coinbase.
          type coldFence struct {
            all atomic.Int64
            account atomic.Int64
            permission atomic.Int64
            portfolio atomic.Int64
            history atomic.Int64
            order atomic.Int64
            other atomic.Int64
            deniedClass atomic.Int64
            exactBTC string
            exactBTCAccountRead string
            scopePortfolio string
          }
          var exactCoinbaseOrder = regexp.MustCompile("^/api/v3/brokerage/orders/historical/[A-Za-z0-9-]+$")
          func (f *coldFence) RoundTrip(req *http.Request)(*http.Response,error) {
            if req.Method!=http.MethodGet || req.URL.Scheme!="https" ||
              req.URL.Host!="api.coinbase.com" || req.URL.User!=nil ||
              req.Header.Get("Authorization")=="" {
              return nil,fmt.Errorf("read-only-account-scope denied")
            }
            path:=req.URL.EscapedPath()
            switch {
            case path=="/api/v3/brokerage/accounts" ||
              (f.exactBTCAccountRead!="" && path==f.exactBTCAccountRead):
              if f.account.Add(1)>12 {return nil,fmt.Errorf("account read cap")}
            case path=="/api/v3/brokerage/key_permissions":
              if f.permission.Add(1)>8 {return nil,fmt.Errorf("permission read cap")}
            case path=="/api/v3/brokerage/portfolios" ||
              (f.scopePortfolio!="" && path=="/api/v3/brokerage/portfolios/"+url.PathEscape(f.scopePortfolio)):
              if f.portfolio.Add(1)>12 {return nil,fmt.Errorf("portfolio read cap")}
            case f.exactBTC!="" && path==f.exactBTC && req.URL.Query().Get("limit")=="100" &&
              req.URL.Query().Get("order")=="desc":
              if f.history.Add(1)>8 {return nil,fmt.Errorf("BTC transaction read cap")}
            case path=="/api/v3/brokerage/orders/historical/batch" ||
              exactCoinbaseOrder.MatchString(path):
              if f.order.Add(1)>46 {return nil,fmt.Errorf("historical order evidence read cap")}
            default:
              f.other.Add(1)
              class:=int64(5)
              if strings.HasPrefix(path,"/v2/accounts/"){class=1} else if
                strings.HasPrefix(path,"/api/v3/brokerage/portfolios/"){class=2} else if
                strings.HasPrefix(path,"/api/v3/brokerage/orders/"){class=3} else if
                strings.HasPrefix(path,"/api/v3/brokerage/"){class=4}
              f.deniedClass.Store(class)
              return nil,fmt.Errorf("endpoint outside approved original read-only history scope")
            }
            if f.all.Add(1)>64 {return nil,fmt.Errorf("total 64 GET cap")}
            response,err:=http.DefaultTransport.RoundTrip(req)
            if err==nil&&response!=nil&&response.StatusCode>=300&&response.StatusCode<400 {
              response.Body.Close()
              return nil,fmt.Errorf("Coinbase redirect refused")
            }
            return response,err
          }
          func approvedEnv(lines []string,keys ...string)string{
            for _,key:=range keys{
              for _,line:=range lines {
                line=strings.TrimSpace(strings.TrimPrefix(strings.TrimSpace(line),"export "))
                if line==""||strings.HasPrefix(line,"#"){continue}
                k,v,ok:=strings.Cut(line,"=");if !ok||strings.TrimSpace(k)!=key{continue}
                v=strings.TrimSpace(v)
                if len(v)>=2&&((v[0]=='"'&&v[len(v)-1]=='"')||(v[0]==39&&v[len(v)-1]==39)){v=v[1:len(v)-1]}
                return strings.TrimSpace(strings.ReplaceAll(v,"\\n","\n"))
              }
            }
            return ""
          }
          func TestApprovedKTerminalOpenSellCoverage(t *testing.T){
            if os.Getenv("K_TERMINAL_EXECUTION_MODE")!="PAPER"{t.Fatal("COLD_PROOF_NOT_DISARMED")}
            raw,err:=os.ReadFile(os.Getenv("KTERM_READONLY_CREDENTIAL_FILE"))
            if err!=nil{t.Fatal("COLD_PROOF_APPROVED_CREDENTIAL_ABSENT")}
            lines:=strings.Split(string(raw),"\n")
            if approvedEnv(lines,"KTRADE_LIVE_TRADING")!="false"{t.Fatal("COLD_PROOF_KTRADE_DISARM_MISSING")}
            key:=approvedEnv(lines,"CDP_API_KEY_NAME","COINBASE_API_KEY_NAME","COINBASE_KEY_NAME","COINBASE_API_KEY","CDP_KEY_NAME")
            secret:=approvedEnv(lines,"CDP_API_KEY_PRIVATE_KEY","COINBASE_API_KEY_PRIVATE_KEY","COINBASE_API_KEY_SECRET","COINBASE_API_SECRET","COINBASE_KEY_SECRET","CDP_API_KEY_SECRET","COINBASE_PRIVATE_KEY")
            if key==""||secret==""{t.Fatal("COLD_PROOF_READONLY_FIELDS_MISSING")}
            ctx,cancel:=context.WithTimeout(context.Background(),100*time.Second);defer cancel()
            fence:=&coldFence{}
            auth:=NewReadOnlyAuthenticator(key,secret)
            auth.readContext=ctx
            auth.readTransport=fence
            if !auth.readOnly{t.Fatal("COLD_PROOF_READONLY_REQUIRED")}
            permission,err:=NewAdvancedOrderManager(auth,"",nil).migrationPermissions()
            if err!=nil||!permission.CanView||permission.PortfolioUUID=="" {
              fmt.Printf("KTERM_ORIGINAL_OPEN_SELLS=INCOMPLETE_VIEW_PERMISSION;GET=%d;BROKER_WRITES=0\n",fence.all.Load())
              return
            }
            quoteID:=approvedEnv(lines,"COINBASE_ACCOUNT_ID")
            checker:=NewBalanceChecker(auth,quoteID)
            anchor,err:=checker.historicalPnLAccountAnchor("BTC")
            if err!=nil||len(anchor.accountIDs)!=1||
              !strings.EqualFold(anchor.portfolioID,permission.PortfolioUUID) {
              fmt.Printf("KTERM_ORIGINAL_OPEN_SELLS=INCOMPLETE_ACCOUNT_SCOPE;GET=%d;BROKER_WRITES=0\n",fence.all.Load())
              return
            }
            onlyBTC,err:=uuid.Parse(anchor.accountIDs[0])
            if err!=nil||onlyBTC==uuid.Nil {
              fmt.Printf("KTERM_ORIGINAL_OPEN_SELLS=INCOMPLETE_BTC_ACCOUNT_UUID;GET=%d;BROKER_WRITES=0\n",fence.all.Load())
              return
            }
            fence.exactBTC="/v2/accounts/"+url.PathEscape(onlyBTC.String())+"/transactions"
            // The original portfolio breakdown verifies base precision using
            // one exact GET /v3/brokerage/accounts/{authenticated BTC UUID}.
            // This permits only that SAME already-verified account.
            fence.exactBTCAccountRead="/api/v3/brokerage/accounts/"+url.PathEscape(onlyBTC.String())
            fence.scopePortfolio=anchor.portfolioID
            started:=time.Now()
            // Existing original application proof: no local ledger, TP adoption, order
            // mutation, repair, credential export, or workstation inventory migration.
            // The source verifier itself performs closed-scope double-read anchors.
            proof,readErr:=readCoinbaseColdHistoryProof(checker,"BTC-USDC")
            if proof.BotOwnedLotsVerified||proof.ExecutionAuthorized {
              t.Fatal("COLD_PROOF_UNAUTHORIZED_LOT_OR_TRADE_PROMOTION")
            }
            kind:="UNVERIFIED_SOURCE_OR_ORDER_SCOPE"
            if fence.other.Load()>0{kind="UNVERIFIED_FENCE_REFUSAL"}
            if readErr==nil && proof.FullHistoryVerified && proof.PortfolioScoped {
              if proof.OpenSellOrderCoverageVerified {
                kind="OPEN_SELL_COVERAGE_VERIFIED"
              } else {
                kind="UNVERIFIED_ORDER_COVERAGE"
              }
            }
            // Do not interpret unknown as zero; and never treat a Coinbase
            // observed SELL as a K Terminal managed TP reservation.
            count:=-1
            if proof.OpenSellOrderCoverageVerified && proof.FullHistoryVerified && proof.PortfolioScoped {
              count=proof.OpenSellOrdersObserved
            }
            if proof.BotOwnedLotsVerified || proof.ExecutionAuthorized {
              t.Fatal("OPEN_SELL_REPORT_PROMOTED_BOT_OWNERSHIP")
            }
            fmt.Printf("KTERM_ORIGINAL_OPEN_SELLS=%s;OPEN_SELL_COUNT=%d;PORTFOLIO_SCOPED=%t;FULL_ECONOMIC_HISTORY=%t;OPEN_SELL_COVERAGE=%t;TRANSACTIONS=%d;GROUPS=%d;UNKNOWN_OPEN_GROUPS=%d;GET=%d;V2_GET=%d;ORDER_GET=%d;PORTFOLIO_GET=%d;DENIED=%d;DURATION_MS=%d;BOT_ORIGIN=UNVERIFIED;SELL_BUY_ALLOCATION=UNVERIFIED;TP_OWNERSHIP=UNVERIFIED;BROKER_WRITES=0\n",
              kind,count,proof.PortfolioScoped,proof.FullHistoryVerified,proof.OpenSellOrderCoverageVerified,
              proof.TransactionCount,len(proof.LotGroups),proof.AmbiguousOpenGroups,
              fence.all.Load(),fence.history.Load(),fence.order.Load(),fence.portfolio.Load(),fence.other.Load(),time.Since(started).Milliseconds())
            if fence.all.Load()>64||fence.history.Load()>8||fence.order.Load()>46 {
              t.Fatal("COLD_PROOF_BROKER_SCOPE_BUDGET_EXCEEDED")
            }
          }
          
          '@
          [IO.File]::WriteAllText($test,$code,[Text.UTF8Encoding]::new($false))
          $env:GOCACHE=Join-Path $root 'go-cache'
          $env:GOMODCACHE=Join-Path $root 'go-modules'
          Push-Location $stage
          try{
            & go test -p 1 -count=1 -timeout 4m -v '-run=^TestApprovedKTerminalOpenSellCoverage$' ./pkg 2>&1 |
              ForEach-Object{
                $line=[string]$_
                if($line -match 'kterminal_approved_open_sells_test\.go:[0-9]+:[0-9]+: (.*)'){
                  $diagnostic=[string]$Matches[1]
                  if($diagnostic.Length -gt 180){$diagnostic=$diagnostic.Substring(0,180)}
                  Write-Host ('KTERM_COLD_PROOF_COMPILE_DIAGNOSTIC='+$diagnostic)
                }
                if($line -match 'KTERM_ORIGINAL_OPEN_SELLS=' -or
                   $line -match 'KTERM_V3_FILLS=' -or $line -match 'KTERM_V3_.*(UNAVAILABLE|MISMATCH|UNVERIFIED)' -or
                   $line -match 'KTERM_SCOPE_STAGE=' -or $line -match 'KTERM_SCOPE_.*(REFUSED|MISMATCH|UNAVAILABLE)' -or
                   $line -match 'KTERM_GETONLY_ACCOUNT_LOOKUP=' -or $line -match 'KTERM_GETONLY_COLD_HISTORY=' -or
                   $line -match 'KTERM_GETONLY_.*(UNVERIFIED|UNAVAILABLE|REFUSED)' -or
                   $line -match '^ok\s' -or $line -match '^FAIL(\s|$)'){Write-Host $line}
              }
            if($LASTEXITCODE -ne 0){throw 'KTERM_GETONLY_ORIGINAL_SOURCE_PROBE_FAILED'}
          }finally{Pop-Location}
          Write-Host 'KTERM_OPEN_SELL_GETONLY_SCOPE=PASS;LIVE_ORDERS=0;KTRADE_CODE_RUN=FALSE'
      - name: Clean disposable source, leave both original applications unchanged
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('kterm-pr83-open-sells-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){
            $resolved=[IO.Path]::GetFullPath($root)
            $scope=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')+'\'
            if(-not $resolved.StartsWith($scope,[StringComparison]::OrdinalIgnoreCase) -or
               [IO.Path]::GetFileName($resolved) -cne ('kterm-pr83-open-sells-'+$env:GITHUB_RUN_ID)){
              throw 'KTERM_GETONLY_CLEANUP_SCOPE_REFUSED'
            }
            Remove-Item -LiteralPath $resolved -Recurse -Force -ErrorAction Stop
          }
          Write-Host 'KTERM_GETONLY_SCRATCH_CLEAN=PASS;ORIGINAL_APP_STATE_UNCHANGED=TRUE'
