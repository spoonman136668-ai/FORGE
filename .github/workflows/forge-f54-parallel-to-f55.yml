name: FORGE F54 parallel actual research source evidence to F55
on:
  push:
    branches: [research/f54-additional-firstuse-evidence-20261015-r1]
permissions:
  contents: read
  actions: read
jobs:
  independent-source-locked-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source head and negative-policy guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/test_f54_parallel_train_review.py -v
      - name: Authenticate two original completed first-attempt research archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/f54-more"
          mkdir -p "$root/Wingless" "$root/Yggdrasil"
          for rec in \
           'Wingless 38819060318 d1be885e5d3bbef8f5828a3d195cb3354f755881 12012406590 W-F54-active-calibration-new-TRAIN-not-F3-original sha256:d3a984c4b2cbbc34a79e623bdabc7a2f5ed0498390b862765fc419e2279707d0' \
           'Yggdrasil 38820489117 4ae4066bfbdb7ee5fe1f85abe840cf61f280269d 12013360275 Y-F54B-new-cohort-corrected-witness-TRAIN-not-F3 sha256:17c84623f3c61226aca71fb9ce85c9379544751ab905c1d186662de2092ede69'
          do
            read -r lane run sha artifact name digest <<< "$rec"
            gh api "repos/spoonman136668-ai/$lane/actions/runs/$run" > "$root/$lane/github-run.json"
            jq -e --arg sha "$sha" --argjson run "$run" \
              '.id==$run and .head_sha==$sha and .run_attempt==1 and .status=="completed" and .conclusion=="success"' \
              "$root/$lane/github-run.json" >/dev/null
            gh api "repos/spoonman136668-ai/$lane/actions/artifacts/$artifact" > "$root/$lane/github-artifact.json"
            jq -e --arg name "$name" --arg digest "$digest" --argjson id "$artifact" --argjson run "$run" \
              '.id==$id and .name==$name and .digest==$digest and .expired==false and .workflow_run.id==$run' \
              "$root/$lane/github-artifact.json" >/dev/null
            gh run download "$run" --repo "spoonman136668-ai/$lane" -n "$name" -D "$root/$lane"
          done
          python3 -B scripts/f54_parallel_train_review.py \
            --wingless "$root/Wingless" --yggdrasil "$root/Yggdrasil" --out "$root/F55-extra.json"
          python3 -B scripts/f54_parallel_train_review.py \
            --wingless "$root/Wingless" --yggdrasil "$root/Yggdrasil" --out "$root/repeat.json"
          cmp "$root/F55-extra.json" "$root/repeat.json"
          jq -e '(.decisions|length)==2 and
             .genuine_new_train_studies_independently_recounted==2 and
             .independent_f3_scientific_originals_accepted==0 and
             .protected_primary_originals_executed==0 and
             .new_research_worker_dispatch_authorized==false and
             .dream_rsi_prospective_gain_proven==false' "$root/F55-extra.json" >/dev/null
          (cd "$root"; sha256sum F55-extra.json > F55-extra.sha256)
          echo 'F54_PARALLEL_AUTHENTIC_FIRST_USE_NEGATIVES_TO_F55=PASS'
      - name: One complete FORGE regression vet build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-f54-parallel-new-train-evidence-f55-advisory-only
          path: |
            ${{ runner.temp }}/f54-more/F55-extra.json
            ${{ runner.temp }}/f54-more/F55-extra.sha256
            ${{ runner.temp }}/f54-more/Wingless/github-run.json
            ${{ runner.temp }}/f54-more/Wingless/github-artifact.json
            ${{ runner.temp }}/f54-more/Yggdrasil/github-run.json
            ${{ runner.temp }}/f54-more/Yggdrasil/github-artifact.json
          retention-days: 30
          if-no-files-found: error
