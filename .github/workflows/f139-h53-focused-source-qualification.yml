name: F139 H53 focused source qualification
on:
  pull_request:
    paths:
      - 'f139/h53_successor_readonly_observer.py'
      - 'f139/h53_audit_guards.py'
      - 'f139/h53_github_authority.py'
      - 'f139/h53_windows_owner.py'
      - 'f139/h53_native_readonly.py'
      - 'f139/h53_release_manifest.py'
      - 'tests/test_h53_release_manifest.py'
      - 'f139/h53_original_owner_audit.py'
      - 'tests/test_h53_native_readonly.py'
      - 'tests/test_h53_windows_owner.py'
      - 'tests/test_h53_github_authority.py'
      - 'tests/test_h53_audit_guards.py'
      - '.github/audit-templates/**'
      - 'tests/test_h53_successor_readonly_observer.py'
      - '.github/workflows/f139-h53-focused-source-qualification.yml'
permissions:
  contents: read
jobs:
  h53-focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile H53 observer and negative controls
        run: python -m py_compile f139/h53_successor_readonly_observer.py tests/test_h53_successor_readonly_observer.py f139/h53_audit_guards.py tests/test_h53_audit_guards.py
      - name: Run H53 audit admission negative controls
        run: python -m unittest discover -s tests -p test_h53_audit_guards.py -v
      - name: Run H53 GitHub authority negative controls
        run: python -m unittest discover -s tests -p test_h53_github_authority.py -v
      - name: Run H53 Windows owner negative controls
        run: python -m unittest discover -s tests -p test_h53_windows_owner.py -v
      - name: Run H53 native read-only negative controls
        run: python -m unittest discover -s tests -p test_h53_native_readonly.py -v
      - name: Run H53 release manifest negative controls
        run: python -m unittest discover -s tests -p test_h53_release_manifest.py -v
      - name: Run H53 focused negative controls
        run: python -m unittest discover -s tests -p test_h53_successor_readonly_observer.py -v
