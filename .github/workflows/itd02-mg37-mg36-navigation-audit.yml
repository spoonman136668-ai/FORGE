name: ITD-02 MG37 pinned original MG36 navigation and interaction diagnostic
on:
  push:
    branches: [research/itd02-mg37-exposed-mg36-navigation-attribution-20261029]
permissions:
  contents: read
  actions: read
jobs:
  frozen-source-only-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact LF source settings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout unchanged pinned MG36 parent plus MG37 diagnostic only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify source lineage and all original policy binaries remain untouched
        shell: pwsh
        run: |
          git merge-base --is-ancestor 0c0651f981564d6a3d388a3e620f89c9054474ac $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'MG37_AUDIT_METRIC_FREEZE_NOT_BEFORE_EXECUTABLE' }
          $changed=@(git diff --name-only 204fa4115637c1f3b8aa037a058cba6db0fc44db $env:GITHUB_SHA)
          $expected=@('research/lcrm01/mg37_mg36_navigation_audit_prereg.json',
            'research/lcrm01/mg37_mg36_navigation_audit.py',
            '.github/workflows/itd02-mg37-mg36-navigation-audit.yml')
          if (@(Compare-Object $changed $expected).Count -ne 0) { throw 'MG37_UNAUTHORIZED_MODEL_OR_SOURCE_CHANGE' }
          python -B research/lcrm01/mg36_action_modelbased_original_dev.py --preflight
          if ($LASTEXITCODE -ne 0) { throw 'MG37_MG35_INHERITED_PREFLIGHT_FAIL' }
          python -B research/lcrm01/mg37_mg36_navigation_audit.py --preflight
          if ($LASTEXITCODE -ne 0) { throw 'MG37_DIAGNOSTIC_PREFLIGHT_FAIL' }
          if (git status --porcelain --untracked-files=all) { throw 'MG37_SOURCE_NOT_CLEAN' }
          Write-Host MG37_FROZEN_READONLY_AUDIT_CROSS_HOST_SOURCE_PREFLIGHT_PASS_NO_SCIENCE
  pinned-exposed-source-only-audit:
    needs: frozen-source-only-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact LF source settings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download exact immutable original MG35 evidence archive, no new world action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mg37"
          curl --fail --silent --show-error --location --max-time 120 --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/spoonman136668-ai/FORGE/actions/artifacts/12928909424/zip" \
            --output "$RUNNER_TEMP/mg37/mg36-immutable.zip"
          test "$(stat -c%s "$RUNNER_TEMP/mg37/mg36-immutable.zip")" -lt 12000000
          printf '%s  %s\n' 1cbd808b56abf1ef95eb6436b3ea9e88002d00bec2e4ea96dfd02e5172019bc1 "$RUNNER_TEMP/mg37/mg36-immutable.zip" | sha256sum --check --status
          echo MG37_ORIGINAL_EXPOSED_ARCHIVE_BYTE_CUSTODY_PASS
      - name: Independently classify authentic before-action exposure and own-selected effects
        shell: bash
        run: |
          set -euo pipefail
          python -B research/lcrm01/mg37_mg36_navigation_audit.py \
            --artifact "$RUNNER_TEMP/mg37/mg36-immutable.zip" \
            --output "$RUNNER_TEMP/mg37/report.json" \
            > "$RUNNER_TEMP/mg37/diagnostic.log"
          grep -F 'MG37_MG36_EXPOSED_PUBLIC_NAVIGATION_INTERACTION_DIAGNOSTIC_PASS_NO_SCIENCE' "$RUNNER_TEMP/mg37/diagnostic.log"
          grep -F 'MG37_TWO_ORIGINAL_SOURCE_PROCESSES_EXACT_AUDIT_PASS' "$RUNNER_TEMP/mg37/diagnostic.log"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo MG37_EXPOSED_SOURCE_ONLY_AUDIT_COMPLETE_NO_FARAMA_ACTION_OR_SCIENTIFIC_FIRST_USE
      - name: Upload compact original-source validated diagnostic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mg37-mg36-public-navigation-attribution-audit
          path: |
            ${{ runner.temp }}/mg37/report.json
            ${{ runner.temp }}/mg37/diagnostic.log
          if-no-files-found: warn
          retention-days: 30
