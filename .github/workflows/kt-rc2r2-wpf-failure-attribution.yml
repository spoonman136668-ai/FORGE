name: K-Terminal RC2-R2 original WPF fixture attribution
on:
  push:
    branches: [diagnostics/kterminal-original-local-preflight-20261019]
    paths: [.github/workflows/kt-rc2r2-wpf-failure-attribution.yml]
permissions:
  contents: read
jobs:
  windows-wpf-attribution:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout FORGE source-bound diagnostic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout frozen K-Terminal original read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: eb5d225ae73b698a59c68d840daf1ec678e1a0ec
          path: kt-original
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Checkout exact PR73 read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: b8c2052d530cdff93462dfccc21b28f3824e5531
          path: kt-candidate
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Verify no broker credentials and proper Windows host
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/FORGE
          test "$(git -C kt-original rev-parse HEAD)" = eb5d225ae73b698a59c68d840daf1ec678e1a0ec
          test "$(git -C kt-candidate rev-parse HEAD)" = b8c2052d530cdff93462dfccc21b28f3824e5531
          for n in COINBASE_API_KEY COINBASE_API_SECRET CDP_API_KEY_NAME CDP_API_KEY_PRIVATE_KEY K_TERMINAL_API_KEY K_TERMINAL_API_SECRET; do test -z "${!n:-}"; done
          echo KTERM_RC2R2_FROZEN_AND_NO_BROKER=PASS
      - name: Attribute both WPF fixture errors without Go requalification
        shell: bash
        run: |
          set -euo pipefail
          python -B qualification/kterminal/rc2r2_wpf_failure_attribution.py \
             kt-original kt-candidate "$RUNNER_TEMP/kterm-rc2r2-wpf"
          echo KTERM_RC2R2_SOURCES_UNMODIFIED=TRUE
          echo KTERM_RC2R2_FULL_REGRESSION=NOT_RUN
      - name: Keep safe error classes only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kterm-rc2r2-wpf-error-classes-${{ github.run_id }}
          path: ${{ runner.temp }}/kterm-rc2r2-wpf/rc2r2-redacted-wpf-identity.json
          if-no-files-found: warn
          retention-days: 14
