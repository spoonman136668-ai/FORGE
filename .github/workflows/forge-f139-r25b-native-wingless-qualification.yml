name: F139 R25B original-source native Wingless candidate qualification
on:
  push:
    branches: [qualification/f139-r25b-native-wingless-20261022]
permissions:
  contents: read
jobs:
  original-native-bounded:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout immutable candidate (not protected main)
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/Wingless
          ref: 4ef008c31c5b336bcf343f70cb632dc419b976e8
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate preexisting source and one-file candidate
        shell: bash
        run: |
          set -euo pipefail
          original=a5db1727113731988bfccad6ae30a0b8b4d6f9d6
          candidate=4ef008c31c5b336bcf343f70cb632dc419b976e8
          test "$(git rev-parse HEAD)" = "$candidate"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-list --count "$original"..HEAD)" = 1
          test "$(git diff --name-only "$original" "$candidate")" = cognition/continual.go
          before="$(git show "$original":cognition/continual.go | sha256sum | cut -d ' ' -f1)"
          after="$(sha256sum cognition/continual.go | cut -d ' ' -f1)"
          test "$before" != "$after"
          printf 'R25B_ORIGINAL_SHA=%s\nR25B_CANDIDATE_SHA=%s\n' "$original" "$candidate"
          printf 'R25B_BEFORE_SHA256=%s\nR25B_AFTER_SHA256=%s\n' "$before" "$after"
          printf 'R25B_SINGLE_ALLOWED_NATIVE_FILE=PASS\n'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Focused native cognition regression
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          set -euo pipefail
          go test -count=1 ./cognition
          echo R25B_WINGLESS_FOCUSED_NATIVE=PASS
      - name: Native vet
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          set -euo pipefail
          go vet ./cognition
          echo R25B_WINGLESS_NATIVE_VET=PASS
      - name: One complete full regression
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          set -euo pipefail
          go test -count=1 ./...
          echo R25B_WINGLESS_FULL_REGRESSION=PASS
      - name: Build all native modules
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          set -euo pipefail
          go build ./...
          echo R25B_WINGLESS_NATIVE_BUILD=PASS
          echo R25B_SCIENTIFIC_FIRST_USE=FALSE
          echo R25B_PROTECTED_MAIN_MUTATIONS=0
          echo R25B_CONTROLLER_DISPATCH=NOT_ATTEMPTED_BY_QUALIFICATION
