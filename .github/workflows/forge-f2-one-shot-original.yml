name: FORGE F2 isolated first original scientific primary
on:
  push:
    branches:
      - experiment/forge-f2-original-20261011
permissions:
  contents: read
  actions: read
concurrency:
  group: forge-f2-one-original-consumption
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Frozen science prereg, source identity, prior first-use denial
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "${GITHUB_EVENT_NAME}" = push
          test "${GITHUB_REF_NAME}" = experiment/forge-f2-original-20261011
          test -n "${GITHUB_SHA}"
          git merge-base --is-ancestor 7bb84552d4a8137f58eb3671fbacd73b9ce2f6a0 HEAD
          test "$(git rev-parse HEAD:research/pilot-f2/frozen.json)" = 54bccd2f42854f000baccbcb5692faae7aa66057
          go run ./cmd/forge-f2 -mode validate -prereg "$PWD/research/pilot-f2/frozen.json"
          python - <<'PY'
          import json, os, urllib.request
          root="https://api.github.com/repos/spoonman136668-ai/FORGE/actions/artifacts"
          for name in ("forge-f2-wingless-started","forge-f2-yggdrasil-started"):
              uri=root+"?name="+name+"&per_page=100"
              req=urllib.request.Request(uri, headers={
                  "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "User-Agent":"forge-f2-consumption-readonly"
              })
              with urllib.request.urlopen(req,timeout=20) as resp:
                  payload=resp.read(200001)
              history=json.loads(payload)
              if history["total_count"]!=0 or history["artifacts"]:
                  raise SystemExit("FORGE_F2_ORIGINAL_ALREADY_CONSUMED_NO_REPLAY")
          print("FORGE_F2_BEFORE_FIRST_USE=PASS")
          PY
          go test -count=1 ./pilotf2 ./cmd/forge-f2
          echo FORGE_F2_PRE_PRIMARY_SOURCE_GATES=PASS

  both_started:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Seal BOTH lane original STARTED before either primary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forge-f2-w-started" "$RUNNER_TEMP/forge-f2-y-started"
          printf '{"schema":"forge.f2.original-started.v1","lane":"Wingless","generation":"F2","run_id":"%s","attempt":1,"source_sha":"%s","frozen_blob":"54bccd2f42854f000baccbcb5692faae7aa66057","replay_authorized":false,"scientific_accepted":false}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$RUNNER_TEMP/forge-f2-w-started/started.json"
          printf '{"schema":"forge.f2.original-started.v1","lane":"Yggdrasil","generation":"F2","run_id":"%s","attempt":1,"source_sha":"%s","frozen_blob":"54bccd2f42854f000baccbcb5692faae7aa66057","replay_authorized":false,"scientific_accepted":false}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$RUNNER_TEMP/forge-f2-y-started/started.json"
      - uses: actions/upload-artifact@v4
        with:
          name: forge-f2-wingless-started
          path: ${{ runner.temp }}/forge-f2-w-started/started.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: forge-f2-yggdrasil-started
          path: ${{ runner.temp }}/forge-f2-y-started/started.json
          retention-days: 30
          if-no-files-found: error

  wingless:
    needs: both_started
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - name: First use Wingless primary, no posthoc classifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forge-f2-w-raw"
          go run ./cmd/forge-f2 -mode primary -lane Wingless -run "$GITHUB_RUN_ID" -source "$GITHUB_SHA" -prereg "$PWD/research/pilot-f2/frozen.json" -output "$RUNNER_TEMP/forge-f2-w-raw/raw.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-f2-wingless-raw
          path: ${{ runner.temp }}/forge-f2-w-raw/
          retention-days: 30
          if-no-files-found: warn

  yggdrasil:
    needs: both_started
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - name: First use Yggdrasil primary, no posthoc classifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forge-f2-y-raw"
          go run ./cmd/forge-f2 -mode primary -lane Yggdrasil -run "$GITHUB_RUN_ID" -source "$GITHUB_SHA" -prereg "$PWD/research/pilot-f2/frozen.json" -output "$RUNNER_TEMP/forge-f2-y-raw/raw.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-f2-yggdrasil-raw
          path: ${{ runner.temp }}/forge-f2-y-raw/
          retention-days: 30
          if-no-files-found: warn

  classify:
    needs: [wingless, yggdrasil]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - uses: actions/download-artifact@v4
        with:
          name: forge-f2-wingless-raw
          path: ${{ runner.temp }}/wingless
      - uses: actions/download-artifact@v4
        with:
          name: forge-f2-yggdrasil-raw
          path: ${{ runner.temp }}/yggdrasil
      - name: Classify exclusively after BOTH originals archived
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forge-f2-classified"
          sha256sum "$RUNNER_TEMP/wingless/raw.json" "$RUNNER_TEMP/yggdrasil/raw.json"
          go run ./cmd/forge-f2 -mode classify -prereg "$PWD/research/pilot-f2/frozen.json" -wingless "$RUNNER_TEMP/wingless/raw.json" -yggdrasil "$RUNNER_TEMP/yggdrasil/raw.json" -output "$RUNNER_TEMP/forge-f2-classified/disposition.json"
          cat "$RUNNER_TEMP/forge-f2-classified/disposition.json"
      - uses: actions/upload-artifact@v4
        with:
          name: forge-f2-postraw-classified
          path: ${{ runner.temp }}/forge-f2-classified/disposition.json
          retention-days: 30
          if-no-files-found: error
