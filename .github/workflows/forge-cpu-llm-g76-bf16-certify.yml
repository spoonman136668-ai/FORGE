name: FORGE CPU LLM G76 original GPT2 BF16 propose FP32 exact certify
on:
  push:
    branches: [research/cpu-llm-evaluation-g76-bf16-certify-20261030]
    paths:
      - '.github/workflows/forge-cpu-llm-g76-bf16-certify.yml'
      - 'research/cpu_g76/**'
permissions:
  contents: read
concurrency:
  group: forge-cpu-g76-authentic-certify
  cancel-in-progress: false
jobs:
  frozen-source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify prereg source independent immutable qualified parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD
          git merge-base --is-ancestor c5d854eeed8e0b7ebbc9448454dd652f72edf2e2 HEAD
          test "$(git rev-parse HEAD:docs/research/CPU-G76-GPT2-BF16-CERTIFY-REPAIR-PREEXEC-20261030.md)" = "$(git rev-parse c5d854eeed8e0b7ebbc9448454dd652f72edf2e2:docs/research/CPU-G76-GPT2-BF16-CERTIFY-REPAIR-PREEXEC-20261030.md)"
          git diff --exit-code 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD -- research/llm_g54 research/llm_g55 research/llm_g56 research/llm_g57 research/llm_g58 research/llm_g59 research/llm_g60 research/llm_g61 research/llm_g62 research/llm_g63 research/llm_g64 research/llm_g65 research/llm_g66 research/llm_g67 research/llm_g68 research/llm_g70
          git diff --check 20a540d0241519e2e9d90ace868ffd6db60bd065 HEAD
          python -B -m py_compile research/cpu_g76/g76_bf16_certify.py research/cpu_g76/test_g76_bf16_certify.py
          python -B -m unittest discover -s research/cpu_g76 -p test_g76_bf16_certify.py -v
          echo CPU_G76_UNMODIFIED_ANCESTOR_AND_SOURCE_FREE_TEST=PASS
  authentic-model-head:
    needs: frozen-source-admission
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin original pretrained GPT2 CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install --disable-pip-version-check 'transformers==4.48.3' 'huggingface_hub==0.30.2' 'safetensors==0.5.3' 'tokenizers==0.21.1' 'psutil==7.1.3'
          python -m pip check
          python -m pip freeze > cpu_g76_original_environment.txt
      - name: Execute original GPT2 immutable BF16 propose and FP32 repair falsifier
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/cpu_g76/g76_bf16_certify.py
          python - <<'PY'
          import json
          with open("cpu_g76_original_result.json",encoding="utf-8") as f:r=json.load(f)
          assert r["gate"]=="CPU_G76"
          assert r["correctness"]=="PASS" and r["engineering"]=="PASS"
          assert r["real_hidden_state_count"]==96
          assert len(r["measurements"])==480
          assert r["performance"] in ("NO_GO","GO")
          assert r["scientific_acceptance"]=="NOT_GRANTED" and not r["promotion_allowed"]
          print("CPU_G76_ORIGINAL_SOURCE_AND_PARITY=PASS")
          print("CPU_G76_FROZEN_PERFORMANCE="+r["performance"])
          PY
      - name: Retain original original-model artifact on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-g76-original-gpt2-bf16-certify
          retention-days: 30
          if-no-files-found: warn
          path: |
            cpu_g76_original_result.json
            cpu_g76_original_environment.txt
