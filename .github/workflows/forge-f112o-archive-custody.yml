name: FORGE F112-O publisher graph custody and synthetic archive safety
on:
  push:
    branches: [engineering/f112o-freebase-archive-custody-direction-20261017-r1]
    paths:
      - 'noveltyeval/f112o_*'
      - 'noveltyeval/test_f112o_*'
      - 'docs/F112O-*'
      - '.github/workflows/forge-f112o-archive-custody.yml'
permissions:
  contents: read
jobs:
  source-only-freebase-archive-direction-custody:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - name: Exact FORGE head with no credential persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publisher original README LICENSE ONLY sparse checkout
        uses: actions/checkout@v4
        with:
          repository: kelvin-jiang/FreebaseQA
          ref: d16aae5149aaa25e43ff2a7bd00a06f280ca19b9
          path: freebaseqa-publisher-source
          sparse-checkout: |
            README.md
            LICENSE
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Exact immutable original publisher head and no QA or graph data
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C freebaseqa-publisher-source rev-parse HEAD)" = 'd16aae5149aaa25e43ff2a7bd00a06f280ca19b9'
          test "$(git -C freebaseqa-publisher-source rev-parse HEAD:README.md)" = 'dd4c65cbe5428b2a86afc47ae2309cb11328b31b'
          test "$(git -C freebaseqa-publisher-source rev-parse HEAD:LICENSE)" = '10fabd90118f7ce38bb2e4753e105e744442a429'
          test "$(git -C freebaseqa-publisher-source cat-file -s HEAD:README.md)" = '3564'
          test "$(git -C freebaseqa-publisher-source cat-file -s HEAD:LICENSE)" = '18658'
          for n in FreebaseQA-train.json FreebaseQA-dev.json FreebaseQA-eval.json FreebaseQA-partial.json; do
            test ! -e "freebaseqa-publisher-source/$n"
          done
          echo 'F112O_ORIGINAL_QA_SPLITS_AND_GRAPH_ARCHIVE_NEVER_MATERIALIZED=TRUE'
      - name: Synthetic bounded ZIP, source integrity and orientation adverse controls
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s noveltyeval -p 'test_f112o_graph_archive_direction.py' -v
      - name: Authenticated original publisher source graph declaration only
        shell: bash
        run: |
          set -euo pipefail
          python -B noveltyeval/f112o_publisher_graph_declaration.py --upstream-sparse freebaseqa-publisher-source --out f112o-publisher-graph-custody.json
          python - <<'PY'
          import json
          x=json.load(open('f112o-publisher-graph-custody.json',encoding='utf-8'))
          assert x['schema']=='forge.optimizer.f112o.publisher-graph-declaration-custody.v1'
          assert x['status']=='PUBLISHER_GRAPH_DECLARATION_VERIFIED_ARCHIVE_UNQUALIFIED'
          assert x['source_repository']=='kelvin-jiang/FreebaseQA'
          assert x['source_commit']=='d16aae5149aaa25e43ff2a7bd00a06f280ca19b9'
          docs=x['publisher_original_docs']
          assert docs['README.md']['original_git_blob']=='dd4c65cbe5428b2a86afc47ae2309cb11328b31b'
          assert docs['README.md']['original_bytes']==3564
          assert docs['LICENSE']['original_git_blob']=='10fabd90118f7ce38bb2e4753e105e744442a429'
          assert docs['LICENSE']['original_bytes']==18658
          d=x['publisher_declaration']
          for name in ('publisher_graph_zip_approx_2_2_gb_documented',
                       'publisher_approx_entities_16m_documented',
                       'publisher_approx_triples_182m_documented',
                       'publisher_original_external_archive_link_documented',
                       'author_declares_logical_topic_to_answer_path'):
            assert d[name] is True,name
          for name in ('logical_order_is_graph_edge_orientation',
                       'original_graph_archive_sha256_provided_in_readme',
                       'exact_original_graph_edge_denominator_measured',
                       'original_graph_archive_bytes_read',
                       'original_graph_archive_link_downloaded',
                       'source_member_layout_verified',
                       'independent_edge_direction_witness',
                       'original_graph_ready_for_query'):
            assert d[name] is False,name
          assert x['graph_custody_status']=='FREEBASE_GRAPH_SOURCE_NOT_QUALIFIED'
          assert len(x['graph_source_missing_or_invalid_fields'])==14
          for flag in ('real_freebase_archive_read','original_qa_split_contents_read',
                       'source_qa_answers_read','original_graph_edge_orientation_qualified',
                       'independent_scientific_firstuse','accepted_science',
                       'accepted_ref_mutation','dream_pareto_promotion',
                       'thetaevolve_accepted_training','scientific_dispatch'):
            assert x[flag] is False,flag
          assert x['graph_queries_executed']==x['model_calls']==x['codex_calls']==x['cloudflare_writes']==0
          print('F112O_EXTERNAL_PUBLISHER_GRAPH_DECLARATION_METADATA=VERIFIED')
          print('F112O_ORIGINAL_FREEBASE_ARCHIVE_AND_EDGE_ORIENTATION=NOT_QUALIFIED')
          PY
          sha256sum f112o-publisher-graph-custody.json > f112o-publisher-graph-custody.sha256
          sha256sum -c f112o-publisher-graph-custody.sha256
      - name: One mandatory exact-head full Go regression vet build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo 'F112O_SCIENCE_CODEX_CKB_CLOUDFLARE_AND_PAID_CALLS=ZERO'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-f112o-original-publisher-graph-custody-${{ matrix.os }}
          path: |
            f112o-publisher-graph-custody.json
            f112o-publisher-graph-custody.sha256
          retention-days: 45
          if-no-files-found: error
