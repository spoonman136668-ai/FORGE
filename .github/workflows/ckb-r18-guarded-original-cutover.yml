name: R220 elevated live pre-cutover snapshot
on:
  push:
    branches: [diagnostics/ckb-rb1-live-admission-20261022]
    paths: [.github/workflows/ckb-r18-guarded-original-cutover.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Exact elevated read-only CKB live snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-StrictMode -Version 3.0
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $who.Name -ine 'LINKDEADKB\camar' -or
             ![Security.Principal.WindowsPrincipal]::new($who).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/diagnostics/ckb-rb1-live-admission-20261022' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             (& git.exe rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or
             @(& git.exe status --porcelain).Count -ne 0){throw 'R220_ELEVATED_SNAPSHOT_AUTHORITY_DRIFT'}
          $changed=@(& git.exe diff --name-only HEAD^ HEAD)
          if($LASTEXITCODE -ne 0 -or $changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/ckb-r18-guarded-original-cutover.yml'){
            throw 'R220_ELEVATED_SNAPSHOT_SCOPE_DRIFT'
          }
          function Sha([string]$p){
            if(!(Test-Path -LiteralPath $p -PathType Leaf)){throw ('R220_MISSING_FILE='+$p)}
            (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $config=Join-Path $root 'config\autonomy.yaml'
          $bridge=Join-Path $root 'config\webui-bridge.json'
          $db=Join-Path $root 'state\autonomy.db'
          $taskName='CKB-plane Controller'
          $task=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          $taskInfo=Get-ScheduledTaskInfo -TaskName $taskName -ErrorAction Stop
          if(@($task.Actions).Count -ne 1){throw 'R220_TASK_ACTION_COUNT_DRIFT'}
          Write-Host ('R220_TASK_STATE='+[string]$task.State)
          Write-Host ('R220_TASK_LAST_RESULT='+[string]$taskInfo.LastTaskResult)
          Write-Host ('R220_TASK_EXECUTE='+[string]$task.Actions[0].Execute)
          Write-Host ('R220_TASK_ARGUMENTS='+[string]$task.Actions[0].Arguments)
          Write-Host ('R220_TASK_WORKDIR='+[string]$task.Actions[0].WorkingDirectory)
          Write-Host ('R220_TASK_PRINCIPAL='+[string]$task.Principal.UserId)
          Write-Host ('R220_TASK_RUNLEVEL='+[string]$task.Principal.RunLevel)
          Write-Host ('R220_TASK_LOGONTYPE='+[string]$task.Principal.LogonType)
          $m=[regex]::Match([string]$task.Actions[0].Arguments,'(?i)([A-Z]:\\[^\r\n]*?\.ps1)')
          if(!$m.Success){throw 'R220_WRAPPER_PATH_NOT_FOUND'}
          $wrapper=$m.Groups[1].Value.Trim('"',"'"," ")
          Write-Host ('R220_WRAPPER_PATH='+$wrapper)
          Write-Host ('R220_WRAPPER_SHA256='+(Sha $wrapper))
          $procs=@(Get-CimInstance Win32_Process -Filter "Name='ckb-plane.exe'" -ErrorAction Stop)
          Write-Host ('R220_CKB_PROCESS_COUNT='+$procs.Count)
          foreach($p in $procs){
            Write-Host ('R220_PROCESS_PID='+$p.ProcessId)
            Write-Host ('R220_PROCESS_PATH='+[string]$p.ExecutablePath)
            Write-Host ('R220_PROCESS_SHA256='+(Sha ([string]$p.ExecutablePath)))
            Write-Host ('R220_PROCESS_COMMANDLINE='+[string]$p.CommandLine)
            Write-Host ('R220_PROCESS_PARENT_PID='+[string]$p.ParentProcessId)
          }
          Write-Host ('R220_CONFIG_SHA256='+(Sha $config))
          Write-Host ('R220_BRIDGE_SHA256='+(Sha $bridge))
          if(Test-Path -LiteralPath (Join-Path $root '.git')){
            $h=(& git.exe -C $root rev-parse HEAD).Trim()
            if($LASTEXITCODE-eq0){Write-Host ('R220_LIVE_CHECKOUT_HEAD='+$h)}
            $dirty=@(& git.exe -C $root status --porcelain --untracked-files=all)
            if($LASTEXITCODE-eq0){Write-Host ('R220_LIVE_CHECKOUT_DIRTY_COUNT='+$dirty.Count)}
          }
          $py=@'
          import json,sqlite3,sys
          db=sys.argv[1].replace('\\','/')
          con=sqlite3.connect('file:'+db+'?mode=ro',uri=True,timeout=8)
          con.execute('pragma query_only=on')
          try:
              settings={str(k):str(v) for k,v in con.execute("select key,value from settings where key in ('paused','autonomy_authority','autonomy_generation','autonomy_heartbeat')")}
              counts={str(k):int(v) for k,v in con.execute("select state,count(*) from work_orders group by state")}
              active=[{'id':str(i),'state':str(s),'attempt':int(a)} for i,s,a in con.execute("select id,state,attempt from work_orders where state in ('AUTHORIZED','READY','DISPATCHED','ENGINEERING','CANDIDATE','ACCEPTING','REJECTED_RETRYABLE') order by rowid")]
              leases=[{'id':str(i),'attempt':int(a),'owner':str(o)} for i,a,o in con.execute("select work_order_id,attempt,owner from worker_leases order by work_order_id")]
              k=con.execute("select state,attempt,reason from work_orders where id='KTRADE_RB1_SINGLE_TRACK_20261022'").fetchone()
              print(json.dumps({'settings':settings,'counts':counts,'active':active,'leases':leases,'ktrade':None if k is None else {'state':str(k[0]),'attempt':int(k[1]),'reason':str(k[2])}},separators=(',',':')))
          finally:
              con.close()
          '@
          $state=@(& python.exe -B -c $py $db)
          if($LASTEXITCODE-ne0 -or $state.Count-ne1){throw 'R220_DB_READONLY_FAILED'}
          Write-Host ('R220_DB_STATE='+$state[0])
          $store='C:\ProgramData\CKBR\release-store\ckb-plane'
          $activePtr=Join-Path $store 'state\active-release'
          if(Test-Path -LiteralPath $activePtr -PathType Leaf){
            $rid=[IO.File]::ReadAllText($activePtr).Trim()
            Write-Host ('R220_ACTIVE_RELEASE_ID='+$rid)
            $rexe=Join-Path (Join-Path (Join-Path $store 'releases') $rid) 'bin\ckb-plane.exe'
            if(Test-Path -LiteralPath $rexe -PathType Leaf){Write-Host ('R220_ACTIVE_RELEASE_EXE_SHA256='+(Sha $rexe))}
          }else{Write-Host 'R220_ACTIVE_RELEASE_ID=UNAVAILABLE'}
          if($procs.Count-eq1){
            $raw=@(& ([string]$procs[0].ExecutablePath) controller status --config $config --bridge-config $bridge 2>&1)
            Write-Host ('R220_STATUS_EXIT='+$LASTEXITCODE)
            Write-Host ('R220_STATUS_TEXT='+($raw -join ' '))
          }
          Write-Host 'R220_ELEVATED_PRECUTOVER_READONLY=PASS'
          Write-Host 'R220_LIVE_MUTATION=FALSE'
