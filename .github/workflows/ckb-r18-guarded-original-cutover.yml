name: R220 elevated startup-wrapper diagnosis
on:
  push:
    branches: [diagnostics/ckb-rb1-live-admission-20261022]
    paths: [.github/workflows/ckb-r18-guarded-original-cutover.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Read-only diagnose R220 staged startup failure
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version 3.0
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          if($env:RUNNER_NAME-cne'FORGE-CODEX-REMOTE' -or $who.Name-ine'LINKDEADKB\camar' -or
             ![Security.Principal.WindowsPrincipal]::new($who).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) -or
             $env:GITHUB_REPOSITORY-cne'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF-cne'refs/heads/diagnostics/ckb-rb1-live-admission-20261022' -or
             $env:GITHUB_RUN_ATTEMPT-cne'1' -or (& git.exe rev-parse HEAD).Trim()-cne$env:GITHUB_SHA -or
             @(& git.exe status --porcelain).Count-ne0){throw 'R220_DIAG_AUTHORITY_DRIFT'}
          $changed=@(& git.exe diff --name-only HEAD^ HEAD)
          if($changed.Count-ne1 -or $changed[0]-cne'.github/workflows/ckb-r18-guarded-original-cutover.yml'){throw 'R220_DIAG_SCOPE_DRIFT'}
          function Sha([string]$p){if(!(Test-Path -LiteralPath $p -PathType Leaf)){return 'MISSING'};(Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()}
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $wrapper='C:\ProgramData\CKBR\cutover\PLANE-R18-OWNER-CUTOVER-39809195564\Start-R18-Controller.ps1'
          $old='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R18-RB1-ADMISSION-20261023'
          $new='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R220-CONSOLIDATED-20261023'
          $oldExe=Join-Path $old 'bin\ckb-plane.exe'
          $newExe=Join-Path $new 'bin\ckb-plane.exe'
          $config=Join-Path $root 'config\autonomy.yaml'
          $bridge=Join-Path $root 'config\webui-bridge.json'
          $taskName='CKB-plane Controller'
          $task=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          $info=Get-ScheduledTaskInfo -TaskName $taskName -ErrorAction Stop
          Write-Host ('R220_DIAG_TASK_STATE='+[string]$task.State)
          Write-Host ('R220_DIAG_TASK_LAST_RESULT='+[string]$info.LastTaskResult)
          $procs=@(Get-CimInstance Win32_Process -Filter "Name='ckb-plane.exe'"|Where-Object{[string]$_.CommandLine-match'(?i)\bcontroller\s+run\b'})
          Write-Host ('R220_DIAG_CONTROLLER_COUNT='+$procs.Count)
          foreach($p in $procs){Write-Host ('R220_DIAG_CONTROLLER_PATH='+[string]$p.ExecutablePath);Write-Host ('R220_DIAG_CONTROLLER_SHA256='+(Sha ([string]$p.ExecutablePath)))}
          Write-Host ('R220_DIAG_WRAPPER_SHA256='+(Sha $wrapper))
          $lines=Get-Content -LiteralPath $wrapper
          for($i=0;$i-lt$lines.Count;$i++){Write-Host ('R220_WRAPPER_LINE_'+('{0:D3}'-f($i+1))+'='+$lines[$i])}
          foreach($dir in @($old,$new)){
            Write-Host ('R220_RELEASE_DIR='+$dir)
            if(Test-Path -LiteralPath $dir -PathType Container){
              foreach($file in @(Get-ChildItem -LiteralPath $dir -File -Recurse|Sort-Object FullName)){
                $rel=$file.FullName.Substring($dir.Length).TrimStart('\')
                Write-Host ('R220_RELEASE_FILE='+$rel+' SHA256='+(Sha $file.FullName))
              }
              foreach($mf in @('release-manifest.json','release-seal.json')){
                $mp=Join-Path $dir $mf
                if(Test-Path -LiteralPath $mp -PathType Leaf){
                  $txt=[IO.File]::ReadAllText($mp)
                  Write-Host ('R220_RELEASE_JSON_'+$mf+'='+$txt)
                }
              }
            }
          }
          if(Test-Path -LiteralPath $newExe -PathType Leaf){
            $raw=@(& $newExe controller status --config $config --bridge-config $bridge 2>&1)
            Write-Host ('R220_DIAG_NEW_STATUS_EXIT='+$LASTEXITCODE)
            Write-Host ('R220_DIAG_NEW_STATUS_TEXT='+($raw-join' '))
            $q=@(& $newExe controller qualify --config $config 2>&1)
            Write-Host ('R220_DIAG_NEW_QUALIFY_EXIT='+$LASTEXITCODE)
            Write-Host ('R220_DIAG_NEW_QUALIFY_TEXT='+($q-join' '))
          }
          $cutDir=Split-Path $wrapper -Parent
          foreach($f in @(Get-ChildItem -LiteralPath $cutDir -File|Where-Object{$_.LastWriteTimeUtc-gt([DateTime]::UtcNow.AddHours(-2))}|Sort-Object LastWriteTimeUtc)){
            Write-Host ('R220_RECENT_CUTOVER_FILE='+$f.FullName+' SHA256='+(Sha $f.FullName)+' MTIME='+$f.LastWriteTimeUtc.ToString('o'))
          }
          Write-Host 'R220_STARTUP_DIAG_READONLY=PASS'
