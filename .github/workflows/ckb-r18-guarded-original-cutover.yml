name: R220 qualified live-compatible guarded owner cutover
on:
  push:
    branches: [diagnostics/ckb-rb1-live-admission-20261022]
    paths: [.github/workflows/ckb-r18-guarded-original-cutover.yml]
permissions:
  contents: read
jobs:
  cutover:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Exact qualified R220 owner cutover with original rollback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-StrictMode -Version 3.0
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $who.Name -ine 'LINKDEADKB\camar' -or
             ![Security.Principal.WindowsPrincipal]::new($who).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/diagnostics/ckb-rb1-live-admission-20261022' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             (& git.exe rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or
             @(& git.exe status --porcelain).Count -ne 0){throw 'R220_ELEVATED_CUTOVER_AUTHORITY_DRIFT'}
          $changed=@(& git.exe diff --name-only HEAD^ HEAD)
          if($LASTEXITCODE-ne0 -or $changed.Count-ne1 -or $changed[0]-cne '.github/workflows/ckb-r18-guarded-original-cutover.yml'){
            throw 'R220_ELEVATED_CUTOVER_SCOPE_DRIFT'
          }

          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $old='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R18-RB1-ADMISSION-20261023'
          $new='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R220-LIVECOMPAT-20261023'
          $oldExe=Join-Path $old 'bin\ckb-plane.exe'
          $newExe=Join-Path $new 'bin\ckb-plane.exe'
          $config=Join-Path $root 'config\autonomy.yaml'
          $bridge=Join-Path $root 'config\webui-bridge.json'
          $db=Join-Path $root 'state\autonomy.db'
          $tokenPath=Join-Path $root 'state\operator.token'
          $taskName='CKB-plane Controller'
          $wrapper='C:\ProgramData\CKBR\cutover\PLANE-R18-OWNER-CUTOVER-39809195564\Start-R18-Controller.ps1'
          $oldHash='0f2474480a2ff075b52d524e2f6935d3e86903ff029657e23f50b4356b8d9ffc'
          $newHash='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          $wrapperHash='47d8a25fe7b60fb0b96874249ef2de2a59fbe95cce722538abe524b86954d577'
          $configHash='a14f210a146de9bd248bb4cfdc2e156b19c985a6c964a91881c4391f0a0190dc'
          $bridgeHash='afcbac12e6fe6b3545d3ca89b556418f4bb444fb54ca2911ebcbef28308d63f2'
          $candidateRun='40033968112'
          $candidateArtifact='r220-live-compatible-installed-source'
          $candidateSource='88f4a4df30ad63efa468f1bbdc780dde6ce4b191'
          $ownerProofRun='40034952106'
          $mergedMain='7b7d01f26cfe4d051956f82c7c45f6df507ecd0a'
          $registryHash='f625142599d2557342f637f0c65ec86be11598a95b80c9a625764795bfbfa84a'
          $evidence='C:\ProgramData\CKBR\cutover\PLANE-R220-LIVECOMPAT-20261023'
          $utf8=New-Object Text.UTF8Encoding($false)

          function Sha([string]$p){
            if(!(Test-Path -LiteralPath $p -PathType Leaf)){throw ('R220_MISSING_FILE='+$p)}
            (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          function Controllers {
            @((Get-CimInstance Win32_Process -Filter "Name='ckb-plane.exe'" -ErrorAction Stop)|Where-Object{
              [string]$_.CommandLine -match '(?i)\bcontroller\s+run\b'
            })
          }
          function OneAt([string]$path){
            $all=@(Controllers)
            if($all.Count-ne1 -or [string]$all[0].ExecutablePath -ine $path){throw ('R220_CONTROLLER_SINGLETON_MISMATCH count='+$all.Count+' expected='+$path)}
            $all[0]
          }
          function Token {
            $t=[IO.File]::ReadAllText($tokenPath).Trim()
            if($t.Length-ne64){throw 'R220_OPERATOR_TOKEN_INVALID'}
            $t
          }
          function NativeGet {
            $t=Token
            Invoke-RestMethod -Method Get -Uri 'http://127.0.0.1:8791/api/native' -Headers @{Authorization=('Bearer '+$t)} -TimeoutSec 5
          }
          function NativePost([string]$action){
            $t=Token
            Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8791/api/native' -Headers @{Authorization=('Bearer '+$t)} -ContentType 'application/json' -Body (@{action=$action}|ConvertTo-Json -Compress) -TimeoutSec 20
          }
          $readState=@'
          import json,sqlite3,sys
          db=sys.argv[1].replace('\\','/')
          con=sqlite3.connect('file:'+db+'?mode=ro',uri=True,timeout=8)
          con.execute('pragma query_only=on')
          try:
              settings={str(k):str(v) for k,v in con.execute("select key,value from settings where key in ('paused','autonomy_authority','autonomy_generation','autonomy_heartbeat')")}
              leases=[{'id':str(i),'attempt':int(a),'owner':str(o)} for i,a,o in con.execute("select work_order_id,attempt,owner from worker_leases order by work_order_id")]
              active=[{'id':str(i),'state':str(st),'attempt':int(a)} for i,st,a in con.execute("select id,state,attempt from work_orders where state in ('DISPATCHED','ENGINEERING','ACCEPTING') order by rowid")]
              unfinished=[{'id':int(i),'work_order_id':str(w),'attempt':int(a),'pid':int(p)} for i,w,a,p in con.execute("select id,work_order_id,attempt,pid from process_records where finished=0 order by id")]
              print(json.dumps({'settings':settings,'leases':leases,'active':active,'unfinished':unfinished},separators=(',',':')))
          finally:
              con.close()
          '@
          function ReadState {
            $x=@(& python.exe -B -c $readState $db)
            if($LASTEXITCODE-ne0 -or $x.Count-ne1){throw 'R220_DB_READ_FAILED'}
            $x[0]|ConvertFrom-Json
          }
          function Status([string]$exe){
            $raw=@(& $exe controller status --config $config --bridge-config $bridge 2>&1)
            if($LASTEXITCODE-ne0){throw ('R220_STATUS_FAILED='+($raw-join' '))}
            try{($raw-join[Environment]::NewLine)|ConvertFrom-Json}catch{throw 'R220_STATUS_JSON_INVALID'}
          }

          $gh=(Get-Command gh.exe -ErrorAction Stop).Source
          function AssertGreenRun([string]$repository,[string]$run,[string]$head){
            $actual=(& $gh run view $run -R $repository --json status,conclusion,headSha --jq '[.status,.conclusion,.headSha]|join(" ")' 2>&1|Out-String).Trim()
            if($LASTEXITCODE-ne0 -or $actual-cne('completed success '+$head)){
              throw ('R220_PREREQUISITE_NOT_GREEN run='+$run+' observed='+$actual)
            }
          }
          AssertGreenRun 'spoonman136668-ai/ckb-plane' $candidateRun $candidateSource
          AssertGreenRun 'spoonman136668-ai/FORGE' $ownerProofRun 'd0c2961fdd41e2572b226968aa0218e51be0f7ca'
          Write-Host 'R220_WINDOWS_AND_OWNER_NATIVE_PROOFS=PASS'
          $mainObserved=(& $gh api repos/spoonman136668-ai/ckb-plane/commits/main --jq '.sha' 2>&1 | Out-String).Trim()
          if($LASTEXITCODE-ne0 -or $mainObserved-cne$mergedMain){throw ('R220_CKB_MAIN_DRIFT='+$mainObserved)}
          $incoming=Join-Path $env:RUNNER_TEMP ('r220-live-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $incoming){throw 'R220_ARTIFACT_STAGING_PATH_REUSED'}
          New-Item -ItemType Directory -Path $incoming -ErrorAction Stop|Out-Null
          & $gh run download $candidateRun -R spoonman136668-ai/ckb-plane -n $candidateArtifact -D $incoming
          if($LASTEXITCODE-ne0){throw 'R220_ARTIFACT_DOWNLOAD_FAILED'}
          $candidate=Join-Path $incoming 'ckb-plane.exe'
          $manifestFile=Join-Path $incoming 'manifest.json'
          $manifest=Get-Content -LiteralPath $manifestFile -Raw|ConvertFrom-Json
          if($manifest.schema-cne'ckb-plane.r220-live-compatible-installed-source.v1' -or
             $manifest.source_sha-cne$candidateSource -or
             [string]$manifest.run_id-cne$candidateRun -or
             $manifest.sha256-cne$newHash -or
             [string]$manifest.owner_registry_sha256-cne$registryHash -or
             [string]$manifest.owner_native_runtime_proof-cne'PENDING' -or
             [string]$manifest.live_config_sha256-cne$configHash -or
             [string]$manifest.live_bridge_sha256-cne$bridgeHash -or
             [string]$manifest.predecessor_live_sha256-cne$oldHash -or
             [bool]$manifest.live_promoted -or (Sha $candidate)-cne$newHash){
            throw 'R220_QUALIFIED_ARTIFACT_IDENTITY_DRIFT'
          }

          if((Sha $oldExe)-cne$oldHash -or (Sha $wrapper)-cne$wrapperHash -or
             (Sha $config)-cne$configHash -or (Sha $bridge)-cne$bridgeHash){throw 'R220_LIVE_PREIMAGE_DRIFT'}
          $task=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          if([string]$task.State-cne'Running' -or @($task.Actions).Count-ne1 -or
             [string]$task.Actions[0].WorkingDirectory -ine $root){throw 'R220_TASK_PREIMAGE_DRIFT'}
          $p=OneAt $oldExe
          $pre=NativeGet
          if([string]$pre.authority-cne'plane' -or [string]$pre.generation-cne'6' -or [bool]$pre.heartbeat_stale -or [bool]$pre.accepted_ref_mutation_allowed){
            throw 'R220_NATIVE_PRECONTRACT_DRIFT'
          }
          $prePaused=[bool]$pre.paused
          $state=ReadState
          if(@($state.leases).Count-ne0 -or @($state.active).Count-ne0 -or @($state.unfinished).Count-ne0){throw 'R220_ACTIVE_EXECUTION_PREMUTATION'}
          Write-Host 'R220_ALL_PREMUTATION_CUSTODY_AND_IDLE_CHECKS=PASS'

          $originalBytes=[IO.File]::ReadAllBytes($wrapper)
          $originalText=[Text.Encoding]::UTF8.GetString($originalBytes)
          if(![Linq.Enumerable]::SequenceEqual([byte[]]$originalBytes,[byte[]][Text.Encoding]::UTF8.GetBytes($originalText)) -or
             ($originalText.Split(@($old),[StringSplitOptions]::None).Length-1)-ne1 -or
             $originalText.Contains($new)){throw 'R220_WRAPPER_RELEASE_PIN_AMBIGUOUS'}

          if(!(Test-Path -LiteralPath $new)){
            Copy-Item -LiteralPath $old -Destination $new -Recurse -ErrorAction Stop
          }
          if((Sha $oldExe)-cne$oldHash){throw 'R220_OLD_RELEASE_CHANGED_DURING_STAGE'}
          Copy-Item -LiteralPath $candidate -Destination $newExe -Force -ErrorAction Stop
          if((Sha $newExe)-cne$newHash){throw 'R220_STAGED_CANDIDATE_HASH_MISMATCH'}
          New-Item -ItemType Directory -Force -Path $evidence|Out-Null
          [IO.File]::WriteAllBytes((Join-Path $evidence 'wrapper.preimage.ps1'),$originalBytes)
          Copy-Item -LiteralPath $manifestFile -Destination (Join-Path $evidence 'qualified-manifest.json') -Force

          $pausedByUs=$false;$stopped=$false;$swapped=$false
          try{
            if(!$prePaused){
              [void](NativePost 'pause')
              $pausedByUs=$true
              Start-Sleep -Seconds 2
              $paused=NativeGet
              if(![bool]$paused.paused){throw 'R220_PAUSE_FENCE_FAILED'}
            }
            $state=ReadState
            if(@($state.leases).Count-ne0 -or @($state.active).Count-ne0 -or @($state.unfinished).Count-ne0){throw 'R220_ACTIVE_EXECUTION_AFTER_PAUSE'}
            Write-Host 'R220_PAUSE_AND_IDLE_FENCE=PASS'

            Stop-ScheduledTask -TaskName $taskName -ErrorAction Stop
            $stopped=$true
            $seen=@(Controllers)
            if($seen.Count-gt1){throw 'R220_MULTIPLE_CONTROLLERS_DURING_STOP'}
            if($seen.Count-eq1){
              if([string]$seen[0].ExecutablePath -ine $oldExe){throw 'R220_UNEXPECTED_CONTROLLER_PATH_DURING_STOP'}
              Stop-Process -Id $seen[0].ProcessId -Force -ErrorAction Stop
            }
            Start-Sleep -Seconds 2
            if(@(Controllers).Count-ne0){throw 'R220_OLD_CONTROLLER_REMAINED_RUNNING'}
            $ready=$false
            for($i=0;$i-lt30;$i++){
              if([string](Get-ScheduledTask -TaskName $taskName).State -eq'Ready'){$ready=$true;break}
              Start-Sleep -Seconds 1
            }
            if(!$ready){throw 'R220_TASK_NOT_READY_AFTER_STOP'}
            Write-Host 'R220_OLD_CONTROLLER_STOPPED=PASS'

            $normalWrapper=$originalText.Replace($old,$new)
            [IO.File]::WriteAllBytes($wrapper,[Text.Encoding]::UTF8.GetBytes($normalWrapper))
            $swapped=$true
            if([IO.File]::ReadAllText($wrapper)-cne$normalWrapper){throw 'R220_WRAPPER_WRITE_MISMATCH'}
            Start-ScheduledTask -TaskName $taskName -ErrorAction Stop
            $started=$false
            for($i=0;$i-lt30;$i++){
              Start-Sleep -Seconds 1
              $all=@(Controllers)
              if($all.Count-gt1){throw 'R220_MORE_THAN_ONE_CONTROLLER'}
              if($all.Count-eq1 -and [string]$all[0].ExecutablePath -ieq$newExe){$started=$true;break}
            }
            if(!$started){throw 'R220_NEW_CONTROLLER_NOT_RUNNING'}
            $post=Status $newExe
            if([string]$post.authority-cne'plane' -or [string]$post.generation-cne'6' -or [bool]$post.heartbeat_stale -or [bool]$post.accepted_ref_mutation_allowed){
              throw 'R220_POSTSTART_AUTHORITY_DRIFT'
            }
            if(-not[bool]$post.paused){throw 'R220_POSTSTART_NOT_FENCED'}
            $state=ReadState
            if(@($state.leases).Count-ne0 -or @($state.active).Count-ne0 -or @($state.unfinished).Count-ne0){throw 'R220_UNEXPECTED_EXECUTION_WHILE_FENCED'}
            Write-Host 'R220_NEW_CONTROLLER_FENCED_VERIFICATION=PASS'

            if(!$prePaused){
              [void](NativePost 'resume')
              Start-Sleep -Seconds 3
            }
            $final=Status $newExe
            if([string]$final.authority-cne'plane' -or [string]$final.generation-cne'6' -or [bool]$final.heartbeat_stale -or
               [bool]$final.accepted_ref_mutation_allowed -or [bool]$final.paused-ne$prePaused){throw 'R220_FINAL_CONTROLLER_CONTRACT_DRIFT'}
            $finalState=ReadState
            if((Sha $newExe)-cne$newHash){throw 'R220_LIVE_BINARY_HASH_DRIFT'}
            $receipt=[ordered]@{
              schema='ckb-plane.r220.live-cutover.v1';status='CUTOVER_PASS';observed_at_utc=[DateTimeOffset]::UtcNow.ToString('o')
              source_sha=$candidateSource;qualified_windows_run=$candidateRun;owner_native_proof_run=$ownerProofRun;merged_main_sha=$mergedMain
              prior_release=$old;live_release=$new;prior_executable_sha256=$oldHash;live_executable_sha256=$newHash
              wrapper_sha256_before=$wrapperHash;authority=[string]$final.authority;generation=[string]$final.generation
              paused=[bool]$final.paused;heartbeat_stale=[bool]$final.heartbeat_stale
              accepted_ref_mutation_allowed=[bool]$final.accepted_ref_mutation_allowed
              ktrade_action_issued=$false;worker_leases_at_cutover=0;no_unapproved_workorder_retries=$true
              second_controller=$false;task_identity_preserved=$true
            }
            [IO.File]::WriteAllText((Join-Path $evidence 'cutover-pass.json'),($receipt|ConvertTo-Json -Depth 12),$utf8)
            Write-Host 'R220_LIVE_CUTOVER=PASS'
            Write-Host ('R220_LIVE_EXE_SHA256='+$newHash)
            Write-Host 'R220_AUTHORITY=plane'
            Write-Host 'R220_GENERATION=6'
            Write-Host 'R220_KTRADE_WORKORDER_ACTIONS=NONE'
            Write-Host ('R220_PAUSED_RESTORED='+$prePaused)
          }catch{
            $original=[string]$_.Exception.Message
            Write-Host ('R220_CUTOVER_BLOCKED='+$original)
            if($stopped){
              try{
                Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
                foreach($q in @(Controllers)){
                  if([string]$q.ExecutablePath -ieq$oldExe -or [string]$q.ExecutablePath -ieq$newExe){
                    Stop-Process -Id $q.ProcessId -Force -ErrorAction SilentlyContinue
                  }
                }
                if($swapped){[IO.File]::WriteAllBytes($wrapper,$originalBytes)}
                if((Sha $wrapper)-cne$wrapperHash){throw 'R220_ROLLBACK_WRAPPER_HASH_MISMATCH'}
                Start-ScheduledTask -TaskName $taskName -ErrorAction Stop
                Start-Sleep -Seconds 5
                [void](OneAt $oldExe)
                $rb=Status $oldExe
                if([string]$rb.authority-cne'plane' -or [string]$rb.generation-cne'6' -or [bool]$rb.heartbeat_stale -or [bool]$rb.accepted_ref_mutation_allowed){
                  throw 'R220_ROLLBACK_AUTHORITY_DRIFT'
                }
                if(!$prePaused -and [bool]$rb.paused){
                  [void](NativePost 'resume');Start-Sleep -Seconds 2;$rb=Status $oldExe
                }
                if([bool]$rb.paused-ne$prePaused){throw 'R220_ROLLBACK_PAUSE_STATE_DRIFT'}
                $rbState=ReadState
                Write-Host 'R220_EXACT_ORIGINAL_ROLLBACK=PASS'
              }catch{
                Write-Host ('R220_ROLLBACK_FAILED='+[string]$_.Exception.Message)
              }
            }elseif($pausedByUs -and !$prePaused){
              try{[void](NativePost 'resume')}catch{}
            }
            throw
          }
