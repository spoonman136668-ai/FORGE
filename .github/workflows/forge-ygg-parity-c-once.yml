name: FORGE Yggdrasil C1 C2 bounded independently-reviewed autonomous cycle
on:
  push:
    branches: [research/forge-ygg-c-firstuse-launch]
    paths: ['research/forge-ygg-parity-c/launch.json']
permissions:
  contents: read
  issues: read
  actions: read
concurrency:
  group: forge-ygg-c-two-originals-one-shot
  cancel-in-progress: false
jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify two new operator-approved first-use reservations before science
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "${GITHUB_REF}" = refs/heads/research/forge-ygg-c-firstuse-launch
          test "$(git diff --name-only HEAD^ HEAD)" = research/forge-ygg-parity-c/launch.json
          test "$(git rev-parse HEAD^)" = "$(python3 -c 'import json;print(json.load(open("research/forge-ygg-parity-c/launch.json"))["source_commit"])')"
          test "$(git rev-parse HEAD:research/forge-ygg-parity-c/prereg.json)" = ff6404eb075c9f6c1c18783cd6536bf439c80728
          test "$(git rev-parse HEAD:research/forge-ygg-parity-c/run_original.py)" = 62aa6b65834da4a9c18a45a3646f642c86f71648
          test "$(git rev-parse HEAD:research/forge-ygg-parity-c/independent_review.py)" = 951033efea3d6ec427f67382b49c9f7ba5423ddf
          mkdir -p "$RUNNER_TEMP/b-clearance"
          git fetch --no-tags origin refs/heads/research/forge-ygg-c-firstuse-claims
          git show FETCH_HEAD:Y-FORGE-PARITY-C1-ONSET1.json > "$RUNNER_TEMP/b-clearance/C1.json"
          git show FETCH_HEAD:Y-FORGE-PARITY-C2-ONSET1.json > "$RUNNER_TEMP/b-clearance/C2.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"b-clearance"
          q=json.loads((p/"C1.json").read_bytes())
          x=q.get("operator_approval_comment_id")
          if type(x) is not int or not 0<x<2**63:raise SystemExit("YGG_B_APPROVAL_ID_INVALID")
          (p/"comment-id").write_text(str(x))
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/$(cat "$RUNNER_TEMP/b-clearance/comment-id")" > "$RUNNER_TEMP/b-clearance/approval.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=research/forge-ygg-c-firstuse-launch&event=push&per_page=100" > "$RUNNER_TEMP/b-clearance/runs.json"
          python3 -B research/forge-ygg-parity-c/budget_gate.py \
            --launch research/forge-ygg-parity-c/launch.json \
            --claim-c1 "$RUNNER_TEMP/b-clearance/C1.json" \
            --claim-c2 "$RUNNER_TEMP/b-clearance/C2.json" \
            --approval "$RUNNER_TEMP/b-clearance/approval.json" \
            --runs "$RUNNER_TEMP/b-clearance/runs.json" \
            --source "$(git rev-parse HEAD^)" --run-id "$GITHUB_RUN_ID" --head "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/b-clearance/receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: forge-ygg-c-two-first-use-clearance
          path: ${{ runner.temp }}/b-clearance/receipt.json
          retention-days: 90
          if-no-files-found: error

  c1-original:
    needs: authorization
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/Yggdrasil
          ref: 5797a257a75fe139313e8486cd1a1ae79c44b148
          path: pinned-yggdrasil
          persist-credentials: false
      - name: Execute bounded fresh Yggdrasil C1 scientific original exactly once
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "$(git -C pinned-yggdrasil rev-parse HEAD)" = 5797a257a75fe139313e8486cd1a1ae79c44b148
          mkdir -p "$RUNNER_TEMP/ygg-c1"
          printf 'FROZEN_C1_FIRST_USE_CONSUMED_BEFORE_COMPUTE\n' > "$RUNNER_TEMP/ygg-c1/started.txt"
          python3 -B research/forge-ygg-parity-c/run_original.py \
            --study Y-FORGE-PARITY-C1-ONSET1 --ygg-root pinned-yggdrasil \
            --out "$RUNNER_TEMP/ygg-c1/original.json"
          (cd "$RUNNER_TEMP/ygg-c1" && sha256sum original.json > original.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-ygg-c1-original
          path: ${{ runner.temp }}/ygg-c1
          retention-days: 90
          if-no-files-found: warn

  c1-independent-review:
    needs: c1-original
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: forge-ygg-c1-original
          path: ${{ runner.temp }}/ygg-c1
      - name: Independently recompute scientific metrics and outcome from 768 sealed cases
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1
          cd "$RUNNER_TEMP/ygg-c1"
          sha256sum -c original.sha256
          test -s started.txt
          python3 -B "$GITHUB_WORKSPACE/research/forge-ygg-parity-c/independent_review.py" \
            --manifest "$GITHUB_WORKSPACE/research/forge-ygg-parity-c/prereg.json" \
            --original "$PWD/original.json" \
            --experiment-id Y-FORGE-PARITY-C1-ONSET1 \
            --out "$PWD/independent-review.json"
      - uses: actions/upload-artifact@v4
        with:
          name: forge-ygg-c1-independent-review
          path: ${{ runner.temp }}/ygg-c1/independent-review.json
          retention-days: 90
          if-no-files-found: error

  c2-automatic-original:
    needs: [c1-original, c1-independent-review]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: forge-ygg-c1-original
          path: ${{ runner.temp }}/ygg-c1
      - uses: actions/download-artifact@v4
        with:
          name: forge-ygg-c1-independent-review
          path: ${{ runner.temp }}/ygg-c1-review
      - name: Fail closed unless independent C1 original and review requalify
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1
          (cd "$RUNNER_TEMP/ygg-c1" && sha256sum -c original.sha256)
          python3 -B - <<'PY'
          import importlib.util,json,os,pathlib
          base=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"research/forge-ygg-parity-c"
          spec=importlib.util.spec_from_file_location("ygg_reviewer",base/"independent_review.py")
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          expect=mod.verify((base/"prereg.json").read_bytes(),(temp/"ygg-c1/original.json").read_bytes(),"Y-FORGE-PARITY-C1-ONSET1")
          got=json.loads((temp/"ygg-c1-review/independent-review.json").read_bytes())
          if expect!=got or got.get("independently_validated") is not True:
              raise SystemExit("YGG_C1_INDEPENDENT_EVIDENCE_FAILED")
          print("YGG_AUTOMATIC_C1_TO_C2_REVIEW_GATE=PASS")
          PY
      - uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/Yggdrasil
          ref: 5797a257a75fe139313e8486cd1a1ae79c44b148
          path: pinned-yggdrasil
          persist-credentials: false
      - name: Automatically execute new C2 frozen cohort
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "$(git -C pinned-yggdrasil rev-parse HEAD)" = 5797a257a75fe139313e8486cd1a1ae79c44b148
          mkdir -p "$RUNNER_TEMP/ygg-c2"
          printf 'FROZEN_C2_FIRST_USE_CONSUMED_BEFORE_COMPUTE\n' > "$RUNNER_TEMP/ygg-c2/started.txt"
          python3 -B research/forge-ygg-parity-c/run_original.py \
            --study Y-FORGE-PARITY-C2-ONSET1 --ygg-root pinned-yggdrasil \
            --parent-review "$RUNNER_TEMP/ygg-c1-review/independent-review.json" \
            --out "$RUNNER_TEMP/ygg-c2/original.json"
          (cd "$RUNNER_TEMP/ygg-c2" && sha256sum original.json > original.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-ygg-c2-autonomous-original
          path: ${{ runner.temp }}/ygg-c2
          retention-days: 90
          if-no-files-found: warn

  c2-independent-review-and-c3:
    needs: [c1-original, c1-independent-review, c2-automatic-original]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: forge-ygg-c1-independent-review
          path: ${{ runner.temp }}/ygg-c1-review
      - uses: actions/download-artifact@v4
        with:
          name: forge-ygg-c2-autonomous-original
          path: ${{ runner.temp }}/ygg-c2
      - name: Independent C2 sealed review and bounded C3 proposal only
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1
          cd "$RUNNER_TEMP/ygg-c2"
          sha256sum -c original.sha256
          test -s started.txt
          python3 -B "$GITHUB_WORKSPACE/research/forge-ygg-parity-c/independent_review.py" \
            --manifest "$GITHUB_WORKSPACE/research/forge-ygg-parity-c/prereg.json" \
            --original "$PWD/original.json" \
            --parent-review "$RUNNER_TEMP/ygg-c1-review/independent-review.json" \
            --experiment-id Y-FORGE-PARITY-C2-ONSET1 \
            --out "$PWD/independent-review.json"
          python3 -B "$GITHUB_WORKSPACE/research/forge-ygg-parity-c/successor.py" \
            --c1-review "$RUNNER_TEMP/ygg-c1-review/independent-review.json" \
            --c2-review "$PWD/independent-review.json" \
            --out "$PWD/c3-proposal.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-ygg-c2-review-and-c3-proposal
          path: |
            ${{ runner.temp }}/ygg-c2/independent-review.json
            ${{ runner.temp }}/ygg-c2/c3-proposal.json
          retention-days: 90
          if-no-files-found: warn
