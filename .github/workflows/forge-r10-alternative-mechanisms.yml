name: FORGE R10 fresh gradient conflict and episodic memory development review
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/r10-mechanism-screen/**'
      - '.github/workflows/forge-r10-alternative-mechanisms.yml'
permissions:
  contents: read
  actions: read
jobs:
  source-only:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify distinct mechanism source and negative first-use boundaries
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/r10-mechanism-screen -p 'test_*.py' -v
          python -B -m py_compile research/r10-mechanism-screen/protocol.py research/r10-mechanism-screen/run.py research/r10-mechanism-screen/review.py
          test ! -f research/r10-mechanism-screen/launch.json
          echo 'R10_SOURCE_ONLY_NO_NEW_FIRST_USE=PASS'
  two-method-development:
    needs: source-only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/FORGE
          ref: 7f2f791f98d92ad932e0f530a7d23d0330a15643
          path: pinned-r36-methods
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/Wingless
          ref: b1e4972f04142f1f35f76f9483b12491dec4846c
          path: pinned-wingless
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: forge-r9-independent-learned-representation-development-review
          run-id: 38662331650
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r9-parent
      - name: Screen actual gradient-conflict and fixed-memory mechanisms on new development seeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r10-data"
          python3 -B research/r10-mechanism-screen/run.py \
            --frozen research/r10-mechanism-screen/frozen.json \
            --parent-review "$RUNNER_TEMP/r9-parent/review.json" \
            --wingless-root "$GITHUB_WORKSPACE/pinned-wingless" \
            --method-root "$GITHUB_WORKSPACE/pinned-r36-methods" \
            --forge-root "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/r10-data/measurement.json"
          jq -e '
            .schema == "forge.r10.two-distinct-learning-mechanisms.public-development.v1" and
            .candidate_ids == ["W36-C2","W36-C4"] and
            (.folds | length) == 3 and
            .first_use_claims == 0 and .new_originals_executed == 0 and
            .sealed_cohorts_accessed == false and .scientific_accepted == false
          ' "$RUNNER_TEMP/r10-data/measurement.json" > /dev/null
          (cd "$RUNNER_TEMP/r10-data" && sha256sum measurement.json > sha256.txt && sha256sum --check sha256.txt)
          echo 'R10_REAL_ALTERNATIVE_METHODS_NEW_DEVELOPMENT=PASS'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-r10-two-alternate-mechanisms-genuine-dev
          path: |
            ${{ runner.temp }}/r10-data/measurement.json
            ${{ runner.temp }}/r10-data/sha256.txt
          retention-days: 90
          if-no-files-found: error
  independent-development-witness:
    needs: two-method-development
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/Wingless
          ref: b1e4972f04142f1f35f76f9483b12491dec4846c
          path: pinned-wingless
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: forge-r9-independent-learned-representation-development-review
          run-id: 38662331650
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r9-parent
      - uses: actions/download-artifact@v4
        with:
          name: forge-r10-two-alternate-mechanisms-genuine-dev
          path: ${{ runner.temp }}/r10-data
      - name: Independently reaggregate all 288 generator-balanced new development rows
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/r10-data" && sha256sum --check sha256.txt)
          mkdir -p "$RUNNER_TEMP/r10-review"
          python3 -B research/r10-mechanism-screen/review.py \
            --frozen research/r10-mechanism-screen/frozen.json \
            --parent-review "$RUNNER_TEMP/r9-parent/review.json" \
            --record "$RUNNER_TEMP/r10-data/measurement.json" \
            --wingless-root "$GITHUB_WORKSPACE/pinned-wingless" \
            --out "$RUNNER_TEMP/r10-review/review.json"
          jq -e '
            .schema == "forge.r10.independent-two-method-real-development-review.v1" and
            .independent_row_reaggregations == 288 and
            .independent_method_identities_checked == true and
            (.ranked_heldout_blind_development_candidates | length) == 2 and
            .method_superiority_established == false and
            .new_scientific_first_use_authorized == false and
            .sealed_cohort_accessed == false and
            .originals_executed == 0 and .scientific_accepted == false
          ' "$RUNNER_TEMP/r10-review/review.json" > /dev/null
          (cd "$RUNNER_TEMP/r10-review" && sha256sum review.json > sha256.txt && sha256sum --check sha256.txt)
          echo 'R10_INDEPENDENT_REAL_TWO_METHOD_REAGGREGATION=PASS'
          echo 'R10_PROSPECTIVE_FUTURE_COHORTS_UNTOUCHED=PASS'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-r10-independent-alternate-mechanism-development-review
          path: |
            ${{ runner.temp }}/r10-review/review.json
            ${{ runner.temp }}/r10-review/sha256.txt
          retention-days: 90
          if-no-files-found: error
