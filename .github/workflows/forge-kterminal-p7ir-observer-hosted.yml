name: FORGE K-Terminal PR73 P5 exact-head hosted Windows qualification
on:
  push:
    branches: [qualification/kterminal-p5-pr73-forge-hosted-20261105]
permissions:
  contents: read
concurrency:
  group: forge-kterminal-p5-pr73-${{ github.sha }}
  cancel-in-progress: false
jobs:
  kterminal-p5-windows:
    runs-on: windows-2022
    timeout-minutes: 95
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GOMEMLIMIT: '1536MiB'
      K_TERMINAL_EXECUTION_MODE: PAPER
      K_TERMINAL_P5_LATENCY: '0'
      K_TERMINAL_NATIVE_TIMING: '0'
      KTERM_HEAD: bcebdc1a7a0487f9d6061a8e643c76069335d896
      FORGE_QUAL_BASE: eb31df857423e14a8319b244d2417d1ee740c27f
    steps:
      - name: Checkout exact FORGE qualification source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check qualified source-only scope and isolated Windows admission
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE') { throw 'FORGE_KTERM_REPO_DRIFT' }
          if ($env:GITHUB_REF -cne 'refs/heads/qualification/kterminal-p5-pr73-forge-hosted-20261105') { throw 'FORGE_KTERM_BRANCH_DRIFT' }
          if ($env:GITHUB_EVENT_NAME -cne 'push' -or $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'FORGE_KTERM_RUNNER_DRIFT' }
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'FORGE_KTERM_SHA_DRIFT' }
          git merge-base --is-ancestor $env:FORGE_QUAL_BASE HEAD
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_KTERM_QUAL_BASE_DRIFT' }
          $changed=@(git diff --name-only $env:FORGE_QUAL_BASE HEAD)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/forge-kterminal-p7ir-observer-hosted.yml') { throw 'FORGE_KTERM_SOURCE_SCOPE_DRIFT' }
          if (@(git status --porcelain).Count -ne 0) { throw 'FORGE_KTERM_DIRTY_CHECKOUT' }
          Write-Host 'FORGE_KTERM_ISOLATED_WINDOWS_SOURCE_SCOPE=PASS'
      - name: Checkout pinned private K-Terminal PR73 without retained token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: bcebdc1a7a0487f9d6061a8e643c76069335d896
          path: kterminal-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.FORGE_KTERM_QUAL }}
      - name: Use pinned original Go 1.26.5 Windows toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify exact private source and no broker credentials
        shell: pwsh
        working-directory: kterminal-private
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:KTERM_HEAD) { throw 'FORGE_KTERM_PRIVATE_SHA_DRIFT' }
          if ((git rev-parse 'HEAD:pkg/native-canceled-buy-stage2_test.go').Trim() -cne '2b7985e2e92a5df69e1db35d499d98c12dcc978c') { throw 'FORGE_KTERM_ORIGINAL_TEST_BLOB_DRIFT' }
          if ((go version) -notmatch 'go1\.26\.5 windows/amd64') { throw 'FORGE_KTERM_GO_DRIFT' }
          if ($env:K_TERMINAL_EXECUTION_MODE -cne 'PAPER') { throw 'FORGE_KTERM_PAPER_MODE_DRIFT' }
          if (@(git status --porcelain).Count -ne 0) { throw 'FORGE_KTERM_PRIVATE_DIRTY' }
          foreach($key in @('COINBASE_API_KEY','COINBASE_API_SECRET','CDP_API_KEY_NAME','CDP_API_KEY_PRIVATE_KEY','K_TERMINAL_API_KEY','K_TERMINAL_API_SECRET')) {
            if ([Environment]::GetEnvironmentVariable($key)) { throw 'FORGE_KTERM_BROKER_CREDENTIAL_PRESENT' }
          }
          Write-Host 'FORGE_KTERM_PINNED_PRIVATE_SOURCE=PASS;NO_BROKER_POSTS=TRUE'
      - name: Repeat original two-second native maker window as focused diagnosis
        shell: pwsh
        working-directory: kterminal-private
        run: |
          $ErrorActionPreference='Stop'
          $drive=[IO.Path]::GetPathRoot($env:RUNNER_TEMP)
          $root=Join-Path $drive ('ktforge-'+$env:GITHUB_RUN_ID)
          if (-not [IO.Path]::IsPathRooted($root) -or $root.Length -gt 60 -or (Test-Path -LiteralPath $root)) { throw 'FORGE_KTERM_TEST_ROOT_UNSAFE' }
          $env:K_TERMINAL_TEST_WORKSPACE=$root
          $env:KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT=Join-Path $root 'tail'
          $env:KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT=Join-Path $root 'post'
          $env:KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT=Join-Path $root 'private'
          foreach ($dir in @($root,$env:KABOOM_STAGE3_NATIVE_TAIL_RETENTION_ROOT,$env:KABOOM_STAGE3_AUTHENTICATED_POST_RETENTION_ROOT,$env:KABOOM_STAGE3_PRIVATE_V2_RETENTION_ROOT)) { [void][IO.Directory]::CreateDirectory($dir) }
          $name='TestCanceledBuyRetryActualAllNineMakerAttemptsWithinOriginalWindow'
          $out=Join-Path $env:RUNNER_TEMP 'forge-kterminal-focused-private.jsonl'
          $stderr=Join-Path $env:RUNNER_TEMP 'forge-kterminal-focused-private.stderr'
          & go test -json -p 1 -parallel 1 -count=3 -timeout 12m "-run=^$name$" ./pkg 2> $stderr | Out-File -LiteralPath $out -Encoding utf8
          $rc=$LASTEXITCODE
          $events=@(Get-Content -LiteralPath $out | ForEach-Object { try { $_ | ConvertFrom-Json -ErrorAction Stop } catch {$null} })
          $passes=@($events | Where-Object { $_.Action -ceq 'pass' -and $_.Test -ceq $name }).Count
          if ($rc -ne 0 -or $passes -ne 3) {
            $class='UNCLASSIFIED'
            foreach ($evt in @($events | Where-Object { $_.Action -ceq 'output' -and $_.Test -ceq $name })) {
              if ([string]$evt.Output -match 'full original native maker budget failed: posts=([0-9]+)') {
                if ([int]$Matches[1] -eq 9) {$class='TWO_SECOND_WINDOW_OVERRUN'}else{$class='ATTEMPT_BUDGET_TRUNCATED'}
                break
              }
            }
            Write-Host ('FORGE_KTERM_FOCUSED_FAILURE_CLASS='+$class)
            Write-Host ('FORGE_KTERM_FOCUSED_PASS_REPETITIONS='+$passes)
            throw 'FORGE_KTERM_FOCUSED_WINDOW_FAILED'
          }
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'forge-kterm-window.ok') -Value 'PASS' -NoNewline
          Write-Host 'FORGE_KTERM_ORIGINAL_TWO_SECOND_WINDOW_X3=PASS'
      - name: Run pinned Windows PowerShell 5.1 privacy recorder test
        shell: pwsh
        working-directory: kterminal-private
        run: |
          $ErrorActionPreference='Stop'
          $powershell51=Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $test=Join-Path (Get-Location).Path 'verification\test-kterminal-recorder-v1.2.ps1'
          $rec=Join-Path (Get-Location).Path 'verification\KTerminal-Live-Session-Recorder-v1.2.ps1'
          if (-not (Test-Path -LiteralPath $powershell51) -or -not (Test-Path -LiteralPath $test) -or -not (Test-Path -LiteralPath $rec)) { throw 'FORGE_KTERM_RECORDER_SOURCE_MISSING' }
          & $powershell51 -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test -Recorder $rec
          if ($LASTEXITCODE -ne 0) { throw 'FORGE_KTERM_RECORDER_PRIVACY_FAILED' }
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'forge-kterm-recorder.ok') -Value 'PASS' -NoNewline
          Write-Host 'FORGE_KTERM_POWERSHELL51_PRIVACY_RECORDER=PASS'
      - name: Mandatory exact private SHA complete Windows Go regression
        shell: pwsh
        working-directory: kterminal-private
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:KTERM_HEAD) { throw 'FORGE_KTERM_FULL_SHA_DRIFT' }
          $out=Join-Path $env:RUNNER_TEMP 'forge-kterm-full-private.jsonl'
          $stderr=Join-Path $env:RUNNER_TEMP 'forge-kterm-full-private.stderr'
          $sw=[Diagnostics.Stopwatch]::StartNew()
          & go test -json -p 1 -parallel 1 -count=1 -timeout 65m ./... 2> $stderr | Out-File -LiteralPath $out -Encoding utf8
          $rc=$LASTEXITCODE
          $sw.Stop()
          $fail=@(Get-Content -LiteralPath $out | ForEach-Object { try { $_ | ConvertFrom-Json -ErrorAction Stop } catch { $null } } | Where-Object { $_.Action -ceq 'fail' })
          Write-Host ('FORGE_KTERM_FULL_ELAPSED_MS='+$sw.ElapsedMilliseconds)
          Write-Host ('FORGE_KTERM_FULL_FAILED_EVENT_COUNT='+$fail.Count)
          # Bounded, syntax-validated Go test roots only; no fixture data, errors or raw logs.
          $validFailures=@($fail | Where-Object { [string]$_.Test -cmatch '^Test[A-Za-z0-9_]+(/[A-Za-z0-9_.-]+)*$' })
          $rootTests=@($validFailures | ForEach-Object { ([string]$_.Test -split '/')[0] } | Sort-Object -Unique)
          $packages=@($fail | Where-Object { [string]$_.Package -cmatch '^k-terminal(/[A-Za-z0-9_.-]+)*$' } |
            ForEach-Object { [string]$_.Package } | Sort-Object -Unique)
          Write-Host ('FORGE_KTERM_FULL_FAILED_ROOT_TEST_COUNT='+$rootTests.Count)
          Write-Host ('FORGE_KTERM_FULL_FAILED_PACKAGE_COUNT='+$packages.Count)
          foreach($name in @($rootTests | Select-Object -First 30)) {
            Write-Host ('FORGE_KTERM_FULL_FAILED_ROOT_TEST='+$name)
          }
          foreach($package in @($packages | Select-Object -First 10)) {
            Write-Host ('FORGE_KTERM_FULL_FAILED_PACKAGE='+$package)
          }
          if($rootTests.Count -gt 30) {
            Write-Host ('FORGE_KTERM_FULL_FAILED_ROOT_TESTS_OMITTED='+($rootTests.Count-30))
          }
          $maker=@($fail | Where-Object { $_.Test -ceq 'TestCanceledBuyRetryActualAllNineMakerAttemptsWithinOriginalWindow' }).Count
          if($maker){Write-Host 'FORGE_KTERM_FULL_FAILURE_CLASS=ORIGINAL_TWO_SECOND_MAKER_WINDOW'}
          if($rc -ne 0 -or $fail.Count -gt 0){throw 'FORGE_KTERM_MANDATORY_FULL_REGRESSION_FAILED'}
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'forge-kterm-full.ok') -Value 'PASS' -NoNewline
          Write-Host 'FORGE_KTERM_MANDATORY_EXACT_SHA_FULL_WINDOWS=PASS'
      - name: Vet and build without publication
        shell: pwsh
        working-directory: kterminal-private
        run: |
          $ErrorActionPreference='Stop'
          & go vet ./... *> (Join-Path $env:RUNNER_TEMP 'forge-kterm-private-vet.log')
          if($LASTEXITCODE -ne 0){throw 'FORGE_KTERM_VET_FAILED'}
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'forge-kterm-vet.ok') -Value 'PASS' -NoNewline
          & go build -trimpath -o (Join-Path $env:RUNNER_TEMP 'KTerm-Unpromoted.exe') . *> (Join-Path $env:RUNNER_TEMP 'forge-kterm-private-build.log')
          if($LASTEXITCODE -ne 0){throw 'FORGE_KTERM_BUILD_FAILED'}
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'forge-kterm-build.ok') -Value 'PASS' -NoNewline
          Write-Host 'FORGE_KTERM_VET_BUILD_UNPROMOTED=PASS'
      - name: Seal only a privacy-safe exact-SHA receipt
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'forge-kterm-receipt'
          [void][IO.Directory]::CreateDirectory($dir)
          $checks=[ordered]@{}
          foreach($k in @('window','recorder','full','vet','build')) {
            $checks[$k]=if(Test-Path (Join-Path $env:RUNNER_TEMP ('forge-kterm-'+$k+'.ok'))){'PASS'}else{'NOT_QUALIFIED'}
          }
          $qualified=@($checks.Values|Where-Object {$_ -ne 'PASS'}).Count -eq 0
          $receipt=[ordered]@{
            schema='forge.kterminal.p5.pr73.exact-head.v1'
            forge_source_sha=$env:GITHUB_SHA
            kterminal_source_sha=$env:KTERM_HEAD
            original_test_blob='2b7985e2e92a5df69e1db35d499d98c12dcc978c'
            windows_runner='github-hosted-windows-2022'
            checks=$checks
            result=if($qualified){'OFFLINE_WINDOWS_QUALIFIED'}else{'QUALIFICATION_BLOCKED'}
            original_owner_execution=$false
            real_broker_posts=0
            private_logs_uploaded=$false
            credentials_exported=$false
            installed=$false
            merged_or_promoted=$false
          }
          $p=Join-Path $dir 'receipt.json'
          $body=$receipt|ConvertTo-Json -Compress -Depth 5
          [IO.File]::WriteAllText($p,$body,[Text.UTF8Encoding]::new($false))
          $digest=(Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $dir 'receipt.sha256'),$digest,[Text.UTF8Encoding]::new($false))
          Write-Host ('FORGE_KTERM_DISPOSITION='+$receipt.result)
          Write-Host ('FORGE_KTERM_RECEIPT_SHA256='+$digest)
      - name: Upload only sanitized acceptance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-kterminal-p5-pr73-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/forge-kterm-receipt/receipt.json
            ${{ runner.temp }}/forge-kterm-receipt/receipt.sha256
          retention-days: 30
          if-no-files-found: error
