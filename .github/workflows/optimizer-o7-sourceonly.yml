name: Optimizer O7 learned predictive representation public qualification

on:
  push:
    branches: [research/optimizer-o7-learned-predictive-partitions-20261023]
    paths:
      - '.github/workflows/optimizer-o7-sourceonly.yml'
      - 'research/optimizer_o7/**'

permissions:
  contents: read

concurrency:
  group: optimizer-o7-sourceonly
  cancel-in-progress: false

jobs:
  native-public-development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify immutable parent original comparators and frozen O7 protocol
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = 'fe54d7b8f819f04d3c4a2e771e1dc0f0b6f9ddc5'
          $ancestor = (& git merge-base $parent HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ancestor -cne $parent) { throw 'O7_SOURCE_ANCESTRY_DRIFT' }
          $expected = @(
            '.github/workflows/optimizer-o7-sourceonly.yml',
            'research/optimizer_o7/O7_FROZEN_PROTOCOL.json',
            'research/optimizer_o7/o4_original_controls.py',
            'research/optimizer_o7/public_source.py',
            'research/optimizer_o7/predictive_partition.py',
            'research/optimizer_o7/runner.py',
            'research/optimizer_o7/test_predictive.py'
          )
          $actual = @(& git diff --name-only $parent HEAD)
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne $expected.Count -or
              (Compare-Object $actual $expected)) { throw 'O7_SOURCE_SCOPE_DRIFT' }
          $pins = @{
            'research/optimizer_o7/O7_FROZEN_PROTOCOL.json' = '4ff79c50abff0e368becbfee0f8a7186f0c93a88'
            'research/optimizer_o7/o4_original_controls.py' = '3ab09e0b9b27a3404ddaf81fdc3c26cc87ba7a4c'
          }
          foreach ($path in $pins.Keys) {
            $source = (& git rev-parse ('HEAD:' + $path)).Trim()
            $disk = (& git hash-object --no-filters -- $path).Trim()
            if ($LASTEXITCODE -ne 0 -or $source -cne $pins[$path] -or
                $disk -cne $pins[$path]) { throw ('O7_FROZEN_IDENTITY_DRIFT_' + $path) }
          }
          Write-Host 'O7_FROZEN_PROTOCOL_AND_CONTROLS=PASS'
      - name: Ten focused public source and representation tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -m unittest discover -s research/optimizer_o7 -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'O7_FOCUSED_TEST_FAILURE' }
          Write-Host 'O7_PUBLIC_TESTS=PASS'
      - name: Fit-select-dev eight equally informed models on fresh public roles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B research/optimizer_o7/runner.py
          if ($LASTEXITCODE -ne 0) { throw 'O7_PUBLIC_DEV_EXECUTION_FAILED' }
          Write-Host 'O7_PUBLIC_DEV_RECEIPTS=EMITTED'
          Write-Host 'O7_PROTECTED_FIRST_USE=ZERO'
          Write-Host 'O7_SCIENTIFIC_GO=NOT_EVALUATED'
      - name: One required full FORGE Go regression vet build
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo O7_FULL_GO_REGRESSION=PASS
      - name: Confirm clean checkout and no runtime side effects
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(& git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) { throw 'O7_UNEXPECTED_DIRTY_WORKTREE' }
          Write-Host 'O7_NO_CONTROLLER_OR_PROTECTED_SOURCE_MUTATION=PASS'
