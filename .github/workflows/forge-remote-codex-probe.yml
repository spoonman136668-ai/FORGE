name: FORGE model proposal failure classification
on:
  push:
    branches: [diagnostic/f139-codex-cli-flags-20261027]
permissions:
  contents: read
jobs:
  classify:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    steps:
      - name: Classify saved proposal diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE') { throw 'WRONG_RUNNER' }
          $folder=Join-Path $env:RUNNER_TEMP 'forge-model-proposal-40463611355'
          foreach($name in @('stderr.txt','events.jsonl')) {
            $p=Join-Path $folder $name
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { Write-Host ("PROPOSAL_FILE_"+$name+"=ABSENT"); continue }
            $s=[IO.File]::ReadAllText($p)
            Write-Host ("PROPOSAL_FILE_"+$name+"_BYTES="+$s.Length)
            foreach($word in @('model','not found','unsupported','invalid','configuration','schema','argument','feature','authentication','unauthorized','quota','limit','network','connection','workspace','sandbox','permission','requires','tier','backend','json','tool','error','fatal','failed','usage','exec','flag','login','gpt-6.1-terra','approval','file','path','context','version')) {
              if ($s.IndexOf($word,[StringComparison]::OrdinalIgnoreCase) -ge 0) { Write-Host ("PROPOSAL_CONTAINS="+$word) }
            }
            if ($name -ceq 'events.jsonl') {
              foreach($line in ($s -split "\r?\n")) {
                try {$e=$line|ConvertFrom-Json -ErrorAction Stop; if ($e.type -match '^[a-z_.]+$') {Write-Host ("PROPOSAL_EVENT="+$e.type)}} catch {}
              }
            }
          }
          Write-Host 'MODEL_RETRIED=FALSE; RAW_DIAGNOSTICS_NOT_PRINTED=TRUE'
