name: FORGE remote Codex subscription probe
on:
  push:
    branches: [qualification/forge-remote-codex-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: No-inference subscription and interface preflight
        shell: pwsh
        env:
          CODEX_HOME: C:\ProgramData\CKBR\codex\home
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '${{ github.sha }}'
          if ($env:GITHUB_SHA -ne $expected) { throw 'SOURCE_IDENTITY_MISMATCH' }
          Write-Output "R64_SOURCE_SHA=$expected"
          Write-Output 'R64_MODEL_CALLS=0'
          Write-Output 'R64_HOLDOUT_ACCESS=0'
          if ($env:OPENAI_API_KEY) { throw 'API_BILLING_PROHIBITED' }
          $codex = Get-Command codex -ErrorAction SilentlyContinue
          if (-not $codex) {
            Write-Output 'R64_CLI_PRESENT=NO'
            Write-Output 'R64_AUTH=NOT_CHECKED'
            Write-Output 'R64_INVOCATION_COMPATIBILITY=UNVERIFIED'
            exit 0
          }
          Write-Output 'R64_CLI_PRESENT=YES'
          $exe = $codex.Source
          $digest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "R64_EXECUTABLE_SHA256=$digest"
          if (-not (Test-Path -LiteralPath $env:CODEX_HOME -PathType Container)) {
            Write-Output 'R64_SESSION_HOME_PRESENT=NO'
            Write-Output 'R64_AUTH=NOT_CHECKED'
          } else {
            Write-Output 'R64_SESSION_HOME_PRESENT=YES'
            $null = & $exe login status 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0) {
              Write-Output 'R64_AUTH=CLI_STATUS_PASS_UNATTESTED'
            } else {
              Write-Output 'R64_AUTH=CLI_STATUS_FAIL'
            }
          }
          $help = (& $exe exec --help 2>&1 | Out-String)
          if ($LASTEXITCODE -eq 0 -and $help -match '--sandbox' -and $help -match '--model') {
            Write-Output 'R64_CODEX_EXEC_FLAGS=SUPPORTED'
          } else {
            Write-Output 'R64_CODEX_EXEC_FLAGS=UNVERIFIED'
          }
          Write-Output 'R64_R60_JSON_STDIN_STDOUT_COMPATIBILITY=UNVERIFIED'
          Write-Output 'R64_MODEL_CHECKPOINT_SHA256=UNVERIFIED'
          Write-Output 'R64_EXECUTION_APPROVAL=NOT_ESTABLISHED'
