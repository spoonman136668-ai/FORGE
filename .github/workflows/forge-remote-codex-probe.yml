name: FORGE Codex CLI proposal capability read-only probe
on:
  push:
    branches: [diagnostic/f139-codex-cli-flags-20261027]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    steps:
      - name: Inspect existing Codex command flags only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'FORGE-CODEX-REMOTE') { throw 'WRONG_RUNNER' }
          $cmd = (Get-Command codex -ErrorAction Stop).Source
          $v = (& $cmd --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'VERSION_READ_FAILED' }
          $help = (& $cmd exec --help | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'EXEC_HELP_FAILED' }
          Write-Host ("FORGE_CODEX_VERSION=" + $v)
          foreach ($flag in @('--output-schema', '--ignore-user-config', '--sandbox', '--ephemeral', '--skip-git-repo-check', '--json')) {
            Write-Host ("FORGE_CODEX_FLAG=" + $flag + ":" + $help.Contains($flag))
          }
          Write-Host 'MODEL_INVOCATION=FALSE; CONTROLLER_MUTATION=FALSE; SECRETS_READ=FALSE'
