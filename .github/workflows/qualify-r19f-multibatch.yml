name: FORGE R19F global multibatch portfolio qualification
on:
  push:
    branches:
      - proposal/r19f-multibatch-global-budget-20261011
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Exact predecessor and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = f8ee5f7499967a346207521732599a4cb7401bb5
          python - <<'PY'
          import subprocess
          r=subprocess.check_output(["git","diff","--name-status","HEAD^","HEAD"],text=True).splitlines()
          want={"evoportfolio/multibatch.go","evoportfolio/multibatch_test.go",".github/workflows/qualify-r19f-multibatch.yml"}
          assert len(r)==3 and all(v.startswith("A\t") for v in r),r
          assert {v.split("\t")[1] for v in r}==want,r
          PY
      - name: Focused and full Go qualification
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./evoportfolio
          go test -count=1 ./...
          go vet ./...
          go build ./...
          if [ "$RUNNER_OS" = Linux ]; then go test -race -count=1 ./...; fi
