name: F124-AG ambiguous noisy causal consistency and bounded controls
on:
  push:
    branches: [research/f124ag-noisy-consistency-20261018]
permissions: {contents: read, actions: read}
concurrency:
  group: f124ag-${{ github.ref }}
  cancel-in-progress: false
jobs:
  new-source-two-platforms:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Complete independent FIT DEV semantic admission and exact/tolerant/consistent 16-cell controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if ($IsWindows) { 'python' } else { 'python3' }
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'F124AG_HEAD_DRIFT' }
          & $py -B -m unittest discover -s nativeevidence -p 'test_f124ag_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F124AG_SOURCE_OR_ORIGINAL_CONTROLS_FAIL' }
          & $py -B isolationguard/check.py
          if ($LASTEXITCODE -ne 0) { throw 'F124AG_FORGE_ISOLATION_FAIL' }
          Write-Output 'F124AG_PROTECTED_FIRST_USE=false'
  historical-FIT-DEV:
    needs: new-source-two-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39078269441
          github-token: ${{ github.token }}
          name: f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d
          path: o
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39081990918
          github-token: ${{ github.token }}
          name: f124r-fresh-two-lane-causal-evidence-522601491c10ebfeb36e7dca2627ff5366b51abb
          path: r
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39082745397
          github-token: ${{ github.token }}
          name: f124s-source-backed-development-bc59de4f118b37d9a501dd8a944e210540222a27
          path: s
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39084599471
          github-token: ${{ github.token }}
          name: f124u-source-backed-independent-development-7d8df58e3fd7363e5c91b39a426ff3430fedf20d
          path: u
      - name: Authentic source-born O U vs exact, tolerant and noise-consistency plus H12
        shell: bash
        run: |
          set -euo pipefail
          python3 -B nativeevidence/f124ag_noisy_controls.py --original-o o/f124o-independent-two-learned-development.json --original-r r/f124r-fresh-calibrated-continuous-development.json --original-s s/f124s-fresh-packed-key-cell-credit-development.json --original-u u/f124u-bounded-index-fresh-causal-rank-development.json --output "$RUNNER_TEMP/f124ag-noisy.json"
          python3 - "$RUNNER_TEMP/f124ag-noisy.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v["schema"]=="forge.research.f124ag.blind-noisy-consistency-evidence.v1"
          assert v["freeze_blob"]=="821765d58d5abc7e998deb70b20d63cfc8a25c08"
          assert v["f124ad_frozen_coefficients"]=={"gamma":0.1,"penalty":1.0}
          assert v["DEV_never_used_for_training"] and not v["protected_first_use"] and not v["independent_science_accepted"]
          for phase in ("FIT","DEV"):
              for fam in ("adjacent_noise","delayed_noise","reused_role_noise"):
                  item=v[phase][fam]
                  assert item["H12_qualified"] and item["bounded_exact_qualified"] and item["fixed_consistency_qualified"]
                  for arm in ("O_original","O_combined","U_original","U_combined"):
                      rec=item["models"][arm]
                      assert rec["pairs"]==48 and len(rec["cases"])==48
                      assert all(d["pairs"]==16 for d in rec["by_depth"].values())
                  for name in ("fixed_exact16","fixed_tolerant15","fixed_consistency16","H12"):
                      r=item["controls"][name]
                      assert r["pairs"]==48 and r["blocked_pairs"]<=2
          PY
          sha256sum "$RUNNER_TEMP/f124ag-noisy.json"
      - uses: actions/upload-artifact@v4
        with:
          name: f124ag-new-ambiguous-source-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/f124ag-noisy.json
          retention-days: 90
          if-no-files-found: error
  genuine-physical-cost:
    needs: new-source-two-platforms
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39078269441
          github-token: ${{ github.token }}
          name: f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d
          path: o
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39081990918
          github-token: ${{ github.token }}
          name: f124r-fresh-two-lane-causal-evidence-522601491c10ebfeb36e7dca2627ff5366b51abb
          path: r
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39082745397
          github-token: ${{ github.token }}
          name: f124s-source-backed-development-bc59de4f118b37d9a501dd8a944e210540222a27
          path: s
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39084599471
          github-token: ${{ github.token }}
          name: f124u-source-backed-independent-development-7d8df58e3fd7363e5c91b39a426ff3430fedf20d
          path: u
      - name: Seven arms three fresh OS processes each, exact equal 96 public noisy graphs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if ($IsWindows) {'python'} else {'python3'}
          $env:PYTHONHASHSEED='0'
          $out=Join-Path $env:RUNNER_TEMP "f124ag-cost-${{ matrix.os }}.json"
          & $py -B nativeevidence/f124ag_physical.py --bench --original-o o/f124o-independent-two-learned-development.json --original-r r/f124r-fresh-calibrated-continuous-development.json --original-s s/f124s-fresh-packed-key-cell-credit-development.json --original-u u/f124u-bounded-index-fresh-causal-rank-development.json --output $out
          if ($LASTEXITCODE -ne 0) { throw 'F124AG_REAL_HARDWARE_COST_FAILED' }
          $v=Get-Content $out -Raw | ConvertFrom-Json
          if ($v.schema -cne 'forge.research.f124ag.cross-platform-seven-arm-real-cost.v1' -or
              $v.freeze_blob -cne '821765d58d5abc7e998deb70b20d63cfc8a25c08' -or
              $v.raw.Count -ne 21 -or $v.persistent_cell_upper_bound -ne 16 -or
              $v.protected_first_use -or $v.science_accepted) { throw 'F124AG_RESOURCE_RECEIPT_INVALID' }
          foreach ($arm in @('O_original','O_combined','U_original','U_combined','fixed_exact16','fixed_tolerant15','fixed_consistency16')) {
            $row=$v.summary.$arm
            if ($row.repetitions -ne 3 -or $row.median_process_RSS_bytes -le 0 -or
                $row.median_cpu_ns -le 0 -or $row.median_wall_ns -le 0) {
              throw 'F124AG_INCOMPLETE_3_REPS'
            }
            Write-Output "F124AG_COST_$($arm):RSS=$($row.median_process_RSS_bytes):CPU=$($row.median_cpu_ns):WALL=$($row.median_wall_ns):HEAP=$($row.median_Python_peak_bytes)"
          }
          Write-Output "F124AG_RESOURCE_SHA256=$((Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant())"
      - uses: actions/upload-artifact@v4
        with:
          name: f124ag-noisy-physical-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/f124ag-cost-${{ matrix.os }}.json
          retention-days: 90
          if-no-files-found: error
  final-full-Go-regression:
    needs: [historical-FIT-DEV, genuine-physical-cost]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env: {GOMAXPROCS: '2', GOFLAGS: '-p=2', GOMEMLIMIT: '1536MiB'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - name: One original complete Go test race vet build and FORGE isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
          echo "F124AG_EXACT_HEAD=$GITHUB_SHA"
          echo 'F124AG_PROTECTED_FIRST_USE=false'
