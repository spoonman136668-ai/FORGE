name: ITD-02 MG53 original MG52 goal-credit cold actor state replay and decision margin audit
on:
  push:
    branches: [research/itd02-mg53-mg52-goal-credit-source-replay-audit-20261029]
permissions:
  contents: read
  actions: read
jobs:
  frozen-source-only-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact LF source settings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout unchanged pinned MG52 research and MG53 source-only diagnostic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify source lineage and all original policy binaries remain untouched
        shell: pwsh
        run: |
          git merge-base --is-ancestor 33ba5070007d5c9b41b2d43cdc081f535d7d1c12 $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'MG53_AUDIT_METRIC_FREEZE_NOT_BEFORE_EXECUTABLE' }
          $changed=@(git diff --name-only 1e0e911aff669983bd12e0fc469be7898e1a6f98 $env:GITHUB_SHA)
          $expected=@('research/lcrm01/mg53_mg52_goal_credit_audit_prereg.json',
            'research/lcrm01/mg53_mg52_goal_credit_audit.py',
            '.github/workflows/itd02-mg53-mg52-goal-credit-replay.yml')
          if (@(Compare-Object $changed $expected).Count -ne 0) { throw 'MG53_UNAUTHORIZED_MODEL_OR_SOURCE_CHANGE' }
          python -B research/lcrm01/mg53_mg52_goal_credit_audit.py --preflight
          if ($LASTEXITCODE -ne 0) { throw 'MG53_DIAGNOSTIC_PREFLIGHT_FAIL' }
          if (git status --porcelain --untracked-files=all) { throw 'MG53_SOURCE_NOT_CLEAN' }
          Write-Host MG53_FROZEN_READONLY_AUDIT_CROSS_HOST_SOURCE_PREFLIGHT_PASS_NO_SCIENCE
  pinned-exposed-source-only-audit:
    needs: frozen-source-only-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact LF source settings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download exact immutable original MG52 original-world evidence archive, no new action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mg53"
          curl --fail --silent --show-error --location --max-time 120 --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/spoonman136668-ai/FORGE/actions/artifacts/12941646119/zip" \
            --output "$RUNNER_TEMP/mg53/mg52-immutable.zip"
          test "$(stat -c%s "$RUNNER_TEMP/mg53/mg52-immutable.zip")" -lt 20000000
          printf '%s  %s\n' 67d9e6cff9728ae9b3298f7653ffd05edcc6838d1d956fbd6e8cf542527cc9b6 "$RUNNER_TEMP/mg53/mg52-immutable.zip" | sha256sum --check --status
          echo MG53_ORIGINAL_EXPOSED_ARCHIVE_BYTE_CUSTODY_PASS
      - name: Cold-replay exact MG52 actor on selected-action public source and diagnose credit threshold support
        shell: bash
        run: |
          set -euo pipefail
          python -B research/lcrm01/mg53_mg52_goal_credit_audit.py \
            --archive "$RUNNER_TEMP/mg53/mg52-immutable.zip" \
            --output "$RUNNER_TEMP/mg53/report.json" \
            > "$RUNNER_TEMP/mg53/diagnostic.log"
          grep -F 'MG53_IMMUTABLE_MG52_GOAL_CREDIT_REPLAY_AND_CAUSE_BOUNDARY_DIAGNOSTIC_PASS_NO_SCIENCE' "$RUNNER_TEMP/mg53/diagnostic.log"
          grep -F 'MG53_INDEPENDENT_COMPLETE_ORIGINAL_SOURCE_AND_COLD_ACTOR_REPLAY_PASS' "$RUNNER_TEMP/mg53/diagnostic.log"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo MG53_EXPOSED_SOURCE_ONLY_AUDIT_COMPLETE_NO_FARAMA_ACTION_OR_SCIENTIFIC_FIRST_USE
      - name: Upload compact original-source validated diagnostic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mg53-mg52-original-goal-credit-source-replay
          path: |
            ${{ runner.temp }}/mg53/report.json
            ${{ runner.temp }}/mg53/diagnostic.log
          if-no-files-found: warn
          retention-days: 30
