name: FORGE research G63 equal-CPU-resource GPT-2 prefill overlap
on:
  push:
    branches: [research/llm-g54-gpt2-pinned-20261030]
    paths:
      - 'research/llm_g63/**'
      - 'docs/research/G63-RESOURCE-MATCHED-SINGLEFLIGHT-PREREG.md'
      - '.github/workflows/forge-llm-g63-equal-resource.yml'
permissions:
  contents: read
concurrency:
  group: forge-llm-g63-research-readonly
  cancel-in-progress: false
jobs:
  original-gpt2-cpu-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify G63 frozen prereg and unchanged G51 through G62
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 1ab8bf1648dff11907a9b63494ab6a17cbf19920 HEAD
          test "$(git rev-parse 1ab8bf1648dff11907a9b63494ab6a17cbf19920:docs/research/G63-RESOURCE-MATCHED-SINGLEFLIGHT-PREREG.md)" = "$(git rev-parse HEAD:docs/research/G63-RESOURCE-MATCHED-SINGLEFLIGHT-PREREG.md)"
          git diff --exit-code b88558eb985bb69c4266c0f9ce5cdec703ed1ec1 HEAD -- research/llm_g54 research/llm_g55 research/llm_g56 research/llm_g57 research/llm_g58 research/llm_g59 research/llm_g60 research/llm_g61 research/llm_g62
          python -m py_compile research/llm_g63/g63_equal_resources.py research/llm_g63/test_g63.py
          python -m unittest discover -s research/llm_g63 -p test_g63.py -v
          echo G63_FROZEN_CONTROL_AND_SOURCE_IDENTITY=PASS
      - name: Install pinned public authentic GPT-2 CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
          python -m pip install --disable-pip-version-check 'transformers==4.48.3' 'huggingface_hub==0.30.2' 'safetensors==0.5.3' 'tokenizers==0.21.1' 'psutil==7.1.3'
          python -m pip freeze > g63_environment_pip_freeze.txt
      - name: Execute frozen 2-/3-affinity CPU equal-resource performance screen
        shell: bash
        env:
          HF_HUB_DISABLE_XET: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/llm_g63/g63_equal_resources.py
          python - <<'PY'
          import json
          r=json.load(open('g63_result.json'))
          assert r['engineering']=='PASS' and r['promotion_allowed'] is False
          assert r['scientific_acceptance']=='NOT_GRANTED'
          assert set(r['cohorts'])=={'high_locality','unique_only','thrash'}
          for cohort in r['cohorts'].values():
              assert set(cohort)=={'budget_2','budget_3'}
              for row in cohort.values():
                  assert len(row['trials'])==3
                  for trial in row['trials']:
                      for arm in r['arms']:
                          data=trial['arms'][arm]
                          assert data['decoder_workers']+data['prefill_workers']==data['cpu_budget']
                          assert len(data['process_affinity'])==data['cpu_budget']
                          assert data['max_retained_kv_bytes']<=42000000
          print('G63_AUTHENTIC_PARITY_AND_EQUAL_RESOURCE_CONTROL=PASS')
          print('G63_FROZEN_ACCELERATION_SCREEN='+r['screen'])
          print('G63_SCIENTIFIC_ACCEPTANCE=NOT_GRANTED')
          PY
      - name: Retain raw research evidence for independent qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g63-authentic-gpt2-equal-resources
          if-no-files-found: warn
          path: |
            g63_result.json
            g63_environment_pip_freeze.txt
          retention-days: 30
