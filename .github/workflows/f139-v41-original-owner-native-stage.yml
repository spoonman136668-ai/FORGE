name: FORGE F139 V41 original-owner native candidate stage (no owner mutation)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  actions: read
concurrency:
  group: forge-f139-v41-original-owner-native-stage
  cancel-in-progress: false
jobs:
  native-candidate-stage:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'spoonman136668-ai' &&
      github.event.issue.number == 807 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-V41-NATIVE-STAGE ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering protected-main source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Stage only an immutable owner-authenticated V41 candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:GITHUB_EVENT_NAME -cne 'issue_comment' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
              $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or
              $env:OPENAI_API_KEY) {
            throw 'F139_V41_NATIVE_STAGE_WRONG_ORIGINAL_OWNER_OR_EVENT'
          }
          & python -B -m f139.nci04_v41_candidate_stage --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw 'F139_V41_NATIVE_STAGE_NOT_COMPLETED'
          }
