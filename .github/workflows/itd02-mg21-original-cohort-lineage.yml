name: ITD-02 MG21 fresh original-world DEV cohort lineage qualification
on:
  push:
    branches: [research/itd02-mg21-fresh-source-cohort-lineage-20261029]
permissions:
  contents: read
jobs:
  historical-fresh-source-cohort-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: Ensure original Git SHA custody and LF before checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact MG21 frozen research branch history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Original Python 3.11 source audit runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify pinned historical Git source contracts without original env execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git merge-base --is-ancestor be533627e9cbc7f35314257ceadbf21f5e873d4e $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'MG21_ORIGINAL_MG20_SOURCE_PARENT_MISSING' }
          git merge-base --is-ancestor 39b31af7dcc5fc16bf7d1a7d3e9a15fbbfdcc1f6 $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'MG21_PROSPECTIVE_PREREG_NOT_BEFORE_AUDIT' }
          $root=Join-Path $env:RUNNER_TEMP 'mg21'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          python -B research/lcrm01/mg21_source_lineage_audit.py --output (Join-Path $root 'lineage.json')
          if ($LASTEXITCODE -ne 0) { throw 'MG21_FAILED_INDEPENDENT_HISTORICAL_SOURCE_COHORT_CUSTODY' }
          if (git status --porcelain --untracked-files=all) { throw 'MG21_DIRTY_ORIGINAL_SOURCE' }
          Write-Host 'MG21_SCOPED_SOURCE_ONLY_SEED_LINEAGE_ATTESTED_NO_NEW_WORLD_ACTIONS'
      - name: Retain exact source-custody seed lineage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mg21-source-lineage-${{ matrix.os }}
          path: ${{ runner.temp }}/mg21/lineage.json
          retention-days: 30
          if-no-files-found: warn
  compare-independent-custody:
    needs: historical-fresh-source-cohort-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mg21-source-lineage-*
          path: custody
      - name: Require exact independent Windows Linux source history readbacks
        run: |
          python - <<'PY'
          import json,pathlib
          files=sorted(pathlib.Path("custody").rglob("lineage.json"))
          if len(files)!=2:raise SystemExit("MG21_MISSING_HOST_ORIGINAL_HISTORY_PROOF")
          a,b=[json.loads(path.read_text()) for path in files]
          if a!=b:raise SystemExit("MG21_WINDOWS_LINUX_ORIGINAL_SOURCE_CUSTODY_DIFFER")
          if (a["known_historical_original_world_seed_overlap"]!=0 or
              a["source_history_count"]!=10 or a["dev_seed_count"]!=8 or
              a["new_original_world_actions"]!=0 or
              a["sealed_cohort_seeds_released"]!=0):
              raise SystemExit("MG21_SOURCE_AUTHORITY_OR_LINEAGE_FAIL")
          print("MG21_TWO_OS_FROZEN_ORIGINAL_DEV_LINEAGE_PASS",a["canonical_custody_sha256"])
          PY
