name: FORGE F139 R20 post-merge original-owner read-only custody audit
on:
  push:
    branches: [proposal/f139-r20-guarded-live-cutover-20261022]
permissions: {}
concurrency:
  group: forge-f139-r20-original-owner-single-transition
  cancel-in-progress: false
jobs:
  original-owner-forensic:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 14
    steps:
      - name: Audit merged exact checkout, scheduled task, and immutable owner ledger without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
              $env:OPENAI_API_KEY -or $env:F139_WORKER_HMAC_KEY) {
            throw 'R20_RECOVERY_READONLY_OWNER_DRIFT'
          }
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          if (@($task.Actions).Count -ne 1) {throw 'R20_RECOVERY_TASK_ACTION_DRIFT'}
          $opts=@{}
          foreach ($key in @('PythonExe','RepositoryRoot','Database','EncryptedKeyFile')) {
            $m=[regex]::Match([string]$task.Actions[0].Arguments,'(?i)(?:^|\s)-'+$key+'\s+"([^"]+)"')
            if (-not $m.Success) {throw ('R20_RECOVERY_TASK_ARG_MISSING_'+$key)}
            $opts[$key]=$m.Groups[1].Value
          }
          $sha=(& git -C $opts['RepositoryRoot'] rev-parse HEAD | Out-String).Trim()
          $dirty=(& git -C $opts['RepositoryRoot'] status --porcelain --untracked-files=all | Out-String).Trim()
          $main=(& gh api 'repos/spoonman136668-ai/FORGE/branches/main' --jq '.commit.sha' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $main -cne 'ecbd672f0b3bba34d6e92d2f1475ea6dc80f605f' -or
              $sha -cne $main -or $dirty.Length -ne 0) {
            throw 'R20_RECOVERY_MERGED_MAIN_OR_ORIGINAL_CHECKOUT_DRIFT'
          }
          $audit=@'
          import contextlib,hashlib,json,pathlib,sqlite3,sys
          filename=pathlib.Path(sys.argv[1]).resolve(strict=True)
          oldhead=sys.argv[2]
          def need(ok,why):
              if not ok:raise RuntimeError("R20_RECOVERY_"+why)
          def encode(obj):
              return (json.dumps(obj,sort_keys=True,separators=(",",":"),ensure_ascii=True)+"\n").encode()
          need(filename.name=="state.sqlite" and not filename.is_symlink(),"DB_PATH_DRIFT")
          with contextlib.closing(sqlite3.connect(filename.as_uri()+"?mode=ro",uri=True,timeout=15)) as db:
              db.row_factory=sqlite3.Row
              db.execute("PRAGMA query_only=ON")
              meta=dict(db.execute("SELECT * FROM meta WHERE id=1").fetchone())
              tasks=[dict(row) for row in db.execute("SELECT * FROM tasks ORDER BY ticket")]
              previous="0"*64
              seq=0
              head68=None
              last_event=None
              for event in db.execute("SELECT seq,kind,payload,prior_sha,sha FROM events ORDER BY seq"):
                  seq+=1
                  need(event["seq"]==seq and event["prior_sha"]==previous,"LEDGER_LINK_FAIL")
                  payload=json.loads(event["payload"])
                  need(encode(payload).decode()==event["payload"],"LEDGER_NONCANONICAL")
                  nextsha=hashlib.sha256(encode({"seq":seq,"prior_sha":previous,
                      "kind":event["kind"],"payload":payload})).hexdigest()
                  need(nextsha==event["sha"],"LEDGER_HASH_MISMATCH")
                  previous=nextsha
                  if seq==68:head68=previous
                  last_event=event["kind"]
          need(head68==oldhead,"ORIGINAL_EVENT68_NOT_PRESERVED")
          need(meta["head_seq"]==seq and meta["head_hash"]==previous,
               "OWNER_HEAD_CHAIN_DISAGREEMENT")
          need(seq==69 and previous=="32ddad1d02c5353a596443f156153e02662abf5fea80ac1c59b898323aa4d92a"
               and meta["source_sha"]=="ecbd672f0b3bba34d6e92d2f1475ea6dc80f605f"
               and meta["enabled"]==1 and meta["legacy_suspended"]==1
               and last_event=="SOURCE_TRANSITION_ADMITTED",
               "AUTHENTIC_EVENT69_SOURCE_TRANSITION_MISMATCH")
          need(len(tasks)==11 and sum(t["stage"]=="VERIFIED" for t in tasks)==9
              and sum(t["stage"]=="QUARANTINED" for t in tasks)==2,
              "ORIGINAL_TASKS_CHANGED")
          negatives={t["ticket"] for t in tasks if t["stage"]=="QUARANTINED"}
          need(negatives=={"f139-nci04-i696-5662e3586bc9-7bb8f27f",
                          "f139-nci04-i706-09f3d7447900-09dc99f4"},
               "HISTORICAL_NEGATIVE_SET_DRIFT")
          custody=(filename.parent/"evidence").resolve(strict=True)
          zip_count=0
          for t in tasks:
              if t["stage"]!="VERIFIED":
                  need(t["run_id"] is None and not t["evidence_sha"] and not t["evidence_dir"],
                       "HISTORICAL_NEGATIVE_EVIDENCE_DRIFT")
                  continue
              location=pathlib.Path(t["evidence_dir"]).resolve(strict=True)
              need(location.parent.parent==custody and
                   location.parent.name==t["ticket"] and
                   location.name==str(t["run_id"]), "VERIFIED_ARCHIVE_PATH_DRIFT")
              expected={"manifest.json","ubuntu-latest.zip","windows-latest.zip"}
              members={p.name:p for p in location.iterdir()}
              need(set(members)==expected and all(p.is_file() and not p.is_symlink()
                       for p in members.values()),"VERIFIED_ARCHIVE_MEMBERS_DRIFT")
              doc=members["manifest.json"].read_bytes()
              need(hashlib.sha256(doc).hexdigest()==t["evidence_sha"],
                   "VERIFIED_MANIFEST_DIGEST_DRIFT")
              manifest=json.loads(doc)
              need(manifest["ticket"]==t["ticket"] and manifest["run_id"]==t["run_id"]
                   and manifest["scientific_originals"]==0
                   and manifest["approved_science"] is False,
                   "VERIFIED_EVIDENCE_AUTHORITY_DRIFT")
              for platform in ("ubuntu-latest","windows-latest"):
                  need(hashlib.sha256(members[platform+".zip"].read_bytes()).hexdigest()
                       ==manifest["sha256"][platform],
                       "VERIFIED_ZIP_BYTES_CHANGED")
                  zip_count+=1
          need(zip_count==18,"VERIFIED_ZIP_COUNT_DRIFT")
          print("R20_RECOVERY_ORIGINAL_PROVIDER_ZIPS=18_OF_18_PASS")
          print("R20_RECOVERY_TASKS=9_VERIFIED_2_QUARANTINED")
          print("R20_RECOVERY_SOURCE_SHA="+meta["source_sha"])
          print("R20_RECOVERY_EVENT_SEQ="+str(seq))
          print("R20_RECOVERY_EVENT_HEAD="+previous)
          print("R20_RECOVERY_LAST_EVENT_KIND="+str(last_event))
          print("R20_RECOVERY_ENABLE_FLAG="+str(meta["enabled"]))
          print("R20_RECOVERY_LEGACY_SUSPENDED="+str(meta["legacy_suspended"]))
          print("R20_RECOVERY_ORIGINAL_EVENT68=PASS")
          print("R20_RECOVERY_LEDGER_CHAIN=PASS")
          print("R20_RECOVERY_DB_WRITES=0")
          '@
          $out=& $opts['PythonExe'] -B -c $audit $opts['Database'] 'ff4405b7a9c00e514708490787174ce5a77c19ac812bb59462363d6851896174'
          if ($LASTEXITCODE -ne 0) {throw 'R20_RECOVERY_LEDGER_READONLY_REJECTED'}
          $out | ForEach-Object {Write-Output $_}
          Write-Output ('R20_RECOVERY_SCHEDULED_TASK_STATE='+[string]$task.State)
          $controller=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" | Where-Object {
             $_.CommandLine -and $_.CommandLine.Contains('f139.local_controller') -and
             $_.CommandLine.Contains($opts['Database'])})
          Write-Output ('R20_RECOVERY_RUNNING_CONTROLLER_COUNT='+$controller.Count)
          Write-Output 'R20_READONLY_ORIGINAL_SOURCE_AND_EVENT_CUSTODY=PASS'
          # The source transition is already committed. Never merge or invoke
          # transition-qualified-native again. Restart only the exact owner task.
          if ([string]$task.State -cne 'Disabled' -or $controller.Count -ne 0) {
            throw 'R20_RESTART_REQUIRES_DISABLED_AND_QUIESCED_ORIGINAL_TASK'
          }
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $principal=New-Object Security.Principal.WindowsPrincipal($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'R20_RESTART_OWNER_ELEVATION_MISSING'
          }
          $user=[string]$task.Principal.UserId
          $sid=if ($user -match '^S-1-') {$user} else {
            (New-Object Security.Principal.NTAccount($user)).Translate(
              [Security.Principal.SecurityIdentifier]).Value
          }
          if ($sid -cne $identity.User.Value) {throw 'R20_RESTART_OWNER_SID_DRIFT'}
          $initial=(Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController')
          if ([string]$initial.State -cne 'Disabled') {
            throw 'R20_RESTART_TASK_STATE_CHANGED_DURING_AUTHENTICATION'
          }
          $restored=$false
          try {
            Enable-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop | Out-Null
            Start-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
            for ($poll=0; $poll -lt 24; $poll++) {
              Start-Sleep -Seconds 2
              $stateNow=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
              $processNow=@(Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
                Where-Object { $_.CommandLine -and $_.CommandLine.Contains('f139.local_controller') -and
                  $_.CommandLine.Contains($opts['Database']) })
              if ([string]$stateNow.State -ceq 'Running' -and $processNow.Count -eq 1) {
                $restored=$true
                break
              }
            }
            if (-not $restored) {
              throw 'R20_EXISTING_OWNER_CONTROLLER_RESTART_NOT_VERIFIED'
            }
            Write-Output 'R20_GENUINE_ORIGINAL_OWNER_CONTROLLER_RUNNING=PASS'
            Write-Output 'R20_SINGLE_OWNER_PROCESS_COUNT=1'
            Write-Output 'R20_EVENT69_SOURCE_TRANSITION_ALREADY_ADMITTED=PASS'
            Write-Output 'R20_OWNER_SOURCE_MERGE_ALREADY_ADMITTED=PASS'
            Write-Output 'R20_NEW_CONTROLLER_CREATED=NO'
            Write-Output 'R20_SCIENTIFIC_FIRST_USE=FALSE'
          } catch {
            Disable-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction SilentlyContinue | Out-Null
            Stop-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction SilentlyContinue
            Write-Output 'R20_POST_TRANSITION_RESTART_UNVERIFIED_FAIL_CLOSED'
            throw
          }
