name: Mind-Palace local checkout read-only reconciliation preflight
on:
  push:
    branches: [diagnostics/mind-palace-private-bridge-20261013]
    paths: ['.github/workflows/mind-palace-local-checkout-reconciliation-readonly.yml']
permissions:
  contents: read
concurrency:
  group: mind-palace-local-checkout-readonly-reconcile
  cancel-in-progress: false
jobs:
  local-custody:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check local history and durable record cleanliness without mutation
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: Never
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          function Need([bool]$cond,[string]$tag){if(-not $cond){throw ('MP_RECONCILE_READONLY_'+$tag)}}
          Need ($env:GITHUB_REPOSITORY -ceq 'spoonman136668-ai/FORGE' -and
            $env:GITHUB_REF -ceq 'refs/heads/diagnostics/mind-palace-private-bridge-20261013' -and
            $env:RUNNER_NAME -ceq 'FORGE-CODEX-REMOTE') 'QUALIFIED_RUNNER'
          Remove-Item Env:GITHUB_TOKEN,Env:GH_TOKEN,Env:OPENAI_API_KEY -ErrorAction SilentlyContinue
          $mp=Join-Path $env:USERPROFILE 'GolandProjects\Mind-Palace'
          Need (Test-Path -LiteralPath $mp -PathType Container) 'LOCAL_CHECKOUT'
          $git='git.exe'
          function Git([string[]]$args,[string]$code) {
            $x=@(& $git -C $mp @args)
            Need ($LASTEXITCODE -eq 0) $code
            return @($x)
          }
          $head=(Git @('rev-parse','HEAD') 'LOCAL_HEAD' | Out-String).Trim()
          $branch=(Git @('symbolic-ref','--quiet','--short','HEAD') 'NAMED_LOCAL_BRANCH' | Out-String).Trim()
          Need ($head -match '^[0-9a-f]{40}
          Need ($branch.Length -gt 0) 'BRANCH_NONEMPTY'
          $records=Join-Path $mp '.ice\records.json'
          Need (Test-Path -LiteralPath $records -PathType Leaf) 'RECORD_FILE'
          $before=(Get-FileHash -LiteralPath $records -Algorithm SHA256).Hash.ToLowerInvariant()
          $tracked=@(& $git -C $mp status --porcelain=v1 --untracked-files=no)
          Need ($LASTEXITCODE -eq 0) 'STATUS'
          $recordTracked=@(& $git -C $mp status --porcelain=v1 --untracked-files=no -- '.ice/records.json')
          Need ($LASTEXITCODE -eq 0) 'RECORD_STATUS'
          $gitRecord=(Git @('rev-parse','HEAD:.ice/records.json') 'RECORD_BLOB' | Out-String).Trim()
          $accepted='de31cdb4dfc29220eeaf52c9a1eab8c8a5b2a5cc'
          $remote='https://github.com/spoonman136668-ai/Mind-Palace.git'
          $remoteResult=@(& $git ls-remote --exit-code $remote 'refs/heads/main')
          Need ($LASTEXITCODE -eq 0 -and $remoteResult.Count -eq 1) 'ACCEPTED_REMOTE'
          $observed=([string]$remoteResult[0] -split '\s+')[0]
          Need ($observed -ceq $accepted) 'REMOTE_MAIN_IDENTITY'
          $tool=@('tools/context-pack-budgeted.ps1','tools/context-pack-tiered.ps1','tools/mind.ps1')
          foreach($k in $tool) {
            $status=@(& $git -C $mp status --porcelain=v1 --untracked-files=no -- $k)
            Need ($LASTEXITCODE -eq 0) 'TOOL_STATUS'
            Need ($status.Count -eq 0) 'TOOL_DIRTY'
          }
          Need ((Get-FileHash -LiteralPath $records -Algorithm SHA256).Hash.ToLowerInvariant() -ceq $before) 'RECORD_MUTATED'
          Write-Host "MP_RECONCILE_LOCAL_BRANCH=$branch"
          Write-Host "MP_RECONCILE_LOCAL_HEAD=$head"
          Write-Host "MP_RECONCILE_ACCEPTED_REMOTE_MAIN=$observed"
          Write-Host "MP_RECONCILE_LOCAL_TRACKED_DIRTY_COUNT=$($tracked.Count)"
          Write-Host "MP_RECONCILE_LOCAL_RECORDS_DIRTY_COUNT=$($recordTracked.Count)"
          Write-Host "MP_RECONCILE_LOCAL_RECORDS_GIT_BLOB=$gitRecord"
          Write-Host "MP_RECONCILE_LOCAL_RECORDS_SHA256=$before"
          Write-Host 'MP_RECONCILE_LIVE_CHECKOUT_SOURCE_WRITES=0'
          Write-Host 'MP_RECONCILE_CONTROLLER_OR_QUEUE_TOUCHES=0'
          Write-Host 'MP_RECONCILE_FAST_FORWARD_PERFORMED=FALSE'
          Write-Host 'MP_RECONCILE_KTRADE_IDLE=NOT_ESTABLISHED'
          Write-Host 'MP_RECONCILE_READONLY_COMPLETED=PASS'
) 'LOCAL_HEAD_FORMAT'
          Need ($branch.Length -gt 0) 'BRANCH_NONEMPTY'
          $records=Join-Path $mp '.ice\records.json'
          Need (Test-Path -LiteralPath $records -PathType Leaf) 'RECORD_FILE'
          $before=(Get-FileHash -LiteralPath $records -Algorithm SHA256).Hash.ToLowerInvariant()
          $tracked=@(& $git -C $mp status --porcelain=v1 --untracked-files=no)
          Need ($LASTEXITCODE -eq 0) 'STATUS'
          $recordTracked=@(& $git -C $mp status --porcelain=v1 --untracked-files=no -- '.ice/records.json')
          Need ($LASTEXITCODE -eq 0) 'RECORD_STATUS'
          $gitRecord=(Git @('rev-parse','HEAD:.ice/records.json') 'RECORD_BLOB' | Out-String).Trim()
          $accepted='de31cdb4dfc29220eeaf52c9a1eab8c8a5b2a5cc'
          $remote='https://github.com/spoonman136668-ai/Mind-Palace.git'
          $remoteResult=@(& $git ls-remote --exit-code $remote 'refs/heads/main')
          Need ($LASTEXITCODE -eq 0 -and $remoteResult.Count -eq 1) 'ACCEPTED_REMOTE'
          $observed=([string]$remoteResult[0] -split '\s+')[0]
          Need ($observed -ceq $accepted) 'REMOTE_MAIN_IDENTITY'
          $tool=@('tools/context-pack-budgeted.ps1','tools/context-pack-tiered.ps1','tools/mind.ps1')
          foreach($k in $tool) {
            $status=@(& $git -C $mp status --porcelain=v1 --untracked-files=no -- $k)
            Need ($LASTEXITCODE -eq 0) 'TOOL_STATUS'
            Need ($status.Count -eq 0) 'TOOL_DIRTY'
          }
          Need ((Get-FileHash -LiteralPath $records -Algorithm SHA256).Hash.ToLowerInvariant() -ceq $before) 'RECORD_MUTATED'
          Write-Host "MP_RECONCILE_LOCAL_BRANCH=$branch"
          Write-Host "MP_RECONCILE_LOCAL_HEAD=$head"
          Write-Host "MP_RECONCILE_ACCEPTED_REMOTE_MAIN=$observed"
          Write-Host "MP_RECONCILE_LOCAL_TRACKED_DIRTY_COUNT=$($tracked.Count)"
          Write-Host "MP_RECONCILE_LOCAL_RECORDS_DIRTY_COUNT=$($recordTracked.Count)"
          Write-Host "MP_RECONCILE_LOCAL_RECORDS_GIT_BLOB=$gitRecord"
          Write-Host "MP_RECONCILE_LOCAL_RECORDS_SHA256=$before"
          Write-Host 'MP_RECONCILE_LIVE_CHECKOUT_SOURCE_WRITES=0'
          Write-Host 'MP_RECONCILE_CONTROLLER_OR_QUEUE_TOUCHES=0'
          Write-Host 'MP_RECONCILE_FAST_FORWARD_PERFORMED=FALSE'
          Write-Host 'MP_RECONCILE_KTRADE_IDLE=NOT_ESTABLISHED'
          Write-Host 'MP_RECONCILE_READONLY_COMPLETED=PASS'
