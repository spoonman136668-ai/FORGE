name: MP rescued source vs merged main comparison
on:
  push:
    branches: [diagnostics/mp-installed-go-source-rescue-20261023]
    paths: [.github/workflows/mp-rescued-source-compare-20261023.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: mp-rescued-source-compare-20261023
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Download sealed installed-source rescue
        uses: actions/download-artifact@v4
        with:
          name: mp-installed-go-source-rescue
          run-id: 40050860442
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rescue
      - name: Compare rescued installed source to merged CKB main
        shell: bash
        run: |
          set -euo pipefail
          merged='ceee64384ebfd6b9e00108ae22488505a68c53d1'
          root="$RUNNER_TEMP/ckb"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/spoonman136668-ai/ckb-plane.git "$root"
          git -C "$root" checkout --quiet --detach "$merged"
          test "$(git -C "$root" rev-parse HEAD)" = "$merged"
          rescue="$RUNNER_TEMP/rescue"
          source="$root/snapshot/source"
          test -f "$rescue/RESCUE-MANIFEST.json"
          python - "$rescue" "$source" "$RUNNER_TEMP/mp-source-diff.json" <<'PY'
          import hashlib,json,pathlib,sys
          rescue=pathlib.Path(sys.argv[1]); source=pathlib.Path(sys.argv[2]); out=pathlib.Path(sys.argv[3])
          manifest=json.loads((rescue/"RESCUE-MANIFEST.json").read_text(encoding="utf-8-sig"))
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          rows=[]
          rescued=set()
          counts={"IDENTICAL":0,"MODIFIED":0,"ADDED":0}
          for row in manifest:
              rel=row["path"].replace("\\","/")
              rescued.add(rel)
              rp=rescue/pathlib.PurePosixPath(rel)
              sp=source/pathlib.PurePosixPath(rel)
              assert rp.is_file()
              rsha=sha(rp)
              assert rsha==row["sha256"]
              if not sp.is_file():
                  status="ADDED"; msha=None
              else:
                  msha=sha(sp); status="IDENTICAL" if msha==rsha else "MODIFIED"
              counts[status]+=1
              rows.append({"path":rel,"status":status,"installed_sha256":rsha,"merged_sha256":msha,"bytes":rp.stat().st_size})
          merged_scoped=[]
          for base in (source/"internal"/"plane", source/"cmd"/"ckb-plane"):
              if base.exists():
                  merged_scoped.extend(p for p in base.rglob("*.go") if p.is_file())
          for p in (source/"go.mod",source/"go.sum"):
              if p.is_file(): merged_scoped.append(p)
          missing=[]
          for p in sorted(set(merged_scoped)):
              rel=p.relative_to(source).as_posix()
              if rel not in rescued:
                  missing.append({"path":rel,"merged_sha256":sha(p),"bytes":p.stat().st_size})
          result={
              "schema":"mp.installed-go-source-vs-merged-main.v1",
              "merged_commit":"ceee64384ebfd6b9e00108ae22488505a68c53d1",
              "rescue_manifest_sha256":hashlib.sha256((rescue/"RESCUE-MANIFEST.json").read_bytes()).hexdigest(),
              "counts":{**counts,"MISSING_FROM_INSTALLED_RESCUE":len(missing),"RESCUED_TOTAL":len(rows)},
              "rows":sorted(rows,key=lambda x:x["path"]),
              "missing_from_installed_rescue":missing,
          }
          out.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("MP_COMPARE_RESCUED_TOTAL="+str(len(rows)))
          for k in ("IDENTICAL","MODIFIED","ADDED"):
              print("MP_COMPARE_"+k+"="+str(counts[k]))
          print("MP_COMPARE_MISSING_FROM_RESCUE="+str(len(missing)))
          for x in rows:
              if x["status"]!="IDENTICAL":
                  print("MP_COMPARE_DELTA path="+x["path"]+" status="+x["status"]+" installed_sha256="+x["installed_sha256"]+" merged_sha256="+str(x["merged_sha256"]))
          print("MP_COMPARE_MANIFEST_SHA256="+hashlib.sha256(out.read_bytes()).hexdigest())
          PY
          echo "MP_COMPARE_CONTENT_LOGGED=FALSE"
      - name: Upload exact comparison manifest
        uses: actions/upload-artifact@v4
        with:
          name: mp-installed-source-vs-main-comparison
          path: ${{ runner.temp }}/mp-source-diff.json
          if-no-files-found: error
          retention-days: 7
