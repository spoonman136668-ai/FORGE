name: ITD02 F124CN learned multistage causal composition — train-only
on:
  push:
    branches:
      - research/itd02-f124cn-learned-staged-binding-20261025
    paths:
      - "research/north-star-transfer/f124cn/FROZEN_PROTOCOL.json"
      - "research/north-star-transfer/f124cn/f124cn_model.py"
      - "research/north-star-transfer/f124cn/f124cn_eval.py"
      - ".github/workflows/itd02-f124cn-learned-composition.yml"
permissions:
  contents: read
jobs:
  frozen-public-train-only-learning:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 17
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Authenticate freeze and execute one bounded learned-mechanism study
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c36b05db29c4b9b33703c56de8533e488feb37d2 "$GITHUB_SHA"
          python -B research/north-star-transfer/f124cn/f124cn_eval.py --out "$RUNNER_TEMP/f124cn-complete.json"
          python -B -c 'import json,sys; r=json.load(open(sys.argv[1])); assert len(r["science"]["all_task_results"])==16 and all(v["total"]==1024 for v in r["totals"].values()) and r["science"]["FSA_scientific_firstuse"] is False' "$RUNNER_TEMP/f124cn-complete.json"
          git diff --exit-code
          echo F124CN_FROZEN_TRAIN_ONLY_CAUSAL_LEARNER=RESULT_RECORDED
      - name: Original complete development evidence to GitHub Actions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f124cn-original-dev-${{ matrix.os }}
          path: ${{ runner.temp }}/f124cn-complete.json
          retention-days: 30
