name: CKB R440 original-owner inactive cutover and exact rollback bundle
on:
  push:
    branches: [audit/ckb-r431-original-owner-readonly-20261027]
permissions:
  contents: read
jobs:
  r440-inactive-release-plan:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Stage byte-bound candidate startup and exact original rollback outside the live release store
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'R440_OWNER_RUNNER_DRIFT'}
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          if($who.User.Value -cne 'S-1-5-21-346268797-1037220602-1885922596-1001'){throw 'R440_OWNER_SID_DRIFT'}
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $store='C:\ProgramData\CKBR\release-store\ckb-plane'
          $oldID='PLANE-R220-LIVECOMPAT-20261023'
          $newID='PLANE-R440-TERMINAL-SCHEDULER-20261027'
          $oldHash='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          $newHash='44631ba52413c7e88f00e3e05f051ee8566d16f1a7ca3b11035ce8c613a44019'
          $oldEXE=Join-Path $store ('releases\'+$oldID+'\bin\ckb-plane.exe')
          $newLive=Join-Path $store ('releases\'+$newID)
          $stageEXE='C:\Users\camar\AppData\Local\CKB-R438-Qualified-Candidates\R438-40497867453\ckb-plane.exe'
          $ptr=Join-Path $store 'state\active-release'
          $ptrHash='06909f579234ea648f35157b81c2aa9aa032f0707f83c8eab68ac526d4b23557'
          if((Get-FileHash -LiteralPath $oldEXE -Algorithm SHA256).Hash.ToLowerInvariant() -cne $oldHash){throw 'R440_OLD_EXE_DRIFT'}
          if((Get-FileHash -LiteralPath $stageEXE -Algorithm SHA256).Hash.ToLowerInvariant() -cne $newHash){throw 'R440_QUALIFIED_BINARY_DRIFT'}
          if((Get-FileHash -LiteralPath $ptr -Algorithm SHA256).Hash.ToLowerInvariant() -cne $ptrHash){throw 'R440_ACTIVE_POINTER_DRIFT'}
          if(Test-Path -LiteralPath $newLive){throw 'R440_NEW_RELEASE_ID_ALREADY_IN_USE'}
          $task=@(Get-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction Stop)
          if($task.Count -ne 1 -or [string]$task[0].State -cne 'Running'){throw 'R440_TASK_DRIFT'}
          $actions=@($task[0].Actions)
          if($actions.Count -ne 1){throw 'R440_TASK_ACTION_COUNT_DRIFT'}
          $args=[string]$actions[0].Arguments
          $cmdHash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($args))).ToLowerInvariant()
          if($cmdHash -cne 'cb83905cfa4aa7e99683038160448802bdaf8c602c387f575fa8b1bf0ffad29c'){throw 'R440_TASK_ARGUMENTS_DRIFT'}
          $scripts=@([regex]::Matches($args,'[A-Z]:\\[\w\\ ._-]+\.ps1','IgnoreCase') | ForEach-Object {$_.Value} | Sort-Object -Unique)
          if($scripts.Count -ne 1 -or [IO.Path]::GetFileName($scripts[0]) -cne 'Start-R18-Controller.ps1'){throw 'R440_LAUNCHER_PATH_DRIFT'}
          $launch=$scripts[0]
          $originalBytes=[IO.File]::ReadAllBytes($launch)
          $origHash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($originalBytes)).ToLowerInvariant()
          if($origHash -cne '64c13ebba9dca8f31e6b11b16837b7071a1b8fd06207ad80a0048bb9c5b9e1e4'){throw 'R440_LAUNCHER_BYTES_DRIFT'}
          $utf8=[Text.UTF8Encoding]::new($false,$true)
          $originalText=$utf8.GetString($originalBytes)
          if(($originalText.Split(@($oldID),[StringSplitOptions]::None).Length-1) -ne 1){throw 'R440_LAUNCHER_RELEASE_PREIMAGE_DRIFT'}
          if($originalText.Contains($newID)){throw 'R440_LAUNCHER_ALREADY_NEW'}
          $newText=$originalText.Replace($oldID,$newID)
          $candidateBytes=[Text.UTF8Encoding]::new($false).GetBytes($newText)
          $rolledBack=[Text.UTF8Encoding]::new($false).GetBytes($newText.Replace($newID,$oldID))
          $rollbackHash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($rolledBack)).ToLowerInvariant()
          if($rollbackHash -cne $origHash){throw 'R440_REVERSE_SUBSTITUTION_NOT_BYTE_EXACT'}
          $nullTok=$null;$parseErr=$null
          $null=[System.Management.Automation.Language.Parser]::ParseInput($newText,[ref]$nullTok,[ref]$parseErr)
          if(@($parseErr).Count -ne 0){throw 'R440_CANDIDATE_STARTUP_SCRIPT_SYNTAX_ERROR'}
          $newScriptHash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($candidateBytes)).ToLowerInvariant()
          Write-Output 'R440_BYTE_EXACT_ORIGINAL_ROLLBACK=PASS'
          Write-Output 'R440_ONE_REFERENCE_SCRIPT_SUBSTITUTION=PASS'
          Write-Output ('R440_QUALIFIED_EXE_SHA256='+$newHash)
          Write-Output ('R440_ORIGINAL_LAUNCHER_SHA256='+$origHash)
          Write-Output ('R440_INACTIVE_PROPOSED_LAUNCHER_SHA256='+$newScriptHash)
          $p=@(Get-CimInstance Win32_Process -Filter "Name = 'ckb-plane.exe'" -ErrorAction Stop)
          if($p.Count -ne 1 -or $p[0].ExecutablePath -cne $oldEXE){throw 'R440_ORIGINAL_RUNNING_PROCESS_DRIFT'}
          $oldPID=$p[0].ProcessId
          $destRoot=Join-Path $env:LOCALAPPDATA 'CKB-R440-Inactive-Cutover-Packages'
          $dest=Join-Path $destRoot ('R440-'+$env:GITHUB_RUN_ID)
          $pending=$dest+'.incomplete'
          if((Test-Path -LiteralPath $dest) -or (Test-Path -LiteralPath $pending)){throw 'R440_INACTIVE_DEST_COLLISION'}
          if(!(Test-Path -LiteralPath $destRoot)){New-Item -Path $destRoot -ItemType Directory -ErrorAction Stop | Out-Null}
          New-Item -Path $pending -ItemType Directory -ErrorAction Stop | Out-Null
          try {
            $bins=Join-Path $pending 'bin'
            New-Item -Path $bins -ItemType Directory -ErrorAction Stop | Out-Null
            Copy-Item -LiteralPath $stageEXE -Destination (Join-Path $bins 'ckb-plane.exe') -ErrorAction Stop
            [IO.File]::WriteAllBytes((Join-Path $pending 'Start-R440-Controller.proposed.ps1'),$candidateBytes)
            [IO.File]::WriteAllBytes((Join-Path $pending 'Start-R18-Controller.rollback.ps1'),$originalBytes)
            if((Get-FileHash -LiteralPath (Join-Path $bins 'ckb-plane.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $newHash){throw 'R440_STAGED_EXE_CORRUPT'}
            if((Get-FileHash -LiteralPath (Join-Path $pending 'Start-R440-Controller.proposed.ps1') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $newScriptHash){throw 'R440_STAGED_LAUNCHER_CORRUPT'}
            if((Get-FileHash -LiteralPath (Join-Path $pending 'Start-R18-Controller.rollback.ps1') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $origHash){throw 'R440_STAGED_ROLLBACK_CORRUPT'}
            $manifest=[ordered]@{schema='ckb-plane.r440.inactive-cutover-package.v1';source_regression_run=40483672646;exact_rebuilt_candidate_run=40497867453;candidate_executable_sha256=$newHash;original_r220_sha256=$oldHash;original_startup_script_sha256=$origHash;proposed_startup_script_sha256=$newScriptHash;original_task_args_sha256=$cmdHash;original_release_id=$oldID;proposed_release_id=$newID;original_active_pointer_sha256=$ptrHash;promoted=$false;task_modified=$false;controller_restarted=$false;live_db_modified=$false;rollback_bundle_verified=$true}
            [IO.File]::WriteAllText((Join-Path $pending 'manifest.json'),($manifest|ConvertTo-Json -Depth 5),[Text.UTF8Encoding]::new($false))
            Move-Item -LiteralPath $pending -Destination $dest -ErrorAction Stop
          } finally {if(Test-Path -LiteralPath $pending){Remove-Item -LiteralPath $pending -Recurse -Force -ErrorAction Stop}}
          Write-Output ('R440_INACTIVE_PACKAGE_DIR='+$dest)
          $nowTask=@(Get-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction Stop)
          $nowProcess=@(Get-CimInstance Win32_Process -Filter "Name = 'ckb-plane.exe'" -ErrorAction Stop)
          if($nowTask.Count -ne 1 -or [string]$nowTask[0].State -cne 'Running' -or $nowProcess.Count -ne 1 -or $nowProcess[0].ProcessId -ne $oldPID){throw 'R440_LIVE_CONTROLLER_CHANGED_DURING_STAGING'}
          if((Get-FileHash -LiteralPath $oldEXE -Algorithm SHA256).Hash.ToLowerInvariant() -cne $oldHash){throw 'R440_ORIGINAL_EXE_CHANGED'}
          if((Get-FileHash -LiteralPath $launch -Algorithm SHA256).Hash.ToLowerInvariant() -cne $origHash){throw 'R440_ORIGINAL_LAUNCHER_CHANGED'}
          if((Get-FileHash -LiteralPath $ptr -Algorithm SHA256).Hash.ToLowerInvariant() -cne $ptrHash){throw 'R440_ACTIVE_POINTER_CHANGED'}
          Write-Output 'R440_INACTIVE_CUTOVER_PACKAGE_SEALED=PASS'
          Write-Output 'R440_LIVE_PROCESS_TASK_AND_ACTIVE_POINTER_UNCHANGED=PASS'
          Write-Output 'R440_NO_CUTOVER_OR_CONTROLLER_RESTART=TRUE'
