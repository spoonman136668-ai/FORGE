name: CKB R431 read-only original-owner release and task preflight
on:
  push:
    branches: [audit/ckb-r431-original-owner-readonly-20261027]
permissions:
  contents: read
jobs:
  original-owner-readonly:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 12
    steps:
      - name: Inspect exact installed R220 release and original controller ownership without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE'){throw 'R431_WRONG_ORIGINAL_OWNER_RUNNER'}
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'R431_WRONG_SOURCE_REPOSITORY'}
          $id=[Security.Principal.WindowsIdentity]::GetCurrent()
          $admin=[Security.Principal.WindowsPrincipal]::new($id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Output ('R431_WINDOWS_OWNER_ACCOUNT='+$id.Name)
          Write-Output ('R431_WINDOWS_OWNER_SID='+$id.User.Value)
          Write-Output ('R431_RUNNER_ELEVATED='+$admin)
          $release='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R220-LIVECOMPAT-20261023'
          $exe=Join-Path $release 'bin\ckb-plane.exe'
          $expected='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          if(!(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'R431_EXPECTED_INSTALLED_R220_MISSING'}
          $actual=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ('R431_INSTALLED_R220_EXE_SHA256='+$actual)
          if($actual -cne $expected){throw 'R431_INSTALLED_R220_DRIFT'}
          Write-Output 'R431_INSTALLED_RELEASE_SHA256=PASS'
          $root='C:\Users\camar\GolandProjects\ckb-plane'
          $native=Join-Path $root 'internal\plane\autonomy.go'
          $nativeExpected='c4cc44e3820b8ac860a75b87df8ba27dcdff09ca19e427661f43d07b999ef3bd'
          if(!(Test-Path -LiteralPath $native -PathType Leaf)){throw 'R431_NATIVE_SOURCE_MISSING'}
          $nativeActual=(Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ('R431_ORIGINAL_AUTONOMY_SOURCE_SHA256='+$nativeActual)
          if($nativeActual -cne $nativeExpected){throw 'R431_ORIGINAL_NATIVE_SOURCE_DRIFT'}
          $store='C:\ProgramData\CKBR\release-store\ckb-plane'
          foreach($d in @('releases','locks','receipts','state')) {
            $path=Join-Path $store $d
            Write-Output ('R431_STORE_DIRECTORY_'+$d.ToUpperInvariant()+'='+(Test-Path -LiteralPath $path -PathType Container))
          }
          $task=@(Get-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction SilentlyContinue)
          Write-Output ('R431_ORIGINAL_SCHEDULED_TASK_COUNT='+$task.Count)
          foreach($t in $task) {
            Write-Output ('R431_TASK_NAME='+$t.TaskName)
            Write-Output ('R431_TASK_PATH='+$t.TaskPath)
            Write-Output ('R431_TASK_STATE='+$t.State)
            Write-Output ('R431_TASK_PRINCIPAL='+$t.Principal.UserId)
            Write-Output ('R431_TASK_RUN_LEVEL='+$t.Principal.RunLevel)
            foreach($action in $t.Actions) {
              Write-Output ('R431_TASK_ACTION_EXE='+$action.Execute)
              $raw=$action.Arguments
              Write-Output ('R431_TASK_ACTION_ARGUMENTS_SHA256='+([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes([string]$raw))).ToLowerInvariant()))
            }
            $ti=Get-ScheduledTaskInfo -InputObject $t -ErrorAction Stop
            Write-Output ('R431_TASK_LAST_RUN_UTC='+$ti.LastRunTime.ToUniversalTime().ToString('o'))
            Write-Output ('R431_TASK_LAST_RESULT='+$ti.LastTaskResult)
            if($null -ne $ti.NextRunTime) { Write-Output ('R431_TASK_NEXT_RUN_UTC='+$ti.NextRunTime.ToUniversalTime().ToString('o')) } else { Write-Output 'R431_TASK_NEXT_RUN_UTC=NOT_SCHEDULED' }
          }
          $processes=@(Get-CimInstance Win32_Process -Filter "Name = 'ckb-plane.exe'" -ErrorAction Stop)
          Write-Output ('R431_NATIVE_PROCESS_COUNT='+$processes.Count)
          foreach($p in $processes) {
            Write-Output ('R431_NATIVE_PROCESS_ID='+$p.ProcessId)
            Write-Output ('R431_NATIVE_PARENT_PROCESS_ID='+$p.ParentProcessId)
            Write-Output ('R431_NATIVE_PROCESS_EXE='+$p.ExecutablePath)
            Write-Output ('R431_NATIVE_PROCESS_START='+$p.CreationDate)
            if($p.ExecutablePath -and (Test-Path -LiteralPath $p.ExecutablePath -PathType Leaf)){
              Write-Output ('R431_NATIVE_PROCESS_FILE_SHA256='+(Get-FileHash -LiteralPath $p.ExecutablePath -Algorithm SHA256).Hash.ToLowerInvariant())
            }
          }
          $activeRoot=Join-Path $env:LOCALAPPDATA 'CKB-R429-Qualified-Candidates'
          if(Test-Path -LiteralPath $activeRoot -PathType Container) {
            $candidates=@(Get-ChildItem -LiteralPath $activeRoot -Directory -ErrorAction Stop)
            Write-Output ('R431_EXISTING_INACTIVE_CANDIDATE_COUNT='+$candidates.Count)
            foreach($c in $candidates) {
              Write-Output ('R431_INACTIVE_CANDIDATE_NAME='+$c.Name)
              $f=Join-Path $c.FullName 'ckb-plane.exe'
              if(Test-Path -LiteralPath $f -PathType Leaf) {
                Write-Output ('R431_INACTIVE_CANDIDATE_SHA256='+(Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash.ToLowerInvariant())
              }
            }
          } else {Write-Output 'R431_EXISTING_INACTIVE_CANDIDATE_COUNT=0'}
          Write-Output 'R431_READ_ONLY_INSPECTION=TRUE'
          Write-Output 'R431_NO_CONTROLLER_RESTART=TRUE'
          Write-Output 'R431_NO_RELEASE_ADMISSION=TRUE'
          Write-Output 'R431_NO_SQLITE_WRITE=TRUE'
      - name: R432 inspect original release-admission registry, paths and inactive candidate without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'R432_WRONG_OWNER_RUNNER'}
          $exe='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R220-LIVECOMPAT-20261023\bin\ckb-plane.exe'
          $expected='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          if(!(Test-Path -LiteralPath $exe -PathType Leaf) -or (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected){throw 'R432_LIVE_EXECUTABLE_DRIFT'}
          $task=@(Get-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction SilentlyContinue)
          if($task.Count -ne 1 -or [string]$task[0].State -cne 'Running'){throw 'R432_ORIGINAL_TASK_NOT_RUNNING'}
          $process=@(Get-CimInstance Win32_Process -Filter "Name = 'ckb-plane.exe'" -ErrorAction Stop)
          $matches=@($process | Where-Object {$_.ExecutablePath -ceq $exe})
          if($process.Count -ne 1 -or $matches.Count -ne 1){throw 'R432_ORIGINAL_NATIVE_PROCESS_TOPOLOGY_DRIFT'}
          Write-Output ('R432_ORIGINAL_CONTROLLER_PROCESS_ID='+$matches[0].ProcessId)
          Write-Output 'R432_ORIGINAL_CONTROLLER_RUNNING=PASS'
          $store='C:\ProgramData\CKBR\release-store\ckb-plane'
          $release=Split-Path (Split-Path $exe -Parent) -Parent
          foreach($root in @($store,$release,(Join-Path $store 'state'))) {
            if(!(Test-Path -LiteralPath $root -PathType Container)){throw ('R432_REQUIRED_DIRECTORY_MISSING='+$root)}
            Write-Output ('R432_DIRECTORY='+$root)
            $children=@(Get-ChildItem -LiteralPath $root -Force -ErrorAction Stop | Sort-Object -Property Name)
            Write-Output ('R432_DIRECTORY_CHILD_COUNT='+$children.Count)
            if($children.Count -gt 120){throw 'R432_DIRECTORY_UNBOUNDED'}
            foreach($child in $children){
              if($child.Name -match '[\r\n]'){throw 'R432_UNSAFE_CHILD_NAME'}
              Write-Output ('R432_CHILD='+$(if($child.PSIsContainer){'D:'}else{'F:'})+$child.Name)
            }
          }
          $configs=@(
            (Join-Path $release 'config\autonomy.yaml'),
            (Join-Path $release 'config\webui-bridge.json'),
            (Join-Path $release 'config\local-operations.json'),
            'C:\Users\camar\GolandProjects\ckb-plane\config\autonomy.yaml',
            'C:\Users\camar\GolandProjects\ckb-plane\config\local-operations.json'
          )
          foreach($config in $configs) {
            $present=Test-Path -LiteralPath $config -PathType Leaf
            Write-Output ('R432_CONFIG_PATH='+$config)
            Write-Output ('R432_CONFIG_PRESENT='+$present)
            if($present){
              Write-Output ('R432_CONFIG_SHA256='+(Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash.ToLowerInvariant())
              if($config -like '*local-operations.json'){
                $registry=Get-Content -LiteralPath $config -Raw -ErrorAction Stop | ConvertFrom-Json -ErrorAction Stop
                Write-Output ('R432_LOCAL_OPERATION_SCHEMA='+[string]$registry.schema)
                $ops=@($registry.operations)
                Write-Output ('R432_REGISTERED_OPERATION_COUNT='+$ops.Count)
                if($ops.Count -gt 64){throw 'R432_LOCAL_OPERATION_COUNT_INVALID'}
                foreach($op in $ops) {
                  if([string]$op.id -notmatch '^[a-z0-9_-]{1,80}$'){throw 'R432_OPERATION_ID_INVALID'}
                  Write-Output ('R432_OPERATION_ID='+[string]$op.id)
                  Write-Output ('R432_OPERATION_CLASS='+[string]$op.class)
                }
              }
            }
          }
          $older=Join-Path $env:LOCALAPPDATA 'CKB-R429-Qualified-Candidates\R429-40479635463'
          $manifest=Join-Path $older 'manifest.json'
          if(Test-Path -LiteralPath $manifest -PathType Leaf){
            $record=Get-Content -LiteralPath $manifest -Raw -ErrorAction Stop | ConvertFrom-Json -ErrorAction Stop
            Write-Output ('R432_INACTIVE_MANIFEST_SHA256='+(Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant())
            Write-Output ('R432_INACTIVE_MANIFEST_SCHEMA='+[string]$record.schema)
            Write-Output ('R432_INACTIVE_MANIFEST_CANDIDATE_HASH='+[string]$record.candidate_sha256)
            Write-Output ('R432_INACTIVE_MANIFEST_REGRESSION='+[string]$record.complete_baseline_filtered_windows_regression)
            Write-Output ('R432_INACTIVE_MANIFEST_PROMOTED='+[string]$record.promoted)
          }
          Write-Output 'R432_NO_NATIVE_COMMAND_OR_MAILBOX_SUBMISSION=TRUE'
          Write-Output 'R432_NO_SQLITE_OR_RELEASE_WRITE=TRUE'
          Write-Output 'R432_NO_TASK_RESTART=TRUE'
      - name: R433 resolve active-release pointer and existing release-store operations read-only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'R433_WRONG_ORIGINAL_OWNER_RUNNER'}
          $store='C:\ProgramData\CKBR\release-store\ckb-plane'
          $active=Join-Path $store 'state\active-release'
          if(!(Test-Path -LiteralPath $active -PathType Leaf)){throw 'R433_ACTIVE_RELEASE_POINTER_ABSENT'}
          $bytes=[IO.File]::ReadAllBytes($active)
          if($bytes.Length -lt 1 -or $bytes.Length -gt 512){throw 'R433_ACTIVE_POINTER_SIZE_INVALID'}
          Write-Output ('R433_ACTIVE_POINTER_SHA256='+(Get-FileHash -LiteralPath $active -Algorithm SHA256).Hash.ToLowerInvariant())
          $label=([Text.Encoding]::UTF8.GetString($bytes)).Trim()
          if($label -match '^[A-Za-z0-9_.-]{1,100}$') {
            Write-Output ('R433_ACTIVE_POINTER_RELEASE_ID='+$label)
            Write-Output ('R433_ACTIVE_POINTER_RELEASE_DIR_PRESENT='+(Test-Path -LiteralPath (Join-Path $store ('releases\'+$label)) -PathType Container))
          } else {Write-Output 'R433_ACTIVE_POINTER_FORMAT=NON_SIMPLE_RELEASE_ID'}
          $ops=Join-Path $store 'ops'
          if(!(Test-Path -LiteralPath $ops -PathType Container)){throw 'R433_OWNER_RELEASE_OPS_MISSING'}
          $children=@(Get-ChildItem -LiteralPath $ops -Force -ErrorAction Stop | Sort-Object -Property Name)
          if($children.Count -gt 60){throw 'R433_OPS_FILE_COUNT_EXCEEDED'}
          Write-Output ('R433_OWNER_RELEASE_OPS_COUNT='+$children.Count)
          foreach($c in $children) {
            if($c.Name -notmatch '^[a-zA-Z0-9._-]{1,120}$'){throw 'R433_OWNER_RELEASE_OP_NAME_INVALID'}
            Write-Output ('R433_OWNER_RELEASE_OP='+$(if($c.PSIsContainer){'D:'}else{'F:'})+$c.Name)
            if(-not $c.PSIsContainer -and $c.Name -match '\.(ps1|json|txt)$'){
              Write-Output ('R433_OWNER_RELEASE_OP_HASH='+(Get-FileHash -LiteralPath $c.FullName -Algorithm SHA256).Hash.ToLowerInvariant())
            }
          }
          $releases=Join-Path $store 'releases'
          $installed=@(Get-ChildItem -LiteralPath $releases -Directory -ErrorAction Stop | Sort-Object -Property Name)
          if($installed.Count -gt 80){throw 'R433_RELEASE_SET_UNBOUNDED'}
          Write-Output ('R433_RELEASE_COUNT='+$installed.Count)
          foreach($r in $installed) {
            if($r.Name -notmatch '^[a-zA-Z0-9._-]{1,120}$'){throw 'R433_RELEASE_ID_INVALID'}
            Write-Output ('R433_RELEASE_DIR='+$r.Name)
          }
          $task=@(Get-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction SilentlyContinue)
          if($task.Count -ne 1 -or [string]$task[0].State -cne 'Running'){throw 'R433_TASK_CHANGED_DURING_INSPECTION'}
          $pidmatches=@(Get-CimInstance Win32_Process -Filter "Name = 'ckb-plane.exe'" -ErrorAction Stop)
          if($pidmatches.Count -ne 1 -or $pidmatches[0].ExecutablePath -cne 'C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R220-LIVECOMPAT-20261023\bin\ckb-plane.exe'){throw 'R433_LIVE_PROCESS_CHANGED_DURING_INSPECTION'}
          Write-Output 'R433_LIVE_PROCESS_STILL_R220=PASS'
          Write-Output 'R433_READ_ONLY=TRUE'
          Write-Output 'R433_NO_RELEASE_PROMOTION_OR_QUEUE_CHANGE=TRUE'
      - name: R434 query authenticated existing native controller status GET only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'R434_WRONG_OWNER_RUNNER'}
          $exe='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R220-LIVECOMPAT-20261023\bin\ckb-plane.exe'
          if(!(Test-Path -LiteralPath $exe -PathType Leaf) -or (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne '82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'){throw 'R434_NATIVE_EXE_CHANGED'}
          $before=@(Get-CimInstance Win32_Process -Filter "Name = 'ckb-plane.exe'" -ErrorAction Stop)
          if($before.Count -ne 1 -or $before[0].ExecutablePath -cne $exe){throw 'R434_CONTROLLER_PROCESS_PREIMAGE_CHANGED'}
          $tokenFile='C:\Users\camar\GolandProjects\ckb-plane\state\operator.token'
          if(!(Test-Path -LiteralPath $tokenFile -PathType Leaf)){throw 'R434_ORIGINAL_OPERATOR_TOKEN_FILE_UNAVAILABLE'}
          $token=([IO.File]::ReadAllText($tokenFile)).Trim()
          if($token -cnotmatch '^[a-fA-F0-9]{64}$'){throw 'R434_ORIGINAL_OPERATOR_TOKEN_INVALID'}
          try {
            $native=Invoke-RestMethod -Method Get -Uri 'http://127.0.0.1:8791/api/native' -Headers @{Authorization=('Bearer '+$token)} -TimeoutSec 8 -ErrorAction Stop
          } catch {
            throw ('R434_NATIVE_GET_REFUSED:'+ $_.Exception.GetType().Name)
          } finally {
            $token=$null
          }
          if($null -eq $native){throw 'R434_NATIVE_RESULT_EMPTY'}
          Write-Output ('R434_NATIVE_VERSION='+[string]$native.version)
          Write-Output ('R434_NATIVE_AUTHORITY='+[string]$native.authority)
          Write-Output ('R434_NATIVE_GENERATION='+[string]$native.generation)
          Write-Output ('R434_NATIVE_PAUSED='+[string]$native.paused)
          Write-Output ('R434_NATIVE_HEARTBEAT_AT='+[string]$native.heartbeat_at)
          Write-Output ('R434_NATIVE_HEARTBEAT_STALE='+[string]$native.heartbeat_stale)
          Write-Output ('R434_NATIVE_ACCEPTED_REF_MUTATION_ALLOWED='+[string]$native.accepted_ref_mutation_allowed)
          $rawstatus=[string]$native.controller_status
          $statusClass=if($rawstatus -match '^([A-Z_]+)'){$matches[1]}else{'OTHER'}
          Write-Output ('R434_NATIVE_CONTROLLER_STATUS_CLASS='+$statusClass)
          $queue=@($native.queue)
          $jobs=@($native.jobs)
          $blockers=@($native.blockers)
          Write-Output ('R434_NATIVE_QUEUE_ITEM_COUNT='+$queue.Count)
          Write-Output ('R434_NATIVE_JOBS_COUNT='+$jobs.Count)
          Write-Output ('R434_NATIVE_BLOCKER_COUNT='+$blockers.Count)
          foreach($group in @($queue | Group-Object -Property state | Sort-Object -Property Name)) {
            if([string]$group.Name -notmatch '^[A-Z_]{1,40}$'){throw 'R434_QUEUE_STATE_UNEXPECTED'}
            Write-Output ('R434_QUEUE_STATE_'+$group.Name+'='+$group.Count)
          }
          foreach($group in @($jobs | Group-Object -Property state | Sort-Object -Property Name)) {
            if([string]$group.Name -notmatch '^[A-Z_]{1,40}$'){throw 'R434_JOB_STATE_UNEXPECTED'}
            Write-Output ('R434_JOB_STATE_'+$group.Name+'='+$group.Count)
          }
          $after=@(Get-CimInstance Win32_Process -Filter "Name = 'ckb-plane.exe'" -ErrorAction Stop)
          if($after.Count -ne 1 -or $after[0].ProcessId -ne $before[0].ProcessId){throw 'R434_LIVE_PROCESS_CHANGED_DURING_READ'}
          Write-Output 'R434_NATIVE_AUTHENTICATED_GET=PASS'
          Write-Output 'R434_NO_NATIVE_POST_OR_QUEUE_MUTATION=TRUE'
          Write-Output 'R434_NO_CONTROLLER_RESTART_OR_TOKEN_LOGGING=TRUE'
      - name: R435 verify terminal blocker identity and queue eligibility by authenticated GET
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'R435_WRONG_ORIGINAL_OWNER_RUNNER'}
          $exe='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R220-LIVECOMPAT-20261023\bin\ckb-plane.exe'
          $processes=@(Get-CimInstance Win32_Process -Filter "Name = 'ckb-plane.exe'" -ErrorAction Stop)
          if($processes.Count -ne 1 -or $processes[0].ExecutablePath -cne $exe){throw 'R435_ORIGINAL_PROCESS_DRIFT'}
          $tokenFile='C:\Users\camar\GolandProjects\ckb-plane\state\operator.token'
          if(!(Test-Path -LiteralPath $tokenFile -PathType Leaf)){throw 'R435_TOKEN_FILE_UNAVAILABLE'}
          $token=([IO.File]::ReadAllText($tokenFile)).Trim()
          if($token -cnotmatch '^[a-fA-F0-9]{64}$'){throw 'R435_TOKEN_FORMAT_INVALID'}
          try {
            $native=Invoke-RestMethod -Method Get -Uri 'http://127.0.0.1:8791/api/native' -Headers @{Authorization=('Bearer '+$token)} -TimeoutSec 8 -ErrorAction Stop
          } finally { $token=$null }
          if([string]$native.authority -cne 'plane' -or [string]$native.generation -cne '6' -or [bool]$native.heartbeat_stale){throw 'R435_AUTHORITY_OR_HEARTBEAT_DRIFT'}
          $queue=@($native.queue)
          $failed=@($queue | Where-Object { [string]$_.state -ceq 'FAILED' })
          $queued=@($queue | Where-Object { [string]$_.state -ceq 'QUEUED' })
          $running=@($queue | Where-Object { [string]$_.state -in @('RUNNING','RETRY_WAIT','FINALIZING') })
          Write-Output ('R435_FAILED_QUEUE_COUNT='+$failed.Count)
          Write-Output ('R435_QUEUED_SOURCE_COUNT='+@($queued | Where-Object { [string]$_.mode -ceq 'source' -and [string]$_.authorization -ceq 'operator' }).Count)
          Write-Output ('R435_ACTIVE_QUEUE_COUNT='+$running.Count)
          foreach($item in $failed) {
            if([string]$item.id -notmatch '^[A-Za-z0-9._-]{1,120}$'){throw 'R435_FAILED_ID_FORMAT_UNEXPECTED'}
            Write-Output ('R435_FAILED_ID='+[string]$item.id)
            if([string]$item.reason -match '^[A-Za-z0-9_ -]{1,160}$'){
              Write-Output ('R435_FAILED_REASON='+[string]$item.reason)
            } else {
              Write-Output 'R435_FAILED_REASON=NONCANONICAL_REDACTED'
            }
            Write-Output ('R435_FAILED_HAS_RECEIPT='+(-not [string]::IsNullOrWhiteSpace([string]$item.receipt)))
          }
          Write-Output ('R435_BLOCKER_COUNT='+@($native.blockers).Count)
          Write-Output ('R435_CONTROLLER_STATUS_PREFIX='+$(if([string]$native.controller_status -match '^([A-Z_]+)'){$matches[1]}else{'OTHER'}))
          Write-Output 'R435_NO_RETRY_OR_WORK_ORDER_SUBMISSION=TRUE'
          Write-Output 'R435_READ_ONLY_NATIVE_GET=TRUE'
      - name: R436 reconcile release pointer vs original running process in read-only custody
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE'){throw 'R436_WRONG_OWNER_RUNNER'}
          $store='C:\ProgramData\CKBR\release-store\ckb-plane'
          $active=Join-Path $store 'state\active-release'
          $expectedPointer='PLANE-THROUGHPUT-R1P'
          $ptr=([IO.File]::ReadAllText($active)).Trim()
          if($ptr -cne $expectedPointer){throw 'R436_ACTIVE_POINTER_DRIFT'}
          $r220='C:\ProgramData\CKBR\release-store\ckb-plane\releases\PLANE-R220-LIVECOMPAT-20261023\bin\ckb-plane.exe'
          $r220hash='82865fa3d153fd3e1267b49caf7be484c9965963cc1681652285912edc963678'
          if((Get-FileHash -LiteralPath $r220 -Algorithm SHA256).Hash.ToLowerInvariant() -cne $r220hash){throw 'R436_R220_EXE_DRIFT'}
          $r1p=Join-Path $store 'releases\PLANE-THROUGHPUT-R1P'
          $r1pExe=Join-Path $r1p 'bin\ckb-plane.exe'
          if(!(Test-Path -LiteralPath $r1pExe -PathType Leaf)){throw 'R436_ACTIVE_POINTER_BINARY_MISSING'}
          $r1pHash=(Get-FileHash -LiteralPath $r1pExe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ('R436_POINTER_RELEASE='+$ptr)
          Write-Output ('R436_POINTER_RELEASE_EXE_SHA256='+$r1pHash)
          Write-Output ('R436_RUNNING_RELEASE_EXE_SHA256='+$r220hash)
          Write-Output ('R436_POINTER_BINARY_DIFFERS_FROM_RUNNING='+($r1pHash -cne $r220hash))
          $task=@(Get-ScheduledTask -TaskName 'CKB-plane Controller' -ErrorAction Stop)
          if($task.Count -ne 1 -or [string]$task[0].State -cne 'Running'){throw 'R436_ORIGINAL_TASK_DRIFT'}
          $a=@($task[0].Actions)
          Write-Output ('R436_TASK_ACTION_COUNT='+$a.Count)
          foreach($action in $a) {
            $args=[string]$action.Arguments
            $cmdhash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($args))).ToLowerInvariant()
            Write-Output ('R436_TASK_COMMANDLINE_SHA256='+$cmdhash)
            Write-Output ('R436_TASK_ARGS_REFERS_R220='+($args.Contains('PLANE-R220-LIVECOMPAT-20261023')))
