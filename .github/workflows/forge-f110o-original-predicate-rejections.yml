name: FORGE F110-O source-native predicate rejections and graph custody
on:
  push:
    branches: [engineering/f110o-freebase-predicate-rejections-20261017-r1]
    paths:
      - 'noveltyeval/f110o_*'
      - 'noveltyeval/test_f110o_*'
      - 'docs/F110O-*'
      - '.github/workflows/forge-f110o-original-predicate-rejections.yml'
permissions:
  contents: read
jobs:
  original-training-rejection-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kelvin-jiang/FreebaseQA
          ref: d16aae5149aaa25e43ff2a7bd00a06f280ca19b9
          path: original-freebaseqa-train
          sparse-checkout: |
            README.md
            LICENSE
            FreebaseQA-train.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Authenticate exact source and untouched DEV and EVAL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C original-freebaseqa-train rev-parse HEAD)" = 'd16aae5149aaa25e43ff2a7bd00a06f280ca19b9'
          test "$(git -C original-freebaseqa-train rev-parse HEAD:FreebaseQA-train.json)" = '24dc4b13a9c4a0ad734732db094c124d086b7d67'
          test "$(git -C original-freebaseqa-train rev-parse HEAD:FreebaseQA-dev.json)" = '2e16ac381efb7b9e362cbf9bd0cee90006244ea8'
          test "$(git -C original-freebaseqa-train rev-parse HEAD:FreebaseQA-eval.json)" = 'd7d06ae721aedca26a0838d0113cddc1aa6774a8'
          test ! -e original-freebaseqa-train/FreebaseQA-dev.json
          test ! -e original-freebaseqa-train/FreebaseQA-eval.json
      - name: Original source-only morphology fixtures, QA answer mutation isolation
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s noveltyeval -p 'test_f110o_rejected_predicate_morphology.py' -v
      - name: Whole original TRAIN 37306 source predicates F109 preserved
        shell: bash
        run: |
          set -euo pipefail
          python -B noveltyeval/f110o_rejected_predicate_morphology.py --upstream original-freebaseqa-train --out f110o-rejection-morphology.json
          python - <<'PY'
          import json
          x=json.load(open('f110o-rejection-morphology.json',encoding='utf-8'))
          assert x['schema']=='forge.optimizer.f110o.original-train-predicate-rejection-morphology.v1'
          assert x['status']=='PUBLIC_FREEBASE_TRAIN_PREDICATE_REJECTION_MORPHOLOGY_ONLY'
          assert x['source_commit']=='d16aae5149aaa25e43ff2a7bd00a06f280ca19b9'
          assert x['train_git_blob']=='24dc4b13a9c4a0ad734732db094c124d086b7d67'
          assert x['train_bytes']==23888089
          c=x['cohort']
          assert c['original_train_rows']==c['unique_source_question_ids']==20358
          assert c['original_parse_instances']==37306
          assert c['f109_unchanged_status_counts']['accepted_one_opaque_predicate']==25498
          assert c['f109_unchanged_status_counts']['invalid_segment_syntax']==11807
          assert c['f109_unchanged_status_counts']['no_dotted_structure']==1
          assert c['exclusive_morphology_counts']['f109_accepted']==25498
          assert sum(c['exclusive_morphology_counts'].values())==37306
          assert sum(v for k,v in c['exclusive_morphology_counts'].items() if k!='f109_accepted')==11808
          assert set(c['exclusive_morphology_counts'])==set(c['distinct_source_predicate_cardinalities'])
          assert all(0<=c['distinct_source_predicate_cardinalities'][k]<=v for k,v in c['exclusive_morphology_counts'].items())
          for key in ('original_source_predicate_values_published',
                      'question_answer_values_published','source_answers_examined',
                      'f109_source_grammar_modified'):
            assert c[key] is False,key
          assert x['original_train_json_annotations_decoded'] is True
          for key in ('original_answer_values_interpreted',
                      'dev_eval_question_content_read','original_graph_archive_read',
                      'independent_scientific_firstuse','accepted_science',
                      'accepted_ref_mutation','dream_pareto_promotion',
                      'thetaevolve_accepted_training','science_dispatch'):
            assert x[key] is False,key
          assert x['freebase_original_graph_admission']=='FREEBASE_GRAPH_SOURCE_NOT_QUALIFIED'
          assert x['original_graph_queries']==x['role_predictions_made']==x['qa_answers_scored']==0
          assert x['model_calls']==x['codex_calls']==x['cloudflare_writes']==0
          print('F110O_FROZEN_ORIGINAL_TRAIN_REJECTIONS='+json.dumps(c['exclusive_morphology_counts'],sort_keys=True))
          print('F110O_NO_ACCEPTED_SCIENCE_NO_EVAL_NO_GRAPH_CALL')
          PY
          sha256sum f110o-rejection-morphology.json > f110o-rejection-morphology.sha256
          sha256sum -c f110o-rejection-morphology.sha256
      - name: Exact-head full FORGE Go tests vet build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo 'F110O_CODEX_CKB_CLOUDFLARE_AND_ACCEPTED_SCIENCE_ZERO'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-f110o-source-morphology-${{ matrix.os }}
          path: |
            f110o-rejection-morphology.json
            f110o-rejection-morphology.sha256
          retention-days: 45
          if-no-files-found: error
