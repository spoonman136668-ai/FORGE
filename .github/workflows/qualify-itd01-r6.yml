name: ITD-01 R6 fully fitted PUBLIC causal development study
on:
  push:
    branches: [research/itd01-r6-fitted-public-transfer-20261022]
permissions:
  contents: read
concurrency:
  group: itd01-r6-fitted-public-causal-20261022
  cancel-in-progress: false
jobs:
  r6-public-fitted-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 38
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 40
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prove exact R5 predecessor and R6 prereg FIRST
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ec2e2d88d06c7c8141949b9858c42c2d77849ff9 HEAD
          test "$(git rev-parse c317504a2d1fc2ea1427c6565da757611c17414c^)" = ec2e2d88d06c7c8141949b9858c42c2d77849ff9
          test "$(git show --format= --name-only c317504a2d1fc2ea1427c6565da757611c17414c)" = "research/itd01/R6_FROZEN_FITTED_PUBLIC_PROTOCOL.md"
          git diff --name-only ec2e2d88d06c7c8141949b9858c42c2d77849ff9 HEAD | python -B -c 'import sys; p=set(sys.stdin.read().splitlines()); a={"research/itd01/R6_FROZEN_FITTED_PUBLIC_PROTOCOL.md","research/itd01/run_r6_fitted_controls.py","research/itd01/test_r6_fitted_controls.py",".github/workflows/qualify-itd01-r6.yml"}; assert p==a,(p,a)'
          echo ITD01_R6_PREREG_BEFORE_CODE_AND_SOURCE=PASS
      - name: Focused R1 through R6 public-only control tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/itd01 -p 'test_*.py' -v
          python -B research/itd01/run_r6_fitted_controls.py --smoke > itd01_r6_smoke.json
          echo ITD01_R6_GENUINELY_TRAINED_PUBLIC_SMOKE=PASS
      - name: Run actual frozen three-seed public train validation DEV
        shell: bash
        run: |
          set -euo pipefail
          for seed in 17 31 47; do
            python -B research/itd01/run_r6_fitted_controls.py --seed "$seed" > "itd01_r6_$seed.json"
          done
          python -B -c 'import json; xs=[json.load(open("itd01_r6_%s.json"%s)) for s in (17,31,47)]; assert all(len(x["models"])==3 and sum(m["training_updates"]>0 for m in x["models"])>=2 and all(type(m["training_updates"]) is int and m["training_updates"]>=0 for m in x["models"]) for x in xs); assert all(not x["scientific_first_use"] and not x["protected_h1_h2_used"] and not x["native_wingless_yggdrasil_executed"] for x in xs); print("ITD01_R6_THREE_SEED_FITTED_PUBLIC_EVIDENCE=PASS")'
          sha256sum itd01_r6_*.json > itd01_r6_results.sha256
      - name: One final full FORGE regression vet and build
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s f139 -p 'test_*.py'
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo ITD01_R6_FINAL_FULL_REGRESSION=PASS
      - name: Only original PUBLIC research evidence created
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | python -B -c 'import sys; p=sys.stdin.read().splitlines(); a={"?? itd01_r6_smoke.json","?? itd01_r6_17.json","?? itd01_r6_31.json","?? itd01_r6_47.json","?? itd01_r6_results.sha256"}; assert set(p)<=a,p'
          echo ITD01_R6_R4_R5_HISTORICAL_NEGATIVES_PRESERVED=PASS
          echo ITD01_R6_SCIENTIFIC_FIRST_USE=FALSE
          echo ITD01_R6_NATIVE_WINGLESS_YGGDRASIL_TRANSFER=NOT_TESTED
      - name: Preserve real public training and all negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itd01-r6-public-trained-${{ matrix.os }}
          path: |
            itd01_r6_*.json
            itd01_r6_results.sha256
          if-no-files-found: ignore
