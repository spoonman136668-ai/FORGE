name: FORGE F139 V51 original Windows owner read-only recovery preflight
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  actions: read
concurrency:
  group: forge-f139-v51-readonly-original-owner
  cancel-in-progress: false
jobs:
  original-owner-v51-readonly:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'spoonman136668-ai' &&
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.event.issue.number == 807 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'F139-V51-READONLY ')
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 10
    steps:
      - name: Checkout exact protected main (no retained credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read original task and SQLite anchors without changing either
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          function Need([bool]$ok,[string]$code) {
            if(-not $ok){throw ('F139_V51_READONLY_'+$code)}
          }
          Need ($env:GITHUB_REPOSITORY -ceq 'spoonman136668-ai/FORGE' -and
            $env:GITHUB_ACTOR -ceq 'spoonman136668-ai' -and
            $env:GITHUB_EVENT_NAME -ceq 'issue_comment' -and
            $env:GITHUB_REF -ceq 'refs/heads/main' -and
            $env:RUNNER_NAME -ceq 'FORGE-CODEX-REMOTE' -and
            $env:GITHUB_RUN_ATTEMPT -ceq '1' -and
            -not $env:OPENAI_API_KEY) 'ORIGINAL_RUNNER_ONLY'
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
          $required='F139-V51-READONLY '+$env:GITHUB_SHA+' 43983922928'
          Need ($event.action -ceq 'created' -and
            $event.issue.number -eq 807 -and
            $null -eq $event.issue.PSObject.Properties['pull_request'] -and
            $event.issue.user.login -ceq 'spoonman136668-ai' -and
            $event.sender.login -ceq 'spoonman136668-ai' -and
            $event.comment.user.login -ceq 'spoonman136668-ai' -and
            $event.comment.author_association -ceq 'OWNER' -and
            [string]$event.comment.body -ceq $required -and
            [int64]$event.comment.id -gt 6933154054) 'FRESH_EXACT_OWNER_REQUEST'
          $head=(& git -C $env:GITHUB_WORKSPACE rev-parse HEAD | Out-String).Trim()
          $dirty=@(& git -C $env:GITHUB_WORKSPACE status --porcelain --untracked-files=all)
          Need ($head -ceq $env:GITHUB_SHA -and $dirty.Count -eq 0) 'CHECKOUT_DRIFT'
          $task=Get-ScheduledTask -TaskName 'FORGE-F139-UnifiedController' -ErrorAction Stop
          Need (@($task.Actions).Count -eq 1 -and @($task.Triggers).Count -eq 3) 'ORIGINAL_TASK_TOPOLOGY'
          $who=[Security.Principal.WindowsIdentity]::GetCurrent()
          $sid=''
          try {
            $sid=(New-Object Security.Principal.NTAccount([string]$task.Principal.UserId)).
              Translate([Security.Principal.SecurityIdentifier]).Value
          } catch {}
          Need (([string]$task.Principal.UserId -ieq $who.Name -or
                 $sid -ceq $who.User.Value)) 'ORIGINAL_OWNER_SID'
          function Field([string]$key) {
            $m=[regex]::Match([string]$task.Actions[0].Arguments,
              '(?i)(?:^|\s)-'+$key+'\s+"([^"]+)"')
            Need $m.Success ('MISSING_'+$key)
            return [string]$m.Groups[1].Value
          }
          $root=Field 'RepositoryRoot'
          $database=Field 'Database'
          $python=Field 'PythonExe'
          Need ((Test-Path -LiteralPath $database -PathType Leaf) -and
                (Test-Path -LiteralPath $python -PathType Leaf)) 'ORIGINAL_FILE_MISSING'
          $installed=(& git -C $root rev-parse HEAD | Out-String).Trim()
          $localDirty=@(& git -C $root status --porcelain --untracked-files=all)
          Need ($LASTEXITCODE -eq 0 -and $localDirty.Count -eq 0) 'ORIGINAL_ROOT_DRIFT'
          $code=@'
          import json,sqlite3,sys
          from pathlib import Path
          p=Path(sys.argv[1]).resolve()
          con=sqlite3.connect(p.as_uri()+"?mode=ro",uri=True,isolation_level=None,timeout=10)
          con.row_factory=sqlite3.Row
          con.execute("PRAGMA query_only=ON")
          assert con.execute("PRAGMA query_only").fetchone()[0]==1
          assert con.execute("PRAGMA quick_check").fetchone()[0]=="ok"
          m=dict(con.execute("SELECT source_sha,enabled,legacy_suspended,head_seq,head_hash FROM meta WHERE id=1").fetchone())
          e=[dict(x) for x in con.execute("SELECT seq,kind,sha,prior_sha FROM events WHERE seq IN (1836,1837) ORDER BY seq")]
          stages={str(x["stage"]):int(x["n"]) for x in con.execute("SELECT stage,COUNT(*) AS n FROM tasks GROUP BY stage")}
          assert m["head_seq"]>=1837 and len(e)==2 and e[0]["seq"]==1836 and e[1]["seq"]==1837
          assert e[0]["kind"]=="SOURCE_TRANSITION_ADMITTED" and e[1]["prior_sha"]==e[0]["sha"]
          # This read-only witness is reusable after genuine owner progress.
          # V51's original 153/56 task counts are historical lower bounds,
          # not the current full ledger: event1847 already has 154 verified.
          # Never interpret later terminal provider receipts as corruption.
          assert stages.get("VERIFIED",0)>=153 and stages.get("QUARANTINED",0)>=56
          assert set(stages)=={"VERIFIED","QUARANTINED"}
          assert m["enabled"]==1 and m["legacy_suspended"]==1
          print("F139_V51_LEDGER="+json.dumps({"meta":m,"events":e,"stages":stages},sort_keys=True,separators=(",",":")))
          con.close()
          '@
          $lines=@($code|& $python -B - $database)
          Need ($LASTEXITCODE -eq 0 -and $lines.Count -eq 1 -and
            [string]$lines[0] -clike 'F139_V51_LEDGER=*') 'LEDGER_ANCHOR_DRIFT'
          $info=Get-ScheduledTaskInfo -TaskName 'FORGE-F139-UnifiedController'
          $children=@(Get-CimInstance Win32_Process -Filter "Name='python.exe' OR Name='pythonw.exe'" |
            Where-Object {$_.CommandLine -and
              $_.CommandLine.Contains('f139.local_controller') -and
              $_.CommandLine.Contains($database)})
          $report=@{
            schema='forge.f139.v51.original-owner-readonly.v1'
            workflow_sha=$env:GITHUB_SHA
            installed_git_source_sha=$installed
            original_task_state=[string]$task.State
            original_task_enabled=[bool]$task.Settings.Enabled
            last_task_result=[int64]$info.LastTaskResult
            original_controller_process_count=$children.Count
            original_ledger=([string]$lines[0]).Substring('F139_V51_LEDGER='.Length)|ConvertFrom-Json
            source_mutations=0
            sqlite_mutations=0
            task_mutations=0
          }
          Write-Host ('F139_V51_READONLY_EVIDENCE='+($report|ConvertTo-Json -Depth 8 -Compress))
          Write-Host 'F139_V51_NO_OWNER_MUTATION=PASS'
