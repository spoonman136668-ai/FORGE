name: ITD-02 MG36A pinned exposed MG35 public action-consequence diagnostic
on:
  push:
    branches: [research/itd02-mg36a-exposed-interaction-diagnostic-20261029]
permissions:
  contents: read
  actions: read
jobs:
  frozen-source-only-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact LF source settings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout unchanged pinned MG35 parent plus MG36A diagnostic only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify source lineage and all original policy binaries remain untouched
        shell: pwsh
        run: |
          git merge-base --is-ancestor 9592f54d8dd6c17fbab99cf66ccde0490829d9c7 $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'MG36A_AUDIT_METRIC_FREEZE_NOT_BEFORE_EXECUTABLE' }
          $changed=@(git diff --name-only bd20f50c9a478623b6af5ad1afb149becb75faf9 $env:GITHUB_SHA)
          $expected=@('research/lcrm01/mg36a_original_interaction_audit_prereg.json',
            'research/lcrm01/mg36a_original_interaction_audit.py',
            '.github/workflows/itd02-mg36a-source-audit.yml')
          if (@(Compare-Object $changed $expected).Count -ne 0) { throw 'MG36A_UNAUTHORIZED_MODEL_OR_SOURCE_CHANGE' }
          python -B research/lcrm01/mg35_original_corrected_controls.py --preflight
          if ($LASTEXITCODE -ne 0) { throw 'MG36A_MG35_INHERITED_PREFLIGHT_FAIL' }
          python -B research/lcrm01/mg36a_original_interaction_audit.py --preflight
          if ($LASTEXITCODE -ne 0) { throw 'MG36A_DIAGNOSTIC_PREFLIGHT_FAIL' }
          if (git status --porcelain --untracked-files=all) { throw 'MG36A_SOURCE_NOT_CLEAN' }
          Write-Host MG36A_FROZEN_READONLY_AUDIT_CROSS_HOST_SOURCE_PREFLIGHT_PASS_NO_SCIENCE
  pinned-exposed-source-only-audit:
    needs: frozen-source-only-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact LF source settings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download exact immutable original MG35 evidence archive, no new world action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mg36a"
          curl --fail --silent --show-error --location --max-time 120 --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/spoonman136668-ai/FORGE/actions/artifacts/12930146616/zip" \
            --output "$RUNNER_TEMP/mg36a/mg35-immutable.zip"
          test "$(stat -c%s "$RUNNER_TEMP/mg36a/mg35-immutable.zip")" -lt 12000000
          printf '%s  %s\n' 610277db494c46dac67b857a86fe2226feaea186d5e173856614304bf2fd405e "$RUNNER_TEMP/mg36a/mg35-immutable.zip" | sha256sum --check --status
          echo MG36A_ORIGINAL_EXPOSED_ARCHIVE_BYTE_CUSTODY_PASS
      - name: Independently classify authentic before-action exposure and own-selected effects
        shell: bash
        run: |
          set -euo pipefail
          python -B research/lcrm01/mg36a_original_interaction_audit.py \
            --artifact "$RUNNER_TEMP/mg36a/mg35-immutable.zip" \
            --output "$RUNNER_TEMP/mg36a/report.json" \
            > "$RUNNER_TEMP/mg36a/diagnostic.log"
          grep -F 'MG36A_EXPOSED_ORIGINAL_APPROACH_INTERACTION_DIAGNOSTIC_PASS_NO_SCIENCE' "$RUNNER_TEMP/mg36a/diagnostic.log"
          grep -F 'MG36A_TWO_ORIGINAL_SOURCE_PROCESSES_EXACT_AUDIT_PASS' "$RUNNER_TEMP/mg36a/diagnostic.log"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo MG36A_EXPOSED_SOURCE_ONLY_AUDIT_COMPLETE_NO_FARAMA_ACTION_OR_SCIENTIFIC_FIRST_USE
      - name: Upload compact original-source validated diagnostic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mg36a-public-approach-interaction-audit
          path: |
            ${{ runner.temp }}/mg36a/report.json
            ${{ runner.temp }}/mg36a/diagnostic.log
          if-no-files-found: warn
          retention-days: 30
