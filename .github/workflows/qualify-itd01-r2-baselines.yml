name: ITD-01 R2 public trained baseline qualification
on:
  push:
    branches: [research/itd01-public-baselines-r2-20261022]
permissions:
  contents: read
concurrency:
  group: itd01-r2-public-trained-baselines-20261022
  cancel-in-progress: false
jobs:
  fitted-baselines-public:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 30
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify immutable R1 parent and strictly additive R2 paths
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cdc258634b0ce89720974396b5a75d937ea85c1c HEAD
          git diff --name-only cdc258634b0ce89720974396b5a75d937ea85c1c HEAD | python -B -c 'import sys; p=sys.stdin.read().splitlines(); allowed={"research/itd01/public_baselines.py","research/itd01/run_public_baselines.py","research/itd01/test_public_baselines.py",".github/workflows/qualify-itd01-r2-baselines.yml"}; assert set(p)==allowed, p'
          echo ITD01_R2_FROZEN_R1_PARENT_AND_FOUR_ADDITIONS=PASS
      - name: Focused R1 and R2 public-only adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/itd01 -p 'test_public*.py' -v
          python -B research/itd01/run_public_baselines.py --smoke > itd01_dev_smoke.json
          python -B -c 'import json; d=json.load(open("itd01_dev_smoke.json")); assert len(d["trained_agent_classes"])==3 and not d["scientific_first_use"]; print("ITD01_R2_ACTUAL_FITTED_SMOKE=PASS")'
          echo ITD01_R2_FOCUSED=PASS
      - name: Fit all three independent conventional controls on public DEV only
        shell: bash
        run: |
          set -euo pipefail
          for s in 17 31 47; do
            python -B research/itd01/run_public_baselines.py --seed "$s" > "itd01_dev_${s}.json"
          done
          python -B -c 'import json; xs=[json.load(open("itd01_dev_%s.json"%s)) for s in (17,31,47)]; assert all(len(x["trained_agent_classes"])==3 for x in xs); assert all(all(m["training_updates"]>0 for m in x["trained_agent_classes"]) for x in xs); assert all(not x["scientific_first_use"] and x["authority"]=="NONE_DEV_ONLY" for x in xs); print("ITD01_R2_THREE_SEED_PUBLIC_TRAIN_EVALUATION=PASS")'
          sha256sum itd01_dev_*.json > itd01_dev_results.sha256
      - name: Exactly one full existing FORGE regression vet and build
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s f139 -p 'test_*.py'
          go test ./...
          go vet ./...
          go build ./...
          echo ITD01_R2_FORGE_FULL_REGRESSION=PASS
      - name: Verify clean immutable source and science boundary
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | python -B -c 'import sys; rows=sys.stdin.read().splitlines(); allowed={"?? itd01_dev_smoke.json","?? itd01_dev_17.json","?? itd01_dev_31.json","?? itd01_dev_47.json","?? itd01_dev_results.sha256"}; invalid=[r for r in rows if r not in allowed]; assert not invalid, invalid'
          echo ITD01_R2_SOURCE_CLEAN=PASS
          echo ITD01_R2_PROTECTED_SOURCE_FIRST_USE=BLOCKED
          echo ITD01_R2_NATIVE_COGNITIVE_TRANSFER=NOT_TESTED
      - name: Save real measured public DEV receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itd01-r2-public-dev-${{ matrix.os }}
          path: |
            itd01_dev_*.json
            itd01_dev_results.sha256
          if-no-files-found: ignore
