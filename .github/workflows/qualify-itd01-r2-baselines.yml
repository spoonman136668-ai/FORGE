name: ITD-01 R3 public learned-state ablation qualification
on:
  push:
    branches: [research/itd01-r3-public-learning-ablation-20261022]
permissions:
  contents: read
concurrency:
  group: itd01-r3-public-learned-ablation-20261022
  cancel-in-progress: false
jobs:
  fitted-baselines-public:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 30
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify immutable R1 parent and strictly additive R2 paths
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1a225f06dd0b0cb8b118e134aab43b93c2839c98 HEAD
          git diff --name-only 1a225f06dd0b0cb8b118e134aab43b93c2839c98 HEAD | python -B -c 'import sys; p=sys.stdin.read().splitlines(); allowed={"research/itd01/run_public_ablations.py","research/itd01/test_public_ablations.py",".github/workflows/qualify-itd01-r2-baselines.yml"}; assert set(p)==allowed, p'
          echo ITD01_R3_R2_IMMUTABLE_PARENT_AND_THREE_BOUNDED_PATHS=PASS
      - name: Focused R1 R2 R3 public-only adversarial and ablation tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/itd01 -p 'test_public*.py' -v
          python -B research/itd01/run_public_ablations.py --smoke > itd01_r3_public_smoke.json
          python -B -c 'import json; d=json.load(open("itd01_r3_public_smoke.json")); assert len(d["agents"])==3 and not d["scientific_first_use"] and d["authority"]=="NONE_PUBLIC_DEV_ONLY"; print("ITD01_R3_PUBLIC_PAIRED_ABLATION_SMOKE=PASS")'
          echo ITD01_R3_FOCUSED=PASS
      - name: Perform actual paired public learned-vs-reset ablation on three seeds
        shell: bash
        run: |
          set -euo pipefail
          for s in 17 31 47; do
            python -B research/itd01/run_public_ablations.py --seed "$s" > "itd01_r3_public_${s}.json"
          done
          python -B -c 'import json; xs=[json.load(open("itd01_r3_public_%s.json"%s)) for s in (17,31,47)]; assert all(len(x["agents"])==3 and x["authority"]=="NONE_PUBLIC_DEV_ONLY" and x["scientific_first_use"] is False and x["independent_transfer_qualified"] is False for x in xs); assert all(all(m["training_updates"]>0 for m in x["agents"]) for x in xs); print("ITD01_R3_THREE_SEED_PUBLIC_TRAINED_VS_RESET_OUTCOMES_RETAINED=PASS")'
          sha256sum itd01_r3_public_*.json > itd01_r3_results.sha256
      - name: Exactly one full existing FORGE regression vet and build
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s f139 -p 'test_*.py'
          go test ./...
          go vet ./...
          go build ./...
          echo ITD01_R3_FORGE_FULL_REGRESSION=PASS
      - name: Verify clean immutable source and science boundary
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | python -B -c 'import sys; rows=sys.stdin.read().splitlines(); allowed={"?? itd01_r3_public_smoke.json","?? itd01_r3_public_17.json","?? itd01_r3_public_31.json","?? itd01_r3_public_47.json","?? itd01_r3_results.sha256"}; invalid=[r for r in rows if r not in allowed]; assert not invalid, invalid'
          echo ITD01_R3_SOURCE_CLEAN=PASS
          echo ITD01_R3_PROTECTED_SOURCE_FIRST_USE=BLOCKED
          echo ITD01_R3_TRANSFER_SCIENCE=NOT_TESTED
      - name: Retain actual public-development paired outcomes and negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itd01-r3-public-ablation-${{ matrix.os }}
          path: |
            itd01_r3_public_*.json
            itd01_r3_results.sha256
          if-no-files-found: ignore
