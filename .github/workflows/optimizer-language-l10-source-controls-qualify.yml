name: L10-B matched source and information custody qualification
on:
  push:
    branches: [research/optimizer-language-l10-semantic-fidelity-20261024]
    paths:
      - '.github/workflows/optimizer-language-l10-source-controls-qualify.yml'
permissions:
  contents: read
concurrency:
  group: l10b-source-information-custody-20261024
  cancel-in-progress: false
jobs:
  synthetic-only-source-and-comparators:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Verify L10 source/evaluator contract and adversarial development suites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '7b6b0dfcd131ebb6a439017ed9b1de8391969aef'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/optimizer-language-l10-source-controls-qualify.yml'
          p=research/optimizer_language_l10
          test "$(git rev-parse HEAD:$p/L10_SEMANTIC_FIDELITY_PROSPECTIVE_CONTRACT.json)" = '60ea8f15ee73059849873d04685f40fbc320ae9a'
          test "$(git rev-parse HEAD:$p/l10_semantic_dev_oracle.py)" = '61cfcabcfd3f5a5d6e28b510e81f889566bbb877'
          test "$(git rev-parse HEAD:$p/test_l10_semantic_dev_oracle.py)" = '70a7a4e440cb48a17e0c02b326f60c0f78bf583d'
          test "$(git rev-parse HEAD:$p/l10_dev_source_custody.py)" = '42dc48c286a1a8c21c3ceb947d49ff1121b26ecc'
          test "$(git rev-parse HEAD:$p/l10_dev_matched_controls.py)" = '10d6c12225d85bd6aaf49032c246c3df11196878'
          test "$(git rev-parse HEAD:$p/test_l10_dev_source_controls.py)" = '345022c2255fd41db3cfc72ff00eefd8584f5ff0'
          python -m py_compile "$p/l10_semantic_dev_oracle.py" "$p/test_l10_semantic_dev_oracle.py" "$p/l10_dev_source_custody.py" "$p/l10_dev_matched_controls.py" "$p/test_l10_dev_source_controls.py"
          (cd "$p" && python -m unittest -v test_l10_semantic_dev_oracle.py test_l10_dev_source_controls.py)
          echo L10_B_FROZEN_SOURCE_INFORMATION_COMPARATOR_ADVERSARIAL=PASS
      - name: Run bounded invented DEV sources only, preserve hashes and comparator numerical controls
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path.cwd()/"research/optimizer_language_l10"
          sys.path.insert(0,str(p))
          import l10_dev_source_custody as source
          import l10_dev_matched_controls as matched
          hashes={}
          for regime in source.EXPOSURES:
              rows=source.development_collection(regime)
              manifest=source.manifest_only(rows,regime)
              raw=source.canonical_bytes(manifest)
              digest=hashlib.sha256(raw).hexdigest()
              hashes[regime]=digest
              assert manifest["fixtures"]==24 and manifest["families"]==3
              assert manifest["prospective_examples_generated"]==0
              controls=matched.make_controls([f for f in rows if f.split=="DEV_FIT"],lambda observed:None)
              results=matched.benchmark_dev(rows,controls,regime)
              assert results["method_count"]==7 and results["prospective_source_examples_consumed"]==0
              assert results["scientific_go"] is False and results["l9_audit_reused"] is False
              assert all(r["evaluation_examples"]==12 for r in results["methods"])
              expected=1.0 if regime=="KNOWN_MAPPING" else 0.0
              assert results["methods"][0]["micro_exact_rate"]==expected
              assert results["methods"][1]["micro_exact_rate"]==expected
              assert results["methods"][6]["micro_exact_rate"]==0
              # Neither model source nor future seed nor any target string is persisted.
              print("L10_DEV_ONLY_"+regime+"_MANIFEST_SHA256="+digest)
              print("L10_DEV_ONLY_"+regime+"_CANONICAL_EXACT="+str(expected))
          receipt=dict(schema="forge.optimizer.language.l10.b-source-custody-check-v1",
                       status="SYNTHETIC_DEV_MATCHED_INFORMATION_ONLY",
                       exact_development_source_sha256=hashes,
                       methods=7,families=3,dev_fit=12,dev_check=12,
                       prospective_samples_generated=0,
                       l9_source_reused=False,official_test_consumed=False,
                       scientific_go=False)
          raw=source.canonical_bytes(receipt)
          dst=pathlib.Path(sys.argv[1])/"l10-b-dev-source-numeric-only.json"
          dst.write_bytes(raw)
          print("L10_B_EXACT_METADATA_RECEIPT_SHA256="+hashlib.sha256(raw).hexdigest())
          PY
          python -c 'import pathlib,shutil; [shutil.rmtree(x) for x in pathlib.Path("research/optimizer_language_l10").rglob("__pycache__")]'
          test -z "$(git status --porcelain)"
          echo L10_PROSPECTIVE_FAMILY_UNGENERATED=TRUE
          echo L10_SCIENTIFIC_GO=FALSE
      - name: Preserve source identity and regime-only receipt, no datasets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'l10b-dev-source-custody-${{ matrix.os }}'
          path: '${{ runner.temp }}/l10-b-dev-source-numeric-only.json'
          if-no-files-found: error
          retention-days: 30
