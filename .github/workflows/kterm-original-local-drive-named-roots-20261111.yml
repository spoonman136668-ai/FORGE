name: K Terminal original named local-drive folders readonly
on:
  push:
    branches: [qualification/kterm-original-runtime-readonly-20261111]
    paths: [.github/workflows/kterm-original-local-drive-named-roots-20261111.yml]
permissions:
  contents: read
concurrency:
  group: kterminal-pr88-full-window-ae11818c
  cancel-in-progress: false
jobs:
  named-local-root-readonly:
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 5
    steps:
      - name: Guard the existing owner and inspect only application-named local roots
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/kterm-original-runtime-readonly-20261111' -or
             $env:GITHUB_WORKFLOW -cne 'K Terminal original named local-drive folders readonly' -or
             $env:GITHUB_EVENT_NAME -cne 'push' -or
             $env:GITHUB_RUN_ATTEMPT -cne '1' -or
             $env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or
             $env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:COMPUTERNAME -cne 'LINKDEADKB') {throw 'KTERM_NAMED_ROOT_OWNER_IDENTITY_REFUSED'}
          $drives=@([IO.DriveInfo]::GetDrives() | Where-Object {
            $_.Name -match '^[C-H]:\\$' -and $_.IsReady -and
            ($_.DriveType -eq [IO.DriveType]::Fixed -or
             $_.DriveType -eq [IO.DriveType]::Removable)
          })
          if($drives.Count -gt 6){throw 'KTERM_NAMED_ROOT_DRIVE_COUNT_REFUSED'}
          # Only application-named folders and generic installation containers.
          # Never enter unrelated user profiles, hidden system roots, or links.
          $rootName='(?i)^(K.?Terminal(?:.*)?|KABOOM(?:.*)?|Kboom(?:.*)?|Alerts.?Fixed(?:.*)?|Apps|Programs|Program Files(?: \(x86\))?|Research|Tools)$'
          $childName='(?i)^(K.?Terminal(?:.*)?|KABOOM(?:.*)?|Kboom(?:.*)?|Alerts.?Fixed(?:.*)?|Personal|Business|Installation|Install|Package|Release)$'
          $seen=New-Object 'System.Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
          $queue=New-Object 'System.Collections.Generic.Queue[object]'
          $driveCount=0
          $visited=0
          $exeCount=0
          $configured=0
          $pending=0
          $hashes=0
          $sourceMarkers=0
          $cap=180
          function Add-Allowed([string]$candidate,[int]$depth) {
            if(-not [IO.Directory]::Exists($candidate)){return}
            $item=$null
            try{$item=Get-Item -LiteralPath $candidate -Force -ErrorAction Stop}catch{return}
            if(($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){return}
            $full=[IO.Path]::GetFullPath($candidate).TrimEnd('\')
            if($seen.Add($full)){$queue.Enqueue([pscustomobject]@{Path=$full;Depth=$depth})}
          }
          foreach($drive in $drives){
            $driveCount++
            $root=$drive.RootDirectory.FullName
            $children=@()
            try{$children=@(Get-ChildItem -LiteralPath $root -Directory -Force -ErrorAction Stop)}catch{continue}
            foreach($dir in $children){
              if($dir.Name -match $rootName -and
                ($dir.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0){
                Add-Allowed $dir.FullName 1
              }
            }
          }
          while($queue.Count -gt 0 -and $visited -lt $cap){
            $node=$queue.Dequeue()
            $visited++
            $root=$node.Path
            $launcher=Join-Path $root 'K-Terminal.exe'
            if([IO.File]::Exists($launcher)){
              $exe=Get-Item -LiteralPath $launcher -Force -ErrorAction Stop
              if(($exe.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0){
                $exeCount++
                $isConfigured=([IO.File]::Exists((Join-Path $root 'config.json')) -and
                  [IO.Directory]::Exists((Join-Path $root 'data')))
                if($isConfigured){
                  $configured++
                  if([IO.File]::Exists((Join-Path $root 'pending-program-update.json'))){$pending++}
                  if([IO.File]::Exists((Join-Path $root 'source-manifest.json')) -or
                     [IO.File]::Exists((Join-Path $root 'package-manifest.json'))){$sourceMarkers++}
                  try {
                    $sha=(Get-FileHash -LiteralPath $launcher -Algorithm SHA256 -ErrorAction Stop).Hash
                    if($sha -match '^[A-Fa-f0-9]{64}$'){$hashes++}
                  }catch{}
                }
              }
            }
            if($node.Depth -ge 3){continue}
            $children=@()
            try{$children=@(Get-ChildItem -LiteralPath $root -Directory -Force -ErrorAction Stop)}catch{continue}
            foreach($child in $children){
              if($child.Name -match $childName -and
                ($child.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0){
                Add-Allowed $child.FullName ($node.Depth+1)
              }
            }
          }
          $complete=($queue.Count -eq 0)
          Write-Host ('KTERM_NAMED_ROOT_READONLY=PASS;EXACT_OWNER=TRUE;LOCAL_DRIVES='+$driveCount+
            ';VISITED_NAMED_DIRS='+$visited+';CAP='+$cap+';SCAN_COMPLETE='+$complete+
            ';EXE_CANDIDATES='+$exeCount+';CONFIGURED_INSTALLATIONS='+$configured+
            ';PENDING_UPDATE_CONFIGURED='+$pending+';SOURCE_MARKERS='+$sourceMarkers+
            ';CONFIGURED_HASH_READABLE='+$hashes)
          if(-not $complete){Write-Host 'KTERM_NAMED_ROOT_RESULT=INCOMPLETE_CAP_NO_CLAIM'}
          elseif($configured -eq 1 -and $pending -eq 0){
            Write-Host 'KTERM_NAMED_ROOT_RESULT=ONE_CONFIGURED_CANDIDATE_UNQUALIFIED_NO_LAUNCH'
          }elseif($configured -eq 0){
            Write-Host 'KTERM_NAMED_ROOT_RESULT=NO_CONFIGURED_CANDIDATE_IN_NAMED_LOCAL_ROOTS'
          }else{
            Write-Host 'KTERM_NAMED_ROOT_RESULT=AMBIGUOUS_OR_PENDING_UPDATE_NO_LAUNCH'
          }
          Write-Host 'KTERM_NAMED_ROOT_SAFE=PASS;NO_CREDENTIAL_READ=TRUE;NO_CONFIG_CONTENT_READ=TRUE;NO_APP_LAUNCH=TRUE;NO_FILE_WRITE=TRUE;NO_BROKER_IO=TRUE;NO_SCHEDULE=TRUE'
