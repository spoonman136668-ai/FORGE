          EXPECTED="$(awk '{print $1}' docs/research/CPU-G84-GPT2-WINDOWS-SHAKESPEARE-ORIGINAL-RESULT-20261031.json.sha256)"
          test "$ACTUAL" = "$EXPECTED"
          python - <<'PY'
