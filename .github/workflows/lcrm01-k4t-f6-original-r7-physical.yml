name: Mass K4T-F6 original MiniGrid R7 physical frontier versus R5
on:
  push:
    branches: [research/itd02-k4t-f6-r7-physical-frontier-20261025]
permissions:
  contents: read
jobs:
  true-source-r7-physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 40
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Frozen pre-source original MiniGrid R7 and independent two-process evaluation
        run: bash research/lcrm01/k4t_f6_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k4t-f6-r7-physical-source-original-public-dev
          path: |
            ${{ runner.temp }}/k4tf6/process-a.json
            ${{ runner.temp }}/k4tf6/process-b.json
            ${{ runner.temp }}/k4tf6/comparison.json
            ${{ runner.temp }}/k4tf6/process-a.log
            ${{ runner.temp }}/k4tf6/process-b.log
          if-no-files-found: warn
          retention-days: 90
