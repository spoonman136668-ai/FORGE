name: FORGE independent CKB S14 first-use observation

# Read only: preserve CKB original execution authority and the active
# Wingless/Yggdrasil research workflows while FORGE is qualified.
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'ckbhistory/**'
      - 'cmd/forge-ckb-s14-history/**'
      - '.github/workflows/forge-ckb-s14-readonly-history.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: forge-ckb-s14-readonly-history
  cancel-in-progress: false

jobs:
  original-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Qualify original-history read-only and no-replay handling
        run: go test -count=1 ./ckbhistory ./cmd/forge-ckb-s14-history ./ckbreconcile ./ckbcustody
      - name: Inspect authentic public CKB S14 GitHub original history without mutations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forge-ckb-s14"
          go run ./cmd/forge-ckb-s14-history > "$RUNNER_TEMP/forge-ckb-s14/github-history.json"
          jq -e '
            .schema == "forge.ckb.s14-github-history.v1" and
            .repository == "spoonman136668-ai/ckb-plane" and
            .original_workflow == ".github/workflows/r216-s14-synthetic-execute.yml" and
            .first_use_replay_authorized == false and
            .scientific_execution_activated == false and
            (.original_attempt_count == (.original_run_ids | length)) and
            (.intent_artifact_count == (.intent_artifact_ids | length)) and
            (.evidence_sha256 | test("^[0-9a-f]{64}$"))
          ' "$RUNNER_TEMP/forge-ckb-s14/github-history.json" >/dev/null
          echo 'CKB_S14_GITHUB_READONLY_OBSERVATION=PASS'
          echo 'CKB_S14_PRIVATE_ORIGINAL_FIRST_USE=NOT_RECONCILED'
          echo 'ORIGINAL_REPLAY_AUTHORIZED=FALSE'
          echo 'FORGE_RESEARCH_CUTOVER_AUTHORIZED=FALSE'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-ckb-s14-github-readonly-history
          path: ${{ runner.temp }}/forge-ckb-s14/github-history.json
          if-no-files-found: error
          retention-days: 30
