name: AC22 FIT-only native local retention diagnostics
on:
  pull_request:
    paths:
      - 'research/ac07_sourcefree/ac22_*'
      - 'research/ac07_sourcefree/test_ac22_*'
      - 'docs/research/AC-22-*'
      - '.github/workflows/forge-ac22-fitonly-retention.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-fit-only:
    name: AC22 FIT-only gate diagnostics / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ac15_sha: 68508db981776033d403094f237c17dbbfbadf822ac9eca011feb05d50cba286
          - os: windows-latest
            ac15_sha: 071512caf92b82d8b3ed619d79d7741447be72bde29ae9b1b64fd42de2e39077
    steps:
      - name: Check out only immutable candidate branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Standard-library Python for bounded audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact previously authenticated public FIT source report
        uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 40797373953
          github-token: ${{ github.token }}
          name: forge-ac07-${{ matrix.os }}-sourcefree-restricted
          path: frozen-source
      - name: Verify original FIT SHA, never open or score source DEV
        shell: bash
        run: |
          set -euo pipefail
          python - "frozen-source/ac15-report.json" "${{ matrix.ac15_sha }}" <<'PY'
          import hashlib, pathlib, sys
          p=pathlib.Path(sys.argv[1]); expected=sys.argv[2]
          assert p.is_file()
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual==expected,(actual,expected)
          print("AC22_ORIGINAL_FIT_RECEIPT_SHA256="+actual)
          PY
      - name: Run FIT-only framework and public-locality unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/ac07_sourcefree -p 'test_ac22_*.py' -v
      - name: Execute source-authenticated FIXED eight-fold FIT-only contrast
        shell: bash
        run: |
          set -euo pipefail
          python -B research/ac07_sourcefree/ac22_fit_only_retention_diagnostics.py --ac15-report "$GITHUB_WORKSPACE/frozen-source/ac15-report.json" --sha256 "${{ matrix.ac15_sha }}" --out "$RUNNER_TEMP/ac22-fit-only.json"
          python - "$RUNNER_TEMP/ac22-fit-only.json" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);r=json.loads(p.read_text(encoding="utf-8"))
          assert r["schema"]=="forge.ac22.original-public-fit-only-retention-diagnostics.v1"
          assert r["original_source_commit"]=="c94e9a4cd3641588b6b8507e71ccee5c27032bdf"
          assert r["fit_examples_only"]==8 and r["leave_one_out_fit_folds"]==8
          assert r["train_examples_each_fold"]==7 and r["updates_each_model_each_fold"]==168
          assert r["previous_dev_episodes_read"]==0
          assert r["original_dtr_source_imports_or_episodes"]==0 and r["new_source_episodes"]==0
          assert r["fit_passes_each_fold"]==24
          assert set(r["fit_only_left_out_metrics"])=={
             "learned_local_gates","fixed_half_local_gates","fixed_near_unit_local_gates",
             "direct_full_history_logistic","matched_ten_coefficient_full_history_logistic"}
          assert all(v["n"]==8 and 0<=v["brier"]<=1 for v in r["fit_only_left_out_metrics"].values())
          assert r["model_parameter_counts"]["learned_local_gates"]==10
          assert r["model_parameter_counts"]["matched_ten_coefficient_full_history_logistic"]==10
          for key in ("native_ygg_source_modified","active_forge_queue_controller_modified",
                 "model_directed_actions_or_returns","cross_family_transfer_tested",
                 "scientific_first_use","scientific_admission"):
              assert r[key] is False,key
          assert r["candidate_eligibility_decision"]=="NO_GO_PREVIOUS_DEV_ALREADY_USED"
          print("AC22_FIT_ONLY_ORIGINAL_PUBLIC_DIAGNOSTIC=PASS")
          print("AC22_NO_NEW_SOURCE_OR_DEV_USE=PASS")
          print("AC22_REPORT_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Preserve per-platform signed candidate and control results
        uses: actions/upload-artifact@v4
        with:
          name: ac22-original-fit-only-${{ matrix.os }}
          path: ${{ runner.temp }}/ac22-fit-only.json
          retention-days: 30
          if-no-files-found: error
