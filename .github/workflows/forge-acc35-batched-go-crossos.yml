name: ACC35 independently pinned 36-portfolio batched native Go CPU acceptance
on:
  pull_request:
    paths:
      - 'docs/research/ACC-35-*'
      - '.github/workflows/forge-acc35-batched-go-crossos.yml'
permissions:
  contents: read
  actions: read
jobs:
  whole-native-go-cpu:
    name: ACC35 original 36 and real Go 32-session resource / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Read complete exact stacked acceleration research ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 100
          persist-credentials: false
      - name: Original source-free Python portfolio
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real native Go compiler and CPU runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Verify historical prereg versus later addenda and exact unchanged 36-source identities
        shell: bash
        run: |
          set -euo pipefail
          # Original first prereg is immutable historical evidence, NOT the later edited addendum.
          test "$(git rev-parse b9bb49eea09e830c02eea6214416f8681e1651b0:docs/research/ACC-34-REALIGN-36-AND-ACD1-GO-PREREG.md)" = d39eccb869aa996c902e6ddd9495ce305e630358
          test "$(git hash-object docs/research/ACC-34-REALIGN-36-AND-ACD1-GO-PREREG.md)" = 13f787023f7589acabc5e4381f1c1efc49353756
          test "$(git hash-object docs/research/ACC-34M-CROSSOS-CPU-METER-REPAIR-PREREG.md)" = 59b6f517e8917db2d4c9e85d77b8d20a96428427
          test "$(git hash-object research/acceleration/acc34_go_delta/go.mod)" = 973ad217354d16b49e791eed9c10450ed2801b66
          test "$(git hash-object research/acceleration/acc34_go_delta/main.go)" = 2293ae3fdcc043d9d621d58df671c15b733fe3fe
          test "$(git hash-object research/acceleration/acc34_go_delta/main_test.go)" = 7bf89508b4c425a96dd5d21c5318583f35dcc70c
          test "$(git hash-object research/acceleration/acc34_scoreboard.py)" = 9f85860fc63cbe091180001a04f9bbe6f441af0e
          test "$(git hash-object research/acceleration/test_acc34_scoreboard.py)" = 746b2e5d9baa1594259f1a7d6c1a3ea20977fa11
          git merge-base --is-ancestor b9bb49eea09e830c02eea6214416f8681e1651b0 HEAD
          echo ACC35_ORIGINAL_PREREG_AND_CANDIDATE_CODE_BLOBS_AUTHENTIC=PASS
      - name: Rerun original 36-proposal negative ledger and source-free Go falsification regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acc35"
          python -B -m unittest discover -s research/acceleration -p 'test_acc34_scoreboard.py' -v
          python -B research/acceleration/acc34_scoreboard.py --full "$RUNNER_TEMP/acc35/portfolio.json"
          python -B -m unittest discover -s research/ac05_sourcefree -p 'test_*.py' -v
          python -B -m unittest discover -s research/ac06_sourcefree -p 'test_*.py' -v
          python -B -m unittest discover -s research/ac07_sourcefree -p 'test_ac08_portfolio.py' -v
          (cd research/acceleration/acc34_go_delta && go test -count=1 -v ./... && go vet ./...)
          echo ACC35_ORIGINAL_36_REPRODUCED_NO_NATIVE_MODEL_PROMOTION=PASS
      - name: Build and run unchanged real Go 32-cold-session worker with measured process CPU
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/acc35/acc35-native"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          (cd research/acceleration/acc34_go_delta && go build -trimpath -o "$binary" .)
          "$binary" report 5 > "$RUNNER_TEMP/acc35/report.json"
          python - "$RUNNER_TEMP/acc35/portfolio.json" "$RUNNER_TEMP/acc35/report.json" <<'PY'
          import hashlib,json,math,pathlib,sys
          portfolio=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          raw=pathlib.Path(sys.argv[2]).read_bytes()
          r=json.loads(raw)
          assert portfolio["total_registered_candidates"]==36
          assert {x["claim_id"] for x in portfolio["rows"]}=={
              *(f"U{i:02d}" for i in range(1,31)),*(f"AC-D{i}" for i in range(1,7))}
          assert portfolio["stage2_qualified_native_model_speedups"]==0
          assert r["schema"]=="forge.acc34.acd1.real-go-kernel-resource.v1"
          assert r["candidate"]=="AC-D1" and r["original_source_episodes"]==0
          assert r["model_native_integration"] is False
          assert r["scientific_first_use"] is False
          assert r["guarded_output_exact"] is True and r["unsafe_hidden_interaction_detected"] is True
          assert r["trials_per_scenario_mode"]==5
          assert r["batched_cold_sessions_per_worker"]==32
          assert len(r["trials"])==40 and len(r["summaries"])==2
          assert {x["scenario"] for x in r["summaries"]}=={"benign","hidden"}
          assert all(t["worker"]["events"]==4096*32 for t in r["trials"])
          assert all(t["process_cpu_ns"]>0 and t["spawn_wall_ns"]>0
              and t["worker"]["go_runtime_sys_bytes"]>0
              and t["worker"]["total_go_allocated_bytes"]>0 for t in r["trials"])
          for t in r["trials"]:
              w=t["worker"]
              assert w["fit_intervention_probes"]==(24*32 if t["mode"] in ("verified","unverified") else 0)
              assert w["verification_full_node_calls"]==(4096*32*32 if t["mode"]=="verified" else 0)
          assert r["classification"] in (
              "ACC34_ACD1_NO_TOTAL_VERIFIED_NATIVE_GO_CPU_WIN",
              "ACC34_ACD1_BOUNDED_GO_KERNEL_CPU_POSITIVE_NO_SCIENCE")
          for s in r["summaries"]:
              assert s["verified_trace_matches_full"] is True
              assert s["oracle_trace_matches_full"] is True
              assert s["verified_corrections"]>0 if s["scenario"]=="hidden" else s["verified_corrections"]==0
              for k in ("verified_cpu_over_full","verified_runtime_sys_over_full",
                        "unsafe_cpu_over_full","oracle_cpu_over_full"):
                  assert math.isfinite(s[k]) and s[k]>0,(k,s[k])
              if r["classification"]=="ACC34_ACD1_BOUNDED_GO_KERNEL_CPU_POSITIVE_NO_SCIENCE":
                  assert s["verified_cpu_over_full"]<=0.90 and s["verified_runtime_sys_over_full"]<=1.10
          print("ACC35_EXACT_36_CANDIDATE_FROZEN_REGISTER=PASS")
          print("ACC35_REAL_GO_CHILD_PROCESS_CPU_AND_FIT=PASS")
          print("ACC35_OUTPUT_AND_HIDDEN_CONJUNCTION_NEGATIVES=PASS")
          print("ACC35_HOST_CLASSIFICATION="+r["classification"])
          print("ACC35_RESOURCE_RATIOS="+json.dumps(r["summaries"],sort_keys=True))
          print("ACC35_EVIDENCE_SHA256="+hashlib.sha256(raw).hexdigest())
          print("ACC35_ACTUAL_MODEL_ACCELERATION_OR_FIRST_USE=NOT_ESTABLISHED")
          PY
      - name: Archive raw real process CPU and complete 36 original proposal register
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: acc35-go-sourcefree-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/acc35/report.json
            ${{ runner.temp }}/acc35/portfolio.json
          retention-days: 30
          if-no-files-found: error

  both-host-scientific-scope-verdict:
    name: ACC35 validate exact two-host Go source-only evidence, no scientific admission
    needs: whole-native-go-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch both independently measured original source-only hosts
        uses: actions/download-artifact@v4
        with:
          pattern: acc35-go-sourcefree-*
          path: paired
      - name: Validate both actual OS outputs and retain negative outcome
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,math,hashlib
          got={}
          for osname in ("ubuntu-latest","windows-latest"):
              p=pathlib.Path("paired")/("acc35-go-sourcefree-"+osname)/"report.json"
              r=json.loads(p.read_text(encoding="utf-8"))
              assert r["go_os"]==("linux" if osname=="ubuntu-latest" else "windows")
              assert r["scientific_first_use"] is False
              assert r["model_native_integration"] is False
              assert r["guarded_output_exact"] is True
              assert r["unsafe_hidden_interaction_detected"] is True
              assert len(r["summaries"])==2 and len(r["trials"])==40
              got[osname]=r
          positive=all(s["verified_cpu_over_full"]<=0.90 and
                       s["verified_runtime_sys_over_full"]<=1.10
                       for r in got.values() for s in r["summaries"])
          if positive:
              assert all(r["classification"]=="ACC34_ACD1_BOUNDED_GO_KERNEL_CPU_POSITIVE_NO_SCIENCE" for r in got.values())
              outcome="ACC35_ACD1_BOTH_HOST_SOURCE_FREE_GO_CPU_POSITIVE_NO_SCIENCE"
          else:
              outcome="ACC35_ACD1_NO_TOTAL_VERIFIED_GO_CPU_WIN__NO_SCIENCE"
          print("ACC35_BOTH_ORIGINAL_WINDOWS_AND_LINUX_NATIVE_CPU_RECEIPTS=PASS")
          print("ACC35_BOTH_HOST_ENGINEERING_CLASSIFICATION="+outcome)
          for osname,r in got.items():
              print("ACC35_"+osname.upper().replace("-","_")+"_METRICS="+json.dumps(r["summaries"],sort_keys=True))
          print("ACC35_NATIVE_WINGLESS_YGGDRASIL_MODEL_INFERENCE_ACCELERATION=NOT_TESTED")
          print("ACC35_SCIENTIFIC_FIRST_USE=FALSE")
          PY
