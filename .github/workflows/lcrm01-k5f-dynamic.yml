name: Mass K5F original MiniGrid dynamic obstacle safety
on:
  push:
    branches: [research/mass-lcrm01-k5f-dynamic-obstacle-survival-20261024]
permissions:
  contents: read
jobs:
  source-owned-physical-nonstationary-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticated original dynamic source, frozen native R3 and genuine physical trajectories
        run: bash research/lcrm01/k5f_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-k5f-original-nonstationary-source-evidence
          path: |
            ${{ runner.temp }}/k5f/process-a.json
            ${{ runner.temp }}/k5f/process-b.json
            ${{ runner.temp }}/k5f/comparison.json
            ${{ runner.temp }}/k5f/process-a.log
            ${{ runner.temp }}/k5f/process-b.log
          if-no-files-found: warn
          retention-days: 90
