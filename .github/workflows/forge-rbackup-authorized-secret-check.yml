name: FORGE rbackup private repository access qualification
on:
  push:
    branches:
      - research/forge-rbackup-authorized-secret-check-20261016-r1
permissions:
  contents: read
jobs:
  read-only-auth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check private repository access without transferring data
        env:
          GH_TOKEN: ${{ secrets.RBACKUP_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$GH_TOKEN" || { echo "RBACKUP_SECRET=MISSING"; exit 1; }
          if gh api repos/spoonman136668-ai/rbackup --jq '.private and (.full_name == "spoonman136668-ai/rbackup") and .permissions.push' | grep -qx true; then
            echo 'RBACKUP_PRIVATE_WRITE_ACCESS=VERIFIED_FROM_METADATA'
          else
            echo 'RBACKUP_PRIVATE_WRITE_ACCESS=NOT_VERIFIED'
            exit 1
          fi
          echo 'BACKUP_EXPORT=NOT_ATTEMPTED'
          echo 'BACKUP_TRANSFER=NOT_ATTEMPTED'
