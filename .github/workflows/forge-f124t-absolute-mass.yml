name: F124-T newly frozen absolute causal mass source development
on:
  push:
    branches: [research/f124t-absolute-causal-mass-20261017]
    paths:
      - 'reference/research-intake/f124t-absolute-mass-freeze.json'
      - 'nativeevidence/f124t_*.py'
      - 'nativeevidence/test_f124t_*.py'
      - '.github/workflows/forge-f124t-absolute-mass.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: f124t-frozen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-and-surrogate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: New frozen source and FIT-only nondegenerate absolute training target
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if ($IsWindows) { 'python' } else { 'python3' }
          if ((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'F124T_EXACT_HEAD_DRIFT' }
          foreach ($pattern in @('test_f124t_*.py','test_f124s_*.py','test_f124qg_*.py')) {
            & $py -B -m unittest discover -s nativeevidence -p $pattern -v
            if ($LASTEXITCODE -ne 0) { throw "F124T_FOCUSED_FAILURE_$pattern" }
          }
          & $py -B isolationguard/check.py
          if ($LASTEXITCODE -ne 0) { throw 'F124T_CROSS_PROJECT_ISOLATION' }
          Write-Output 'F124T_NO_PROTECTED_SOURCE=true'
  new-authentic-fit-and-dev:
    needs: source-and-surrogate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check immutable parent original weight and retained gradient-negative custody
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($p in @(
            @{id='39078269441';head='5b52da1e38d5ff5671c582676790daf0462dd18d';conclusion='success';artifact='12116979526';digest='sha256:fefa2135a029660f36970a66b08809aaa128c5f6d2b3c5705ef8a29a9b4f014c'},
            @{id='39080811300';head='df8ca4cd696734c5e520a7595e749ac6c19ced22';conclusion='success';artifact='12119255200';digest='sha256:a4461360d33251932e4ab933371bc5efded02cff99cb1dcf31cb20b33ebf832c'}
          )) {
            $run=(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($p.id)" | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne $p.head -or
                $run.conclusion -cne $p.conclusion -or $run.event -cne 'push') {
              throw 'F124T_PARENT_RUN_IDENTITY_FAILURE'
            }
            $list=(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($p.id)/artifacts" | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0) { throw 'F124T_PARENT_ARTIFACT_INDEX_FAILURE' }
            $rows=@($list.artifacts | Where-Object { "$($_.id)" -ceq $p.artifact })
            if ($rows.Count -ne 1 -or $rows[0].digest -cne $p.digest -or $rows[0].expired) {
              throw 'F124T_AUTHENTIC_PROVIDER_DIGEST_FAILURE'
            }
          }
          $failed=(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/39081990887" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or
              $failed.head_sha -cne 'ca0326d5b957647d7131dc1f043c2d9765d466e4' -or
              $failed.conclusion -cne 'failure') {
            throw 'F124T_FROZEN_PREVIOUS_NEGATIVE_MUST_BE_RETAINED'
          }
          Write-Output 'F124T_PREVIOUS_FAILURE_AND_ORIGINAL_RECEIPTS=AUTHENTIC'
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39078269441
          github-token: ${{ github.token }}
          name: f124o-both-native-learned-development-5b52da1e38d5ff5671c582676790daf0462dd18d
          path: authentic-o
      - uses: actions/download-artifact@v4
        with:
          repository: spoonman136668-ai/FORGE
          run-id: 39080811300
          github-token: ${{ github.token }}
          name: f124qg-source-qualified-fit-diagnostic-df8ca4cd696734c5e520a7595e749ac6c19ced22
          path: authentic-qg
      - name: Train untouched original inference with new absolute FIT loss before DEV
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $a='authentic-o/f124o-independent-two-learned-development.json'
          $b='authentic-qg/f124qg-fit-only-spsa-loss-sensitivity.json'
          if ((Get-FileHash -LiteralPath $a -Algorithm SHA256).Hash.ToLowerInvariant() -cne
              '025c97abc8eb69079d7d7d0f59bfdb81235b9ad9ab83e230f32b542d2cfbdb5d') {
            throw 'F124T_ORIGINAL_MODEL_RECEIPT_DRIFT'
          }
          if ((Get-FileHash -LiteralPath $b -Algorithm SHA256).Hash.ToLowerInvariant() -cne
              '5496084491a8f78065891181a5676d348066578b83e46e77b2ca9bda7abae1c4') {
            throw 'F124T_ORIGINAL_NEGATIVE_DRIFT'
          }
          $target=Join-Path $env:RUNNER_TEMP 'f124t-fresh-absolute-development.json'
          & python3 -B nativeevidence/f124t_development_evidence.py --original-o-receipt $a --qg-negative-receipt $b --output $target
          if ($LASTEXITCODE -ne 0) { throw 'F124T_FIT_SURROGATE_NOT_GENUINE_OR_SOURCE_QUARANTINED' }
          $r=Get-Content -LiteralPath $target -Raw | ConvertFrom-Json
          if ($r.schema -cne 'forge.research.f124t.new-fresh-absolute-causal-mass-development.v1' -or
              $r.freeze_git_blob -cne '60b985282d581d51cb9b121333fb40f1024f2310' -or
              $r.lanes.Count -ne 2 -or -not $r.original_model_unchanged -or
              -not $r.known_f124s_negative_retained -or
              -not $r.new_DEV_scored_only_after_both_fit -or
              $r.protected_examples_generated -ne 0 -or $r.original_scientific_first_use -or
              $r.scientific_acceptances -ne 0 -or $r.optimizer_promotions -ne 0 -or
              $r.accepted_ref_mutations -ne 0 -or $r.paid_model_calls -ne 0 -or
              $r.codex_calls -ne 0 -or $r.resource_matched_superiority_proven -or
              $r.matched_compute_claim) { throw 'F124T_INADMISSIBLE_SCIENTIFIC_AUTHORITY' }
          foreach ($lane in $r.lanes) {
            if ($lane.FIT_training.fit_pairs -ne 48 -or
                $lane.FIT_training.steps -ne 72 -or
                $lane.FIT_training.nonzero_gradient_steps -le 0 -or
                $lane.FIT_training.update_l2 -le 0 -or
                $lane.FIT_training.DEV_generated_during_fit -or
                $lane.FIT_training.protected_read -or
                $lane.inference_capacity_increase) { throw 'F124T_FROZEN_UPDATE_OR_SOURCE' }
            foreach ($cohort in @($lane.FIT,$lane.DEV)) {
              if ($cohort.pairs -ne 48 -or $cohort.exact_symbolic_ceiling -ne 48 -or
                  $cohort.role_only_negative -ne 0 -or
                  @($cohort.arms.PSObject.Properties).Count -ne 4) {
                throw 'F124T_FULL_COHORT_CENSUS'
              }
              foreach ($row in $cohort.arms.PSObject.Properties) {
                $arm=$row.Value
                if ($arm.pairs -ne 48 -or $arm.case_sha256.Count -ne 48 -or
                    $arm.depth.'7'.pairs -ne 16 -or $arm.depth.'8'.pairs -ne 16 -or
                    $arm.depth.'9'.pairs -ne 16 -or $arm.max_retained -gt 9 -or
                    ($lane.lane -ceq 'Yggdrasil' -and $arm.max_active -gt 7)) {
                  throw 'F124T_ARM_MEMORY_OR_DENOMINATOR'
                }
              }
            }
            Write-Output "F124T_VERIFIED=$($lane.lane):new=$($lane.DEV.arms.new_F124S.paired)/48:original=$($lane.DEV.arms.original_F124O.paired)/48:fixed=$($lane.DEV.arms.fixed_12of16.paired)/48"
          }
          $digest=(Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($target+'.sha256'),$digest+'  f124t-fresh-absolute-development.json'+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          Write-Output "F124T_DEVELOPMENT_RECEIPT_SHA256=$digest"
      - uses: actions/upload-artifact@v4
        with:
          name: f124t-source-verified-fresh-development-${{ github.sha }}
          path: |
            ${{ runner.temp }}/f124t-fresh-absolute-development.json
            ${{ runner.temp }}/f124t-fresh-absolute-development.json.sha256
          retention-days: 90
          if-no-files-found: error
  one-full-regression:
    needs: new-authentic-fit-and-dev
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1536MiB'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Single exact-head Go regression race vet build and isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B isolationguard/check.py
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
          echo "F124T_FULL_REGRESSION_HEAD=$GITHUB_SHA"
          echo "F124T_PROTECTED_FIRST_USE=false"
