name: ITD-02 MG24 genuine nine-arm original source development
on:
  push:
    branches: [research/itd02-mg24-real-original-dev-nine-arm-20261029]
permissions:
  contents: read
  actions: read
jobs:
  original-9-arm-sequential-source-development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Exact source LF
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Original prospective frozen science-independent source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify independent 15-historical-seed-gate PASS before any source world reset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 46d32c4c4b9c0093367719f91aa1785b9f423034 "$GITHUB_SHA"
          git merge-base --is-ancestor 3b822b0200ed107fa70225adf3396d6d9d9d07bf "$GITHUB_SHA"
          git merge-base --is-ancestor cce4dcf4efa5183adffe78005fb4214250101090 "$GITHUB_SHA"
          previous="$(gh run view 40873573188 --repo spoonman136668-ai/FORGE --json conclusion --jq .conclusion)"
          test "$previous" = success
          test "$(git hash-object research/lcrm01/mg24_wingless_mg23_source_bridge.go)" = d31c749a1615c0547ed8bd972ac91248aa9ea856
          test "$(git hash-object research/lcrm01/mg24_original_selected_dev_actors.py)" = a4b4ca40537cc9bffee67279a0e49bc114f64cda
          test "$(git hash-object research/lcrm01/mg24_original_nine_arm_development.py)" = 15770b5e28979f6e5b6abbdecc467598c0735ee0
          diff -u <(printf '%s\n' .github/workflows/itd02-mg24-original-nine-arm-development.yml research/lcrm01/mg24_original_nine_arm_development.py research/lcrm01/mg24_original_selected_dev_actors.py research/lcrm01/mg24_wingless_mg23_source_bridge.go | sort) <(git diff --name-only cce4dcf4efa5183adffe78005fb4214250101090 "$GITHUB_SHA" | sort)
          python -B research/lcrm01/mg24_source_lineage_audit.py --output "$RUNNER_TEMP/mg24-source-custody.json"
          test -s "$RUNNER_TEMP/mg24-source-custody.json"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo MG24_SCOPED_ORIGINAL_SOURCE_DEV_PRE_RESET_LINEAGE_PASS
      - name: Original pinned Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original pinned native Go 1.25.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Fetch/authenticate all three original sources and compile unchanged native candidates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root=Join-Path $env:RUNNER_TEMP 'mg24-real-dev'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          function Fetch-Pin([string]$dest,[string]$remote,[string]$sha) {
            git init -q $dest
            if ($LASTEXITCODE -ne 0) { throw 'MG24_SOURCE_GIT_INIT' }
            git -C $dest remote add origin $remote
            if ($LASTEXITCODE -ne 0) { throw 'MG24_SOURCE_REMOTE' }
            git -C $dest fetch --no-tags --depth 1 origin $sha
            if ($LASTEXITCODE -ne 0) { throw 'MG24_SOURCE_FETCH' }
            git -C $dest checkout --detach -q $sha
            if ($LASTEXITCODE -ne 0) { throw 'MG24_SOURCE_CHECKOUT' }
            if ((git -C $dest rev-parse HEAD).Trim() -ne $sha) { throw 'MG24_SOURCE_IDENTITY' }
          }
          $src=Join-Path $root 'farama'
          $wing=Join-Path $root 'wing'
          $ygg=Join-Path $root 'ygg'
          Fetch-Pin $src 'https://github.com/Farama-Foundation/Minigrid.git' '7f5853792ea7f04f75614661006d87fcf949f26d'
          Fetch-Pin $wing 'https://github.com/spoonman136668-ai/Wingless.git' 'f4b29adfac260150e7ed83b37f69ee9f0371056f'
          Fetch-Pin $ygg 'https://github.com/spoonman136668-ai/Yggdrasil.git' 'a052b06b010ec9e61e4a46e0d57f544a76590c33'
          $pins=@{
            'minigrid/envs/doorkey.py'='df5b29ef063be34e6d83b8b478e092c6e3e01512'
          }
          foreach ($key in $pins.Keys) { if ((git -C $src hash-object $key).Trim() -ne $pins[$key]) { throw 'MG24_FARAMA_SOURCE_BLOB_CHANGED' } }
          if ((git -C $wing hash-object research/native/itd02/mg23/selected_target_credit.go).Trim() -ne '4f33193cf0e90a82f515e1ab6996a8e707709b18') { throw 'MG24_GO_MG23_SOURCE_DRIFT' }
          if ((git -C $ygg hash-object research/native/itd02/mg23/selected_target_cells.py).Trim() -ne '1b3f74f60d81145535c7e2d7dfeb71529f9d3d79') { throw 'MG24_YGG_MG23_SOURCE_DRIFT' }
          if ((git hash-object research/lcrm01/mg23_independent_public_credit.py).Trim() -ne '356c16d5dc1c259e34a6fca3bb75f6c9be786b0c') { throw 'MG24_CONVENTIONAL_FROZEN_CONTROL_DRIFT' }
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          if ($LASTEXITCODE -ne 0) { throw 'MG24_PYTHON_ORIGINAL_TOOLCHAIN' }
          python -m pip install 'numpy==1.26.4' 'gymnasium==1.1.1' 'pygame-ce==2.5.3' 'psutil==6.1.1'
          if ($LASTEXITCODE -ne 0) { throw 'MG24_SOURCE_WORLD_REQUIREMENTS' }
          python -m pip install --no-deps -e $src
          if ($LASTEXITCODE -ne 0) { throw 'MG24_FARAMA_PINNED_INSTALL' }
          Push-Location $wing
          try {
            go test -count=1 ./research/native/itd02/mg23/... ./research/native/itd02/mg19/... ./research/native/itd02/dk16/...
            if ($LASTEXITCODE -ne 0) { throw 'MG24_WINGLESS_MG23_MG19_REGRESSION' }
            $go23=Join-Path $root 'wingless-mg23'
            $go19=Join-Path $root 'wingless-mg19'
            if ($IsWindows) { $go23="$go23.exe"; $go19="$go19.exe" }
            go build -trimpath -o $go23 "$env:GITHUB_WORKSPACE/research/lcrm01/mg24_wingless_mg23_source_bridge.go"
            if ($LASTEXITCODE -ne 0) { throw 'MG24_WINGLESS_MG23_BRIDGE' }
            go build -trimpath -o $go19 "$env:GITHUB_WORKSPACE/research/lcrm01/mg20_wingless_original_source_bridge.go"
            if ($LASTEXITCODE -ne 0) { throw 'MG24_UNCHANGED_WINGLESS_MG19_BRIDGE' }
          } finally { Pop-Location }
          $env:PYTHONPATH="$ygg$([IO.Path]::PathSeparator)$(Join-Path $env:GITHUB_WORKSPACE 'research/lcrm01')"
          python -B -m unittest -q research.native.itd02.mg23.test_selected_target_cells research.native.itd02.mg19.test_genuine_mission_cells
          if ($LASTEXITCODE -ne 0) { throw 'MG24_YGG_MG23_MG19_REGRESSION' }
          python -B -m unittest -q test_mg23_independent_public_credit
          if ($LASTEXITCODE -ne 0) { throw 'MG24_CONVENTIONAL_ABLATION_REGRESSION' }
          Write-Host 'MG24_FOUR_FROZEN_NATIVE_CODE_AND_CONVENTIONAL_SOURCE_PINS_PASS'
      - name: Original-world 72 independent 9-arm episodes and two reproducible source processes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root=Join-Path $env:RUNNER_TEMP 'mg24-real-dev'
          $env:PYTHONPATH="$(Join-Path $root 'ygg')$([IO.Path]::PathSeparator)$(Join-Path $env:GITHUB_WORKSPACE 'research/lcrm01')"
          $go23=Join-Path $root 'wingless-mg23'
          $go19=Join-Path $root 'wingless-mg19'
          if ($IsWindows) { $go23="$go23.exe"; $go19="$go19.exe" }
          $program='research/lcrm01/mg24_original_nine_arm_development.py'
          $first=Join-Path $root 'first.json'
          $second=Join-Path $root 'second.json'
          python -B $program --source-root (Join-Path $root 'farama') --go-mg23 $go23 --go-mg19 $go19 --output $first *> (Join-Path $root 'first.log')
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $root 'first.log') -Tail 35; throw 'MG24_SOURCE_DEV_FIRST_RUN_BLOCKED' }
          Get-Content (Join-Path $root 'first.log') -Tail 3
          python -B $program --source-root (Join-Path $root 'farama') --go-mg23 $go23 --go-mg19 $go19 --output $second *> (Join-Path $root 'second.log')
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $root 'second.log') -Tail 35; throw 'MG24_SOURCE_DEV_SECOND_RUN_BLOCKED' }
          Get-Content (Join-Path $root 'second.log') -Tail 3
          python -B $program --compare $first $second
          if ($LASTEXITCODE -ne 0) { throw 'MG24_SOURCE_DEV_INDEPENDENT_PROCESS_MISMATCH' }
          if (git status --porcelain --untracked-files=all) { throw 'MG24_ORIGINAL_RESEARCH_SOURCE_DIRTY' }
          Write-Host 'MG24_REAL_FARAMA_NINE_ARM_DEV_RECORDED_NO_SCIENTIFIC_FIRST_USE'
      - name: Preserve complete original source-selected DEV and resource accounting
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mg24-original-selected-dev-nine-arm-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/mg24-source-custody.json
            ${{ runner.temp }}/mg24-real-dev/*.json
            ${{ runner.temp }}/mg24-real-dev/*.log
          retention-days: 30
          if-no-files-found: warn
