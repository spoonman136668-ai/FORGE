# H53B successor: requires its own exact SHA approval and immutable exact-ref rule.
# INACTIVE RELEASE TEMPLATE: deliberately outside .github/workflows.
# Release requires a separately owner-approved, immutable one-shot audit SHA.
# The release branch MUST be a direct child of original V26 and its diff MUST
# contain the exact seven-file pinned self-contained runtime allowlist.
# The release includes all five guard/runtime modules plus the pinned observer.
# Do not install/activate until a self-contained, audited runtime bundle exists.
name: F139 H53B original Windows read-only successor one-shot
on:
  push:
    branches:
      - audit/f139-v26-h53b-original-successor-ro-once-20261101
permissions: {}
concurrency:
  group: f139-h53b-original-owner-one-shot
  cancel-in-progress: false
jobs:
  witness:
    if: >-
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.actor == 'spoonman136668-ai' &&
      github.event_name == 'push' &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.ref == 'refs/heads/audit/f139-v26-h53b-original-successor-ro-once-20261101'
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check original Windows runner and exact initial one-shot identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_RUN_ATTEMPT -cne '1') {
            throw 'F139_H53_ORIGINAL_RUNNER_OR_ATTEMPT_DRIFT'
          }
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
              $env:GITHUB_REF -cne 'refs/heads/audit/f139-v26-h53b-original-successor-ro-once-20261101') {
            throw 'F139_H53_AUDIT_REF_OR_OWNER_DRIFT'
          }
          $parents = @(git rev-list --parents -n 1 HEAD) -split ' '
          if ($parents.Count -ne 2 -or
              $parents[0] -cne $env:GITHUB_SHA -or
              $parents[1] -cne '49c7b15343bea3c201fb52b498d8c0f397384afe') {
            throw 'F139_H53_NOT_DIRECT_ORIGINAL_V26_CHILD'
          }
          if ((git status --porcelain --untracked-files=all)) {
            throw 'F139_H53_AUDIT_CHECKOUT_DIRTY'
          }
      - name: Verify exact audit manifest and content pins
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $changed=@(git diff --name-only '49c7b15343bea3c201fb52b498d8c0f397384afe' HEAD)
          $allowed=@('.github/workflows/f139-h53b-original-owner-one-shot.yml', 'f139/h53_successor_readonly_observer.py', 'f139/h53_audit_guards.py', 'f139/h53_github_authority.py', 'f139/h53_windows_owner.py', 'f139/h53_native_readonly.py', 'f139/h53_original_owner_audit.py')
          if (@(Compare-Object ($changed | Sort-Object) ($allowed | Sort-Object)).Count -ne 0) {
            throw 'F139_H53_RELEASE_MANIFEST_DRIFT'
          }

      - name: Verify runtime bytes before importing audit modules
        shell: python
        run: |
          import hashlib, json, pathlib
          workflow = pathlib.Path('.github/workflows/f139-h53b-original-owner-one-shot.yml')
          prefix = '          # H53_RUNTIME_PINS '
          records = [line[len(prefix):] for line in workflow.read_text(encoding='utf-8').splitlines() if line.startswith(prefix)]
          if len(records) != 1:
              raise RuntimeError('F139_H53_RUNTIME_PIN_RECORD')
          pins = json.loads(records[0])
          if len(pins) != 6:
              raise RuntimeError('F139_H53_RUNTIME_PIN_COUNT')
          for name, expected in pins.items():
              if hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() != expected:
                  raise RuntimeError('F139_H53_RUNTIME_CONTENT_DRIFT')
          # H53_RUNTIME_PINS {"f139/h53_audit_guards.py":"9482e4dc6a63e61ef6c1ae53599e6ebdb28b7c495fab0a5d426f9802c8a3f25c","f139/h53_github_authority.py":"192531d7233153904c5d1ffdd9969c2ac61189f5aba9457d030502963a0f330a","f139/h53_native_readonly.py":"653a666d4bea6a760973420c31f43b4a0d56e524fee3b9c4863f67fba318489d","f139/h53_original_owner_audit.py":"8a237642814caac1d14fb836c3919e8c13f0ce7f0a71a6520ec7e70c11238260","f139/h53_successor_readonly_observer.py":"a3c743fd599d4c1b24914b668c9175c0f3b6f910053710cd4c2ac69381330b88","f139/h53_windows_owner.py":"b8fd36f5378210f929db228fad78d49e42b0f15cf521a8e60d151ac5d8925083"}
      - name: Execute approved read-only witness
        if: success()
        shell: pwsh
        run: |
          python -m f139.h53_original_owner_audit
# This is a complete NON-ACTIVATING template, not a released audit.
# The approved release must bundle its own read-only runtime: GitHub ruleset
# and issue #807 approval readback, SID/task/source and native SQLite verifier.
# Engineering modules cannot be imported from an audit branch that contains
# only the explicitly pinned seven-file manifest. No release may silently widen that diff.
