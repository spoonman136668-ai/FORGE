# INACTIVE RELEASE TEMPLATE: deliberately outside .github/workflows.
# Release requires a separately owner-approved, immutable one-shot audit SHA.
# The release branch MUST be a direct child of original V26 and its diff MUST
# contain the exact seven-file pinned self-contained runtime allowlist.
# The release includes all five guard/runtime modules plus the pinned observer.
# Do not install/activate until a self-contained, audited runtime bundle exists.
name: F139 H53 original Windows read-only successor one-shot
on:
  push:
    branches:
      - audit/f139-v26-h53-original-successor-ro-once-20261031
permissions: {}
concurrency:
  group: f139-h53-original-owner-one-shot
  cancel-in-progress: false
jobs:
  witness:
    if: >-
      github.repository == 'spoonman136668-ai/FORGE' &&
      github.actor == 'spoonman136668-ai' &&
      github.event_name == 'push' &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.ref == 'refs/heads/audit/f139-v26-h53-original-successor-ro-once-20261031'
    runs-on: [self-hosted, Windows, forge-codex-isolated]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check original Windows runner and exact initial one-shot identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -cne 'FORGE-CODEX-REMOTE' -or $env:GITHUB_RUN_ATTEMPT -cne '1') {
            throw 'F139_H53_ORIGINAL_RUNNER_OR_ATTEMPT_DRIFT'
          }
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/FORGE' -or
              $env:GITHUB_ACTOR -cne 'spoonman136668-ai' -or
              $env:GITHUB_REF -cne 'refs/heads/audit/f139-v26-h53-original-successor-ro-once-20261031') {
            throw 'F139_H53_AUDIT_REF_OR_OWNER_DRIFT'
          }
          $parents = @(git rev-list --parents -n 1 HEAD) -split ' '
          if ($parents.Count -ne 2 -or
              $parents[0] -cne $env:GITHUB_SHA -or
              $parents[1] -cne '49c7b15343bea3c201fb52b498d8c0f397384afe') {
            throw 'F139_H53_NOT_DIRECT_ORIGINAL_V26_CHILD'
          }
          if ((git status --porcelain --untracked-files=all)) {
            throw 'F139_H53_AUDIT_CHECKOUT_DIRTY'
          }
      - name: Verify exact audit manifest and content pins
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $changed=@(git diff --name-only '49c7b15343bea3c201fb52b498d8c0f397384afe' HEAD)
          $allowed=@('.github/workflows/f139-h53-original-owner-one-shot.yml', 'f139/h53_successor_readonly_observer.py', 'f139/h53_audit_guards.py', 'f139/h53_github_authority.py', 'f139/h53_windows_owner.py', 'f139/h53_native_readonly.py', 'f139/h53_original_owner_audit.py')
          if (@(Compare-Object ($changed | Sort-Object) ($allowed | Sort-Object)).Count -ne 0) {
            throw 'F139_H53_RELEASE_MANIFEST_DRIFT'
          }
          # SHA-256 content pins must be substituted with qualified immutable values
          # in the separately reviewed release; absent pins always fail closed.
          throw 'F139_H53_RELEASE_BLOCKED_IMMUTABLE_CONTENT_PINS_NOT_SET'
      - name: Execute approved read-only witness (unreachable until release qualified)
        if: success()
        shell: pwsh
        run: |
          python -m f139.h53_original_owner_audit
