            throw 'F139_H53_AUDIT_REF_OR_OWNER_DRIFT'
          }
          $parents = @(git rev-list --parents -n 1 HEAD) -split ' '
          if ($parents.Count -ne 2 -or
              $parents[0] -cne $env:GITHUB_SHA -or
              $parents[1] -cne '49c7b15343bea3c201fb52b498d8c0f397384afe') {
            throw 'F139_H53_NOT_DIRECT_ORIGINAL_V26_CHILD'
          }
